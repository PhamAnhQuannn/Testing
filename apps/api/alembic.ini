[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# The URL comes from the app settings (DATA_DIR); override with -x url=sqlite:///... for the CLI.

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
