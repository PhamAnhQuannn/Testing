[project]
name = "prep-app"
version = "0.0.0"
description = "Personal interview-prep learning app: content tooling (monorepo root)"
requires-python = ">=3.12"
dependencies = [
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tools/tests", "apps/api/tests"]
# tools/ and the shared harness are plain scripts, apps/api is not installed as a package.
pythonpath = ["tools", "apps/web/src/runner/pyodide", "apps/api"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web/node_modules", "source"]
src = ["tools", "apps/api", "apps/web/src/runner/pyodide"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
