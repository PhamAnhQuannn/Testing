id: eng.testing_quality.tdd_clean_code
version: 1
status: published
title_vi: "TDD, refactor và clean code: đỏ - xanh - dọn code"
est_minutes: 11
objectives_vi:
  - "Mô tả vòng **TDD** gồm **Red** (viết test fail trước), **Green** (code vừa đủ để qua) và **Refactor** (dọn code khi test vẫn xanh)."
  - "Giải thích vì sao viết test trước giúp định hướng thiết kế và bảo đảm code nào cũng có test."
  - "Hiểu **refactoring** là đổi cấu trúc mà **không đổi hành vi**, và chỉ an toàn khi có test bảo vệ."
  - "Nhận ra dấu hiệu **clean code**: tên rõ nghĩa, hàm nhỏ, một trách nhiệm, tránh lặp (**DRY**), hạn chế lồng sâu."
blocks:
  - id: s_tdd_cycle
    type: section
    title_vi: "Vòng TDD: Red - Green - Refactor"
    summary_vi: "TDD là viết test trước, rồi mới viết code. Mỗi vòng gồm Red (test fail), Green (code tối thiểu cho test qua), Refactor (dọn code khi test vẫn xanh)."
  - id: b01
    type: text
    md: |
      **TDD** (Test-Driven Development) là cách làm việc: **viết test trước, viết code sau**. Giống
      như đặt đề thi trước rồi mới ôn bài. Mỗi vòng lặp rất ngắn gồm ba bước:
      1. **Red**: viết một test mô tả hành vi mong muốn, chạy và thấy nó **fail** (vì code chưa có).
      2. **Green**: viết code **tối thiểu, vừa đủ** để test qua. Chưa cần đẹp.
      3. **Refactor**: khi test đang **xanh**, dọn dẹp code (đổi tên, tách hàm, bỏ lặp) rồi chạy lại
         test để chắc chắn vẫn xanh.

      Ví dụ làm hàm `add(a, b)`: viết test `assert add(2, 3) == 5` (Red, vì `add` chưa tồn tại),
      viết `def add(a, b): return a + b` (Green), rồi xem có gì cần dọn không (Refactor).
  - id: b02
    type: quiz_mcq
    graded: true
    prompt_md: "Trong TDD, thứ tự đúng của một vòng lặp là gì?"
    options:
      - {id: a, text_md: "Viết code, viết test, rồi sửa test cho khớp code"}
      - {id: b, text_md: "Viết test fail (Red), viết code tối thiểu cho qua (Green), rồi dọn code (Refactor)"}
      - {id: c, text_md: "Refactor trước, rồi viết test, rồi viết code"}
    answer: [b]
    explain_md: "TDD luôn bắt đầu bằng test fail (Red), sau đó mới viết code vừa đủ cho test qua (Green), cuối cùng dọn code khi test xanh (Refactor). (a) là viết test sau code; (c) sai thứ tự."
  - id: b03
    type: text
    md: |
      **Vì sao viết test trước?**
      - **Định hướng thiết kế**: viết test buộc bạn nghĩ xem hàm sẽ được **gọi thế nào** và trả về
        gì, nên giao diện (interface) thường gọn và dễ dùng hơn.
      - **Bảo đảm có test**: vì code chỉ viết để biến một test fail thành pass, nên **hạn chế** hành
        vi bị bỏ sót test — với điều kiện bạn viết test cho từng hành vi cần có.
      - **Tự tin khi sửa**: có sẵn lưới an toàn để chạy lại bất cứ lúc nào.

      Một lưu ý: phải **thấy test fail trước** (Red). Nếu test chưa từng fail, bạn không chắc test có
      thực sự kiểm tra được gì hay không.
  - id: b04
    type: quiz_fill
    graded: true
    prompt_md: "Điền một từ tiếng Anh: trong vòng TDD, bước viết một test fail trước khi có code gọi là ______ (màu đỏ)."
    blanks:
      - accept: ["red", "Red"]
    explain_md: "Bước đầu là **Red**: test fail vì chưa có code. Sau đó **Green** (code tối thiểu cho qua) và **Refactor** (dọn code khi test xanh)."
  - id: s_refactor_clean
    type: section
    title_vi: "Refactoring và clean code"
    summary_vi: "Refactoring đổi cấu trúc code mà không đổi hành vi; chỉ làm khi test xanh. Clean code: tên rõ, hàm nhỏ, một trách nhiệm, không lặp, ít lồng sâu."
  - id: b05
    type: text
    md: |
      **Refactoring** là **đổi cấu trúc bên trong** của code (đặt lại tên, tách hàm, bỏ lặp) mà
      **không đổi hành vi** nhìn từ bên ngoài. Nếu hành vi đổi thì đó không còn là refactor, mà là
      thay đổi tính năng hoặc sửa lỗi.

      Refactor chỉ **an toàn khi có test**: bạn sửa cấu trúc, chạy lại test, nếu vẫn xanh thì hành vi
      còn nguyên. Vì vậy quy tắc là **Green trước, rồi mới Refactor**, và mỗi bước nên nhỏ.

      Với code cũ chưa có test, có thể viết trước các **characterization test** (test ghi lại hành vi
      hiện tại) rồi mới dọn.
  - id: b06
    type: quiz_mcq
    graded: true
    prompt_md: "Thay đổi nào sau đây là một refactor đúng nghĩa?"
    options:
      - {id: a, text_md: "Đổi tên biến `x` thành `totalPrice` và tách một đoạn tính tiền ra hàm riêng, kết quả đầu ra không đổi"}
      - {id: b, text_md: "Sửa hàm để giảm giá 10% cho đơn trên 100 đô"}
      - {id: c, text_md: "Thêm tham số mới để hàm trả về thêm một trường dữ liệu"}
    answer: [a]
    explain_md: "Refactor đổi cấu trúc nhưng giữ nguyên hành vi. (b) và (c) làm đổi hành vi nên là thay đổi tính năng, không phải refactor."
  - id: b07
    type: text
    md: |
      **Clean code** là code dễ đọc, dễ sửa. Một số dấu hiệu:
      - **Tên rõ nghĩa**: `total_price` tốt hơn `tp` hay `x`.
      - **Hàm nhỏ**, làm **một việc** (**single responsibility**: một hàm/class chỉ có một lý do để
        thay đổi).
      - **Tránh lặp** (**DRY**: Don't Repeat Yourself): đoạn logic giống nhau nên gom về một chỗ.
      - **Hạn chế lồng sâu**: tránh nhiều tầng `if`/`for` lồng nhau; dùng early return để làm phẳng.

      Những dấu hiệu xấu gọi là **code smell** (ví dụ hàm quá dài, copy-paste, tên mơ hồ). Gặp smell
      thì có thể refactor, miễn là test đang xanh.
  - id: b08
    type: quiz_mcq
    graded: true
    prompt_md: "Dấu hiệu nào cho thấy code đang đi ngược nguyên tắc clean code?"
    options:
      - {id: a, text_md: "Một hàm 200 dòng làm năm việc khác nhau, với 4 tầng `if` lồng nhau"}
      - {id: b, text_md: "Hàm `calculate_tax` chỉ tính thuế và có tên mô tả đúng việc"}
      - {id: c, text_md: "Logic chung được gom vào một hàm và dùng lại ở nhiều nơi"}
    answer: [a]
    explain_md: "Hàm dài làm nhiều việc và lồng sâu vi phạm single responsibility và khó đọc. (b) là tên rõ + một trách nhiệm; (c) là DRY."
  - id: b09
    type: callout
    kind: interview
    md: |
      **Thanh điểm mức 3 (level-3 bar).** Bạn làm được một hàm nhỏ bằng TDD đủ ba bước
      **Red - Green - Refactor** (nêu test viết trước, code tối thiểu, rồi bước dọn) và giải thích
      vì sao **test giúp sửa code cũ an toàn**: đổi cấu trúc mà test vẫn xanh nghĩa là hành vi không đổi.
  - id: b10
    type: summary
    bullets_vi:
      - "**TDD**: viết test trước; vòng lặp **Red** (test fail) - **Green** (code tối thiểu cho qua) - **Refactor** (dọn khi test xanh)."
      - "Test-first giúp định hướng thiết kế và bảo đảm mọi hành vi đều có test."
      - "**Refactoring** đổi cấu trúc mà **không đổi hành vi**; chỉ an toàn khi có test, và phải **Green trước rồi mới Refactor**."
      - "**Clean code**: tên rõ nghĩa, hàm nhỏ, một trách nhiệm, tránh lặp (**DRY**), hạn chế lồng sâu."
