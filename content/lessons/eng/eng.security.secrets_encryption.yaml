id: eng.security.secrets_encryption
version: 1
status: published
title_vi: "Quản lý secret, mã hóa và chữ ký: secrets manager, rotation, at rest/in transit, HMAC, KMS"
est_minutes: 12
objectives_vi:
  - "Nêu cách xử lý **secret** an toàn: không hardcode hay commit, dùng **biến môi trường** hoặc **secrets manager/KMS**, giữ **least access** và **rotate** khi cần."
  - "Phân biệt **encryption at rest** với **in transit** (TLS) và chọn đúng khi nào dùng."
  - "Phân biệt **hashing** (một chiều) với **encryption** (đảo ngược được), **symmetric** với **asymmetric**."
  - "Giải thích **signing** (HMAC, chữ ký số) để bảo đảm **integrity** và **authenticity**, và vai trò của **KMS / envelope encryption**."
blocks:
  - id: s_secrets
    type: section
    title_vi: "Secret: không commit, cất đúng chỗ, xoay khóa"
    summary_vi: "Secret (password, API key, token, private key) không được hardcode hay commit vào Git. Đưa vào chương trình qua env var hoặc secrets manager, cấp quyền tối thiểu, và rotate định kỳ hoặc ngay khi lộ."
  - id: b01
    type: text
    md: |
      **Secret** là thứ cho phép truy cập hệ thống: mật khẩu database, **API key**, token, **private key**.
      Hình dung nó như chìa khóa nhà: không chụp ảnh đăng lên mạng.

      Quy tắc cơ bản:
      - **Không hardcode** secret trong code và **không commit** vào Git. Git lưu **toàn bộ lịch sử**,
        nên xóa ở commit sau vẫn còn trong các commit cũ; repo public hoặc bị clone là coi như lộ.
      - Đưa secret cho chương trình lúc chạy qua **biến môi trường** (environment variable) hoặc đọc từ một
        **secrets manager** (Vault, AWS Secrets Manager). (KMS quản lý **khóa mã hóa**, khác secrets
        manager vốn **lưu secret** — xem phần KMS bên dưới.) File `.env` thật phải nằm trong `.gitignore`.
      - Không nhét secret vào **Docker image** hay log.
      - **Least access**: mỗi dịch vụ chỉ được đọc đúng secret nó cần; có ghi nhận ai truy cập.
      - **Rotation** (xoay khóa): đổi secret định kỳ và đặt quy trình để đổi nhanh. Dùng **secret scanning**
        để phát hiện secret lỡ commit.
      - **Nếu secret đã lộ**: coi như đã bị dùng, phải **rotate (thu hồi và cấp mới) ngay**; chỉ xóa khỏi
        code là chưa đủ.
  - id: b02
    type: quiz_mcq
    graded: true
    prompt_md: "Bạn lỡ commit một **API key** vào repo. Việc **đầu tiên** đúng nhất là gì?"
    options:
      - {id: a, text_md: "Xóa dòng chứa key ở commit mới rồi push"}
      - {id: b, text_md: "Thu hồi và cấp key mới (rotate), rồi đưa key mới vào secrets manager hoặc env var"}
      - {id: c, text_md: "Đổi tên biến chứa key cho khó đoán"}
    answer: [b]
    explain_md: "Key đã nằm trong lịch sử Git nên phải coi là lộ: rotate để key cũ vô hiệu. Xóa ở commit mới (a) không xóa lịch sử; đổi tên biến (c) không có tác dụng."
  - id: b03
    type: quiz_fill
    graded: true
    prompt_md: "Điền một từ tiếng Anh: việc định kỳ đổi secret sang giá trị mới (và đổi ngay khi nghi ngờ bị lộ) gọi là ______ (xoay khóa)."
    blanks:
      - accept: ["rotation", "rotate", "key rotation", "secret rotation"]
    explain_md: "Đó là **rotation**. Có quy trình rotate sẵn thì khi lộ secret ta đổi nhanh, không phải xử lý cuống cuồng."
  - id: s_encryption
    type: section
    title_vi: "Mã hóa at rest / in transit, hashing và encryption"
    summary_vi: "In transit dùng TLS, at rest mã hóa disk/database/backup. Hashing một chiều (mật khẩu, kiểm tra toàn vẹn), encryption đảo ngược được (giữ bí mật). Symmetric một khóa, asymmetric cặp khóa."
  - id: b04
    type: text
    md: |
      Dữ liệu cần bảo vệ ở hai trạng thái:
      - **In transit** (đang truyền qua mạng): dùng **TLS** (HTTPS) để người nghe lén không đọc hay sửa được.
      - **At rest** (đang lưu): mã hóa **disk, database, backup** để mất ổ đĩa hay lộ file vẫn không đọc được nội dung.

      **Hashing và encryption khác nhau** (bài `cs.security_basics.crypto_fundamentals` đã dạy cơ bản, ở đây chỉ nhắc lại):
      - **Hashing** là **một chiều**: từ hash không suy ngược ra dữ liệu gốc. Dùng để lưu **mật khẩu**
        (với hàm hash chậm có salt như bcrypt/argon2) và kiểm tra **toàn vẹn**.
      - **Encryption** là **đảo ngược được** nếu có khóa: dùng để giữ **bí mật** dữ liệu mà sau này cần đọc lại.

      Hai kiểu mã hóa: **symmetric** (một khóa chung, nhanh, hợp với dữ liệu lớn) và **asymmetric** (cặp
      khóa public/private, hợp với trao đổi khóa và chữ ký). Thực tế hay kết hợp: asymmetric để thỏa thuận
      khóa, symmetric để mã hóa dữ liệu.
  - id: b05
    type: quiz_mcq
    graded: true
    prompt_md: "Để lưu **mật khẩu** người dùng trong database, cách nào đúng?"
    options:
      - {id: a, text_md: "Mã hóa bằng khóa symmetric để sau này giải mã ra mật khẩu gốc khi cần"}
      - {id: b, text_md: "Băm (hash) bằng hàm chậm có salt như bcrypt hoặc argon2, không cần giải ngược"}
      - {id: c, text_md: "Lưu nguyên văn nhưng đặt database trong mạng nội bộ"}
    answer: [b]
    explain_md: "Server chỉ cần kiểm tra mật khẩu đúng hay không nên dùng hash một chiều. Nếu database lộ, hash có salt khó suy ngược hơn nhiều so với mật khẩu mã hóa (có khóa là giải ra hết) hoặc lưu nguyên văn."
  - id: b06
    type: quiz_mcq
    graded: true
    prompt_md: "Dữ liệu đang đi từ trình duyệt đến server qua Internet cần được bảo vệ bằng cách nào?"
    options:
      - {id: a, text_md: "TLS (HTTPS), tức bảo vệ in transit"}
      - {id: b, text_md: "Chỉ cần mã hóa disk của server"}
      - {id: c, text_md: "Chỉ cần hash dữ liệu trước khi gửi"}
    answer: [a]
    explain_md: "Đường truyền được bảo vệ bằng TLS (in transit). Mã hóa disk (b) là at rest, bảo vệ lúc lưu chứ không bảo vệ đường truyền; hash (c) không giữ bí mật vì không dùng để giải lại."
  - id: s_signing
    type: section
    title_vi: "Chữ ký (signing) và KMS"
    summary_vi: "HMAC (khóa chung) hoặc chữ ký số (private key) bảo đảm integrity và authenticity. KMS giữ master key, data key được bọc bởi master key (envelope encryption)."
  - id: b07
    type: text
    md: |
      **Signing** (ký) bảo đảm hai điều: **integrity** (nội dung không bị sửa) và **authenticity** (đúng
      người/hệ thống có khóa gửi). Ký **không** giấu nội dung; nó chỉ chứng minh nội dung nguyên vẹn và đúng nguồn.
      - **HMAC**: tính từ nội dung **cộng một secret chung**. Hai bên cùng giữ secret, bên nhận tính lại và so
        sánh. Thường dùng để ký **webhook** và request. Nên so sánh bằng hàm so sánh hằng thời gian
        (constant-time compare).
      - **Chữ ký số** (digital signature): ký bằng **private key**, ai có **public key** đều kiểm tra được
        mà không cần biết bí mật. Hợp khi nhiều bên cần xác minh (ví dụ ký bản phát hành).

      **KMS** (Key Management Service) và **envelope encryption**: dữ liệu được mã hóa bằng một **data key**;
      data key này lại được **bọc (wrap)** bằng **master key** do KMS giữ và không bao giờ rời KMS. Lợi ích:
      master key được bảo vệ tập trung, có phân quyền và log truy cập; rotate master key không cần mã hóa
      lại toàn bộ dữ liệu, chỉ cần bọc lại data key.
  - id: b08
    type: quiz_mcq
    graded: true
    prompt_md: "Một dịch vụ nhận **webhook** và muốn chắc nội dung không bị sửa, đúng do đối tác gửi (hai bên chia sẻ một secret). Dùng gì?"
    options:
      - {id: a, text_md: "HMAC của nội dung tính bằng secret chung, rồi so sánh với chữ ký đi kèm"}
      - {id: b, text_md: "Chỉ mã hóa nội dung bằng symmetric (không kèm AEAD/MAC) rồi coi như đã xác thực"}
      - {id: c, text_md: "Hash nội dung bằng SHA-256 không có khóa và gửi kèm"}
    answer: [a]
    explain_md: "HMAC cần secret nên kẻ ngoài không giả mạo được, bảo đảm integrity và authenticity. Hash không khóa (c) ai cũng tính lại được sau khi sửa nội dung; chỉ mã hóa không kèm AEAD/MAC (b) không chứng minh được nguồn gửi."
  - id: b09
    type: quiz_fill
    graded: true
    prompt_md: "Điền một từ tiếng Anh: trong **envelope encryption**, data key được ______ (bọc) bằng master key do KMS giữ."
    blanks:
      - accept: ["wrap", "wrapped", "wrapping", "wrap key"]
    explain_md: "Data key được **wrap** (bọc/mã hóa) bằng master key trong KMS, nên khóa dữ liệu lưu cạnh dữ liệu mà vẫn an toàn."
  - id: b10
    type: callout
    kind: interview
    md: |
      **Thanh điểm mức 3 (level-3 bar).** Cho một hệ thống thật, bạn chọn được nơi cất secret phù hợp
      (env var, secrets manager, KMS; không bao giờ trong Git hay image), nêu được vì sao cần **rotation**
      và phải làm gì khi secret lộ; phân biệt **at rest / in transit**, **hashing / encryption**; giải thích
      cách kiểm tra chữ ký **HMAC** và ý tưởng **envelope encryption** ở mức cao.
  - id: b11
    type: summary
    bullets_vi:
      - "**Secret** không hardcode, không commit; dùng env var hoặc **secrets manager/KMS**, cấp **least access**."
      - "**Rotation** định kỳ; secret đã lộ thì **rotate ngay**, xóa khỏi code là chưa đủ vì Git giữ lịch sử."
      - "**In transit** bảo vệ bằng **TLS**; **at rest** mã hóa disk, database, backup."
      - "**Hashing** một chiều (mật khẩu, toàn vẹn); **encryption** đảo ngược được (bí mật); symmetric nhanh, asymmetric cho trao đổi khóa và chữ ký."
      - "**HMAC** hoặc chữ ký số cho **integrity + authenticity**; **KMS** giữ master key, data key được bọc (envelope encryption)."
