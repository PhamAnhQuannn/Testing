id: eng.frontend_basics.js_syntax
version: 1
status: published
title_vi: "Cú pháp JavaScript cơ bản: let/const, ===, hàm, mảng, DOM"
est_minutes: 11
objectives_vi:
  - "Biết cách **chạy JavaScript trong trình duyệt** (`<script src>`, `console.log`) và khai báo biến bằng **let / const** thay cho `var`."
  - "Nắm các **kiểu dữ liệu** cơ bản, `typeof`, và phân biệt **`===`** (không ép kiểu) với **`==`** (có ép kiểu)."
  - "Viết được **hàm** (`function` và **arrow function**), **mảng**, **object**, `if/else`, `for`, `for-of` và **template string**."
  - "Chọn phần tử bằng **DOM** (`document.querySelector`) và gắn sự kiện bằng `addEventListener`."
blocks:
  - id: s_js_basics
    type: section
    title_vi: "Chạy JS, biến và kiểu dữ liệu"
    summary_vi: "JS chạy trong trình duyệt qua thẻ script. Dùng let/const để khai báo biến; kiểu cơ bản gồm number, string, boolean, null, undefined, object."
  - id: b01
    type: text
    md: |
      **JavaScript (JS)** là ngôn ngữ chạy ngay trong trình duyệt để trang web phản ứng khi bấm, gõ.
      Nếu đã biết Python, bạn chủ yếu học **cách viết khác**: dấu ngoặc nhọn `{}`, dấu chấm phẩy `;`,
      và từ khóa khai báo biến.

      **Chạy JS**: gắn thẻ `<script src="app.js"></script>` (thường đặt **cuối thẻ body** để HTML tải xong
      trước), hoặc viết trực tiếp giữa `<script>...</script>`. Dùng `console.log(x)` để in ra khung
      **Console** của trình duyệt (nhấn F12) khi thử nghiệm.

      **Biến**: dùng **`let`** (gán lại được) và **`const`** (không gán lại được) thay cho `var` cũ.

      ```js
      let dem = 0;          // gán lại được
      dem = dem + 1;
      const ten = "An";     // KHÔNG gán lại được
      // ten = "Binh";      // lỗi: không gán lại const
      console.log(typeof dem, typeof ten);   // number string
      ```

      **Kiểu dữ liệu** cơ bản: **number**, **string**, **boolean**, **null** và **undefined** (đều chỉ
      "không có giá trị"; biến khai báo chưa gán là `undefined`), **object** (gồm mảng và object).
      `typeof x` cho biết kiểu của `x`.
  - id: b02
    type: quiz_mcq
    graded: true
    prompt_md: "Đoạn nào khai báo một biến **không được gán lại** trong JavaScript hiện đại?"
    options:
      - {id: a, text_md: "`let ten = \"An\";`"}
      - {id: b, text_md: "`const ten = \"An\";`"}
      - {id: c, text_md: "`typeof ten = \"An\";`"}
    answer: [b]
    explain_md: "`const` khai báo biến không gán lại được; `let` cho phép gán lại. `typeof` là toán tử đọc kiểu, không dùng để khai báo."
  - id: s_js_compare_func
    type: section
    title_vi: "So sánh, hàm, mảng và object"
    summary_vi: "Dùng === để so sánh chặt (không ép kiểu). Hàm viết bằng function hoặc arrow =>. Mảng [..] có push/length; object {key: value} đọc bằng .key."
  - id: b03
    type: text
    md: |
      **So sánh**: **`===`** so sánh cả giá trị lẫn kiểu và **không ép kiểu** (strict). **`==`** thì
      **ép kiểu** (loose) trước khi so sánh nên cho kết quả khó đoán. Ví dụ `5 == "5"` là `true`
      (vì chuỗi bị ép thành số) còn `5 === "5"` là `false`. Nên dùng `===` (và `!==`) làm mặc định.

      ```js
      console.log(5 == "5");    // true  (ép kiểu)
      console.log(5 === "5");   // false (khác kiểu)
      ```

      **Hàm**: có thể viết bằng `function` hoặc **arrow function** `=>`; dùng `return` để trả kết quả.

      ```js
      function cong(a, b) { return a + b; }
      const cong2 = (a, b) => a + b;     // arrow function, return ngầm
      ```

      **Mảng** (`[1, 2, 3]`) có `.push(x)` để thêm cuối và `.length` để lấy độ dài. **Object**
      (`{ten: "An", tuoi: 18}`) gồm cặp key-value, đọc bằng `obj.ten` (giống dict của Python).

      ```js
      const a = [1, 2, 3];
      a.push(4);
      console.log(a.length);          // 4
      const nguoi = { ten: "An", tuoi: 18 };
      console.log(nguoi.ten);         // An
      ```
  - id: b04
    type: quiz_mcq
    graded: true
    prompt_md: "Kết quả của `5 === \"5\"` và `5 == \"5\"` lần lượt là gì?"
    options:
      - {id: a, text_md: "`true` và `true`"}
      - {id: b, text_md: "`false` và `true`"}
      - {id: c, text_md: "`true` và `false`"}
    answer: [b]
    explain_md: "`===` không ép kiểu: số 5 khác chuỗi \"5\" nên `false`. `==` ép chuỗi thành số nên `true`. Vì vậy nên dùng `===`."
  - id: b05
    type: quiz_fill
    graded: true
    prompt_md: "Điền một từ: để thêm phần tử vào cuối mảng `a` trong JavaScript, dùng `a.______(4)`."
    blanks:
      - accept: ["push", "Push"]
    explain_md: "Đó là **`push`**: `a.push(4)` thêm 4 vào cuối mảng; `a.length` cho biết độ dài mới."
  - id: s_js_flow_dom
    type: section
    title_vi: "Điều kiện, vòng lặp, template string và DOM"
    summary_vi: "if/else, for, for-of điều khiển luồng; template string chèn biến bằng ${}. DOM cho phép chọn thẻ bằng querySelector và bắt sự kiện bằng addEventListener."
  - id: b06
    type: text
    md: |
      **Điều kiện và vòng lặp**: `if (x > 0) {...} else {...}`; `for (let i = 0; i < n; i++) {...}`;
      và **`for-of`** để duyệt từng phần tử của mảng.

      ```js
      const so = [3, 8, 1];
      let tong = 0;
      for (const x of so) {
        if (x > 2) { tong += x; }
      }
      console.log(tong);   // 11
      ```

      **Template string** dùng dấu backtick và `${...}` để chèn biến: `` `Xin chào ${ten}` ``.
      **Destructuring** lấy nhanh trường của object: `const {ten, tuoi} = nguoi;`.

      **DOM** (Document Object Model) là cây các thẻ HTML mà JS có thể đọc và đổi. Chọn thẻ bằng
      `document.querySelector("#nut")`, gắn sự kiện bằng `addEventListener`, đổi chữ bằng `textContent`.

      ```js
      const nut = document.querySelector("#nut");
      const so = document.querySelector("#so");
      let dem = 0;
      nut.addEventListener("click", () => {
        dem++;
        so.textContent = `Đã bấm ${dem} lần`;
      });
      ```
  - id: b07
    type: quiz_mcq
    graded: true
    prompt_md: "Muốn chạy một hàm mỗi khi người dùng bấm nút `#nut`, cách đúng trong JavaScript là gì?"
    options:
      - {id: a, text_md: "`document.querySelector(\"#nut\").addEventListener(\"click\", ham)`"}
      - {id: b, text_md: "`console.log(\"#nut\", \"click\", ham)`"}
      - {id: c, text_md: "`const nut = ham;` rồi chờ trình duyệt tự gọi"}
    answer: [a]
    explain_md: "Chọn thẻ bằng `querySelector` rồi gắn handler qua `addEventListener(\"click\", ...)`. `console.log` chỉ in ra Console, không gắn sự kiện."
  - id: b08
    type: callout
    kind: interview
    md: |
      **Thanh điểm mức 3 (level-3 bar).** Từ yêu cầu như "đếm số lần bấm nút" hoặc "viết lại hàm Python
      sang JS", bạn viết được đoạn JS chạy đúng: khai báo bằng **let/const**, dùng **`===`**, viết hàm
      (`function` hoặc **arrow function**), duyệt mảng bằng `for-of`, dùng **template string**, và
      gắn sự kiện qua `querySelector` + `addEventListener`. Bạn giải thích được vì sao `5 == "5"` là
      `true` còn `5 === "5"` là `false` (ép kiểu so với không ép kiểu).
  - id: b09
    type: summary
    bullets_vi:
      - "Chạy JS bằng `<script src=\"app.js\">` (thường cuối body); `console.log` để thử trong Console (F12)."
      - "Biến: **let** (gán lại được), **const** (không gán lại được) thay cho `var`; kiểu: number, string, boolean, null, undefined, object; `typeof`."
      - "**`===`** không ép kiểu (nên dùng); **`==`** ép kiểu nên `5 == \"5\"` là true còn `5 === \"5\"` là false."
      - "Hàm: `function` hoặc **arrow** `=>` với `return`; mảng `[..]` có `push`/`length`; object `{key: value}` đọc bằng `.key`."
      - "`if/else`, `for`, `for-of`, **template string** `${}`; DOM: `querySelector`, `addEventListener`, `textContent`."
