id: eng.workflow.first_project
version: 1
status: published
title_vi: "Làm dự án nhỏ đầu tiên: Git từ đầu đến cuối và câu chuyện phỏng vấn"
est_minutes: 11
objectives_vi:
  - "Chọn và **giới hạn phạm vi** (scoping) một dự án nhỏ nhưng hoàn chỉnh: mục tiêu rõ, đầu vào/đầu ra rõ, chia thành các mốc nhỏ chạy được."
  - "Dùng **Git end-to-end** cho dự án: `init` → commit nhỏ → nhánh (branch) → push lên GitHub → Pull Request (PR) → gộp (merge)."
  - "Nhận ra một **repo tốt**: README, cấu trúc thư mục, `.gitignore`, lịch sử commit sạch."
  - "Kể dự án thành **câu chuyện phỏng vấn** theo khung: vấn đề, cái bạn làm, quyết định và đánh đổi, kết quả."
blocks:
  - id: s_scope
    type: section
    title_vi: "Chọn phạm vi và chia thành mốc nhỏ"
    summary_vi: "Dự án đầu tiên nên làm xong trong 1-2 tuần, có đầu vào/đầu ra rõ và tóm được trong một câu; chia thành 5-8 việc nhỏ, mỗi việc chạy được rồi mới sang việc kế."
  - id: b01
    type: text
    md: |
      Dự án nhỏ đầu tiên là chỗ gom mọi thứ bạn đã học thành **một chương trình hoàn chỉnh mà người
      khác chạy được**. Cái bẫy phổ biến nhất của người mới là chọn ý tưởng quá to ("làm mạng xã
      hội") rồi bỏ dở giữa chừng. Dự án dở dang không kể được thành câu chuyện, còn dự án nhỏ mà
      xong thì có.

      Một ý tưởng tốt (good scope) thỏa ba điều:
      - **Làm xong trong 1-2 tuần**, bạn tự làm được một mình.
      - **Đầu vào và đầu ra rõ** (clear input / output): ví dụ app ghi chi tiêu chạy ở terminal, đọc
        một file CSV rồi in báo cáo.
      - **Tóm được trong một câu**: "Chương trình X giúp Y làm Z."
  - id: b02
    type: text
    md: |
      Sau khi chọn ý tưởng, **chia nhỏ việc** (milestones): viết danh sách 5-8 việc theo thứ tự, ví
      dụ đọc dữ liệu → lưu file → in báo cáo → xử lý dữ liệu sai. Quy tắc: **mỗi việc phải chạy được
      rồi mới sang việc kế**. Nhờ vậy lúc nào bạn cũng có một bản đang chạy, và mỗi việc xong là một
      **commit** tự nhiên.

      Cấu trúc thư mục tối thiểu của một repo gọn:
      - `README.md`: file đầu tiên người khác đọc.
      - Thư mục code (`src/` hoặc `main.py`).
      - File liệt kê thư viện (`requirements.txt` hoặc `pom.xml`).
      - `.gitignore`: loại file không nên đưa lên repo (môi trường ảo, file tạm, **mật khẩu/khóa bí mật**).
  - id: b03
    type: quiz_mcq
    graded: true
    prompt_md: "Bạn là intern và muốn làm dự án đầu tiên để bỏ vào CV. Ý tưởng nào có phạm vi (scope) hợp lý nhất?"
    options:
      - {id: a, text_md: "Một mạng xã hội đầy đủ có đăng nhập, nhắn tin, video và đề xuất bằng AI, làm trong 3 tháng."}
      - {id: b, text_md: "Một app ghi chi tiêu chạy ở terminal: đọc/ghi file, in báo cáo theo tháng; tóm được trong một câu và làm xong trong 1-2 tuần."}
      - {id: c, text_md: "Chưa chọn ý tưởng cụ thể; cứ viết code trước, đến lúc xong sẽ biết nó làm gì."}
    answer: [b]
    explain_md: "Dự án đầu tiên cần **nhỏ nhưng hoàn chỉnh**: đầu vào/đầu ra rõ, tóm được trong một câu, xong trong 1-2 tuần. (a) quá to nên rất dễ bỏ dở; (c) không có mục tiêu thì không chia được mốc và cũng không kể được thành câu chuyện."
  - id: s_git
    type: section
    title_vi: "Dùng Git end-to-end và một repo tốt"
    summary_vi: "init rồi commit nhỏ sau mỗi việc chạy được với lời nhắn rõ, thêm tính năng trên nhánh riêng và mở PR kể cả khi làm một mình, push lên GitHub; repo tốt có README (làm gì, cách chạy, ví dụ), cấu trúc gọn và lịch sử commit đọc được."
  - id: b04
    type: text
    md: |
      Dùng Git cho cả vòng đời dự án, không chỉ để "nộp bài":
      1. `git init` ngay từ đầu, thêm `.gitignore` trước commit đầu tiên.
      2. **Commit nhỏ, lời nhắn rõ**: sau mỗi việc chạy được, commit một lần, ví dụ
         `"Thêm đọc file chi tiêu"`. Tránh một commit khổng lồ tên `"update"` hay `"final"`.
      3. **Nhánh (branch) cho tính năng mới**: tách nhánh, commit, rồi `git push` nhánh lên **GitHub**
         (chỉ mở được PR sau khi nhánh đã có trên GitHub).
      4. Mở **Pull Request (PR)** để gộp vào `main`, kể cả khi bạn làm một mình. Đó là thói quen làm
         việc nhóm và cho người phỏng vấn thấy bạn biết quy trình.

      Không bao giờ commit mật khẩu hoặc khóa API (API key). Nếu lỡ commit, phải coi khóa đó là
      đã lộ và **đổi khóa ngay**: chỉ `.gitignore` không gỡ được file **đã theo dõi** — cần
      `git rm --cached <file>` để ngừng theo dõi, và khóa vẫn còn trong lịch sử nên xóa commit sau
      đó không đủ.
  - id: b05
    type: text
    md: |
      Một **repo tốt** (good repo) là repo mà người lạ clone về và chạy được chỉ bằng README:
      - **README** ghi: dự án làm gì (một câu), **lệnh cài và lệnh chạy cụ thể**, một ví dụ đầu vào
        và đầu ra mẫu. Kiểm tra bằng cách nhờ bạn bè chạy thử chỉ theo README, hoặc tự clone sang
        thư mục khác và chạy.
      - **Cấu trúc gọn**: code, test, tài liệu nằm đúng chỗ; không có file rác.
      - **Lịch sử commit đọc được**: nhìn `git log` là hiểu dự án đi qua những bước nào.
      - **Xử lý dữ liệu sai** (file rỗng, nhập chữ thay vì số): thử cả dữ liệu mẫu lẫn dữ liệu xấu
        trước khi demo.
  - id: b06
    type: quiz_mcq
    graded: true
    prompt_md: "Repo của bạn có đúng một commit tên `final` chứa toàn bộ code, không có README. Cách cải thiện nào giúp nhà tuyển dụng đánh giá repo tốt nhất?"
    options:
      - {id: a, text_md: "Thêm README (làm gì, cách chạy, ví dụ) và từ giờ làm các việc nhỏ thành commit riêng với lời nhắn rõ; tính năng mới làm trên nhánh rồi mở PR."}
      - {id: b, text_md: "Đổi tên commit thành `final_v2` cho nghe chuyên nghiệp hơn và đẩy lên GitHub."}
      - {id: c, text_md: "Xóa repo, tạo lại và commit toàn bộ code một lần nữa để lịch sử trông mới."}
    answer: [a]
    explain_md: "README giúp người lạ chạy được dự án, còn commit nhỏ và PR cho thấy cách bạn làm việc. (b) chỉ đổi tên, không thêm thông tin nào; (c) vẫn là một commit khổng lồ nên không cho thấy quá trình."
  - id: s_story
    type: section
    title_vi: "Biến dự án thành câu chuyện phỏng vấn"
    summary_vi: "Kể theo khung vấn đề → cái bạn làm → quyết định và đánh đổi → kết quả/bài học; nói rõ phần của mình, nêu ít nhất một quyết định có đánh đổi và nếu làm lại sẽ đổi gì."
  - id: b07
    type: text
    md: |
      Có dự án rồi, bước cuối là **kể được nó**. Một khung kể ngắn kiểu STAR (khoảng 2 phút):
      1. **Vấn đề** (situation): chương trình giải quyết việc gì, vì sao bạn chọn.
      2. **Bạn làm gì** (task / action): phần **của bạn**, cách làm theo từng mốc.
      3. **Quyết định và đánh đổi** (trade-off): ví dụ vì sao lưu bằng file thay vì database, cách
         khác sẽ ra sao. Đây là chỗ nhà tuyển dụng hay hỏi sâu.
      4. **Kết quả và bài học** (result): chạy được đến đâu, khó khăn gặp phải và cách xử lý, nếu
         làm lại sẽ đổi gì.

      Mẹo: ghi sẵn các quyết định ngay trong lúc làm (vào README hoặc lời nhắn commit/PR), vì một
      tháng sau rất khó nhớ vì sao mình làm vậy.
  - id: b08
    type: quiz_fill
    graded: true
    prompt_md: "Điền một từ tiếng Anh: để gộp tính năng làm trên nhánh riêng vào `main` và để người khác xem xét, ta mở một Pull ______ (viết tắt là PR)."
    blanks:
      - accept: ["request", "Request"]
    explain_md: "**Pull Request** (PR) là đề nghị gộp nhánh vào `main` kèm chỗ để review và thảo luận. Làm một mình vẫn nên mở PR để luyện thói quen và có lịch sử thay đổi rõ ràng."
  - id: b09
    type: callout
    kind: interview
    md: |
      **Thanh điểm mức 3 (level-3 bar).** Trình bày dự án trong khoảng 5 phút, nói rõ **phần của bạn**
      và trả lời liên tiếp vài câu "tại sao" mà không mâu thuẫn. Hãy chuẩn bị: (1) tóm tắt một câu;
      (2) vì sao chọn phạm vi và công nghệ này; (3) một khó khăn và cách vượt qua; (4) một đánh đổi
      bạn đã chọn (ví dụ file so với database); (5) nếu làm lại bạn sẽ đổi gì. Chỉ nhận những gì bạn
      thật sự làm và hiểu.
  - id: b10
    type: summary
    bullets_vi:
      - "Chọn dự án **nhỏ nhưng hoàn chỉnh**: 1-2 tuần, đầu vào/đầu ra rõ, tóm được trong một câu."
      - "Chia 5-8 việc nhỏ, **mỗi việc chạy được rồi mới sang việc kế**; mỗi việc xong là một commit."
      - "Git end-to-end: `init` → **commit nhỏ, lời nhắn rõ** → nhánh → push GitHub → **PR** → gộp; không commit mật khẩu/khóa."
      - "Repo tốt: **README** (làm gì, cách chạy, ví dụ), cấu trúc gọn, `.gitignore`, lịch sử commit đọc được."
      - "Kể dự án theo khung: **vấn đề → bạn làm gì → quyết định/đánh đổi → kết quả và bài học**."
