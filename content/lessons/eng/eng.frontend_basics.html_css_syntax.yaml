id: eng.frontend_basics.html_css_syntax
version: 1
status: published
title_vi: "Cú pháp HTML và CSS cơ bản"
est_minutes: 11
objectives_vi:
  - "Đọc và viết được **cấu trúc HTML**: thẻ mở/đóng, **thuộc tính** (`href`, `src`, `alt`, `id`, `class`) và các phần tử lồng nhau."
  - "Dùng các thẻ cơ bản (`h1`-`h6`, `p`, `ul`/`li`, `a`, `img`, `div`) và viết **form** với `input`, `label`, `button`."
  - "Viết **luật CSS** (selector, property, value), chọn theo thẻ, `.class`, `#id` và nối CSS vào HTML bằng `<style>` hoặc `<link>`."
  - "Hiểu **box model** (content, padding, border, margin) và xếp các phần tử thành hàng bằng **flexbox** cơ bản."
blocks:
  - id: s_html
    type: section
    title_vi: "HTML: cấu trúc, thẻ và thuộc tính"
    summary_vi: "HTML mô tả cấu trúc trang bằng thẻ mở/đóng lồng nhau; thuộc tính đặt trong thẻ mở; form gom các ô nhập."
  - id: b01
    type: text
    md: |
      **HTML** mô tả **cấu trúc và nội dung** của trang web bằng các **thẻ** (tag). Phần lớn thẻ có **thẻ mở**
      và **thẻ đóng**, và có thể **lồng nhau**. Một trang có khung cơ bản: `<head>` chứa thông tin (như tiêu đề
      tab), `<body>` chứa phần hiển thị.

      ```html
      <!DOCTYPE html>
      <html>
        <head><title>Trang của tôi</title></head>
        <body>
          <h1>Xin chào</h1>
          <p>Đây là một đoạn văn.</p>
          <ul>
            <li>Mục 1</li>
            <li>Mục 2</li>
          </ul>
          <a href="https://example.com">Một liên kết</a>
          <img src="anh.png" alt="Mô tả ảnh">
        </body>
      </html>
      ```

      Thẻ hay dùng: `h1`-`h6` (tiêu đề), `p` (đoạn), `ul`/`li` (danh sách), `a` (liên kết), `img` (ảnh),
      `div` (hộp gom nhóm). `img` là thẻ **không có nội dung** nên không cần thẻ đóng.

      **Thuộc tính** (attribute) là thông tin thêm nằm trong **thẻ mở**, dạng `tên="giá trị"`:
      `href` cho địa chỉ liên kết, `src` cho đường dẫn ảnh, `alt` cho mô tả ảnh (hữu ích khi ảnh không tải
      được và cho người dùng đọc màn hình). `id` là tên **duy nhất** trong trang; `class` là nhãn có thể
      **dùng chung** cho nhiều thẻ.

      **Form**: `<form>` chứa các ô nhập `<input type="text|email|password">`, `<label>` gắn chữ cho ô
      nhập và `<button type="submit">` để gửi.

      ```html
      <form>
        <label>Email <input type="email" name="email"></label>
        <label>Mật khẩu <input type="password" name="password"></label>
        <button type="submit">Đăng ký</button>
      </form>
      ```
  - id: b02
    type: quiz_mcq
    graded: true
    prompt_md: "Trong `<a href=\"https://example.com\" class=\"nut\">Xem</a>`, `href` và `class` là gì?"
    options:
      - {id: a, text_md: "**Thuộc tính** (attribute) nằm trong thẻ mở: `href` là địa chỉ liên kết, `class` là nhãn dùng chung"}
      - {id: b, text_md: "Hai thẻ con lồng bên trong thẻ `a`"}
      - {id: c, text_md: "Hai luật **CSS** áp dụng cho thẻ `a`"}
    answer: [a]
    explain_md: "Thuộc tính viết dạng `tên=\"giá trị\"` trong thẻ mở. Thẻ con sẽ nằm giữa thẻ mở và thẻ đóng, còn luật CSS viết riêng dạng `selector { property: value; }`."
  - id: s_css
    type: section
    title_vi: "CSS: luật, selector và cách nối vào HTML"
    summary_vi: "CSS gồm các luật selector { property: value; }. Chọn theo thẻ, .class, #id; nối bằng <style>, <link> hoặc inline style."
  - id: b03
    type: text
    md: |
      **CSS** mô tả **cách hiển thị** (màu, cỡ chữ, khoảng cách, bố cục). Mỗi **luật** gồm **selector**
      (chọn phần tử nào) và các cặp **property: value** trong ngoặc nhọn, mỗi cặp kết thúc bằng `;`.

      ```css
      p { color: gray; }            /* chọn theo thẻ */
      .nut { color: red; }          /* chọn theo class (dấu chấm) */
      #chinh { background: yellow; } /* chọn theo id (dấu thăng) */
      ```

      Có ba cách nối CSS vào HTML:
      - Thẻ `<style>` trong `<head>` (viết CSS ngay trong trang).
      - File ngoài `style.css` nối bằng `<link rel="stylesheet" href="style.css">` trong `<head>`.
      - **Inline style**: thuộc tính `style="color: red;"` trên một thẻ (chỉ ảnh hưởng thẻ đó, khó bảo trì).

      ```html
      <head>
        <link rel="stylesheet" href="style.css">
      </head>
      ```

      **Màu, chữ và đơn vị**: `color` (màu chữ), `background` (nền), `font-size` (cỡ chữ). Đơn vị: `px`
      (điểm ảnh cố định), `%` (tính theo phần tử cha), `em`/`rem` (tính theo cỡ chữ; `rem` theo cỡ chữ gốc
      của trang).

      **Selector kết hợp**: `.menu a` chọn thẻ `a` **nằm trong** phần tử có class `menu`; `a:hover` chọn thẻ
      `a` khi rê chuột lên.
  - id: b04
    type: quiz_mcq
    graded: true
    prompt_md: "Luật CSS nào chọn **mọi phần tử có class `nut`** và đổi màu chữ thành đỏ?"
    options:
      - {id: a, text_md: "`#nut { color: red; }`"}
      - {id: b, text_md: "`.nut { color: red; }`"}
      - {id: c, text_md: "`nut { color: red; }`"}
    answer: [b]
    explain_md: "Dấu chấm `.` chọn theo class. `#` chọn theo id, còn `nut` không có tiền tố sẽ chọn thẻ tên `<nut>` (không tồn tại)."
  - id: s_layout
    type: section
    title_vi: "Box model và flexbox cơ bản"
    summary_vi: "Mỗi phần tử là một hộp: content + padding + border + margin. display: flex xếp các con thành hàng; justify-content và align-items căn chỉnh."
  - id: b05
    type: text
    md: |
      **Box model**: mỗi phần tử là một hộp gồm từ trong ra ngoài: **content** (nội dung), **padding**
      (đệm bên trong), **border** (viền) và **margin** (lề bên ngoài, tạo khoảng cách với phần tử khác).

      ```css
      .hop {
        width: 100px;       /* bề rộng của content (mặc định box-sizing: content-box) */
        padding: 10px;
        border: 2px solid black;
        margin: 5px;
      }
      ```

      Với mặc định `content-box`, bề rộng hộp (content + padding + border) là 100 + 10*2 + 2*2 = **124px**;
      cộng cả margin (5*2) thì chiếm chỗ **134px**. (Đặt `box-sizing: border-box` thì `width` đã tính
      cả padding và border.)

      **Flexbox cơ bản**: đặt `display: flex` trên **hộp cha** để xếp các phần tử con thành **hàng**.
      `justify-content` căn theo **chiều hàng** (trục chính), `align-items` căn theo **chiều còn lại**.

      ```css
      .menu {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        list-style: none;
      }
      ```

      ```html
      <ul class="menu"><li>Home</li><li>Blog</li><li>Liên hệ</li></ul>
      ```
  - id: b06
    type: quiz_mcq
    graded: true
    prompt_md: "Theo **box model** mặc định (`content-box`), `.hop { width: 100px; padding: 10px; border: 2px solid; }` có bề rộng hộp (chưa tính margin) là bao nhiêu?"
    options:
      - {id: a, text_md: "100px"}
      - {id: b, text_md: "120px"}
      - {id: c, text_md: "124px"}
    answer: [c]
    explain_md: "Content 100 + padding hai bên 20 + border hai bên 4 = 124px. Margin nằm ngoài hộp nên không tính vào bề rộng hộp."
  - id: b07
    type: quiz_fill
    graded: true
    prompt_md: "Điền một từ: để xếp các phần tử con trong một hộp cha thành hàng bằng **flexbox**, đặt `display: ______` trên hộp cha."
    blanks:
      - accept: ["flex", "Flex"]
    explain_md: "Đó là `display: flex`. Sau đó dùng `justify-content` và `align-items` để căn chỉnh các phần tử con."
  - id: b08
    type: callout
    kind: interview
    md: |
      **Thanh điểm mức 3 (level-3 bar).** Bạn tự viết được một trang HTML có **tiêu đề, danh sách, ảnh và
      form đăng ký**, rồi dùng **CSS** (selector theo thẻ/class/id, **box model**, **flex**) để căn giữa và
      xếp thành hàng. Bạn nối được CSS vào HTML bằng `<style>` hoặc `<link>`, và tính được bề rộng hộp từ
      content + padding + border + margin.
  - id: b09
    type: summary
    bullets_vi:
      - "**HTML** = cấu trúc: thẻ mở/đóng lồng nhau, **thuộc tính** trong thẻ mở (`href`, `src`, `alt`, `id`, `class`)."
      - "Thẻ cơ bản: `h1`-`h6`, `p`, `ul`/`li`, `a`, `img`, `div`; **form** gồm `input` (text/email/password), `label`, `button`."
      - "**CSS** = luật `selector { property: value; }`; chọn theo thẻ, `.class`, `#id`; selector kết hợp như `.menu a`."
      - "Nối CSS bằng `<style>`, file ngoài `<link rel=\"stylesheet\">` hoặc inline `style`; đơn vị `px`, `%`, `em`/`rem`."
      - "**Box model**: content + padding + border + margin; **flexbox**: `display: flex`, `justify-content`, `align-items`."
