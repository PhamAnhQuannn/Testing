id: sd.archetypes.url_shortener
version: 1
status: published
title_vi: "Thiết kế dịch vụ rút gọn URL (URL shortener) và pastebin"
est_minutes: 13
objectives_vi:
  - "Làm rõ yêu cầu và ước lượng (estimation) nhanh quy mô của một URL shortener, rồi phác được API và mô hình dữ liệu."
  - "Vẽ được luồng ghi (tạo mã) và luồng đọc (chuyển hướng), gọi tên đúng các thành phần đã học (cache, key-value store, CDN)."
  - "Phân tích 2-3 quyết định đặc trưng: sinh mã ngắn không trùng, chọn redirect 301 hay 302, và vì sao hệ đọc nhiều (read-heavy) phải đặt cache phía trước."
blocks:
  - id: b01
    type: text
    md: |
      Đây là một bài "thiết kế X" mẫu: ta **áp dụng** các khái niệm System Design đã học vào một hệ
      cụ thể, chứ không dạy lại chúng. Đi theo đúng khung 4 bước: (1) làm rõ yêu cầu + ước lượng
      (estimation); (2) API + mô hình dữ liệu; (3) thiết kế tổng thể (luồng đọc / luồng ghi); (4) vài
      quyết định đặc trưng cho **riêng** hệ này.

      **Làm rõ yêu cầu.** Chức năng cốt lõi: nhận một link dài, trả về một **mã ngắn (short code)**;
      ai mở mã ngắn thì được **chuyển hướng (redirect)** về link gốc (như bit.ly, TinyURL). Hỏi thêm:
      có cho **tên riêng (custom alias)** không? Link có **hết hạn (expiry)** không? Có cần **thống kê
      click** không? Pastebin là cùng một khung nhưng "giá trị" là cả một đoạn văn bản thay vì một URL.
  - id: b02
    type: text
    md: |
      **Ước lượng (estimation) nhanh** — để biện minh cho các lựa chọn sau, không phải để ra số đẹp:
      - Giả sử **100 triệu link mới mỗi tháng** → ghi (write) ≈ 100e6 / (30 × 86400) ≈ **~40 ghi/giây**.
      - **Đọc nhiều hơn ghi 100:1** (read-heavy) → đọc (read) ≈ **~4.000 đọc/giây**. Đây là tín hiệu
        quan trọng nhất: hệ này **đọc nặng**, nên luồng đọc phải cực nhanh và rẻ.
      - **Lưu trữ**: 100e6/tháng × 60 tháng ≈ **6 tỷ** bản ghi trong 5 năm; mỗi bản ghi ~500 byte →
        khoảng **3 TB**. Vừa sức một key-value store có sharding, không cần gì kỳ lạ.
      Kết luận rút ra ngay: tải không lớn về ghi, nhưng **đọc nặng** ⇒ cache + chuyển hướng phải tối ưu.
  - id: b03
    type: text
    md: |
      **API + mô hình dữ liệu.** Chỉ cần hai endpoint:
      - `POST /shorten` nhận `long_url` (và tùy chọn `custom_alias`, `expiry`) → trả `short_code`.
      - `GET /{short_code}` → trả **redirect** về `long_url`.

      Mô hình dữ liệu tối giản: một ánh xạ `short_code -> {long_url, created_at, expiry, owner}`. Vì ta
      hầu như chỉ **tra cứu theo khóa chính** `short_code` (không cần join, không truy vấn phức tạp),
      đây đúng là chỗ cho một **key-value store** (đã học ở SQL vs NoSQL) — hãy hình dung như một `dict`
      của Python nhưng phân mảnh (sharding) trên nhiều máy, khóa là `short_code`.
  - id: b04
    type: text
    md: |
      **Thiết kế tổng thể — hai luồng.**
      - **Luồng ghi (tạo mã):** client → load balancer → app server (stateless) → sinh một `short_code`
        chưa dùng → ghi cặp `short_code -> long_url` vào key-value store → trả mã về.
      - **Luồng đọc (chuyển hướng):** client mở `short_code` → tra **cache** trước (cache-aside, đã học
        ở mẫu caching); trúng thì trả redirect ngay, trượt thì đọc DB, nạp lại vào cache rồi trả. Vì
        đọc nặng 100:1, phần lớn request nên dừng ở cache; có thể đặt thêm **CDN / edge** để chuyển
        hướng ngay gần người dùng mà không chạm tới DB.
  - id: b05
    type: text
    md: |
      **Quyết định đặc trưng #1 — sinh mã ngắn không trùng.** Có ba hướng:
      - **Bộ đếm + base62 (counter + base62):** mỗi link mới lấy số kế tiếp từ một bộ đếm toàn cục rồi
        đổi sang base62 (0-9, a-z, A-Z). **Không bao giờ trùng** và mã ngắn, nhưng bộ đếm là một điểm
        nghẽn/điểm chết, và mã **đoán được** mã kế tiếp. Khắc phục: phát **dải số (range)** cho từng
        app server, hoặc dùng một **dịch vụ sinh khóa (key-generation service)** phát mã **đúc sẵn
        (pre-generated keys)**.
      - **Băm + kiểm va chạm (hash + collision check):** băm link rồi lấy vài ký tự đầu; **dễ trùng
        (collision)** nên phải kiểm tra mã đã tồn tại chưa, trùng thì băm/đổi lại — mỗi lần ghi tốn
        thêm một lần đọc.
      - **Độ dài bao nhiêu?** Base62 với **7 ký tự** cho 62^7 ≈ **3,5 nghìn tỷ (3.5e12)** mã — thừa cho
        6 tỷ link trong 5 năm. Đây là phần "length math" cần nói ra trong phỏng vấn.
  - id: b06
    type: quiz_mcq
    graded: true
    prompt_md: "Vì sao cách **bộ đếm + base62 (counter + base62)** không bao giờ sinh ra mã trùng, trong khi cách **băm (hash)** lại cần kiểm tra va chạm?"
    options:
      - {id: a, text_md: "Vì base62 dùng nhiều ký tự hơn hệ thập phân nên không gian mã lớn vô hạn."}
      - {id: b, text_md: "Vì mỗi số đếm là duy nhất và base62 chỉ là cách viết lại số đó, nên hai link khác nhau luôn nhận số khác nhau; còn băm ánh xạ nhiều link vào ít mã nên có thể đụng nhau."}
      - {id: c, text_md: "Vì bộ đếm tự động kiểm tra va chạm sau mỗi lần sinh, còn hàm băm thì không."}
    answer: [b]
    explain_md: "Bộ đếm cấp số nguyên tăng dần, duy nhất; base62 chỉ đổi cách biểu diễn số nên vẫn duy nhất 1-1. Băm nén không gian link lớn vào một mã ngắn nên nhiều link có thể ra cùng mã (collision), buộc phải kiểm tra rồi băm lại. (a) sai vì 62^7 là hữu hạn; (c) sai — bản thân bộ đếm không cần kiểm va chạm, chính nhờ tính duy nhất của số đếm."
  - id: b07
    type: text
    md: |
      **Quyết định đặc trưng #2 — chuyển hướng 301 hay 302 (redirect).**
      - **301 (Moved Permanently):** trình duyệt **nhớ (cache)** ánh xạ, lần sau đi thẳng tới link gốc
        **không hỏi lại server**. Giảm tải server tối đa, **nhưng** vì không hỏi lại nên ta **không đếm
        được click** và không thể đổi/thu hồi đích về sau một cách đáng tin.
      - **302 (Found / tạm thời):** lần nào trình duyệt cũng hỏi server. Giữ được **quyền kiểm soát** và
        **thống kê (analytics)**, đổi lại server chịu nhiều request hơn.
      Với một URL shortener muốn **đếm click** hoặc kiểm soát link, thường chọn **302**. Việc đếm click
      thì **ghi sự kiện vào queue và xử lý bất đồng bộ (async)** để không làm chậm lúc chuyển hướng.
  - id: b08
    type: quiz_mcq
    graded: true
    prompt_md: "Một URL shortener cần **thống kê số click** cho mỗi link. Giữa 301 và 302, nên chọn gì và vì sao?"
    options:
      - {id: a, text_md: "Chọn 301, vì trình duyệt cache nên server nhẹ tải và vẫn đếm được mọi click."}
      - {id: b, text_md: "Chọn 302, vì trình duyệt hỏi lại server mỗi lần nên server còn nhìn thấy từng click để đếm; 301 bị trình duyệt cache nên mất phần lớn lượt đếm."}
      - {id: c, text_md: "Không quan trọng, vì việc đếm click do trình duyệt lo chứ không phải server."}
    answer: [b]
    explain_md: "301 khiến trình duyệt đi thẳng tới đích mà không hỏi lại, nên server không thấy các lần mở sau → không đếm được. 302 giữ server trong mỗi lần mở nên đếm được (thường đẩy sự kiện qua queue xử lý async để không chậm). (a) tự mâu thuẫn; (c) sai — client không tự báo cáo click cho ta."
  - id: b09
    type: quiz_fill
    graded: true
    prompt_md: |
      Điền thuật ngữ (tiếng Anh) còn thiếu:

      Hệ này __(1)__ gấp khoảng 100 lần so với ghi, nên ta đặt một lớp __(2)__ phía trước cơ sở dữ liệu
      theo mẫu đọc-trúng-thì-trả / trượt-thì-nạp, và vì chỉ tra theo khóa `short_code` nên kho dữ liệu
      hợp lý là một __(3)__ store.
    blanks:
      - {accept: ["read-heavy", "read heavy", "đọc nhiều", "reads more", "read-heavier"]}
      - {accept: ["cache", "caching"]}
      - {accept: ["key-value", "key value", "kv", "key-value store"]}
    explain_md: "Đọc nặng (read-heavy) ~100:1 ⇒ đặt cache (cache-aside) trước DB để phần lớn lượt chuyển hướng không chạm DB; truy cập chỉ theo khóa chính nên một key-value store là lựa chọn tự nhiên."
  - id: b10
    type: callout
    kind: interview
    md: |
      **Mẹo phỏng vấn.** Trình bày theo đúng khung: *làm rõ yêu cầu → ước lượng nhanh (nói ra con số
      đọc nặng 100:1) → API + mô hình dữ liệu → luồng đọc/ghi → 2-3 quyết định đặc trưng*. Người phỏng
      vấn chờ bạn **tự nêu** đánh đổi: counter vs hash (và length math 62^7 ≈ 3,5e12), 301 vs 302, và
      vì sao read-heavy ⇒ cache + CDN. Đừng kể lể lại cache hay sharding là gì — chỉ **gọi tên và áp
      dụng**. Mở rộng cho tải chuyển hướng rất lớn: thêm CDN/edge và sharding key-value theo `short_code`.
  - id: b11
    type: summary
    bullets_vi:
      - "Khung thiết kế: làm rõ yêu cầu → ước lượng (estimation) → API + mô hình dữ liệu → luồng đọc/ghi → quyết định đặc trưng."
      - "Ước lượng cho thấy hệ **đọc nặng (read-heavy) ~100:1**, ghi chỉ ~40/giây — tín hiệu để tối ưu luồng đọc bằng **cache (cache-aside)** và CDN."
      - "Mô hình dữ liệu chỉ là ánh xạ `short_code -> long_url`, tra theo khóa chính ⇒ dùng **key-value store** (có sharding theo `short_code`)."
      - "Sinh mã: **counter + base62** (duy nhất, đoán được, cần KGS/pre-generated để tránh nghẽn) vs **hash + kiểm va chạm**; 7 ký tự base62 ≈ **3,5 nghìn tỷ (62^7)** mã."
      - "Redirect: **301** được trình duyệt cache (nhẹ server nhưng mất click/kiểm soát) vs **302** giữ server mỗi lần (đếm được click); việc đếm đẩy qua queue xử lý **async**."
