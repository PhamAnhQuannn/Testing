id: sd.caching.cdn
version: 1
status: published
title_vi: "CDN và edge caching: phục vụ nội dung tĩnh/media gần người dùng"
est_minutes: 13
objectives_vi:
  - "Giải thích CDN là gì (edge/PoP giữ bản sao nội dung tĩnh/media gần người dùng → giảm độ trễ và giảm tải origin) và phân biệt pull vs push."
  - "Thiết kế cache key, TTL/Cache-Control và cách cập nhật file (URL có phiên bản/fingerprint, purge/invalidation) cho web asset và cho video."
  - "Ước tính chi phí egress (bytes phục vụ × giá/GB) và giải thích vì sao hit ratio cao cắt được egress từ origin."
blocks:
  - id: b01
    type: text
    md: |
      **CDN (Content Delivery Network)** là một mạng lưới máy chủ cache đặt rải rác khắp thế giới,
      gọi là **edge** hay **PoP (point of presence — điểm hiện diện)**, giữ **bản sao** nội dung
      **tĩnh/media** (ảnh, video, JS/CSS, file tải về) gần người dùng. Server gốc chứa bản thật gọi
      là **origin**.

      Lợi ích gồm hai phần:
      - **Giảm độ trễ (latency):** người ở Hà Nội lấy ảnh từ edge ở Singapore (~30 ms) thay vì từ
        origin ở Mỹ (~200 ms). Càng gần càng nhanh.
      - **Giảm tải origin (offload):** đa số request được edge phục vụ, origin chỉ phải trả lời một
        phần nhỏ.

      Lần đầu một edge chưa có file → **miss**: edge đi lấy từ origin rồi **giữ lại**. Những lần sau
      của người dùng gần đó → **hit**: edge trả ngay, không chạm tới origin.
  - id: b02
    type: text
    md: |
      Có hai cách để file lên edge:
      - **Pull CDN:** edge **tự kéo** từ origin khi có người hỏi lần đầu (miss) rồi cache lại. Đơn
        giản, không phải quản lý trước — hợp với **đa số** trường hợp, nhất là nội dung do người dùng
        tạo (ảnh upload) hoặc kho file rất lớn mà không biết trước cái nào sẽ nóng.
      - **Push CDN:** mình **chủ động đẩy** file lên edge trước khi có ai hỏi. Hợp với file **ít đổi,
        quan trọng, cần sẵn ngay** ở lần truy cập đầu (ví dụ bản cài đặt phần mềm vừa phát hành, asset
        của một đợt ra mắt lớn) — đổi lại phải tự lo quy trình đẩy và dọn.

      Mặc định hãy nghĩ tới **pull**; chỉ chọn push khi cần kiểm soát thời điểm và tránh "miss" ở lần
      đầu cho nội dung đã biết trước.
  - id: b03
    type: quiz_mcq
    graded: true
    prompt_md: "Một trang cho người dùng upload ảnh đại diện (số lượng rất lớn, không đoán trước cái nào sẽ được xem). Nên dùng kiểu CDN nào, và vì sao?"
    options:
      - {id: a, text_md: "**Push CDN**, để mọi ảnh có sẵn ở mọi edge ngay sau khi upload."}
      - {id: b, text_md: "**Pull CDN**, để edge tự kéo ảnh từ origin ở lần đầu có người xem rồi cache lại — không phải đẩy trước hàng triệu file."}
      - {id: c, text_md: "Không cần CDN vì ảnh người dùng là dữ liệu riêng tư, luôn phải lấy từ origin."}
    answer: [b]
    explain_md: "Số file khổng lồ và không biết trước cái nào nóng → **pull** là hợp lý: chỉ những ảnh thực sự được xem mới chiếm chỗ trên edge. Push (a) buộc phải đẩy và dọn hàng triệu file, phí vô ích. (c) sai: ảnh công khai vẫn cache tốt; dữ liệu thực sự riêng tư thì dùng signed URL chứ không phải bỏ CDN."
  - id: b04
    type: text
    md: |
      **Cache key** là cái mà edge dùng để tra "mình đã có bản này chưa". Mặc định cache key là
      **URL** (đường dẫn), và thường gồm cả **query string** (phần sau dấu `?`, ví dụ `?w=100`) nếu
      nó đổi nội dung trả về. Vì vậy `/img/a.png?w=100` và `/img/a.png?w=200` là **hai key khác
      nhau** (hai ảnh kích thước khác). Có thể cấu hình thêm vài **header** vào key qua `Vary` (ví dụ
      `Vary: Accept-Encoding` để tách bản nén gzip/brotli). Lưu ý: nếu URL đính kèm query string vô
      nghĩa (ví dụ mã theo dõi quảng cáo) mà vẫn vào key thì hit ratio tụt — nên bỏ các query không
      ảnh hưởng nội dung ra khỏi key.

      Origin điều khiển thời gian cache bằng header **`Cache-Control`**, quan trọng nhất là
      **`max-age`** — tức **TTL (time to live)**, số giây edge được giữ và phục vụ mà không hỏi lại.
      Hết TTL, edge **revalidate**: hỏi origin bằng **`ETag`** (mã phiên bản của file); nếu chưa đổi,
      origin trả `304 Not Modified` (không gửi lại body, tiết kiệm băng thông).
  - id: b05
    type: quiz_fill
    graded: true
    prompt_md: |
      Điền thuật ngữ (tiếng Anh) cho đúng:
      (1) Số giây một edge được giữ và phục vụ một file mà không hỏi lại origin, đặt qua `max-age`,
      gọi là ___.
      (2) Cái mà edge dùng để tra xem đã có bản đang hỏi hay chưa (mặc định là URL, có thể gồm query
      string / vài header) gọi là ___.
    blanks:
      - {accept: ["TTL", "ttl", "time to live", "time-to-live"]}
      - {accept: ["cache key", "cache-key", "key", "cache key (URL)"]}
    explain_md: "(1) **TTL** (time to live) = thời gian sống của bản cache, đặt bằng `Cache-Control: max-age`. (2) **cache key** = định danh bản cache, mặc định là URL (thường gồm query string, có thể thêm header qua `Vary`)."
  - id: b06
    type: text
    md: |
      **Cập nhật file khi nội dung đổi.** TTL dài (nhiều ngày/tháng) cho file tĩnh làm hit ratio cao,
      nhưng khi ra bản mới thì edge vẫn phục vụ bản cũ cho tới hết TTL. Có hai cách gỡ:
      - **URL có phiên bản / fingerprint (cache busting) — cách nên dùng:** đổi *tên* file theo nội
        dung, ví dụ `app.9f3c1a.js` hay `app.v2.js`. URL mới = cache key mới → edge chắc chắn kéo bản
        mới ngay, còn bản cũ cứ để hết hạn tự nhiên. Đặt TTL **rất dài** cho các URL này (vì mỗi phiên
        bản là bất biến — immutable). File "điểm vào" thường không fingerprint được (ví dụ
        `index.html`) thì cho TTL **ngắn**.
      - **Purge / invalidation:** gọi CDN xóa/đánh dấu hết hạn một URL ở mọi edge. Dùng khi **gấp**
        (gỡ nội dung sai/nhạy cảm), nhưng **chậm lan** ra toàn mạng và thường **bị tính phí/giới hạn
        số lần** → không nên làm quy trình thường xuyên.

      Quy tắc phỏng vấn: *cập nhật bình thường → đổi URL (versioned); chỉ purge khi khẩn cấp.*
  - id: b07
    type: text
    md: |
      **Chiến lược khác nhau cho web asset và video.**
      - **Web asset (JS/CSS/ảnh):** fingerprint tên file + **TTL rất dài** (ví dụ 1 năm,
        `immutable`); đổi bản thì đổi URL. HTML điểm vào để TTL ngắn hoặc revalidate để lấy tên file
        mới.
      - **Video:** không cache nguyên file lớn mà cắt thành **đoạn nhỏ (segment)** vài giây theo
        **HLS** hoặc **DASH**; một **manifest** (danh sách đoạn, nhiều mức chất lượng) cho client
        chọn bitrate phù hợp (**ABR — adaptive bitrate**). Mỗi segment là một URL bất biến → **TTL
        dài** như asset tĩnh và cache rất tốt trên edge. Manifest cho live thì TTL **ngắn** (vì danh
        sách đoạn liên tục cập nhật); manifest cho video có sẵn (VOD) thì cache dài được.

      Điểm chung: cái gì **bất biến** (segment, file fingerprint) thì TTL dài; cái gì **hay đổi**
      (manifest live, HTML) thì TTL ngắn.
  - id: b08
    type: quiz_mcq
    graded: true
    prompt_md: "Vì sao chiến lược tốt là **fingerprint tên file + TTL rất dài** thay vì TTL ngắn rồi purge mỗi lần deploy?"
    options:
      - {id: a, text_md: "Vì purge luôn miễn phí và lan tức thời ra toàn bộ edge."}
      - {id: b, text_md: "Vì đổi URL theo phiên bản làm cache key mới nên edge lấy bản mới ngay mà vẫn giữ TTL dài (hit ratio cao); purge thì chậm lan và thường bị tính phí/giới hạn."}
      - {id: c, text_md: "Vì TTL ngắn làm file tải nhanh hơn cho người dùng."}
    answer: [b]
    explain_md: "URL có phiên bản tách biệt bản cũ/mới bằng chính cache key, nên vừa cập nhật tức thì vừa giữ TTL dài để hit ratio cao. (a) sai: purge chậm lan và thường mất phí/bị giới hạn. (c) sai: TTL ngắn làm phải revalidate/miss nhiều hơn, không làm tải nhanh hơn."
  - id: b09
    type: callout
    kind: interview
    md: |
      **Mẹo phỏng vấn.** Khi được hỏi "thiết kế CDN cho ...", trả lời theo bộ khung: **(1) cache
      key** (URL + có tính query string nào? có `Vary` header nào?), **(2) TTL** (bất biến → dài;
      hay đổi → ngắn + revalidate), **(3) cách cập nhật file** (versioned URL cho bình thường, purge
      cho khẩn cấp), rồi **(4) ước tính chi phí egress**. Nói rõ **hit ratio** mục tiêu vì nó quyết
      định cả tốc độ lẫn tiền. Đừng quên phân biệt pull/push và nội dung riêng tư thì dùng signed URL.
  - id: b10
    type: text
    md: |
      **Ước tính chi phí egress (tiền trả cho dữ liệu đi ra).** Công thức gốc:
      **chi phí ≈ số bytes phục vụ × giá mỗi GB**.

      Ví dụ: một tháng phục vụ **100 TB = 100.000 GB** cho người dùng. Giá egress của CDN
      **0,05 $/GB** → 100.000 × 0,05 = **5.000 $/tháng** (phần edge → người dùng).

      Bây giờ xét **hit ratio**. Với CDN, **origin chỉ phải trả cho phần miss** (edge kéo về khi
      chưa có). Giả sử hit ratio **95%** → origin chỉ phục vụ 5% = **5.000 GB**. Nếu giá egress của
      origin (đám mây) là **0,09 $/GB**: origin tốn 5.000 × 0,09 = **450 $**. Không có CDN, origin
      phải tự phục vụ cả 100.000 GB × 0,09 = **9.000 $**. Vậy hit ratio cao vừa **giảm tải** vừa
      **cắt mạnh egress đắt tiền từ origin** (ở đây origin từ 9.000 $ còn 450 $).

      Ghi nhớ: giá egress của CDN và của origin **khác nhau**; hit ratio càng cao thì phần đắt
      (origin) càng nhỏ. Tối ưu hit ratio = TTL hợp lý + cache key gọn (bỏ query vô nghĩa) +
      fingerprint để TTL dài mà vẫn cập nhật được.
  - id: b11
    type: summary
    bullets_vi:
      - "CDN = mạng edge/PoP giữ bản sao nội dung tĩnh/media gần người dùng → giảm độ trễ (gần hơn) và giảm tải origin (offload); lần đầu là miss (kéo từ origin rồi giữ), sau đó là hit."
      - "Pull (edge tự kéo khi có người hỏi — mặc định, hợp nội dung nhiều/khó đoán) vs push (chủ động đẩy trước — hợp file ít đổi, quan trọng, cần sẵn ngay)."
      - "Cache key = URL (thường gồm query string, có thể thêm header qua Vary); TTL = max-age trong Cache-Control; hết TTL thì revalidate bằng ETag (304 nếu chưa đổi)."
      - "Cập nhật file: dùng URL có phiên bản/fingerprint (cache busting) + TTL dài cho bản bất biến là cách thường dùng; purge/invalidation chỉ cho khẩn cấp (chậm lan, tốn phí)."
      - "Web asset: fingerprint + TTL rất dài; video: cắt segment HLS/DASH + manifest (ABR), segment TTL dài, manifest live TTL ngắn."
      - "Chi phí egress ≈ bytes phục vụ × giá/GB; hit ratio cao cắt mạnh egress đắt từ origin (ví dụ 95% hit đưa origin từ 9.000 $ còn 450 $)."
