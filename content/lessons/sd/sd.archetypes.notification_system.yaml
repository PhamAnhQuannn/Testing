id: sd.archetypes.notification_system
version: 1
status: published
title_vi: "Thiết kế hệ thống thông báo (notification system) và webhook delivery"
est_minutes: 14
objectives_vi:
  - "Vẽ được đường ống đa kênh (multi-channel pipeline): producer đẩy sự kiện vào, notification service áp tuỳ chọn người dùng và templating, rồi mỗi kênh (push/email/SMS) có queue + worker riêng."
  - "Giải thích vì sao cần retry + backoff + DLQ, provider failover, và idempotency/dedup để gửi *đúng một lần theo cảm nhận người dùng* dù hệ ở dưới là at-least-once."
  - "Thiết kế reliable webhook delivery cho bên ngoài (payload có chữ ký, thử lại, receiver idempotent, DLQ, theo dõi trạng thái) và biết dùng rate limit/batching/digest để không spam."
blocks:
  - id: b01
    type: text
    md: |
      Bài toán **hệ thống thông báo (notification system)**: nhận yêu cầu "báo cho người dùng X việc Y"
      từ nhiều nơi trong hệ, rồi gửi ra qua nhiều **kênh (channel)** — **push** (qua **APNs** của Apple,
      **FCM** của Google), **email**, **SMS**, in-app — cho tới hàng trăm triệu người, **đúng loại,
      không gửi trùng, không bỏ sót**. Đây là một archetype dựng trên hai thứ bạn đã học: **task
      workers** (nhận việc rồi xử lý nền) và **queue / pub-sub** (tách người gửi khỏi người làm).

      Kiến trúc lõi là một **đường ống (pipeline)**:
      - **Producers** (service đơn hàng, service bảo mật...) không tự gọi APNs/SMTP. Chúng chỉ **đẩy một
        sự kiện** ("order_shipped cho user 42") vào **notification service** rồi nhận ngay "đã nhận".
      - **Notification service** quyết định *gửi hay không, gửi kênh nào, nội dung gì* (các bước ở
        block sau), rồi bỏ việc vào **hàng đợi theo từng kênh (per-channel queue)**.
      - Mỗi kênh có **worker riêng** rút việc ra và gọi **nhà cung cấp (provider)** tương ứng (APNs, FCM,
        nhà gửi email, nhà gửi SMS).
  - id: b02
    type: text
    md: |
      Vì sao **tách một queue + worker cho mỗi kênh**, thay vì một hàng đợi chung? Vì mỗi kênh có
      **tốc độ, giới hạn và kiểu lỗi khác nhau**: SMS đắt và bị bóp băng thông (throttle) mạnh, email
      có thể dồn lô lớn, push thì nhanh. Tách ra để một kênh chậm/sập **không chặn** các kênh khác, và
      để chỉnh số worker, retry, rate limit **riêng cho từng kênh**. Thêm **hàng đợi ưu tiên (priority
      queue)** trong mỗi kênh: **OTP / cảnh báo bảo mật** phải đến trong vài giây, không được kẹt sau
      một chiến dịch quảng cáo hàng triệu tin.

      Trước khi vào queue, notification service chạy hai bước quan trọng:
      - **Tuỳ chọn người dùng (user preferences):** tôn trọng **opt-out** (người dùng tắt kênh/loại tin),
        **giờ yên lặng (quiet hours)** (hoãn tin không khẩn tới sáng), và **giới hạn mỗi người N tin/ngày**.
        Lọc ở đây để không bao giờ gửi thứ người ta đã từ chối.
      - **Templating + bản địa hoá (localization):** sự kiện thô ("order_shipped, id=123") được ráp vào
        **mẫu (template)** theo ngôn ngữ/định dạng của người nhận. Tách dữ liệu khỏi mẫu giúp đổi nội
        dung mà không đổi code producer.
  - id: b03
    type: quiz_mcq
    graded: true
    prompt_md: "Vì sao nên cho **mỗi kênh (push/email/SMS) một hàng đợi + worker riêng** thay vì dùng một hàng đợi chung cho tất cả?"
    options:
      - {id: a, text_md: "Vì mỗi kênh có tốc độ, giới hạn (rate limit) và kiểu lỗi khác nhau, nên tách ra để một kênh chậm hoặc sập không chặn kênh khác và để chỉnh retry/worker/rate limit riêng."}
      - {id: b, text_md: "Vì một hàng đợi chung không thể lưu được nhiều hơn một loại message."}
      - {id: c, text_md: "Vì tách ra thì không còn cần idempotency hay dedup nữa."}
    answer: [a]
    explain_md: "Mỗi kênh có đặc tính riêng (SMS bị throttle mạnh, email dồn lô, push nhanh); hàng đợi riêng cô lập sự cố và cho tinh chỉnh độc lập. (b) sai — một queue chứa được nhiều loại; (c) sai — dedup vẫn cần dù tách kênh."
  - id: b04
    type: text
    md: |
      Gọi provider là việc **dễ hỏng**: provider timeout, trả 5xx, hoặc bóp băng thông. Worker mỗi kênh
      phải có chính sách bền bỉ:
      - **Thử lại có giãn cách (retry with exponential backoff + jitter):** hỏng thì chờ 1s, 2s, 4s...
        (kèm nhiễu ngẫu nhiên để tránh dồn cục), chỉ thử lại lỗi **tạm thời** (timeout, 5xx, 429), không
        thử lại lỗi **vĩnh viễn** (số điện thoại sai, token đã gỡ).
      - **Provider failover (nhà cung cấp dự phòng):** nếu nhà SMS chính sập, chuyển sang nhà dự phòng —
        thường gắn với **circuit breaker** để ngừng đập vào provider đang chết.
      - **Dead-letter queue (DLQ):** sau N lần thử vẫn hỏng, đẩy message sang **hàng đợi chết** để điều
        tra/replay sau, thay vì mất nó hoặc thử lại vô hạn làm nghẽn worker.

      Vì hệ dùng queue và retry, nền tảng chỉ bảo đảm **at-least-once** (gửi *ít nhất một lần*): một việc
      có thể bị xử lý lại (worker chết sau khi gọi provider nhưng trước khi ack). Đó là lý do phải có bước
      tiếp theo.
  - id: b05
    type: text
    md: |
      **Idempotency / dedup (chống gửi trùng):** mục tiêu là *người dùng chỉ cảm nhận một lần*, dù dưới
      ống có thể gửi lặp. Cách làm: mỗi thông báo mang một **khoá idempotency** suy ra từ ý nghĩa sự kiện,
      ví dụ **(user_id, loại thông báo, event_id)**. Trước khi gọi provider, worker kiểm tra khoá trong một
      **kho dedup** (ví dụ Redis có TTL):
      - chưa thấy khoá → ghi khoá rồi gửi;
      - đã thấy khoá → **bỏ qua** (đã gửi rồi).

      Nhờ vậy producer có thể cứ **gửi lại cho chắc** (at-least-once) mà người dùng không bị dội hai lần
      cùng một tin. Lưu ý: dedup dựa trên **ý nghĩa** (cùng sự kiện), khác với việc chống trùng do retry kỹ
      thuật — nhưng cùng một khoá idempotency có thể phục vụ cả hai.
  - id: b06
    type: quiz_mcq
    graded: true
    prompt_md: "Hệ dùng queue + retry nên chỉ bảo đảm **at-least-once**. Cách đúng để người dùng **không nhận trùng** cùng một thông báo là gì?"
    options:
      - {id: a, text_md: "Chuyển toàn hệ sang exactly-once bằng cách tắt mọi retry."}
      - {id: b, text_md: "Gắn mỗi thông báo một khoá idempotency như (user, loại, event_id); trước khi gửi, kiểm tra kho dedup — đã thấy khoá thì bỏ qua."}
      - {id: c, text_md: "Chỉ gửi mỗi thông báo đúng một lần và không bao giờ thử lại khi provider timeout."}
    answer: [b]
    explain_md: "Dedup theo khoá idempotency biến at-least-once thành 'người dùng thấy một lần' mà vẫn giữ được retry. (a) exactly-once end-to-end là ảo tưởng và tắt retry làm mất tin; (c) bỏ retry khiến lỗi tạm thời thành mất thông báo."
  - id: b07
    type: text
    md: |
      **Chống spam người dùng** — không phải cứ có sự kiện là bắn ngay:
      - **Rate limiting mỗi người:** chặn trần N tin/ngày/kênh để một vòng lặp lỗi không dội bom một người.
      - **Batching / digest (gộp):** thay vì 20 email "có bình luận mới", gộp thành **một bản tóm tắt** mỗi
        giờ/ngày. Giảm tải provider và giảm phiền.
      - **Scheduled & campaign (gửi hẹn giờ và chiến dịch):** gửi cho cả một **nhóm (segment)** thì **chia
        lô (fan-out theo lô)** để không tạo đột biến tải (bursty write) đè bẹp hệ và provider.

      Đây chính là chỗ **fan-out cho broadcast**: một yêu cầu "gửi cho 10 triệu người" được **bung ra** thành
      hàng triệu việc nhỏ, rải đều vào các queue theo kênh, trong khi OTP vẫn đi luồng ưu tiên riêng.
  - id: b08
    type: text
    md: |
      **Reliable webhook delivery** là một biến thể: thay vì gửi cho *người dùng cuối*, ta gọi vào **URL do
      khách hàng (external subscriber) đăng ký** mỗi khi có sự kiện. Vấn đề là **URL của khách có thể chậm,
      sập, hoặc xử lý trùng** — ta không kiểm soát được phía nhận. Thiết kế bền:
      - **Payload có chữ ký (signed payload):** ký bằng HMAC với secret dùng chung; khách **xác minh chữ ký**
        để chắc event đến từ ta và không bị sửa. Kèm timestamp để chống **replay**.
      - **Thử lại + backoff + DLQ:** khách trả non-2xx hoặc timeout thì thử lại có giãn cách; quá hạn thì đẩy
        vào DLQ và báo cho khách (hoặc cho họ tự replay).
      - **Receiver idempotent:** gửi kèm **event_id** để phía khách tự khử trùng — vì ta ở at-least-once nên
        khách **phải** chịu được nhận lại.
      - **Cô lập theo khách (per-customer isolation) + theo dõi trạng thái:** một khách có endpoint chết không
        được làm nghẽn khách khác; ghi lại **đã gửi / đã nhận (delivery status)** để báo cáo và thử lại đúng chỗ.
  - id: b09
    type: quiz_fill
    graded: true
    prompt_md: |
      Điền thuật ngữ. Khi gửi webhook, ta ký payload bằng HMAC để phía khách xác minh nguồn gốc; vì hệ chỉ
      bảo đảm at-least-once nên phía khách phải tự chịu được nhận lại, tức receiver phải ______ (điền một từ
      tiếng Anh, nghĩa là "xử lý lại cho ra cùng kết quả, không hại gì").
    blanks:
      - accept: ["idempotent"]
        regex: '^\s*idempotent\s*$'
    explain_md: "Receiver phải **idempotent**: nhận cùng một event_id nhiều lần vẫn chỉ tạo một kết quả. Đó là mặt đối của việc hệ gửi at-least-once."
  - id: b10
    type: callout
    kind: interview
    md: |
      **Khung trả lời phỏng vấn (level 3 — full design).** Khi được hỏi "thiết kế notification system", đi
      theo đường ống và nêu rõ *vì sao từng mảnh*:
      1. **Ingest bền:** producer đẩy sự kiện vào, nhận ngay "đã nhận", không gọi provider đồng bộ.
      2. **Notification service:** áp **opt-out / quiet hours / rate limit** rồi **templating + localization**.
      3. **Per-channel queue + worker**, có **priority queue** cho OTP tách khỏi chiến dịch.
      4. **Reliability mỗi worker:** retry + backoff, **provider failover**, **DLQ**.
      5. **Idempotency/dedup** để biến at-least-once thành "người dùng thấy một lần".
      6. **Rate limit + batching/digest + fan-out theo lô** để chịu đột biến mà không spam.
      7. **Webhook cho bên ngoài:** signed payload, retries, **receiver idempotent**, DLQ, per-customer
         isolation, tracking trạng thái.
      Người phỏng vấn chấm bạn ở chỗ **nêu được bottleneck và đánh đổi** (vì sao at-least-once, vì sao tách
      kênh), không phải kể tên sản phẩm.
  - id: b11
    type: summary
    bullets_vi:
      - "Đường ống đa kênh: producer đẩy sự kiện → notification service (opt-out/quiet hours/rate limit + templating/localization) → per-channel queue + worker gọi provider (APNs/FCM/email/SMS)."
      - "Mỗi kênh một queue + worker riêng (vì tốc độ/giới hạn/lỗi khác nhau), kèm priority queue để OTP không kẹt sau chiến dịch."
      - "Mỗi worker bền: retry + exponential backoff (chỉ lỗi tạm thời), provider failover, và DLQ cho message chết; nền tảng chỉ bảo đảm at-least-once."
      - "Idempotency/dedup theo khoá (user, loại, event_id) biến at-least-once thành 'người dùng cảm nhận một lần'."
      - "Rate limit + batching/digest + fan-out theo lô để chịu đột biến và không spam; broadcast bung một yêu cầu thành hàng triệu việc nhỏ."
      - "Webhook delivery: payload ký HMAC, thử lại + DLQ, receiver idempotent, per-customer isolation và theo dõi delivery status."
