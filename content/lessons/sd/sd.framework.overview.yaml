id: sd.framework.overview
version: 1
status: published
title_vi: "Buổi phỏng vấn HLD (HLD interview): format, thời gian và giao tiếp"
est_minutes: 12
objectives_vi:
  - "Mô tả một buổi phỏng vấn thiết kế hệ thống mức cao (high-level design, HLD) 45 phút diễn ra thế nào và người chấm nhìn vào điều gì."
  - "Kể đúng thứ tự **7 bước** và chia được thời gian hợp lý cho một buổi 45 phút."
  - "Giao tiếp đúng cách: nói to suy nghĩ (think aloud), dẫn dắt buổi nói, và luôn biết mình đang ở bước nào."
blocks:
  - id: b01
    type: text
    md: |
      Phỏng vấn **thiết kế hệ thống mức cao (high-level design, HLD)** thường kéo dài **45-60 phút**.
      Bạn và người phỏng vấn (interviewer) cùng thiết kế một hệ thống lớn — kiểu "Thiết kế Twitter",
      "Thiết kế rút gọn link" — bằng cách **vừa hỏi, vừa vẽ các khối lớn** (server, database, cache,
      queue) và giải thích chúng nối với nhau ra sao. Đây **không phải** bài viết code: không ai chấm
      cú pháp, mà chấm **cách bạn suy nghĩ về một hệ thống**.

      Hãy hình dung nó như làm một bài văn có dàn ý: có mở bài (làm rõ đề), thân bài (dựng và đào sâu
      thiết kế) và kết bài (tóm tắt, rủi ro). Có hai kiểu buổi nói: **ứng viên dẫn dắt**
      (candidate-driven — bạn tự đi theo dàn ý) và **người phỏng vấn dẫn dắt** (interviewer-driven —
      họ hỏi tới đâu bạn trả lời tới đó). Buổi tốt thường là bạn chủ động dẫn, nhưng vẫn mềm dẻo theo
      câu hỏi của họ.
  - id: b02
    type: text
    md: |
      Dàn ý chuẩn là **7 bước** (học thuộc ý, đừng thuộc chữ):

      1. **Làm rõ yêu cầu (clarify requirements):** hỏi chức năng cần có, ai dùng, quy mô; chốt phạm vi.
      2. **Ước lượng (estimation):** ước con số — số người dùng, QPS (queries per second), dung lượng lưu trữ.
      3. **API:** định nghĩa vài endpoint chính (ví dụ `POST /tweet`, `GET /feed`).
      4. **Mô hình dữ liệu (data model):** các bảng/thực thể chính và quan hệ giữa chúng.
      5. **Sơ đồ tổng thể (high-level design):** vẽ các khối lớn và luồng dữ liệu đi qua chúng.
      6. **Đào sâu chỗ khó (deep dive):** chọn 1-2 điểm nghẽn (bottleneck) và đi sâu cách giải.
      7. **Trade-off và tóm tắt (wrap-up):** nêu đánh đổi, rủi ro còn lại và tóm tắt trong ~2 phút.

      Bước 1-2 là "mở bài" (hiểu đúng bài toán), bước 3-5 dựng khung, bước 6 là nơi ghi điểm chiều sâu,
      bước 7 gói lại. Đi tuần tự nhưng được phép quay lại nếu phát hiện thiếu yêu cầu.
  - id: b03
    type: callout
    kind: beginner
    md: |
      **Vì sao không viết code?** HLD quan tâm "các khối lớn nối với nhau thế nào" chứ không phải
      "hàm này viết ra sao". Bạn vẽ hộp và mũi tên, nói về server/DB/cache/queue — chi tiết thuật
      toán trong từng khối là chuyện của phỏng vấn code, không phải ở đây.
  - id: b04
    type: text
    md: |
      **Chia thời gian cho một buổi 45 phút** (con số gợi ý, không cứng nhắc):

      - Làm rõ yêu cầu: **~5 phút**
      - Ước lượng: **3-5 phút**
      - API + mô hình dữ liệu: **5-8 phút**
      - Sơ đồ tổng thể: **10-15 phút**
      - Đào sâu chỗ khó: **15-20 phút** (phần dài nhất — nơi ghi điểm chiều sâu)
      - Tóm tắt: **~2 phút** ở cuối

      Ý quan trọng: **đừng tiêu quá nhiều thời gian ở đầu**. Nếu hết 15 phút mà còn loay hoay làm rõ
      yêu cầu, bạn sẽ không kịp tới bước đào sâu — đúng chỗ ghi điểm nhất. Phần đào sâu nên chiếm
      khoảng một phần ba buổi.
  - id: b05
    type: quiz_mcq
    graded: true
    prompt_md: "Trong một buổi HLD 45 phút, bước nào **nên** chiếm nhiều thời gian nhất?"
    options:
      - {id: a, text_md: "Làm rõ yêu cầu, vì hiểu sai đề là hỏng cả buổi."}
      - {id: b, text_md: "Đào sâu chỗ khó (deep dive), khoảng 15-20 phút, vì đó là nơi thể hiện chiều sâu."}
      - {id: c, text_md: "Ước lượng, vì phải tính thật chính xác mọi con số."}
    answer: [b]
    explain_md: "Deep dive (15-20 phút) là phần dài nhất và là nơi ghi điểm chiều sâu. Làm rõ yêu cầu quan trọng nhưng chỉ ~5 phút (đừng để quá lâu). Ước lượng chỉ cần con số hợp lý, không cần chính xác tuyệt đối, nên 3-5 phút là đủ."
  - id: b06
    type: text
    md: |
      **Giao tiếp** quyết định phần lớn ấn tượng. Ba thói quen cần luyện:

      - **Nói to suy nghĩ (think aloud):** nói đang ở bước nào và vì sao chọn hướng này. Ví dụ: "Em
        đang ở bước ước lượng; em giả định 10 triệu người dùng mỗi ngày, ổn không ạ?".
      - **Dẫn dắt buổi nói (drive the interview):** chủ động đề xuất bước tiếp theo thay vì ngồi chờ
        hỏi; nhưng **hỏi để chốt giả định** trước khi chọn công nghệ.
      - **Kiểm tra lại với người phỏng vấn (check in):** sau mỗi bước, hỏi nhanh "chỗ này ổn chưa ạ,
        em đi tiếp nhé?" để bắt kịp gợi ý (hint) hoặc yêu cầu bị đổi.

      Xuyên suốt, bạn phải **biết mình đang ở bước nào**: nhìn vào dàn ý 7 bước mà tự định vị, để
      không nhảy lung tung và không tiêu hết giờ ở một chỗ.
  - id: b07
    type: callout
    kind: interview
    md: |
      **Người chấm nhìn gì?** Bốn tín hiệu: (1) bạn **hỏi đúng** để khoanh vùng bài toán không;
      (2) thấy được **các khối chính** không (breadth); (3) **đào sâu** được một điểm nghẽn không
      (depth); (4) **cân nhắc đánh đổi (trade-off)** không. Họ **không** chấm bạn thuộc bao nhiêu tên
      công nghệ. Vì vậy một thiết kế đơn giản mà bạn giải thích rõ "tại sao" luôn thắng một mớ
      buzzword không có lý do.
  - id: b08
    type: quiz_fill
    graded: true
    prompt_md: |
      Điền tên **bước đầu tiên** và **bước cuối cùng** trong dàn ý 7 bước của một buổi HLD.

      - Bước 1: ___  (khoanh vùng bài toán)
      - Bước 7: ___  (nêu đánh đổi và chốt lại)
    blanks:
      - accept: ["làm rõ yêu cầu", "clarify requirements", "làm rõ yêu cầu (clarify requirements)", "làm rõ yêu cầu / clarify requirements", "requirements"]
      - accept: ["trade-off và tóm tắt", "tóm tắt", "trade-off", "wrap-up", "tóm tắt và trade-off", "trade-off / tóm tắt"]
    explain_md: "7 bước mở đầu bằng **làm rõ yêu cầu** (hiểu đúng bài toán trước khi vẽ gì) và kết thúc bằng **trade-off và tóm tắt** (gói lại thiết kế, nêu đánh đổi và rủi ro trong ~2 phút)."
  - id: b09
    type: quiz_mcq
    graded: true
    prompt_md: "Bạn đang ở bước **sơ đồ tổng thể** thì người phỏng vấn hỏi 'nếu lưu lượng gấp 100 lần thì sao?'. Phản xạ **tốt nhất** là gì?"
    options:
      - {id: a, text_md: "Lờ câu hỏi và vẽ tiếp sơ đồ cho xong, vì mình đang theo dàn ý."}
      - {id: b, text_md: "Hiểu đây là gợi ý chuyển sang **đào sâu chỗ khó**: nói to suy nghĩ, chỉ ra vài điểm nghẽn mình sẽ kiểm tra rồi đi sâu vào đó."}
      - {id: c, text_md: "Liệt kê thật nhiều tên công nghệ nổi tiếng để chứng tỏ mình biết nhiều."}
    answer: [b]
    explain_md: "Câu hỏi 'gấp 100 lần' là tín hiệu mời bạn sang bước đào sâu (deep dive). Phản xạ tốt là định vị mình đang ở đâu, nói to suy nghĩ và chỉ ra điểm nghẽn để đi sâu. (a) bỏ qua gợi ý là lỗi nặng; (c) ném buzzword không có lý do chính là lỗi hay bị trừ điểm."
  - id: b10
    type: callout
    kind: warning
    md: |
      **Lỗi hay gặp (tránh ngay):** nhảy vào vẽ hộp khi chưa làm rõ yêu cầu; đưa thiết kế mà **không
      có con số** nào (bỏ bước ước lượng); **ném tên công nghệ** không giải thích vì sao; và bỏ qua
      yêu cầu người phỏng vấn vừa nêu. Mỗi lỗi này đều bắt nguồn từ việc **không bám dàn ý 7 bước** và
      **không biết mình đang ở đâu**.
  - id: b11
    type: summary
    bullets_vi:
      - "Buổi HLD 45-60 phút là nơi bạn vừa hỏi vừa vẽ các khối lớn của một hệ thống; chấm cách tư duy, không chấm code hay số lượng công nghệ."
      - "7 bước: làm rõ yêu cầu → ước lượng → API → mô hình dữ liệu → sơ đồ tổng thể → đào sâu chỗ khó → trade-off và tóm tắt."
      - "Chia 45 phút: yêu cầu ~5, ước lượng 3-5, API+dữ liệu 5-8, sơ đồ 10-15, đào sâu 15-20, tóm tắt ~2; đừng tiêu hết giờ ở phần đầu."
      - "Giao tiếp: nói to suy nghĩ, dẫn dắt buổi nói, kiểm tra lại với người phỏng vấn, và luôn biết mình đang ở bước nào."
      - "Người chấm nhìn: hỏi đúng không, thấy khối chính không, đào sâu được không, cân nhắc đánh đổi không."
