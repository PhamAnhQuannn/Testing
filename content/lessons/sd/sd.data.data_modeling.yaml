id: sd.data.data_modeling
version: 1
status: published
title_vi: "Mô hình dữ liệu theo access pattern: thiết kế bảng theo cách bạn sẽ đọc"
est_minutes: 14
objectives_vi:
  - "Thiết kế bảng/collection xuất phát từ **access pattern** (truy vấn hay gặp) thay vì từ sự 'sạch' lý thuyết."
  - "Cân nhắc **chuẩn hóa (normalization)** và **phi chuẩn hóa (denormalization)**: bớt join đổi lấy ghi khuếch đại và dị thường cập nhật."
  - "Chọn **index** đúng cho truy vấn, và dùng ràng buộc **UNIQUE** để chặn ghi trùng (một ghế một vé)."
blocks:
  - id: b01
    type: text
    md: |
      Có một cám dỗ khi học về cơ sở dữ liệu: vẽ các bảng cho thật "đẹp" và "sạch" trước, rồi mới
      nghĩ sẽ hỏi chúng thế nào. Trong thiết kế hệ thống (system design) ta làm **ngược lại**: bắt
      đầu từ **access pattern** — những câu truy vấn (query) mà ứng dụng sẽ chạy nhiều nhất — rồi
      xếp bảng và chỉ mục (index) sao cho đúng những câu đó chạy nhanh.

      Khẩu quyết: **"model cho cách bạn đọc, không model cho sự thuần khiết lý thuyết"** (model for
      how you read, not for abstract purity). Ví dụ với một app kiểu mạng xã hội, access pattern
      điển hình là: *"20 bài mới nhất của những người tôi theo dõi"*, *"số like của một bài"*,
      *"ai đã like bài này"*. Ba câu đó quyết định bạn cần những bảng nào, khóa nào, index nào — chứ
      không phải sơ đồ thực thể (entity-relationship) vẽ cho đẹp trên giấy.
  - id: b02
    type: text
    md: |
      Trước khi bàn truy vấn, nhắc lại cách nối các thực thể (entity) vì nó quyết định hình dạng bảng:
      - **Một-nhiều (one-to-many):** đặt **khóa ngoại (foreign key)** ở bên "nhiều". Một người có
        nhiều bài → `posts.user_id` trỏ về `users.id`. Không có bảng trung gian.
      - **Nhiều-nhiều (many-to-many):** cần một **bảng nối (junction table)**. "Theo dõi" là nhiều
        -nhiều (một người theo dõi nhiều người và bị nhiều người theo dõi) → bảng
        `follows(follower_id, followee_id)` với **khóa chính gồm hai cột** `PRIMARY KEY
        (follower_id, followee_id)`. "Like" cũng vậy: `likes(post_id, user_id)`.

      Nắm đúng hai hình dạng này là đã dựng được bộ xương của hầu hết schema. Phần còn lại là tối ưu
      cho truy vấn: index và (khi cần) phi chuẩn hóa.
  - id: b03
    type: quiz_mcq
    graded: true
    prompt_md: "Quan hệ 'theo dõi' (một người theo dõi nhiều người, và bị nhiều người theo dõi) nên mô hình hóa thế nào?"
    options:
      - {id: a, text_md: "Thêm cột `following_id` vào bảng `users` (một khóa ngoại) là đủ."}
      - {id: b, text_md: "Dùng **bảng nối** `follows(follower_id, followee_id)` với khóa chính gồm cả hai cột, vì đây là quan hệ nhiều-nhiều."}
      - {id: c, text_md: "Lưu một cột text `followers` chứa danh sách id các người theo dõi, phân tách bằng dấu phẩy."}
    answer: [b]
    explain_md: "Theo dõi là quan hệ **nhiều-nhiều** nên cần bảng nối; khóa chính hai cột vừa định danh một quan hệ vừa chặn theo dõi trùng. (a) một cột khóa ngoại chỉ mô tả được một-nhiều. (c) nhồi danh sách vào một cột text phá vỡ khả năng index và join, không hỏi ngược được 'ai theo dõi X'."
  - id: b04
    type: text
    md: |
      **Chuẩn hóa (normalization)** nghĩa là mỗi sự thật được lưu **đúng một chỗ**: tên tác giả nằm
      ở `users.name`, bài viết chỉ giữ `user_id`. Ưu điểm: sửa tên một lần là xong, không bao giờ
      mâu thuẫn. Nhược điểm: để hiển thị "bài viết + tên tác giả" phải **join** `posts` với `users`
      mỗi lần đọc — tốn kém khi đọc rất nhiều.

      **Phi chuẩn hóa (denormalization)** là **cố ý lưu trùng** một ít dữ liệu để khỏi join: ví dụ
      copy `author_name` thẳng vào bảng `posts`. Đọc nhanh hơn (một bảng là đủ), nhưng cái giá là:
      - **Ghi khuếch đại (write amplification):** đổi tên một người phải đi sửa **tất cả** bài của
        họ, không chỉ một dòng.
      - **Dị thường cập nhật (update anomaly):** nếu quên sửa một chỗ, dữ liệu trùng sẽ **mâu thuẫn**
        (bài cũ ghi tên cũ, bài mới ghi tên mới) — và không còn "nguồn sự thật" duy nhất.

      Quy tắc đánh đổi: **đọc nhiều hơn ghi rất nhiều, và join đang là nút cổ chai → cân nhắc phi
      chuẩn hóa**; còn lại hãy chuẩn hóa trước cho an toàn, tối ưu sau khi đo được là chậm thật.
  - id: b05
    type: quiz_mcq
    graded: true
    prompt_md: "Nhóm quyết định copy `author_name` vào bảng `posts` để trang feed khỏi join sang `users`. Cái giá chính của lựa chọn này là gì?"
    options:
      - {id: a, text_md: "Trang feed sẽ đọc chậm hơn vì phải quét nhiều cột hơn."}
      - {id: b, text_md: "Khi một người đổi tên, phải **sửa trùng ở mọi bài** của họ (ghi khuếch đại); quên sửa một chỗ là dữ liệu **mâu thuẫn** (dị thường cập nhật)."}
      - {id: c, text_md: "Không còn cách nào lấy được tên tác giả cho một bài viết."}
    answer: [b]
    explain_md: "Phi chuẩn hóa đổi đọc-nhanh lấy ghi-khó: tên bị lưu nhiều nơi nên mỗi lần đổi phải cập nhật tất cả và dễ sót gây mâu thuẫn. (a) ngược lại — mục đích chính là đọc nhanh hơn nhờ bỏ join. (c) sai, tên vẫn lấy được; vấn đề là giữ cho các bản sao nhất quán."
  - id: b06
    type: text
    md: |
      **Index** là cấu trúc phụ giúp DB tìm nhanh các dòng khớp điều kiện mà không phải quét cả bảng.
      Nguyên tắc: **tạo index cho đúng cột mà truy vấn lọc (`WHERE`) và sắp xếp (`ORDER BY`)**, theo
      đúng thứ tự cột. Với "20 bài mới nhất của một người", ta lọc theo `user_id` và sắp theo
      `created_at` giảm dần, nên index ghép hai cột `(user_id, created_at)` là khớp nhất.

      Phác thảo schema cho feed (chỉ là bản vẽ, không phải code chạy):

      ```sql
      -- users(id, name, ...)        -- nguồn sự thật cho tên
      -- posts(id, user_id, text, created_at)
      CREATE INDEX idx_posts_user_time ON posts (user_id, created_at);
      -- bảng nối many-to-many:
      -- follows(follower_id, followee_id)  PRIMARY KEY (follower_id, followee_id)
      -- likes(post_id, user_id)            PRIMARY KEY (post_id, user_id)
      ```

      Thứ tự cột trong index quan trọng: `(user_id, created_at)` phục vụ "lọc user rồi sắp theo
      thời gian"; đảo thành `(created_at, user_id)` sẽ **không** giúp câu đó. Mỗi index làm **ghi
      chậm hơn một chút** và tốn chỗ, nên chỉ tạo index cho truy vấn thật sự có — đừng index mọi cột.
  - id: b07
    type: quiz_mcq
    graded: true
    prompt_md: "Truy vấn hay gặp là `SELECT ... FROM posts WHERE user_id = ? ORDER BY created_at DESC LIMIT 20`. Index nào hợp nhất?"
    options:
      - {id: a, text_md: "`CREATE INDEX ... ON posts (created_at)` — vì câu truy vấn có `ORDER BY created_at`."}
      - {id: b, text_md: "`CREATE INDEX ... ON posts (user_id, created_at)` — lọc theo `user_id` trước rồi lấy sẵn thứ tự theo `created_at`."}
      - {id: c, text_md: "Không cần index; cứ để DB quét cả bảng rồi sắp xếp cho đơn giản."}
    answer: [b]
    explain_md: "Index ghép `(user_id, created_at)` khớp đúng dạng 'lọc một cột rồi sắp theo cột kia' nên DB nhảy thẳng tới các bài của user và đọc theo thứ tự thời gian. (a) chỉ index `created_at` vẫn phải lọc `user_id` sau, kém hiệu quả. (c) quét cả bảng là đúng thứ ta muốn tránh khi bảng lớn."
  - id: b08
    type: text
    md: |
      Có những quy tắc nghiệp vụ mà ứng dụng **không nên** tự canh bằng code — vì giữa lúc kiểm tra
      và lúc ghi, một request khác có thể chen vào (race condition). Dùng **ràng buộc UNIQUE** để
      chính DB từ chối bản ghi trùng:
      - **Một ghế một vé / một phòng một đêm:** `bookings(room_id, night, ...)` với
        `UNIQUE (room_id, night)`. Hai người cùng bấm đặt phòng 101 đêm 2026-10-27 → DB cho dòng đầu
        vào, **từ chối dòng thứ hai**, nên không bao giờ đặt trùng.
      - **Không like hai lần:** `likes(post_id, user_id)` lấy chính cặp đó làm khóa chính (khóa chính
        cũng là một dạng UNIQUE), nên một người chỉ like một bài một lần.

      Điểm cốt lõi: UNIQUE là **lá chắn ở tầng dữ liệu**, đúng kể cả khi có nhiều máy chủ ghi đồng
      thời — mạnh hơn và đáng tin hơn là "SELECT xem có chưa rồi mới INSERT" ở tầng ứng dụng.
  - id: b09
    type: quiz_mcq
    graded: true
    prompt_md: "Muốn chắc chắn hai người không thể đặt cùng một phòng trong cùng một đêm, cách đáng tin nhất là gì?"
    options:
      - {id: a, text_md: "Trước mỗi lần đặt, app chạy `SELECT` xem đêm đó còn trống không, nếu trống thì `INSERT`."}
      - {id: b, text_md: "Đặt `UNIQUE (room_id, night)` trên bảng `bookings` để DB tự từ chối dòng trùng thứ hai."}
      - {id: c, text_md: "Sắp xếp các yêu cầu đặt phòng theo thời gian rồi xử lý lần lượt trong app."}
    answer: [b]
    explain_md: "UNIQUE kiểm soát ngay tại tầng dữ liệu nên đúng cả khi nhiều request/nhiều máy ghi đồng thời. (a) có khoảng trống giữa SELECT và INSERT để một request khác chen vào (race condition) → vẫn đặt trùng. (c) xếp hàng trong app khó bảo đảm khi chạy nhiều tiến trình và không phải là bảo đảm của DB."
  - id: b10
    type: callout
    kind: interview
    md: |
      **Mẹo phỏng vấn.** Khi được cho vài truy vấn và yêu cầu "thiết kế schema", hãy làm theo đúng
      trình tự này và nói thành lời:
      1. **Liệt kê access pattern** trước — nhắc lại từng truy vấn sẽ phục vụ.
      2. **Dựng bảng theo quan hệ:** một-nhiều → khóa ngoại; nhiều-nhiều → bảng nối với khóa hai cột.
      3. **Chọn index cho từng truy vấn** theo cột `WHERE`/`ORDER BY`, nói rõ thứ tự cột.
      4. **Chỉ ra chỗ phi chuẩn hóa** (nếu đọc quá nhiều) và **nêu luôn cái giá** (ghi khuếch đại,
         dị thường cập nhật) — người phỏng vấn chấm bạn có *biết đánh đổi*, không chấm bạn thuộc cú pháp.
      5. **Dùng UNIQUE** cho mọi bất biến "không được trùng". Nói vì sao UNIQUE an toàn hơn kiểm tra
         ở tầng app.
  - id: b11
    type: text
    md: |
      Vài điều cần phân biệt cho sạch:
      - **Schema sạch ≠ schema đúng.** "Đúng" ở đây nghĩa là phục vụ nhanh các access pattern thật,
        không phải đạt chuẩn hóa cao nhất. Chuẩn hóa là mặc định an toàn; phi chuẩn hóa là tối ưu
        có chủ đích khi đo được join là nút cổ chai.
      - **Index không miễn phí.** Nó tăng tốc đọc nhưng làm chậm ghi và tốn chỗ; chỉ tạo cho truy
        vấn thật sự có.
      - **UNIQUE là bất biến, không phải tối ưu.** Nó bảo vệ tính đúng đắn (không đặt trùng), khác
        với index chỉ để chạy nhanh — dù UNIQUE thường cũng được DB hiện thực bằng một index.
  - id: b12
    type: summary
    bullets_vi:
      - "Thiết kế **ngược từ access pattern**: bắt đầu từ truy vấn hay gặp rồi mới suy ra bảng và index — model cho cách bạn đọc, không cho sự thuần khiết lý thuyết."
      - "Một-nhiều → **khóa ngoại** ở bên 'nhiều'; nhiều-nhiều → **bảng nối** với **khóa chính hai cột**."
      - "**Chuẩn hóa** (mỗi sự thật một chỗ, phải join để đọc) so với **phi chuẩn hóa** (lưu trùng, đọc nhanh nhưng **ghi khuếch đại** + **dị thường cập nhật**); chuẩn hóa trước, phi chuẩn hóa khi join là nút cổ chai."
      - "Tạo **index** đúng cột `WHERE`/`ORDER BY` theo đúng thứ tự (ví dụ `(user_id, created_at)`); index tăng tốc đọc nhưng làm chậm ghi."
      - "Dùng **UNIQUE** để DB tự chặn ghi trùng (một phòng một đêm: `UNIQUE (room_id, night)`) — an toàn hơn kiểm tra ở tầng app vì tránh race condition."
