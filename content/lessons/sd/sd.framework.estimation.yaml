id: sd.framework.estimation
version: 1
status: published
title_vi: "Ước lượng nhanh (back-of-envelope estimation): từ người dùng ra QPS, dung lượng, băng thông"
est_minutes: 12
objectives_vi:
  - "Nhớ và dùng được vài con số tròn (seconds/day ≈ 86.400 ≈ 10^5, bậc 1000 của KB/MB/GB/TB) để tính nhẩm."
  - "Đổi từ DAU và số thao tác ra **QPS** trung bình và đỉnh, từ số bản ghi x kích thước ra **dung lượng/năm**, và từ QPS x payload ra **băng thông**."
  - "Làm tròn mạnh tay và biến các con số thành **quyết định thiết kế**: cần cache, sharding hay CDN?"
blocks:
  - id: b01
    type: text
    md: |
      **Ước lượng nhanh (back-of-envelope estimation)** là tính nhẩm vài con số lớn để biết hệ thống
      cần cỡ nào — giống như nhẩm tiền chợ trước khi đi mua. Trong phỏng vấn, người ta không chấm bạn
      ra số *chính xác*; họ chấm bạn có **đặt đúng phép tính** và **rút ra quyết định** từ số đó không.
      Vài con số tròn cần thuộc lòng:
      - **Một ngày ≈ 86.400 giây ≈ 10^5 giây.** Làm tròn 10^5 cho dễ chia (sai số ~15%, chấp nhận được).
      - **Bậc 1000 cho đơn vị:** 1 KB = 10^3 byte, 1 MB = 10^6, 1 GB = 10^9, 1 TB = 10^12, 1 PB = 10^15.
      - **Cỡ dữ liệu quen tay:** 1 ký tự chữ cái ≈ 1 byte (B); một dòng văn bản kèm vài trường ≈ 500 B;
        một ảnh ≈ 1-2 MB.
      Mẹo: chỉ giữ **một chữ số có nghĩa** (one significant figure) và làm việc bằng **lũy thừa của 10**
      (powers of ten) — cộng/trừ số mũ nhanh hơn nhân số dài.
  - id: b02
    type: text
    md: |
      **Từ DAU ra QPS.** DAU (daily active users) là số người dùng mỗi ngày; QPS (queries per second)
      là số yêu cầu mỗi giây. Công thức:

      QPS trung bình = (DAU x số thao tác mỗi người mỗi ngày) / 86.400 ≈ (tổng thao tác/ngày) / 10^5.

      Tải không rải đều: giờ cao điểm (peak) dồn lại, nên **QPS đỉnh ≈ QPS trung bình x 2 đến 5** (chọn
      x3 nếu không có thông tin gì khác). Ví dụ 10 triệu (10^7) lượt ghi link mỗi ngày: QPS ghi trung bình
      = 10^7 / 10^5 = **100 ghi/s**, đỉnh x3 ≈ **300 ghi/s**. Nếu đọc gấp 100 lần ghi (read:write = 100:1),
      thì đọc trung bình ≈ 10^9 / 10^5 = **10.000 đọc/s**, đỉnh ≈ **30.000 đọc/s**.
  - id: b03
    type: quiz_fill
    graded: true
    prompt_md: |
      Một dịch vụ nhận **20 triệu (2 x 10^7) lượt ghi mỗi ngày**. Dùng 1 ngày ≈ 10^5 giây, **QPS ghi
      trung bình** là bao nhiêu **ghi/giây**? (Chỉ điền con số.)
    blanks:
      - accept: ["200", "200/s", "200 ghi/s", "~200"]
    explain_md: "2 x 10^7 chia 10^5 = 2 x 10^2 = **200 ghi/s**. Đây là trung bình; muốn QPS đỉnh thì nhân thêm 2-5 lần (ví dụ x3 ≈ 600 ghi/s)."
  - id: b04
    type: text
    md: |
      **Từ số bản ghi ra dung lượng (storage).** Công thức:

      Dung lượng = (số bản ghi mới mỗi ngày) x (kích thước 1 bản ghi) x (số ngày giữ) x (số bản sao / replication).

      Quay lại ví dụ 10^7 link mới/ngày, mỗi bản ghi 500 B:
      - Mỗi ngày: 10^7 x 500 B = 5 x 10^9 B = **5 GB/ngày**.
      - Mỗi năm: 5 GB x 365 ≈ 1.825 GB ≈ **1,8 TB/năm** (giữ 1 bản).
      - Nếu chép 3 bản (replication x3): ≈ **5,4 TB/năm**.

      Làm tròn 365 ≈ 400 cũng được (ra ~2 TB) — trong phỏng vấn con số cỡ "vài TB mỗi năm" là đủ để ra
      quyết định.
  - id: b05
    type: quiz_mcq
    graded: true
    prompt_md: "Dịch vụ sinh **10^7 bản ghi mới mỗi ngày**, mỗi bản ghi **500 B**, giữ **1 năm**, chép **1 bản**. Dung lượng xấp xỉ bao nhiêu?"
    options:
      - {id: a, text_md: "≈ 1,8 TB (5 GB/ngày x 365)."}
      - {id: b, text_md: "≈ 5 GB (chỉ tính một ngày, quên nhân số ngày giữ)."}
      - {id: c, text_md: "≈ 1,8 PB (nhầm bậc đơn vị lên 1000 lần)."}
    answer: [a]
    explain_md: "10^7 x 500 B = 5 x 10^9 B = 5 GB/ngày; x 365 ≈ 1.825 GB ≈ **1,8 TB**. (b) quên nhân số ngày giữ; (c) nhầm bậc đơn vị (TB = 10^12, không phải PB = 10^15)."
  - id: b06
    type: text
    md: |
      **Từ QPS ra băng thông (bandwidth).** Công thức:

      Băng thông ≈ QPS x kích thước mỗi phản hồi (payload).

      Ví dụ đọc đỉnh 30.000 đọc/s, mỗi phản hồi 500 B: băng thông ra (egress) ≈ 30.000 x 500 B =
      1,5 x 10^7 B/s = **15 MB/s** (≈ 120 Mb/s nếu đổi ra bit, x8). Với payload nhỏ như vậy, 15 MB/s một
      cụm máy/CDN xử lý nhẹ nhàng. Nhưng nếu payload là ảnh 2 MB thì cùng QPS đó băng thông nhảy lên hàng
      **GB/s** — và đó là lúc **CDN** trở thành bắt buộc.
  - id: b07
    type: callout
    kind: interview
    md: |
      **Mẹo phỏng vấn.** Nói to các **giả định** trước khi tính: "giả sử 10 triệu người, mỗi người 10
      thao tác/ngày, đọc gấp 100 lần ghi". Người phỏng vấn sửa giả định nếu cần — và bạn vẫn được điểm vì
      *phương pháp* đúng. Luôn **làm tròn mạnh tay** (86.400 → 10^5, 365 → ~400) và giữ một chữ số có
      nghĩa; đừng sa đà vào số lẻ. Kết thúc mỗi con số bằng một câu: "số này nói gì về thiết kế?".
  - id: b08
    type: text
    md: |
      **Biến con số thành quyết định.** Ước lượng chỉ có giá trị khi dẫn tới lựa chọn:
      - **Cần cache không?** Khi **đọc >> ghi** (read-heavy). Theo quy tắc **80/20**, ~20% dữ liệu nóng
        nhận ~80% lượt đọc, nên cache cỡ 20% dữ liệu đọc trong ngày là đã gánh được phần lớn tải đọc. Ví
        dụ đọc gấp 100 lần ghi ⇒ gần như chắc chắn nên có cache (Redis).
      - **Cần sharding không?** Khi **dung lượng hoặc tải ghi vượt sức một node**. Vài TB/năm thì một cụm
        database còn chứa được; hàng trăm TB tới PB, hoặc chục nghìn ghi/s, thì phải **chia dữ liệu (shard)**.
      - **Cần CDN không?** Khi **băng thông lớn hoặc người dùng ở nhiều vùng địa lý**. Payload nặng (ảnh,
        video) ở hàng trăm MB/s tới GB/s ⇒ đẩy ra **CDN** để phục vụ gần người dùng và giảm tải gốc.
  - id: b09
    type: quiz_mcq
    graded: true
    prompt_md: |
      Một dịch vụ rút gọn link: **100 ghi/s**, **10.000 đọc/s** (đọc gấp 100 lần ghi), dung lượng
      **≈ 1,8 TB/năm**. Quyết định nào được các con số này biện minh **tốt nhất**?
    options:
      - {id: a, text_md: "Thêm **cache** vì đọc gấp 100 lần ghi (read-heavy); chưa cần shard vì ~1,8 TB/năm một cụm database vẫn chứa được."}
      - {id: b, text_md: "**Shard** database ngay vì 1,8 TB/năm là quá lớn cho mọi database."}
      - {id: c, text_md: "Không cần gì thêm vì 100 ghi/s là nhỏ."}
    answer: [a]
    explain_md: "Tỷ lệ đọc:ghi = 100:1 là dấu hiệu kinh điển để **cache**; 1,8 TB/năm vẫn vừa một cụm nên chưa cần shard. (b) sai vì vài TB không quá lớn; (c) bỏ qua tải đọc 10.000/s — không có cache thì database è cổ."
  - id: b10
    type: callout
    kind: tip
    md: |
      **Bài tập 3 phút (mức thành thạo).** Cho một đề, chạy đủ bốn bước, mỗi bước một dòng: (1) **QPS** —
      đổi thao tác/ngày ÷ 10^5 ra trung bình, nhân 2-5 ra đỉnh; (2) **Dung lượng** — bản ghi/ngày x kích
      thước x số ngày giữ x số bản sao; (3) **Băng thông** — QPS đỉnh x payload; (4) **Quyết định** — số
      vừa tính đòi hỏi cache / shard / CDN gì. Làm tròn mạnh tay, giữ một chữ số có nghĩa, và luôn kết
      bằng câu quyết định.
  - id: b11
    type: summary
    bullets_vi:
      - "Thuộc vài số tròn: 1 ngày ≈ 10^5 giây; đơn vị bậc 1000 (KB=10^3 ... PB=10^15); dòng text ≈ 500 B, ảnh ≈ 1-2 MB. Giữ một chữ số có nghĩa, tính bằng lũy thừa của 10."
      - "QPS trung bình = tổng thao tác/ngày ÷ 10^5; QPS đỉnh ≈ trung bình x 2-5 (mặc định x3)."
      - "Dung lượng = bản ghi/ngày x kích thước x số ngày giữ x số bản sao; băng thông ≈ QPS x payload."
      - "Quy tắc 80/20: 20% dữ liệu nóng nhận ~80% lượt đọc ⇒ cache nhỏ gánh phần lớn tải đọc."
      - "Dịch con số ra quyết định: đọc >> ghi ⇒ **cache**; dung lượng/ghi vượt một node ⇒ **shard**; băng thông lớn hoặc đa vùng ⇒ **CDN**."
