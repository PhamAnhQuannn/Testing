id: sd.framework.api_data_model
version: 1
status: published
title_vi: "Bước định nghĩa API và data model: dịch yêu cầu thành cổng gọi và bảng dữ liệu"
est_minutes: 12
objectives_vi:
  - "Từ yêu cầu chức năng, chọn được 3-6 endpoint/RPC với resource, verb, tham số chính, phân trang (pagination) và idempotency."
  - "Suy ra data model (thực thể, khóa) từ **access pattern** — thiết kế bảng theo cách bạn **đọc** dữ liệu."
  - "Chọn đúng khóa chính (primary key), partition/shard key và index chính; nêu khi nào chọn quan hệ (relational) hay NoSQL ở mức tổng thể."
blocks:
  - id: b01
    type: text
    md: |
      Sau khi đã chốt **yêu cầu** (requirements), bước tiếp theo trong khung thiết kế là biến chúng
      thành hai thứ cụ thể: một **API** (danh sách "cổng" để bên ngoài gọi vào hệ thống) và một
      **data model** (cách tổ chức các bảng/collection để lưu dữ liệu). Cả hai đều **suy ra từ yêu
      cầu**, không bịa thêm: mỗi yêu cầu chức năng (functional requirement) sẽ đẻ ra 1-2 endpoint,
      và các truy vấn hay gặp nhất sẽ quyết định hình dạng các bảng. Mục tiêu bài này: phác được
      API và bảng đúng với cách dữ liệu được đọc, trong vài phút.
  - id: b02
    type: text
    md: |
      **API** là hợp đồng giữa client và hệ thống. Mỗi endpoint (hoặc RPC) gồm bốn phần cần nói rõ:
      - **Resource** (tài nguyên): danh từ số nhiều, ví dụ `/posts`, `/users`, `/orders`.
      - **Verb** (hành động): `GET` để đọc, `POST` để tạo, `PUT/PATCH` để sửa, `DELETE` để xóa.
      - **Tham số chính** (key params): dữ liệu vào. Với danh sách dài, dùng **phân trang
        (pagination)** bằng `cursor` + `limit` thay vì trả hết một lần.
      - **Idempotency**: với lệnh tạo/ghi (`POST`), gửi kèm `Idempotency-Key` để gọi lại cùng khóa
        **không tạo trùng** — quan trọng khi mạng chập chờn và client thử lại.

      Hai lưu ý: danh tính người gọi lấy từ **token đăng nhập**, không lấy từ body (tránh giả mạo);
      và chỉ cần **3-6 endpoint** cho một đề phỏng vấn, đừng liệt kê mọi CRUD.
  - id: b03
    type: text
    md: |
      **Data model** bắt đầu bằng liệt kê **thực thể (entity)** — các "danh từ" chính như user, post,
      follow — rồi nối **quan hệ** (một user có nhiều post). Nhưng cột và index thì không suy từ thực
      thể, mà suy từ **access pattern**: truy vấn hay gặp nhất, tức là **cách bạn đọc dữ liệu**
      (query the way you read). Ví dụ "lấy 20 bài mới nhất của những người tôi theo dõi" buộc bảng
      `posts` phải có cột `user_id` và `created_at`, cùng một index trên `(user_id, created_at)` để
      lấy nhanh theo người và theo thời gian. Thiết kế bảng cho **access pattern** trước, rồi mới
      tinh chỉnh — đừng thiết kế bảng "cho đẹp" rồi mới lo truy vấn.
  - id: b04
    type: callout
    kind: tip
    md: |
      Một lát cắt mẫu cho "news feed" (viết nhanh kiểu này trong phỏng vấn là đủ):

      ```
      API:
        POST /posts            body: {text}            -> tạo bài (Idempotency-Key)
        GET  /feed?cursor=&limit=20                    -> 20 bài mới nhất của người tôi follow
        POST /follows          body: {followee_id}     -> theo dõi 1 người

      Tables:
        users   (id PK, name, created_at)
        posts   (id PK, user_id FK, text, created_at)      index: (user_id, created_at)
        follows (follower_id, followee_id, created_at)      PK: (follower_id, followee_id)
      ```

      Ghi chú ngắn gọn `PK` (primary key), `FK` (foreign key) và `index` ngay cạnh bảng là đủ để
      người phỏng vấn thấy bạn thiết kế theo truy vấn.
  - id: b05
    type: quiz_mcq
    graded: true
    prompt_md: "Yêu cầu chính của một mạng xã hội là 'xem 20 bài mới nhất của những người tôi theo dõi'. Cách suy ra data model **đúng** là gì?"
    options:
      - {id: a, text_md: "Thiết kế bảng `posts` cho chuẩn hóa đẹp trước, rồi khi nào cần thì thêm index sau."}
      - {id: b, text_md: "Từ access pattern (đọc theo người + theo thời gian) suy ra bảng `posts(id, user_id, text, created_at)` với index `(user_id, created_at)`."}
      - {id: c, text_md: "Lưu toàn bộ feed đã dựng sẵn trong một cột JSON của bảng `users` để khỏi cần bảng `posts`."}
    answer: [b]
    explain_md: "Nguyên tắc 'query the way you read': access pattern (đọc theo `user_id` và sắp theo `created_at`) quyết định cột và index. (a) đảo ngược thứ tự — thiết kế bảng trước rồi mới lo truy vấn, dễ ra schema không chạy nhanh; (c) nhồi feed vào một cột JSON phá vỡ khả năng truy vấn/ghi từng bài và không mở rộng được."
  - id: b06
    type: text
    md: |
      Khi phác bảng, chốt sớm ba loại khóa:
      - **Khóa chính (primary key):** cột (hoặc bộ cột) xác định **duy nhất** một dòng, ví dụ
        `posts.id`. Mọi bảng cần một primary key.
      - **Partition key / shard key:** cột quyết định dòng nằm ở **máy/phân mảnh nào** khi dữ liệu
        bị chia (sharding). Chọn cột có trong **access pattern** chính và rải đều tải — ví dụ chia
        `posts` theo `user_id` để các bài của một người nằm cùng chỗ, đọc feed đỡ phải gom nhiều
        máy. Chọn sai partition key gây "điểm nóng" (hot partition).
      - **Index chính:** cột (hoặc bộ cột) dùng để tìm/sắp nhanh theo access pattern, ví dụ
        `(user_id, created_at)`. Index tăng tốc đọc nhưng làm ghi chậm hơn, nên chỉ thêm index cho
        **truy vấn nóng**.
  - id: b07
    type: quiz_mcq
    graded: true
    prompt_md: "**Partition key (shard key)** khác với **primary key** ở điểm cốt lõi nào?"
    options:
      - {id: a, text_md: "Partition key quyết định dòng nằm ở **máy/phân mảnh nào** khi chia dữ liệu; primary key xác định **duy nhất một dòng** trong bảng."}
      - {id: b, text_md: "Partition key luôn phải là một cột khác hẳn primary key và không bao giờ trùng nhau."}
      - {id: c, text_md: "Partition key dùng để tăng tốc đọc như index, còn primary key chỉ để hiển thị cho người dùng."}
    answer: [a]
    explain_md: "Primary key = định danh duy nhất một dòng; partition/shard key = cột quyết định dòng đi về phân mảnh nào, chọn theo access pattern để rải tải và tránh hot partition. (b) sai — partition key có thể trùng hoặc là một phần của primary key; (c) sai — tăng tốc đọc là việc của index, không phải primary key."
  - id: b08
    type: text
    md: |
      Chọn **loại kho** cho từng thực thể, nhưng ở mức tổng thể (HLD) chỉ cần một câu biện minh,
      đừng sa đà:
      - **Quan hệ (relational / SQL):** dữ liệu có **quan hệ rõ**, cần **giao dịch (transaction)** và
        truy vấn linh hoạt (join, lọc nhiều chiều). Ví dụ đơn hàng, thanh toán, quan hệ user-post.
      - **NoSQL:** cần **ghi/đọc rất lớn theo một khóa đã biết**, schema linh hoạt, dễ sharding; đổi
        lại join và giao dịch đa bảng yếu hơn. Ví dụ feed khổng lồ, log, dữ liệu key-value.

      Quy tắc thực dụng: mặc định **relational** vì nó linh hoạt và quen thuộc; chỉ đổi sang NoSQL
      khi **access pattern** đòi quy mô/tốc độ mà relational khó kham, và nói rõ đánh đổi đó.
  - id: b09
    type: quiz_fill
    graded: true
    prompt_md: "Điền thuật ngữ (tiếng Anh) còn thiếu: Trong API, với danh sách dài ta dùng ____ (cursor + limit) để không trả hết một lần; với lệnh tạo ta gửi kèm ____ để gọi lại không tạo trùng."
    blanks:
      - {accept: ["pagination", "phân trang", "phan trang"]}
      - {accept: ["idempotency key", "idempotency-key", "idempotency", "khóa idempotency", "khoa idempotency"]}
    explain_md: "**Pagination** (phân trang) chia danh sách dài thành trang nhỏ qua `cursor`/`limit`; **Idempotency key** bảo đảm gọi lại cùng một lệnh tạo không sinh bản ghi trùng — hai thứ gần như luôn cần khi định nghĩa API trong phỏng vấn."
  - id: b10
    type: callout
    kind: interview
    md: |
      **Mức 3 (bar phỏng vấn).** Khi được cho một yêu cầu, hãy phác trong **~8 phút**: (1) 3-6
      endpoint với resource/verb/tham số, có pagination và idempotency; (2) các bảng chính với
      thực thể và quan hệ; (3) chỉ rõ **primary key**, **partition key** và **index chính** khớp
      với access pattern. Trình tự nói: "Access pattern chính là ___, nên bảng ___ cần cột ___ và
      index ___; chia dữ liệu theo ___." Người phỏng vấn chấm việc bạn **gắn mỗi quyết định với một
      truy vấn**, không chấm việc kể tên công nghệ.
  - id: b11
    type: summary
    bullets_vi:
      - "API suy từ yêu cầu: mỗi endpoint/RPC nói rõ **resource**, **verb**, **tham số chính**, **pagination** (cursor/limit) và **idempotency**; chỉ cần 3-6 cái, danh tính lấy từ token."
      - "Data model suy từ **access pattern** — 'query the way you read': truy vấn hay gặp quyết định cột và index, không phải ngược lại."
      - "Chốt sớm ba khóa: **primary key** (định danh duy nhất một dòng), **partition/shard key** (dòng nằm ở máy nào khi chia dữ liệu), **index chính** (tăng tốc truy vấn nóng, làm ghi chậm hơn)."
      - "Relational (SQL) mặc định khi cần quan hệ/giao dịch/truy vấn linh hoạt; NoSQL khi cần quy mô theo một khóa đã biết và dễ sharding — nói rõ đánh đổi, đừng sa đà chi tiết trước khi có HLD."
      - "Mức 3: từ yêu cầu phác được API và bảng đúng access pattern, nêu primary key, partition key và index chính trong ~8 phút."
