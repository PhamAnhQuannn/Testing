id: sd.distributed.distributed_locks
version: 1
status: published
title_vi: "Khóa phân tán và lease (distributed locks): fencing token và khi nào nên bỏ khóa"
est_minutes: 13
objectives_vi:
  - "Giải thích vì sao khóa phân tán (distributed lock) khó: máy giữ khóa có thể treo hoặc chết giữa chừng."
  - "Mô tả lease (khóa có hạn TTL) và dùng fencing token (số chặn) để chặn máy giữ khóa cũ ghi đè."
  - "Nói được khi nào nên thay khóa bằng ghi có điều kiện / compare-and-set (CAS) cho cập nhật một khóa."
blocks:
  - id: b01
    type: text
    md: |
      **Khóa phân tán (distributed lock)** là một "ổ khóa" dùng chung cho nhiều máy, để đảm bảo tại một
      thời điểm **chỉ một máy** được làm một việc: chạy job định kỳ (gửi báo cáo 8h sáng), trừ tồn kho,
      hay làm leader. Khóa trong một tiến trình (mutex ngôn ngữ) chỉ chặn các luồng *trong cùng một máy*;
      nó không có tác dụng giữa nhiều máy, nên ta cần một kho chung (Redis, ZooKeeper, etcd) đóng vai ổ khóa.

      Điều làm khóa phân tán **khó** không phải là lấy khóa, mà là chuyện xảy ra *sau khi* một máy đã giữ
      khóa: máy đó có thể **treo hoặc chết** trong khi vẫn đang giữ khóa. Nếu khóa không bao giờ tự nhả,
      một máy chết sẽ chặn cả hệ vĩnh viễn (đây là vấn đề về **liveness** — hệ phải tiến được).
  - id: b02
    type: text
    md: |
      Lời giải cho máy chết là **lease**: một khóa **có hạn (TTL, time-to-live)**. Khi cấp khóa, kho
      gắn cho nó một thời hạn (ví dụ 30 giây); hết hạn, khóa **tự nhả**, nên một máy chết không giữ khóa
      mãi. Máy còn sống mà cần giữ lâu hơn phải **gia hạn (renew)** đều đặn trước khi hết hạn.

      Với Redis, lấy lease là một lệnh nguyên tử: SET lock id-của-tôi NX PX 30000 — trong đó "lock" là
      tên khóa, NX nghĩa là chỉ đặt nếu **chưa ai giữ**, còn PX 30000 cho khóa **tự hết hạn sau 30000 ms**
      (30 giây). Khi nhả khóa, máy chỉ được xóa nếu giá trị đúng là id của mình, để không lỡ xóa khóa mà
      người khác đã giành được sau khi mình hết hạn.
  - id: b03
    type: text
    md: |
      Nhưng lease sinh ra một ca sai **kinh điển** (xây trên mô hình lỗi — failures model đã học). Hãy đi
      theo timeline:
      - Máy A lấy lease 30 giây rồi chuẩn bị ghi vào một kho dữ liệu (ví dụ ghi file, cập nhật bản ghi).
      - A bị **GC pause** (dừng để dọn bộ nhớ) hoặc bị lịch hệ điều hành đẩy ra, treo quá 30 giây. A vẫn
        *tưởng* mình đang giữ khóa.
      - Lease của A hết hạn, tự nhả. Kho khóa cấp khóa cho máy **B**; B bắt đầu ghi.
      - A **tỉnh dậy**, không biết mình đã mất khóa, và tiếp tục lệnh ghi dở dang — **ghi đè** lên việc của B.

      Chỉ TTL thôi **không cứu** được ca này, vì A không hề biết nó đã treo quá hạn. Mấu chốt: không máy
      nào tin được đồng hồ hay "cảm giác còn giữ khóa" của chính nó.
  - id: b04
    type: text
    md: |
      Cách chặn đúng là **fencing token (số chặn)**: mỗi lần cấp khóa, kho khóa phát kèm một **số tăng dần
      đều (monotonic)** — lần cấp cho A là 33, lần cấp cho B (sau khi A hết hạn) chắc chắn lớn hơn, ví dụ 34.
      Máy phải **đính token vào mỗi lệnh ghi**, và **kho dữ liệu được bảo vệ** phải **từ chối mọi lệnh ghi
      có token nhỏ hơn token lớn nhất nó từng thấy**.

      Quay lại timeline: B ghi với token 34, kho ghi nhận "đã thấy 34". Khi A tỉnh dậy ghi với token 33 cũ,
      kho thấy 33 < 34 nên **từ chối** — A bị chặn, dữ liệu an toàn (**safety**). Điểm cốt lõi: an toàn
      không dựa vào việc A kịp nhận ra mình mất khóa, mà dựa vào **tài nguyên đích tự kiểm tra token**.
  - id: b05
    type: quiz_mcq
    graded: true
    prompt_md: |
      Một máy giữ lease, bị GC pause quá hạn; lease hết, máy khác giành được khóa. Vì sao **chỉ đặt TTL**
      là chưa đủ an toàn, và **fencing token** chặn lỗi bằng cách nào?
    options:
      - {id: a, text_md: "TTL đủ an toàn nếu đặt đủ dài; fencing token chỉ để lấy khóa nhanh hơn."}
      - {id: b, text_md: "Máy treo không biết mình đã quá hạn nên vẫn ghi; fencing token là số tăng dần cấp kèm khóa, và kho đích từ chối mọi ghi có token nhỏ hơn token lớn nhất đã thấy."}
      - {id: c, text_md: "Vì đồng hồ các máy luôn khớp nhau; fencing token đồng bộ đồng hồ giữa các máy."}
    answer: [b]
    explain_md: |
      Dù TTL dài bao nhiêu, một pause dài hơn vẫn khiến máy treo nghĩ nó còn khóa và ghi đè. Fencing token
      (số tăng dần, monotonic) để kho đích tự từ chối token cũ, nên an toàn không phụ thuộc máy treo có kịp
      nhận ra hay không. (a) sai: TTL dài chỉ giảm xác suất, không loại được lỗi. (c) sai: không thể giả
      định đồng hồ khớp, và fencing token không đồng bộ đồng hồ.
  - id: b06
    type: text
    md: |
      Kho khóa nên **mạnh** tới đâu? Một Redis đơn lẻ nhanh nhưng là một điểm chết; khóa có thể mất khi nó
      chết hoặc failover. Các kho khóa "nghiêm túc" được xây trên **consensus (đồng thuận)**: **ZooKeeper**
      và **etcd** dùng **ephemeral node** — một nút tồn tại chừng nào phiên của client còn sống; client chết,
      phiên đứt, nút (và khóa) tự biến mất. Ghi đi qua đa số (majority) nên khóa vẫn đúng khi vài máy chết.

      **Redlock** là thuật toán xin khóa trên **nhiều Redis độc lập** (coi là giữ được khi quá nửa số node
      đồng ý). Nó gây tranh cãi: tính an toàn của Redlock **dựa vào giả định đồng hồ các máy chạy đều và
      không có pause dài** — đúng những giả định mà mô hình lỗi nói là không nên tin. Kết luận thực dụng:
      dù dùng kho khóa nào, nếu cần an toàn tuyệt đối khi ghi, vẫn phải có **fencing token** ở tài nguyên đích.
  - id: b07
    type: quiz_mcq
    graded: true
    prompt_md: "Vì sao Redlock bị chê, và một lựa chọn khóa **an toàn hơn** khi cần đúng đắn cao là gì?"
    options:
      - {id: a, text_md: "Vì Redlock quá chậm; nên thay bằng một Redis đơn lẻ cho nhanh."}
      - {id: b, text_md: "Vì an toàn của Redlock phụ thuộc đồng hồ đều và không có pause dài; kho khóa dựa trên consensus (ZooKeeper/etcd) an toàn hơn, và vẫn nên kèm fencing token."}
      - {id: c, text_md: "Vì Redlock không có TTL; chỉ cần thêm TTL là hết mọi vấn đề an toàn."}
    answer: [b]
    explain_md: |
      Redlock suy luận an toàn từ giả định thời gian (đồng hồ đều, không treo lâu) — những thứ không chắc
      trong hệ phân tán. Kho khóa dựa trên consensus không dựa vào giả định đồng hồ đó để giữ an toàn, và
      fencing token vẫn là lớp chặn cuối ở tài nguyên đích. (a) sai: một Redis đơn lẻ kém an toàn hơn. (c)
      sai: TTL không chặn được ca máy treo quá hạn.
  - id: b08
    type: text
    md: |
      Nhiều khi câu trả lời tốt nhất là **không dùng khóa**. Khi thao tác chỉ là **cập nhật một khóa đơn**
      (one single-key update), hãy ưu tiên **ghi có điều kiện / compare-and-set (CAS)**, còn gọi là
      **điều khiển đồng thời lạc quan (optimistic concurrency)**: không khóa trước, cứ thử ghi kèm điều kiện
      "giá trị vẫn như lúc tôi đọc"; nếu có người chen vào trước, lệnh ghi **thất bại** và ta đọc lại rồi thử lại.

      Ví dụ trừ tồn kho: thay vì giữ khóa quanh sản phẩm, ghi có điều kiện dạng "giảm số lượng và tăng
      version lên 1, với điều kiện id = 7 **và** version vẫn = 5". Chỉ một người ghi thắng; người kia thấy
      version đã đổi và thử lại. Không có lease để gia hạn, không máy nào chết trong lúc giữ khóa, không cần
      fencing token — đơn giản và an toàn hơn **nếu** việc gói gọn trong một bản ghi / một khóa.
  - id: b09
    type: quiz_fill
    graded: true
    prompt_md: |
      Điền thuật ngữ (tiếng Anh) còn thiếu: Khi thao tác chỉ chạm **một khóa đơn**, thường nên thay khóa
      phân tán bằng ghi có điều kiện, tức ______ (viết tắt 3 chữ cái) theo kiểu điều khiển đồng thời lạc quan.
    blanks:
      - accept: ["CAS", "cas", "compare-and-set", "compare and set"]
    explain_md: |
      CAS (compare-and-set) ghi kèm điều kiện "giá trị chưa đổi kể từ lúc đọc"; hợp cho cập nhật một khóa
      đơn và tránh toàn bộ chi phí cùng rủi ro của lease (gia hạn, máy treo, fencing token).
  - id: b10
    type: callout
    kind: interview
    md: |
      **Mẹo phỏng vấn (mục tiêu mức 3).** Khi được yêu cầu "thiết kế một lock service", hãy nêu đủ: (1)
      API acquire / renew / release theo **lease có TTL**; (2) mỗi lần acquire cấp một **fencing token tăng
      dần**, và **tài nguyên đích từ chối token cũ** — đây là phần ăn điểm, vì nó chứng tỏ bạn hiểu an toàn
      không dựa vào đồng hồ hay máy treo; (3) đặt state khóa trong cụm **consensus** (ZooKeeper/etcd) chứ
      không phải một Redis đơn, và nêu được vì sao Redlock gây tranh cãi. Rồi **chủ động** nói: "nếu thao
      tác chỉ là cập nhật một khóa đơn, tôi sẽ **bỏ khóa** mà dùng **compare-and-set (CAS)**." Biết **khi
      nào không cần khóa** thường gây ấn tượng hơn là thiết kế khóa phức tạp.
  - id: b11
    type: summary
    bullets_vi:
      - "Khóa phân tán khó không phải ở lúc lấy khóa, mà ở chỗ máy giữ khóa có thể treo (GC pause) hoặc chết giữa chừng."
      - "Lease = khóa có hạn (TTL) nên máy chết tự nhả khóa; máy còn sống phải gia hạn (renew) trước khi hết hạn."
      - "Ca kinh điển: A treo quá lease, B giành khóa, A tỉnh dậy ghi đè. Chỉ TTL không cứu được."
      - "Fencing token (số tăng dần cấp kèm khóa) + tài nguyên đích từ chối token nhỏ hơn token lớn nhất đã thấy = an toàn không phụ thuộc đồng hồ."
      - "Kho khóa nên dựa trên consensus (ZooKeeper/etcd, ephemeral node); Redlock bị chê vì an toàn dựa vào giả định đồng hồ đều."
      - "Nếu thao tác chỉ cập nhật một khóa đơn, bỏ khóa và dùng compare-and-set (CAS) / ghi có điều kiện — đơn giản và an toàn hơn."
