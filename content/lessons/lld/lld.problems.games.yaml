      - {id: b, text_md: "Thêm nhánh `elif kind == 'bishop'` vào hàm kiểm tra nước đi của `Game`"}
      - {id: c, text_md: "Dùng một chuỗi `if` dài theo tên quân trong mỗi hàm của `Board`"}
    answer: [a]
    explain_md: "Đa hình đẩy luật đi vào từng class quân, nên quân mới là code mới chứ không phải sửa code cũ. Hai phương án còn lại làm lõi phình ra mỗi khi thêm quân."
  - id: q05
    type: predict_output
    code: |
      def run_len(line, mark):
          best = cur = 0
          for x in line:
              cur = cur + 1 if x == mark else 0
              best = max(best, cur)
          return best


      row = list("XXOXXX.")
      print(run_len(row, "X"), run_len(row, "O"), run_len(row, "X") >= 4)
    expected_output: |
      3 1 False
    explain_md: "Chuỗi X bị O cắt: đoạn đầu dài 2, đoạn sau dài 3 nên dài nhất là 3. O chỉ có một. Với k = 4 thì 3 chưa đủ thắng nên `False`."
  - id: ex_run
    type: code_exercise
    md: |
      `longest_run(line, mark)` trả độ dài đoạn **liên tiếp** dài nhất của `mark` trong list `line` (nền tảng của k-in-a-row).
      Bản dưới đây đếm tổng số quân, không đòi liên tiếp. Hãy sửa.
    entry: longest_run
    starter: |
      def longest_run(line, mark):
          return sum(1 for x in line if x == mark)
    guidance_md: |
      - Thử `longest_run(["X", "X", "O", "X", "X", "X", "."], "X")`: đáp án `3`, code trả `5`.
      - Giữ bộ đếm hiện tại, gặp quân khác thì về 0, và nhớ giá trị lớn nhất.
    hints:
      - level: nudge
        md: "Tổng quân không phân biệt đoạn liền hay bị cắt. Cần theo dõi đoạn đang chạy."
      - level: approach
        md: "Dùng `cur` và `best`: nếu `x == mark` thì `cur += 1` rồi cập nhật `best`, ngược lại `cur = 0`."
      - level: near_solution
        md: "`cur = cur + 1 if x == mark else 0` rồi `best = max(best, cur)`; trả `best`."
    tests:
      - {args: [["X", "X", "O", "X", "X", "X", "."], "X"], expected: 3}
      - {args: [["X", "X", "O", "X", "X", "X", "."], "O"], expected: 1}
      - {args: [[".", "."], "X"], expected: 0}
      - {args: [[], "X"], expected: 0}
    solution: |
      def longest_run(line, mark):
          best = cur = 0
          for x in line:
              cur = cur + 1 if x == mark else 0
              best = max(best, cur)
          return best
