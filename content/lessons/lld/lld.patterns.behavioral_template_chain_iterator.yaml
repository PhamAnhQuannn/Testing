      - "ATM 1300 qua 500, 200, 100: phát 2, 1, 1 tờ; cũng dùng cho logger nhiều mức và middleware."
      - "Template Method: lớp cha cố định thứ tự bước, lớp con ghi đè hook; dùng kế thừa (Strategy dùng composition)."
      - "Iterator: duyệt bằng for không lộ cấu trúc bên trong; trong Python dùng __iter__ hoặc generator (lazy)."
