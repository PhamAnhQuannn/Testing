  - id: ex_order
    type: code_exercise
    md: |
      `thu_tu(start, yeu_cau, huong=1)` trả list các tầng theo thứ tự phục vụ của LOOK, bắt đầu ở `start` với chiều `huong`
      (tầng `start` không được tính là một lần phục vụ). Hàm `tang_ke` đã có sẵn. Bản dưới quên bỏ tầng `start` khỏi
      tập yêu cầu nên trả thừa chính tầng đó. Hãy sửa.
    entry: thu_tu
    starter: |
      def tang_ke(hien_tai, huong, yeu_cau):
          tren = sorted(t for t in yeu_cau if t > hien_tai)
          duoi = sorted((t for t in yeu_cau if t < hien_tai), reverse=True)
          if huong == 1:
              if tren:
                  return tren[0]
              if duoi:
                  return duoi[0]
          else:
              if duoi:
                  return duoi[0]
              if tren:
                  return tren[0]
          return hien_tai


      def thu_tu(start, yeu_cau, huong=1):
          con_lai = set(yeu_cau)
          hien, out = start, []
          while con_lai:
              nxt = tang_ke(hien, huong, con_lai)
              if (huong == 1 and nxt < hien) or (huong == -1 and nxt > hien):
                  huong = -huong
              con_lai.discard(nxt)
              out.append(nxt)
              hien = nxt
          return out
    guidance_md: |
      - Thử `thu_tu(4, [4, 4])`: đáp án `[]`, code trả `[4]`.
      - Thử `thu_tu(3, [5, 1, 7])`: đáp án `[5, 7, 1]`.
    hints:
      - level: nudge
        md: "Tầng `start` nằm trong `con_lai`; `tang_ke` thấy nó thì trả gì?"
      - level: approach
        md: "Bỏ `start` khỏi `con_lai` ngay sau khi tạo set."
      - level: near_solution
        md: "Thêm `con_lai.discard(start)` trước vòng `while`."
    tests:
      - {args: [3, [5, 1, 7]], expected: [5, 7, 1]}
      - {args: [8, [2, 5, 9], -1], expected: [5, 2, 9]}
      - {args: [4, [4, 4]], expected: []}
      - {args: [5, [8, 2, 6, 3]], expected: [6, 8, 3, 2]}
      - {args: [1, [3, 2, 1]], expected: [2, 3]}
    solution: |
      def tang_ke(hien_tai, huong, yeu_cau):
          tren = sorted(t for t in yeu_cau if t > hien_tai)
          duoi = sorted((t for t in yeu_cau if t < hien_tai), reverse=True)
          if huong == 1:
              if tren:
                  return tren[0]
              if duoi:
                  return duoi[0]
          else:
              if duoi:
                  return duoi[0]
              if tren:
                  return tren[0]
          return hien_tai


      def thu_tu(start, yeu_cau, huong=1):
          con_lai = set(yeu_cau)
          con_lai.discard(start)
          hien, out = start, []
          while con_lai:
              nxt = tang_ke(hien, huong, con_lai)
              if (huong == 1 and nxt < hien) or (huong == -1 and nxt > hien):
                  huong = -huong
              con_lai.discard(nxt)
              out.append(nxt)
              hien = nxt
          return out
