id: lld.problems.elevator
version: 1
status: published
title_vi: "Thang máy"
est_minutes: 15
objectives_vi:
  - "Mô hình thang máy là máy trạng thái (idle / moving up / moving down / door open) và nêu sự kiện chuyển trạng thái."
  - "Lưu các tầng được gọi trong một set và chọn tầng kế bằng phần trên / phần dưới tầng hiện tại."
  - "Cài LOOK: phục vụ mọi tầng theo chiều hiện tại, hết thì đảo chiều; phân biệt với SCAN thuần."
  - "Tách bộ điều phối (dispatcher) bằng Strategy và kể các ca đặc biệt: quá tải, cửa mở, dừng khẩn cấp, nhiều thang."
blocks:
  - id: s_states
    type: section
    title_vi: "Trạng thái và chọn tầng kế (LOOK)"
    summary_vi: "Thang là máy trạng thái; set tầng được gọi và quy tắc LOOK quyết định tầng kế."
    exercise_ref: ex_next
  - id: t01
    type: text
    md: |
      **Elevator** là bài **state machine** (máy trạng thái) cộng một bài **scheduling** (chọn thứ tự phục vụ).

      Trạng thái: `Idle` (đứng yên), `MovingUp`, `MovingDown`, `DoorOpen`. Sự kiện (bấm tầng, đến tầng, hết giờ
      mở cửa) làm thang chuyển trạng thái: `Idle` + có yêu cầu thì sang `MovingUp/Down`; đến tầng được gọi thì sang
      `DoorOpen`; đóng cửa thì tiếp tục chạy hoặc về `Idle` nếu hết yêu cầu.

      **Hàng đợi yêu cầu**: giữ các tầng đang được gọi trong một **set** (trùng thì tự gộp). Tầng kế tiếp lấy từ
      hai phần: `tren` là các tầng lớn hơn tầng hiện tại (lấy nhỏ nhất), `duoi` là các tầng nhỏ hơn (lấy lớn nhất).
      **Luôn `sorted(...)` trước khi chọn**, đừng dựa vào thứ tự duyệt set.

      **SCAN/LOOK** (giống xe buýt): đi theo một chiều, phục vụ mọi tầng được gọi trên đường; hết yêu cầu theo chiều
      đó thì **đảo chiều**. LOOK quay ngay tại tầng yêu cầu **xa nhất**; SCAN thuần còn đi tới tận tầng cuối rồi
      mới quay. Ví dụ: ở tầng 3 đi lên, yêu cầu {5, 1, 7} thì phục vụ 5, 7 rồi quay xuống 1.
  - id: b01
    type: code_sample
    lang: python
    runnable: true
    code: |
      def tang_ke(hien_tai, huong, yeu_cau):
          tren = sorted(t for t in yeu_cau if t > hien_tai)
          duoi = sorted((t for t in yeu_cau if t < hien_tai), reverse=True)
          if huong == 1:
              if tren:
                  return tren[0]
              if duoi:
                  return duoi[0]
          else:
              if duoi:
                  return duoi[0]
              if tren:
                  return tren[0]
          return hien_tai


      print(tang_ke(3, 1, {5, 1, 7}))
      print(tang_ke(7, 1, {1, 4}))
      print(tang_ke(4, -1, {6, 9}))
      print(tang_ke(2, 1, set()))
    expected_output: |
      5
      4
      6
      2
  - id: q01
    type: predict_output
    code: |
      class Lift:
          def __init__(self, floor):
              self.floor = floor
              self.up = True
              self.todo = set()

          def call(self, f):
              self.todo.add(f)

          def step(self):
              if not self.todo:
                  return self.floor
              s = sorted(self.todo)
              above = [f for f in s if f > self.floor]
              below = [f for f in s if f < self.floor]
              if self.up and not above:
                  self.up = False
              elif not self.up and not below:
                  self.up = True
              self.floor = above[0] if self.up else below[-1]
              self.todo.discard(self.floor)
              return self.floor


      lift = Lift(5)
      for f in (8, 2, 6, 3):
          lift.call(f)
      print(lift.step())
      print(lift.step())
      print(lift.step())
      lift.call(1)
      print(lift.step())
      print(lift.step())
      print(lift.step())
      print(lift.step())
    expected_output: |
      6
      8
      3
      2
      1
      1
      1
    explain_md: "Ở tầng 5 đi lên với {8, 2, 6, 3}: phục vụ 6, 8. Hết tầng trên nên đảo chiều xuống: gần nhất là 3, rồi 2. Thêm tầng 1 thì phục vụ 1. Hai lần `step` cuối không còn yêu cầu nên giữ nguyên tầng 1."
  - id: q02
    type: quiz_mcq
    prompt_md: "Thang đang ở tầng 3 đi lên, các tầng được gọi là {5, 1, 7}. Theo LOOK, thứ tự phục vụ là gì?"
    options:
      - {id: a, text_md: "5, 7, rồi đảo chiều xuống 1"}
      - {id: b, text_md: "5, 1, 7 (theo thứ tự được gọi)"}
      - {id: c, text_md: "1, 5, 7 (từ thấp lên cao)"}
