    explain_md: "Đi lên phục vụ mọi tầng phía trên (5 rồi 7); hết tầng phía trên mới đảo chiều và phục vụ 1."
  - id: q03
    type: quiz_fill
    prompt_md: "LOOK quay đầu ngay tại tầng yêu cầu ___ nhất theo chiều đang đi (một từ tiếng Việt), còn SCAN thuần đi tới tận tầng cuối."
    blanks: [{accept: ["xa", "Xa"]}]
    explain_md: "LOOK chỉ đi tới tầng được gọi **xa** nhất rồi quay, không đi hết toà nhà như SCAN."
  - id: ex_next
    type: code_exercise
    md: |
      Hoàn thành `tang_ke(hien_tai, huong, yeu_cau)`: `huong` là `+1` (lên) hoặc `-1` (xuống), `yeu_cau` là tập các tầng.
      Trả tầng gần nhất theo chiều hiện tại; không còn thì đảo chiều và trả tầng gần nhất ở chiều ngược lại;
      yêu cầu rỗng (hoặc chỉ có tầng hiện tại) trả `hien_tai`. Bản dưới mới xử lý trường hợp đi lên còn tầng phía trên.
    entry: tang_ke
    starter: |
      def tang_ke(hien_tai, huong, yeu_cau):
          tren = sorted(t for t in yeu_cau if t > hien_tai)
          duoi = sorted((t for t in yeu_cau if t < hien_tai), reverse=True)
          if huong == 1 and tren:
              return tren[0]
          # TODO: các trường hợp còn lại
          return hien_tai
    guidance_md: |
      - Thử `tang_ke(3, 1, {1})`: đáp án `1` (đảo chiều), code trả `3`.
      - Chia theo `huong`: chiều ưu tiên trước, chiều còn lại sau, cuối cùng `hien_tai`.
    hints:
      - level: nudge
        md: "Khi đi lên mà `tren` rỗng, thang nên làm gì? Còn khi đi xuống thì sao?"
      - level: approach
        md: "Viết hai nhánh theo `huong`: nhánh lên thử `tren` rồi `duoi`; nhánh xuống thử `duoi` rồi `tren`."
      - level: near_solution
        md: "`if huong == 1:` thử `tren[0]` rồi `duoi[0]`; `else:` thử `duoi[0]` rồi `tren[0]`; cuối cùng `return hien_tai`."
    tests:
      - {args: [3, 1, [5, 1, 7]], expected: 5}
      - {args: [7, 1, [1, 4]], expected: 4}
      - {args: [4, -1, [6, 9]], expected: 6}
      - {args: [4, -1, [2, 6]], expected: 2}
      - {args: [2, 1, []], expected: 2}
    solution: |
      def tang_ke(hien_tai, huong, yeu_cau):
          tren = sorted(t for t in yeu_cau if t > hien_tai)
          duoi = sorted((t for t in yeu_cau if t < hien_tai), reverse=True)
          if huong == 1:
              if tren:
                  return tren[0]
              if duoi:
                  return duoi[0]
          else:
              if duoi:
                  return duoi[0]
              if tren:
                  return tren[0]
          return hien_tai
  - id: s_dispatch
    type: section
    title_vi: "Dispatcher, nhiều thang và ca đặc biệt"
    summary_vi: "Tách thuật toán chọn tầng bằng Strategy, rồi kể các ca biên của thang thật."
    exercise_ref: ex_order
  - id: t02
    type: text
    md: |
      **Dispatcher** (bộ điều phối) là class chọn tầng kế bằng một **Strategy**: `Elevator` giữ `scheduler` và gọi
      `scheduler.next(current, direction, pending)`. `LookScheduler`, `NearestFirstScheduler`, `FifoScheduler` cùng
      interface, đổi thuật toán **không sửa** class `Elevator` (OCP).

      **Nhiều thang**: thêm một lớp phía trên chọn *thang nào* nhận yêu cầu (gần nhất, ít việc nhất) rồi đưa yêu cầu
      cho thang đó; mỗi thang vẫn tự chạy LOOK.

      **Ca đặc biệt** cần quyết định rõ trong code:
      - **Quá tải** (overload): không đóng cửa / không chạy, báo qua trạng thái hoặc giá trị trả về.
      - **Cửa đang mở**: yêu cầu mới ở tầng hiện tại chỉ gia hạn cửa; chỉ chạy khi cửa đã đóng.
      - **Dừng khẩn cấp** (emergency stop): chuyển sang trạng thái riêng, giữ nguyên set yêu cầu.
      - Yêu cầu **trùng** hoặc ở **tầng hiện tại**: bỏ qua; tầng ngoài phạm vi toà nhà: từ chối.
  - id: q04
    type: quiz_mcq
    prompt_md: "Muốn thêm thuật toán `NearestFirst` mà không sửa class `Elevator`, nên làm gì?"
    options:
