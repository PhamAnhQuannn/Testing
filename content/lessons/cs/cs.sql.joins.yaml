      - "INNER JOIN loại dòng không khớp; LEFT JOIN giữ mọi dòng bảng trái với NULL cho phần không khớp."
      - "Tìm 'chưa có' bằng LEFT JOIN ... WHERE cột_phải IS NULL (không dùng = NULL)."
      - "CROSS JOIN, thiếu ON hoặc khoá trùng làm số dòng nhân lên; luôn kiểm tra số dòng và thêm ORDER BY."
