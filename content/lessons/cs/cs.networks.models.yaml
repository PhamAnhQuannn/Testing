    type: summary
    bullets_vi:
      - "OSI có 7 tầng: Physical, Data Link, Network, Transport, Session, Presentation, Application; TCP/IP gộp thành 4 tầng (Link, Internet, Transport, Application)."
      - "Giao thức tiêu biểu: HTTP/DNS (Application), TLS (Presentation), TCP/UDP (Transport), IP/ICMP (Network), Ethernet/MAC (Data Link), WiFi/cáp (Physical)."
      - "Encapsulation thêm header từ trên xuống, decapsulation bóc từ dưới lên; header tầng thấp nằm ngoài cùng trên dây."
      - "Switch làm việc ở tầng 2 (MAC), router ở tầng 3 (IP); OSI là mô hình khái niệm, internet thật chạy TCP/IP."
