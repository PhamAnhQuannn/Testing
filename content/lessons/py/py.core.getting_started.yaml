id: py.core.getting_started
version: 1
status: published
title_vi: "Bắt đầu: chạy Python, cú pháp và quy ước (getting started)"
est_minutes: 10
objectives_vi:
  - "Chạy code Python trong REPL và bằng file .py."
  - "Viết đúng thụt dòng (indentation), dùng comment, print và import math."
  - "Đọc traceback để chỉ ra dòng bị lỗi và loại lỗi."
blocks:
  - id: b01
    type: text
    md: |
      **Python** chạy code nhờ một chương trình tên là **interpreter** (trình thông dịch): nó đọc
      từng dòng code của bạn và thực hiện ngay. Có hai cách dùng interpreter:

      - **REPL**: gõ `python` trong terminal, thấy dấu nhắc `>>>`, rồi gõ *từng dòng* và thấy kết
        quả ngay. Rất hợp để thử nhanh.
      - **Script**: lưu code vào file `hello.py`, rồi chạy cả file bằng `python hello.py`. Đây là
        cách bạn sẽ dùng khi viết chương trình thật.
  - id: b02
    type: code_sample
    lang: python
    runnable: true
    code: |
      """Chương trình đầu tiên (docstring: mô tả file)."""
      # Dòng bắt đầu bằng # là comment, Python bỏ qua
      print("Xin chào, Python!")
      print("Tổng:", 2 + 3)
    expected_output: |
      Xin chào, Python!
      Tổng: 5
  - id: b03
    type: quiz_mcq
    prompt_md: "Bạn muốn lưu code vào file rồi chạy lại nhiều lần. Nên dùng cách nào?"
    options:
      - {id: a, text_md: "REPL: gõ từng dòng sau dấu `>>>`"}
      - {id: b, text_md: "Script: lưu thành `hello.py` rồi chạy `python hello.py`"}
      - {id: c, text_md: "Gõ `python -m` rồi dán code vào"}
    answer: [b]
    explain_md: "REPL không lưu lại code. Script là file `.py` nên chạy lại bao nhiêu lần cũng được."
  - id: b04
    type: text
    md: |
      Python dùng **thụt dòng (indentation)** để chia khối code: các dòng cùng khối phải thụt vào
      *cùng một mức* (quy ước **PEP 8**: 4 dấu cách). Khối bắt đầu sau dòng kết thúc bằng dấu
      `:` như `if ...:` hoặc `else:`. Thụt sai là lỗi, hoặc tệ hơn là chạy sai ý bạn.

      Vài quy ước **PEP 8** khác: tên biến viết `chu_thuong_gach_duoi` (snake_case), mỗi dòng
      không quá khoảng 79 ký tự. **Comment** bắt đầu bằng `#`; **docstring** là chuỗi
      `"""..."""` mô tả file hoặc hàm. `print(...)` in giá trị ra màn hình.

      Ví dụ ngay dưới dùng hai thứ bạn sẽ học kỹ sau: một **biến** lưu một giá trị (`x = 2`), và
      `if/else` để chọn giữa hai khối code. Ở đây chúng chỉ dùng để minh họa việc thụt dòng đánh
      dấu một khối; câu lệnh điều kiện sẽ được dạy đầy đủ ở `py.core.conditionals`.
  - id: b05
    type: predict_output
    code: |
      x = 2
      if x > 3:
          print("A")
      else:
          print("B")
          print("C")
      print("D")
    expected_output: |
      B
      C
      D
    explain_md: "`x > 3` sai nên chạy khối `else`: in B và C (cùng thụt vào). `print(\"D\")` không thụt nên luôn chạy."
  - id: b06
    type: code_sample
    lang: python
    runnable: true
    code: |
      import math  # nạp module có sẵn của Python (stdlib)

      print(math.sqrt(16))
      print(math.ceil(2.1), math.floor(2.9))
    expected_output: |
      4.0
      3 2
  - id: b07
    type: text
    md: |
      Khi code lỗi, Python in một **traceback**. Cách đọc: nhìn **dòng cuối cùng** để biết *loại
      lỗi* và thông báo, rồi nhìn dòng `File ..., line N` ngay phía trên để biết *dòng nào* bị lỗi.

      ```
      Traceback (most recent call last):
        File "tinh.py", line 5, in <module>
          print(10 / 0)
      ZeroDivisionError: division by zero
      ```

      Ở đây lỗi là `ZeroDivisionError` (chia cho 0) tại dòng 5 của file `tinh.py`.
  - id: b08
    type: quiz_mcq
    prompt_md: |
      Traceback sau nói gì?

      ```
      Traceback (most recent call last):
        File "bai1.py", line 3, in <module>
          print(tong)
      NameError: name 'tong' is not defined
      ```
    options:
      - {id: a, text_md: "Lỗi `NameError` ở dòng 3 của `bai1.py`: biến `tong` chưa được tạo"}
      - {id: b, text_md: "Lỗi `print` ở dòng 1"}
      - {id: c, text_md: "Lỗi thụt dòng ở file `tong`"}
    answer: [a]
    explain_md: "Loại lỗi nằm ở dòng cuối (`NameError`), số dòng nằm ở `line 3`. Python chưa biết tên `tong`."
  - id: b09
    type: code_exercise
    md: |
      Viết `circle_area(r)` trả về diện tích hình tròn bán kính `r`, làm tròn 2 chữ số thập phân.
      Dùng `math.pi` và `round(x, 2)`. (Dòng `def ...:` tạo một hàm; phần thân của hàm phải thụt
      vào 4 dấu cách, và `return` trả kết quả về.)

      Xem trước về hàm: `def` tạo một **hàm** (function), tức một khối code có tên, nhận đầu vào
      (tham số, ở đây là `r`) và trả kết quả bằng `return`. `pass` chỉ là chỗ giữ chỗ, bạn thay nó
      bằng code của mình. "Gọi" hàm nghĩa là chạy nó với một giá trị, ví dụ `circle_area(2)`. Hàm
      sẽ được học đầy đủ ở `py.functions`.
    entry: circle_area
    starter: |
      import math


      def circle_area(r):
          # TODO: dùng math.pi và round(..., 2)
          pass
    tests:
      - {args: [1], expected: 3.14}
      - {args: [2], expected: 12.57}
      - {args: [0], expected: 0.0}
      - {args: [10], expected: 314.16}
    hint_md: "Diện tích = `math.pi * r * r`; bọc kết quả trong `round(..., 2)`."
    solution: "import math\n\n\ndef circle_area(r):\n    return round(math.pi * r * r, 2)\n"
  - id: b10
    type: problem_ref
    problem_id: add-two-integers
  - id: b11
    type: summary
    bullets_vi:
      - "REPL (`>>>`) để thử nhanh từng dòng; script là file `.py` chạy bằng `python file.py`."
      - "Thụt dòng định nghĩa khối code: 4 dấu cách, dòng kết thúc bằng `:` mở khối mới."
      - "Comment bắt đầu bằng `#`, docstring dùng `\"\"\"...\"\"\"`; tên biến theo snake_case (PEP 8)."
      - "`import math` nạp thư viện chuẩn: `math.sqrt`, `math.ceil`, `math.pi`..."
      - "Đọc traceback: dòng cuối cho loại lỗi, dòng `File ..., line N` cho vị trí."
problems: {practice: [add-two-integers], extra: []}
mastery_check: {l1: [Q001], l2: [X001], l3: []}
checkpoint: {pass_ratio: 0.7, min_items: 3}
