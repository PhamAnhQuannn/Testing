id: py.datastructs.list
version: 4
status: published
title_vi: "Danh sách (list)"
est_minutes: 12
objectives_vi:
  - "Tạo list, lấy, cắt, thêm, xoá và sắp xếp phần tử; duyệt list bằng vòng lặp."
  - "Phân biệt thao tác sửa tại chỗ (append, sort) với thao tác tạo list mới (cắt lát, sorted)."
  - "Biết thao tác nào nhanh, thao tác nào chậm khi list dài."
blocks:
  - id: s_list_index
    type: section
    title_vi: "List và chỉ số (index)"
    summary_vi: "Tạo list, chỉ số từ 0, chỉ số âm, len và IndexError."
  - id: b01
    type: text
    md: |
      **List (danh sách)** là dãy giá trị có thứ tự, như bảng điểm `diem = [8, 9, 7]`. Mỗi phần
      tử có một **chỉ số (index)** bắt đầu từ **0**: `diem[0]` là 8, `diem[2]` là 7. Chỉ số âm đếm từ
      cuối: `diem[-1]` là phần tử cuối. `len(diem)` cho số phần tử.
  - id: b02
    type: code_sample
    lang: python
    runnable: true
    code: |
      diem = [8, 9, 7]
      print(diem[0], diem[-1], len(diem))
      print(max(diem), min(diem), sum(diem) / len(diem))
    expected_output: |
      8 7 3
      9 7 8.0
  - id: b03
    type: callout
    kind: beginner
    md: |
      List có 3 phần tử thì chỉ số hợp lệ là `0, 1, 2` (hoặc `-1, -2, -3`). Gọi `diem[3]` sẽ báo
      **IndexError**. Đây là nguồn của rất nhiều lỗi "lệch một" (off-by-one).
  - id: b04
    type: quiz_mcq
    prompt_md: "Với `ds = [10, 20, 30, 40]`, biểu thức `ds[-2]` có giá trị bao nhiêu?"
    options:
      - {id: a, text_md: "`20`"}
      - {id: b, text_md: "`30`"}
      - {id: c, text_md: "`40`"}
      - {id: d, text_md: "Báo `IndexError`"}
    answer: [b]
    explain_md: "`-1` là phần tử cuối (40), `-2` là phần tử đứng trước nó (30)."
  - id: s_list_mutate
    type: section
    title_vi: "Sửa list tại chỗ và tạo list mới"
    summary_vi: "append, pop, remove, extend; sort() sửa tại chỗ còn sorted() trả list mới."
  - id: b05
    type: text
    md: |
      List **sửa được tại chỗ (mutable)**. Ba thao tác hay dùng: `append(x)` thêm vào cuối,
      `pop()` lấy phần tử cuối ra, `remove(v)` xoá phần tử đầu tiên có giá trị `v`. Gán
      `diem[1] = 10` đổi giá trị tại vị trí 1.
  - id: b06
    type: code_sample
    lang: python
    runnable: true
    code: |
      diem = [8, 9, 7]
      diem[1] = 10
      diem.append(5)
      cuoi = diem.pop()
      diem.remove(7)
      print(diem, cuoi)
    expected_output: "[8, 10] 5"
  - id: b07
    type: quiz_fill
    prompt_md: "Điền vào chỗ trống để lấy phần tử cuối ra khỏi list và trả về nó: `ds.___()`"
    blanks: [{accept: ["pop"]}]
    explain_md: "`pop()` bỏ phần tử cuối khỏi list và trả về nó. `pop(i)` lấy phần tử ở vị trí `i`."
  - id: b08
    type: predict_output
    code: |
      a = [1, 2]
      a.append([3, 4])
      b = [1, 2]
      b.extend([3, 4])
      print(a, b)
    expected_output: "[1, 2, [3, 4]] [1, 2, 3, 4]"
    explain_md: "`append` thêm *một* phần tử (ở đây là cả list `[3, 4]`), còn `extend` thêm *từng* phần tử của list kia."
  - id: b12
    type: predict_output
    code: |
      a = [3, 1, 2]
      b = sorted(a)
      kq = a.sort()
      print(a, b, kq)
    expected_output: "[1, 2, 3] [1, 2, 3] None"
    explain_md: "`sorted(a)` trả list mới; `a.sort()` sắp xếp ngay trên `a` và trả `None`, nên đừng viết `a = a.sort()`."
  - id: ex_list_stats
    type: code_exercise
    md: |
      Viết `list_stats(nums)` trả về list `[nhỏ_nhất, lớn_nhất, tổng]` của `nums` (luôn có ít nhất một phần tử).
      Ví dụ `list_stats([3, 1, 4])` trả về `[1, 4, 8]`.
    entry: list_stats
    starter: |
      def list_stats(nums):
          # TODO: dùng min, max, sum
          pass
    tests:
      - {args: [[3, 1, 4]], expected: [1, 4, 8]}
      - {args: [[5]], expected: [5, 5, 5]}
      - {args: [[-2, -7, 0]], expected: [-7, 0, -9]}
      - {args: [[10, 10, 10, 10]], expected: [10, 10, 40]}
    guidance_md: |
      - Python có sẵn hàm cho từng giá trị cần tìm, không cần tự duyệt.
      - Kết quả là một list gồm đúng 3 phần tử theo thứ tự đề bài.
      - Chú ý thứ tự: nhỏ nhất, lớn nhất, rồi mới đến tổng.
    hints:
      - level: nudge
        md: "Bạn có cần vòng lặp không, hay các hàm dựng sẵn đã đủ?"
      - level: approach
        md: "Dùng `min(nums)`, `max(nums)`, `sum(nums)` rồi gói ba giá trị vào một list theo đúng thứ tự."
      - level: pseudocode
        md: |
          lo = giá trị nhỏ nhất của nums
          hi = giá trị lớn nhất của nums
          tong = tổng của nums
          trả về list [lo, hi, tong]
      - level: near_solution
        md: |
          def list_stats(nums):
              lo = ...
              hi = ...
              return [lo, hi, ...]
    solution: "def list_stats(nums):\n    return [min(nums), max(nums), sum(nums)]\n"
  - id: ex_insert_after
    type: code_exercise
    md: |
      Viết `insert_after(xs, target, value)` trả về **list mới** có `value` chèn ngay sau lần xuất hiện
      đầu tiên của `target`. Nếu `target` không có trong `xs`, trả về bản sao của `xs`. Không sửa `xs`.
      Ví dụ `insert_after([1, 2, 3], 2, 9)` trả về `[1, 2, 9, 3]`.
    entry: insert_after
    starter: |
      def insert_after(xs, target, value):
          # TODO: tìm vị trí của target rồi cắt lát và nối list
          pass
    tests:
      - {args: [[1, 2, 3], 2, 9], expected: [1, 2, 9, 3]}
      - {args: [[1, 2, 3], 3, 9], expected: [1, 2, 3, 9]}
      - {args: [[1, 2, 3], 7, 9], expected: [1, 2, 3]}
      - {args: [[4, 4, 5], 4, 0], expected: [4, 0, 4, 5]}
      - {args: [[], 1, 2], expected: []}
    guidance_md: |
      - Xử lý trường hợp `target` không có trong list trước.
      - `xs.index(target)` cho vị trí lần xuất hiện đầu tiên.
      - Dùng cắt lát để tạo list mới thay vì sửa `xs` tại chỗ.
    hints:
      - level: nudge
        md: "Nếu chèn bằng `insert`, bạn sẽ sửa list gốc. Có cách nào tạo list mới không?"
      - level: approach
        md: "Tìm `i = xs.index(target)`, rồi nối phần đến hết vị trí `i`, `[value]`, và phần còn lại."
      - level: pseudocode
        md: |
          nếu target không có trong xs: trả về bản sao của xs
          i = vị trí đầu tiên của target
          kết quả = xs[0..i] + [value] + xs[i+1..]
      - level: near_solution
        md: |
          def insert_after(xs, target, value):
              if ...:
                  return list(xs)
              i = ...
              return xs[...] + [value] + xs[...]
    solution: "def insert_after(xs, target, value):\n    if target not in xs:\n        return list(xs)\n    i = xs.index(target)\n    return xs[:i + 1] + [value] + xs[i + 1:]\n"
  - id: s_list_slice_iter
    type: section
    title_vi: "Cắt lát, duyệt list và hiệu năng"
    summary_vi: "Slicing tạo list mới, enumerate/zip để duyệt, và thao tác nào chậm khi list dài."
    exercise_ref: b14
  - id: b09
    type: text
    md: |
      **Cắt lát (slicing)** `ds[a:b]` lấy các phần tử từ vị trí `a` đến trước vị trí `b` và tạo ra
      một **list mới**. `ds[::-1]` đảo ngược list. Để duyệt, dùng `for x in ds`; muốn có cả vị trí
      thì `for i, x in enumerate(ds)`; duyệt hai list song song thì `zip(a, b)`.
  - id: b10
    type: code_sample
    lang: python
    runnable: true
    code: |
      ds = [10, 20, 30, 40, 50]
      print(ds[1:3], ds[:2], ds[::-1])
      for i, x in enumerate(ds[:3]):
          print(i, x)
      ten = ["An", "Binh"]
      tuoi = [20, 21]
      for t, a in zip(ten, tuoi):
          print(t, a)
    expected_output: |
      [20, 30] [10, 20] [50, 40, 30, 20, 10]
      0 10
      1 20
      2 30
      An 20
      Binh 21
  - id: b11
    type: quiz_mcq
    prompt_md: "Sau `a = [1, 2, 3]` và `b = a[:]`, rồi `b.append(4)`, giá trị của `a` là gì?"
    options:
      - {id: a, text_md: "`[1, 2, 3]`"}
      - {id: b, text_md: "`[1, 2, 3, 4]`"}
      - {id: c, text_md: "`[4]`"}
    answer: [a]
    explain_md: "Cắt lát `a[:]` tạo một bản sao, nên sửa `b` không ảnh hưởng `a`. Còn `b = a` thì hai tên cùng trỏ một list."
  - id: b13
    type: callout
    kind: warning
    md: |
      Không phải thao tác nào cũng nhanh như nhau. `append` và `pop()` ở cuối thêm/bớt gần như tức
      thì. Nhưng `insert(0, x)`, `pop(0)` phải **dời cả list**, và `x in ds` phải **dò từng phần tử**:
      chúng chậm dần khi list dài. Việc này sẽ được nói kỹ hơn khi học Big-O.
  - id: b14
    type: code_exercise
    md: |
      Viết `rotate_right(nums, k)` trả về list mới là `nums` sau khi xoay sang phải `k` vị trí.
      Ví dụ `[1, 2, 3, 4, 5]` xoay 2 vị trí thành `[4, 5, 1, 2, 3]`. `k` có thể lớn hơn độ dài list.
    entry: rotate_right
    starter: |
      def rotate_right(nums, k):
          # TODO: dùng phép cắt lát và phép nối list
          pass
    tests:
      - {args: [[1, 2, 3, 4, 5], 2], expected: [4, 5, 1, 2, 3]}
      - {args: [[1, 2, 3], 0], expected: [1, 2, 3]}
      - {args: [[1, 2, 3], 4], expected: [3, 1, 2]}
      - {args: [[], 3], expected: []}
    guidance_md: |
      - Xử lý list rỗng trước (không có gì để xoay, và tránh chia cho 0).
      - Rút gọn `k` về khoảng `0..len(nums)-1` bằng phép chia lấy dư.
      - Xác định điểm cắt: phần cuối dài `k` sẽ chuyển lên đầu.
      - Ghép hai phần cắt lát theo thứ tự mới và trả về list mới.
    hints:
      - level: nudge
        md: "Xoay `len(nums)` vị trí thì list y nguyên. Vậy `k` lớn có thể rút gọn thế nào?"
      - level: approach
        md: "Dùng `k %= len(nums)`, rồi lấy `k` phần tử cuối đưa lên trước phần còn lại. Coi chừng `k = 0` và list rỗng."
      - level: pseudocode
        md: |
          nếu nums rỗng: trả về []
          k = k mod len(nums)
          cut = len(nums) - k
          kết quả = (phần từ cut đến hết) nối (phần từ đầu đến cut)
      - level: near_solution
        md: |
          def rotate_right(nums, k):
              ...  # xử lý list rỗng
              k %= len(nums)
              cut = ...
              return nums[...] + nums[...]
    solution: "def rotate_right(nums, k):\n    if not nums:\n        return []\n    k %= len(nums)\n    cut = len(nums) - k\n    return nums[cut:] + nums[:cut]\n"
  - id: b15
    type: problem_ref
    problem_id: concatenation-of-array
  - id: b16
    type: summary
    bullets_vi:
      - "List là dãy có thứ tự, chỉ số bắt đầu từ 0, chỉ số âm đếm từ cuối."
      - "List sửa được tại chỗ: `append`, `pop`, `remove`, gán `ds[i] = x`; `sort()` sửa tại chỗ, `sorted()` trả list mới."
      - "Cắt lát `ds[a:b]` tạo list mới; `append` thêm một phần tử, `extend` thêm nhiều."
      - "Duyệt bằng `for`, `enumerate` (cần vị trí), `zip` (hai list song song)."
      - "`append`/`pop()` ở cuối nhanh; `insert(0, x)`, `pop(0)` và `x in ds` chậm dần khi list dài."
