id: py.datastructs.list
version: 1
status: published
title_vi: "Danh sách (list)"
est_minutes: 12
objectives_vi:
  - "Tạo list, lấy, cắt, thêm, xoá và sắp xếp phần tử; duyệt list bằng vòng lặp."
  - "Phân biệt thao tác sửa tại chỗ (append, sort) với thao tác tạo list mới (cắt lát, sorted)."
  - "Biết thao tác nào nhanh, thao tác nào chậm khi list dài."
blocks:
  - id: b01
    type: text
    md: |
      **List (danh sách)** là dãy giá trị có thứ tự, như bảng điểm `diem = [8, 9, 7]`. Mỗi phần
      tử có một **chỉ số (index)** bắt đầu từ **0**: `diem[0]` là 8, `diem[2]` là 7. Chỉ số âm đếm từ
      cuối: `diem[-1]` là phần tử cuối. `len(diem)` cho số phần tử.
  - id: b02
    type: code_sample
    lang: python
    runnable: true
    code: |
      diem = [8, 9, 7]
      print(diem[0], diem[-1], len(diem))
      print(max(diem), min(diem), sum(diem) / len(diem))
    expected_output: |
      8 7 3
      9 7 8.0
  - id: b03
    type: callout
    kind: beginner
    md: |
      List có 3 phần tử thì chỉ số hợp lệ là `0, 1, 2` (hoặc `-1, -2, -3`). Gọi `diem[3]` sẽ báo
      **IndexError**. Đây là nguồn của rất nhiều lỗi "lệch một" (off-by-one).
  - id: b04
    type: quiz_mcq
    prompt_md: "Với `ds = [10, 20, 30, 40]`, biểu thức `ds[-2]` có giá trị bao nhiêu?"
    options:
      - {id: a, text_md: "`20`"}
      - {id: b, text_md: "`30`"}
      - {id: c, text_md: "`40`"}
      - {id: d, text_md: "Báo `IndexError`"}
    answer: [b]
    explain_md: "`-1` là phần tử cuối (40), `-2` là phần tử đứng trước nó (30)."
  - id: b05
    type: text
    md: |
      List **sửa được tại chỗ (mutable)**. Ba thao tác hay dùng: `append(x)` thêm vào cuối,
      `pop()` lấy phần tử cuối ra, `remove(v)` xoá phần tử đầu tiên có giá trị `v`. Gán
      `diem[1] = 10` đổi giá trị tại vị trí 1.
  - id: b06
    type: code_sample
    lang: python
    runnable: true
    code: |
      diem = [8, 9, 7]
      diem[1] = 10
      diem.append(5)
      cuoi = diem.pop()
      diem.remove(7)
      print(diem, cuoi)
    expected_output: "[8, 10] 5"
  - id: b07
    type: quiz_fill
    prompt_md: "Điền vào chỗ trống để lấy phần tử cuối ra khỏi list và trả về nó: `ds.___()`"
    blanks: [{accept: ["pop"]}]
    explain_md: "`pop()` bỏ phần tử cuối khỏi list và trả về nó. `pop(i)` lấy phần tử ở vị trí `i`."
  - id: b08
    type: predict_output
    code: |
      a = [1, 2]
      a.append([3, 4])
      b = [1, 2]
      b.extend([3, 4])
      print(a, b)
    expected_output: "[1, 2, [3, 4]] [1, 2, 3, 4]"
    explain_md: "`append` thêm *một* phần tử (ở đây là cả list `[3, 4]`), còn `extend` thêm *từng* phần tử của list kia."
  - id: b09
    type: text
    md: |
      **Cắt lát (slicing)** `ds[a:b]` lấy các phần tử từ vị trí `a` đến trước vị trí `b` và tạo ra
      một **list mới**. `ds[::-1]` đảo ngược list. Để duyệt, dùng `for x in ds`; muốn có cả vị trí
      thì `for i, x in enumerate(ds)`; duyệt hai list song song thì `zip(a, b)`.
  - id: b10
    type: code_sample
    lang: python
    runnable: true
    code: |
      ds = [10, 20, 30, 40, 50]
      print(ds[1:3], ds[:2], ds[::-1])
      for i, x in enumerate(ds[:3]):
          print(i, x)
      ten = ["An", "Binh"]
      tuoi = [20, 21]
      for t, a in zip(ten, tuoi):
          print(t, a)
    expected_output: |
      [20, 30] [10, 20] [50, 40, 30, 20, 10]
      0 10
      1 20
      2 30
      An 20
      Binh 21
  - id: b11
    type: quiz_mcq
    prompt_md: "Sau `a = [1, 2, 3]` và `b = a[:]`, rồi `b.append(4)`, giá trị của `a` là gì?"
    options:
      - {id: a, text_md: "`[1, 2, 3]`"}
      - {id: b, text_md: "`[1, 2, 3, 4]`"}
      - {id: c, text_md: "`[4]`"}
    answer: [a]
    explain_md: "Cắt lát `a[:]` tạo một bản sao, nên sửa `b` không ảnh hưởng `a`. Còn `b = a` thì hai tên cùng trỏ một list."
  - id: b12
    type: predict_output
    code: |
      a = [3, 1, 2]
      b = sorted(a)
      kq = a.sort()
      print(a, b, kq)
    expected_output: "[1, 2, 3] [1, 2, 3] None"
    explain_md: "`sorted(a)` trả list mới; `a.sort()` sắp xếp ngay trên `a` và trả `None`, nên đừng viết `a = a.sort()`."
  - id: b13
    type: callout
    kind: warning
    md: |
      Không phải thao tác nào cũng nhanh như nhau. `append` và `pop()` ở cuối thêm/bớt gần như tức
      thì. Nhưng `insert(0, x)`, `pop(0)` phải **dời cả list**, và `x in ds` phải **dò từng phần tử**:
      chúng chậm dần khi list dài. Việc này sẽ được nói kỹ hơn khi học Big-O.
  - id: b14
    type: code_exercise
    md: |
      Viết `rotate_right(nums, k)` trả về list mới là `nums` sau khi xoay sang phải `k` vị trí.
      Ví dụ `[1, 2, 3, 4, 5]` xoay 2 vị trí thành `[4, 5, 1, 2, 3]`. `k` có thể lớn hơn độ dài list.
    entry: rotate_right
    starter: |
      def rotate_right(nums, k):
          # TODO: dùng phép cắt lát và phép nối list
          pass
    tests:
      - {args: [[1, 2, 3, 4, 5], 2], expected: [4, 5, 1, 2, 3]}
      - {args: [[1, 2, 3], 0], expected: [1, 2, 3]}
      - {args: [[1, 2, 3], 4], expected: [3, 1, 2]}
      - {args: [[], 3], expected: []}
    hint_md: "Lấy `k %= len(nums)` rồi ghép `nums[-k:]` (phần cuối) với `nums[:-k]` (phần đầu). Coi chừng `k = 0`."
    solution: "def rotate_right(nums, k):\n    if not nums:\n        return []\n    k %= len(nums)\n    cut = len(nums) - k\n    return nums[cut:] + nums[:cut]\n"
  - id: b15
    type: problem_ref
    problem_id: concatenation-of-array
  - id: b16
    type: summary
    bullets_vi:
      - "List là dãy có thứ tự, chỉ số bắt đầu từ 0, chỉ số âm đếm từ cuối."
      - "List sửa được tại chỗ: `append`, `pop`, `remove`, gán `ds[i] = x`; `sort()` sửa tại chỗ, `sorted()` trả list mới."
      - "Cắt lát `ds[a:b]` tạo list mới; `append` thêm một phần tử, `extend` thêm nhiều."
      - "Duyệt bằng `for`, `enumerate` (cần vị trí), `zip` (hai list song song)."
      - "`append`/`pop()` ở cuối nhanh; `insert(0, x)`, `pop(0)` và `x in ds` chậm dần khi list dài."
