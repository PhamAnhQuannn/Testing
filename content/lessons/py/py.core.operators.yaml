id: py.core.operators
version: 3
status: published
title_vi: "Toán tử, biểu thức và số (operators & numbers)"
est_minutes: 12
objectives_vi:
  - "Dự đoán đúng kết quả biểu thức dùng //, %, ** và divmod, kể cả với số âm."
  - "Phân biệt == với is; dùng chained comparison, and/or (short-circuit) và phép gán rút gọn."
  - "Biết thứ tự ưu tiên toán tử, round() làm tròn kiểu banker, và các hàm của math."
blocks:
  - id: s_arith
    type: section
    title_vi: "Toán tử số học, // và %"
    summary_vi: "Chia thật, chia lấy phần nguyên, chia lấy dư, số âm và quay vòng."
    exercise_ref: b09
  - id: b01
    type: text
    md: |
      Các toán tử số học của Python: `+`, `-`, `*`, và:

      - `/` chia thật, luôn trả `float` (`7 / 2` là `3.5`).
      - `//` **chia lấy phần nguyên** (floor division): làm tròn xuống, `7 // 2` là `3`.
      - `%` **chia lấy dư** (modulo): `7 % 3` là `1`.
      - `**` lũy thừa: `2 ** 10` là `1024`.
      - `divmod(a, b)` trả cặp `(a // b, a % b)` trong một lần: `divmod(17, 5)` là `(3, 2)`.

      Với **số âm**, `//` làm tròn về phía **âm vô cực** (không phải về 0), và `%` luôn đi cùng để
      giữ đẳng thức `a == (a // b) * b + a % b`. Do đó `-7 // 2` là `-4` và `-7 % 3` là `2`.

      Kết quả của `%` có cùng dấu với số chia `b`. Tính chất này rất hữu ích để "quay vòng": giờ
      trên đồng hồ là `(gio + them) % 24`, luôn nằm trong `0..23` kể cả khi `them` âm.
  - id: b02
    type: code_sample
    lang: python
    runnable: true
    code: |
      print(7 // 2, 7 % 3, 2 ** 10, divmod(17, 5))
      print(-7 // 2, -7 % 3)
      print((22 + 5) % 24, (3 - 5) % 24)
    expected_output: |
      3 1 1024 (3, 2)
      -4 2
      3 22
  - id: b03
    type: predict_output
    code: |
      print(-17 // 5, -17 % 5)
      print(17 // -5, 17 % -5)
    expected_output: |
      -4 3
      -4 -3
    explain_md: "`-17 / 5 = -3.4` làm tròn xuống thành `-4`, dư `-17 - (-4*5) = 3`. Với `17 // -5`: `-3.4` xuống `-4`, dư `17 - (-4*-5) = -3` (cùng dấu với số chia -5)."
  - id: b09
    type: code_exercise
    md: |
      Viết `wrap_hour(hour, add)` trả về giờ trên đồng hồ 24 giờ (từ 0 đến 23) sau khi cộng thêm
      `add` giờ; `add` có thể âm (lùi giờ). Dùng `%`.

      Xem trước về hàm: `def` tạo một **hàm** (function), tức một khối code có tên, nhận đầu vào
      (tham số, ở đây là `hour` và `add`) và trả kết quả bằng `return`. `pass` chỉ là chỗ giữ chỗ,
      bạn thay nó bằng code của mình. Hàm sẽ được học đầy đủ ở `py.functions`.
    entry: wrap_hour
    starter: |
      def wrap_hour(hour, add):
          # TODO: dùng % 24 để quay vòng, kể cả khi add âm
          pass
    tests:
      - {args: [22, 5], expected: 3}
      - {args: [3, -5], expected: 22}
      - {args: [0, 48], expected: 0}
      - {args: [23, 1], expected: 0}
    guidance_md: |
      - Cộng số giờ thêm vào giờ hiện tại.
      - Dùng phép chia lấy dư cho 24 để đưa kết quả về khoảng 0 đến 23.
      - Nhớ `%` trong Python có cùng dấu với số chia nên không cần xử lý riêng số âm.
      - Kiểm tra tay với `hour = 3, add = -5`.
    hints:
      - level: nudge
        md: "Phép toán nào giữ một số luôn nằm trong khoảng `0..23` khi nó vượt quá 23 hoặc xuống dưới 0?"
      - level: approach
        md: "Cộng `hour` và `add`, rồi lấy dư khi chia cho 24. Với số chia dương, `%` luôn cho kết quả không âm."
      - level: pseudocode
        md: |
          tong = hour cộng add
          trả về (tong chia lấy dư cho 24)
    solution: "def wrap_hour(hour, add):\n    return (hour + add) % 24\n"
  - id: ex_seconds_hms
    type: code_exercise
    md: |
      Viết `seconds_to_hms(s)` đổi số giây `s` thành danh sách `[giờ, phút, giây]`, trong đó phút và giây
      nằm trong khoảng 0 đến 59. Dùng `//` và `%` (hoặc `divmod`). Ví dụ `3725` thành `[1, 2, 5]`.
    entry: seconds_to_hms
    starter: |
      def seconds_to_hms(s):
          # TODO: dùng // và % để tách giờ, phút, giây
          return [0, 0, 0]
    guidance_md: |
      - Một giờ có 3600 giây: số giờ là phần nguyên khi chia `s` cho 3600.
      - Phần giây còn lại sau khi bỏ giờ là `s % 3600`.
      - Từ phần còn lại, tách tiếp phút (chia 60) và giây (dư 60).
      - Trả về ba giá trị trong một list `[...]`.
    hints:
      - level: nudge
        md: |
          Phép toán nào cho số giờ nguyên, và phép toán nào cho phần giây còn dư?
      - level: approach
        md: |
          Giờ = `s // 3600`. Phần còn lại `r = s % 3600`. Phút = `r // 60`, giây = `r % 60`.
      - level: pseudocode
        md: |
          gio = s chia nguyên 3600
          con_lai = s dư 3600
          phut = con_lai chia nguyên 60
          giay = con_lai dư 60
          trả về [gio, phut, giay]
      - level: near_solution
        md: |
          def seconds_to_hms(s):
              gio = s // ...
              con_lai = s % ...
              return [gio, ... // 60, ... % 60]
    tests:
      - {args: [0], expected: [0, 0, 0]}
      - {args: [59], expected: [0, 0, 59]}
      - {args: [3600], expected: [1, 0, 0]}
      - {args: [3725], expected: [1, 2, 5]}
      - {args: [86399], expected: [23, 59, 59]}
    solution: |
      def seconds_to_hms(s):
          gio = s // 3600
          con_lai = s % 3600
          return [gio, con_lai // 60, con_lai % 60]
  - id: s_logic
    type: section
    title_vi: "So sánh, and/or và thứ tự ưu tiên"
    summary_vi: "==, is, chained comparison, short-circuit, gán rút gọn, ưu tiên toán tử."
    exercise_ref: ex_is_leap
  - id: ex_is_leap
    type: code_exercise
    md: |
      Viết `is_leap_year(y)` trả về `True` nếu năm `y` là năm nhuận: chia hết cho 4 nhưng không chia hết
      cho 100, hoặc chia hết cho 400. Ví dụ `2024` là `True`, `1900` là `False`, `2000` là `True`.
    entry: is_leap_year
    starter: |
      def is_leap_year(y):
          # TODO: kết hợp ==, % với and / or
          return False
    guidance_md: |
      - Chia hết cho `n` nghĩa là `y % n == 0`.
      - Có hai trường hợp được coi là nhuận: (chia hết 4 và không chia hết 100) hoặc chia hết 400.
      - Nối các điều kiện bằng `and` / `or`, thêm ngoặc cho rõ ý.
    hints:
      - level: nudge
        md: |
          Năm 1900 chia hết cho 4 nhưng không nhuận. Điều kiện nào loại nó ra, và điều kiện nào cứu năm 2000?
      - level: approach
        md: |
          Viết `(y % 4 == 0 and y % 100 != 0)`, rồi nối bằng `or` với `y % 400 == 0`.
      - level: pseudocode
        md: |
          trường hợp 1: y chia hết 4 VÀ y không chia hết 100
          trường hợp 2: y chia hết 400
          trả về trường hợp 1 HOẶC trường hợp 2
      - level: near_solution
        md: |
          def is_leap_year(y):
              return (y % ... == 0 and y % ... != 0) or y % ... == 0
    tests:
      - {args: [2024], expected: true}
      - {args: [1900], expected: false}
      - {args: [2000], expected: true}
      - {args: [2023], expected: false}
    solution: |
      def is_leap_year(y):
          return (y % 4 == 0 and y % 100 != 0) or y % 400 == 0
  - id: b04
    type: text
    md: |
      **So sánh** trả về `bool`: `==` (bằng), `!=`, `<`, `<=`, `>`, `>=`. Python cho phép
      **so sánh nối (chained)**: `1 < x < 5` nghĩa là `1 < x and x < 5`.

      - `==` hỏi "hai giá trị **bằng nhau** không"; `is` hỏi "hai tên có cùng **một đối tượng**
        không". Dùng `is` chủ yếu để kiểm tra `x is None`; còn so sánh số hay chuỗi thì dùng `==`.
      - `and`, `or`, `not` kết hợp điều kiện. Chúng **short-circuit**: `False and (1 / 0)` không
        tính vế phải nên không lỗi. Chúng trả về *một trong hai toán hạng*, không nhất thiết là
        bool: `0 or "mặc định"` là `"mặc định"`, `5 and 7` là `7`.
      - **Gán rút gọn (augmented assignment)**: `x += 5` giống `x = x + 5`; tương tự `-=`, `*=`,
        `//=`, `%=`, `**=`.
      - **Thứ tự ưu tiên**: `**` trước, rồi `*` `/` `//` `%`, rồi `+` `-`, rồi so sánh, rồi `not`,
        `and`, `or`. Nên `-2 ** 2` là `-4` (vì là `-(2 ** 2)`), còn `(-2) ** 2` là `4`. Không chắc thì
        thêm ngoặc.
  - id: b05
    type: code_sample
    lang: python
    runnable: true
    code: |
      x = 3
      print(1 < x < 5, 1 < 7 < 5)
      print(0 or "mặc định", 5 and 7, False and 1 / 0)
      print(-2 ** 2, (-2) ** 2, 2 ** 3 ** 2)
      x = 10
      x += 5
      x *= 2
      x //= 4
      print(x, x == 7, x is None)
    expected_output: |
      True False
      mặc định 7 False
      -4 4 512
      7 True False
  - id: b06
    type: quiz_mcq
    prompt_md: "Giá trị của `2 + 3 * 2 ** 2` là bao nhiêu?"
    options:
      - {id: a, text_md: "`20`: cộng trước rồi nhân, `(2 + 3) * 2 ** 2`"}
      - {id: b, text_md: "`14`: `**` trước (4), rồi `3 * 4 = 12`, rồi `2 + 12`"}
      - {id: c, text_md: "`100`: tính lần lượt từ trái sang phải, `(((2 + 3) * 2) ** 2)`"}
    answer: [b]
    explain_md: "Thứ tự ưu tiên: `**` cao nhất, rồi `*`, rồi `+`. Vậy `2 + (3 * (2 ** 2))` = `2 + 12` = `14`."
  - id: s_round_math
    type: section
    title_vi: "round và module math"
    summary_vi: "Làm tròn kiểu banker và các hàm của math."
  - id: b07
    type: text
    md: |
      **`round(x)`** làm tròn đến số nguyên gần nhất, nhưng khi đúng giữa hai số (`.5`) nó chọn số
      **chẵn** (banker's rounding): `round(2.5)` là `2`, `round(3.5)` là `4`, `round(0.5)` là `0`.
      `round(x, 2)` làm tròn đến 2 chữ số thập phân, và vì float có sai số nên `round(2.675, 2)`
      cho `2.67` chứ không phải `2.68`.

      Module **`math`** (sau `import math`) có nhiều hàm hữu ích:

      - `math.sqrt(x)`: căn bậc hai, trả `float`. `math.isqrt(n)`: căn nguyên (phần nguyên của
        căn), `math.isqrt(17)` là `4`.
      - `math.floor(x)` làm tròn xuống, `math.ceil(x)` làm tròn lên: `floor(-2.5)` là `-3`,
        `ceil(-2.5)` là `-2`.
      - `math.gcd(a, b)`: ước chung lớn nhất, `math.gcd(12, 18)` là `6`.

      Python còn có toán tử bit (`&`, `|`, `^`, `<<`), cùng các kiểu `Decimal`, `Fraction` cho số
      chính xác, và module `random`; những phần này dùng khi cần và bạn có thể tra cứu sau.
  - id: b08
    type: predict_output
    code: |
      import math

      print(round(2.5), round(3.5), math.gcd(12, 18), math.isqrt(17))
      print(math.floor(-2.5), math.ceil(-2.5))
    expected_output: |
      2 4 6 4
      -3 -2
    explain_md: "`round` chọn số chẵn khi đúng giữa: 2.5 thành 2, 3.5 thành 4. `floor` luôn xuống (-2.5 thành -3), `ceil` luôn lên (-2.5 thành -2)."
  - id: b09a
    type: text
    md: "Bài luyện dưới đây cần vòng lặp `while` (học ở `py.core.loops`), nên làm sau cũng được; nếu bí thì quay lại khi đã học tới đó."
  - id: b10
    type: problem_ref
    problem_id: subtract-product-and-sum
  - id: b11
    type: summary
    bullets_vi:
      - "`/` ra float; `//` làm tròn xuống (về âm vô cực); `%` lấy dư, cùng dấu với số chia; `**` lũy thừa; `divmod(a, b)` = `(a // b, a % b)`."
      - "`-7 // 2 == -4` và `-7 % 3 == 2`; `(x + k) % n` quay vòng trong `0..n-1`."
      - "`==` so sánh giá trị, `is` so sánh đối tượng (dùng cho `None`); `1 < x < 5` là chained comparison."
      - "`and`/`or` short-circuit và trả về một toán hạng; `x += 1` là gán rút gọn."
      - "Ưu tiên: `**` > `* / // %` > `+ -` > so sánh > `not` > `and` > `or`; `-2 ** 2 == -4`."
      - "`round` làm tròn về số chẵn khi đúng `.5`; `math.sqrt/isqrt/gcd/floor/ceil`."
