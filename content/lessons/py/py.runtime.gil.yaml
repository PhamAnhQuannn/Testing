      - "GIL: mỗi lúc chỉ một thread chạy bytecode Python, vì refcount không thread-safe."
      - "IO-bound: thread giúp được (chờ thì nhả GIL). CPU-bound: không nhanh hơn; dùng multiprocessing, C extension hoặc NumPy."
      - "x += 1 là đọc, cộng, ghi nên vẫn cần lock; từ 3.10 khó tái hiện lỗi nhưng không phải đảm bảo. Nâng cao: switch interval 5 ms, free-threaded 3.13t/3.14."
