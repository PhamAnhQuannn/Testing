id: ml.nlp_transformers.classic_nlp
version: 1
status: published
title_vi: "NLP cổ điển: BoW, TF-IDF, n-gram"
est_minutes: 14
objectives_vi:
  - "Tiền xử lý văn bản (lowercase, tokenize, stop words) và biểu diễn văn bản bằng bag-of-words."
  - "Tính TF-IDF (tf × idf, idf = log(N/df)) và dùng cosine similarity trên vector TF-IDF để tìm văn bản gần nhất."
  - "Ước lượng bigram P(w2|w1) với add-1 smoothing và biết perplexity, NER/POS, baseline TF-IDF + logistic regression."
blocks:
  - id: s_bow
    type: section
    title_vi: "Tiền xử lý và bag-of-words"
    summary_vi: "Lowercase, tokenize, stop words; đếm từ thành vector và vì sao BoW bỏ qua thứ tự."
    exercise_ref: ex_bow
  - id: t01
    type: text
    md: |
      Trước khi đưa văn bản vào mô hình cổ điển, ta **tiền xử lý**:

      - **Lowercase**: `"Mèo"` và `"mèo"` thành cùng một token.
      - **Tokenize**: tách câu thành list token, cách đơn giản nhất là `text.lower().split()`.
      - **Stop words**: bỏ các từ rất phổ biến (`the`, `a`, `is`, `và`...) vì chúng ít mang nghĩa phân biệt.

      **Bag-of-words (BoW)** biểu diễn một văn bản bằng **vector đếm** theo một `vocab` cố định: phần tử thứ `i` là số lần
      từ `vocab[i]` xuất hiện. BoW **bỏ qua thứ tự từ**: "chó cắn người" và "người cắn chó" cho cùng một vector.

      ```
      doc   = ["mèo", "ăn", "cá", "mèo"]
      vocab = ["mèo", "ăn", "cá", "chó"]
      vec   = [doc.count(w) for w in vocab]   # [2, 1, 1, 0]
      ```

      Nhược điểm: vector rất thưa, không biết nghĩa, và từ phổ biến (đếm nhiều) lấn át từ hiếm nhưng quan trọng. TF-IDF sửa
      điểm cuối này.
  - id: q01
    type: quiz_mcq
    prompt_md: "Hai câu 'chó cắn người' và 'người cắn chó' có vector bag-of-words thế nào?"
    options:
      - {id: a, text_md: "Giống hệt nhau, vì BoW bỏ qua thứ tự từ"}
      - {id: b, text_md: "Khác nhau, vì thứ tự từ đổi"}
      - {id: c, text_md: "Không biểu diễn được"}
    answer: [a]
    explain_md: "BoW chỉ đếm số lần xuất hiện của từng từ, nên hai câu có cùng tập từ và cùng số lần sẽ cho cùng vector."
  - id: q02
    type: predict_output
    code: |
      tokens = "the cat the dog".split()
      vocab = ["the", "cat", "bird"]
      print([tokens.count(w) for w in vocab])
    expected_output: |
      [2, 1, 0]
    explain_md: "'the' xuất hiện 2 lần, 'cat' 1 lần, 'bird' không có nên 0. Vector đi theo thứ tự của vocab."
  - id: ex_bow
    type: code_exercise
    md: |
      Cài `bag_of_words(doc, vocab)`: `doc` là list token, `vocab` là list token. Trả list đếm, phần tử `i` là số lần
      `vocab[i]` xuất hiện trong `doc`. Ví dụ `doc = ["a", "b", "a"]`, `vocab = ["a", "b", "c"]` cho `[2, 1, 0]`.
    entry: bag_of_words
    starter: |
      def bag_of_words(doc, vocab):
          # TODO: với mỗi từ trong vocab, đếm số lần nó xuất hiện trong doc
          pass
    guidance_md: |
      - Kết quả có đúng `len(vocab)` phần tử, theo thứ tự của `vocab`.
      - Dùng `doc.count(w)` cho từng `w` trong `vocab`.
    hints:
      - level: nudge
        md: "Mỗi từ trong vocab cho ra một con số."
      - level: approach
        md: "Duyệt `vocab`, với mỗi `w` đếm số lần `w` có trong `doc`."
      - level: near_solution
        md: "`return [doc.count(w) for w in vocab]`."
    tests:
      - {args: [["a", "b", "a"], ["a", "b", "c"]], expected: [2, 1, 0]}
      - {args: [[], ["x"]], expected: [0]}
      - {args: [["x", "x"], ["x", "x"]], expected: [2, 2]}
      - {args: [["a", "b"], []], expected: []}
    solution: |
      def bag_of_words(doc, vocab):
          return [doc.count(w) for w in vocab]
  - id: s_tfidf
    type: section
    title_vi: "TF-IDF và cosine similarity"
    summary_vi: "Giảm trọng số từ phổ biến, tăng trọng số từ hiếm; so sánh văn bản bằng cosine."
  - id: t02
    type: text
    md: |
      **TF-IDF** gán trọng số cho từ `t` trong văn bản `d`:

      ```
      tf(t, d)  = số lần t xuất hiện trong d
      idf(t)    = log(N / df)        # N = số văn bản, df = số văn bản chứa t
      tfidf     = tf × idf
      ```

      - Từ xuất hiện ở **mọi** văn bản có `df = N`, nên `idf = log(1) = 0`: bị loại hẳn (như `the`).
      - Từ **hiếm** có `df` nhỏ nên `idf` lớn: được nhấn mạnh.

      Ví dụ `N = 4`: từ có `df = 2` cho `idf = log(2) ≈ 0.693`; từ có `df = 1` cho `idf = log(4) ≈ 1.386`.

      **Retrieval**: biến câu truy vấn và mọi văn bản thành vector TF-IDF, rồi xếp hạng theo **cosine similarity**
      `dot(a, b) / (|a| · |b|)`. Cosine đo góc nên không bị ảnh hưởng bởi độ dài văn bản.

      **Baseline phân loại văn bản** phổ biến: **TF-IDF + logistic regression** (nhanh, mạnh, dễ giải thích). Các bài toán
      gán nhãn từng token như **NER** (nhận diện thực thể) và **POS tagging** (nhãn từ loại) cũng từng dùng mô hình cổ điển
      (HMM, CRF) trước khi chuyển sang Transformer.
  - id: q03
    type: quiz_mcq
    prompt_md: "Trong TF-IDF, từ xuất hiện ở mọi văn bản của corpus có idf bằng bao nhiêu (idf = log(N/df))?"
    options:
      - {id: a, text_md: "0, vì df = N nên log(1) = 0"}
      - {id: b, text_md: "Rất lớn"}
      - {id: c, text_md: "1"}
    answer: [a]
    explain_md: "df = N cho N/df = 1 và log(1) = 0, nên từ có mặt ở mọi văn bản không giúp phân biệt và bị loại."
  - id: q04
    type: quiz_mcq
    prompt_md: "Vì sao dùng cosine similarity thay vì khoảng cách Euclid để so sánh vector TF-IDF của văn bản?"
    options:
      - {id: a, text_md: "Cosine đo hướng nên không bị ảnh hưởng bởi độ dài văn bản"}
      - {id: b, text_md: "Cosine luôn lớn hơn khoảng cách Euclid"}
      - {id: c, text_md: "Cosine không cần vocab"}
    answer: [a]
    explain_md: "Văn bản dài có vector lớn hơn nhưng cùng hướng; cosine chuẩn hoá theo độ dài nên so sánh công bằng."
  - id: s_ngram
    type: section
    title_vi: "n-gram language model và smoothing"
    summary_vi: "Bigram P(w2|w1), add-1 smoothing và perplexity."
  - id: t03
    type: text
    md: |
      **n-gram language model** ước lượng xác suất của từ kế tiếp dựa trên `n-1` từ trước. **Bigram**:

      ```
      P(w2 | w1) = count(w1 w2) / count(w1)
      ```

      Vấn đề: cặp chưa từng thấy có `count = 0` nên xác suất bằng 0 và cả câu có xác suất 0. **Add-1 (Laplace) smoothing**
      cộng 1 vào mọi count:

      ```
      P(w2 | w1) = (count(w1 w2) + 1) / (count(w1) + V)     # V = kích thước vocab
      ```

      Mẫu số cộng `V` để các xác suất vẫn cộng lại bằng 1.

      Ví dụ corpus `a b a b a c`: `count(a b) = 2`, `count(a) = 3`, `V = 3`. Không smoothing `P(b|a) = 2/3`; với add-1
      `P(b|a) = (2+1)/(3+3) = 0.5`. Cặp chưa thấy `(a, a)` có `P = (0+1)/(3+3) = 1/6`.

      **Perplexity** = `2^(cross-entropy)` đo mô hình "bối rối" thế nào trên văn bản test: càng thấp càng tốt.
  - id: q05
    type: quiz_fill
    prompt_md: "Corpus có V = 5 từ, count(w1) = 3 và cặp (w1, w2) chưa từng xuất hiện. Với add-1 smoothing, P(w2|w1) = ? (điền số thập phân)"
    blanks: [{accept: ["0.125", "1/8", ".125"]}]
    explain_md: "(0 + 1) / (3 + 5) = 1/8 = 0.125."
  - id: q06
    type: quiz_mcq
    prompt_md: "Mục đích chính của add-1 (Laplace) smoothing là gì?"
    options:
      - {id: a, text_md: "Tránh xác suất 0 cho n-gram chưa từng thấy trong dữ liệu train"}
      - {id: b, text_md: "Làm vocab nhỏ lại"}
      - {id: c, text_md: "Tăng độ dài câu"}
    answer: [a]
    explain_md: "Không smoothing thì một cặp lạ làm cả câu có xác suất 0 và perplexity vô hạn."
  - id: t_sum
    type: summary
    bullets_vi:
      - "Tiền xử lý: lowercase, tokenize, bỏ stop words. Bag-of-words là vector đếm theo vocab và bỏ qua thứ tự từ."
      - "TF-IDF = tf × log(N/df): từ ở mọi văn bản có trọng số 0, từ hiếm được nhấn mạnh; so sánh văn bản bằng cosine similarity."
      - "Bigram P(w2|w1) = count(w1 w2)/count(w1); add-1 smoothing: (count + 1)/(count(w1) + V). Perplexity = 2^cross-entropy."
      - "Baseline phân loại văn bản: TF-IDF + logistic regression; NER/POS tagging là bài toán gán nhãn từng token."
