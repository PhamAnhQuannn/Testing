id: ml.system_design.rag_assistant
version: 1
status: published
title_vi: "Thiết kế trợ lý RAG doanh nghiệp: hạ tầng ingest chạy nền, phân quyền (ACL), trích dẫn, đánh giá và chi phí"
est_minutes: 14
objectives_vi:
  - "Tách thiết kế thành hai luồng: **ingest** (nạp tài liệu) chạy nền và **query** (hỏi-đáp) chạy online trong vài giây; nêu các việc của luồng ingest production (connector, đồng bộ tăng dần, parse→chunk→embed→index, xử lý cập nhật/xoá, khử trùng lặp)."
  - "Bảo đảm **phân quyền (ACL)** và **cô lập tenant**: lọc theo quyền ngay lúc tìm (retrieval-time filter) để không lộ tài liệu, và nêu đánh đổi giữa index riêng và filter bắt buộc."
  - "Thiết kế trả lời có **trích dẫn (citation)** + grounding + fallback 'không biết', và **đánh giá** tách riêng chất lượng tìm và chất lượng sinh (golden set + phản hồi online)."
  - "Nêu các yếu tố **chi phí** (token embedding, token LLM, kho vector) và **SLA độ mới (freshness)**, và nói rõ đánh đổi của từng lựa chọn (mức 3)."
blocks:
  - id: b01
    type: text
    md: |
      Đây là bài **tổng kết** của mạch RAG: ta *áp dụng* những gì đã học ở các bài trước
      (pipeline RAG, chia đoạn/chunking, tìm lai + rerank/hybrid_rerank, bộ đánh giá/eval set) để
      **thiết kế một trợ lý RAG doanh nghiệp cho production** — hỏi-đáp trên kho tài liệu công ty
      (Drive, Confluence, wiki nội bộ...). Khác với một RAG "đồ chơi", bản production có thêm vài
      việc "người lớn": nạp tài liệu chạy nền, phân quyền, trích dẫn, đánh giá, chi phí và guardrail.

      Điều đầu tiên nói trong phỏng vấn là **tách hai luồng**:
      - **Luồng ingest (nạp tài liệu)** — chạy **nền, bất đồng bộ (async)**, liên tục: kéo tài liệu
        từ nguồn, đọc (parse) → chia đoạn (chunk) → tạo vector (embed) → ghi vào index. Không nằm
        trong đường đi của câu hỏi, nên có thể chậm vài giây–vài phút.
      - **Luồng query (hỏi-đáp)** — chạy **online**, phải trả lời trong **vài giây**: nhận câu hỏi →
        tìm (hybrid + rerank) → sinh câu trả lời **có trích dẫn**.

      Tách hai luồng để độ trễ nạp tài liệu không ảnh hưởng độ trễ trả lời, và để mỗi luồng co giãn
      (scale) độc lập.
  - id: b02
    type: text
    md: |
      **Luồng ingest (hạ tầng nạp tài liệu) gồm:**
      - **Connector** tới từng nguồn (Drive/Confluence/SharePoint...): gọi API của nguồn để lấy tài liệu.
      - **Đồng bộ tăng dần (incremental sync)**: mỗi lần chỉ xử lý tài liệu **đã đổi** kể từ lần trước
        (dựa vào change token / mốc thời gian sửa), thay vì nạp lại toàn bộ — rẻ hơn nhiều.
      - **parse → chunk → embed → index**: đọc PDF/HTML/docx thành văn bản, chia đoạn, tạo embedding,
        rồi **upsert** (ghi đè/thêm) vào kho vector + index từ khoá (cho tìm lai/hybrid).
      - **Xử lý cập nhật và xoá**: tài liệu sửa → chunk lại, embed lại, **thay** vector cũ; tài liệu
        **bị xoá hoặc hết hạn** → **xoá luôn vector** của nó. Muốn xoá đúng, phải lưu `doc_id` trong
        **metadata** của mỗi chunk để truy ngược.
      - **Khử trùng lặp (dedup)**: cùng một tài liệu đến từ hai nguồn → nhận biết bằng hash nội dung
        để không index hai lần.
      - Chạy qua **hàng đợi (queue) + worker** để tách khỏi độ trễ query và chịu tải tăng dần.

      **Đánh đổi:** đồng bộ càng thường xuyên thì tài liệu càng **tươi (fresh)** nhưng càng tốn
      token embedding và lượt gọi API nguồn; đồng bộ theo lô ban đêm thì rẻ nhưng tài liệu cũ hơn.
  - id: b03
    type: quiz_mcq
    graded: true
    prompt_md: "Một tài liệu bị **xoá ở nguồn** (nhân viên nghỉ việc, tài liệu gỡ khỏi Confluence). Luồng ingest **phải làm gì** để trợ lý không còn trả lời dựa trên nó?"
    options:
      - {id: a, text_md: "Tìm và **xoá các vector của tài liệu đó** khỏi index (dựa vào `doc_id` trong metadata), để nó không còn được truy xuất nữa."}
      - {id: b, text_md: "Không cần làm gì; kho vector tự biết tài liệu đã bị xoá ở nguồn và tự loại bỏ."}
      - {id: c, text_md: "Xoá sạch toàn bộ index rồi dựng lại từ đầu mỗi khi một tài liệu bị xoá."}
    answer: [a]
    explain_md: "Kho vector KHÔNG tự biết nguồn đã xoá tài liệu; phải xoá tăng dần theo `doc_id` lưu trong metadata — nếu không sẽ lộ hoặc trả lời từ tài liệu đã gỡ. (b) sai vì vector không đồng bộ ngược với nguồn. (c) lãng phí khủng khiếp: dựng lại cả index chỉ vì một tài liệu."
  - id: b04
    type: text
    md: |
      **Phân quyền (ACL — access control list) và cô lập tenant.** Trong doanh nghiệp, một người
      dùng **chỉ được truy xuất những chunk họ được phép xem**. Hai ý cốt lõi:

      - **Lưu ACL trong metadata lúc ingest**: mỗi chunk mang kèm nhóm/vai trò/người được phép xem.
      - **Lọc ngay lúc tìm (filter at retrieval time)**: truyền danh tính + nhóm của người hỏi thành
        **metadata filter**, để tìm kiếm **chỉ trả về** chunk họ được xem. **Tuyệt đối không** tìm
        hết rồi trông chờ LLM tự giấu tài liệu cấm — LLM có thể lộ tài liệu của nhóm khác, lại còn
        tốn token cho ngữ cảnh không được phép.

      - **Nhiều công ty (multi-tenant)**: công ty A không được thấy dữ liệu công ty B. Hoặc dùng
        **index/namespace riêng cho mỗi tenant**, hoặc một index chung với **filter bắt buộc theo
        `tenant_id`**. Đánh đổi: index riêng = cô lập mạnh nhất nhưng tốn hạ tầng và khó dùng chung;
        index chung + filter = rẻ hơn nhưng chỉ cần một lỗi filter là rò rỉ chéo tenant.

      ACL cũng có vấn đề **độ mới**: khi quyền thay đổi (ai đó rời nhóm), phải cập nhật metadata ACL
      kịp thời, nếu không người vừa mất quyền vẫn tìm được tài liệu.
  - id: b05
    type: quiz_mcq
    graded: true
    prompt_md: "Làm sao bảo đảm người dùng **không bao giờ truy xuất** tài liệu họ không có quyền xem?"
    options:
      - {id: a, text_md: "Lưu ACL trong metadata của chunk lúc ingest, và **lọc theo danh tính/nhóm của người hỏi ngay lúc tìm** — chunk bị cấm không bao giờ được trả về."}
      - {id: b, text_md: "Tìm top-k như bình thường rồi thêm một câu trong prompt: 'đừng tiết lộ tài liệu của nhóm khác'."}
      - {id: c, text_md: "Dựa vào bước rerank để đẩy các tài liệu bị cấm xuống cuối danh sách."}
    answer: [a]
    explain_md: "Chỉ việc **lọc lúc tìm** mới chặn thật sự. (b) phó mặc cho LLM 'nghe lời' — rủi ro rò rỉ + tốn token cho ngữ cảnh cấm. (c) chỉ xếp lại thứ tự, tài liệu cấm vẫn lọt vào ngữ cảnh và có thể bị dùng."
  - id: b06
    type: text
    md: |
      **Trích dẫn (citation), grounding và guardrail.** Câu trả lời của trợ lý doanh nghiệp phải
      **dẫn nguồn**: nêu rõ (và link về) đúng chunk/đoạn tài liệu đã dùng. Lý do:
      - **Tạo niềm tin và cho phép kiểm chứng**: người dùng bấm vào nguồn để tự xác minh, không phải
        tin mù.
      - **Grounding (bám nguồn)**: ra luật cho model **chỉ trả lời dựa trên ngữ cảnh đã truy xuất**;
        nếu ngữ cảnh không chứa câu trả lời thì nói **"Tôi không đủ thông tin để trả lời"** thay vì bịa.
      - **Guardrail**: kiểm tra câu trả lời **trích dẫn chunk có thật** (không bịa trích dẫn), từ chối
        yêu cầu ngoài phạm vi hoặc nhạy cảm, và **ghi log để kiểm toán**.

      **Đánh đổi:** grounding chặt + sẵn sàng nói "không biết" giúp giảm trả lời sai, nhưng làm tăng
      số lần "không biết" (độ phủ/coverage giảm) — cần cân chỉnh theo mức rủi ro của sản phẩm.
  - id: b07
    type: quiz_fill
    graded: true
    prompt_md: |
      Điền thuật ngữ còn thiếu: tính chất "mọi khẳng định trong câu trả lời đều thực sự **được nâng
      đỡ bởi nguồn đã truy xuất** (không phải model tự bịa)" được gọi là ______ của câu trả lời.
    blanks:
      - accept: ["groundedness", "faithfulness", "grounding", "tính bám nguồn", "độ trung thực", "bám nguồn"]
    explain_md: "Groundedness / faithfulness (tính bám nguồn, độ trung thực) = mức câu trả lời bám vào nguồn đã truy xuất chứ không bịa. Đây là thước đo cốt lõi của chất lượng **sinh** trong RAG, đo kèm với trích dẫn."
  - id: b08
    type: text
    md: |
      **Đánh giá (evaluation) — đo tách hai lớp.** Khi trả lời sai, phải biết lỗi nằm ở đâu, nên đo
      riêng:
      1. **Chất lượng tìm (retrieval)**: có lấy đúng chunk cần không? Đo bằng **recall@k / hit rate /
         MRR** trên một **golden set** gồm cặp (câu hỏi → chunk/tài liệu đúng).
      2. **Chất lượng sinh (generation)**: câu trả lời có **bám nguồn (groundedness)** và **đúng**
         không? So với **golden Q&A set** (câu hỏi → câu trả lời chuẩn); có thể dùng người chấm hoặc
         LLM-as-judge.

      **Golden set** là bộ cố định, được tuyển chọn, gồm cả **ca khó/mơ hồ** và ca **đáng lẽ phải
      trả lời "không biết"**. Thêm **phản hồi online** (👍/👎, người dùng bấm vào trích dẫn nào) để
      theo dõi chất lượng thật và nuôi lại eval.

      **Vì sao tách:** nếu trả lời tệ mà **tìm sai** (chunk đúng không được lấy) → sửa ingest/chunking/
      rerank; nếu **tìm đúng nhưng model phớt lờ ngữ cảnh** → sửa prompt/grounding/model. Một điểm số
      gộp không cho biết sửa chỗ nào. **Đánh đổi:** golden set tốn công dựng và bảo trì, nhưng là tín
      hiệu **khách quan** duy nhất thay cho "cảm tính".
  - id: b09
    type: quiz_mcq
    graded: true
    prompt_md: "Trợ lý cho một câu trả lời sai. Vì sao nên đánh giá **bước tìm** và **bước sinh** **tách riêng**?"
    options:
      - {id: a, text_md: "Để **khoanh vùng lỗi**: nếu chunk đúng không được tìm ra → sửa ingest/chunking/rerank; nếu đã tìm ra mà model phớt lờ/hiểu sai → sửa prompt/grounding/model. Một điểm gộp không nói được lỗi ở đâu."}
      - {id: b, text_md: "Vì tìm và sinh dùng chung một metric accuracy, nên đo gộp một lần là đủ và nhanh hơn."}
      - {id: c, text_md: "Chỉ để tính riêng chi phí token cho mỗi bước, không liên quan đến chất lượng."}
    answer: [a]
    explain_md: "Tách đo để biết **sửa chỗ nào**: recall@k cho bước tìm, groundedness/đúng-sai cho bước sinh. (b) sai: hai bước có nguyên nhân lỗi khác nhau, gộp lại mất thông tin. (c) sai: mục đích là chất lượng, không phải chỉ chi phí."
  - id: b10
    type: text
    md: |
      **Chi phí, độ mới (freshness) và cache.** Các đầu chi phí chính:
      - **Token embedding**: trả một lần cho mỗi chunk lúc ingest, cộng phần embed lại khi tài liệu đổi.
      - **Token LLM mỗi câu hỏi**: ngữ cảnh + câu trả lời — dùng **rerank** để giữ ngữ cảnh gọn mà vẫn
        trúng, giảm token.
      - **Kho vector**: cỡ index ≈ số chunk × số chiều × số byte (ví dụ 100.000 chunk × 768 chiều ×
        4 byte ≈ 0,3 GB).

      **SLA độ mới**: câu trả lời được phép "cũ" tới mức nào? Đồng bộ gần real-time = tươi nhưng đắt;
      lô ban đêm = rẻ nhưng cũ. Nên chọn **theo loại tài liệu**: chính sách ít đổi → ban đêm; ghi chú
      sự cố → đồng bộ nhanh.

      **Cache**: cache embedding của chunk không đổi (khỏi embed lại); cache câu trả lời cho các câu
      hỏi lặp lại y hệt. **Cẩn thận với ACL**: khoá cache **phải gồm phạm vi quyền** của người hỏi,
      nếu không sẽ trả cache của người này cho người khác → rò rỉ. **Đánh đổi lớn:** độ mới ↔ chi phí;
      cỡ ngữ cảnh ↔ chất lượng câu trả lời ↔ số token.
  - id: b11
    type: callout
    kind: interview
    md: |
      **Khung trình bày mức 3 (phỏng vấn AI engineer).** Dẫn người phỏng vấn đi theo trục:
      (1) **Hai luồng** → (2) **Ingest**: connector, đồng bộ tăng dần, parse/chunk/embed/index, xử lý
      cập nhật/xoá, dedup → (3) **ACL + cô lập tenant**: lọc lúc tìm, index riêng vs filter bắt buộc →
      (4) **Query**: hybrid retrieve + rerank → sinh **có trích dẫn** + grounding + "không biết" →
      (5) **Đánh giá**: golden set, tách tìm vs sinh, phản hồi online → (6) **Chi phí + SLA độ mới** +
      cache. Với **mỗi lựa chọn, nêu rõ đánh đổi** (tươi vs rẻ, cô lập mạnh vs chi phí, ngữ cảnh lớn
      vs token). Chính việc gọi tên đánh đổi là thứ đưa câu trả lời từ "biết các mảnh ghép" lên
      "thiết kế được hệ production".
  - id: b12
    type: summary
    bullets_vi:
      - "**Hai luồng**: ingest (nền, async) nạp tài liệu; query (online, vài giây) tìm + rerank + sinh có trích dẫn. Tách để co giãn và tách độ trễ."
      - "**Ingest production**: connector + đồng bộ tăng dần + parse/chunk/embed/index + xử lý cập nhật/xoá (xoá vector theo `doc_id`) + dedup; chạy qua queue. Đánh đổi: tươi ↔ chi phí."
      - "**ACL**: lưu quyền trong metadata, **lọc ngay lúc tìm** (không phó mặc LLM); multi-tenant dùng index riêng hoặc filter bắt buộc theo `tenant_id` (cô lập mạnh ↔ chi phí)."
      - "**Trích dẫn + grounding + 'không biết'** để tạo niềm tin và giảm bịa; guardrail kiểm trích dẫn thật và ghi log kiểm toán. Đánh đổi: ít sai hơn ↔ độ phủ giảm."
      - "**Đánh giá tách tìm vs sinh** (recall@k vs groundedness/đúng-sai) trên golden set + phản hồi online, để biết sửa ingest/rerank hay prompt/model."
      - "**Chi phí**: token embedding, token LLM/câu, cỡ kho vector; **SLA độ mới** chọn theo loại tài liệu; cache nhớ kèm phạm vi ACL. Mức 3 = nêu đánh đổi cho từng lựa chọn."
