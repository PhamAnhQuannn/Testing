id: ml.system_design.search_ranking
version: 1
status: published
title_vi: "Thiết kế hệ xếp hạng tìm kiếm: từ hiểu truy vấn tới nhãn từ click và cách đánh giá"
est_minutes: 14
objectives_vi:
  - "Vẽ được pipeline search end-to-end: hiểu truy vấn (query understanding) → truy hồi (retrieval) lai (hybrid) → xếp hạng (learning to rank) → chấm lại (rerank), và nói mỗi tầng làm gì."
  - "Chọn chỉ mục (index) đúng: chỉ mục đảo (inverted index) cho từ khóa + chỉ mục vector/ANN cho ngữ nghĩa, và vì sao thường dùng cả hai."
  - "Tạo nhãn liên quan (relevance label) từ log click và **hiệu chỉnh position bias** (click model / IPW, dùng dwell/long-click), rồi huấn luyện LTR pointwise/pairwise/listwise."
  - "Đánh giá hệ thống: offline NDCG/MRR trên nhãn, online A/B test + interleaving, và một bộ nhãn vàng do rater chấm."
blocks:
  - id: b01
    type: text
    md: |
      **Bài toán phỏng vấn:** thiết kế hệ **xếp hạng tìm kiếm (search ranking)** cho ô tìm kiếm của
      một trang lớn (thương mại điện tử, tài liệu). Người dùng gõ vài từ; ta phải trả về danh sách
      **xếp đúng thứ tự liên quan (relevance)** trong vài chục mili-giây, trên hàng triệu tài liệu.

      Giống mọi hệ gợi ý/tìm kiếm quy mô lớn, kiến trúc là một **phễu (funnel)** nhiều tầng — rộng và
      rẻ ở đầu, hẹp và tinh ở cuối:

      1. **Hiểu truy vấn (query understanding):** làm sạch và làm giàu câu hỏi.
      2. **Truy hồi / lấy ứng viên (retrieval, candidate generation):** từ hàng triệu tài liệu lấy ra
         vài trăm–vài nghìn ứng viên, bằng **cả từ khóa lẫn vector (hybrid)**.
      3. **Xếp hạng (ranking):** một model **học xếp hạng (learning to rank)** chấm điểm từng ứng viên
         bằng nhiều đặc trưng, sắp thành danh sách.
      4. **Chấm lại (rerank):** một model nặng (cross-encoder) xem kỹ vài chục kết quả đầu để tinh
         chỉnh top.

      Bài này nối tiếp hai bài trước: phễu nhiều tầng (ranking funnel) và hybrid search + rerank; ở
      đây ta ghép chúng thành một **search ranker hoàn chỉnh** và tập trung vào phần ML khó nhất:
      **lấy nhãn ở đâu để huấn luyện**.
  - id: b02
    type: text
    md: |
      **Tầng 1 — Hiểu truy vấn (query understanding).** Câu hỏi của người dùng thường ngắn, sai chính
      tả, đa nghĩa. Vài việc chuẩn:

      - **Sửa chính tả (spell correction):** "iphon 15" → "iphone 15".
      - **Mở rộng truy vấn (query expansion):** thêm từ đồng nghĩa / dạng số nhiều ("laptop" ↔ "máy
        tính xách tay") để không bỏ sót tài liệu dùng từ khác.
      - **Nhận ý định (intent):** truy vấn này muốn **mua sản phẩm** (navigational/transactional) hay
        **tìm thông tin** (informational)? Ý định quyết định lấy ứng viên từ đâu và xếp hạng theo
        tiêu chí nào (ví dụ ý định mua thì ưu tiên hàng còn kho, đánh giá cao).

      Đầu ra của tầng này là một truy vấn đã chuẩn hoá + tín hiệu ý định, truyền xuống tầng truy hồi.
  - id: b03
    type: text
    md: |
      **Tầng 2 — Truy hồi lai (hybrid retrieval) và chọn chỉ mục (index).** Không thể chấm điểm từng
      tài liệu trong hàng triệu; ta cần lấy nhanh một tập ứng viên nhỏ. Hai cách bổ sung nhau:

      - **Từ khóa / từ vựng (lexical, BM25):** khớp đúng chữ, chạy trên **chỉ mục đảo (inverted
        index)**. Mạnh với tên riêng, mã sản phẩm, từ hiếm; yếu khi người dùng dùng từ khác nghĩa
        giống nhau.
      - **Ngữ nghĩa / vector (semantic, dense):** đưa truy vấn và tài liệu về vector rồi tìm gần nhất
        trên **chỉ mục vector / ANN** (HNSW, IVF-PQ). Mạnh với diễn đạt khác chữ nhưng cùng nghĩa;
        yếu khi cần khớp chính xác một mã/ký hiệu.

      Vì mỗi bên mạnh ở chỗ bên kia yếu, thực tế dùng **hybrid**: chạy cả hai rồi **hợp nhất** hai
      danh sách (ví dụ reciprocal rank fusion — RRF). Chỉ mục vì vậy thường là **lai**: inverted index
      cho lexical + ANN index cho vector.
  - id: b04
    type: quiz_mcq
    graded: true
    prompt_md: |
      Người dùng tìm đúng mã sản phẩm "SKU-7741X" nhưng cũng hay tìm mô tả tự do như "áo khoác chống
      nước mùa đông". Vì sao nên dùng **hybrid retrieval** thay vì chỉ một kiểu?
    options:
      - {id: a, text_md: "Vì BM25 (chỉ mục đảo) khớp chính xác mã/từ hiếm rất tốt, còn vector khớp được diễn đạt khác chữ cùng nghĩa; mỗi bên mạnh ở chỗ bên kia yếu nên chạy cả hai rồi hợp nhất (RRF) phủ được cả hai loại truy vấn."}
      - {id: b, text_md: "Vì tìm theo vector luôn chính xác hơn BM25 trong mọi trường hợp, nên hybrid chỉ là chạy vector hai lần cho chắc."}
      - {id: c, text_md: "Vì hybrid bỏ hẳn chỉ mục đảo để tiết kiệm bộ nhớ, chỉ giữ chỉ mục vector."}
    answer: [a]
    explain_md: "Lexical/BM25 giỏi khớp chính xác mã và từ hiếm; vector giỏi khớp theo nghĩa khi khác chữ. Hybrid chạy cả hai và hợp nhất để phủ cả hai loại truy vấn. (b) sai: vector yếu đúng ở khớp chính xác mã/ký hiệu; (c) sai: hybrid giữ CẢ hai chỉ mục, không bỏ inverted index."
  - id: b05
    type: text
    md: |
      **Tầng 3 — Xếp hạng bằng học xếp hạng (learning to rank, LTR).** Sau truy hồi ta có vài trăm
      ứng viên; giờ cần sắp đúng thứ tự. Một model LTR chấm điểm mỗi (truy vấn, tài liệu) từ nhiều
      **đặc trưng (feature)**: điểm BM25, độ tương đồng vector, độ mới, độ phổ biến/tỉ lệ click lịch
      sử, tín hiệu cá nhân hoá (lịch sử người dùng)… Ba kiểu hàm mất mát:

      - **Pointwise:** coi mỗi kết quả là một bài hồi quy/phân loại điểm liên quan độc lập — đơn giản
        nhưng không trực tiếp tối ưu *thứ tự*.
      - **Pairwise:** học từng **cặp** (A nên đứng trên B) — khớp tốt với nhãn suy ra từ click.
      - **Listwise:** tối ưu chất lượng **cả danh sách** (ví dụ xấp xỉ NDCG) — thường mạnh nhất nhưng
        khó huấn luyện hơn.

      **Tầng 4 — Chấm lại (rerank):** lấy ~vài chục kết quả đầu rồi cho một **cross-encoder** (đọc
      đồng thời truy vấn + tài liệu) chấm lại kỹ. Chỉ chạy trên top nên vẫn kịp độ trễ.
  - id: b06
    type: text
    md: |
      **Tầng khó nhất về ML: lấy nhãn ở đâu?** Huấn luyện LTR cần **nhãn liên quan (relevance
      label)**. Thuê người chấm (rater) cho mọi (truy vấn, tài liệu) thì quá đắt và không theo kịp.
      Nguồn nhãn khổng lồ và miễn phí là **log click (click logs)**: ai click gì ở truy vấn nào.

      Nhưng **click không bằng liên quan**. Vấn đề lớn nhất là **position bias (thiên vị vị trí):**
      người dùng click kết quả ở trên **chỉ vì nó ở trên**, không hẳn vì nó liên quan hơn. Nếu lấy
      click thô làm nhãn, model chỉ học lại đúng thứ tự cũ (feedback loop), không khá lên.

      Cách hiệu chỉnh (debias):

      - **Tín hiệu đã-nhìn:** một kết quả không được click **chỉ là nhãn âm nếu nhiều khả năng đã được
        nhìn**. Suy ra nhãn từ **click skip**: nếu người dùng bỏ qua vị trí 1, 2 rồi click vị trí 3
        thì 3 **liên quan hơn** 1 và 2 (họ đã nhìn 1, 2 mà không chọn).
      - **Click model / IPW (inverse propensity weighting):** ước lượng **xác suất được nhìn theo vị
        trí** rồi chia ngược trọng số, để "cân lại" lợi thế của vị trí cao.
      - **Dùng dwell time / long-click, không chỉ click:** một **long-click** (click rồi ở lại lâu) là
        tín hiệu hài lòng mạnh hơn; click rồi quay lại ngay (pogo-sticking) coi như không liên quan.
      - **Pha thêm nhãn vàng (gold) do rater chấm** cho một mẫu nhỏ, để hiệu chuẩn và kiểm tra nhãn
        suy từ click.
  - id: b07
    type: callout
    kind: interview
    md: |
      **Bẫy phỏng vấn kinh điển.** Khi hỏi "lấy nhãn từ click thế nào", câu trả lời yếu là "click =
      liên quan". Người phỏng vấn muốn nghe bạn **chủ động nêu position bias** và **ít nhất một cách
      hiệu chỉnh** (skip-click để suy thứ tự, click model/IPW, dwell/long-click), rồi dùng **nhãn
      pairwise** (A trên B) hợp với dữ liệu click. Nói thêm "pha một ít nhãn người chấm để hiệu chuẩn"
      là điểm cộng.
  - id: b08
    type: quiz_mcq
    graded: true
    prompt_md: |
      Một truy vấn trả 3 kết quả R1, R2, R3 (theo thứ tự hiển thị). Log cho thấy người dùng **bỏ qua
      R1, R2** rồi **click R3 và ở lại lâu** (long-click). Cách suy nhãn và dùng nhãn nào là **đúng
      hướng** nhất?
    options:
      - {id: a, text_md: "Suy nhãn pairwise: R3 liên quan hơn R1 và R2 (R1, R2 nhiều khả năng đã được nhìn rồi bị bỏ qua, còn R3 được long-click). Vẫn phải nhớ đây là nhãn có position bias nên cần hiệu chỉnh (skip/IPW) và nên pha thêm nhãn rater."}
      - {id: b, text_md: "R1 liên quan nhất vì nó đứng đầu danh sách; R3 kém nhất vì đứng cuối. Dùng chính thứ tự hiển thị làm nhãn."}
      - {id: c, text_md: "Bỏ cả ba vì chỉ có một click; không thể rút ra nhãn nào từ một phiên tìm kiếm."}
    answer: [a]
    explain_md: "Bỏ qua R1, R2 (đã nhìn) rồi long-click R3 là bằng chứng R3 > R1, R2 — nhãn pairwise hợp với click, và long-click là tín hiệu hài lòng mạnh. (b) sai: lấy thứ tự hiển thị làm nhãn chính là rơi vào position bias, model không khá lên. (c) sai: click skip CÓ cho tín hiệu thứ tự; gộp nhiều phiên lại thành tập nhãn lớn."
  - id: b09
    type: text
    md: |
      **Đánh giá: ba tầng, đừng chỉ tin một con số.**

      - **Offline trên nhãn:** đo trước khi lên production. **NDCG** thưởng khi kết quả đúng đứng
        **cao** (vị trí 1 nặng hơn vị trí 5) và chuẩn hoá về 0–1; **MRR** nhìn vị trí của kết quả đúng
        **đầu tiên** (hợp khi chỉ cần một câu trả lời). Tính trên nhãn vàng của rater và/hoặc nhãn
        suy-từ-click **đã debias**; cũng theo dõi **recall@k** của tầng truy hồi (không để tầng dưới
        mất ứng viên tốt).
      - **Online A/B test:** chia lưu lượng, so metric thật (tỉ lệ click có ích, long-click, chuyển
        đổi, thời gian tìm thấy) giữa model mới và cũ — đây mới là bằng chứng cuối cùng.
      - **Interleaving:** trộn kết quả của hai model vào **cùng một danh sách** cho cùng người dùng rồi
        xem họ click của bên nào — nhạy hơn và cần ít lưu lượng hơn A/B để so hai ranker.

      **Độ mới (freshness):** tài liệu/sản phẩm thay đổi liên tục, nên chỉ mục phải **cập nhật tăng
      dần (incremental update)**; với nhiều truy vấn, kết quả mới cần lên nhanh (tin tức, hàng mới về).
  - id: b10
    type: quiz_fill
    graded: true
    prompt_md: |
      Điền thuật ngữ còn thiếu: Người dùng hay click kết quả ở trên **chỉ vì nó ở trên**, nên nếu lấy
      click thô làm nhãn thì model chỉ học lại thứ tự cũ. Hiện tượng thiên lệch này gọi là ______, và
      ta hiệu chỉnh bằng click model / IPW, suy nhãn từ skip-click, và dùng dwell/long-click.
    blanks:
      - accept: ["position bias", "thiên vị vị trí", "position_bias", "thiên lệch vị trí", "bias vị trí"]
    explain_md: "Position bias (thiên vị vị trí): xác suất được click phụ thuộc mạnh vào vị trí hiển thị, không chỉ vào độ liên quan. Phải hiệu chỉnh (IPW/click model, skip-click, dwell/long-click) trước khi dùng click làm nhãn."
  - id: b11
    type: quiz_mcq
    graded: true
    prompt_md: |
      Model LTR mới cho **NDCG offline cao hơn** rõ rệt trên bộ nhãn. Trước khi thay thế model cũ cho
      toàn bộ người dùng, bước hợp lý nhất là gì?
    options:
      - {id: a, text_md: "Chạy online A/B test (hoặc interleaving) để xem metric thật — tỉ lệ long-click, chuyển đổi, thời gian tìm thấy — có cải thiện không, vì NDCG offline chỉ là ước lượng trên nhãn (có thể lệch do cách suy nhãn)."}
      - {id: b, text_md: "Thay ngay cho 100% người dùng, vì NDCG offline cao hơn là đủ bằng chứng cuối cùng."}
      - {id: c, text_md: "Bỏ đánh giá online; chỉ cần đo thêm NDCG trên chính tập nhãn đó vài lần nữa cho chắc."}
    answer: [a]
    explain_md: "Offline (NDCG) rẻ và nhanh nhưng chỉ đo trên nhãn — nhãn suy từ click có thể lệch. Bằng chứng cuối cùng là online A/B hoặc interleaving trên hành vi thật. (b) rủi ro: offline tốt không đảm bảo online tốt; (c) đo lại cùng tập nhãn không thêm thông tin mới."
  - id: b12
    type: summary
    bullets_vi:
      - "Search ranker là **phễu 4 tầng**: hiểu truy vấn (sửa chính tả / mở rộng / ý định) → **hybrid retrieval** (BM25 trên inverted index + vector trên ANN, hợp nhất bằng RRF) → **xếp hạng LTR** → **rerank** bằng cross-encoder trên top."
      - "Chỉ mục thường là **lai**: inverted index cho khớp chính xác mã/từ hiếm, chỉ mục vector/ANN (HNSW, IVF-PQ) cho khớp theo nghĩa; mỗi bên bù chỗ yếu của bên kia."
      - "LTR có **pointwise / pairwise / listwise**; pairwise hợp với nhãn suy từ click, listwise (xấp xỉ NDCG) thường mạnh nhất."
      - "Nhãn chủ yếu đến từ **log click**, nhưng click dính **position bias** → phải hiệu chỉnh: suy nhãn từ **skip-click** (bỏ qua trên, click dưới ⇒ dưới liên quan hơn), **click model / IPW**, dùng **dwell/long-click**, và pha ít **nhãn vàng do rater chấm**."
      - "Đánh giá nhiều tầng: **offline NDCG/MRR + recall@k** trên nhãn, rồi **online A/B / interleaving** trên hành vi thật (bằng chứng cuối cùng); giữ **độ mới** bằng cập nhật index tăng dần."
