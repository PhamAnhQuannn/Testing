id: ml.rag_agents.agent_fundamentals
version: 1
status: published
title_vi: "Nền tảng agent, tool và MCP: LLM chạy trong vòng lặp, khi nào nên dùng agent"
est_minutes: 13
objectives_vi:
  - "Hiểu agent là một LLM chạy trong **vòng lặp** (loop): quan sát → chọn tool để gọi → hành động → đọc kết quả → lặp lại, khác với một prompt một-lần (one-shot)."
  - "Nêu được ba thành phần cốt lõi: **tool** (hàm model gọi được, có chữ ký JSON-schema), **agent loop / ReAct** (nghĩ–hành động–quan sát), và **memory/context** mang qua các bước; kèm điều kiện dừng và ngân sách bước."
  - "Giải thích **MCP (Model Context Protocol)** là chuẩn mở để cắm tool/dữ liệu vào model qua một giao diện đồng nhất, dùng lại được giữa nhiều app/client."
  - "Quyết định **khi nào nên dùng agent** (mở, nhiều bước, cần hành động ngoài) so với khi nào nên dùng **workflow/RAG cố định** (đoán trước được → rẻ và ổn định hơn)."
blocks:
  - id: b01
    type: text
    md: |
      Ở bài trước bạn đã cho LLM gọi hàm bằng **structured output / function calling** (đầu ra có cấu
      trúc để gọi tool). **Agent** là bước tiếp theo: thay vì một prompt một-lần (one-shot) trả lời
      ngay, agent là một LLM đặt trong một **vòng lặp (loop)**. Mỗi vòng, model:
      - **quan sát (observe)** tình trạng hiện tại và kết quả của bước trước,
      - **quyết định gọi tool nào (decide which tool to call)** với tham số gì,
      - **hành động (act)**: chương trình chạy tool đó và trả lại kết quả,
      - **đọc kết quả rồi lặp lại**, cho tới khi model cho rằng đã xong và trả lời cuối.

      Khác biệt mấu chốt với một prompt thường: một prompt one-shot chỉ sinh chữ **một lần**. Agent
      **tự quyết bước kế tiếp** dựa trên kết quả vừa nhận, nên nó xử lý được việc nhiều bước, chưa
      biết trước cần mấy lần gọi tool.
  - id: b02
    type: text
    md: |
      **Thành phần 1 — Tool (công cụ):** là những hàm mà model được phép gọi (tra đơn hàng, tìm web,
      chạy truy vấn, gửi mail…). Mỗi tool khai báo một **chữ ký bằng JSON-schema (JSON-schema
      signature)**: tên, mô tả "khi nào dùng", và các tham số kèm kiểu. Đây chính là thứ bạn đã học ở
      structured output / function calling — agent chỉ **tái sử dụng** nó. Model không tự chạy tool;
      nó chỉ *đề nghị* gọi tool nào với tham số nào, còn chương trình (phần code bạn viết) mới thật sự
      thực thi rồi đưa kết quả trở lại vòng lặp.

      Mẹo thiết kế tool (sẽ gặp lại ở bài an toàn agent): tên rõ ràng, mô tả ngắn nói rõ *khi nào*
      dùng, ít tham số, và **thông báo lỗi hữu ích** (ví dụ "không thấy khách X, thử mã khác") để
      model tự sửa ở vòng sau thay vì kẹt.
  - id: b03
    type: text
    md: |
      **Thành phần 2 — Agent loop (mẫu reason–act):** mẫu phổ biến nhất là **ReAct**: model **nghĩ
      (reason/think)** xem nên làm gì, **hành động (act)** bằng cách gọi một tool, rồi **quan sát
      (observe)** kết quả; vòng sau nó dùng kết quả đó để nghĩ tiếp. Lặp "nghĩ → hành động → quan sát"
      cho tới khi đủ dữ kiện để trả lời.

      **Thành phần 3 — Memory/context (bộ nhớ):** để nghĩ tiếp, model cần nhớ các bước trước. **Ngắn
      hạn** là lịch sử hội thoại và kết quả tool được giữ trong **context** và nối thêm qua từng vòng;
      **dài hạn** là lưu ra ngoài (file, cơ sở dữ liệu) rồi tra lại khi cần, vì context có hạn.

      **Điều kiện dừng và ngân sách bước (stop condition + step budget):** vì model tự quyết, nó có
      thể **lặp vô tận** hoặc đi lạc. Luôn đặt giới hạn cứng — tối đa số bước (max_steps), thời gian,
      hoặc tiền — và một điều kiện "coi như xong". Thiếu cái này là một trong các lỗi agent kinh điển.
  - id: b04
    type: quiz_mcq
    graded: true
    prompt_md: "Điểm **khác biệt cốt lõi** giữa một agent và một prompt một-lần (one-shot) là gì?"
    options:
      - {id: a, text_md: "Agent là một LLM chạy trong vòng lặp: nó tự quyết gọi tool nào dựa trên kết quả vừa nhận và lặp lại tới khi xong; một prompt one-shot chỉ sinh đầu ra một lần."}
      - {id: b, text_md: "Agent là một model đã được fine-tune (huấn luyện lại trọng số) để dùng tool, còn prompt one-shot thì dùng model gốc chưa huấn luyện."}
      - {id: c, text_md: "Agent luôn rẻ hơn và nhanh hơn một prompt one-shot vì nó gọi model ít lần hơn."}
    answer: [a]
    explain_md: "Agent = LLM trong một loop, tự chọn bước tiếp theo (gọi tool nào) theo kết quả quan sát được, lặp đến khi hoàn thành. (b) sai: agent không cần fine-tune — nó tái dùng function calling trên model thường. (c) sai: agent thường gọi model NHIỀU lần (mỗi vòng một lần), nên thường tốn hơn, không rẻ hơn."
  - id: b05
    type: callout
    kind: interview
    md: |
      **Câu phỏng vấn hay gặp — "Agent gồm những gì?"** Trả lời gọn theo ba trụ: (1) **tool** có chữ
      ký JSON-schema (tái dùng function calling), (2) **agent loop** kiểu ReAct (nghĩ → hành động →
      quan sát), (3) **memory/context** mang qua các bước. Rồi thêm một câu "và phải có **điều kiện
      dừng + ngân sách bước** để không lặp vô tận". Ba trụ + giới hạn an toàn là đủ ghi điểm.
  - id: b06
    type: text
    md: |
      **MCP (Model Context Protocol)** là một **chuẩn mở (open standard, 2024–25)** để kết nối model
      với tool và nguồn dữ liệu qua **một giao diện đồng nhất**. Ví dụ dễ nhớ: MCP là "**USB-C cho
      tool**" — một kiểu cắm chung, thay vì mỗi app tự chế một cách nối tool riêng.

      Lợi ích chính là **dùng lại được (reusable)**: một MCP server (chẳng hạn cho GitHub, cho cơ sở
      dữ liệu, cho hệ thống tệp) mô tả các tool của nó một lần, rồi **bất kỳ client/app nào nói MCP
      cũng cắm vào dùng được** — không phải viết lại phần tích hợp cho từng ứng dụng. Nó đứng trên
      cùng ý tưởng function calling (model vẫn chỉ *đề nghị* gọi tool), nhưng chuẩn hoá *cách khai báo
      và kết nối* để tool trở nên di động giữa các sản phẩm.
  - id: b07
    type: quiz_mcq
    graded: true
    prompt_md: "MCP (Model Context Protocol) giải quyết vấn đề gì — vì sao người ta ví nó là 'USB-C cho tool'?"
    options:
      - {id: a, text_md: "Nó là một chuẩn mở để khai báo và kết nối tool/dữ liệu qua một giao diện đồng nhất, nên một server tool viết một lần dùng lại được ở nhiều app/client khác nhau."}
      - {id: b, text_md: "Nó là một model ngôn ngữ mới nhanh hơn, thay thế cho việc gọi tool bằng function calling."}
      - {id: c, text_md: "Nó là một định dạng nén dữ liệu giúp nhồi nhiều token hơn vào context của model."}
    answer: [a]
    explain_md: "MCP là chuẩn mở cho cách model nối tới tool/dữ liệu qua giao diện chung, nên tool trở nên di động và dùng lại được giữa các app (ví dụ 'USB-C cho tool'). (b) sai: MCP không phải model, nó đứng trên ý tưởng function calling. (c) sai: MCP không phải thuật toán nén context."
  - id: b08
    type: text
    md: |
      **Khi nào nên dùng agent, khi nào không?** Đây là phần quan trọng nhất ở mức AI engineer: agent
      linh hoạt nhưng cũng **chậm hơn, tốn hơn và khó đoán hơn** (mỗi vòng một lần gọi model, lại có
      thể đi sai hướng).

      **Dùng agent khi** bài toán **mở, nhiều bước, chưa biết trước đường đi**, và **cần hành động ra
      ngoài** (tra nhiều nguồn, gọi nhiều tool tuỳ tình huống): ví dụ "đặt vé theo yêu cầu mơ hồ của
      khách", "điều tra một sự cố rồi đề xuất cách sửa".

      **Dùng workflow/pipeline cố định (hoặc RAG thường) khi** các bước **đoán trước được**: lúc đó
      một luồng do lập trình viên viết sẽ **rẻ hơn, nhanh hơn, ổn định và dễ kiểm thử hơn**. Ví dụ
      "đổi định dạng ngày", "tóm tắt email", hay "hỏi-đáp trên tài liệu" — chuỗi *truy xuất → nhồi
      ngữ cảnh → trả lời* của RAG là một workflow cố định, không cần agent. Nguyên tắc: **chọn thứ
      đơn giản nhất chạy được**; chỉ nâng lên agent khi tính mở của bài toán thật sự đòi hỏi.
  - id: b09
    type: quiz_mcq
    graded: true
    prompt_md: "Cho ba việc sau, việc nào **nên dùng agent** thay vì một workflow/pipeline cố định?"
    options:
      - {id: a, text_md: "Đặt vé du lịch theo một yêu cầu mơ hồ của khách, có thể phải tra nhiều chuyến, so giá, hỏi lại — số bước và đường đi chưa biết trước."}
      - {id: b, text_md: "Đổi mọi ngày trong một tệp CSV sang định dạng ISO 8601 — luật cố định, biết trước mọi bước."}
      - {id: c, text_md: "Hỏi-đáp trên một tập tài liệu nội bộ bằng chuỗi truy xuất → nhồi ngữ cảnh → trả lời (RAG) đã có sẵn."}
    answer: [a]
    explain_md: "(a) mở, nhiều bước, đường đi tuỳ tình huống và cần hành động ngoài → đúng chỗ cho agent. (b) luật cố định, đoán trước được → workflow thường, rẻ và ổn định hơn. (c) RAG là một pipeline cố định (truy xuất → nhồi → trả lời), không cần agent. Nguyên tắc: chọn thứ đơn giản nhất chạy được."
  - id: b10
    type: quiz_fill
    graded: true
    prompt_md: |
      Điền thuật ngữ còn thiếu: Để agent không **lặp vô tận** hay đi lạc khi tự quyết bước tiếp theo,
      ta luôn đặt một giới hạn cứng về số bước tối đa — gọi là ______ (giới hạn/ngân sách bước).
    blanks:
      - accept: ["step budget", "ngân sách bước", "giới hạn bước", "max_steps", "max steps", "step limit"]
    explain_md: "Vì agent tự quyết nên có nguy cơ lặp vô tận hoặc đi lạc; step budget (ngân sách/giới hạn bước, ví dụ max_steps) cùng điều kiện dừng là guardrail cơ bản để vòng lặp luôn kết thúc."
  - id: b11
    type: summary
    bullets_vi:
      - "**Agent** = một LLM chạy trong **vòng lặp (loop)**: quan sát → **chọn tool để gọi** → hành động → đọc kết quả → lặp đến khi xong; khác prompt **one-shot** chỉ sinh đầu ra một lần."
      - "Ba trụ: **tool** (hàm có chữ ký JSON-schema, tái dùng function calling), **agent loop / ReAct** (nghĩ → hành động → quan sát), **memory/context** mang qua các bước."
      - "Luôn có **điều kiện dừng + ngân sách bước** (step budget / max_steps) để agent không lặp vô tận."
      - "**MCP (Model Context Protocol)** là chuẩn mở ('USB-C cho tool') để cắm tool/dữ liệu qua giao diện đồng nhất, dùng lại được giữa nhiều app/client."
      - "**Dùng agent** khi bài toán mở, nhiều bước, cần hành động ngoài; **dùng workflow/RAG cố định** khi đoán trước được (rẻ, nhanh, ổn định hơn). Chọn thứ đơn giản nhất chạy được."
