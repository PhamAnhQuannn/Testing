id: ml.math.linear_algebra_basics
version: 1
status: published
title_vi: "Vector, ma trận và phép nhân ma trận"
est_minutes: 15
objectives_vi:
  - "Tính tích vô hướng (dot product) của hai vector và hiểu nó là khối cơ bản của mọi phép nhân ma trận."
  - "Nhân hai ma trận bằng tay, suy ra shape kết quả theo quy tắc (m×n)(n×p) → (m×p), và biết khi nào phép nhân không hợp lệ."
  - "Tính transpose, chuẩn L2, khoảng cách và cosine similarity; biết ma trận đơn vị và nghịch đảo làm gì (mức nhận biết)."
blocks:
  - id: s_matmul
    type: section
    title_vi: "Dot product và nhân ma trận"
    summary_vi: "Vector là dãy số; dot product nhân từng cặp rồi cộng; ô (i, j) của tích ma trận là dot của hàng i với cột j."
    exercise_ref: ex_dot
  - id: t01
    type: text
    md: |
      **Vector** là dãy n số, ví dụ `[1, 2, 3]`. **Ma trận** (matrix) là bảng m hàng × n cột; cặp `(m, n)` gọi là **shape**.

      **Dot product** (tích vô hướng): nhân từng cặp phần tử cùng vị trí rồi cộng lại.
      `[1,2,3]·[4,5,6] = 1·4 + 2·5 + 3·6 = 32`. Hai vector phải cùng độ dài.

      **Nhân ma trận**: ô `(i, j)` của `C = A @ B` bằng dot của **hàng i** của A với **cột j** của B:
      `C[i][j] = Σₖ A[i][k] · B[k][j]`.

      **Quy tắc shape**: `(m×n) @ (n×p) → (m×p)`. Số **cột** của A phải bằng số **hàng** của B (cả hai là `n`),
      nếu không phép nhân không xác định. Ví dụ `(2×3)@(3×2)` cho `(2×2)`, còn `(2×3)@(2×3)` là lỗi.

      Nhớ rằng `A @ B` khác `B @ A` (thường khác kết quả, thậm chí khác shape), và `A * B` trong NumPy là nhân
      từng phần tử, không phải nhân ma trận. Với mạng nơ-ron, `X @ W + b` với X `(4×3)`, W `(3×2)` cho shape `(4×2)`.
  - id: b01
    type: code_sample
    lang: python
    runnable: true
    code: |
      def dot(a, b):
          return sum(x * y for x, y in zip(a, b))


      A = [[1, 2, 3], [4, 5, 6]]
      B = [[1, 0], [0, 1], [1, 1]]
      cols_B = [list(col) for col in zip(*B)]
      C = [[dot(row, col) for col in cols_B] for row in A]
      print(dot([1, 2, 3], [4, 5, 6]))
      print(C)
    expected_output: |
      32
      [[4, 5], [10, 11]]
  - id: q01
    type: quiz_mcq
    prompt_md: "`A` có shape `(2×3)` và `B` có shape `(3×4)`. Shape của `A @ B` là gì?"
    options:
      - {id: a, text_md: "`(2×4)`"}
      - {id: b, text_md: "`(3×3)`"}
      - {id: c, text_md: "`(2×3)`"}
      - {id: d, text_md: "Không hợp lệ"}
    answer: [a]
    explain_md: "Cột của A (3) bằng hàng của B (3) nên hợp lệ; kết quả lấy số hàng của A và số cột của B: `(2×4)`."
  - id: q02
    type: quiz_fill
    prompt_md: "`A` shape `(5×2)` và `B` shape `(2×7)`. Kết quả `A @ B` có shape `(5×___)`. Điền một số."
    blanks: [{accept: ["7"]}]
    explain_md: "`(m×n)@(n×p) → (m×p)` với m=5, n=2, p=7, nên kết quả `(5×7)`."
  - id: q03
    type: predict_output
    code: |
      P = [[1, 2], [3, 4]]
      Q = [[0, 1], [1, 0]]
      C = [[sum(P[i][k] * Q[k][j] for k in range(2)) for j in range(2)] for i in range(2)]
      print(C)
    expected_output: |
      [[2, 1], [4, 3]]
    explain_md: "Nhân bên phải với ma trận hoán đổi cột đổi chỗ hai cột của P: hàng `[1,2]` thành `[2,1]`, hàng `[3,4]` thành `[4,3]`."
  - id: ex_dot
    type: code_exercise
    md: |
      `dot(a, b)` trả tích vô hướng của hai vector cùng độ dài (list số). Bản dưới đây cộng từng cặp thay vì nhân.
      Hãy sửa.
    entry: dot
    starter: |
      def dot(a, b):
          return sum(x + y for x, y in zip(a, b))
    guidance_md: |
      - Thử `dot([1, 2, 3], [4, 5, 6])`: đáp án `32`, code trả `21`.
      - Mỗi cặp phải được nhân `x * y` trước khi cộng.
    hints:
      - level: nudge
        md: "Dot product nhân từng cặp rồi mới cộng. Code đang làm phép nào?"
      - level: approach
        md: "Trong `sum(...)`, thay phép cộng giữa `x` và `y` bằng phép nhân."
      - level: near_solution
        md: "`return sum(x * y for x, y in zip(a, b))`."
    tests:
      - {args: [[1, 2, 3], [4, 5, 6]], expected: 32}
      - {args: [[], []], expected: 0}
      - {args: [[1, -1], [1, 1]], expected: 0}
      - {args: [[2], [5]], expected: 10}
    solution: |
      def dot(a, b):
          return sum(x * y for x, y in zip(a, b))
  - id: s_norm
    type: section
    title_vi: "Transpose, chuẩn L2 và cosine similarity"
    summary_vi: "Transpose lật hàng thành cột; chuẩn L2 đo độ dài; cosine similarity đo hướng giống nhau của hai vector."
    exercise_ref: ex_cos
  - id: t02
    type: text
    md: |
      **Transpose** `Aᵀ`: lật hàng thành cột. Shape `(m×n)` thành `(n×m)`; `[[1,2],[3,4]]` thành `[[1,3],[2,4]]`.
      Trong Python: `[list(r) for r in zip(*A)]`.

      **Chuẩn L2** (độ dài vector): `|x| = √(Σ xᵢ²)`. `|[3,4]| = 5`. **Khoảng cách L2** giữa hai điểm là chuẩn của hiệu:
      `|a − b|`. (Chuẩn L1 là tổng `|xᵢ|`.)

      **Cosine similarity**: `cos = a·b / (|a|·|b|)`. Giá trị `1` là cùng hướng, `0` là vuông góc, `−1` là ngược hướng.
      Nó chỉ nhìn **hướng**, không nhìn độ dài: `[1,0]` và `[2,0]` cho cos = 1. Vì vậy hay dùng so embedding.
      Nếu một vector là `0` thì mẫu số bằng 0, cần xử lý riêng (ở đây trả `0.0`).

      **Nhận biết thêm**: ma trận đơn vị `I` (đường chéo 1) không đổi gì: `A @ I = A`. Nghịch đảo `A⁻¹` hoàn tác `A`
      (`A @ A⁻¹ = I`) và chỉ có với ma trận vuông khả nghịch. Khi in số thực, làm tròn (`round(x, 6)`) để so sánh ổn định.
  - id: q04
    type: quiz_mcq
    prompt_md: "Với `a = [1, 0]` và `b = [3, 0]`, cosine similarity bằng bao nhiêu?"
    options:
      - {id: a, text_md: "`1.0`, vì cùng hướng dù dài khác nhau"}
      - {id: b, text_md: "`0.0`, vì hai vector khác nhau"}
      - {id: c, text_md: "`3.0`, vì b dài gấp 3"}
    answer: [a]
    explain_md: "`a·b = 3`, `|a| = 1`, `|b| = 3` nên cos = 3/3 = 1. Cosine bỏ qua độ dài, chỉ giữ hướng."
  - id: q05
    type: predict_output
    code: |
      a = [3, 4]
      b = [4, 3]
      d = sum(x * y for x, y in zip(a, b))
      n = sum(x * x for x in a) ** 0.5
      print(d, n, round(d / (n * n), 6))
    expected_output: |
      24 5.0 0.96
    explain_md: "`d = 12 + 12 = 24`; `|a| = √25 = 5.0`; `|b|` cũng 5 nên cos = 24/25 = 0.96."
  - id: q06
    type: quiz_fill
    prompt_md: "Transpose của ma trận shape `(2×3)` có shape `(___×2)`. Điền một số."
    blanks: [{accept: ["3"]}]
    explain_md: "Transpose đổi hàng và cột: `(m×n)` thành `(n×m)`, nên `(2×3)` thành `(3×2)`."
  - id: ex_cos
    type: code_exercise
    md: |
      `cosine(a, b)` trả cosine similarity của hai vector, làm tròn 6 chữ số thập phân. Nếu một vector toàn số 0 thì trả
      `0.0`. Bản dưới quên lấy căn bậc hai khi tính độ dài. Hãy sửa.
    entry: cosine
    starter: |
      def cosine(a, b):
          d = sum(x * y for x, y in zip(a, b))
          na = sum(x * x for x in a)
          nb = sum(y * y for y in b)
          if na == 0 or nb == 0:
              return 0.0
          return round(d / (na * nb), 6)
    guidance_md: |
      - Thử `cosine([1, 0], [1, 1])`: đáp án `0.707107`, code trả `0.5`.
      - Độ dài là `√(Σ xᵢ²)`, nhớ `** 0.5`.
    hints:
      - level: nudge
        md: "`na` và `nb` hiện là tổng bình phương. Còn thiếu bước nào để thành độ dài?"
      - level: approach
        md: "Lấy căn bậc hai: `na ** 0.5` và `nb ** 0.5` (giữ nguyên kiểm tra bằng 0)."
      - level: near_solution
        md: "`return round(d / ((na ** 0.5) * (nb ** 0.5)), 6)`."
    tests:
      - {args: [[1, 0], [1, 1]], expected: 0.707107}
      - {args: [[1, 0], [2, 0]], expected: 1.0}
      - {args: [[1, 0], [0, 1]], expected: 0.0}
      - {args: [[0, 0], [1, 1]], expected: 0.0}
      - {args: [[1, 2], [-1, -2]], expected: -1.0}
    solution: |
      def cosine(a, b):
          d = sum(x * y for x, y in zip(a, b))
          na = sum(x * x for x in a) ** 0.5
          nb = sum(y * y for y in b) ** 0.5
          if na == 0 or nb == 0:
              return 0.0
          return round(d / (na * nb), 6)
  - id: t_sum
    type: summary
    bullets_vi:
      - "Dot product: nhân từng cặp rồi cộng. Ô (i, j) của A @ B là dot của hàng i của A với cột j của B."
      - "Quy tắc shape: (m×n)@(n×p) → (m×p); cột của A phải bằng hàng của B, nếu không phép nhân không hợp lệ."
      - "Transpose đổi (m×n) thành (n×m); chuẩn L2 = √(Σxᵢ²); khoảng cách L2 = chuẩn của hiệu hai vector."
      - "Cosine similarity = a·b/(|a||b|) chỉ đo hướng (1 cùng hướng, 0 vuông góc, −1 ngược); A @ I = A, A⁻¹ hoàn tác A."
