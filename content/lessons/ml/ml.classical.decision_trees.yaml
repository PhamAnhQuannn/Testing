id: ml.classical.decision_trees
version: 1
status: published
title_vi: "Decision trees"
est_minutes: 14
objectives_vi:
  - "Tính tay Gini impurity, entropy và information gain cho một tập nhãn nhỏ."
  - "Hiểu cách cây chọn split tốt nhất theo kiểu greedy: giảm impurity có trọng số nhiều nhất."
  - "Giải thích overfitting của cây sâu, pre-pruning/post-pruning, và vì sao một cây có variance cao."
blocks:
  - id: s_impurity
    type: section
    title_vi: "Impurity và information gain"
    summary_vi: "Gini, entropy đo độ lẫn lộn của nhãn; information gain đo mức giảm impurity sau một split."
  - id: t01
    type: text
    md: |
      **Decision tree** hỏi một chuỗi câu hỏi yes/no về feature (ví dụ `tuổi < 30?`) để chia dữ liệu thành các nhóm ngày càng
      "thuần" hơn. Một nút **thuần** khi mọi mẫu trong đó cùng một nhãn.

      Với một nút có tỉ lệ lớp `p_1, ..., p_k`:

      - **Gini impurity** = `1 − Σ p_i²`. Hai lớp 50/50: `1 − (0.25 + 0.25) = 0.5`. Nút thuần: `0`.
      - **Entropy** = `−Σ p_i · log2(p_i)`. Hai lớp 50/50: `1.0` bit. Nút thuần: `0`.

      Cả hai đạt cực đại khi các lớp trộn đều và bằng 0 khi thuần.

      **Information gain** của một split = impurity của nút cha **trừ** impurity trung bình có trọng số của các nút con
      (trọng số = tỉ lệ số mẫu đi vào mỗi con):

      ```
      gain = impurity(parent) - (n_left/n * impurity(left) + n_right/n * impurity(right))
      ```

      Ví dụ: cha `[0, 0, 1, 1]` (Gini 0.5), tách thành `[0, 0]` và `[1, 1]` cho hai con thuần: gain = `0.5 − 0 = 0.5`.
      Trọng số quan trọng: con lớn phải đóng góp nhiều hơn con nhỏ.
  - id: q01
    type: quiz_mcq
    prompt_md: "Gini impurity của nhãn `[0, 0, 1, 1]` là bao nhiêu?"
    options:
      - {id: a, text_md: "0.5"}
      - {id: b, text_md: "0"}
      - {id: c, text_md: "1.0"}
    answer: [a]
    explain_md: "p = 0.5 cho mỗi lớp: 1 − (0.25 + 0.25) = 0.5. (1.0 là entropy của cùng tập này, không phải Gini.)"
  - id: q02
    type: predict_output
    code: |
      import math
      p = [0.5, 0.5]
      print(-sum(x * math.log2(x) for x in p))
    expected_output: |
      1.0
    explain_md: "log2(0.5) = −1 nên mỗi số hạng −x·log2(x) = 0.5; tổng 0.5 + 0.5 = 1.0 bit."
  - id: q03
    type: quiz_mcq
    prompt_md: "Vì sao information gain dùng impurity trung bình có TRỌNG SỐ của các nút con?"
    options:
      - {id: a, text_md: "Để nút con có nhiều mẫu ảnh hưởng nhiều hơn nút con ít mẫu"}
      - {id: b, text_md: "Để gain luôn bằng 1"}
      - {id: c, text_md: "Để cây luôn cân bằng hai nhánh"}
    answer: [a]
    explain_md: "Một nút con chỉ có 1 mẫu thuần không nên che đi nút con 99 mẫu vẫn lẫn lộn; trọng số theo kích thước phản ánh điều đó."
  - id: s_prune
    type: section
    title_vi: "Greedy split, overfitting và pruning"
    summary_vi: "Cây chọn split greedy, dễ overfit khi quá sâu; pruning và ensemble giảm variance."
    exercise_ref: ex_wg
  - id: t02
    type: text
    md: |
      **Greedy best split**: tại mỗi nút, cây thử mọi feature và ngưỡng khả dĩ, chọn split có information gain lớn nhất
      (hoặc impurity có trọng số thấp nhất), rồi lặp lại đệ quy trên từng con. Cây **không quay lại** sửa lựa chọn cũ nên
      không đảm bảo tối ưu toàn cục.

      **Overfitting**: nếu cho cây lớn đến khi mọi lá thuần, nó nhớ cả nhiễu của tập train (train accuracy 100%,
      validation thấp). Hai cách chống:

      - **Pre-pruning** (dừng sớm): giới hạn `max_depth`, `min_samples_leaf`, hoặc không split nếu gain nhỏ hơn ngưỡng.
      - **Post-pruning**: cho cây lớn hết cỡ rồi cắt các nhánh không cải thiện điểm trên validation (ví dụ cost-complexity
        pruning với tham số `alpha`).

      **Hạn chế**: một cây đơn có **variance cao**: đổi vài mẫu train có thể cho ra cây hoàn toàn khác (split ở gốc
      đổi kéo theo mọi thứ bên dưới). Ranh giới quyết định là các mảng vuông góc trục nên khó biểu diễn đường chéo. Giải
      pháp phổ biến là gộp nhiều cây (random forest, boosting), giảm variance.

      Ví dụ tính tay: cha `[0, 0, 1, 1]` (Gini 0.5), tách `[0, 0, 1]` và `[1]`. Gini con trái = `1 − (4/9 + 1/9) = 4/9`,
      con phải = 0. Có trọng số: `3/4 · 4/9 + 1/4 · 0 = 1/3`. Gain = `0.5 − 0.3333 = 0.1667`.
  - id: q04
    type: quiz_mcq
    prompt_md: "Cây train accuracy 100% nhưng validation accuracy 70%. Hướng xử lý hợp lý nhất?"
    options:
      - {id: a, text_md: "Giảm `max_depth` hoặc tăng `min_samples_leaf` (pruning)"}
      - {id: b, text_md: "Tăng `max_depth` thêm nữa"}
      - {id: c, text_md: "Bỏ validation set"}
    answer: [a]
    explain_md: "Đây là overfitting; hạn chế độ phức tạp của cây (pre/post-pruning) làm giảm khoảng cách train–validation."
  - id: q05
    type: quiz_fill
    prompt_md: "Một cây đơn nhạy với thay đổi nhỏ của dữ liệu train: nó có ___ cao (điền: variance)."
    blanks: [{accept: ["variance", "phương sai"]}]
    explain_md: "Variance cao nghĩa là mô hình đổi nhiều khi dữ liệu train đổi; random forest giảm variance bằng cách lấy trung bình nhiều cây."
  - id: q06
    type: predict_output
    code: |
      def gini(l):
          n = len(l)
          return 1 - sum((l.count(c) / n) ** 2 for c in set(l))
      parent = [0, 0, 1, 1]
      left, right = [0, 0, 1], [1]
      w = (len(left) * gini(left) + len(right) * gini(right)) / len(parent)
      print(gini(parent))
      print(round(w, 3))
      print(round(gini(parent) - w, 3))
    expected_output: "0.5\n0.333\n0.167"
    explain_md: "Gini cha = 0.5; trung bình có trọng số = 3/4 · 4/9 + 1/4 · 0 = 0.333; gain = 0.5 − 0.333 = 0.167."
  - id: ex_wg
    type: code_exercise
    md: |
      `weighted_gini(left, right)` trả Gini impurity trung bình **có trọng số theo kích thước** của hai nút con,
      làm tròn 6 chữ số (hai list nhãn; nếu cả hai rỗng trả `0.0`). Bản dưới lấy trung bình cộng đơn giản của hai Gini
      (không trọng số) nên sai. Hãy sửa.
    entry: weighted_gini
    starter: |
      def gini(labels):
          n = len(labels)
          if n == 0:
              return 0.0
          return 1.0 - sum((labels.count(c) / n) ** 2 for c in set(labels))


      def weighted_gini(left, right):
          return round((gini(left) + gini(right)) / 2, 6)
    guidance_md: |
      - Thử `weighted_gini([0, 0, 1], [1])`: đáp án `0.333333` (3/4 · 4/9), code trả `0.222222`.
      - Mỗi Gini phải nhân với số mẫu của nút đó rồi chia cho tổng số mẫu.
    hints:
      - level: nudge
        md: "Nút con có 3 mẫu và nút con có 1 mẫu có nên đóng góp ngang nhau không?"
      - level: approach
        md: "`n = len(left) + len(right)`; kết quả = `(len(left) * gini(left) + len(right) * gini(right)) / n`."
      - level: near_solution
        md: "Thêm `if n == 0: return 0.0` rồi `return round((len(left) * gini(left) + len(right) * gini(right)) / n, 6)`."
    tests:
      - {args: [[0, 0], [1, 1]], expected: 0.0}
      - {args: [[0, 1], [0, 1]], expected: 0.5}
      - {args: [[0, 0, 1], [1]], expected: 0.333333}
      - {args: [[], [0, 1]], expected: 0.5}
    solution: |
      def gini(labels):
          n = len(labels)
          if n == 0:
              return 0.0
          return 1.0 - sum((labels.count(c) / n) ** 2 for c in set(labels))


      def weighted_gini(left, right):
          n = len(left) + len(right)
          if n == 0:
              return 0.0
          total = len(left) * gini(left) + len(right) * gini(right)
          return round(total / n, 6)
  - id: t_sum
    type: summary
    bullets_vi:
      - "Gini = 1 − Σ p²; entropy = −Σ p·log2 p. Hai lớp 50/50: Gini 0.5, entropy 1.0; nút thuần: 0."
      - "Information gain = impurity(cha) − Σ (n_con/n)·impurity(con); trọng số theo kích thước nút con."
      - "Cây chọn split greedy theo gain lớn nhất, không quay lại sửa."
      - "Cây sâu overfit; chống bằng pre-pruning (max_depth, min_samples_leaf) hoặc post-pruning (cắt nhánh theo validation)."
      - "Một cây đơn có variance cao; random forest/boosting gộp nhiều cây để giảm variance."
