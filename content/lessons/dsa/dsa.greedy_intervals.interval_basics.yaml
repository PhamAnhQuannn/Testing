id: dsa.greedy_intervals.interval_basics
version: 1
status: published
title_vi: "Khoảng cơ bản: gộp, chèn, chồng lấn (interval fundamentals)"
est_minutes: 14
objectives_vi:
  - "Phát biểu đúng điều kiện hai khoảng chồng lấn (overlap) và phân biệt trường hợp chạm đầu mút."
  - "Gộp khoảng bằng cách sắp xếp theo điểm bắt đầu rồi đi một lượt, mở rộng khoảng cuối cùng."
  - "Nhận ra khi nào sắp theo điểm kết thúc (greedy chọn tối đa khoảng không chồng lấn / xóa tối thiểu)."
  - "Áp dụng cùng kiểu quét một lượt cho summary ranges và insert interval."
blocks:
  - id: s_merge
    type: section
    title_vi: "Điều kiện overlap và gộp khoảng"
    summary_vi: "Sort theo start, rồi mở rộng khoảng cuối nếu start mới <= end hiện tại."
    exercise_ref: ex_merge
  - id: t01
    type: text
    md: |
      Một **khoảng (interval)** là cặp `[start, end]`, ví dụ cuộc họp từ 9 giờ đến 10 giờ. Hai khoảng `a`
      và `b` **chồng lấn (overlap)** khi `a.start < b.end` **và** `b.start < a.end`. Câu hỏi quan trọng là
      **chạm đầu mút**: `[1, 3]` và `[3, 5]` có chồng lấn không? Với bài *họp trùng giờ* thì không (họp
      xong lúc 3 giờ rồi họp tiếp lúc 3 giờ vẫn được), nhưng với bài *gộp khoảng* thì có gộp thành `[1, 5]`.
      Luôn đọc đề để chọn `<` hay `<=`.

      **Gộp khoảng (merge intervals)** theo công thức cố định: sắp xếp theo `start`, rồi duyệt một lượt.
      Nếu `start` của khoảng mới `<=` `end` của khoảng cuối trong kết quả thì **mở rộng** end bằng `max`
      (không phải gán thẳng, vì khoảng mới có thể nằm gọn bên trong); ngược lại thì thêm khoảng mới.
      Độ phức tạp O(n log n) do sort, phần quét chỉ O(n).
  - id: b01
    type: code_sample
    lang: python
    runnable: true
    code: |
      def overlap(a, b):
          return a[0] < b[1] and b[0] < a[1]

      print(overlap([1, 3], [2, 5]))
      print(overlap([1, 3], [3, 5]))
      print(overlap([1, 10], [4, 6]))
    expected_output: |
      True
      False
      True
  - id: b02
    type: code_sample
    lang: python
    runnable: true
    code: |
      def merge_intervals(intervals):
          out = []
          for s, e in sorted(intervals):
              if out and s <= out[-1][1]:
                  out[-1][1] = max(out[-1][1], e)
              else:
                  out.append([s, e])
          return out

      print(merge_intervals([[8, 10], [1, 3], [2, 6], [15, 18]]))
      print(merge_intervals([[1, 4], [4, 5]]))
      print(merge_intervals([[1, 10], [2, 3]]))
    expected_output: |
      [[1, 6], [8, 10], [15, 18]]
      [[1, 5]]
      [[1, 10]]
  - id: q01
    type: quiz_mcq
    prompt_md: "Trong `merge_intervals`, vì sao dùng `max(out[-1][1], e)` thay vì gán `out[-1][1] = e`?"
    options:
      - {id: a, text_md: "Vì khoảng mới có thể nằm gọn trong khoảng cuối, ví dụ `[1, 10]` rồi `[2, 3]`, và gán thẳng sẽ làm end bị thu nhỏ"}
      - {id: b, text_md: "Vì `max` chạy nhanh hơn phép gán"}
      - {id: c, text_md: "Vì danh sách đã sort theo end nên end mới luôn nhỏ hơn"}
    answer: [a]
    explain_md: "Chỉ sort theo start nên end không đơn điệu; phải lấy max để giữ phần che phủ lớn nhất."
  - id: ex_merge
    type: code_exercise
    md: |
      Viết `merge_intervals(intervals)`: gộp mọi khoảng chồng lấn (kể cả chạm đầu mút, như `[1,4]` và
      `[4,5]` thành `[1,5]`) và trả danh sách khoảng đã gộp, sắp theo start. Danh sách rỗng trả `[]`.
    entry: merge_intervals
    starter: |
      def merge_intervals(intervals):
          # TODO: sort theo start, rồi quét một lượt để gộp
          return sorted(intervals)
    guidance_md: |
      - Sort theo `start` (sort mặc định của list các cặp là đủ).
      - Giữ danh sách `out`; so `start` mới với `end` của phần tử cuối.
      - Chồng lấn hoặc chạm thì mở rộng end bằng `max`, ngược lại thì thêm khoảng mới.
    hints:
      - level: nudge
        md: "Nếu danh sách đã sắp theo start, khoảng mới chỉ có thể chồng lấn với khoảng nào trong kết quả?"
      - level: approach
        md: "Chỉ cần so với khoảng cuối cùng của kết quả: nếu `s <= cuối.end` thì cập nhật end bằng max, không thì thêm mới."
      - level: near_solution
        md: "Duyệt `for s, e in sorted(...)`: nhánh một khi kết quả không rỗng và `s` không vượt end cuối thì gộp, nhánh còn lại thêm cặp mới vào kết quả."
    tests:
      - {args: [[]], expected: []}
      - {args: [[[8, 10], [1, 3], [2, 6], [15, 18]]], expected: [[1, 6], [8, 10], [15, 18]]}
      - {args: [[[1, 4], [4, 5]]], expected: [[1, 5]]}
      - {args: [[[1, 10], [2, 3], [4, 5]]], expected: [[1, 10]]}
      - {args: [[[1, 2], [3, 4]]], expected: [[1, 2], [3, 4]]}
    solution: |
      def merge_intervals(intervals):
          out = []
          for s, e in sorted(intervals):
              if out and s <= out[-1][1]:
                  out[-1][1] = max(out[-1][1], e)
              else:
                  out.append([s, e])
          return out
  - id: s_greedy
    type: section
    title_vi: "Sort theo end, summary ranges và insert"
    summary_vi: "Chọn tối đa khoảng không chồng lấn: sort theo end; quét một lượt cũng dùng cho summary/insert."
  - id: t02
    type: text
    md: |
      **Sort theo end khi nào?** Bài "chọn nhiều cuộc họp nhất không trùng nhau" (hay "xóa ít khoảng nhất
      để hết chồng lấn", tức `n - số khoảng giữ lại`) dùng **greedy**: sắp theo `end` tăng dần, luôn giữ
      khoảng kết thúc sớm nhất để chừa chỗ cho các khoảng sau. Duyệt, nếu `start >= end_đã_chọn` thì giữ
      và cập nhật `end_đã_chọn`, ngược lại bỏ qua. Sort theo start không cho đúng kết quả này vì một khoảng
      dài có thể chặn nhiều khoảng ngắn.

      Còn **chèn khoảng (insert interval)** trên danh sách đã sắp: chia ba pha, (1) sao chép các khoảng
      kết thúc trước khi khoảng mới bắt đầu, (2) gộp mọi khoảng chồng lấn vào khoảng mới bằng `min` start
      và `max` end, (3) sao chép phần còn lại. Không cần sort lại, chỉ O(n).

      **Summary ranges** trên dãy số đã sắp cũng là quét một lượt: mở rộng đoạn `i..j` khi
      `nums[j+1] == nums[j] + 1`, rồi in `"a->b"` nếu `i != j`, ngược lại in `"a"`.
  - id: q02
    type: quiz_fill
    prompt_md: "Để chọn được nhiều khoảng không chồng lấn nhất bằng greedy, ta sắp xếp các khoảng theo điểm ___ tăng dần."
    blanks: [{accept: ["end", "kết thúc", "ket thuc"]}]
    explain_md: "Giữ khoảng kết thúc sớm nhất để chừa nhiều chỗ nhất cho phần còn lại."
  - id: q03
    type: predict_output
    code: |
      def keep_count(iv):
          iv = sorted(iv, key=lambda x: x[1])
          cnt, end = 0, float("-inf")
          for s, e in iv:
              if s >= end:
                  cnt += 1
                  end = e
          return cnt

      print(keep_count([[1, 4], [2, 3], [3, 5], [4, 6]]))
    expected_output: |
      2
    explain_md: "Sort theo end: [2,3], [1,4], [3,5], [4,6]. Giữ [2,3] (end=3); bỏ [1,4] vì 1<3; giữ [3,5] (end=5); bỏ [4,6] vì 4<5. Giữ 2 khoảng."
  - id: q04
    type: predict_output
    code: |
      def compress(nums):
          out = []
          i = 0
          while i < len(nums):
              j = i
              while j + 1 < len(nums) and nums[j + 1] == nums[j] + 1:
                  j += 1
              out.append(str(nums[i]) if i == j else f"{nums[i]}->{nums[j]}")
              i = j + 1
          return out

      print(compress([0, 1, 2, 4, 5, 7]))
    expected_output: |
      ['0->2', '4->5', '7']
    explain_md: "Các đoạn liên tiếp là 0..2, 4..5 và số lẻ 7."
  - id: t_sum
    type: summary
    bullets_vi:
      - "Overlap: `a.start < b.end and b.start < a.end`; chạm đầu mút tính hay không tùy đề (gộp thì có, họp trùng giờ thì không)."
      - "Merge: sort theo start, quét một lượt, mở rộng end bằng `max`; O(n log n)."
      - "Chọn tối đa khoảng không chồng lấn / xóa tối thiểu: sort theo end, giữ khoảng nào có `start >= end_đã_chọn`."
      - "Insert interval (danh sách đã sắp) và summary ranges đều là quét một lượt O(n), không cần sort lại."
