id: dsa.foundations.interview_method
version: 2
status: published
title_vi: "Quy trình giải bài phỏng vấn (interview method)"
est_minutes: 10
objectives_vi:
  - "Nêu đúng thứ tự: làm rõ đề, ví dụ và biên, brute force, tối ưu, code, kiểm thử và phân tích độ phức tạp."
  - "Biết cần hỏi gì ở bước làm rõ và nêu những trường hợp mép nào."
  - "Biết nói gì và làm gì khi bị kẹt."
blocks:
  - id: s_clarify
    type: section
    title_vi: "Làm rõ đề, ví dụ và trường hợp mép"
    summary_vi: "Đừng code ngay: hiểu đề, hỏi ràng buộc, thử ví dụ."
  - id: i01
    type: text
    md: |
      Một bài phỏng vấn không chỉ chấm đáp án mà chấm cả **quá trình**. Quy trình 6 bước:

      1. **Nhắc lại đề và hỏi làm rõ**: kiểu và miền giá trị đầu vào, kích thước `n`, có trùng lặp không, rỗng
         thì sao, đầu vào đã sắp chưa, trả về gì khi không có đáp án.
      2. **Ví dụ và trường hợp mép (edge case)**: tự lập 1-2 ví dụ nhỏ; thêm rỗng, một phần tử, toàn bằng nhau, giá trị âm.
      3. **Brute force** và độ phức tạp của nó: có ngay lời giải đúng làm mốc.
      4. **Tối ưu**: nêu nút thắt, ý tưởng cải thiện (hash map, hai con trỏ, sắp xếp...), rồi xin đồng ý trước khi code.
      5. **Code**: vừa viết vừa giải thích, đặt tên rõ ràng.
      6. **Dry-run** bằng ví dụ và các biên, rồi nói **time/space complexity**.
  - id: i02
    type: callout
    kind: interview
    md: "Phản xạ tốt: sau khi nghe đề, đừng im lặng viết code. Nhắc lại đề bằng lời của bạn và hỏi ít nhất 2 câu làm rõ."
  - id: q01
    type: quiz_mcq
    prompt_md: "Vừa nhận đề \"tìm hai số trong mảng có tổng bằng target\". Việc **đầu tiên** nên làm là gì?"
    options:
      - {id: a, text_md: "Viết ngay code dùng hash map"}
      - {id: b, text_md: "Nhắc lại đề và hỏi làm rõ (mảng có trùng không, luôn có đáp án không, mảng đã sắp chưa)"}
      - {id: c, text_md: "Phân tích độ phức tạp của lời giải tối ưu"}
    answer: [b]
    explain_md: "Làm rõ đề đứng đầu quy trình: nó tránh giải sai bài và cho thấy bạn cẩn thận. Code và độ phức tạp đến sau."
  - id: q02
    type: quiz_fill
    prompt_md: "Sau khi hiểu đề và có ví dụ, bước tiếp theo là nêu lời giải ___ (điền tên) để có một đáp án đúng làm mốc, rồi mới tối ưu."
    blanks: [{accept: ["brute force", "brute-force", "bruteforce", "vét cạn"]}]
    explain_md: "Brute force cho lời giải đúng, đơn giản, giúp bạn thấy nút thắt cần tối ưu và đảm bảo có thứ chạy được nếu hết giờ."
  - id: s_optimize
    type: section
    title_vi: "Tối ưu, kiểm thử và giao tiếp"
    summary_vi: "Từ brute force tới tối ưu, dry-run, và xử lý khi bị kẹt."
  - id: i03
    type: text
    md: |
      **Tối ưu**: chỉ ra phép tính lặp thừa hoặc thao tác chậm của brute force (ví dụ tìm kiếm tuyến tính O(n) trong
      vòng lặp), rồi đổi cấu trúc (set/dict cho tra cứu O(1), sắp xếp + hai con trỏ...). Nói rõ độ phức tạp
      trước và sau.

      **Kiểm thử**: sau khi code, tự chạy tay một ví dụ và các biên (rỗng, một phần tử), bắt lỗi lệch một
      (off-by-one) trước khi interviewer chỉ ra.

      **Khi bị kẹt**: nói to điều đã thử, đưa brute force ra để có bài chạy được, rồi hỏi gợi ý cụ thể
      (ví dụ "em đang nghĩ dùng hash map để tra phần bù, có hợp lý không ạ?"). **Không im lặng.**
  - id: i04
    type: callout
    kind: tip
    md: "Interviewer đánh giá cách bạn nghĩ. Một lời giải chưa tối ưu nhưng giải thích rõ và test cẩn thận thường tốt hơn lời giải tối ưu viết trong im lặng."
  - id: q03
    type: quiz_mcq
    prompt_md: "Bạn kẹt 10 phút không ra hướng tối ưu. Hành động nào phù hợp nhất?"
    options:
      - {id: a, text_md: "Im lặng nghĩ thêm cho tới khi ra"}
      - {id: b, text_md: "Nói to điều đã thử, trình bày brute force để có lời giải chạy được, rồi hỏi gợi ý cụ thể"}
      - {id: c, text_md: "Xin đổi sang bài khác"}
    answer: [b]
    explain_md: "Giao tiếp là một phần được chấm. Brute force bảo đảm có đáp án đúng, và câu hỏi cụ thể giúp interviewer dẫn bạn đi tiếp."
  - id: p01
    type: predict_output
    code: |
      def count_pairs(nums, target):
          n = 0
          for i in range(len(nums)):
              for j in range(i + 1, len(nums)):
                  if nums[i] + nums[j] == target:
                      n += 1
          return n
      print(count_pairs([], 5), count_pairs([5], 5), count_pairs([1, 4, 2, 3], 5))
    expected_output: |
      0 0 2
    explain_md: "Brute force O(n^2) thử mọi cặp i < j. Mảng rỗng hoặc một phần tử không có cặp nào (đây chính là các biên cần thử). Với [1, 4, 2, 3] có hai cặp tổng 5: (1, 4) và (2, 3)."
  - id: i05
    type: summary
    bullets_vi:
      - "6 bước: làm rõ đề, ví dụ và biên, brute force, tối ưu, code, dry-run cùng time/space."
      - "Hỏi làm rõ trước khi code; tự đưa ra các biên: rỗng, một phần tử, trùng lặp."
      - "Luôn nêu brute force làm mốc rồi mới tối ưu, nói độ phức tạp trước và sau."
      - "Khi kẹt: nói to suy nghĩ, đưa brute force, hỏi gợi ý cụ thể; không im lặng."
