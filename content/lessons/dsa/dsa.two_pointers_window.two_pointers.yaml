id: dsa.two_pointers_window.two_pointers
version: 1
status: published
title_vi: "Hai con trỏ (two pointers)"
est_minutes: 12
objectives_vi:
  - "Chọn đúng kiểu hai con trỏ: hai đầu (opposite ends) hay cùng chiều (same direction)."
  - "Giải bài tìm cặp có tổng cho trước trên mảng đã sắp và giải thích vì sao việc nhích con trỏ là an toàn."
  - "Dùng reader/writer để lọc tại chỗ (xoá trùng) và cửa sổ trượt (sliding window) có độ dài cố định."
blocks:
  - id: s_opposite
    type: section
    title_vi: "Hai con trỏ từ hai đầu"
    summary_vi: "Mảng đã sắp: một con trỏ ở đầu, một ở cuối, nhích vào giữa theo so sánh với target."
    exercise_ref: ex_pair_sum
  - id: b01
    type: text
    md: |
      **Hai con trỏ (two pointers)** là kỹ thuật dùng hai chỉ số để duyệt mảng trong O(n) thay vì
      thử mọi cặp O(n^2). Có hai kiểu chính:

      - **Hai đầu (opposite ends)**: `l = 0`, `r = len(a) - 1`, hai con trỏ tiến vào nhau. Hợp với
        mảng **đã sắp**: tìm cặp có tổng cho trước, kiểm tra palindrome, bài Container With Most Water.
      - **Cùng chiều (same direction)**: hai con trỏ cùng đi từ trái sang phải với vai trò khác nhau
        (reader/writer, hoặc hai mép của cửa sổ). Hợp với lọc/nén tại chỗ và sliding window.

      Với tìm cặp tổng `target` trên mảng tăng dần, xét `s = a[l] + a[r]`:

      - `s == target`: tìm được.
      - `s < target`: tổng quá nhỏ. `a[l]` là số nhỏ nhất còn lại nên ghép với bất kỳ `a[x]` nào
        (`x <= r`) cũng không vượt `a[r]`, tức vẫn nhỏ hơn target. Vậy `a[l]` vô dụng, **loại nó**: `l += 1`.
      - `s > target`: tổng quá lớn, tương tự `a[r]` vô dụng: `r -= 1`.

      Mỗi bước loại ít nhất một phần tử mà không bỏ sót đáp án, nên chỉ cần tối đa n bước.
  - id: b02
    type: code_sample
    lang: python
    runnable: true
    code: |
      nums = [1, 2, 4, 7, 11]
      l, r = 0, len(nums) - 1
      while l < r:
          s = nums[l] + nums[r]
          print(l, r, s)
          if s == 9:
              break
          elif s < 9:
              l += 1
          else:
              r -= 1
    expected_output: |
      0 4 12
      0 3 8
      1 3 9
  - id: b03
    type: predict_output
    code: |
      nums = [1, 2, 3, 4, 5]
      l, r = 0, len(nums) - 1
      while l < r:
          print(nums[l] + nums[r], end=",")
          l += 1
          r -= 1
      print()
    expected_output: |
      6,6,
    explain_md: "Lần 1: l=0, r=4 cho 1+5=6. Lần 2: l=1, r=3 cho 2+4=6. Sau đó l=2, r=2 nên `l < r` sai và vòng lặp dừng; phần tử giữa không được in."
  - id: ex_pair_sum
    type: code_exercise
    md: |
      Viết `has_pair_sum(nums, target)` trả về `True` nếu mảng **đã sắp tăng** `nums` có hai phần tử
      ở hai vị trí khác nhau cộng lại bằng `target`, ngược lại `False`. Yêu cầu O(n) thời gian và
      O(1) bộ nhớ. Ví dụ `has_pair_sum([1, 2, 4, 7, 11], 9)` là `True` (2 + 7).
    entry: has_pair_sum
    starter: |
      def has_pair_sum(nums, target):
          # TODO: hai con trỏ từ hai đầu
          pass
    guidance_md: |
      - Đặt một con trỏ ở đầu mảng và một con trỏ ở cuối mảng.
      - Lặp khi hai con trỏ còn khác nhau (chưa gặp nhau).
      - Tính tổng hai phần tử đang trỏ tới rồi so với `target`.
      - Tổng bằng target thì xong; nhỏ hơn thì nhích con trỏ nào; lớn hơn thì nhích con trỏ nào?
      - Hết vòng lặp mà chưa thấy thì không có cặp nào.
    hints:
      - level: nudge
        md: "Mảng đã sắp tăng: phần tử nào ở đầu là nhỏ nhất, phần tử nào ở cuối là lớn nhất?"
      - level: approach
        md: "Dùng `l = 0`, `r = len(nums) - 1`. Tổng nhỏ hơn target thì cần số lớn hơn: tăng `l`. Tổng lớn hơn thì cần số nhỏ hơn: giảm `r`."
      - level: pseudocode
        md: |
          l, r = đầu, cuối
          while l < r:
              s = nums[l] + nums[r]
              nếu s == target: trả True
              nếu s < target: l tiến lên
              ngược lại: r lùi xuống
          trả False
      - level: near_solution
        md: |
          def has_pair_sum(nums, target):
              l, r = 0, len(nums) - 1
              while l < r:
                  s = nums[l] + nums[r]
                  if s == target:
                      ...
                  elif s < target:
                      ...
                  else:
                      ...
              return False
    tests:
      - {args: [[1, 2, 4, 7, 11], 9], expected: true}
      - {args: [[1, 2, 4], 8], expected: false}
      - {args: [[], 5], expected: false}
      - {args: [[3], 6], expected: false}
      - {args: [[-3, 0, 3], 0], expected: true}
    solution: |
      def has_pair_sum(nums, target):
          l, r = 0, len(nums) - 1
          while l < r:
              s = nums[l] + nums[r]
              if s == target:
                  return True
              elif s < target:
                  l += 1
              else:
                  r -= 1
          return False
  - id: s_same_dir
    type: section
    title_vi: "Cùng chiều: reader và writer"
    summary_vi: "Lọc tại chỗ bằng hai con trỏ cùng đi sang phải: reader đọc, writer ghi."
    exercise_ref: ex_dedup
  - id: b04
    type: text
    md: |
      Kiểu **cùng chiều**: con trỏ **reader** `r` quét qua mọi phần tử, con trỏ **writer** `w` chỉ
      ra ô tiếp theo cần ghi. Phần `nums[:w]` luôn là kết quả đã lọc xong. Vì `w <= r` nên ghi vào
      `nums[w]` không bao giờ ghi đè phần tử chưa đọc, và ta không cần mảng phụ (O(1) bộ nhớ).

      Xoá trùng trên mảng đã sắp: phần tử đầu luôn giữ, nên `w = 1`. Với mỗi `nums[r]`, nếu nó khác
      phần tử **vừa ghi cuối cùng** `nums[w - 1]` thì ghi nó vào `nums[w]` rồi `w += 1`.
  - id: b05
    type: callout
    kind: warning
    md: |
      So sánh với `nums[w - 1]` (phần tử cuối của kết quả), không phải `nums[w]` (ô sắp ghi, có thể
      còn chứa giá trị cũ). Nhầm hai chỉ số này là lỗi lệch một (off-by-one) rất hay gặp.
  - id: b06
    type: quiz_fill
    prompt_md: "Điền vào chỗ trống: sau khi ghi `nums[w] = nums[r]`, ta tăng con trỏ ghi: `___ += 1`"
    blanks: [{accept: ["w"]}]
    explain_md: "`w` (writer) là chỉ số ô ghi tiếp theo, nên sau mỗi lần ghi phải tăng `w`. `r` thì tự tăng nhờ vòng `for`."
  - id: ex_dedup
    type: code_exercise
    md: |
      Hàm `dedup_sorted(nums)` nhận mảng **đã sắp tăng**, xoá phần tử trùng **tại chỗ** bằng
      reader/writer và trả về `nums[:w]` (các giá trị phân biệt, giữ thứ tự). Code bên dưới có một
      **lỗi**: hãy tìm và sửa. Ví dụ `[1, 1, 2]` phải cho `[1, 2]`.
    entry: dedup_sorted
    starter: |
      def dedup_sorted(nums):
          if not nums:
              return []
          w = 1
          for r in range(1, len(nums)):
              if nums[r] != nums[w]:
                  nums[w] = nums[r]
                  w += 1
          return nums[:w]
    guidance_md: |
      - Chạy thử bằng tay với `[0, 0, 1, 1, 2]` và theo dõi `w`.
      - Xem phần tử nào được so sánh với `nums[r]` ở mỗi bước.
      - `nums[w]` là ô sắp ghi, chưa chắc là phần tử đã được giữ gần nhất.
      - Phần tử đã giữ gần nhất nằm ở chỉ số nào?
    hints:
      - level: nudge
        md: "Thử `[0, 0, 1, 1, 1, 2, 2, 3]`: kết quả có còn trùng không? So sánh `nums[r]` với phần tử nào?"
      - level: approach
        md: "Điều kiện ghi phải là 'khác phần tử vừa ghi cuối cùng của kết quả'. Phần tử đó nằm trước ô `w` một vị trí."
      - level: near_solution
        md: "Chỉ cần đổi một chỉ số trong điều kiện `if`: `nums[w]` thành `nums[w - 1]`. Các dòng còn lại giữ nguyên."
    tests:
      - {args: [[]], expected: []}
      - {args: [[1, 1, 2]], expected: [1, 2]}
      - {args: [[0, 0, 1, 1, 1, 2, 2, 3, 3, 4]], expected: [0, 1, 2, 3, 4]}
      - {args: [[5]], expected: [5]}
      - {args: [[1, 2, 3]], expected: [1, 2, 3]}
    solution: |
      def dedup_sorted(nums):
          if not nums:
              return []
          w = 1
          for r in range(1, len(nums)):
              if nums[r] != nums[w - 1]:
                  nums[w] = nums[r]
                  w += 1
          return nums[:w]
  - id: s_window
    type: section
    title_vi: "Cửa sổ trượt cố định (sliding window)"
    summary_vi: "Giữ một đoạn dài k, trượt từng bước: thêm phần tử mới, bớt phần tử cũ."
    exercise_ref: ex_window
  - id: b07
    type: text
    md: |
      **Sliding window** là hai con trỏ cùng chiều tạo thành một đoạn liên tiếp `nums[i:i+k]`.
      Thay vì cộng lại k phần tử cho mỗi vị trí (O(n*k)), ta **cập nhật**: khi cửa sổ trượt sang
      phải một ô thì cộng phần tử mới vào và trừ phần tử vừa rời đi:

      ```python
      window = sum(nums[:k])
      for i in range(k, len(nums)):
          window += nums[i] - nums[i - k]
      ```

      Mỗi phần tử vào và ra cửa sổ đúng một lần nên tổng thời gian là O(n).
  - id: b08
    type: quiz_mcq
    prompt_md: "Cửa sổ độ dài `k = 3` đang là `nums[1:4]`. Trượt sang phải một ô, ta cập nhật tổng thế nào?"
    options:
      - {id: a, text_md: "Cộng `nums[3]`, trừ `nums[1]`"}
      - {id: b, text_md: "Cộng `nums[4]`, trừ `nums[0]`"}
      - {id: c, text_md: "Cộng `nums[4]`, trừ `nums[1]`"}
    answer: [c]
    explain_md: "Cửa sổ cũ gồm chỉ số 1, 2, 3; cửa sổ mới gồm 2, 3, 4. Vậy phần tử mới là `nums[4]` và phần tử rời đi là `nums[1]`. Tổng quát: cộng `nums[i]`, trừ `nums[i - k]`."
  - id: ex_window
    type: code_exercise
    md: |
      Viết `max_window_sum(nums, k)` trả về **tổng lớn nhất** của một đoạn gồm `k` phần tử liên tiếp
      (giả sử `1 <= k <= len(nums)`). Dùng sliding window, O(n). Ví dụ
      `max_window_sum([2, 1, 5, 1, 3, 2], 3)` là `9` (5 + 1 + 3).
    entry: max_window_sum
    starter: |
      def max_window_sum(nums, k):
          # TODO: tính tổng cửa sổ đầu tiên, rồi trượt
          pass
    guidance_md: |
      - Tính tổng của cửa sổ đầu tiên (k phần tử đầu) và coi nó là tốt nhất hiện tại.
      - Trượt cửa sổ sang phải từng ô một.
      - Mỗi lần trượt, cập nhật tổng bằng cách cộng phần tử mới và trừ phần tử vừa rời đi.
      - Sau mỗi lần cập nhật, so với tổng tốt nhất và giữ giá trị lớn hơn.
    hints:
      - level: nudge
        md: "Có cần cộng lại cả k phần tử mỗi lần không, hay chỉ thay đổi hai đầu của cửa sổ?"
      - level: approach
        md: "Tính `window = sum(nums[:k])`, rồi `for i in range(k, len(nums))`: `window += nums[i] - nums[i - k]` và cập nhật `best`."
      - level: pseudocode
        md: |
          window = tổng k phần tử đầu
          best = window
          với i từ k đến hết mảng:
              window = window + nums[i] - nums[i - k]
              best = max(best, window)
          trả best
      - level: near_solution
        md: |
          def max_window_sum(nums, k):
              window = sum(nums[:k])
              best = window
              for i in range(k, len(nums)):
                  window += ...
                  best = ...
              return best
    tests:
      - {args: [[2, 1, 5, 1, 3, 2], 3], expected: 9}
      - {args: [[1, 2, 3], 3], expected: 6}
      - {args: [[4], 1], expected: 4}
      - {args: [[-1, -2, -3, -4], 2], expected: -3}
      - {args: [[5, 1, 1, 5], 2], expected: 6}
    solution: |
      def max_window_sum(nums, k):
          window = sum(nums[:k])
          best = window
          for i in range(k, len(nums)):
              window += nums[i] - nums[i - k]
              best = max(best, window)
          return best
  - id: b09
    type: summary
    bullets_vi:
      - "Hai đầu (opposite ends): `l = 0`, `r = len - 1`, tiến vào nhau; hợp với mảng đã sắp (tìm cặp tổng, palindrome, container)."
