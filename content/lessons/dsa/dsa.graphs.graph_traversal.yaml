    expected_output: |
      [0, 1, 3, 2, 4]
      [0, 1, 2, 3, 4]
    explain_md: "DFS từ 0 đi xuống 1 rồi 3 (hết đường), quay lại mới sang 2 rồi 4. BFS thăm lớp 0, rồi lớp {1, 2}, rồi lớp {3, 4}."
  - id: ex_order
    type: code_exercise
    md: |
      Viết `bfs_order(adj, start)` trả về list các đỉnh theo thứ tự BFS từ `start`, duyệt hàng xóm
      theo thứ tự trong `adj`. Bản dưới đây dùng sai cấu trúc dữ liệu nên ra thứ tự kiểu DFS. Hãy sửa.
    entry: bfs_order
    starter: |
      def bfs_order(adj, start):
          seen = {start}
          q = [start]
          out = []
          while q:
              u = q.pop()
              out.append(u)
              for v in adj[u]:
                  if v not in seen:
                      seen.add(v)
                      q.append(v)
          return out
    guidance_md: |
      - Thử `adj = [[1, 2], [3], [4], [], []]` rồi in thứ tự: BFS phải ra `[0, 1, 2, 3, 4]`.
      - Hàng đợi (FIFO) lấy phần tử vào trước ra trước.
    hints:
      - level: nudge
        md: "`q.pop()` lấy phần tử vừa thêm vào cuối. Đó là hành vi của hàng đợi hay của stack?"
      - level: approach
        md: "BFS cần lấy đỉnh vào hàng đợi sớm nhất trước. Hãy lấy từ đầu hàng đợi thay vì từ cuối."
      - level: near_solution
        md: "Dùng một `deque` làm hàng đợi và lấy phần tử bằng `popleft()` thay cho `pop()`; phần còn lại giữ nguyên."
    tests:
      - {args: [[[1, 2], [0, 3], [0, 3], [1, 2]], 0], expected: [0, 1, 2, 3]}
      - {args: [[[1, 2], [3], [4], [], []], 0], expected: [0, 1, 2, 3, 4]}
      - {args: [[[1, 2], [0], [0, 3], [2]], 3], expected: [3, 2, 0, 1]}
      - {args: [[[]], 0], expected: [0]}
    solution: |
      from collections import deque


      def bfs_order(adj, start):
          seen = {start}
          q = deque([start])
          out = []
          while q:
              u = q.popleft()
              out.append(u)
              for v in adj[u]:
                  if v not in seen:
                      seen.add(v)
                      q.append(v)
          return out
  - id: s_comp
    type: section
    title_vi: "Thành phần liên thông"
    summary_vi: "Mỗi lần khởi động traversal từ một đỉnh chưa thăm là gặp thêm một thành phần."
    exercise_ref: ex_comp
  - id: t02
    type: text
    md: |
      Một **thành phần liên thông (connected component)** là tập đỉnh mà giữa hai đỉnh bất kỳ đều có
      đường đi. Để đếm: duyệt `s` từ `0` tới `n - 1`; nếu `s` chưa visited thì **tăng bộ đếm**
      rồi chạy DFS/BFS từ `s` để đánh dấu cả thành phần của nó. Đỉnh cô lập (không có cạnh) cũng là
      một thành phần.

      Đề thường cho `n` và danh sách cạnh `edges`, nên bước đầu là dựng `adj` (đừng quên thêm cả hai
      chiều cho đồ thị vô hướng). Tổng chi phí vẫn **O(V + E)**.
  - id: cs02
    type: code_sample
    lang: python
    runnable: true
    code: |
      def count_components(n, edges):
          adj = [[] for _ in range(n)]
          for a, b in edges:
              adj[a].append(b)
              adj[b].append(a)
          seen = [False] * n
          count = 0
          for s in range(n):
              if seen[s]:
                  continue
              count += 1
              seen[s] = True
              stack = [s]
              while stack:
                  u = stack.pop()
                  for v in adj[u]:
                      if not seen[v]:
                          seen[v] = True
                          stack.append(v)
          return count

      print(count_components(6, [[0, 1], [2, 3], [3, 4]]))
  - id: q03
    type: quiz_fill
    prompt_md: "Đồ thị vô hướng có 6 đỉnh (0..5) và cạnh `[0,1]`, `[2,3]`, `[3,4]`. Số thành phần liên thông là ___."
    blanks: [{accept: ["3", "ba"]}]
    explain_md: "Có `{0, 1}`, `{2, 3, 4}` và đỉnh cô lập `{5}`: tổng cộng 3."
  - id: ex_comp
    type: code_exercise
    md: |
      Viết `count_components(n, edges)` trả số thành phần liên thông của đồ thị vô hướng `n` đỉnh
      (đánh số `0..n-1`). Bản dưới đây chỉ đánh dấu đỉnh xuất phát chứ không duyệt tiếp, nên đếm sai.
      Hãy sửa.
    entry: count_components
    starter: |
      def count_components(n, edges):
          adj = [[] for _ in range(n)]
          for a, b in edges:
              adj[a].append(b)
              adj[b].append(a)
          seen = [False] * n
          count = 0
          for s in range(n):
              if seen[s]:
                  continue
              count += 1
              seen[s] = True
              # TODO: đánh dấu cả thành phần của s
