id: dsa.graphs.graph_traversal
version: 1
status: published
title_vi: "Duyệt đồ thị: DFS và BFS (graph traversal)"
est_minutes: 14
objectives_vi:
  - "Biểu diễn đồ thị bằng danh sách kề (adjacency list) và dùng tập `visited` để không thăm một đỉnh hai lần."
  - "Cài DFS (đệ quy và dùng stack) cùng BFS (dùng queue) và dự đoán thứ tự thăm khi duyệt hàng xóm theo đúng thứ tự trong danh sách kề."
  - "Đếm số thành phần liên thông (connected components) của đồ thị vô hướng."
  - "Kiểm tra đồ thị hai phía (bipartite) bằng cách tô hai màu bằng BFS hoặc DFS."
blocks:
  - id: s_trav
    type: section
    title_vi: "DFS, BFS và tập visited"
    summary_vi: "DFS đi sâu bằng stack/đệ quy, BFS đi theo lớp bằng queue; cả hai cần visited."
    exercise_ref: ex_order
  - id: t01
    type: text
    md: |
      Đồ thị thường được cho bằng **danh sách kề (adjacency list)**: `adj[u]` là list các hàng xóm của
      đỉnh `u`. Với đồ thị vô hướng, cạnh `(a, b)` xuất hiện ở cả `adj[a]` và `adj[b]`.

      Khác với cây, đồ thị có thể có chu trình, nên phải có tập **visited**: đánh dấu đỉnh ngay khi
      phát hiện (hoặc khi thăm) để không lặp vô hạn. Độ phức tạp của cả DFS và BFS là **O(V + E)**.

      - **DFS** đi sâu hết một nhánh rồi mới quay lui; dùng đệ quy hoặc một **stack** tường minh.
      - **BFS** thăm theo từng lớp khoảng cách (số cạnh) từ đỉnh xuất phát; dùng **queue**
        (`deque.popleft()` là O(1), còn `list.pop(0)` là O(n)).
      - Luôn duyệt hàng xóm theo thứ tự danh sách kề (không duyệt `set`) thì thứ tự thăm là xác định.
  - id: cs01
    type: code_sample
    lang: python
    runnable: true
    code: |
      from collections import deque

      adj = [[1, 2], [0, 3], [0, 3], [1, 2]]

      def dfs(u, seen, out):
          seen.add(u)
          out.append(u)
          for v in adj[u]:
              if v not in seen:
                  dfs(v, seen, out)
          return out

      def dfs_iter(s):
          seen = set()
          stack = [s]
          out = []
          while stack:
              u = stack.pop()
              if u in seen:
                  continue
              seen.add(u)
              out.append(u)
              for v in reversed(adj[u]):   # đảo để đỉnh đầu danh sách được pop trước
                  if v not in seen:
                      stack.append(v)
          return out

      def bfs(s):
          seen = {s}
          q = deque([s])
          out = []
          while q:
              u = q.popleft()
              out.append(u)
              for v in adj[u]:
                  if v not in seen:
                      seen.add(v)
                      q.append(v)
          return out

      print(dfs(0, set(), []))
      print(dfs_iter(0))
      print(bfs(0))
  - id: q01
    type: quiz_mcq
    prompt_md: "Cần tìm số cạnh ít nhất từ đỉnh `s` tới mọi đỉnh khác trong đồ thị không trọng số. Nên dùng gì?"
    options:
      - {id: a, text_md: "BFS với queue, vì nó thăm theo từng lớp khoảng cách"}
      - {id: b, text_md: "DFS với stack, vì nó đi sâu nhất"}
      - {id: c, text_md: "DFS đệ quy không cần visited"}
    answer: [a]
    explain_md: "BFS mở rộng theo lớp nên lần đầu gặp một đỉnh chính là đường ngắn nhất (theo số cạnh). DFS không đảm bảo điều đó, và bỏ visited sẽ lặp vô hạn khi có chu trình."
  - id: q02
