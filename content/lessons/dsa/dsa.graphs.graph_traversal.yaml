    guidance_md: |
      - Với `n = 3` và không có cạnh, đáp án là 3; với một đường 0-1-2 đáp án là 1.
      - Sau khi `count += 1`, cần một vòng traversal từ `s`.
    hints:
      - level: nudge
        md: "Khi đếm xong thành phần của `s`, các đỉnh còn lại của thành phần đó có còn chưa visited không?"
      - level: approach
        md: "Từ `s`, duyệt DFS/BFS và đánh dấu mọi đỉnh tới được là visited, để vòng `for` ngoài bỏ qua chúng."
      - level: pseudocode
        md: |
          stack = [s]
          trong khi stack còn phần tử:
              u = lấy một đỉnh ra
              với mỗi hàng xóm v của u chưa visited:
                  đánh dấu v, đẩy v vào stack
    tests:
      - {args: [5, [[0, 1], [1, 2], [3, 4]]], expected: 2}
      - {args: [3, []], expected: 3}
      - {args: [4, [[0, 1], [1, 2], [2, 3]]], expected: 1}
      - {args: [6, [[0, 1], [2, 3], [3, 4]]], expected: 3}
    solution: |
      def count_components(n, edges):
          adj = [[] for _ in range(n)]
          for a, b in edges:
              adj[a].append(b)
              adj[b].append(a)
          seen = [False] * n
          count = 0
          for s in range(n):
              if seen[s]:
                  continue
              count += 1
              seen[s] = True
              stack = [s]
              while stack:
                  u = stack.pop()
                  for v in adj[u]:
                      if not seen[v]:
                          seen[v] = True
                          stack.append(v)
          return count
  - id: s_bip
    type: section
    title_vi: "Đồ thị hai phía (bipartite)"
    summary_vi: "Tô hai màu bằng BFS/DFS; gặp cạnh nối hai đỉnh cùng màu thì không phải bipartite."
  - id: t03
    type: text
    md: |
      Đồ thị là **bipartite** nếu tô được mỗi đỉnh một trong hai màu sao cho mọi cạnh nối hai màu khác
      nhau (tương đương: không có chu trình độ dài lẻ). Cách kiểm tra bằng traversal:

      1. Với mỗi đỉnh chưa tô (đồ thị có thể gồm nhiều thành phần), tô nó màu `0` rồi BFS/DFS.
      2. Hàng xóm `v` chưa tô thì tô `1 - color[u]`.
      3. Hàng xóm đã tô mà **cùng màu** với `u` thì trả `False` ngay.

      Đầu vào là `graph` dạng danh sách kề (`graph[u]` là các hàng xóm). Dùng dict `color` vừa làm
      visited vừa lưu màu.
  - id: cs03
    type: code_sample
    lang: python
    runnable: true
    code: |
      from collections import deque

      def is_bipartite(graph):
          color = {}
          for s in range(len(graph)):
              if s in color:
                  continue
              color[s] = 0
              q = deque([s])
              while q:
                  u = q.popleft()
                  for v in graph[u]:
                      if v not in color:
                          color[v] = 1 - color[u]
                          q.append(v)
                      elif color[v] == color[u]:
                          return False
          return True

      print(is_bipartite([[1], [0, 2], [1, 3], [2]]))
      print(is_bipartite([[1, 2], [0, 2], [0, 1]]))
  - id: q04
    type: quiz_mcq
    prompt_md: "Đồ thị nào chắc chắn KHÔNG phải bipartite?"
    options:
      - {id: a, text_md: "Một chu trình độ dài 4 (4 đỉnh nối vòng)"}
      - {id: b, text_md: "Một tam giác (chu trình độ dài 3)"}
      - {id: c, text_md: "Một đường đi 0-1-2-3"}
    answer: [b]
    explain_md: "Chu trình độ dài lẻ buộc hai đỉnh kề nhau phải cùng màu. Chu trình độ dài 4 và đường đi đều tô xen kẽ được."
