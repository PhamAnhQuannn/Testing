      - "Injectable clock: truyền now vào thao tác, không gọi time.time(), để code xác định."
      - "Nested transaction = stack undo log; set ghi giá trị cũ vào frame trên cùng một lần mỗi key."
      - "rollback khôi phục frame (duyệt LIFO); commit con gộp frame vào cha; cả hai trả False khi không có transaction."
