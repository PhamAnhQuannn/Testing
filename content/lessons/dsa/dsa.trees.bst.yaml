        md: "Nếu p < node.val nhưng q > node.val thì p, q nằm hai phía. Có nên rẽ trái không?"
      - level: approach
        md: "Dùng `and` thay cho `or`: chỉ rẽ khi p và q cùng phía so với node."
      - level: near_solution
        md: |
          if p < node.val and q < node.val:
              node = node.left
          elif p > node.val and q > node.val:
              node = node.right
          else:
              return node.val
    tests:
