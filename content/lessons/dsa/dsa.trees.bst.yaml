  - id: ex_valid
    type: code_exercise
    md: |
      Viết `is_valid_bst(vals)`: dựng cây từ `vals` (list theo tầng, `None` là chỗ trống) bằng `build_tree`
      có sẵn và trả `True` nếu là BST hợp lệ (giá trị trùng là không hợp lệ). Bản dưới đây chỉ so với con
      trực tiếp nên sai; hãy dùng khoảng `(lo, hi)`.
    entry: is_valid_bst
    starter: |
      class TreeNode:
          def __init__(self, val, left=None, right=None):
              self.val = val
              self.left = left
              self.right = right

      def build_tree(vals):
          if not vals or vals[0] is None:
              return None
          root = TreeNode(vals[0])
          queue = [root]
          i = 1
          while queue and i < len(vals):
              node = queue.pop(0)
              if i < len(vals) and vals[i] is not None:
                  node.left = TreeNode(vals[i])
                  queue.append(node.left)
              i += 1
              if i < len(vals) and vals[i] is not None:
                  node.right = TreeNode(vals[i])
                  queue.append(node.right)
              i += 1
          return root

      def is_valid_bst(vals):
          root = build_tree(vals)

          def check(node):
              if node is None:
                  return True
              # BUG: chỉ so với con trực tiếp
              if node.left and node.left.val >= node.val:
                  return False
              if node.right and node.right.val <= node.val:
                  return False
              return check(node.left) and check(node.right)

          return check(root)
    guidance_md: |
      - Thử `[5, 3, 8, None, 6]`: 6 là con phải của 3 nhưng lớn hơn 5.
      - Viết `check(node, lo, hi)` với `lo = -inf`, `hi = +inf` ban đầu.
      - Node hợp lệ khi `lo < node.val < hi`; đi trái cập nhật `hi`, đi phải cập nhật `lo`.
    hints:
      - level: nudge
        md: "Node 6 trong `[5, 3, 8, None, 6]` qua được phép so với cha (3) nhưng vẫn sai. Nó vi phạm giới hạn của ai?"
      - level: approach
        md: "Mỗi lời gọi đệ quy mang theo một khoảng mở (lo, hi); node phải nằm trong khoảng đó."
      - level: pseudocode
        md: |
          check(node, lo, hi):
              nếu node là None: True
              nếu không (lo < node.val < hi): False
              check(trái, lo, node.val) và check(phải, node.val, hi)
      - level: near_solution
        md: |
          def check(node, lo, hi):
              if node is None:
                  return True
              if not (lo < node.val < hi):
                  return False
              return check(node.left, lo, node.val) and ...   # cây phải với lo = node.val
          return check(root, float("-inf"), float("inf"))
    tests:
      - {args: [[]], expected: true}
      - {args: [[2, 1, 3]], expected: true}
      - {args: [[5, 3, 8, null, 6]], expected: false}
      - {args: [[2, 2]], expected: false}
      - {args: [[5, 3, 8, 1, 4, 7, 9]], expected: true}
    solution: |
      class TreeNode:
          def __init__(self, val, left=None, right=None):
              self.val = val
              self.left = left
              self.right = right

      def build_tree(vals):
          if not vals or vals[0] is None:
              return None
          root = TreeNode(vals[0])
          queue = [root]
          i = 1
          while queue and i < len(vals):
              node = queue.pop(0)
              if i < len(vals) and vals[i] is not None:
                  node.left = TreeNode(vals[i])
                  queue.append(node.left)
              i += 1
              if i < len(vals) and vals[i] is not None:
                  node.right = TreeNode(vals[i])
                  queue.append(node.right)
              i += 1
          return root

      def is_valid_bst(vals):
          root = build_tree(vals)

          def check(node, lo, hi):
              if node is None:
                  return True
              if not (lo < node.val < hi):
                  return False
              return check(node.left, lo, node.val) and check(node.right, node.val, hi)

          return check(root, float("-inf"), float("inf"))
  - id: s_kth
    type: section
    title_vi: "Phần tử nhỏ thứ k bằng inorder lặp"
    summary_vi: "Inorder bằng stack, đếm số node đã thăm và dừng ngay khi đến thứ k."
    exercise_ref: ex_kth
  - id: t02
    type: text
    md: |
      Vì inorder cho dãy tăng dần, **phần tử nhỏ thứ k** chính là node thứ k được thăm. Ta không cần duyệt
      hết: dùng **inorder lặp** với stack tường minh và **dừng sớm** khi đếm đủ k.

      Khuôn mẫu: đi sâu hết bên trái và đẩy vào stack; pop một node (đây là lần thăm); nếu đó là lần thứ k
      thì trả luôn; ngược lại chuyển sang cây con phải rồi lặp lại.

      ```python
      while stack or node:
          while node:
              stack.append(node)
              node = node.left
          node = stack.pop()      # thăm node
          ...
          node = node.right
      ```

      Chi phí **O(h + k)** thời gian (đi xuống h rồi k lần pop) và O(h) bộ nhớ stack. Dùng stack lặp tránh
      giới hạn độ sâu đệ quy trên cây lệch.
  - id: cs02
    type: code_sample
    lang: python
    runnable: true
    code: |
      class TreeNode:
          def __init__(self, val, left=None, right=None):
              self.val = val
              self.left = left
              self.right = right

      root = TreeNode(5, TreeNode(3, TreeNode(1), TreeNode(4)), TreeNode(8, TreeNode(7), TreeNode(9)))

      def kth(root, k):
          stack = []
          node = root
          pops = 0
          while stack or node:
              while node:
                  stack.append(node)
                  node = node.left
              node = stack.pop()
              pops += 1
              if pops == k:
                  return node.val, pops
              node = node.right
          return None, pops

      for k in (1, 3, 5):
          print(k, kth(root, k))
    expected_output: |
      1 (1, 1)
      3 (4, 3)
      5 (7, 5)
