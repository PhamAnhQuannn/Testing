  - id: ex_kth
    type: code_exercise
    md: |
      Viết `kth_smallest(vals, k)`: dựng BST từ `vals` rồi trả giá trị nhỏ thứ `k` (đếm từ 1) bằng inorder
      lặp với stack, dừng sớm khi tìm được. Bản dưới đây có lỗi lệch một đơn vị (off-by-one) ở chỗ đếm.
    entry: kth_smallest
    starter: |
      class TreeNode:
          def __init__(self, val, left=None, right=None):
              self.val = val
              self.left = left
              self.right = right

      def build_tree(vals):
          if not vals or vals[0] is None:
              return None
          root = TreeNode(vals[0])
          queue = [root]
          i = 1
          while queue and i < len(vals):
              node = queue.pop(0)
              if i < len(vals) and vals[i] is not None:
                  node.left = TreeNode(vals[i])
                  queue.append(node.left)
              i += 1
              if i < len(vals) and vals[i] is not None:
                  node.right = TreeNode(vals[i])
                  queue.append(node.right)
              i += 1
          return root

      def kth_smallest(vals, k):
          node = build_tree(vals)
          stack = []
          while stack or node:
              while node:
                  stack.append(node)
                  node = node.left
              node = stack.pop()
              if k == 0:  # BUG: kiểm tra trước khi giảm k
                  return node.val
              k -= 1
              node = node.right
          return -1
    guidance_md: |
      - Thử `k = 1` trên `[2, 1, 3]`: kết quả phải là 1.
      - Giảm `k` ngay sau mỗi lần pop, rồi mới kiểm tra `k == 0`.
    hints:
      - level: nudge
        md: "Với k = 1 ta cần dừng ở lần pop đầu tiên. Điều kiện hiện tại dừng ở lần pop thứ mấy?"
      - level: approach
        md: "Sau mỗi `pop`, trừ `k` đi 1; khi `k` về 0 thì node vừa pop là đáp án."
      - level: near_solution
        md: |
          node = stack.pop()
          k -= 1
          if k == 0:
              return node.val
          node = node.right
    tests:
      - {args: [[2, 1, 3], 1], expected: 1}
      - {args: [[5, 3, 6, 2, 4, null, null, 1], 3], expected: 3}
      - {args: [[5, 3, 6, 2, 4, null, null, 1], 6], expected: 6}
      - {args: [[3, 1, 4, null, 2], 1], expected: 1}
      - {args: [[3, 1, 4, null, 2], 4], expected: 4}
    solution: |
      class TreeNode:
          def __init__(self, val, left=None, right=None):
              self.val = val
              self.left = left
              self.right = right

      def build_tree(vals):
          if not vals or vals[0] is None:
              return None
          root = TreeNode(vals[0])
          queue = [root]
          i = 1
          while queue and i < len(vals):
              node = queue.pop(0)
              if i < len(vals) and vals[i] is not None:
                  node.left = TreeNode(vals[i])
                  queue.append(node.left)
              i += 1
              if i < len(vals) and vals[i] is not None:
                  node.right = TreeNode(vals[i])
                  queue.append(node.right)
              i += 1
          return root

      def kth_smallest(vals, k):
          node = build_tree(vals)
          stack = []
          while stack or node:
              while node:
                  stack.append(node)
                  node = node.left
              node = stack.pop()
              k -= 1
              if k == 0:
                  return node.val
              node = node.right
          return -1
  - id: s_lca
    type: section
    title_vi: "Tổ tiên chung thấp nhất (LCA) trong BST"
    summary_vi: "So p, q với node: cùng nhỏ thì sang trái, cùng lớn thì sang phải, ngược lại node hiện tại là LCA."
    exercise_ref: ex_lca
  - id: t03
    type: text
    md: |
      **LCA** của hai giá trị `p`, `q` là node thấp nhất có cả hai làm hậu duệ (một node là hậu duệ của
      chính nó). Trong BST ta không cần tìm đường đi như cây thường, chỉ cần đi xuống từ gốc:

      - `p` và `q` đều **nhỏ hơn** `node.val`: LCA nằm bên **trái**.
      - `p` và `q` đều **lớn hơn** `node.val`: LCA nằm bên **phải**.
      - Ngược lại (p, q nằm hai phía, hoặc một trong hai bằng `node.val`): node hiện tại là LCA.

      Mỗi bước đi xuống một tầng nên tốn **O(h)** thời gian và O(1) bộ nhớ nếu viết vòng lặp.
  - id: cs03
    type: code_sample
    lang: python
    runnable: true
    code: |
      class TreeNode:
          def __init__(self, val, left=None, right=None):
              self.val = val
              self.left = left
              self.right = right

      root = TreeNode(6, TreeNode(2, TreeNode(0), TreeNode(4, TreeNode(3), TreeNode(5))),
                      TreeNode(8, TreeNode(7), TreeNode(9)))

      def lca(root, p, q):
          node = root
          steps = 0
          while node:
              if p < node.val and q < node.val:
                  node = node.left
              elif p > node.val and q > node.val:
                  node = node.right
              else:
                  return node.val, steps
              steps += 1
          return None, steps

      print(lca(root, 2, 8))
      print(lca(root, 3, 5))
      print(lca(root, 2, 4))
    expected_output: |
      (6, 0)
      (4, 2)
      (2, 1)
  - id: q04
    type: quiz_mcq
    prompt_md: "Trong BST có gốc 6, ta tìm LCA của `p = 2` và `q = 4`. Tại node 6, ta làm gì?"
    options:
