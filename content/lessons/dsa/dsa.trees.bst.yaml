  - id: ex_lca
    type: code_exercise
    md: |
      Viết `lca_bst(vals, p, q)`: dựng BST từ `vals` rồi trả giá trị của LCA của `p` và `q` (hai giá trị đều
      có trong cây), trong O(h). Bản dưới đây rẽ sai khi chỉ một trong hai giá trị so sánh được.
    entry: lca_bst
    starter: |
      class TreeNode:
          def __init__(self, val, left=None, right=None):
              self.val = val
              self.left = left
              self.right = right

      def build_tree(vals):
          if not vals or vals[0] is None:
              return None
          root = TreeNode(vals[0])
          queue = [root]
          i = 1
          while queue and i < len(vals):
              node = queue.pop(0)
              if i < len(vals) and vals[i] is not None:
                  node.left = TreeNode(vals[i])
                  queue.append(node.left)
              i += 1
              if i < len(vals) and vals[i] is not None:
                  node.right = TreeNode(vals[i])
                  queue.append(node.right)
              i += 1
          return root

      def lca_bst(vals, p, q):
          node = build_tree(vals)
          while node:
              # BUG: chỉ cần một trong hai nhỏ/lớn hơn là đã rẽ
              if p < node.val or q < node.val:
                  node = node.left
              elif p > node.val or q > node.val:
                  node = node.right
              else:
                  return node.val
          return -1
    guidance_md: |
      - Rẽ trái chỉ khi **cả hai** nhỏ hơn `node.val`; rẽ phải chỉ khi **cả hai** lớn hơn.
      - Trường hợp còn lại thì dừng và trả `node.val`.
    hints:
