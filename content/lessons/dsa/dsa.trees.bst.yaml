id: dsa.trees.bst
version: 1
status: published
title_vi: "Cây tìm kiếm nhị phân (BST): kiểm tra hợp lệ, k-th nhỏ nhất, LCA"
est_minutes: 15
objectives_vi:
  - "Phát biểu bất biến của BST (cả cây con trái < node < cả cây con phải) và biết inorder cho dãy tăng dần."
  - "Kiểm tra một cây có phải BST bằng khoảng (lo, hi) thay vì chỉ so với con trực tiếp."
  - "Tìm phần tử nhỏ thứ k bằng inorder lặp với stack và dừng sớm."
  - "Tìm tổ tiên chung thấp nhất (LCA) trong BST bằng cách đi xuống O(h)."
blocks:
  - id: s_invariant
    type: section
    title_vi: "Bất biến BST và kiểm tra hợp lệ"
    summary_vi: "Mỗi node phải nằm trong khoảng (lo, hi) do tổ tiên quy định, không chỉ so với con trực tiếp."
    exercise_ref: ex_valid
  - id: t01
    type: text
    md: |
      **Cây tìm kiếm nhị phân (BST)** là cây nhị phân thỏa **bất biến**: với mọi node, **mọi** giá trị ở
      cây con trái **nhỏ hơn** node, và **mọi** giá trị ở cây con phải **lớn hơn** node (bài này coi giá
      trị phân biệt, trùng lặp là không hợp lệ). Hệ quả quan trọng: duyệt **inorder** (trái, node, phải)
      cho dãy **tăng dần**.

      Tìm một giá trị: so với node, nhỏ hơn thì đi trái, lớn hơn thì đi phải. Mỗi bước bỏ nửa cây nếu cây
      cân bằng, nên tốn **O(log n)**; nếu cây lệch thành một chuỗi (chèn dãy đã sắp) thì tốn **O(n)**.
      Nói chung chi phí là **O(h)** với `h` là chiều cao.

      Khi kiểm tra hợp lệ, lỗi kinh điển là chỉ so mỗi node với **con trực tiếp**. Cây
      `5 -> trái 3 -> con phải 6` qua được phép so sánh đó (3 < 5, 6 > 3) nhưng sai, vì 6 nằm trong cây con
      trái của 5 mà lại lớn hơn 5. Cách đúng: truyền xuống khoảng `(lo, hi)`; đi trái thì `hi = node.val`,
      đi phải thì `lo = node.val`.
  - id: cs01
    type: code_sample
    lang: python
    runnable: true
    code: |
      class TreeNode:
          def __init__(self, val, left=None, right=None):
              self.val = val
              self.left = left
              self.right = right

      def insert(node, v):
          if node is None:
              return TreeNode(v)
          if v < node.val:
              node.left = insert(node.left, v)
          else:
              node.right = insert(node.right, v)
          return node

      root = None
      for v in [5, 3, 8, 1, 4, 7, 9]:
          root = insert(root, v)

      def inorder(n):
          return inorder(n.left) + [n.val] + inorder(n.right) if n else []

      print(inorder(root))

      # 6 nằm trong cây con trái của 5 nhưng 6 > 5: cây này KHÔNG hợp lệ
      bad = TreeNode(5, TreeNode(3, None, TreeNode(6)), TreeNode(8))

      def naive(n):
          if n is None:
              return True
          if n.left and n.left.val >= n.val:
              return False
          if n.right and n.right.val <= n.val:
              return False
          return naive(n.left) and naive(n.right)

      def bounded(n, lo, hi):
          if n is None:
              return True
          if not (lo < n.val < hi):
              return False
          return bounded(n.left, lo, n.val) and bounded(n.right, n.val, hi)

      print(naive(bad), bounded(bad, float("-inf"), float("inf")))
      print(bounded(root, float("-inf"), float("inf")))
    expected_output: |
      [1, 3, 4, 5, 7, 8, 9]
      True False
      True
