title_vi: "BFS trên cây: duyệt theo tầng, zigzag và các góc nhìn (views)"
est_minutes: 14
objectives_vi:
  - "Cài BFS bằng deque và xử lý trọn một tầng mỗi vòng ngoài nhờ chụp lại len(queue)."
  - "Viết level-order trả về list các list và giải thích vì sao phải chụp kích thước tầng trước khi pop."
  - "Biến level-order thành zigzag bằng cách đảo các tầng lẻ."
  - "Tính thống kê theo tầng (tổng, trung bình) và lấy góc nhìn như right-side view từ một tầng."
blocks:
  - id: s_bfs
    type: section
    title_vi: "BFS từng tầng bằng deque"
    summary_vi: "Chụp len(queue) đầu mỗi vòng để xử lý đúng một tầng, con đẩy vào cho tầng kế."
    exercise_ref: ex_level
  - id: t01
    type: text
    md: |
      **BFS (breadth-first search)** thăm cây theo từng tầng, từ trên xuống. Cấu trúc dữ liệu là
      **hàng đợi (queue)**; trong Python dùng `collections.deque` vì `popleft()` là O(1), còn
      `list.pop(0)` là O(n).

      Mẫu "xử lý trọn một tầng" gồm hai vòng lặp lồng nhau:

      ```python
      while queue:
          size = len(queue)          # chụp kích thước tầng hiện tại
          for _ in range(size):      # chỉ pop đúng size node
              node = queue.popleft()
              ...                    # xử lý node
              # đẩy con trái, con phải vào queue (thuộc tầng kế)
      ```

      Điểm mấu chốt là `size = len(queue)` phải lấy **trước** vòng `for`. Trong lúc pop, ta liên tục
      đẩy con vào queue nên `len(queue)` thay đổi; nếu gọi lại `len(queue)` trong điều kiện lặp thì
      các tầng sẽ bị trộn lẫn. Độ phức tạp: thời gian O(n), bộ nhớ O(w) với `w` là độ rộng lớn nhất.
  - id: c01
    type: code_sample
    lang: python
    runnable: true
    code: |
      from collections import deque

      class TreeNode:
          def __init__(self, val, left=None, right=None):
              self.val = val
              self.left = left
              self.right = right

      root = TreeNode(3, TreeNode(9), TreeNode(20, TreeNode(15), TreeNode(7)))
      queue = deque([root])
      depth = 0
      while queue:
          size = len(queue)
          level = []
          for _ in range(size):
              node = queue.popleft()
              level.append(node.val)
              if node.left:
                  queue.append(node.left)
              if node.right:
                  queue.append(node.right)
          print("tang", depth, "size", size, level)
          depth += 1
    expected_output: |
      tang 0 size 1 [3]
      tang 1 size 2 [9, 20]
      tang 2 size 2 [15, 7]
  - id: q01
    type: quiz_mcq
    prompt_md: "Vì sao phải lưu `size = len(queue)` trước vòng `for`, thay vì viết `while len(queue) > 0` ở vòng trong?"
    options:
      - {id: a, text_md: "Vì `len(queue)` rất chậm"}
      - {id: b, text_md: "Vì trong lúc pop ta đẩy thêm con vào queue, `len(queue)` đổi và các tầng bị trộn lẫn"}
      - {id: c, text_md: "Vì `deque` không cho gọi `len` hai lần"}
    answer: [b]
    explain_md: "Con của tầng hiện tại được đẩy vào cùng queue. Nếu không chốt `size` ngay đầu tầng, vòng trong sẽ nuốt luôn cả node của tầng kế. `len` là O(1), và gọi nhiều lần vẫn được, chỉ là sai logic."
  - id: ex_level
