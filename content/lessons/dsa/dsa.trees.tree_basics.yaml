title_vi: "Cây nhị phân và duyệt cây (binary trees and traversals)"
est_minutes: 14
objectives_vi:
  - "Mô tả cây nhị phân bằng TreeNode (val, left, right) và nhận ra gốc, lá, con trái/phải."
  - "Cài duyệt preorder, inorder, postorder bằng đệ quy và dự đoán thứ tự thăm."
  - "Tính chiều cao (height) của cây bằng đệ quy với trường hợp cơ sở đúng."
