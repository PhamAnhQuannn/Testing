blocks:
  - id: s_dfs
    type: section
    title_vi: "TreeNode và duyệt theo chiều sâu (DFS)"
    summary_vi: "Preorder, inorder, postorder khác nhau ở thời điểm thăm node gốc."
    exercise_ref: ex_inorder
  - id: t01
    type: text
    md: |
      **Cây nhị phân (binary tree)** như gia phả lộn ngược: một node **gốc (root)** ở trên, mỗi node có
      tối đa hai con (**left**, **right**); node không có con là **lá (leaf)**.

      ```python
      class TreeNode:
          def __init__(self, val, left=None, right=None):
              self.val = val
              self.left = left
              self.right = right
      ```

      Ba cách duyệt theo chiều sâu (DFS) chỉ khác nhau ở **lúc thăm node hiện tại** so với hai cây con:

      - **Preorder**: node, trái, phải.
      - **Inorder**: trái, node, phải (với cây tìm kiếm nhị phân cho dãy tăng dần).
      - **Postorder**: trái, phải, node.

      Đệ quy rất tự nhiên: `def f(node): if node is None: return; ...`. Bộ nhớ ngăn xếp gọi hàm là
      **O(h)** với `h` là chiều cao cây.

      Trong các bài tập, cây được cho dưới dạng list **theo tầng** với `None` cho chỗ trống, ví dụ
      `[1, 2, 3, None, 4]` là gốc 1, con trái 2, con phải 3, và 2 có con phải 4. Hàm `build_tree`
      có sẵn trong code mẫu sẽ dựng cây này.
  - id: q01
    type: quiz_mcq
    prompt_md: "Cây: gốc 1, con trái 2, con phải 3, và 2 có con phải 4. Thứ tự **preorder** là gì?"
    options:
      - {id: a, text_md: "`2 4 1 3`"}
      - {id: b, text_md: "`1 2 4 3`"}
      - {id: c, text_md: "`4 2 3 1`"}
    answer: [b]
    explain_md: "Preorder: thăm node trước (1), rồi cả cây trái (2, rồi con phải 4), rồi cây phải (3): 1 2 4 3. `2 4 1 3` là inorder, `4 2 3 1` là postorder."
  - id: ex_inorder
    type: code_exercise
    md: |
      Viết `inorder_values(vals)`: dựng cây từ `vals` (list theo tầng, `None` là chỗ trống) bằng
      `build_tree` có sẵn, rồi trả về list giá trị theo thứ tự **inorder** (trái, node, phải).
      Ví dụ `[1, 2, 3, None, 4]` cho `[2, 4, 1, 3]`.
    entry: inorder_values
    starter: |
      class TreeNode:
          def __init__(self, val, left=None, right=None):
              self.val = val
              self.left = left
              self.right = right

      def build_tree(vals):
          if not vals or vals[0] is None:
              return None
          root = TreeNode(vals[0])
          queue = [root]
          i = 1
          while queue and i < len(vals):
              node = queue.pop(0)
              if i < len(vals) and vals[i] is not None:
                  node.left = TreeNode(vals[i])
                  queue.append(node.left)
              i += 1
              if i < len(vals) and vals[i] is not None:
                  node.right = TreeNode(vals[i])
                  queue.append(node.right)
              i += 1
          return root

      def inorder_values(vals):
          root = build_tree(vals)
          out = []
          # TODO: đệ quy trái, node, phải
          return out
    guidance_md: |
      - Viết hàm con `walk(node)` dùng chung list `out`.
      - Trường hợp cơ sở: `node is None` thì dừng.
      - Thứ tự: gọi `walk(node.left)`, thêm `node.val`, gọi `walk(node.right)`.
    hints:
      - level: nudge
        md: "Khi nào đệ quy phải dừng, và giá trị của node được thêm vào list ở thời điểm nào?"
      - level: approach
        md: "Hàm con `walk`: nếu node là None thì return; đi cây trái, ghi `val`, đi cây phải."
      - level: pseudocode
        md: |
          walk(node):
              nếu node là None: trả về
              walk(node.left)
              out.append(node.val)
              walk(node.right)
          walk(root)
      - level: near_solution
        md: |
          def walk(node):
              if node is None:
                  return
              ...                 # cây trái
              out.append(node.val)
              ...                 # cây phải
          walk(root)
    tests:
      - {args: [[]], expected: []}
      - {args: [[1, 2, 3, null, 4]], expected: [2, 4, 1, 3]}
      - {args: [[1, 2, 3, 4, 5, 6, 7]], expected: [4, 2, 5, 1, 6, 3, 7]}
      - {args: [[1, null, 2, null, 3]], expected: [1, 2, 3]}
    solution: |
      class TreeNode:
          def __init__(self, val, left=None, right=None):
              self.val = val
              self.left = left
              self.right = right

      def build_tree(vals):
          if not vals or vals[0] is None:
              return None
          root = TreeNode(vals[0])
          queue = [root]
          i = 1
          while queue and i < len(vals):
              node = queue.pop(0)
              if i < len(vals) and vals[i] is not None:
                  node.left = TreeNode(vals[i])
                  queue.append(node.left)
              i += 1
              if i < len(vals) and vals[i] is not None:
                  node.right = TreeNode(vals[i])
                  queue.append(node.right)
              i += 1
          return root

      def inorder_values(vals):
          root = build_tree(vals)
          out = []

          def walk(node):
              if node is None:
                  return
              walk(node.left)
              out.append(node.val)
              walk(node.right)

          walk(root)
          return out
  - id: s_height
    type: section
    title_vi: "Chiều cao của cây"
    summary_vi: "Đệ quy trên hai cây con và trường hợp cơ sở cho cây rỗng."
    exercise_ref: ex_depth
  - id: t02
    type: text
    md: |
      **Chiều cao (height)** của cây tính theo số node trên đường dài nhất từ gốc xuống lá (ở đây cây
      rỗng có chiều cao 0, cây một node có chiều cao 1). Công thức đệ quy gọn:

      ```python
      def height(node):
          if node is None:
              return 0
          return 1 + max(height(node.left), height(node.right))
      ```

      Chú ý phân biệt **độ sâu (depth)** của một node (số bước từ gốc xuống node đó) với **chiều cao**
      (từ node xuống lá xa nhất). Trường hợp cơ sở sai là lỗi hay gặp: cây rỗng phải trả 0.
  - id: q02
    type: quiz_fill
    prompt_md: "Cây nhị phân chỉ có một node (gốc, không có con) có chiều cao ___ (theo cách đếm số node)."
    blanks: [{accept: ["1", "một"]}]
    explain_md: "`1 + max(0, 0) = 1`: cây rỗng cho 0, cây một node cho 1."
  - id: ex_depth
    type: code_exercise
    md: |
      Hàm `max_depth(vals)` phải trả chiều cao của cây (số node trên đường dài nhất từ gốc tới lá;
      cây rỗng là 0). Bản dưới đây trả sai vì trường hợp cơ sở. Hãy sửa.
    entry: max_depth
    starter: |
      class TreeNode:
          def __init__(self, val, left=None, right=None):
              self.val = val
              self.left = left
              self.right = right

      def build_tree(vals):
          if not vals or vals[0] is None:
              return None
          root = TreeNode(vals[0])
          queue = [root]
          i = 1
          while queue and i < len(vals):
              node = queue.pop(0)
              if i < len(vals) and vals[i] is not None:
                  node.left = TreeNode(vals[i])
                  queue.append(node.left)
              i += 1
              if i < len(vals) and vals[i] is not None:
                  node.right = TreeNode(vals[i])
                  queue.append(node.right)
              i += 1
          return root

      def max_depth(vals):
          def height(node):
              if node is None:
                  return 1
              return 1 + max(height(node.left), height(node.right))

          return height(build_tree(vals))
    guidance_md: |
      - Thử `[]` (cây rỗng): kết quả phải là bao nhiêu?
      - Thử `[5]` (một node): `1 + max(h(None), h(None))` đang cho bao nhiêu?
      - Sửa giá trị trả về của trường hợp cơ sở.
    hints:
      - level: nudge
        md: "Cây rỗng đang trả 1. Cây một node thì sao?"
      - level: approach
        md: "Mỗi node thêm đúng 1 vào chiều cao, còn `None` không đóng góp node nào. Giá trị của `None` nên là gì?"
      - level: near_solution
        md: "Trong `height`, nhánh `node is None` phải `return 0`."
    tests:
      - {args: [[]], expected: 0}
      - {args: [[5]], expected: 1}
      - {args: [[3, 9, 20, null, null, 15, 7]], expected: 3}
      - {args: [[1, null, 2, null, 3]], expected: 3}
    solution: |
      class TreeNode:
          def __init__(self, val, left=None, right=None):
              self.val = val
              self.left = left
              self.right = right

      def build_tree(vals):
          if not vals or vals[0] is None:
              return None
          root = TreeNode(vals[0])
          queue = [root]
          i = 1
          while queue and i < len(vals):
              node = queue.pop(0)
              if i < len(vals) and vals[i] is not None:
                  node.left = TreeNode(vals[i])
                  queue.append(node.left)
              i += 1
              if i < len(vals) and vals[i] is not None:
                  node.right = TreeNode(vals[i])
                  queue.append(node.right)
              i += 1
          return root

      def max_depth(vals):
          def height(node):
              if node is None:
                  return 0
              return 1 + max(height(node.left), height(node.right))

          return height(build_tree(vals))
  - id: s_level
    type: section
    title_vi: "Duyệt theo tầng (level-order)"
    summary_vi: "Dùng queue để thăm từng tầng từ trên xuống."
    exercise_ref: ex_level
  - id: t03
    type: text
    md: |
      **Level-order (BFS)** thăm cây từng tầng từ trên xuống, trái sang phải, bằng một **hàng đợi
      (queue)**. Mỗi vòng ngoài xử lý đúng một tầng: lấy `len(queue)` hiện tại làm số node của tầng,
      pop từng node, ghi giá trị, rồi đẩy con trái và con phải (nếu có) vào queue cho tầng kế.

      ```python
      level = []
      for _ in range(len(queue)):
          node = queue.pop(0)
          level.append(node.val)
          if node.left: queue.append(node.left)
          if node.right: queue.append(node.right)
      ```

      Bộ nhớ của BFS là O(w) với `w` là độ rộng lớn nhất của cây (DFS dùng O(h)).
  - id: q03
    type: predict_output
    code: |
      class TreeNode:
          def __init__(self, val, left=None, right=None):
              self.val = val
              self.left = left
              self.right = right

      root = TreeNode(1, TreeNode(2, None, TreeNode(4)), TreeNode(3))

      def post(node):
          if node is None:
              return
          post(node.left)
          post(node.right)
          print(node.val, end=" ")

      post(root)
      print()
    expected_output: |
      4 2 3 1
    explain_md: "Postorder: cây trái của 1 (gồm 2 với con phải 4) cho `4 2`, rồi cây phải cho `3`, cuối cùng node gốc `1`."
