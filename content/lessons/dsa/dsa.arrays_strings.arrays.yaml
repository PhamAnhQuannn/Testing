    problem_id: duplicate-zeros
  - id: b18
    type: summary
    bullets_vi:
      - "Mảng là các ô nhớ liền nhau: đọc/ghi theo chỉ số là O(1)."
      - "Chèn hoặc xoá ở giữa/đầu là O(n) vì phải dời các phần tử phía sau."
      - "Mảng động tự gấp đôi dung lượng khi đầy, nên `append` là O(1) trung bình (amortized)."
