subtopic_id: py.errors_modules.exceptions
items:
- id: P1320
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: '`int("abc")` gây exception nào?'
  choices:
  - '`TypeError`'
  - '`ValueError`'
  - '`NameError`'
  - '`KeyError`'
  answer_index: 1
  explanation_md: '`int` nhận đúng kiểu `str` nhưng giá trị `"abc"` không phải số
    nguyên hợp lệ, nên là `ValueError` (sai kiểu mới là `TypeError`).'
- id: P1321
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "class BadInput(Exception):\n    pass\n\ndef f(x):\n    if x < 0:\n      \
    \  raise BadInput(\"neg\")\n    return x\n\nfor v in [3, -1]:\n    try:\n    \
    \    print(f(v))\n    except BadInput as e:\n        print(\"loi\", e)\n    finally:\n\
    \        print(\"end\")"
  expected_output: '3

    end

    loi neg

    end'
