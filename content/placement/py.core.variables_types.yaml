# Placement-only items (P0 mcq / P1 read_code). Validated by content/schemas/placement.schema.json.
# read_code expected_output = real stdout of `code` (computed by running it, never typed).
subtopic_id: py.core.variables_types
items:
- id: P971
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Sau `x = "5"` và `y = int(x) + 1`, giá trị của `y` là gì?
  choices:
  - '`51`'
  - '`6`'
  - '`TypeError`'
  - '`"6"`'
  answer_index: 1
  explanation_md: '`int("5")` đổi string thành số nguyên `5`, cộng 1 được `6` (kiểu `int`).'
- id: P972
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Sau `a, b = 1, 2` rồi `a, b = b, a`, giá trị của `a` và `b` là gì?
  choices:
  - '`a = 1`, `b = 2`'
  - '`a = 2`, `b = 1`'
  - '`a = 2`, `b = 2`'
  - Báo lỗi
  answer_index: 1
  explanation_md: Vế phải `(b, a)` được tính trước thành `(2, 1)` rồi mới gán, nên hai biến hoán đổi giá trị.
- id: P973
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    a, b = 3, "4"
    print(type(a).__name__, type(b).__name__)
    print(a == int(b))
    a, b = b, a
    print(a, b)
    print(isinstance(True, int), str(12) + "!", float("1.5") + 1)
  expected_output: |-
    int str
    False
    4 3
    True 12! 2.5
