subtopic_id: py.oop.inheritance_mro
items:
- id: P1350
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Cho `class A` có `f()` trả `"A"`, `class B(A)` ghi đè `f()` trả `"B"`. `B().f()` trả về gì?'
  choices:
  - '`"B"`, vì method của class con ghi đè method của cha'
  - '`"A"`, vì cha luôn được ưu tiên'
  - '`"AB"`, Python nối kết quả của cả hai'
  - Báo lỗi vì trùng tên method
  answer_index: 0
  explanation_md: 'Python tìm method từ class của object trước, nên bản của `B` thắng. Muốn dùng cả bản của cha thì phải gọi `super().f()`.'
- id: P1351
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    class P:
        def go(self):
            return "P"

    class Q(P):
        def go(self):
            return "Q" + super().go()

    class R(P):
        pass

    class S(R, Q):
        pass

    print(S().go())
    print([c.__name__ for c in S.mro()][:3])
    print(isinstance(S(), Q))
  expected_output: "QP\n['S', 'R', 'Q']\nTrue"
