items:
- id: P1416
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Khi duyệt lưới 2D bằng DFS/BFS, bước nào phải làm trước khi đọc `grid[r][c]` của ô hàng xóm?
  choices:
  - Kiểm tra 0 <= r < số hàng và 0 <= c < số cột
  - Sắp xếp lại các hàng của lưới
  - Chuyển lưới thành ma trận kề
  - Đặt toàn bộ ô thành 0
  answer_index: 0
  explanation_md: Nếu không kiểm tra biên, chỉ số ngoài lưới gây IndexError hoặc (với chỉ số âm) đọc nhầm ô ở phía đối diện.
- id: P1417
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "from collections import deque\n\ngrid = [[1, 0, 1],\n        [1, 0, 0],\n        [0, 1, 1]]\nR, C = 3, 3\nseen = {(0, 0)}\nq = deque([(0, 0)])\nn = 0\nwhile q:\n    r, c = q.popleft()\n    n += 1\n    for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n        a, b = r + dr, c + dc\n        if 0 <= a < R and 0 <= b < C and grid[a][b] == 1 and (a, b) not in seen:\n            seen.add((a, b))\n            q.append((a, b))\nprint(n)\nprint(sorted(seen))"
  expected_output: '2

    [(0, 0), (1, 0)]'
