- id: P1402
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - tinh-don-dieu-neu-x-du-thi-moi-gia-tri-l
  prompt_md: Điều kiện then chốt để áp dụng "binary search trên đáp án" là gì?
  choices:
  - Mảng đầu vào phải được sắp xếp
  - Hàm kiểm tra `feasible(x)` đơn điệu theo x (đúng từ một ngưỡng trở đi, hoặc sai từ một ngưỡng trở đi)
  - Đáp án phải là số nguyên tố
  - Mảng đầu vào không có phần tử trùng
  answer_index: 1
  explanation_md: Không cần sắp mảng đầu vào. Chỉ cần `feasible` đơn điệu để biết nên bỏ nửa nào của khoảng đáp án.
- id: P1403
  difficulty: 1
  type: read_code
  minutes: 2
  concepts:
  - tim-gia-tri-nho-nhat-thoa-check-neu-chec
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "lo, hi = 1, 20\nwhile lo < hi:\n    mid = (lo + hi) // 2\n    if mid * mid >= 50:\n        hi = mid\n    else:\n        lo = mid + 1\nprint(lo)"
  expected_output: '8'
