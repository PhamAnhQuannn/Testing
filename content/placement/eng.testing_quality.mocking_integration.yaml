# Concept-hub placement items (level-1 mcq, level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: eng.testing_quality.mocking_integration
items:
- id: P1878
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - mock-stub-fake-spy-stub-tra-dap-an-dinh
  prompt_md: Loại test double nào dùng để kiểm tra rằng một hàm đã được gọi đúng một lần với tham số mong đợi?
  choices:
  - Stub
  - Mock
  - Fake
  - Database thật
  answer_index: 1
  explanation_md: 'Mock kiểm tra tương tác (có gọi không, mấy lần, tham số gì). Stub chỉ trả đáp án định sẵn, fake là bản chạy thật đơn giản.'
- id: P1879
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - integration-test-test-nhieu-phan-chay-cu
  prompt_md: 'Mọi unit test đều xanh vì database đã bị mock, nhưng sau deploy câu truy vấn thật lỗi. Cách khắc phục hợp lý nhất là gì?'
  choices:
  - Mock thêm nhiều thành phần nữa để test nhanh hơn
  - Thêm integration test chạy với database thật (hoặc fake đủ trung thực) cho phần truy cập dữ liệu
  - Xóa hết unit test
  - Chỉ dùng stub thay cho mock
  answer_index: 1
  explanation_md: 'Over-mocking khiến test không chạy qua database thật nên không bắt được lỗi tích hợp. Integration test với DB thật hoặc fake trung thực kiểm tra đúng chỗ nối đó; vẫn giữ unit test cho logic.'
