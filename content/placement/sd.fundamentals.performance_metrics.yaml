subtopic_id: sd.fundamentals.performance_metrics
items:
- id: P1245
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Một API có p50 = 80 ms nhưng p99 = 2 s. Điều gì đúng nhất về hệ thống này?'
  choices:
  - 'Mọi request đều mất khoảng 80 ms'
  - '1% request chậm hơn 2 s (tail latency), p50 không phản ánh được trải nghiệm của nhóm chậm này'
  - 'Throughput của hệ thống chắc chắn là 2 request/giây'
  - 'p99 luôn nhỏ hơn p50'
  answer_index: 1
  explanation_md: 'p99 = 2 s nghĩa là 1% request chậm hơn 2 s (tail latency); trung bình/p50 che mất nhóm chậm này nên SLO thường đặt trên p95/p99.'
