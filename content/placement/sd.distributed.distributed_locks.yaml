subtopic_id: sd.distributed.distributed_locks
items:
- id: P1215
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Client giữ distributed lock bị pause lâu (GC pause) và lease hết hạn. Cơ chế nào ngăn client cũ ghi đè sai?"
  choices:
  - "Fencing token tăng dần, resource từ chối token cũ hơn"
  - "Tăng thời gian lease lên vô hạn"
  - "Tin vào đồng hồ máy client để biết lock còn hạn"
  - "Cho client cũ retry cho đến khi thành công"
  answer_index: 0
  explanation_md: "Fencing token tăng dần: lock service cấp token mỗi lần cấp lock, resource từ chối request mang token nhỏ hơn token đã thấy, nên holder cũ bị chặn dù tưởng mình còn lock."
