items:
- id: P1452
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Cần thay mỗi từ trong câu bằng root ngắn nhất của từ điển là tiền tố của nó. Cấu trúc nào cho mỗi từ chi phí O(độ dài từ) bất kể từ điển lớn cỡ nào?
  choices:
  - Trie dựng từ các root, đi dọc từ và dừng ở cờ kết thúc đầu tiên
  - Duyệt từng root và gọi startswith với từng từ
  - Sắp xếp từ điển rồi tìm nhị phân cho cả từ
  - Đặt các root vào một list rồi dùng in để kiểm tra từng từ
  answer_index: 0
  explanation_md: Trie đi theo từng ký tự của từ và dừng ngay ở cờ kết thúc đầu tiên, nên chi phí chỉ phụ thuộc độ dài từ. Duyệt từng root tốn O(số root x độ dài từ); tìm nhị phân cho cả từ không cho ra tiền tố; kiểm tra bằng in trên list chỉ khớp nguyên từ chứ không khớp tiền tố.
- id: P1453
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "trie = {}\nfor w in [\"to\", \"tea\", \"ten\"]:\n    node = trie\n    for ch in w:\n        node = node.setdefault(ch, {})\n        node[\"#\"] = node.get(\"#\", 0) + 1\n\nnode = trie\nfor ch in \"te\":\n    node = node[ch]\nprint(node[\"#\"])\nprint(sorted(k for k in node if k != \"#\"))"
  expected_output: "2\n['a', 'n']"
