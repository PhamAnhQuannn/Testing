# Concept-hub placement items (C1 level-1 mcq, C2 level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: sd.caching.patterns
items:
- id: P942
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong pattern cache-aside (lazy loading), khi đọc dữ liệu mà bị cache miss thì ứng dụng làm gì?
  choices:
  - Trả lỗi 404 vì cache là nguồn dữ liệu duy nhất
  - Đọc từ database, ghi kết quả vào cache rồi trả về
  - Chờ cache tự đồng bộ từ database
  - Xoá toàn bộ cache rồi nạp lại từ đầu
  answer_index: 1
  explanation_md: Cache-aside do ứng dụng điều khiển. Miss thì đọc database, nạp kết quả vào cache (thường kèm TTL) rồi trả về; lần đọc sau sẽ hit.
- id: P943
  difficulty: 2
  type: mcq
  minutes: 2
  prompt_md: 'Hệ thống đếm lượt xem có lượng ghi rất lớn, chấp nhận mất vài giây dữ liệu nếu cache node chết, và muốn giảm tải ghi lên database. Pattern ghi nào hợp lý nhất, kèm rủi ro gì?'
  choices:
  - 'Write-through: ghi đồng bộ cả cache lẫn DB, nên giảm tải ghi lên DB'
  - 'Cache-aside với TTL vô hạn: không có rủi ro vì DB luôn là nguồn đúng'
  - 'Read-through: cache tự nạp khi miss, nên giảm tải ghi lên DB'
  - 'Write-back (write-behind): ghi vào cache trước, đẩy xuống DB bất đồng bộ theo lô; rủi ro mất dữ liệu chưa flush nếu cache chết'
  answer_index: 3
  explanation_md: Chỉ write-back gộp nhiều lần ghi thành ít lần ghi lô xuống DB, đổi lại có thể mất dữ liệu chưa flush. Write-through vẫn ghi DB mỗi lần, cache-aside và read-through là pattern đọc nên không giảm tải ghi.
