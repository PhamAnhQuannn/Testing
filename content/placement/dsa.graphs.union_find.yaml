subtopic_id: dsa.graphs.union_find
items:
- id: P1422
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Khi thêm cạnh (u, v) của đồ thị vô hướng, DSU báo find(u) == find(v). Điều đó có nghĩa gì?
  choices:
  - Cạnh này tạo ra một chu trình
  - u và v thuộc hai thành phần khác nhau
  - Đồ thị là một cây khung nhỏ nhất
  - Cần gộp hai tập bằng union
  answer_index: 0
  explanation_md: Cùng root nghĩa là u và v đã nối với nhau bằng các cạnh trước đó, nên thêm (u, v) khép thành chu trình.
- id: P1423
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "parent = [0, 0, 2, 2]\n\ndef find(x):\n    while parent[x] != x:\n        x = parent[x]\n    return x\n\nparent[find(1)] = find(3)\nprint(parent)\nprint(find(1) == find(2))"
  expected_output: '[2, 0, 2, 2]

    True'
