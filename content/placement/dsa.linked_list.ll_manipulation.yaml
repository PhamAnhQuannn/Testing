subtopic_id: dsa.linked_list.ll_manipulation
items:
- id: P1051
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Khi đảo ngược (reverse) singly linked list bằng cách lặp với `prev`, `cur`, `nxt`, thao tác then chốt ở mỗi bước là gì?'
  choices:
  - 'Lưu `nxt = cur.next`, rồi gán `cur.next = prev` và dịch `prev`, `cur` tiến lên'
  - 'Gán `cur.next = None` ở mọi bước'
  - 'Copy toàn bộ giá trị sang một list mới rồi đảo'
  - 'Đổi chỗ `val` của node đầu và node cuối'
  answer_index: 0
  explanation_md: 'Phải lưu `cur.next` trước khi đổi con trỏ, nếu không sẽ mất phần list còn lại. Mỗi bước đảo một liên kết và dịch hai con trỏ.'
- id: P1052
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    class Node:
        def __init__(self, val, nxt=None):
            self.val = val
            self.next = nxt

    def to_list(head):
        out = []
        while head:
            out.append(head.val)
            head = head.next
        return out

    head = Node(1, Node(2, Node(3)))
    prev = None
    cur = head
    while cur:
        nxt = cur.next
        cur.next = prev
        prev = cur
        cur = nxt
    head = prev
    print(to_list(head))
    head.next.next = None
    print(to_list(head))
    head = Node(9, head)
    print(to_list(head))
  expected_output: |-
    [3, 2, 1]
    [3, 2]
    [9, 3, 2]
