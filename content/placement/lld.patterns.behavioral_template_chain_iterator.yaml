subtopic_id: lld.patterns.behavioral_template_chain_iterator
items:
- id: P1537
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong Chain of Responsibility, mỗi handler làm gì với yêu cầu?
  choices:
  - Xử lý phần của mình rồi chuyển phần còn lại cho handler kế
  - Luôn xử lý toàn bộ và không bao giờ chuyển tiếp
  - Xoá yêu cầu khỏi hệ thống
  - Tạo ra một chuỗi handler mới
  answer_index: 0
  explanation_md: Mỗi handler giữ self.tiep, làm phần của mình rồi gọi handler kế (nhớ kiểm tra self.tiep không phải None).
- id: P1538
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Template Method khác Strategy ở điểm nào?
  choices:
  - Template Method dùng kế thừa (con ghi đè hook), Strategy dùng composition
  - Template Method dùng composition, Strategy dùng kế thừa
  - Hai mẫu hoàn toàn giống nhau
  - Template Method cho phép con đổi thứ tự các bước của cha
  answer_index: 0
  explanation_md: Lớp cha của Template Method cố định thứ tự bước, con chỉ điền hook. Strategy truyền object chiến lược vào (composition).
- id: P1539
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code in ra gì?'
  code: "class Box:\n    def __init__(self, items):\n        self.items = items\n\n    def __iter__(self):\n        return iter(self.items)\n\n\nb = Box([\"x\", \"y\"])\nprint([i * 2 for i in b])\nprint(list(b) == list(b))"
  expected_output: "['xx', 'yy']\nTrue"
