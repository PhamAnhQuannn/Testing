# Concept-hub placement items (level-1 mcq, level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: eng.testing_quality.debugging_methodology
items:
- id: P1882
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - quy-trinh-tai-hien-loi-thu-nho-ca-loi-da
  prompt_md: Bạn nhận một bug report. Bước đầu tiên hợp lý nhất khi debug là gì?
  choices:
  - Sửa ngay đoạn code nghi ngờ rồi deploy
  - Tìm cách tái hiện (reproduce) lỗi một cách ổn định
  - Viết lại toàn bộ module
  - Thêm try/except bỏ qua mọi lỗi
  answer_index: 1
  explanation_md: 'Phải tái hiện được lỗi thì mới kiểm chứng được bản sửa. Các lựa chọn còn lại là đoán mò hoặc che triệu chứng.'
- id: P1883
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - chia-doi-de-tim-tat-mot-nua-doan-code-ho
  prompt_md: 'Một test pass ở release cũ nhưng fail ở bản hiện tại, giữa hai mốc có hàng trăm commit. Cách nhanh nhất để tìm commit gây lỗi là gì?'
  choices:
  - Đọc lần lượt từng commit từ đầu
  - Dùng git bisect để chia đôi khoảng commit (good/bad) cho đến khi ra commit gây lỗi
  - Dùng git stash
  - Revert ngẫu nhiên từng commit
  answer_index: 1
  explanation_md: '`git bisect` thực hiện tìm kiếm nhị phân qua lịch sử, chỉ cần khoảng log2(n) lần kiểm tra. `git stash` chỉ cất thay đổi chưa commit, không tìm lỗi.'
