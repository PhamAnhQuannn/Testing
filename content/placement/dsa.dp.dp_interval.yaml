subtopic_id: dsa.dp.dp_interval
items:
- id: P1444
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Interval DP có `dp[l][r]` và thử mọi điểm cắt `k` trong đoạn (như Burst Balloons, Matrix Chain). Độ phức tạp thời gian là bao nhiêu?'
  choices:
  - O(n)
  - O(n^2)
  - O(n^3)
  - O(2^n)
  answer_index: 2
  explanation_md: Có O(n^2) đoạn (l, r), mỗi đoạn thử O(n) điểm cắt k, nên tổng O(n^3).
- id: P1445
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "a = [1, 3, 5, 1]\nn = len(a)\ndp = [[0] * n for _ in range(n)]\nfor length in range(2, n):\n    for l in range(n - length):\n        r = l + length\n        dp[l][r] = max(dp[l][k] + a[l] * a[k] * a[r] + dp[k][r] for k in range(l + 1, r))\nprint(dp[0][3])\nprint(dp[0][2], dp[1][3])"
  expected_output: '20

    15 15'
