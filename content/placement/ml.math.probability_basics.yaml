- id: P1594
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Tung một con xúc xắc công bằng, xác suất ra số chẵn là bao nhiêu?
  choices:
  - 1/2
  - 1/3
  - 1/6
  - 2/3
  answer_index: 0
  explanation_md: Có 3 kết quả chẵn (2, 4, 6) trên tổng 6 kết quả đồng khả năng, nên P = 3/6 = 1/2.
- id: P1595
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Hai biến cố A và B độc lập khi nào?"
  choices:
  - P(A∩B) = P(A)·P(B)
  - A và B không bao giờ xảy ra cùng lúc
  - P(A|B) = P(B|A)
  - P(A) + P(B) = 1
  answer_index: 0
  explanation_md: Độc lập nghĩa là biết B không đổi gì về A. Không xảy ra cùng lúc là xung khắc, một khái niệm khác.
