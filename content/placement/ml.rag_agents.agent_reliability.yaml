subtopic_id: ml.rag_agents.agent_reliability
items:
- id: P1112
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Cách nào giúp ngăn agent lặp vô tận và giảm rủi ro khi nó gọi tool có tác động thật (xóa dữ liệu, gửi tiền)?
  choices:
  - Đặt giới hạn số bước và ngân sách, cấp quyền tối thiểu, và yêu cầu người xác nhận (human-in-the-loop) với hành động rủi ro
  - Tăng temperature để agent đa dạng hơn
  - Cho agent toàn quyền để nó tự quyết nhanh hơn
  - Chỉ kiểm tra câu trả lời cuối, không cần xem các bước trung gian
  answer_index: 0
  explanation_md: Guardrail gồm giới hạn bước, least privilege, sandbox và người duyệt. Đánh giá agent nên chấm cả trajectory, không chỉ kết quả cuối.
