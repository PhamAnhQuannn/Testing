subtopic_id: py.oop.dataclasses_enums
items:
- id: P1354
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Cách khai báo nào cho dataclass một field list mặc định hợp lệ?'
  choices:
  - '`items: list = []`'
  - '`items: list = field(default_factory=list)`'
  - '`items: list = list`'
  - '`items: list = None` rồi tự động thành list rỗng'
  answer_index: 1
  explanation_md: '`= []` bị dataclass từ chối (`ValueError`) vì list sẽ bị dùng chung giữa các object. `field(default_factory=list)` gọi `list()` mỗi lần tạo object nên mỗi object có list riêng.'
- id: P1355
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    from dataclasses import dataclass
    from enum import Enum

    @dataclass(frozen=True)
    class P:
        x: int
        y: int = 0

    class C(Enum):
        A = 1
        B = 2

    print(P(1) == P(1, 0))
    print(len({P(1), P(1, 0)}))
    print(C.B.name, C(1).name, [c.value for c in C])
  expected_output: |-
    True
    1
    B A [1, 2]
