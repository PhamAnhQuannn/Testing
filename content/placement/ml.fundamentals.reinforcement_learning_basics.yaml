  - 'Học từ tập dữ liệu có nhãn đúng cho từng mẫu'
  - 'Tương tác với environment, nhận reward và học policy tối đa hóa tổng reward'
  - 'Gom nhóm dữ liệu không nhãn thành cụm'
  - 'Giảm số chiều dữ liệu đầu vào'
