subtopic_id: lld.oop_principles.pillars
items:
- id: P1513
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Bốn trụ cột của OOP là gì?
  choices:
  - Encapsulation, abstraction, inheritance, polymorphism
  - Class, object, method, attribute
  - Public, protected, private, static
  - Overloading, overriding, interface, constructor
  answer_index: 0
  explanation_md: Bốn trụ cột là đóng gói, trừu tượng, kế thừa và đa hình. Các lựa chọn còn lại là khái niệm liên quan nhưng không phải bốn trụ cột.
- id: P1514
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Điểm khác chính giữa abstract class và interface là gì?
  choices:
  - Abstract class có thể viết sẵn một phần code và giữ state; interface chỉ là hợp đồng các method phải có
  - Interface luôn chạy nhanh hơn abstract class
  - Abstract class không thể có method nào
  - Interface bắt buộc phải có constructor
  answer_index: 0
  explanation_md: Interface là hợp đồng (không state); abstract class có thể cài sẵn một phần và giữ state. Một class cài nhiều interface nhưng thường chỉ kế thừa một abstract class.
- id: P1515
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code in ra gì?'
  code: "class Animal:\n    def speak(self):\n        return \"...\"\n\n\nclass Dog(Animal):\n    def speak(self):\n        return \"woof\"\n\n\nclass Fish(Animal):\n    pass\n\n\nfor a in [Dog(), Fish()]:\n    print(a.speak())"
  expected_output: "woof\n..."
