subtopic_id: sd.archetypes.file_sync
items:
- id: P1171
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Dịch vụ đồng bộ file kiểu Dropbox cần tiết kiệm băng thông khi file lớn chỉ đổi một phần nhỏ. Kỹ thuật cốt lõi?"
  choices:
  - "Upload lại toàn bộ file mỗi lần sửa"
  - "Chia file thành chunk, hash từng chunk (dedup) và chỉ upload chunk thay đổi"
  - "Nén file thành zip rồi upload lại"
  - "Chỉ đồng bộ vào ban đêm"
  answer_index: 1
  explanation_md: "Chunking với content hash cho phép chỉ gửi chunk đổi và dedup chunk trùng giữa các file/user. Xung đột sửa đồng thời được xử lý bằng version hoặc conflicted copy."
