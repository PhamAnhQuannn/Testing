- id: P1494
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong DFS phát hiện vòng tham chiếu của bảng tính, khi nào ta kết luận có vòng?
  choices:
  - Khi gặp lại một ô đang ở trạng thái visiting (đang nằm trên đường đệ quy)
  - Khi gặp một ô đã ở trạng thái done
  - Khi một ô được tham chiếu nhiều hơn một lần
  - Khi công thức có nhiều hơn hai ô tham chiếu
  answer_index: 0
  explanation_md: Ô visiting nằm trên đường đệ quy hiện tại; đi vòng về nó nghĩa là có chu trình. Ô done hoặc ô được tham chiếu nhiều lần (như =A+A) là hợp lệ.
- id: P1495
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "deps = {\"A\": [\"B\"], \"B\": [\"C\"], \"C\": []}\n\ndef depth(n):\n    return 1 + max([depth(d) for d in deps[n]], default=0)\n\nprint(depth(\"A\"))\nprint(depth(\"C\"))"
  expected_output: '3

    1'
