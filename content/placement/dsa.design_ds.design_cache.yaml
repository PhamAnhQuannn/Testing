- id: P1460
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong hash map dùng bucket chaining, hai key khác nhau băm ra cùng một bucket (collision). Cách xử lý đúng là gì?
  choices:
  - Lưu cả hai cặp trong danh sách của bucket đó và so sánh key khi tìm
  - Ghi đè key cũ bằng key mới
  - Báo lỗi và từ chối key thứ hai
  - Chuyển key thứ hai sang bucket trống đầu tiên mà không ghi nhớ
  answer_index: 0
  explanation_md: Chaining giữ mọi cặp cùng bucket trong một danh sách; khi get/put phải so sánh key thật để phân biệt.
- id: P1461
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "store = {}\nfor w in [\"a\", \"b\", \"a\", \"c\", \"a\"]:\n    store[w] = store.get(w, 0) + 1\nprint(store)\nprint(store.get(\"z\", -1), len(store))"
  expected_output: "{'a': 3, 'b': 1, 'c': 1}\n-1 3"
