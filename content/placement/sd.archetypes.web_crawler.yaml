subtopic_id: sd.archetypes.web_crawler
items:
- id: P1168
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Web crawler quy mô lớn cần tránh crawl lại URL đã thấy và không làm quá tải một site. Thiết kế đúng là gì?"
  choices:
  - "Crawl song song không giới hạn trên mọi domain"
  - "Lưu mọi URL trong một list rồi duyệt tuyến tính mỗi lần"
  - "URL frontier với queue theo host (politeness, tôn trọng robots.txt) cùng dedup URL bằng Bloom filter / set"
  - "Chỉ crawl trang chủ"
  answer_index: 2
  explanation_md: "URL frontier điều phối thứ tự và politeness (delay theo host); Bloom filter/set dedup rẻ bộ nhớ. Crawl không giới hạn dễ bị chặn, list tuyến tính quá chậm."
