- id: P1464
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Cần trả lời "giá trị của key tại thời điểm t" khi mỗi key có danh sách (timestamp, value) đã sắp xếp. Cách hiệu quả nhất là gì?
  choices:
  - Duyệt tuyến tính toàn bộ danh sách mỗi lần hỏi
  - Binary search để tìm timestamp lớn nhất không vượt quá t
  - Copy toàn bộ dữ liệu mỗi khi có thay đổi
  - Dùng set các timestamp
  answer_index: 1
  explanation_md: Danh sách đã sắp xếp theo timestamp nên bisect_right trừ 1 cho mốc gần nhất không vượt quá t trong O(log n); copy toàn bộ tốn bộ nhớ và thời gian.
- id: P1465
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "from collections import deque\n\nq = deque([10, 50, 120, 310])\nnow = 320\nwhile q and q[0] <= now - 300:\n    q.popleft()\nprint(list(q))\nprint(len(q))"
  expected_output: '[50, 120, 310]

    3'
