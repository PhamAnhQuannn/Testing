subtopic_id: ml.llm.prompt_engineering
items:
- id: P1081
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Few-shot prompting là gì?'
  choices:
  - 'Fine-tune model bằng vài epoch trên dữ liệu riêng'
  - 'Đưa vài ví dụ input-output mẫu vào prompt để model làm theo'
  - 'Giảm temperature xuống 0 để output ổn định'
  - 'Cắt ngắn prompt còn vài token'
  answer_index: 1
  explanation_md: 'Few-shot là đưa vài ví dụ input-output mẫu ngay trong prompt để model bắt chước định dạng và cách làm; không cập nhật weights.'
