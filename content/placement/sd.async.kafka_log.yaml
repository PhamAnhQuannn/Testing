subtopic_id: sd.async.kafka_log
items:
- id: P1225
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Trong Kafka, vì sao consumer có thể đọc lại (replay) message cũ?"
  choices:
  - "Broker xoá message ngay sau khi consumer đầu tiên đọc xong"
  - "Mỗi message được gửi lại tự động cho mọi consumer mỗi phút"
  - "Log là append-only theo partition, message được giữ theo retention và consumer tự quản lý offset"
  - "Producer phải gửi lại message khi consumer yêu cầu"
  answer_index: 2
  explanation_md: "Kafka lưu message trong log append-only chia partition; consumer chỉ giữ offset nên có thể tua lại offset để replay."
