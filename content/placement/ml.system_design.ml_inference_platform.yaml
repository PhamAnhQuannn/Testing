subtopic_id: ml.system_design.ml_inference_platform
items:
- id: P1159
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong nền tảng ML inference, dynamic batching giúp gì?
  choices:
  - Giảm dung lượng model trên đĩa
  - Đảm bảo mọi request luôn có độ trễ thấp nhất bất kể tải
  - Gộp nhiều request thành một batch để tăng throughput/hiệu suất GPU, đổi lại thêm một chút độ trễ chờ
  - Thay thế việc cần autoscaling
  answer_index: 2
  explanation_md: GPU hiệu quả hơn khi xử lý theo batch; dynamic batching gom request trong cửa sổ ngắn, tăng throughput với cái giá là độ trễ chờ nhỏ.
