items:
- id: P1900
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - pod-don-vi-nho-nhat-chay-mot-hoac-vai-co
  prompt_md: Trong Kubernetes, đơn vị nhỏ nhất có thể triển khai, chứa một hoặc vài container dùng chung network và storage, là gì?
  choices:
  - Node
  - Pod
  - Service
  - Namespace
  answer_index: 1
  explanation_md: 'Pod là đơn vị triển khai nhỏ nhất. Node là máy chạy pod, Service là địa chỉ cố định chia tải, Namespace chia cluster thành vùng riêng.'
- id: P1901
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - kubernetes-he-thong-tu-chay-giam-sat-va
  prompt_md: 'Deployment khai báo 3 replica, một pod bị xóa (hoặc node chứa nó chết). Kubernetes phản ứng thế nào và vì sao?'
  choices:
  - Không làm gì cho tới khi quản trị viên tạo lại pod
  - Tạo pod mới vì control loop thấy thực tế thấp hơn desired state và reconcile
  - Sửa lại pod cũ tại chỗ và giữ nguyên IP
  - Giảm desired state xuống còn 2 replica
  answer_index: 1
  explanation_md: 'Kubernetes hoạt động theo desired state: control loop so sánh thực tế với mong muốn và tạo pod mới để bù, pod mới có IP khác. Desired state chỉ đổi khi bạn (hoặc HPA) đổi nó.'
