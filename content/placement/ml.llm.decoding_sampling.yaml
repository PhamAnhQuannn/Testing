subtopic_id: ml.llm.decoding_sampling
items:
- id: P1082
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Tăng temperature khi sampling thì output thường thay đổi thế nào?'
  choices:
  - 'Output luôn giống hệt nhau mỗi lần'
  - 'Output ngắn đi vì model dừng sớm'
  - 'Phân phối phẳng hơn nên output đa dạng, ngẫu nhiên hơn'
  - 'Model chạy nhanh hơn'
  answer_index: 2
  explanation_md: 'Temperature cao làm phân phối xác suất phẳng hơn nên output đa dạng và ngẫu nhiên hơn; temperature thấp (về 0) gần greedy.'
- id: P1090
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code greedy decoding và top-k dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    logits = [1.2, 3.5, 0.3, 2.9, 3.1]
    best = max(range(len(logits)), key=lambda i: logits[i])
    print(best)
    top2 = sorted(range(len(logits)), key=lambda i: -logits[i])[:2]
    print(top2)
  expected_output: |-
    1
    [1, 4]
  explanation_md: 'Greedy chọn index có logit lớn nhất (3.5 tại index 1). Top-2 là hai index có logit cao nhất theo thứ tự giảm dần: 1 (3.5) và 4 (3.1).'
