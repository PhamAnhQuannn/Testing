subtopic_id: dsa.practical.file_system_sim
items:
- id: P1478
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Với `path = "/a//b/"`, `path.split("/")` trả về gì?
  choices:
  - "['', 'a', '', 'b', '']"
  - "['a', 'b']"
  - "['/a', 'b']"
  - "['', 'a', 'b']"
  answer_index: 0
  explanation_md: split giữ chuỗi rỗng ở hai đầu và giữa hai dấu `/` liền nhau; vì vậy cần lọc `if p` để chuẩn hóa path.
- id: P1479
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "fs = {}\n\ndef add(path, size):\n    node = fs\n    parts = [p for p in path.split(\"/\") if p]\n    for p in parts[:-1]:\n        node = node.setdefault(p, {})\n    node[parts[-1]] = size\n\ndef total(node):\n    return sum(total(v) if isinstance(v, dict) else v for v in node.values())\n\nadd(\"/a/x\", 4)\nadd(\"/a/b/y\", 6)\nadd(\"/c\", 1)\nprint(total(fs[\"a\"]))\nprint(total(fs))\nprint(sorted(fs))"
  expected_output: "10\n11\n['a', 'c']"
