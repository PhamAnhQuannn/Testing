subtopic_id: ml.rag_agents.chunking
items:
- id: P1105
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Vì sao khi chunking tài liệu người ta thường cho các chunk liền kề chồng lấn (overlap) một phần?
  choices:
  - Để câu hoặc ý nằm sát ranh giới giữa hai chunk không bị cắt đứt và mất ngữ cảnh
  - Để giảm số lượng chunk cần lưu trong vector store
  - Để embedding model chạy nhanh hơn
  - Để loại bỏ hoàn toàn các đoạn trùng lặp trong tài liệu
  answer_index: 0
  explanation_md: Overlap giữ ngữ cảnh ở ranh giới chunk để ý không bị cắt đôi. Đổi lại số chunk tăng lên, không giảm.
- id: P1106
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    L, size, overlap = 100, 30, 10
    step = size - overlap
    chunks = []
    start = 0
    while start < L:
        end = min(start + size, L)
        chunks.append(end - start)
        if end == L:
            break
        start += step
    print(len(chunks))
    print(chunks[-1])
  expected_output: |-
    5
    20
