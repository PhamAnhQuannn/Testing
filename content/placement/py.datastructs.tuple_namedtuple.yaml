subtopic_id: py.datastructs.tuple_namedtuple
items:
- id: P985
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Đoạn nào sau đây gây ra `TypeError`?'
  choices:
  - '`t = (1, 2); t[0] = 5`'
  - '`t = (1, 2); x, y = t`'
  - '`t = (1, 2); print(t[0])`'
  - '`t = (1, 2); t = t + (3,)`'
  answer_index: 0
  explanation_md: 'Tuple là immutable: không gán lại phần tử `t[0]` được. Unpacking và đọc index đều hợp lệ.'
- id: P986
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    from collections import namedtuple

    Point = namedtuple("Point", ["x", "y"])
    p = Point(3, 4)
    x, y = p
    print(x, y, p.x + p.y)
    a, b = 1, 2
    a, b = b, a
    print(a, b)
    first, *rest = (1, 2, 3, 4)
    print(first, rest)
    print(p)
    print((5,) == (5), type((5,)).__name__)
  expected_output: |-
    3 4 7
    2 1
    1 [2, 3, 4]
    Point(x=3, y=4)
    False tuple
