subtopic_id: sd.distributed.conflict_resolution
items:
- id: P1218
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Khi hai replica cùng sửa một dữ liệu, rủi ro chính của last-write-wins (LWW) là gì?"
  choices:
  - "LWW luôn giữ cả hai bản cập nhật"
  - "LWW cần coordinator để khoá dữ liệu"
  - "LWW có thể âm thầm làm mất một update đồng thời, trong khi CRDT merge được mà không mất"
  - "LWW không hề dùng timestamp"
  answer_index: 2
  explanation_md: "LWW dựa trên timestamp nên bỏ lặng lẽ một trong các update đồng thời, gây mất dữ liệu. CRDT hoặc OT merge được các thay đổi mà không mất."
