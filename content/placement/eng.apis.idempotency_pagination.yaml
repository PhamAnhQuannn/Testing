# Concept-hub placement items (level-1 mcq, level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: eng.apis.idempotency_pagination
items:
- id: P1874
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - idempotent-goi-mot-lan-hay-nhieu-lan-cho
  prompt_md: Nhóm HTTP method nào sau đây tự nhiên idempotent (gửi nhiều lần cho cùng kết quả cuối)?
  choices:
  - POST, PATCH, DELETE
  - GET, PUT, DELETE
  - GET, POST, PUT
  - POST, PUT, CONNECT
  answer_index: 1
  explanation_md: GET, PUT và DELETE tự nhiên idempotent. POST thường tạo tài nguyên mới mỗi lần gọi nên không idempotent.
- id: P1875
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - idempotency-key-client-gan-moi-yeu-cau-m
  prompt_md: Client retry một POST thanh toán bị timeout. Cách nào giúp không trừ tiền hai lần?
  choices:
  - Gửi kèm Idempotency-Key giống nhau để server trả lại kết quả đã lưu thay vì xử lý lại
  - Đổi POST thành GET để retry an toàn
  - Tăng offset của lần gọi tiếp theo
  - Trả 429 cho mọi request lặp lại
  answer_index: 0
  explanation_md: 'Với Idempotency-Key, server lưu key và kết quả; replay cùng key trả kết quả cũ nên không tạo khoản thanh toán thứ hai. GET không dùng để thay đổi dữ liệu, offset thuộc phân trang, còn 429 là mã rate limit.'
