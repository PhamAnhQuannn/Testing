subtopic_id: py.functions.iterators_generators
items:
- id: P1362
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Đặc điểm nào đúng với generator tạo bằng `(x for x in range(3))`?'
  choices:
  - Duyệt bao nhiêu lần cũng cho kết quả giống nhau
  - Chỉ duyệt được một lần; lần hai không còn phần tử nào
  - Lưu sẵn toàn bộ giá trị trong bộ nhớ như list
  - Phải gọi `.append` để thêm phần tử
  answer_index: 1
  explanation_md: Generator sinh giá trị lười và không lưu lại, nên sau khi duyệt hết nó cạn và lần duyệt thứ hai ra rỗng.
- id: P1363
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    def count(n):
        for i in range(n):
            yield i

    g = count(3)
    print(next(g))
    print(list(g))
    print(list(g))
  expected_output: |-
    0
    [1, 2]
    []
