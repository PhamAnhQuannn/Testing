- id: P1910
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - forward-only-khong-sua-file-migration-da
  prompt_md: Migration 003 đã chạy trên production. Theo nguyên tắc forward-only, khi cần thay đổi thêm thì làm gì?
  choices:
  - Sửa trực tiếp file migration 003 rồi deploy lại
  - Thêm file migration mới có số lớn hơn
  - Xóa file migration 003 khỏi repo
  - Chạy tay câu SQL trên production mà không ghi vào migration
  answer_index: 1
  explanation_md: 'Migration đã chạy thì không sửa vì máy đã chạy sẽ không chạy lại nên schema lệch nhau. Mọi thay đổi mới là một file mới có số lớn hơn.'
- id: P1911
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - expand-contract-them-cot-moi-cho-code-gh
  prompt_md: 'Đổi tên cột email thành contact_email trên bảng lớn mà không downtime. Thứ tự đúng theo expand-contract là gì?'
  choices:
  - Thêm cột mới, chuyển sang đọc cột mới, backfill, xóa cột cũ, rồi ghi cả hai cột
  - Thêm cột mới, ghi cả hai cột, backfill dữ liệu cũ rồi chuyển sang đọc cột mới, cuối cùng xóa cột cũ
  - Đổi tên cột bằng một câu RENAME rồi deploy code mới
  - Xóa cột cũ, thêm cột mới, rồi backfill
  answer_index: 1
  explanation_md: 'Rolling deploy khiến code cũ và mới cùng chạy trên một database. Phải thêm cột, ghi cả hai, backfill xong rồi mới đọc cột mới, cuối cùng mới xóa cột cũ; đảo thứ tự làm thiếu dữ liệu hoặc làm code cũ lỗi.'
