- id: P1558
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Thang máy đang đi lên qua nhiều tầng được gọi. Theo LOOK/SCAN, thang làm gì?
  choices:
  - Phục vụ mọi tầng được gọi trên đường đi lên, hết yêu cầu phía trên thì mới đảo chiều
  - Quay xuống ngay khi có một yêu cầu ở tầng thấp hơn
  - Luôn phục vụ yêu cầu đến sớm nhất bất kể chiều
  - Đi tới tầng cao nhất của toà nhà rồi mới dừng
  answer_index: 0
  explanation_md: LOOK/SCAN đi theo một chiều, dừng ở mọi tầng được gọi trên đường, hết yêu cầu theo chiều đó mới đảo chiều (giống xe buýt).
- id: P1559
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Muốn đổi thuật toán chọn tầng kế (SCAN sang nearest-first) mà không sửa class Thang, nên dùng gì?
  choices:
  - Strategy cho bộ điều phối (dispatcher)
  - Singleton cho thang
  - Một chuỗi if/elif lớn trong class Thang
  - Sao chép class Thang cho mỗi thuật toán
  answer_index: 0
  explanation_md: Dispatcher giữ một Strategy chọn tầng kế; thêm thuật toán mới là thêm class, class Thang không đổi.
- id: P1560
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code in ra gì?'
  code: "def tang_ke(hien_tai, huong, yeu_cau):\n    tren = sorted(t for t in yeu_cau if t > hien_tai)\n    duoi = sorted((t for t in yeu_cau if t < hien_tai), reverse=True)\n    if huong == 1:\n        if tren:\n            return tren[0]\n        if duoi:\n            return duoi[0]\n    else:\n        if duoi:\n            return duoi[0]\n        if tren:\n            return tren[0]\n    return hien_tai\n\n\nprint(tang_ke(5, -1, {2, 8, 9}))\nprint(tang_ke(6, 1, {8, 3}))\nprint(tang_ke(6, 1, {1, 3}))\nprint(tang_ke(2, -1, set()))"
  expected_output: "2\n8\n3\n2"
