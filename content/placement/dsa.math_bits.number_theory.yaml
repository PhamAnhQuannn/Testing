- id: P1468
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Để kiểm tra một số n có phải số nguyên tố bằng cách thử chia, ta chỉ cần thử các ước d tới giá trị nào?
  choices:
  - sqrt(n)
  - n / 2
  - n - 1
  - log n
  answer_index: 0
  explanation_md: Ước lớn hơn sqrt(n) luôn đi cặp với một ước nhỏ hơn sqrt(n), nên thử tới sqrt(n) là đủ, chi phí O(sqrt n).
- id: P1469
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "n = 20\nis_p = [True] * n\nis_p[0] = is_p[1] = False\nfor i in range(2, int(n ** 0.5) + 1):\n    if is_p[i]:\n        for j in range(i * i, n, i):\n            is_p[j] = False\nprint([i for i in range(n) if is_p[i]])\nprint(sum(is_p))"
  expected_output: '[2, 3, 5, 7, 11, 13, 17, 19]

    8'
