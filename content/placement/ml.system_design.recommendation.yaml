subtopic_id: ml.system_design.recommendation
items:
- id: P1154
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Kiến trúc recommendation hai tầng (two-stage) điển hình gồm những gì?
  choices:
  - Chỉ một model chấm điểm toàn bộ catalog theo thời gian thực
  - Candidate retrieval (ví dụ two-tower + ANN) lấy vài trăm item, sau đó ranking model chấm điểm kỹ các candidate đó
  - Ranking trước, retrieval sau
  - Chỉ hiển thị item phổ biến nhất cho mọi người dùng
  answer_index: 1
  explanation_md: Catalog quá lớn để chấm điểm hết bằng model nặng, nên retrieval nhanh thu hẹp xuống candidate rồi ranking model chính xác hơn xếp hạng.
