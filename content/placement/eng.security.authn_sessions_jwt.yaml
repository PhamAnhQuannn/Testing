items:
- id: P1888
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - hash-mat-khau-luu-ket-qua-bam-mot-chieu
  prompt_md: Cách lưu mật khẩu nào an toàn nhất?
  choices:
  - Lưu plaintext trong database có phân quyền chặt
  - Băm bằng MD5 một lần
  - Băm bằng SHA-256 một lần, không salt
  - Băm chậm bằng bcrypt hoặc Argon2 với salt riêng cho từng người dùng
  answer_index: 3
  explanation_md: 'Mật khẩu cần hash chậm có salt như bcrypt/Argon2. MD5 và SHA-256 đơn thuần quá nhanh nên dễ bị brute force; plaintext lộ ngay khi database bị lộ.'
- id: P1889
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - jwt-ve-tu-chua-thong-tin-nguoi-dung-va-c
  prompt_md: 'Về JWT chuẩn (signed), phát biểu nào đúng?'
  choices:
  - Payload được mã hóa nên có thể đặt mật khẩu vào đó
  - Payload ai có token cũng đọc được, nên server phải verify chữ ký và exp và không đặt bí mật trong payload
  - Chỉ cần giải mã payload là đủ, không cần verify chữ ký
  - Header alg none là cách an toàn để bỏ qua chữ ký
  answer_index: 1
  explanation_md: 'JWT chỉ được ký, không mã hóa: payload đọc được bằng base64url. Server luôn phải verify chữ ký và exp, cố định thuật toán và từ chối alg none.'
