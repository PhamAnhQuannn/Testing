# Placement-only items (P0 mcq / P1 read_code). Validated by content/schemas/placement.schema.json.
# read_code expected_output = real stdout of `code` (computed by running it, never typed).
subtopic_id: py.core.strings
items:
- id: P900
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Đoạn code `s = "abc"` rồi `s[0] = "x"` cho kết quả nào?
  choices:
  - '`s` trở thành `"xbc"`'
  - '`TypeError`, vì `str` là immutable'
  - '`s` trở thành `"x"`'
  - '`IndexError`'
  answer_index: 1
  explanation_md: 'String trong Python là immutable: không gán lại từng ký tự được, phải tạo string mới.'
- id: P901
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: '`"python"[1:4]` trả về gì?'
  choices:
  - '`"pyt"`'
  - '`"ytho"`'
  - '`"yth"`'
  - '`"tho"`'
  answer_index: 2
  explanation_md: 'Slice `[start:stop]` lấy index từ start đến stop - 1: index 1, 2, 3 là `y`, `t`, `h`.'
- id: P902
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Sau `s = "hi"` và dòng `s.upper()` (không gán lại), giá trị của `s` là gì?
  choices:
  - '`"HI"`'
  - '`None`'
  - Báo lỗi
  - '`"hi"`'
  answer_index: 3
  explanation_md: Method của str trả về string mới và không sửa string gốc; kết quả bị bỏ nếu không gán.
- id: P903
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: 's = "banana"

    print(s.replace("a", "o", 2))

    print(s.find("na"), s.rfind("na"))

    print(s[::-2])

    print("-".join(s[:3]))'
  expected_output: 'bonona

    2 4

    aaa

    b-a-n'
- id: P904
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: 'words = "the quick brown fox".split()

    print(len(words))

    print(words[-1][::-1])

    print(" ".join(w.capitalize() for w in words))

    print("quick" in words, "uic" in words[1])'
  expected_output: '4

    xof

    The Quick Brown Fox

    True True'
