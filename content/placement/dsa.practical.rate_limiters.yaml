- id: P1480
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Vì sao hàm giới hạn tần suất nên nhận thời gian làm tham số (now) thay vì gọi time.time() bên trong?
  choices:
  - Để test được bằng cách truyền các mốc thời gian giả, không cần sleep và kết quả xác định
  - Để thuật toán chạy nhanh hơn O(1)
  - Vì time.time() không dùng được trong Python
  - Để tránh phải lưu các timestamp
  answer_index: 0
  explanation_md: Đồng hồ tiêm được (injectable clock) cho phép test với thời gian giả, nhanh và lặp lại được; không liên quan tới độ phức tạp.
- id: P1481
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "from collections import deque\n\nq = deque()\nout = []\nfor t in (0, 1, 2, 5, 6, 7):\n    while q and q[0] <= t - 5:\n        q.popleft()\n    if len(q) < 2:\n        q.append(t)\n        out.append(1)\n    else:\n        out.append(0)\nprint(out)\nprint(list(q))"
  expected_output: '[1, 1, 0, 1, 1, 0]

    [5, 6]'
