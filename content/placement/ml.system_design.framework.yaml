# Concept-hub placement items (C1 level-1 mcq, C2 level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: ml.system_design.framework
items:
- id: P966
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong khung thiết kế hệ thống ML, bước nào được coi là đòn bẩy cao nhất và làm đầu tiên?
  choices:
  - 'Làm rõ bài toán: biến mục tiêu kinh doanh thành bài toán ML cụ thể và chốt metric, nhãn'
  - Chọn kiến trúc model phức tạp nhất có thể
  - Thiết lập hạ tầng serving và autoscaling
  - Thiết kế dashboard giám sát drift
  answer_index: 0
  explanation_md: Làm rõ (dự đoán gì, cho ai, khi nào, metric, nhãn) quyết định mọi bước sau; các bước kia phụ thuộc vào nó.
- id: P967
  difficulty: 2
  type: mcq
  minutes: 2
  prompt_md: Model xếp hạng đạt AUC rất cao offline nhưng khi tung ra, chỉ số kinh doanh không tăng. Điều tra thì thấy một feature được tính bằng dữ liệu chỉ có sau thời điểm dự đoán. Gap này thuộc bước nào và xử lý ra sao?
  choices:
  - 'Bước serving: thêm máy để giảm độ trễ'
  - 'Bước giám sát: chỉ cần train lại hàng ngày'
  - 'Bước model: thử kiến trúc lớn hơn'
  - 'Bước dữ liệu và feature: đây là leakage; dùng point-in-time feature, tách train/test theo thời gian, rồi xác nhận lại bằng A/B test'
  answer_index: 3
  explanation_md: Feature dùng thông tin tương lai là rò rỉ (leakage), làm offline lạc quan giả. Sửa ở bước dữ liệu bằng point-in-time và split theo thời gian; offline chỉ là điều kiện cần, A/B mới xác nhận.
