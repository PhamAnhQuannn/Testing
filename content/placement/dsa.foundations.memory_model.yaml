subtopic_id: dsa.foundations.memory_model
items:
- id: P1025
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Sau `a = [1, 2]` rồi `b = a`, câu nào đúng về `b`?'
  choices:
  - '`b` là một nhãn thứ hai trỏ tới cùng list với `a`, nên `b.append(3)` làm `a` cũng thấy 3'
  - '`b` là bản sao độc lập của `a`, sửa `b` không ảnh hưởng `a`'
  - '`b` chứa địa chỉ của biến `a`, không phải của list'
  - '`b` chỉ copy các phần tử số nguyên của `a`'
  answer_index: 0
  explanation_md: 'Gán `b = a` không tạo list mới: biến Python là nhãn dán vào đối tượng (reference), nên hai tên cùng trỏ một list (aliasing).'
- id: P1026
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    a = [1, 2, 3]
    b = a
    b.append(4)
    print(a)
    print(a is b)
    c = a[:]
    c.append(5)
    print(a)
    print(c)
    print(a == b, a is c)
  expected_output: |-
    [1, 2, 3, 4]
    True
    [1, 2, 3, 4]
    [1, 2, 3, 4, 5]
    True False
