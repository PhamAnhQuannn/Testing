- id: P1079
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Muốn dedup một mảng bằng cách sort trước rồi quét một lượt, các phần tử trùng sẽ nằm ở đâu và độ phức tạp tổng là bao nhiêu?
  choices:
  - Cạnh nhau; O(n log n) do bước sort
  - Rải rác; O(n)
  - Cạnh nhau; O(n)
  - Rải rác; O(n log n)
  answer_index: 0
  explanation_md: Sau khi sort, các giá trị bằng nhau liền kề nên chỉ cần so với phần tử trước. Chi phí chính là sort O(n log n).
- id: P1080
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    nums = [4, 1, 3, 4, 2, 1, 5]
    s = sorted(nums)
    uniq = []
    for x in s:
        if not uniq or uniq[-1] != x:
            uniq.append(x)
    print(uniq)
    print(sorted(nums, reverse=True)[:3])
    print(sorted(['pear', 'fig', 'apple'], key=len))
  expected_output: |-
    [1, 2, 3, 4, 5]
    [5, 4, 4]
    ['fig', 'pear', 'apple']
