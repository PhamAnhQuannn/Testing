subtopic_id: py.functions.def_args
items:
- id: P1005
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Hàm `def f(x, items=[]): items.append(x); return items` được gọi `f(1)` rồi `f(2)`. Lần gọi thứ hai trả về gì?'
  choices:
  - '`[1, 2]`'
  - '`[2]`'
  - '`[1]`'
  - '`None`'
  answer_index: 0
  explanation_md: 'Giá trị mặc định `[]` chỉ được tạo một lần lúc `def` chạy, nên mọi lần gọi không truyền `items` dùng chung một list. Lần 2 thấy cả 1 và 2.'
- id: P1006
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    def add(item, bag=[]):
        bag.append(item)
        return bag
    print(add(1))
    print(add(2))
    print(add(3, []))
    def info(*args, **kwargs):
        print(len(args), sorted(kwargs))
        return sum(args)
    print(info(1, 2, 3, x=1, y=2))
  expected_output: |-
    [1]
    [1, 2]
    [3]
    3 ['x', 'y']
    6
