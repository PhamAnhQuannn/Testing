subtopic_id: sd.caching.eviction_invalidation
items:
- id: P1231
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Chính sách eviction LRU sẽ loại bỏ mục nào khi cache đầy?"
  choices:
  - "Mục mới được thêm vào gần nhất"
  - "Mục có kích thước nhỏ nhất"
  - "Mục được truy cập nhiều lần nhất"
  - "Mục lâu nhất chưa được truy cập"
  answer_index: 3
  explanation_md: "LRU (Least Recently Used) loại mục lâu chưa dùng nhất, dựa trên giả định locality theo thời gian. LFU mới xét tần suất."
