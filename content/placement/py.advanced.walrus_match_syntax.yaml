subtopic_id: py.advanced.walrus_match_syntax
items:
- id: P1374
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Trong `match`, nhánh `case _:` có vai trò gì?'
  choices:
  - Khớp mọi giá trị còn lại và không gán biến, dùng làm nhánh mặc định đặt cuối
  - Chỉ khớp giá trị `None`
  - Bắt buộc phải có, thiếu thì `SyntaxError`
  - Khớp mọi giá trị và gán vào biến tên `_` để dùng tiếp
  answer_index: 0
  explanation_md: '`_` là wildcard: khớp mọi thứ, không bind. Vì nhánh đầu khớp thắng nên đặt nó cuối làm mặc định; thiếu `_` thì không khớp chỉ là không làm gì.'
- id: P1375
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    vals = [1, 2, 3, 4]
    if (n := len(vals)) > 3:
        print(n)

    def f(v):
        match v:
            case [x, y]:
                return x + y
            case {"a": a}:
                return a
            case 1 | 2:
                return "low"
            case _:
                return "other"

    print(f([3, 4]), f({"a": 9, "b": 1}), f(2), f("ab"))
  expected_output: "4\n7 9 low other"
