subtopic_id: ml.system_design.rag_assistant
items:
- id: P1157
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: RAG (retrieval-augmented generation) giúp trợ lý giảm hallucination bằng cách nào?
  choices:
  - Tăng temperature để model sáng tạo hơn
  - Fine-tune model một lần rồi không cập nhật tri thức nữa
  - Bỏ hẳn bước retrieval để câu trả lời nhanh hơn
  - Truy xuất tài liệu liên quan rồi yêu cầu model trả lời dựa trên ngữ cảnh đó (grounding), kèm trích dẫn nguồn
  answer_index: 3
  explanation_md: 'RAG retrieve-then-generate: đưa bằng chứng thật vào prompt để câu trả lời bám tài liệu (grounded), có thể cập nhật tri thức và trích dẫn nguồn.'
