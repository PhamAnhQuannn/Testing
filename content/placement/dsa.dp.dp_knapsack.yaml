- id: P1436
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Knapsack 0/1 rút về một mảng dp. Vòng lặp sức chứa w phải duyệt theo chiều nào, và vì sao?
  choices:
  - Từ lớn về nhỏ, để mỗi món chỉ được lấy tối đa một lần
  - Từ nhỏ lên lớn, để mỗi món chỉ được lấy tối đa một lần
  - Từ lớn về nhỏ, để cho phép lấy món nhiều lần
  - Chiều nào cũng được
  answer_index: 0
  explanation_md: Duyệt ngược thì dp[w - wt] chưa bị cập nhật bởi món hiện tại nên món không bị tính hai lần. Duyệt xuôi là unbounded knapsack.
