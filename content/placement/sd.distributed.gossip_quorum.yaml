subtopic_id: sd.distributed.gossip_quorum
items:
- id: P1219
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Trong Dynamo-style store với N replica, điều kiện quorum nào đảm bảo read thấy write mới nhất?"
  choices:
  - "R + W < N"
  - "R = 1 và W = 1 với N = 3"
  - "R + W = 1"
  - "R + W > N"
  answer_index: 3
  explanation_md: "R + W > N làm tập replica đọc và tập replica ghi luôn giao nhau nên read gặp ít nhất một replica có giá trị mới. Gossip dùng để lan truyền thông tin membership."
