subtopic_id: py.typing_testing.type_hints
items:
- id: P1376
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Khi chạy `def f(x: int): return x` rồi gọi `f("a")`, điều gì xảy ra?'
  choices:
  - Python chạy bình thường và trả `"a"`; type hint không bị enforce lúc chạy
  - Python ném `TypeError` vì `"a"` không phải `int`
  - Python tự chuyển `"a"` thành `int`
  - Lỗi cú pháp vì annotation sai
  answer_index: 0
  explanation_md: 'CPython chỉ lưu hint trong `__annotations__` mà không kiểm tra. Việc kiểm tra kiểu là của công cụ tĩnh như mypy hoặc pyright.'
- id: P1377
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    from typing import get_type_hints

    def g(a: int, b: list[str]) -> None: ...

    h = get_type_hints(g)
    print(list(h))
    print(h["b"] == list[str], h["return"] is type(None))
    print(g(1, [1]))
  expected_output: "['a', 'b', 'return']\nTrue True\nNone"
