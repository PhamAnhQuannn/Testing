# read_code expected_output = real stdout of `code` (computed by running it, never typed).
subtopic_id: dsa.two_pointers_window.two_pointers
items:
- id: P920
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - hai-dau-tren-mang-da-sap-xep-trai-o-dau
  prompt_md: Kỹ thuật hai con trỏ từ hai đầu (`i` từ trái, `j` từ phải) tìm cặp có
    tổng bằng target thường yêu cầu điều kiện gì?
  choices:
  - Mảng đã được sắp xếp
  - Mảng không có phần tử trùng
  - Mảng có độ dài chẵn
  - Mảng chỉ chứa số dương
  answer_index: 0
  explanation_md: Nhờ mảng đã sắp xếp, tổng quá nhỏ thì tăng `i`, quá lớn thì giảm
    `j`. Không sắp xếp thì cách di chuyển này không đúng.
- id: P921
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - vi-sao-an-toan-moi-lan-nhich-mot-chi-so
  prompt_md: Vì sao hai con trỏ từ hai đầu trên mảng đã sắp xếp chạy O(n)?
  choices:
  - Vì mảng đã sắp xếp nên mọi thao tác là O(1)
  - Mỗi bước dịch chuyển ít nhất một con trỏ và chúng chỉ tiến về phía nhau, tổng
    không quá n bước
  - Vì dùng thêm hash table
  - Vì mỗi con trỏ duyệt lại toàn bộ mảng một lần
  answer_index: 1
  explanation_md: Mỗi vòng lặp luôn tăng `i` hoặc giảm `j`, nên tối đa n-1 vòng.
- id: P922
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Cửa sổ trượt kích thước cố định `k` cập nhật tổng bằng cách nào để đạt
    O(n)?
  choices:
  - Tính lại tổng cả cửa sổ ở mỗi vị trí
  - Cộng phần tử mới vào, trừ phần tử vừa rời cửa sổ
  - Sắp xếp cửa sổ rồi cộng
  - Dùng đệ quy trên từng cửa sổ
  answer_index: 1
  explanation_md: Tính lại tổng mỗi lần là O(n*k). Cộng phần tử vào, trừ phần tử ra
    chỉ O(1) mỗi bước.
- id: P923
  difficulty: 1
  type: read_code
  minutes: 2
  concepts:
  - hai-dau-tren-mang-da-sap-xep-trai-o-dau
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "a = [1, 2, 3, 4, 6, 8]\ni, j = 0, len(a) - 1\nsteps = 0\nwhile i < j:\n \
    \   s = a[i] + a[j]\n    steps += 1\n    if s == 10:\n        break\n    if s\
    \ < 10:\n        i += 1\n    else:\n        j -= 1\nprint(i, j, a[i], a[j], steps)"
  expected_output: 1 5 2 8 2
- id: P924
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "a = [2, 1, 5, 1, 3, 2]\nk = 3\ncur = sum(a[:k])\nbest = cur\nfor r in range(k,\
    \ len(a)):\n    cur += a[r] - a[r - k]\n    best = max(best, cur)\nprint(sum(a[:k]),\
    \ best)\nprint(cur)"
  expected_output: '8 9

    6'
