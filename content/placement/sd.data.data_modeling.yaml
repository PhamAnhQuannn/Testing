subtopic_id: sd.data.data_modeling
items:
- id: P1205
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Với NoSQL (ví dụ DynamoDB, Cassandra), nguyên tắc data modeling nào là đúng?"
  choices:
  - "Chuẩn hoá tối đa rồi JOIN lúc đọc"
  - "Xác định access pattern trước, rồi denormalize dữ liệu để mỗi query đọc từ ít bản ghi nhất"
  - "Tạo một bảng cho mỗi entity và không bao giờ nhân bản dữ liệu"
  - "Chọn schema trước, access pattern tính sau"
  answer_index: 1
  explanation_md: "NoSQL thiết kế schema theo access pattern (query cần chạy) và chấp nhận denormalize/duplicate dữ liệu; không dựa vào JOIN như SQL."
