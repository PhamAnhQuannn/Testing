# Concept-hub placement items (level-1 mcq, level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: eng.data_access.orm_n_plus_one
items:
- id: P1908
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - n-1-problem-lap-qua-100-bai-viet-roi-moi
  prompt_md: Code lặp qua 100 bài viết và mỗi vòng đọc tác giả (lazy loading) làm ORM chạy 101 câu SQL. Đây là vấn đề gì?
  choices:
  - N+1 problem (1 câu lấy N dòng rồi N câu cho dữ liệu liên quan)
  - SQL injection
  - Deadlock giữa các transaction
  - Lỗi cú pháp SQL
  answer_index: 0
  explanation_md: '1 câu lấy 100 bài viết cộng 100 câu lấy tác giả là 101 câu, tức N+1. Cách sửa là JOIN hoặc eager loading.'
- id: P1909
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - lazy-vs-eager-loading-lazy-chi-tai-du-li
  prompt_md: 'Để tránh N+1 khi hiển thị danh sách bài viết kèm tác giả, cách sửa phù hợp nhất là gì?'
  choices:
  - Bỏ ORM và luôn viết raw SQL cho mọi truy vấn
  - Tải tác giả cùng lúc bằng JOIN hoặc eager loading (joinedload, select_related, JOIN FETCH)
  - Tăng RAM của server
  - Gọi save() từng object trong vòng lặp
  answer_index: 1
  explanation_md: 'Eager loading hoặc JOIN lấy dữ liệu liên quan trong một hoặc vài câu thay vì N câu. Không cần bỏ ORM, và chỉ nên eager-load quan hệ thật sự dùng đến.'
