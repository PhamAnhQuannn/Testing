subtopic_id: py.functions.sorting_keys
items:
- id: P1013
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: '`sorted(["bb", "a", "ccc"], key=len, reverse=True)` trả về gì?'
  choices:
  - '`[''ccc'', ''bb'', ''a'']`'
  - '`[''a'', ''bb'', ''ccc'']`'
  - '`[''a'', ''ccc'', ''bb'']`'
  - '`[3, 2, 1]`'
  answer_index: 0
  explanation_md: '`key=len` xếp theo độ dài, `reverse=True` đảo thành giảm dần: ccc (3), bb (2), a (1). Kết quả vẫn là các chuỗi gốc, không phải độ dài.'
- id: P1014
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    words = ["bb", "a", "ccc", "dd", "e"]
    print(sorted(words))
    print(sorted(words, key=len))
    print(sorted(words, key=len, reverse=True))
    data = [3, 1, 2]
    r = sorted(data)
    print(data, r)
    print(data.sort())
    print(data)
    pairs = [("an", 3), ("binh", 1), ("chi", 3)]
    print(sorted(pairs, key=lambda p: (-p[1], p[0])))
  expected_output: |-
    ['a', 'bb', 'ccc', 'dd', 'e']
    ['a', 'e', 'bb', 'dd', 'ccc']
    ['ccc', 'bb', 'dd', 'a', 'e']
    [3, 1, 2] [1, 2, 3]
    None
    [1, 2, 3]
    [('an', 3), ('chi', 3), ('binh', 1)]
