# Placement-only items (P0 mcq / P1 read_code). Validated by content/schemas/placement.schema.json.
# read_code expected_output = real stdout of `code` (computed by running it, never typed).
subtopic_id: dsa.arrays_strings.hash_tables
items:
- id: P915
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Độ phức tạp thời gian trung bình của việc kiểm tra `x in s` với `s` là
    `set` là gì?
  choices:
  - O(n)
  - O(log n)
  - O(1)
  - O(n log n)
  answer_index: 2
  explanation_md: '`set` dùng hash table: thêm, xóa, kiểm tra tồn tại đều O(1) trung
    bình.'
- id: P916
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Khi nhiều key khác nhau cho cùng một giá trị hash (collision), điều nào
    đúng?
  choices:
  - Hash table bị lỗi và ném exception
  - Key sau ghi đè key trước
  - Hash table vẫn đúng nhờ so sánh key, nhưng thao tác có thể chậm đi
  - Các key bị loại bỏ khỏi bảng
  answer_index: 2
  explanation_md: Collision được xử lý (chaining/open addressing); kết quả vẫn đúng,
    chỉ chậm hơn. Nếu mọi key đụng nhau, thao tác tệ nhất là O(n).
- id: P917
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Bài toán nào cần `dict` thay vì `set`?
  choices:
  - Kiểm tra mảng có phần tử trùng không
  - Đếm số lần mỗi phần tử xuất hiện
  - Loại phần tử trùng khỏi mảng
  - Kiểm tra một phần tử có trong tập không
  answer_index: 1
  explanation_md: Đếm tần suất cần lưu giá trị (số lần) cho mỗi key, nên cần `dict`;
    `set` chỉ lưu sự tồn tại.
- id: P918
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "nums = [2, 7, 11, 7, 2]\nseen = set()\ndups = []\nfor n in nums:\n    if\
    \ n in seen:\n        dups.append(n)\n    seen.add(n)\nprint(dups)\nprint(sorted(seen),\
    \ len(seen))\nprint(7 in seen, 8 in seen)"
  expected_output: '[7, 2]

    [2, 7, 11] 3

    True False'
- id: P919
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "nums = [3, 1, 4, 1, 5]\ntarget = 6\nidx = {}\nfor i, n in enumerate(nums):\n\
    \    need = target - n\n    if need in idx:\n        print(idx[need], i)\n   \
    \ idx[n] = i\nprint(idx)"
  expected_output: '3 4

    {3: 0, 1: 3, 4: 2, 5: 4}'
