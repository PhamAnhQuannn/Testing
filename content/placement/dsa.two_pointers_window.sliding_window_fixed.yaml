items:
- id: P1386
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Với cửa sổ trượt kích thước cố định `k`, khi trượt sang phải một ô thì
    tổng được cập nhật thế nào (với `i` là chỉ số phần tử mới vào)?
  choices:
  - Cộng `nums[i]` và trừ `nums[i - k]`
  - Cộng `nums[i]` và trừ `nums[i - k + 1]`
  - Tính lại `sum(nums[i - k + 1:i + 1])` ở mỗi bước
  - Cộng `nums[i - k]` và trừ `nums[i]`
  answer_index: 0
  explanation_md: Cửa sổ cũ là `nums[i-k:i]`, cửa sổ mới là `nums[i-k+1:i+1]`. Phần
    tử vào là `nums[i]`, phần tử ra là `nums[i - k]`, nên mỗi bước chỉ O(1) và tổng
    O(n).
- id: P1387
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "a = [3, -1, 4, 1, -5, 9]\nk = 3\ncur = sum(a[:k])\nbest = cur\nfor r in range(k,\
    \ len(a)):\n    cur += a[r] - a[r - k]\n    best = max(best, cur)\nprint(best, cur)"
  expected_output: 6 5
