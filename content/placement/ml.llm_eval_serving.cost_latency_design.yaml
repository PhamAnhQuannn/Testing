subtopic_id: ml.llm_eval_serving.cost_latency_design
items:
- id: P1137
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Để ước lượng số GPU cần cho một dịch vụ LLM, bước tính hợp lý nhất là gì?
  choices:
  - Lấy số người dùng chia cho số GPU của đối thủ
  - Chỉ nhìn giá GPU rẻ nhất
  - Tính token/s cần sinh (QPS x token mỗi request), chia cho token/s của một GPU, làm tròn lên
  - Lấy QPS nhân với số tham số model
  answer_index: 2
  explanation_md: Capacity = tổng token/s cần chia cho token/s mỗi GPU, làm tròn lên; sau đó nhân giá giờ GPU để ra chi phí.
- id: P1138
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    import math

    qps = 150
    tokens_per_req = 400
    gpu_tps = 2200
    need = qps * tokens_per_req
    gpus = math.ceil(need / gpu_tps)
    print(need)
    print(gpus)
    print(gpus * 2 * 24 * 30)
  expected_output: |-
    60000
    28
    40320
