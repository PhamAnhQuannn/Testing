subtopic_id: dsa.stack_queue.stack_problems
items:
- id: P1047
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Bài toán kiểm tra ngoặc hợp lệ (valid parentheses): khi gặp một ngoặc đóng `)`, ta làm gì với stack?'
  choices:
  - 'Pop ngoặc mở trên đỉnh stack và kiểm tra nó khớp với `)`'
  - 'Push `)` vào stack'
  - 'Xoá toàn bộ stack'
  - 'Chỉ đếm số ngoặc đóng'
  answer_index: 0
  explanation_md: 'Ngoặc mở gần nhất chưa đóng nằm trên đỉnh stack (LIFO), nên ngoặc đóng phải khớp với nó; nếu stack rỗng hoặc không khớp thì chuỗi không hợp lệ.'
- id: P1048
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    def reduce(s):
        st = []
        for ch in s:
            if st and st[-1] == ch:
                st.pop()
            else:
                st.append(ch)
        return "".join(st)

    print(reduce("abbaca"))
    print(reduce("aab"))
    print(len(reduce("abba")))
  expected_output: |-
    ca
    b
    0
