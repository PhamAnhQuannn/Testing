subtopic_id: sd.distributed.distributed_transactions
items:
- id: P1216
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "So sánh two-phase commit (2PC) và saga cho giao dịch trải nhiều service, điều nào đúng?"
  choices:
  - "2PC không bao giờ bị blocking khi coordinator chết"
  - "Saga đảm bảo isolation ACID đầy đủ như một transaction duy nhất"
  - "Saga cần coordinator giữ lock trên mọi service"
  - "2PC có thể blocking khi coordinator lỗi; saga dùng compensating transaction để hoàn tác"
  answer_index: 3
  explanation_md: "2PC giữ lock và có thể blocking nếu coordinator chết; saga chia thành các local transaction và dùng compensating action để hoàn tác, đổi lại chỉ eventual consistency."
