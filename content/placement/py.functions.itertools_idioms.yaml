  prompt_md: '`list(combinations([1, 2, 3], 2))` có bao nhiêu phần tử?'
  choices:
  - '3'
  - '6'
  - '9'
  - '2'
  answer_index: 0
  explanation_md: '`combinations` không phân biệt thứ tự: C(3,2) = 3 cặp `(1,2)`, `(1,3)`, `(2,3)`. `permutations` mới cho 6.'
