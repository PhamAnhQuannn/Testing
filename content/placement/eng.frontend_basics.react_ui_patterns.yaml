subtopic_id: eng.frontend_basics.react_ui_patterns
items:
- id: P1928
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - lay-du-lieu-4-trang-thai-dung-usestate-g
  prompt_md: Khi component React lấy dữ liệu từ API, UI nên xử lý những trạng thái nào?
  choices:
  - Chỉ success, vì các trường hợp khác hiếm gặp
  - Loading, error, empty và success
  - Chỉ loading và success
  - Chỉ error, còn lại để React tự xử lý
  answer_index: 1
  explanation_md: 'Người dùng cần thấy đang tải, đã lỗi hay không có dữ liệu (empty), chứ không chỉ trường hợp thành công.'
- id: P1929
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - race-condition-trong-effect-phan-hoi-cu
  prompt_md: 'Ô tìm kiếm gọi API trong useEffect mỗi khi query đổi; người dùng gõ nhanh và đôi khi kết quả cũ hiện đè kết quả mới. Cách sửa đúng là gì?'
  choices:
  - Thêm key ngẫu nhiên cho từng kết quả
  - Lưu kết quả vào một state thứ hai để đồng bộ
  - Dùng cleanup trong useEffect (cờ ignore hoặc AbortController) để bỏ phản hồi cũ
  - Tăng thời gian timeout của request
  answer_index: 2
  explanation_md: 'Phản hồi cũ có thể về sau phản hồi mới. Cleanup khi query đổi giúp bỏ kết quả của lần gọi trước, chỉ nhận lần mới nhất.'
