- id: P1466
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Browser History dùng list các trang và chỉ số hiện tại. Sau back rồi visit(url) mới, nên làm gì với các trang đứng sau trang hiện tại?
  choices:
  - Xoá chúng (lịch sử tiến không còn hợp lệ)
  - Giữ nguyên để forward vẫn dùng được
  - Chuyển chúng sang đầu danh sách
  - Chỉ xoá trang ngay sau trang hiện tại
  answer_index: 0
  explanation_md: Mở trang mới từ trang hiện tại làm lịch sử tiến cũ mất hiệu lực, nên visit phải cắt mọi trang sau con trỏ.
- id: P1467
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "last = {}\n\ndef ok(ts, m):\n    if m in last and ts < last[m] + 10:\n        return False\n    last[m] = ts\n    return True\n\nprint(ok(0, 'a'), ok(9, 'a'), ok(10, 'a'))\nprint(last)"
  expected_output: "True False True\n{'a': 10}"
