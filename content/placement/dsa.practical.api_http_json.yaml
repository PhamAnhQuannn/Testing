items:
- id: P1484
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Server trả status 503 khi bạn gọi API. Cách xử lý hợp lý nhất là gì?
  choices:
  - Thử lại sau một khoảng chờ tăng dần (exponential backoff)
  - Không bao giờ thử lại vì đây là lỗi của client
  - Đổi method từ GET sang POST rồi gửi lại ngay
  - Coi như thành công vì mã bắt đầu bằng 5
  answer_index: 0
  explanation_md: 5xx là lỗi phía server và thường tạm thời, nên retry với backoff; request nên idempotent để gọi lại an toàn.
- id: P1485
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "parts = \"/a/b/\".split(\"/\")\nprint(parts)\nprint(\"x=1=2\".partition(\"=\"))\nprint(\"flag\".partition(\"=\"))"
  expected_output: "['', 'a', 'b', '']\n('x', '=', '1=2')\n('flag', '', '')"
