items:
- id: P1030
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Một hàm đệ quy (recursion) thiếu base case thì điều gì xảy ra trong Python?'
  choices:
  - 'Gọi lại mãi cho tới khi báo `RecursionError`'
  - 'Tự trả về `None` ngay lần gọi đầu'
  - 'Python tự thêm base case'
  - 'Chạy bình thường như vòng lặp vô hạn, không báo lỗi'
  answer_index: 0
  explanation_md: 'Không có điểm dừng thì call stack tăng mãi; Python giới hạn khoảng 1000 tầng nên báo `RecursionError`.'
- id: P1031
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    def fact(n):
        if n == 0:
            return 1
        return n * fact(n - 1)

    def total(a):
        if not a:
            return 0
        return a[0] + total(a[1:])

    print(fact(0))
    print(fact(4))
    print(total([1, 2, 3]))
  expected_output: |-
    1
    24
    6
