subtopic_id: ml.rag_agents.vector_indexes
items:
- id: P1107
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Chỉ mục ANN (Approximate Nearest Neighbor) như HNSW hoặc IVF đánh đổi điều gì so với tìm kiếm brute-force chính xác?
  choices:
  - Chấp nhận có thể bỏ sót vài láng giềng gần nhất thật (recall thấp hơn một chút) để tìm nhanh hơn nhiều trên kho lớn
  - Cho kết quả luôn chính xác tuyệt đối nhưng tốn thêm bộ nhớ
  - Không cần embedding, chỉ so khớp từ khóa
  - Chỉ chạy được khi kho có dưới 100 vector
  answer_index: 0
  explanation_md: ANN là xấp xỉ, đổi một chút recall lấy tốc độ (và bộ nhớ tùy loại index). Brute-force mới là chính xác nhưng chậm khi kho lớn.
- id: P1108
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    import math

    q = [1, 0]
    docs = {"a": [1, 1], "b": [0, 1], "c": [3, 1]}

    def cos(u, v):
        dot = sum(x * y for x, y in zip(u, v))
        return dot / (math.hypot(*u) * math.hypot(*v))

    best = max(docs, key=lambda k: cos(q, docs[k]))
    print(best)
    print(round(cos(q, docs[best]), 2))
  expected_output: |-
    c
    0.95
