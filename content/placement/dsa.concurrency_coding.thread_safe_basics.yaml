subtopic_id: dsa.concurrency_coding.thread_safe_basics
items:
- id: P1504
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Race condition là gì?
  choices:
  - Kết quả phụ thuộc thứ tự xen kẽ của nhiều thread truy cập chung dữ liệu mà không đồng bộ
  - Hai thread chờ nhau mãi mãi
  - Một thread chạy quá chậm
  - Chương trình dùng quá nhiều bộ nhớ
  answer_index: 0
  explanation_md: Race condition xảy ra khi đúng/sai của kết quả phụ thuộc thứ tự xen kẽ các thread trên dữ liệu chung. Hai thread chờ nhau mãi là deadlock.
- id: P1505
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Vì sao `counter += 1` không an toàn khi nhiều thread cùng chạy?
  choices:
  - Nó gồm ba bước đọc, cộng, ghi nên có thể bị xen giữa các bước
  - Phép cộng trong Python luôn sai
  - Biến counter không thể là số nguyên
  - Python cấm hai thread cùng đọc một biến
  answer_index: 0
  explanation_md: '`counter += 1` là read-modify-write, không atomic. Nếu hai thread cùng đọc giá trị cũ thì một lần tăng bị mất (lost update).'
- id: P1506
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code mô phỏng hai thread xen kẽ in ra gì?'
  code: "counter = 5\na = counter\nb = counter\ncounter = a + 1\ncounter = b + 1\nprint(counter)"
  expected_output: '6'
