subtopic_id: eng.devops_cloud.cicd
items:
- id: P1896
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - pipeline-chuoi-buoc-build-test-dong-goi
  prompt_md: Trong một pipeline CI/CD gồm build, test, package, deploy, bước test bị fail. Điều đúng là gì?
  choices:
  - Pipeline dừng, các bước sau không chạy nên code lỗi không ra production
  - Pipeline bỏ qua lỗi và vẫn deploy
  - Pipeline tự sửa code rồi chạy lại
  - Chỉ bước deploy bị bỏ, còn package vẫn đưa lên production
  answer_index: 0
  explanation_md: 'Pipeline chạy nối tiếp và một bước fail thì dừng, nên code lỗi không đi tiếp tới production. Pipeline không tự sửa code.'
- id: P1897
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - canary-va-feature-flag-canary-cho-mot-it
  prompt_md: 'Team muốn cho một phần nhỏ người dùng thử bản mới, theo dõi tỉ lệ lỗi rồi mới tăng dần. Chiến lược phát hành nào phù hợp?'
  choices:
  - Canary
  - Chuyển tất cả server sang bản mới cùng lúc
  - Chỉ cần lưu cache của pipeline
  - Đặt secret thẳng vào file YAML
  answer_index: 0
  explanation_md: 'Canary cho một ít người dùng dùng bản mới trước và tăng dần nếu chỉ số tốt. Thay tất cả cùng lúc không có bước thử nhỏ; cache và secret không liên quan đến cách phát hành.'
