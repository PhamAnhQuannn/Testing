subtopic_id: eng.frontend_basics.react_basics
items:
- id: P1926
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - state-va-hook-usestate-state-la-du-lieu
  prompt_md: 'Với `const [dem, setDem] = useState(0)`, cách đúng để tăng `dem` lên 1 là gì?'
  choices:
  - Gọi setDem(dem + 1) để React render lại
  - Gán trực tiếp dem = dem + 1
  - Sửa props do component cha truyền xuống
  - Gọi lại useState(1) trong event handler
  answer_index: 0
  explanation_md: 'State chỉ đổi qua hàm cập nhật (setDem); khi đó React render lại component. Gán thẳng không báo cho React, còn props là read-only.'
- id: P1927
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - render-moi-khi-state-hoac-props-doi-reac
  prompt_md: 'Một danh sách todo có thể thêm, xóa và sắp xếp lại. Khi render bằng .map, chọn key cho mỗi phần tử thế nào là phù hợp nhất?'
  choices:
  - Dùng index trong mảng làm key
  - Dùng số ngẫu nhiên tạo mới ở mỗi lần render
  - Không cần key vì React tự đoán đúng
  - Dùng id ổn định, duy nhất của mỗi todo
  answer_index: 3
  explanation_md: 'Key phải ổn định và duy nhất, thường là id dữ liệu. Index đổi khi thêm/xóa/sắp xếp nên dễ gán nhầm state; số ngẫu nhiên mỗi lần render khiến React tạo lại phần tử.'
