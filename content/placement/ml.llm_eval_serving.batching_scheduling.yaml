subtopic_id: ml.llm_eval_serving.batching_scheduling
items:
- id: P1132
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Continuous batching khác static batching ở điểm nào?
  choices:
  - Nó luôn đợi đủ batch rồi mới chạy
  - Nó bắt mọi request trong batch kết thúc cùng lúc
  - Request mới được nhét vào ngay khi có chỗ trống, request xong thì rời batch, nên GPU ít nhàn rỗi
  - Nó chỉ chạy được một request mỗi lần
  answer_index: 2
  explanation_md: 'Continuous batching lập lịch ở mức từng bước decode: request xong rời đi, request mới vào ngay, tăng throughput.'
- id: P1133
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    batch = 8
    step_latency = 0.25
    steps = 40
    total = steps * step_latency
    print(total)
    print(batch / total)
  expected_output: |-
    10.0
    0.8
