- id: P1470
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Với số nguyên n > 0, biểu thức n & (n - 1) cho kết quả nào?
  choices:
  - n sau khi xoá bit 1 thấp nhất
  - n sau khi bật bit 0 thấp nhất
  - n sau khi đảo toàn bộ các bit
  - Luôn bằng 0
  answer_index: 0
  explanation_md: Trừ 1 làm bit 1 thấp nhất thành 0 và các bit thấp hơn thành 1; AND với n xoá đúng bit 1 thấp nhất đó.
