subtopic_id: sd.caching.distributed_cache
items:
- id: P1233
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Dùng cache cluster (Redis/Memcached) cho dữ liệu lớn hơn bộ nhớ một node, bạn làm gì để mở rộng và tăng availability?"
  choices:
  - "Chỉ tăng RAM của một node duy nhất"
  - "Lưu mọi key trên mọi node mà không chia"
  - "Sharding key qua nhiều node (consistent hashing) và dùng replication cho mỗi shard"
  - "Bỏ cache và đọc thẳng từ disk"
  answer_index: 2
  explanation_md: "Sharding chia dữ liệu để scale dung lượng và throughput; replication cho failover. Consistent hashing giảm xáo trộn khi thêm/bớt node."
