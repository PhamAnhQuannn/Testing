subtopic_id: ml.llm.alignment_rlhf_dpo
items:
- id: P1088
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Mục tiêu chính của RLHF/DPO sau pretraining là gì?'
  choices:
  - 'Cho model học thêm kiến thức mới từ internet'
  - 'Nén model nhỏ lại để chạy nhanh hơn'
  - 'Tăng context window của model'
  - 'Điều chỉnh model theo preference của con người để hữu ích và an toàn hơn'
  answer_index: 3
  explanation_md: 'Alignment dùng preference của con người (response nào tốt hơn) để model hữu ích, trung thực và an toàn hơn; DPO tối ưu trực tiếp trên cặp preference, không cần reward model riêng.'
