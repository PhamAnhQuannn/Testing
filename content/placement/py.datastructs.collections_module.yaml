subtopic_id: py.datastructs.collections_module
items:
- id: P989
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: '`Counter("abca")["a"]` và `Counter("abca")["z"]` lần lượt trả về gì?'
  choices:
  - '`2` và `0`'
  - '`2` và `KeyError`'
  - '`1` và `0`'
  - '`2` và `None`'
  answer_index: 0
  explanation_md: 'Counter đếm số lần xuất hiện: `a` xuất hiện 2 lần; key không có thì trả về 0 (không raise `KeyError`).'
- id: P990
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    from collections import Counter, defaultdict, deque

    c = Counter("banana")
    print(sorted(c.items()))
    print(c.most_common(1))
    dd = defaultdict(list)
    for k, v in [("a", 1), ("b", 2), ("a", 3)]:
        dd[k].append(v)
    print(sorted(dd.items()))
    q = deque([1, 2, 3])
    q.appendleft(0)
    q.append(4)
    print(q.popleft(), q.pop(), list(q))
  expected_output: |-
    [('a', 3), ('b', 1), ('n', 2)]
    [('a', 3)]
    [('a', [1, 3]), ('b', [2])]
    0 4 [1, 2, 3]
