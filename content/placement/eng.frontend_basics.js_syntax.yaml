items:
- id: P1918
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - bien-let-va-const-thay-cho-var-cu-vi-du
  prompt_md: 'Trong JavaScript hiện đại, khai báo nào tạo ra biến KHÔNG được gán lại?'
  choices:
  - const ten = "An";
  - let ten = "An";
  - var ten = "An";
  - typeof ten = "An";
  answer_index: 0
  explanation_md: '`const` khai báo biến không gán lại được; `let` và `var` cho phép gán lại. `typeof` là toán tử đọc kiểu, không dùng để khai báo.'
- id: P1919
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - so-sanh-dung-thay-cho-5-5-la-false
  prompt_md: 'Kết quả của `5 === "5"` và `5 == "5"` trong JavaScript lần lượt là gì?'
  choices:
  - 'true và true'
  - 'false và true'
  - 'true và false'
  - 'false và false'
  answer_index: 1
  explanation_md: '`===` so sánh cả kiểu và không ép kiểu nên số 5 khác chuỗi "5" (false). `==` ép kiểu nên 5 == "5" là true. Vì vậy nên dùng `===`.'
