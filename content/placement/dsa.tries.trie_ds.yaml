  explanation_md: Đường a-p-p tồn tại nên starts_with("app") đúng; search("app") sai vì node p cuối chưa có cờ kết thúc từ.
- id: P1451
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "trie = {}\nfor w in [\"to\", \"tea\", \"ten\"]:\n    node = trie\n    for ch in w:\n        node = node.setdefault(ch, {})\n    node[\"$\"] = True\n\ndef count_nodes(n):\n    return 1 + sum(count_nodes(v) for k, v in n.items() if k != \"$\")\n\nprint(count_nodes(trie) - 1)\nprint(sorted(trie[\"t\"]))\nprint(\"$\" in trie[\"t\"][\"e\"], \"$\" in trie[\"t\"][\"e\"][\"a\"])"
  expected_output: "5\n['e', 'o']\nFalse True"
