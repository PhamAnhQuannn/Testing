subtopic_id: dsa.stack_queue.parsing_strings
items:
- id: P1049
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Khi parse biểu thức bằng stack, vì sao chuỗi `"([)]"` không hợp lệ dù mỗi loại ngoặc đều có đủ cặp?'
  choices:
  - 'Vì các cặp ngoặc phải lồng nhau đúng thứ tự: `)` gặp `[` trên đỉnh stack nên không khớp'
  - 'Vì chuỗi có độ dài chẵn'
  - 'Vì không có chữ cái nào trong chuỗi'
  - 'Vì stack luôn phải rỗng ở giữa chuỗi'
  answer_index: 0
  explanation_md: 'Khi gặp `)`, đỉnh stack là `[` chứ không phải `(`, nên ngoặc không lồng đúng thứ tự và chuỗi không hợp lệ.'
- id: P1050
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    def balanced(s):
        pairs = {")": "(", "]": "[", "}": "{"}
        st = []
        for ch in s:
            if ch in "([{":
                st.append(ch)
            elif ch in pairs:
                if not st or st.pop() != pairs[ch]:
                    return False
        return not st

    print(balanced("{[]}"))
    print(balanced("([)]"))
    print(balanced("(("))
  expected_output: |-
    True
    False
    False
