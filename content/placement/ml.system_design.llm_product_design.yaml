subtopic_id: ml.system_design.llm_product_design
items:
- id: P1158
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Khi thiết kế sản phẩm dùng LLM, trade-off cơ bản nào cần cân nhắc?
  choices:
  - Chất lượng câu trả lời không liên quan tới chi phí hay độ trễ
  - Chất lượng, độ trễ, chi phí (token) và an toàn (guardrails) đánh đổi nhau; ví dụ model lớn hơn tốt hơn nhưng chậm và đắt hơn
  - Luôn chọn model lớn nhất cho mọi request
  - Guardrails không cần thiết nếu prompt đủ tốt
  answer_index: 1
  explanation_md: Quyết định cốt lõi là cân bằng quality/latency/cost/safety, ví dụ route request dễ sang model nhỏ, dùng streaming, caching và guardrails.
