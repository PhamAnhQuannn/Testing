- id: P1388
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Cửa sổ trượt kích thước thay đổi (`l`, `r`) thường được duy trì theo quy tắc nào?
  choices:
  - Cố định độ dài cửa sổ, chỉ trượt cả hai con trỏ cùng lúc
  - Mở rộng `r` từng bước, thu hẹp `l` trong khi điều kiện (bất biến) còn bị vi phạm
  - Sắp xếp mảng rồi dùng hai con trỏ từ hai đầu
  - Thử mọi cặp (l, r) và chọn cặp tốt nhất
  answer_index: 1
  explanation_md: Mỗi bước `r` tiến thêm một phần tử, sau đó `l` tiến cho tới khi cửa sổ hợp lệ trở lại. Cả hai con trỏ chỉ đi tới nên tổng thời gian O(n).
- id: P1389
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    nums = [2, 3, 1, 2, 4, 3]
    target = 7
    l = total = 0
    best = len(nums) + 1
    for r, x in enumerate(nums):
        total += x
        while total >= target:
            best = min(best, r - l + 1)
            total -= nums[l]
            l += 1
    print(best, l, total)
  expected_output: 2 5 3
