items:
- id: P1588
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Đạo hàm của f(x) = x² tại x = 3 là bao nhiêu?
  choices:
  - '6'
  - '9'
  - '3'
  - '2'
  answer_index: 0
  explanation_md: (x²)' = 2x, tại x = 3 là 6. Đó là độ dốc của đường cong tại điểm đó.
- id: P1589
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Với L = (w·x − y)², đạo hàm ∂L/∂w bằng gì?
  choices:
  - 2(w·x − y)·x
  - 2(w·x − y)
  - (w·x − y)·x
  - 2w·x
  answer_index: 0
  explanation_md: Quy tắc chuỗi, đặt e = w·x − y thì L = e², ∂L/∂e = 2e và ∂e/∂w = x, nhân lại được 2(w·x − y)·x.
- id: P1590
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code in ra gì?'
  code: "def f(x):\n    return x ** 2\n\nh = 1e-5\nprint(round((f(3 + h) - f(3 - h)) / (2 * h), 3))"
  expected_output: "6.0"
