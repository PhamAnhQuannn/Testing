items:
- id: P1561
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Cách chặn đặt trùng (double-booking) đơn giản nhất cho một ghế là gì?
  choices:
  - Kiểm tra ghế còn trống rồi mới đánh dấu đã đặt
  - Đánh dấu đã đặt trước rồi mới kiểm tra
  - Cho phép đặt hai lần rồi xóa một lần sau
  - Chỉ in cảnh báo khi ghế bị đặt lại
  answer_index: 0
  explanation_md: Phải kiểm tra trống trước, nếu đã đặt thì từ chối (trả False); chỉ khi trống mới đánh dấu đã đặt.
- id: P1562
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Thứ tự trạng thái hợp lệ của một lượt đặt vé là gì?
  choices:
  - held -> paid -> used, hoặc hủy (cancelled) khi còn held hoặc paid
  - used -> held -> paid
  - paid -> held -> cancelled -> used
  - cancelled -> paid -> held
  answer_index: 0
  explanation_md: Lượt đặt bắt đầu ở held (đang giữ), thanh toán thì thành paid, dùng thì thành used; có thể hủy khi còn held hoặc paid.
- id: P1563
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code in ra gì?'
  code: "seats = {\"a\": False}\n\ndef book(s):\n    if seats.get(s) is not False:\n        return False\n    seats[s] = True\n    return True\n\nprint(book(\"a\"), book(\"a\"), book(\"b\"))"
  expected_output: "True False False"
