subtopic_id: ml.system_design.multimodal_retrieval
items:
- id: P1156
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Ý tưởng cốt lõi của multimodal retrieval (ví dụ tìm ảnh bằng văn bản) là gì?
  choices:
  - Học embedding chung (joint embedding space) để văn bản và ảnh gần nhau khi cùng ngữ nghĩa, rồi tìm láng giềng gần nhất (ANN)
  - Chuyển mọi ảnh thành tên file rồi khớp từ khóa
  - Lưu ảnh và văn bản ở hai chỉ mục tách biệt, không thể so sánh với nhau
  - Chỉ dùng so khớp pixel giữa truy vấn và ảnh
  answer_index: 0
  explanation_md: Mô hình như CLIP ánh xạ các modality vào cùng không gian vector, nên truy vấn văn bản có thể tìm ảnh bằng độ tương đồng vector và ANN.
