subtopic_id: sd.archetypes.metrics_logging
items:
- id: P1163
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Hệ thống metrics/logging nhận hàng triệu sự kiện mỗi giây. Cách nào hợp lý để lưu và truy vấn?"
  choices:
  - "Lưu mọi log thô vĩnh viễn trong một bảng RDBMS"
  - "Chỉ lưu bản mới nhất, bỏ lịch sử"
  - "Gửi trực tiếp từng sự kiện đồng bộ vào database của dịch vụ chính"
  - "Ghi vào time-series store, aggregate/downsample theo thời gian, sampling log và đặt retention"
  answer_index: 3
  explanation_md: "Time-series store cùng aggregation, downsampling, sampling và retention giữ chi phí và độ trễ truy vấn thấp. Lưu thô mọi thứ hoặc ghi đồng bộ vào DB chính sẽ quá tải."
