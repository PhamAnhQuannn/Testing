subtopic_id: ml.llm_eval_serving.inference_fundamentals
items:
- id: P1130
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong inference LLM, prefill và decode khác nhau thế nào?
  choices:
  - Prefill đọc cả prompt song song một lượt; decode sinh từng token một, mỗi bước dùng lại KV cache
  - Prefill sinh từng token một; decode đọc cả prompt một lượt
  - Cả hai đều xử lý từng token một và không dùng KV cache
  - Prefill là bước huấn luyện, decode là bước đánh giá
  answer_index: 0
  explanation_md: Prefill xử lý toàn bộ prompt song song (quyết định TTFT); decode tuần tự từng token và dùng KV cache để khỏi tính lại token cũ.
- id: P1131
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    layers = 32
    kv_heads = 8
    head_dim = 128
    tokens = 4096
    bytes_per_elt = 2
    kv = 2 * layers * kv_heads * head_dim * tokens * bytes_per_elt
    print(kv)
    print(kv / 2**30)
  expected_output: |-
    536870912
    0.5
