subtopic_id: sd.archetypes.notification_system
items:
- id: P1169
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Notification system gửi qua push/email/SMS và nhà cung cấp đôi khi lỗi. Thiết kế nào đúng?"
  choices:
  - "Gọi provider đồng bộ trong request của user, lỗi thì bỏ"
  - "Gửi cùng thông báo trên mọi kênh mỗi lần retry"
  - "Lưu thông báo trong RAM của một server duy nhất"
  - "Queue theo kênh, worker retry với backoff, và idempotency key để dedup tránh gửi trùng"
  answer_index: 3
  explanation_md: "Message queue tách producer khỏi delivery; retry kèm backoff tăng độ tin cậy, idempotency key chống gửi trùng khi retry."
