# Concept-hub placement items (level-1 mcq, level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: eng.architecture.monolith_microservices
items:
- id: P1914
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - cai-gia-cua-viec-tach-goi-qua-mang-thi-c
  prompt_md: Một đội nhỏ chuẩn bị làm sản phẩm mới. Nhận định nào về monolith và microservices là hợp lý nhất?
  choices:
  - Nên bắt đầu bằng monolith và chỉ tách thành microservices khi có lý do rõ (đội lớn, scale riêng, deploy độc lập)
  - Luôn nên dùng microservices ngay từ đầu để sau này dễ mở rộng
  - Microservices dễ debug hơn monolith vì mỗi service nhỏ, nên tách sớm có lợi
  - Monolith không mở rộng (scale) được nên chỉ hợp với dự án nhỏ
  answer_index: 0
  explanation_md: 'Tách sớm thêm chi phí mạng và vận hành khi chưa có lợi ích tương ứng. Monolith (hoặc modular monolith) là điểm xuất phát hợp lý; chỉ tách khi có yêu cầu rõ.'
- id: P1915
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - dat-hang-tru-kho-qua-hai-service-hai-dat
  prompt_md: 'Service đơn hàng và service kho có database riêng. Tạo đơn thành công nhưng trừ kho thất bại. Cách xử lý phù hợp nhất?'
  choices:
  - JOIN hai database rồi rollback bằng một transaction chung
  - Dùng saga, thử lại bước trừ kho hoặc chạy bước bù (hủy đơn), chấp nhận eventual consistency
  - Cho service đơn hàng ghi thẳng vào database của service kho
  - Bỏ qua vì microservices luôn tự đồng bộ dữ liệu
  answer_index: 1
  explanation_md: 'Mỗi service sở hữu database riêng nên không có JOIN hay transaction chung. Saga chia thao tác thành chuỗi bước kèm bước bù; dữ liệu nhất quán dần chứ không tức thì.'
