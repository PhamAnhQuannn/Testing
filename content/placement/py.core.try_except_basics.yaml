subtopic_id: py.core.try_except_basics
items:
- id: P1300
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Khối nào trong `try/except/else/finally` luôn chạy, dù có exception hay
    không?
  choices:
  - '`except`'
  - '`else`'
  - '`finally`'
  - '`try` chỉ chạy một nửa'
  answer_index: 2
  explanation_md: '`finally` luôn chạy (dọn dẹp). `else` chỉ chạy khi `try` không
    lỗi; `except` chỉ chạy khi có lỗi khớp.'
- id: P1301
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "for s in [\"4\", \"a\", \"0\"]:\n    try:\n        print(8 // int(s))\n \
    \   except ValueError:\n        print(\"V\")\n    except ZeroDivisionError:\n\
    \        print(\"Z\")\n"
  expected_output: '2

    V

    Z

    '
  explanation_md: '`8 // 4 = 2`; `int("a")` gây `ValueError` nên in `V`; `8 // 0`
    gây `ZeroDivisionError` nên in `Z`.'
