subtopic_id: ml.system_design.prediction_forecasting
items:
- id: P1151
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Khi xây feature cho bài toán dự báo chuỗi thời gian (time-series forecasting), cách chia train/validation nào đúng?
  choices:
  - Chia ngẫu nhiên (random split) để các tập cùng phân phối
  - Chia ngẫu nhiên nhưng stratify theo nhãn
  - 'Chia theo thời gian: train trên quá khứ, validate trên giai đoạn sau, và feature chỉ dùng dữ liệu có trước thời điểm dự đoán'
  - Dùng toàn bộ dữ liệu để train rồi đánh giá trên chính nó
  answer_index: 2
  explanation_md: Random split gây leakage từ tương lai. Phải split theo thời gian và dùng feature point-in-time (lag, rolling) để mô phỏng đúng lúc serving.
