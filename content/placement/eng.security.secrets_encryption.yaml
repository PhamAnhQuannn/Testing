# Concept-hub placement items (level-1 mcq, level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: eng.security.secrets_encryption
items:
- id: P1892
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - bien-moi-truong-va-file-env-dua-secret-v
  prompt_md: Cách nào đúng nhất để đưa mật khẩu database cho một ứng dụng khi chạy?
  choices:
  - Ghi thẳng vào file code rồi commit lên Git
  - Đưa qua biến môi trường hoặc đọc từ secrets manager, không commit vào Git
  - Ghi vào README để cả team dễ tìm
  - Nhúng vào Docker image cho tiện
  answer_index: 1
  explanation_md: 'Secret không được hardcode hay commit vì Git giữ toàn bộ lịch sử. Dùng biến môi trường hoặc secrets manager để tiêm lúc chạy.'
- id: P1893
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - hmac-chu-ky-tinh-tu-noi-dung-khoa-bi-mat
  prompt_md: 'Một service muốn kiểm tra webhook không bị sửa và đúng do đối tác gửi (hai bên chia sẻ một secret). Cơ chế nào phù hợp?'
  choices:
  - HMAC của nội dung tính bằng secret chung
  - SHA-256 của nội dung không dùng khóa
  - Chỉ mã hóa disk của server
  - Chỉ dùng HTTPS cho đường truyền
  answer_index: 0
  explanation_md: 'HMAC dùng secret chung nên bảo đảm integrity và authenticity. Hash không khóa thì ai cũng tính lại được sau khi sửa nội dung; mã hóa disk là at rest; TLS bảo vệ đường truyền nhưng không chứng minh nội dung do đối tác ký.'
