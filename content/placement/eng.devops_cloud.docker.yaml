items:
- id: P1894
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - image-vs-container-image-la-ban-dong-goi
  prompt_md: Trong Docker, mối quan hệ giữa image và container là gì?
  choices:
  - Image là bản đóng gói chưa chạy; container là một bản đang chạy tạo từ image
  - Image là máy ảo còn container là file cài đặt
  - Container là bản đóng gói chưa chạy; image là bản đang chạy
  - Hai khái niệm này giống hệt nhau
  answer_index: 0
  explanation_md: 'Image là bản đóng gói chỉ đọc, chưa chạy; container là instance đang chạy tạo từ image. Từ một image chạy được nhiều container.'
- id: P1895
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - layer-va-build-cache-moi-lenh-nhu-copy-h
  prompt_md: 'Dockerfile Python nên đặt thứ tự lệnh nào để build lại nhanh khi chỉ sửa code?'
  choices:
  - COPY toàn bộ code trước, rồi RUN pip install
  - COPY requirements.txt và RUN pip install trước, rồi COPY code
  - Đặt tất cả vào một lệnh CMD
  - Thứ tự không ảnh hưởng đến tốc độ build
  answer_index: 1
  explanation_md: 'Mỗi lệnh là một layer được cache; layer đổi thì các layer sau phải build lại. Cài thư viện chỉ phụ thuộc requirements.txt nên đặt trước COPY code để được cache khi chỉ code đổi.'
