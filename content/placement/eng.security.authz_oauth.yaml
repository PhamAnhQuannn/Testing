# Concept-hub placement items (level-1 mcq, level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: eng.security.authz_oauth
items:
- id: P1890
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - authn-vs-authz-authentication-ban-la-ai
  prompt_md: Câu nào mô tả đúng authorization (phân quyền)?
  choices:
  - Xác định người dùng là ai khi đăng nhập
  - Quyết định người dùng đã xác thực được phép làm gì
  - Mã hóa mật khẩu trước khi lưu
  - Chuyển hướng người dùng sang nhà cung cấp danh tính
  answer_index: 1
  explanation_md: 'Authorization quyết định bạn được làm gì, còn authentication xác định bạn là ai. Quyền phải được server kiểm tra ở mọi request.'
- id: P1891
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - oidc-lop-dat-tren-oauth2-de-dang-nhap-th
  prompt_md: 'Trong "Đăng nhập bằng Google", token nào dùng để biết người dùng là ai, và chuẩn nào cung cấp nó?'
  choices:
  - Access token của OAuth2 thuần
  - Refresh token của OAuth2
  - ID token của OIDC
  - Client secret của app
  answer_index: 2
  explanation_md: 'OIDC là lớp danh tính trên OAuth2 và thêm ID token cho biết người dùng là ai. Access token chỉ để gọi API, refresh token chỉ để xin access token mới.'
