subtopic_id: lld.patterns.creational_singleton_factory
items:
- id: P1522
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Singleton đảm bảo điều gì?
  choices:
  - Cả chương trình chỉ có một object của class đó
  - Mỗi lần gọi đều tạo một object mới
  - Class không thể có method
  - Object luôn bất biến
  answer_index: 0
  explanation_md: Singleton giữ đúng một object dùng chung. Nhược điểm chính là nó thành global state ẩn nên khó test.
- id: P1523
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Khác biệt chính giữa shallow copy và deep copy là gì?
  choices:
  - Shallow copy dùng chung các object bên trong (như list); deep copy chép đệ quy nên độc lập
  - Shallow copy chép nhanh hơn và luôn độc lập hoàn toàn
  - Deep copy chỉ chép object ngoài cùng
  - Hai loại giống nhau, chỉ khác tên
  answer_index: 0
  explanation_md: copy.copy chỉ chép tầng ngoài nên list bên trong vẫn dùng chung; copy.deepcopy chép cả các tầng bên trong.
- id: P1524
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code in ra gì?'
  code: "class Cat:\n    def speak(self):\n        return \"meow\"\n\n\nclass Dog:\n    def speak(self):\n        return \"woof\"\n\n\nMAKERS = {\"cat\": Cat, \"dog\": Dog}\nprint(MAKERS[\"dog\"]().speak())"
  expected_output: "woof"
