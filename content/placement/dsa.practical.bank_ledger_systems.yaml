- id: P1476
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Vì sao hệ thống ngân hàng nên lưu tiền bằng số nguyên xu thay vì float?
  choices:
  - Float không biểu diễn chính xác nhiều số thập phân nên sai số tích luỹ làm lệch số dư
  - Số nguyên luôn nhanh hơn float gấp nhiều lần
  - Python không hỗ trợ float trong dict
  - Float không thể so sánh được với nhau
  answer_index: 0
  explanation_md: Ví dụ 0.1 + 0.2 != 0.3. Số nguyên xu cộng trừ chính xác nên tổng tiền được bảo toàn.
- id: P1477
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "total = 1000\nn = 3\nshare, rem = divmod(total, n)\nparts = [share + (1 if i < rem else 0) for i in range(n)]\nprint(parts)\nprint(sum(parts) == total)"
  expected_output: '[334, 333, 333]

    True'
