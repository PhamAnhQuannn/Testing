subtopic_id: sd.caching.cdn
items:
- id: P1234
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "CDN giúp giảm latency cho static assets bằng cách nào?"
  choices:
  - "Chạy toàn bộ database gần người dùng"
  - "Cache bản sao ở edge gần người dùng, điều khiển bằng TTL/Cache-Control"
  - "Nén dữ liệu trong database trước khi lưu"
  - "Luôn lấy nội dung từ origin cho mỗi request"
  answer_index: 1
  explanation_md: "CDN lưu asset tại edge server gần user; header Cache-Control/TTL quyết định thời gian giữ, giảm tải origin và RTT."
