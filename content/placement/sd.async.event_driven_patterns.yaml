items:
- id: P1228
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Pattern nào lưu mọi thay đổi trạng thái như một chuỗi event bất biến, và trạng thái hiện tại được dựng lại bằng cách replay các event?"
  choices:
  - "Event sourcing"
  - "Two-phase commit"
  - "Cache-aside"
  - "Load balancing round-robin"
  answer_index: 0
  explanation_md: "Event sourcing lưu event bất biến làm nguồn sự thật; state = replay event. Thường đi cùng CQRS."
