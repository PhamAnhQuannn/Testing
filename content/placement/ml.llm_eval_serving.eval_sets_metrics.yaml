# Concept-hub placement items (C1 level-1 mcq, C2 level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: ml.llm_eval_serving.eval_sets_metrics
items:
- id: P964
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - golden-set-50-200-vi-du-lay-tu-luu-luong
  prompt_md: Vì sao vibe check (thử vài câu thấy ổn) không được coi là đánh giá model, và đánh giá đúng cần gì?
  choices:
  - Vì vibe check tốn quá nhiều thời gian hơn đo bằng số
  - Vì chỉ có A/B test với người dùng thật mới là đánh giá, eval set là không cần thiết
  - Vì model luôn cho kết quả giống nhau mỗi lần nên không cần thử
  - Vì vài câu thử tay không lặp lại được và không đại diện; cần một eval set cố định, lấy từ dữ liệu thật và ca lỗi, đo bằng metric lặp lại được
  answer_index: 3
  explanation_md: Đánh giá cần tập cố định, đại diện, đánh version và metric lặp lại được để so sánh giữa các lần đổi prompt/model.
- id: P965
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - metric-theo-tac-vu-phan-loai-dung-accura
  prompt_md: Bạn làm tác vụ trích xuất mã đơn hàng (chuỗi ngắn, đáp án đúng duy nhất) từ email. Điểm accuracy tổng là 95% nhưng khách phàn nàn nhiều về email tiếng Nhật. Hướng nào hợp lý nhất?
  choices:
  - Dùng BLEU/ROUGE vì đây là sinh văn bản
  - Chọn exact-match (hoặc F1) cho trích xuất và cắt lát kết quả theo nhóm (ngôn ngữ, loại email) để thấy nhóm tiếng Nhật hỏng, rồi làm error analysis
  - Chỉ giữ con số tổng 95% vì nó đã đại diện cho mọi nhóm
  - Đưa tập eval vào dữ liệu huấn luyện để điểm tiếng Nhật tăng lên
  answer_index: 1
  explanation_md: Trích xuất đáp án duy nhất hợp exact-match/F1; con số tổng che nhóm hỏng nên phải cắt lát. Trộn eval vào dữ liệu huấn luyện là leakage, làm điểm giả.
