  prompt_md: 'Vì sao ứng dụng LLM cần evals (bộ đánh giá) trước khi thay prompt hoặc model?'
  choices:
  - 'Để model tự động học thêm từ evals'
  - 'Để giảm số token của prompt'
  - 'Để đo chất lượng và phát hiện regression khi đổi prompt, model hay pipeline'
  - 'Vì evals thay thế được việc viết prompt'
  answer_index: 2
  explanation_md: 'Output LLM không deterministic nên cần bộ test/evals để đo chất lượng và phát hiện regression khi đổi prompt, model hay pipeline.'
