# Placement-only items (P0 mcq / P1 read_code).
subtopic_id: dsa.arrays_strings.string_algorithms
items:
- id: P1073
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Để kiểm tra hai chuỗi có phải anagram với nhau, cách nào đúng và hiệu quả (O(n))?
  choices:
  - So sánh độ dài của hai chuỗi
  - So sánh bảng đếm ký tự (frequency count) của hai chuỗi
  - So sánh ký tự đầu của hai chuỗi
  - Kiểm tra chuỗi này có là substring của chuỗi kia
  answer_index: 1
  explanation_md: Anagram nghĩa là cùng multiset ký tự, nên so sánh bảng đếm tần suất (O(n)); chỉ so độ dài là chưa đủ.
- id: P1074
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    def is_pal(s):
        return s == s[::-1]

    def is_anagram(a, b):
        return sorted(a) == sorted(b)

    print(is_pal('level'))
    print(is_pal('abca'))
    print(is_anagram('listen', 'silent'))
    print(is_anagram('abc', 'abd'))
  expected_output: |-
    True
    False
    True
    False
