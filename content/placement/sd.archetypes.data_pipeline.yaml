subtopic_id: sd.archetypes.data_pipeline
items:
- id: P1164
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Pipeline cần phản ứng với sự kiện trong vài giây và không được đếm trùng khi xử lý lỗi/retry. Thiết kế nào đúng?"
  choices:
  - "Batch job chạy mỗi đêm là đủ"
  - "Stream processing (Kafka + stream processor) với checkpoint và ghi idempotent/transactional để đạt exactly-once effect"
  - "At-most-once vì đơn giản, mất vài sự kiện cũng được"
  - "Retry vô điều kiện, không cần dedup"
  answer_index: 1
  explanation_md: "Cần độ trễ thấp nên dùng streaming; exactly-once effect đạt qua checkpoint cùng sink idempotent/transactional. Batch đêm quá chậm, retry không dedup gây đếm trùng."
