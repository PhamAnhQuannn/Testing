subtopic_id: sd.data.object_blob_storage
items:
- id: P1209
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Hệ thống cho phép upload ảnh/video lớn. Thiết kế lưu trữ nào hợp lý nhất?"
  choices:
  - "Lưu file nhị phân thẳng vào cột của relational DB"
  - "Lưu blob trong object store, database chỉ giữ metadata và key tham chiếu"
  - "Lưu blob trong cache Redis để đọc nhanh"
  - "Lưu blob trong một document NoSQL cùng với metadata"
  answer_index: 1
  explanation_md: "Blob lớn nên nằm trong object store (S3, GCS) rẻ và bền; database chỉ giữ metadata và key/URL. Nhét blob vào DB làm DB phình và chậm."
