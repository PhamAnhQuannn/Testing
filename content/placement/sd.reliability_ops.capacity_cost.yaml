subtopic_id: sd.reliability_ops.capacity_cost
items:
- id: P1255
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Khi lập capacity plan cho hệ thống có peak traffic, nguyên tắc cơ bản là gì?'
  choices:
  - 'Provision theo peak cộng headroom, và dùng autoscaling để cân đối chi phí'
  - 'Chỉ provision theo traffic trung bình'
  - 'Luôn chạy 100% CPU để tiết kiệm'
  - 'Bỏ qua headroom vì tốn tiền'
  answer_index: 0
  explanation_md: 'Provision theo peak cộng headroom để chịu đột biến và lỗi; đánh đổi là chi phí, nên kết hợp autoscaling để giảm lãng phí ngoài giờ cao điểm.'
