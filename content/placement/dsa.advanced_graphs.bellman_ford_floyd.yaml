  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Đồ thị có cạnh âm (không có chu trình âm) và cần đường ngắn nhất từ một nguồn. Thuật toán nào phù hợp?
  choices:
  - Dijkstra thông thường
  - Bellman-Ford
  - BFS không trọng số
  - Kruskal
  answer_index: 1
  explanation_md: Dijkstra giả định trọng số không âm; Bellman-Ford relax mọi cạnh V-1 vòng nên xử lý được cạnh âm.
- id: P1427
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "INF = float(\"inf\")\nedges = [(0, 1, 2), (1, 2, 3), (0, 2, 9)]\nn = 3\nd = [[0 if i == j else INF for j in range(n)] for i in range(n)]\nfor u, v, w in edges:\n    d[u][v] = w\nfor k in range(n):\n    for i in range(n):\n        for j in range(n):\n            if d[i][k] + d[k][j] < d[i][j]:\n                d[i][j] = d[i][k] + d[k][j]\nprint(d[0][2], d[2][0])"
  expected_output: '5 inf'
