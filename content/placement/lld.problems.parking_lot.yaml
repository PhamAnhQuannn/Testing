items:
- id: P1552
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong bài bãi đỗ xe, thông tin nào nên nằm trong Ticket?
  choices:
  - Id vé, chỗ đã cấp và giờ vào
  - Toàn bộ danh sách chỗ trống của bãi
  - Bảng giá của mọi loại xe
  - Số tầng của bãi
  answer_index: 0
  explanation_md: Ticket ghi lại một lượt đỗ (id, chỗ, giờ vào) để lúc ra tính phí và trả chỗ; danh sách chỗ trống thuộc về Floor/ParkingLot, bảng giá thuộc về pricing.
- id: P1553
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Vì sao nên dùng enum cho loại xe (CAR, MOTO) thay vì chuỗi tự do?
  choices:
  - Tránh gõ sai chuỗi và gom các giá trị hợp lệ về một chỗ
  - Enum chạy nhanh hơn chuỗi mọi lúc
  - Enum tự tính phí giùm
  - Chuỗi không dùng được làm khóa dict
  answer_index: 0
  explanation_md: Enum giới hạn tập giá trị hợp lệ và dễ tìm mọi chỗ dùng; thêm loại mới (EV) chỉ cần thêm một giá trị.
- id: P1554
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code in ra gì?'
  code: "free = {\"car\": 1}\nrate = {\"car\": 20}\n\ndef park(k):\n    if free.get(k, 0) == 0:\n        return -1\n    free[k] -= 1\n    return 1\n\ndef fee(k, h):\n    return rate[k] * h\n\nprint(park(\"car\"), park(\"car\"), fee(\"car\", 3))"
  expected_output: "1 -1 60"
