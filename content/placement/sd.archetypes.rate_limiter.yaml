subtopic_id: sd.archetypes.rate_limiter
items:
- id: P1161
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Rate limiter cần cho phép burst ngắn nhưng vẫn giữ tốc độ trung bình ổn định. Thuật toán nào phù hợp nhất?"
  choices:
  - "Fixed window counter vì đơn giản nhất"
  - "Token bucket: token nạp đều theo thời gian, mỗi request tiêu một token"
  - "Chỉ chặn theo địa chỉ IP vĩnh viễn"
  - "Ghi log mọi request rồi đếm lại bằng full table scan"
  answer_index: 1
  explanation_md: "Token bucket cho phép burst tới dung lượng bucket và giới hạn tốc độ trung bình bằng refill rate. Fixed window bị burst gấp đôi ở ranh giới cửa sổ."
