- id: P1546
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Vì sao nên dùng dict để lưu sách theo tựa trong một Library?
  choices:
  - Tra cứu theo tựa trung bình O(1) thay vì quét cả list
  - Dict luôn giữ sách theo thứ tự sắp xếp
  - Dict tự động ném lỗi khi tựa trùng
  - Dict dùng ít bộ nhớ hơn mọi cấu trúc khác
  answer_index: 0
  explanation_md: Dict băm theo khóa nên tìm theo tựa trung bình O(1); quét list tốn O(n).
- id: P1547
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Điều nào mô tả đúng "god class"?
  choices:
  - Một class ôm quá nhiều trách nhiệm không liên quan
  - Một class có đúng một method
  - Một class kế thừa từ object
  - Một class chỉ chứa hằng số
  answer_index: 0
  explanation_md: God class làm mọi việc (lưu dữ liệu, tính phí, in ấn...), khó đọc và khó test; nên tách theo trách nhiệm.
- id: P1548
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code in ra gì?'
  code: "stock = {\"a\": 1}\n\ndef borrow(t):\n    if stock.get(t, 0) <= 0:\n        return False\n    stock[t] -= 1\n    return True\n\nprint(borrow(\"a\"), borrow(\"a\"), borrow(\"b\"))"
  expected_output: "True False False"
