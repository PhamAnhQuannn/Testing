items:
- id: P1418
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Vì sao BFS tìm được đường đi ngắn nhất (ít cạnh nhất) trong đồ thị không trọng số?
  choices:
  - Vì nó thăm các node theo chỉ số tăng dần
  - Vì nó mở rộng theo từng lớp khoảng cách nên lần đầu chạm một node là qua ít cạnh nhất
  - Vì nó dùng stack để đi sâu trước
  - Vì nó thử mọi đường rồi chọn đường ngắn nhất
  answer_index: 1
  explanation_md: Queue FIFO xử lý mọi node cách nguồn k cạnh trước node cách k+1 cạnh; DFS với stack không bảo đảm điều này.
- id: P1419
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "from collections import deque\n\nadj = {0: [2, 1], 1: [3], 2: [3], 3: []}\ndist = {0: 0}\nq = deque([0])\nwhile q:\n    u = q.popleft()\n    for v in adj[u]:\n        if v not in dist:\n            dist[v] = dist[u] + 1\n            q.append(v)\nprint(dist)\nprint(dist.get(9, -1))"
  expected_output: "{0: 0, 2: 1, 1: 1, 3: 2}\n-1"
