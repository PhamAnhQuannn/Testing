items:
- id: P1199
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Matching engine của sàn giao dịch cần khớp lệnh công bằng và chính xác. Quyết định thiết kế cốt lõi?
  choices:
  - Xử lý lệnh song song không thứ tự trên nhiều thread cho nhanh
  - Sequencer xếp thứ tự toàn cục cho lệnh, matching engine đơn luồng theo từng symbol (price-time priority), kèm idempotency và event log để replay
  - Cho người dùng tự thoả thuận giá qua email
  - Lưu lệnh trong cache không bền
  answer_index: 1
  explanation_md: 'Tính đúng cần thứ tự tất định: sequencer + matching đơn luồng mỗi order book, event sourcing để phục hồi, idempotency key chống đặt lệnh trùng.'
