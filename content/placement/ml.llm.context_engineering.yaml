items:
- id: P1084
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Hiện tượng "lost in the middle" trong long context là gì?'
  choices:
  - 'Model dùng thông tin ở giữa context kém hơn đầu và cuối'
  - 'Model quên toàn bộ phần đầu prompt'
  - 'Token ở giữa bị tính tiền gấp đôi'
  - 'Context window tự động bị cắt còn một nửa'
  answer_index: 0
  explanation_md: 'Nhiều model dùng tốt thông tin ở đầu và cuối context hơn so với phần nằm giữa, nên cần đặt thông tin quan trọng hợp lý và không nhồi context thừa.'
