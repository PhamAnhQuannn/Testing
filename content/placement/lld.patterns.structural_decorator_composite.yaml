subtopic_id: lld.patterns.structural_decorator_composite
items:
- id: P1528
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Decorator (mẫu GoF) làm gì?
  choices:
  - Bọc một object cùng interface để thêm hành vi lúc chạy, có thể xếp chồng nhiều lớp
  - Tạo ra đúng một instance duy nhất của class
  - Chuyển interface của class này sang interface khác
  - Gom nhiều object thành một bản sao sâu
  answer_index: 0
  explanation_md: Decorator bọc object khác (cùng interface), giao việc cho nó rồi thêm việc của mình; nhiều lớp bọc chồng lên nhau tạo ra tổ hợp tính năng mà không cần nhiều class con.
- id: P1529
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Điểm cốt lõi của Composite là gì?
  choices:
  - Lá và nhánh của cây cùng một interface, nên xử lý cả cây bằng một lời gọi như size()
  - Mỗi nhánh phải có kiểu dữ liệu khác với lá
  - Chỉ dùng được cho cây nhị phân
  - Phía gọi phải kiểm tra loại node trước khi gọi
  answer_index: 0
  explanation_md: Composite cho phần tử đơn (lá) và nhóm (nhánh) cùng interface; nhóm chuyển lời gọi cho các con nên phía gọi không cần phân biệt loại.
- id: P1530
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code in ra gì?'
  code: "class File:\n    def __init__(self, n):\n        self.n = n\n\n    def size(self):\n        return self.n\n\n\nclass Folder:\n    def __init__(self, children):\n        self.children = children\n\n    def size(self):\n        return sum(c.size() for c in self.children)\n\n\nprint(Folder([File(3), Folder([File(4), File(5)]), Folder([])]).size())"
  expected_output: '12'
