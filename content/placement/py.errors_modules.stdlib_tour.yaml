items:
- id: P1340
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: '`math.ceil(2.1)` và `math.floor(-2.1)` lần lượt trả về gì?'
  choices:
  - '`3` và `-3`'
  - '`2` và `-2`'
  - '`3` và `-2`'
  - '`2` và `-3`'
  answer_index: 0
  explanation_md: '`ceil` làm tròn lên: 2.1 thành 3. `floor` làm tròn xuống: -2.1
    thành -3 (xuống về phía số âm hơn).'
- id: P1341
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: 'from datetime import date, timedelta


    d = date(2026, 2, 27)

    print(d + timedelta(days=2))

    print(d.strftime("%d/%m"))'
  expected_output: '2026-03-01

    27/02'
