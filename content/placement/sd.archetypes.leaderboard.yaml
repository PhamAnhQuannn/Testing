subtopic_id: sd.archetypes.leaderboard
items:
- id: P1162
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Leaderboard game cần cập nhật điểm liên tục và lấy top N cùng hạng của một người dùng nhanh. Cấu trúc dữ liệu nào phù hợp?"
  choices:
  - "SQL table và ORDER BY mỗi lần đọc"
  - "List trong Redis sắp xếp thủ công"
  - "Redis sorted set (ZSET): ZADD cập nhật điểm, ZREVRANGE lấy top, ZREVRANK lấy hạng, đều O(log N)"
  - "Hash map không có thứ tự rồi sort ở client"
  answer_index: 2
  explanation_md: "ZSET giữ thứ tự theo score nên cập nhật, lấy top và rank đều O(log N). ORDER BY toàn bảng hoặc sort ở client quá chậm khi số người chơi lớn."
