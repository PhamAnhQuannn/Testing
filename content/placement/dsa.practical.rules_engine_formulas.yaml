- id: P1492
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Biểu thức boolean `T OR F AND F` được đánh giá thế nào theo độ ưu tiên NOT > AND > OR?
  choices:
  - T OR (F AND F) = T
  - (T OR F) AND F = F
  - Đánh giá từ trái sang phải, không có ưu tiên
  - Không hợp lệ nếu thiếu ngoặc
  answer_index: 0
  explanation_md: AND ưu tiên hơn OR nên F AND F chạy trước (ra F), sau đó T OR F = T.
- id: P1493
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "rules = [(10, \"low\"), (50, \"mid\"), (90, \"high\")]\n\ndef label(v):\n    for t, n in rules:\n        if v >= t:\n            return n\n    return \"none\"\n\nprint(label(95), label(60), label(5))"
  expected_output: 'low low none'
