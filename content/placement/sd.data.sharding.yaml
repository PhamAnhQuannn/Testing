subtopic_id: sd.data.sharding
items:
- id: P1207
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Khi chọn partition key cho sharding, rủi ro lớn cần tránh là gì?"
  choices:
  - "Hotspot: key phân bố lệch khiến một shard nhận quá nhiều traffic"
  - "Có quá nhiều shard nên lưu trữ bị lãng phí"
  - "Key có cardinality cao khiến dữ liệu phân bố đều"
  - "Dùng hash của key thay vì giá trị gốc"
  answer_index: 0
  explanation_md: "Key phân bố lệch (ví dụ theo ngày hiện tại hoặc một user cực lớn) làm một shard chịu phần lớn tải: hotspot. Nên chọn key có cardinality cao, phân bố đều."
