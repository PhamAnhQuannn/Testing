subtopic_id: py.oop.classes_basics
items:
- id: P1021
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Trong `class Dog:` với `def __init__(self, name): self.name = name`, `self` là gì?'
  choices:
  - 'Chính object (instance) đang gọi method'
  - 'Chính class `Dog`'
  - 'Một từ khóa bắt buộc phải truyền khi gọi `Dog("Rex")`'
  - 'Tên của biến toàn cục'
  answer_index: 0
  explanation_md: 'Khi gọi `d = Dog("Rex")`, Python tự truyền object mới tạo vào `self`; `self.name` là thuộc tính của riêng instance đó.'
- id: P1022
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    class Counter:
        step = 1
        def __init__(self, start):
            self.value = start
        def bump(self):
            self.value += self.step
            return self.value
    a = Counter(10)
    b = Counter(20)
    a.bump()
    a.bump()
    print(a.value, b.value)
    b.step = 5
    b.bump()
    print(b.value, a.step, Counter.step)
    print(type(a).__name__, isinstance(b, Counter))
  expected_output: |-
    12 20
    25 1 1
    Counter True
