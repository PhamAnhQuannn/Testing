subtopic_id: py.errors_modules.files_pathlib
items:
- id: P1330
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Muốn đổi **chuỗi** JSON `s` thành dữ liệu Python, dùng hàm nào?
  choices:
  - '`json.loads(s)`'
  - '`json.dumps(s)`'
  - '`json.load(s)`'
  - '`json.parse(s)`'
  answer_index: 0
  explanation_md: '`loads` (load string) đọc từ chuỗi. `dumps` làm ngược lại (ra chuỗi),
    `load` đọc từ file object, và Python không có `json.parse`.'
- id: P1331
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: 'import json

    import os.path


    print(json.dumps([1, None, True]))

    print(os.path.splitext("a/b.tar.gz")[1], os.path.basename("a/b.tar.gz"))'
  expected_output: '[1, null, true]

    .gz b.tar.gz'
