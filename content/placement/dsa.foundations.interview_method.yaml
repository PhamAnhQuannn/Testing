subtopic_id: dsa.foundations.interview_method
items:
- id: P1029
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Nhận một bài phỏng vấn mới. Thứ tự hợp lý nhất là gì?'
  choices:
  - 'Làm rõ đề và edge case, chạy ví dụ tay, nêu brute force rồi tối ưu, code, tự test'
  - 'Code ngay cách tối ưu nhất, im lặng, rồi mới đọc lại đề'
  - 'Nêu brute force, code luôn, bỏ qua ví dụ và test vì tốn thời gian'
  - 'Hỏi người phỏng vấn đáp án, rồi chép lại'
  answer_index: 0
  explanation_md: 'Quy trình lặp lại được: clarify, ví dụ nhỏ, brute force, optimize, code, dry-run test. Vừa làm vừa nói to (think aloud) để người phỏng vấn theo dõi.'
