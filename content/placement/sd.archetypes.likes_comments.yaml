subtopic_id: sd.archetypes.likes_comments
items:
- id: P1197
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Bài viết viral nhận hàng chục nghìn lượt like mỗi giây trên cùng một post. Nút thắt và cách xử lý chuẩn?
  choices:
  - Mỗi like chạy UPDATE count+1 trên một dòng DB duy nhất
  - Khoá toàn bộ bảng khi có like
  - Cộng dồn like trong buffer (Redis/sharded counter) rồi flush theo lô; hot key dùng nhiều counter shard và đọc tổng hợp
  - Không lưu số like
  answer_index: 2
  explanation_md: Hot row bị contention nếu update đồng bộ; dùng sharded counter, batching/async aggregation và chấp nhận eventual consistency cho số đếm.
