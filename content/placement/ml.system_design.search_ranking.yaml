subtopic_id: ml.system_design.search_ranking
items:
- id: P1155
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong search ranking, tín hiệu nào sau đây là cốt lõi để đo mức độ liên quan (relevance) của tài liệu với truy vấn?
  choices:
  - Chỉ độ dài của tài liệu
  - Chỉ thời điểm tài liệu được tạo
  - Khớp query-document (BM25/semantic similarity) kết hợp tín hiệu hành vi như click và chất lượng tài liệu, rồi học xếp hạng (learning to rank)
  - Số lần tài liệu được lưu trong cache
  answer_index: 2
  explanation_md: Relevance đến từ độ khớp văn bản/ngữ nghĩa giữa query và document, bổ sung bằng tín hiệu click, chất lượng, rồi learning to rank kết hợp chúng.
