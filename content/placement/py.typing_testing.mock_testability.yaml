subtopic_id: py.typing_testing.mock_testability
items:
- id: P1382
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Module `app` có `from lib import send` và hàm `run()` gọi `send()`. Để test `run` mà không gửi thật, nên patch gì?'
  choices:
  - '`patch("app.send")`, vì `run` tra cứu tên `send` trong `app`'
  - '`patch("lib.send")`, vì `send` được định nghĩa ở `lib`'
  - '`patch("run")`'
  - Không patch được; phải sửa code
  answer_index: 0
  explanation_md: '`from lib import send` tạo tên `send` riêng trong `app`. Patch `lib.send` không đổi tên đó, nên phải patch tại nơi tên được tra cứu: `app.send`.'
- id: P1383
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    from unittest.mock import Mock

    m = Mock(side_effect=[10, ValueError("x"), 30])
    out = []
    for _ in range(3):
        try:
            out.append(m())
        except ValueError:
            out.append("err")
    print(out)
    print(m.call_count)
  expected_output: "[10, 'err', 30]\n3"
