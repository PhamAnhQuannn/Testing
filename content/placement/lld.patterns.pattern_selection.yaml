subtopic_id: lld.patterns.pattern_selection
items:
- id: P1579
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Đề yêu cầu "hoàn tác (undo) thao tác gần nhất". Dấu hiệu này gợi mẫu nào?'
  choices:
  - Command (mỗi thao tác là một object có thể execute và undo)
  - Singleton
  - Adapter
  - Factory
  answer_index: 0
  explanation_md: Hoàn tác cần lưu thao tác như dữ liệu để chạy ngược lại; đó là Command. Nhiều cách tính là Strategy, báo nhiều bên là Observer, tạo theo loại là Factory.
- id: P1580
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Bài chỉ cần một hàm tính tổng 20 dòng, một bạn dùng Strategy + Factory + Observer. Nhận xét nào đúng?
  choices:
  - Over-engineering, vi phạm YAGNI; hàm thường là đủ
  - Tốt, vì dùng nhiều mẫu luôn là thiết kế tốt hơn
  - Bắt buộc, vì đề LLD phải có ít nhất 3 mẫu
  - Tốt, vì mẫu làm code chạy nhanh hơn
  answer_index: 0
  explanation_md: YAGNI hỏi "có cần ngay bây giờ không?". Chưa có nhiều biến thể hay nhiều bên nghe thì mẫu chỉ thêm class thừa.
- id: P1581
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code in ra gì?'
  code: "OPS = {\"add\": lambda a, b: a + b, \"mul\": lambda a, b: a * b, \"max\": max}\n\n\ndef run(op, a, b):\n    return OPS.get(op, lambda a, b: 0)(a, b)\n\n\nprint(run(\"add\", 2, 3))\nprint(run(\"mul\", 4, 5))\nprint(run(\"max\", 7, 9))\nprint(run(\"pow\", 2, 3))"
  expected_output: "5\n20\n9\n0"
