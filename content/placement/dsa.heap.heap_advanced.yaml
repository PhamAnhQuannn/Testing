items:
- id: P1398
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Bài median của luồng số dùng hai heap. Cách phân chia nào đúng?
  choices:
  - Max-heap giữ nửa nhỏ và min-heap giữ nửa lớn, kích thước hai heap chênh nhau tối đa 1
  - Min-heap giữ nửa nhỏ và max-heap giữ nửa lớn
  - Hai min-heap, mỗi heap giữ một nửa số lượng bất kỳ
  - Một max-heap chứa tất cả, đỉnh luôn là median
  answer_index: 0
  explanation_md: Median nằm ở ranh giới hai nửa, nên cần đọc nhanh phần tử lớn nhất của nửa nhỏ (max-heap) và nhỏ nhất của nửa lớn (min-heap); cân bằng kích thước để đỉnh là phần tử giữa.
- id: P1399
  difficulty: 1
