- id: P1396
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Để lấy k phần tử lớn nhất từ n phần tử bằng heap với O(n log k), ta dùng cấu trúc nào?
  choices:
  - Min-heap kích thước k, bỏ đỉnh khi heap vượt k phần tử
  - Max-heap chứa cả n phần tử rồi pop k lần
  - Max-heap kích thước k, bỏ đỉnh khi heap vượt k phần tử
  - Min-heap chứa cả n phần tử rồi lấy k phần tử cuối
  answer_index: 0
  explanation_md: Đỉnh min-heap là phần tử nhỏ nhất trong nhóm k hiện tại, chính là phần tử cần loại khi có ứng viên mới lớn hơn. Heap kích thước k giữ chi phí mỗi thao tác ở O(log k).
- id: P1397
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "import heapq\n\nnums = [7, 2, 9, 4, 6]\nh = []\nfor v in nums:\n    heapq.heappush(h,\
