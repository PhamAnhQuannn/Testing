subtopic_id: sd.archetypes.typeahead
items:
- id: P1172
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Typeahead/autocomplete cần trả gợi ý dưới vài chục ms cho mỗi phím gõ. Cách nào phù hợp?"
  choices:
  - "Chạy LIKE với wildcard hai đầu trên bảng truy vấn mỗi phím"
  - "Sort toàn bộ query log mỗi request"
  - "Trie/prefix index lưu sẵn top-K gợi ý cho mỗi prefix, kèm cache"
  - "Gọi search engine đầy đủ mỗi lần"
  answer_index: 2
  explanation_md: "Trie hoặc prefix index với top-K precompute theo prefix, cache ở tầng ngoài, cho truy vấn gần O(độ dài prefix). LIKE hoặc sort toàn log quá chậm."
