# Concept-hub placement items (C1 level-1 mcq, C2 level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: sd.framework.overview
items:
- id: P948
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Thứ tự đúng của dàn ý 7 bước trong một buổi phỏng vấn HLD là gì?
  choices:
  - Sơ đồ tổng thể → API → làm rõ yêu cầu → ước lượng → mô hình dữ liệu → đào sâu → tóm tắt
  - Làm rõ yêu cầu → ước lượng → API → mô hình dữ liệu → sơ đồ tổng thể → đào sâu chỗ khó → trade-off và tóm tắt
  - Ước lượng → làm rõ yêu cầu → sơ đồ tổng thể → API → mô hình dữ liệu → tóm tắt → đào sâu
  - Làm rõ yêu cầu → sơ đồ tổng thể → đào sâu → API → mô hình dữ liệu → ước lượng → tóm tắt
  answer_index: 1
  explanation_md: 'Dàn ý chuẩn: yêu cầu, ước lượng, API, data model, high-level design, deep dive, trade-off và wrap-up. Hiểu bài toán trước khi vẽ, đào sâu sau khi đã có khung.'
- id: P949
  difficulty: 2
  type: mcq
  minutes: 2
  prompt_md: 'Bạn đã vẽ xong sơ đồ tổng thể. Người phỏng vấn hỏi: ''Nếu lưu lượng tăng gấp 100 lần thì chỗ nào vỡ trước?''. Phản xạ tốt nhất là gì?'
  choices:
  - Quay lại bước làm rõ yêu cầu và hỏi lại toàn bộ phạm vi từ đầu
  - Liệt kê thật nhiều công nghệ nổi tiếng để chứng tỏ mình biết nhiều
  - 'Coi đây là tín hiệu sang bước đào sâu: nói to suy nghĩ, chỉ ra 1-2 điểm nghẽn và đi sâu cách giải kèm trade-off'
  - Trả lời ngắn rằng 'sẽ thêm server' rồi vẽ tiếp cho xong sơ đồ
  answer_index: 2
  explanation_md: Câu hỏi gấp 100 lần mời bạn sang deep dive (phần dài nhất, 15-20 phút). Buzzword không có lý do và bỏ qua gợi ý đều bị trừ điểm.
