subtopic_id: sd.archetypes.productivity_apps
items:
- id: P1200
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Thiết kế calendar: tạo sự kiện lặp, mời người khác, và đồng bộ giữa nhiều thiết bị. Quyết định cốt lõi nào hợp lý?'
  choices:
  - Lưu mọi occurrence của sự kiện lặp vô hạn thành từng dòng
  - Chỉ lưu trên thiết bị, không có server
  - Lưu sự kiện lặp bằng quy tắc (RRULE) cộng ngoại lệ, và sync thiết bị bằng incremental sync token/change log
  - Gửi toàn bộ lịch cho client mỗi lần mở app
  answer_index: 2
  explanation_md: Recurring event lưu dưới dạng rule + exception, mở rộng khi truy vấn; sync tăng dần qua sync token/versioning giúp tiết kiệm băng thông và xử lý xung đột.
