subtopic_id: sd.data.geo_indexing
items:
- id: P1212
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Để truy vấn các địa điểm gần một toạ độ (nearby search), kỹ thuật nào thường được dùng?"
  choices:
  - "Tính khoảng cách tới mọi địa điểm mỗi lần truy vấn"
  - "Index riêng cột latitude bằng B-tree rồi lọc longitude"
  - "Hash toạ độ bằng MD5 để tìm các điểm gần nhau"
  - "Geohash, quadtree hoặc S2 chia bản đồ thành ô để chỉ quét ô lân cận"
  answer_index: 3
  explanation_md: "Geohash, quadtree hoặc S2 chia không gian thành ô, biến toạ độ 2D thành khoá index được; chỉ cần quét ô chứa điểm và các ô lân cận thay vì tính khoảng cách với mọi điểm."
