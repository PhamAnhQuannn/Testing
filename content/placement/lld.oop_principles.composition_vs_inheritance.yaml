subtopic_id: lld.oop_principles.composition_vs_inheritance
items:
- id: P1519
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: '"Xe có một Động cơ" là quan hệ nào và nên mô hình bằng gì?'
  choices:
  - has-a, mô hình bằng composition (Xe giữ một object Engine)
  - is-a, mô hình bằng kế thừa (Xe kế thừa Engine)
  - has-a, mô hình bằng cách tạo class con cho từng loại động cơ
  - is-a, mô hình bằng composition
  answer_index: 0
  explanation_md: Xe không phải là một loại Động cơ nên không dùng kế thừa. Xe chứa một Động cơ (has-a), nên giữ object Engine bên trong và giao việc cho nó.
- id: P1520
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Vịt có 2 cách bay và 3 cách kêu. Nếu tạo một class con cho mỗi tổ hợp thì cần bao nhiêu class con, và composition cần bao nhiêu hành vi?
  choices:
  - 6 class con; composition chỉ cần 2 + 3 = 5 hành vi nhỏ lắp ghép
  - 5 class con; composition cần 6 hành vi
  - 6 class con; composition cũng cần 6 class
  - 2 class con; composition cần 3 hành vi
  answer_index: 0
  explanation_md: Kế thừa theo tổ hợp cho 2 x 3 = 6 class và tăng nhân khi thêm chiều mới (subclass explosion). Composition chỉ cần 2 + 3 = 5 hành vi, ghép tuỳ ý.
- id: P1521
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dùng delegation in ra gì?'
  code: "class Log:\n    def __init__(self):\n        self.lines = []\n\n    def add(self, s):\n        self.lines.append(s)\n\n\nclass Robot:\n    def __init__(self, log):\n        self.log = log\n\n    def move(self):\n        self.log.add(\"move\")\n\n\nr = Robot(Log())\nr.move()\nr.move()\nprint(len(r.log.lines), r.log.lines[0])"
  expected_output: '2 move'
