items:
- id: P1235
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Ở đầu buổi system design interview, bước đầu tiên đúng là gì?"
  choices:
  - "Vẽ ngay sơ đồ microservices"
  - "Chọn công nghệ database"
  - "Tính chi phí server"
  - "Làm rõ functional và non-functional requirements (scale, latency, availability) trước khi thiết kế"
  answer_index: 3
  explanation_md: "Clarify trước: functional (hệ thống làm gì) và non-functional (scale, latency, consistency...) quyết định mọi lựa chọn sau."
