subtopic_id: sd.archetypes.lock_service
items:
- id: P1198
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Cần distributed lock chống hai client cùng giữ lock khi một client bị GC pause lâu rồi tỉnh lại. Cơ chế nào phòng ngừa đúng nhất?
  choices:
  - Dùng lock không có thời hạn
  - Lock có lease (TTL) trên hệ đồng thuận như ZooKeeper/etcd cùng fencing token tăng đơn điệu để storage từ chối token cũ
  - Tin vào đồng hồ hệ thống của client
  - Dùng Redis một node không replication
  answer_index: 1
  explanation_md: Lease giúp nhả lock khi client chết, nhưng client chậm có thể vẫn tưởng mình giữ lock; fencing token đơn điệu cho phép tài nguyên từ chối yêu cầu từ holder cũ.
