- id: P1454
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Đổi 6 bằng mệnh giá {1, 3, 4} theo greedy (luôn lấy mệnh giá lớn nhất còn dùng được). Kết luận nào đúng?
  choices:
  - Greedy ra 3 xu (4 + 1 + 1) nhưng tối ưu là 2 xu (3 + 3), nên greedy sai
  - Greedy ra 2 xu và tối ưu
  - Greedy ra 3 xu và tối ưu
  - Greedy không tìm được cách đổi
  answer_index: 0
  explanation_md: Greedy lấy 4 rồi 1 + 1 được 3 xu, trong khi 3 + 3 chỉ cần 2 xu. Đây là phản ví dụ cho greedy, nên Coin Change tổng quát cần DP.
- id: P1455
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "nums = [1, 2, 0, 1, 0, 4]\nreach = 0\nfor i, step in enumerate(nums):\n    if i > reach:\n        print(\"stuck at\", i)\n        break\n    reach = max(reach, i + step)\nelse:\n    print(\"ok\", reach)"
  expected_output: 'stuck at 5'
