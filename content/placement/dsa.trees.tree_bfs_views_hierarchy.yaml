items:
- id: P1406
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Khi duyệt cây theo tầng (BFS), cấu trúc dữ liệu nào phù hợp nhất?
  choices:
  - Ngăn xếp (stack)
  - Hàng đợi (queue), ví dụ deque
  - Tập hợp (set)
  - Heap
  answer_index: 1
  explanation_md: BFS xử lý node theo thứ tự vào trước ra trước (FIFO), nên dùng queue; stack cho ra DFS.
- id: P1407
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    from collections import deque

    tree = {1: (2, 3), 2: (4, None), 3: (5, 6), 4: (None, None), 5: (None, None), 6: (None, None)}
    queue = deque([1])
    level = 0
    while queue:
        n = len(queue)
        vals = []
        for _ in range(n):
            v = queue.popleft()
            vals.append(v)
            for c in tree[v]:
                if c is not None:
                    queue.append(c)
        if level % 2 == 1:
            vals.reverse()
        print(vals)
        level += 1
  expected_output: |-
    [1]
    [3, 2]
    [4, 5, 6]
