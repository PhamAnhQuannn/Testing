items:
- id: P1920
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - dom-cay-cac-the-html-ma-trinh-duyet-giu
  prompt_md: DOM là gì?
  choices:
  - Cây các phần tử HTML mà trình duyệt dựng từ trang, JavaScript có thể đọc và sửa
  - Tập hợp các luật CSS quy định toàn bộ giao diện của trang web
  - Một cơ sở dữ liệu chạy trên server để lưu nội dung của trang
  - Một thư viện JavaScript bên ngoài phải cài thêm mới dùng được
  answer_index: 0
  explanation_md: 'DOM là cây phần tử trình duyệt dựng từ HTML; JavaScript đọc/sửa bằng querySelector, textContent, classList. Nó là một phần của trình duyệt, không phải CSS hay database.'
- id: P1921
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - event-bubbling-va-delegation-su-kien-noi
  prompt_md: 'Danh sách <ul> có nhiều <li> được thêm động. Cách xử lý click gọn và vẫn chạy với <li> thêm sau là gì?'
  choices:
  - Gắn listener riêng cho từng <li> một lần khi tải trang
  - Gắn một listener ở <ul> cha và dùng event.target (event delegation, nhờ sự kiện nổi từ con lên cha)
  - Gắn listener ở <li> con và chờ sự kiện nổi xuống từ cha
  - Dùng CSS để bắt sự kiện click
  answer_index: 1
  explanation_md: 'Sự kiện nổi (bubbling) từ con lên cha, nên một listener ở cha bắt được click của mọi con, kể cả con thêm sau. Hướng nổi là con tới cha, không phải ngược lại.'
