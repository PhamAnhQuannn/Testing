subtopic_id: dsa.foundations.lib_toolkit
items:
- id: P1027
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Cần thêm và bỏ phần tử ở cả hai đầu của một hàng đợi, mỗi thao tác O(1). Chọn công cụ nào của Python?'
  choices:
  - '`collections.deque`'
  - '`list` với `insert(0, x)` và `pop()`'
  - '`set`'
  - '`heapq`'
  answer_index: 0
  explanation_md: '`deque` thêm/bỏ ở hai đầu đều O(1). `list.insert(0, x)` là O(n) vì phải dời mọi phần tử; `set` không có thứ tự; `heapq` chỉ lấy phần tử nhỏ nhất.'
- id: P1028
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    from collections import Counter, deque
    c = Counter("banana")
    print(sorted(c.items()))
    print(c.most_common(1))
    q = deque([1, 2, 3])
    q.appendleft(0)
    q.pop()
    print(q.popleft())
    print(list(q))
  expected_output: |-
    [('a', 3), ('b', 1), ('n', 2)]
    [('a', 3)]
    0
    [1, 2]
