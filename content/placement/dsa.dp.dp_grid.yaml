items:
- id: P1440
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong lưới chỉ được đi sang phải hoặc xuống dưới, số đường đi tới ô (r, c) được tính từ những ô nào?
  choices:
  - Ô phía trên (r-1, c) và ô bên trái (r, c-1)
  - Ô phía dưới (r+1, c) và ô bên phải (r, c+1)
  - Chỉ ô chéo (r-1, c-1)
  - Tất cả 8 ô xung quanh
  answer_index: 0
  explanation_md: Vì chỉ đi phải hoặc xuống, ô (r, c) chỉ có thể được tới từ ô ngay phía trên hoặc ngay bên trái, nên dp[r][c] = dp[r-1][c] + dp[r][c-1].
- id: P1441
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "dp = [[1, 1, 1], [1, 0, 1], [1, 1, 2]]\ndp[1][1] = dp[0][1] + dp[1][0]\ndp[2][2] = dp[1][2] + dp[2][1]\nprint(dp[1][1], dp[2][2])\nprint(sum(dp[1]))"
  expected_output: "2 2\n4"
