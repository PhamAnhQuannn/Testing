items:
- id: P1125
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: p95 latency = 800 ms nghĩa là gì?
  choices:
  - Trung bình mọi request mất 800 ms
  - Request chậm nhất luôn mất đúng 800 ms
  - 95% request nhanh hơn hoặc bằng 800 ms, 5% còn lại chậm hơn
  - 95% request bị lỗi sau 800 ms
  answer_index: 2
  explanation_md: 'p95 là percentile thứ 95: 95% request nhanh hơn hoặc bằng giá trị đó. Nó bắt được đuôi chậm mà trung bình che mất.'
- id: P1126
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    daily = 8_640_000
    qps = daily / 86400
    peak = qps * 3
    print(round(qps))
    print(round(peak))
  expected_output: |-
    100
    300
