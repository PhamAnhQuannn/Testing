items:
- id: P1570
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code in ra gì?'
  code: "board = [[\"X\", \".\", \"O\"], [\".\", \"X\", \".\"], [\"O\", \".\", \"X\"]]\nr, c = 2, 2\nprint(r == c and all(board[i][i] == \"X\" for i in range(3)), r + c == 2)"
  expected_output: "True False"
- id: P1571
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Sau mỗi nước đi trong tic-tac-toe, cách phát hiện thắng hiệu quả nhất là gì?
  choices:
  - Chỉ kiểm tra hàng, cột và chéo đi qua ô vừa đánh
  - Quét toàn bộ bàn tìm mọi đường thẳng
  - Chỉ kiểm tra khi bàn đã đầy
  - Đếm tổng số quân X và O
  answer_index: 0
  explanation_md: Đường thắng mới chỉ có thể đi qua ô vừa đánh, nên chỉ cần xét hàng r, cột c và hai chéo nếu ô nằm trên chúng; quét cả bàn là thừa.
- id: P1572
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong game cờ, mỗi loại quân có luật đi riêng. Thiết kế nào giúp thêm quân mới mà không sửa Game?
  choices:
  - Mỗi quân là class con của Piece cài can_move riêng (đa hình)
  - Một chuỗi if/elif theo tên quân trong Game
  - Sao chép Game cho từng loại quân
  - Lưu luật đi của mọi quân trong biến toàn cục
  answer_index: 0
  explanation_md: Đa hình đặt luật vào từng class quân; Game chỉ gọi piece.can_move, nên quân mới là một class mới và Game giữ nguyên.
