# Placement-only items (P0 mcq / P1 read_code). Validated by content/schemas/placement.schema.json.
# read_code expected_output = real stdout of `code` (computed by running it, never typed).
subtopic_id: dsa.trees.tree_basics
items:
- id: P935
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Tính chất của Binary Search Tree (BST) là gì?
  choices:
  - Mọi node con nhỏ hơn node cha
  - Với mỗi node, mọi giá trị ở cây con trái nhỏ hơn node và mọi giá trị ở cây con
    phải lớn hơn node
  - Cây luôn cân bằng
  - Chỉ node lá được sắp xếp
  answer_index: 1
  explanation_md: Tính chất áp dụng cho toàn bộ cây con, không chỉ con trực tiếp.
- id: P936
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Duyệt in-order một BST cho ra kết quả gì?
  choices:
  - Các giá trị theo thứ tự giảm dần
  - Các giá trị theo thứ tự tăng dần
  - Các giá trị theo từng tầng
  - Thứ tự ngẫu nhiên
  answer_index: 1
  explanation_md: In-order là trái, node, phải; với BST nó sinh dãy tăng dần.
- id: P937
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Một cây nhị phân có n node, trường hợp xấu nhất chiều cao có thể là bao
    nhiêu?
  choices:
  - log n
  - n (cây suy biến thành dạng danh sách)
  - n/2
  - Luôn là log n
  answer_index: 1
  explanation_md: Cây không tự cân bằng (ví dụ chèn dãy đã sắp xếp vào BST) có thể
    thành một chuỗi, chiều cao n.
- id: P938
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "class T:\n    def __init__(self, v, l=None, r=None):\n        self.v, self.l,\
    \ self.r = v, l, r\n\nroot = T(4, T(2, T(1), T(3)), T(6, None, T(7)))\n\ndef inorder(n):\n\
    \    return inorder(n.l) + [n.v] + inorder(n.r) if n else []\n\ndef preorder(n):\n\
    \    return [n.v] + preorder(n.l) + preorder(n.r) if n else []\n\nprint(inorder(root))\n\
    print(preorder(root))"
  expected_output: '[1, 2, 3, 4, 6, 7]

    [4, 2, 1, 3, 6, 7]'
- id: P939
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "class T:\n    def __init__(self, v, l=None, r=None):\n        self.v, self.l,\
    \ self.r = v, l, r\n\nroot = T(1, T(2, T(4, T(8))), T(3))\n\ndef height(n):\n\
    \    return 0 if n is None else 1 + max(height(n.l), height(n.r))\n\nprint(height(root),\
    \ height(root.l), height(root.r))\nprint(height(None))"
  expected_output: '4 3 1

    0'
