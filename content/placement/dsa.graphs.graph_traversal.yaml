subtopic_id: dsa.graphs.graph_traversal
items:
- id: P1414
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Vì sao khi duyệt đồ thị (graph) bằng DFS hoặc BFS cần một tập visited?
  choices:
  - Để đồ thị được sắp xếp theo thứ tự tăng dần
  - Để không thăm một đỉnh nhiều lần và không lặp vô hạn khi có chu trình
  - Để BFS chạy nhanh hơn DFS
  - Chỉ cần khi đồ thị có trọng số
  answer_index: 1
  explanation_md: Đồ thị có thể có chu trình, nên nếu không đánh dấu đỉnh đã thăm thì traversal có thể lặp vô hạn; visited cũng giữ độ phức tạp ở O(V + E).
- id: P1415
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "adj = [[1, 2], [3], [3], []]\nseen = set()\nstack = [0]\norder = []\nwhile stack:\n    u = stack.pop()\n    if u in seen:\n        continue\n    seen.add(u)\n    order.append(u)\n    for v in adj[u]:\n        stack.append(v)\nprint(order)\nprint(len(seen))"
  expected_output: "[0, 2, 3, 1]\n4"
