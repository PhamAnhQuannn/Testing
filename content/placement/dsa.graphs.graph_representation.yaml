items:
- id: P1412
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Đồ thị thưa có V đỉnh và E cạnh (E rất nhỏ so với V^2). Adjacency list tốn bao nhiêu bộ nhớ?
  choices:
  - O(V^2)
  - O(V + E)
  - O(E^2)
  - O(1)
  answer_index: 1
  explanation_md: Adjacency list lưu mỗi đỉnh một list và mỗi cạnh một (hoặc hai) phần tử, nên O(V + E); matrix mới tốn O(V^2).
- id: P1413
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "edges = [[0, 1], [1, 2], [1, 3]]\nadj = [[] for _ in range(4)]\nfor a, b in edges:\n    adj[a].append(b)\n    adj[b].append(a)\nprint(adj)\nprint([len(x) for x in adj])"
  expected_output: "[[1], [0, 2, 3], [1], [1]]\n[1, 3, 1, 1]"
