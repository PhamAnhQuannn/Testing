items:
- id: P1502
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trợ lý AI trả về một hàm chạy đúng trên ví dụ của đề. Việc hợp lý nhất cần làm trước khi dùng nó là gì?
  choices:
  - Tự chạy thử các input biên (rỗng, 0, số âm) và đọc hiểu từng dòng
  - Nộp ngay vì ví dụ đã đúng
  - Hỏi lại AI "code này đúng chưa" rồi tin câu trả lời
  - Xoá hết test để code chạy nhanh hơn
  answer_index: 0
  explanation_md: Code AI thường đúng ở ví dụ đẹp nhưng sai ở biên; người nhận code phải tự kiểm chứng và hiểu từng dòng.
- id: P1503
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code do AI viết dưới đây in ra gì? Ghi đúng từng dòng.'
  code: "def find_max(nums):\n    best = 0\n    for x in nums:\n        if x > best:\n            best = x\n    return best\n\nprint(find_max([3, 9, 2]), find_max([-5, -2, -8]))"
  expected_output: '9 0'
