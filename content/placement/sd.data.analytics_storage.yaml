subtopic_id: sd.data.analytics_storage
items:
- id: P1210
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Vì sao truy vấn analytics (tổng hợp trên hàng tỷ dòng) thường chạy trên columnar/OLAP warehouse thay vì OLTP database?"
  choices:
  - "OLTP có transaction nên luôn nhanh hơn cho aggregate"
  - "Column store lưu mỗi dòng liền nhau để đọc cả bản ghi nhanh"
  - "Column store chỉ đọc các cột cần thiết và nén tốt nên scan và aggregate lớn rất hiệu quả"
  - "Warehouse không cho phép truy vấn SQL"
  answer_index: 2
  explanation_md: "Column store chỉ đọc các cột cần thiết và nén tốt nên aggregate cực nhanh; OLTP row store tối ưu cho đọc/ghi từng bản ghi và transaction ngắn."
