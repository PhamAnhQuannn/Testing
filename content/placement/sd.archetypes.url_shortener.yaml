subtopic_id: sd.archetypes.url_shortener
items:
- id: P1160
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Khi thiết kế URL shortener, cách nào tạo short key duy nhất mà không va chạm và scale tốt nhất?"
  choices:
  - "Dùng một counter phân tán (hoặc ID generator) rồi mã hoá base62 thành key"
  - "Lấy ngẫu nhiên 2 ký tự và hy vọng không trùng"
  - "Dùng nguyên URL gốc làm key"
  - "Dùng timestamp theo giây làm key"
  answer_index: 0
  explanation_md: "Counter/ID duy nhất rồi base62 đảm bảo không trùng và key ngắn. Random ngắn dễ collision, URL gốc dài, timestamp giây trùng khi nhiều request cùng lúc."
