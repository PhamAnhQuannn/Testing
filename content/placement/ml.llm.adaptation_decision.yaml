subtopic_id: ml.llm.adaptation_decision
items:
- id: P1114
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: LLM trả lời sai vì thiếu thông tin nội bộ của công ty, và tài liệu này thay đổi hằng tuần. Hướng xử lý phù hợp nhất ban đầu là gì?
  choices:
  - Fine-tune LLM mỗi tuần trên tài liệu mới
  - Chỉ giảm temperature về 0
  - Dùng RAG để retrieve tài liệu mới nhất và đưa vào prompt
  - Tự huấn luyện một LLM mới từ đầu
  answer_index: 2
  explanation_md: Thiếu tri thức hay thay đổi thì dùng RAG. Fine-tune hợp với việc thay đổi hành vi, giọng văn hoặc định dạng, không phải nạp tri thức cập nhật.
