items:
- id: P1071
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong Python, điều nào đúng về `str`?
  choices:
  - Có thể gán `s[0] = 'x'` để đổi ký tự
  - '`str` là immutable; nối chuỗi trong vòng lặp bằng `+=` có thể tốn O(n) mỗi lần'
  - '`len(s)` tốn O(n)'
  - '`s.split()` sửa trực tiếp `s`'
  answer_index: 1
  explanation_md: 'String immutable: mọi thay đổi tạo chuỗi mới. Muốn build nhiều lần nên gom vào list rồi `''''.join`.'
- id: P1072
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    s = 'Hello, World'
    print(s[7:])
    print(s.upper())
    parts = s.split(', ')
    print(parts)
    print('-'.join(parts))
    print(s[::-1])
    print(s.lower().count('l'))
  expected_output: |-
    World
    HELLO, WORLD
    ['Hello', 'World']
    Hello-World
    dlroW ,olleH
    3
