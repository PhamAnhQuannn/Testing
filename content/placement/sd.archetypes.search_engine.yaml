subtopic_id: sd.archetypes.search_engine
items:
- id: P1173
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Cấu trúc dữ liệu cốt lõi giúp search engine tìm nhanh các tài liệu chứa từ khoá là gì?"
  choices:
  - "Quét toàn bộ tài liệu mỗi truy vấn"
  - "B-tree theo ID tài liệu"
  - "Hash của toàn bộ nội dung tài liệu"
  - "Inverted index: map từ term sang posting list các document, sau đó xếp hạng bằng TF-IDF/BM25"
  answer_index: 3
  explanation_md: "Inverted index cho tra cứu term tới danh sách document rất nhanh; ranking (TF-IDF/BM25, PageRank) sắp xếp kết quả. Quét toàn bộ không scale."
