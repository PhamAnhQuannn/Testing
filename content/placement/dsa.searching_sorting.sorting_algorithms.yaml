subtopic_id: dsa.searching_sorting.sorting_algorithms
items:
- id: P1077
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Một thuật toán sắp xếp gọi là stable khi nào?
  choices:
  - Luôn chạy trong O(n log n)
  - Không dùng thêm bộ nhớ phụ
  - Các phần tử bằng nhau giữ nguyên thứ tự tương đối ban đầu
  - Chỉ hoạt động trên mảng đã gần sắp xếp
  answer_index: 2
  explanation_md: Stable sort giữ thứ tự ban đầu của các phần tử có key bằng nhau. `sorted()` của Python là stable (Timsort).
- id: P1078
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    pairs = [('b', 2), ('a', 2), ('c', 1), ('d', 1)]
    print(sorted(pairs, key=lambda p: p[1]))
    print(sorted([5, 2, 9, 1], reverse=True))
    a = [4, 3, 2, 1]
    for i in range(len(a) - 1):
        if a[i] > a[i + 1]:
            a[i], a[i + 1] = a[i + 1], a[i]
    print(a)
  expected_output: |-
    [('c', 1), ('d', 1), ('b', 2), ('a', 2)]
    [9, 5, 2, 1]
    [3, 2, 1, 4]
