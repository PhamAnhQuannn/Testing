- id: P1458
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Sweep line đếm số cuộc họp chồng nhau. Khi một sự kiện kết thúc và một sự kiện bắt đầu cùng time (khoảng nửa mở), nên xử lý thế nào?
  choices:
  - Xử lý kết thúc (-1) trước, rồi bắt đầu (+1)
  - Xử lý bắt đầu (+1) trước, rồi kết thúc (-1)
  - Bỏ cả hai sự kiện
  - Thứ tự nào cũng cho cùng kết quả
  answer_index: 0
  explanation_md: Khoảng nửa mở nên điểm kết thúc không chiếm chỗ; xử lý +1 trước sẽ đếm dư một cuộc họp chồng nhau.
- id: P1459
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì?'
  code: "ev = [(0, 1), (4, -1), (4, 1), (9, -1)]\ncur = 0\nres = []\nfor t, d in sorted(ev):\n    cur += d\n    res.append(cur)\nprint(res)"
  expected_output: '[1, 0, 1, 0]'
