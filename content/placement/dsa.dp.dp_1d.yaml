  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: House Robber không cho lấy hai nhà kề nhau. Với dp[i] là tiền lớn nhất xét i + 1 nhà đầu, công thức chuyển nào đúng?
  choices:
  - dp[i] = max(dp[i-1], dp[i-2] + nums[i])
  - dp[i] = dp[i-1] + nums[i]
  - dp[i] = max(dp[i-1], dp[i-2]) + nums[i]
  - dp[i] = min(dp[i-1], dp[i-2] + nums[i])
  answer_index: 0
  explanation_md: Bỏ nhà i giữ dp[i-1]; lấy nhà i thì bỏ nhà i-1 nên cộng vào dp[i-2]. Chọn max của hai lựa chọn.
- id: P1435
  difficulty: 1
  type: read_code
