  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "s = \"226\"\na, b = 1, 1\nfor i in range(1, len(s)):\n    c = b if s[i] != \"0\" else 0\n    if 10 <= int(s[i - 1:i + 1]) <= 26:\n        c += a\n    a, b = b, c\nprint(b)\nprint(a)"
