subtopic_id: py.functions.functools_cache
items:
- id: P1366
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Vì sao không thể gọi hàm có `@lru_cache` với đối số là một `list`?'
  choices:
  - Vì list không hashable nên không dùng được làm key của cache
  - Vì list quá dài để lưu vào cache
  - Vì `lru_cache` chỉ nhận đối số kiểu số nguyên
  - Vì list luôn được truyền theo giá trị nên cache không hoạt động
  answer_index: 0
  explanation_md: '`lru_cache` lưu kết quả trong dict với key dựng từ đối số, nên đối số phải hashable. List có thể bị sửa nên không hashable và gây `TypeError`; hãy đổi sang `tuple`.'
- id: P1367
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    from functools import lru_cache, partial

    @lru_cache(maxsize=None)
    def f(t):
        return len(t)

    try:
        f([1, 2])
    except TypeError:
        print("err")
    print(f((1, 2)))
    print(f((1, 2)))
    print(f.cache_info().hits)
    to_int = partial(int, base=2)
    print(to_int("101"))
  expected_output: "err\n2\n2\n1\n5"
