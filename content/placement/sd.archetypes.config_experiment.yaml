subtopic_id: sd.archetypes.config_experiment
items:
- id: P1165
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Trong A/B testing, làm sao đảm bảo một user luôn thấy cùng một variant qua các request mà không phải lưu assignment cho từng user?"
  choices:
  - "Random mỗi request"
  - "Gán variant theo giờ trong ngày"
  - "Hash(user_id + experiment_id) rồi chia modulo thành bucket để quyết định variant"
  - "Dùng variant của user đăng nhập trước đó"
  answer_index: 2
  explanation_md: "Hash ổn định của user_id kết hợp experiment_id luôn ra cùng bucket, nên assignment nhất quán, deterministic và không cần lưu. Random mỗi request làm user đổi variant."
