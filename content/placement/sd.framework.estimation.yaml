- id: P1236
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Mục đích của back-of-envelope estimation trong system design là gì?"
  choices:
  - "Ước lượng nhanh QPS, storage, bandwidth để biết quy mô và chọn thiết kế phù hợp"
  - "Tính chính xác từng byte chi phí"
  - "Thay thế việc vẽ kiến trúc"
  - "Chỉ để đo thời gian lập trình"
  answer_index: 0
  explanation_md: "Ước lượng thô (QPS, dung lượng, băng thông) cho biết cần shard/cache hay không, dùng số tròn và giả định rõ ràng."
