# Concept-hub placement items (level-1 mcq, level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: eng.workflow.git_basics
items:
- id: P1864
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - branch-va-head-nhanh-la-con-tro-toi-mot
  prompt_md: Trong Git, phát biểu nào về branch và HEAD là đúng?
  choices:
  - Branch là bản sao đầy đủ của thư mục còn HEAD là commit đầu tiên
  - Branch là con trỏ tới một commit còn HEAD là con trỏ cho biết bạn đang đứng ở đâu
  - Branch là một remote còn HEAD là tên của nhánh chính
  - Branch chỉ tồn tại trên GitHub, không có trên máy local
  answer_index: 1
  explanation_md: Branch và HEAD đều là con trỏ nên tạo nhánh rất rẻ; HEAD thường trỏ vào nhánh hiện tại.
- id: P1865
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - merge-vs-rebase-reset-vs-revert-merge-gi
  prompt_md: Một commit sai đã được push lên nhánh chung và đồng đội đã kéo về. Cách hoàn tác nào an toàn nhất?
  choices:
  - git reset --hard về commit trước đó rồi force-push, vì lịch sử sạch hơn
  - git rebase nhánh chung lên commit cũ để xóa commit sai
  - git revert commit sai để tạo commit mới hoàn tác nó, không viết lại lịch sử
  - Xóa repo local và clone lại
  answer_index: 2
  explanation_md: 'revert tạo commit mới làm ngược commit cũ nên lịch sử không bị viết lại và đồng đội kéo về bình thường. reset/rebase viết lại lịch sử, buộc force-push và gây lệch lịch sử trên nhánh đã chia sẻ.'
