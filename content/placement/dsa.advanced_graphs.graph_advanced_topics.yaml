items:
- id: P1430
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong DFS Tarjan trên đồ thị vô hướng, cạnh cây (u, v) với v là con của u là bridge khi nào?
  choices:
  - low[v] > disc[u]
  - low[v] < disc[u]
  - disc[v] == disc[u]
  - v có nhiều hơn một hàng xóm
  answer_index: 0
  explanation_md: low[v] > disc[u] nghĩa là cây con của v không có cạnh ngược lên u hay tổ tiên, nên xóa (u, v) làm đồ thị tách ra.
- id: P1431
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "adj = [[1, 2], [0, 2], [0, 1, 3], [2]]\ndisc = [-1] * 4\nlow = [0] * 4\nt = 0\n\ndef dfs(u, p):\n    global t\n    disc[u] = low[u] = t\n    t += 1\n    for v in adj[u]:\n        if v == p:\n            continue\n        if disc[v] == -1:\n            dfs(v, u)\n            low[u] = min(low[u], low[v])\n        else:\n            low[u] = min(low[u], disc[v])\n\ndfs(3, -1)\nprint(disc)\nprint(low)"
  expected_output: '[2, 3, 1, 0]

    [1, 1, 1, 0]'
