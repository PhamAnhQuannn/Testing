subtopic_id: dsa.dp.dp_strings
items:
- id: P1438
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong bảng DP của LCS hai chuỗi a và b, hai ký tự a[i-1] và b[j-1] bằng nhau. dp[i][j] được tính thế nào?
  choices:
  - dp[i-1][j-1] + 1
  - max(dp[i-1][j], dp[i][j-1])
  - 1 + min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1])
  - dp[i-1][j] + dp[i][j-1]
  answer_index: 0
  explanation_md: Ký tự khớp được thêm vào dãy con chung của hai prefix ngắn hơn một ký tự, tức ô chéo cộng 1.
- id: P1439
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "a, b = \"kit\", \"kat\"\nprev = list(range(len(b) + 1))\nfor i in range(1, len(a) + 1):\n    cur = [i] + [0] * len(b)\n    for j in range(1, len(b) + 1):\n        if a[i - 1] == b[j - 1]:\n            cur[j] = prev[j - 1]\n        else:\n            cur[j] = 1 + min(prev[j], cur[j - 1], prev[j - 1])\n    prev = cur\nprint(prev)\nprint(prev[-1])"
  expected_output: '[3, 2, 2, 1]

    1'
