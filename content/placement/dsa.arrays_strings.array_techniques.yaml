# Placement-only items (P0 mcq / P1 read_code).
subtopic_id: dsa.arrays_strings.array_techniques
items:
- id: P1075
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Kỹ thuật two-pointer đảo mảng tại chỗ (in-place) dùng bao nhiêu bộ nhớ phụ?
  choices:
  - O(n)
  - O(log n)
  - O(1)
  - O(n^2)
  answer_index: 2
  explanation_md: Hai con trỏ `i`, `j` hoán đổi phần tử từ hai đầu vào giữa, chỉ cần biến tạm nên extra space O(1).
- id: P1076
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    a = [1, 2, 3, 4, 5]
    i, j = 0, len(a) - 1
    while i < j:
        a[i], a[j] = a[j], a[i]
        i += 1
        j -= 1
    print(a)
    b = [0, 1, 0, 2, 0]
    k = 0
    for x in b:
        if x != 0:
            b[k] = x
            k += 1
    print(k, b[:k])
  expected_output: |-
    [5, 4, 3, 2, 1]
    2 [1, 2]
