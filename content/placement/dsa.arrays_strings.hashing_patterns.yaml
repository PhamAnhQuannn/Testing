subtopic_id: dsa.arrays_strings.hashing_patterns
items:
- id: P1067
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Để đếm số lần xuất hiện của mỗi phần tử trong mảng trong O(n), cấu trúc nào phù hợp nhất?
  choices:
  - '`dict` map phần tử -> số lần'
  - '`set` các phần tử'
  - Sort rồi binary search từng phần tử
  - Hai vòng for lồng nhau, không cần cấu trúc phụ
  answer_index: 0
  explanation_md: Frequency counting cần lưu một count cho mỗi key nên dùng `dict` (hoặc Counter); duyệt một lần là O(n).
- id: P1068
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    words = ['a', 'b', 'a', 'c', 'b', 'a']
    cnt = {}
    for w in words:
        cnt[w] = cnt.get(w, 0) + 1
    print(sorted(cnt.items()))
    print(max(cnt.values()))
    print(sorted(set(words)))
  expected_output: |-
    [('a', 3), ('b', 2), ('c', 1)]
    3
    ['a', 'b', 'c']
