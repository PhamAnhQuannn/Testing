subtopic_id: lld.problems.vending_atm
items:
- id: P1555
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Máy bán hàng (vending machine) thường được mô hình bằng mẫu nào?
  choices:
  - State machine / State pattern, mỗi trạng thái (chờ tiền, đã bỏ tiền) là một class quyết định hành vi
  - Singleton, vì chỉ có một máy
  - Prototype, để sao chép sản phẩm
  - Adapter, để đổi interface của kho
  answer_index: 0
  explanation_md: Máy có các giai đoạn và chuyển giai đoạn khi có sự kiện (bỏ tiền, chọn món, hủy); State pattern chia hành vi theo từng state.
- id: P1556
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Nhả hàng (hoặc tiền ATM) bị lỗi giữa chừng. Theo transaction atomicity, nên làm gì?
  choices:
  - Không trừ kho/số dư (hoặc hoàn tác) và chuyển sang trạng thái lỗi
  - Vẫn trừ số dư, khách khiếu nại sau
  - Trừ gấp đôi để bù lỗi
  - Bỏ qua lỗi và coi như thành công
  answer_index: 0
  explanation_md: Giao dịch hoặc xong hết hoặc không đổi gì; chỉ trừ sau khi nhả thành công.
- id: P1557
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code in ra gì?'
  code: "stock = {\"A1\": 1}\nprice = {\"A1\": 10}\nbalance = 25\nif stock[\"A1\"] > 0 and balance >= price[\"A1\"]:\n    stock[\"A1\"] -= 1\n    print(balance - price[\"A1\"])\nelse:\n    print(-1)\nprint(stock[\"A1\"])"
  expected_output: "15\n0"
