items:
- id: P1886
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - sql-injection-ke-xau-nhet-lenh-sql-vao-o
  prompt_md: Cách phòng SQL injection đúng và đáng tin cậy nhất là gì?
  choices:
  - Dùng parameterized query (prepared statement), truyền giá trị tách khỏi câu SQL
  - Tự escape vài ký tự bằng tay rồi ghép chuỗi SQL
  - Chỉ kiểm tra input ở phía trình duyệt
  - Ẩn thông báo lỗi database
  answer_index: 0
  explanation_md: 'Parameterized query tách lệnh và dữ liệu nên giá trị không bị hiểu thành lệnh. Escape tay dễ sót, còn kiểm tra ở trình duyệt có thể bị bỏ qua.'
- id: P1887
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - idor-doi-id-tren-url-xem-duoc-du-lieu-ng
  prompt_md: 'Endpoint GET /orders/{id} chỉ kiểm tra người dùng đã đăng nhập; đổi id trên URL thì xem được đơn của người khác. Đây là lỗi gì và cách sửa phù hợp nhất?'
  choices:
  - XSS; escape HTML khi hiển thị
  - CSRF; thêm anti-CSRF token vào form
  - IDOR (broken access control); server kiểm tra đơn thuộc về người dùng hiện tại trên mỗi yêu cầu
  - SSRF; chặn các địa chỉ nội bộ
  answer_index: 2
  explanation_md: 'Server không kiểm quyền trên từng đối tượng nên là IDOR. Cách sửa là kiểm chủ sở hữu phía server ở mọi yêu cầu, không tin ID từ client.'
