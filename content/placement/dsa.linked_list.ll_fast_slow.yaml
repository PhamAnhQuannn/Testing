subtopic_id: dsa.linked_list.ll_fast_slow
items:
- id: P1390
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong thuật toán Floyd phát hiện chu trình, `slow` đi 1 bước và `fast` đi 2 bước mỗi lượt. Khi list có chu trình, điều gì xảy ra?
  choices:
  - '`fast` chạm `None` trước'
  - '`fast` và `slow` cuối cùng gặp nhau trong vòng'
  - '`slow` luôn vượt qua `fast`'
  - 'Hai con trỏ không bao giờ gặp nhau'
  answer_index: 1
  explanation_md: Khi đã ở trong vòng, `fast` đuổi `slow` với tốc độ chênh 1 node mỗi lượt nên chắc chắn gặp nhau. Không có chu trình thì `fast` mới chạm `None`.
- id: P1391
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "a = [1, 2, 3, 4, 5]\nslow = fast = 0\nwhile fast + 1 < len(a):\n    slow += 1\n    fast += 2\nprint(slow, fast, a[slow])"
  expected_output: 2 4 3
