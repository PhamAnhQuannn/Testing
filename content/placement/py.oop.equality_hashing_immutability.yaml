subtopic_id: py.oop.equality_hashing_immutability
items:
- id: P1356
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Class chỉ định nghĩa `__eq__`, không định nghĩa `__hash__`. Bỏ object của nó vào `set` thì sao?
  choices:
  - Chạy bình thường, hash dựa trên danh tính như cũ
  - '`TypeError: unhashable type`, vì `__hash__` bị đặt thành `None`'
  - Python tự sinh `__hash__` từ các thuộc tính
  - Chạy được nhưng set luôn rỗng
  answer_index: 1
  explanation_md: Định nghĩa `__eq__` mà không có `__hash__` làm `__hash__ = None`, nên object không hashable.
- id: P1357
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    from dataclasses import dataclass

    @dataclass(frozen=True)
    class T:
        n: int

    print(T(1) == T(1), len({T(1), T(1), T(2)}))
    try:
        T(1).n = 5
    except Exception as e:
        print(type(e).__name__)
  expected_output: |-
    True 2
    FrozenInstanceError
