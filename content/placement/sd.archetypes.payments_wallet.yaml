subtopic_id: sd.archetypes.payments_wallet
items:
- id: P1177
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Client retry request thanh toán do timeout. Làm sao tránh trừ tiền hai lần và giữ số dư nhất quán?"
  choices:
  - "Không retry bao giờ"
  - "Cho phép trừ tiền mỗi lần nhận request"
  - "Cập nhật số dư bằng cách đọc rồi ghi không dùng lock"
  - "Idempotency key cho mỗi giao dịch kèm ledger double-entry ghi trong một transaction"
  answer_index: 3
  explanation_md: "Idempotency key khiến retry trả lại kết quả cũ thay vì trừ tiền lại; ledger double-entry trong một transaction giữ tổng ghi nợ bằng tổng ghi có để audit được."
