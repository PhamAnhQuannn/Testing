subtopic_id: ml.rag_agents.multi_step_workflows
items:
- id: P1113
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Workflow kiểu prompt chaining khác gì với agent tự chủ?
  choices:
  - Prompt chaining do LLM tự quyết số bước và tool, còn agent thì đi theo kịch bản cố định
  - Prompt chaining chia việc thành các lần gọi LLM theo luồng cố định do ta thiết kế, còn agent tự quyết bước tiếp theo lúc chạy
  - Hai khái niệm hoàn toàn giống nhau
  - Prompt chaining chỉ dùng được với một LLM duy nhất và không có state
  answer_index: 1
  explanation_md: Workflow có luồng định trước (dễ dự đoán, dễ debug); agent linh hoạt hơn nhưng khó kiểm soát hơn. Nếu luồng đã rõ thì ưu tiên workflow.
