subtopic_id: ml.llm.hallucination_reasoning
items:
- id: P1085
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Hallucination của LLM là gì?'
  choices:
  - 'Model từ chối trả lời mọi câu hỏi'
  - 'Model sinh nội dung trôi chảy, nghe hợp lý nhưng sai hoặc bịa'
  - 'Model chạy quá chậm do thiếu GPU'
  - 'Model lặp lại đúng prompt của người dùng'
  answer_index: 1
  explanation_md: 'Hallucination là khi model sinh nội dung trôi chảy, nghe hợp lý nhưng sai sự thật hoặc bịa ra; giảm bằng grounding (ví dụ RAG) và kiểm chứng.'
