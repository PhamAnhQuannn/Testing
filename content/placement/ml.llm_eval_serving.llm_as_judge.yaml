subtopic_id: ml.llm_eval_serving.llm_as_judge
items:
- id: P1128
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong LLM-as-judge, vì sao cần đo độ đồng thuận (agreement, ví dụ kappa) giữa judge và người chấm?
  choices:
  - Để judge chạy nhanh hơn
  - Để biết judge có chấm giống người hay không trước khi tin điểm của nó
  - Để loại bỏ hoàn toàn nhu cầu có rubric
  - Để chắc chắn judge không bao giờ thiên vị
  answer_index: 1
  explanation_md: Judge chỉ đáng tin khi điểm của nó khớp người chấm trên một mẫu có nhãn. Judge vẫn có thể thiên vị (ví dụ thích câu dài, thiên vị vị trí).
