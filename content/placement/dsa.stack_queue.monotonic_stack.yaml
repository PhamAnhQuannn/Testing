subtopic_id: dsa.stack_queue.monotonic_stack
items:
- id: P1392
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Khi tìm "phần tử lớn hơn kế tiếp" bằng monotonic stack, vì sao tổng thời gian là O(n) dù có vòng `while` lồng trong vòng `for`?'
  choices:
  - 'Mỗi phần tử được push đúng một lần và pop tối đa một lần'
  - 'Vì `while` chỉ chạy tối đa 2 lần mỗi bước'
  - 'Vì mảng đã được sắp xếp'
  - 'Vì stack không bao giờ quá 2 phần tử'
  answer_index: 0
  explanation_md: 'Tổng số lần pop không thể vượt quá tổng số lần push là n, nên tổng công việc của mọi vòng `while` cộng lại là O(n) (amortised).'
- id: P1393
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    nums = [2, 7, 4, 3, 8]
    res = [-1] * len(nums)
    st = []
    for i, x in enumerate(nums):
        while st and nums[st[-1]] < x:
            res[st.pop()] = x
        st.append(i)
    print(res)
    print(st)
  expected_output: |-
    [7, 8, 8, 8, -1]
    [4]
