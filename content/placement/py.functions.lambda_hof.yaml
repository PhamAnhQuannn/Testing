subtopic_id: py.functions.lambda_hof
items:
- id: P1009
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: '`list(map(lambda x: x + 1, [1, 2, 3]))` trả về gì?'
  choices:
  - '`[2, 3, 4]`'
  - '`[1, 2, 3]`'
  - '`[3, 4, 5]`'
  - '`<map object>` (không bọc `list`)'
  answer_index: 0
  explanation_md: '`map` áp dụng lambda lên từng phần tử; `list(...)` gom kết quả thành `[2, 3, 4]`. Bản thân `map` trả về iterator lười.'
- id: P1010
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    nums = [1, 2, 3, 4, 5, 6]
    sq = list(map(lambda x: x * x, nums))
    ev = list(filter(lambda x: x % 2 == 0, sq))
    print(sq)
    print(ev)
    words = ["pear", "fig", "banana"]
    print(sorted(words, key=lambda w: len(w)))
    double = lambda n: n * 2
    print(double(double(3)))
  expected_output: |-
    [1, 4, 9, 16, 25, 36]
    [4, 16, 36]
    ['fig', 'pear', 'banana']
    12
