  prompt_md: '`list(range(2, 10, 3))` trả về gì?'
  choices:
  - '`[2, 5, 8]`'
  - '`[2, 5, 8, 11]`'
  - '`[3, 6, 9]`'
  - '`[2, 5]`'
  answer_index: 0
  explanation_md: '`range(start, stop, step)` bắt đầu từ 2, mỗi lần cộng 3 và dừng trước khi tới 10: 2, 5, 8.'
- id: P981
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: |-
    Đoạn code sau in ra những số nào?

    ```python
    for i in range(5):
        if i == 2:
            continue
        if i == 4:
            break
        print(i)
    ```
  choices:
  - '`0`, `1`, `3`'
  - '`0`, `1`, `2`, `3`'
  - '`0`, `1`'
  - '`0`, `1`, `3`, `4`'
  answer_index: 0
  explanation_md: '`continue` bỏ qua `i = 2`; `break` dừng vòng lặp khi `i = 4` (trước khi in). Vậy in 0, 1, 3.'
- id: P982
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    for i in range(1, 4):
        print("*" * i)
    total = 0
    for n in range(1, 10, 2):
        total += n
    print(total)
    for n in [2, 4, 6]:
        if n % 5 == 0:
            print("found")
            break
    else:
        print("none")
  expected_output: |-
    *
    **
    ***
    25
    none
