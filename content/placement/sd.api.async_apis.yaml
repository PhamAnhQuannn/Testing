subtopic_id: sd.api.async_apis
items:
- id: P1251
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Một API xuất báo cáo mất vài phút. Thiết kế phù hợp nhất là gì?'
  choices:
  - 'Giữ kết nối HTTP mở đến khi xong, không timeout'
  - 'Trả 200 OK rỗng và bỏ qua kết quả'
  - 'Trả 202 Accepted kèm job id; client polling endpoint trạng thái hoặc nhận webhook khi xong'
  - 'Bắt client gọi lại liên tục mỗi mili-giây'
  answer_index: 2
  explanation_md: 'Với job dài: trả 202 Accepted cùng job id, rồi client polling endpoint trạng thái hoặc nhận webhook/callback khi xong, thay vì giữ kết nối HTTP.'
