  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Cho `a = [10, 20, 30, 40]`. `a[1:3]` trả về gì?'
  choices:
  - '`[20, 30]`'
  - '`[20, 30, 40]`'
  - '`[10, 20, 30]`'
  - '`[10, 20]`'
  answer_index: 0
  explanation_md: 'Slicing `a[start:stop]` lấy từ index `start` tới trước `stop` (index bắt đầu từ 0): index 1 và 2 là 20, 30.'
- id: P984
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    a = [3, 1, 2]
    a.append(5)
    a.insert(0, 9)
    x = a.pop()
    a.sort()
    print(a)
    print(x, len(a))
    print(a[-1], a[1:])
    b = a.sort()
    print(b)
  expected_output: |-
    [1, 2, 3, 9]
    5 4
    9 [2, 3, 9]
    None
