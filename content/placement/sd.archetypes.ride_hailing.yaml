subtopic_id: sd.archetypes.ride_hailing
items:
- id: P1194
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Ride-hailing cần tìm tài xế gần hành khách trong vài trăm ms khi hàng trăm nghìn tài xế liên tục cập nhật vị trí. Cấu trúc dữ liệu/dịch vụ cốt lõi?
  choices:
  - Quét toàn bộ bảng tài xế tính khoảng cách Haversine
  - Lưu vị trí dạng text rồi LIKE trong SQL
  - Sắp xếp tài xế theo tên
  - Geospatial index (geohash/quadtree/S2) trong bộ nhớ để truy vấn các ô lân cận
  answer_index: 3
  explanation_md: Chia bản đồ thành ô (geohash/quadtree/S2) để chỉ tìm trong ô và ô kề, thay vì quét toàn bộ; cập nhật vị trí ghi vào store nhanh như Redis.
