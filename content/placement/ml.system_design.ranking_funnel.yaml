subtopic_id: ml.system_design.ranking_funnel
items:
- id: P1152
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong ranking funnel nhiều tầng, thứ tự các tầng và mục đích đúng là gì?
  choices:
  - Candidate generation (rẻ, recall cao, số lượng lớn) -> ranking (model nặng hơn, thu hẹp) -> re-ranking (luật, đa dạng, business)
  - Ranking nặng trên toàn bộ item -> candidate generation -> lọc
  - Re-ranking trước rồi mới tới candidate generation
  - Chỉ dùng một model nặng duy nhất cho mọi item để đạt độ chính xác cao nhất
  answer_index: 0
  explanation_md: 'Funnel giảm dần số item: tầng đầu rẻ và ưu tiên recall, tầng sau dùng model đắt hơn trên ít item hơn để tối ưu precision, rồi re-rank theo ràng buộc.'
