- id: P1442
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong bài mua bán cổ phiếu có cooldown (bán xong nghỉ 1 ngày mới được mua), mũi tên "mua" được phép đi từ trạng thái nào?
  choices:
  - rest (không cầm cổ phiếu và không bị cấm mua)
  - sold (vừa bán hôm qua)
  - Cả rest và sold như nhau
  - Chỉ từ hold
  answer_index: 0
  explanation_md: Sau khi bán, ngày kế tiếp bị cấm mua, nên mũi tên mua chỉ lấy từ rest; sold phải qua một ngày rest trước.
- id: P1443
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "prices = [3, 1, 4, 1, 5]\nhold, cash = -prices[0], 0\nfor p in prices[1:]:\n    hold, cash = max(hold, cash - p), max(cash, hold + p)\nprint(hold, cash)"
  expected_output: '2 7'
