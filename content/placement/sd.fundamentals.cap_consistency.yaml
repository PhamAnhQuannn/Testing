subtopic_id: sd.fundamentals.cap_consistency
items:
- id: P1246
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Khi xảy ra network partition giữa hai datacenter, hệ thống chọn AP thay vì CP nghĩa là gì?'
  choices:
  - 'Từ chối request để mọi node luôn thấy cùng dữ liệu'
  - 'Hệ thống tránh được partition hoàn toàn'
  - 'Vẫn tiếp tục phục vụ request ở cả hai phía, chấp nhận dữ liệu có thể tạm thời không nhất quán (eventual consistency)'
  - 'Dữ liệu bị mất vĩnh viễn sau khi partition'
  answer_index: 2
  explanation_md: 'Theo CAP, khi partition ta phải chọn: CP giữ consistency (từ chối/chặn một số request), AP giữ availability (vẫn trả lời nhưng có thể stale, eventual consistency).'
