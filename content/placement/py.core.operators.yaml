  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    print(17 // 5, 17 % 5)
    print(-7 // 2, -7 % 2)
    print(2 ** 10)
    a = 3
    print(1 < a < 5, a == 3.0)
    print(0 or "x", 5 and 7)
