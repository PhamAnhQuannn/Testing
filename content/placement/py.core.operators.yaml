  prompt_md: '`3 + 2 * 2 ** 2` bằng bao nhiêu?'
  choices:
  - '`11`'
  - '`25`'
  - '`19`'
  - '`14`'
  answer_index: 0
  explanation_md: 'Thứ tự ưu tiên: `**` trước (`2 ** 2 = 4`), rồi `*` (`2 * 4 = 8`), rồi `+` (`3 + 8 = 11`).'
