items:
- id: P1472
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Tích có hướng (b - a) x (c - a) của ba điểm có giá trị 0. Điều đó có nghĩa gì?
  choices:
  - Ba điểm a, b, c thẳng hàng
  - Đi a -> b -> c là rẽ trái
  - Đi a -> b -> c là rẽ phải
  - Ba điểm tạo tam giác có diện tích lớn nhất
  answer_index: 0
  explanation_md: Tích có hướng bằng 2 lần diện tích có dấu của tam giác abc; bằng 0 nghĩa là diện tích 0, tức ba điểm thẳng hàng. Dương là rẽ trái, âm là rẽ phải.
- id: P1473
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "def orient(p, q, r):\n    v = (q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0])\n    return (v > 0) - (v < 0)\n\nprint(orient((0, 0), (2, 1), (4, 2)))\nprint(orient((0, 0), (1, 0), (1, -1)))\nprint(orient((1, 1), (1, 3), (0, 2)))"
  expected_output: '0

    -1

    1'
