# Placement-only items (P0 mcq / P1 read_code). Validated by content/schemas/placement.schema.json.
# read_code expected_output = real stdout of `code` (computed by running it, never typed).
subtopic_id: py.datastructs.copying_mutability
items:
- id: P991
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Sau `a = [1, 2]; b = a; b.append(3)`, giá trị của `a` là gì?'
  choices:
  - '`[1, 2, 3]`'
  - '`[1, 2]`'
  - '`[3]`'
  - '`[1, 2, 3, 3]`'
  answer_index: 0
  explanation_md: '`b = a` không sao chép mà chỉ tạo thêm một tên cùng chỉ tới một list, nên sửa qua `b` thì `a` cũng đổi.'
- id: P992
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    import copy

    a = [[1], [2]]
    b = a
    c = a.copy()
    d = copy.deepcopy(a)
    print(a is b, a is c, a[0] is c[0], a[0] is d[0])
    a[0].append(9)
    print(b)
    print(c)
    print(d)
    grid = [[0] * 2] * 2
    grid[0][0] = 1
    print(grid)
  expected_output: |-
    True False True False
    [[1, 9], [2]]
    [[1, 9], [2]]
    [[1], [2]]
    [[1, 0], [1, 0]]
