subtopic_id: py.core.getting_started
items:
- id: P968
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - indentation-python-dung-4-dau-cach-dau-d
  prompt_md: Trong Python, cái gì xác định một khối lệnh (ví dụ thân của `if` hoặc `for`)?
  choices:
  - Cặp dấu ngoặc nhọn `{ }`
  - Thụt lề (indentation)
  - Cặp từ khóa `begin` / `end`
  - Dấu chấm phẩy `;` cuối dòng
  answer_index: 1
  explanation_md: Python dùng indentation (thường 4 dấu cách) để nhóm các dòng thành một block; không có `{ }` hay `begin`/`end`.
- id: P969
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - print-in-ket-qua-ra-man-hinh-comment-bat
  prompt_md: '`print("a", "b")` in ra gì?'
  choices:
  - '`ab`'
  - '`a b`'
  - '`a,b`'
  - '`("a", "b")`'
  answer_index: 1
  explanation_md: '`print` nhiều đối số sẽ in chúng cách nhau bằng một dấu cách (tham số `sep` mặc định là `" "`), rồi xuống dòng.'
- id: P970
  difficulty: 1
  type: read_code
  minutes: 2
  concepts:
  - print-in-ket-qua-ra-man-hinh-comment-bat
  - import-lay-cong-cu-co-san-ve-dung-moi-bo
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    import math
    # comment: dòng này bị bỏ qua
    x = 3
    if x > 2:
        print("big")
        print(math.sqrt(16))
    print(math.floor(2.7), math.ceil(2.1))
    print("end")
  expected_output: |-
    big
    4.0
    2 3
    end
