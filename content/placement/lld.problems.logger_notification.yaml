subtopic_id: lld.problems.logger_notification
items:
- id: P1573
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Handler có ngưỡng INFO nhận được những dòng log mức nào?
  choices:
  - INFO và ERROR
  - Chỉ INFO
  - DEBUG và INFO
  - Mọi mức
  answer_index: 0
  explanation_md: Thứ tự DEBUG < INFO < ERROR; ngưỡng INFO nhận mọi mức từ INFO trở lên, tức INFO và ERROR, và bỏ DEBUG.
- id: P1574
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Muốn thêm kênh thông báo mới (ví dụ Zalo) mà không sửa code lõi thì nên làm gì?
  choices:
  - Viết một class kênh mới cùng interface và đăng ký vào Factory
  - Thêm nhánh elif vào hàm gửi trung tâm
  - Sao chép cả service thành bản mới
  - Gõ cứng tên kênh vào mọi nơi gọi
  answer_index: 0
  explanation_md: Strategy + Factory cho phép thêm kênh bằng một class mới; các lựa chọn khác làm lõi phình ra hoặc nhân bản code.
- id: P1575
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code in ra gì?'
  code: "LV = {\"DEBUG\": 0, \"INFO\": 1, \"ERROR\": 2}\n\ndef writes(thr, lvl):\n    return LV[lvl] >= LV[thr]\n\nprint(writes(\"INFO\", \"DEBUG\"), writes(\"INFO\", \"ERROR\"), writes(\"DEBUG\", \"DEBUG\"))"
  expected_output: "False True True"
