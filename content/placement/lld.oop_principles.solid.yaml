- id: P1517
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Dependency injection là gì?
  choices:
  - Nhận thứ cần dùng từ bên ngoài (ví dụ qua `__init__`) thay vì tự tạo bên trong
  - Tự tạo mọi object cần dùng ngay trong class
  - Copy code của class khác vào class mình
  - Dùng biến global để chia sẻ object
  answer_index: 0
  explanation_md: DI truyền collaborator vào từ ngoài, nên dễ thay bằng bản giả khi test và giúp theo DIP.
- id: P1518
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code tiêm collaborator in ra gì?'
  code: |-
    class Log:
        def __init__(self):
            self.rows = []

        def write(self, s):
            self.rows.append(s)


    class Svc:
        def __init__(self, log):
            self.log = log

        def run(self, n):
            self.log.write('n=' + str(n))


    lg = Log()
    Svc(lg).run(7)
    print(lg.rows)
  expected_output: "['n=7']"
