subtopic_id: sd.technologies.cache_search
items:
- id: P1252
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Cần tìm kiếm full-text có xếp hạng relevance trên hàng triệu bài viết. Công nghệ nào phù hợp hơn?'
  choices:
  - 'Redis, vì key-value nhanh nhất'
  - 'Kafka, vì lưu log'
  - 'ZooKeeper, vì điều phối'
  - 'Elasticsearch (inverted index) cho full-text search; Redis dành cho cache key-value in-memory'
  answer_index: 3
  explanation_md: 'Elasticsearch dùng inverted index cho full-text search/relevance; Redis là in-memory key-value cho cache, session, counter.'
