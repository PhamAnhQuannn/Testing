subtopic_id: sd.archetypes.message_queue
items:
- id: P1187
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Với message queue kiểu Kafka, để không mất message khi consumer crash giữa chừng và vẫn giữ thứ tự trong cùng một key, thiết kế nào hợp lý?
  choices:
  - 'Dùng at-most-once: commit offset trước khi xử lý, và một partition cho mọi key'
  - Xoá message ngay khi broker gửi đi
  - Chia partition theo key để giữ thứ tự trong partition; consumer commit offset/ack sau khi xử lý (at-least-once) và xử lý idempotent
  - Dùng một consumer duy nhất cho toàn hệ thống
  answer_index: 2
  explanation_md: Thứ tự chỉ đảm bảo trong một partition (route theo key). Commit offset sau khi xử lý cho at-least-once; vì có thể xử lý lặp nên consumer cần idempotent.
