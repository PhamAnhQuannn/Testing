- id: P1462
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Min Stack cần get_min chạy O(1). Cách nào đúng?
  choices:
  - Duyệt cả stack mỗi lần gọi get_min
  - Mỗi phần tử lưu kèm min tính đến thời điểm nó được push
  - Sắp xếp lại stack sau mỗi lần push
  - Chỉ nhớ phần tử đầu tiên được push
  answer_index: 1
  explanation_md: Lưu cặp (value, min_so_far) cho phép get_min đọc phần tử trên cùng, và pop không làm sai min của phần còn lại.
- id: P1463
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì?'
  code: "mins = []\nfor v in [9, 4, 7]:\n    mins.append(min(v, mins[-1]) if mins else v)\nprint(mins)"
  expected_output: '[9, 4, 4]'
