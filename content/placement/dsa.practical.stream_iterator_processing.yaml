items:
- id: P1486
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Vì sao generator (dùng yield) phù hợp để xử lý một file rất lớn?
  choices:
  - Chỉ giữ một phần nhỏ dữ liệu trong bộ nhớ tại mỗi thời điểm
  - Cho phép truy cập ngẫu nhiên phần tử thứ i nhanh O(1)
  - Có thể duyệt lại từ đầu nhiều lần
  - Luôn nhanh hơn list comprehension
  answer_index: 0
  explanation_md: Generator lazy, tính từng phần tử khi cần nên bộ nhớ O(1); nó không hỗ trợ chỉ số hay duyệt lại.
- id: P1487
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "def count_up():\n    n = 0\n    while True:\n        n += 1\n        yield n\n\nit = count_up()\nprint(next(it), next(it))\nprint([x for x, _ in zip(it, \"ab\")])\nprint(next(it))"
  expected_output: '1 2

    [3, 4]

    6'
