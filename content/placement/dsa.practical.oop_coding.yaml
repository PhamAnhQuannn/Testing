- id: P1498
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong một đề OOP, cách chọn class nào hợp lý nhất?
  choices:
  - Mỗi danh từ có state và hành vi riêng trong đề là một class ứng viên
  - Mỗi động từ trong đề là một class riêng
  - Dùng một class lớn chứa mọi thứ để dễ gọi
  - Luôn thêm interface cho mọi class từ đầu
  answer_index: 0
  explanation_md: Danh từ có state và hành vi riêng thường là class, động từ là method của class sở hữu dữ liệu; thêm interface sớm là over-engineering.
- id: P1499
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "class Temp:\n    def __init__(self):\n        self._c = 0\n\n    def set(self, v):\n        if v < -273:\n            raise ValueError(\"too cold\")\n        self._c = v\n\n\nt = Temp()\nt.set(5)\ntry:\n    t.set(-300)\nexcept ValueError:\n    pass\nprint(t._c)"
  expected_output: '5'
