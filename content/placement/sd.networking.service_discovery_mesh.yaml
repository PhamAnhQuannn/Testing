subtopic_id: sd.networking.service_discovery_mesh
items:
- id: P1248
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Trong kiến trúc microservice, service registry và sidecar trong service mesh giải quyết vấn đề gì?'
  choices:
  - 'Lưu log tập trung của ứng dụng'
  - 'Sao lưu dữ liệu giữa các region'
  - 'Cân bằng tải ở tầng DNS công khai cho người dùng cuối'
  - 'Tìm địa chỉ instance đang sống (registry) và để sidecar proxy xử lý routing, retry, mTLS giữa các service'
  answer_index: 3
  explanation_md: 'Registry cho biết instance nào đang sống (địa chỉ động); sidecar proxy (vd Envoy) đảm nhiệm routing, retry, mTLS ngoài code ứng dụng.'
