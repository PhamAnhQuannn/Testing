subtopic_id: sd.archetypes.chat_presence
items:
- id: P1167
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Chat realtime cần đẩy tin nhắn tức thì và hiển thị trạng thái online. Thiết kế nào hợp lý?"
  choices:
  - "WebSocket cho realtime, presence lưu bằng heartbeat với key có TTL trong Redis, hết hạn thì coi là offline"
  - "Client polling mỗi 30 phút"
  - "Ghi trạng thái online vào DB chỉ khi login"
  - "Server gửi email khi có tin nhắn"
  answer_index: 0
  explanation_md: "WebSocket giữ kết nối hai chiều; presence dùng heartbeat định kỳ làm mới key TTL, hết heartbeat thì key tự hết hạn và user thành offline."
