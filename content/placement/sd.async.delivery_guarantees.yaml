subtopic_id: sd.async.delivery_guarantees
items:
- id: P1226
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Hệ thống dùng at-least-once delivery. Cách thiết kế consumer nào giúp xử lý an toàn khi message bị giao trùng?"
  choices:
  - "Tắt retry để không bao giờ trùng"
  - "Làm consumer idempotent (dedup theo message id/idempotency key)"
  - "Chuyển sang at-most-once để chắc chắn không mất message"
  - "Tăng số partition lên gấp đôi"
  answer_index: 1
  explanation_md: "At-least-once có thể giao trùng; idempotency kèm dedup khiến xử lý lặp không đổi kết quả, tiệm cận hiệu ứng exactly-once."
