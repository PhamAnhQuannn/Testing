- id: P1564
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Vì sao tiền trong giỏ hàng nên là số nguyên (đơn vị đồng/xu) hoặc Decimal thay vì float?
  choices:
  - Float có sai số nhị phân, ví dụ 0.1 + 0.2 ra 0.30000000000000004
  - Float không cộng được với số nguyên
  - Số nguyên luôn chạy nhanh hơn float gấp nhiều lần
  - Float không dùng được trong class
  answer_index: 0
  explanation_md: Float không biểu diễn chính xác nhiều số thập phân nên tổng tiền có thể lệch; số nguyên hoặc Decimal cho kết quả đúng.
- id: P1565
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Giỏ có (đơn giá 100, SL 2) và (đơn giá 50, SL 1). Tổng tiền là bao nhiêu?
  choices:
  - '250'
  - '150'
  - '200'
  - '350'
  answer_index: 0
  explanation_md: Tổng = cộng đơn giá nhân số lượng từng dòng = 100*2 + 50*1 = 250.
