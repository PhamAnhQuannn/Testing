  prompt_md: 'Thứ tự đúng của render pipeline trong trình duyệt là gì?'
  choices:
  - Parse, style, layout, paint, composite
  - Parse, paint, layout, style, composite
  - Layout, parse, style, composite, paint
  - Style, parse, composite, layout, paint
  answer_index: 0
  explanation_md: 'Trình duyệt parse HTML/CSS thành DOM/CSSOM, tính style, layout (vị trí/kích thước), paint (vẽ pixel) rồi composite (ghép layer).'
- id: P1925
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - script-chan-render-dung-async-hoac-defer
  prompt_md: 'Một script ứng dụng cần chạy sau khi HTML parse xong và giữ đúng thứ tự với các script khác, nhưng không muốn chặn render. Nên dùng gì?'
  choices:
  - 'Thẻ script thường đặt trong head'
  - 'Thuộc tính async'
  - 'Thuộc tính defer'
  - 'Đưa toàn bộ vào localStorage'
  answer_index: 2
  explanation_md: 'defer tải song song, chạy sau khi parse xong theo đúng thứ tự. async chạy ngay khi tải xong và không đảm bảo thứ tự; script thường chặn parse.'
