# Placement-only items (P0 mcq / P1 read_code). Validated by content/schemas/placement.schema.json.
# read_code expected_output = real stdout of `code` (computed by running it, never typed).
subtopic_id: dsa.searching_sorting.binary_search_basics
items:
- id: P930
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Điều kiện tiên quyết để binary search cho kết quả đúng là gì?
  choices:
  - Mảng có độ dài lũ thừa của 2
  - Mảng không có phần tử trùng
  - Dữ liệu được sắp xếp (hoặc có tính đơn điệu)
  - Mảng chỉ chứa số nguyên
  answer_index: 2
  explanation_md: Binary search loại một nửa dựa vào so sánh với `mid`, chỉ đúng khi
    dữ liệu có thứ tự.
- id: P931
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Binary search trên mảng n phần tử có độ phức tạp thời gian là gì?
  choices:
  - O(n)
  - O(log n)
  - O(1)
  - O(n log n)
  answer_index: 1
  explanation_md: Mỗi bước loại một nửa khoảng tìm kiếm, nên cần khoảng log2(n) bước.
- id: P932
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Vì sao nhiều người viết `mid = lo + (hi - lo) // 2` thay vì `(lo + hi)
    // 2`?
  choices:
  - Vì nhanh hơn rõ rệt
  - Để tránh tràn số khi `lo + hi` vượt giới hạn kiểu số nguyên (ở ngôn ngữ như C/Java)
  - Để mid luôn làm tròn lên
  - Vì `//` không hợp lệ với tổng
  answer_index: 1
  explanation_md: Trong ngôn ngữ int cố định, `lo + hi` có thể tràn. Python có số
    nguyên lớn tùy ý nên không tràn, nhưng thói quen này vẫn tốt.
- id: P933
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "a = [1, 3, 3, 5, 8, 8, 8, 12]\nlo, hi = 0, len(a)\nwhile lo < hi:\n    mid\
    \ = (lo + hi) // 2\n    if a[mid] < 8:\n        lo = mid + 1\n    else:\n    \
    \    hi = mid\nprint(lo)\nprint(a[lo], a.count(8))"
  expected_output: '4

    8 3'
- id: P934
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "a = [2, 4, 6, 8, 10]\nlo, hi = 0, len(a) - 1\ntrace = []\nwhile lo <= hi:\n\
    \    mid = (lo + hi) // 2\n    trace.append(mid)\n    if a[mid] == 9:\n      \
    \  break\n    if a[mid] < 9:\n        lo = mid + 1\n    else:\n        hi = mid\
    \ - 1\nprint(trace, lo, hi)"
  expected_output: '[2, 3, 4] 4 3'
