subtopic_id: py.errors_modules.context_managers
items:
- id: P1368
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Khi thân một khối `with` ném exception, `__exit__` của context manager có được gọi không?'
  choices:
  - Có, luôn được gọi, và nhận `(exc_type, exc, tb)` mô tả lỗi
  - Không, `__exit__` chỉ chạy khi khối kết thúc bình thường
  - Chỉ được gọi nếu `__exit__` trả `True` từ trước
  - Chỉ được gọi nếu có `try/except` bao quanh
  answer_index: 0
  explanation_md: '`__exit__` luôn chạy khi rời khối `with`, dù có lỗi hay không. Giá trị trả về (`True`/`False`) chỉ quyết định lỗi bị nuốt hay lan tiếp.'
- id: P1369
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    from contextlib import contextmanager

    @contextmanager
    def cm():
        print("a")
        try:
            yield 1
        finally:
            print("c")

    with cm() as v:
        print("b", v)
  expected_output: |-
    a
    b 1
    c
