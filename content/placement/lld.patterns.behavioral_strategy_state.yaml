subtopic_id: lld.patterns.behavioral_strategy_state
items:
- id: P1531
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Mẫu Strategy giải quyết vấn đề gì?
  choices:
  - Gói mỗi cách làm vào một class cùng interface để chọn lúc chạy, thay chuỗi if/else dài
  - Đảm bảo cả chương trình chỉ có một object
  - Sao chép object mẫu để tạo object mới
  - Bọc object cũ để đổi interface của nó
  answer_index: 0
  explanation_md: Strategy cho phép đổi thuật toán (giảm giá, thanh toán) lúc chạy; thêm cách mới chỉ thêm class, context không phải sửa.
- id: P1532
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Điểm khác chính giữa State và Strategy là gì?
  choices:
  - State tự đổi bên trong theo sự kiện (có chuyển trạng thái); Strategy thường do bên ngoài chọn và ít đổi
  - State luôn nhanh hơn Strategy
  - Strategy không dùng class còn State thì có
  - Hai mẫu giống hệt nhau
  answer_index: 0
  explanation_md: Cấu trúc giống nhau (context giữ một object và giao việc) nhưng State mô hình các giai đoạn với bước chuyển, còn Strategy chọn một thuật toán.
- id: P1533
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code in ra gì?'
  code: "class Percent:\n    def apply(self, a):\n        return a * 90 // 100\n\n\nclass Fixed:\n    def apply(self, a):\n        return max(0, a - 50)\n\n\nclass Cart:\n    def __init__(self, strategy):\n        self.strategy = strategy\n\n    def total(self, subtotal):\n        return self.strategy.apply(subtotal)\n\n\nprint(Cart(Fixed()).total(120))\nprint(Cart(Percent()).total(120))"
  expected_output: "70\n108"
