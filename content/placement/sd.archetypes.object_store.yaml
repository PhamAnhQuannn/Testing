subtopic_id: sd.archetypes.object_store
items:
- id: P1195
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Thiết kế object store kiểu S3 lưu hàng tỷ file lớn bền vững. Kiến trúc cốt lõi nào đúng?
  choices:
  - Lưu file trực tiếp trong bảng DB quan hệ dưới dạng BLOB
  - Lưu mỗi file trên đúng một đĩa để đơn giản
  - Tách metadata service (key → vị trí chunk) khỏi data node; chia blob thành chunk và bảo vệ bằng replication hoặc erasure coding
  - Chỉ dùng cache và không lưu bền
  answer_index: 2
  explanation_md: Metadata và dữ liệu tách riêng để scale độc lập; chunking cho file lớn; replication (3 bản) hoặc erasure coding đạt độ bền cao với chi phí thấp hơn.
