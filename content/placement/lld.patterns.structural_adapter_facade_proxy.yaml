subtopic_id: lld.patterns.structural_adapter_facade_proxy
items:
- id: P1525
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Bạn có class cũ với `make_payment(cents)` nhưng code mới gọi `pay(amount)`. Mẫu nào nối hai bên?
  choices:
  - Adapter
  - Facade
  - Flyweight
  - Singleton
  answer_index: 0
  explanation_md: Adapter bọc class cũ để nó có interface mà code mới mong đợi (như ổ cắm chuyển đổi). Facade thì gom nhiều bước thành một lời gọi.
- id: P1526
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Proxy khác Adapter ở điểm nào?
  choices:
  - Proxy giữ nguyên interface của object thật nhưng kiểm soát truy cập (lazy, quyền, cache); Adapter đổi hình dạng interface
  - Proxy luôn đổi tên method; Adapter thì không
  - Proxy chỉ dùng cho mạng, Adapter chỉ dùng cho file
  - Hai mẫu hoàn toàn giống nhau
  answer_index: 0
  explanation_md: Proxy có cùng interface với object thật và đứng chắn trước nó. Adapter làm đổi interface để hai thứ không khớp nối được với nhau.
- id: P1527
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code in ra gì?'
  code: "class Old:\n    def make_payment(self, cents):\n        print(\"cu tra\", cents)\n\n\nclass Adapter:\n    def __init__(self, old):\n        self.old = old\n\n    def pay(self, amount):\n        self.old.make_payment(amount * 100)\n\n\nAdapter(Old()).pay(25)"
  expected_output: "cu tra 2500"
