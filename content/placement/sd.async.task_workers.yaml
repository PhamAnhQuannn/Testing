subtopic_id: sd.async.task_workers
items:
- id: P1229
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Background job gọi dịch vụ ngoài bị lỗi tạm thời. Cách xử lý chuẩn là gì?"
  choices:
  - "Retry liên tục ngay lập tức không giới hạn"
  - "Bỏ job im lặng khi lỗi lần đầu"
  - "Retry với exponential backoff, và chuyển job quá số lần thử vào dead-letter queue"
  - "Chạy job đồng bộ trong request của người dùng"
  answer_index: 2
  explanation_md: "Backoff tránh dồn tải vào dịch vụ đang lỗi; dead-letter queue giữ lại job thất bại lâu dài để điều tra, không chặn queue."
