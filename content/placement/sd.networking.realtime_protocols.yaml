subtopic_id: sd.networking.realtime_protocols
items:
- id: P1249
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Ứng dụng chat cần client gửi và nhận tin nhắn hai chiều với độ trễ thấp trên một kết nối lâu dài. Nên chọn gì?'
  choices:
  - 'Short polling mỗi 30 giây'
  - 'WebSocket'
  - 'SSE vì hỗ trợ hai chiều'
  - 'Gửi email cho từng tin nhắn'
  answer_index: 1
  explanation_md: 'WebSocket là kết nối full-duplex hai chiều; SSE chỉ server → client, short polling tốn request và độ trễ cao.'
