  - arrange-act-assert-chuan-bi-du-lieu-goi
  prompt_md: Trong mẫu Arrange-Act-Assert của một unit test, bước nào so sánh kết quả với giá trị mong đợi?
  choices:
  - Arrange
  - Act
  - Assert
  - Cleanup
  answer_index: 2
  explanation_md: 'Assert là bước so kết quả với mong đợi. Arrange chuẩn bị dữ liệu, Act gọi hành động cần kiểm.'
- id: P1877
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - flaky-test-va-coverage-flaky-la-test-luc
  prompt_md: 'Test `test_delete_user` chỉ pass nếu `test_create_user` đã chạy trước và dùng chung một database. Đây là nguyên nhân flaky nào?'
  choices:
  - Phụ thuộc thứ tự chạy và trạng thái dùng chung giữa các test
  - Dùng số ngẫu nhiên không cố định seed
  - Test chạy quá nhanh
  - Thiếu coverage
  answer_index: 0
  explanation_md: 'Test phụ thuộc test khác chạy trước và dữ liệu chung là order dependence cộng shared state. Cách sửa: mỗi test tự tạo dữ liệu và dọn dẹp để độc lập.'
