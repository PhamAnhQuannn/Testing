subtopic_id: sd.archetypes.coordination_primitives
items:
- id: P1176
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Cần sinh ID duy nhất, tăng dần theo thời gian trên nhiều máy mà không cần phối hợp tập trung mỗi lần. Giải pháp nào đúng?"
  choices:
  - "Auto-increment của một database duy nhất"
  - "Random 8 bit"
  - "Snowflake ID: timestamp + machine id + sequence trong cùng mili giây"
  - "Dùng tên host"
  answer_index: 2
  explanation_md: "Snowflake ghép timestamp (sắp xếp theo thời gian), machine id (khác nhau giữa các máy) và sequence (nhiều ID trong cùng ms) nên sinh ID cục bộ, không đụng độ."
