- id: P1496
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Khi mô phỏng Game of Life, vì sao mỗi thế hệ cần ghi kết quả vào một bảng mới (double buffer) thay vì sửa trực tiếp bảng đang đọc?
  choices:
  - Để các ô sau không đọc nhầm giá trị đã đổi của ô trước trong cùng thế hệ
  - Để chương trình chạy nhanh hơn O(1)
  - Vì Python không cho sửa list lồng nhau
  - Để đếm được hàng xóm chéo
  answer_index: 0
  explanation_md: Mọi ô phải cập nhật đồng thời từ trạng thái cũ; sửa tại chỗ khiến ô đến sau thấy hàng xóm đã đổi và đếm sai.
- id: P1497
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "state = \"idle\"\nlog = []\nfor ev in [\"coin\", \"cancel\", \"coin\", \"select\", \"take\"]:\n    if state == \"idle\" and ev == \"coin\":\n        state = \"ready\"\n    elif state == \"ready\" and ev == \"select\":\n        state = \"dispensing\"\n    elif state == \"ready\" and ev == \"cancel\":\n        state = \"idle\"\n    elif state == \"dispensing\" and ev == \"take\":\n        state = \"idle\"\n    log.append(state)\nprint(log)\nprint(len(log))"
  expected_output: "['ready', 'idle', 'ready', 'dispensing', 'idle']\n5"
