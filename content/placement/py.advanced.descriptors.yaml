subtopic_id: py.advanced.descriptors
items:
- id: P1370
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Khi tra cứu `obj.attr`, nếu class có data descriptor tên `attr` và `obj.__dict__` cũng có key `attr`, cái nào được dùng?'
  choices:
  - Data descriptor trên class
  - Giá trị trong `obj.__dict__`
  - Python ném `AttributeError` vì xung đột
  - Cái nào được định nghĩa sau cùng
  answer_index: 0
  explanation_md: 'Data descriptor (có `__set__`/`__delete__`) có ưu tiên cao nhất, cao hơn `obj.__dict__`; non-data descriptor mới thua `obj.__dict__`.'
- id: P1371
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì?'
  code: |-
    class V:
        def __get__(self, o, t=None):
            return 1

        def __set__(self, o, v):
            pass

    class K:
        v = V()

    k = K()
    k.v = 9
    print(k.v, k.__dict__)
  expected_output: "1 {}"
