subtopic_id: dsa.heap.heap_ds
items:
  - id: P1394
    difficulty: 1
    type: mcq
    minutes: 1
    prompt_md: Với `heapq` của Python, cách nào cho hành vi max-heap?
    choices:
      - Dùng `heapq.heapify(h, reverse=True)`
      - Đẩy giá trị âm vào heap rồi đổi dấu khi lấy ra
      - Sắp xếp list giảm dần rồi gọi `heappop`
      - Dùng `heapq.maxheap(h)`
    answer_index: 1
    explanation_md: '`heapq` chỉ có min-heap. Đổi dấu khiến phần tử lớn nhất thành nhỏ nhất.'
  - id: P1395
    difficulty: 1
    type: read_code
    minutes: 2
    prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
    code: |-
      import heapq

      h = []
      for x in [5, 3, 8, 1]:
          heapq.heappush(h, x)
      print(h[0])
      print(heapq.heappop(h))
      print(heapq.heappop(h))
      print(len(h))
    expected_output: "1\n1\n3\n2"
