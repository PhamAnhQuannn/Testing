items:
- id: P1213
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Bloom filter đánh đổi điều gì để tiết kiệm bộ nhớ khi kiểm tra membership?"
  choices:
  - "Có false negative nhưng không có false positive"
  - "Có thể false positive nhưng không false negative: 'không có' là chắc chắn, 'có' chỉ là có thể"
  - "Luôn chính xác tuyệt đối nhưng tốn nhiều bộ nhớ"
  - "Cho phép xoá phần tử bất kỳ mà vẫn chính xác"
  answer_index: 1
  explanation_md: "Bloom filter dùng rất ít bộ nhớ nhưng có thể báo false positive; không bao giờ false negative nên 'không có' là chắc chắn."
