subtopic_id: py.functions.decorators
items:
- id: P1360
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Đặt `@dec` ngay trên `def f(): ...` tương đương câu lệnh nào?'
  choices:
  - '`f = dec(f)`'
  - '`dec = f(dec)`'
  - '`f = dec()`'
  - '`dec(f)` nhưng `f` giữ nguyên là hàm gốc'
  answer_index: 0
  explanation_md: '`@dec` gán lại tên `f` bằng giá trị `dec(f)` trả về, thường là một hàm wrapper.'
- id: P1361
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    def neg(func):
        def wrapper(*args, **kwargs):
            return -func(*args, **kwargs)
        return wrapper

    @neg
    def add(a, b=1):
        return a + b

    print(add(2), add(2, b=5))
    print(add.__name__)
  expected_output: |-
    -3 -7
    wrapper
