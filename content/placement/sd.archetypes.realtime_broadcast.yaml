subtopic_id: sd.archetypes.realtime_broadcast
items:
- id: P1196
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Live stream có hàng triệu viewer cùng xem và nhận comment trực tiếp. Làm sao phát comment tới ngần ấy người với độ trễ thấp?
  choices:
  - Mỗi viewer polling DB mỗi giây
  - Gửi comment qua email
  - Ghi comment vào một server rồi để viewer F5 trang
  - Pub/sub theo room kết hợp fan-out nhiều tầng qua edge/gateway giữ kết nối WebSocket/SSE, có thể sampling khi quá nóng
  answer_index: 3
  explanation_md: Phát tán dùng pub/sub và tầng fan-out (edge/gateway giữ kết nối persistent) để một message nhân ra nhiều viewer; polling không scale.
