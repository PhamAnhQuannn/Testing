subtopic_id: dsa.stack_queue.stack_queue_ds
items:
- id: P1045
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Stack dùng `list.append` và `list.pop()`, còn queue dùng `collections.deque` với `popleft()`. Thứ tự lấy phần tử ra của hai cấu trúc này là gì?'
  choices:
  - 'Stack là LIFO (vào sau ra trước), queue là FIFO (vào trước ra trước)'
  - 'Stack là FIFO, queue là LIFO'
  - 'Cả hai đều là FIFO'
  - 'Cả hai đều là LIFO'
  answer_index: 0
  explanation_md: '`pop()` lấy phần tử thêm vào sau cùng (LIFO). `popleft()` lấy phần tử thêm vào đầu tiên (FIFO).'
- id: P1046
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    from collections import deque

    s = [1, 2, 3]
    q = deque([1, 2, 3])
    print(s.pop())
    print(q.popleft())
    s.append(4)
    print(s.pop(), s.pop())
    print(list(q))
  expected_output: |-
    3
    1
    4 2
    [2, 3]
