items:
- id: P1432
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Dấu hiệu nào cho thấy một bài nên giải bằng quy hoạch động (DP)?
  choices:
  - Cùng một bài con được tính lại nhiều lần và đáp án bài lớn ghép từ các bài con
  - Dữ liệu đầu vào luôn đã được sắp xếp
  - Bài chỉ có đúng một đáp án duy nhất
  - Đồ thị đầu vào không có chu trình
  answer_index: 0
  explanation_md: DP cần overlapping subproblems và optimal substructure; memo hoặc bảng giúp mỗi bài con chỉ tính một lần.
- id: P1433
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "dp = [0] * 6\ndp[1] = 1\nfor i in range(2, 6):\n    dp[i] = dp[i - 1] + dp[i - 2]\nprint(dp)\nprint(dp[-1] - dp[-2])"
  expected_output: '[0, 1, 1, 2, 3, 5]

    2'
