subtopic_id: py.core.regex
items:
- id: P1310
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: '`re.search(r"\d+", "ab12cd")` trả về gì?'
  choices:
  - Một đối tượng match mà `.group()` là `"12"`
  - '`None`, vì chuỗi không bắt đầu bằng chữ số'
  - List `["12"]`
  - '`12` (kiểu int)'
  answer_index: 0
  explanation_md: '`re.search` quét cả chuỗi và trả đối tượng match đầu tiên (`.group()`
    là `"12"`). `re.match` mới trả `None` ở đây; còn list là kết quả của `re.findall`.'
- id: P1311
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: 'import re

    print(re.sub(r"\d+", "N", "a1 b22 c"))

    print(re.split(r"-", "x-y--z"))

    print(re.search(r"b+", "aabbbc").group())'
  expected_output: 'aN bN c

    [''x'', ''y'', '''', ''z'']

    bbb'
