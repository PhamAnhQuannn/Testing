- id: P1211
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Cấu trúc dữ liệu nào nằm ở lõi của full-text search (Elasticsearch, Lucene)?"
  choices:
  - "Inverted index: ánh xạ term sang danh sách document chứa nó"
  - "B-tree trên cột id"
  - "Hash table từ document id sang nội dung"
  - "Linked list các document theo thứ tự thêm vào"
  answer_index: 0
  explanation_md: "Inverted index ánh xạ từ term sang danh sách document chứa term đó, nên tìm theo từ khoá không phải quét toàn bộ document."
