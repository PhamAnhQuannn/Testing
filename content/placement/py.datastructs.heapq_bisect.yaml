subtopic_id: py.datastructs.heapq_bisect
items:
- id: P993
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Sau `import heapq; h = [5, 1, 3]; heapq.heapify(h)`, `heapq.heappop(h)` trả về gì?'
  choices:
  - '`1`'
  - '`5`'
  - '`3`'
  - '`6`'
  answer_index: 0
  explanation_md: '`heapq` là min-heap: `heappop` luôn lấy ra phần tử nhỏ nhất, ở đây là 1.'
- id: P994
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    import heapq
    import bisect

    h = []
    for n in [5, 1, 4, 2]:
        heapq.heappush(h, n)
    print(heapq.heappop(h), heapq.heappop(h))
    print(heapq.nlargest(2, [7, 3, 9, 1]))
    s = [1, 3, 3, 5, 8]
    print(bisect.bisect_left(s, 3), bisect.bisect_right(s, 3))
    bisect.insort(s, 4)
    print(s)
    print(bisect.bisect_left(s, 100))
  expected_output: |-
    1 2
    [9, 7]
    1 3
    [1, 3, 3, 4, 5, 8]
    6
