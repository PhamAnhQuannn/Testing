- id: P1569
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code in ra gì?'
  code: "base = 1000\n\ndef fare(km, waiting, free):\n    p = base + 500 * km\n    return p * 3 // 2 if waiting > free else p\n\nprint(fare(2, 3, 1), fare(2, 1, 3))"
