- id: P1543
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong phân tích danh từ - động từ từ đề bài, danh từ và động từ thường trở thành gì?
  choices:
  - Danh từ thành class (hoặc thuộc tính), động từ thành method
  - Danh từ thành method, động từ thành class
  - Cả hai đều thành biến toàn cục
  - Danh từ thành hàm, động từ thành thuộc tính
  answer_index: 0
  explanation_md: Danh từ trong đề (Sách, Thành viên) là class hoặc thuộc tính; động từ (mượn, trả) là method nằm ở class sở hữu dữ liệu liên quan.
- id: P1544
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Quan hệ nào nên dùng has-a (composition) thay vì is-a (kế thừa)?
  choices:
  - Một Project chứa nhiều Task
  - Một Dog là một Animal
  - Một Square là một Shape
  - Một Car là một Vehicle
  answer_index: 0
  explanation_md: Project không phải là một loại Task; nó chứa Task. Các cặp còn lại là quan hệ "là một" thật sự nên kế thừa hợp lý.
- id: P1545
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code in ra gì?'
  code: "class Library:\n    def __init__(self):\n        self.books = []\n\n\nclass Book:\n    def __init__(self, title):\n        self.title = title\n        self.loaned = False\n\n\nlib = Library()\nfor t in [\"a\", \"b\", \"c\"]:\n    lib.books.append(Book(t))\nlib.books[1].loaned = True\nprint(len(lib.books))\nprint(sum(1 for b in lib.books if not b.loaned))\ndel lib.books[0]\nprint(len(lib.books))"
  expected_output: |-
    3
    2
    2
