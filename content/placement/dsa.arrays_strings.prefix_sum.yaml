# Placement-only items (P0 mcq / P1 read_code).
subtopic_id: dsa.arrays_strings.prefix_sum
items:
- id: P1069
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Với prefix sum `pre` có `pre[0] = 0` và `pre[i+1] = pre[i] + a[i]`, tổng `a[l..r]` (gồm cả hai đầu) bằng gì?
  choices:
  - '`pre[r] - pre[l]`'
  - '`pre[r+1] - pre[l]`'
  - '`pre[r+1] - pre[l+1]`'
  - '`pre[r] - pre[l-1]`'
  answer_index: 1
  explanation_md: '`pre[r+1]` là tổng a[0..r], trừ `pre[l]` (tổng a[0..l-1]) còn a[l..r]. Mỗi query O(1) sau khi build O(n).'
- id: P1070
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    a = [3, 1, 4, 1, 5]
    pre = [0]
    for x in a:
        pre.append(pre[-1] + x)
    print(pre)
    l, r = 1, 3
    print(pre[r + 1] - pre[l])
    print(pre[5] - pre[2])
  expected_output: |-
    [0, 3, 4, 8, 9, 14]
    6
    10
