- id: P1884
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - dung-chuc-nang-tim-ca-bien-gia-tri-rong
  prompt_md: Khi review một PR, nên ưu tiên chú ý điều nào nhất?
  choices:
  - Dấu cách thừa và thứ tự import
  - Code có đúng không (correctness), xử lý trường hợp biên và có test
  - Bạn có thích tên biến hay không
  - Số dòng code có ít nhất có thể
  answer_index: 1
  explanation_md: 'Correctness, edge cases và tests quan trọng nhất. Lỗi định dạng như dấu cách hay thứ tự import nên để linter/formatter xử lý tự động.'
- id: P1885
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - gop-y-xay-dung-neu-van-de-va-goi-y-nhan
  prompt_md: 'Bạn thấy hàm chưa xử lý trường hợp danh sách rỗng và sẽ gây lỗi. Cách góp ý nào tốt nhất?'
  choices:
  - 'Sai rồi, viết lại đi.'
  - 'Dòng 18: nếu `items` rỗng thì `items[0]` sẽ ném lỗi. Bạn thêm kiểm tra và một test cho trường hợp này được không? (blocker)'
  - 'nit: nên đổi tên biến.'
  - Không nói gì để tránh làm phật lòng.
  answer_index: 1
  explanation_md: 'Góp ý tốt thì cụ thể (dòng nào, vì sao), có gợi ý sửa, giọng tôn trọng và ghi rõ mức độ (blocker vì sẽ gây lỗi). Các lựa chọn còn lại mơ hồ, thiếu tôn trọng hoặc bỏ qua lỗi thật.'
