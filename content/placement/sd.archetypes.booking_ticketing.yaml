subtopic_id: sd.archetypes.booking_ticketing
items:
- id: P1185
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Hệ thống đặt vé xem concert: hàng nghìn người cùng giành một ghế cuối. Nút thắt cốt lõi cần giải quyết để tránh double-booking là gì?'
  choices:
  - Cache danh sách ghế ở CDN để đọc nhanh hơn
  - Reserve/lock ghế có TTL (hold) kèm atomic check-and-set hoặc row lock trên inventory, hết hạn thì nhả ghế
  - Tăng số web server để xử lý nhanh hơn
  - Cho phép bán vượt rồi huỷ vé sau bằng email xin lỗi
  answer_index: 1
  explanation_md: Race condition trên cùng một ghế phải được chặn bằng reservation tạm thời (TTL) và atomic update/lock trên inventory; chỉ khi thanh toán thành công mới chuyển thành booked.
