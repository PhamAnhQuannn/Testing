subtopic_id: sd.async.batch_processing
items:
- id: P1230
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Batch processing kiểu MapReduce ưu tiên mục tiêu nào?"
  choices:
  - "Latency thấp tính bằng mili-giây cho từng bản ghi"
  - "Throughput cao trên khối dữ liệu lớn, chấp nhận latency cao"
  - "Phản hồi tức thời cho từng request người dùng"
  - "Không cần chia nhỏ dữ liệu"
  answer_index: 1
  explanation_md: "Batch xử lý lượng dữ liệu lớn theo lô (map rồi reduce), đánh đổi độ trễ lấy thông lượng; trái với stream/online."
