# Concept-hub placement items (C1 level-1 mcq, C2 level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: sd.reliability_ops.fault_tolerance
items:
- id: P960
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - circuit-breaker-closed-loi-lien-tuc-open
  prompt_md: Circuit breaker hoạt động theo chu trình nào, và mục đích chính của nó là gì?
  choices:
  - Luôn từ chối mọi request để bảo vệ hệ thống bất kể phụ thuộc có khoẻ hay không
  - 'Closed → Open → Half-open: vượt ngưỡng lỗi thì Open (fail fast, ngừng gọi dịch vụ ốm), Half-open dò thử, hồi phục thì về Closed'
  - Tự động retry vô hạn cho tới khi dịch vụ phụ thuộc phản hồi
  - Nhân bản dữ liệu sang vùng khác khi phát hiện lỗi
  answer_index: 1
  explanation_md: Breaker ngắt luồng gọi khi lỗi vượt ngưỡng (fail fast) để tránh hammer một phụ thuộc đang hỏng, rồi dò thử bằng Half-open.
- id: P961
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - retry-storm-dich-vu-cham-client-retry-ta
  - retry-budget-chi-cho-retry-toi-da-10-so
  prompt_md: Chuỗi 3 tầng service A→B→C, mỗi tầng retry 3 lần khi lỗi. C chỉ gặp một blip ngắn nhưng sau đó C quá tải và sập hẳn dù blip đã qua. Cách nào xử lý đúng nguyên nhân?
  choices:
  - Tăng số lần retry lên 5 để request cuối cùng chắc chắn thành công
  - Retry ngay lập tức không backoff để hồi phục nhanh hơn
  - Gỡ hết timeout để request có đủ thời gian hoàn tất
  - Giới hạn retry bằng retry budget (~10%/tầng), thêm exponential backoff + jitter và circuit breaker để ngừng gọi C khi nó đang hỏng
  answer_index: 3
  explanation_md: 'Đây là retry storm: 3×3×3 = 27× tải lên C. Retry budget, backoff + jitter và circuit breaker cắt vòng xoáy. Retry nhiều hơn hay không backoff làm tệ thêm.'
