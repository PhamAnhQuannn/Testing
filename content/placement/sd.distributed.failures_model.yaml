# Concept-hub placement items (C1 level-1 mcq, C2 level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: sd.distributed.failures_model
items:
- id: P956
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - timeout-khong-phan-biet-duoc-cham-va-che
  prompt_md: Trong hệ phân tán, vì sao timeout không chứng minh được node kia đã chết?
  choices:
  - Vì timeout luôn quá ngắn trên mọi hệ thống
  - Vì node chết luôn tự gửi thông báo trước khi dừng
  - Vì không thể phân biệt node chết với node chỉ chậm (GC pause, network blip) hay tin bị rớt; timeout chỉ là phỏng đoán
  - Vì timeout chỉ dùng được với giao thức UDP
  answer_index: 2
  explanation_md: Bên gọi chỉ thấy 'không có phản hồi kịp'; nguyên nhân có thể là chết, chậm hoặc mất tin, nên timeout là phỏng đoán chứ không phải sự thật.
- id: P957
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - fencing-token-so-tang-dan-kem-moi-lan-ca
  prompt_md: Một lock service cấp lock cho worker A, A bị GC pause dài nên lock hết hạn, lock được cấp cho worker B, rồi A tỉnh lại và vẫn tưởng mình cầm lock và ghi xuống storage. Cách nào chặn được hậu quả dữ liệu hỏng?
  choices:
  - Tăng timeout của lock lên thật lớn để GC pause không bao giờ làm lock hết hạn
  - 'Fencing token: mỗi lần cấp lock kèm số tăng dần, storage từ chối ghi mang số cũ hơn số đã thấy'
  - Dùng heartbeat dày hơn để phát hiện A chết chính xác tuyệt đối
  - Cho A tự kiểm tra đồng hồ của mình trước mỗi lần ghi
  answer_index: 1
  explanation_md: Không thể ngăn phỏng đoán sai, nhưng fencing token do kho kiểm tra sẽ từ chối ghi của A (token cũ). Timeout dài hay heartbeat dày chỉ giảm xác suất chứ không loại trừ split brain.
