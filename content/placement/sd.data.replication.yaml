subtopic_id: sd.data.replication
items:
- id: P1206
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Trong mô hình leader-follower replication, đánh đổi chính giữa replication đồng bộ (sync) và bất đồng bộ (async) là gì?"
  choices:
  - "Sync nhanh hơn async và luôn có replication lag"
  - "Async đảm bảo không bao giờ mất dữ liệu khi leader chết"
  - "Sync tăng độ bền và nhất quán nhưng làm write chậm hơn; async ghi nhanh nhưng follower có thể đọc dữ liệu cũ"
  - "Hai kiểu hoàn toàn giống nhau về latency và độ bền"
  answer_index: 2
  explanation_md: "Sync chờ follower xác nhận nên bền hơn nhưng write chậm và phụ thuộc follower; async ghi nhanh nhưng có thể mất dữ liệu chưa replicate khi leader chết và read replica đọc được dữ liệu cũ (replication lag)."
