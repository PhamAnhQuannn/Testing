subtopic_id: ml.llm_eval_serving.quantization_compression
items:
- id: P1134
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Quantization (ví dụ 16-bit xuống 4-bit) chủ yếu làm gì?
  choices:
  - Tăng số tham số của model
  - Lưu mỗi trọng số bằng ít bit hơn nên model nhẹ hơn, đổi lại có thể giảm nhẹ chất lượng
  - Huấn luyện lại model từ đầu với dữ liệu mới
  - Tăng độ dài context tối đa
  answer_index: 1
  explanation_md: 'Quantization làm tròn trọng số xuống ít bit hơn: giảm bộ nhớ và băng thông, chất lượng thường giảm ít.'
- id: P1135
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    params = 7_000_000_000
    bytes_per_param = {"fp16": 2, "int8": 1, "int4": 0.5}
    for name, b in bytes_per_param.items():
        print(name, params * b / 1e9)
  expected_output: |-
    fp16 14.0
    int8 7.0
    int4 3.5
