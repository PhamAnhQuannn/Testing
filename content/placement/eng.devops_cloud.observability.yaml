subtopic_id: eng.devops_cloud.observability
items:
- id: P1904
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - metric-con-so-do-theo-thoi-gian-nhu-so-r
  prompt_md: Loại telemetry nào là các con số tổng hợp theo thời gian (như request mỗi giây, tỉ lệ lỗi), rẻ và hợp cho alert và dashboard?
  choices:
  - Logs
  - Metrics
  - Traces
  - Stack dump
  answer_index: 1
  explanation_md: 'Metrics là số tổng hợp theo thời gian. Logs là sự kiện rời rạc, traces là hành trình một request qua các service.'
- id: P1905
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - percentile-p95-p99-vs-trung-binh-p99-la
  prompt_md: 'Một API có 98 request mất 100ms và 2 request mất 10 giây. Vì sao p99 hữu ích hơn trung bình ở đây?'
  choices:
  - p99 lộ ra các request chậm nhất, còn trung bình (khoảng 298ms) che mất chúng
  - p99 luôn thấp hơn trung bình nên dễ đạt mục tiêu
  - Trung bình không thể tính từ metric
  - p99 chỉ đo số lượng lỗi
  answer_index: 0
  explanation_md: 'p99 phản ánh đuôi chậm (ở đây 10 giây) trong khi trung bình bị kéo bởi số đông nhanh nên trông ổn.'
