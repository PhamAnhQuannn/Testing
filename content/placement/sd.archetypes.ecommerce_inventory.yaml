subtopic_id: sd.archetypes.ecommerce_inventory
items:
- id: P1186
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Flash sale e-commerce: nhiều đơn cùng mua món hàng chỉ còn 1 sản phẩm, và client có thể retry request thanh toán. Thiết kế cốt lõi nào đúng?'
  choices:
  - Đọc tồn kho vào bộ nhớ app rồi trừ ở từng server
  - Chỉ trừ tồn kho ở client rồi đồng bộ sau
  - Trừ tồn kho nguyên tử (reserve) cùng idempotency key cho checkout, để retry không tạo đơn hoặc trừ kho hai lần
  - Cho phép oversell và để bộ phận CSKH xử lý
  answer_index: 2
  explanation_md: Cần reservation/atomic decrement để không oversell, và idempotency key để retry checkout không nhân đôi đơn hay thanh toán.
