subtopic_id: sd.framework.hld_diagram
items:
- id: P1238
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Một high-level design (HLD) diagram tốt nên thể hiện điều gì?"
  choices:
  - "Từng dòng code của mỗi service"
  - "Tên biến trong database"
  - "Các component chính và luồng dữ liệu giữa chúng, rồi mới scale từng phần"
  - "Chỉ danh sách thư viện sử dụng"
  answer_index: 2
  explanation_md: "HLD vẽ client, LB, service, DB, cache, queue và data flow; làm bản đơn giản chạy được trước rồi mới scale/tối ưu."
