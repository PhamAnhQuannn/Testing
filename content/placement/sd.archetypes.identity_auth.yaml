subtopic_id: sd.archetypes.identity_auth
items:
- id: P1175
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Hệ thống nhiều service cần xác thực không phải tra DB session mỗi request. Cách nào phổ biến?"
  choices:
  - "Gửi password trong mọi request"
  - "Cấp token ký số (JWT) có thời hạn ngắn kèm refresh token; dịch vụ verify chữ ký; OAuth2/OIDC cho SSO"
  - "Dùng cookie không có expiry và không ký"
  - "Lưu mật khẩu plaintext để so sánh nhanh"
  answer_index: 1
  explanation_md: "JWT ký số cho phép verify stateless, access token ngắn hạn cộng refresh token giảm rủi ro; OAuth2/OIDC cung cấp SSO/ủy quyền chuẩn."
