subtopic_id: sd.api.idempotency
items:
- id: P1250
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Client retry request thanh toán POST do timeout. Cách nào tránh trừ tiền hai lần?'
  choices:
  - 'Client gửi Idempotency-Key duy nhất, server nhận ra key đã xử lý và trả lại kết quả cũ'
  - 'Không bao giờ cho phép retry'
  - 'Tăng timeout lên vô hạn'
  - 'Mỗi lần retry sinh một key ngẫu nhiên mới'
  answer_index: 0
  explanation_md: 'Gửi Idempotency-Key duy nhất; server lưu kết quả theo key và trả lại cùng kết quả cho retry thay vì xử lý lại.'
