subtopic_id: ml.rag_agents.rag_pipeline
items:
- id: P944
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - hai-pha-offline-nap-tai-lieu-online-tra
  prompt_md: Thứ tự đúng của một pipeline RAG cơ bản khi trả lời một câu hỏi là gì?
  choices:
  - Embed câu hỏi, retrieve top-k chunk liên quan từ vector store, ghép (augment) vào prompt, rồi LLM generate
  - LLM generate câu trả lời trước, rồi tìm tài liệu khớp để sửa lại
  - Fine-tune LLM trên toàn bộ tài liệu rồi generate, không cần retrieve
  - Retrieve toàn bộ tài liệu, nhét hết vào prompt rồi generate
  answer_index: 0
  explanation_md: RAG = retrieve, augment, generate. Chỉ top-k chunk liên quan được đưa vào prompt; fine-tune không thay được retrieval cho tri thức cập nhật, và nhét toàn bộ tài liệu vượt context và tốn chi phí.
- id: P945
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - debug-rag-hai-nhanh-doan-dung-co-nam-tro
  - naive-va-advanced-rag-them-viet-lai-cau
  prompt_md: 'Chatbot RAG trả lời sai dù tài liệu đúng có trong kho. Kiểm tra cho thấy chunk chứa đáp án KHÔNG nằm trong top-5 được retrieve mà ở hạng 12. Bước cải thiện hợp lý nhất là gì?'
  choices:
  - Fine-tune LLM generator, vì nó chưa biết đáp án
  - Thêm reranker (cross-encoder) chấm lại top-50 rồi lấy top-5, hoặc cải thiện chunking và hybrid search để chunk đúng lên cao hơn
  - Giảm temperature của LLM về 0
  - Đổi sang LLM có context window lớn hơn nhưng giữ nguyên retrieval top-5
  answer_index: 1
  explanation_md: Lỗi nằm ở retrieval (recall ở top-k), không ở generator. Reranker, chunking tốt hơn và hybrid search đưa chunk đúng lên top-k. Temperature và context window lớn không giúp khi chunk đúng không được đưa vào prompt.
