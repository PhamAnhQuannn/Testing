# Concept-hub placement items (level-1 mcq, level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: eng.devops_cloud.cloud_basics
items:
- id: P1902
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - iaas-paas-saas-iaas-thue-may-trong-tu-ca
  prompt_md: Mô hình cloud nào cho bạn thuê máy ảo và mạng trống, còn hệ điều hành trở lên do bạn tự quản?
  choices:
  - SaaS
  - PaaS
  - IaaS
  - Serverless
  answer_index: 2
  explanation_md: 'IaaS cho thuê hạ tầng (máy ảo, mạng), bạn quản từ hệ điều hành lên. PaaS chạy app giúp bạn, SaaS là phần mềm dùng ngay.'
- id: P1903
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - region-va-az-region-la-vung-dia-ly-az-la
  prompt_md: 'Để một datacenter mất điện mà dịch vụ vẫn chạy, cách phổ biến nhất trong cùng một region là gì?'
  choices:
  - Chạy trên nhiều availability zone (AZ)
  - Dùng một máy ảo lớn hơn
  - Chuyển sang SaaS
  - Tăng dung lượng object storage
  answer_index: 0
  explanation_md: 'AZ là datacenter cô lập trong một region; chạy nhiều AZ thì một nơi hỏng các nơi khác vẫn phục vụ. Máy lớn hơn vẫn là một điểm lỗi duy nhất.'
