# Concept-hub placement items (C1 level-1 mcq, C2 level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: sd.networking.load_balancing
items:
- id: P950
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Điểm khác biệt chính giữa load balancer L4 và L7 là gì?
  choices:
  - L4 chia theo kết nối TCP/UDP mà không đọc nội dung; L7 đọc được HTTP (URL, header, cookie) nên định tuyến theo nội dung và kết thúc TLS được
  - L4 đọc URL và header HTTP còn L7 chỉ nhìn IP/port
  - L4 và L7 khác nhau chỉ ở tốc độ, khả năng hoàn toàn như nhau
  - L7 nhanh hơn L4 vì không phải parse nội dung gói tin
  answer_index: 0
  explanation_md: L4 nhanh nhưng mù nội dung; L7 hiểu HTTP nên route theo path/header và terminate TLS, đổi lại tốn CPU hơn.
- id: P951
  difficulty: 2
  type: mcq
  minutes: 2
  prompt_md: Hệ giữ hàng triệu kết nối WebSocket sống hàng giờ, server đồng đều, mỗi kết nối tồn tại rất lâu. Chọn thuật toán chia tải nào và vì sao?
  choices:
  - Round robin, vì nó chia đều tuyệt đối trong mọi tình huống
  - Hash theo IP khách, vì mục tiêu chính là cùng một khách luôn về cùng một server
  - Weighted round robin với trọng số bằng nhau, vì server đồng đều nên không cần gì thêm
  - Least connections, vì tải thật là số kết nối đang mở; round robin chỉ đếm lượt phát nên dồn kết nối sống lâu vào vài máy
  answer_index: 3
  explanation_md: Với kết nối giữ lâu, số kết nối đang mở mới là tải; least connections cân bằng đúng thứ đó. Round robin chỉ đều khi mỗi request ngắn và tốn gần như nhau.
