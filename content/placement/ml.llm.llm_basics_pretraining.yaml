# Concept-hub placement items (C1 level-1 mcq, C2 level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: ml.llm.llm_basics_pretraining
items:
- id: P962
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - du-doan-token-tiep-theo-voi-hom-nay-troi
  prompt_md: LLM được pretraining bằng nhiệm vụ nào, và token là gì?
  choices:
  - Dự đoán token tiếp theo (next-token prediction) trên lượng lớn văn bản; token là mảnh chữ, đơn vị tính tiền và đo context window
  - Phân loại câu thành tích cực hoặc tiêu cực; token là một từ nguyên vẹn
  - Dịch máy giữa hai ngôn ngữ; token là một câu
  - Dự đoán nhãn do con người gán sẵn; token là một ký tự cố định
  answer_index: 0
  explanation_md: Pretraining là next-token prediction; token là mảnh chữ, vừa là đơn vị tính chi phí vừa là đơn vị đo context window.
- id: P963
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - context-window-va-knowledge-cutoff-luong
  prompt_md: Chatbot nội bộ dùng LLM bị hỏi về chính sách công ty vừa ban hành tuần trước và trả lời sai. Có đề xuất mua model có context window lớn hơn thì model sẽ tự biết chính sách mới. Nhận định nào đúng?
  choices:
  - Đúng, context window càng lớn thì model càng cập nhật kiến thức mới
  - Đúng, vì context window và knowledge cutoff thực chất là một thứ
  - 'Sai: context window chỉ là số token tối đa cho một lần gọi; model không tự biết tin sau mốc huấn luyện, phải đưa chính sách vào prompt (ví dụ qua RAG)'
  - 'Sai: phải pretrain lại model từ đầu mỗi khi có chính sách mới'
  answer_index: 2
  explanation_md: Knowledge cutoff khác context window. Dữ liệu mới phải được đưa vào prompt (RAG); pretrain lại từ đầu là quá đắt và không cần.
