- id: P1582
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Vì sao ML cộng log xác suất thay vì nhân các xác suất?
  choices:
  - Tích nhiều số nhỏ dễ bị làm tròn về 0, còn tổng các log thì không
  - Log làm mọi xác suất bằng nhau
  - Phép cộng luôn cho kết quả lớn hơn phép nhân
  - Log biến số âm thành số dương
  answer_index: 0
  explanation_md: log(a·b) = log a + log b nên tổng log thay cho tích và tránh underflow.
- id: P1583
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Hàm nào ép mọi số thực vào khoảng (0, 1)?
  choices:
  - Sigmoid
  - ReLU
  - tanh
  - Hàm đồng nhất f(x) = x
  answer_index: 0
  explanation_md: Sigmoid cho giá trị trong (0, 1); tanh cho (−1, 1); ReLU là max(0, z) không bị chặn trên.
