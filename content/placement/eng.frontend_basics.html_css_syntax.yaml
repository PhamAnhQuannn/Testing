items:
- id: P1916
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - luat-css-va-selector-ten-chon-thuoc-tinh
  prompt_md: 'Luật CSS nào chọn mọi phần tử có class "nut" và đổi màu chữ thành đỏ?'
  choices:
  - '.nut { color: red; }'
  - '#nut { color: red; }'
  - 'nut { color: red; }'
  - '<nut color="red">'
  answer_index: 0
  explanation_md: 'Dấu chấm chọn theo class. Dấu # chọn theo id, còn "nut" không có tiền tố chọn thẻ tên nut.'
- id: P1917
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - box-model-moi-the-la-mot-hop-gom-noi-dun
  prompt_md: 'Theo box model mặc định (content-box), một hộp có width 100px, padding 10px mỗi bên, border 2px mỗi bên, margin 5px mỗi bên. Bề rộng của hộp (chưa tính margin) là bao nhiêu?'
  choices:
  - 100px
  - 120px
  - 124px
  - 134px
  answer_index: 2
  explanation_md: 'Content 100 + padding 20 + border 4 = 124px. Margin nằm ngoài hộp; cộng margin thì chiếm chỗ 134px.'
