# Concept-hub placement items (level-1 mcq, level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: eng.devops_cloud.sre_incidents
items:
- id: P1906
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - error-budget-phan-loi-con-duoc-phep-tron
  prompt_md: Với một SLO cho trước, **error budget** là gì?
  choices:
  - Ngân sách tiền dành cho việc mua server
  - Phần không tin cậy còn được phép, bằng 1 trừ SLO
  - Số lượng cảnh báo tối đa mỗi ngày
  - Cam kết đền bù với khách hàng
  answer_index: 1
  explanation_md: 'Error budget = 1 - SLO, tức mức lỗi còn được phép. Cam kết có đền bù với khách là SLA, không phải error budget.'
- id: P1907
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - incident-quy-trinh-phan-loai-giam-thieu
  prompt_md: 'Đang có sự cố production làm nhiều người dùng bị lỗi. Thứ tự ưu tiên đúng của on-call là gì?'
  choices:
  - Tìm root cause trước, rồi mới khôi phục dịch vụ
  - Khôi phục dịch vụ trước (mitigate, ví dụ rollback), rồi điều tra root cause và làm postmortem
  - Chờ đến sáng hôm sau để cả đội cùng xử lý
  - Tìm người gây ra lỗi để nhắc nhở trước
  answer_index: 1
  explanation_md: 'Mitigate đi trước để giảm thiệt hại và MTTR; root cause và blameless postmortem làm sau. Postmortem tập trung vào hệ thống, không đổ lỗi cá nhân.'
