# read_code expected_output = real stdout of `code` (computed by running it, never typed).
subtopic_id: dsa.concurrency_coding.producer_consumer_pool
items:
- id: P1507
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Producer sinh dữ liệu nhanh hơn consumer xử lý. Với bounded buffer, điều gì xảy ra khi buffer đầy?
  choices:
  - Producer bị block (hoặc bị từ chối) cho đến khi có chỗ trống, đó là backpressure
  - Buffer tự động mở rộng vô hạn
  - Consumer bị dừng cho tới khi producer xong
  - Phần tử cũ nhất luôn bị xoá để nhường chỗ
  answer_index: 0
  explanation_md: Bounded buffer giới hạn kích thước nên khi đầy phải chặn hoặc từ chối producer (backpressure), nhờ đó bộ nhớ không phình ra vô hạn.
- id: P1508
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "q = []\ncap = 2\nfor x in [7, 8, 9]:\n    if len(q) < cap:\n        q.append(x)\n        print(\"ok\", x)\n    else:\n        print(\"full\", x)\nprint(q.pop(0), len(q))"
  expected_output: "ok 7\nok 8\nfull 9\n7 1"
- id: P1509
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Thread pool dùng một work queue chung. Lợi ích chính là gì?
  choices:
  - Tái sử dụng số worker cố định thay vì tạo thread mới cho mỗi task, và queue tách tốc độ nhận việc khỏi tốc độ xử lý
  - Đảm bảo mọi task chạy đúng thứ tự mà không cần đồng bộ
  - Làm mỗi task chạy nhanh hơn nhờ dùng nhiều core cho một task
  - Loại bỏ hoàn toàn race condition
  answer_index: 0
  explanation_md: Pool giới hạn số worker và tái sử dụng chúng; queue làm đệm giữa nơi sinh việc và nơi xử lý. Nó không tự loại bỏ race condition trên dữ liệu chia sẻ.
