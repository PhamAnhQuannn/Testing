subtopic_id: sd.technologies.stores
items:
- id: P958
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - postgresql-mac-dinh-cho-du-lieu-app-gioi
  prompt_md: Kho dữ liệu nào là lựa chọn mặc định hợp lý cho dữ liệu giao dịch có quan hệ, cần ACID, join và secondary index?
  choices:
  - Object storage như S3
  - PostgreSQL (relational database)
  - Cassandra (wide-column)
  - Một cache như Redis làm kho chính
  answer_index: 1
  explanation_md: Relational như PostgreSQL cho giao dịch ACID, join và index; giới hạn là ghi dồn về một primary.
- id: P959
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - postgresql-mac-dinh-cho-du-lieu-app-gioi
  - s3-blob-file-lon-re-va-ben-khong-sua-tun
  prompt_md: 'Ứng dụng chia sẻ ảnh: metadata ảnh (chủ sở hữu, album, quyền truy cập) cần quan hệ và giao dịch; file ảnh gốc hàng MB mỗi tấm, hàng tỷ tấm, cần rẻ và bền. Thiết kế lưu trữ nào hợp lý?'
  choices:
  - Lưu cả metadata lẫn byte ảnh trong cùng một bảng PostgreSQL
  - Metadata ở PostgreSQL, byte ảnh ở object storage (S3) và lưu key/URL của ảnh trong metadata
  - Lưu cả hai vào DynamoDB vì nó scale ngang
  - Lưu byte ảnh trong Redis để đọc nhanh nhất
  answer_index: 1
  explanation_md: 'Mẫu chuẩn: metadata ở Postgres (quan hệ, giao dịch), blob ở S3 (rẻ, bền). Nhét blob vào DB hay Redis đắt và không hợp; S3 không thay được DB quan hệ.'
