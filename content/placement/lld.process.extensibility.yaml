subtopic_id: lld.process.extensibility
items:
- id: P1549
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Người phỏng vấn thêm "giá ngày lễ". Thiết kế theo OCP xử lý thế nào tốt nhất?
  choices:
  - Thêm một class hoặc một mục dữ liệu cho luật mới, không sửa code lõi đang chạy tốt
  - Thêm một nhánh if/elif vào hàm tính phí cũ
  - Viết lại toàn bộ chương trình từ đầu
  - Từ chối yêu cầu vì thiết kế đã chốt
  answer_index: 0
  explanation_md: Điểm mở rộng (Strategy, bảng luật) cho phép thêm loại mới mà không đụng lõi, nên ít rủi ro làm hỏng ca cũ.
- id: P1550
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Vì sao nên cho code gọi một interface Store (put, get) thay vì dùng thẳng dict?
  choices:
  - Để đổi nơi lưu (dict sang file hay database) mà không sửa code lõi
  - Để chương trình chạy nhanh hơn gấp nhiều lần
  - Để không bao giờ phải viết test
  - Vì Python bắt buộc dùng interface
  answer_index: 0
  explanation_md: Lõi chỉ phụ thuộc abstraction (DIP), còn cài đặt cụ thể thay được. Đây là lý do chính, không phải tốc độ.
- id: P1551
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code in ra gì?'
  code: "class Flat:\n    def cost(self, h):\n        return h * 10\n\n\nclass Weekend:\n    def cost(self, h):\n        return h * 15\n\n\ndef total(rule, hours):\n    return sum(rule.cost(h) for h in hours)\n\n\nprint(total(Flat(), [1, 2, 3]))\nprint(total(Weekend(), [1, 2, 3]))"
  expected_output: "60\n90"
