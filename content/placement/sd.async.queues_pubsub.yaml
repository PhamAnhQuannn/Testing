# Concept-hub placement items (C1 level-1 mcq, C2 level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: sd.async.queues_pubsub
items:
- id: P954
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - competing-consumers-nhieu-worker-cung-la
  - pub-sub-mot-tin-duoc-phat-cho-moi-ben-da
  prompt_md: Khác biệt giữa message queue và pub/sub là gì?
  choices:
  - Queue gửi mỗi tin cho mọi consumer, pub/sub gửi mỗi tin cho một consumer
  - Hai thứ này giống hệt nhau, chỉ khác tên gọi
  - Queue chỉ dùng trong cùng một máy, pub/sub dùng giữa nhiều máy
  - 'Queue: mỗi tin được xử lý bởi một consumer (chia việc); pub/sub: mỗi tin fan-out tới mọi subscriber'
  answer_index: 3
  explanation_md: Queue = competing consumers (một tin một consumer). Pub/sub = fan-out cho mọi subscriber cần sự kiện đó.
- id: P955
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - pub-sub-mot-tin-duoc-phat-cho-moi-ben-da
  prompt_md: Khi một đơn hàng được tạo, ba hệ thống độc lập (gửi email, cập nhật kho, ghi analytics) đều phải nhận sự kiện này, và có thể thêm hệ thống thứ tư sau này mà không sửa service đơn hàng. Broker mặc định là at-least-once. Chọn thiết kế nào?
  choices:
  - Dùng một queue duy nhất, ba consumer cùng rút từ đó
  - 'Pub/sub (topic): fan-out cho mọi subscriber, mỗi bên có queue riêng; consumer phải idempotent vì tin có thể tới nhiều lần'
  - Gọi đồng bộ từng service trong request tạo đơn để chắc chắn hơn
  - Pub/sub, và vì at-least-once nên không cần lo tin bị trùng
  answer_index: 1
  explanation_md: Nhiều bên cùng cần một sự kiện là fan-out của pub/sub. Một queue chung chia tin chứ không nhân bản. At-least-once nghĩa là có thể trùng, nên consumer cần idempotent.
