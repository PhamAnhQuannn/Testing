# Placement-only items (P0 mcq / P1 read_code). Validated by content/schemas/placement.schema.json.
# read_code expected_output = real stdout of `code` (computed by running it, never typed).
subtopic_id: dsa.linked_list.ll_basics
items:
- id: P925
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Vì sao truy cập phần tử thứ `i` của singly linked list là O(n) chứ không
    phải O(1)?
  choices:
  - Vì các node nằm liên tiếp trong bộ nhớ
  - Vì phải đi từ head theo con trỏ `next` qua từng node
  - Vì mỗi node lưu cả danh sách
  - Vì linked list luôn phải được sắp xếp
  answer_index: 1
  explanation_md: Không có chỉ số trực tiếp như mảng; muốn tới node thứ i phải đi
    qua i con trỏ `next`.
- id: P926
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong singly linked list, muốn xóa node `B` ở giữa (đã giữ được node
    `A` đứng ngay trước `B`) thì làm gì?
  choices:
  - '`A.next = B.next`'
  - '`B.next = A`'
  - '`A.next = None`'
  - '`B = None`'
  answer_index: 0
  explanation_md: 'Cho `A` trỏ qua `B` tới node sau `B`: `A.next = B.next`. Gán `B
    = None` chỉ đổi biến cục bộ, không đổi danh sách.'
- id: P927
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Dummy head (node giả đặt trước head) được dùng chủ yếu để làm gì?
  choices:
  - Làm danh sách chạy nhanh hơn
  - Tránh xử lý riêng trường hợp thêm/xóa tại head
  - Tiết kiệm bộ nhớ
  - Cho phép truy cập ngẫu nhiên
  answer_index: 1
  explanation_md: Có dummy thì head cũng có node đứng trước, nên thao tác chèn/xóa
    đồng nhất, không cần case đặc biệt.
- id: P928
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "class Node:\n    def __init__(self, val, nxt=None):\n        self.val = val\n\
    \        self.next = nxt\n\nhead = Node(1, Node(2, Node(3)))\ncur = head\nvals\
    \ = []\nwhile cur:\n    vals.append(cur.val)\n    cur = cur.next\nprint(vals)\n\
    head.next = head.next.next\nprint(head.next.val, head.next.next)"
  expected_output: '[1, 2, 3]

    3 None'
- id: P929
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "class Node:\n    def __init__(self, val, nxt=None):\n        self.val = val\n\
    \        self.next = nxt\n\nhead = Node(1, Node(2, Node(3)))\nprev = None\ncur\
    \ = head\nwhile cur:\n    cur.next, prev, cur = prev, cur, cur.next\nout = []\n\
    while prev:\n    out.append(prev.val)\n    prev = prev.next\nprint(out)\nprint(head.val,\
    \ head.next)"
  expected_output: '[3, 2, 1]

    1 None'
