- id: P1352
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Class chỉ định nghĩa `__repr__`. `print(obj)` in ra gì?'
  choices:
  - Chuỗi do `__repr__` trả về
  - '`<__main__.X object at 0x...>`'
  - '`TypeError`, vì thiếu `__str__`'
  - Chuỗi rỗng
  answer_index: 0
  explanation_md: '`__str__` mặc định rơi về `__repr__`, nên `print` dùng `__repr__` khi không có `__str__`.'
- id: P1353
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    class B:
        def __init__(self, n):
            self.n = n

        def __len__(self):
            return self.n

        def __add__(self, o):
            return B(self.n + o.n)


    x = B(2) + B(1)
    print(len(x), bool(B(0)), bool(x))
  expected_output: 3 False True
