# Concept-hub placement items (C1 level-1 mcq, C2 level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: sd.data.sql_vs_nosql
items:
- id: P940
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Lý do nào sau đây là hợp lý nhất để chọn relational database (SQL) thay vì NoSQL?
  choices:
  - Cần scale ghi gần như vô hạn mà không phải nghĩ tới partition key
  - Dữ liệu không có schema cố định, mỗi bản ghi một dạng khác nhau
  - Cần transaction ACID trên nhiều bảng và truy vấn JOIN linh hoạt trên dữ liệu có quan hệ rõ ràng
  - Muốn bỏ hẳn việc thiết kế index
  answer_index: 2
  explanation_md: SQL mạnh ở transaction ACID, ràng buộc toàn vẹn và JOIN/ad-hoc query trên dữ liệu có quan hệ. Scale ghi ngang và schema linh hoạt là điểm mạnh điển hình của NoSQL; index thì SQL vẫn cần.
- id: P941
  difficulty: 2
  type: mcq
  minutes: 2
  prompt_md: 'Một mạng xã hội lưu activity feed: ghi hàng chục nghìn event/giây, truy vấn gần như duy nhất là "lấy 50 event mới nhất của một user", không cần JOIN, chấp nhận eventual consistency. Lựa chọn lưu trữ nào hợp lý nhất?'
  choices:
  - PostgreSQL một node, vì SQL luôn nhanh hơn với mọi khối lượng ghi
  - Wide-column hoặc key-value store (như Cassandra, DynamoDB) với partition key là user_id, sắp xếp theo thời gian
  - Document store nhưng gộp mọi event của mọi user vào một document duy nhất
  - Relational DB, mỗi lần đọc feed JOIN 5 bảng đã chuẩn hoá
  answer_index: 1
  explanation_md: Access pattern đã biết trước (theo user, mới nhất trước), ghi lớn và không cần JOIN nên key-value/wide-column với partition key user_id scale ngang tốt nhất. Một node SQL là nút cổ chai ghi, một document khổng lồ tạo hot spot, còn JOIN 5 bảng mỗi lần đọc quá đắt.
