subtopic_id: ml.system_design.fraud_detection
items:
- id: P1150
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong bài toán phát hiện gian lận (fraud detection), tỷ lệ giao dịch gian lận rất thấp (class imbalance). Cách đánh giá nào phù hợp nhất?
  choices:
  - Dùng accuracy vì nó dễ hiểu nhất
  - Dùng precision/recall (PR-AUC) và chọn ngưỡng theo chi phí của false positive so với false negative
  - Chỉ dùng recall, bỏ qua precision
  - Chỉ cần cân bằng lại dữ liệu rồi dùng accuracy
  answer_index: 1
  explanation_md: Với dữ liệu mất cân bằng, accuracy gây hiểu lầm (đoán toàn 'không gian lận' vẫn ~99%). Cần PR-AUC và ngưỡng theo trade-off chi phí FP/FN.
