subtopic_id: eng.architecture.layered_patterns
items:
- id: P1912
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - controller-service-repository-controller
  prompt_md: Trong kiến trúc controller / service / repository, lớp nào chịu trách nhiệm đọc và ghi database?
  choices:
  - Repository
  - Controller
  - Service
  - View
  answer_index: 0
  explanation_md: 'Repository là lớp truy cập database. Controller nhận request và trả response, service chứa luật nghiệp vụ.'
- id: P1913
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - dependency-injection-lop-nhan-thu-no-can
  prompt_md: 'Class OrderService tự tạo Database() trong constructor nên test phải dùng database thật. Cách sửa phù hợp nhất và lý do?'
  choices:
  - Nhận database qua tham số constructor (DI); khi test truyền đối tượng giả
  - Chuyển toàn bộ code của OrderService vào controller
  - Tạo Database ở biến toàn cục để mọi nơi dùng chung
  - Đổi tên class cho rõ nghĩa hơn
  answer_index: 0
  explanation_md: 'DI cho lớp nhận dependency từ ngoài nên test có thể truyền fake/mock thay database thật. Biến toàn cục không giải quyết việc thay thế khi test.'
