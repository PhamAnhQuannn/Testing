subtopic_id: dsa.practical.file_log_parsing
items:
- id: P1482
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Khi đọc log, một dòng thiếu cột (ví dụ chỉ có 2 phần thay vì 3). Cách xử lý an toàn nhất trong bài top-N là gì?
  choices:
  - Kiểm tra số cột rồi bỏ qua dòng đó và tiếp tục
  - Truy cập cột thứ 3 và để IndexError dừng chương trình
  - Dừng đọc file ngay tại dòng đó
  - Đếm dòng đó như một key rỗng
  answer_index: 0
  explanation_md: Dòng hỏng không nên làm hỏng cả kết quả; kiểm tra len(parts) trước rồi continue là chính sách rõ ràng và an toàn.
- id: P1483
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "rows = \"a=1;b=2;;c\"\nd = {}\nfor item in rows.split(\";\"):\n    if \"=\" not in item:\n        continue\n    k, v = item.split(\"=\")\n    d[k] = int(v)\nprint(d)\nprint(len(rows.split(\";\")))"
  expected_output: "{'a': 1, 'b': 2}\n4"
