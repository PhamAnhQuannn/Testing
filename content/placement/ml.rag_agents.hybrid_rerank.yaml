subtopic_id: ml.rag_agents.hybrid_rerank
items:
- id: P1109
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Vì sao hybrid search kết hợp BM25 (từ khóa) với vector search (ngữ nghĩa)?
  choices:
  - Vì BM25 luôn chính xác hơn vector nên vector chỉ là dự phòng
  - Vì vector search không cần index nên kết hợp để tiết kiệm bộ nhớ
  - Vì vector bắt tốt ý nghĩa tương đồng còn BM25 bắt tốt mã số, tên riêng, từ khóa chính xác; kết hợp bù điểm yếu cho nhau
  - Vì hai phương pháp cho cùng một kết quả nên chạy cả hai để kiểm tra lại
  answer_index: 2
  explanation_md: Hai cách có điểm mạnh khác nhau (ngữ nghĩa vs khớp từ chính xác). Hợp nhất kết quả, ví dụ bằng RRF, rồi có thể rerank.
- id: P1110
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    A = ["d1", "d2", "d3"]
    B = ["d3", "d1", "d4"]
    k = 60
    score = {}
    for ranking in (A, B):
        for rank, doc in enumerate(ranking, start=1):
            score[doc] = score.get(doc, 0) + 1 / (k + rank)
    fused = sorted(score, key=lambda d: -score[d])
    print(fused)
  expected_output: "['d1', 'd3', 'd2', 'd4']"
