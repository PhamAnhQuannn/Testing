subtopic_id: sd.distributed.time_ordering
items:
- id: P1217
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Vì sao hệ phân tán dùng logical clock (Lamport, vector clock) thay vì dựa vào wall clock để sắp thứ tự sự kiện?"
  choices:
  - "Vì wall clock luôn đồng bộ tuyệt đối giữa các máy"
  - "Vì đồng hồ vật lý giữa các máy lệch nhau nên không đáng tin để suy ra thứ tự nhân quả"
  - "Vì logical clock cho biết giờ thực chính xác"
  - "Vì logical clock không cần gửi kèm message"
  answer_index: 1
  explanation_md: "Đồng hồ vật lý giữa các máy bị lệch (clock skew), không đáng tin; logical clock nắm bắt quan hệ happened-before, và vector clock còn phát hiện được sự kiện đồng thời."
