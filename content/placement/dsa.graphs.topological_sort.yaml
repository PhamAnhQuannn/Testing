items:
- id: P1420
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Đồ thị có hướng có chu trình thì thuật toán Kahn (đếm bậc vào) cho kết quả gì?
  choices:
  - Vẫn lấy ra đủ mọi nút nhưng theo thứ tự ngẫu nhiên
  - Các nút trên chu trình không bao giờ có bậc vào 0 nên số nút lấy ra nhỏ hơn n
  - Thuật toán chạy vô hạn
  - Bậc vào của mọi nút đều bằng 0
  answer_index: 1
  explanation_md: Nút trên chu trình luôn có ít nhất một cạnh vào từ nút chưa được lấy ra, nên bậc vào không về 0; số nút lấy ra < n báo hiệu chu trình.
- id: P1421
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "import heapq\n\nn = 4\nprereqs = [[0, 2], [1, 2], [3, 0]]\nadj = [[] for _ in range(n)]\nindeg = [0] * n\nfor a, b in prereqs:\n    adj[b].append(a)\n    indeg[a] += 1\nprint(indeg)\nheap = [i for i in range(n) if indeg[i] == 0]\nheapq.heapify(heap)\nout = []\nwhile heap:\n    u = heapq.heappop(heap)\n    out.append(u)\n    for v in adj[u]:\n        indeg[v] -= 1\n        if indeg[v] == 0:\n            heapq.heappush(heap, v)\nprint(out)"
  expected_output: '[1, 1, 0, 1]

    [2, 0, 1, 3]'
