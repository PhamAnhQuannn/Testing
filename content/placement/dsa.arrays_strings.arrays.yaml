# Placement-only items (P0 mcq / P1 read_code).
subtopic_id: dsa.arrays_strings.arrays
items:
- id: P1065
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Với `a = [10, 20, 30, 40, 50]`, biểu thức `a[-1]` trả về gì, và truy cập phần tử theo index tốn độ phức tạp nào?
  choices:
  - '`10`, O(n)'
  - '`50`, O(1)'
  - '`40`, O(1)'
  - Lỗi IndexError
  answer_index: 1
  explanation_md: Index âm đếm từ cuối nên `a[-1]` là `50`; truy cập theo index (random access) là O(1).
- id: P1066
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    a = [10, 20, 30, 40, 50]
    print(a[1:4])
    print(a[-2])
    print(a[::2])
    print(a[3:])
    a[0] = 99
    print(a[:2])
  expected_output: |-
    [20, 30, 40]
    40
    [10, 30, 50]
    [40, 50]
    [99, 20]
