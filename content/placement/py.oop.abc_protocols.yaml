subtopic_id: py.oop.abc_protocols
items:
- id: P1358
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Class `B(A)` kế thừa ABC `A` nhưng chưa cài một `@abstractmethod` của `A`. Điều gì xảy ra với `B()`?'
  choices:
  - 'Ném `TypeError`, vì còn method trừu tượng chưa cài'
  - 'Tạo được object bình thường, gọi method đó mới lỗi'
  - 'Ném `AttributeError` lúc khai báo class `B`'
  - 'Trả về `None`'
  answer_index: 0
  explanation_md: 'Class còn method trừu tượng chưa cài không tạo được object: `B()` ném `TypeError`. Lỗi xuất hiện lúc tạo object, không phải lúc khai báo class.'
- id: P1359
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    class Vit:
        def keu(self):
            return "Quac"

    class Da:
        pass

    for x in (Vit(), Da()):
        try:
            print(x.keu())
        except AttributeError:
            print("none")
  expected_output: |-
    Quac
    none
