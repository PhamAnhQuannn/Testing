subtopic_id: dsa.concurrency_coding.concurrent_io_async
items:
- id: P1510
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Khi nào async (event loop, `await`) giúp chương trình nhanh hơn rõ rệt?
  choices:
  - Khi tác vụ chủ yếu chờ I/O (mạng, đĩa), vì các lần chờ được chồng lên nhau
  - Khi tác vụ chủ yếu tính toán nặng trên CPU
  - Khi muốn dùng nhiều core CPU cùng lúc
  - Khi cần gọi hàm đệ quy sâu hơn
  answer_index: 0
  explanation_md: Async chạy trên một thread và chuyển task khi một task đang chờ I/O, nên chồng thời gian chờ; việc CPU-bound không nhanh hơn.
- id: P1511
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì?'
  code: "tasks = [(0, 3, 1), (1, 1, 2), (2, 0, 3)]\nprint([t[2] for t in sorted(tasks, key=lambda t: (t[0] + t[1], t[2]))])"
  expected_output: '[2, 3, 1]'
- id: P1512
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
