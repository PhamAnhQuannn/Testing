subtopic_id: sd.distributed.consensus
items:
- id: P1214
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Trong Raft hoặc Paxos, vì sao cần majority quorum để bầu leader và commit entry?"
  choices:
  - "Để mọi node đều phải đồng ý mới tiến hành"
  - "Để tăng tốc bằng cách bỏ qua các node chậm mà không cần điều kiện gì"
  - "Để hai nhóm majority giao nhau, tránh split-brain và đảm bảo chỉ một giá trị được chọn"
  - "Vì leader không cần được bầu"
  answer_index: 2
  explanation_md: "Hai majority luôn giao nhau nên không thể có hai leader cùng term hoặc hai giá trị khác nhau được commit; chịu được f lỗi với 2f+1 node."
