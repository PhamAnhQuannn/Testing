subtopic_id: ml.system_design.ads_ctr_auction
items:
- id: P1153
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong hệ thống quảng cáo, CTR prediction và auction kết hợp với nhau như thế nào?
  choices:
  - Auction chọn quảng cáo ngẫu nhiên, CTR chỉ để báo cáo
  - Chỉ xếp hạng theo giá bid cao nhất, không cần CTR
  - Chỉ xếp hạng theo pCTR cao nhất, bỏ qua bid
  - Xếp hạng theo eCPM ~ bid x pCTR, nên pCTR cần được calibrate tốt vì nó ảnh hưởng trực tiếp tới thứ hạng và giá
  answer_index: 3
  explanation_md: eCPM = bid x pCTR (x pCVR nếu có). Nếu pCTR lệch (không calibrated) sẽ chọn sai quảng cáo và định giá sai trong auction.
