items:
- id: P1446
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong hàm backtracking sinh tập con, sau lời gọi đệ quy ta gọi path.pop(). Mục đích của nó là gì?
  choices:
  - Hoàn tác lựa chọn vừa thêm để nhánh kế tiếp bắt đầu từ trạng thái cũ
  - Sắp xếp lại path theo thứ tự tăng dần
  - Lưu path vào danh sách kết quả
  - Giảm độ sâu đệ quy xuống còn một nửa
  answer_index: 0
  explanation_md: path dùng chung cho mọi nhánh; không pop thì phần tử của nhánh trước còn sót lại làm sai nhánh sau.
- id: P1447
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "def f(n):\n    out = []\n\n    def bt(path, o, c):\n        if len(path) == 2 * n:\n            out.append(\"\".join(path))\n            return\n        if o < n:\n            path.append(\"(\")\n            bt(path, o + 1, c)\n            path.pop()\n        if c < o:\n            path.append(\")\")\n            bt(path, o, c + 1)\n            path.pop()\n\n    bt([], 0, 0)\n    return out\n\nprint(f(2))\nprint(len(f(3)))"
  expected_output: "['(())', '()()']\n5"
