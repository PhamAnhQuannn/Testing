# Placement-only items (P0 mcq / P1 read_code). Validated by content/schemas/placement.schema.json.
# read_code expected_output = real stdout of `code` (computed by running it, never typed).
subtopic_id: py.datastructs.comprehensions
items:
- id: P987
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: '`[x * 2 for x in range(5) if x % 2 == 0]` trả về gì?'
  choices:
  - '`[0, 4, 8]`'
  - '`[0, 2, 4, 6, 8]`'
  - '`[2, 6]`'
  - '`[0, 2, 4]`'
  answer_index: 0
  explanation_md: 'Điều kiện `if` lọc `x` chẵn: 0, 2, 4; sau đó nhân đôi thành 0, 4, 8.'
- id: P988
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    nums = [1, 2, 3, 4, 5]
    sq = [n * n for n in nums if n > 2]
    print(sq)
    pairs = [(i, j) for i in range(2) for j in range(2)]
    print(pairs)
    flat = [v for row in [[1, 2], [3], [4, 5]] for v in row]
    print(flat)
    d = {w: len(w) for w in ["a", "bb", "ccc"]}
    print(d)
    g = (n for n in nums)
    print(sum(g), sum(g))
  expected_output: |-
    [9, 16, 25]
    [(0, 0), (0, 1), (1, 0), (1, 1)]
    [1, 2, 3, 4, 5]
    {'a': 1, 'bb': 2, 'ccc': 3}
    15 0
