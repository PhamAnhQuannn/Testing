subtopic_id: eng.apis.api_versioning_webhooks
items:
- id: P1872
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - breaking-vs-additive-change-them-truong
  prompt_md: Thay đổi nào sau đây thường KHÔNG làm vỡ client cũ của một API?
  choices:
  - Xóa một trường khỏi response
  - Đổi kiểu của trường price từ số sang chuỗi
  - Thêm một trường tùy chọn mới vào response
  - Đổi tên đường dẫn /orders thành /o
  answer_index: 2
  explanation_md: Thêm trường tùy chọn là additive nên client cũ bỏ qua phần thừa. Xóa trường, đổi kiểu và đổi tên URL đều là breaking.
- id: P1873
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - bao-ve-webhook-ky-noi-dung-bang-hmac-cho
  prompt_md: Provider gửi webhook tới server của bạn và có thể retry khi không nhận được 2xx. Cách nhận đúng nhất là gì?
  choices:
  - Bỏ qua kiểm tra chữ ký để xử lý nhanh hơn
  - Kiểm tra chữ ký, trả 2xx nhanh và bỏ qua tin trùng dựa trên event id
  - Xử lý mọi lần nhận như một sự kiện mới vì retry không bao giờ gửi trùng
  - Định kỳ gọi provider để hỏi sự kiện mới thay vì nhận webhook
  answer_index: 1
  explanation_md: 'Webhook là push và có retry nên tin trùng là bình thường: kiểm tra chữ ký HMAC để chắc tin thật, trả 2xx nhanh, và xử lý idempotent theo event id. Hỏi định kỳ là polling, không phải webhook.'
