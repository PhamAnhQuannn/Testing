subtopic_id: sd.archetypes.kv_store
items:
- id: P1193
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Thiết kế distributed key-value store kiểu Dynamo cần scale ngang và chịu lỗi node. Bộ ba cơ chế cốt lõi là gì?
  choices:
  - Consistent hashing để phân vùng, replication nhiều node, và quorum (R + W > N) để cân bằng consistency
  - Chỉ sharding theo thứ tự chữ cái, không replication
  - Một master duy nhất xử lý mọi ghi
  - Lưu toàn bộ dữ liệu trên một máy lớn
  answer_index: 0
  explanation_md: Consistent hashing chia key đều và ít di chuyển khi thêm/bớt node; replicate N bản; quorum R+W>N cho phép tinh chỉnh consistency vs availability.
