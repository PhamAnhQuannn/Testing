# Placement-only items (P0 mcq / P1 read_code). Validated by content/schemas/placement.schema.json.
# read_code expected_output = real stdout of `code` (computed by running it, never typed).
subtopic_id: py.datastructs.dict
items:
- id: P910
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Độ phức tạp thời gian trung bình của tra cứu `d[key]` trong `dict` là gì?
  choices:
  - O(n)
  - O(1)
  - O(log n)
  - O(n log n)
  answer_index: 1
  explanation_md: 'dict dùng hash table: tra cứu, thêm, xóa đều O(1) trung bình.'
- id: P911
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Với `d = {}`, biểu thức `d["x"]` cho kết quả nào?
  choices:
  - '`None`'
  - '`0`'
  - Ném `KeyError`
  - Chuỗi rỗng `""`
  answer_index: 2
  explanation_md: Đọc key không có bằng `d[key]` ném `KeyError`; muốn mặc định thì dùng `d.get(key, default)`.
- id: P912
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Kiểu nào sau đây KHÔNG thể dùng làm key của `dict`?
  choices:
  - '`tuple` `(1, 2)`'
  - '`list` `[1, 2]`'
  - '`frozenset`'
  - '`str`'
  answer_index: 1
  explanation_md: 'Key phải hashable. `list` mutable nên không hashable (`TypeError: unhashable type`).'
- id: P913
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: 'd = {"a": 1, "b": 2}

    d["c"] = d.get("c", 0) + 5

    d["a"] += 10

    print(d)

    print(d.get("z"), d.get("z", -1))

    print(list(d.keys()), len(d))'
  expected_output: '{''a'': 11, ''b'': 2, ''c'': 5}

    None -1

    [''a'', ''b'', ''c''] 3'
- id: P914
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "text = \"abracadabra\"\ncounts = {}\nfor ch in text:\n    counts[ch] = counts.get(ch, 0) + 1\n\
    print(counts)\ntop = max(counts, key=counts.get)\nprint(top, counts[top])\nprint(sorted(counts.items(),\
    \ key=lambda kv: (-kv[1], kv[0]))[:2])"
  expected_output: '{''a'': 5, ''b'': 2, ''r'': 2, ''c'': 1, ''d'': 1}

    a 5

    [(''a'', 5), (''b'', 2)]'
