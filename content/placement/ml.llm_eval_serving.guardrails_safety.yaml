subtopic_id: ml.llm_eval_serving.guardrails_safety
items:
- id: P1129
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Prompt injection là gì?
  choices:
  - Việc thêm nhiều ví dụ vào prompt để model chính xác hơn
  - Việc nén prompt để giảm số token
  - Việc cache prompt để giảm chi phí
  - Văn bản (từ người dùng hoặc dữ liệu bên ngoài) chứa chỉ thị ghi đè hướng dẫn gốc, khiến model làm điều không mong muốn
  answer_index: 3
  explanation_md: Prompt injection là tấn công đưa chỉ thị độc hại vào đầu vào; cần phòng thủ nhiều lớp như lọc, giới hạn quyền tool, không tin nội dung ngoài.
