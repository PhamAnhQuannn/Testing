subtopic_id: eng.workflow.first_project
items:
- id: P1868
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - readme-file-dau-tien-nguoi-khac-doc-ghi
  prompt_md: README của một dự án nhỏ nên có gì là quan trọng nhất?
  choices:
  - Chỉ tên dự án và tên tác giả
  - Dự án làm gì, lệnh cài và lệnh chạy cụ thể, và một ví dụ đầu vào/đầu ra
  - Toàn bộ mã nguồn dán lại cho dễ đọc
  - Danh sách mọi lỗi bạn đã gặp khi làm
  answer_index: 1
  explanation_md: 'README là file đầu tiên người khác đọc: cần cho biết dự án làm gì, cách cài/chạy và một ví dụ mẫu để họ chạy được chỉ bằng README.'
- id: P1869
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - commit-nho-loi-nhan-ro-git-init-roi-comm
  - them-test-va-tinh-nang-qua-pr-viet-vai-u
  prompt_md: Bạn làm dự án cá nhân một mình. Cách dùng Git nào cho thấy quy trình làm việc tốt nhất?
  choices:
  - Làm hết rồi commit một lần tên `final` ngay trước hạn nộp
  - Commit sau mỗi việc chạy được với lời nhắn rõ, làm tính năng mới trên nhánh riêng rồi mở PR để gộp vào main
  - Chỉ commit trực tiếp vào main và dùng `git push --force` mỗi lần để lịch sử gọn
  - Không dùng Git, chỉ nén thư mục và đổi tên theo ngày
  answer_index: 1
  explanation_md: 'Commit nhỏ với lời nhắn rõ giúp lịch sử đọc được; nhánh và PR là thói quen làm việc nhóm, kể cả khi làm một mình. Commit khổng lồ hoặc force push làm mất thông tin quá trình.'
