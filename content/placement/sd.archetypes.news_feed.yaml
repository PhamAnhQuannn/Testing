subtopic_id: sd.archetypes.news_feed
items:
- id: P1170
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "News feed: user có hàng triệu follower đăng bài. Vấn đề của fan-out on write và cách xử lý thường dùng?"
  choices:
  - "Ghi hàng triệu feed khi đăng bài rất tốn kém (celebrity problem); dùng hybrid: fan-out on write cho user thường, fan-out on read cho celebrity"
  - "Fan-out on write luôn tối ưu cho mọi user"
  - "Bỏ cache feed"
  - "Chỉ cho celebrity có tối đa 100 follower"
  answer_index: 0
  explanation_md: "Fan-out on write làm đọc nhanh nhưng đăng bài của celebrity tạo hàng triệu ghi. Hybrid: push cho user thường, pull và merge lúc đọc cho celebrity."
