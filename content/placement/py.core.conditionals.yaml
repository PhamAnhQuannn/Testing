subtopic_id: py.core.conditionals
items:
- id: P977
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - falsy-0-chuoi-rong-none-cac-gia-tri-con
  prompt_md: Giá trị nào sau đây là falsy (coi là `False` trong điều kiện `if`)?
  choices:
  - '`[0]`'
  - '`"0"`'
  - '`[]`'
  - '`" "`'
  answer_index: 2
  explanation_md: Container rỗng (`[]`, `""`, `{}`, `()`), `0` và `None` là falsy. `[0]`, `"0"` và `" "` đều không rỗng nên truthy.
- id: P978
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - bieu-thuc-dieu-kien-chan-if-n-2-0-else-l
  prompt_md: Sau `x = 5`, dòng `print("even" if x % 2 == 0 else "odd")` in ra gì?
  choices:
  - '`even`'
  - '`odd`'
  - '`True`'
  - Báo lỗi cú pháp
  answer_index: 1
  explanation_md: '`5 % 2 == 1` nên điều kiện sai, biểu thức `a if c else b` trả về `"odd"`.'
- id: P979
  difficulty: 1
  type: read_code
  minutes: 2
  concepts:
  - falsy-0-chuoi-rong-none-cac-gia-tri-con
  - kiem-tra-none-bang-x-is-none-khong-viet
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    for v in [0, "", "a", [], [0], None]:
        if v is None:
            print("none")
        elif v:
            print("truthy")
        else:
            print("falsy")
  expected_output: |-
    falsy
    falsy
    truthy
    falsy
    truthy
    none
