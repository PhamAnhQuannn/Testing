subtopic_id: lld.patterns.behavioral_observer_command
items:
- id: P1534
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong mẫu Observer, khi subject có sự kiện thì chuyện gì xảy ra?
  choices:
  - Subject gọi hàm báo cho từng subscriber đã đăng ký
  - Mỗi subscriber phải tự hỏi subject liên tục
  - Subject xóa hết subscriber sau mỗi sự kiện
  - Chỉ subscriber đầu tiên nhận được tin
  answer_index: 0
  explanation_md: Subject giữ danh sách subscriber và duyệt danh sách đó để gọi từng người khi có sự kiện (notify).
- id: P1535
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Mẫu Command giúp làm được việc nào sau đây một cách tự nhiên?
  choices:
  - Hoàn tác (undo/redo) vì mỗi thao tác là một object có execute() và undo()
  - Đảm bảo cả chương trình chỉ có một object
  - Chép sâu một object
  - Chọn class theo tên chuỗi
  answer_index: 0
  explanation_md: Command gói thao tác thành object, lưu vào stack lịch sử nên có thể pop ra rồi gọi undo().
- id: P1536
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code in ra gì?'
  code: "text = \"\"\nhistory = []\nfor piece in [\"a\", \"b\", \"c\"]:\n    text += piece\n    history.append(piece)\nlast = history.pop()\ntext = text[:len(text) - len(last)]\nprint(text)"
  expected_output: "ab"
