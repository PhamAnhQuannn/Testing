subtopic_id: sd.archetypes.workflow_engine
items:
- id: P1190
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Workflow engine (kiểu Temporal/Airflow) cần chạy quy trình nhiều bước kéo dài hàng giờ và sống sót khi worker crash. Cơ chế cốt lõi là gì?
  choices:
  - Giữ toàn bộ state trong RAM của worker
  - Chạy lại workflow từ đầu mỗi lần lỗi
  - Chỉ ghi log ra file để người vận hành xem
  - Persist trạng thái/event history bền vững (durable execution) để replay và tiếp tục từ bước đang dở
  answer_index: 3
  explanation_md: 'Durable execution: ghi lại lịch sử sự kiện/state vào storage bền, khi crash thì worker khác replay để khôi phục và chạy tiếp, các step cần idempotent.'
