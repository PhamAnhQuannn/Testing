subtopic_id: eng.apis.rest_design
items:
- id: P1870
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - resource-la-danh-tu-so-nhieu-orders-orde
  prompt_md: Endpoint nào đặt tên đúng chuẩn REST để tạo một đơn hàng mới?
  choices:
  - POST /createOrder
  - GET /orders/new
  - POST /orders
  - PUT /order/create
  answer_index: 2
  explanation_md: 'Resource là danh từ số nhiều trong URL (`/orders`) và hành động tạo nằm ở method POST; không đặt động từ trong đường dẫn.'
- id: P1871
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - status-code-nang-cao-422-du-lieu-hop-le
  prompt_md: 'Client gửi `POST /orders` với `qty` bị âm (dữ liệu không hợp lệ). Server nên trả status code nào?'
  choices:
  - 201 Created
  - 400 hoặc 422 kèm body lỗi theo dạng chung
  - 404 Not Found
  - 500 Internal Server Error
  answer_index: 1
  explanation_md: 'Dữ liệu sai là lỗi do client nên thuộc họ 4xx: 400 (hoặc 422 cho lỗi validation/nghiệp vụ). 404 là không thấy resource, 500 là lỗi server, 201 chỉ khi tạo thành công.'
