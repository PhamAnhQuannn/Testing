items:
- id: P1898
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - infrastructure-as-code-viet-file-khai-ba
  prompt_md: Infrastructure as Code (IaC) nghĩa là gì?
  choices:
  - Mô tả hạ tầng bằng file code hoặc cấu hình lưu trong Git, để dựng lại giống hệt khi cần
  - Bấm tay trên giao diện web rồi chụp màn hình lưu lại
  - Viết ứng dụng chạy nhanh hơn trên máy chủ
  - Sao lưu database mỗi đêm
  answer_index: 0
  explanation_md: 'IaC mô tả hạ tầng (máy chủ, mạng, database) bằng code/cấu hình trong Git, nên lặp lại được, có review và lịch sử thay đổi.'
- id: P1899
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - gitops-lay-git-lam-nguon-su-that-sua-fil
  prompt_md: 'Theo GitOps, khi ai đó sửa tay hạ tầng trên production khiến nó khác với Git, điều gì được mong đợi?'
  choices:
  - Agent reconcile đưa hệ thống thật về đúng như trong Git (hoặc cảnh báo drift)
  - Git tự cập nhật theo thay đổi tay
  - Không có gì xảy ra cho đến khi có người chạy deploy
  - Hệ thống bị tắt để bảo vệ dữ liệu
  answer_index: 0
  explanation_md: 'GitOps lấy Git làm source of truth; agent liên tục so sánh và reconcile, nên drift bị sửa lại hoặc bị cảnh báo. Muốn giữ thay đổi thì phải đưa vào Git qua pull request.'
