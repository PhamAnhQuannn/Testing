subtopic_id: ml.rag_agents.agent_fundamentals
items:
- id: P1111
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Vòng lặp (loop) cốt lõi của một LLM agent diễn ra như thế nào?
  choices:
  - LLM sinh toàn bộ câu trả lời một lần rồi dừng, không gọi gì thêm
  - Người dùng tự chạy từng tool rồi dán kết quả cho LLM
  - Huấn luyện lại LLM sau mỗi câu hỏi
  - LLM suy nghĩ, chọn và gọi tool, nhận kết quả (observation), rồi lặp lại cho tới khi xong hoặc chạm giới hạn bước
  answer_index: 3
  explanation_md: Agent = LLM + tool trong vòng lặp think, act, observe. Cần giới hạn số bước để tránh lặp vô tận.
