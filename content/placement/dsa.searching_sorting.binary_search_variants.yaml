  prompt_md: Trên mảng đã sắp tăng có phần tử trùng, `lower_bound(target)` trả về gì?
  choices:
  - Chỉ số đầu tiên `i` sao cho `nums[i] >= target`
  - Chỉ số cuối cùng `i` sao cho `nums[i] <= target`
  - Chỉ số bất kỳ có `nums[i] == target`
  - Số phần tử nhỏ hơn hoặc bằng target
  answer_index: 0
  explanation_md: lower_bound là ranh giới trái của các phần tử `>= target`; nếu không có thì bằng `len(nums)`.
