subtopic_id: dsa.trees.tree_recursion
items:
- id: P1404
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Khi viết đệ quy trên cây nhị phân, base case thông thường là gì?
  choices:
  - Node là lá (không có con)
  - Node là None (cây rỗng)
  - Node có đúng một con
  - Độ sâu đạt 0
  answer_index: 1
  explanation_md: Gọi đệ quy vào con trái/phải có thể gặp None, nên base case `node is None` bao phủ cả lá lẫn cây rỗng.
- id: P1405
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    class T:
        def __init__(self, v, l=None, r=None):
            self.v, self.l, self.r = v, l, r

    root = T(1, T(2, T(4)), T(3))

    def count(n):
        return 0 if n is None else 1 + count(n.l) + count(n.r)

    def leaves(n):
        if n is None:
            return 0
        if n.l is None and n.r is None:
            return 1
        return leaves(n.l) + leaves(n.r)

    print(count(root), count(root.l), count(None))
    print(leaves(root))
  expected_output: "4 2 0\n2"
