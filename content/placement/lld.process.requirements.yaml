- id: P1540
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Yêu cầu nào sau đây là yêu cầu phi chức năng của hệ thống đặt vé?
  choices:
  - Hệ thống chịu được 5000 người đặt vé cùng lúc
  - Khách chọn ghế và đặt vé
  - Nhân viên huỷ vé của khách
  - Khách xem lịch chiếu
  answer_index: 0
  explanation_md: Phi chức năng nói về mức độ tốt (tải, tốc độ, độ tin cậy); các lựa chọn còn lại là hành vi (use case).
- id: P1541
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Gặp đề LLD mơ hồ, việc nên làm đầu tiên là gì?
  choices:
  - Hỏi câu làm rõ, chốt in-scope/out-of-scope và nói to giả định để xin xác nhận
  - Vào code ngay với giả định ngầm
  - Thiết kế mọi tính năng có thể nghĩ ra
  - Chờ người phỏng vấn tự giải thích hết
  answer_index: 0
  explanation_md: Làm rõ yêu cầu và phạm vi trong khoảng 5 phút, nói to giả định để hai bên cùng hiểu một đề.
- id: P1542
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code in ra gì?'
  code: "reqs = [\"login\", \"p95 under 200ms\", \"search\", \"uptime 99.9\"]\nnf = [r for r in reqs if any(c.isdigit() for c in r)]\nprint(len(nf))\nprint(len(reqs) - len(nf))\nprint(sorted(set(reqs) - set(nf)))"
  expected_output: "2\n2\n['login', 'search']"
