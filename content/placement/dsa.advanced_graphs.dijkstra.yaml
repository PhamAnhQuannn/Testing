- id: P1424
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Vì sao Dijkstra không đảm bảo đúng khi đồ thị có cạnh trọng số âm?
  choices:
  - Đỉnh đã được chốt vẫn có thể được cải thiện qua một cạnh âm về sau
  - Heap không lưu được số âm
  - Đồ thị có cạnh âm luôn có chu trình
  - Dijkstra chỉ chạy trên đồ thị vô hướng
  answer_index: 0
  explanation_md: Dijkstra giả định đỉnh đã pop với dist nhỏ nhất là tối ưu; cạnh âm phá giả định đó, khi đó dùng Bellman-Ford.
- id: P1425
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "import heapq\n\nheap = [(4, 1), (1, 2), (3, 0)]\nheapq.heapify(heap)\nout = []\nwhile heap:\n    d, u = heapq.heappop(heap)\n    out.append(u)\nprint(out)\ndist = [0, 5, 2]\nprint(min(dist[1], dist[2] + 1))"
