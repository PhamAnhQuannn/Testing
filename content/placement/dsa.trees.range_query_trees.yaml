- id: P1410
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Với mảng hay bị cập nhật điểm xen kẽ truy vấn tổng đoạn, cấu trúc nào cho mỗi thao tác O(log n)?
  choices:
  - Mảng prefix sum dựng một lần
  - Fenwick tree (BIT)
  - Tính lại tổng bằng vòng lặp mỗi lần
  - Hash map từ chỉ số sang giá trị
  answer_index: 1
  explanation_md: Prefix sum cập nhật O(n), tính lại mỗi truy vấn O(n). Fenwick tree cập nhật điểm và truy vấn prefix đều O(log n).
- id: P1411
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "nums = [4, 1, 3, 2]\nprefix = [0]\nfor x in nums:\n    prefix.append(prefix[-1] + x)\nnums[1] = 6\nprint(prefix[3] - prefix[1])\nprint(sum(nums[1:3]))"
  expected_output: '4

    9'
