subtopic_id: sd.technologies.stream_coord
items:
- id: P1253
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Chọn công cụ nào làm event log phân tán để các consumer đọc luồng sự kiện theo partition?'
  choices:
  - 'ZooKeeper'
  - 'Kafka'
  - 'Elasticsearch'
  - 'Memcached'
  answer_index: 1
  explanation_md: 'Kafka là log phân tán (partition, offset, consumer group) cho streaming; Flink/Spark xử lý luồng; ZooKeeper/etcd dùng cho coordination.'
