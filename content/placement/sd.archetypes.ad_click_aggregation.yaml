subtopic_id: sd.archetypes.ad_click_aggregation
items:
- id: P1192
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Hệ thống tổng hợp click quảng cáo cần số click theo thời gian gần real-time và top-K quảng cáo với hàng triệu event/giây. Hướng thiết kế nào hợp lý?
  choices:
  - Insert từng click vào RDBMS rồi chạy COUNT(*) mỗi lần truy vấn
  - Stream processing (Kafka + windowed aggregation) kết hợp cấu trúc xấp xỉ như count-min sketch cho top-K
  - Lưu click trong file CSV và tổng hợp hằng tuần
  - Đếm trong bộ nhớ của một server duy nhất
  answer_index: 1
  explanation_md: Cần ingest bằng log/stream, aggregate theo cửa sổ thời gian; top-K với sketch xấp xỉ tiết kiệm bộ nhớ; có thể kèm batch để đối soát độ chính xác.
