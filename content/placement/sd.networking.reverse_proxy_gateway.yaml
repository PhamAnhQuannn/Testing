subtopic_id: sd.networking.reverse_proxy_gateway
items:
- id: P1247
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Vai trò chính của API gateway đặt ở rìa (edge) trước các microservice là gì?'
  choices:
  - 'Điểm vào duy nhất xử lý auth, routing và rate limiting trước khi chuyển request tới các service phía sau'
  - 'Lưu trữ dữ liệu quan hệ cho các service'
  - 'Thay thế hoàn toàn database của từng service'
  - 'Chỉ dùng để nén ảnh tĩnh'
  answer_index: 0
  explanation_md: 'API gateway là điểm vào duy nhất: xác thực (auth), routing, rate limiting, v.v. tập trung; reverse proxy chuyển tiếp request thay server phía sau.'
