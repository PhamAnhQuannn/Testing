- id: P1429
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "edges = [(3, 0, 1), (1, 1, 2), (2, 0, 2), (4, 2, 3)]\nparent = list(range(4))\n\ndef find(x):\n    while parent[x] != x:\n        x = parent[x]\n    return x\n\nkept = []\nfor w, u, v in sorted(edges):\n    ru, rv = find(u), find(v)\n    if ru != rv:\n        parent[ru] = rv\n        kept.append(w)\nprint(kept)\nprint(sum(kept))"
  expected_output: '[1, 2, 4]

    7'
