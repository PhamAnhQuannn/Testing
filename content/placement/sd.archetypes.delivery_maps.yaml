subtopic_id: sd.archetypes.delivery_maps
items:
- id: P1201
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Ứng dụng giao đồ ăn hiển thị vị trí shipper theo thời gian thực và ETA. Thiết kế cốt lõi nào đúng?
  choices:
  - Shipper gửi vị trí định kỳ qua kênh nhẹ vào store theo geospatial index; ETA tính trên đồ thị đường (routing) cộng traffic
  - Khách hàng tự hỏi shipper bằng điện thoại
  - Lưu vị trí vào DB quan hệ mỗi lần và khách đọc trực tiếp
  - Tính ETA bằng đường chim bay là đủ chính xác
  answer_index: 0
  explanation_md: Vị trí live là luồng ghi lớn, cần store nhanh + geospatial index và push tới khách; ETA dựa trên road graph/traffic, không phải khoảng cách thẳng.
