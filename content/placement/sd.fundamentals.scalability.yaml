# Concept-hub placement items (C1 level-1 mcq, C2 level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: sd.fundamentals.scalability
items:
- id: P946
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Điều kiện cốt lõi để nhân bản một app service sau load balancer (scale ngang) là gì?
  choices:
  - Mỗi máy phải giữ một bản sao đầy đủ của database trong RAM
  - 'Service stateless: không giữ session trong RAM riêng, đẩy trạng thái ra kho dùng chung (DB/Redis)'
  - Load balancer phải dùng sticky session để mỗi người luôn về đúng một máy
  - Service phải chạy trên máy có CPU mạnh nhất có thể
  answer_index: 1
  explanation_md: Stateless cho phép load balancer rải request bất kỳ vào máy bất kỳ. Sticky session chỉ là cách vá cho service stateful và làm rải tải lệch.
- id: P947
  difficulty: 2
  type: mcq
  minutes: 2
  prompt_md: Web app đã stateless, chạy 6 app server sau load balancer. Lưu lượng tăng gấp đôi, app server còn dư CPU nhưng database primary đã 90% CPU, phần lớn là truy vấn đọc lặp lại. Bước hợp lý nhất tiếp theo là gì?
  choices:
  - Thêm tiếp app server vì scale ngang luôn giải quyết mọi nghẽn
  - Shard database ngay lập tức theo user_id
  - Thêm cache (Redis) cho dữ liệu nóng và read replica để giảm tải đọc trước, chỉ shard khi tải ghi quá lớn
  - Chuyển sang sticky session để giảm số lần truy vấn database
  answer_index: 2
  explanation_md: Nghẽn đã dồn về database dùng chung và chủ yếu là đọc, nên cache + read replica là bước rẻ nhất. Thêm app server không giảm tải DB; sharding đắt và chỉ cần khi tải ghi là vấn đề.
