- id: P1489
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì?'
  code: "cmds = {\"push\": lambda s, x: s.append(int(x)), \"pop\": lambda s: s.pop()}\nstack = []\nfor line in [\"push 4\", \"push 9\", \"pop\", \"push 2\"]:\n    name, *args = line.split()\n    cmds[name](stack, *args)\nprint(stack)"
  expected_output: '[4, 2]'
