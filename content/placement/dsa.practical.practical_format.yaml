  prompt_md: Trong bài practical nhiều level, bước nào nên làm đầu tiên trước khi viết code?
  choices:
  - Đọc kỹ spec (định dạng input/output) và liệt kê các operation
  - Tối ưu cấu trúc dữ liệu cho level cuối
  - Viết hết code cho mọi level cùng lúc
  - Bỏ qua ví dụ trong đề để tiết kiệm thời gian
  answer_index: 0
