items:
- id: P1490
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong ngữ pháp expr = term (+|- term)*, term = factor (*|/ factor)*, vì sao 2+3*4 cho 14 chứ không phải 20?
  choices:
  - Phép * nằm ở luật term, sâu hơn luật expr của phép +, nên được tính trước
  - Parser luôn tính phép đứng bên phải trước
  - Tokenizer đổi 3*4 thành một số duy nhất
  - Ngoặc được thêm tự động quanh phép +
  answer_index: 0
  explanation_md: expr gọi term để lấy từng vế; term gom hết phép * và / trước khi trả về cho expr, nên 3*4 = 12 được tính rồi mới cộng 2.
- id: P1491
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "def tok(s):\n    out, i = [], 0\n    while i < len(s):\n        if s[i].isdigit():\n            j = i\n            while j < len(s) and s[j].isdigit():\n                j += 1\n            out.append(int(s[i:j]))\n            i = j\n        else:\n            i += 1\n    return out\n\nprint(tok(\"5 + 40*2\"))\nprint(sum(tok(\"5 + 40*2\")))"
  expected_output: '[5, 40, 2]

    47'
