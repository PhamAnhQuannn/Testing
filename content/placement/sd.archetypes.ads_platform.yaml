subtopic_id: sd.archetypes.ads_platform
items:
- id: P1166
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Advertiser đặt daily budget 100$. Vấn đề cốt lõi của ad server về ngân sách là gì?"
  choices:
  - "Chỉ cần lưu quảng cáo ở CDN"
  - "Budget không cần theo dõi theo thời gian thực"
  - "Hiển thị quảng cáo cho mọi user như nhau"
  - "Dùng hết budget trong vài phút đầu ngày, cần budget pacing để rải đều và không vượt budget"
  answer_index: 3
  explanation_md: "Budget pacing điều phối tốc độ chi tiêu (và kết hợp frequency cap) để không cháy hết ngân sách sớm hay vượt budget khi nhiều ad server chạy song song."
