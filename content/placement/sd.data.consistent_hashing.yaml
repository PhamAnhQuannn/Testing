subtopic_id: sd.data.consistent_hashing
items:
- id: P1208
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Lợi ích chính của consistent hashing so với hash(key) mod N khi thêm hoặc bớt node là gì?"
  choices:
  - "Mọi key được di chuyển sang node mới để cân bằng hoàn hảo"
  - "Không cần hash function"
  - "Loại bỏ nhu cầu virtual nodes"
  - "Chỉ một phần nhỏ key bị remap khi thêm hoặc bớt node"
  answer_index: 3
  explanation_md: "Consistent hashing đặt node và key lên hash ring nên chỉ khoảng K/N key phải di chuyển; mod N làm gần như toàn bộ key đổi node. Virtual nodes giúp cân bằng tải."
