# Concept-hub placement items (C1 level-1 mcq, C2 level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: sd.api.api_styles
items:
- id: P952
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - rest-dung-http-json-moi-tai-nguyen-mot-d
  prompt_md: Phát biểu nào về REST là đúng?
  choices:
  - REST dùng protobuf nhị phân trên HTTP/2 nên nhanh nhất
  - REST cho client tự chọn trường qua một endpoint duy nhất
  - REST coi mọi thứ là tài nguyên thao tác bằng động từ HTTP, GET cache được ở CDN/trình duyệt, nhưng dễ lấy thừa/lấy thiếu dữ liệu
  - REST không thể dùng cho API công khai vì không có hợp đồng
  answer_index: 2
  explanation_md: 'REST: resource + HTTP verbs, cache tốt và phổ biến; nhược điểm là over/under-fetching. Protobuf/HTTP/2 là gRPC, chọn trường là GraphQL.'
- id: P953
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - graphql-client-tu-ghi-can-truong-nao-use
  - van-de-n-1-cua-graphql-1-truy-van-danh-s
  prompt_md: Một app mobile có nhiều màn hình, mỗi màn cần ghép dữ liệu từ nhiều thực thể khác nhau; hiện dùng REST và phải gọi 5-6 endpoint mỗi màn, nhận về nhiều trường thừa. Kiểu API nào giải quyết trực tiếp vấn đề này, và cái giá là gì?
  choices:
  - gRPC, vì nhị phân nhỏ gọn; cái giá là không có streaming
  - 'GraphQL: client tự khai báo trường cần trong một request; cái giá là N+1 (cần DataLoader), khó cache HTTP theo URL và server phức tạp hơn'
  - REST với nhiều endpoint hơn nữa; không có cái giá nào
  - GraphQL, và cache theo URL vẫn dễ như REST vì mỗi truy vấn là một GET
  answer_index: 1
  explanation_md: GraphQL trị over/under-fetch cho app nhiều màn hình, nhưng trả giá bằng N+1, mất cache theo URL và độ phức tạp. gRPC thiên về service nội bộ và hỗ trợ trình duyệt kém.
