subtopic_id: ml.llm_eval_serving.online_eval_monitoring
items:
- id: P1127
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Vì sao app LLM cần online eval (ghi lại lượt thật + thu phản hồi) dù đã có eval set offline?
  choices:
  - Vì eval set offline không bao giờ giống hệt người dùng thật, và dữ liệu thật thay đổi theo thời gian (drift)
  - Vì online eval thay thế hoàn toàn eval set offline nên có thể bỏ eval set
  - Vì ghi log làm model chạy nhanh hơn
  - Vì người dùng thật luôn hỏi đúng những câu có trong eval set
  answer_index: 0
  explanation_md: Eval set chỉ là mẫu cố định; người dùng thật và dữ liệu đổi theo thời gian. Ca lỗi thật từ online nên được đưa ngược về eval set.
