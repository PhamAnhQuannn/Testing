subtopic_id: sd.reliability_ops.multi_region_dr
items:
- id: P1254
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'RPO và RTO trong disaster recovery lần lượt đo gì?'
  choices:
  - 'RPO là thời gian khôi phục, RTO là lượng dữ liệu mất'
  - 'Cả hai đều là số request mỗi giây'
  - 'RPO là lượng dữ liệu tối đa chấp nhận mất (theo thời gian), RTO là thời gian tối đa để khôi phục dịch vụ'
  - 'Cả hai đều là chi phí hạ tầng hàng tháng'
  answer_index: 2
  explanation_md: 'RPO = lượng dữ liệu tối đa có thể mất (tính bằng thời gian); RTO = thời gian tối đa để khôi phục dịch vụ. Active-active thường cho RTO/RPO thấp hơn active-passive nhưng tốn kém hơn.'
