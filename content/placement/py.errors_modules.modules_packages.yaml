subtopic_id: py.errors_modules.modules_packages
items:
- id: P1378
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Khi file `tool.py` được chạy trực tiếp bằng `python tool.py`, `__name__` bên trong có giá trị gì?'
  choices:
  - '`"__main__"`'
  - '`"tool"`'
  - '`"tool.py"`'
  - '`None`'
  answer_index: 0
  explanation_md: 'File chạy trực tiếp là điểm vào nên `__name__ == "__main__"`. Chỉ khi được import thì `__name__` mới là tên module (`"tool"`).'
- id: P1379
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    import sys
    import math
    import math as m

    print(m is math)
    print(sys.modules["math"] is math)
    print(m.floor(2.9))
  expected_output: "True\nTrue\n2"
