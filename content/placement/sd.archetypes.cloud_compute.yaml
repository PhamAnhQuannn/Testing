subtopic_id: sd.archetypes.cloud_compute
items:
- id: P1189
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Nền tảng chạy code do người dùng nộp (online judge, serverless). Mối quan tâm thiết kế hàng đầu là gì?
  choices:
  - Cô lập sandbox (container/microVM, seccomp, namespace) và giới hạn tài nguyên CPU/memory/time/network cho từng job
  - Cache kết quả vào Redis
  - Dùng database có replication
  - Nén log bằng gzip
  answer_index: 0
  explanation_md: Code không tin cậy phải chạy trong sandbox cô lập và có resource limit/timeout để không phá host hay ảnh hưởng tenant khác.
