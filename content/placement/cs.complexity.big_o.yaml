subtopic_id: cs.complexity.big_o
items:
- id: P1256
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Đoạn code có vòng for i in range(n) lồng vòng for j in range(n), thân vòng trong O(1). Độ phức tạp thời gian là gì?'
  choices:
  - 'O(n)'
  - 'O(log n)'
  - 'O(n^2)'
  - 'O(2^n)'
  answer_index: 2
  explanation_md: 'Hai vòng lồng nhau mỗi vòng n lần: n * n = n^2 phép lặp, nên O(n^2).'
- id: P1257
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Đếm số lần lặp của hai vòng lồng nhau.'
  code: |-
    n = 6
    a = []
    for i in range(n):
        for j in range(n):
            a.append(1)
    print(len(a))
    b = []
    for i in range(n):
        for j in range(i):
            b.append(1)
    print(len(b))
  expected_output: |-
    36
    15
