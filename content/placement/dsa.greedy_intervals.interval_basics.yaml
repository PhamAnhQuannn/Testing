- id: P1456
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Để gộp (merge) một danh sách khoảng chưa sắp xếp, bước đầu tiên đúng là gì?
  choices:
  - Sắp xếp các khoảng theo điểm bắt đầu (start)
  - Duyệt từng cặp khoảng bằng hai vòng lặp lồng nhau mà không sort
  - Sắp xếp theo độ dài khoảng giảm dần
  - Đảo ngược danh sách
  answer_index: 0
  explanation_md: Khi đã sort theo start, khoảng mới chỉ có thể chồng lấn với khoảng cuối cùng trong kết quả, nên quét một lượt O(n) sau bước sort.
- id: P1457
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "def overlap(a, b):\n    return a[0] < b[1] and b[0] < a[1]\n\nprint(overlap([1, 3], [2, 5]))\nprint(overlap([1, 3], [3, 5]))\nprint(overlap([1, 10], [4, 6]))"
  expected_output: "True\nFalse\nTrue"
