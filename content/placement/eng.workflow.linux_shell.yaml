- id: P1866
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - chmod-dat-quyen-vi-du-chmod-755-run-sh-l
  prompt_md: "Lệnh `chmod 755 run.sh` đặt quyền nào cho file?"
  choices:
  - "Owner `rwx`, group và other `r-x`"
  - "Owner `rw-`, group và other `r--`"
  - "Mọi người (owner, group, other) đều `rwx`"
  - "Owner `r-x`, group `rwx`, other `---`"
  answer_index: 0
  explanation_md: "7 = 4+2+1 = rwx cho owner; 5 = 4+1 = r-x cho group và other. `rw-r--r--` là 644; `rwx` cho tất cả là 777."
- id: P1867
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - pipe-va-redirect-noi-dau-ra-lenh-truoc-v
  prompt_md: "Lệnh `./job.sh 2> err.log | sort` có hành vi nào sau đây?"
  choices:
  - "stderr của `job.sh` được ghi vào `err.log`; stdout đi qua pipe vào `sort`"
  - "Cả stdout lẫn stderr đi qua pipe vào `sort`, `err.log` rỗng"
  - "stdout ghi vào `err.log`, stderr đi vào `sort`"
  - "Lệnh lỗi vì không được phép dùng `2>` cùng với `|`"
  answer_index: 0
  explanation_md: "`2>` chuyển luồng 2 (stderr) sang file; `|` chỉ nối stdout (luồng 1) vào stdin của `sort`. Hai thứ dùng chung trong một lệnh được."
