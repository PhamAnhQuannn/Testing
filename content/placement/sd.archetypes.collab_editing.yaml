subtopic_id: sd.archetypes.collab_editing
items:
- id: P1191
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Google Docs-like: hai người cùng sửa một văn bản đồng thời. Vấn đề cốt lõi và hướng giải quyết chuẩn là gì?'
  choices:
  - Khoá cả tài liệu, mỗi lúc một người sửa
  - Hợp nhất chỉnh sửa đồng thời bằng OT (Operational Transformation) hoặc CRDT để mọi bản sao hội tụ cùng kết quả
  - Last-write-wins ghi đè toàn bộ tài liệu
  - Bắt người dùng merge tay như Git
  answer_index: 1
  explanation_md: 'Concurrent edit cần thuật toán hội tụ: OT (transform thao tác qua server) hoặc CRDT (cấu trúc tự merge), đảm bảo eventual consistency mà không mất chỉnh sửa.'
