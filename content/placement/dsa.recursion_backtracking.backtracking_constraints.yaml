- id: P1448
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Trong quay lui có ràng buộc, "cắt tỉa" (pruning) nghĩa là gì?
  choices:
  - Bỏ ngay nhánh vi phạm luật hoặc chắc chắn vô nghiệm, không đi sâu nữa
  - Duyệt hết mọi nhánh rồi mới lọc các lời giải sai
  - Lưu kết quả của các bài con để dùng lại
  - Sắp xếp lại input trước khi đệ quy
  answer_index: 0
  explanation_md: Pruning kiểm tra ràng buộc trước khi đi sâu và dừng nhánh sai sớm, nên số trạng thái phải xét giảm rất nhiều so với thử hết.
- id: P1449
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "def gen(n):\n    res = []\n\n    def go(s, o, c):\n        if len(s) == 2 * n:\n            res.append(s)\n            return\n        if o < n:\n            go(s + \"(\", o + 1, c)\n        if c < o:\n            go(s + \")\", o, c + 1)\n\n    go(\"\", 0, 0)\n    return res\n\nprint(gen(2))\nprint(len(gen(3)))"
  expected_output: "['(())', '()()']\n5"
