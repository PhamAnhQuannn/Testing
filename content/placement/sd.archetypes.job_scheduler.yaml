subtopic_id: sd.archetypes.job_scheduler
items:
- id: P1188
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: Distributed job scheduler chạy nhiều instance scheduler để chịu lỗi. Làm sao tránh một job (cron) bị chạy trùng nhiều lần?
  choices:
  - Cho mọi scheduler cùng chạy mọi job để chắc chắn không sót
  - Chọn leader (leader election) hoặc dùng lock/lease theo job trong DB/etcd để chỉ một node kích hoạt mỗi lần chạy
  - Chỉ chạy duy nhất một instance và không có dự phòng
  - Dùng giờ hệ thống của từng node để quyết định ai chạy
  answer_index: 1
  explanation_md: 'Cần phối hợp: leader election hoặc lease/lock (hoặc claim row nguyên tử) để một job chỉ được một worker nhận; job nên idempotent đề phòng chạy lặp.'
