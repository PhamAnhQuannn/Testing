# Concept-hub placement items (level-1 mcq, level-2 mcq). Validated by content/schemas/placement.schema.json.
subtopic_id: eng.testing_quality.tdd_clean_code
items:
- id: P1880
  difficulty: 1
  type: mcq
  minutes: 1
  concepts:
  - tdd-red-green-refactor-viet-test-that-ba
  prompt_md: Trong TDD (Test-Driven Development), thứ tự đúng của một vòng lặp là gì?
  choices:
  - Viết code, rồi viết test, rồi dọn code
  - Viết test fail (Red), viết code tối thiểu cho qua (Green), rồi dọn code (Refactor)
  - Dọn code, rồi viết test, rồi viết code
  - Viết code và test cùng lúc, không cần chạy test
  answer_index: 1
  explanation_md: 'TDD bắt đầu bằng một test fail (Red), sau đó viết code vừa đủ cho test qua (Green), cuối cùng dọn code khi test vẫn xanh (Refactor).'
- id: P1881
  difficulty: 2
  type: mcq
  minutes: 2
  concepts:
  - refactor-an-toan-sua-cau-truc-code-ma-kh
  prompt_md: 'Khi nào một thay đổi code được coi là refactoring, và làm sao biết nó an toàn?'
  choices:
  - Khi thêm tính năng mới; an toàn nếu code chạy được
  - Khi đổi cấu trúc code mà hành vi không đổi; an toàn nhờ chạy lại test vẫn xanh
  - Khi sửa lỗi cho đúng hành vi; an toàn nếu không còn lỗi biên dịch
  - Khi viết lại toàn bộ hàm theo hành vi mới; an toàn nếu reviewer đồng ý
  answer_index: 1
  explanation_md: 'Refactoring đổi cấu trúc nhưng giữ nguyên hành vi bên ngoài. Test xanh trước và sau thay đổi là bằng chứng hành vi không đổi; thêm tính năng hay sửa lỗi là đổi hành vi, không phải refactor.'
