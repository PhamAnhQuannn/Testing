subtopic_id: sd.caching.failure_modes
items:
- id: P1232
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Cache stampede xảy ra khi nào, và cách giảm thiểu điển hình?"
  choices:
  - "Nhiều request cùng lúc miss một key hot vừa hết hạn rồi dồn vào DB; giảm bằng lock/single-flight hoặc TTL jitter"
  - "Cache đầy nên loại key cũ; giảm bằng cách tăng TTL"
  - "Request cho key không tồn tại; giảm bằng cách tắt cache"
  - "Cache node mất mạng; giảm bằng xoá toàn bộ DB"
  answer_index: 0
  explanation_md: "Stampede (thundering herd) là hàng loạt miss đồng thời trên key hot; dùng lock, request coalescing, TTL jitter hoặc warm-up để tránh quá tải DB."
