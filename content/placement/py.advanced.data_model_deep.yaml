- id: P1372
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: 'Khi nào Python gọi `__getattr__` của một class?'
  choices:
  - Mỗi lần truy cập bất kỳ thuộc tính nào
  - Chỉ khi cách tra cứu thuộc tính thông thường thất bại
  - Chỉ khi gán thuộc tính mới
  - Chỉ khi gọi `dir()` trên object
  answer_index: 1
  explanation_md: '`__getattr__` là phương án dự phòng sau khi tra cứu trong instance và class thất bại. Hook chạy cho mọi truy cập là `__getattribute__`.'
- id: P1373
  difficulty: 1
  type: read_code
  minutes: 2
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: |-
    class A:
        pass

    class B(A):
        pass

    b = B()
    b.v = 1
    print(type(b).__name__, isinstance(b, A), issubclass(A, B))
    print(sorted(vars(b)))
    print([c.__name__ for c in B.__mro__])
  expected_output: "B True False\n['v']\n['B', 'A', 'object']"
