subtopic_id: sd.async.stream_processing
items:
- id: P1227
  difficulty: 1
  type: mcq
  minutes: 1
  prompt_md: "Khi xử lý stream với windowing, vì sao nên dùng event-time thay vì processing-time cho các sự kiện đến muộn hoặc sai thứ tự?"
  choices:
  - "Event-time luôn nhanh hơn processing-time"
  - "Processing-time cho phép bỏ hẳn windowing"
  - "Event-time không cần watermark hay xử lý late data"
  - "Event-time gắn kết quả với thời điểm sự kiện thật sự xảy ra, nên đúng dù message đến trễ hoặc sai thứ tự"
  answer_index: 3
  explanation_md: "Processing-time phụ thuộc lúc hệ thống nhận được dữ liệu nên bị lệch khi trễ mạng; event-time (kèm watermark) cho kết quả đúng theo thời điểm thực."
