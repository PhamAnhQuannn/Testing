subtopic_id: py.datastructs.dict
items:
  - id: F201
    practices: [verify, review]
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Hàm `count_chars(s)` (do AI viết) phải trả dict đếm số lần mỗi ký tự xuất hiện trong `s`, nhưng
      đang trả sai. Tìm và sửa bug để pass mọi test.
    problem_id: fix-char-count
    concepts: [mau-dem-dem-w-dem-get-1-mau-nhom-nhom-se]
    rubric_md: "Sửa đúng bug, pass toàn bộ test ẩn không cần gợi ý trong time-box: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: F206
    practices: [measure]
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Cài đặt `confusion_counts(y_true, y_pred)` trả dict `{"tp","fp","fn","tn"}` đếm các cặp (thật, đoán) của nhãn 0/1.
      Luôn có đủ bốn khoá. Pass mọi test ẩn.
    problem_id: confusion-counts
    rubric_md: "Cài đúng, pass toàn bộ test ẩn không cần gợi ý trong time-box: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: F207
