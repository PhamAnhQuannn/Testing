subtopic_id: sd.data.analytics_storage
items:
  - id: S061
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Nói ngắn gọn: **OLAP** khác **OLTP** ở điểm gì, và vì sao kho phân tích lưu **theo cột
      (columnar)** lại nhanh hơn cho truy vấn tổng hợp (ví dụ `SUM(amount)`)?
    answer_md: |
      OLTP = nhiều giao dịch nhỏ, nhanh (ghi/đọc từng bản ghi) trên DB chính của app; OLAP = ít truy
      vấn nhưng mỗi cái **tổng hợp/quét rất nhiều dòng** (báo cáo), chạy trên kho phân tích riêng.

      Lưu **theo cột** nhanh hơn vì truy vấn tổng hợp chỉ cần đọc **đúng cột liên quan** (ví dụ chỉ cột
      `amount`, khoảng 1/N dữ liệu của bảng N cột) thay vì đọc cả dòng rồi vứt phần thừa; thêm nữa các
      giá trị cùng một cột **nén rất tốt**, nên đọc ít byte từ đĩa hơn.
    rubric_md: "Nêu đúng cả hai ý: (1) OLTP = giao dịch nhỏ nhanh, nhiều / OLAP = truy vấn tổng hợp nặng, ít; (2) columnar chỉ đọc cột cần dùng (ít dữ liệu) và nén tốt. Đúng cả hai: điểm 1; thiếu một vế hoặc chỉ nói 'cột thì nhanh' mà không nói vì sao: tối đa điểm 0."
  - id: S062
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một hệ quảng cáo cần dashboard **"số click theo giờ cho từng chiến dịch"**, nhưng cũng muốn giữ
      được click **thô** để sau này phân tích lại. Hãy đề xuất: (1) ghi click thô ở đâu và bảng tổng
      hợp lưu ở đâu; (2) vì sao **không** chạy các truy vấn báo cáo này thẳng trên DB OLTP của app;
      (3) nêu một chính sách **rollup + retention** hợp lý (kèm con số ví dụ).
    answer_md: |
      (1) Ghi click **thô** vào nơi rẻ, nạp được khối lớn — một **data lake** (file trên object storage
      như S3) hoặc một log/queue (Kafka) rồi đổ vào lake; bảng **tổng hợp "click theo giờ × chiến dịch"**
      đặt trong kho phân tích theo cột (data warehouse hoặc real-time OLAP như ClickHouse) để dashboard
      đọc nhanh.
      (2) Không chạy thẳng trên **DB OLTP** vì truy vấn quét-nhiều-dòng nặng sẽ **giành CPU/IO** với
      luồng phục vụ người dùng thật, làm app chậm; OLTP lưu theo hàng cũng không hợp quét tổng hợp.
      (3) Ví dụ: **gộp trước (rollup)** click thô thành bản "theo giờ × chiến dịch"; **retention** giữ
      click **thô 30 ngày** rồi xoá/đẩy xuống kho lạnh, giữ **bản tổng hợp theo giờ 2 năm** (có thể gộp
      tiếp theo ngày cho dữ liệu cũ hơn). Dashboard chỉ đọc bản đã gộp nên nhẹ.
    rubric_md: "Đạt (điểm 2) khi nêu đúng cả 3 ý: (1) thô vào lake/queue + tổng hợp vào kho phân tích theo cột; (2) lý do tách khỏi OLTP là tránh giành tài nguyên với app (và/hoặc row không hợp tổng hợp); (3) một chính sách rollup + retention cụ thể có con số. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu phần rollup/retention có số, hoặc không giải thích được vì sao tách khỏi OLTP: tối đa điểm 1."
  - id: S063
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Phỏng vấn: "Thiết kế kho lưu cho một hệ **giám sát (monitoring)** nhận khoảng **1 triệu điểm đo
      mỗi giây**, cần bảng theo dõi gần thời gian thực." Hãy trả lời đủ ba phần ở mức phỏng vấn:
      (1) **chọn loại kho** và vì sao (so với warehouse/lake và với OLTP); (2) thiết kế **rollup +
      retention** theo tầng cho số đo (kèm con số); (3) giải thích vì sao **cardinality cao** làm
      time-series DB phình/chậm, và nêu một nhãn **không nên** dùng.
    answer_md: |
      (1) **Chọn time-series DB (TSDB)** (ví dụ Prometheus/InfluxDB/VictoriaMetrics), nạp theo
      **streaming**. Vì dữ liệu là số đo `(thời điểm, giá trị)` theo chuỗi: TSDB nén theo trục thời gian
      và truy vấn theo khoảng thời gian rất nhanh. Không dùng **DB OLTP** vì tải ghi/truy vấn này sẽ
      giành tài nguyên với app và OLTP lưu theo hàng; không dùng **warehouse/lake batch** vì chúng hợp
      báo cáo theo lô, quá trễ cho dashboard gần thời gian thực (dù vẫn có thể đẩy dữ liệu lạnh xuống lake).
      (2) **Rollup theo tầng:** giữ mức **giây** trong ~**7 ngày**, gộp xuống mức **phút** giữ ~**90
      ngày**, gộp xuống mức **giờ** giữ ~**2 năm**; cũ hơn thì xoá hoặc đẩy xuống kho lạnh (object
      storage). Nhờ vậy 86.400 dòng/ngày/chỉ số ở mức giây co lại còn 1.440 (phút) rồi 24 (giờ) cho dữ
      liệu cũ, truy vấn khoảng dài chỉ đọc bản đã gộp.
      (3) **Cardinality cao:** TSDB lưu **một chuỗi riêng cho mỗi tổ hợp nhãn**; số chuỗi = tích số giá
      trị các nhãn. Nhãn nhiều giá trị (ví dụ **user_id** ~1 triệu, hay request_id/URL) tạo hàng triệu
      chuỗi → **chỉ mục trong RAM phình**, chậm cả ghi lẫn truy vấn, và nén theo thời gian mất tác dụng
      vì mỗi chuỗi chỉ lác đác vài điểm. Nên nhãn phải là tập giá trị **nhỏ, bị chặn** (service, host);
      thứ cardinality cao như **user_id** để cho log hoặc kho phân tích theo cột.
    rubric_md: "Đạt mức 3 (phỏng vấn) khi đủ cả ba phần: (1) chọn TSDB (streaming) và biện minh so với OLTP và warehouse/lake; (2) rollup + retention theo tầng có con số (giây→phút→giờ, thời hạn từng mức); (3) giải thích đúng cơ chế cardinality cao (mỗi tổ hợp nhãn = một chuỗi, nổ số chuỗi, phình chỉ mục RAM/chậm) và nêu nhãn không nên dùng (user_id/request_id/URL). Đúng, trong time-box, tự giải thích rõ ràng: bằng chứng điểm 3. Thiếu phần rollup/retention có số, hoặc không giải thích được cơ chế cardinality: chưa đạt mức 3."
