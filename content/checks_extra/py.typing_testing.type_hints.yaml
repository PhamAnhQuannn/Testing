subtopic_id: py.typing_testing.type_hints
items:
  - id: X414
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      from typing import Optional, get_args, get_origin

      def f(x: int, y: "str" = "a") -> Optional[int]:
          return x

      print(f("hi"))
      print(list(f.__annotations__))
      print(len(get_args(Optional[int])), get_origin(list[int]) is list)
    expected_output: "hi\n['x', 'y', 'return']\n2 True"
    answer_md: 'Hint không bị enforce lúc chạy nên `f("hi")` chạy bình thường và trả `"hi"`. `__annotations__` giữ thứ tự khai báo và thêm khoá `return`. `Optional[int]` là union của `int` và `NoneType` nên có 2 đối số; `get_origin(list[int])` là `list`.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X415
    difficulty: 2
    type: write_code
    minutes: 5
    prompt_md: |
      Viết `hint_names(src, name)`: `src` là mã nguồn định nghĩa hàm `name`. `exec` mã đó trong dict mới, dùng `typing.get_type_hints` và trả list chuỗi `"tên:kiểu"` theo thứ tự khai báo, với `kiểu` là `__name__` của kiểu (kiểu trả về có tên `return`; `-> None` cho `NoneType`). Hàm không có annotation thì trả `[]`.
    problem_id: check-x415-hint-names
    rubric_md: "Pass toàn bộ test ẩn. Đúng không gợi ý trong time-box (5 phút): bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X416
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: |
      Viết `type_format(expr)`: `eval` chuỗi kiểu (namespace có `Optional`, `Union`, `Callable`, `Any`) rồi trả chuỗi mô tả đệ quy bằng `get_origin`/`get_args`: kiểu thường dùng `__name__`; `NoneType` thành `"None"`; `...` thành `"..."`; list đối số của `Callable` thành `"[a, b]"`; union (Optional/Union/`X | Y`) nối bằng `" | "`; generic khác là `origin.__name__ + "[" + đối số nối ", " + "]"`. Ví dụ `dict[str, list[int]]` giữ nguyên, `Optional[str]` thành `"str | None"`. Gợi ý: union có origin là `typing.Union` hoặc `types.UnionType`.
    problem_id: check-x416-type-format
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 12 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
