subtopic_id: ml.llm_eval_serving.fast_decoding_profiling
items:
  - id: S331
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Nói ngắn gọn: trong **speculative decoding**, vai trò của **model nháp (draft model)** và
      **model chính (target model)** khác nhau thế nào, và vì sao kiểm k token nháp lại rẻ hơn sinh
      k token theo cách thường?
    answer_md: |
      **Model nháp (draft model)** là model nhỏ, nhanh, **đề xuất trước k token** tiếp theo.
      **Model chính (target model)** là model lớn, thật; nó **kiểm (verify) cả cụm k token trong
      một lượt tiến song song (one parallel forward pass)**, nhận prefix đúng dài nhất rồi tự sửa ở
      token sai đầu tiên. Kiểm k token rẻ vì chỉ cần **một lần đọc trọng số (weights)** của model
      chính là tính được phân phối ở cả k vị trí cùng lúc — mà decode bị nghẽn ở việc **đọc trọng số
      (memory-bound)** chứ không ở tính toán, nên kiểm thêm vài vị trí gần như không tốn thêm. Sinh
      theo cách thường thì mỗi token là một lượt đọc trọng số riêng.
    rubric_md: "Đúng khi nêu được: draft = model nhỏ đề xuất k token; target = model lớn kiểm cả cụm trong MỘT lượt; và lý do rẻ = một lần đọc trọng số kiểm được nhiều vị trí vì decode memory-bound. Đủ ý: điểm 1. Nhầm vai trò (model nháp quyết định đầu ra) hoặc không nêu được vì sao kiểm rẻ: tối đa điểm 0."
  - id: S332
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một đồng nghiệp bật speculative decoding để tăng tốc endpoint chat, nhưng lo hai điều:
      (1) sợ đầu ra **khác đi** so với dùng model chính một mình; (2) thấy có lúc **gần như không
      nhanh hơn**. Hãy giải thích: (a) vì sao chất lượng/đầu ra **không đổi** (lossless); (b) chỉ số
      nào quyết định mức tăng tốc và vì sao đôi khi lợi ích nhỏ; (c) nêu một cách làm acceptance rate
      cao hơn.
    answer_md: |
      (a) **Không đổi (lossless):** luật **nhận/loại (accept/reject)** được thiết kế sao cho mọi
      token giữ lại đều được **lấy mẫu theo phân phối của model chính (target distribution)** — khi
      một token nháp bị loại, model chính lấy mẫu lại từ phân phối đã hiệu chỉnh của nó. Nên chuỗi
      sinh ra có **cùng phân phối** như khi chỉ dùng model chính; model nháp chỉ ảnh hưởng tốc độ.
      (b) **Acceptance rate (tỉ lệ chấp nhận)** quyết định tăng tốc: nhận nhiều token/lượt thì nhanh.
      Khi model nháp đoán **kém khớp** model chính, nhiều token bị loại → mỗi lượt chỉ ra ít token,
      lại còn tốn công chạy nháp và verify phần bỏ đi, nên **lợi ích nhỏ hoặc hoà**.
      (c) Dùng **model nháp gần model chính hơn** (cùng họ, đủ lớn để đoán khớp), hoặc chọn k hợp lý;
      hoặc dùng n-gram/prompt lookup cho tác vụ lặp nhiều. (Vẫn lossless dù chọn gì.)
    rubric_md: "Đạt (điểm 2) khi nêu đúng cả 3: (a) lossless vì token giữ lại lấy mẫu theo phân phối model chính (accept/reject), không phải model nháp; (b) acceptance rate quyết định tốc độ và lý do lợi ích nhỏ khi nháp đoán kém; (c) một cách tăng acceptance rate hợp lý (nháp gần model chính / chọn k / prompt lookup). Thiếu phần (a) giải thích lossless đúng bản chất, hoặc nói đầu ra bị đánh đổi chất lượng: tối đa điểm 1."
  - id: S333
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      **(Phỏng vấn AI engineer)** Endpoint sinh chữ của bạn chậm. Hãy trình bày:
      (1) cách **profiling để phân loại** nút thắt là **memory-bound** hay **compute-bound** — nêu
      rõ ý tưởng roofline / arithmetic intensity, số liệu bạn nhìn (GPU utilization, băng thông bộ
      nhớ), và kết luận cho từng trường hợp; rồi với mỗi loại nêu cách tối ưu đúng.
      (2) giải thích **speculative decoding** và **vì sao nó không đổi phân phối đầu ra**, và nói rõ
      nó hợp với loại nút thắt nào trong phần (1).
    answer_md: |
      **(1) Profiling & phân loại:**
      - Ý tưởng **roofline**: so **arithmetic intensity** (số phép tính trên mỗi byte dữ liệu đọc)
        với tỉ số đỉnh FLOPs / đỉnh băng thông của GPU. Cường độ thấp → băng thông chặn; cao → tính
        toán chặn.
      - **Memory-bandwidth-bound:** dấu hiệu **GPU utilization thấp** + **băng thông bộ nhớ gần
        đỉnh** (ví dụ util 30%, băng thông 90%). Đây là ca **decode batch nhỏ** — thời gian trôi vào
        đọc trọng số. Sửa: **tăng batch** (continuous batching), **quantize** (INT8/INT4),
        **speculative decoding** — đều nhằm giảm/khấu hao lượt đọc trọng số.
      - **Compute-bound:** dấu hiệu **GPU utilization gần đỉnh FLOPs**. Ca **prefill** hoặc **batch
        lớn**. Sửa: **kernel tốt hơn** (fused kernel, CUDA graphs, torch.compile / TensorRT-LLM),
        thêm FLOPs. Quy tắc: **chẩn đoán bằng số rồi mới kê đơn**, không tối ưu nhầm hướng.

      **(2) Speculative decoding & lossless:**
      - Model nháp (draft) đề xuất k token; model chính (target) kiểm cả cụm trong **một lượt song
        song**, nhận prefix đúng dài nhất, sửa ở token sai đầu tiên → mỗi lượt model chính ra nhiều
        token.
      - **Không đổi phân phối đầu ra** vì luật **nhận/loại** khiến mọi token giữ lại được lấy mẫu
        theo **phân phối của model chính**; token bị loại thì lấy mẫu lại từ phân phối hiệu chỉnh của
        model chính. Model nháp chỉ đổi **tốc độ** (qua acceptance rate), không đổi chất lượng; với
        greedy thì từng token giống hệt.
      - Nó hợp với nút thắt **memory-bound** (decode batch nhỏ): tận dụng việc verify nhiều token
        trong một lần đọc trọng số. Với prefill/compute-bound lợi ích ít vì ở đó cổ chai là tính toán.
    rubric_md: "Đạt mức phỏng vấn (điểm 3) khi: (1) mô tả profiling đủ ý — roofline/arithmetic intensity, đọc GPU utilization + băng thông bộ nhớ, phân loại đúng memory-bound vs compute-bound VÀ nêu cách sửa đúng cho từng loại (memory → batch/quantize/spec-decode; compute → kernel/FLOPs); VÀ (2) giải thích speculative decoding đúng cơ chế (draft đề xuất, target verify một lượt, nhận prefix đúng) và **vì sao lossless** (token giữ lại lấy mẫu theo phân phối model chính), và gắn nó vào nút thắt memory-bound. Đúng, trong time-box, tự giải thích rõ: điểm 3. Thiếu phần giải thích lossless đúng bản chất, hoặc không phân loại được nút thắt bằng số liệu: chưa đạt mức 3."
