subtopic_id: dsa.graphs.topological_sort
items:
  - id: X455
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      from collections import deque

      adj = [[1, 2], [3], [3], []]
      indeg = [0] * 4
      for u in range(4):
          for v in adj[u]:
              indeg[v] += 1

      q = deque(i for i in range(4) if indeg[i] == 0)
      order = []
      while q:
          u = q.popleft()
          order.append(u)
          for v in adj[u]:
              indeg[v] -= 1
              if indeg[v] == 0:
                  q.append(v)

      print(*order)
      print(indeg)
    expected_output: "0 1 2 3\n[0, 0, 0, 0]"
    answer_md: 'Ban đầu `indeg = [0, 1, 1, 2]` nên chỉ đỉnh 0 vào hàng đợi. Lấy 0 ra thì indeg của 1 và 2 về 0 nên cả hai vào hàng đợi; lấy 1 làm indeg[3] còn 1, lấy 2 làm indeg[3] về 0 nên 3 vào hàng đợi. Thứ tự là `0 1 2 3` và mọi indegree cuối cùng đều là 0.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
