subtopic_id: sd.archetypes.chat_presence
items:
  - id: S181
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Trong hệ chat, vì sao **gateway server** (nơi giữ WebSocket) là **stateful**, và hệ dùng cái
      gì để biết một user đang cắm ở gateway nào?
    answer_md: |
      Gateway stateful vì nó **giữ kết nối WebSocket bền** của từng client và phải nhớ "socket này
      là của user nào" (một socket chỉ tồn tại ở đúng một gateway). Để biết user đang ở gateway
      nào, hệ tra một **sổ định tuyến / session registry** (thường là Redis) ánh xạ *user →
      gateway và các kết nối của họ*; muốn gửi cho user, trước hết tra sổ này.
    rubric_md: "Đạt khi nêu đúng cả hai: gateway giữ kết nối WebSocket nên là stateful (nhớ socket của user), và có sổ định tuyến user → gateway (Redis) để biết đẩy tin đi đâu. Đúng ý: bằng chứng điểm 1; thiếu một vế: tối đa điểm 0."
  - id: S182
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Alice (nối gateway G1) gửi tin cho Bob (nối gateway G2). Hãy mô tả đường đi của tin: (1) G1
      làm gì để tin tới được G2 mà không cần biết trực tiếp G2; (2) vì sao vẫn phải **lưu** tin và
      gắn cho nó cái gì để đảm bảo thứ tự; (3) nếu lúc đó Bob **offline** thì xử lý ra sao.
    answer_md: |
      (1) G1 (hoặc tầng logic phía sau) **tra sổ định tuyến** thấy Bob ở G2, rồi **publish** tin
      vào **pub/sub backbone** (Redis/Kafka) trên kênh của Bob; G2 đang **subscribe** kênh đó nhận
      được và đẩy xuống socket của Bob. G1 không cần biết địa chỉ G2 — backbone lo fan-out.
      (2) Phải **lưu bền** tin (kho tin nhắn, thường phân mảnh theo `conversation_id`) để đồng bộ
      nhiều thiết bị và cho người offline đọc lại; gắn **sequence number tăng dần theo từng hội
      thoại** để client sắp đúng thứ tự dù mạng đảo gói, thay vì tin vào timestamp đồng hồ (lệch).
      (3) Tra sổ thấy Bob không có kết nối → tin đã lưu nên chuyển sang **push notification**
      (APNs/FCM); khi Bob online lại, client báo seq hiện có và server **gửi bù** các tin seq lớn hơn.
    rubric_md: "Đạt khi nêu đúng cả 3 ý: (1) tra sổ định tuyến rồi qua pub/sub backbone để G2 nhận và đẩy; (2) lưu bền + sequence number theo hội thoại cho thứ tự (không dùng timestamp); (3) offline → push notification, online lại thì sync theo seq. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu ý pub/sub backbone, hoặc không nêu sequence number cho thứ tự: tối đa điểm 1."
  - id: S183
    difficulty: 3
    type: concept
    minutes: 12
    prompt_md: |
      Thiết kế đầu-cuối một hệ chat 1:1 và nhóm cho hàng triệu kết nối đồng thời. Trình bày: (1)
      kết nối bền và gateway stateful + sổ định tuyến; (2) cách chuyển tin giữa các gateway bằng
      pub/sub backbone; (3) lưu trữ, **đánh số thứ tự** và biên nhận (sent/delivered/read); (4)
      xử lý offline (push) và **gửi bù** khi nối lại; (5) **presence** bằng heartbeat + TTL và vấn
      đề thundering-herd khi friend list lớn; (6) **1:1 vs nhóm** (write-fanout vs read-fanout) và
      cái gì là nghẽn khi scale, cùng cách gỡ.
    answer_md: |
      (1) Mỗi client giữ **WebSocket** tới một **gateway stateful**; một **sổ định tuyến** (Redis)
      ánh xạ *user → gateway + các kết nối* (một user có thể nhiều thiết bị). Muốn gửi cho ai, tra
      sổ trước.
      (2) Các gateway nối qua **pub/sub backbone** (Redis Pub/Sub, hoặc Kafka khi cần lưu bền/tua
      lại): tra sổ người nhận rồi **publish** vào kênh của họ; chỉ gateway đang giữ họ (đã
      subscribe) nhận và đẩy xuống. Gateway không cần biết nhau → thêm gateway tự do.
      (3) Mỗi tin **lưu bền** vào kho (NoSQL phân mảnh theo `conversation_id`) và nhận một
      **sequence number tăng dần theo từng hội thoại** làm thứ tự tổng (không dùng timestamp đồng
      hồ vì clock skew). Trên đó là **receipts**: sent → delivered (tới thiết bị) → read, mỗi mốc
      đẩy ngược về người gửi.
      (4) Nếu người nhận **offline** (tra sổ không thấy kết nối): tin đã lưu nên bắn **push
      notification** (APNs/FCM). Khi online lại, client gửi seq đang có, server **gửi bù** mọi tin
      seq lớn hơn — đồng bộ lại chỉ là so sánh số.
      (5) **Presence**: client/gateway làm mới khóa `online:U` trong Redis với **TTL** ngắn mỗi
      nhịp heartbeat; mất kết nối → không ai làm mới → khóa **tự hết hạn** → offline (không cần
      client báo, vì client sập không báo được). Với **friend list lớn**, fan-out "U online" tới
      mọi bạn gây **thundering herd**; giảm bằng cách chỉ đẩy cho người đang mở chat với U (hoặc
      client hỏi presence khi mở danh sách), gộp (batch) và throttle.
      (6) **1:1 và nhóm nhỏ → write-fanout** (ghi sẵn vào hộp thư từng người, đọc nhanh); **nhóm
      rất lớn/đọc thưa → read-fanout** (lưu một bản, fan-out lúc đọc) để khỏi nhân một tin thành
      hàng trăm lượt ghi. Khi scale tới hàng triệu kết nối, **nghẽn** là: mỗi gateway giữ hữu hạn
      socket → **thêm gateway**; sổ định tuyến và backbone thành điểm nóng → **phân mảnh (shard)**
      theo user/conversation; kho tin nhắn nghẽn ghi → shard theo `conversation_id`.
    rubric_md: "Đạt (mức phỏng vấn, đúng mastery_bar mức 3) khi trình bày đủ 6 lớp đúng thứ tự tư duy: gateway stateful + sổ định tuyến; pub/sub backbone chuyển tin giữa gateway; lưu bền + sequence number theo hội thoại + receipts; offline → push và gửi bù theo seq; presence heartbeat+TTL và thundering-herd; 1:1 vs nhóm (write vs read fanout) và nghẽn khi scale + cách gỡ. Đúng, trong time-box, tự giải thích rõ: bằng chứng điểm 3. Sót cả presence/TTL hoặc không phân biệt write/read fanout, hoặc không nêu sequence number cho thứ tự: chưa đạt mức 3."
