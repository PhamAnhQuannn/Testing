subtopic_id: ml.llm_eval_serving.eval_sets_metrics
items:
  - id: S310
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Nói ngắn gọn: **eval set** (golden set) là gì, và vì sao chỉ "thử vài câu thấy model trả lời
      trôi chảy rồi chốt" (vibe check) không đủ để kết luận một tính năng LLM là tốt?
    answer_md: |
      **Eval set** là một tập **đã tuyển chọn và cố định (versioned)** gồm các **đầu vào đại diện** kèm
      **đáp án chuẩn (gold)** hoặc **tiêu chí chấm**; nó đóng vai trò bài kiểm tra tự động — mỗi lần đổi
      prompt/model thì chạy lại cùng tập này và so số.

      Vibe check không đủ vì: (1) vài câu tự nghĩ **không đại diện** cho câu hỏi người dùng thật;
      (2) một thay đổi có thể sửa ca này nhưng **làm hỏng ca khác** mà bạn không thấy; (3) "trôi chảy"
      không bằng "đúng" — LLM nói sai vẫn rất tự tin. Cần đo trên tập cố định bằng con số lặp lại được.
    rubric_md: "Đúng khi nêu được: eval set = tập cố định gồm đầu vào + đáp án/tiêu chí chuẩn, dùng để đo lại khi đổi prompt/model; VÀ ít nhất một lý do vibe check không đủ (không đại diện / có thể làm hỏng ngầm ca khác / trôi chảy không bằng đúng). Đủ ý: bằng chứng điểm 1. Thiếu định nghĩa eval set, hoặc không nêu được lý do nào: tối đa điểm 0."
  - id: S311
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Bạn có một tính năng **trích xuất thông tin hoá đơn**: từ văn bản hoá đơn, model phải xuất ra các
      trường cố định (số hoá đơn, ngày, tổng tiền). Hãy: (1) chọn một **metric** hợp để đánh giá và nói
      vì sao hợp; (2) bạn lấy ví dụ cho **eval set** từ đâu; (3) nêu **một giới hạn** của metric đã chọn.
    answer_md: |
      (1) **exact-match** (hoặc F1 theo từng trường): đầu ra là các trường có **một đáp án đúng xác
      định**, nên khớp đúng từng trường là thước đo **tự động, rẻ, lặp lại được** — đúng loại cho tác vụ
      trích xuất.
      (2) Lấy từ **hoá đơn thật trong production** và các **ca model từng xuất sai** (định dạng ngày lạ,
      hoá đơn mờ, nhiều trang), mỗi ca kèm đáp án chuẩn; cố định và đánh version — không tự bịa cho dễ.
      (3) exact-match **khắt khe**: "1.000.000" vs "1000000", hay "01/02/2026" vs "2026-02-01" cùng đúng
      nhưng bị chấm sai → cần **chuẩn hoá (normalize)** trước khi so, hoặc dùng F1 theo trường.
    rubric_md: "Đạt (điểm 2) khi nêu đúng cả 3: (1) metric hợp cho trích xuất — exact-match hoặc F1 theo trường — kèm lý do 'đáp án cố định/xác định'; (2) nguồn eval set = dữ liệu thật + ca lỗi, không bịa; (3) một giới hạn thật của metric (vd exact-match quá khắt khe với khác định dạng → cần normalize). Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu phần giới hạn, hoặc chọn metric sai tác vụ (vd BLEU/pass@k cho trích xuất): tối đa điểm 1."
  - id: S312
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      **(Phỏng vấn AI engineer)** Đội bạn vừa ra một tính năng **hỏi-đáp trên tài liệu nội bộ bằng RAG**
      (tìm đoạn liên quan rồi để LLM soạn câu trả lời). Sếp hỏi: "Làm sao biết nó tốt, và trước khi đổi
      prompt/model thì dựa vào đâu để quyết tung hay không?" Hãy trình bày:
      (1) cách **xây eval set từ dữ liệu thật**;
      (2) **chọn metric** cho **cả bước tìm (retrieval) lẫn bước sinh (generation)**;
      (3) **giới hạn** của các metric đó và cách bù;
      (4) vì sao vẫn cần đo **online** chứ không chỉ offline.
    answer_md: |
      **(1) Eval set:** lấy câu hỏi thật từ log người dùng + các ca từng trả lời sai; mỗi ca kèm (câu
      hỏi, đoạn tài liệu đúng chứa câu trả lời, câu trả lời/tiêu chí chuẩn); gồm cả ca khó/mơ hồ; cố định
      và đánh version; mỗi khi gặp lỗi mới thì thêm vào. Bắt đầu 20-50 ca cũng đã hữu ích.

      **(2) Metric theo bước:**
      - Bước tìm (retrieval): **recall@k** (trong k đoạn lấy về có đoạn đúng không), thêm precision@k.
      - Bước sinh (generation): **groundedness** (câu trả lời có bám đoạn lấy về không) + **answer
        relevance** (có đúng câu hỏi không). Đây là sinh mở nên chấm bằng **LLM-as-judge** theo rubric
        hoặc **người chấm**; nếu có đáp án tham chiếu thì BLEU/ROUGE chỉ là proxy yếu đi kèm.

      **(3) Giới hạn + cách bù:** recall@k **không** nói câu trả lời cuối có đúng không (tìm đúng đoạn
      nhưng model vẫn có thể soạn sai); BLEU/ROUGE bỏ sót nghĩa (nhiều cách trả lời đúng); LLM-as-judge
      **thiên lệch** (thích câu dài / văn phong của nó) và tốn tiền → hiệu chỉnh với nhãn người, chấm ở
      temperature 0. Và đừng nhìn một con số tổng: **cắt lát theo chủ đề** + error analysis. Để quyết
      tung: chạy offline eval bản cũ vs bản mới trên **cùng eval set**, so số từng bước, đưa vào CI làm
      regression.

      **(4) Online:** người dùng thật hỏi khác bộ thử và hành vi đổi theo thời gian; offline tốt không
      bảo đảm online tốt. Đo tín hiệu thật (thích/không thích, tỉ lệ hỏi lại, A/B) và feed ca lỗi mới
      ngược lại eval set.
    rubric_md: "Đạt mức phỏng vấn (điểm 3) khi: (1) eval set từ dữ liệu thật + ca lỗi, có gold/tiêu chí, versioned; (2) **tách metric cho retrieval (recall@k) và generation (groundedness/answer relevance qua judge hoặc người)**; (3) nêu giới hạn thật của ít nhất 2 metric + cách bù (cắt lát theo nhóm, hiệu chỉnh judge) và quy trình offline so số trên cùng eval set để quyết tung; (4) lý do cần đo online. Đúng, trong time-box, tự giải thích rõ: bằng chứng điểm 3. Thiếu phần giới hạn, hoặc không tách được metric theo hai bước tìm/sinh, hoặc bỏ phần online: chưa đạt mức 3."
