subtopic_id: py.core.io_input
items:
  - id: X727
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `parse_ints(line)` nhận một chuỗi chứa các số nguyên cách nhau bởi khoảng trắng tuỳ ý (kiểu `input().split()`) và trả về **list int** theo đúng thứ tự. Chuỗi rỗng hoặc chỉ gồm khoảng trắng cho `[]`. Ví dụ `"3 4 5"` cho `[3, 4, 5]`; `"  10   -2 "` cho `[10, -2]`. Không gọi `input()` thật.
    problem_id: check-x727-parse-ints
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X728
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
    code: |-
      raw = "  7 ,12,  -3 ,0 "
      parts = [p.strip() for p in raw.split(",")]
      nums = [int(p) for p in parts]
      print(parts)
      print(sum(nums))
      print(" ".join(str(n * 2) for n in nums))
      print(max(nums) - min(nums))
    expected_output: "['7', '12', '-3', '0']\n16\n14 24 -6 0\n15"
    answer_md: "split(',') cho ['  7 ', '12', '  -3 ', '0']; strip() từng phần thành ['7', '12', '-3', '0'] (vẫn là str nên in có nháy). nums = [7, 12, -3, 0] có tổng 16. Nhân đôi được 14, 24, -6, 0 nối bằng dấu cách. max - min = 12 - (-3) = 15."
    rubric_md: "Output khớp từng dòng, đặc biệt dòng đầu có nháy vì phần tử còn là str. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
