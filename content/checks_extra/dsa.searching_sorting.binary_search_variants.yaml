subtopic_id: dsa.searching_sorting.binary_search_variants
items:
  - id: X439
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      nums = [1, 2, 1, 3, 5, 6, 4]
      lo, hi = 0, len(nums) - 1
      while lo < hi:
          mid = (lo + hi) // 2
          if nums[mid] < nums[mid + 1]:
              lo = mid + 1
          else:
              hi = mid
          print(lo, hi)
      print(lo, nums[lo])
    expected_output: "4 6\n4 5\n5 5\n5 6"
    answer_md: 'Đây là tìm peak element. Vòng 1: mid=3, `3 < 5` (đang đi lên) nên `lo = 4`, in `4 6`. Vòng 2: mid=5, `6 < 4` sai nên `hi = 5`, in `4 5`. Vòng 3: mid=4, `5 < 6` nên `lo = 5`, in `5 5`. Dừng vì `lo == hi`, peak ở chỉ số 5 với giá trị 6.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
