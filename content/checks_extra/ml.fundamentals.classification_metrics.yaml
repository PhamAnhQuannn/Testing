subtopic_id: ml.fundamentals.classification_metrics
items:
  - id: X671
    difficulty: 3
    type: read_code
    minutes: 6
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao hạ ngưỡng từ 0,5 xuống 0,35 làm recall tăng còn precision đổi thế nào.
    code: |-
      probs = [0.9, 0.7, 0.6, 0.4, 0.3, 0.1]
      y = [1, 0, 1, 1, 0, 0]
      for th in (0.5, 0.35):
          pred = [1 if p >= th else 0 for p in probs]
          tp = sum(1 for t, q in zip(y, pred) if t == 1 and q == 1)
          fp = sum(1 for t, q in zip(y, pred) if t == 0 and q == 1)
          fn = sum(1 for t, q in zip(y, pred) if t == 1 and q == 0)
          pr = tp / (tp + fp)
          rc = tp / (tp + fn)
          print(tp, fp, fn)
          print(round(pr, 4), round(rc, 4), round(2 * pr * rc / (pr + rc), 4))
    expected_output: "2 1 1\n0.6667 0.6667 0.6667\n3 1 0\n0.75 1.0 0.8571"
    answer_md: 'Ngưỡng 0,5: dự đoán `[1,1,1,0,0,0]` nên TP=2 (0,9 và 0,6), FP=1 (0,7), FN=1 (0,4); `P = R = 2/3`, `F1 = 0,6667`. Ngưỡng 0,35: dự đoán `[1,1,1,1,0,0]` nên TP=3, FP=1, FN=0; `P = 3/4 = 0,75`, `R = 1,0`, `F1 = 2·0,75·1/1,75 ≈ 0,8571`. Hạ ngưỡng bắt thêm mẫu dương 0,4 (recall tăng) mà không thêm báo nhầm, nên ở đây precision cũng tăng; nói chung precision thường giảm.'
    rubric_md: "Output khớp từng dòng VÀ tính đúng TP/FP/FN từng ngưỡng, giải thích hạ ngưỡng bắt thêm mẫu dương. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
