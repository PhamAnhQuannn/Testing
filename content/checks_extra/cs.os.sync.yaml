subtopic_id: cs.os.sync
items:
  - id: X849
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
    code: |-
      count = 1
      for op in ["P", "P", "V", "P"]:
          if op == "V":
              count += 1
              print(count)
          elif count > 0:
              count -= 1
              print(count)
          else:
              print("blocked")
    expected_output: "0\nblocked\n1\n0"
    answer_md: "P đầu: count 1 thành 0 nên in 0. P thứ hai: count = 0 nên bị block, in blocked và count giữ nguyên. V: count thành 1 nên in 1. P cuối: count thành 0 nên in 0."
    rubric_md: "Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X850
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `semaphore(ops, initial)` mô phỏng một counting semaphore. `ops` là list chuỗi, mỗi phần tử là `"P"` (wait, down) hoặc `"V"` (signal, up); `initial` là giá trị đếm ban đầu (số nguyên không âm). Xử lý lần lượt: với `"V"` thì `count += 1`; với `"P"` thì nếu `count > 0` thì `count -= 1`, ngược lại P bị BLOCK (không đổi count, tăng bộ đếm số P bị block lên 1). Trả về list `[count_cuối, số_P_bị_block]`. Ví dụ `semaphore(["P","P","V","P"], 1)` trả `[0, 1]`.
    problem_id: check-x850-semaphore
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X851
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao `empty + full` luôn bằng 2 và ký tự `x` tương ứng với thread nào trong bài toán producer-consumer.
    code: |-
      empty, full = 2, 0
      log = []
      for act in ["put", "put", "put", "get", "put", "get", "get", "get"]:
          if act == "put" and empty > 0:
              empty -= 1
              full += 1
              log.append("p")
          elif act == "get" and full > 0:
              full -= 1
              empty += 1
              log.append("g")
          else:
              log.append("x")
      print("".join(log))
      print(empty, full)
    expected_output: "ppxgpggx\n2 0"
    answer_md: "Buffer sức chứa 2. put, put thành công (empty 0, full 2). put thứ ba: empty = 0 nên x (producer bị block ở P(empty)). get: full 1, empty 1. put: empty 0, full 2. get, get: full 0, empty 2. get cuối: full = 0 nên x (consumer bị block ở P(full)). Mỗi lần put chuyển một đơn vị từ empty sang full và get làm ngược lại nên empty + full luôn bằng sức chứa 2. Kết quả ppxgpggx rồi 2 0."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng: x là thread bị block (producer khi buffer đầy, consumer khi buffer rỗng); empty + full bất biến bằng sức chứa. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
