subtopic_id: dsa.trees.tree_recursion
items:
  - id: X443
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      class N:
          def __init__(self, v, l=None, r=None):
              self.v, self.l, self.r = v, l, r

      root = N(10, N(4, N(3), N(1)), N(6))

      def walk(n, remain):
          if n is None:
              return False
          remain -= n.v
          print(n.v, remain)
          if n.l is None and n.r is None:
              return remain == 0
          return walk(n.l, remain) or walk(n.r, remain)

      print(walk(root, 17))
    expected_output: "10 7\n4 3\n3 0\nTrue"
    answer_md: 'Mỗi lời gọi trừ giá trị node khỏi `remain` rồi in. Đường 10, 4, 3 đến lá `3` với `remain = 0` nên trả `True` ngay, và `or` ngắt đệ quy nên các node `1` và `6` không bao giờ được in.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
