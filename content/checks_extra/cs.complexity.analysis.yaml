subtopic_id: cs.complexity.analysis
items:
  - id: X879
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
    code: |-
      n = 16
      steps = 0
      for i in range(n):
          for j in range(i, n):
              steps += 1
      print(steps)
      m = 100
      k = 0
      while m > 1:
          m //= 2
          k += 1
      print(k)
      total = 0
      for i in range(1, 9):
          total += i * i
      print(total)
    expected_output: "136\n6\n204"
    answer_md: "Vòng lồng có vòng trong ngắn dần: 16 + 15 + ... + 1 = 136 bước (O(n^2)). Chia đôi 100: 50, 25, 12, 6, 3, 1 là 6 lần. Tổng bình phương 1..8 = 204."
    rubric_md: "Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X880
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `simplify_order(terms)` rút gọn tiệm cận của một biểu thức chi phí. `terms` là list các cặp `[coeff, exp]` (coeff, exp là số nguyên >= 0) biểu diễn tổng `coeff * n^exp`. Theo phân tích Big-O, bỏ hệ số và các số hạng bậc thấp: trả về **số mũ lớn nhất** trong các số hạng có `coeff > 0`. Nếu `terms` rỗng hoặc mọi coeff đều bằng 0 thì trả `0`. Ví dụ `simplify_order([[3,2],[100,1],[50,0]])` trả `2` (3n^2 + 100n + 50 là O(n^2)), `simplify_order([[0,5],[7,1]])` trả `1`.
    problem_id: check-x880-simplify-order
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X881
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và cho biết Big-O của f(n) cùng chi phí ẩn của vòng for thứ hai.
    code: |-
      def f(n):
          c = 0
          i = 1
          while i < n:
              j = 0
              while j < n:
                  c += 1
                  j += 1
              i *= 2
          return c


      print(f(8), f(16))
      items = [1, 2, 3, 4]
      ops = 0
      for x in items:
          if x in items:
              ops += len(items)
      print(ops)
      s = ""
      for ch in "abc":
          s += ch
      print(s, len(s))
    expected_output: "24 64\n16\nabc 3"
    answer_md: "f(8): i = 1, 2, 4 (3 lần) x 8 = 24; f(16): i = 1, 2, 4, 8 (4 lần) x 16 = 64. Vòng ngoài nhân đôi (log n) x vòng trong n nên f là O(n log n). Vòng for thứ hai: mỗi x in items quét list O(n), 4 phần tử cộng 4 mỗi lần = 16; tổng là O(n^2), đổi items sang set để x in O(1). Vòng cuối in abc 3."
    rubric_md: "Output khớp từng dòng VÀ đúng: f là O(n log n); x in list là O(n) nên vòng thứ hai O(n^2). Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
