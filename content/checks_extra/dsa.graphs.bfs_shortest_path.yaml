subtopic_id: dsa.graphs.bfs_shortest_path
items:
  - id: X450
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      from collections import deque

      adj = [[1, 2], [3], [3], [4], []]
      dist = [-1] * 5
      dist[0] = 0
      q = deque([0])
      while q:
          u = q.popleft()
          for v in adj[u]:
              if dist[v] == -1:
                  dist[v] = dist[u] + 1
                  q.append(v)
      print(dist)
      print(dist[4] - dist[1])
    expected_output: "[0, 1, 1, 2, 3]\n2"
    answer_md: 'BFS từ 0: node 1 và 2 cách 1 cạnh; node 3 được chạm lần đầu từ 1 nên `dist[3] = 2` (lần chạm từ 2 bị bỏ vì đã có dist); node 4 cách 3 cạnh. Vậy `dist = [0, 1, 1, 2, 3]` và `dist[4] - dist[1] = 3 - 1 = 2`.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
