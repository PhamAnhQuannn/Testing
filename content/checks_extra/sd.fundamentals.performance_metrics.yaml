subtopic_id: sd.fundamentals.performance_metrics
items:
  - id: S004
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Nói ngắn gọn: **độ trễ (latency)** và **thông lượng (throughput)** khác nhau thế nào? Mỗi cái
      đo bằng đơn vị gì và trả lời câu hỏi gì về hệ thống?
    answer_md: |
      **Latency** là thời gian **một** yêu cầu phải chờ mới xong, đo bằng mili-giây (ms) — trả lời
      "một người dùng chờ bao lâu". **Throughput** là số yêu cầu hệ thống phục vụ được **mỗi giây**,
      đo bằng request/giây (RPS hay QPS) — trả lời "mỗi giây phục vụ được bao nhiêu". Hai đại lượng
      độc lập: latency là trải nghiệm một người, throughput là sức chứa tổng.
    rubric_md: "Đạt khi nêu đúng cả hai: latency = thời gian chờ một yêu cầu (ms), throughput = số yêu cầu/giây (sức chứa). Nêu đúng cả hai và phân biệt được một người vs tổng: bằng chứng điểm 1. Thiếu một vế hoặc lẫn hai khái niệm: tối đa điểm 0."
  - id: S005
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một yêu cầu đi qua **3 dịch vụ nối tiếp** (serial), mỗi dịch vụ có availability 99.9%.
      (1) Tính availability xấp xỉ của **cả chuỗi** và nói rõ vì sao nó **thấp hơn** 99.9%.
      (2) Đội muốn nâng availability của **một** dịch vụ tới hạn lên: chạy **2 bản song song**
      (parallel/dự phòng), mỗi bản 99.9%. Availability của riêng cặp song song đó xấp xỉ bao nhiêu,
      và vì sao song song lại **tăng** availability?
    answer_md: |
      (1) Nối tiếp thì **nhân** các availability: 0,999 × 0,999 × 0,999 = 0,999³ ≈ **99.7%**. Thấp
      hơn 99.9% vì chỉ cần **một** mắt xích chết là cả chuỗi hỏng, nên rủi ro cộng dồn qua từng mắt
      xích — càng nhiều phụ thuộc nối tiếp, tổng càng tụt.
      (2) Song song chỉ chết khi **cả hai** bản cùng chết, nên lấy 1 trừ tích phần chết:
      1 − 0,001 × 0,001 = 1 − 0,000001 = **99.9999%**. Dự phòng tăng availability vì xác suất hai
      sự cố độc lập xảy ra *đồng thời* nhỏ hơn nhiều so với một sự cố đơn lẻ.
    rubric_md: "Đạt khi: (1) nhân ra 0,999³ ≈ 99.7% và giải thích nối tiếp = một mắt xích chết là hỏng (nên thấp hơn); (2) ra 1 − 0,001² = 99.9999% và giải thích song song chỉ chết khi cả hai cùng chết. Đúng cả hai phép tính + hai lý do, trong time-box: bằng chứng điểm 2. Tính đúng nhưng không giải thích được vì sao serial giảm / parallel tăng, hoặc nhầm công thức giữa hai kiểu: tối đa điểm 1."
  - id: S006
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Trả lời gọn ba phần ở mức phỏng vấn:
      (1) Đổi **99.99%** availability sang **phút chết mỗi năm** (nêu rõ phép tính, biết 1 năm có
      525.600 phút).
      (2) Cho một hệ có **3 dịch vụ nối tiếp** mỗi cái 99.9%: availability cả chuỗi là bao nhiêu? Nếu
      **mỗi** dịch vụ được nhân đôi thành **cụm 2 bản song song** thì availability mỗi cụm và cả
      chuỗi ba cụm thay đổi ra sao (định tính là đủ)?
      (3) Giải thích vì sao đặt mục tiêu latency theo **p99** quan trọng hơn theo **trung bình
      (mean)**.
    answer_md: |
      (1) 99.99% → phần chết 0,01%. 0,0001 × 525.600 = **52,56 ≈ 53 phút chết/năm** ("four nines").
      (2) Ba dịch vụ nối tiếp: 0,999³ ≈ **99.7%**. Mỗi cụm 2 bản song song: 1 − 0,001² = **99.9999%**
      (gần như không bao giờ chết). Ba cụm song song đó lại nối tiếp: 0,999999³ ≈ **99.9997%** — tức
      nhờ dự phòng, cả chuỗi từ 99.7% vọt lên xấp xỉ 99.9997%, vì mỗi mắt xích gần như không còn là
      điểm yếu.
      (3) Mean gộp mọi lần đo nên một nhóm nhỏ rất chậm bị số đông nhanh làm mờ; p99 bắt đúng **đuôi
      chậm (tail latency)** — 1% người dùng xui vẫn là trải nghiệm thật, và trong hệ fan-out (một
      yêu cầu tỏa ra nhiều lời gọi con) đuôi chậm của từng dịch vụ còn bị khuếch đại lên. Không dùng
      p100 vì luôn có nhiễu chậm bất thường khiến mục tiêu không bao giờ đạt.
    rubric_md: "Đạt mức 3 (phỏng vấn) khi làm đúng cả ba: (1) 99.99% → ~53 phút/năm với phép tính rõ; (2) serial 0,999³ ≈ 99.7%, mỗi cụm song song 99.9999%, và thấy được dự phòng kéo cả chuỗi lên gần 99.9997% (định tính: dự phòng khử điểm yếu); (3) giải thích p99 bắt đuôi chậm còn mean che người chậm (bonus: nhắc fan-out hoặc vì sao không dùng p100). Đúng cả ba, tự giải thích mạch lạc trong time-box: bằng chứng điểm 3. Sai một phép tính hoặc không giải thích được vì sao p99 > mean: chưa đạt mức 3."
