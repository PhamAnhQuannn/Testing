subtopic_id: dsa.arrays_strings.hashing_patterns
items:
  - id: X348
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |
      from collections import defaultdict
      g = defaultdict(list)
      for w in ["eat", "tea", "tan", "ate", "nat"]:
          g["".join(sorted(w))].append(w)
      print(list(g.values()))
    expected_output: "[['eat', 'tea', 'ate'], ['tan', 'nat']]"
    answer_md: Key chuẩn hóa là chuỗi đã sắp xếp ("aet" cho eat/tea/ate, "ant" cho tan/nat); các từ cùng key được nhóm lại, thứ tự theo lần xuất hiện đầu của key.
    rubric_md: "Output khớp từng ký tự VÀ giải thích đúng ý key chuẩn hóa bằng sorted. Đúng: bằng chứng điểm 1; sai: điểm 0."
