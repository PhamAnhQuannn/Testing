subtopic_id: sd.technologies.stream_coord
items:
  - id: S157
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Nói ngắn gọn: **Kafka** dùng để làm gì (loại dữ liệu/việc nào hợp), và vì sao nó **không phải**
      một hàng đợi việc (task queue)?
    answer_md: |
      Kafka là một **log chia partition, bền (durable), đọc lại được (replayable)** — hợp cho **luồng
      sự kiện (event streaming)**, tách rời nhiều hệ, nạp dữ liệu (ingestion) và phát lại (replay) với
      thông lượng cao; nhiều consumer đọc độc lập bằng **offset** riêng.
      Nó **không phải task queue** vì không có ngữ nghĩa hàng đợi việc: không **ack/xóa từng tin**,
      không **visibility timeout**, không **hoãn/thử lại từng tin** — tiến độ chỉ là một **offset
      tuyến tính** cho cả partition. Khi cần ack/xóa/hoãn/retry từng việc thì dùng SQS/RabbitMQ.
    rubric_md: "Đạt khi nêu đúng cả hai vế: (1) Kafka = log đọc lại được cho event streaming/ingestion; (2) không phải task queue vì thiếu ack/visibility-timeout/xóa-hoãn-retry từng tin (tiến độ là offset). Đúng ý: bằng chứng điểm 1; thiếu một vế hoặc chỉ nói 'Kafka là message queue': tối đa điểm 0."
  - id: S158
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một đội đang xây hệ gửi **email cho từng đơn hàng** (mỗi đơn là một việc độc lập: làm xong thì
      bỏ, lỗi thì thử lại từng tin). Có người đề nghị dùng **Kafka** vì "đằng nào cũng có Kafka trong
      hệ". Hãy phản biện: (1) bài này thuộc loại nào; (2) nên chọn gì và vì sao; (3) nêu đúng một
      giới hạn của Kafka khiến nó không hợp ở đây.
    answer_md: |
      (1) Đây là bài **hàng đợi việc (task queue)**: mỗi đơn = một việc cần xử lý đúng một lần, làm
      xong thì xóa, lỗi thì thử lại riêng từng tin.
      (2) Nên chọn một **hàng đợi việc** như **SQS** (hoặc RabbitMQ): có **ack**, **xóa sau khi làm**,
      **visibility timeout**, **hoãn/thử lại từng tin** — đúng ngữ nghĩa cần, lại đỡ vận hành hơn
      Kafka.
      (3) Giới hạn của Kafka: **không phải task queue** — tiến độ chỉ là **offset tuyến tính** cho cả
      partition, **không** ack/xóa/hoãn/retry từng tin, nên khó làm đúng ngữ nghĩa "một việc, một
      lần, lỗi thì thử lại tin đó". (Có Kafka sẵn không phải lý do đủ để chọn sai công cụ.)
    rubric_md: "Đạt khi nêu đúng cả 3 ý: nhận ra đây là work queue, chọn SQS/RabbitMQ (và vì sao: ack/xóa/hoãn/retry từng tin), và nêu đúng giới hạn 'Kafka không phải task queue' (offset tuyến tính, không ack/visibility-timeout từng tin). Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Chọn đúng SQS nhưng không nêu được giới hạn Kafka, hoặc đổ theo 'vì đã có sẵn Kafka': tối đa điểm 1."
  - id: S159
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Một hệ thương mại điện tử cần: (a) **nạp** mọi sự kiện click/đơn hàng vào một đường ống chung,
      đọc lại được cho nhiều đội; (b) **phát hiện gian lận trong vài giây** theo trạng thái gần đây
      của từng thẻ; (c) chạy **báo cáo doanh thu mỗi đêm** trên toàn bộ lịch sử; (d) **bầu một
      leader** cho dịch vụ điều phối tồn kho và giữ **config** nhất quán.
      Với **mỗi** yêu cầu (a)-(d), chọn **một** trong Kafka / Flink / Spark / etcd (hoặc ZooKeeper),
      nêu **lý do theo yêu cầu**, và nêu **một giới hạn** cần lưu ý (ít nhất gồm "Kafka không phải
      task queue").
    answer_md: |
      (a) **Kafka** — cần đường ống sự kiện thông lượng cao, bền, **đọc lại được** cho nhiều consumer
      độc lập (ingestion + decoupling). Giới hạn: **Kafka không phải task queue** (không ack/xóa/hoãn/
      retry từng tin, tiến độ là offset) — nếu đâu đó cần ngữ nghĩa hàng đợi việc thì thêm SQS/RabbitMQ.
      (b) **Flink** — cần **độ trễ thấp (vài giây)**, **có trạng thái** theo từng thẻ, tính theo
      **giờ sự kiện** với cửa sổ → đúng sở trường streaming thật. Giới hạn: vận hành trạng thái lớn
      (checkpoint, recovery) phức tạp; không dùng cho tính lại khối lớn như batch.
      (c) **Spark** — báo cáo đêm trên **toàn bộ lịch sử** là **batch** thông lượng cao, hợp
      tính lại khối lớn (reprocessing)/ETL. Giới hạn: độ trễ cao (hàng phút/giờ) nên không dùng cho
      cảnh báo thời gian thực.
      (d) **etcd** (hoặc **ZooKeeper**) — **bầu leader** và giữ **config** nhất quán mạnh là việc
      của dịch vụ điều phối dựa đồng thuận, chỉ giữ **ít metadata**. Giới hạn: **không nhét dữ liệu
      lớn** vào đó vì mỗi ghi phải nhân bản qua đồng thuận ra toàn cụm.
    rubric_md: "Đạt (mức phỏng vấn, theo mastery bar level 3) khi: ánh xạ đúng cả 4 yêu cầu (a→Kafka, b→Flink, c→Spark, d→etcd/ZooKeeper), mỗi lựa chọn kèm **lý do theo yêu cầu** (đọc lại được / độ trễ-trạng thái-event-time / thông lượng-batch / nhất quán mạnh), và nêu đúng ít nhất một giới hạn trong đó có 'Kafka không phải task queue' (và 'không lưu dữ liệu lớn trong etcd/ZooKeeper'). Đúng, trong time-box, tự giải thích rõ ràng: bằng chứng điểm 3. Sai một ánh xạ, hoặc chọn đúng nhưng không nêu lý do theo yêu cầu, hoặc thiếu giới hạn Kafka: chưa đạt mức 3."
