subtopic_id: dsa.stack_queue.stack_problems
items:
  - id: X352
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |
      pairs = {")": "(", "]": "["}
      st = []
      ok = True
      for c in "([)]":
          if c in "([":
              st.append(c)
          elif not st or st.pop() != pairs[c]:
              ok = False
              break
      print(ok and not st)
    expected_output: "False"
    answer_md: Khi gặp ")" đỉnh stack là "[" không khớp "(", nên ngoặc đan xen sai thứ tự (LIFO bị vi phạm) và kết quả là False.
    rubric_md: "Output khớp VÀ giải thích đúng ý ngoặc phải đóng theo thứ tự LIFO. Đúng: bằng chứng điểm 1; sai: điểm 0."
