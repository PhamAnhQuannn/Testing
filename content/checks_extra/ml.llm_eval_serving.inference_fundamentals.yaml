subtopic_id: ml.llm_eval_serving.inference_fundamentals
items:
  - id: S322
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Nói ngắn gọn: trong một lần sinh chữ của LLM, **prefill** và **decode** khác nhau thế nào, và
      mỗi pha quyết định loại độ trễ nào (TTFT hay throughput/TPOT)?
    answer_md: |
      **Prefill**: xử lý *toàn bộ prompt một lượt* (song song) rồi sinh ra **token đầu tiên**; nhiều
      phép tính cùng lúc nên **nghẽn sức tính (compute-bound)**, và nó quyết định **TTFT** (thời gian
      tới token đầu). **Decode**: sau đó sinh **từng token một** (tự hồi quy / autoregressive), mỗi
      bước phải đọc lại toàn bộ trọng số để ra đúng một token nên **nghẽn băng thông bộ nhớ
      (memory-bandwidth-bound)**, và nó quyết định **TPOT/ITL** (thời gian giữa hai token) cùng
      **throughput** (token/giây).
    rubric_md: "Đúng khi nêu được: prefill = cả prompt một lượt → token đầu → TTFT (compute-bound); decode = từng token một, tự hồi quy → TPOT/throughput (memory-bound). Đủ ý: bằng chứng điểm 1. Thiếu một pha, hoặc gán sai pha với loại độ trễ, hoặc đảo compute/memory-bound: tối đa điểm 0."
  - id: S323
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một đồng nghiệp hỏi: "Phục vụ một model **7B ở fp16** với ngữ cảnh **4000 token** thì cần
      khoảng bao nhiêu VRAM, và vì sao khi hội thoại dài dần thì bộ nhớ lại căng?" Hãy trả lời:
      (1) ước lượng **trọng số (weights)** bằng số học; (2) ước lượng **KV cache** cho 4000 token
      (giả sử 32 lớp, 8 kv_head, head_dim 128, fp16) bằng công thức; (3) giải thích vì sao KV cache
      lại là thứ phình lên khi hội thoại/ batch tăng.
    answer_md: |
      (1) **Trọng số** = số tham số × byte/tham số = 7 tỉ × 2 byte (fp16) = **14 GB**.
      (2) **KV cache** = 2 × layers × kv_head × head_dim × byte/số × token.
      Mỗi token: 2 × 32 × 8 × 128 × 2 = 131.072 byte ≈ **0,13 MB**. Với 4000 token (batch 1):
      0,13 MB × 4000 ≈ **0,5 GB**. Tổng ≈ 14 GB + 0,5 GB ≈ **~14,5 GB** cho một chuỗi.
      (3) KV cache phải giữ K/V cho **từng token** của **từng chuỗi chạy song song**, nên nó tăng
      tuyến tính theo **độ dài chuỗi × batch**. Hội thoại càng dài, càng nhiều người dùng đồng thời
      → KV cache càng lớn, ở ngữ cảnh dài có thể **vượt cả trọng số** và trở thành giới hạn chính của
      số yêu cầu / độ dài ngữ cảnh một GPU gánh được (trong khi trọng số là cố định).
    rubric_md: "Đạt (điểm 2) khi nêu đúng cả 3: (1) 7B × 2 byte = 14 GB; (2) áp đúng công thức KV ra ~0,13 MB/token và ~0,5 GB cho 4000 token (sai số nhỏ chấp nhận được miễn số học đúng hướng); (3) KV cache tăng theo độ dài chuỗi × batch nên phình khi hội thoại/ batch lớn, còn trọng số cố định. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Số học trọng số sai (vd quên fp16 = 2 byte), hoặc không giải thích được vì sao KV cache phình: tối đa điểm 1."
  - id: S324
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      **(Phỏng vấn AI engineer)** Bạn phụ trách phục vụ một LLM. Hãy trình bày trọn vẹn:
      (1) **ước lượng ngân sách bộ nhớ** của một model (nêu rõ công thức trọng số và KV cache, cho
      một ví dụ bằng số, và nói KV cache phụ thuộc gì);
      (2) **giải thích TTFT và throughput** từ cơ chế prefill/decode, gồm vì sao decode nghẽn băng
      thông bộ nhớ và điều đó mở đường cho tối ưu gì (ví dụ batching);
      (3) nêu một đòn bẩy kiến trúc cắt KV cache và nói ngắn gọn nó hoạt động ra sao.
    answer_md: |
      **(1) Ngân sách bộ nhớ = trọng số + KV cache + activations** (activations nhỏ khi phục vụ).
      - **Trọng số** = tham số × byte/tham số. fp16 = 2 byte → **7B ≈ 14 GB** (int8 ≈ 7 GB, int4 ≈
        3,5 GB).
      - **KV cache** = 2 × layers × kv_head × head_dim × byte/số × token × **batch**. Ví dụ 32 lớp,
        8 kv_head, head_dim 128, fp16 ≈ 0,13 MB/token → 4000 token ≈ **0,5 GB**. KV cache phụ thuộc
        **độ dài chuỗi và batch**, nên ở ngữ cảnh dài có thể vượt cả trọng số.

      **(2) TTFT và throughput:**
      - **Prefill** xử lý cả prompt song song → nhiều phép tính → **compute-bound**; nó quyết định
        **TTFT** (prompt dài ⇒ TTFT lớn).
      - **Decode** sinh từng token (tự hồi quy): mỗi bước **đọc lại toàn bộ trọng số** từ VRAM chỉ để
        ra 1 token, ít phép tính → **memory-bandwidth-bound**; nó quyết định **TPOT/ITL** và
        **throughput**.
      - Vì sức tính còn thừa còn băng thông mới là nút thắt, ta **batching** — gộp nhiều yêu cầu để
        một lần đọc trọng số phục vụ nhiều chuỗi → **throughput** tăng mạnh (đánh đổi: tốn thêm KV
        cache, có thể tăng độ trễ từng yêu cầu). Đây cũng là lý do latency (một yêu cầu) và throughput
        (toàn hệ thống) là hai mục tiêu khác nhau.

      **(3) Đòn bẩy cắt KV cache:** **GQA (Grouped-Query Attention) / MQA (Multi-Query Attention)** —
      cho nhiều Q-head **dùng chung** một (hoặc ít) bộ K/V, nên **kv_head giảm** → KV cache nhỏ đi
      nhiều lần (ví dụ 32 kv_head xuống 8 kv_head là cắt 4 lần) mà chất lượng gần như giữ nguyên. (Có
      thể nêu thêm: lượng tử hoá KV, hoặc FlashAttention giảm đọc/ghi HBM — nhưng FlashAttention tăng
      tốc tính attention chứ không trực tiếp giảm *dung lượng* cache.)
    rubric_md: "Đạt mức phỏng vấn (điểm 3) khi: (1) tách đúng trọng số (tham số × byte, fp16 = 2 byte, 7B ≈ 14 GB) và KV cache (đúng công thức, một ví dụ số, phụ thuộc token × batch); (2) nối prefill→TTFT (compute-bound) và decode→TPOT/throughput (memory-bound), giải thích đúng vì sao decode nghẽn băng thông và vì sao điều đó mở đường cho batching; (3) nêu được GQA/MQA (hoặc đòn bẩy tương đương) và cơ chế dùng chung K/V. Đúng, trong time-box, tự giải thích rõ: bằng chứng điểm 3. Thiếu phần số học bộ nhớ, hoặc không giải thích được decode memory-bound / batching, hoặc không nêu được đòn bẩy cắt KV cache: chưa đạt mức 3."
