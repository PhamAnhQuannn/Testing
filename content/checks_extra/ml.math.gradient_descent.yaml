subtopic_id: ml.math.gradient_descent
items:
  - id: X640
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết hàm `gradient_descent(xs, ys, w0, lr, steps)` chạy gradient descent cho mô hình `ŷ = w·x` với loss MSE `mean((w*x - y)²)`. Bắt đầu `w = w0`; lặp đúng `steps` lần: `w = w - lr * mean(2*(w*x - y)*x)` (trung bình trên mọi cặp `(x, y)`, gradient tính bằng `w` hiện tại). Trả `w` cuối dưới dạng float `round(w, 6)`. `steps = 0` thì trả `w0` làm tròn. `xs`, `ys` cùng độ dài. Ví dụ: `xs=[1,2,3]`, `ys=[2,4,6]`, `w0=0`, `lr=0.05`, `steps=20` cho `1.999993`.
    problem_id: check-x640-gd
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X641
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao loss cuối lại rất lớn dù đã chạy gradient descent.
    code: |-
      xs = [1, 2, 3]
      ys = [2, 4, 6]
      w = 0.0
      for _ in range(3):
          grad = sum(2 * (w * x - y) * x for x, y in zip(xs, ys)) / 3
          w -= 0.3 * grad
          print(round(w, 4))
      loss = sum((w * x - y) ** 2 for x, y in zip(xs, ys)) / 3
      print(round(loss, 2))
    expected_output: "5.6\n-4.48\n13.664\n634.89"
    answer_md: 'Gradient bằng `(28/3)·2·(w − 2)`, nên mỗi bước `w − 2` được nhân với `1 − 0,3·9,33 = −1,8`: độ lệch đổi dấu và lớn dần (−2 → 3,6 → −6,48 → 11,66). Learning rate 0,3 vượt mốc ≈ 0,21 nên phân kỳ, loss = 11,664²·14/3 ≈ 634,89.'
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng lr quá lớn làm bước nhảy qua đáy, độ lệch tăng và đổi dấu. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
