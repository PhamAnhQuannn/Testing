subtopic_id: py.core.regex
items:
  - id: X363
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      import re
      s = "id=7, id=42; ID=100"
      print(re.findall(r"id=(\d+)", s))
      print(re.findall(r"id=(\d+)", s, re.I))
      m = re.search(r"(\w+)@(\w+)", "mail: lan@home ok")
      print(m.group(2), m.group(0))
      print(re.match(r"\d+", "x1"))
    expected_output: "['7', '42']\n['7', '42', '100']\nhome lan@home\nNone"
    answer_md: 'Pattern có một nhóm `(\d+)` nên `findall` trả list các nhóm (chuỗi số), không phải cả `id=...`. Không có `re.I` thì `ID=100` bị bỏ qua. `group(2)` là `home`, `group(0)` là toàn bộ chỗ khớp `lan@home`. `re.match` chỉ khớp ở đầu chuỗi mà `x1` bắt đầu bằng chữ nên trả `None`.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X364
    difficulty: 2
    type: write_code
    minutes: 5
    prompt_md: |
      Viết `find_emails(text)` trả về list các địa chỉ email trong chuỗi `text`, theo thứ tự xuất hiện. Email có dạng `tên@miền.đuôi`: tên gồm chữ, số, `_` hoặc `.`; miền gồm chữ, số hoặc `_`; đuôi gồm chữ. Dùng `re.findall`.
    problem_id: check-x364-find-emails
    rubric_md: "Pass toàn bộ test ẩn. Đúng không gợi ý trong time-box (5 phút): bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X365
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: |
      Viết `mask_digits(s)` thay mỗi dãy chữ số liên tiếp có độ dài từ 4 trở lên bằng dãy dấu `*` cùng độ dài; dãy chữ số ngắn hơn 4 giữ nguyên, phần còn lại của chuỗi không đổi. Ví dụ `"the 1234567 ma 12"` thành `"the ******* ma 12"`. Gợi ý: `re.sub` nhận được một hàm làm chuỗi thay thế.
    problem_id: check-x365-mask-digits
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 12 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
