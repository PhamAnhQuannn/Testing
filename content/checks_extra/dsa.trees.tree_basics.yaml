    prompt_md: "Viết `level_order(flat)`: dựng cây nhị phân từ mảng BFS có `None` rồi duyệt theo tầng, trả về list các level (ví dụ `[3,9,20,None,None,15,7]` -> `[[3],[9,20],[15,7]]`). Cây rỗng -> `[]`."
    problem_id: check-level-order
    rubric_md: "Dựng cây đúng từ mảng BFS (bỏ qua con của node None) và BFS bằng deque theo từng tầng, pass test ẩn: điểm 3; duyệt tầng đúng nhưng dựng cây sai với None: tối đa 2."
