subtopic_id: sd.fundamentals.scalability
items:
  - id: S001
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Nói ngắn gọn: mở rộng **dọc** và mở rộng **ngang** khác nhau thế nào, và mỗi cách bị giới hạn
      bởi điều gì?
    answer_md: |
      Dọc = dùng một máy mạnh hơn: đơn giản, không đổi code, nhưng có **trần cứng** (máy to nhất vẫn
      hữu hạn) và là **một điểm chết**. Ngang = thêm **nhiều máy** chạy cùng service sau load
      balancer: gần như không có trần và chịu lỗi tốt hơn, nhưng đòi hỏi service **chia được tải**
      (thường là phải stateless).
    rubric_md: "Nêu đúng cả hai: dọc = máy mạnh hơn, trần cứng/điểm chết; ngang = nhiều máy, cần chia tải. Đúng ý: bằng chứng điểm 1; thiếu một vế: tối đa điểm 0."
  - id: S002
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một web API đang chạy trên **một máy** và bắt đầu quá tải CPU lúc cao điểm. Hãy đề xuất bước mở
      rộng tiếp theo **và** điều kiện để làm được: (1) nên scale dọc hay ngang và vì sao; (2) nếu
      ngang thì service cần tính chất gì để nhân bản được sau load balancer; (3) sau khi nhân bản
      app, nghẽn thường chuyển sang đâu?
    answer_md: |
      (1) Trước mắt có thể scale **dọc** cho nhanh, nhưng để đi xa nên **scale ngang**: thêm nhiều app
      server sau một **load balancer**, vì scale dọc có trần cứng và là một điểm chết.
      (2) Service phải **stateless** — không giữ session/trạng thái trong RAM riêng, mà đẩy ra kho dùng
      chung (DB, cache như Redis) — để load balancer rải request bất kỳ vào máy bất kỳ.
      (3) Khi app đã nhân bản, nghẽn dồn về **database dùng chung** (mọi app server đọc/ghi cùng một
      DB); bước sau là thêm cache + read replica để giảm tải đọc.
    rubric_md: "Đạt khi nêu đúng cả 3 ý: ưu tiên scale ngang sau LB (và vì sao), service phải stateless (đẩy state ra ngoài), nghẽn chuyển về database dùng chung. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu ý stateless hoặc không chỉ ra nghẽn DB: tối đa điểm 1."
  - id: S003
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Kể **đúng thứ tự** lộ trình 5 bước mở rộng từ một máy đến hệ nhiều tầng, và với **mỗi bước** chỉ
      ra cái gì đang là **nghẽn** (bottleneck) buộc ta sang bước sau. Nêu rõ vì sao tải **ghi** là
      nghẽn khó gỡ nhất.
    answer_md: |
      1. **Một máy** (web+app+DB chung): nghẽn = CPU/RAM máy đó, và là điểm chết duy nhất.
      2. **Tách tầng** (DB riêng, app riêng): nghẽn = một app server và một database.
      3. **Nhiều app server + load balancer** (app stateless): nghẽn dồn về **database dùng chung**.
      4. **Cache + read replica**: giảm tải **đọc**; nghẽn còn lại là **ghi** (mọi lệnh ghi vẫn về
         primary) và độ trễ nhất quán giữa các replica.
      5. **Sharding / đa vùng**: chia dữ liệu theo khóa để chia cả tải **ghi**; nghẽn = độ phức tạp
         vận hành, giao dịch xuyên shard, đồng bộ giữa vùng.
      Tải **ghi** khó nhất vì không thể nhân bản để giải quyết như đọc: mọi bản sao phải cùng thấy một
      sự thật, nên ghi bị dồn về một primary (hoặc phải phối hợp đồng thuận giữa nhiều node), và chỉ
      **sharding** mới chia được tải ghi — kèm theo giá là mất giao dịch/truy vấn xuyên shard dễ dàng.
    rubric_md: "Đạt (mức phỏng vấn) khi: đủ 5 bước đúng thứ tự, mỗi bước nêu đúng nghẽn, và giải thích đúng vì sao tải ghi khó gỡ (không nhân bản được như đọc, dồn về primary, cần sharding). Đúng, trong time-box, tự giải thích rõ ràng: bằng chứng điểm 3. Sót một bước hoặc không giải thích được nghẽn ghi: chưa đạt mức 3."
