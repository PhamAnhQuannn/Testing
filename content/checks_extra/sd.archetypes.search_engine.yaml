subtopic_id: sd.archetypes.search_engine
items:
  - id: S220
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Nói ngắn gọn: trong một công cụ tìm kiếm, **mục lục ngược (inverted index)** là gì, và vì sao ta
      dựng nó bằng một **pipeline lập chỉ mục** riêng chạy từ DB gốc thay vì tìm thẳng trên DB gốc? Vì
      sao mục lục chỉ tươi gần tức thời (near-real-time)?
    answer_md: |
      **Mục lục ngược** là bảng "từ (term) -> danh sách tài liệu chứa từ đó" (posting list), như mục lục
      cuối sách; tìm một từ là mở thẳng danh sách của từ đó thay vì quét mọi tài liệu. Ta dựng nó bằng
      một **pipeline lập chỉ mục riêng** vì DB gốc tối ưu cho ghi và truy vấn theo khoá chính, không tìm
      toàn văn nhanh trên tập cực lớn được. Pipeline **nghe thay đổi của DB gốc (qua CDC)**, tách từ,
      chuẩn hoá rồi cập nhật mục lục **không đồng bộ (async)**, nên mục lục trễ **nhất quán cuối
      (eventual)** vài giây so với DB gốc — tức tươi **gần tức thời**, đủ cho tìm kiếm.
    rubric_md: "Đạt khi nêu đúng: mục lục ngược = bảng từ -> danh sách tài liệu (tra cứu nhanh thay vì quét hết); dựng riêng vì DB gốc không tìm toàn văn nhanh; tươi gần tức thời vì cập nhật async (CDC) nên trễ eventual. Đúng ý: bằng chứng điểm 1; thiếu ý 'mục lục ngược là gì' hoặc không giải thích được độ trễ tươi: tối đa điểm 0."
  - id: S221
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một sàn thương mại điện tử có 100 triệu sản phẩm; mục lục tìm kiếm đã được **chia thành nhiều
      shard** vì không chứa nổi trên một máy. Hãy mô tả **đường truy vấn** khi người dùng gõ một câu tìm
      kiếm: (1) coordinator làm gì với câu hỏi; (2) mỗi shard trả về gì và vì sao chỉ cần chừng đó; (3)
      coordinator làm gì với các phần trả về; (4) điều gì chi phối độ trễ của cả câu truy vấn và xử lý
      thế nào?
    answer_md: |
      Đây là **scatter-gather**. (1) Coordinator **phát (scatter)** câu hỏi tới **mọi shard** của mục
      lục. (2) Mỗi shard tra mục lục cục bộ, xếp hạng tài liệu của riêng nó rồi trả về **top-k** (ví dụ
      10) kết quả tốt nhất của shard đó — chỉ cần chừng đó vì mỗi shard chỉ nắm một phần tài liệu và kết
      quả cuối chỉ lấy ít tài liệu đầu, gửi top-k cục bộ là đủ và tiết kiệm băng thông. (3) Coordinator
      **gộp (gather/merge)** các danh sách top-k và **xếp hạng lại (re-rank)** thành thứ tự đúng trên
      toàn tập rồi trả cho người dùng. (4) Độ trễ bị **shard chậm nhất** chi phối (tail latency) vì phải
      đợi tất cả trả lời mới gộp được; xử lý bằng **timeout** — quá hạn thì trả kết quả thiếu một shard
      thay vì đợi mãi.
    rubric_md: "Đạt (score 2) khi nêu đúng cả 4 ý: coordinator phát tới mọi shard; mỗi shard trả top-k cục bộ (và vì sao đủ); coordinator gộp + xếp hạng lại; shard chậm nhất chi phối độ trễ (tail latency) + xử lý bằng timeout. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu ý re-rank ở coordinator hoặc không chỉ ra tail latency: tối đa điểm 1."
  - id: S222
    difficulty: 3
    type: concept
    minutes: 12
    prompt_md: |
      Thiết kế một công cụ tìm kiếm ở mức phỏng vấn, đi từ **DB gốc đến mục lục chia phần**. Yêu cầu:
      (1) mô tả đường từ DB gốc qua **pipeline lập chỉ mục** đến **mục lục ngược chia phần**, nêu rõ tính
      tươi của mục lục; (2) giải thích đường truy vấn **scatter-gather**; (3) **so sánh document-
      partitioning với term-partitioning**, nói rõ mỗi cách mỗi truy vấn hỏi bao nhiêu shard, đánh đổi
      khi lập chỉ mục, và vì sao mặc định là document-partitioning.
    answer_md: |
      (1) **DB gốc -> pipeline -> mục lục chia phần.** DB gốc tối ưu ghi/khoá chính, không tìm toàn văn
      nhanh, nên một **pipeline lập chỉ mục** nghe thay đổi qua **CDC (Change Data Capture)**, tách tài
      liệu thành từ và chuẩn hoá, rồi dựng **mục lục ngược (inverted index)**. Vì cập nhật không đồng bộ,
      mục lục **tươi gần tức thời (near-real-time)**, trễ nhất quán cuối vài giây — chấp nhận được. Mục
      lục quá lớn nên **chia thành nhiều shard**, mỗi shard thêm **replica** để tăng thông lượng đọc.
      (2) **Truy vấn scatter-gather.** Coordinator **phát** câu hỏi tới mọi shard; mỗi shard trả **top-k**
      cục bộ (xếp hạng bằng BM25 + tín hiệu); coordinator **gộp và xếp hạng lại** thành kết quả cuối. Độ
      trễ bị shard chậm nhất chi phối (tail latency), nên đặt timeout.
      (3) **Document- vs term-partitioning.**
      - **Document-partitioning:** mỗi shard giữ **mọi từ cho một nhóm tài liệu**. Mỗi truy vấn phải hỏi
        **mọi shard** (tài liệu khớp nằm ở bất kỳ đâu). Lập chỉ mục đơn giản: thêm một tài liệu chỉ ghi
        vào **một** shard; tải trải đều; không có từ nóng.
      - **Term-partitioning:** mỗi shard giữ **một nhóm từ cho mọi tài liệu**. Mỗi truy vấn chỉ hỏi các
        shard **giữ những từ trong câu** — ít shard hơn. Nhưng một tài liệu nhiều từ phải ghi vào **nhiều**
        shard (lập chỉ mục/rebuild khó), và **từ nóng (hot term)** dồn tải lệch về một shard.
      - **Mặc định là document-partitioning** vì lập chỉ mục đơn giản, tải đều, tránh hot term, và việc
        mỗi truy vấn hỏi mọi shard vốn đã hợp với scatter-gather; term-partitioning chỉ dùng khi muốn
        giảm số shard mỗi truy vấn và chấp nhận cái giá hot term + rebuild.
    rubric_md: "Đạt (mức phỏng vấn, score 3) khi: (1) mô tả đúng DB gốc -> pipeline (CDC) -> mục lục ngược chia phần và nêu tươi near-real-time/eventual; (2) giải thích đúng scatter-gather (phát mọi shard, mỗi shard top-k, coordinator gộp + re-rank); (3) so sánh đúng doc- vs term-partitioning gồm số shard mỗi truy vấn, đánh đổi lập chỉ mục, hot term, và lý do mặc định doc-partitioning. Đúng, trong time-box, tự giải thích rõ: bằng chứng điểm 3. Thiếu phần so sánh doc vs term hoặc không giải thích được vì sao mặc định doc-partitioning: chưa đạt mức 3."
