subtopic_id: dsa.practical.simulation_state_machines
items:
  - id: X547
    difficulty: 3
    type: write_code
    minutes: 10
    prompt_md: |
      Viết `life_after(board, steps)`: `board` là ma trận 0/1 (1 là ô sống), ô ngoài biên coi như chết. Mỗi thế hệ, ô sống có 2 hoặc 3 hàng xóm sống (trong 8 ô quanh nó) thì sống tiếp, ngược lại chết; ô chết có đúng 3 hàng xóm sống thì thành sống; mọi ô cập nhật đồng thời từ bảng cũ. Trả về bảng sau `steps` (>= 0) thế hệ; `steps == 0` trả bản sao không đổi. `life_after([[0, 1, 0], [0, 1, 0], [0, 1, 0]], 1)` là `[[0, 0, 0], [1, 1, 1], [0, 0, 0]]`. Gợi ý: double buffer, mỗi thế hệ tạo bảng mới.
    problem_id: check-x547-life-after
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
