subtopic_id: eng.data_access.schema_migrations
items:
  - id: E169
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      **Migration** schema là gì và vì sao gọi là **forward-only**? Nếu cần sửa một migration đã chạy thì làm thế nào?
    answer_md: |
      - **Migration**: mỗi thay đổi cấu trúc bảng là một **file có đánh số** (ví dụ `003_add_phone.sql`, dùng
        Alembic, Flyway, Liquibase, Django migrations), chạy theo thứ tự và được review như code. Máy nào chạy đủ
        các file theo thứ tự thì có cùng schema.
      - **Forward-only**: không sửa file migration đã chạy, vì máy đã chạy sẽ không chạy lại nên schema lệch nhau.
      - Muốn sửa thì **thêm file mới có số lớn hơn** (ví dụ `004_...`).
    rubric_md: "Đạt khi nêu đúng: migration là file đánh số cho mỗi thay đổi schema, chạy theo thứ tự (cùng schema ở mọi máy); forward-only là không sửa file đã chạy, muốn đổi thì thêm file mới số lớn hơn. Đủ hai ý: bằng chứng điểm 1; nói 'sửa lại file cũ' hoặc chỉ nêu định nghĩa mà thiếu cách sửa: điểm 0."
  - id: E170
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Trả lời ba ý về migration:
      1. **Rolling deploy** là gì và vì sao nó ảnh hưởng tới cách viết migration?
      2. Rollback bằng bước `down` của migration khác rollback của transaction thế nào, và vì sao thêm cột lùi dễ còn xóa cột thì không?
      3. Liệt kê **đúng thứ tự** 4 bước **expand-contract** để đổi tên cột `email` thành `contact_email`.
    answer_md: |
      1. **Rolling deploy**: server được thay dần từng cái, nên có lúc **code cũ và code mới cùng chạy trên MỘT
         database**. Migration phải giữ cho cả hai bản chạy được (ví dụ không `RENAME` thẳng làm code cũ lỗi).
      2. Rollback migration là chạy bước **`down`** để đưa schema về trạng thái trước; còn rollback của **transaction**
         là hủy các câu lệnh chưa commit. Thêm cột lùi dễ bằng `DROP COLUMN`; **xóa cột thì mất dữ liệu**, lùi
         schema cũng không lấy lại được dữ liệu đó.
      3. (1) **Thêm cột mới** `contact_email` (cho phép NULL); (2) deploy code **ghi cả hai cột** (dual write);
         (3) **backfill** dữ liệu cũ vào cột mới, **xong rồi mới chuyển code sang đọc cột mới**; (4) cuối cùng
         **xóa cột cũ** `email`.
    rubric_md: "Đạt khi đúng cả ba ý: (1) rolling deploy khiến code cũ và mới cùng dùng một database nên migration phải tương thích với cả hai; (2) bước down của migration khác rollback transaction, thêm cột lùi dễ còn xóa cột mất dữ liệu; (3) thứ tự 4 bước: thêm cột mới, ghi cả hai cột, backfill rồi mới đọc cột mới, xóa cột cũ ở cuối. Đủ ba ý: bằng chứng điểm 2. Đúng hai ý: tối đa điểm 1. Thứ tự sai (ví dụ đọc cột mới trước khi backfill xong, hoặc xóa cột cũ sớm): không tính ý (3)."
  - id: E171
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Bảng `users` có hàng chục triệu dòng, ứng dụng chạy nhiều server và deploy kiểu rolling. Bạn cần
      (a) **đổi tên cột** `email` thành `contact_email`, và (b) thêm cột `country` **NOT NULL** vào cùng bảng.
      Hãy: lập kế hoạch từng bước cho (a), nêu ở mỗi bước code đang chạy ghi/đọc cột nào; nêu cách làm an toàn cho (b);
      giải thích vì sao backfill phải theo lô; và chỉ ra lỗi nếu đồng nghiệp đề nghị "chuyển sang đọc cột mới ngay sau
      khi deploy code ghi cả hai cột, backfill làm sau".
    answer_md: |
      **(a) Expand-contract**:
      1. Thêm cột `contact_email` (cho phép NULL). Code chạy: ghi/đọc `email`.
      2. Deploy code **ghi cả hai cột** (`email` và `contact_email`), vẫn **đọc `email`**.
      3. **Backfill** các dòng cũ vào `contact_email`; **chỉ khi backfill hoàn tất** mới deploy code **đọc
         `contact_email`** (vẫn có thể ghi cả hai trong giai đoạn đệm).
      4. Khi không còn code cũ nào dùng `email`, mới **xóa cột `email`** (bước contract).

      **(b) NOT NULL trên bảng lớn**: thêm `country` **cho phép NULL** trước, deploy code luôn ghi `country`, **backfill
      theo lô**, rồi mới **đặt NOT NULL**. Làm thẳng có thể khóa bảng lâu và làm code cũ lỗi (code cũ `INSERT` không
      điền cột mới).

      **Backfill theo lô** (ví dụ 1000 dòng một lần): một câu `UPDATE` cho cả bảng giữ khóa lâu và gây quá tải; lô nhỏ
      giữ khóa ngắn, ứng dụng vẫn chạy.

      **Lỗi của đề nghị**: đọc cột mới trước khi backfill xong thì các dòng cũ có `contact_email` rỗng, người dùng bị
      thiếu dữ liệu. Backfill phải xong **trước** khi chuyển sang đọc cột mới.
    rubric_md: "Đạt mức 3 khi: (a) kế hoạch đúng thứ tự thêm cột mới, ghi cả hai cột, backfill xong rồi mới đọc cột mới, xóa cột cũ cuối cùng, và nêu code dùng cột nào ở mỗi bước; (b) thêm cột nullable, backfill theo lô, rồi mới đặt NOT NULL (nêu rủi ro khóa bảng hoặc làm code cũ lỗi nếu làm thẳng); giải thích backfill theo lô để không khóa lâu; chỉ ra đọc cột mới trước khi backfill xong làm dòng cũ thiếu dữ liệu. Đủ cả bốn ý: bằng chứng điểm 3. Thiếu một ý hoặc sai thứ tự (ví dụ xóa cột cũ sớm, đặt NOT NULL trước khi backfill, sửa migration đã chạy): chưa đạt mức 3."
