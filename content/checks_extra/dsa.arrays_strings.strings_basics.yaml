subtopic_id: dsa.arrays_strings.strings_basics
items:
  - id: X340
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: "Viết `longest_unique_substr_len(s)`: độ dài chuỗi con liên tiếp dài nhất không có ký tự lặp (ví dụ `'abcabcbb'` -> 3, `''` -> 0). Gợi ý: cửa sổ trượt + dict lưu vị trí cuối."
    problem_id: check-longest-unique-substr
    rubric_md: "Đúng toàn bộ test ẩn, O(n) bằng cửa sổ trượt, xử lý chuỗi rỗng và ký tự lặp xa ('abba'): điểm 3; đúng nhưng O(n^2) hoặc sót biên: tối đa 2."
