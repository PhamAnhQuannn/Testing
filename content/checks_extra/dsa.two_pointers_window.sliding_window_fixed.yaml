subtopic_id: dsa.two_pointers_window.sliding_window_fixed
items:
  - id: X426
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: |
      Viết `count_windows(nums, k, threshold)` trả về số cửa sổ gồm đúng `k` phần tử liên tiếp có trung bình không nhỏ hơn `threshold` (tức tổng >= `k * threshold`; chỉ dùng số nguyên, không chia). Giả sử `1 <= k <= len(nums)`. `count_windows([2, 1, 5, 1, 3, 2], 3, 3)` là `1` (chỉ cửa sổ `[5, 1, 3]` có tổng 9 >= 9). Yêu cầu O(n) bằng cửa sổ trượt cố định: cộng phần tử mới, trừ phần tử rời đi, không tính lại tổng.
    problem_id: check-x426-count-windows
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 12 phút, độ phức tạp O(n): bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
