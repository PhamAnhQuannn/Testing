subtopic_id: dsa.practical.ai_assisted_coding
items:
  - id: X553
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Trợ lý AI viết `chunk_averages(nums, size)` nhưng nó sai ở trường hợp biên. Hãy viết bản đúng: cắt `nums` thành các đoạn liên tiếp dài `size`, trả danh sách trung bình của từng đoạn (`int` nếu chia hết, ngược lại `float`). Đoạn cuối có thể ngắn hơn và chỉ chia cho số phần tử thật của nó. Nếu `size <= 0` hoặc `nums` rỗng thì trả `[]`. `chunk_averages([1, 2, 3, 4, 5], 2)` là `[1.5, 3.5, 5]`. Gợi ý: chia cho `len(chunk)`, không chia cho `size`.
    problem_id: check-x553-fix-chunk-average
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X554
    difficulty: 3
    type: read_code
    minutes: 3
    prompt_md: Trợ lý AI viết đoạn code này và nói nó đúng. Chạy tay (không chạy máy) xem in ra gì, rồi chỉ ra một lỗi trong hàm. Giải thích 1 câu.
    code: |-
      def moving_avg(nums, k):
          out = []
          for i in range(len(nums) - k):
              out.append(sum(nums[i:i + k]) / k)
          return out

      print(moving_avg([1, 2, 3, 4, 5], 2))
      print(moving_avg([1, 2], 2))
      print(moving_avg([2, 4, 6], 1))
    expected_output: "[1.5, 2.5, 3.5]\n[]\n[2.0, 4.0]"
    answer_md: 'Vòng lặp chạy `len(nums) - k` lần nên bỏ sót cửa sổ cuối; đúng phải là `range(len(nums) - k + 1)`. Vì vậy ba lần in ra `[1.5, 2.5, 3.5]` (thiếu 4.5), `[]` (thiếu 1.5) và `[2.0, 4.0]` (thiếu 6.0).'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ chỉ ra lỗi off-by-one ở `range`. Đúng: bằng chứng điểm 3; sai: tối đa điểm 1."
