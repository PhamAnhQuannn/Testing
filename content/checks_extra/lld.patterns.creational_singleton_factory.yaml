subtopic_id: lld.patterns.creational_singleton_factory
items:
  - id: X573
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Giải thích 1 câu vì sao.
    code: |-
      class Dog:
          def speak(self):
              return "woof"


      class Cat:
          def speak(self):
              return "meow"


      PETS = {"dog": Dog, "cat": Cat}


      def make_pet(kind):
          return PETS[kind]()


      pet = make_pet("cat")
      print(pet.speak())
      print(type(pet).__name__)
    expected_output: "meow\nCat"
    answer_md: '`make_pet("cat")` tra class `Cat` trong dict rồi gọi `()` tạo object; `speak()` trả `meow` và tên class là `Cat`. Đó là Simple Factory dùng dict.'
    rubric_md: "Output khớp VÀ nêu factory tra class trong dict rồi tạo object. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X574
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết hàm `make_message(kind, text)` theo Simple Factory dùng dict các callable (không dùng chuỗi if/elif dài). `kind` là `"email"`, `"sms"` hoặc `"push"`, mỗi loại ứng với một class formatter, trả về `"EMAIL: <text>"`, `"SMS: <text>"`, `"PUSH: <text>"`. `kind` lạ trả `"RAW: <text>"`. Ví dụ `make_message("email", "hi")` là `"EMAIL: hi"`.
    problem_id: check-x574-notification-factory
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X575
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao bản sao nông làm đổi bản gốc còn bản sao sâu thì không (Prototype).
    code: |-
      import copy


      class Doc:
          def __init__(self, title, tags):
              self.title = title
              self.tags = tags


      orig = Doc("a", ["x"])
      shallow = copy.copy(orig)
      deep = copy.deepcopy(orig)
      shallow.title = "b"
      shallow.tags.append("y")
      deep.tags.append("z")
      print(orig.title, orig.tags)
      print(shallow.title, shallow.tags)
      print(deep.title, deep.tags)
      print(orig.tags is shallow.tags, orig.tags is deep.tags)
    expected_output: "a ['x', 'y']\nb ['x', 'y']\na ['x', 'z']\nTrue False"
    answer_md: '`copy.copy` chép object ngoài nhưng `tags` vẫn là cùng một list: gán `title` chỉ đổi bản sao, còn `append("y")` đổi cả bản gốc. `deepcopy` chép cả list nên `append("z")` chỉ ảnh hưởng bản sao sâu.'
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng dùng chung list ở shallow copy. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
