subtopic_id: dsa.math_bits.number_theory
items:
  - id: X511
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      def gcd(a, b):
          while b:
              a, b = b, a % b
          return a

      print(gcd(84, 36))
      print(84 * 36 // gcd(84, 36))
      print(pow(3, 4, 5), 7 % 3, (-7) % 3)
    expected_output: "12\n252\n1 1 2"
    answer_md: 'Euclid: (84, 36) -> (36, 12) -> (12, 0) nên gcd là 12; lcm = 84 * 36 // 12 = 252. `pow(3, 4, 5)` là 81 % 5 = 1, `7 % 3` là 1, và `(-7) % 3` là 2 vì Python trả phần dư không âm khi mod dương.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X512
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết `count_primes(n)`: trả về số số nguyên tố **nhỏ hơn hẳn** `n` (n >= 0). `count_primes(10)` là `4` (2, 3, 5, 7); `count_primes(0)`, `count_primes(1)`, `count_primes(2)` đều là `0`. Gợi ý: Sieve of Eratosthenes, đánh dấu bội từ `i*i`.
    problem_id: check-x512-count-primes
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X513
    difficulty: 3
    type: write_code
    minutes: 10
    prompt_md: |
      Viết `mod_pow(base, exp, mod)`: trả về `(base ** exp) % mod` bằng lũy thừa nhanh (binary exponentiation, O(log exp)); `exp >= 0`, `mod >= 1`, nếu `mod == 1` trả `0`. `mod_pow(2, 10, 1000)` là `24`, `mod_pow(5, 0, 7)` là `1`. Gợi ý: xét từng bit của `exp`, bit 1 thì nhân kết quả, rồi bình phương `base`.
    problem_id: check-x513-mod-pow
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
