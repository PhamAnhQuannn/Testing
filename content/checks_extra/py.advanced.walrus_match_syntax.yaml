subtopic_id: py.advanced.walrus_match_syntax
items:
  - id: X411
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      data = [5, 12, 7, 20]
      out = [y for x in data if (y := x - 6) > 0]
      print(out)
      print(y)

      def kind(v):
          match v:
              case [0, *rest]:
                  return f"zero-led {len(rest)}"
              case [a, b] if a == b:
                  return "twin"
              case [a, *_]:
                  return f"head {a}"
              case _:
                  return "none"

      print(kind([0, 1, 2]), kind([4, 4]), kind([4, 5]), kind([]))
    expected_output: "[6, 1, 14]\n14\nzero-led 2 twin head 4 none"
    answer_md: 'Walrus tính `x - 6` một lần: giữ 6, 1, 14 (bỏ -1) nên `out = [6, 1, 14]`; `y` rò ra scope ngoài và giữ lần gán cuối là 14. `[0, 1, 2]` khớp nhánh đầu (còn 2 phần tử); `[4, 4]` khớp `twin` nhờ guard; `[4, 5]` rơi vào `[a, *_]`; `[]` không khớp sequence nào nên vào `_`.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X412
    difficulty: 2
    type: write_code
    minutes: 5
    prompt_md: |
      Viết `chunk_sums(data, k)` (`k >= 1`) trả list tổng của từng đoạn liên tiếp dài `k` của `data` (đoạn cuối có thể ngắn hơn). Dùng vòng `while` với walrus: `while (chunk := data[i:i+k]):` rồi tăng `i`. Ví dụ `chunk_sums([1, 2, 3, 4, 5], 2)` là `[3, 7, 5]`; `data` rỗng cho `[]`.
    problem_id: check-x412-chunk-sums
    rubric_md: "Pass toàn bộ test ẩn. Đúng không gợi ý trong time-box (5 phút): bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X413
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: |
      Viết `evaluate(expr)` tính giá trị biểu thức lồng nhau bằng `match`/`case`: một số nguyên trả chính nó; `["add", *args]` là tổng các biểu thức con (rỗng là 0); `["mul", *args]` là tích (rỗng là 1); `["neg", e]` là `-evaluate(e)`; `["if", c, a, b]` trả `evaluate(a)` nếu `evaluate(c) != 0`, ngược lại `evaluate(b)`; mọi thứ khác (chuỗi, toán tử lạ, sai số đối số) trả `0`. Ví dụ `evaluate(["add", 1, ["mul", 2, 3]])` là `7`.
    problem_id: check-x413-eval-expr
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 12 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
