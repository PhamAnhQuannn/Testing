subtopic_id: sd.networking.service_discovery_mesh
items:
  - id: S094
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Nói ngắn gọn: **service discovery** giải quyết vấn đề gì, và **service registry** đóng vai trò
      gì trong đó?
    answer_md: |
      Trong hạ tầng động (autoscaling, container), địa chỉ (IP:port) của các instance **đổi liên
      tục** nên không thể ghi cứng địa chỉ service khác vào code. **Service discovery** là cách để
      một service tìm ra "ngay bây giờ service kia đang ở những địa chỉ nào" một cách tự động — như
      một **danh bạ (directory) luôn tự cập nhật**. **Service registry** chính là danh bạ đó:
      instance tự **đăng ký** khi chạy, gửi **heartbeat** để chứng tỏ còn sống, và bị **xóa** khi quá
      hạn TTL, nên registry luôn chỉ chứa các instance khỏe (ví dụ Consul/etcd, hoặc Kubernetes
      Service/DNS).
    rubric_md: "Nêu đúng cả hai: (1) discovery giải vấn đề địa chỉ đổi liên tục trong fleet động nên không hardcode được; (2) registry là danh bạ tự cập nhật qua register + heartbeat/TTL. Đúng ý: bằng chứng điểm 1; thiếu một vế: tối đa điểm 0."
  - id: S095
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một đội đang chọn giữa **client-side discovery** và **server-side discovery** cho hệ
      microservices của họ. Hãy giải thích: (1) mỗi kiểu ai là người chọn instance đích và luồng
      request khác nhau thế nào; (2) tradeoff chính của mỗi kiểu (độ trễ/số hop và gánh nặng ở
      client); (3) nếu đội dùng **nhiều ngôn ngữ (polyglot)** thì kiểu nào hợp hơn và vì sao.
    answer_md: |
      (1) **Client-side:** client **tự hỏi registry** lấy danh sách instance khỏe rồi **tự
      load-balance** (tự chọn một địa chỉ để gọi); gọi thẳng tới instance, không qua trung gian.
      **Server-side:** client chỉ gọi **một địa chỉ cố định** (LB/gateway hoặc tên DNS); thành phần
      đó tra registry và chuyển request tới instance khỏe (kiểu của Kubernetes Service).
      (2) Client-side **bớt một hop** (độ trễ thấp hơn) và cho client tự chọn chiến lược, nhưng
      **logic discovery/LB nằm trong client** (phải có thư viện cho mỗi ngôn ngữ). Server-side giữ
      **client đơn giản** nhưng **thêm một hop** qua LB, và LB thành thứ phải scale/đảm bảo sẵn sàng.
      (3) Đội **polyglot** hợp với **server-side** hơn: không phải viết lại thư viện discovery/LB cho
      từng ngôn ngữ, mọi client chỉ cần gọi một địa chỉ cố định.
    rubric_md: "Đạt khi nêu đúng cả 3 ý: client tự hỏi+tự LB (bớt hop, logic ở client) vs gọi LB cố định (client gọn, thêm hop); và polyglot hợp server-side vì tránh viết lại thư viện cho mỗi ngôn ngữ. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu phần tradeoff hop/gánh nặng client, hoặc không gắn được polyglot với server-side: tối đa điểm 1."
  - id: S096
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Ở mức phỏng vấn: (1) **so sánh client-side và server-side discovery** (ai chọn instance, số hop,
      gánh nặng ở client); (2) **vẽ/mô tả sidecar nằm ở đâu** trong một service mesh và một request từ
      service A tới B đi qua những khối nào; (3) nói rõ **khi nào một service mesh đáng chi phí** và
      **nó thêm độ trễ ở đâu**.
    answer_md: |
      (1) **Client-side:** client tự hỏi registry rồi tự load-balance, gọi thẳng instance — bớt một
      hop, nhưng logic discovery/LB nằm trong client (khó với đội đa ngôn ngữ). **Server-side:**
      client gọi một LB/gateway cố định, nó tra registry và chuyển tiếp — client đơn giản (hợp
      polyglot) nhưng thêm một hop và LB phải tự scale (Kubernetes Service theo kiểu này).
      (2) Mesh đặt **cạnh mỗi service một sidecar proxy** (ví dụ Envoy). Request đi:
      `[A] → [sidecar A] ══ mạng ══ [sidecar B] → [B]` — A gọi sidecar của chính mình, sidecar A gửi
      tới sidecar B (mã hóa mTLS, áp retry/timeout/luật), sidecar B chuyển cho B. Các sidecar là
      **data plane**; **control plane** đẩy cấu hình xuống chúng. Code của A, B không phải đổi.
      (3) Mesh **đáng chi phí** khi có **nhiều service + đa ngôn ngữ**: nó chuẩn hóa mTLS, retry,
      timeout, traffic-splitting, observability cho mọi service và kéo chúng ra khỏi code ứng dụng,
      đổi luật chỉ cần sửa control plane. Với **ít service, một ngôn ngữ** thì thường **quá mức** —
      một thư viện chung là đủ. Mesh **thêm độ trễ** vì mỗi lời gọi đi qua **hai chặng proxy** (ra
      sidecar người gọi, vào sidecar người nhận), cộng dồn trên chuỗi gọi dài, cộng chi phí
      RAM/CPU một sidecar mỗi instance và vận hành control plane.
    rubric_md: "Đạt (mức phỏng vấn) khi làm đủ 3 việc theo mastery bar: (1) so sánh client-side vs server-side (ai chọn instance, số hop, gánh nặng client); (2) đặt đúng sidecar cạnh mỗi service và mô tả đường đi A→sidecar A→sidecar B→B; (3) nêu mesh đáng khi nhiều service/polyglot (và overkill khi nhỏ) VÀ chỉ ra độ trễ đến từ hai chặng proxy mỗi lời gọi. Đúng, trong time-box, tự giải thích rõ: bằng chứng điểm 3. Sót việc vẽ sidecar, hoặc không nói được chỗ mesh thêm độ trễ, hoặc không nêu điều kiện mesh đáng giá: chưa đạt mức 3."
  - id: X300
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Phỏng vấn: **DNS** là gì và nó làm gì khi user gõ `example.com`? Nêu **round-robin DNS**,
      **GeoDNS**, và vai trò của **TTL** (đánh đổi giữa caching và độ trễ cập nhật).
    answer_md: |
      - **DNS** (Domain Name System) là "danh bạ" của Internet: **phân giải tên miền → địa chỉ IP**
        (bản ghi A/AAAA; CNAME là bí danh). Resolver hỏi lần lượt root → TLD → authoritative NS, rồi
        **cache** kết quả.
      - **Round-robin DNS**: một tên trả về **nhiều IP** xoay vòng, phân tải thô (không biết server
        sống hay chết, không theo tải thực).
      - **GeoDNS**: trả IP khác nhau theo **vị trí địa lý** của client (gửi tới region/POP gần nhất),
        giảm độ trễ.
      - **TTL** (time-to-live): thời gian bản ghi được cache. **TTL cao** → ít truy vấn, nhanh, nhưng
        thay đổi IP **lan chậm** (client cũ vẫn dùng IP cũ). **TTL thấp** → đổi/failover nhanh nhưng
        nhiều truy vấn hơn, tải NS và độ trễ tra cứu tăng.
    rubric_md: "Đạt khi nêu: DNS phân giải tên→IP (có cache theo tầng); round-robin = nhiều IP xoay vòng; GeoDNS = trả IP theo vị trí; TTL cao = cache tốt nhưng cập nhật chậm, TTL thấp = cập nhật nhanh nhưng tốn truy vấn. Đủ 4 ý: bằng chứng điểm 1; thiếu đánh đổi TTL: tối đa điểm 0."
  - id: X301
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      DNS thường là **single point of failure** ẩn của hệ thống. (1) Nêu ít nhất 3 **nhược điểm / điểm
      lỗi** của DNS trong việc định tuyến lưu lượng và failover. (2) Cách **giảm** từng rủi ro (TTL thấp
      khi failover, nhiều NS, anycast...)? (3) Đánh đổi của các giải pháp đó là gì?
    answer_md: |
      **(1) Nhược điểm**
      - **Cache/TTL**: resolver và client cache lâu, đôi khi **phớt lờ TTL**, nên failover bằng DNS
        không tức thời (độ trễ lan truyền có thể phút tới giờ).
      - **Không biết sức khỏe** server: round-robin vẫn trả IP chết nếu không gắn health check.
      - **Điểm lỗi tập trung**: nhà cung cấp authoritative NS chết hoặc bị **DDoS** (như vụ Dyn 2016)
        thì cả tên miền không phân giải được.
      - Điều khiển thô: không theo tải thực, dễ bị lệch do cache ở ISP.

      **(2) Giảm rủi ro**
      - Hạ **TTL** (vd 30-60s) **trước** khi di chuyển/failover, kèm **health check** tự gỡ IP chết.
      - **Nhiều NS**, tốt nhất ở **nhiều nhà cung cấp** độc lập (multi-provider DNS).
      - **Anycast**: nhiều node cùng quảng bá một IP, truy vấn đi tới node gần/còn sống, chịu DDoS tốt.
      - Đặt load balancer/CDN phía sau một IP ổn định để failover cấp L4/L7 thay vì dựa DNS.

      **(3) Đánh đổi**: TTL thấp → **nhiều truy vấn hơn**, tăng tải NS và độ trễ tra cứu, chi phí cao;
      multi-provider → vận hành/đồng bộ bản ghi phức tạp hơn, tốn tiền; anycast → phụ thuộc nhà cung
      cấp, khó debug; không loại bỏ hoàn toàn độ trễ do cache của client.
    rubric_md: "Đạt khi nêu đủ: (1) ít nhất 3 nhược điểm trong {cache/TTL không tức thời, không health check, SPOF/DDoS NS, điều khiển thô}; (2) giải pháp tương ứng gồm TTL thấp + health check, nhiều NS, anycast; (3) đánh đổi cụ thể (tải truy vấn/chi phí/độ phức tạp). Đủ và rõ trong time-box: bằng chứng điểm 2. Thiếu đánh đổi hoặc chỉ nêu giải pháp không nêu rủi ro: tối đa điểm 1."
