subtopic_id: eng.security.owasp
items:
  - id: E133
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      **SQL injection** là gì và cách phòng đúng nhất? Vì sao không nên tự escape ký tự bằng tay rồi ghép chuỗi?
    answer_md: |
      - **SQL injection**: code ghép dữ liệu người dùng thẳng vào câu SQL, nên dữ liệu có thể bị database
        hiểu nhầm thành lệnh.
      - Cách phòng: **parameterized query** (prepared statement): câu SQL và giá trị được gửi **tách riêng**,
        giá trị luôn là dữ liệu.
      - Escape tay rồi ghép chuỗi dễ sót trường hợp và khó duy trì; nên dùng cơ chế tham số hóa của thư viện.
      - Bổ sung: tài khoản database chỉ có quyền tối thiểu (least privilege).
    rubric_md: "Đạt khi nêu đúng: nguyên nhân là ghép chuỗi với dữ liệu người dùng; cách sửa là parameterized query/prepared statement (tách lệnh và dữ liệu). Đủ hai ý: bằng chứng điểm 1; chỉ nói 'escape' hoặc 'validate input' thay cho tham số hóa: điểm 0."
  - id: E134
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Với mỗi tình huống, hãy **gọi tên lớp lỗ hổng** và nêu **cách sửa đúng**:
      1. Một trang hồ sơ hiển thị trường "giới thiệu bản thân" do người dùng nhập, được chèn nguyên văn vào HTML.
      2. Endpoint `GET /invoices/{id}` chỉ kiểm tra người dùng đã đăng nhập; đổi `id` trên URL thì xem được hóa đơn người khác.
      3. Hàm tìm kiếm dựng câu SQL bằng cách nối chuỗi với từ khóa người dùng nhập.
    answer_md: |
      1. **XSS** (stored). Sửa: **output encoding/escape** theo ngữ cảnh khi hiển thị, dùng template/framework
         có auto-escaping, tránh chèn HTML thô; thêm **CSP** làm lớp bảo vệ bổ sung.
      2. **IDOR / broken access control**. Sửa: server kiểm tra **hóa đơn thuộc người dùng hiện tại** (so owner với
         danh tính từ session) trên mỗi yêu cầu; không tin ID từ client; mặc định từ chối.
      3. **SQL injection**. Sửa: **parameterized query** (prepared statement), không nối chuỗi.
    rubric_md: "Đạt khi đúng cả ba cặp (lỗi, cách sửa): (1) XSS + output encoding/auto-escaping; (2) IDOR hoặc broken access control + kiểm quyền sở hữu phía server; (3) SQL injection + parameterized query. Đủ ba: bằng chứng điểm 2. Đúng hai: tối đa điểm 1. Sửa sai (ví dụ 'ẩn id', 'chỉ validate ở client', 'escape tay'): không tính cặp đó."
  - id: E135
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Bạn review một ứng dụng web và thấy: (a) nút "đổi email" gửi `POST` chỉ dựa vào cookie đăng nhập, không có gì khác;
      (b) tính năng "nhập URL ảnh đại diện" để server tải về; (c) một đồng nghiệp nói "chúng ta đã validate input ở form nên
      không cần parameterized query hay encoding nữa".
      Hãy: nêu lớp lỗ hổng và cách sửa cho (a) và (b); phản biện (c); và giải thích khác nhau giữa **XSS** và **CSRF**.
    answer_md: |
      **(a) CSRF**: trình duyệt tự gửi cookie nên trang khác có thể khiến người dùng đang đăng nhập gửi yêu cầu. Sửa:
      **anti-CSRF token** kiểm tra phía server, cookie **SameSite** (`Lax`/`Strict`), không đổi dữ liệu bằng `GET`.

      **(b) SSRF**: server có thể bị lừa gọi tới địa chỉ nội bộ. Sửa: **allowlist** domain/URL được phép, chặn dải nội bộ
      (loopback, mạng riêng, metadata của cloud) kể cả sau DNS và redirect, chỉ cho `https`, đặt timeout.

      **(c) Sai**: **validate input** chỉ là một lớp, dễ sót và không biết ngữ cảnh sử dụng sau này. Vẫn cần **parameterized
      query** cho SQL và **output encoding** khi hiển thị (defense in depth); validate là bổ sung chứ không thay thế.

      **XSS vs CSRF**: XSS làm script lạ **chạy trên trang của bạn** (lỗi ở việc xuất dữ liệu không mã hóa, sửa bằng output
      encoding/CSP). CSRF khiến trình duyệt của nạn nhân **gửi yêu cầu giả mạo** lợi dụng cookie tự gửi (sửa bằng token/SameSite).
    rubric_md: "Đạt mức 3 khi: (a) CSRF + token/SameSite; (b) SSRF + allowlist và chặn dải nội bộ; (c) giải thích validate input không thay thế parameterized query/output encoding (nhiều lớp phòng thủ); phân biệt đúng XSS (script chạy trên trang, sửa bằng encoding) với CSRF (yêu cầu giả mạo dùng cookie, sửa bằng token/SameSite). Đủ cả bốn ý: bằng chứng điểm 3. Thiếu một ý hoặc sửa sai (ví dụ 'dùng danh sách cấm', 'validate là đủ'): chưa đạt mức 3."
