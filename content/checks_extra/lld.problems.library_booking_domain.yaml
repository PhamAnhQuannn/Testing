subtopic_id: lld.problems.library_booking_domain
items:
  - id: X612
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Giải thích 1 câu vì sao lần `book("A1", "binh")` trả `False`.
    code: |-
      class Cinema:
          def __init__(self):
              self.booked = {}

          def book(self, seat, who):
              if seat in self.booked:
                  return False
              self.booked[seat] = who
              return True

          def owner(self, seat):
              return self.booked.get(seat, "-")


      c = Cinema()
      print(c.book("A1", "an"))
      print(c.book("A1", "binh"))
      print(c.book("A2", "binh"))
      print(c.owner("A1"))
      print(c.owner("A3"))
      print(len(c.booked))
    expected_output: "True\nFalse\nTrue\nan\n-\n2"
    answer_md: 'Ghế `A1` đã có trong `booked` (của `an`) nên lần đặt thứ hai bị chặn và trả False, chủ ghế vẫn là `an`. `A2` còn trống nên True. `A3` chưa ai đặt nên `get` trả mặc định `-`. Dict có 2 ghế: `A1` và `A2`.'
    rubric_md: "Output khớp VÀ nêu đúng việc kiểm tra ghế đã có trong dict trước khi đặt (chặn double-booking). Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X613
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết `class BookingSystem` chặn đặt trùng ghế, báo lỗi bằng giá trị trả về (không ném lỗi). Constructor không tham số. `add_seat(seat)` đăng ký một mã ghế còn trống, gọi lại với ghế đã có thì bỏ qua (không trả gì). `book(seat)` trả `True` và đánh dấu đã đặt nếu ghế tồn tại và còn trống, ngược lại (ghế lạ hoặc đã đặt) trả `False`. `cancel(seat)` trả `True` và trả ghế về trống nếu ghế đang được đặt, ngược lại trả `False`. `is_booked(seat)` trả `bool` (ghế lạ là `False`). `free_count()` trả số ghế đã đăng ký đang trống (`int`). Ví dụ: `add_seat("a1")`, `book("a1")` là `True`, `book("a1")` lần hai là `False`, `free_count()` là `0`.
    problem_id: check-x613-seat-booking
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X614
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code đặt phòng khách sạn theo (phòng, ngày) dưới đây in ra gì? Ghi đúng từng dòng và giải thích vì sao `cancel` của `binh` thất bại còn phòng 101 ngày 5 đặt lại được sau khi `an` hủy.
    code: |-
      class Hotel:
          def __init__(self):
              self.taken = {}

          def book(self, room, day, guest):
              key = (room, day)
              if key in self.taken:
                  return False
              self.taken[key] = guest
              return True

          def cancel(self, room, day, guest):
              key = (room, day)
              if self.taken.get(key) != guest:
                  return False
              del self.taken[key]
              return True


      h = Hotel()
      print(h.book(101, 5, "an"))
      print(h.book(101, 5, "binh"))
      print(h.book(101, 6, "binh"))
      print(h.cancel(101, 5, "binh"))
      print(h.cancel(101, 5, "an"))
      print(h.book(101, 5, "binh"))
      print(h.book(102, 5, "an"))
      print(sorted(h.taken.items()))
    expected_output: "True\nFalse\nTrue\nFalse\nTrue\nTrue\nTrue\n[((101, 5), 'binh'), ((101, 6), 'binh'), ((102, 5), 'an')]"
    answer_md: 'Khóa trùng là cặp (phòng, ngày): `(101, 5)` đã có `an` nên `binh` đặt bị chặn, nhưng `(101, 6)` và `(102, 5)` là khóa khác nên đặt được. `binh` không phải người giữ `(101, 5)` nên `cancel` trả False và không đổi gì; `an` hủy thành công thì khóa bị xóa, nên `binh` đặt lại được. Cuối cùng dict có ba khóa như in ra.'
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng khóa (phòng, ngày) quyết định trùng, và chỉ người giữ chỗ mới hủy được. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
