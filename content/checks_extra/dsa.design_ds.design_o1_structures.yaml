subtopic_id: dsa.design_ds.design_o1_structures
items:
  - id: X504
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      stack = []

      def push(v):
          m = v if not stack else min(v, stack[-1][1])
          stack.append((v, m))

      for v in [4, 6, 2, 8]:
          push(v)
      print(stack)
      stack.pop()
      stack.pop()
      print(stack[-1][1], len(stack))
    expected_output: "[(4, 4), (6, 4), (2, 2), (8, 2)]\n4 2"
    answer_md: 'Mỗi phần tử lưu kèm min tính đến nó: 4, 4, 2, 2. Sau hai lần `pop`, còn `[(4, 4), (6, 4)]` nên min là 4 và độ dài là 2, không cần duyệt lại.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
