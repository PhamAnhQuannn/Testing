subtopic_id: sd.archetypes.rate_limiter
items:
  - id: S172
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Nói ngắn gọn: **token bucket** và **leaky bucket** khác nhau ở chỗ nào về hình dạng lưu
      lượng cho qua? Mỗi cái hợp với nhu cầu gì?
    answer_md: |
      **Token bucket:** xô nạp token đều đặn theo tốc độ R, mỗi yêu cầu lấy 1 token; vì xô có thể
      đầy sẵn nên **cho phép một đợt dồn (burst)** đến bằng dung lượng xô, rồi về lại tốc độ R —
      hợp khi muốn linh hoạt với lưu lượng gồ ghề.
      **Leaky bucket:** yêu cầu xếp hàng và được xử lý với **tốc độ cố định**, nên đầu ra luôn
      **đều, mượt**, không có burst — hợp khi hệ phía sau cần dòng vào ổn định.
      Cốt lõi: token bucket **cho phép burst**, leaky bucket **làm mượt** thành tốc độ không đổi.
    rubric_md: "Đạt khi nêu đúng cả hai: token bucket cho phép burst (xô nạp R, đầy sẵn), leaky bucket làm mượt/đầu ra tốc độ cố định. Đúng ý: bằng chứng điểm 1. Thiếu một vế hoặc lẫn burst/mượt: tối đa điểm 0."
  - id: S173
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một API dùng **fixed window** 100 yêu cầu/phút và đội vận hành thấy có lúc một user bắn được
      gần **200 yêu cầu trong vài giây**. (1) Giải thích vì sao fixed window để lọt chuyện đó;
      (2) đề xuất thuật toán thay thế và nêu đánh đổi của mỗi lựa chọn (chính xác vs bộ nhớ/chi phí).
    answer_md: |
      (1) **Boundary burst (hở ở ranh giới):** fixed window reset bộ đếm đột ngột ở mốc cửa sổ,
      nên 100 yêu cầu ở **cuối** phút này (ví dụ 00:59) cộng 100 yêu cầu ở **đầu** phút sau (01:00)
      là ~200 trong vài giây vắt qua mốc, dù mức là 100/phút.
      (2) Thay bằng **sliding window**:
      - **Sliding window log:** nhớ dấu thời gian từng yêu cầu trong 60s gần nhất rồi đếm —
        **chính xác** nhất nhưng **tốn bộ nhớ** (lưu mọi yêu cầu).
      - **Sliding window counter:** ước lượng từ bộ đếm cửa sổ hiện tại và cửa sổ trước theo tỉ lệ
        trôi qua — **nhẹ hơn nhiều**, gần đúng, loại được phần lớn lỗi ranh giới; đây là lựa chọn
        cân bằng phổ biến.
      Đánh đổi: log cho độ chính xác cao nhất với giá bộ nhớ; counter chấp nhận gần đúng để rẻ và
      nhẹ; fixed window đơn giản nhất nhưng có lỗi boundary burst.
    rubric_md: "Đạt khi: (1) chỉ đúng boundary burst — reset ở mốc nên hai đợt cuối/đầu cộng vắt qua ranh giới; (2) đề xuất sliding window và nêu đúng đánh đổi chính xác vs bộ nhớ/chi phí (log chính xác-tốn RAM, counter nhẹ-gần đúng). Đúng, tự giải thích được trong time-box: bằng chứng điểm 2. Chỉ nói 'đổi thuật toán' mà không giải thích boundary burst hoặc không nêu đánh đổi: tối đa điểm 1."
  - id: S174
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Thiết kế một **rate limiter chạy trên nhiều server** (100 app server stateless sau load
      balancer) giới hạn **100 yêu cầu/phút cho mỗi user trên toàn hệ thống**. Trình bày: (1) chọn
      **thuật toán đếm** và vì sao; (2) đếm **phân tán** thế nào để mọi server đồng ý một con số,
      và vì sao cần **thao tác nguyên tử** (atomic); (3) khi bộ đếm (Redis) **chết** thì chọn
      **fail-open hay fail-closed** và vì sao.
    answer_md: |
      (1) **Thuật toán:** chọn **token bucket** nếu muốn cho phép burst ngắn rồi về tốc độ R, hoặc
      **sliding window counter** nếu muốn mức mượt mà vẫn nhẹ; tránh **fixed window** thuần vì lỗi
      boundary burst (gấp đôi mức ở ranh giới). Nêu rõ cửa sổ/mức: 100/phút cho mỗi user.
      (2) **Phân tán:** không cho mỗi server tự đếm trong RAM riêng (sẽ nhân mức lên ~100 lần);
      dùng **bộ đếm dùng chung** trên **Redis** mà mọi server cùng tăng — INCR + EXPIRE cho cửa
      sổ, hoặc gói cả logic (token bucket) trong một **script Lua**. Bước "đọc–kiểm tra–tăng" phải
      **nguyên tử (atomic)**; nếu không, hai yêu cầu đồng thời cùng thấy "còn lượt" và cùng qua —
      **race condition** làm lọt quá mức. INCR và Lua cho ta tính nguyên tử đó.
      (Có thể nói thêm đánh đổi: gọi Redis mỗi request thì chính xác nhưng thêm một chặng mạng;
      đếm cục bộ gần đúng rồi đồng bộ async thì nhanh hơn nhưng mức vượt một chút.)
      (3) **Bộ đếm chết:** nêu đánh đổi và chọn có lý do. Với limiter kiểu **fair-use**, thường
      **fail-open** (cho qua hết) để lớp bảo vệ không làm sập dịch vụ; với limiter nhằm **chống
      lạm dụng/DDoS** hoặc bảo vệ tài nguyên đắt thì **fail-closed** (chặn) để giữ an toàn. Từ chối
      thì trả **429 + Retry-After**.
    rubric_md: "Đạt (mức phỏng vấn, theo mastery_bar mức 3) khi: (1) chọn một thuật toán có lý do và loại fixed window thuần; (2) mô tả bộ đếm dùng chung (Redis INCR/EXPIRE hoặc Lua) và giải thích vì sao cần thao tác nguyên tử (tránh race condition làm lọt quá mức), không để server tự đếm cục bộ; (3) chọn fail-open hay fail-closed kèm lý do gắn với ngữ cảnh (fair-use vs chống lạm dụng). Đủ ba ý, tự giải thích rõ trong time-box: bằng chứng điểm 3. Sót phần nguyên tử/race hoặc không nêu được lựa chọn fail-open/closed có lý do: chưa đạt mức 3."
