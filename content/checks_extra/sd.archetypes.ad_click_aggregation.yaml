subtopic_id: sd.archetypes.ad_click_aggregation
items:
  - id: S247
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Trong bài đếm click quảng cáo, hệ thống chạy **hai nhánh**: nhánh luồng (streaming path) và
      nhánh lô (batch path). Mỗi nhánh dùng để làm gì, và con số của nhánh nào được dùng để **tính
      tiền (billing)**?
    answer_md: |
      - **Nhánh luồng (streaming path):** gộp click theo cửa sổ 1 phút rồi đẩy lên **dashboard** gần
        thời gian thực — con số **nhanh nhưng xấp xỉ** (chỉ để xem nhanh).
      - **Nhánh lô (batch path):** cuối ngày đọc lại toàn bộ log thô và đếm lại ra con số **đúng, có
        thẩm quyền**.
      Con số **cuối ngày của nhánh lô** là con số dùng để **tính tiền**; số luồng chỉ để hiển thị.
    rubric_md: "Đạt khi nêu đúng: luồng = số nhanh/xấp xỉ cho dashboard, lô = số đúng cuối ngày, và nói rõ **số lô mới dùng để tính tiền**. Đúng ý: bằng chứng điểm 1; thiếu việc chỉ ra nhánh lô dùng để billing: tối đa điểm 0."
  - id: S248
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một quảng cáo **viral** chiếm 50% của 10.000 click/giây, làm một **partition** quá tải trong
      khi các máy khác rảnh. (1) Gọi tên vấn đề này; (2) nêu cách gỡ và giải thích vì sao chỉ **tăng
      số partition** không giải quyết được; (3) cách này làm **truy vấn** tổng click của quảng cáo đó
      thay đổi thế nào?
    answer_md: |
      (1) Đây là **khoá nóng (hot key)**: mọi click cùng một ad_id đều rơi vào cùng một partition, tạo
      **điểm nóng (hotspot)**.
      (2) Gỡ bằng **chia khoá nóng (salting / pre-aggregate)**: tách ad_id nóng thành nhiều khoá con
      (ad_id#0 .. ad_id#9) để click rải đều sang nhiều partition, đếm riêng từng phần. Chỉ **tăng số
      partition** không giúp, vì khoá phân vùng vẫn là cùng một ad_id nên vẫn ánh xạ về một partition.
      (3) Truy vấn tổng của quảng cáo đó phải **cộng lại** số đếm từ tất cả khoá con (ví dụ 10 phần)
      thay vì đọc một chỗ — đổi một chút phức tạp truy vấn lấy việc chia đều được tải.
    rubric_md: "Đạt khi nêu đúng cả 3 ý: gọi tên hot key/hotspot; salting chia khoá con để rải tải và giải thích vì sao thêm partition không đủ (khoá không đổi vẫn về một chỗ); truy vấn phải cộng gộp các khoá con. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu lý do 'thêm partition không đủ' hoặc không nói truy vấn phải gộp: tối đa điểm 1."
  - id: S249
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Thiết kế hệ **đếm click và top-K quảng cáo real-time** ở mức phỏng vấn. Trình bày: (1) **pipeline
      hai nhánh** (luồng + lô), nêu rõ mỗi nhánh gồm gì và cho ra con số gì; (2) cách xử lý **khoá nóng
      (hot key)**; (3) cách **loại click trùng (dedup)**; (4) **vì sao con số cuối ngày** (nhánh lô) mới
      được dùng để **tính tiền**, chứ không phải số live của luồng.
    answer_md: |
      (1) **Hai nhánh (kiến trúc lambda), cùng nguồn sự kiện Kafka:**
      - **Nhánh luồng:** click ghi vào Kafka (server trả 302 ngay, ghi sự kiện bất đồng bộ) → **bộ xử
        lý luồng** gộp theo **cửa sổ 1 phút theo event time** (watermark cho sự kiện đến muộn) → **upsert
        theo (ad_id, phút) vào kho OLAP** cho dashboard dưới một giây. Top-K khi quá nhiều khoá: **Count-Min
        Sketch + heap (heavy hitters)**, cửa sổ trượt 1 giờ bằng 60 bảng theo phút cộng lại. Con số: **nhanh,
        xấp xỉ**.
      - **Nhánh lô:** giữ log click thô trong **object store**; cuối ngày job **Spark** đọc lại và **đếm
        lại từ đầu + dedup triệt để** → con số **đúng, có thẩm quyền**; **đối soát** với số luồng, lệch quá
        ngưỡng thì cảnh báo.
      (2) **Khoá nóng:** quảng cáo viral dồn vào một partition → **salting/pre-aggregate** tách ad_id nóng
      thành khoá con (ad_id#0..9) để rải tải, đếm riêng rồi **cộng lại khi truy vấn**.
      (3) **Dedup:** mỗi lượt hiển thị có **impression id ký HMAC**; server kiểm chữ ký (chặn click giả)
      rồi ghi vào **seen-set (Redis SET NX + TTL)** — mã đã thấy thì click lặp không được tính; nhánh lô
      cũng dedup theo cùng impression id.
      (4) **Vì sao số lô dùng để tính tiền:** nhánh luồng đánh đổi độ chính xác lấy độ trễ thấp — nó có
      thể **bỏ sự kiện đến muộn sau watermark** và **đếm trùng** (at-least-once khi job restart), nên chỉ
      hợp cho dashboard. Nhánh lô đọc trọn vẹn log thô đã nằm yên và dedup triệt để nên là **nguồn sự
      thật**, dùng để lập hoá đơn.
    rubric_md: "Đạt (mức phỏng vấn, theo mastery bar) khi: (1) vẽ đúng pipeline hai nhánh luồng + lô và nói rõ luồng = xấp xỉ/lô = đúng; (2) xử lý hot key bằng salting; (3) dedup bằng impression id + seen-set; (4) giải thích đúng vì sao số cuối ngày của lô mới tính tiền (luồng bỏ sự kiện muộn và có thể đếm trùng). Đúng, trong time-box, tự giải thích rõ ràng: bằng chứng điểm 3. Thiếu bất kỳ một trong bốn trụ (hai nhánh / hot key / dedup / lý do billing): chưa đạt mức 3."
