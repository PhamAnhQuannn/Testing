subtopic_id: cs.databases.normalization
items:
  - id: X798
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
    code: |-
      rows = [("1", "A"), ("2", "B"), ("1", "A"), ("3", "B")]
      fd = {}
      ok = True
      for z, c in rows:
          if z in fd and fd[z] != c:
              ok = False
          fd[z] = c
      print(fd)
      print(ok)
      print(len(rows), len(fd))
      rev = {}
      for z, c in rows:
          rev.setdefault(c, set()).add(z)
      print(sorted(c for c, s in rev.items() if len(s) > 1))
    expected_output: "{'1': 'A', '2': 'B', '3': 'B'}\nTrue\n4 3\n['B']"
    answer_md: "dict `fd` mô hình FD z -> c: mỗi z chỉ ứng với một c, nên không có xung đột và `ok` giữ True. Có 4 dòng nhưng 3 khóa z khác nhau (dòng lặp ('1','A') không mâu thuẫn). Chiều ngược c -> z thì không phải FD: c = 'B' ứng với z = '2' và '3', nên in ['B']."
    rubric_md: "Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X799
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `fd_violations(rows, det, dep)`. `rows` là list các dict (giá trị là số nguyên hoặc chuỗi), `det` và `dep` là tên hai cột. Phụ thuộc hàm `det -> dep` bị vi phạm tại một giá trị của `det` nếu giá trị đó xuất hiện cùng hai hay nhiều giá trị `dep` KHÁC NHAU. Trả về list đã sắp xếp các giá trị `det` vi phạm (rỗng nếu FD đúng hoặc `rows` rỗng). Ví dụ `rows = [{"zip":"1","city":"A"},{"zip":"1","city":"B"},{"zip":"2","city":"C"}]`, `det = "zip"`, `dep = "city"` cho `["1"]`.
    problem_id: check-x799-fd-violations
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X800
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao bảng gộp bị update anomaly còn bảng đã tách (3NF) thì không, nhắc tới phụ thuộc bắc cầu.
    code: |-
      emp = [
          {"id": 1, "dept": "D1", "dept_name": "Sales"},
          {"id": 2, "dept": "D1", "dept_name": "Sales"},
          {"id": 3, "dept": "D2", "dept_name": "Ops"},
      ]
      emp[0]["dept_name"] = "Retail"
      names = {}
      for r in emp:
          names.setdefault(r["dept"], set()).add(r["dept_name"])
      print(sorted(names["D1"]))
      print({d: len(s) for d, s in names.items()})
      dept = {r["dept"]: r["dept_name"] for r in emp}
      print(dept)
      dept["D1"] = "Retail"
      print([dept[r["dept"]] for r in emp])
    expected_output: "['Retail', 'Sales']\n{'D1': 2, 'D2': 1}\n{'D1': 'Sales', 'D2': 'Ops'}\n['Retail', 'Retail', 'Ops']"
    answer_md: "Bảng gộp lưu dept_name ở mỗi dòng nhân viên. Sửa chỉ dòng id=1 khiến D1 có hai tên (Retail và Sales): đó là update anomaly, FD dept -> dept_name bị vi phạm. Nguyên nhân là phụ thuộc bắc cầu id -> dept -> dept_name. Khi dựng dict `dept` từ bảng mâu thuẫn, giá trị đến sau thắng nên ra 'Sales' (dữ liệu đã hỏng, không biết cái nào đúng). Sau khi tách (dept là bảng riêng, 3NF), một lần gán `dept['D1'] = 'Retail'` đổi đúng cho mọi nhân viên của D1."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng: dept_name lặp ở nhiều dòng nên sửa một dòng gây mâu thuẫn (update anomaly) do phụ thuộc bắc cầu id -> dept -> dept_name; tách bảng dept (3NF) để sửa một chỗ là đủ. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
