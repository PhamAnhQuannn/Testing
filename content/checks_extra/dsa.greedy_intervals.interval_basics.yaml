subtopic_id: dsa.greedy_intervals.interval_basics
items:
  - id: X501
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      iv = [[1, 3], [2, 4], [6, 8]]
      iv.sort()
      out = [iv[0][:]]
      for s, e in iv[1:]:
          if s <= out[-1][1]:
              out[-1][1] = max(out[-1][1], e)
          else:
              out.append([s, e])
      print(out)
      print(len(iv) - len(out))
    expected_output: "[[1, 4], [6, 8]]\n1"
    answer_md: '`[1, 3]` và `[2, 4]` chồng lấn (2 <= 3) nên gộp thành `[1, 4]`; `[6, 8]` đứng riêng. Kết quả `[[1, 4], [6, 8]]` có 2 khoảng, ban đầu 3 khoảng nên in ra `3 - 2 = 1`.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
