subtopic_id: dsa.linked_list.ll_basics
items:
  - id: X342
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: "Viết `reverse_in_groups(vals, k)`: dựng linked list từ list phẳng, đảo từng nhóm `k` node, nhóm cuối thiếu `k` thì giữ nguyên, trả về list phẳng (ví dụ `[1,2,3,4,5], k=2` -> `[2,1,4,3,5]`)."
    problem_id: check-reverse-in-groups
    rubric_md: "Thao tác con trỏ đúng (không chỉ slice list), nối nhóm đúng, giữ nhóm cuối thiếu, pass test ẩn: điểm 3; đúng kết quả nhưng chỉ dùng slicing list: tối đa 2."
