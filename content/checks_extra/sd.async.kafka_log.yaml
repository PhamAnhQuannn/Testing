subtopic_id: sd.async.kafka_log
items:
  - id: S112
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Nói ngắn gọn: trong Kafka, **thứ tự** các sự kiện được đảm bảo ở phạm vi nào, và dùng cái gì để
      cho các sự kiện liên quan (ví dụ của cùng một user) được giữ đúng thứ tự?
    answer_md: |
      Kafka chỉ đảm bảo thứ tự **trong phạm vi một partition**, không phải trên toàn topic. Để các sự
      kiện liên quan giữ đúng thứ tự, dùng **partition key** (khóa partition): Kafka băm key để chọn
      partition, nên mọi tin có **cùng key** (ví dụ cùng `user_id`) luôn vào **cùng một partition** và
      được giữ đúng trình tự. Thứ tự giữa các key khác nhau thì không được đảm bảo.
    rubric_md: "Đạt khi nêu đúng cả hai ý: thứ tự chỉ trong một partition, và dùng partition key để tin cùng khóa vào cùng partition. Đúng cả hai ý: bằng chứng điểm 1. Thiếu ý partition key hoặc nói nhầm là thứ tự toàn topic: tối đa điểm 0."
  - id: S113
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một topic `orders` cần chịu **3.000 sự kiện/giây**, mỗi consumer xử lý được khoảng **500 sự
      kiện/giây**, và mọi sự kiện của cùng một đơn hàng phải xử lý **đúng thứ tự**. Hãy trả lời:
      (1) cần **tối thiểu bao nhiêu partition** và vì sao; (2) chọn **partition key** là gì để giữ
      thứ tự; (3) nếu sau này lưu lượng tăng và một **consumer group chỉ có 4 consumer** trên topic 6
      partition, điều gì giới hạn khả năng xử lý và cách gỡ.
    answer_md: |
      (1) Mỗi consumer kham 500/giây mà cần 3.000/giây nên cần tối thiểu 3000 / 500 = **6 consumer làm
      việc cùng lúc**; vì trong một group mỗi partition chỉ gán cho một consumer, nên cần **tối thiểu
      6 partition** (thường chọn dư hơn để có biên tăng trưởng, và vì giảm partition về sau rất khó).
      (2) Chọn **partition key = `order_id`** (khóa theo đơn hàng): mọi sự kiện của một đơn vào cùng
      một partition nên giữ đúng thứ tự cho đơn đó; thứ tự giữa các đơn khác nhau không cần đảm bảo.
      (3) Với 6 partition mà group chỉ có 4 consumer thì chỉ 4 partition đang được đọc tích cực — khả
      năng xử lý bị giới hạn bởi **số consumer** chứ chưa chạm trần partition; thêm consumer (tới tối
      đa 6, bằng số partition) để dùng hết song song. Nếu đã đủ 6 consumer mà vẫn không kịp (lag tăng)
      thì phải tăng số partition hoặc làm mỗi tin xử lý nhanh hơn.
    rubric_md: "Đạt khi nêu đúng cả 3 ý: (1) tối thiểu 6 partition suy ra từ 3000/500 và quy tắc một partition một consumer; (2) partition key theo order_id để giữ thứ tự per-order; (3) chỉ ra song song đang bị giới hạn bởi số consumer (4 < 6) và gỡ bằng thêm consumer tới bằng số partition rồi mới tăng partition / tăng tốc xử lý. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu lập luận '6 partition' hoặc không nhận ra trần consumer = partition: tối đa điểm 1."
  - id: S114
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Bạn thiết kế đường ống sự kiện trên Kafka cho một hệ đặt vé. Hãy trình bày ở mức phỏng vấn ba
      phần gắn liền nhau: (1) **giữ thứ tự** — Kafka đảm bảo thứ tự ở đâu, dùng partition key thế nào
      cho các sự kiện của cùng một vé, và vì sao không cần (và không nên cố) ép thứ tự toàn topic;
      (2) **chọn số partition** — chọn dựa trên gì, vì sao "quá nhiều" cũng xấu, và vì sao phải chọn
      cẩn thận ngay từ đầu; (3) **xử lý consumer lag** — lag là gì, vì sao lag tăng là nguy hiểm, và
      các bước giảm lag theo đúng thứ tự ưu tiên.
    answer_md: |
      (1) **Thứ tự:** Kafka chỉ đảm bảo thứ tự **trong một partition**. Chọn **partition key** theo
      thực thể cần đúng trình tự — ở đây là `booking_id` (hoặc `seat_id`): mọi sự kiện của một vé
      (giữ chỗ → thanh toán → xác nhận) vào cùng một partition nên được xử lý đúng thứ tự. Không cần
      ép thứ tự toàn topic vì các vé khác nhau độc lập; ép thứ tự toàn cục buộc dồn về 1 partition,
      giết song song mà không mang lại giá trị.
      (2) **Số partition:** ước lượng từ **thông lượng mục tiêu chia cho sức một consumer** (ví dụ cần
      6.000/giây, mỗi consumer 1.000/giây → ≥ 6 partition), cộng biên cho tăng trưởng vì số partition
      cũng đặt **trần số consumer** của một group. "Quá nhiều" partition cũng xấu: mỗi partition tốn
      file/bộ nhớ/kết nối và kéo dài thời gian bầu lại leader khi sự cố, làm cluster chậm và lâu phục
      hồi. Phải chọn cẩn thận ngay vì **tăng partition thì dễ nhưng giảm gần như không an toàn**, và
      tăng partition còn đổi kết quả băm key nên có thể phá thứ tự theo key đang có.
      (3) **Consumer lag:** lag = offset cuối log − offset consumer đã đọc, tức consumer tụt sau đuôi
      log bao nhiêu tin. Lag tăng đều là nguy hiểm vì dữ liệu ngày càng cũ và nếu vượt quá retention
      thì tin chưa đọc bị xóa — mất dữ liệu. Giảm lag theo thứ tự: trước hết **thêm consumer** vào
      group nhưng chỉ hữu ích **tới bằng số partition**; chạm trần đó mà vẫn lag thì **tăng số
      partition** (cho phép thêm consumer) và/hoặc **tăng tốc xử lý mỗi tin** (batching, bỏ lệnh gọi
      chậm trong vòng xử lý, đẩy việc nặng ra ngoài).
    rubric_md: "Đạt mức 3 (phỏng vấn) khi trả lời trọn cả ba phần đúng và nối được chúng: (1) thứ tự chỉ trong partition + partition key theo booking_id + lý do không ép thứ tự toàn topic; (2) chọn số partition từ thông lượng/sức consumer, nêu được cả hai phía 'quá ít' và 'quá nhiều' và quy tắc tăng-dễ-giảm-khó; (3) định nghĩa đúng lag, vì sao lag tăng nguy hiểm (có thể vượt retention), và các bước giảm lag đúng thứ tự (thêm consumer tới bằng số partition → tăng partition / xử lý nhanh hơn). Đúng, trong time-box, tự giải thích mạch lạc: bằng chứng điểm 3. Sót một trong ba phần, hoặc không nêu được trần 'consumer ≤ partition' khi gỡ lag: chưa đạt mức 3."
