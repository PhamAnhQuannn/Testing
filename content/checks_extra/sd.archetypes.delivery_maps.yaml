subtopic_id: sd.archetypes.delivery_maps
items:
  - id: S271
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Kể **đúng thứ tự** năm trạng thái chính trong vòng đời một đơn giao hàng (order lifecycle), từ
      lúc khách đặt đến lúc giao xong.
    answer_md: |
      **placed** (khách đặt) → **assigned** (đã gán shipper) → **picked_up** (shipper đã lấy hàng ở
      quán) → **en_route** (đang giao) → **delivered** (đã giao xong). Mỗi lần chuyển giữa các trạng
      thái là một sự kiện được ghi lại.
    rubric_md: "Đạt khi nêu đủ 5 trạng thái đúng thứ tự (đặt → gán shipper → lấy hàng → đang giao → đã giao); tên tiếng Việt hay tiếng Anh đều được. Đúng và đủ thứ tự: bằng chứng điểm 1. Sai thứ tự hoặc thiếu một trạng thái cốt lõi: tối đa điểm 0."
  - id: S272
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một app giao đồ ăn đang dùng gán **gần nhất, mỗi chuyến một đơn** (nearest-available). Vào giờ
      cao điểm, số shipper không đủ và chi phí mỗi đơn tăng vọt. Đội sản phẩm muốn chuyển sang **gom
      đơn** (batching). Hãy trả lời: (1) gom đơn cải thiện điều gì so với gán gần nhất; (2) nó đánh đổi
      cái gì (khách và hệ thống chịu thiệt gì); (3) vì sao việc gán shipper giao đồ ăn còn phải tính
      **thời gian quán chuẩn bị** (prep time)?
    answer_md: |
      (1) **Gom đơn** cho một shipper chở **2-3 đơn cùng tuyến** nên **chia sẻ quãng đường**, cần **ít
      shipper hơn** cho cùng lượng đơn và **giảm chi phí** mỗi đơn — đúng thứ đang thiếu lúc cao điểm.
      (2) Đánh đổi: **một số khách bị giao chậm hơn** (đơn giao sau trong chuyến), và bài toán gán trở
      nên phức tạp hơn — phải **chọn tổ hợp đơn + thứ tự điểm dừng** tốt thay vì chỉ chọn người gần
      nhất. Đây là đánh đổi **tốc độ ↔ hiệu quả/chi phí**.
      (3) Phải tính **prep time** vì món cần thời gian nấu: gửi shipper tới **quá sớm** thì shipper phải
      **đợi** (lãng phí), tới **quá trễ** thì **món nguội**; nên thường gán song song lúc quán đang nấu
      để shipper tới **vừa lúc món xong**.
    rubric_md: "Đạt khi nêu đúng cả 3 ý: (1) gom đơn tiết kiệm shipper/chi phí nhờ chia sẻ quãng đường; (2) đánh đổi là một số khách chậm hơn + bài toán chọn tổ hợp phức tạp hơn; (3) prep time để shipper tới khớp lúc món xong (sớm thì đợi, trễ thì nguội). Đúng, trong time-box, tự giải thích được đánh đổi tốc độ ↔ chi phí: bằng chứng điểm 2. Chỉ nói gom đơn 'rẻ hơn' mà không nêu được cái đánh đổi, hoặc bỏ ý prep time: tối đa điểm 1."
  - id: S273
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Phỏng vấn: "Design một hệ giao đồ ăn (food delivery) có theo dõi đơn trực tiếp." Trình bày thiết
      kế ở mức cao, bám ba trụ: (1) **mô tả luồng một đơn** từ đặt đến giao (vòng đời/state machine, mỗi
      chuyển được xử lý ra sao); (2) **so sánh gán shipper gần nhất với gom đơn** (nearest-available vs
      batching) và nêu khi nào chọn cái nào; (3) **cách đẩy vị trí shipper trực tiếp** xuống app khách.
      Chỉ rõ bạn tái dùng kiến thức ride_hailing / geo-index / realtime ở đâu.
    answer_md: |
      **(1) Luồng một đơn (state machine).** placed → assigned → picked_up → en_route → delivered. Mỗi
      **chuyển trạng thái** là một **sự kiện ghi bền** (ghi database trước khi báo thành công), **idempotent**,
      và hệ chỉ cho phép **chuyển hợp lệ** (không 'delivered' trước 'picked_up'). Nhờ vậy có thể **thử
      lại/huỷ an toàn** khi một bước treo (quán không nhận thì huỷ hoặc gán lại), và mỗi sự kiện dùng cho
      cả **thông báo khách** lẫn **đối soát**. Việc gán shipper có thể chạy **song song** lúc quán đang nấu.

      **(2) Gán shipper: nearest vs batching.** *Nearest-available* (mỗi chuyến một đơn): chọn shipper
      **rảnh + gần quán nhất** (tái dùng **chỉ mục địa lý** để tìm trong bán kính) → **nhanh cho từng
      khách** nhưng **tốn shipper/chi phí**. *Batching*: một shipper **2-3 đơn cùng tuyến** → **rẻ/hiệu
      quả hơn** nhưng **một số khách chậm hơn** và phải **chọn tổ hợp + thứ tự điểm dừng** (phức tạp hơn).
      Chọn theo bối cảnh: lúc **thường/ưu tiên tốc độ** dùng nearest; lúc **cao điểm/thiếu shipper, ưu tiên
      chi phí** dùng batching. Khác gọi xe: phải tính **prep time** để shipper tới khớp lúc món xong.

      **(3) Đẩy vị trí trực tiếp.** Tái dùng **ride_hailing + realtime**: shipper gửi GPS vài giây/lần
      (**high-write**), server giữ **vị trí mới nhất in-memory** (Redis) thay vì ghi hết vào DB bền, rồi
      **push** xuống app của **đúng khách** qua **WebSocket/SSE** đang mở (không polling). Mấu chốt kiến
      trúc: **tách state sống** (vị trí, đổi liên tục, in-memory, được đẩy) khỏi **state bền** (trạng thái
      đơn, ít chuyển, ghi database). ETA cộng prep + shipper-tới-quán + giao, cập nhật động theo trạng thái.
    rubric_md: "Đạt (mức phỏng vấn, đúng mastery_bar L3) khi trình bày đủ ba trụ: (1) luồng đơn placed→delivered như state machine với chuyển bền/idempotent/hợp lệ và xử lý sự cố; (2) so sánh nearest vs batching đúng đánh đổi tốc độ ↔ chi phí + biết khi nào chọn cái nào + nhắc prep time; (3) đẩy vị trí = in-memory (Redis) + push qua WebSocket/SSE, tách state sống khỏi state bền, và nói rõ tái dùng geo-index/ride_hailing/realtime. Đủ ba trụ, đúng, trong time-box, tự giải thích rõ: bằng chứng điểm 3. Thiếu một trụ (ví dụ không tách được state sống/bền, hoặc không nêu đánh đổi batching): chưa đạt mức 3."
