subtopic_id: py.datastructs.collections_module
items:
- id: X320
  difficulty: 3
  type: write_code
  minutes: 12
  prompt_md: 'Viết `top_k_frequent(words, k)`: trả về `k` từ xuất hiện nhiều nhất trong list `words`,
    sắp theo số lần giảm dần; đồng hạng thì theo thứ tự chữ cái tăng dần; nếu ít hơn `k` từ phân biệt
    thì trả hết. Gợi ý: `collections.Counter` kết hợp `sorted` với khoá `(-đếm, từ)`.

    '
  problem_id: check-top-k-frequent
  rubric_md: 'Pass toàn bộ test ẩn (đồng hạng, k=0, k lớn hơn số từ phân biệt). Đúng, trong time-box,
    tự giải thích rõ: bằng chứng điểm 3; sai đồng hạng hoặc biên: chưa đạt mức 3.'
