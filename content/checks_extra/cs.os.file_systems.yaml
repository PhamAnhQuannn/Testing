subtopic_id: cs.os.file_systems
items:
  - id: X867
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
    code: |-
      block = 4
      sizes = [1, 4, 5, 9]
      total = 0
      for s in sizes:
          n = -(-s // block)
          total += n
          print(n, n * block - s)
      print(total)
    expected_output: "1 3\n1 0\n2 3\n3 3\n7"
    answer_md: "Size 1 cần 1 khối, thừa 3. Size 4 cần 1 khối, thừa 0. Size 5 cần 2 khối (8), thừa 3. Size 9 cần 3 khối (12), thừa 3. Tổng số khối là 1 + 1 + 2 + 3 = 7."
    rubric_md: "Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X868
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `live_inodes(ops)` mô phỏng inode và hard link bằng đếm tham chiếu. `ops` là list các thao tác, mỗi thao tác là một list: `["create", name]` tạo inode mới với tên `name`, link count = 1; `["link", new_name, existing_name]` thêm hard link: `new_name` trỏ cùng inode với `existing_name`, link count của inode tăng 1 (nếu `existing_name` không tồn tại thì bỏ qua thao tác); `["unlink", name]` xóa tên `name`, link count của inode giảm 1 và inode bị giải phóng khi count về 0 (nếu `name` không tồn tại thì bỏ qua). Trả về **số inode còn sống** (link count > 0) sau tất cả thao tác; `ops` rỗng trả `0`. Ví dụ `live_inodes([["create","a"],["link","b","a"],["unlink","a"]])` trả `1` (file vẫn truy cập được qua hard link b), còn `live_inodes([["create","a"],["unlink","a"]])` trả `0`.
    problem_id: check-x868-live-inodes
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X869
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao đọc qua hard link vẫn được còn soft link thì không sau khi xóa a (khái niệm gì).
    code: |-
      files = {}
      links = {}
      data = {}
      symlinks = {}


      def create(name, text):
          ino = len(data)
          files[name] = ino
          links[ino] = 1
          data[ino] = text


      def hard(new, old):
          ino = files[old]
          files[new] = ino
          links[ino] += 1


      def soft(new, target):
          symlinks[new] = target


      def remove(name):
          ino = files.pop(name)
          links[ino] -= 1
          if links[ino] == 0:
              del data[ino]


      def read(name):
          if name in symlinks:
              name = symlinks[name]
          if name in files:
              return data[files[name]]
          return "DANGLING"


      create("a", "hello")
      hard("b", "a")
      soft("s", "a")
      print(read("b"), read("s"))
      remove("a")
      print(read("b"), read("s"))
      remove("b")
      print(len(data), links)
    expected_output: "hello hello\nhello DANGLING\n0 {0: 0}"
    answer_md: "Sau create, hard, soft: a và b cùng inode 0 (links = 2), s là chuỗi trỏ tới tên a. Dòng 1: cả hai đọc ra hello. remove(a) giảm links còn 1, inode 0 vẫn sống nên đọc b ra hello; nhưng s chỉ lưu đường dẫn a, tên a không còn trong directory nên trả DANGLING. remove(b) đưa links về 0, data[0] bị xóa: len(data) = 0 và links = {0: 0}. Hard link là tên ngang hàng cùng inode (đếm tham chiếu), soft link chỉ là đường dẫn nên có thể dangling."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng: hard link tăng link count của inode nên dữ liệu sống đến khi count = 0; soft link chỉ chứa đường dẫn nên thành dangling link khi đích bị xóa. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
