items:
  - id: F202
    practices: [verify, review]
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Hàm `two_sum(nums, target)` (do AI viết) dùng dict để tìm hai chỉ số `i < j` có tổng bằng `target`,
      nhưng cho kết quả sai với một số đầu vào. Tìm và sửa bug để pass mọi test.
    problem_id: fix-two-sum
    rubric_md: "Sửa đúng bug, pass toàn bộ test ẩn không cần gợi ý trong time-box: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
