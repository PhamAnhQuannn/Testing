subtopic_id: sd.framework.hld_diagram
items:
  - id: S037
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Kể **đúng thứ tự** các hộp chuẩn mà một request đi qua trong sơ đồ high-level design (HLD), từ
      người dùng vào tới kho dữ liệu, và nói một câu **CDN** và **blob store** dùng để làm gì.
    answer_md: |
      Thứ tự các hộp (từ ngoài vào trong): **client → DNS/CDN → load balancer → tầng service (stateless)
      → cache → database/read replica → queue + worker nền → blob store**.
      - **CDN**: các kho bản sao đặt gần người dùng, phục vụ nội dung tĩnh (ảnh, JS, CSS) ngay tại biên
        để giảm độ trễ và tải cho hệ thống gốc.
      - **Blob store (object store)**: kho cất file lớn (ảnh, video); database chỉ lưu **đường dẫn**,
        không giữ chính file.
    rubric_md: "Đạt khi: nêu đúng thứ tự xương sống client → load balancer → service → cache → database (các hộp chính, đúng chiều từ ngoài vào trong) và nói đúng vai trò của CDN (bản sao gần người dùng cho nội dung tĩnh) và blob store (kho file lớn). Đúng ý: bằng chứng điểm 1; đảo lộn thứ tự hoặc sai vai trò CDN/blob store: tối đa điểm 0."
  - id: S038
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một dịch vụ cho người dùng **đăng bài kèm ảnh** và **xem bài của người khác**. Hãy mô tả HLD đủ
      dùng bằng cách trả lời ba ý: (1) kể **đường ghi (write path)** khi đăng một bài kèm ảnh — request
      đi qua những hộp nào, ảnh được cất ở đâu; (2) kể **đường đọc (read path)** khi xem bài, nêu rõ
      chuyện gì xảy ra khi **cache hit** và khi **cache miss**; (3) chỉ ra một hộp bạn sẽ **không vẽ**
      nếu đề nhỏ và giải thích vì sao.
    answer_md: |
      (1) **Đường ghi**: `client → load balancer → service → database (primary)`. Service nhận request
      ở một máy bất kỳ sau LB, ghi nội dung bài vào **primary**; **ảnh** (file lớn) được đưa vào **blob
      store**, database chỉ lưu **đường dẫn** tới ảnh. Việc chậm (ví dụ resize ảnh, báo cho người theo
      dõi) có thể đẩy qua **queue** cho worker nền xử lý async để trả lời người dùng ngay.
      (2) **Đường đọc**: `client → load balancer → service → cache → (nếu trượt) database (read
      replica)`. **Cache hit**: trả ngay, không chạm database. **Cache miss**: service đọc từ **read
      replica**, rồi **ghi kết quả vào cache** cho lần sau, rồi trả về.
      (3) Nếu đề nhỏ (ít người đọc, không cần phản hồi tức thì): có thể **bỏ cache** (hoặc bỏ queue) —
      vì chưa có nghẽn đọc thì cache chỉ là phức tạp thừa; chỉ thêm khi một yêu cầu cụ thể đòi hỏi. Bản
      tối giản `client → service → database (+ blob store cho ảnh)` là đủ.
    rubric_md: "Đạt khi nêu đúng cả 3 ý: (1) write path qua LB → service → primary và ảnh vào blob store (DB chỉ giữ đường dẫn); (2) read path hỏi cache trước — hit trả ngay, miss thì đọc replica rồi nạp lại cache; (3) chỉ ra một hộp có thể bỏ khi đề nhỏ (cache hoặc queue) kèm lý do 'chưa có yêu cầu đòi hỏi'. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu phân biệt cache hit/miss, hoặc không biện minh được việc bỏ hộp: tối đa điểm 1."
  - id: S039
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Thiết kế HLD cho một **dịch vụ rút gọn link (URL shortener)** ở mức phỏng vấn. Hãy làm **cả ba**
      việc: (1) **vẽ/mô tả sơ đồ sạch** gồm các hộp chuẩn đúng thứ tự; (2) **kể đường ghi** (tạo link
      ngắn) và **đường đọc** (bấm link ngắn để chuyển hướng về link gốc), nêu rõ cache hit/miss; (3)
      **biện minh từng hộp** — mỗi hộp giải quyết yêu cầu nào, và nói hộp nào có thể bỏ nếu tải thấp.
    answer_md: |
      (1) **Sơ đồ**: `client → DNS/CDN → load balancer → service (stateless) → cache → database (+ read
      replica)`. (Blob store/queue thường **không cần** cho URL shortener thuần — nêu được điều này là
      tốt.)
      (2) **Đường ghi (tạo link)**: `client → LB → service → database (primary)`. Service sinh mã ngắn,
      lưu ánh xạ `mã_ngắn → link_gốc` vào **primary**.
      **Đường đọc (chuyển hướng)**: `client → LB → service → cache → (miss) → read replica`. Service tra
      mã ngắn ở **cache** trước; **hit** thì trả link gốc và phản hồi redirect (301/302) ngay; **miss**
      thì đọc từ **replica**, **nạp lại vào cache**, rồi trả redirect.
      (3) **Biện minh**: LB để service **scale ngang** (đọc rất nhiều); **cache** vì đọc áp đảo ghi và
      ánh xạ gần như không đổi — cache hợp nhất, chặn phần lớn lượt chạm DB; **read replica** để chia
      tải đọc; **CDN** không bắt buộc (redirect động), có thể bỏ; **queue/blob store** bỏ được vì không
      có việc nền hay file lớn. Nếu tải thấp: bỏ cache + replica, chỉ `client → service → database`.
    rubric_md: |
      Chấm theo thước đo mức 3 của chủ đề (phải đủ **cả ba**):
      - **Sơ đồ sạch**: các hộp chuẩn đúng thứ tự (ít nhất client → LB → service → cache → database), không thừa hộp vô cớ.
      - **Kể cả hai đường đi**: write path về primary; read path hỏi cache trước với phân biệt **hit** (trả ngay) và **miss** (đọc replica rồi nạp lại cache).
      - **Biện minh từng hộp**: mỗi hộp gắn với một yêu cầu (LB→scale ngang, cache/replica→tải đọc, …) và chỉ ra hộp bỏ được khi tải thấp.
      Làm trọn cả ba, trong time-box, mạch lạc: bằng chứng điểm 3. Thiếu một trong ba (vẽ mà không kể được đường đi, hoặc kể mà không biện minh được từng hộp): chưa đạt mức 3.
