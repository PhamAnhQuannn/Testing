subtopic_id: sd.fundamentals.cap_consistency
items:
  - id: S007
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      CAP là viết tắt của ba chữ nào? Khi hệ phân tán **đang có partition (đứt mạng)**, định lý CAP
      nói bạn phải chọn giữa hai điều gì?
    answer_md: |
      CAP = **Consistency (nhất quán)**, **Availability (sẵn sàng)**, **Partition tolerance (chịu
      đứt mạng)**. Khi **đang có partition**, hệ buộc phải chọn **một trong hai**: giữ **C** (từ
      chối/trì hoãn trả lời để không trả dữ liệu cũ/sai) **hoặc** giữ **A** (vẫn trả lời bằng dữ
      liệu có thể đã cũ để luôn sống). Vì partition là lỗi mạng không tránh được nên P là bắt buộc;
      lựa chọn thật chỉ là **C hay A trong lúc đứt mạng**.
    rubric_md: "Đạt khi: gọi đúng ba chữ (Consistency, Availability, Partition tolerance) **và** nói rõ lúc đứt mạng phải chọn C hoặc A. Đúng cả hai: điểm 1. Chỉ liệt kê ba chữ mà không nêu được 'đứt mạng → chọn C hoặc A', hoặc nói sai thành 'chọn 2 trong 3 mọi lúc': tối đa điểm 0."
  - id: S008
    difficulty: 2
    type: concept
    minutes: 7
    prompt_md: |
      Với **mỗi** loại dữ liệu sau, chọn **nhất quán mạnh (strong)** hay **nhất quán cuối cùng
      (eventual)** và giải thích ngắn **vì sao**: (a) **số dư tài khoản ngân hàng**; (b) **số lượt
      thích (like)** của một bài đăng.
    answer_md: |
      (a) **Số dư tài khoản → nhất quán mạnh (strong).** Nếu đọc nhằm một bản sao cũ, người dùng có
      thể rút nhiều hơn số tiền thật hoặc không thấy tiền vừa gửi — sai là mất tiền. Thà **từ chối
      hoặc trả lời chậm** còn hơn trả về số dư sai.
      (b) **Số like → nhất quán cuối cùng (eventual).** Con số trễ vài giây không gây hại; đổi lại
      hệ **luôn sống và nhanh**, và các bản sao sẽ hội tụ về cùng giá trị sau một lúc. Bắt like phải
      strong là trả giá vô ích về độ trễ và tính sẵn sàng.
    rubric_md: "Đạt khi: chọn đúng **strong cho số dư** và **eventual cho like**, kèm lý do đúng (số dư sai = mất tiền nên cần đọc bản mới nhất; like trễ vô hại nên ưu tiên sống/nhanh). Đúng cả hai lựa chọn + lý do, trong time-box: bằng chứng điểm 2. Chọn đúng nhưng không giải thích được vì sao, hoặc đảo một vế: tối đa điểm 1."
  - id: S009
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Ở mức phỏng vấn, hãy: (1) **phát biểu chính xác** định lý CAP (nói rõ nó nói về hành vi **khi
      nào**); (2) dùng **PACELC** để bổ sung điều CAP bỏ sót khi **không** có đứt mạng; (3) nêu **một
      ví dụ** kho dữ liệu thiên **CP** và **một** kho thiên **AP**. Tránh cách nói sai "chọn 2 trong 3".
    answer_md: |
      (1) **CAP:** partition (đứt mạng) là điều không tránh được trên hệ phân tán, nên **khi đang
      có partition** hệ **buộc phải chọn một trong hai**: **Consistency** (từ chối/trì hoãn trả lời
      để không bao giờ trả dữ liệu cũ/sai) **hoặc** **Availability** (vẫn trả lời bằng dữ liệu có
      thể cũ để luôn sống). Khi **không** có partition thì đạt được **cả C lẫn A** — nên CAP là
      chuyện *trong lúc đứt mạng*, không phải "chọn 2 trong 3" ở mọi thời điểm.
      (2) **PACELC:** nếu **P**artition → chọn **A** hay **C** (đúng như CAP); **E**lse (bình
      thường) → vẫn phải đổi giữa **L**atency và **C**onsistency. Tức kể cả khi mạng tốt, muốn nhất
      quán mạnh hơn phải **chờ nhiều bản sao xác nhận** nên **độ trễ cao hơn**; muốn nhanh thì chấp
      nhận các bản tạm lệch. Đây là phần CAP không nói tới.
      (3) **Thiên CP:** etcd (hoặc ZooKeeper) — ưu tiên đúng, dùng cho cấu hình/bầu leader. **Thiên
      AP:** Cassandra (hoặc DynamoDB) — ưu tiên luôn sống, chịu lệch tạm thời (và còn chỉnh được mức
      nhất quán theo truy vấn).
    rubric_md: "Đạt mức 3 (phỏng vấn) khi đủ cả ba: (1) phát biểu CAP đúng — **chỉ khi đang partition** mới phải chọn C hoặc A, không partition thì có cả hai, và **không** dùng 'chọn 2 trong 3'; (2) PACELC nêu đúng nhánh else = **Latency vs Consistency**; (3) cho đúng một kho CP (etcd/ZooKeeper) và một kho AP (Cassandra/DynamoDB). Đúng, trong time-box, tự giải thích rõ: bằng chứng điểm 3. Thiếu nhánh else của PACELC, hoặc phát biểu CAP sai kiểu 'chọn 2 trong 3', hoặc không cho được ví dụ CP/AP: chưa đạt mức 3."
