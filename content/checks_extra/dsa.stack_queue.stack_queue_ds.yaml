subtopic_id: dsa.stack_queue.stack_queue_ds
items:
  - id: X344
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: "Viết `eval_rpn(tokens)` tính biểu thức hậu tố bằng stack (ví dụ `['2','1','+','3','*']` -> 9). Chia nguyên cắt về 0 (`7 / -2 = -3`). Chú ý thứ tự toán hạng với `-` và `/`."
    problem_id: check-eval-rpn
    rubric_md: "Dùng stack, đúng thứ tự a-b / a/b, chia cắt về 0 với số âm, pass test ẩn: điểm 3; sai chia số âm (dùng //) hoặc đảo thứ tự: tối đa 2."
