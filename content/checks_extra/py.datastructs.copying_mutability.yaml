subtopic_id: py.datastructs.copying_mutability
items:
  - id: X007
    difficulty: 2
    type: write_code
    minutes: 5
    prompt_md: |
      Viết `plus_one_copy(grid)`: `grid` là list các hàng (mỗi hàng là list số nguyên). Tạo lưới
      **mới** có mọi số tăng 1 mà **không làm đổi** `grid`, rồi trả về list hai phần tử
      `[lưới_mới, grid]`. Gợi ý: `grid[:]` chỉ là bản sao nông; các hàng bên trong vẫn dùng chung.
    problem_id: check-x007
    rubric_md: "Pass toàn bộ test ẩn. Đúng: bằng chứng điểm 2; sai: tối đa điểm 1."
