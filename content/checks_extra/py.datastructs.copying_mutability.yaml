subtopic_id: py.datastructs.copying_mutability
items:
- id: X007
  difficulty: 2
  type: write_code
  minutes: 5
  prompt_md: 'Viết `plus_one_copy(grid)`: `grid` là list các hàng (mỗi hàng là list số nguyên). Tạo lưới

    **mới** có mọi số tăng 1 mà **không làm đổi** `grid`, rồi trả về list hai phần tử

    `[lưới_mới, grid]`. Gợi ý: `grid[:]` chỉ là bản sao nông; các hàng bên trong vẫn dùng chung.

    '
  problem_id: check-x007
  rubric_md: 'Pass toàn bộ test ẩn. Đúng: bằng chứng điểm 2; sai: tối đa điểm 1.'
- id: X322
  difficulty: 3
  type: write_code
  minutes: 12
  prompt_md: 'Viết `deep_update(grid, cells)`: `grid` là list các hàng số nguyên, `cells` là list `[r,
    c, v]`. Tạo lưới mới có `new[r][c] = v` áp dụng lần lượt (bộ sau ghi đè), **không làm đổi** `grid`
    và không dùng chung hàng nào. Trả về `[lưới_mới, grid]`. Gợi ý: `grid[:]` chỉ là bản sao nông.

    '
  problem_id: check-deep-update
  rubric_md: 'Pass toàn bộ test ẩn (lưới gốc không bị đổi, ghi đè nhiều lần cùng ô, cells rỗng). Đúng,
    trong time-box, tự giải thích rõ vì sao bản sao nông gây lỗi: bằng chứng điểm 3; sửa lưới gốc/aliasing:
    chưa đạt mức 3.'
