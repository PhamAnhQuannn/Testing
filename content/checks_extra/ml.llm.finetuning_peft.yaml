subtopic_id: ml.llm.finetuning_peft
items:
  - id: S280
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Nói ngắn gọn: **supervised fine-tuning (SFT)** là gì, và **LoRA** khác **full fine-tune** ở
      điểm cốt lõi nào?
    answer_md: |
      **SFT**: dạy thêm cho một model có sẵn bằng nhiều cặp **(đầu vào → đầu ra mong muốn)** để nó học
      **hành vi / giọng điệu / định dạng** của bạn (không phải để nhồi kiến thức mới).

      **Khác biệt cốt lõi:**
      - **Full fine-tune**: cập nhật **mọi trọng số** của model → tốn nhiều bộ nhớ (phải chứa thêm
        gradient và optimizer state), đắt, cần GPU lớn.
      - **LoRA**: **đóng băng** trọng số gốc và chỉ huấn luyện **một adapter nhỏ** (hai ma trận B, A)
        — chỉ một phần rất nhỏ tham số được train, nên rẻ và nhẹ hơn nhiều.
    rubric_md: "Đúng khi nêu được: (a) SFT = dạy thêm model có sẵn bằng cặp đầu vào→đầu ra để đổi hành vi/định dạng; (b) full fine-tune sửa mọi trọng số (đắt, tốn bộ nhớ) còn LoRA đóng băng gốc, chỉ train adapter nhỏ. Đủ hai ý: bằng chứng điểm 1. Nhầm LoRA là 'sửa toàn bộ trọng số nhanh hơn', hoặc nói SFT dùng để thêm kiến thức: tối đa điểm 0."
  - id: S281
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một đội có **một GPU tầm trung** (không có cụm GPU đắt) và muốn fine-tune một model mở **7B** để
      nó **luôn trả lời theo đúng giọng và định dạng** của bộ phận chăm sóc khách hàng. Hãy trả lời:
      (1) đây có phải bài toán hợp để fine-tune không, vì sao (so với RAG/prompt);
      (2) nên chọn **full fine-tune, LoRA, hay QLoRA** cho ràng buộc phần cứng này, và vì sao;
      (3) nêu **một** việc bạn làm để **chứng minh** model sau khi fine-tune thực sự tốt hơn.
    answer_md: |
      (1) **Hợp để fine-tune**: đây là bài toán *hành vi* (giọng điệu + định dạng nhất quán), đúng
      thế mạnh của SFT. Nếu chỉ cần đổi định dạng đơn giản thì prompt có thể đủ; còn RAG là để *thêm
      kiến thức*, không giải quyết việc "nói cho đúng giọng" nên không phải lựa chọn chính ở đây.
      (2) **QLoRA**: full fine-tune một model 7B cần bộ nhớ gấp nhiều lần (trọng số + gradient +
      optimizer state) → quá sức một GPU tầm trung. LoRA đã rẻ hơn nhiều (đóng băng gốc, chỉ train
      adapter), và **QLoRA** còn nén model gốc xuống **4-bit** (7B ~14 GB FP16 còn ~3,5 GB) nên vừa
      đúng một GPU tầm trung.
      (3) **Đánh giá trước/sau trên một tập hold-out**: giữ riêng một tập ví dụ không dùng để train,
      chấm điểm (đúng giọng/đúng định dạng) của model gốc làm baseline rồi so với model đã fine-tune;
      nên cho thêm vài việc cũ vào để phát hiện catastrophic forgetting. (Chuẩn bị dữ liệu SFT sạch,
      nhất quán, dùng loss masking cũng là ý đúng.)
    rubric_md: "Đạt (điểm 2) khi nêu đúng cả 3: (1) đúng là bài toán hành vi → hợp fine-tune, và phân biệt được với RAG (kiến thức)/prompt; (2) chọn QLoRA (hoặc LoRA) cho ràng buộc một GPU tầm trung, kèm lý do bộ nhớ — full fine-tune quá tốn; (3) nêu được cách chứng minh = eval trước/sau trên hold-out (hoặc baseline so sánh bằng con số). Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu phần chọn PEFT/QLoRA đúng lý do bộ nhớ, hoặc không nêu cách đo trước/sau: tối đa điểm 1."
  - id: S282
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      **(Phỏng vấn AI engineer)** Hãy trình bày trọn vẹn:
      (1) **giải thích LoRA và QLoRA**, kèm một **phép tính bộ nhớ** minh hoạ vì sao chúng tiết kiệm
      (dùng được ví dụ của riêng bạn);
      (2) bạn **chuẩn bị dữ liệu SFT** thế nào, và **loss masking** nghĩa là gì;
      (3) bạn **đánh giá trước và sau** khi fine-tune ra sao để chứng minh có tiến bộ mà không làm
      model quên kỹ năng cũ.
    answer_md: |
      **(1) LoRA và QLoRA + phép tính bộ nhớ:**
      - **LoRA**: đóng băng ma trận trọng số lớn W, học thêm hai ma trận mỏng B và A; model chạy với
        **W + (alpha/r)·B·A**, trong đó B·A là adapter và r (rank) là độ rộng, ví dụ 8. *Phép tính:*
        W cỡ 4096×4096 = **16.777.216** số (giữ nguyên, không train); với r = 8, B (4096×8) + A
        (8×4096) chỉ **65.536** số (~**0,4%**). Chỉ 0,4% đó được train nên gradient và optimizer
        state cũng chỉ tính trên phần tí hon này → rẻ hơn full fine-tune rất nhiều (full phải giữ
        gradient + optimizer state cho *toàn bộ* tham số).
      - **QLoRA**: **nén (quantize) model gốc đã đóng băng xuống 4-bit** rồi gắn LoRA lên trên. *Phép
        tính:* model 7B ~**14 GB** ở FP16 (16-bit) còn khoảng **3,5 GB** ở 4-bit, nên fine-tune được
        trên **một GPU tầm trung**.

      **(2) Dữ liệu SFT + loss masking:**
      - Thu thập các cặp **(prompt → câu trả lời mong muốn)**, lưu JSONL (mỗi dòng một JSON gồm prompt
        và answer). **Chất lượng hơn số lượng**: vài trăm–vài nghìn ví dụ sạch, nhất quán, đúng phong
        cách mục tiêu; loại ví dụ mâu thuẫn.
      - **Loss masking**: khi train chỉ **tính loss trên phần *câu trả lời***, che (mask) phần prompt,
        vì ta muốn model học *cách trả lời* chứ không học thuộc câu hỏi.

      **(3) Đánh giá trước/sau trên hold-out:**
      - Giữ một **tập hold-out** không dùng để train; chọn thước đo phù hợp (đúng định dạng, đúng
        giọng, accuracy tác vụ). Đo **baseline** bằng model gốc, rồi đo lại model sau fine-tune và so
        bằng **con số**.
      - Cho vào hold-out **cả vài việc cũ** để bắt **catastrophic forgetting**: nếu điểm việc cũ tụt
        mạnh thì model đã quên kỹ năng cũ → giảm cường độ train hoặc trộn thêm dữ liệu đa dạng.
    rubric_md: "Đạt mức phỏng vấn (điểm 3) khi trả lời đủ cả 3 phần theo mastery_bar: (1) giải thích LoRA (đóng băng W, train adapter B·A, rank r) VÀ QLoRA (gốc nén 4-bit + LoRA), kèm một phép tính bộ nhớ hợp lý (tỉ lệ tham số adapter rất nhỏ, hoặc 7B 14GB→~3,5GB ở 4-bit); (2) chuẩn bị dữ liệu SFT (cặp prompt→answer, chất lượng>số lượng) VÀ nêu đúng loss masking = chỉ tính loss trên phần câu trả lời; (3) đánh giá trước/sau trên hold-out bằng con số, có xét catastrophic forgetting bằng cách đưa việc cũ vào tập đo. Đúng, trong time-box, tự giải thích rõ: bằng chứng điểm 3. Thiếu phép tính bộ nhớ, hoặc thiếu loss masking, hoặc không nêu eval trước/sau trên hold-out: chưa đạt mức 3."
