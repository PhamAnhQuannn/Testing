subtopic_id: dsa.graphs.grid_graphs
items:
  - id: X449
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      grid = [[1, 1, 0],
              [0, 1, 0],
              [0, 0, 1]]
      order = []

      def dfs(r, c):
          if r < 0 or r >= 3 or c < 0 or c >= 3 or grid[r][c] != 1:
              return
          grid[r][c] = 2
          order.append((r, c))
          for dr, dc in ((0, 1), (1, 0)):
              dfs(r + dr, c + dc)

      dfs(0, 0)
      print(order)
      print(grid)
    expected_output: "[(0, 0), (0, 1), (1, 1)]\n[[2, 2, 0], [0, 2, 0], [0, 0, 1]]"
    answer_md: 'DFS bắt đầu ở `(0, 0)`, đi sang phải tới `(0, 1)` rồi xuống `(1, 1)`; ô `(2, 2)` cũng là 1 nhưng không liên thông 4 hướng với vùng này nên không được thăm và vẫn giữ giá trị 1. Mỗi ô đã thăm bị đổi thành 2 để đánh dấu visited.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
