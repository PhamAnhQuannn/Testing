subtopic_id: lld.oop_principles.pillars
items:
  - id: X564
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Giải thích 1 câu vì sao.
    code: |-
      class Account:
          def __init__(self):
              self._balance = 0

          def deposit(self, n):
              if n <= 0:
                  return False
              self._balance += n
              return True


      a = Account()
      print(a.deposit(50))
      print(a.deposit(-5))
      print(a._balance)
    expected_output: "True\nFalse\n50"
    answer_md: 'Nạp 50 hợp lệ nên trả `True` và số dư là 50; nạp -5 bị method từ chối (trả `False`, không đổi số dư). Đó là encapsulation: dữ liệu chỉ đổi qua method có kiểm tra.'
    rubric_md: "Output khớp VÀ nêu method chặn giá trị sai. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X565
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết `class BankAccount` minh hoạ encapsulation: số dư ban đầu 0 (int); `deposit(n)` cộng `n` chỉ khi `n > 0`; `withdraw(n)` trừ `n` chỉ khi `0 < n <= số dư`; hai method này không trả gì và không làm gì khi giá trị sai; `balance()` trả về số dư (int). Ví dụ `deposit(100)`, `withdraw(30)`, `balance()` là `70`.
    problem_id: check-x565-bank-account
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X566
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích method nào được gọi ở mỗi đối tượng (override và kế thừa).
    code: |-
      class Shape:
          def name(self):
              return "shape"

          def area(self):
              return 0

          def describe(self):
              return self.name() + ":" + str(self.area())


      class Rect(Shape):
          def __init__(self, w, h):
              self.w = w
              self.h = h

          def name(self):
              return "rect"

          def area(self):
              return self.w * self.h


      class Square(Rect):
          def __init__(self, s):
              super().__init__(s, s)

          def name(self):
              return "square"


      class Dot(Shape):
          pass


      for s in [Rect(2, 3), Square(4), Dot()]:
          print(s.describe())
    expected_output: "rect:6\nsquare:16\nshape:0"
    answer_md: '`describe` chỉ viết một lần ở `Shape` nhưng gọi `self.name()` và `self.area()` theo loại thật (đa hình). `Rect` ghi đè cả hai: `rect:6`. `Square` kế thừa `area` của `Rect` và ghi đè `name`: `square:16`. `Dot` không ghi đè gì nên dùng bản của `Shape`: `shape:0`.'
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng override/kế thừa. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
