subtopic_id: py.errors_modules.files_pathlib
items:
  - id: X369
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: "Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng."
    code: |
      import json

      d = json.loads('{"a": [1, 2], "b": null}')
      d["a"].append(3)
      print(len(d["a"]), d["b"])
      print(json.dumps(d))
    expected_output: |
      3 None
      {"a": [1, 2, 3], "b": null}
    rubric_md: "Đúng cả hai dòng, nhất là `None` rồi `null` sau `dumps`: điểm 1; sai cú pháp JSON của `dumps`: tối đa 0."
  - id: X370
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết `parse_csv(text)`: nhận chuỗi CSV (dòng đầu là tiêu đề) và trả list các dict, mỗi dict một dòng dữ liệu, giá trị giữ là chuỗi; bỏ dòng trống. Dùng `csv.reader` với `io.StringIO`.
    problem_id: check-x370-parse-csv
    rubric_md: "Đúng test ẩn gồm chuỗi rỗng, chỉ có tiêu đề, dòng trống và ô có dấu phẩy trong ngoặc kép: điểm 2; dùng `split(\",\")` làm sai ô ngoặc kép: tối đa 1."
  - id: X371
    difficulty: 3
    type: write_code
    minutes: 10
    prompt_md: |
      Viết `json_summary(text)`: `text` là chuỗi JSON của một mảng object có `price` và `qty` (số nguyên). Trả `{"count", "total_qty", "total_value"}` với `total_value` là tổng `price * qty`. Mảng rỗng cho ba số 0.
    problem_id: check-x371-json-summary
    rubric_md: "Dùng `json.loads` và tổng hợp đúng, pass test ẩn kể cả mảng rỗng: điểm 3; đúng nhưng quên mảng rỗng hoặc tính `total_value` sai: tối đa 2."
