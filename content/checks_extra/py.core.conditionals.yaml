subtopic_id: py.core.conditionals
items:
  - id: X004
    difficulty: 2
    type: write_code
    minutes: 5
    prompt_md: |
      Viết `fizz_word(n)` cho một số nguyên dương `n`: trả `"FizzBuzz"` nếu `n` là bội của cả 3 và 5,
      `"Fizz"` nếu chỉ là bội của 3, `"Buzz"` nếu chỉ là bội của 5, còn lại trả `n` dạng chuỗi
      (ví dụ `"7"`). Dùng `if/elif/else`, không cần vòng lặp.
    problem_id: check-x004
    rubric_md: "Pass toàn bộ test ẩn. Đúng không gợi ý trong time-box (5 phút): bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X005
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: "ten = \"\"\nif ten:\n    print(\"co ten\")\nelse:\n    print(\"trong\")\nprint(bool(0), bool(\"0\"), bool(None), 3 if bool(7) else 4)"
    expected_output: "trong\nFalse True False 3"
    answer_md: "`\"\"` là falsy nên chạy nhánh else (in `trong`). `bool(0)` và `bool(None)` là False; `\"0\"` là chuỗi không rỗng nên `bool(\"0\")` là True; `bool(7)` là True nên biểu thức điều kiện chọn `3`."
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X310
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: |
      Viết `classify_triangle(a, b, c)` nhận ba cạnh nguyên. Trả `"invalid"` nếu có cạnh <= 0 hoặc không thỏa bất đẳng thức tam giác (tổng hai cạnh nhỏ hơn hoặc bằng cạnh còn lại coi là không hợp lệ). Ngược lại trả `"equilateral"` (3 cạnh bằng nhau), `"isosceles"` (đúng 2 cạnh bằng nhau) hoặc `"scalene"` (3 cạnh khác nhau); nếu tam giác vuông (a²+b²=c² với c là cạnh lớn nhất) thì thêm hậu tố `" right"`, ví dụ `"scalene right"`.
    problem_id: check-classify-triangle
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 12 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
