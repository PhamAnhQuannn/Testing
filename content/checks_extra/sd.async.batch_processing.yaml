subtopic_id: sd.async.batch_processing
items:
  - id: S127
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Kể tên **ba pha** của MapReduce theo đúng thứ tự và nói mỗi pha làm gì bằng một câu. Dùng ví dụ
      đếm từ (word count) để minh họa.
    answer_md: |
      Ba pha: **map → shuffle → reduce**.
      - **Map:** mỗi máy đọc phần dữ liệu của mình và phát ra các cặp (khóa, giá trị). Đếm từ: câu
        "a b a" thành (a, 1), (b, 1), (a, 1).
      - **Shuffle:** gom mọi cặp cùng khóa về cùng một máy (qua mạng). a → [1, 1], b → [1].
      - **Reduce:** gộp từng khóa — với đếm từ là cộng dồn: a = 2, b = 1.
    rubric_md: "Đạt khi nêu đúng ba pha đúng thứ tự (map, shuffle, reduce) và mô tả đúng mỗi pha, có minh họa đếm từ. Đúng ý: bằng chứng điểm 1. Sai thứ tự hoặc thiếu/mô tả sai một pha: tối đa điểm 0."
  - id: S128
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một job MapReduce đếm số tương tác theo user_id chạy **mãi không xong**: theo dõi thấy **một
      máy reduce** ôm gần hết việc, các máy khác xong sớm và ngồi chơi. Hãy: (1) gọi tên hiện tượng
      này và giải thích vì sao một máy lại ôm hết; (2) nêu **hai** cách gỡ và nói rõ mỗi cách giúp
      thế nào.
    answer_md: |
      (1) Đây là **data skew (lệch dữ liệu)**: một **khóa nóng** (ví dụ user_id của một người nổi
      tiếng, hay khóa null) chiếm phần lớn bản ghi. Sau shuffle, mọi bản ghi cùng khóa về **cùng một
      máy reduce**, nên máy đó thành **straggler** — ôm hết việc trong khi các máy khác rảnh — và cả
      job phải chờ nó.
      (2) Hai cách gỡ:
      - **Combiner / gộp trước (pre-aggregation):** cộng dồn ngay tại map trước khi shuffle, để lượng
        dữ liệu cùng khóa gửi qua mạng giảm mạnh (gửi một tổng thay vì hàng triệu cặp "1").
      - **Salting + gộp hai tầng (two-stage aggregation):** gắn số ngẫu nhiên vào khóa nóng
        (id_0..id_9) để chia nó cho nhiều máy reduce chạy song song, rồi gộp các mảnh lại ở tầng sau
        thành kết quả cuối — không còn một máy ôm hết.
    rubric_md: "Đạt khi: (1) gọi đúng data skew và giải thích shuffle dồn khóa nóng về một reducer (straggler); (2) nêu đúng hai cách gỡ thực chất (combiner/gộp trước, salting/gộp hai tầng) với lý do. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Chỉ nêu tên data skew mà không có cách gỡ đúng, hoặc chỉ 'thêm RAM/thêm máy' chung chung: tối đa điểm 1."
  - id: S129
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Bạn được giao thiết kế job batch đếm số lần mỗi từ xuất hiện trong 1 TB văn bản nằm trên nhiều
      máy. Hãy trình bày trọn vẹn ở mức phỏng vấn: (1) **map, shuffle, reduce** qua ví dụ đếm từ, nói
      rõ pha nào đắt và vì sao; (2) nếu gặp **data skew** (một stop word như "the" áp đảo) thì xử lý
      thế nào; (3) làm sao để job **chạy lại được** sau khi một lần chạy hỏng mà **không đếm đúp** hay
      để lại dữ liệu dở dang.
    answer_md: |
      (1) **Map/shuffle/reduce:** mỗi máy map đọc phần văn bản của mình và phát (từ, 1): "a b a" →
      (a,1)(b,1)(a,1). **Shuffle** gom mọi cặp cùng từ về cùng một máy reduce — a → [1,1], b → [1];
      đây là **pha đắt nhất** vì phải chuyển dữ liệu **qua mạng** giữa các máy. **Reduce** cộng dồn
      từng từ: a = 2, b = 1. Map song song cục bộ (rẻ), reduce chỉ cộng (nhẹ).
      (2) **Data skew:** "the" là khóa nóng, dồn hết về một reducer làm nó thành straggler. Gỡ bằng:
      **combiner/gộp trước** ngay tại map (gửi "the → 1000000" thay vì một triệu cặp "the → 1") để
      giảm dữ liệu qua mạng; và/hoặc **salting** "the" thành the_0..the_9 chia cho nhiều reducer, rồi
      **gộp hai tầng** cộng các mảnh lại thành tổng cuối — không còn một máy ôm hết.
      (3) **Chạy lại được (idempotent):** ghi kết quả ra một **thư mục output mới** (theo ngày/
      partition); chỉ khi chạy **xong trọn vẹn** mới **tráo đổi nguyên tử (atomic swap)** trỏ sang thư
      mục đó. Lần chạy hỏng chỉ để rác trong thư mục tạm, không đụng output đang dùng; chạy lại
      **ghi đè** chứ không cộng thêm, và output **tất định** nên chạy mấy lần cũng ra đúng một kết quả
      — không đếm đúp. (Spark là một hiện thực của chính mô hình này: giữ dữ liệu trong RAM, chạy lười.)
    rubric_md: "Đạt (mức phỏng vấn) khi trả lời đủ cả ba trụ cột của thước đo mức 3: (1) giải thích đúng map/shuffle/reduce bằng đếm từ và chỉ ra shuffle đắt vì qua mạng; (2) xử lý data skew đúng thực chất (combiner/gộp trước hoặc salting + gộp hai tầng, nêu được straggler/khóa nóng); (3) làm job chạy lại được không đếm đúp (thư mục mới + tráo đổi nguyên tử, ghi đè, output tất định). Đúng, trong time-box, tự giải thích rõ ràng: bằng chứng điểm 3. Thiếu một trong ba trụ cột: chưa đạt mức 3."
