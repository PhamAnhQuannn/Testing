subtopic_id: cs.sql.joins
items:
  - id: X780
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng. Đây là mô hình INNER JOIN bằng tra cứu dict.
    code: |-
      customers = {10: "an", 20: "binh"}
      orders = [(1, 10, 50), (2, 99, 30), (3, 20, 40)]
      joined = []
      for oid, cid, amt in orders:
          if cid in customers:
              joined.append((oid, customers[cid], amt))
      print(joined)
      print(len(joined))
    expected_output: "[(1, 'an', 50), (3, 'binh', 40)]\n2"
    answer_md: "Đơn 1 (khách 10) và đơn 3 (khách 20) có khách tương ứng nên được ghép; đơn 2 có khách 99 không tồn tại nên bị loại, giống INNER JOIN. Kết quả có 2 dòng."
    rubric_md: "Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X781
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `join_lookup(orders, customers)` dùng `sqlite3` trong bộ nhớ. `orders` là list `[order_id, customer_id, amount]`, `customers` là list `[customer_id, name]`. Tạo hai bảng, chèn bằng câu SQL tham số hoá, INNER JOIN theo `customer_id` và trả về list `[order_id, name, amount]` sắp theo `order_id` tăng dần; đơn không có khách tương ứng bị loại. Ví dụ `orders = [[1,10,50],[2,20,30],[3,99,40]]`, `customers = [[10,"an"],[20,"binh"]]` cho `[[1,"an",50],[2,"binh",30]]`.
    problem_id: check-x781-join-lookup
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X782
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao hai danh sách có độ dài khác nhau (liên hệ INNER JOIN và LEFT JOIN).
    code: |-
      customers = {10: "an", 20: "binh"}
      orders = [(1, 10), (2, 99), (3, 20)]
      inner = []
      left = []
      for oid, cid in orders:
          name = customers.get(cid)
          left.append((oid, name))
          if name is not None:
              inner.append((oid, name))
      print(left)
      print(inner)
      print(len(left) - len(inner))
    expected_output: "[(1, 'an'), (2, None), (3, 'binh')]\n[(1, 'an'), (3, 'binh')]\n1"
    answer_md: "left giữ mọi đơn (bảng trái); đơn 2 có khách 99 không tồn tại nên tên là None, giống NULL của LEFT JOIN. inner chỉ giữ đơn có tên, giống INNER JOIN nên đơn 2 bị loại. Hiệu số độ dài là 1 chính là số dòng không khớp."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng: LEFT giữ dòng không khớp với None/NULL, INNER loại chúng. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
