subtopic_id: dsa.linked_list.ll_fast_slow
items:
  - id: X428
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      a = [10, 20, 30, 40, 50, 60]
      slow = fast = 0
      while fast + 1 < len(a):
          slow += 1
          fast += 2
      print(slow, a[slow], fast)
    expected_output: "3 40 6"
    answer_md: 'Mỗi lượt `slow` tăng 1 và `fast` tăng 2: (1,2), (2,4), (3,6). Tại `fast = 6` thì `fast + 1 < 6` sai nên dừng. `slow = 3` nên `a[3] = 40` (node giữa thứ hai của list 6 phần tử), `fast` đã ra ngoài cuối list.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X429
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết `has_cycle(values, pos)`: dựng linked list từ list `values` (tự định nghĩa `Node`); nếu `pos >= 0` thì nối `next` của node cuối tới node ở chỉ số `pos`, còn `pos = -1` là không có chu trình. Trả `True` nếu list có chu trình, ngược lại `False`. Dùng hai con trỏ nhanh chậm (O(1) bộ nhớ), không dùng set. `values` có thể rỗng.
    problem_id: check-x429-has-cycle
    rubric_md: "Pass toàn bộ test ẩn. Đúng không gợi ý trong time-box (6 phút): bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X430
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: |
      Viết `cycle_start(values, pos)`: dựng linked list như bài `has_cycle` (node cuối nối tới chỉ số `pos`, `pos = -1` là không chu trình). Trả **chỉ số** (từ 0) của node mà chu trình bắt đầu, hoặc `-1` nếu không có chu trình. Gợi ý: dùng Floyd để tìm điểm gặp nhau, rồi đặt một con trỏ về head và cho nó cùng `slow` đi từng bước một tới khi gặp nhau; cuối cùng đếm chỉ số của node đó bằng cách đi từ head. Phải chạy O(n) thời gian, O(1) bộ nhớ phụ (không dùng set/dict). Không trả về node, chỉ trả số nguyên.
    problem_id: check-x430-cycle-start
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 12 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
