subtopic_id: py.functions.sorting_keys
items:
  - id: X332
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: |
      Viết `sort_records(records, keys)`: mỗi bản ghi là `[name, dept, age, score]`, `keys` là list tên trường theo
      thứ tự ưu tiên, tiền tố `-` nghĩa là giảm dần (kể cả với chuỗi). Trả về list mới sắp theo mọi key, bản ghi
      bằng nhau giữ thứ tự ban đầu. Gợi ý: tận dụng tính ổn định của `sort`. Pass mọi test ẩn.
    problem_id: check-sort-records
    rubric_md: "Sort nhiều key với hướng khác nhau đúng (kể cả chuỗi giảm dần), giữ ổn định, pass toàn bộ test ẩn không cần gợi ý: điểm 3; pass nhưng phải xem gợi ý: tối đa điểm 2; sai: tối đa điểm 1."
