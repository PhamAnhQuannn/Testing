subtopic_id: dsa.heap.heap_advanced
items:
  - id: X436
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      import heapq

      lo, hi = [], []
      for x in [5, 2, 8, 1]:
          heapq.heappush(lo, -x)
          heapq.heappush(hi, -heapq.heappop(lo))
          if len(hi) > len(lo):
              heapq.heappush(lo, -heapq.heappop(hi))
          print(-lo[0], hi[0] if hi else None)
    expected_output: "5 None\n2 5\n5 8\n2 5"
    answer_md: 'Đây là hai heap giữ median: `lo` (max-heap qua số âm) là nửa nhỏ, `hi` là nửa lớn. Mỗi dòng in đỉnh `lo` và đỉnh `hi`: sau 5 thì `lo={5}`, `hi={}`; sau 2 thì `lo={2}`, `hi={5}`; sau 8 thì `lo={2,5}`, `hi={8}`; sau 1 thì `lo={1,2}`, `hi={5,8}`.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X437
    difficulty: 2
    type: write_code
    minutes: 12
    prompt_md: |
      Viết `merge_k(lists)`: `lists` gồm k danh sách số nguyên, mỗi danh sách đã sắp tăng (có thể rỗng; k có thể bằng 0). Trả về một list mới đã sắp chứa mọi phần tử (giữ phần tử trùng), dùng min-heap để đạt O(N log k). Ví dụ `merge_k([[1, 4, 5], [1, 3, 4], [2, 6]])` là `[1, 1, 2, 3, 4, 4, 5, 6]`.
    problem_id: check-x437-merge-k
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 12 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X438
    difficulty: 3
    type: write_code
    minutes: 20
    prompt_md: |
      Viết `median_doubled(nums)`: các số đến lần lượt từ `nums`. Sau mỗi lần thêm, ghi lại **gấp đôi median hiện tại** (số lượng lẻ: `2 * phần tử giữa`; chẵn: tổng hai phần tử giữa) để kết quả luôn là số nguyên. Trả list các giá trị, một giá trị cho mỗi phần tử. Dùng hai heap (max-heap bằng số âm và min-heap), O(n log n). Ví dụ `median_doubled([5, 2, 8, 1])` là `[10, 7, 10, 7]`.
    problem_id: check-x438-median-stream
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 20 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
