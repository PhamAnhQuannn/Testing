subtopic_id: py.functions.def_args
items:
  - id: F204
    practices: [verify, review]
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Hàm `evens_per_batch(batches)` (do AI viết, dùng `collect_evens`) gom số chẵn của từng batch, nhưng kết quả của các
      batch sau bị lẫn số chẵn của batch trước. Tìm và sửa bug để pass mọi test.
    problem_id: fix-collect-evens
    concepts: [bay-gia-tri-mac-dinh-la-list-chi-tao-mot]
    rubric_md: "Sửa đúng bug, pass toàn bộ test ẩn không cần gợi ý trong time-box: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: F205
    practices: [measure]
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Cài đặt `precision_recall_f1(y_true, y_pred)` từ đầu: đếm TP/FP/FN trên lớp positive (1), tính precision, recall, f1
      làm tròn 3 chữ số; mẫu số bằng 0 thì giá trị đó là 0.0. Pass mọi test ẩn.
    problem_id: compute-prf
    rubric_md: "Cài đúng, pass toàn bộ test ẩn (kể cả mẫu số 0) không cần gợi ý trong time-box: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X330
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: |
      Viết `apply_ops(nums, specs)`: mỗi spec là `[name]` hoặc `[name, k]`, áp dụng lần lượt lên từng phần tử.
      Các phép (k có giá trị mặc định khi bỏ qua): `add` (k=1), `mul` (k=2), `pow` (k=2), `clip` = `min(v, k)` (k=10),
      `drop_below` loại phần tử `v < k` (k=0). Định nghĩa mỗi phép là hàm có tham số mặc định, tra theo tên và
      gọi bằng `*spec[1:]`. Trả về list kết quả giữ thứ tự. Pass mọi test ẩn.
    problem_id: check-apply-ops
    rubric_md: "Dùng đối số mặc định + unpacking *args đúng, xử lý 0 là giá trị hợp lệ (không lọc bằng truthiness), pass toàn bộ test ẩn không cần gợi ý: điểm 3; pass nhưng phải xem gợi ý hoặc hard-code từng nhánh: tối đa điểm 2; sai: tối đa điểm 1."
