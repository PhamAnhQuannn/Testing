subtopic_id: py.ecosystem.django
items:
  - id: X765
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
    code: |-
      rows = [{"name": "an", "age": 20}, {"name": "binh", "age": 17}, {"name": "chi", "age": 20}]
      adults = [r["name"] for r in rows if r["age"] == 20]
      print(adults)
      print(len(rows))
    expected_output: "['an', 'chi']\n3"
    answer_md: "List comprehension giữ các dòng có age == 20 nên lấy tên an và chi, giống filter(age=20). Danh sách rows gốc không đổi nên len vẫn là 3."
    rubric_md: "Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X766
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `orm_filter(rows, conds, order_by)` mô phỏng `Model.objects.filter(**conds).order_by(*order_by)`. `rows` là list dict (cùng bộ khoá chuỗi, giá trị là int hoặc str), `conds` là dict `{khoá: giá trị}`: một dòng đạt khi với MỌI khoá trong `conds` có `row[khoá] == giá trị` (điều kiện AND; `conds` rỗng giữ mọi dòng). `order_by` là list khoá để sắp xếp các dòng đạt, tăng dần theo thứ tự ưu tiên, dùng sắp xếp ổn định (dòng bằng nhau giữ thứ tự đầu vào). Trả về list các dict (chính các dict đó, không sửa chúng). Ví dụ `rows=[{"name":"a","age":30},{"name":"b","age":25},{"name":"c","age":30}]`, `conds={"age":30}`, `order_by=["name"]` cho `[{"name":"a","age":30},{"name":"c","age":30}]`.
    problem_id: check-x766-orm-filter
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X767
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao dòng đầu giữ ("c", 1) trước ("a", 1) (liên quan sắp xếp ổn định và order_by nhiều khoá).
    code: |-
      rows = [("b", 2), ("a", 2), ("c", 1), ("a", 1)]
      print(sorted(rows, key=lambda r: r[1]))
      print(sorted(rows, key=lambda r: (r[1], r[0])))
      print([r for r in rows if r[0] == "a" and r[1] == 2])
    expected_output: "[('c', 1), ('a', 1), ('b', 2), ('a', 2)]\n[('a', 1), ('c', 1), ('a', 2), ('b', 2)]\n[('a', 2)]"
    answer_md: "Dòng 1 chỉ sắp theo khoá thứ hai; sắp xếp ổn định nên các dòng bằng nhau giữ thứ tự đầu vào: ('c', 1) trước ('a', 1), ('b', 2) trước ('a', 2). Dòng 2 sắp theo tuple (r[1], r[0]) nên hoà thì xét tên, giống order_by hai khoá. Dòng 3 là điều kiện AND: chỉ dòng thoả cả hai điều kiện, tức ('a', 2)."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng: sort ổn định giữ thứ tự đầu vào khi khoá bằng nhau, tuple key sắp nhiều khoá theo ưu tiên, và filter nhiều điều kiện là AND. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
