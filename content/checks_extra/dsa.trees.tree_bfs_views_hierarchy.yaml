subtopic_id: dsa.trees.tree_bfs_views_hierarchy
items:
  - id: X444
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      from collections import deque

      tree = {1: (2, 3), 2: (4, None), 3: (None, 5), 4: (None, None), 5: (None, None)}
      queue = deque([1])
      while queue:
          size = len(queue)
          seen = []
          for _ in range(size):
              v = queue.popleft()
              seen.append(v)
              for c in tree[v]:
                  if c is not None:
                      queue.append(c)
          print(size, seen, list(queue))
    expected_output: "1 [1] [2, 3]\n2 [2, 3] [4, 5]\n2 [4, 5] []"
    answer_md: 'Mỗi vòng ngoài chụp `size = len(queue)` rồi pop đúng `size` node: tầng 0 là `[1]` (đẩy 2, 3 vào queue), tầng 1 là `[2, 3]` (2 đẩy con 4, 3 đẩy con 5, nên queue thành `[4, 5]`), tầng 2 là `[4, 5]` và queue rỗng sau đó. Cột đầu là kích thước tầng, cột giữa là các node của tầng, cột cuối là queue còn lại ở cuối tầng, chính là tầng kế tiếp.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu về việc chụp len(queue) để xử lý một tầng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
