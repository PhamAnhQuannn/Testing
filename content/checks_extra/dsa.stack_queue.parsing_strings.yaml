subtopic_id: dsa.stack_queue.parsing_strings
items:
  - id: X351
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |
      st = []
      for tok in "3 4 + 2 *".split():
          if tok in "+*":
              b, a = st.pop(), st.pop()
              st.append(a + b if tok == "+" else a * b)
          else:
              st.append(int(tok))
      print(st[0])
    expected_output: "14"
    answer_md: "Đây là biểu thức hậu tố (RPN) tính bằng stack: 3 4 + cho 7, rồi 7 2 * cho 14."
    rubric_md: "Output khớp VÀ giải thích đúng ý tính RPN bằng stack. Đúng: bằng chứng điểm 1; sai: điểm 0."
