subtopic_id: sd.archetypes.cloud_compute
items:
  - id: S238
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Một nền tảng chạy **code lạ (untrusted code)** của người dùng cần hai nhóm biện pháp chính nào?
      Kể tên và nói một câu mỗi nhóm.
    answer_md: |
      Hai nhóm:
      1. **Cách ly (isolation / sandbox):** chạy code trong một hộp cách ly với quyền tối thiểu (không
         mạng, hệ thống tệp chỉ đọc) để nó không đụng được vào máy chủ hay dữ liệu người khác.
      2. **Giới hạn tài nguyên và thời gian (resource limits + timeouts):** đặt trần CPU, RAM, số tiến
         trình (pids) và thời gian chạy (ví dụ 2 giây) để một người không vét hết máy hay làm sập dịch
         vụ.
    rubric_md: "Đạt khi nêu đúng cả hai nhóm: (1) cách ly/sandbox với quyền tối thiểu, (2) giới hạn tài nguyên + timeout. Đúng cả hai ý: bằng chứng điểm 1; chỉ nêu một nhóm: tối đa điểm 0."
  - id: S239
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một bạn đề xuất: "Chạy mỗi bài nộp của người dùng trong một **Docker container** là đủ an toàn
      rồi." Hãy phản biện: (1) vì sao container trần **chưa đủ** làm ranh giới bảo mật cho code thù
      địch; (2) đề xuất một cơ chế **cách ly mạnh hơn** và nói ngắn gọn nó khác container ở đâu; (3)
      ngoài cách ly, cần thêm biện pháp gì để một người không làm sập máy của người khác?
    answer_md: |
      (1) Các container trên cùng máy **dùng chung nhân hệ điều hành (shared host kernel)**; cách ly
      chỉ là vài tính năng của nhân (namespaces, cgroups). Một lỗ hổng nhân (**kernel exploit**) có
      thể bị khai thác để **thoát container (container escape)** và chiếm cả host cùng mọi container
      khác, hoặc dò dữ liệu qua **kênh phụ (side channel)**.
      (2) Dùng **microVM (Firecracker)** — ảo hoá phần cứng nhẹ, mỗi lần chạy có **nhân riêng**, cách
      ly ở mức máy ảo nhưng vẫn khởi động nhanh — hoặc **gVisor**, một **nhân user-space** chèn giữa
      code và nhân host. Khác container ở chỗ code lạ không gọi thẳng vào nhân host, nên bề mặt tấn
      công nhỏ hơn hẳn.
      (3) **Giới hạn tài nguyên và timeout (resource limits)**: trần CPU, RAM, **số tiến trình (pids)**
      chống fork bomb, **wall-clock timeout** chống vòng lặp vô tận; cộng công bằng/quota theo người
      dùng.
    rubric_md: "Đạt (điểm 2) khi nêu đúng cả 3 ý: (1) container chia sẻ nhân host → nguy cơ container escape/side channel; (2) đề xuất microVM/Firecracker hoặc gVisor và nói đúng điểm khác (nhân riêng / nhân user-space, bề mặt tấn công nhỏ hơn); (3) resource limits + timeouts (ít nhất pids/timeout). Thiếu ý (1) lý do chia sẻ nhân, hoặc không nêu được cơ chế cách ly mạnh hơn: tối đa điểm 1."
  - id: S240
    difficulty: 3
    type: concept
    minutes: 12
    prompt_md: |
      Thiết kế một **nền tảng chạy code (code judge kiểu LeetCode hoặc IDE online)**. Trình bày đủ:
      (1) luồng kiến trúc từ khi nhận code đến khi trả kết quả, và nó kế thừa **job scheduler** ra sao;
      (2) vì sao **container trần không phải ranh giới bảo mật đủ mạnh** và bạn cách ly code lạ bằng gì;
      (3) **warm pool** là gì và vì sao nó cho khởi động nhanh; (4) làm sao đảm bảo công bằng khi một
      người gửi rất nhiều job.
    answer_md: |
      (1) **Luồng**: API nhận code + bộ test (hoặc phiên IDE), xác thực rồi đẩy một **run request** vào
      **hàng đợi (queue)**. Một **control plane = scheduler** lấy việc từ queue, giao cho một **sandbox
      worker** còn rảnh; worker chạy, trả **kết quả** (đúng/sai, thời gian) và **truyền log từng dòng
      (streaming logs)** về trình duyệt. Đây chính là một **job scheduler** (API → queue → scheduler →
      worker → kết quả); điểm khác là "việc" được giao là **code lạ (untrusted)**, nên thêm trọng tâm
      bảo mật.
      (2) **Container trần không đủ** vì các container **dùng chung nhân (kernel)** với host → một
      kernel exploit cho phép **container escape** chiếm cả máy, và có nguy cơ **side channel**. Vì vậy
      chạy mỗi lần trong **gVisor (nhân user-space)** hoặc **microVM/Firecracker (nhân riêng, ảo hoá
      phần cứng nhẹ — cách serverless làm)**, cộng **phòng thủ nhiều tầng**: seccomp, bỏ bớt quyền
      (dropped capabilities), hệ thống tệp chỉ đọc, tắt mạng, và **resource limits/timeouts** (CPU,
      RAM, pids chống fork bomb, wall-clock chống vòng lặp vô tận).
      (3) **Warm pool (hồ chứa hộp sẵn)**: giữ sẵn một số sandbox **đã bật trước (pre-booted)** chờ
      việc. Tạo hộp mới tốn thời gian (**cold start**); lấy một hộp ấm ra chạy thì gần như không có độ
      trễ khởi động. Chạy xong **dọn/tái dùng (reset / recycle)** hoặc vứt đi và bật hộp mới để không
      còn dấu vết người trước; một tiến trình nền bổ sung hộp (autoscale) để hồ không cạn khi tải tăng.
      (4) **Công bằng (fairness)**: hàng đợi tách theo người dùng và đặt **quota** (số job / lượng tài
      nguyên tối đa mỗi người), để một người gửi 1.000 job không chiếm hết warm pool; scheduler chia
      lượt vòng tròn (round-robin) giữa người dùng và autoscale thêm worker khi cần.
    rubric_md: "Đạt mức phỏng vấn (điểm 3) khi trình bày được cả 4 ý và đúng thanh L3: (1) luồng API→queue→scheduler→sandbox worker→kết quả, nhận ra kế thừa job scheduler; (2) giải thích đúng vì sao container trần không đủ (chia sẻ nhân → container escape) VÀ đề xuất cách ly mạnh hơn (gVisor/microVM) kèm resource limits; (3) định nghĩa đúng warm pool và nói đúng nó xoá cold start; (4) nêu công bằng qua quota/hàng đợi theo người dùng. Đúng, trong time-box, tự giải thích mạch lạc: bằng chứng điểm 3. Thiếu phần bảo mật (2) hoặc warm pool (3): chưa đạt mức 3."
