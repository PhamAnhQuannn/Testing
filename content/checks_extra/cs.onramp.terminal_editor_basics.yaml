subtopic_id: cs.onramp.terminal_editor_basics
items:
  - id: X876
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code mô phỏng thư mục hiện tại dưới đây in ra gì? Ghi đúng từng dòng.
    code: |-
      cwd = ["home", "an"]
      for cmd in ["pwd", "cd docs", "pwd", "cd ..", "cd ..", "pwd"]:
          if cmd == "pwd":
              print("/" + "/".join(cwd))
          elif cmd == "cd docs":
              cwd.append("docs")
          else:
              cwd.pop()
    expected_output: "/home/an\n/home/an/docs\n/home"
    answer_md: "Ban đầu cwd là /home/an. pwd in /home/an. cd docs thêm docs nên pwd in /home/an/docs. Hai lệnh cd .. bỏ docs rồi bỏ an, còn /home."
    rubric_md: "Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X877
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `final_cwd(start, cmds)` trả về thư mục hiện tại sau một chuỗi lệnh shell. `start` là đường dẫn tuyệt đối kiểu POSIX (ví dụ `"/home/user"`), `cmds` là list các chuỗi lệnh. Chỉ `cd` làm đổi thư mục: `"cd /abs/path"` nhảy tới đường dẫn tuyệt đối; `"cd name"` (tương đối, có thể có `/` như `"cd a/b"`) đi xuống từng đoạn; `"cd .."` lên một cấp (đang ở `/` thì giữ nguyên); `"cd ."` không làm gì; `"cd"` trần về gốc `/`. Mọi lệnh khác (`ls`, `echo ...`) bị bỏ qua. Trả về đường dẫn đã chuẩn hoá: bắt đầu bằng `/`, không có `/` ở cuối trừ gốc là `"/"`. Ví dụ `final_cwd("/home", ["cd projects", "cd ..", "cd /etc", "cd .."])` trả `"/"`, còn `final_cwd("/a/b", ["cd c", "ls", "cd .."])` trả `"/a/b"`.
    problem_id: check-x877-final-cwd
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X878
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code mô phỏng một chương trình dòng lệnh dưới đây in ra gì? Ghi đúng từng dòng và giải thích exit code khác 0 báo hiệu điều gì, argument và environment variable khác nhau thế nào.
    code: |-
      def run(argv, env):
          if len(argv) < 2:
              print("usage: greet NAME")
              return 2
          name = argv[1]
          greeting = env.get("GREETING", "Hello")
          print(greeting + ", " + name)
          return 0


      env = {"HOME": "/home/an"}
      codes = []
      codes.append(run(["greet"], env))
      codes.append(run(["greet", "Binh"], env))
      env["GREETING"] = "Xin chao"
      codes.append(run(["greet", "Binh", "extra"], env))
      print(codes)
      print(any(c != 0 for c in codes))
    expected_output: "usage: greet NAME\nHello, Binh\nXin chao, Binh\n[2, 0, 0]\nTrue"
    answer_md: "Lần 1 thiếu argument nên in usage và trả exit code 2. Lần 2 có argument Binh, chưa có GREETING nên dùng mặc định Hello, exit code 0. Sau khi đặt GREETING, lần 3 in Xin chao, Binh (argument thừa bị bỏ qua), exit code 0. codes = [2, 0, 0] và có phần tử khác 0 nên in True. Exit code 0 là thành công, khác 0 là lỗi; argument truyền riêng cho từng lần chạy, còn environment variable là cấu hình nền mà chương trình tra cứu."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng: exit code 0 là thành công còn khác 0 báo lỗi (để script/CI kiểm tra); argument được truyền cho từng lần chạy còn environment variable là cấu hình môi trường. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
