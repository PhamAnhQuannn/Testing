subtopic_id: py.runtime.performance
items:
  - id: X724
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
    code: |-
      items = [4, 1, 4, 2, 1]
      seen = set()
      out = []
      for x in items:
          if x in seen:
              continue
          seen.add(x)
          out.append(x)
      print(out)
      print(len(seen))
      print(3 in seen)
    expected_output: "[4, 1, 2]\n3\nFalse"
    answer_md: "Lần đầu gặp 4, 1, 2 thì thêm vào out và seen; 4 và 1 lặp lại bị bỏ qua. out = [4, 1, 2], seen có 3 phần tử, 3 không có trong seen nên in False."
    rubric_md: "Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X725
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `unique_in_order(items)` trả về list các phần tử của `items` (list số nguyên) đã **bỏ trùng nhưng giữ thứ tự xuất hiện đầu tiên**. Dùng một set `seen` để kiểm tra trùng trong O(1) (tổng O(n), không dùng `in` trên list kết quả). Ví dụ `[3, 1, 3, 2, 1]` cho `[3, 1, 2]`; `[]` cho `[]`.
    problem_id: check-x725-unique-order
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X726
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao trong code thật nên gom vào list rồi join thay cho += trong vòng lặp.
    code: |-
      s = ""
      parts = []
      for i in range(1, 5):
          s += str(i * i)
          parts.append(str(i * i))
      print(s)
      print("-".join(parts))
      print(s == "".join(parts))
      print(len(s))
    expected_output: "14916\n1-4-9-16\nTrue\n5"
    answer_md: "i chạy 1..4 cho bình phương 1, 4, 9, 16 nên s = '14916' (5 ký tự). join với '-' cho '1-4-9-16'. Nối rỗng cho '14916' nên so sánh True, len = 5. Hai cách cho cùng kết quả; khác nhau ở hiệu năng: chuỗi bất biến nên mỗi lần += có thể tạo chuỗi mới và sao chép lại nội dung cũ (có thể O(n^2) tổng), còn join tính tổng độ dài rồi nối một lần O(n)."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng: chuỗi bất biến, += tạo chuỗi mới mỗi vòng nên tốn thêm, join nối một lần. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
