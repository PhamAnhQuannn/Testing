subtopic_id: lld.process.apis_code
items:
  - id: X597
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Giải thích 1 câu vì sao `add_book` gọi hai lần cho `dune` lại cộng dồn.
    code: |-
      class Library:
          def __init__(self):
              self.stock = {}

          def add_book(self, title, copies):
              self.stock[title] = self.stock.get(title, 0) + copies

          def borrow(self, title):
              if self.stock.get(title, 0) == 0:
                  return False
              self.stock[title] -= 1
              return True

          def available(self, title):
              return self.stock.get(title, 0)


      lib = Library()
      lib.add_book("dune", 2)
      lib.add_book("emma", 1)
      lib.add_book("dune", 1)
      print(lib.borrow("dune"))
      print(lib.borrow("emma"))
      print(lib.borrow("emma"))
      print(lib.available("dune"))
      print(lib.available("zzz"))
    expected_output: "True\nTrue\nFalse\n2\n0"
    answer_md: '`add_book` đọc số cũ bằng `get(title, 0)` rồi cộng thêm nên `dune` có 3 bản. `borrow("dune")` còn bản nên True (còn 2); `emma` có 1 bản nên lần đầu True, lần hai hết nên False. Tựa lạ `zzz` cho `get` mặc định 0.'
    rubric_md: "Output khớp VÀ nêu add_book cộng dồn qua dict.get. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X598
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết `class Library` là API lõi của thư viện, kiểm tra đầu vào bằng giá trị trả về (không ném lỗi). Constructor không tham số. `add_book(title, copies)` thêm `copies` (số nguyên >= 0) bản có sẵn cho `title`, gọi lại thì cộng dồn. `borrow(title)` trả `True` và giảm số bản có sẵn nếu còn, ngược lại trả `False` và không đổi gì. `return_book(title)` trả `True` và tăng số bản có sẵn nếu tựa sách đã biết và còn lượt mượn chưa trả, ngược lại trả `False`. `available(title)` trả số bản có sẵn (`0` nếu tựa lạ). Ví dụ: `add_book("dune", 1)`, `borrow("dune")` là `True`, `borrow("dune")` lần hai là `False`, `available("dune")` là `0`.
    problem_id: check-x598-library-api
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X599
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao `borrow("rust")` không làm `len(lib.books)` tăng, và vì sao trả `False` thay vì ném lỗi thì người gọi vẫn phải tự kiểm tra kết quả.
    code: |-
      class Library:
          def __init__(self):
              self.books = {}

          def add_book(self, title, copies):
              if not title or copies < 0:
                  return False
              self.books[title] = self.books.get(title, 0) + copies
              return True

          def borrow(self, title):
              if self.books.get(title, 0) <= 0:
                  return False
              self.books[title] -= 1
              return True


      lib = Library()
      print(lib.add_book("", 3))
      print(lib.add_book("go", -1))
      print(lib.add_book("go", 1))
      print(lib.borrow("go"))
      print(lib.borrow("go"))
      print(lib.borrow("rust"))
      print(lib.books)
      print(len(lib.books))
    expected_output: "False\nFalse\nTrue\nTrue\nFalse\nFalse\n{'go': 0}\n1"
    answer_md: 'Hai lần `add_book` đầu bị validation từ chối (tựa rỗng, copies âm) nên trả False và không đổi dict. `go` có 1 bản: borrow lần một True (còn 0), lần hai hết nên False. `borrow("rust")` chỉ dùng `get` nên không tạo khóa mới: False, dict vẫn `{''go'': 0}` và độ dài 1. Trả False không ép người gọi xử lý, nên họ phải tự kiểm tra giá trị trả về.'
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng get không tạo khóa, validation trả False sớm. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
