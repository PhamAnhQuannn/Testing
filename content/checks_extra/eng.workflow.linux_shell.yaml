subtopic_id: eng.workflow.linux_shell
items:
  - id: E103
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Giải thích ngắn: (1) khác nhau giữa đường dẫn **tuyệt đối** và **tương đối**; (2) `>` khác `>>` thế nào;
      (3) `chmod 755 run.sh` cho ai quyền gì?
    answer_md: |
      (1) Đường dẫn **tuyệt đối** bắt đầu bằng `/`, tính từ gốc nên đúng ở mọi nơi (`/home/quan/a.txt`);
      **tương đối** tính từ thư mục hiện tại (`a.txt`, `../a.txt`).
      (2) `>` **ghi đè** file; `>>` **ghi nối thêm** (append) vào cuối file.
      (3) 755: owner `rwx` (đọc, ghi, chạy); group và other `r-x` (đọc, chạy, không ghi).
    rubric_md: "Đúng khi trả lời đủ cả ba ý: tuyệt đối bắt đầu bằng / và tương đối tính từ thư mục hiện tại; > ghi đè còn >> nối thêm; 755 = owner rwx, group/other r-x. Đủ cả ba: bằng chứng điểm 1; sai hoặc thiếu một ý: tối đa điểm 0."
  - id: E104
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Bạn chạy `./deploy.sh` và nhận lỗi `Permission denied`. `ls -l deploy.sh` cho `-rw-r--r-- 1 quan dev ... deploy.sh`.
      (1) Vì sao lỗi xảy ra? (2) Sửa bằng lệnh nào để **chỉ owner** chạy được script còn group và other chỉ đọc?
      (3) Script in ra cả kết quả lẫn lỗi; viết lệnh lưu **kết quả** vào `out.log` và **lỗi** vào `err.log`, rồi nói
      điều gì xảy ra với lỗi nếu bạn chỉ viết `./deploy.sh | grep OK`.
    answer_md: |
      (1) Quyền hiện tại là `rw-r--r--` (644): **không ai có quyền x** (execute), nên shell không cho chạy file.
      (2) Cần thêm `x` cho owner mà không mở thêm cho người khác: `chmod 744 deploy.sh` (owner `rwx`, group/other
      `r--`) hoặc `chmod u+x deploy.sh`. (Nếu muốn mọi người chạy được thì `chmod 755`.)
      (3) `./deploy.sh > out.log 2> err.log` (`>` chuyển stdout, `2>` chuyển stderr). Với `./deploy.sh | grep OK`,
      pipe chỉ chuyển **stdout** sang `grep`; **stderr vẫn hiện ra màn hình** và không đi qua `grep`
      (muốn gộp cả lỗi thì dùng `2>&1 |`).
    rubric_md: "Đạt khi: (1) chỉ ra thiếu quyền x (644, không có execute); (2) đưa lệnh đúng như chmod 744 hoặc chmod u+x (KHÔNG chấp nhận chmod 755 vì nó mở thêm quyền chạy cho group/other, trái yêu cầu chỉ owner chạy được); (3) viết đúng > out.log 2> err.log và nói được pipe chỉ chuyển stdout nên stderr vẫn ra màn hình. Đủ ba phần, tự giải thích trong time-box: bằng chứng điểm 2. Thiếu phần stderr/pipe hoặc sai lệnh chmod: tối đa điểm 1."
  - id: E105
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Một server nền (`python server.py &`) bỗng không phản hồi. Hãy mô tả quy trình xử lý từ đầu đến cuối: cách
      tìm tiến trình, cách dừng nó đúng thứ tự và **vì sao** theo thứ tự đó (SIGTERM so với SIGKILL). Sau đó nêu một
      pipeline dùng `|` để đếm số dòng chứa `ERROR` trong `app.log`, và giải thích `chmod 640 app.log` cho ai quyền gì.
    answer_md: |
      **Tìm tiến trình:** `ps aux | grep server.py` (hoặc `jobs -l` nếu cùng terminal, vì `jobs` không có `-l` chỉ hiện số job) để lấy **PID**.

      **Dừng đúng thứ tự:** trước hết `kill PID` (**SIGTERM**, signal 15): chương trình có cơ hội bắt signal,
      đóng kết nối/file, lưu trạng thái rồi thoát sạch. Chờ vài giây và kiểm tra lại bằng `ps`. Chỉ khi nó vẫn
      treo mới dùng `kill -9 PID` (**SIGKILL**, signal 9): hệ điều hành dừng ngay, không thể bị bắt hay bỏ qua,
      nhưng chương trình **không được dọn dẹp** (có thể mất dữ liệu đang ghi, để lại file khóa tạm).

      **Pipeline:** `grep ERROR app.log | wc -l` (`grep` in dòng chứa `ERROR`, `|` nối stdout vào stdin của
      `wc -l` để đếm dòng).

      **Quyền 640:** owner `rw-` (đọc, ghi), group `r--` (chỉ đọc), other `---` (không có quyền gì), hợp lý cho file
      log có thông tin nhạy cảm.
    rubric_md: "Đạt mức 3 khi: (a) tìm PID bằng ps (hoặc jobs) và nêu đúng thứ tự SIGTERM trước, SIGKILL (kill -9) sau, kèm lý do SIGTERM cho dọn dẹp còn SIGKILL buộc dừng ngay không dọn dẹp; (b) viết đúng pipeline như grep ERROR app.log | wc -l và hiểu | nối stdout vào stdin; (c) giải thích đúng 640 = owner rw-, group r--, other không có quyền. Đúng, trong time-box: bằng chứng điểm 3. Thiếu lý do chọn thứ tự signal hoặc sai quyền 640: chưa đạt mức 3."
