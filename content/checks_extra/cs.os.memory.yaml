subtopic_id: cs.os.memory
items:
  - id: X858
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
    code: |-
      page_size = 4
      sizes = [10, 8, 13]
      total = 0
      for s in sizes:
          frames = -(-s // page_size)
          waste = frames * page_size - s
          total += waste
          print(frames, waste)
      print(total)
    expected_output: "3 2\n2 0\n4 3\n5"
    answer_md: "Size 10 cần 3 frame (12), lãng phí 2. Size 8 cần 2 frame (8), lãng phí 0. Size 13 cần 4 frame (16), lãng phí 3. Tổng internal fragmentation là 2 + 0 + 3 = 5."
    rubric_md: "Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X859
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `first_fit(blocks, requests)` mô phỏng chính sách cấp phát first-fit. `blocks` là list số nguyên: kích thước từng free block theo thứ tự cố định. `requests` là list kích thước cần cấp phát. Với mỗi request theo thứ tự, quét block từ trái sang phải và cấp phát vào block **đầu tiên** có kích thước còn lại `>=` request; trừ kích thước block đó đi request và thêm **chỉ số** block vào kết quả. Nếu không block nào đủ, thêm `-1`. Trả về list kết quả theo thứ tự request; `requests` rỗng trả `[]`. Ví dụ `first_fit([100,500,200],[212,417,112,426])` cho `[1,-1,1,-1]` (212 vào block 1, còn 288; 417 không block nào đủ; 112 vào block 1, còn 176; 426 không đủ).
    problem_id: check-x859-first-fit
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X860
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao first-fit thất bại ở request cuối còn best-fit thì không (khái niệm gì).
    code: |-
      blocks = [100, 500, 200, 300, 600]
      reqs = [212, 417, 112, 426]


      def first_fit(blocks, reqs):
          rem = list(blocks)
          out = []
          for r in reqs:
              idx = -1
              for i, s in enumerate(rem):
                  if s >= r:
                      idx = i
                      break
              if idx >= 0:
                  rem[idx] -= r
              out.append(idx)
          return out


      def best_fit(blocks, reqs):
          rem = list(blocks)
          out = []
          for r in reqs:
              idx = -1
              for i, s in enumerate(rem):
                  if s >= r and (idx == -1 or s < rem[idx]):
                      idx = i
              if idx >= 0:
                  rem[idx] -= r
              out.append(idx)
          return out


      a = first_fit(blocks, reqs)
      b = best_fit(blocks, reqs)
      print(a)
      print(b)
      print(a.count(-1))
      print(b.count(-1))
    expected_output: "[1, 4, 1, -1]\n[3, 1, 2, 4]\n1\n0"
    answer_md: "First-fit: 212 vào block 1 (còn 288), 417 vào block 4 (600 còn 183), 112 vào block 1 (còn 176), 426 không còn block nào đủ nên -1. Best-fit: 212 vào block 3 (300 còn 88), 417 vào block 1 (500 còn 83), 112 vào block 2 (200 còn 88), 426 vào block 4 (600 còn 174). First-fit đã xé nhỏ block 500 và 600 bằng các request nhỏ nên bị external fragmentation: tổng trống đủ nhưng không mảnh nào >= 426."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng: first-fit làm vỡ các block lớn thành mảnh nhỏ, gây external fragmentation (best-fit chọn block vừa khít nên giữ được block lớn). Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
