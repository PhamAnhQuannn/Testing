subtopic_id: sd.caching.distributed_cache
items:
  - id: S082
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Nói ngắn gọn: (1) Memcached và Redis khác nhau ở điểm cốt lõi nào; (2) với mỗi bài toán sau,
      kiểu dữ liệu Redis phù hợp là gì — bảng xếp hạng (leaderboard), giới hạn tần suất (rate limit),
      phiên đăng nhập (session)?
    answer_md: |
      (1) **Memcached** = kho khóa-giá trị (key-value) thuần, đa luồng, đơn giản, chỉ `get`/`set`
      chuỗi, không lưu đĩa. **Redis** = cũng trong RAM nhưng có **nhiều kiểu dữ liệu**, chạy lệnh
      **một luồng** (mỗi lệnh atomic), có **persistence**, **replication** và **pub/sub** — nên giải
      được nhiều bài toán hơn.
      (2) Leaderboard → **sorted set (ZSET)**; rate limit → **bộ đếm bằng `INCR` + `EXPIRE`**
      (string số); session → **hash** hoặc **string** kèm **TTL**.
    rubric_md: "Đúng ý: điểm 1. Cần nêu đúng khác biệt cốt lõi (Memcached đơn giản key-value / Redis giàu kiểu dữ liệu + atomic/persistence) và khớp đúng cả ba kiểu (ZSET, INCR/EXPIRE, hash|string+TTL). Sai hoặc thiếu một kiểu, hoặc không nêu được khác biệt: tối đa điểm 0."
  - id: S083
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Thiết kế **rate limiter**: mỗi người tối đa **100 request/phút** bằng Redis. Hãy nêu (1) kiểu dữ
      liệu và các **lệnh** (kèm tham số) chạy cho một request mới; (2) vì sao chỉ đặt hết hạn (expire)
      **một lần**; (3) điều gì xảy ra ở giây đầu của phút kế tiếp.
    answer_md: |
      (1) Dùng một **khóa đếm** (string số), ví dụ `rl:user7`:
      ```
      INCR rl:user7            # tăng bộ đếm, trả số mới
      EXPIRE rl:user7 60       # chỉ gọi khi kết quả INCR == 1
      # nếu kết quả INCR > 100 -> từ chối (HTTP 429)
      ```
      `INCR` là atomic nên nhiều request đồng thời vẫn đếm đúng.
      (2) Chỉ đặt `EXPIRE` ở **lần đầu** (khi `INCR` trả về 1) để khóa sống đúng một cửa sổ 60 giây;
      nếu gọi `EXPIRE` mỗi lần thì cửa sổ cứ bị đẩy lùi, không bao giờ reset.
      (3) Qua phút mới, khóa đã **hết hạn và biến mất**, nên lần `INCR` tiếp theo tạo lại khóa và đếm
      **từ 1** — cửa sổ 100 request mới bắt đầu.
    rubric_md: "Đạt (điểm 2) khi nêu đủ: INCR tăng bộ đếm + so với 100, EXPIRE 60 đặt một lần ở lần đầu, và khóa hết hạn thì phút sau đếm lại từ 1. Lệnh phải đúng tham số (EXPIRE ... 60). Thiếu lý do 'đặt expire một lần' hoặc không giải thích reset ở phút sau: tối đa điểm 1."
  - id: S084
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Mức phỏng vấn. Với ba bài toán — **bảng xếp hạng (top 10 + hạng một người)**, **rate limit 100
      req/phút**, **session 30 phút** — hãy: (1) chọn **kiểu Redis** cho mỗi bài và **viết các lệnh
      chính với đúng tham số**; (2) giải thích **Redis Cluster chia khóa** như thế nào và vì sao một
      **lệnh đa khóa** có thể bị từ chối; (3) khi cache **hết RAM**, cụm Redis **xử lý thế nào** — nêu
      `maxmemory` và chọn eviction policy phù hợp cho cache leaderboard/session ở trên.
    answer_md: |
      (1) Chọn kiểu + lệnh:
      - **Leaderboard → sorted set (ZSET):**
        ```
        ZADD board 150 an          # cập nhật điểm
        ZREVRANGE board 0 9        # top 10 (thêm WITHSCORES nếu cần điểm)
        ZREVRANK board an          # hạng của an (0 là cao nhất)
        ```
      - **Rate limit → INCR + EXPIRE:**
        ```
        INCR rl:user7              # tăng bộ đếm, trả số mới
        EXPIRE rl:user7 60         # chỉ ở lần đầu (kết quả == 1); > 100 -> từ chối
        ```
      - **Session → string (hoặc hash) + TTL:**
        ```
        SET session:abc "<json>" EX 1800   # 1800s = 30 phút
        GET session:abc
        EXPIRE session:abc 1800            # gia hạn khi còn hoạt động
        ```
      (2) **Cluster:** có **16384 hash slot**; mỗi khóa băm `CRC16(key) mod 16384` ra **một** slot,
      mỗi node giữ một **dải slot** (kèm replica); thêm node chỉ cần **chuyển vài slot**, không băm lại
      toàn bộ. Một **lệnh đa khóa** chỉ chạy khi mọi khóa **cùng một slot**; nếu chúng rơi vào slot ở
      các node khác nhau thì bị từ chối (`CROSSSLOT`). Muốn nhóm khóa về cùng slot dùng **hash tag**:
      chỉ phần trong `{...}` được băm, nên `user:{7}:profile` và `user:{7}:session` cùng slot.
      (3) **Hết RAM:** đặt **`maxmemory`** + chính sách eviction. Dữ liệu cache "được phép bay" (session
      có TTL, bảng xếp hạng dựng lại được) dùng **`allkeys-lru`** hoặc **`volatile-lru`/`volatile-ttl`**
      để đẩy khóa cũ/sắp hết hạn ra lấy chỗ; nếu có dữ liệu **không được mất** thì để nhóm đó không TTL
      và cân nhắc **`noeviction`** (đổi lại ghi sẽ fail khi đầy) — không bao giờ để `allkeys-lru` xóa im
      lặng dữ liệu quan trọng.
    rubric_md: "Đạt mức 3 (phỏng vấn) khi: chọn đúng cả ba kiểu, viết lệnh đúng tham số (ZADD/ZREVRANGE 0 9/ZREVRANK; INCR + EXPIRE 60; SET ... EX 1800 / TTL + gia hạn), giải thích đúng cluster (16384 slot, CRC16 % 16384, node giữ dải slot) cùng lý do lệnh đa khóa bị từ chối (phải cùng slot; hash tag), VÀ nêu đúng cách xử lý hết RAM (maxmemory + eviction policy hợp với từng loại dữ liệu: allkeys/volatile-lru cho cache được phép bay, noeviction cho dữ liệu không được mất). Thiếu phần cluster hoặc phần xử lý hết RAM: chưa đạt mức 3."
