subtopic_id: cs.sql.subqueries_sets
items:
  - id: X783
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
    code: |-
      v = [4, 8, 6, 2, 10]
      avg = sum(v) / len(v)
      above = [x for x in v if x > avg]
      print(avg)
      print(above)
      print(len(above))
    expected_output: "6.0\n[8, 10]\n2"
    answer_md: "Đoạn code mô phỏng scalar subquery `WHERE score > (SELECT AVG(score) FROM t)`: trung bình tính một lần = 30 / 5 = 6.0, rồi giữ các giá trị lớn hơn hẳn. 6 không lớn hơn 6.0 nên bị loại, còn lại [8, 10]."
    rubric_md: "Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X784
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `above_average(rows)` bằng `sqlite3` trong bộ nhớ. `rows` là list các bản ghi `[name, score]` (name là chuỗi, score là số nguyên). Tạo bảng `t(name TEXT, score INTEGER)`, chèn bằng `executemany` tham số hoá, rồi chạy `SELECT name, score FROM t WHERE score > (SELECT AVG(score) FROM t) ORDER BY score DESC, name ASC`. Trả về list các cặp `[name, score]`, mỗi cặp là list. Ví dụ `[["an",3],["binh",9],["chi",6]]` có trung bình 6 nên cho `[["binh", 9]]`; `[]` cho `[]`.
    problem_id: check-x784-above-average
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X785
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao UNION cho ít dòng hơn UNION ALL, và vì sao INTERSECT/EXCEPT không giữ số lần lặp.
    code: |-
      a = [3, 1, 2, 3, 1]
      b = [2, 3, 4, 4]
      print(sorted(set(a) | set(b)))
      print(sorted(set(a) & set(b)))
      print(sorted(set(a) - set(b)))
      print(sorted(set(b) - set(a)))
      print(len(a) + len(b), len(set(a) | set(b)))
    expected_output: "[1, 2, 3, 4]\n[2, 3]\n[1]\n[4]\n9 4"
    answer_md: "UNION tương ứng hợp tập hợp (set |): bỏ trùng nên còn 4 giá trị, còn UNION ALL chỉ nối hai danh sách nên giữ 5 + 4 = 9 dòng. INTERSECT (set &) cho [2, 3] và EXCEPT (set -) cho [1] đều khử trùng: 3 và 1 lặp ở a nhưng chỉ xuất hiện một lần. EXCEPT không đối xứng: a EXCEPT b = [1] còn b EXCEPT a = [4]. Cần ORDER BY (ở đây là sorted) vì thứ tự không được đảm bảo."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng: UNION/INTERSECT/EXCEPT khử trùng còn UNION ALL giữ mọi dòng (9 so với 4); EXCEPT không đối xứng. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
