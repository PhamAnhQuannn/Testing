subtopic_id: dsa.greedy_intervals.interval_sweep
items:
  - id: X502
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      trips = [(2, 1, 5), (3, 3, 7)]
      d = [0] * 10
      for n, a, b in trips:
          d[a] += n
          d[b] -= n
      run = 0
      out = []
      for x in d:
          run += x
          out.append(run)
      print(out)
      print(max(out))
    expected_output: "[0, 2, 2, 5, 5, 3, 3, 0, 0, 0]\n5"
    answer_md: 'Mảng hiệu `d` cộng 2 tại trạm 1, trừ 2 tại trạm 5, cộng 3 tại trạm 3, trừ 3 tại trạm 7; cộng dồn cho số hành khách ở từng trạm. Hai chuyến chồng nhau ở trạm 3 và 4 nên cao nhất là 2 + 3 = 5.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
