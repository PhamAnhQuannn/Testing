subtopic_id: lld.process.extensibility
items:
  - id: X600
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code pricing rule in ra gì? Giải thích 1 câu.
    code: |-
      RULES = {"weekday": 10, "weekend": 15, "holiday": 20}


      def fee(hours, rule):
          return hours * RULES.get(rule, RULES["weekday"])


      print(fee(3, "holiday") + fee(2, "night"))
    expected_output: "80"
    answer_md: '`fee(3, "holiday")` = 3 * 20 = 60. Luật `night` không có trong `RULES` nên rơi về giá weekday: `fee(2, "night")` = 2 * 10 = 20. Tổng 60 + 20 = 80.'
    rubric_md: "Output khớp VÀ nêu được luật lạ dùng giá weekday. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X601
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết hàm `fee(hours, rule)` có điểm mở rộng: giá mỗi giờ nằm trong dict `RULES = {"weekday": 10, "weekend": 15, "holiday": 20}`. Trả về `hours * rate` (int) với `rate = RULES[rule]`; nếu `rule` không có trong `RULES` thì dùng giá `weekday` (10). `hours` là số nguyên không âm. Ví dụ `fee(2, "weekend")` cho `30`.
    problem_id: check-x601-pricing-rule
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X602
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code storage abstraction in ra gì? Ghi đúng từng dòng và giải thích vì sao đổi `MemoryStore` sang file không phải sửa `save_score`.
    code: |-
      class Store:
          def put(self, key, value):
              raise NotImplementedError

          def get(self, key):
              raise NotImplementedError


      class MemoryStore(Store):
          def __init__(self):
              self.data = {}

          def put(self, key, value):
              self.data[key] = value

          def get(self, key):
              return self.data.get(key, -1)


      def save_score(store, name, delta):
          old = store.get(name)
          store.put(name, delta if old == -1 else old + delta)
          return store.get(name)


      s = MemoryStore()
      print(save_score(s, "an", 5))
      print(save_score(s, "an", 3))
      print(save_score(s, "binh", 2))
      print(s.get("cam"))
      print(s.data)
    expected_output: |-
      5
      8
      2
      -1
      {'an': 8, 'binh': 2}
    answer_md: '`save_score` chỉ gọi `store.get` và `store.put` của interface `Store`. Lần 1: `an` chưa có (-1) nên lưu 5. Lần 2: 5 + 3 = 8. `binh` mới nên lưu 2. `cam` chưa có nên `get` trả -1. `data` là dict nội bộ của `MemoryStore`. Đổi sang `FileStore` cùng hai method thì `save_score` không đổi.'
    rubric_md: "Output khớp từng ký tự VÀ nêu được lõi chỉ phụ thuộc interface Store. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
