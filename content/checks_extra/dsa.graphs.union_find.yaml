subtopic_id: dsa.graphs.union_find
items:
  - id: X451
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      parent = list(range(5))
      size = [1] * 5

      def find(x):
          while parent[x] != x:
              parent[x] = parent[parent[x]]
              x = parent[x]
          return x

      def union(a, b):
          ra, rb = find(a), find(b)
          if ra == rb:
              return False
          if size[ra] < size[rb]:
              ra, rb = rb, ra
          parent[rb] = ra
          size[ra] += size[rb]
          return True

      print(union(0, 1), union(1, 2), union(0, 2))
      print(parent)
      print(find(2) == find(0), find(3) == find(0))
    expected_output: "True True False\n[0, 0, 0, 3, 4]\nTrue False"
    answer_md: 'Hai `union` đầu thành công và gộp 0, 1, 2 vào cùng tập (root 0, vì tập lớn hơn làm root); `union(0, 2)` thấy cùng root nên trả `False`. Mảng `parent` là `[0, 0, 0, 3, 4]` (3 và 4 vẫn tự là root), nên `find(2) == find(0)` đúng còn `find(3) == find(0)` sai.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X452
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết `count_provinces(is_connected)`: `is_connected` là ma trận vuông n x n gồm 0/1, `is_connected[i][j] == 1` nghĩa là thành phố `i` và `j` nối trực tiếp (ma trận đối xứng, đường chéo là 1). Một province là nhóm thành phố liên thông (trực tiếp hoặc gián tiếp). Trả về số province. `count_provinces([[1, 1, 0], [1, 1, 0], [0, 0, 1]])` là `2`. Gợi ý: DSU, bắt đầu với n tập và trừ 1 mỗi lần union thành công.
    problem_id: check-x452-count-provinces
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X453
    difficulty: 3
    type: write_code
    minutes: 10
    prompt_md: |
      Viết `redundant_connection(edges)`: `edges` là danh sách cạnh `[u, v]` (node đánh số từ 1) của một cây có thêm đúng một cạnh thừa, nên có đúng một chu trình. Duyệt các cạnh từ trái sang phải và trả về cạnh làm hai đầu đã liên thông (cạnh khép chu trình, tức cạnh cuối cùng theo thứ tự input trong chu trình). `redundant_connection([[1, 2], [1, 3], [2, 3]])` là `[2, 3]`. Gợi ý: DSU, `union` thất bại thì cạnh đó là đáp án.
    problem_id: check-x453-redundant-connection
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
