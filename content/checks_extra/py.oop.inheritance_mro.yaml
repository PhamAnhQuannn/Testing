subtopic_id: py.oop.inheritance_mro
items:
  - id: X375
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      class A:
          def who(self):
              return "A"

      class B(A):
          def who(self):
              return "B" + super().who()

      class C(A):
          def who(self):
              return "C" + super().who()

      class D(B, C):
          pass

      print(D().who())
      print([k.__name__ for k in D.__mro__])
      print(C().who())
    expected_output: "BCA\n['D', 'B', 'C', 'A', 'object']\nCA"
    answer_md: 'MRO của `D(B, C)` là `D, B, C, A, object`. `D` không có `who` nên chạy `B.who`; `super()` trong `B` đi tới class kế tiếp trong MRO của object `D` là `C` (không phải `A`), rồi `C` gọi tiếp `A`, nên ra `BCA`. Với `C()` thì MRO là `C, A, object` nên chỉ ra `CA`.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X376
    difficulty: 2
    type: write_code
    minutes: 5
    prompt_md: |
      Viết `hello_chain(order)`; bên trong hàm hãy định nghĩa class `A` (`hello()` trả `"A"`), `B(A)` và `C(A)` (`hello()` trả `"B>"` / `"C>"` nối với `super().hello()`), rồi class `D` không tự định nghĩa `hello`. Base của `D` là các class trong `order` theo đúng thứ tự (`"BC"` là `D(B, C)`, `"CB"` là `D(C, B)`, `"B"` là `D(B)`; `order` rỗng thì `D` kế thừa `A`). Trả về `D().hello()`. Ví dụ `hello_chain("BC")` là `"B>C>A"`. Gợi ý: tạo `D` bằng `type("D", bases, {})`.
    problem_id: check-x376-hello-chain
    rubric_md: "Pass toàn bộ test ẩn. Đúng không gợi ý trong time-box (5 phút): bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X377
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: |
      Viết `mro_names(spec)`. `spec` là list các cặp `[tên, [tên các base]]`, mỗi base đã xuất hiện ở phần tử đứng trước. Tạo lần lượt các class thật bằng `type(tên, tuple_base, {})`, rồi trả về list tên các class trong MRO của class cuối cùng (theo `__mro__`, bỏ `object`). Nếu Python không thể tạo class vì thứ tự base mâu thuẫn (`TypeError`) thì trả `["error"]`. Ví dụ `A; B(A); C(A); D(B, C)` cho `["D", "B", "C", "A"]`.
    problem_id: check-x377-mro-names
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 12 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
