subtopic_id: py.datastructs.list
items:
- id: X324
  difficulty: 3
  type: write_code
  minutes: 12
  prompt_md: 'Viết `rotate_and_dedup(xs, k)`: xoay list `xs` sang phải `k` vị trí (`k` có thể lớn hơn
    `len(xs)`, list có thể rỗng), rồi loại phần tử trùng chỉ giữ lần đầu. Trả về list mới, không sửa `xs`.
    Gợi ý: `k %= len(xs)`, slicing, và `set` để nhớ giá trị đã gặp.

    '
  problem_id: check-rotate-and-dedup
  rubric_md: 'Pass toàn bộ test ẩn (list rỗng, k=0, k bội của len, k rất lớn). Đúng, trong time-box, tự
    giải thích rõ: bằng chứng điểm 3; lỗi biên k=0 / rỗng hoặc đổi thứ tự khi bỏ trùng: chưa đạt mức 3.'
