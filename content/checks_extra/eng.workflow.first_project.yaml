subtopic_id: eng.workflow.first_project
items:
  - id: E106
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Một ý tưởng dự án nhỏ đầu tiên tốt cần thỏa những điều gì? Kể ít nhất ba tiêu chí.
    answer_md: |
      - **Nhỏ**: làm xong trong khoảng 1-2 tuần, tự làm một mình được.
      - **Đầu vào và đầu ra rõ** (ví dụ đọc file CSV rồi in báo cáo).
      - **Tóm được trong một câu**: "Chương trình X giúp Y làm Z."
      - (Thêm) chia được thành 5-8 việc nhỏ, mỗi việc chạy được.
    rubric_md: "Đạt khi nêu đúng ít nhất ba tiêu chí trong {nhỏ/làm xong 1-2 tuần, đầu vào/đầu ra rõ, tóm được một câu, chia được thành việc nhỏ chạy được}. Đủ ba: bằng chứng điểm 1; chỉ nêu một hai tiêu chí hoặc nêu ý tưởng quá to: điểm 0."
  - id: E107
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Bạn bè gửi repo dự án đầu tiên để nhờ bạn nhận xét. Repo có 1 commit tên `update` chứa toàn
      bộ code, không có README, file `.env` chứa API key nằm trong repo, và bạn không biết chạy
      chương trình bằng lệnh nào. (1) Nêu ít nhất **3 vấn đề** của repo này. (2) Với mỗi vấn đề, nêu
      cách sửa. (3) Nếu API key đã bị đẩy lên GitHub, phải làm gì ngoài việc xóa file?
    answer_md: |
      (1)+(2) Các vấn đề và cách sửa:
      - **Không có README**: thêm README ghi dự án làm gì, lệnh cài/chạy cụ thể và một ví dụ
        đầu vào/đầu ra.
      - **Một commit khổng lồ `update`**: từ giờ commit nhỏ sau mỗi việc chạy được với lời nhắn rõ
        ("Thêm đọc file chi tiêu"); tính năng mới làm trên nhánh rồi mở PR.
      - **`.env` chứa khóa trong repo**: `git rm --cached .env` để ngừng theo dõi rồi thêm `.env`
        vào `.gitignore` (chỉ `.gitignore` không gỡ file đã theo dõi), dùng file mẫu
        (`.env.example`) không có giá trị thật.
      - (Thêm) thiếu file liệt kê thư viện (`requirements.txt`), thiếu thư mục/test gọn gàng.

      (3) Coi khóa đó là **đã lộ**: **thu hồi và tạo khóa mới** (rotate) ở nhà cung cấp, vì xóa file
      hay commit sau đó không xóa được khóa khỏi lịch sử Git và các bản sao.
    rubric_md: "Đạt khi: (a) nêu ít nhất 3 vấn đề đúng (README, lịch sử commit, khóa trong repo, thiếu hướng dẫn chạy); (b) mỗi vấn đề có cách sửa hợp lý; (c) nói được phải thu hồi/đổi khóa đã lộ chứ không chỉ xóa file. Đúng cả ba trong time-box: bằng chứng điểm 2. Thiếu phần đổi khóa hoặc thiếu cách sửa: tối đa điểm 1."
  - id: E108
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Nhà tuyển dụng bảo: "Hãy kể cho tôi về dự án code của bạn" (ví dụ app ghi chi tiêu ở terminal
      lưu bằng file). Hãy trình bày theo khung phỏng vấn, nêu **một quyết định có đánh đổi**, và dự
      đoán một câu hỏi "tại sao" kèm cách trả lời. Cũng nêu **bằng chứng trong repo** (Git/README)
      hỗ trợ câu chuyện của bạn.
    answer_md: |
      **Khung kể (~2 phút):**
      1. **Vấn đề**: "Tôi hay quên mình tiêu gì, nên làm chương trình giúp ghi chi tiêu và in báo
         cáo theo tháng ở terminal."
      2. **Tôi làm gì**: phần của mình, chia 6 việc nhỏ (đọc file, thêm khoản, tổng theo tháng,
         xử lý dữ liệu sai...), mỗi việc xong là một commit; thêm test cho hàm chính; thêm tính năng
         báo cáo trên nhánh và mở PR.
      3. **Quyết định và đánh đổi**: lưu bằng **file CSV thay vì database**: đơn giản, không cần
         cài đặt, đủ cho dữ liệu nhỏ; đổi lại khó truy vấn phức tạp, không xử lý nhiều người dùng
         cùng lúc. Nếu dữ liệu lớn hoặc nhiều người dùng sẽ chuyển sang SQLite/database.
      4. **Kết quả và bài học**: chạy được đến đâu, một khó khăn (nhập chữ thay số) và cách xử lý,
         nếu làm lại sẽ đổi gì (ví dụ thêm test sớm hơn).

      **Câu "tại sao" mẫu:** "Vì sao không dùng database?" Trả lời bằng trade-off ở trên, không chối
      rằng database tốt hơn mà nói vì sao file hợp với phạm vi này.

      **Bằng chứng trong repo:** README chạy theo được, lịch sử commit nhỏ rõ ràng, PR/nhánh tính
      năng, các quyết định ghi trong README hoặc lời nhắn commit.
    rubric_md: "Đạt mức 3 (mức phỏng vấn) khi: (a) kể đủ các phần vấn đề, phần của mình, quyết định/đánh đổi, kết quả/bài học; (b) nêu một đánh đổi cụ thể có cả mặt được và mất, và trả lời nhất quán câu hỏi tại sao; (c) chỉ ra bằng chứng trong repo (README, commit nhỏ, nhánh/PR). Đúng, trong time-box, nói rõ phần của mình: bằng chứng điểm 3. Thiếu đánh đổi hoặc chỉ kể tính năng không có quyết định: chưa đạt mức 3."
