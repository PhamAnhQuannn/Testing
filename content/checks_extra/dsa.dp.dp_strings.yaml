subtopic_id: dsa.dp.dp_strings
items:
  - id: X477
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      s, t = "abcb", "bcb"
      n, m = len(s), len(t)
      dp = [[0] * (m + 1) for _ in range(n + 1)]
      for i in range(1, n + 1):
          for j in range(1, m + 1):
              if s[i - 1] == t[j - 1]:
                  dp[i][j] = dp[i - 1][j - 1] + 1
              else:
                  dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])
      print(dp[n])
      print(dp[2][2], dp[n][m])
    expected_output: "[0, 1, 2, 3]\n1 3"
    answer_md: 'Đây là bảng LCS của "abcb" và "bcb". Hàng cuối `dp[4]` là `[0, 1, 2, 3]` vì LCS với prefix "b", "bc", "bcb" lần lượt là 1, 2, 3. Ô `dp[2][2]` là LCS của "ab" và "bc" bằng 1 ("b"), còn `dp[n][m]` là 3 ("bcb").'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X478
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết `longest_common_subsequence(text1, text2)`: trả về độ dài dãy con chung dài nhất (LCS) của hai chuỗi. Dãy con giữ thứ tự nhưng được bỏ ký tự; không có ký tự chung thì trả `0`. `longest_common_subsequence("abcde", "ace")` là `3`. Gợi ý: `dp[i][j]` là LCS của hai prefix, khớp thì lấy ô chéo cộng 1, không thì max của ô trên và ô trái.
    problem_id: check-x478-longest-common-subsequence
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X479
    difficulty: 3
    type: write_code
    minutes: 10
    prompt_md: |
      Viết `min_distance(word1, word2)`: trả về số phép ít nhất (chèn, xóa, thay một ký tự) để biến `word1` thành `word2`. `min_distance("horse", "ros")` là `3`. Gợi ý: `dp[i][0] = i`, `dp[0][j] = j`; ký tự cuối khớp thì lấy ô chéo, không thì `1 + min` của ba ô lân cận.
    problem_id: check-x479-edit-distance
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
