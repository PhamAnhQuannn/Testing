subtopic_id: py.core.variables_types
items:
  - id: X002
    difficulty: 2
    type: write_code
    minutes: 5
    prompt_md: |
      Viết `swap_and_describe(n, t)`: `n` là số nguyên, `t` là chuỗi của một số nguyên (ví dụ
      `"10"`). Hãy hoán đổi giá trị của hai tên (để `n` giữ chuỗi, `t` giữ số), rồi trả về một
      danh sách `[...]` gồm đúng 3 phần tử theo thứ tự: (1) tổng của hai giá trị sau khi hoán
      đổi, tính như số; (2) tên kiểu của `n` sau khi hoán đổi; (3) tên kiểu của `t` sau khi hoán
      đổi (tên kiểu là chuỗi như `"int"`, `"str"`). Ví dụ `swap_and_describe(5, "10")` trả về
      `[15, "str", "int"]`.
    problem_id: check-x002
    rubric_md: "Pass toàn bộ test ẩn. Đúng: bằng chứng điểm 2; sai: tối đa điểm 1."
  - id: X314
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: |
      Viết `parse_and_sum(tokens)` nhận danh sách chuỗi. Với mỗi token (bỏ khoảng trắng hai đầu, so sánh không phân biệt hoa thường): nếu là `"true"` tính 1, `"false"` tính 0; nếu `int(token)` được thì cộng số nguyên đó; ngược lại nếu `float(token)` được thì cộng số thực đó; còn lại bỏ qua. Trả tổng dưới dạng chuỗi có đúng 2 chữ số thập phân, ví dụ `"6.50"` (dùng `f"{tong:.2f}"`). Test không chứa `nan`/`inf`.
    problem_id: check-parse-and-sum
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 12 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
