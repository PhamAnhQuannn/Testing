subtopic_id: py.core.variables_types
items:
  - id: X002
    difficulty: 2
    type: write_code
    minutes: 5
    prompt_md: |
      Viết `swap_and_describe(n, t)`: `n` là số nguyên, `t` là chuỗi của một số nguyên. Hoán đổi
      hai tên bằng `n, t = t, n`, rồi trả về danh sách
      `[int(n) + t, type(n).__name__, type(t).__name__]`.
    problem_id: check-x002
    rubric_md: "Pass toàn bộ test ẩn. Đúng: bằng chứng điểm 2; sai: tối đa điểm 1."
