subtopic_id: py.core.loops
items:
  - id: F203
    practices: [verify, review]
    difficulty: 2
    type: write_code
    minutes: 5
    prompt_md: |
      Hàm `sum_positives(nums)` (do AI viết) phải trả tổng các số dương trong `nums`, nhưng đang bỏ sót
      một số phần tử. Tìm và sửa bug để pass mọi test.
    problem_id: fix-sum-positives
    concepts: [break-thoat-khoi-vong-lap-ngay-continue]
    rubric_md: "Sửa đúng bug, pass toàn bộ test ẩn không cần gợi ý trong time-box: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X312
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: |
      Với số nguyên n>1, một bước Collatz: nếu n chẵn thì n = n // 2, nếu lẻ thì n = 3n + 1; lặp đến khi n = 1. Viết `longest_collatz(limit)` trả về số bắt đầu trong khoảng 1..limit (limit >= 1) có số bước để về 1 nhiều nhất; nếu hòa thì trả số nhỏ nhất. Số 1 có 0 bước.
    problem_id: check-collatz-longest
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 12 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
