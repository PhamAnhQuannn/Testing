subtopic_id: dsa.linked_list.ll_manipulation
items:
  - id: X349
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |
      class Node:
          def __init__(self, val, nxt=None):
              self.val = val
              self.next = nxt

      head = Node(1, Node(2, Node(3)))
      prev = None
      cur = head
      while cur:
          nxt = cur.next
          cur.next = prev
          prev = cur
          cur = nxt
      out = []
      while prev:
          out.append(prev.val)
          prev = prev.next
      print(out)
    expected_output: "[3, 2, 1]"
    answer_md: Vòng lặp đảo con trỏ next của từng node về node trước (prev/cur/nxt), nên list 1->2->3 thành 3->2->1.
    rubric_md: "Output khớp VÀ giải thích đúng ý đảo con trỏ bằng ba biến prev/cur/nxt. Đúng: bằng chứng điểm 1; sai: điểm 0."
