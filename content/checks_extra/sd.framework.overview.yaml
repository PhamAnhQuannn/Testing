subtopic_id: sd.framework.overview
items:
  - id: S025
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Kể **đúng thứ tự** dàn ý **7 bước** của một buổi phỏng vấn thiết kế hệ thống mức cao (HLD).
    answer_md: |
      1. Làm rõ yêu cầu (clarify requirements)
      2. Ước lượng (estimation)
      3. API
      4. Mô hình dữ liệu (data model)
      5. Sơ đồ tổng thể (high-level design)
      6. Đào sâu chỗ khó (deep dive)
      7. Trade-off và tóm tắt (wrap-up)
    rubric_md: "Đạt khi kể đủ 7 bước đúng thứ tự (chấp nhận diễn đạt tương đương, ví dụ 'tóm tắt' cho bước 7). Đủ và đúng thứ tự: bằng chứng điểm 1. Sai thứ tự hoặc thiếu từ 1 bước trở lên: chưa đạt."
  - id: S026
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một ứng viên có buổi HLD **45 phút** cho đề "Thiết kế Twitter". Đã **15 phút** trôi qua mà bạn
      ấy vẫn đang làm rõ yêu cầu và ước lượng, chưa vẽ gì. (1) Vấn đề ở đây là gì? (2) Đề xuất một
      cách **chia thời gian** hợp lý cho 45 phút theo 7 bước. (3) Theo cách chia đó, phần nào nên dài
      nhất và vì sao?
    answer_md: |
      (1) Vấn đề: **tiêu quá nhiều thời gian ở phần đầu**. Làm rõ yêu cầu chỉ nên ~5 phút và ước
      lượng 3-5 phút; mất 15 phút cho hai bước này nghĩa là sẽ không kịp tới bước đào sâu — đúng chỗ
      ghi điểm nhất. Bạn ấy cần chốt giả định nhanh và chuyển sang dựng thiết kế.
      (2) Chia 45 phút gợi ý: làm rõ yêu cầu ~5, ước lượng 3-5, API + mô hình dữ liệu 5-8, sơ đồ tổng
      thể 10-15, đào sâu chỗ khó 15-20, tóm tắt ~2.
      (3) **Đào sâu chỗ khó (deep dive) nên dài nhất (~15-20 phút)** vì đó là nơi thể hiện chiều sâu
      và cân nhắc đánh đổi — tín hiệu người chấm coi trọng nhất.
    rubric_md: "Đạt khi nêu đủ 3 ý: (1) chỉ ra lỗi tiêu quá nhiều giờ ở phần đầu (yêu cầu/ước lượng chỉ nên vài phút), (2) đưa bảng chia thời gian 45 phút hợp lý theo 7 bước, (3) nói đúng deep dive dài nhất và vì sao. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu ý chẩn đoán lỗi đầu buổi hoặc không chỉ ra deep dive là phần dài nhất: tối đa điểm 1."
  - id: S027
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Giả lập một buổi HLD 45 phút (mock) cho đề "Thiết kế rút gọn link". Hãy chứng tỏ mức phỏng vấn:
      (1) kể đúng **7 bước** theo thứ tự và gắn **số phút** cho từng bước (tổng ~45 phút); (2) với mỗi
      bước nói một câu bạn sẽ **nói to** (think aloud) để người phỏng vấn biết bạn đang ở đâu; (3) nêu
      khi nào bạn **kiểm tra lại** với người phỏng vấn và bạn sẽ làm gì nếu giữa chừng họ hỏi "nếu
      lưu lượng gấp 100 lần?".
    answer_md: |
      (1) 7 bước với thời lượng: làm rõ yêu cầu (~5') → ước lượng (3-5') → API (trong 5-8') → mô hình
      dữ liệu (nốt 5-8') → sơ đồ tổng thể (10-15') → đào sâu chỗ khó (15-20') → trade-off và tóm tắt
      (~2'), tổng ~45 phút.
      (2) Mỗi bước một câu nói to định vị, ví dụ: "Em làm rõ yêu cầu trước: cần tạo link ngắn và chuyển
      hướng, đúng không ạ?" → "Giờ em ước lượng: giả định 100 triệu link/ngày." → "Em định nghĩa API
      `POST /shorten` và `GET /{code}`." → "Mô hình dữ liệu: bảng ánh xạ code ↔ URL gốc." → "Em vẽ sơ
      đồ tổng thể: client → app server → DB, thêm cache cho đọc." → "Giờ em đào sâu điểm nghẽn: sinh
      mã và đọc nóng." → "Tóm lại, đánh đổi chính là..."
      (3) **Kiểm tra lại** sau mỗi bước ("chỗ này ổn chưa ạ, em đi tiếp nhé?") để bắt gợi ý. Nếu giữa
      chừng họ hỏi "gấp 100 lần?", hiểu đó là tín hiệu chuyển sang **đào sâu**: định vị mình đang ở
      đâu, nói to suy nghĩ, chỉ ra vài điểm nghẽn (đọc nóng → cache/read replica; ghi nhiều → sharding)
      rồi đi sâu một chỗ — không lờ câu hỏi, không ném buzzword.
    rubric_md: "Đạt (mức phỏng vấn) khi: (1) đủ 7 bước đúng thứ tự kèm số phút cộng lại hợp lý cho ~45 phút; (2) mỗi bước có một câu nói to định vị mình đang ở đâu; (3) nêu được thói quen kiểm tra lại sau mỗi bước VÀ xử lý đúng câu hỏi 'gấp 100 lần' bằng cách chuyển sang đào sâu (không lờ, không buzzword). Đúng, trong time-box, tự dẫn dắt mạch lạc: bằng chứng điểm 3. Sót một trong ba yêu cầu (thiếu phân bổ thời gian, không think aloud, hoặc xử lý sai gợi ý đổi đề): chưa đạt mức 3."
