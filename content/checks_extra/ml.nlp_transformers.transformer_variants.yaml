subtopic_id: ml.nlp_transformers.transformer_variants
items:
  - id: X715
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
    code: |-
      m = [[1 if j <= i else 0 for j in range(3)] for i in range(2)]
      print(m)
      print(m[1])
    expected_output: "[[1, 0, 0], [1, 1, 0]]\n[1, 1, 0]"
    answer_md: "i chạy 0..1, j chạy 0..2. Hàng i=0: chỉ j=0 thoả j <= 0 nên [1, 0, 0]. Hàng i=1: j=0,1 thoả nên [1, 1, 0]. m[1] là hàng thứ hai."
    rubric_md: "Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X716
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `causal_mask(n)` trả về causal mask của decoder: list `n` hàng, mỗi hàng `n` số nguyên, phần tử `[i][j]` là `1` nếu `j <= i` (vị trí `i` được nhìn vị trí `j`), ngược lại `0`. Ví dụ `causal_mask(3)` cho `[[1, 0, 0], [1, 1, 0], [1, 1, 1]]` và `causal_mask(1)` cho `[[1]]`.
    problem_id: check-x716-causal-mask
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X717
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao decoder phải che các vị trí tương lai.
    code: |-
      scores = [[2, 5, 1], [3, 1, 4], [0, 2, 6]]
      out = [sum(s for j, s in enumerate(row) if j <= i) for i, row in enumerate(scores)]
      print(out)
      print(sum(1 for i in range(4) for j in range(4) if j <= i))
    expected_output: "[2, 4, 8]\n10"
    answer_md: "Chỉ cộng các cột j <= i. Hàng 0: 2. Hàng 1: 3 + 1 = 4. Hàng 2: 0 + 2 + 6 = 8, nên out = [2, 4, 8]. Số ô được phép với n = 4 là 1 + 2 + 3 + 4 = 10 = n(n+1)/2. Decoder che tương lai vì lúc huấn luyện cả câu được đưa vào một lần; nếu token i thấy token i+1 thì nó biết đáp án của next-token prediction (gian lận), và lúc sinh thật thì token tương lai chưa tồn tại."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng: tránh rò rỉ nhãn (nhìn đáp án) khi huấn luyện next-token và khớp với lúc sinh từng token. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
