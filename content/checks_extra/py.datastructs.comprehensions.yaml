subtopic_id: py.datastructs.comprehensions
items:
- id: X321
  difficulty: 3
  type: write_code
  minutes: 12
  prompt_md: 'Viết `positive_column_sums(rows)`: `rows` là list các hàng số nguyên (độ dài khác nhau).
    Trả về list tổng **các giá trị dương** theo từng cột (cột `j` chỉ tính ở những hàng có đủ cột `j`);
    độ dài kết quả bằng độ dài hàng dài nhất. Gợi ý: list comprehension lồng nhau với điều kiện lọc.

    '
  problem_id: check-positive-column-sums
  rubric_md: 'Pass toàn bộ test ẩn (hàng lệch độ dài, hàng rỗng, toàn số âm). Đúng, trong time-box, tự
    giải thích rõ: bằng chứng điểm 3; sai hàng lệch hoặc quên lọc dương: chưa đạt mức 3.'
