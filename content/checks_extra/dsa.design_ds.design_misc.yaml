subtopic_id: dsa.design_ds.design_misc
items:
  - id: X508
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      class Logger:
          def __init__(self):
              self.last = {}

          def should_print(self, ts, msg):
              if msg in self.last and ts < self.last[msg] + 10:
                  return False
              self.last[msg] = ts
              return True

      lg = Logger()
      print(lg.should_print(1, "x"), lg.should_print(5, "x"), lg.should_print(11, "x"))
      print(lg.should_print(15, "x"), lg.should_print(21, "x"))
      print(lg.last)
    expected_output: "True False True\nFalse True\n{'x': 21}"
    answer_md: 'Lúc 1 in được (lưu 1); lúc 5 bị chặn (5 < 11) nên không đổi; lúc 11 = 1 + 10 nên in được (lưu 11). Lúc 15 < 21 bị chặn; lúc 21 = 11 + 10 in được. Dict cuối cùng là `{''x'': 21}`.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X509
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết `class Logger` có `should_print_message(timestamp, message) -> bool`: timestamp không giảm; trả `True` (và ghi nhận) chỉ khi message chưa được in trong 10 giây gần nhất (chưa từng in hoặc `timestamp >= lần_in_gần_nhất + 10`), ngược lại `False` và không cập nhật. Ví dụ: `(1, "foo")` True, `(2, "bar")` True, `(3, "foo")` False, `(11, "foo")` True. Gợi ý: dict message -> lần in gần nhất.
    problem_id: check-x509-logger-rate-limiter
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X510
    difficulty: 3
    type: write_code
    minutes: 10
    prompt_md: |
      Viết `class BrowserHistory(homepage)` với `visit(url)` (xoá lịch sử tiến), `back(steps) -> str` (lùi tối đa steps, dừng ở trang đầu) và `forward(steps) -> str` (tiến tối đa steps, dừng ở trang cuối); back/forward trả URL hiện tại. Ví dụ: homepage `a`, visit `b`, visit `c`, `back(1)` là `b`, visit `d`, `forward(3)` là `d`. Gợi ý: list các trang + chỉ số hiện tại.
    problem_id: check-x510-browser-history
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
