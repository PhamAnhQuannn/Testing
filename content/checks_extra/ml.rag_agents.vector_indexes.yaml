subtopic_id: ml.rag_agents.vector_indexes
items:
  - id: S295
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Nói ngắn gọn: vì sao **tìm chính xác** (exact / flat / brute-force) trên hàng triệu vector
      nhiều chiều lại quá chậm, và **approximate nearest neighbor (ANN)** giải quyết điều đó bằng
      cách đánh đổi gì?
    answer_md: |
      **Flat search** so vector truy vấn với **từng** vector trong kho rồi lấy k cái gần nhất, nên
      chi phí mỗi truy vấn khoảng **O(N · d)** (N = số vector, d = số chiều). Với hàng triệu vector
      nhiều chiều, mỗi truy vấn tốn hàng tỉ phép tính nên không kịp trả lời thời gian thực.

      **ANN** dùng một chỉ mục để chỉ thăm một phần nhỏ của kho, nhanh hơn rất nhiều (hàng chục đến
      hàng trăm lần). Đổi lại, nó **chấp nhận bỏ sót một ít kết quả** - tức recall < 100%, không bảo
      đảm đúng tuyệt đối như flat. Với RAG / tìm kiếm ngữ nghĩa, recall khoảng 0,95-0,99 thường là
      quá đủ nên đánh đổi này gần như luôn đáng.
    rubric_md: "Đúng khi nêu được: flat so với từng vector, chi phí ~O(N · d) nên chậm ở quy mô lớn; ANN nhanh hơn nhờ chỉ thăm một phần kho, đổi lại chấp nhận giảm recall (xấp xỉ, không đúng tuyệt đối). Đủ hai ý: bằng chứng điểm 1. Thiếu ý đánh đổi recall, hoặc nói ANN 'nhanh hơn mà không mất gì': tối đa điểm 0."
  - id: S296
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một chỉ mục **HNSW** cho tính năng tìm kiếm ngữ nghĩa đang chạy, nhưng người dùng than
      **thỉnh thoảng bỏ sót** tài liệu đúng lẽ ra phải nằm trong top-k (recall thấp). Hãy trình bày:
      (1) nút chỉnh nào trong HNSW điều chỉnh recall và chỉnh theo hướng nào; (2) đánh đổi phải trả
      khi chỉnh như vậy; (3) bạn **đo** để biết đã đạt yêu cầu bằng cách nào.
    answer_md: |
      (1) **efSearch** là nút chỉnh lúc tìm của HNSW. Để tăng recall, **tăng efSearch** - khi đó
      truy vấn thăm nhiều điểm hơn trên đồ thị nên ít bỏ sót láng giềng thật hơn. (Các nút dựng chỉ
      mục như M và efConstruction cũng ảnh hưởng, nhưng efSearch là nút chỉnh ngay khi tìm.)

      (2) Đánh đổi: efSearch lớn hơn → **độ trễ (latency) tăng** vì phải duyệt nhiều node hơn. Vậy
      recall đổi lấy tốc độ. (HNSW cũng vốn tốn bộ nhớ hơn cho đồ thị, nhưng efSearch chủ yếu tác
      động vào trục recall - latency.)

      (3) Dựng một **tập truy vấn thử** và lấy kết quả **flat làm đáp án chuẩn**, rồi tính
      **recall@k** của HNSW ở vài giá trị efSearch (ví dụ 16, 64, 256), đồng thời đo **độ trễ** (ví
      dụ p95). Chọn efSearch nhỏ nhất vẫn đạt recall mục tiêu trong ngân sách độ trễ, thay vì chỉnh
      theo cảm tính.
    rubric_md: "Đạt (điểm 2) khi nêu đúng cả 3: (1) efSearch, tăng lên để tăng recall; (2) đánh đổi là độ trễ tăng (recall đổi lấy tốc độ); (3) đo bằng recall@k so với flat làm chuẩn trên tập truy vấn thử, kèm đo độ trễ, chọn điểm vừa đủ. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Nhầm nút chỉnh (vd nói nprobe cho HNSW), hoặc không nêu được cách đo recall: tối đa điểm 1."
  - id: S297
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      **(Phỏng vấn AI engineer)** Bạn phải thiết kế vector search cho một hệ RAG với **200 triệu**
      đoạn văn bản (chunk), embedding 1024 chiều, yêu cầu **recall@10 ≥ 0,95** và **độ trễ p95 dưới
      ~30 ms**, chạy trên hạ tầng có RAM giới hạn. Hãy trình bày:
      (1) bạn **chọn loại chỉ mục ANN nào và vì sao** (cân nhắc HNSW, IVF, PQ / IVF-PQ theo recall -
      latency - memory);
      (2) bạn **chỉnh nút nào** (efSearch hay nprobe) theo hướng nào để đạt yêu cầu, và **đo** bằng
      gì để chứng minh đã đạt;
      (3) một lưu ý triển khai: **metric** nên dùng gì và nếu cần **lọc theo metadata** thì pre-filter
      so với post-filter khác nhau ra sao.
    answer_md: |
      **(1) Chọn chỉ mục:** Ở 200 triệu vector 1024 chiều, lưu vector thô dạng float32 cần khoảng
      200 triệu × 1024 × 4 byte ≈ 800 GB - vượt RAM thông thường, nên **bộ nhớ là ràng buộc chính**.
      HNSW thuần cho recall/latency tốt nhất nhưng tốn RAM nhất (phải giữ cả đồ thị lẫn vector), khó
      vừa ở quy mô này trên một máy. Lựa chọn hợp lý là **IVF-PQ** (gom cụm bằng IVF để thu hẹp vùng
      tìm, PQ nén vector để vừa RAM), chấp nhận PQ làm giảm recall một chút và bù lại bằng cách tăng
      nprobe; nếu RAM cho phép hoặc đã sharding thì có thể dùng HNSW (hoặc HNSW trên vector đã nén)
      để ưu tiên recall/latency. Điểm mấu chốt là **biện minh theo ràng buộc RAM và quy mô**, không
      chọn mặc định một cách máy móc.

      **(2) Chỉnh nút và đo:** Với IVF-PQ, nút chính là **nprobe** - tăng nprobe để kéo recall@10
      lên tới 0,95, đổi lại độ trễ tăng; với HNSW thì tăng **efSearch** tương tự. Cách đo: lấy một
      tập truy vấn đại diện, tính **kết quả flat làm đáp án chuẩn**, rồi quét vài giá trị
      nprobe/efSearch, mỗi mức ghi lại **recall@10** và **độ trễ p95**. Chọn giá trị **nhỏ nhất vẫn
      đạt recall ≥ 0,95 mà p95 vẫn dưới ~30 ms**; nếu không tồn tại điểm nào thoả cả hai thì phải đổi
      hướng (giảm mức nén PQ, thêm RAM, hoặc sharding ra nhiều máy để chia tải).

      **(3) Lưu ý triển khai:** **Metric** phải khớp cách mô hình embedding được huấn luyện - thường
      là cosine, và nếu chuẩn hoá vector về độ dài 1 thì có thể dùng dot product cho nhanh (tương
      đương cosine). Khi cần **lọc metadata** (ví dụ chỉ lấy tài liệu của một nguồn/khoảng thời
      gian): **pre-filter** lọc theo metadata trước rồi mới tìm vector - chính xác nhưng có thể chậm
      hoặc khó với một số index; **post-filter** tìm vector trước rồi lọc sau - nhanh hơn nhưng dễ
      **thiếu kết quả** nếu phần lớn top-k ban đầu bị lọc rụng, nên khi lọc gắt thường cần lấy dư
      top-k rồi mới lọc, hoặc dùng index có hỗ trợ lọc kèm.
    rubric_md: "Đạt (mức phỏng vấn, điểm 3) khi: (1) chọn chỉ mục có biện minh theo recall - latency - memory, nhận ra RAM là ràng buộc ở quy mô này và đề xuất hợp lý (IVF-PQ cho RAM hạn chế, hoặc HNSW/sharding nếu ưu tiên recall) - không chỉ nêu tên; (2) chỉnh đúng nút (nprobe cho IVF, efSearch cho HNSW) theo hướng tăng recall, VÀ nêu cách đo bằng recall@k so với flat + độ trễ p95, chọn điểm vừa đủ yêu cầu; (3) nêu được metric khớp embedding (cosine/dot, chuẩn hoá) và phân biệt pre-filter so với post-filter. Đúng, trong time-box, tự giải thích rõ: bằng chứng điểm 3. Thiếu phần đo recall/latency để chứng minh, hoặc chọn chỉ mục mà không biện minh theo ràng buộc: chưa đạt mức 3."
