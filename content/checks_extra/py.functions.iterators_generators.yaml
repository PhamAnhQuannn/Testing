subtopic_id: py.functions.iterators_generators
items:
  - id: X393
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      def gen():
          print("start")
          yield 1
          yield 2

      g = gen()
      print("made")
      print(next(g))
      print(list(g))
      print(list(g))
    expected_output: "made\nstart\n1\n[2]\n[]"
    answer_md: 'Gọi `gen()` chỉ tạo generator nên in `made` trước; thân hàm (in `start`) chỉ chạy ở `next` đầu tiên, trả `1`. `list(g)` lấy nốt `[2]` và làm generator cạn, nên lần sau là `[]` (generator chỉ dùng một lần).'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X394
    difficulty: 2
    type: write_code
    minutes: 5
    prompt_md: |
      Viết `first_evens(nums, k)` trả về list gồm tối đa `k` số chẵn đầu tiên trong `nums`, theo thứ tự xuất hiện. Hãy viết một generator dùng `yield` để lọc số chẵn rồi lấy `k` phần tử đầu (ví dụ bằng `itertools.islice`).
    problem_id: check-x394-first-evens
    rubric_md: "Pass toàn bộ test ẩn. Đúng không gợi ý trong time-box (5 phút): bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X395
    difficulty: 3
    type: write_code
    minutes: 10
    prompt_md: |
      Viết `drain_twice(n)`: định nghĩa generator dùng `yield` sinh các bình phương `1*1, ..., n*n`, tạo MỘT generator, dùng hết nó bằng `list(gen)` hai lần liên tiếp và trả về `[lần_1, lần_2]`. Ví dụ `drain_twice(4)` là `[[1, 4, 9, 16], []]`. Giải thích vì sao lần hai rỗng.
    problem_id: check-x395-drain-twice
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
