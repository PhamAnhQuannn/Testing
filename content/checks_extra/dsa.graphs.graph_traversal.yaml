subtopic_id: dsa.graphs.graph_traversal
items:
  - id: X448
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      from collections import deque

      adj = [[1, 4], [0, 2], [1], [4], [0, 3]]

      def dfs(u, seen, out):
          seen.add(u)
          out.append(u)
          for v in adj[u]:
              if v not in seen:
                  dfs(v, seen, out)
          return out

      def bfs(s):
          seen = {s}
          q = deque([s])
          out = []
          while q:
              u = q.popleft()
              out.append(u)
              for v in adj[u]:
                  if v not in seen:
                      seen.add(v)
                      q.append(v)
          return out

      print(*dfs(0, set(), []))
      print(*bfs(0))
    expected_output: "0 1 2 4 3\n0 1 4 2 3"
    answer_md: 'DFS từ 0 đi sang 1 rồi xuống 2 (hết đường), quay lại 0 mới sang 4 rồi 3, nên `0 1 2 4 3`; BFS thăm lớp {1, 4} trước rồi mới tới 2 và 3, nên `0 1 4 2 3`.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
