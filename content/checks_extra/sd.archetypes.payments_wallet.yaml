subtopic_id: sd.archetypes.payments_wallet
items:
  - id: S199
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Nói ngắn gọn: trong hệ thanh toán, **sổ cái kép (double-entry ledger)** ghi một biến động tiền
      như thế nào, và vì sao ta **không sửa số dư tại chỗ** mà chỉ **thêm dòng (append-only)**?
    answer_md: |
      Mỗi biến động ghi thành **cặp dòng cân nhau**: một dòng **nợ (debit)** và một dòng **có
      (credit)** có tổng bằng 0 (A -100k, B +100k). Ta **chỉ thêm dòng**, không sửa số dư trực tiếp;
      **số dư = tổng các dòng** của tài khoản. Lý do: giữ **dấu vết bất biến (audit trail)** để truy
      soát và cho phép kiểm bất biến "tổng mọi dòng toàn hệ = 0" (không tiền nào tự sinh/mất).
    rubric_md: "Đúng khi nêu cả hai: (1) biến động = cặp nợ/có cân nhau, số dư = tổng các dòng; (2) append-only để giữ audit trail/kiểm bất biến. Đủ cả hai ý: điểm 1; thiếu một vế (chỉ nói cặp dòng mà không nói vì sao append-only, hoặc ngược lại): tối đa điểm 0."
  - id: S200
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Khách bấm "mua 100k" trên ví. Mạng chập chờn nên app **gửi lại lệnh 3 lần**, và cùng lúc một
      lệnh rút khác cũng chạm vào ví đó. Hãy nêu cơ chế để: (1) 3 lần gửi chỉ trừ tiền **một lần**;
      (2) không bị **chi vượt số dư (double-spend)** khi hai lệnh chạy đồng thời; (3) nếu lệnh gọi
      **cổng thanh toán bị timeout** (không rõ đã trừ chưa) thì xử lý ra sao.
    answer_md: |
      (1) **Mã chống lặp (idempotency key):** app sinh một mã duy nhất cho ý định mua này và gửi kèm
      cả 3 lần; server lưu kết quả theo mã, lần sau thấy mã cũ thì **trả kết quả cũ**, không ghi sổ
      lần nữa — đạt **hiệu ứng đúng một lần (exactly-once effect)**.
      (2) **Ghi nợ có điều kiện/nguyên tử (conditional/atomic debit)** hoặc **khoá dòng tài khoản**:
      kiểm "đủ số dư" và ghi dòng trừ trong **một giao dịch không tách rời**, nên hai lệnh đồng thời
      không cùng đọc rồi cùng ghi làm ví âm.
      (3) Timeout là **kết quả không rõ**, không phải thất bại: **hỏi cổng trạng thái** lệnh cũ trước,
      hoặc **retry với chính mã chống lặp cũ** để cổng trả kết quả cũ thay vì trừ lần hai; tuyệt đối
      không gửi lại như một lệnh mới.
    rubric_md: "Đạt khi nêu đúng cả 3 ý: idempotency key cho đú-một-lần; conditional/atomic debit (hoặc khoá) chống double-spend; timeout thì query-before-retry hoặc dùng lại cùng mã. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu ý chống double-spend hoặc xử lý timeout sai (gửi lệnh mới): tối đa điểm 1."
  - id: S201
    difficulty: 3
    type: concept
    minutes: 12
    prompt_md: |
      Thiết kế dịch vụ **chuyển tiền P2P** từ ví A sang ví B nằm trên **hai dịch vụ khác nhau**, có
      gọi **cổng thanh toán** ngoài. Trình bày thiết kế đầy đủ sao cho **không trừ tiền hai lần**:
      (1) nguồn sự thật và cách ghi một lần chuyển; (2) di chuyển tiền xuyên dịch vụ bằng cơ chế gì
      và **bước bù (compensating action)** có tính chất gì; (3) tích hợp cổng qua webhook và xử lý
      **timeout không rõ kết quả**; (4) **đối soát (reconciliation)** để bắt lệch. Nêu rõ điều gì giữ
      cho một lệnh bị thử lại vẫn chỉ chuyển tiền một lần.
    answer_md: |
      (1) **Sổ cái kép append-only** là nguồn sự thật: một lần chuyển = cặp dòng cân nhau (A -X,
      B +X); số dư = tổng các dòng; giữ bất biến "tổng toàn hệ = 0" và audit trail bất biến. Ghi nợ A
      bằng **conditional/atomic debit** để chống **double-spend**.
      (2) Vì A và B ở **hai dịch vụ**, dùng **saga**: chuỗi bước cục bộ (trừ A, rồi cộng B), mỗi bước
      có **bước bù** để quay lại khi bước sau hỏng (đã trừ A mà cộng B lỗi thì chạy bù "hoàn lại A").
      **Mỗi bước và mỗi bước bù phải idempotent**; trao đổi message dùng **at-least-once + khử trùng
      lặp**. (Nếu A và B chung một DB thì một **giao dịch ACID/2PC** là gọn hơn.)
      (3) Gọi cổng **kèm idempotency key**; webhook của cổng có thể **trùng/không đúng thứ tự** nên bộ
      nhận phải **idempotent + xác thực chữ ký**, cập nhật **vòng đời trạng thái** (authorize ->
      capture -> settle -> refund) kiểu chỉ-tiến. **Timeout** = kết quả không rõ: **hỏi trạng thái
      trước khi retry**, hoặc retry **cùng mã cũ**; không tạo lệnh mới.
      (4) **Đối soát** định kỳ: so sổ cái của ta với báo cáo cổng/ngân hàng, tìm khoản lệch và cảnh
      báo để xử lý thủ công.
      Giữ cho retry an toàn: **idempotency key** ở cả lệnh nội bộ lẫn lời gọi cổng, **khử trùng lặp**
      message, và **bước bù idempotent** — gửi lại bao nhiêu lần, tiền cũng chỉ chuyển một lần
      (exactly-once effect).
    rubric_md: "Đạt (mức phỏng vấn, theo mastery bar mức 3) khi đủ 4 phần: (1) sổ cái kép append-only + conditional debit; (2) saga + bước bù **idempotent** (hoặc ACID/2PC khi chung DB); (3) cổng qua webhook idempotent + xử lý timeout không rõ kết quả đúng cách; (4) đối soát; và chỉ ra rõ idempotency key/khử trùng lặp là cái giữ cho retry chỉ chuyển tiền một lần. Đúng, mạch lạc, trong time-box: bằng chứng điểm 3. Sót bước bù idempotent, hoặc xử lý timeout sai, hoặc thiếu đối soát: chưa đạt mức 3."
