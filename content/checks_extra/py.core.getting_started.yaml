subtopic_id: py.core.getting_started
items:
  - id: X001
    difficulty: 2
    type: write_code
    minutes: 5
    prompt_md: |
      Viết `pages_needed(items, per_page)` trả về số trang cần để hiển thị `items` mục khi mỗi
      trang chứa tối đa `per_page` mục (trang cuối chưa đầy vẫn tính). Dùng `import math`.
    problem_id: check-x001
    rubric_md: "Pass toàn bộ test ẩn. Đúng: bằng chứng điểm 2; sai: tối đa điểm 1."
  - id: X311
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: |
      Viết `format_receipt(items)`; mỗi phần tử là chuỗi `"tên,số_lượng,giá_xu"` (giá là số nguyên xu). Trả về một chuỗi nhiều dòng (nối bằng `"\n"`, không có `\n` ở cuối): mỗi mặt hàng một dòng dạng `"tên x<số_lượng> <thành_tiền>"` với thành tiền = số_lượng*giá hiển thị dạng đô la có đúng 2 chữ số thập phân (ví dụ 1250 xu -> `12.50`), sau cùng là dòng `"TOTAL <tổng>"`. Danh sách rỗng chỉ trả `"TOTAL 0.00"`. Chỉ dùng số nguyên, không dùng float.
    problem_id: check-format-receipt
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 12 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
