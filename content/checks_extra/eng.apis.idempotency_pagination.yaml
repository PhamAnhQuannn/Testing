subtopic_id: eng.apis.idempotency_pagination
items:
  - id: E115
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      **Idempotent** nghĩa là gì? Nêu các HTTP method tự nhiên idempotent và một method không idempotent.
    answer_md: |
      Một thao tác **idempotent** khi áp dụng **một lần hay nhiều lần** đều cho **cùng kết quả cuối**.
      **GET**, **PUT**, **DELETE** tự nhiên idempotent (ví dụ DELETE xóa xong, xóa lại vẫn là "đã xóa").
      **POST** thường **không** idempotent: gửi hai lần có thể tạo hai tài nguyên (hai khoản thanh toán).
    rubric_md: "Đạt khi định nghĩa đúng (nhiều lần = như một lần) và nêu đúng GET/PUT/DELETE idempotent, POST không. Đủ: bằng chứng điểm 1; xếp POST là idempotent hoặc không nêu được định nghĩa: điểm 0."
  - id: E116
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Bạn thiết kế `POST /payments`. App mobile hay bị timeout nên gửi lại yêu cầu. (1) Vì sao có
      nguy cơ trừ tiền hai lần? (2) Dùng **Idempotency-Key** thế nào để retry an toàn (client và
      server làm gì)? (3) Với một feed tin tức có bài mới liên tục được thêm, bạn chọn **offset** hay
      **cursor** pagination và vì sao?
    answer_md: |
      (1) POST không idempotent: nếu lần đầu server đã xử lý nhưng phản hồi bị mất (timeout), client
      gửi lại và server tạo **thêm một** khoản thanh toán.
      (2) **Client** sinh một key duy nhất (UUID) cho mỗi ý định thanh toán, gửi trong header
      `Idempotency-Key` và **giữ nguyên key khi retry**. **Server** lần đầu xử lý rồi **lưu key → kết quả**
      (status + body); khi thấy lại cùng key thì **trả kết quả đã lưu**, không xử lý lại. Yêu cầu
      thật sự mới dùng key mới.
      (3) Chọn **cursor (keyset)**: cursor neo vào khóa của dòng cuối trang trước (ví dụ `created_at` + `id`),
      nên bài mới chèn vào không làm lặp hoặc sót dòng và truy vấn vẫn nhanh nhờ index. Offset sẽ bị
      dịch vị trí khi có insert và chậm khi offset lớn.
    rubric_md: "Đạt khi nêu đủ 3 ý: (1) lý do POST không idempotent + phản hồi bị mất dẫn tới trừ tiền đôi, (2) client giữ nguyên key khi retry và server lưu key->kết quả, replay trả kết quả cũ, (3) chọn cursor cho feed thay đổi liên tục kèm lý do (không lặp/sót, nhanh). Đủ và đúng trong time-box: bằng chứng điểm 2. Thiếu việc server lưu/trả kết quả cũ, hoặc chọn offset cho feed động: tối đa điểm 1."
  - id: E117
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Bạn xây API công khai cho một ứng dụng đặt hàng. Hãy mô tả trọn vẹn: (a) cách làm `POST /orders`
      an toàn khi client retry, kể cả khi hai request cùng key đến gần như đồng thời; (b) thiết kế
      phân trang cho `GET /orders` (offset hay cursor, cursor gồm gì, vì sao cần tie-breaker, đánh đổi
      so với offset); (c) rate limiting: mã trả về, header, ý tưởng token bucket, và client nên phản
      ứng thế nào.
    answer_md: |
      **(a)** Client gửi `Idempotency-Key` (UUID) cho mỗi đơn, giữ nguyên key khi retry. Server lưu
      key → kết quả (kèm trạng thái "đang xử lý"); lần đầu xử lý rồi lưu kết quả, các lần sau cùng key
      trả lại kết quả đã lưu. Khi hai request cùng key đến gần như đồng thời, dùng ràng buộc
      **unique** trên key (hoặc lock) để chỉ một request thực thi, request kia chờ hoặc nhận lỗi
      xung đột/kết quả đã lưu; không tạo hai đơn.
      **(b)** Dùng **cursor (keyset)** cho danh sách lớn/thay đổi: cursor là chuỗi **opaque** mã hóa
      khóa sắp xếp của dòng cuối (ví dụ `created_at` + `id`); truy vấn `WHERE (created_at, id) < (...)
      ORDER BY created_at DESC, id DESC LIMIT n`. **Tie-breaker** `id` cần vì nhiều dòng có thể cùng
      `created_at`, thiếu nó sẽ lặp/sót dòng. Cursor nhanh ở mọi độ sâu và ổn định khi có insert;
      đánh đổi: khó nhảy tới trang N, khó có tổng số trang. Offset đơn giản, nhảy trang được, nhưng chậm
      khi offset lớn và dễ lặp/sót khi dữ liệu thay đổi.
      **(c)** Vượt mức trả **`429 Too Many Requests`** kèm **`Retry-After`**. **Token bucket**: mỗi
      key có xô tối đa N token, mỗi request lấy 1 token, xô được nạp lại đều; cho phép burst ngắn,
      giữ tốc độ trung bình. Client gặp 429 thì chờ theo `Retry-After` (hoặc exponential backoff),
      không retry dồn dập.
    rubric_md: "Đạt mức 3 (mức phỏng vấn) khi: (a) Idempotency-Key với server lưu key->kết quả, replay trả kết quả cũ, và nhắc xử lý request đồng thời cùng key (unique/lock); (b) chọn cursor, mô tả cursor mã hóa khóa sắp xếp + tie-breaker, nêu đánh đổi với offset (nhanh/ổn định vs khó nhảy trang); (c) 429 + Retry-After, ý tưởng token bucket, client chờ/backoff. Đủ cả ba, trong time-box: bằng chứng điểm 3. Thiếu tie-breaker/đồng thời hoặc thiếu Retry-After/token bucket: chưa đạt mức 3."
