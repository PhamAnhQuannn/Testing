subtopic_id: py.errors_modules.modules_packages
items:
  - id: X417
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      src = "print('A', __name__)\nif __name__ == '__main__':\n    print('B')"
      exec(src, {"__name__": "__main__"})
      exec(src, {"__name__": "util"})
    expected_output: "A __main__\nB\nA util"
    answer_md: 'Lần đầu `__name__` là `"__main__"` nên in `A __main__` rồi nhánh `if` chạy in `B`. Lần hai `__name__` là `"util"` (như khi bị import) nên chỉ in `A util`, nhánh `if` bị bỏ qua.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X418
    difficulty: 2
    type: write_code
    minutes: 5
    prompt_md: |
      Viết `run_both(code)`: thực thi chuỗi mã `code` hai lần, mỗi lần trong một namespace (dict) mới, có sẵn list `log` mới. Lần 1 với `__name__ = "__main__"`, lần 2 với `__name__ = "mymod"`. Trả `[log_lan_1, log_lan_2]`.
    problem_id: check-x418-run-main-guard
    rubric_md: "Pass toàn bộ test ẩn. Đúng không gợi ý trong time-box (5 phút): bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X419
    difficulty: 3
    type: write_code
    minutes: 10
    prompt_md: |
      Viết `resolve_relative(package, level, name)` trả tên module tuyệt đối của `from <dấu chấm * level><name> import ...` viết trong một module thuộc package `package` (ví dụ `"app.sub"`). `level = 0` là absolute import: trả `name`. `level = 1` là package hiện tại, `level = 2` là package cha, v.v. `name` có thể là chuỗi rỗng (ví dụ `from .. import x`). Nếu `level` vượt quá độ sâu của `package` thì trả `"error"`. Ví dụ `resolve_relative("app.sub", 2, "utils")` là `"app.utils"`.
    problem_id: check-x419-resolve-relative
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
