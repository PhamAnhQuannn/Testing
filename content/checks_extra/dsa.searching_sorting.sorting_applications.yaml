subtopic_id: dsa.searching_sorting.sorting_applications
items:
  - id: X350
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |
      words = ["bb", "a", "ccc", "dd"]
      print(sorted(words, key=lambda w: (-len(w), w)))
    expected_output: "['ccc', 'bb', 'dd', 'a']"
    answer_md: Key tuple sắp theo độ dài giảm dần (-len), rồi theo chữ cái tăng dần để phá hòa; "bb" đứng trước "dd".
    rubric_md: "Output khớp VÀ giải thích đúng key tuple hai khoá. Đúng: bằng chứng điểm 1; sai: điểm 0."
