subtopic_id: cs.networks.tcp_udp
items:
  - id: X828
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
    code: |-
      received = [(0, 100), (100, 100), (300, 50), (200, 100)]
      nxt = 0
      for seq, n in received:
          if seq == nxt:
              nxt += n
          print(nxt)
    expected_output: "100\n200\n200\n300"
    answer_md: "Ack là byte kế tiếp mong đợi. (0,100) khớp nxt=0 nên nxt=100. (100,100) khớp nên nxt=200. (300,50) bị lệch (mong 200) nên nxt vẫn 200 (duplicate ack). (200,100) khớp nên nxt=300."
    rubric_md: "Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X829
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `reassemble(segments)` mô phỏng việc TCP ghép lại byte stream theo thứ tự. `segments` là list các `[seq, data]`: `seq` là số nguyên không âm (offset byte), `data` là chuỗi, các byte của nó chiếm offset `seq` đến `seq + len(data) - 1`. Segment có thể đến lộn xộn hoặc bị trùng. Sắp xếp theo `seq` tăng dần (stable: cùng `seq` giữ thứ tự đầu vào), rồi duyệt với `nxt = 0`: nếu `seq == nxt` thì nối `data` và `nxt += len(data)`; nếu `seq < nxt` (đã phủ, trùng hoặc chồng lấn) thì bỏ qua cả segment; nếu `seq > nxt` (có khoảng trống) thì DỪNG. Trả về chuỗi đã ghép từ offset 0 đến khoảng trống đầu tiên; rỗng thì trả `""`. Ví dụ `[[5,"world"],[0,"hello"]]` cho `"helloworld"`.
    problem_id: check-x829-reassemble
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X830
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao `tcp` cho kết quả đúng còn `udp` thì không.
    code: |-
      def tcp(segs):
          nxt = 0
          out = ""
          for seq, d in sorted(segs):
              if seq == nxt:
                  out += d
                  nxt += len(d)
              elif seq < nxt:
                  continue
              else:
                  break
          return out


      def udp(segs):
          return "".join(d for _, d in segs)


      segs = [(2, "cd"), (0, "ab"), (2, "cd"), (6, "gh"), (4, "ef")]
      print(tcp(segs))
      print(udp(segs))
      print(tcp([(0, "ab"), (4, "ef")]))
      print(len(udp(segs)))
    expected_output: "abcdefgh\ncdabcdghef\nab\n10"
    answer_md: "`tcp` sắp xếp theo seq rồi chỉ nhận segment đúng offset mong đợi: ab (nxt=2), cd (nxt=4), bản trùng cd bị bỏ vì seq 2 < 4, ef (nxt=6), gh (nxt=8) nên ra abcdefgh. `udp` nối theo thứ tự đến, không sắp xếp và không loại trùng nên ra cdabcdghef (10 ký tự). Ở lần gọi thứ ba có khoảng trống ở offset 2 nên tcp dừng sau ab và ef bị giữ lại chờ."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng: TCP sắp xếp lại, loại trùng và dừng ở khoảng trống; UDP giao theo thứ tự đến, không sắp xếp, không loại trùng. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
