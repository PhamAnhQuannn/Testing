subtopic_id: py.core.try_except_basics
items:
  - id: X360
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: "Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng."
    code: |
      def f(s):
          try:
              n = int(s)
          except ValueError:
              print("bad")
              return 0
          else:
              print("ok")
              return n
          finally:
              print("end")

      print(f("5"))
      print(f("x"))
    expected_output: |
      ok
      end
      5
      bad
      end
      0
    answer_md: "`f(\"5\")`: `try` thành công nên `else` in `ok`, `finally` in `end` rồi hàm trả 5. `f(\"x\")`: `int` gây `ValueError`, `except` in `bad`, `finally` in `end`, trả 0."
  - id: X361
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết `safe_divide(pairs)`: `pairs` là list các cặp `[a, b]`. Trả về list kết quả `a // b` cho từng cặp; cặp nào chia cho 0 thì kết quả là chuỗi `"error"`. Dùng `try/except ZeroDivisionError`.
    problem_id: check-x361-safe-divide
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box: bằng chứng điểm 2; phải xem gợi ý hoặc quá thời gian: tối đa điểm 1."
  - id: X362
    difficulty: 3
    type: write_code
    minutes: 10
    prompt_md: |
      Viết `parse_ints(tokens)`: `tokens` là list các chuỗi. Trả về list các số nguyên đổi được bằng `int(...)`, giữ nguyên thứ tự và bỏ qua token không hợp lệ (dùng `try/except ValueError`). Ví dụ `["1", "x", " 3 ", "4.5"]` cho `[1, 3]`.
    problem_id: check-x362-parse-ints
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
