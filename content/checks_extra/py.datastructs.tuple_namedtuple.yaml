    prompt_md: |
      Viết `best_scorer(records)`: `records` là list không rỗng các cặp `[tên, điểm]`. Trả về cặp
      có điểm cao nhất dưới dạng tuple `(tên, điểm)`; nếu nhiều cặp cùng điểm cao nhất thì lấy cặp
      đứng trước. Gợi ý: duyệt bằng `for name, score in records` (unpacking).
    problem_id: check-x006
