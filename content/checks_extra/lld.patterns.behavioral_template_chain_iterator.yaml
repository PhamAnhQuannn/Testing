subtopic_id: lld.patterns.behavioral_template_chain_iterator
items:
  - id: X588
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Giải thích 1 câu vì sao.
    code: |-
      class Handler:
          def __init__(self, mg, tiep=None):
              self.mg = mg
              self.tiep = tiep

          def phat(self, tien):
              so_to = tien // self.mg
              if so_to > 0:
                  print(f"{self.mg} x{so_to}")
              du = tien % self.mg
              if du and self.tiep:
                  self.tiep.phat(du)


      chuoi = Handler(500, Handler(200, Handler(100, Handler(50))))
      chuoi.phat(2350)
    expected_output: "500 x4\n200 x1\n100 x1\n50 x1"
    answer_md: "500 phát 4 tờ (2000), dư 350; 200 phát 1 tờ, dư 150; 100 phát 1 tờ, dư 50; 50 phát 1 tờ, dư 0. Mỗi handler xử lý phần của mình rồi chuyển phần dư cho `self.tiep` (Chain of Responsibility)."
    rubric_md: "Output khớp VÀ nêu mỗi handler chuyển phần dư cho handler kế. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X589
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết hàm `dispense(amount)` theo Chain of Responsibility (tham lam): mệnh giá `[500, 200, 100, 50]` (nghìn). Mỗi mệnh giá lấy nhiều tờ nhất có thể rồi chuyển phần dư cho mệnh giá kế. Trả list các cặp `[mệnh giá, số tờ]` theo mệnh giá giảm dần, chỉ gồm số tờ > 0. Nếu sau cùng còn dư (nhỏ hơn 50 hoặc không chia hết cho 50) thì không nhả được, trả `[]`; `amount = 0` cũng trả `[]`. Ví dụ `dispense(1300)` là `[[500, 2], [200, 1], [100, 1]]`, `dispense(30)` là `[]`.
    problem_id: check-x589-atm-dispense
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X590
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao một dòng log đi qua nhiều handler (Chain of Responsibility, bộ log theo mức).
    code: |-
      class Logger:
          def __init__(self, level, name, tiep=None):
              self.level = level
              self.name = name
              self.tiep = tiep

          def log(self, lvl, msg):
              if lvl >= self.level:
                  print(f"{self.name}: {msg}")
              if self.tiep:
                  self.tiep.log(lvl, msg)


      chain = Logger(1, "debug", Logger(2, "info", Logger(3, "error")))
      chain.log(2, "disk")
      chain.log(3, "crash")
      chain.log(1, "boot")
    expected_output: "debug: disk\ninfo: disk\ndebug: crash\ninfo: crash\nerror: crash\ndebug: boot"
    answer_md: "Mỗi handler ghi nếu mức dòng log `lvl` >= mức của nó, rồi luôn chuyển tiếp cho `self.tiep`. Mức 2 qua debug và info; mức 3 qua cả ba; mức 1 chỉ debug ghi (info, error bỏ qua vì 1 < 2, 1 < 3)."
    rubric_md: "Output khớp từng dòng VÀ giải thích handler ghi theo mức rồi vẫn chuyển tiếp. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
