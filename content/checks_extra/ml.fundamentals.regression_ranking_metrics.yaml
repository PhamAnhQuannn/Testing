subtopic_id: ml.fundamentals.regression_ranking_metrics
items:
  - id: X675
    difficulty: 1
    type: read_code
    minutes: 4
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
    code: |-
      import math
      y = [2, 4, 6, 8]
      p = [3, 4, 5, 10]
      mse = sum((a - b) ** 2 for a, b in zip(y, p)) / len(y)
      print(round(mse, 4))
      print(round(math.sqrt(mse), 4))
    expected_output: "1.5\n1.2247"
    answer_md: 'Sai số 1, 0, −1, 2 nên bình phương 1, 0, 1, 4; MSE = 6/4 = 1,5; RMSE = √1,5 ≈ 1,2247.'
    rubric_md: "Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: 0."
  - id: X676
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết hàm `r_squared(y_true, y_pred)` trả R² = `1 − Σ(y − ŷ)² / Σ(y − ȳ)²` với `ȳ = mean(y_true)`, trên hai danh sách số cùng độ dài. Trả float `round(·, 6)`. Nếu `Σ(y − ȳ)² == 0` (y_true hằng số) trả `0.0`. Ví dụ: `y_true=[3,5,7]`, `y_pred=[2,5,9]` cho `0.375`.
    problem_id: check-x676-r2
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X677
    difficulty: 3
    type: read_code
    minutes: 6
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao MRR chỉ nhìn kết quả đúng đầu tiên.
    code: |-
      import math
      queries = [[0, 1, 0, 1], [0, 0, 1, 0], [1, 0, 0, 0]]
      total = 0.0
      for rel in queries:
          first = next(i + 1 for i, v in enumerate(rel) if v)
          total += 1 / first
          print(round(1 / first, 4))
      print(round(total / len(queries), 4))
      r = [0, 1, 1, 0]
      dcg = sum(v / math.log2(i + 2) for i, v in enumerate(r[:3]))
      ideal = sum(v / math.log2(i + 2) for i, v in enumerate(sorted(r, reverse=True)[:3]))
      print(round(dcg / ideal, 4))
    expected_output: "0.5\n0.3333\n1.0\n0.6111\n0.6934"
    answer_md: 'Reciprocal rank: vị trí đúng đầu tiên là 2, 3, 1 nên 0,5; 0,3333; 1,0; MRR = 1,8333/3 ≈ 0,6111. NDCG@3 cho [0,1,1,0]: DCG = 1/log₂3 + 1/log₂4 ≈ 0,6309 + 0,5 = 1,1309; DCG lý tưởng [1,1,0] = 1 + 0,6309 = 1,6309; tỉ số ≈ 0,6934. MRR chỉ lấy 1/vị trí của kết quả đúng đầu tiên nên bỏ qua các kết quả đúng sau đó.'
    rubric_md: "Output khớp từng dòng VÀ giải thích MRR chỉ xét kết quả đúng đầu tiên. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
