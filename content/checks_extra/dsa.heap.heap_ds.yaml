subtopic_id: dsa.heap.heap_ds
items:
  - id: X434
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: |
      Viết `min_cost_ropes(weights)`: cho list độ dài các sợi dây, mỗi lần nối hai sợi có chi phí bằng tổng độ dài của chúng và tạo ra một sợi mới có độ dài đó. Trả tổng chi phí nhỏ nhất để nối tất cả thành một sợi (0 nếu ít hơn 2 sợi). `min_cost_ropes([4, 3, 2, 6])` là `29`. Gợi ý: luôn nối hai sợi ngắn nhất, dùng min-heap.
    problem_id: check-x434-min-cost-ropes
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 12 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
