subtopic_id: cs.os.page_replacement
items:
  - id: X861
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
    code: |-
      refs = [1, 1, 2, 2, 1]
      cur = None
      faults = 0
      for p in refs:
          if p != cur:
              faults += 1
              cur = p
          print(faults)
    expected_output: "1\n1\n2\n2\n3"
    answer_md: "Với 1 frame, chỉ truy cập page khác page đang nằm trong frame mới là fault. Chuỗi 1,1,2,2,1 cho số fault dồn lại là 1, 1, 2, 2, 3."
    rubric_md: "Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X862
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `fifo_faults(refs, frames)` mô phỏng page replacement **FIFO**. `refs` là list số nguyên (reference string), `frames` là số nguyên >= 1 (số frame). Nếu page đang nằm trong frame thì không fault; nếu không thì là một page fault, và khi frame đã đầy phải đuổi page **vào sớm nhất** rồi nạp page mới. Trả về tổng số page fault; `refs` rỗng trả `0`. Ví dụ `fifo_faults([1,2,3,4,1,2,5,1,2,3,4,5], 3)` cho `9`, còn với `4` frame cho `10`.
    problem_id: check-x862-fifo-faults
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X863
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao LRU lại fault nhiều hơn FIFO trên chuỗi này (khái niệm gì, LRU có luôn tốt hơn FIFO không).
    code: |-
      refs = [1, 2, 1, 3, 2]
      fifo = []
      lru = []
      ff = 0
      lf = 0
      for p in refs:
          if p not in fifo:
              ff += 1
              if len(fifo) == 2:
                  fifo.pop(0)
              fifo.append(p)
          if p in lru:
              lru.remove(p)
          else:
              lf += 1
              if len(lru) == 2:
                  lru.pop(0)
          lru.append(p)
      print(ff, lf)
      print(fifo)
      print(lru)
    expected_output: "3 4\n[2, 3]\n[3, 2]"
    answer_md: "FIFO (2 frame): 1 F, 2 F, 1 hit, 3 F (đuổi 1 vì vào sớm nhất), 2 hit nên 3 fault, frame [2, 3]. LRU: 1 F, 2 F, 1 hit (1 thành mới dùng nhất), 3 F (đuổi 2 vì lâu nhất chưa dùng), 2 F (đuổi 1) nên 4 fault, danh sách [3, 2] (đầu = LRU). LRU dựa trên locality (quá khứ gần dự đoán tương lai gần) nhưng chỉ là heuristic: ở đây page 2 bị đuổi rồi lại được dùng ngay. Không thuật toán online nào luôn tốt hơn; chỉ OPT (biết tương lai) là tối ưu."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng: LRU đuổi page lâu nhất chưa dùng dựa trên locality, đây chỉ là heuristic nên có thể thua FIFO ở một số chuỗi (không luôn tốt hơn). Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
