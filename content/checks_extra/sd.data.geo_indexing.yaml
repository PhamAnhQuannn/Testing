subtopic_id: sd.data.geo_indexing
items:
  - id: S067
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Vì sao một chỉ mục **B-tree** trên (vĩ độ, kinh độ) không trả lời tốt câu hỏi "có gì **gần**
      tôi"? Nêu ý tưởng chung mà mọi chỉ mục không gian (geo-index) dùng để thay thế.
    answer_md: |
      Vị trí là dữ liệu **hai chiều** (2D), còn B-tree chỉ sắp xếp theo **một** chiều: nếu sắp theo
      vĩ độ thì mọi điểm cùng vĩ độ trên khắp thế giới nằm cạnh nhau trong chỉ mục dù cách rất xa, nên
      "gần theo cả hai chiều" không thành một khoảng liên tục để quét. Ý tưởng chung của chỉ mục không
      gian: **chia không gian thành các ô (cell) có tên**, gán mỗi điểm vào ô chứa nó, rồi quy câu "tìm
      gần" về "lấy các điểm trong ô của mình và vài ô quanh đó" — một phép tra theo khóa ô.
    rubric_md: "Đạt khi nêu đúng hai ý: (1) vị trí là 2D nhưng B-tree sắp một chiều nên không gom được 'gần' thành khoảng liên tục; (2) giải pháp là chia không gian thành ô có tên rồi tra theo khóa ô. Đúng cả hai ý: bằng chứng điểm 1; thiếu một vế: tối đa điểm 0."
  - id: S068
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một đồng nghiệp thiết kế "tìm quán gần" bằng geohash: tính geohash của khách rồi trả về mọi quán
      có **cùng** chuỗi geohash với ô của khách. Khi test, một quán cách khách chỉ 50 m đôi khi **không**
      hiện ra. (1) Lỗi này tên là gì và vì sao xảy ra? (2) Sửa thế nào? (3) Sau khi gom dữ liệu theo cách
      đã sửa, còn phải làm bước gì trước khi trả kết quả "trong bán kính 2 km"?
    answer_md: |
      (1) Đây là **vấn đề ô biên (boundary cell problem)**: hai điểm sát nhau có thể rơi vào **hai ô
      geohash khác tên** vì đường biên ô chạy ngay giữa; chỉ xét ô của khách sẽ bỏ sót láng giềng nằm ở
      ô kế bên.
      (2) Sửa bằng cách truy vấn **ô của khách cộng các ô kề** — với lưới vuông là **8 ô kề** (tổng 3×3 =
      9 ô) quanh ô trung tâm; đồng thời chọn **cỡ ô (precision)** sao cho một ô xấp xỉ/lớn hơn bán kính
      tìm để 3×3 ô phủ hết vòng tròn.
      (3) Phải **lọc lại bằng khoảng cách thực**: trong các điểm gom từ 9 ô, chỉ giữ điểm có khoảng cách
      ≤ 2 km (và nếu cần k gần nhất thì sắp theo khoảng cách rồi lấy k đầu), vì các ô kề chứa cả điểm
      ngoài bán kính.
    rubric_md: "Đạt khi nêu đúng cả 3 ý: gọi tên vấn đề ô biên và giải thích điểm sát nhau ở hai ô khác tên; sửa bằng tra ô-của-mình + 8 ô kề (3×3); và lọc lại bằng khoảng cách thật trước khi trả kết quả. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu ý ô kề hoặc thiếu ý lọc khoảng cách thật: tối đa điểm 1."
  - id: S069
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Thiết kế phần tìm-gần cho một app gọi xe: **1 triệu tài xế** báo vị trí mỗi **4 giây**, khách cần
      **5 tài xế gần nhất** trong khu vực. Trình bày theo mức phỏng vấn: (1) **chọn** geohash, quadtree
      hay S2 cho bài toán này và **vì sao** (gắn với ràng buộc); (2) **xử lý ô biên** khi truy vấn k gần
      nhất; (3) **xử lý tần suất cập nhật vị trí** — ước lượng tải ghi và nói lưu ở đâu, ghi thế nào.
    answer_md: |
      (1) **Chọn cấu trúc theo ràng buộc.** Vị trí thay đổi liên tục, nên ưu tiên chỉ mục **cập nhật rẻ**:
      **geohash** (dùng Redis GEO sẵn, cập nhật = đổi khóa ô, tên-chuỗi đơn giản) hoặc **S2** (id số 64-bit
      gọn, lân cận tốt, phủ cầu toàn cầu) hợp hơn **quadtree** — quadtree cho ô co giãn theo mật độ nhưng
      vật thể di chuyển làm điểm chạy giữa các nút, phải tách/gộp nút nên cập nhật đắt. Nếu mật độ cực lệch
      (trung tâm vs ngoại ô) là ưu tiên số một thì mới cân nhắc quadtree, nhưng ở đây tần suất cập nhật
      thắng thế.
      (2) **Ô biên + k gần nhất.** Gom tài xế trong **ô của khách cộng 8 ô kề (3×3)**, chọn cỡ ô xấp xỉ bán
      kính tìm; rồi **tính khoảng cách thật** tới từng tài xế, **sắp xếp** và lấy **5 người gần nhất**. Không
      lấy thẳng từ một ô vì tài xế gần nhất có thể nằm ở ô kề (boundary cell); nếu một vòng 3×3 chưa đủ 5
      người (vùng thưa) thì nới ra vòng ô kế tiếp.
      (3) **Tần suất cập nhật.** Ước lượng: 1.000.000 tài xế / 4 giây ≈ **250.000 ghi/giây** — không thể ghi
      từng cập nhật thành dòng vào DB chính. Giữ **vị trí mới nhất trong RAM** (Redis GEO hoặc dịch vụ
      geo-index riêng), **ghi đè** khóa ô của tài xế mỗi lần báo, **không** lưu lịch sử từng-lần vào DB chính;
      nếu cần lịch sử cho phân tích thì đẩy ra đường riêng, ghi **theo lô (batch)** vào kho rẻ, tách khỏi
      đường tìm-gần nóng.
    rubric_md: "Đạt (mức phỏng vấn) khi làm đủ cả 3 việc của mastery bar: (1) chọn geohash/quadtree/S2 và biện minh bằng ràng buộc (ở đây tần suất cập nhật ⇒ ưu tiên lưới cố định cập nhật rẻ); (2) xử lý ô biên cho k gần nhất = gom ô + 8 ô kề rồi tính khoảng cách thật, sắp lấy k, nới vòng khi thiếu; (3) ước lượng ~250k ghi/giây và quyết định giữ vị trí mới nhất trong RAM/ghi đè, không ghi lịch sử vào DB chính. Đúng, trong time-box, tự giải thích rõ ràng: bằng chứng điểm 3. Sót một trong ba việc (ví dụ quên ô biên hoặc không bàn tải cập nhật): chưa đạt mức 3."
