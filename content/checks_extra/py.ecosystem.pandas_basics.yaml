subtopic_id: py.ecosystem.pandas_basics
items:
  - id: X751
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `group_sum(rows)` mô phỏng `df.groupby("key")["value"].sum()`. `rows` là list các cặp `[key, value]` (key là chuỗi, value là số nguyên). Gom theo key, cộng value của từng nhóm, trả về list các cặp `[key, total]` (mỗi cặp là **list** 2 phần tử) sắp theo key tăng dần. `[]` cho `[]`. Ví dụ `[["a", 3], ["b", 2], ["a", 5]]` cho `[["a", 8], ["b", 2]]`.
    problem_id: check-x751-group-sum
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X752
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao khóa đầu tiên của `total` không phải "a" dù "a" nhỏ hơn "b", khác với `df.groupby` của pandas.
    code: |-
      rows = [("b", 2), ("a", 1), ("b", 3)]
      total = {}
      for k, v in rows:
          total[k] = total.get(k, 0) + v
      print(total)
      print(sorted(total))
      print(list(total.items())[0])
    expected_output: "{'b': 5, 'a': 1}\n['a', 'b']\n('b', 5)"
    answer_md: "dict giữ thứ tự chèn nên 'b' (gặp trước) đứng đầu: {'b': 5, 'a': 1}; b = 2 + 3 = 5 nhờ get(k, 0) làm giá trị khởi tạo. sorted(total) duyệt các khóa và trả list đã sắp ['a', 'b']. Phần tử đầu của items() là ('b', 5). pandas groupby mặc định sort=True nên index đã sắp theo key; với dict thuần phải tự sorted."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng: dict giữ thứ tự chèn, không tự sắp theo key (cần sorted). Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
