subtopic_id: dsa.graphs.graph_representation
items:
  - id: X454
    difficulty: 3
    type: write_code
    minutes: 8
    prompt_md: |
      Viết `count_reachable(n, edges, src)`: đồ thị CÓ HƯỚNG gồm `n` đỉnh đánh số từ 0, `edges` là danh sách cặp `[u, v]` nghĩa là cạnh có hướng `u -> v`. Trả về số đỉnh đi tới được từ `src`, tính cả `src`. `count_reachable(4, [[0, 1], [1, 2], [3, 0]], 0)` là `3`. Gợi ý: dựng danh sách kề từ edge list (chỉ một chiều), rồi DFS/BFS từ `src` và đếm số đỉnh đã thăm.
    problem_id: check-x454-count-reachable
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
