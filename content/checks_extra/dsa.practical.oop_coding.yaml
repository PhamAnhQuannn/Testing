subtopic_id: dsa.practical.oop_coding
items:
  - id: X548
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      class Account:
          def __init__(self, balance):
              self._balance = balance

          def withdraw(self, amount):
              if amount > self._balance:
                  return False
              self._balance -= amount
              return True

          def balance(self):
              return self._balance


      a = Account(10)
      b = a
      print(a.withdraw(4), b.withdraw(7))
      print(a.balance(), b.balance())
      print(a is b)
    expected_output: "True False\n6 6\nTrue"
    answer_md: '`b = a` chỉ thêm một tên cho cùng object nên hai tên chia sẻ một state. `withdraw(4)` thành công (số dư 6), `withdraw(7)` thất bại vì 7 > 6, nên in `True False`; cả hai tên đều thấy số dư `6`, và `a is b` là `True`.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X549
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết `class ShoppingCart` với `add(item, price, qty)` (price và qty là int; thêm item đã có thì cộng dồn qty), `remove(item)` (xoá hẳn dòng của item, bỏ qua nếu không có) và `total()` trả về int là tổng `price * qty` của mọi dòng (giỏ rỗng là 0). Ví dụ: `add("pen", 3, 2)`, `add("book", 10, 1)`, `total()` là `16`.
    problem_id: check-x549-shopping-cart
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X550
    difficulty: 3
    type: write_code
    minutes: 10
    prompt_md: |
      Viết `class Matrix(rows, cols)` khởi tạo ma trận toàn số 0 với `set(r, c, v)`, `get(r, c)` trả int, `transpose()` (đổi chỗ tại chỗ: sau đó `rows` và `cols` hoán đổi, phần tử `(r, c)` thành `(c, r)`) và `dims()` trả `[rows, cols]`. Ví dụ `Matrix(2, 3)`, `set(0, 2, 7)`, `transpose()`, `dims()` là `[3, 2]` và `get(2, 0)` là `7`.
    problem_id: check-x550-matrix
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
