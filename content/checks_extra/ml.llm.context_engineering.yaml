subtopic_id: ml.llm.context_engineering
items:
  - id: S019
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Kể tên những thứ thường chiếm chỗ trong **context window** của một lần gọi LLM, và giải thích
      ngắn gọn vì sao app phải **tự gửi lại lịch sử** trong mỗi request.
    answer_md: |
      Trong context window mỗi lần gọi thường có: **system prompt / hướng dẫn**, **lịch sử hội
      thoại** (các lượt trước), **tài liệu lấy về** (retrieved docs dán kèm), và **định nghĩa tool +
      kết quả tool**. Tất cả phải nằm vừa trong ngân sách token hữu hạn của model.

      App phải tự gửi lại lịch sử vì **API là stateless**: server không nhớ gì giữa các lần gọi, nên
      "bộ nhớ hội thoại" chính là code của bạn gom lịch sử và đính kèm lại mỗi request.
    rubric_md: "Đúng ý: nêu được các thành phần của context (ít nhất system prompt, lịch sử, tài liệu/tool) VÀ nêu đúng lý do stateless (server không nhớ, code tự gửi lại lịch sử). Đủ cả hai vế: bằng chứng điểm 1. Thiếu vế stateless hoặc chỉ liệt kê một thành phần: tối đa điểm 0."
  - id: S020
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một chatbot hỗ trợ chạy liên tục nhiều giờ; hội thoại ngày càng dài và bắt đầu báo lỗi
      **vượt context** (context-length-exceeded). Yêu cầu: vẫn giữ các quyết định quan trọng đã chốt
      từ đầu phiên, mà token mỗi lượt **không phình mãi**. Hãy: (1) nêu cách xử lý ngay khi gặp lỗi
      vượt context; (2) chọn chiến lược quản lý lịch sử lâu dài và nói vì sao; (3) giải thích vì sao
      **cửa sổ trượt thuần** (chỉ giữ N lượt gần nhất) không đủ cho yêu cầu này.
    answer_md: |
      (1) **Bắt lỗi** vượt context rồi **cắt bớt hoặc tóm tắt** lịch sử và **gọi lại**, thay vì để
      request chết.
      (2) Dùng **tóm tắt / compaction** cho các lượt cũ (nén thành vài dòng) kết hợp **memory** cho
      các sự kiện/quyết định bền, rồi nối với vài lượt gần nhất. Cách này giữ token mỗi lượt gần như
      ổn định mà vẫn còn các quyết định quan trọng.
      (3) **Cửa sổ trượt thuần** chỉ giữ N lượt gần nhất nên sẽ **đánh rơi** các quyết định chốt từ
      đầu phiên (nằm ngoài N lượt đó) — đáp ứng được "token không phình" nhưng vi phạm "giữ quyết
      định quan trọng".
    rubric_md: "Đạt (SCORE-2 GATE) khi nêu đúng cả 3 ý: (1) bắt lỗi rồi cắt/tóm tắt và gọi lại; (2) chọn tóm tắt/compaction (và/hoặc memory) với lý do token không phình mà giữ được ý; (3) chỉ ra cửa sổ trượt thuần làm mất quyết định đầu phiên. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu ý compaction/memory hoặc không chỉ ra được nhược điểm của cửa sổ trượt: tối đa điểm 1."
  - id: S021
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Thiết kế **chiến lược context** cho một chatbot dài hơi: trợ lý tra cứu trên một kho tài liệu
      nội bộ ~50k token, phiên kéo dài hàng chục lượt, cần rẻ và nhanh. Hãy trình bày: (1) mỗi lượt
      đưa gì vào context window; (2) quản lý độ dài lịch sử ra sao (cắt/tóm tắt/memory); (3) chọn
      **RAG hay long-context** cho kho tài liệu và nêu đánh đổi; (4) tối ưu chi phí bằng **prompt
      caching** (sắp xếp prompt thế nào) và tránh **lost-in-the-middle**; (5) **ước lượng token cost**
      mỗi request và so sánh thô giữa RAG và long-context.
    answer_md: |
      (1) **Mỗi lượt đưa vào:** system prompt ổn định + memory liên quan (sự kiện/quyết định bền) +
      vài lượt gần nhất (hoặc bản tóm tắt lịch sử cũ) + chỉ các đoạn tài liệu cần cho câu hỏi hiện
      tại + câu hỏi mới.
      (2) **Lịch sử:** cửa sổ trượt giữ vài lượt gần nhất, **tóm tắt/compaction** các lượt cũ thành
      vài dòng, và **memory** ngoài cho sự kiện bền; bắt lỗi vượt context thì tóm tắt rồi gọi lại —
      nhờ vậy token mỗi lượt không phình mãi.
      (3) **RAG** cho kho ~50k token: chỉ tìm và dán vài đoạn liên quan (ví dụ 3 × 500 token) thay vì
      cả kho. Đánh đổi: rẻ và mở rộng được, nhưng cần hạ tầng embedding/vector search và chất lượng
      phụ thuộc bước tìm kiếm. Long-context (dán cả 50k mỗi lượt) đơn giản hơn nhưng tốn token mỗi
      lượt và dễ lost-in-the-middle.
      (4) **Prompt caching:** đặt phần ổn định lên đầu — `[system prompt] → [ngữ cảnh/tài liệu dùng
      lại] → [lịch sử/tóm tắt] → [câu hỏi mới]` — để khớp exact-prefix và đọc cache giá rẻ; đừng để
      câu hỏi (phần đổi) lên đầu. Tránh nhồi: đưa **ít mà trúng**, đặt thông tin quan trọng ở đầu/cuối
      để tránh lost-in-the-middle và context-rot.
      (5) **Token cost ≈ input_tokens × giá_input + output_tokens × giá_output.** Với RAG, input ≈
      system + tóm tắt + ~1,5k token tài liệu + câu hỏi (cỡ vài nghìn token/lượt); với long-context,
      riêng tài liệu đã ~50k token input **mỗi lượt**, nên đắt hơn nhiều lần — và phần tiền tố ổn định
      (system + tài liệu dùng lại) còn được prompt caching làm rẻ thêm. Kết luận: ở phiên dài trên
      kho lớn, RAG + tóm tắt + caching rẻ và nhanh hơn rõ rệt.
    rubric_md: "Đạt mức 3 (INTERVIEW, theo mastery_bar) khi: (1) nêu đúng thành phần context mỗi lượt; (2) quản lý lịch sử bằng cắt + tóm tắt/compaction + memory; (3) chọn RAG cho kho ~50k token và nêu đánh đổi với long-context; (4) sắp prompt (ổn định lên đầu) cho prompt caching và nhận ra lost-in-the-middle; (5) viết đúng công thức token cost và so sánh thô RAG rẻ hơn long-context vì không dán cả kho mỗi lượt. Đúng, trong time-box, tự giải thích rõ ràng và mạch lạc: bằng chứng điểm 3. Sót bước ước lượng token cost hoặc không biện minh được lựa chọn RAG/caching: chưa đạt mức 3."
