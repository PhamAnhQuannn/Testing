subtopic_id: py.datastructs.heapq_bisect
items:
- id: X323
  difficulty: 3
  type: write_code
  minutes: 12
  prompt_md: 'Viết `bisect_ranges(sorted_xs, queries)`: `sorted_xs` đã sắp tăng (có thể trùng). Với mỗi
    `q` trong `queries`, trả về `[lo, hi]` là vị trí chèn trái nhất và phải nhất của `q` (nên `hi - lo`
    = số lần xuất hiện). Gợi ý: `bisect_left` và `bisect_right`.

    '
  problem_id: check-bisect-ranges
  rubric_md: 'Pass toàn bộ test ẩn (list rỗng, giá trị trùng, truy vấn ngoài khoảng). Đúng, trong time-box,
    tự giải thích rõ khác biệt left/right: bằng chứng điểm 3; nhầm left/right hoặc duyệt tuyến tính: chưa
    đạt mức 3.'
