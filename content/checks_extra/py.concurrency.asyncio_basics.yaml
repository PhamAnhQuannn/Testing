subtopic_id: py.concurrency.asyncio_basics
items:
  - id: X732
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
    code: |-
      from collections import deque
      q = deque([("A", 2), ("B", 1)])
      out = []
      while q:
          name, left = q.popleft()
          out.append(name)
          if left > 1:
              q.append((name, left - 1))
      print("".join(out))
      print(len(out))
    expected_output: "ABA\n3"
    answer_md: "A chạy bước 1 rồi quay lại cuối hàng, B chạy một bước và xong, A chạy bước cuối: ABA, tổng 3 bước. Đây là cách event loop round-robin các việc sẵn sàng."
    rubric_md: "Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X733
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `event_loop_order(tasks)`. `tasks` là list các cặp `[tid, nsteps]` (tid là id số nguyên, `nsteps >= 1` là số bước/await mà coroutine chạy trước khi xong). Mô phỏng event loop một luồng với hàng đợi FIFO: ban đầu các task xếp theo thứ tự cho trước. Lặp lại: lấy task ở ĐẦU hàng, chạy MỘT bước (ghi `tid` vào trace), giảm số bước còn lại; nếu còn bước thì đẩy xuống CUỐI hàng, hết bước thì xong. Trả về list tid theo đúng thứ tự các bước đã chạy. Ví dụ `tasks = [[0, 2], [1, 3]]` cho `[0, 1, 0, 1, 1]`; `tasks = [[5, 1], [6, 1], [7, 2]]` cho `[5, 6, 7, 7]`.
    problem_id: check-x733-event-loop
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X734
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao task "y" xong sớm nhất dù không đứng đầu hàng về số bước.
    code: |-
      from collections import deque
      q = deque([("x", 3), ("y", 1), ("z", 2)])
      trace = []
      done = {}
      while q:
          name, left = q.popleft()
          trace.append(name)
          if left > 1:
              q.append((name, left - 1))
          else:
              done[name] = len(trace)
      print("".join(trace))
      print(done)
    expected_output: "xyzxzx\n{'y': 2, 'z': 5, 'x': 6}"
    answer_md: "Hàng đợi x3,y1,z2: x chạy (còn 2, xuống cuối), y chạy và xong ở bước 2, z chạy (còn 1), x chạy, z chạy xong ở bước 5, x chạy xong ở bước 6. Trace xyzxzx. y chỉ cần một bước (một await) nên xong ngay lượt đầu của nó; mỗi task nhường quyền sau mỗi bước nên thứ tự xong phụ thuộc số bước, không phụ thuộc thứ tự bắt đầu."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng: mỗi task chỉ chạy một bước rồi nhường (cooperative scheduling ở await), y chỉ có 1 bước nên xong sớm nhất. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
