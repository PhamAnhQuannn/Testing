subtopic_id: sd.archetypes.typeahead
items:
  - id: S190
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Trong thiết kế typeahead, ý tưởng **dựng sẵn top-k gợi ý cho mỗi tiền tố (prefix)** là gì, và nó
      giúp mỗi lần gõ một phím rẻ đi như thế nào?
    answer_md: |
      Thay vì khi nhận mỗi phím mới đi quét và xếp hạng các truy vấn khớp, ta **tính trước (precompute)
      và lưu sẵn** danh sách top-k (ví dụ 5) truy vấn phổ biến nhất cho từng tiền tố — ví dụ tại mỗi nút
      của một **trie (prefix tree)**, hoặc trong một **bảng key-value 'tiền tố -> [gợi ý]'**. Nhờ vậy
      mỗi phím gõ chỉ còn một **phép tra cứu O(độ dài tiền tố)** (đi xuống trie rồi đọc danh sách đã
      lưu), không phải xếp hạng tại chỗ — đáp ứng mục tiêu độ trễ vài chục ms.
    rubric_md: "Đạt khi nêu đúng hai ý: (1) lưu sẵn top-k cho mỗi tiền tố (precompute), (2) nhờ đó mỗi phím chỉ là tra cứu nhanh O(độ dài tiền tố) thay vì xếp hạng tại chỗ. Đúng ý: bằng chứng điểm 1; chỉ nói 'dùng trie' mà không nêu lưu sẵn top-k / lợi ích độ trễ: tối đa điểm 0."
  - id: S191
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một bạn đề xuất: "Để gợi ý luôn chính xác, mỗi khi người dùng gõ xong một truy vấn thì cập nhật
      ngay chỉ mục (index) typeahead cho truy vấn đó." Hãy đánh giá: (1) cách này có phù hợp với đặc
      điểm tải của typeahead không và vì sao; (2) đề xuất chiến lược cập nhật đúng mức hơn; (3) nếu đề
      bài đòi một chủ đề "bỗng hot" phải xuất hiện trong vài phút thì xử lý thế nào mà không dựng lại cả bảng.
    answer_md: |
      (1) **Không phù hợp.** Typeahead **read-heavy** (số lượt gõ/đọc lớn hơn ghi rất nhiều) và xu
      hướng chỉ cần **tươi theo giờ/ngày**, nên cập nhật chỉ mục theo **từng truy vấn** vừa tốn kém vừa
      không đem lại lợi ích tương xứng; near-real-time không bắt buộc.
      (2) Nên **dựng lại theo lô (batch rebuild) ngoại tuyến**: một job định kỳ (mỗi giờ/ngày) đọc **log
      truy vấn**, đếm tần suất, dựng lại trie/bảng rồi **swap** bản mới vào dịch vụ đang chạy.
      (3) **Không dựng lại cả bảng.** Chạy một lớp tần suất phụ thường xuyên hơn, hoặc trộn một danh
      sách "đang trending" nhỏ lên trên kết quả dựng sẵn — giữ bản dựng sẵn làm nền, chỉ vá phần nóng.
    rubric_md: "Đạt (điểm 2) khi nêu đúng cả 3 ý: cập nhật từng truy vấn không phù hợp vì read-heavy/chỉ cần tươi theo giờ; thay bằng batch rebuild offline từ log rồi swap; và xử lý trending bằng lớp trộn/vá thay vì dựng lại cả bảng. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu lý do read-heavy hoặc không đề xuất batch rebuild: tối đa điểm 1."
  - id: S192
    difficulty: 3
    type: concept
    minutes: 12
    prompt_md: |
      Thiết kế **đầy đủ** một hệ typeahead/autocomplete trả gợi ý dưới ~100 ms mỗi lần gõ (phần tra cứu
      vài chục ms). Trình bày theo khung: (1) ràng buộc chi phối; (2) cấu trúc dữ liệu dựng sẵn và cách
      tra cứu một phím; (3) xếp hạng; (4) pipeline cập nhật chỉ mục; (5) phục vụ, cache và chia tải
      (sharding); (6) tối ưu phía client. Với mỗi phần, nói rõ nó gỡ ràng buộc nào.
    answer_md: |
      (1) **Ràng buộc:** read-heavy (mỗi phím là một request, hàng triệu/giây), độ trễ phần tra cứu
      **vài chục ms** để tổng vòng < ~100 ms, và chỉ cần tươi theo **giờ/ngày**.
      (2) **Dữ liệu dựng sẵn:** một **trie (prefix tree)** với **top-k (ví dụ 5) gợi ý lưu sẵn tại mỗi
      nút**, hoặc một **bảng key-value 'tiền tố -> [gợi ý]'**. Tra cứu một phím = đi xuống theo tiền tố
      và đọc danh sách đã lưu, chi phí **O(độ dài tiền tố)** — gỡ ràng buộc độ trễ vì không xếp hạng tại chỗ.
      (3) **Xếp hạng:** theo **độ phổ biến/tần suất** đếm từ log; có thể trộn **cá nhân hoá** (lịch
      sử/vùng) như lớp thêm — gỡ ràng buộc chất lượng gợi ý.
      (4) **Cập nhật:** job **batch** ngoại tuyến đọc **log truy vấn** mỗi giờ/ngày, đếm, dựng lại
      trie/bảng rồi **swap** bản mới; chủ đề trending xử lý bằng lớp trộn thay vì dựng lại cả bảng — gỡ
      ràng buộc độ tươi mà không đụng đường đọc.
      (5) **Phục vụ/scale:** dịch vụ giữ trie/bảng **in-memory**, nhiều bản sao sau **load balancer**;
      **cache ở biên (CDN)** cho các tiền tố ngắn bị hỏi cực nhiều (kết quả gần như chung cho mọi người);
      **sharding theo tiền tố** khi quá lớn, chia **theo tải thực tế** vì phân bố lệch ('s' nhiều hơn
      'x') — gỡ ràng buộc quy mô và tải đọc.
      (6) **Client:** **debounce** (~100-200 ms sau phím cuối) và huỷ request cũ — cắt số request vô ích
      và cải thiện độ trễ cảm nhận với chi phí rẻ nhất.
    rubric_md: "Đạt mức 3 (per mastery_bar: full design dưới ~100 ms) khi trình bày mạch lạc đủ 6 phần và buộc mỗi lựa chọn vào ràng buộc: dựng sẵn top-k per prefix (trie hoặc bảng KV) cho tra cứu O(độ dài tiền tố); xếp hạng theo popularity (+ personalisation); pipeline cập nhật batch/offline từ log rồi swap (và cách vá trending); cache ở biên + nhiều bản sao in-memory + sharding theo tiền tố/theo tải; debounce ở client. Đúng, trong time-box, tự biện minh được: bằng chứng điểm 3. Sót một trụ (dựng sẵn, cập nhật offline, cache/sharding, hay client) hoặc không gắn được với ràng buộc độ trễ/độ tươi: chưa đạt mức 3."
