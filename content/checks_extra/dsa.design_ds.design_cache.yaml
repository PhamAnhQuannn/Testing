subtopic_id: dsa.design_ds.design_cache
items:
  - id: X503
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      B = 4
      buckets = [[] for _ in range(B)]

      def put(k, v):
          b = buckets[k % B]
          for pair in b:
              if pair[0] == k:
                  pair[1] = v
                  return
          b.append([k, v])

      def get(k):
          for kk, v in buckets[k % B]:
              if kk == k:
                  return v
          return -1

      put(1, 10); put(5, 20); put(2, 30); put(1, 99)
      print(get(1), get(5), get(9))
      print(buckets)
    expected_output: "99 20 -1\n[[], [[1, 99], [5, 20]], [[2, 30]], []]"
    answer_md: 'Key 1 và 5 cùng rơi vào bucket 1 (collision) nên nằm chung một danh sách; `put(1, 99)` ghi đè cặp cũ thay vì thêm mới. `get(9)` rơi vào bucket 1 nhưng không có key 9 nên trả `-1`.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
