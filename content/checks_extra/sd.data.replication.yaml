subtopic_id: sd.data.replication
items:
  - id: S049
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Trong mô hình sao chép **leader-follower (primary-replica)**: máy nào nhận lệnh **ghi
      (write)**, và việc thêm nhiều **follower (read replica)** giúp chia tải gì — tải **đọc**, tải
      **ghi**, hay cả hai?
    answer_md: |
      Chỉ **leader (primary)** nhận mọi lệnh **ghi**; các **follower** chép lại thay đổi từ leader và
      phục vụ **đọc**. Thêm follower (read replica) chỉ chia được **tải đọc** — **không** chia tải
      ghi, vì mọi ghi vẫn phải qua một leader duy nhất (muốn chia tải ghi cần sharding).
    rubric_md: "Đúng khi nêu: chỉ leader nhận ghi, follower phục vụ đọc, và read replica chỉ chia tải đọc (không chia ghi). Đủ ý: điểm 1. Nói follower cũng nhận ghi, hoặc bảo read replica chia được tải ghi: điểm 0."
  - id: S050
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một trang hồ sơ đọc dữ liệu từ các **read replica**. Người dùng đổi tên hiển thị, hệ báo lưu
      thành công, nhưng khi tải lại trang họ vẫn thấy **tên cũ**. Hãy: (1) nêu đúng nguyên nhân;
      (2) cho biết đây là vấn đề **nhất quán** hay **độ bền**, và vì sao; (3) nêu một cách chữa.
    answer_md: |
      (1) Nguyên nhân là **replication lag (độ trễ chép)**: lệnh ghi vào **leader**, nhưng trang đọc
      từ một **follower chưa chép kịp** thay đổi đó, nên trả về bản cũ.
      (2) Đây là vấn đề **nhất quán (consistency)** — cụ thể là **read-after-write / read-your-writes**:
      dữ liệu không mất (vẫn an toàn trên leader), chỉ là bản sao đọc ra tạm thời cũ; nên **không** phải
      vấn đề độ bền (durability).
      (3) Cách chữa: trong một khoảng ngắn sau khi ghi, **đọc dữ liệu của chính người đó từ leader**
      (hoặc chỉ đọc từ replica đã chép tới mốc ghi của họ). Cũng có thể ghim người dùng vào một replica
      để giữ monotonic reads.
    rubric_md: "Đạt (score 2) khi nêu đủ: (1) replication lag do đọc từ follower lag; (2) đây là nhất quán/read-your-writes chứ không phải mất dữ liệu; (3) một cách chữa đúng (đọc từ leader sau khi ghi, hoặc đọc replica đã chép tới mốc). Đúng và tự giải thích được trong time-box: bằng chứng điểm 2. Chỉ nói 'lag' mà không phân biệt được nhất quán vs độ bền, hoặc không nêu cách chữa hợp lý: tối đa điểm 1."
  - id: S051
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Đạt mức 3 cho replication: (1) **so sánh** sao chép **đồng bộ (sync)** và **bất đồng bộ
      (async)** theo đánh đổi độ bền - độ trễ; (2) giải thích **replication lag**, **failover** và
      **split-brain**, kèm cách **quorum/fencing** ngăn split-brain; (3) **chọn cấu hình** cho một
      yêu cầu cụ thể: *chuyển khoản ngân hàng* và *đếm like/bình luận* — mỗi loại nên sync hay async,
      và vì sao.
    answer_md: |
      (1) **Sync vs async:** sync = leader **chờ follower xác nhận** rồi mới báo xong → bền hơn
      (leader chết thì follower vẫn có bản mới nhất, không mất ghi) nhưng **chậm** và dễ kẹt nếu
      follower treo. Async = leader **báo xong ngay** rồi chép sau → **nhanh** nhưng nếu leader chết
      trước khi chép, **mất ghi mới nhất**. Semi-sync (chờ một follower) là điểm giữa.
      (2) **Replication lag:** follower chép sau leader nên đọc từ follower có thể thấy dữ liệu cũ
      (vấn đề read-your-writes). **Failover:** leader chết → phát hiện → bầu một follower lên làm
      leader mới → chuyển ghi sang nó. **Split-brain:** do đứt mạng/phát hiện sai, **hai máy cùng tưởng
      mình là leader** và cùng nhận ghi → dữ liệu phân kỳ, xung đột. Ngăn bằng **quorum (quá nửa):**
      chỉ node được **hơn một nửa** đồng ý mới làm leader, mà chỉ có thể có một nhóm quá nửa nên không
      có hai leader cùng lúc; và **fencing token:** leader mới mang token tăng dần, kho từ chối ghi
      mang token cũ nên leader cũ hồi sinh cũng không ghi được.
      (3) **Chuyển khoản ngân hàng → sync (hoặc semi-sync):** không được mất ghi và cần đọc đúng số dư,
      chấp nhận chậm hơn. **Đếm like / bình luận → async:** cần nhanh và chịu được lag vài giây; mất
      một like hiếm hoi khi failover là chấp nhận được, chỉ cần read-your-writes cho thao tác của chính
      người dùng.
    rubric_md: "Đạt mức 3 (mức phỏng vấn) khi làm đủ cả 3: (1) so sánh đúng sync vs async theo durability/latency (sync bền-chậm, async nhanh-có-thể-mất-ghi); (2) giải thích đúng lag, failover và split-brain, và nêu được quorum và/hoặc fencing ngăn split-brain; (3) chọn đúng cấu hình gắn với yêu cầu — ngân hàng sync vì không được mất ghi, like/bình luận async vì ưu tiên nhanh và chịu được lag — có lý do. Đúng, trong time-box, tự lập luận rõ ràng: bằng chứng điểm 3. Thiếu phần split-brain/quorum, hoặc chọn cấu hình mà không gắn được với yêu cầu: chưa đạt mức 3."
