subtopic_id: dsa.practical.api_http_json
items:
  - id: X530
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      q = "k=1&k=2&flag&n=a=b"
      out = {}
      for p in q.split("&"):
          k, _, v = p.partition("=")
          out[k] = v
      print(out)
      print(len(out))
      print(out.get("zzz", "none"))
    expected_output: "{'k': '2', 'flag': '', 'n': 'a=b'}\n3\nnone"
    answer_md: 'Khóa `k` lặp nên giá trị sau (`"2"`) ghi đè; `flag` không có `=` nên giá trị là `""`; `partition` chỉ cắt ở dấu `=` đầu tiên nên `n` có giá trị `a=b`. Dict có 3 khóa và `get("zzz", "none")` trả giá trị mặc định `none`.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X531
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết `parse_query_string(qs)`: parse query string như `"a=1&b=2&a=3"` thành dict `str -> str`. Khóa lặp thì giá trị cuối cùng thắng; khóa trần như `"x"` ánh xạ tới `""`; chuỗi rỗng cho `{}`. `parse_query_string("a=1&b=2&a=3")` là `{"a": "3", "b": "2"}`. Gợi ý: `split("&")` rồi `partition("=")`.
    problem_id: check-x531-parse-query-string
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X532
    difficulty: 3
    type: write_code
    minutes: 10
    prompt_md: |
      Viết `match_route(pattern, path)`: tách cả hai bằng `split("/")`; segment của pattern là literal hoặc `:name` (tham số). Nếu path khớp thì trả dict các tham số bắt được (`{}` nếu không có), ngược lại (khác số segment hoặc literal không bằng) trả `None`. `match_route("/users/:id", "/users/7")` là `{"id": "7"}`; `match_route("/users/:id", "/posts/7")` là `None`.
    problem_id: check-x532-match-route
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
