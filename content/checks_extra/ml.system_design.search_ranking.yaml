subtopic_id: ml.system_design.search_ranking
items:
  - id: S355
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Kể tên **4 tầng** của một hệ xếp hạng tìm kiếm (search ranking) theo thứ tự, mỗi tầng một câu
      nói nó làm gì. Nêu thêm: ở tầng truy hồi (retrieval), hai kiểu khớp bổ sung nhau là gì?
    answer_md: |
      Bốn tầng (phễu từ rộng-rẻ tới hẹp-tinh):
      1. **Hiểu truy vấn (query understanding):** làm sạch và làm giàu câu hỏi — sửa chính tả (spell
         correction), mở rộng truy vấn (query expansion), nhận ý định (intent).
      2. **Truy hồi / lấy ứng viên (retrieval):** từ hàng triệu tài liệu lấy ra vài trăm–vài nghìn
         ứng viên thật nhanh.
      3. **Xếp hạng (ranking) bằng learning to rank:** chấm điểm và sắp thứ tự các ứng viên bằng nhiều
         đặc trưng.
      4. **Chấm lại (rerank):** một model nặng (cross-encoder) tinh chỉnh vài chục kết quả đầu.

      Ở tầng truy hồi, hai kiểu khớp bổ sung nhau là **từ khóa / từ vựng (lexical, BM25 trên chỉ mục
      đảo)** và **ngữ nghĩa / vector (semantic, dense trên chỉ mục ANN)**; thực tế dùng cả hai
      (**hybrid**) rồi hợp nhất.
    rubric_md: "Đúng khi liệt kê đủ 4 tầng đúng thứ tự (hiểu truy vấn → retrieval → ranking/LTR → rerank) với mô tả một câu mỗi tầng, VÀ nêu được hai kiểu khớp lexical/BM25 và semantic/vector. Đủ ý: điểm 1. Thiếu một tầng hoặc không nêu được hai kiểu retrieval: tối đa điểm 0."
  - id: S356
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một truy vấn trả 3 kết quả hiển thị theo thứ tự R1, R2, R3. Log click cho thấy người dùng **bỏ
      qua R1 và R2**, rồi **click R3 và ở lại lâu (long-click)**.
      (1) Suy ra **nhãn liên quan (relevance label)** cho cả 3 kết quả từ phiên này và giải thích.
      (2) Vì sao nhãn rút từ click kiểu này **thiên lệch**, và nêu **hai cách hiệu chỉnh** (debias).
      (3) Nên dùng kiểu nhãn/loss LTR nào (pointwise / pairwise / listwise) với dữ liệu click, vì sao?
    answer_md: |
      (1) **Suy nhãn:** người dùng đã **nhìn** R1, R2 (chúng ở trên R3 đã được click) mà **bỏ qua**,
      rồi **long-click R3** → R3 **liên quan hơn** R1 và R2. Nhãn tự nhiên là **pairwise**: R3 > R1 và
      R3 > R2. Không kết luận chắc R1 so với R2 (chưa đủ bằng chứng). Long-click (ở lại lâu) củng cố
      rằng R3 thực sự thoả mãn, khác với click rồi quay ra ngay (pogo-sticking).

      (2) **Vì sao thiên lệch — position bias:** xác suất được click phụ thuộc mạnh vào **vị trí hiển
      thị**, không chỉ vào độ liên quan; kết quả ở trên được click chỉ vì ở trên. Lấy click thô làm
      nhãn → model học lại thứ tự cũ (feedback loop). **Hai cách hiệu chỉnh** (nêu 2 trong số):
      - **Skip-click / tín hiệu đã-nhìn:** chỉ coi là nhãn âm những kết quả nhiều khả năng đã được
        nhìn mà không click (như R1, R2 ở đây).
      - **Click model / IPW (inverse propensity weighting):** ước lượng xác suất được nhìn theo vị trí
        rồi chia ngược trọng số để cân lại lợi thế vị trí.
      - **Dùng dwell/long-click thay vì click trần**, và **pha thêm nhãn vàng (gold) do rater chấm**
        cho một mẫu để hiệu chuẩn.

      (3) **Pairwise** hợp nhất với dữ liệu click vì click cho ta **so sánh thứ tự giữa các cặp** (A
      nên trên B) chứ không cho điểm tuyệt đối đáng tin; pointwise cần điểm liên quan tuyệt đối (khó
      từ click), listwise mạnh hơn nhưng khó huấn luyện. Có thể dùng listwise xấp xỉ NDCG khi dữ liệu
      đủ tốt.
    rubric_md: "Đạt (điểm 2) khi nêu đúng cả 3: (1) R3 > R1, R3 > R2 từ skip-click + long-click (nhãn pairwise), không lấy thứ tự hiển thị làm nhãn; (2) gọi tên position bias và nêu ÍT NHẤT hai cách hiệu chỉnh (skip/đã-nhìn, IPW/click model, dwell/long-click, pha nhãn rater); (3) chọn pairwise và lý do hợp click. Đúng, trong time-box, tự giải thích được: điểm 2. Thiếu phần hiệu chỉnh position bias (phần cốt lõi) hoặc lấy thứ tự hiển thị làm nhãn: tối đa điểm 1."
  - id: S357
    difficulty: 3
    type: concept
    minutes: 12
    prompt_md: |
      **(Phỏng vấn AI engineer)** Thiết kế **end-to-end** hệ xếp hạng tìm kiếm cho ô tìm kiếm của một
      trang thương mại điện tử lớn (hàng triệu sản phẩm). Trình bày:
      (1) **Pipeline** từ truy vấn tới kết quả và mỗi tầng dùng dữ liệu/kỹ thuật gì;
      (2) **Chọn chỉ mục (index)** và tầng **rerank**;
      (3) **Tạo nhãn từ log click** và cách **hiệu chỉnh** để nhãn không thiên lệch;
      (4) Cách **đánh giá** (offline và online) trước khi phát hành toàn bộ.
    answer_md: |
      **(1) Pipeline 4 tầng (phễu):**
      - **Hiểu truy vấn:** sửa chính tả, mở rộng truy vấn (đồng nghĩa), nhận **ý định** (mua sản phẩm
        vs tìm thông tin) để điều chỉnh nguồn ứng viên và tiêu chí xếp hạng.
      - **Truy hồi lai (hybrid):** chạy song song **BM25** (từ khóa, mã sản phẩm) và **vector/ANN**
        (ngữ nghĩa), **hợp nhất** hai danh sách bằng RRF để được vài trăm–vài nghìn ứng viên.
      - **Xếp hạng (LTR):** model chấm điểm mỗi (truy vấn, sản phẩm) từ đặc trưng: điểm BM25, tương
        đồng vector, độ mới, độ phổ biến/CTR lịch sử, còn hàng, giá, tín hiệu **cá nhân hoá**; dùng
        loss **pairwise/listwise**.
      - **Rerank:** cross-encoder đọc kỹ ~vài chục top để tinh chỉnh.

      **(2) Chỉ mục + rerank:** chỉ mục **lai** — **inverted index** cho lexical (khớp chính xác mã/từ
      hiếm) + **chỉ mục vector/ANN** (HNSW hoặc IVF-PQ, sharding ở quy mô tỉ) cho ngữ nghĩa. Giữ **độ
      mới** bằng cập nhật index **tăng dần** (hàng mới/ hết hàng lên nhanh). Rerank chỉ chạy trên top
      nên vẫn kịp độ trễ.

      **(3) Nhãn từ click + hiệu chỉnh:** nguồn nhãn chính là **log click** (rẻ, nhiều). Nhưng click
      dính **position bias** (click vì ở trên). Hiệu chỉnh:
      - Suy **nhãn pairwise** từ **skip-click** (bỏ qua trên, click dưới ⇒ dưới liên quan hơn).
      - **Click model / IPW** để cân lại xác suất được nhìn theo vị trí.
      - Dùng **dwell time / long-click** (loại pogo-sticking) làm tín hiệu hài lòng.
      - **Pha nhãn vàng do rater chấm** cho một mẫu để hiệu chuẩn và kiểm định.

      **(4) Đánh giá:**
      - **Offline:** NDCG/MRR trên nhãn (vàng + click đã debias), theo dõi **recall@k** của tầng truy
        hồi để không mất ứng viên tốt.
      - **Online:** **A/B test** so metric thật (long-click, chuyển đổi, thời gian tìm thấy) và/hoặc
        **interleaving** để so hai ranker nhạy hơn với ít lưu lượng. Chỉ phát hành toàn bộ khi online
        cải thiện, vì offline tốt chưa chắc online tốt (nhãn có thể lệch).
    rubric_md: "Đạt mức phỏng vấn (điểm 3) khi bao quát đủ 4 phần theo mastery_bar: (1) pipeline end-to-end 4 tầng hiểu-truy-vấn → hybrid retrieval → LTR → rerank với dữ liệu/đặc trưng hợp lý; (2) chọn index lai (inverted + vector/ANN) và rerank bằng cross-encoder, có nhắc độ mới; (3) tạo nhãn từ click VÀ hiệu chỉnh position bias (skip-click/IPW/click model, dwell/long-click, pha nhãn rater); (4) đánh giá offline NDCG/MRR + recall@k VÀ online A/B/interleaving, nêu vì sao cần online. Đúng, trong time-box, tự giải thích rõ: điểm 3. Thiếu phần tạo nhãn-debias HOẶC thiếu đánh giá online: chưa đạt mức 3."
