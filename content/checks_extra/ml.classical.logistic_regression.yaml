subtopic_id: ml.classical.logistic_regression
items:
  - id: X685
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `predict_proba(weights, bias, x)` của logistic regression: tính điểm `z = bias + sum(w_i * x_i)` rồi trả `sigmoid(z)` làm tròn 6 chữ số. Dùng sigmoid ổn định số học (không để `math.exp` tràn khi `z` rất âm hoặc rất dương). `weights` và `x` cùng độ dài. Ví dụ: `weights=[0.5, 1.0]`, `bias=-1.0`, `x=[2.0, 1.0]` cho `z = 1` và kết quả `0.731059`.
    problem_id: check-x685-logistic-proba
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X686
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích log loss, gradient theo w và odds của dòng cuối được tính ra sao.
    code: |-
      import math


      def sigmoid(z):
          return 1 / (1 + math.exp(-z))


      p = sigmoid(0)
      print(p)
      print(round(-math.log(p), 4))
      print(round((p - 1) * 3, 2))
      print(round(sigmoid(math.log(3)), 2))
    expected_output: "0.5\n0.6931\n-1.5\n0.75"
    answer_md: "`sigmoid(0) = 1/(1+1) = 0.5` nên dòng 1 in `0.5`. Log loss với y = 1 là −ln 0,5 = ln 2 ≈ `0.6931`. Gradient theo w với x = 3, y = 1: x·(p − y) = 3·(0,5 − 1) = `-1.5` (âm nên gradient descent tăng w). Dòng cuối: log-odds = ln 3 tức odds = 3, nên p = 3/(1 + 3) = `0.75`."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng log loss = −ln p (với y = 1), gradient = x·(p − y) và odds 3 ứng với p = 0,75. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
