subtopic_id: dsa.foundations.interview_method
items:
  - id: X346
    difficulty: 3
    type: concept
    minutes: 8
    prompt_md: |
      Bạn nhận đề "tìm hai số trong mảng có tổng bằng target" trong buổi phỏng vấn. Trình bày quy trình bạn
      sẽ đi qua từ lúc nhận đề đến lúc kết thúc, và cách bạn nói về độ phức tạp ở từng bước. Cụ thể:
      (1) bạn hỏi gì khi làm rõ đề, (2) vì sao nêu brute force trước, (3) bạn chuyển sang cách tối ưu thế
      nào và nói gì về đánh đổi thời gian/bộ nhớ, (4) bạn kiểm thử ra sao.
    answer_md: |
      1. Làm rõ: mảng có số âm/trùng không, có đảm bảo tồn tại đáp án không, trả chỉ số hay giá trị, được
         dùng một phần tử hai lần không, kích thước tối đa (quyết định ngưỡng độ phức tạp).
      2. Ví dụ và biên: ví dụ nhỏ tay, mảng rỗng, một phần tử, trùng lặp, không có đáp án.
      3. Brute force: hai vòng lặp, O(n^2) thời gian, O(1) bộ nhớ. Nêu trước để chứng tỏ có đáp án đúng và
         có mốc so sánh.
      4. Tối ưu: dùng dict lưu giá trị đã thấy, tra `target - x`, một lượt O(n) thời gian, O(n) bộ nhớ;
         nói rõ đang đổi bộ nhớ lấy thời gian.
      5. Code sạch, đặt tên rõ, rồi chạy tay ví dụ và các biên; nêu độ phức tạp cuối cùng.
      6. Khi kẹt: nói to suy nghĩ, không im lặng.
    rubric_md: "Nêu đủ thứ tự làm rõ, ví dụ/biên, brute force, tối ưu, code, kiểm thử; nêu đúng O(n^2) và O(n) kèm đánh đổi bộ nhớ; nêu được ít nhất 2 câu hỏi làm rõ và 2 biên: bằng chứng điểm 3. Thiếu 1-2 bước hoặc không nói đánh đổi: điểm 2. Chỉ nói chung chung hoặc bỏ brute force/kiểm thử: tối đa điểm 1."
