subtopic_id: ml.classical.linear_regression
items:
  - id: X683
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `fit_line(xs, ys)` khớp `y = slope * x + intercept` bằng bình phương tối thiểu (OLS đơn biến) và trả `[slope, intercept]`, mỗi giá trị làm tròn 6 chữ số. Dùng công thức đóng: `slope = (n*Sxy - Sx*Sy) / (n*Sxx - Sx*Sx)`, `intercept = (Sy - slope*Sx) / n`. Giả sử `n >= 2` và các `xs` không đều bằng nhau. Ví dụ: `xs=[1,2,3]`, `ys=[2,4,6]` cho `[2.0, 0.0]`.
    problem_id: check-x683-fit-line
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X684
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao tổng residual của OLS có intercept bằng 0.
    code: |-
      xs = [1, 2, 3, 4]
      ys = [2, 3, 5, 4]
      n = len(xs)
      sx = sum(xs)
      sy = sum(ys)
      sxy = sum(x * y for x, y in zip(xs, ys))
      sxx = sum(x * x for x in xs)
      slope = (n * sxy - sx * sy) / (n * sxx - sx * sx)
      intercept = (sy - slope * sx) / n
      print(slope, intercept)
      res = [y - (slope * x + intercept) for x, y in zip(xs, ys)]
      print([round(r, 2) for r in res])
      print(round(sum(res), 6) == 0)
    expected_output: "0.8 1.5\n[-0.3, -0.1, 1.1, -0.7]\nTrue"
    answer_md: "Sx=10, Sy=14, Sxx=30, Sxy=39, n=4: slope = (156-140)/(120-100) = 0.8, intercept = (14-8)/4 = 1.5. Dự đoán 2.3, 3.1, 3.9, 4.7 nên residual -0.3, -0.1, 1.1, -0.7. Tổng residual bằng 0 (in True) vì đường OLS có intercept đi qua điểm (mean x, mean y), nên sai số dương và âm triệt tiêu nhau."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng tổng residual bằng 0 do intercept (đường đi qua điểm trung bình). Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
