subtopic_id: py.advanced.descriptors
items:
  - id: X405
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      class Tag:
          def __set_name__(self, owner, name):
              print("bind", name)

          def __get__(self, obj, owner=None):
              return "cls" if obj is None else "inst"

      class A:
          t = Tag()
          u = Tag()

      a = A()
      print(A.t)
      print(a.t)
      a.t = "x"
      print(a.t)
      print(a.__dict__)
    expected_output: "bind t\nbind u\ncls\ninst\nx\n{'t': 'x'}"
    answer_md: '`__set_name__` chạy ngay khi class `A` được tạo (in `bind t`, `bind u`). `A.t` gọi `__get__` với `obj=None` nên trả `cls`; `a.t` trả `inst`. `Tag` chỉ có `__get__` (non-data descriptor) nên `a.t = "x"` ghi vào `a.__dict__` và từ đó `a.t` trả `x` (instance dict thắng).'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu về non-data descriptor bị che bởi instance dict. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X406
    difficulty: 2
    type: write_code
    minutes: 5
    prompt_md: |
      Viết `positive_demo(values)`: bên trong định nghĩa descriptor `Positive` (có `__set_name__`, `__get__`, `__set__`; `__set__` ném `ValueError` nếu `value <= 0`, ngược lại lưu vào `obj.__dict__`) và class `Item` có thuộc tính `price = Positive()`. Với mỗi `v` trong `values`, thử gán `item.price = v` trên cùng một instance `item`, ghi `"ok"` hoặc `"err"`. Trả `[tên thuộc tính descriptor đã học qua __set_name__, danh sách kết quả, item.price cuối cùng]` (`None` nếu chưa gán được lần nào).
    problem_id: check-x406-positive-descriptor
    rubric_md: "Pass toàn bộ test ẩn. Đúng không gợi ý trong time-box (5 phút): bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X407
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: |
      Viết `lookup_order(ops)`. Bên trong định nghĩa một data descriptor `D` (`__get__` trả `"data"`, `__set__` ghi `"d=<value>"` vào một list log rồi KHÔNG lưu gì), một non-data descriptor `N` (`__get__` trả `"nondata"`), và class `C` với `d = D()`, `n = N()`. Tạo một instance `c`, áp dụng lần lượt từng cặp `[tên, giá_trị]` trong `ops` bằng `setattr(c, tên, giá_trị)` (tên chỉ là `"d"` hoặc `"n"`). Trả `[c.d, c.n, log]`. Ví dụ `[["d","x"],["n","y"]]` cho `["data", "y", ["d=x"]]`.
    problem_id: check-x407-lookup-order
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 12 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
