subtopic_id: dsa.searching_sorting.sorting_algorithms
items:
  - id: X343
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: "Viết `merge_count_inversions(nums)` bằng merge sort, trả về `[danh_sach_sap_xep, so_nghich_the]` (ví dụ `[2,4,1,3,5]` -> `[[1,2,3,4,5], 3]`). Nghịch thế: `i<j` và `nums[i]>nums[j]`; bằng nhau không tính."
    problem_id: check-merge-count-inversions
    rubric_md: "Đếm nghịch thế ngay trong bước merge (O(n log n)), xử lý phần tử bằng nhau đúng: điểm 3; đúng nhưng đếm O(n^2) hoặc sai khi bằng nhau: tối đa 2."
