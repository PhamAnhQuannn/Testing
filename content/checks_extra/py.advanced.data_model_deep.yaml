subtopic_id: py.advanced.data_model_deep
items:
  - id: X408
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      class Box:
          def __init__(self):
              self.a = 1

          def __getattr__(self, name):
              return name * 2

      b = Box()
      print(b.a)
      print(b.xy)
      print(hasattr(b, "q"))
      print(sorted(vars(b)))
    expected_output: "1\nxyxy\nTrue\n['a']"
    answer_md: '`b.a` tồn tại trong `__dict__` nên trả `1` mà không gọi `__getattr__`. `b.xy` không có nên `__getattr__` trả `"xy" * 2 = "xyxy"`. `hasattr(b, "q")` là `True` vì `__getattr__` trả giá trị thay vì ném `AttributeError`. `__getattr__` không ghi vào `__dict__` nên `vars(b)` chỉ có `a`.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X409
    difficulty: 2
    type: write_code
    minutes: 5
    prompt_md: |
      Viết `bag_report(data, names)`: định nghĩa class `Bag` có `__init__(self, data)` gán mỗi cặp key/value của dict `data` thành thuộc tính (dùng `setattr`) và `__getattr__(self, name)` trả `name.upper()` cho tên không tồn tại. Tạo `Bag(data)` rồi trả `[sorted(vars(bag)), [getattr(bag, n) for n in names]]`.
    problem_id: check-x409-dynamic-bag
    rubric_md: "Pass toàn bộ test ẩn. Đúng không gợi ý trong time-box (5 phút): bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X410
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: |
      Viết `slots_probe(fields, attempts, with_dict)`: tạo class bằng `type("Probe", bases, {"__slots__": tuple(fields)})` với `bases = (Base,)` nếu `with_dict` là `True` (với `Base` là class thường không có `__slots__`), ngược lại `bases = ()`. Tạo instance, với mỗi tên trong `attempts` thử `setattr(obj, name, 1)`: ghi `"ok"` nếu thành công, `"blocked"` nếu gặp `AttributeError`. Trả `[results, hasattr(obj, "__dict__")]`.
    problem_id: check-x410-slots-probe
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 12 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
