subtopic_id: py.oop.classes_basics
items:
  - id: X333
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: |
      Viết `bank_summary(ops)` với class `Account` (trạng thái trong `__init__`, `deposit`, `withdraw`, property
      `balance` chỉ đọc). Mỗi op là `[name, cmd, amount]`; tài khoản tạo ở lần dùng đầu với số dư 0. Nạp cần
      `amount > 0`, rút cần `0 < amount <= số dư`; thao tác sai không đổi gì và tính là failed. Trả về
      `[[name, balance, ok, failed], ...]` sắp theo name.
    problem_id: check-bank-summary
    rubric_md: "Thiết kế class đúng (state theo instance, property, xử lý lỗi), tổng hợp nhiều tài khoản đúng, pass toàn bộ test ẩn không cần gợi ý: điểm 3; pass nhưng phải xem gợi ý: tối đa điểm 2; sai: tối đa điểm 1."
