subtopic_id: cs.discrete_math.logic_sets_counting
items:
  - id: X885
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
    code: |-
      p = True
      q = False
      print(p and q, p or q, not p)
      print((not p) or q)
      print(p != q)
      s = {1, 2, 3}
      t = {2, 3, 4}
      print(sorted(s & t))
      print(sorted(s ^ t))
    expected_output: "False True False\nFalse\nTrue\n[2, 3]\n[1, 4]"
    answer_md: "p and q = False, p or q = True, not p = False. (not p) or q = False or False = False (đây là p kéo theo q). p != q là xor nên True. s & t = {2, 3}; s ^ t (hiệu đối xứng) = {1, 4}."
    rubric_md: "Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X886
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `eval_logic(expr)` tính giá trị một biểu thức mệnh đề lồng nhau và trả về bool. Nếu `expr` là bool thì trả về chính nó. Ngược lại `expr` là list có phần tử `[0]` là chuỗi toán tử: `"and"` là AND của mọi toán hạng còn lại (không có toán hạng thì `True`); `"or"` là OR của mọi toán hạng còn lại (không có toán hạng thì `False`); `"not"` phủ định toán hạng duy nhất. Toán hạng lại là biểu thức (bool hoặc list lồng). Ví dụ `eval_logic(["and", True, ["not", False]])` trả `True`, `eval_logic(["or", False, False])` trả `False`, `eval_logic(["and"])` trả `True`.
    problem_id: check-x886-eval-logic
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X887
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và phân loại lỗi liên quan đến dòng thứ 5 và dòng thứ 6 của output (cú pháp, lúc chạy hay logic).
    code: |-
      def choose(n, k):
          r = 1
          for i in range(k):
              r = r * (n - i) // (i + 1)
          return r


      print(choose(5, 2), choose(6, 0), choose(4, 4))
      print(choose(5, 2) + choose(5, 3))
      a = {1, 2, 3, 4, 5, 6}
      b = {2, 4, 6, 8}
      print(len(a) + len(b) - len(a & b), len(a | b))
      total = 0
      for k in range(4):
          total += choose(3, k)
      print(total)
      try:
          print(sorted(a)[10])
      except IndexError:
          print("runtime error")
      words = ["a", "b", "c"]
      pairs = [w1 + w2 for w1 in words for w2 in words if w1 < w2]
      print(len(pairs), "of", 3 * 3)
    expected_output: "10 1 1\n20\n7 7\n8\nruntime error\n3 of 9"
    answer_md: "choose(5, 2) = 10, choose(6, 0) = 1 (vòng rỗng), choose(4, 4) = 1. C(5,2) + C(5,3) = 10 + 10 = 20. Bù trừ: |a| + |b| - |a & b| = 6 + 4 - 3 = 7 và |a | b| = 7. Tổng C(3,k) với k = 0..3 là 1 + 3 + 3 + 1 = 8 = 2^3. sorted(a) chỉ có 6 phần tử nên chỉ số 10 ném IndexError và in runtime error. Cuối cùng điều kiện w1 < w2 chỉ giữ ab, ac, bc nên in 3 of 9; nếu muốn số cặp có thứ tự khác nhau P(3,2) = 6 thì phải dùng w1 != w2. Chỉ số ngoài phạm vi là lỗi lúc chạy (runtime); đếm 3 thay vì 6 là lỗi logic (chạy bình thường nhưng sai kết quả)."
    rubric_md: "Output khớp từng dòng VÀ phân loại đúng: dòng 5 (sorted(a)[10]) là lỗi runtime (IndexError ném lúc chạy), dòng 6 (3 of 9) là lỗi logic (không báo lỗi nhưng sai kết quả; lỗi cú pháp thì Python từ chối chạy ngay từ đầu). Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
