subtopic_id: ml.system_design.llm_product_design
items:
  - id: S364
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Nói ngắn gọn: khi thiết kế một sản phẩm LLM (ví dụ support chatbot), các **bước chính theo thứ
      tự** từ yêu cầu tới vận hành là gì? Và **streaming** (SSE) giúp ích gì cho trải nghiệm?
    answer_md: |
      **Trình tự các bước**: (1) **Yêu cầu** — người dùng làm gì, sai thì rủi ro gì, thước đo thành
      công; (2) **Kiến trúc / cách thích nghi** — prompt vs RAG vs fine-tune, API vs self-host, retrieval
      và tool/agent, quản lý context; (3) **Eval** — golden set offline + tín hiệu online (+ LLM-as-judge);
      (4) **An toàn** — guardrails cho injection, PII, lạm dụng; (5) **Serving/vận hành** — streaming,
      chi phí/độ trễ, rollout, monitoring, feedback loop.

      **Streaming (SSE)** đẩy từng token ra ngay khi model sinh, nên **cắt độ trễ cảm nhận**: người
      dùng thấy chữ chạy ngay thay vì chờ cả câu — đo bằng **TTFT (time to first token)**. Nó không làm
      câu trả lời xong sớm hơn, chỉ cải thiện cảm nhận và cho phép huỷ/nối lại giữa chừng.
    rubric_md: "Đúng khi nêu được trình tự hợp lý (yêu cầu → kiến trúc/thích nghi → eval → an toàn → serving) và nói đúng streaming giảm độ trễ cảm nhận / TTFT bằng cách đẩy token sớm. Đủ ý: bằng chứng điểm 1. Thiếu hẳn một trong hai (trình tự hoặc vai trò streaming), hoặc nói streaming làm câu trả lời xong nhanh hơn: tối đa điểm 0."
  - id: S365
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Bạn thiết kế một **support chatbot** trả lời theo bộ **tài liệu chính sách nội bộ thay đổi hằng
      tuần**; trả lời sai gây rủi ro pháp lý; cần hiển thị cho người dùng trong IDE/web nhanh. Hãy đề
      xuất: (1) **cách thích nghi** (prompt/RAG/fine-tune) và **API hay self-host**, giải thích vì sao;
      (2) một điểm **kiến trúc** then chốt để câu trả lời bám tài liệu; (3) một **guardrail an toàn**
      phù hợp với tình huống.
    answer_md: |
      (1) **RAG + API**: kiến thức riêng và **hay đổi** nên dùng RAG — tìm đúng đoạn chính sách nhét
      vào ngữ cảnh; cập nhật chính sách chỉ cần cập nhật index, **không train lại** (fine-tune lại hằng
      tuần vừa đắt vừa dễ lỗi thời). Bắt đầu bằng **API model** cho nhanh và co giãn; chỉ chuyển self-host
      nếu có lý do cứng (khối lượng rất lớn, dữ liệu không được rời hệ thống).
      (2) **Grounding + retrieval**: bắt model **chỉ trả lời dựa trên đoạn tài liệu truy xuất được**,
      cho phép nói "không đủ thông tin", và **hiển thị trích dẫn nguồn** để người dùng kiểm chứng —
      giảm bịa, đúng với rủi ro pháp lý.
      (3) Một guardrail hợp lý, ví dụ: coi tài liệu/đầu vào ngoài là **dữ liệu, không phải lệnh** (chống
      prompt injection gián tiếp), **lọc PII** ở đầu vào/ra, và **chuyển cho người** khi câu hỏi vượt
      ngưỡng rủi ro (ví dụ tranh chấp hoàn tiền).
    rubric_md: "Đạt khi nêu đúng cả 3: (1) chọn RAG (vì kiến thức riêng/hay đổi) + API làm mặc định có lý do; (2) grounding/retrieval + trích dẫn để bám tài liệu, giảm bịa; (3) một guardrail phù hợp (injection gián tiếp / PII / escalation). Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Chọn fine-tune cho kiến thức hay đổi, hoặc thiếu phần grounding (cốt lõi giảm rủi ro pháp lý): tối đa điểm 1."
  - id: S366
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      **(Phỏng vấn AI engineer)** Thiết kế một **coding assistant** (gợi ý và giải thích code trong
      IDE) phục vụ nhiều người dùng. Trình bày đầu-cuối: (1) **yêu cầu + thước đo thành công**; (2)
      **kiến trúc + cách thích nghi** (prompt/RAG/fine-tune, API/self-host, retrieval ngữ cảnh code,
      workflow hay agent); (3) **eval harness**; (4) **an toàn**; (5) **streaming**; và (6) **chi phí,
      độ trễ bằng số** cùng **đánh đổi độ trễ ↔ GPU/chi phí ↔ chất lượng**, kèm rollout.
    answer_md: |
      **(1) Yêu cầu + thước đo**: người dùng muốn gợi ý/giải thích code **tức thì** ngay khi gõ; sai
      thì người dùng tự review nên rủi ro thấp. Ưu tiên **độ trễ thấp** hơn "câu trả lời hoàn hảo".
      Thước đo: **acceptance rate** (tỉ lệ gợi ý được giữ lại), **TTFT p95 < vài trăm ms**, chi phí mỗi
      1k gợi ý dưới ngưỡng.
      **(2) Kiến trúc + thích nghi**: bắt đầu bằng **API model** (nhanh, co giãn); **RAG trên codebase**
      (embedding các file/ký hiệu, truy xuất đoạn liên quan làm ngữ cảnh) vì kiến thức là code riêng và
      hay đổi — không fine-tune để nạp dữ kiện; có thể fine-tune nhẹ cho phong cách nếu cần. Dùng
      **workflow cố định** cho hoàn thiện/giải thích (biết trước luồng) và chỉ thêm **agent gọi tool**
      (chạy test, đọc file) cho tác vụ nhiều bước, với quyền tối thiểu. Đặt **gateway**: model nhỏ/độ
      trễ thấp cho gợi ý inline, model lớn cho giải thích khó (**model routing**), cache, fallback.
      **(3) Eval**: **golden set offline** gồm các đoạn code + hành vi mong đợi, chạy trước mỗi lần đổi
      để bắt regression; **tín hiệu online** (acceptance rate, chỉnh sửa sau khi chấp nhận);
      **LLM-as-judge** cho phần giải thích tự do (hiệu chỉnh với nhãn người); agent thì **replay** trong sandbox.
      **(4) An toàn**: coi code/tài liệu ngoài là **dữ liệu, không phải lệnh** (injection gián tiếp);
      lọc **secret/PII** trong code gửi đi; cảnh giác **lethal trifecta** nếu agent vừa đọc repo không
      tin cậy vừa có quyền chạy lệnh và ra mạng — phá một chân (người duyệt / sandbox / tách quyền).
      **(5) Streaming**: đẩy token qua **SSE** để chữ hiện ngay, đo **TTFT**; hỗ trợ **huỷ** khi người
      dùng gõ tiếp, báo lỗi mượt khi 429/timeout.
      **(6) Số liệu + đánh đổi + rollout**: chi phí theo token (ví dụ ~$5/1M vào + $15/1M ra; một gợi ý
      ~1k token ≈ sub-cent) × lượng dùng/ngày = ngân sách; nếu self-host, **số GPU ≈ throughput cần ÷
      throughput mỗi GPU** (continuous batching + KV cache nâng throughput). **Đánh đổi**: model lớn trả
      lời tốt hơn nhưng chậm/đắt hơn → với coding assistant ưu tiên **model nhỏ/độ trễ thấp** cho inline,
      dành model lớn cho câu khó qua routing. **Rollout**: canary 1%→10%→100% + A/B so acceptance rate,
      monitor độ trễ/lỗi/chi phí, tracing, và bơm ca lỗi về golden set (feedback loop).
    rubric_md: "Đạt (mức phỏng vấn, điểm 3) khi đi trọn đường dây và có số: (1) yêu cầu + thước đo gắn nghiệp vụ (ưu tiên độ trễ cho coding assistant); (2) kiến trúc hợp lý — API mặc định + RAG trên codebase + workflow/agent đúng chỗ + routing/gateway; (3) eval harness (golden set + online + judge); (4) an toàn (injection/secret/lethal trifecta); (5) streaming qua SSE + TTFT; (6) chi phí/GPU bằng số VÀ nêu rõ đánh đổi độ trễ↔GPU/chi phí↔chất lượng cùng rollout. Đúng, trong time-box, tự giải thích rõ: bằng chứng điểm 3. Thiếu phần số liệu + đánh đổi (độ trễ-GPU-chất lượng), hoặc thiếu eval, hoặc thiếu an toàn: chưa đạt mức 3."
