subtopic_id: sd.reliability_ops.fault_tolerance
items:
  - id: S160
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Kể tên **ít nhất 4** trong 6 cơ chế chịu lỗi (fault tolerance) cốt lõi và nói một câu mỗi cái. Ngoài
      ra, nêu **3 trạng thái** của một circuit breaker (cầu dao).
    answer_md: |
      Bốn (hoặc hơn) trong 6 cơ chế:
      - **Timeout (hạn chờ):** mọi lời gọi ra ngoài có deadline, để một dịch vụ chậm không giữ luồng vô hạn.
      - **Retry + exponential backoff + jitter:** thử lại lỗi thoáng qua, chờ lâu dần và ngẫu nhiên hoá để
        không đập dồn vào dịch vụ đang ốm (chỉ cho thao tác idempotent).
      - **Circuit breaker (cầu dao):** vượt ngưỡng lỗi thì ngừng gọi dịch vụ đang hỏng và trả lỗi/fallback ngay.
      - **Bulkhead (vách ngăn):** tách pool tài nguyên cho từng phụ thuộc để một chỗ hỏng không ăn hết tài nguyên cả hệ.
      - **Graceful degradation / fallback:** phục vụ bản rút gọn hoặc cache cũ thay vì trả lỗi.
      - **Load shedding:** quá tải thì từ chối sớm bớt việc ít quan trọng để cứu phần còn lại.

      Ba trạng thái circuit breaker: **Closed** (bình thường, cho qua và đếm lỗi) → **Open** (ngắt, fail
      fast, ngừng gọi) → **Half-open** (hé mở, cho vài yêu cầu thử để dò xem đã hồi chưa).
    rubric_md: "Đạt khi: nêu đúng tên + một câu cho ít nhất 4 cơ chế, và đủ 3 trạng thái cầu dao đúng tên (Closed/Open/Half-open). Đúng ý: bằng chứng điểm 1. Thiếu cơ chế thứ 4 hoặc sai/sót một trạng thái cầu dao: tối đa điểm 0."
  - id: S161
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Dịch vụ **thanh toán (payment)** gọi đồng bộ sang dịch vụ **gợi ý (recommendation)** để hiện khối
      gợi ý sau khi trả tiền. Dịch vụ gợi ý đang chậm tới 30 giây. Hãy nêu các cơ chế chịu lỗi để **thanh
      toán không sập theo** và giải thích mỗi cơ chế làm gì ở đây: (1) chặn việc một lời gọi treo giữ luồng;
      (2) ngừng hammer dịch vụ gợi ý khi nó đang hỏng; (3) người dùng vẫn hoàn tất thanh toán được.
    answer_md: |
      (1) **Timeout** ngắn trên lời gọi sang dịch vụ gợi ý (ví dụ vài trăm ms): hết hạn là bỏ, không ngồi
      chờ 30 giây giữ luồng — tránh cạn thread pool và cascading failure. Kèm **bulkhead**: dành một pool
      luồng/kết nối riêng cho lời gọi gợi ý để nó không nuốt tài nguyên của luồng thanh toán chính.
      (2) **Circuit breaker:** khi gợi ý lỗi/timeout liên tục vượt ngưỡng, mở cầu dao (Open) và *ngừng gọi*
      gợi ý, trả fallback ngay; sau một lúc half-open để dò. Điều này chặn việc retry ngây thơ đập vào dịch
      vụ đang ốm. Nếu có retry thì phải kèm backoff + jitter và **retry budget**.
      (3) **Graceful degradation / fallback:** coi gợi ý là *tính năng phụ* — thanh toán vẫn chạy và trả về
      thành công, chỉ bỏ khối gợi ý hoặc hiện bản cache cũ. Chức năng chính (trừ tiền) không phụ thuộc vào
      dịch vụ phụ.
    rubric_md: "Đạt khi nêu đúng cả 3 ý và giải thích được: timeout (+bulkhead) để lời gọi phụ không giữ luồng; circuit breaker để ngừng gọi dịch vụ đang hỏng; fallback/graceful degradation để thanh toán vẫn hoàn tất. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu ý fallback (vẫn hoàn tất được thanh toán) hoặc không nói được vì sao timeout quan trọng: tối đa điểm 1."
  - id: S162
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Một API tổng hợp (aggregator) nhận yêu cầu rồi gọi qua 3 tầng dịch vụ nối tiếp tới một dịch vụ sâu
      nhất. (a) Thêm đúng các cơ chế chịu lỗi vào thiết kế này và nói mỗi cái đặt ở đâu, để làm gì. (b) Giả
      sử bình thường dịch vụ sâu nhất nhận 1.000 req/s và mỗi tầng được cấu hình retry tối đa 3 lần: giải
      thích **retry storm bằng con số** — tải lên dịch vụ sâu nhất thành bao nhiêu? (c) Một **retry budget
      10%/tầng** kéo con số đó về đâu, và vì sao backoff + jitter và circuit breaker cũng cần thiết?
    answer_md: |
      (a) Cơ chế và vị trí:
      - **Timeout** trên mọi lời gọi giữa các tầng (kèm **deadline propagation** để tầng sau biết còn bao
        nhiêu thời gian mà bỏ việc quá hạn) — chặn treo luồng và cascading failure.
      - **Bulkhead** tách pool tài nguyên theo phụ thuộc để một tầng chậm không nuốt hết luồng.
      - **Circuit breaker** ở mỗi tầng gọi xuống tầng dưới: vượt ngưỡng lỗi thì Open (fail fast), half-open để dò.
      - **Retry + backoff + jitter** cho lỗi thoáng qua, chỉ với thao tác idempotent.
      - **Fallback / graceful degradation** và **load shedding** khi quá tải.
      (b) Mỗi tầng retry tối đa 3 lần nghĩa là mỗi yêu cầu vào đẻ ra tối đa 3 yêu cầu ra (×3). Qua 3 tầng:
      3 × 3 × 3 = **27×**. Dịch vụ sâu nhất nhận 27 × 1.000 = **27.000 req/s** đúng lúc nó đang ốm → sập
      hẳn → một blip nhỏ biến thành outage toàn hệ (retry amplification, vòng xoáy tự nuôi: càng lỗi càng
      retry càng tải).
      (c) **Retry budget 10%/tầng** giới hạn mỗi tầng chỉ khuếch đại ×1,1 thay vì ×3; qua 3 tầng:
      1,1 × 1,1 × 1,1 ≈ **1,33×**, tức ~**1.330 req/s** thay vì 27.000. Vẫn cần **backoff + jitter** để các
      lần thử không dồn thành spike đồng bộ, và **circuit breaker** để khi tầng dưới đã hỏng thì ngừng gọi
      hẳn (×3 thành ×0, trả fallback) cho nó thời gian hồi.
    rubric_md: "Đạt (mức phỏng vấn, mức 3) khi: (a) dán đúng ít nhất timeout + circuit breaker + fallback vào đúng chỗ; (b) tính đúng retry storm 3×3×3 = 27 → ~27.000 req/s và giải thích vòng xoáy; (c) nêu đúng retry budget 10% → ×1,1/tầng → ~1,33× (~1.330 req/s) và vai trò bổ sung của backoff+jitter và circuit breaker. Số đúng, trong time-box, tự giải thích rõ ràng: bằng chứng điểm 3. Sai phép nhân 27× hoặc không giải thích được retry budget chặn storm thế nào: chưa đạt mức 3."
