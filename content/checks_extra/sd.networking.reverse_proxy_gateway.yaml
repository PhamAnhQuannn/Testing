subtopic_id: sd.networking.reverse_proxy_gateway
items:
  - id: S091
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Nói ngắn gọn: **reverse proxy** khác **API gateway** ở điểm gì? Kể vài việc mà một reverse proxy
      lo, và vài việc mà API gateway gánh thêm.
    answer_md: |
      **Reverse proxy** đứng trước server và chủ yếu lo: kết thúc kết nối client và **TLS
      (TLS termination)**, phục vụ **cache/nội dung tĩnh**, giấu và bảo vệ backend (ví dụ nginx,
      Envoy). **API gateway** là một reverse proxy **chuyên cho API**: vẫn làm mọi việc đó nhưng
      gánh thêm các chính sách tầng API — **xác thực (auth), giới hạn tần suất (rate limiting), định
      tuyến/gom request (routing/aggregation)**, versioning và observability. Ngắn gọn: gateway =
      reverse proxy + chính sách tầng ứng dụng cho API.
    rubric_md: "Đạt khi nêu đúng: reverse proxy = chuyển tiếp/TLS/cache/giấu backend; API gateway thêm auth + rate limiting + routing (chính sách tầng API). Đúng ý cả hai vế: bằng chứng điểm 1; chỉ mô tả một bên hoặc lẫn với forward proxy: tối đa điểm 0."
  - id: S092
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Hệ có **20 microservice**. Một bạn đề xuất cho **mỗi service tự làm xác thực (auth) và giới hạn
      tần suất (rate limiting)** bên trong nó. Hãy đánh giá: (1) nên đặt auth và rate limiting ở đâu
      và **vì sao**; (2) có nên nhét luôn nghiệp vụ (business logic) vào chỗ đó không, vì sao.
    answer_md: |
      (1) Nên đặt auth và rate limiting ở **API gateway tại rìa (edge), làm một lần**, không lặp trong
      từng service. Lý do: đây là **mối quan tâm xuyên suốt (cross-cutting concern)** — đặt một chỗ thì
      **nhất quán** (không copy logic vào 20 nơi rồi mỗi nơi một kiểu, dễ lệch và sót lỗ hổng) và
      **chặn sớm** request xấu (chưa đăng nhập, vượt hạn mức) trước khi tốn tài nguyên backend; service
      phía sau được gọn hơn, chỉ lo nghiệp vụ.
      (2) **Không** nhét nghiệp vụ vào gateway. Gateway chỉ nên giữ policy chung; logic đặc thù từng
      domain phải nằm trong service tương ứng. Dồn nghiệp vụ vào gateway tạo ra **fat gateway** —
      biến nó thành nghẽn/SPOF và khó bảo trì.
    rubric_md: "Đạt khi nêu đúng cả 3 ý: (a) đặt ở gateway/edge làm một lần; (b) vì là cross-cutting concern -> nhất quán + chặn sớm, tránh lặp 20 chỗ; (c) không nhét nghiệp vụ vào gateway. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu lý do 'vì sao đặt ở edge' hoặc không cảnh báo nghiệp vụ: tối đa điểm 1."
  - id: S093
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Trả lời đầy đủ như trong phỏng vấn: (1) **auth, rate limiting, routing** nên đặt ở đâu và **vì
      sao**; (2) nêu rủi ro của một **fat gateway** (gateway bị nhồi quá nhiều việc); (3) **scale**
      gateway thế nào để tránh rủi ro đó. Nêu thêm một câu phân biệt gateway với **load balancer**.
    answer_md: |
      (1) Đặt **auth, rate limiting, routing** ở **API gateway tại rìa (edge), làm một lần**, không
      lặp trong từng service — vì chúng là **cross-cutting concern**: đặt một chỗ cho **nhất quán**,
      **không lặp** và **chặn request xấu sớm** trước khi tốn tài nguyên backend; service chỉ còn lo
      nghiệp vụ.
      (2) **Fat gateway** nguy hiểm vì gateway nằm trên đường đi của **mọi request**: nhồi quá nhiều
      việc (nhất là nghiệp vụ) biến nó thành **nghẽn (bottleneck)**, **điểm chết duy nhất (SPOF)** —
      sập gateway là sập cả hệ — và **nút cổ chai triển khai (deployment chokepoint)**, mọi đội giẫm
      chân nhau trên một gateway khổng lồ.
      (3) **Scale gateway**: giữ nó **stateless** để nhân bản được, **scale ngang** bằng cách chạy
      **nhiều bản gateway sau một load balancer**, và **giữ logic mỏng (thin)** — chỉ policy chung,
      đẩy nghiệp vụ về service.
      Phân biệt: **load balancer chỉ chia tải (distribute)** và kiểm tra sức khoẻ, không hiểu nội
      dung; **API gateway thêm chính sách tầng ứng dụng (auth, rate limit, routing)** cần hiểu nội
      dung request. Thực tế LB đứng trước, rải request vào nhiều bản gateway stateless.
    rubric_md: "Đạt (mức phỏng vấn, theo mastery bar) khi đủ cả ba: (1) nói auth/rate limiting/routing đặt ở gateway/edge làm một lần VÀ vì sao (cross-cutting: nhất quán + chặn sớm, không lặp); (2) nêu đúng rủi ro fat gateway (nghẽn / SPOF / chokepoint triển khai); (3) cách scale = stateless + ngang + nhiều bản sau LB + giữ logic mỏng. Đúng, trong time-box, tự giải thích rõ ràng (kèm phân biệt LB vs gateway): bằng chứng điểm 3. Thiếu một trong ba trụ (nơi+vì sao / rủi ro fat gateway / cách scale): chưa đạt mức 3."
