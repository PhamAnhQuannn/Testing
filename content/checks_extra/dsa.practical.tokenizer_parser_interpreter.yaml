subtopic_id: dsa.practical.tokenizer_parser_interpreter
items:
  - id: X538
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      def scan(s):
          out = []
          i = 0
          while i < len(s):
              c = s[i]
              if c.isdigit():
                  j = i
                  while j < len(s) and s[j].isdigit():
                      j += 1
                  out.append(s[i:j])
                  i = j
              elif c in "+-*/()":
                  out.append(c)
                  i += 1
              else:
                  i += 1
          return out

      print(scan("7 + 25*(3-1)"))
      print(len(scan("100")))
    expected_output: "['7', '+', '25', '*', '(', '3', '-', '1', ')']\n1"
    answer_md: 'Khoảng trắng bị bỏ qua, dãy chữ số liền nhau (`25`) được gom thành một token và mỗi dấu hoặc ngoặc là một token riêng, nên ra danh sách 9 token. Chuỗi `"100"` chỉ có chữ số liền nhau nên là đúng 1 token.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X539
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết `tokenize(expr)`: cắt chuỗi biểu thức số học thành danh sách token. Token là một trong các ký tự đơn `+ - * / ( )` hoặc một số nguyên không âm nhiều chữ số (các chữ số liên tiếp tạo thành MỘT token). Bỏ qua khoảng trắng. `tokenize("12+3*(4-5)")` là `["12", "+", "3", "*", "(", "4", "-", "5", ")"]`. Gợi ý: một con trỏ `i`, gặp chữ số thì mở rộng `j` tới hết dãy chữ số.
    problem_id: check-x539-tokenize
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X540
    difficulty: 3
    type: write_code
    minutes: 10
    prompt_md: |
      Viết `eval_expr(expr)`: tính biểu thức số nguyên có `+ - * /`, ngoặc và khoảng trắng, với độ ưu tiên thông thường (`*`, `/` trước `+`, `-`; kết hợp trái). `/` là chia nguyên cắt về 0 (`int(a / b)`), đầu vào không chia cho 0. Không dùng `eval`. `eval_expr("12+3*(4-5)")` là `9`. Gợi ý: tokenize rồi recursive descent với ba hàm expr, term, factor.
    problem_id: check-x540-eval-expr
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
