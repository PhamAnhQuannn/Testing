subtopic_id: sd.async.stream_processing
items:
  - id: S118
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Trả lời ngắn gọn: (a) Xử lý luồng (stream) khác xử lý lô (batch) ở điểm cốt lõi nào (độ trễ,
      kiểu dữ liệu)? (b) Event time và processing time là gì, và nên đếm theo cái nào? (c) Kể tên ba
      loại cửa sổ (window).
    answer_md: |
      (a) Stream xử lý từng sự kiện liên tục ngay khi tới, nhắm **độ trễ thấp (low latency)**; batch
      chạy trên một **khối dữ liệu hữu hạn (bounded)** gom sẵn, nhắm **thông lượng cao (high
      throughput)** và kết quả trễ hơn.
      (b) **Event time** = lúc việc thật sự xảy ra; **processing time** = lúc bộ xử lý nhận được sự
      kiện. Để đếm đúng phải tính theo **event time**.
      (c) **Tumbling** (cố định, không chồng), **sliding** (trượt), **session** (theo khoảng nghỉ của
      người dùng).
    rubric_md: "Đúng ý cả ba phần (stream vs batch theo độ trễ/khối dữ liệu; event time vs processing time và chọn event time; ba loại window): bằng chứng điểm 1. Thiếu một phần, hoặc lẫn event time với processing time: tối đa điểm 0."
  - id: S119
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Bạn đếm click quảng cáo **mỗi phút** từ một luồng Kafka để hiện lên dashboard. (1) Dùng loại
      window nào, và tính theo event time hay processing time, vì sao? (2) Một click xảy ra lúc
      10:00:59 nhưng tới bộ xử lý lúc 10:01:30 — nó thuộc phút nào, và cơ chế nào giúp nó vẫn được tính
      đúng dù tới muộn? (3) Vì sao phần ghi ra kho đích phải idempotent?
    answer_md: |
      (1) **Tumbling window 1 phút** (khung cố định, không chồng, mỗi click vào đúng một khung), tính
      theo **event time** để click thuộc đúng phút nó xảy ra, bất kể lúc nào tới server.
      (2) Thuộc **phút 10:00** (theo event time 10:00:59). **Watermark** với một biên trễ cho phép (ví
      dụ 2 phút) giữ cửa sổ 10:00 mở đủ lâu để nhận click tới lúc 10:01:30 trước khi chốt.
      (3) Vì khi worker chết và khôi phục từ **checkpoint**, các sự kiện sau checkpoint bị **phát lại
      (replay)**; ghi **idempotent** (upsert theo khóa [phút, ad_id]) khiến chạy lại ra đúng cùng một
      con số, không đếm đúp.
    rubric_md: "Đạt khi nêu đúng cả 3 ý: tumbling 1 phút tính theo event time (và vì sao); click thuộc phút 10:00 nhờ watermark giữ cửa sổ mở đủ lâu cho sự kiện muộn; ghi idempotent để replay sau khôi phục không đếm đúp. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu ý event time/watermark, hoặc không giải thích được vì sao cần idempotent: tối đa điểm 1."
  - id: S120
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Thiết kế đầu-cuối một pipeline **đếm click mỗi phút theo thời gian thực** cho dashboard. Trình
      bày: (1) đường đi dữ liệu và việc tính theo event time; (2) loại window và vì sao; (3) xử lý sự
      kiện muộn bằng watermark, nêu đánh đổi của biên trễ; (4) khôi phục khi worker chết; (5) đảm bảo
      không đếm đúp khi ghi ra kho; (6) khi nào chỉ cần batch thay vì stream.
    answer_md: |
      (1) Click được ghi vào **Kafka** (phân partition theo ad_id); một bộ xử lý luồng (Flink / Spark
      Structured Streaming / Kafka Streams) đọc và tính theo **event time** (giờ click xảy ra), không
      theo processing time.
      (2) **Tumbling window 1 phút**: yêu cầu là "mỗi phút", khung cố định không chồng nên mỗi click
      rơi vào đúng một phút.
      (3) **Watermark** = event time lớn nhất đã thấy trừ một biên trễ cho phép (ví dụ 2 phút); khi
      watermark vượt cuối một phút thì chốt và phát kết quả. Biên lớn = chính xác hơn nhưng dashboard
      trễ hơn; biên nhỏ = nhanh nhưng dễ bỏ sót click muộn. Click tới sau watermark cho vào nhánh phụ
      (side output) để sửa sau.
      (4) Định kỳ lưu **checkpoint** (ảnh chụp bộ đếm từng cửa sổ + offset Kafka); worker chết thì nạp
      lại trạng thái từ checkpoint gần nhất và đọc lại Kafka từ offset đó, không tính lại từ đầu.
      (5) Khôi phục làm **replay** các sự kiện sau checkpoint, nên **ghi idempotent** ra kho OLAP:
      upsert theo khóa [phút, ad_id] (ghi đè thay vì cộng thêm) để chạy lại không đếm đúp — đạt
      exactly-once ở sink.
      (6) **Batch là đủ** khi không cần độ trễ thấp (báo cáo doanh thu ngày xem sáng hôm sau) hoặc khi
      cần tính lại trên dữ liệu lịch sử lớn (backfill); lúc đó batch rẻ hơn và dễ kiểm tra lại hơn.
    rubric_md: "Đạt (mức phỏng vấn) khi trình bày đủ 6 ý mạch lạc: đường đi qua Kafka + tính theo event time; tumbling 1 phút (và vì sao); watermark xử lý sự kiện muộn kèm đánh đổi biên trễ; khôi phục bằng checkpoint (trạng thái + offset); ghi idempotent để không đếm đúp; và nêu đúng khi nào batch là đủ. Đúng, trong time-box, tự giải thích rõ ràng: bằng chứng điểm 3. Sót watermark, checkpoint hoặc idempotent, hoặc không nói được khi nào dùng batch: chưa đạt mức 3."
