subtopic_id: py.functions.lambda_hof
items:
  - id: X008
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết `run_pipeline(x, ops)`: `x` là số nguyên, `ops` là list tên phép biến đổi, mỗi tên là một
      trong `"inc"` (cộng 1), `"double"` (nhân 2), `"square"` (bình phương), `"neg"` (đổi dấu).
      Áp dụng lần lượt các phép trong `ops` lên `x` (từ trái sang phải) và trả về kết quả; `ops` rỗng
      thì trả `x`. Gợi ý: lưu các phép biến đổi dưới dạng hàm trong một dict (tên -> lambda).
    problem_id: check-x008
    rubric_md: "Pass toàn bộ test ẩn. Đúng: bằng chứng điểm 2; sai: tối đa điểm 1."
  - id: X331
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: |
      Viết `compose_apply(xs, specs)`: mỗi spec `[name, n]` mô tả một hàm một tham số (`add`: v+n, `mul`: v*n,
      `pow`: v**n, `mod`: v%n, `neg`: -v). Dựng các hàm (closure) từ `specs`, ghép từ trái sang phải bằng `reduce`
      và trả về `[f(x) for x in xs]`; `specs` rỗng thì trả `xs`. Chú ý late binding khi tạo lambda trong vòng lặp.
    problem_id: check-compose-apply
    rubric_md: "Dựng closure đúng (không dính late binding), compose đúng thứ tự, pass toàn bộ test ẩn không cần gợi ý: điểm 3; pass nhưng phải xem gợi ý: tối đa điểm 2; sai: tối đa điểm 1."
