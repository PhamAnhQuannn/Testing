subtopic_id: sd.distributed.distributed_locks
items:
  - id: S136
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Nói ngắn gọn: một **lease** khác một khóa thường ở điểm gì, và nó giải quyết được rủi ro nào của
      khóa phân tán?
    answer_md: |
      Lease là một khóa **có hạn (TTL, time-to-live)**: hết hạn thì **tự nhả**. Nhờ vậy nếu máy đang giữ
      khóa **treo hoặc chết**, khóa không bị giữ mãi mà tự giải phóng cho máy khác dùng (giải quyết rủi ro
      máy chết chặn cả hệ — vấn đề liveness). Máy còn sống muốn giữ lâu hơn phải **gia hạn (renew)** trước
      khi hết hạn.
    rubric_md: "Đạt khi nêu đúng: lease = khóa có TTL tự hết hạn, và nhờ đó máy chết/treo không giữ khóa mãi (tự nhả). Đúng ý: bằng chứng điểm 1; thiếu ý 'có hạn/tự nhả' hoặc không nối với máy chết: tối đa điểm 0."
  - id: S137
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một worker lấy lease 30 giây rồi ghi vào một kho. Nó bị **GC pause 40 giây**; trong lúc đó lease hết
      hạn và một worker khác giành được khóa và đã ghi. Khi worker cũ tỉnh dậy, nó định ghi tiếp. Hãy chỉ ra:
      (1) vì sao **chỉ tăng TTL** không phải là lời giải đúng; (2) cơ chế **fencing token** chặn ghi sai thế
      nào; (3) **ai** phải kiểm tra token để an toàn.
    answer_md: |
      (1) Tăng TTL chỉ **giảm xác suất**, không loại được lỗi: luôn có thể có một pause dài hơn, và worker
      treo **không biết** nó đã quá hạn nên vẫn ghi — an toàn không nên dựa vào giả định thời gian.
      (2) Mỗi lần cấp khóa, kho khóa phát kèm một **fencing token tăng dần (monotonic)**: worker cũ giữ
      token nhỏ (ví dụ 33), worker mới giành khóa sau được token lớn hơn (34). Mọi lệnh ghi đính kèm token
      của mình.
      (3) **Kho dữ liệu đích (tài nguyên được bảo vệ)** phải nhớ token lớn nhất đã thấy và **từ chối** ghi
      có token nhỏ hơn. Nên khi worker cũ ghi với token 33 < 34, kho từ chối — an toàn không phụ thuộc
      worker cũ có kịp nhận ra mình mất khóa hay không.
    rubric_md: "Đạt khi nêu đúng cả 3 ý: TTL chỉ giảm xác suất (máy treo không biết mình quá hạn), fencing token là số tăng dần cấp kèm khóa, và chính kho đích từ chối token nhỏ hơn. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu ý 'kho đích tự kiểm tra token' hoặc không chỉ ra vì sao TTL không đủ: tối đa điểm 1."
  - id: S138
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Thiết kế một **lock service** đủ dùng cho phỏng vấn: (1) nêu API và vai trò của **lease (TTL) +
      gia hạn**; (2) **fencing token** được cấp và thực thi ở đâu để an toàn khi máy giữ khóa treo; (3)
      đặt state khóa ở đâu cho đáng tin, và vì sao **Redlock** gây tranh cãi; (4) cho một ví dụ **nên thay
      khóa bằng compare-and-set (CAS)** và nói rõ điều kiện áp dụng.
    answer_md: |
      (1) **API**: acquire(tên_khóa, ttl) trả về **fencing token** hoặc từ chối; renew(tên, token) gia hạn
      trước khi hết; release(tên, token) nhả. Dùng **lease có TTL** để máy chết tự nhả khóa; client còn sống
      gia hạn đều (thường khi còn khoảng 1/3 hạn), thất bại nhiều lần thì tự coi như mất khóa và **dừng ghi**.
      (2) Mỗi acquire cấp một **số tăng dần đều (monotonic fencing token)**. Client đính token vào mỗi lệnh
      ghi, và **tài nguyên đích** phải **từ chối ghi có token nhỏ hơn token lớn nhất đã thấy**. Nhờ đó một
      máy treo quá lease rồi tỉnh dậy ghi với token cũ sẽ bị chặn — an toàn không dựa vào đồng hồ.
      (3) Đặt state khóa ("tên -> chủ, token, hạn") trong một cụm **consensus** (ZooKeeper/etcd, dùng
      **ephemeral node** tự mất khi phiên client đứt), ghi qua đa số nên chịu được vài máy chết. **Redlock**
      (xin khóa trên nhiều Redis độc lập) gây tranh cãi vì tính an toàn của nó **giả định đồng hồ các máy
      chạy đều và không có pause dài** — đúng những giả định không nên tin trong hệ phân tán; nên vẫn cần
      fencing token.
      (4) Khi thao tác chỉ **cập nhật một khóa đơn** (ví dụ trừ tồn kho một bản ghi), nên **bỏ khóa** và
      dùng **compare-and-set (CAS)** / ghi có điều kiện: "giảm số lượng và tăng version, với điều kiện id=7
      **và** version vẫn = 5". Chỉ một người ghi thắng, người kia đọc lại và thử lại. Điều kiện áp dụng:
      thao tác gói gọn trong một khóa/bản ghi mà kho hỗ trợ ghi điều kiện nguyên tử; không hợp khi cần khóa
      nhiều tài nguyên hay giữ khóa xuyên nhiều bước.
    rubric_md: "Đạt (mức phỏng vấn) khi: (1) API acquire/renew/release theo lease TTL + gia hạn; (2) fencing token tăng dần cấp ở acquire và được **tài nguyên đích** thực thi (từ chối token cũ); (3) state trong cụm consensus (ZooKeeper/etcd) thay vì một Redis đơn, và nêu đúng vì sao Redlock bị chê (giả định đồng hồ/không pause); (4) chỉ ra ca một-khóa-đơn nên dùng CAS và điều kiện áp dụng. Đúng, trong time-box, tự giải thích rõ: bằng chứng điểm 3. Thiếu phần fencing token do tài nguyên đích thực thi, hoặc không nói được khi nào thay bằng CAS: chưa đạt mức 3."
