subtopic_id: py.runtime.memory_gc
items:
  - id: X718
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
    code: |-
      refs = {1: [2], 2: [3], 3: [], 4: [5], 5: [4]}
      alive = set()
      stack = [1]
      while stack:
          n = stack.pop()
          if n in alive:
              continue
          alive.add(n)
          stack.extend(refs[n])
      print(sorted(alive))
      print(len(refs) - len(alive))
    expected_output: "[1, 2, 3]\n2"
    answer_md: "Từ root 1 đi 1 -> 2 -> 3 nên alive = {1, 2, 3}. 4 và 5 trỏ lẫn nhau nhưng không với tới được từ root nên là rác: 5 - 3 = 2."
    rubric_md: "Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X719
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `live_objects(refs, roots)`. `refs` là dict ánh xạ id object (số nguyên) sang list các id nó tham chiếu; `roots` là list id gốc. Trả về list **đã sắp xếp** mọi id với tới được từ `roots` bằng cách đi theo tham chiếu (gồm cả root), tức các object sống sót sau GC. Có thể có cycle nên cần visited set; id chỉ được tham chiếu mà không là key của `refs` vẫn tính là sống. Ví dụ `refs = {1: [2], 2: [1], 3: []}`, `roots = [1]` cho `[1, 2]` (3 là rác).
    problem_id: check-x719-live-objects
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X720
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao id 5 là rác dù nó tự tham chiếu chính mình.
    code: |-
      refs = {1: [2], 2: [3], 3: [2], 4: [1], 5: [5]}
      roots = [4]
      seen = []
      stack = list(roots)
      while stack:
          n = stack.pop()
          if n in seen:
              continue
          seen.append(n)
          stack.extend(refs[n])
      print(sorted(seen))
      garbage = sorted(set(refs) - set(seen))
      print(garbage)
      print(len(garbage))
    expected_output: "[1, 2, 3, 4]\n[5]\n1"
    answer_md: "Từ root 4 đi tới 1, 2, 3; cycle 2 <-> 3 vẫn sống vì với tới được từ root. Id 5 chỉ trỏ vào chính nó, không có đường từ root nên là rác. Refcount của 5 vẫn là 1 do tự tham chiếu nên refcount không giải phóng được; cần generational GC dọn."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng: 5 không với tới được từ root (refcount không về 0 do self-reference nên cần GC); cycle 2-3 sống vì nối tới root. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
