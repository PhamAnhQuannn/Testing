subtopic_id: ml.classical.ensembles
items:
  - id: X689
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
    code: |-
      votes = [1, 0, 1, 1, 0]
      ones = sum(votes)
      print(ones)
      print(1 if ones > len(votes) / 2 else 0)
    expected_output: "3\n1"
    answer_md: "`sum(votes)` = 3 phiếu cho lớp 1. Ngưỡng là 5 / 2 = 2,5; 3 > 2,5 nên đa số chọn 1."
    rubric_md: "Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X690
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `majority_vote(predictions)` gộp dự đoán của nhiều mô hình bằng bỏ phiếu đa số. `predictions[m][j]` là nhãn nguyên mà mô hình `m` dự đoán cho mẫu `j` (mọi mô hình cùng độ dài, có ít nhất 1 mô hình và 1 mẫu). Với mỗi mẫu chọn nhãn có nhiều phiếu nhất; nếu hoà thì chọn nhãn **nhỏ hơn**. Trả về list nhãn cho từng mẫu. Ví dụ `[[0,1,1],[0,0,1],[1,0,1]]` cho `[0,0,1]`.
    problem_id: check-x690-majority-vote
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X691
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao mỗi vòng boosting khớp residual làm sai số giảm, và learning_rate = 0,5 ảnh hưởng thế nào.
    code: |-
      y = [10, 20]
      pred = [0.0, 0.0]
      lr = 0.5
      for step in range(2):
          resid = [a - b for a, b in zip(y, pred)]
          pred = [b + lr * r for b, r in zip(pred, resid)]
          print(resid, pred)
      print(max(abs(a - b) for a, b in zip(y, pred)))
    expected_output: "[10.0, 20.0] [5.0, 10.0]\n[5.0, 10.0] [7.5, 15.0]\n5.0"
    answer_md: "Vòng 1: residual = [10, 20] − [0, 0] = [10.0, 20.0]; pred = 0 + 0,5·residual = [5.0, 10.0]. Vòng 2: residual = [5.0, 10.0]; pred = [5 + 2,5, 10 + 5] = [7.5, 15.0]. Sai số lớn nhất còn lại = max(2,5; 5,0) = 5.0. Mỗi vòng khớp residual rồi cộng lr·residual nên sai số giảm một nửa (lr = 0,5); lr nhỏ hơn thì giảm chậm hơn, cần nhiều cây hơn."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng mỗi vòng cộng lr nhân residual nên sai số giảm dần (lr nhỏ cần nhiều cây hơn). Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
