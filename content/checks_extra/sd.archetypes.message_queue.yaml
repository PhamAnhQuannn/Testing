subtopic_id: sd.archetypes.message_queue
items:
  - id: S235
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Lõi lưu trữ của một broker là một **file log chỉ ghi nối đuôi (append-only log)**. Nói ngắn
      gọn: (1) vì sao ghi theo kiểu nối đuôi lại nhanh, và (2) khi log chia theo **đoạn (segment)**
      thì xoá tin cũ (quá hạn retention) được làm thế nào?
    answer_md: |
      (1) Ghi nối đuôi là **ghi tuần tự (sequential write)** xuống đĩa — đầu đọc/ghi không phải nhảy
      lung tung như ghi ngẫu nhiên — nên đạt thông lượng cao (hàng trăm MB/giây); broker không bao
      giờ sửa/chèn tin ở giữa, chỉ gán **offset** tăng dần và nối vào đuôi.
      (2) Log là một chuỗi **đoạn (segment)** (ví dụ 1 GB mỗi đoạn); xoá tin quá hạn chỉ cần **bỏ
      nguyên cả file đoạn** đã quá cũ, không phải dọn từng tin một.
    rubric_md: "Đạt khi nêu đúng cả hai ý: (1) nối đuôi = ghi tuần tự nên nhanh hơn ghi ngẫu nhiên; (2) xoá tin cũ = bỏ nguyên file đoạn (segment) quá hạn. Đúng cả hai: bằng chứng điểm 1. Chỉ nói 'nhanh' mà không nêu ghi tuần tự, hoặc thiếu ý xoá theo đoạn: tối đa điểm 0."
  - id: S236
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một đội đặt producer ở **acks = 1** cho một topic đơn hàng (mỗi partition có 3 bản sao). Sau một
      lần **leader của partition chết đột ngột**, họ phát hiện **mất một ít đơn hàng vừa báo thành
      công**. Hãy giải thích: (1) vì sao acks = 1 lại để lọt mất tin trong tình huống này; (2) nên đổi
      sang mức nào và khái niệm **ISR / "đã chốt (committed)"** bảo đảm điều gì; (3) đánh đổi phải chấp
      nhận khi đổi.
    answer_md: |
      (1) Với **acks = 1**, broker báo thành công ngay khi **leader** ghi xong, *chưa* chờ follower
      chép. Nếu leader chết **trước khi** follower kịp sao lại những tin cuối, một follower lên làm
      leader mới sẽ **không có** các tin đó — nên chúng mất dù producer đã nhận "thành công".
      (2) Nên đổi sang **acks = all**: broker chỉ báo thành công khi tin đã được ghi vào **mọi bản
      trong ISR (in-sync replicas — tập bản sao đang theo kịp leader)**, tức tin **đã chốt
      (committed)**. Vì mọi bản ISR đều có tin, chọn bất kỳ bản ISR nào làm leader mới cũng không mất
      tin đã chốt.
      (3) Đánh đổi: acks = all **chậm hơn / độ trễ ghi cao hơn** vì phải chờ sao chép tới ISR; chấp
      nhận điều đó để đổi lấy độ bền cho dữ liệu quan trọng như đơn hàng.
    rubric_md: "Đạt khi nêu đúng cả 3 ý: (1) acks = 1 báo xong khi mới có leader, leader chết trước khi follower chép thì mất tin; (2) đổi sang acks = all, 'đã chốt' = ghi vào mọi bản ISR nên leader mới vẫn có tin; (3) đánh đổi là độ trễ/throughput kém hơn. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu ý ISR/committed hoặc không nêu đánh đổi độ trễ: tối đa điểm 1."
  - id: S237
    difficulty: 3
    type: concept
    minutes: 12
    prompt_md: |
      Trong phỏng vấn "**Design a distributed message queue**", hãy trình bày thiết kế **phía broker**
      theo lộ trình tăng dần: (1) dựng từ **một file log chỉ ghi nối đuôi** lên **partition** rồi
      **replica**, nêu vai trò leader/follower và cái giá về thứ tự khi chia partition; (2) giải thích
      các mức **acks** cùng **ISR** và định nghĩa "**đã chốt (committed)**", nêu đánh đổi độ bền ↔ độ
      trễ; (3) so sánh **queue xoá tin sau khi xác nhận** với **log giữ tin**, và nói rõ khi nào chọn
      kiểu nào.
    answer_md: |
      (1) **Từ log tới partition tới replica.** Lõi là một **file log chỉ ghi nối đuôi (append-only)**
      cắt theo **đoạn (segment)**: ghi tuần tự nên nhanh, mỗi tin có **offset**, xoá tin cũ bằng cách
      bỏ cả file đoạn. Để chạy song song, chia topic thành nhiều **partition**, mỗi partition là một
      log riêng trên các máy khác nhau — thông lượng cộng dồn. Cái giá: chỉ bảo đảm **thứ tự trong
      từng partition**, không giữa các partition, nên gom tin cùng **khoá (key)** về một partition.
      Để chịu lỗi, mỗi partition có **nhiều bản sao (replica, thường 3)**: **leader** nhận mọi lệnh
      đọc/ghi, **follower** chép lại log leader; leader chết thì một follower (trong ISR) lên thay.
      (2) **acks và ISR.** **ISR** là tập replica đang chép kịp leader. Một tin **đã chốt (committed)**
      khi đã ghi vào **mọi bản trong ISR**. Producer chọn mức: **acks = 0** (bắn rồi quên, nhanh nhất,
      dễ mất), **acks = 1** (chờ leader; mất nếu leader chết trước khi follower chép), **acks = all**
      (chờ toàn bộ ISR, tức chờ committed, bền nhất nhưng chậm hơn). Đánh đổi: càng chắc càng chậm;
      dữ liệu quan trọng dùng acks = all.
      (3) **Hai kiểu broker.** **Queue xoá sau ack (SQS/RabbitMQ):** giao một tin cho một worker, ẩn
      trong **visibility timeout**; ack thì xoá, hết hạn thì tin hiện lại để giao lại, quá N lần vào
      **DLQ** — hợp **chia việc**, mỗi tin xử lý một lần, không đọc lại được. **Log giữ tin (Kafka):**
      giữ tin suốt **retention**, đọc không xoá, mỗi **consumer group** có offset riêng nên nhiều bên
      đọc độc lập và **tua lại (replay)** được — hợp nhiều bên tiêu thụ cùng một dòng sự kiện và cần
      đọc lại. Chọn: cần chia việc cho worker, mỗi tin một lần → queue xoá sau ack; cần một dòng sự
      kiện cho nhiều bên đọc lại → log giữ tin.
    rubric_md: "Đạt (mức phỏng vấn, theo mastery_bar L3) khi làm đủ ba phần: (1) dựng log append-only → partition (nêu đúng cái giá về thứ tự) → replica leader/follower; (2) giải thích đúng ba mức acks và ISR/committed kèm đánh đổi độ bền ↔ độ trễ; (3) so sánh đúng queue xoá sau ack với log giữ tin và nêu tiêu chí chọn. Đúng, trong time-box, tự giải thích mạch lạc: bằng chứng điểm 3. Sót một trong ba phần, hoặc không nêu được đánh đổi acks, hoặc không phân biệt được hai kiểu broker: chưa đạt mức 3."
