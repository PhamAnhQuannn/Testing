subtopic_id: sd.archetypes.lock_service
items:
  - id: S262
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Kể **ba lời gọi API** của một dịch vụ khoá (lock service) và việc của từng cái. **acquire** trả
      về cái gì đặc biệt, và số đó có tính chất gì?
    answer_md: |
      Ba lời gọi:
      - **acquire(tên_khoá, lease_ttl)**: xin khoá trong một hạn `lease_ttl`; thành công thì trả về
        một **số chặn (fencing token)**, thất bại thì từ chối (khoá đang bận).
      - **renew(tên_khoá, token)** / heartbeat: gia hạn lease trước khi hết hạn để tiếp tục giữ khoá.
      - **release(tên_khoá, token)**: chủ động nhả khoá khi làm xong.

      `acquire` trả về **số chặn (fencing token)**: một số **tăng dần đơn điệu (monotonic)** — lần cấp
      khoá sau luôn lớn hơn lần trước — để tài nguyên loại được ghi của người giữ khoá cũ.
    rubric_md: "Đạt khi nêu đúng cả ba lời gọi (acquire/renew/release) với việc của mỗi cái, và nói acquire trả về **số chặn (fencing token)** tăng dần đơn điệu. Đúng ý: bằng chứng điểm 1. Thiếu renew hoặc không nói token tăng dần: tối đa điểm 0."
  - id: S263
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Hai worker A và B cùng thấy một job và cùng gọi **acquire("job-42", 10s)**. A được khoá với số
      chặn 7 và bắt đầu ghi kết quả vào storage. Giữa chừng A bị **GC pause** 15 giây nên không
      renew kịp. Hãy giải thích: (1) điều gì xảy ra với khoá của A trong lúc nó treo; (2) B làm được
      gì; (3) khi A tỉnh dậy và ghi tiếp, vì sao storage không bị hỏng dữ liệu.
    answer_md: |
      (1) A treo 15s > lease 10s nên **không renew kịp**; **lease của A hết hạn và khoá tự nhả** —
      dịch vụ không cần biết A còn sống hay chết, chỉ thấy lease hết.
      (2) Khoá rảnh, **B acquire được** và nhận **số chặn lớn hơn** (ví dụ 8), rồi bắt đầu xử lý job.
      (3) A tỉnh dậy tưởng mình vẫn giữ khoá và gửi lệnh ghi kèm token cũ **7**. Nhưng storage đã
      thấy token **8** từ B, nên nó **từ chối mọi ghi có token < 8**: ghi muộn của A bị loại, dữ liệu
      không bị hai chủ ghi đè lẫn nhau. Đây đúng là việc của **số chặn (fencing token)**.
    rubric_md: "Đạt khi nêu đủ 3 ý: (1) lease hết hạn ⇒ khoá A tự nhả vì không renew kịp; (2) B acquire được với token lớn hơn; (3) storage loại ghi có token nhỏ hơn (fencing) nên an toàn. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu ý fencing token chặn ghi cũ, hoặc không nói lease tự hết: tối đa điểm 1."
  - id: S264
    difficulty: 3
    type: concept
    minutes: 12
    prompt_md: |
      Thiết kế một **dịch vụ khoá phân tán** (kiểu Chubby/ZooKeeper) dùng chung cho nhiều team, cũng
      để **bầu leader**. Trình bày đủ bốn phần: (1) **API** (acquire/renew/release với số chặn, kèm
      quy tắc lease và khi nào client renew); (2) **cụm máy** chạy đồng thuận và vì sao; (3) **tính
      cỡ cụm** — nêu công thức quorum và ước lượng tải ghi từ renew cho ~1 triệu khoá; (4) **client
      làm gì khi mất kết nối** tới dịch vụ.
    answer_md: |
      **(1) API.** `acquire(tên, lease_ttl)` → trả về **số chặn (fencing token)** tăng dần đơn điệu
      (hoặc từ chối nếu bận); `renew(tên, token)`/heartbeat gia hạn lease; `release(tên, token)` nhả.
      Lease có hạn: **không renew kịp thì khoá tự nhả**, nên client treo/chết không giữ khoá mãi.
      Client nên **renew khi còn ~1/3 hạn** để chịu được vài lần trễ mạng.

      **(2) Cụm.** Một cụm **số lẻ 3 hoặc 5 node chạy đồng thuận (consensus Raft/Paxos)**; bảng "tên
      khoá → chủ, số chặn, hạn" được nhân bản nhất quán. Mọi **ghi đi qua leader và cần đa số
      (quorum)** xác nhận. Lý do: khoá cần **an toàn (không hai chủ) và chịu lỗi** — nhân bản qua đa
      số giúp trạng thái sống sót khi **thiểu số** node chết (**3 chịu 1, 5 chịu 2**); số lẻ để đa số
      luôn rõ ràng.

      **(3) Tính cỡ.** **quorum = ⌊n/2⌋+1** (n=5 ⇒ 3). Mỗi ghi qua đa số nên thông lượng ghi cả cụm
      chỉ cỡ vài nghìn–vài chục nghìn ghi/giây và **không tăng khi thêm node**. Ước lượng: 1 triệu
      khoá renew mỗi 10s ⇒ ~**100.000 renew/giây**, vượt sức một cụm ⇒ **chia khoá theo tên ra nhiều
      cụm độc lập (shard)** và/hoặc tăng `lease_ttl` để renew thưa hơn. RAM nhẹ (~100 MB cho 1 triệu
      khoá). Bầu leader: dùng khoá "leader-của-X", bản giữ khoá làm leader và renew liên tục; nó chết
      thì lease hết, bản khác acquire được với số chặn lớn hơn.

      **(4) Mất kết nối.** Client phải **giả định có thể đã mất khoá** (không renew được ⇒ lease sẽ
      hết) và **dừng ngay thao tác lên tài nguyên được bảo vệ**. Không được làm tiếp: dịch vụ có thể
      đã cấp khoá cho người khác với số chặn lớn hơn; **fencing token** ở phía tài nguyên là lớp bảo
      hiểm cuối loại ghi muộn của client cũ.
    rubric_md: "Đạt (mức phỏng vấn L3) khi trình bày đủ 4 phần đúng: (1) API acquire/renew/release trả fencing token + quy tắc lease/renew; (2) cụm 3–5 node đồng thuận, ghi qua leader+quorum, vì sao (an toàn + chịu lỗi thiểu số, 5 chịu 2); (3) **quorum = ⌊n/2⌋+1 đúng**, ước lượng renew/giây ~100k và chia ra nhiều cụm; (4) mất kết nối ⇒ giả định mất khoá, dừng thao tác, fencing token chặn ghi cũ. Đúng, trong time-box, phép tính quorum chính xác, tự giải thích rõ: bằng chứng điểm 3. Sai phép quorum, hoặc thiếu phần tính cỡ, hoặc không nói client dừng khi mất kết nối: chưa đạt mức 3."
