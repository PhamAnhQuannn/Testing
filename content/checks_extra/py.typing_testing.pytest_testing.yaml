subtopic_id: py.typing_testing.pytest_testing
items:
  - id: X741
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `collect_results(tests)` mô phỏng một test runner nhỏ. `tests` là list các bộ ba `[name, got, want]` (name là chuỗi, got và want là giá trị bất kỳ so sánh được). Một test **pass** khi và chỉ khi `got == want`. Trả về dict `{"passed": <số test pass>, "failed": <số test fail>, "failures": [<tên các test fail theo thứ tự đầu vào>]}`. Ví dụ `[["t_add", 3, 3], ["t_sub", 1, 2], ["t_mul", 6, 6]]` cho `{"passed": 2, "failed": 1, "failures": ["t_sub"]}`; `[]` cho `{"passed": 0, "failed": 0, "failures": []}`.
    problem_id: check-x741-collect-results
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X742
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao test tên "cat" đầu tiên fail dù nhìn hai vế có vẻ giống nhau.
    code: |-
      cases = [("add", 1 + 2, 3), ("cat", "1" + "2", 12), ("len", len("ab"), 2), ("cat", "x" * 2, "xx")]
      failed = []
      for name, got, want in cases:
          if got != want:
              failed.append(name)
      print(len(cases) - len(failed))
      print(failed)
      print(set(failed))
    expected_output: "3\n['cat']\n{'cat'}"
    answer_md: "add pass (3 == 3), cat đầu fail vì '1' + '2' là chuỗi '12' khác số 12 (str không bằng int), len pass (2 == 2), cat thứ hai pass ('xx' == 'xx'). Nên passed = 4 - 1 = 3, failed = ['cat']. set gộp hai test trùng tên nên chỉ còn {'cat'}; list giữ đúng thứ tự và trùng lặp."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng: '12' (str) khác 12 (int) nên test cat đầu fail. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
