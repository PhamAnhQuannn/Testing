subtopic_id: ml.math.algebra_functions_bridge
items:
  - id: X633
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Giải thích 1 câu vì sao hai giá trị sigmoid(2) và sigmoid(-2) cộng lại ra 1.
    code: |-
      import math


      def sigmoid(z):
          return 1 / (1 + math.exp(-z))


      print(round(sigmoid(0), 6))
      print(round(sigmoid(2), 6))
      print(round(sigmoid(-2), 6))
      print(round(sigmoid(2) + sigmoid(-2), 6))
      print(sum(i * i for i in range(1, 5)))
    expected_output: "0.5\n0.880797\n0.119203\n1.0\n30"
    answer_md: 'Sigmoid đối xứng quanh 0,5: `σ(−z) = 1 − σ(z)`, nên `σ(2) + σ(−2) = 1`. `σ(0) = 0,5`. `range(1, 5)` là 1..4 nên Σ i² = 1+4+9+16 = 30.'
    rubric_md: "Output khớp VÀ nêu σ(-z) = 1 - σ(z). Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X634
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết hàm `softmax(xs)` với `xs` là list số không rỗng, trả về list các số thực `e^x_i / Σ e^x_j`, mỗi giá trị làm tròn bằng `round(v, 6)`. Dùng `math.exp`. Phải ổn định số học: trừ `max(xs)` khỏi mọi phần tử trước khi `exp` để đầu vào lớn như `[1000, 1001, 1002]` không tràn số. Ví dụ: `softmax([1, 2, 3])` là `[0.090031, 0.244728, 0.665241]`.
    problem_id: check-x634-softmax
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X635
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao hai dòng cuối bằng nhau (log biến tích thành tổng) và vì sao các xác suất cộng lại bằng 1.
    code: |-
      import math

      xs = [0, math.log(2), math.log(5)]
      exps = [math.exp(x) for x in xs]
      total = sum(exps)
      probs = [e / total for e in exps]
      print(round(total, 6))
      print([round(p, 6) for p in probs])
      print(round(sum(probs), 6))
      print(round(math.log(total), 6))
      print(round(math.log(0.5) + math.log(0.25), 6))
      print(round(math.log(0.5 * 0.25), 6))
    expected_output: "8.0\n[0.125, 0.25, 0.625]\n1.0\n2.079442\n-2.079442\n-2.079442"
    answer_md: '`exp(0)=1`, `exp(log 2)=2`, `exp(log 5)=5` nên total = 8 và probs = [1/8, 2/8, 5/8]. Mỗi xác suất là một phần của tổng nên cộng lại bằng 1. `log 8 ≈ 2,079442`. Hai dòng cuối bằng nhau vì `log(a·b) = log a + log b`: `log 0,5 + log 0,25 = log 0,125 ≈ −2,079442`.'
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng log của tích = tổng log, và probs chia cho tổng nên cộng bằng 1. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
