subtopic_id: sd.data.sql_vs_nosql
items:
  - id: S043
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Kể **bốn họ NoSQL** và **một việc mỗi họ làm tốt**. Rồi nói ngắn gọn **SQL quan hệ** mạnh ở
      điểm nào (nêu ít nhất hai: ví dụ join, ACID).
    answer_md: |
      Bốn họ NoSQL:
      - **Key-value** (Redis, DynamoDB): tra theo một khóa cực nhanh — giỏ hàng, session, cache.
      - **Document** (MongoDB): lưu tài liệu JSON lược đồ linh hoạt — hồ sơ sản phẩm thuộc tính khác
        nhau.
      - **Wide-column** (Cassandra): ghi cực nhiều, tra theo partition key — log, lịch sử chat.
      - **Graph** (Neo4j): đi theo quan hệ nhiều tầng — mạng bạn bè, gợi ý.

      SQL quan hệ mạnh ở: **join** (ghép nhiều bảng, truy vấn ad-hoc), **giao dịch ACID** (làm hết
      hoặc không làm gì, đúng tuyệt đối), **secondary index** và **ràng buộc lược đồ** (giữ dữ liệu
      sạch).
    rubric_md: "Đạt khi kể đúng cả bốn họ NoSQL kèm một việc hợp lý cho mỗi họ, và nêu đúng ít nhất hai điểm mạnh của SQL (join, ACID, index, hoặc ràng buộc). Đủ bốn họ + hai điểm mạnh: bằng chứng điểm 1. Thiếu một họ hoặc nhầm họ với việc: tối đa điểm 0."
  - id: S044
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một ứng dụng cần lưu **giỏ hàng (shopping cart)**: mỗi người dùng có một giỏ, luôn **đọc/ghi
      theo đúng user id**, không cần join, không cần truy vấn ad-hoc, và có thể chấp nhận mất vài
      mili-giây nhất quán. Dùng **checklist 5 câu** để: (1) nói mỗi câu trả lời gì cho dữ liệu này;
      (2) chốt một họ kho; (3) nêu một giới hạn quy mô cần lưu ý của lựa chọn đó.
    answer_md: |
      Checklist 5 câu:
      1. **Access pattern:** tra theo đúng một khóa (user id), không nối thực thể → nghiêng key-value.
      2. **Quy mô/QPS:** đọc/ghi nhiều nhưng mỗi thao tác nhỏ và độc lập → chia ngang theo khóa dễ.
      3. **Nhất quán:** không phải tiền, chấp nhận nhất quán cuối → không cần ACID chặt.
      4. **Query shape/join:** không cần join hay truy vấn ad-hoc, chỉ lấy nguyên giỏ theo khóa.
      5. **Lược đồ:** đơn giản, một blob theo khóa.

      (2) Chốt: **key-value** (Redis hoặc DynamoDB) — hợp nhất với "tra theo một khóa, cực nhanh,
      chia ngang dễ".
      (3) Giới hạn quy mô: coi chừng **hot key** (một giỏ/khóa quá nóng dồn vào một node) và, với
      Redis in-memory, **trần bộ nhớ RAM**; ngoài ra không truy vấn được theo nội dung giỏ.
    rubric_md: "Đạt khi chạy đủ 5 câu checklist cho đúng dữ liệu này, chốt **key-value** (document cũng chấp nhận nếu lý giải hợp lý), và nêu đúng một giới hạn quy mô (hot key / trần RAM / không query theo nội dung). Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Chọn kho đúng nhưng không nêu được giới hạn quy mô, hoặc không dùng checklist: tối đa điểm 1."
  - id: S045
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Thiết kế backend cho một **mạng xã hội nhỏ** có bốn dữ liệu: (a) **số dư ví tiền** của người
      dùng; (b) **feed bài đăng** ghi rất nhiều, luôn đọc theo tác giả/kênh; (c) **đồ thị bạn bè** để
      gợi ý "bạn của bạn"; (d) **phiên đăng nhập (session)**. Với **mỗi** dữ liệu, dùng **checklist 5
      câu** để chọn đúng họ kho và **nêu giới hạn quy mô (scale limit)** của lựa chọn đó. Nói rõ vì
      sao không nhét tất cả vào một RDBMS.
    answer_md: |
      - **(a) Số dư ví:** checklist → cần **ACID tuyệt đối**, có giao dịch, truy vấn có thể cần join
        với lịch sử → **SQL (Postgres)**. Giới hạn: ghi dồn về **một primary**; vượt trần phải
        sharding và **mất giao dịch/join xuyên shard** — nhưng dữ liệu tiền thường không lớn tới mức
        đó.
      - **(b) Feed bài đăng:** access = đọc theo tác giả/kênh, **QPS ghi khổng lồ**, không cần join,
        nhất quán cuối chấp nhận được → **wide-column (Cassandra)** với partition key = tác giả/kênh.
        Giới hạn: phải **cố định câu truy vấn trước** (query-first), không ad-hoc, nhất quán **eventual**
        (chỉnh bằng quorum), và cần tránh **partition nóng**.
      - **(c) Đồ thị bạn bè:** cần **đi nhiều tầng quan hệ** ("bạn của bạn") → **graph (Neo4j)**. Giới
        hạn: **khó chia ngang** vì quan hệ cắt ngang phân vùng; đồ thị quá lớn chạm trần một máy.
      - **(d) Session:** tra theo đúng một khóa, cực nhanh, không join → **key-value (Redis)**. Giới
        hạn: **hot key** và **trần RAM** (in-memory), nên đặt TTL.

      Không nhét tất cả vào một RDBMS vì mỗi dữ liệu có **access pattern và trần quy mô khác nhau**:
      feed ghi khổng lồ sẽ đập vào trần ghi một primary của SQL; đồ thị nhiều tầng và session tra khóa
      thì SQL làm được nhưng kém tối ưu. Dùng mỗi kho cho đúng việc chính là **polyglot persistence**.
    rubric_md: "Đạt (mức phỏng vấn) khi: chọn đúng họ kho cho cả bốn dữ liệu (a SQL, b wide-column, c graph, d key-value) bằng lập luận checklist, VÀ nêu đúng giới hạn quy mô cho mỗi lựa chọn (ghi về một primary; query-first/eventual + partition nóng; khó chia ngang; hot key/RAM), VÀ giải thích được vì sao không dùng một RDBMS cho tất cả (access pattern + trần quy mô khác nhau → polyglot persistence). Đúng, trong time-box, tự giải thích rõ ràng: bằng chứng điểm 3. Chọn kho đúng nhưng thiếu giới hạn quy mô ở hai dữ liệu trở lên, hoặc không biện minh polyglot: chưa đạt mức 3."
