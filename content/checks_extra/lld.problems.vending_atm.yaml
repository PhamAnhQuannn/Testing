subtopic_id: lld.problems.vending_atm
items:
  - id: X606
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Giải thích 1 câu vì sao (chú ý kho và balance).
    code: |-
      class Machine:
          def __init__(self):
              self.stock = {"A1": 1, "B2": 3}
              self.price = {"A1": 10, "B2": 15}
              self.balance = 0

          def insert(self, n):
              self.balance += n

          def select(self, code):
              if self.stock.get(code, 0) == 0 or self.balance < self.price[code]:
                  return -1
              self.stock[code] -= 1
              change = self.balance - self.price[code]
              self.balance = 0
              return change


      m = Machine()
      m.insert(20)
      print(m.select("A1"))
      print(m.balance)
      m.insert(5)
      print(m.select("A1"))
      print(m.select("B2"))
      print(m.balance)
    expected_output: "10\n0\n-1\n-1\n5"
    answer_md: 'Lần đầu đủ tiền: tiền thừa `20 - 10 = 10`, balance về 0, kho A1 về 0. Bỏ thêm 5: A1 hết hàng nên `-1`; B2 giá 15 > 5 nên `-1`. Hai lần từ chối không đổi balance nên vẫn 5.'
    rubric_md: "Output khớp VÀ nêu từ chối giữ nguyên balance. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X607
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết `class VendingMachine`: constructor không tham số (kho rỗng, balance 0). `load(code, qty, price)` nạp `qty` sản phẩm vào ngăn `code` với giá `price` (int); gọi lại thì ghi đè. `insert(amount)` cộng `amount` (int) vào balance. `select(code)`: nếu ngăn tồn tại, còn hàng và `balance >= price` thì nhả 1 sản phẩm (trừ kho), trả tiền thừa `balance - price` (int) và đặt balance về 0; ngược lại trả `-1` và giữ nguyên balance. `balance()` trả balance hiện tại. Ví dụ `load("A1", 2, 10)`, `insert(25)`, `select("A1")` trả 15 và `balance()` là 0.
    problem_id: check-x607-vending-machine
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X608
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích khi nào `-1` được trả (hết hàng, thiếu tiền) và khi nào balance được reset.
    code: |-
      class Machine:
          def __init__(self):
              self.stock = {"A1": 1, "B2": 3}
              self.price = {"A1": 10, "B2": 15}
              self.balance = 0

          def insert(self, n):
              self.balance += n

          def select(self, code):
              if self.stock.get(code, 0) == 0 or self.balance < self.price[code]:
                  return -1
              self.stock[code] -= 1
              change = self.balance - self.price[code]
              self.balance = 0
              return change


      m = Machine()
      m.insert(10)
      print(m.select("B2"))
      m.insert(10)
      print(m.select("B2"))
      print(m.stock["B2"], m.balance)
      m.insert(30)
      print(m.select("A1"))
      m.insert(30)
      print(m.select("A1"))
      print(m.select("Z9"))
      print(m.stock["A1"], m.balance)
    expected_output: "-1\n5\n2 0\n20\n-1\n-1\n0 30"
    answer_md: 'Bỏ 10 mà B2 giá 15: thiếu tiền, `-1`, balance giữ 10; bỏ thêm 10 thành 20: tiền thừa 5, kho B2 còn 2, balance 0. Bỏ 30 mua A1 (giá 10, kho 1): tiền thừa 20, kho A1 về 0. Bỏ 30 nữa: A1 hết hàng nên `-1`; ngăn `Z9` không tồn tại nên `-1`. Balance 30 vẫn còn vì các lần từ chối không đổi gì.'
    rubric_md: "Output khớp từng dòng VÀ nêu đúng khi nào trả -1 và reset balance. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
