subtopic_id: eng.devops_cloud.observability
items:
  - id: E160
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Nêu ba trụ cột của **observability** (logs, metrics, traces) và mô tả ngắn mỗi loại cho biết điều gì.
    answer_md: |
      - **Logs**: các sự kiện rời rạc có timestamp (và mức như INFO/ERROR); chi tiết, cho biết "chuyện gì đã xảy ra".
      - **Metrics**: con số tổng hợp theo thời gian (request/giây, tỉ lệ lỗi, latency); rẻ, hợp cho alert và dashboard.
      - **Traces**: hành trình của một request qua nhiều service, cho biết chặng nào chậm hoặc lỗi.
    rubric_md: "Đạt khi nêu đúng cả ba trụ cột và mô tả đúng bản chất mỗi loại (logs: sự kiện rời rạc; metrics: số tổng hợp theo thời gian; traces: một request qua các service). Đủ ba: bằng chứng điểm 1; nhầm lẫn bản chất (ví dụ coi metric là từng sự kiện riêng lẻ) hoặc thiếu một trụ cột: điểm 0."
  - id: E161
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một API có 100 request: 98 request mất 100ms và 2 request mất 10 giây. (a) Tính latency trung bình và
      xác định p99. (b) Giải thích vì sao trung bình trông ổn mà p99 thì không, và nên báo cáo gì. (c) Vì sao đặt
      label `user_id` trên metric là ý tồi?
    answer_md: |
      **(a)** Trung bình = (98 x 100ms + 2 x 10000ms) / 100 = 298ms. Xếp 100 giá trị tăng dần, giá trị thứ 99
      là 10 giây, nên **p99 = 10 giây**.

      **(b)** Trung bình bị kéo bởi số đông nhanh nên che mất đuôi chậm. p99 cho thấy 1-2% người dùng chờ rất lâu.
      Nên báo cáo **p95/p99** (cùng với trung bình hoặc median nếu cần), tính từ **histogram**.

      **(c)** Mỗi giá trị `user_id` khác nhau tạo ra một chuỗi metric riêng, làm **cardinality** bùng nổ và tăng
      chi phí lưu trữ/truy vấn. Dùng label có số giá trị nhỏ, có giới hạn (method, route, status class);
      chi tiết theo user để ở log hoặc trace.
    rubric_md: "Đạt khi: (a) tính đúng trung bình khoảng 298ms và p99 = 10 giây; (b) giải thích trung bình che đuôi chậm và nên dùng p95/p99; (c) nêu đúng rủi ro cardinality của label có nhiều giá trị. Đủ (a)-(c): bằng chứng điểm 2. Cho rằng trung bình đủ tốt hoặc tính sai p99: tối đa điểm 1."
  - id: E162
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Người dùng báo "trang thanh toán chậm" cho một hệ thống nhiều service. Hãy: (a) nói bạn xem **metric, trace
      hay log** theo thứ tự nào và vì sao; (b) giải thích vì sao dùng **p99** thay vì trung bình để xác nhận;
      (c) nêu cách dùng **trace ID** và **structured logging** để lần ra nguyên nhân; (d) đề xuất SLI, SLO và một
      alert hợp lý cho dịch vụ này, và nói vì sao không alert trên mọi metric.
    answer_md: |
      **(a) Thứ tự:** bắt đầu bằng **metric** (dashboard RED: rate, errors, duration) để xác nhận chậm thật và
      khoanh vùng thời điểm, route, service bị ảnh hưởng. Sau đó **trace** của các request chậm để tìm chặng
      chiếm nhiều thời gian nhất. Cuối cùng **log** của service đó (lọc theo trace ID) để tìm nguyên nhân chi tiết.

      **(b) p99:** trung bình bị kéo bởi số đông nhanh nên che đuôi chậm; p99 (và p95) lộ ra nhóm người dùng
      chậm nhất, chính là nhóm than phiền.

      **(c) Trace ID + structured logging:** trace ID được truyền (context propagation) qua các service và
      gắn vào mọi dòng log dạng JSON; lọc theo trace ID để gom log của đúng request chậm từ mọi service.

      **(d) SLI/SLO/alert:** SLI: % request thanh toán có latency dưới ngưỡng (ví dụ 500ms) và thành công; SLO:
      99,9% trong 30 ngày. Alert gọi người trực khi tỉ lệ lỗi hoặc p99 vượt ngưỡng kéo dài, đe dọa SLO. Không
      alert trên mọi metric vì sẽ gây nhiễu (alert fatigue); metric phụ (CPU, bộ nhớ) để trên dashboard điều tra.
    rubric_md: "Đạt mức 3 khi đủ cả bốn phần: (a) metric để khoanh vùng, trace để tìm chặng chậm, log để tìm nguyên nhân; (b) p99 lộ đuôi chậm mà trung bình che mất; (c) trace ID truyền qua service và gắn vào structured log để gom log; (d) SLI là số đo, SLO là mục tiêu, alert theo triệu chứng đe dọa SLO và lý do tránh alert quá nhiều. Đủ cả bốn trong time-box: bằng chứng điểm 3. Thiếu một phần, nhầm SLI với SLO hoặc chỉ dựa vào trung bình: chưa đạt mức 3."
