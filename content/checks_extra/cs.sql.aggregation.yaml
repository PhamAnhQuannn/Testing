subtopic_id: cs.sql.aggregation
items:
  - id: X777
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
    code: |-
      rows = [("a", 3), ("b", 5), ("a", 4), ("c", 1), ("b", 2)]
      total = {}
      n = {}
      for cat, amount in rows:
          total[cat] = total.get(cat, 0) + amount
          n[cat] = n.get(cat, 0) + 1
      print(total)
      print(n)
      print(len(rows), len(total))
    expected_output: "{'a': 7, 'b': 7, 'c': 1}\n{'a': 2, 'b': 2, 'c': 1}\n5 3"
    answer_md: "Vòng lặp mô phỏng GROUP BY cat với SUM(amount) và COUNT(*): a = 3 + 4 = 7 (2 dòng), b = 5 + 2 = 7 (2 dòng), c = 1 (1 dòng). Có 5 dòng nhưng chỉ 3 nhóm; dict giữ thứ tự xuất hiện đầu tiên a, b, c."
    rubric_md: "Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X778
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `group_totals(rows)` bằng `sqlite3` trong bộ nhớ. `rows` là list các bản ghi `[category, amount]` (category là chuỗi, amount là số nguyên). Tạo bảng `sales(category TEXT, amount INTEGER)`, chèn bằng `executemany` tham số hoá, rồi chạy `SELECT category, COUNT(*) AS n, SUM(amount) AS total FROM sales GROUP BY category HAVING SUM(amount) > 0 ORDER BY total DESC, category ASC`. Trả về list các bộ ba `[category, n, total]`, mỗi bộ là list. Ví dụ `[["a",3],["b",5],["a",4],["b",-5]]` cho `[["a", 2, 7]]` vì nhóm b có tổng 0 bị HAVING loại.
    problem_id: check-x778-group-totals
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X779
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao lọc sau khi tính trung bình (kiểu HAVING) cho kết quả khác với lọc từng dòng trước (kiểu WHERE), và vì sao `//` làm mất thông tin.
    code: |-
      rows = [("a", 1), ("a", 2), ("b", 5), ("b", 5), ("c", 4)]
      s = {}
      n = {}
      for k, v in rows:
          s[k] = s.get(k, 0) + v
          n[k] = n.get(k, 0) + 1
      avg_int = {k: s[k] // n[k] for k in s}
      avg_f = {k: s[k] / n[k] for k in s}
      print(avg_int)
      print(sorted(k for k, v in avg_f.items() if v >= 2))
      print(avg_f["a"])
      print(sorted({k for k, v in rows if v >= 2}))
    expected_output: "{'a': 1, 'b': 5, 'c': 4}\n['b', 'c']\n1.5\n['a', 'b', 'c']"
    answer_md: "Nhóm a: tổng 3, 2 dòng; `//` cho 1 còn `/` cho 1.5, nên trung bình nguyên làm mất phần thập phân (AVG của SQL luôn là số thực). Lọc nhóm sau khi gom (HAVING AVG >= 2) chỉ giữ b (5.0) và c (4.0) vì a có 1.5 < 2. Lọc từng dòng trước (WHERE v >= 2) vẫn giữ a vì dòng (a, 2) thỏa, nên ra a, b, c. Hai cách lọc trả kết quả khác nhau."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng: HAVING lọc nhóm theo giá trị đã gom (a bị loại vì trung bình 1.5), WHERE lọc dòng trước khi gom (a vẫn còn một dòng thỏa); chia nguyên làm mất phần thập phân. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
