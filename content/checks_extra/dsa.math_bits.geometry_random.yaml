subtopic_id: dsa.math_bits.geometry_random
items:
  - id: X514
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      a, b, c = (0, 0), (3, 4), (6, 2)
      dx, dy = b[0] - a[0], b[1] - a[1]
      print(abs(dx) + abs(dy), max(abs(dx), abs(dy)), dx * dx + dy * dy)
      cross = (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0])
      print(cross)
      print("left" if cross > 0 else "right" if cross < 0 else "collinear")
    expected_output: "7 4 25\n-18\nright"
    answer_md: 'Từ a đến b có dx = 3, dy = 4 nên Manhattan = 7, Chebyshev = 4, bình phương Euclid = 25. Tích có hướng (b-a) x (c-a) = 3*2 - 4*6 = -18 < 0 nên đi a -> b -> c là rẽ phải (clockwise).'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X515
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết `min_time_to_visit_all_points(points)`: `points[i] = [x, y]` là các điểm trên mặt phẳng, phải thăm theo đúng thứ tự cho trước. Mỗi giây được đi 1 đơn vị theo chiều ngang, dọc hoặc chéo. Trả về tổng số giây nhỏ nhất để thăm hết các điểm. `min_time_to_visit_all_points([[1, 1], [3, 4], [-1, 0]])` là `7`. Gợi ý: thời gian giữa hai điểm là `max(|dx|, |dy|)` (khoảng cách Chebyshev).
    problem_id: check-x515-min-time-visiting-points
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X516
    difficulty: 3
    type: write_code
    minutes: 10
    prompt_md: |
      Viết `max_points(points)`: `points[i] = [x, y]` (có thể trùng nhau). Trả về số điểm nhiều nhất cùng nằm trên một đường thẳng. `max_points([[1, 1], [2, 2], [3, 3]])` là `3`. Gợi ý: với mỗi điểm neo, đếm theo độ dốc là phân số rút gọn `(dy/g, dx/g)` với `g = gcd(|dx|, |dy|)` và chuẩn hóa dấu; không dùng float.
    problem_id: check-x516-max-points-on-a-line
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
