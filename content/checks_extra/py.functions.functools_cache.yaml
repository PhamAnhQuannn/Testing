subtopic_id: py.functions.functools_cache
items:
  - id: X399
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      from functools import lru_cache

      @lru_cache(maxsize=None)
      def sq(n):
          print("calc", n)
          return n * n

      print(sq(3))
      print(sq(3))
      print(sq(4))
      print(sq.cache_info())
    expected_output: "calc 3\n9\n9\ncalc 4\n16\nCacheInfo(hits=1, misses=2, maxsize=None, currsize=2)"
    answer_md: 'Lần gọi `sq(3)` đầu tiên là miss nên in `calc 3`; lần thứ hai cùng đối số là hit nên trả `9` từ cache mà KHÔNG chạy lại thân hàm (không in `calc`). `sq(4)` là miss. Tổng: 1 hit, 2 miss, 2 phần tử trong cache.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X400
    difficulty: 2
    type: write_code
    minutes: 5
    prompt_md: |
      Viết `fib_stats(n)`: bên trong định nghĩa hàm `fib` đệ quy dùng `@lru_cache(maxsize=None)`, gọi `fib(n)` một lần, rồi trả list `[fib(n), hits, misses]` lấy từ `fib.cache_info()` (chụp `hits`, `misses` ngay sau lần gọi đầu tiên, trước mọi lời gọi khác). Quy ước `fib(0) = 0`, `fib(1) = 1`.
    problem_id: check-x400-fib-stats
    rubric_md: "Pass toàn bộ test ẩn. Đúng không gợi ý trong time-box (5 phút): bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X401
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: |
      Viết `count_ways(coins, amount)` trả số cách tạo đúng `amount` từ các đồng xu trong list `coins` (mỗi loại dùng không giới hạn lần; thứ tự không quan trọng, chỉ tính tổ hợp). `count_ways([1, 2, 5], 5)` là `4`; `amount = 0` có đúng 1 cách. Gợi ý: viết hàm đệ quy trong `(i, remaining)` với `@lru_cache`; vì `coins` là list (không hashable) nên đừng đưa nó vào đối số của hàm được cache (dùng closure hoặc đổi sang `tuple`). Không cache thì các test lớn sẽ quá thời gian.
    problem_id: check-x401-count-ways
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 12 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
