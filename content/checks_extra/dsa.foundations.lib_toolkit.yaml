subtopic_id: dsa.foundations.lib_toolkit
items:
  - id: X341
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: "Viết `max_pair_count(nums)`: số lần xuất hiện lớn nhất của một cặp phần tử liền kề (ví dụ `[1,2,1,2,1,2,3]` -> 3; danh sách ngắn hơn 2 phần tử -> 0). Dùng `Counter` và `zip`."
    problem_id: check-max-pair-count
    rubric_md: "Dùng Counter/zip gọn, đúng test ẩn gồm danh sách rỗng/1 phần tử và cặp lặp chồng ([5,5,5,5]): điểm 3; đúng nhưng dùng vòng lặp thủ công dài: tối đa 2."
