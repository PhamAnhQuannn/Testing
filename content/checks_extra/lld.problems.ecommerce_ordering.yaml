subtopic_id: lld.problems.ecommerce_ordering
items:
  - id: X615
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Giải thích 1 câu vì sao tổng sau khi bỏ dòng đầu là 105.
    code: |-
      class Cart:
          def __init__(self):
              self.lines = []

          def add(self, name, price, qty):
              self.lines.append((name, price, qty))

          def total(self):
              return sum(p * q for _, p, q in self.lines)


      c = Cart()
      print(c.total())
      c.add("ao", 120, 2)
      c.add("non", 35, 3)
      print(c.total())
      c.lines.pop(0)
      print(c.total())
      print(0.1 + 0.2 == 0.3)
    expected_output: "0\n345\n105\nFalse"
    answer_md: 'Giỏ rỗng có tổng 0. Hai dòng cho 120*2 + 35*3 = 240 + 105 = 345. `pop(0)` bỏ dòng "ao" nên chỉ còn 35*3 = 105. `0.1 + 0.2` là 0.30000000000000004 nên so với 0.3 ra `False`: đó là lý do tiền dùng số nguyên.'
    rubric_md: "Output khớp VÀ nêu tổng = cộng price*qty của các dòng còn lại. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X616
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết `class Cart` là lõi giỏ hàng, tiền luôn là số nguyên (không dùng float). `Cart()` tạo giỏ rỗng với giảm giá mặc định `"none"`. `add(name, price, qty)` thêm một dòng (`price` và `qty >= 1` là số nguyên; không trả gì). `set_discount(kind)` đặt chiến lược giảm giá theo tên, `kind` là `"none"`, `"percent10"` hoặc `"fixed50"` (không trả gì). `subtotal()` trả tổng `price * qty` của mọi dòng. `total()` trả tổng sau giảm giá hiện tại áp lên subtotal: `"percent10"` là `subtotal * 90 // 100`, `"fixed50"` là `max(0, subtotal - 50)`, `"none"` giữ nguyên. Ví dụ: `add("ao", 100, 2)`, `add("non", 50, 1)` thì `subtotal()` là `250`; sau `set_discount("percent10")` thì `total()` là `225`.
    problem_id: check-x616-cart-total
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X617
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng. Giải thích vì sao hai thứ tự giảm giá cho 130 và 135, vì sao giỏ 40 ra 0, và vì sao `go("cancelled")` cuối trả `False`.
    code: |-
      STEPS = {
          "percent10": lambda x: x * 90 // 100,
          "fixed50": lambda x: max(0, x - 50),
      }
      ALLOWED = {
          "placed": ("paid", "cancelled"),
          "paid": ("shipped", "cancelled"),
          "shipped": (),
          "cancelled": (),
      }


      def price(sub, order):
          for kind in order:
              sub = STEPS[kind](sub)
          return sub


      class Order:
          def __init__(self):
              self.state = "placed"

          def go(self, nxt):
              if nxt not in ALLOWED[self.state]:
                  return False
              self.state = nxt
              return True


      print(price(200, ["percent10", "fixed50"]))
      print(price(200, ["fixed50", "percent10"]))
      print(price(40, ["fixed50", "percent10"]))
      o = Order()
      print(o.go("shipped"))
      print(o.go("paid"))
      print(o.go("shipped"))
      print(o.go("cancelled"))
      print(o.state)
    expected_output: "130\n135\n0\nFalse\nTrue\nTrue\nFalse\nshipped"
    answer_md: 'Giảm % trước: 200*90//100 = 180 rồi trừ 50 ra 130. Trừ tiền trước: 200-50 = 150 rồi giảm 10% ra 135, nên thứ tự áp mã phải được quy định rõ. Giỏ 40 trừ 50 bị chặn ở 0 bởi `max(0, ...)`, 0 giảm 10% vẫn 0. Đơn mới ở `placed` không nhảy thẳng sang `shipped` (False), đi `paid` rồi `shipped` được; ở `shipped` bảng `ALLOWED` rỗng nên `cancelled` bị chặn (False) và state vẫn là `shipped`.'
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng thứ tự giảm giá, chặn dưới ở 0, và chuyển trạng thái sai bị chặn. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
