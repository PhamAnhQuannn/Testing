subtopic_id: ml.fundamentals.loss_functions
items:
  - id: X667
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `mse(y_true, y_pred)` trả MSE `(1/n)·Σ(y_pred − y_true)²` trên hai danh sách số cùng độ dài. Trả float `round(·, 6)`; danh sách rỗng trả `0.0`. Ví dụ: `y_true=[2,4,6]`, `y_pred=[3,4,9]` cho `3.333333`.
    problem_id: check-x667-mse
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X668
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao mẫu cuối có loss lớn nhất.
    code: |-
      import math
      probs = [[0.1, 0.7, 0.2], [0.5, 0.25, 0.25], [0.8, 0.1, 0.1]]
      labels = [1, 0, 2]
      total = 0.0
      for p, k in zip(probs, labels):
          l = -math.log(p[k])
          total += l
          print(round(l, 3))
      print(round(total / 3, 3))
    expected_output: "0.357\n0.693\n2.303\n1.117"
    answer_md: 'Mỗi mẫu loss = −ln(p đáp án đúng): −ln 0,7 ≈ 0,357; −ln 0,5 ≈ 0,693; −ln 0,1 ≈ 2,303; trung bình ≈ 1,117. Mẫu cuối gán chỉ 0,1 cho đáp án đúng (tự tin sai) nên bị phạt nặng nhất.'
    rubric_md: "Output khớp từng dòng VÀ giải thích loss = −ln(p đúng), p nhỏ thì loss lớn. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
