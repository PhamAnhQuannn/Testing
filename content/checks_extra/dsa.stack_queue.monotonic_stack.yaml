subtopic_id: dsa.stack_queue.monotonic_stack
items:
  - id: X431
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu vì sao stack luôn giảm dần.
    code: |-
      nums = [3, 1, 4, 2, 5]
      st = []
      for x in nums:
          while st and st[-1] < x:
              st.pop()
          st.append(x)
          print(st)
      print(len(st))
    expected_output: "[3]\n[3, 1]\n[4]\n[4, 2]\n[5]\n1"
    answer_md: 'Mỗi số mới `x` pop mọi phần tử trên đỉnh nhỏ hơn nó rồi mới push, nên stack luôn giảm dần từ đáy lên đỉnh. Khi gặp 4 nó xoá cả 3 và 1; khi gặp 5 nó xoá cả 4 và 2, chỉ còn `[5]` nên độ dài là 1.'
    rubric_md: "Output khớp từng dòng (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X432
    difficulty: 2
    type: write_code
    minutes: 7
    prompt_md: |
      Viết `stock_span(prices)`: với mỗi ngày `i`, span là số ngày liên tiếp liền trước (tính cả ngày `i`) có giá nhỏ hơn hoặc bằng `prices[i]`. Trả list span. Ví dụ `stock_span([100, 80, 60, 70, 60, 75, 85])` là `[1, 1, 1, 2, 1, 4, 6]`. Dùng monotonic stack, O(n).
    problem_id: check-x432-stock-span
    rubric_md: "Pass toàn bộ test ẩn. Đúng không gợi ý trong time-box (7 phút): bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X433
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: |
      Viết `max_sliding_window(nums, k)` trả list giá trị lớn nhất của mỗi cửa sổ liên tiếp độ dài `k`, từ trái sang phải. Ví dụ `max_sliding_window([1, 3, -1, -3, 5, 3, 6, 7], 3)` là `[3, 3, 5, 5, 6, 7]`. `1 <= k <= len(nums)`; `nums` rỗng thì trả `[]`. Gợi ý: dùng `collections.deque` giữ các chỉ số có giá trị giảm dần; bỏ chỉ số đã rời cửa sổ ở đầu, bỏ các giá trị nhỏ hơn ở cuối. Phải đạt O(n).
    problem_id: check-x433-sliding-max
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 12 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
