subtopic_id: dsa.design_ds.design_time_versioned
items:
  - id: X505
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      from bisect import bisect_right

      times = [1, 4, 4, 9]
      vals = ["a", "b", "c", "d"]

      def floor_get(t):
          i = bisect_right(times, t) - 1
          return vals[i] if i >= 0 else None

      print(floor_get(0), floor_get(4), floor_get(8))
      print(bisect_right(times, 4), bisect_right(times, 3))
    expected_output: "None c c\n3 1"
    answer_md: '`bisect_right` trả về vị trí ngay sau mọi phần tử `<= t`, trừ 1 ra phần tử cuối cùng có thời điểm `<= t`. Với `t = 0` chưa có mốc nào nên `i = -1` và in `None`; với `t = 4` có hai mốc 4 nên lấy cái cuối (`"c"`); với `t = 8` mốc gần nhất là 4 nên cũng `"c"`. Dòng hai: `bisect_right(times, 4) = 3` còn `bisect_right(times, 3) = 1`.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X506
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết `class SnapshotArray` (LC 1146): `SnapshotArray(length)` tạo mảng `length` số 0; `set(index, val)` gán giá trị; `snap()` chụp snapshot và trả về snap id (bắt đầu từ 0, tăng dần); `get(index, snap_id)` trả về giá trị của `index` tại snapshot `snap_id`. Không được copy cả mảng mỗi lần `snap()`. Gợi ý: mỗi index giữ lịch sử `(snap_id, val)` và binary search.
    problem_id: check-x506-snapshot-array
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X507
    difficulty: 3
    type: write_code
    minutes: 10
    prompt_md: |
      Viết `class HitCounter` (LC 362): `hit(timestamp)` ghi một lượt truy cập; `get_hits(timestamp)` trả về số lượt truy cập trong 300 giây gần nhất, tức timestamp thuộc `(timestamp - 300, timestamp]`. Timestamp của các lời gọi không giảm, nhiều hit có thể cùng timestamp. Gợi ý: deque + popleft, hoặc list + bisect; chú ý biên `timestamp - 300` đã hết hạn.
    problem_id: check-x507-hit-counter
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
