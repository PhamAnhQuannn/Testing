subtopic_id: py.concurrency.multiprocessing
items:
  - id: X735
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
    code: |-
      nums = [1, 2, 3, 4, 5, 6, 7]
      size = 3
      chunks = [nums[i:i + size] for i in range(0, len(nums), size)]
      print(chunks)
      sums = [sum(c) for c in chunks]
      print(sums)
      print(sum(sums))
    expected_output: "[[1, 2, 3], [4, 5, 6], [7]]\n[6, 15, 7]\n28"
    answer_md: "Cắt theo bước 3 ra ba chunk, chunk cuối chỉ có [7]. Tổng từng chunk là 6, 15, 7 (map); cộng lại 6 + 15 + 7 = 28 (reduce), bằng sum(nums)."
    rubric_md: "Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X736
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `count_words(chunks)` theo mẫu map-reduce. `chunks` là list các chunk, mỗi chunk là list các từ (chuỗi), tượng trưng cho phần dữ liệu một process worker xử lý. **Map**: với mỗi chunk, đếm tần suất từ riêng của chunk đó (dict từ -> số lần). **Reduce**: gộp mọi dict riêng thành một dict, cộng số lần của cùng một từ. Trả về dict gộp (từ -> tổng số lần qua mọi chunk). Chunk có thể rỗng, `chunks` có thể rỗng (kết quả `{}`). Ví dụ `chunks = [["a", "b", "a"], ["b", "c"]]` cho `{"a": 2, "b": 2, "c": 1}`.
    problem_id: check-x736-map-reduce
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X737
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao gộp dict riêng cho cùng kết quả như đếm trên toàn bộ dữ liệu.
    code: |-
      chunks = [["a", "b"], ["b", "b", "c"], ["a"]]
      partials = []
      for c in chunks:
          d = {}
          for w in c:
              d[w] = d.get(w, 0) + 1
          partials.append(d)
      print(partials)
      total = {}
      for d in partials:
          for k, v in d.items():
              total[k] = total.get(k, 0) + v
      print(total)
      print(sorted(total.items(), key=lambda kv: (-kv[1], kv[0])))
    expected_output: "[{'a': 1, 'b': 1}, {'b': 2, 'c': 1}, {'a': 1}]\n{'a': 2, 'b': 3, 'c': 1}\n[('b', 3), ('a', 2), ('c', 1)]"
    answer_md: "Map ra ba dict riêng. Reduce cộng theo từ: a = 1 + 1 = 2, b = 1 + 2 = 3, c = 1; dict giữ thứ tự chèn nên in a, b, c. Sắp theo số lần giảm dần rồi theo từ cho [('b', 3), ('a', 2), ('c', 1)]. Gộp dict riêng cho cùng kết quả vì phép cộng có tính kết hợp: tổng các đếm riêng bằng đếm trên toàn bộ, nên chia chunk cho nhiều process không đổi kết quả."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng: phép cộng số lần kết hợp được nên đếm riêng từng chunk rồi cộng bằng đếm chung (nhờ đó map song song được). Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
