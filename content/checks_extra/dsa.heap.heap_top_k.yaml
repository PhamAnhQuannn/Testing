subtopic_id: dsa.heap.heap_top_k
items:
  - id: X435
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      import heapq

      h = []
      for x in [5, 1, 8, 3, 9, 2]:
          heapq.heappush(h, x)
          if len(h) > 3:
              heapq.heappop(h)
      print(h[0])
      print(sorted(h))
      print(heapq.nsmallest(2, [5, 1, 8, 3]))
    expected_output: "5\n[5, 8, 9]\n[1, 3]"
    answer_md: 'Heap luôn giữ tối đa 3 phần tử: mỗi khi vượt 3 thì `heappop` bỏ phần tử nhỏ nhất, nên cuối cùng còn 3 số lớn nhất `{5, 8, 9}`. Đỉnh `h[0]` là nhỏ nhất trong nhóm đó, tức `5`; `sorted(h)` là `[5, 8, 9]`. `nsmallest(2, ...)` trả hai số nhỏ nhất theo thứ tự tăng dần: `[1, 3]`.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
