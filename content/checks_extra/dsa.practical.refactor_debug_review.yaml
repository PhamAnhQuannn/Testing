subtopic_id: dsa.practical.refactor_debug_review
items:
  - id: X551
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Hàm `median(nums)` dưới đây bị bug: không sort và chia nguyên. Hãy sửa/viết lại: `nums` là list số nguyên không rỗng; sort rồi nếu độ dài lẻ trả phần tử giữa (int); nếu chẵn, trả trung bình hai phần tử giữa bằng phép chia thực, và trả `int` khi kết quả là số nguyên, ngược lại trả `float`. `median([3, 1, 2])` là `2`, `median([1, 2, 4, 5])` là `3`, `median([1, 2])` là `1.5`.
    problem_id: check-x551-fix-median
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X552
    difficulty: 3
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu cho từng bug ẩn trong đó.
    code: |-
      def add(x, acc=[]):
          acc.append(x)
          return acc

      a = add(1)
      b = add(2)
      print(a, b, a is b)
      print(add(3, []))
      nums = [1, 2, 2, 3]
      for x in nums:
          if x == 2:
              nums.remove(x)
      print(nums)
    expected_output: "[1, 2] [1, 2] True\n[3]\n[1, 2, 3]"
    answer_md: 'Tham số mặc định `acc=[]` được tạo một lần nên `add(1)` và `add(2)` cùng dùng một list (`a is b` là `True`, cả hai thấy `[1, 2]`); truyền list mới `[]` thì chỉ có `[3]`. Ở vòng for, sau khi xóa số 2 đầu tiên các phần tử dồn trái nên số 2 thứ hai bị bỏ qua, kết quả `[1, 2, 3]`.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng cả hai bug. Đúng: bằng chứng điểm 3; chỉ đúng một phần: tối đa điểm 1."
