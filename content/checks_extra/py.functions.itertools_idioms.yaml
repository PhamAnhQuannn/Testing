subtopic_id: py.functions.itertools_idioms
items:
  - id: X396
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      from itertools import accumulate, combinations, groupby
      print(list(accumulate([1, 2, 3])))
      print(list(combinations("abc", 2)))
      d = [3, 1, 3]
      print([(k, len(list(g))) for k, g in groupby(d)])
    expected_output: "[1, 3, 6]\n[('a', 'b'), ('a', 'c'), ('b', 'c')]\n[(3, 1), (1, 1), (3, 1)]"
    answer_md: '`accumulate` cho tổng tích lũy 1, 1+2, 3+3. `combinations` chọn 2 phần tử không phân biệt thứ tự theo vị trí. `groupby` chưa sắp xếp chỉ gom các phần tử liền kề nên số 3 cho hai nhóm riêng.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X397
    difficulty: 2
    type: write_code
    minutes: 5
    prompt_md: |
      Viết `pairs_with_sum(nums, target)` trả về list các cặp `[a, b]` (với `a <= b`) lấy từ hai vị trí khác nhau của `nums` sao cho `a + b == target`. Kết quả sắp xếp tăng dần (so sánh list); mỗi cặp vị trí tính một lần, nên cặp giá trị trùng có thể xuất hiện nhiều lần. Dùng `itertools.combinations`.
    problem_id: check-x397-pairs-with-sum
    rubric_md: "Pass toàn bộ test ẩn. Đúng không gợi ý trong time-box (5 phút): bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X398
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: |
      Viết `group_counts(words)` trả về list `[độ dài, số từ]` cho mỗi độ dài từ xuất hiện trong `words`, sắp theo độ dài tăng dần. Ví dụ `["aa", "b", "cc", "d", "eee"]` thành `[[1, 2], [2, 2], [3, 1]]`. Gợi ý: `itertools.groupby` chỉ gom phần tử liền kề.
    problem_id: check-x398-group-counts
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 12 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
