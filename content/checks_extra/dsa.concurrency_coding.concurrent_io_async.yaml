subtopic_id: dsa.concurrency_coding.concurrent_io_async
items:
  - id: X561
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      tasks = [("A", 0, 4), ("B", 1, 2), ("C", 2, 5)]
      fin = [(s + d, name) for name, s, d in tasks]
      fin.sort()
      print([name for _, name in fin])
      print(max(f for f, _ in fin))
    expected_output: "['B', 'A', 'C']\n7"
    answer_md: 'Các task chạy đồng thời: A xong lúc 0+4=4, B lúc 1+2=3, C lúc 2+5=7. Sắp theo finish time cho B, A, C; thời điểm xong tất cả là max = 7.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X562
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết `run_tasks(tasks)`: `tasks` là list `[start, duration, id]` (số nguyên), mọi task chạy đồng thời nên task xong lúc `start + duration`. Trả list `id` theo thứ tự hoàn thành (finish time tăng dần, hòa thì id nhỏ trước). `run_tasks([[0, 5, 1], [0, 3, 2], [2, 1, 3]])` là `[2, 3, 1]`. Gợi ý: `sorted` với khóa `(start + duration, id)`.
    problem_id: check-x562-run-tasks
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X563
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: "Chạy tay (không chạy máy): scheduler có tối đa 2 task chạy cùng lúc. Đoạn code in ra gì? Giải thích 1 câu."
    code: |-
      import heapq

      jobs = [(1, 4), (2, 1), (3, 3), (4, 2)]
      free = [0, 0]
      done = []
      for tid, d in jobs:
          t = heapq.heappop(free)
          end = t + d
          heapq.heappush(free, end)
          done.append((end, tid))
      done.sort()
      print([tid for _, tid in done])
      print(max(e for e, _ in done))
    expected_output: "[2, 1, 3, 4]\n6"
    answer_md: 'Hai "slot" rảnh lúc 0. Job 1 (4) vào slot A xong lúc 4; job 2 (1) vào slot B xong lúc 1; job 3 lấy slot rảnh sớm nhất (B, t=1) xong lúc 4; job 4 lấy slot rảnh sớm nhất (t=4) xong lúc 6. Sắp (end, id): (1,2), (4,1), (4,3), (6,4); xong tất cả lúc 6.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
