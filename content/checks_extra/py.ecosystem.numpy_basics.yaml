subtopic_id: py.ecosystem.numpy_basics
items:
  - id: X749
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `dot(a, b)` mô phỏng `np.dot` cho hai vector 1 chiều (không dùng NumPy). `a` và `b` là hai list số nguyên **cùng độ dài**. Trả về tích vô hướng `sum(a[i] * b[i])` là một số nguyên. Ví dụ `dot([1, 2, 3], [4, 5, 6])` cho `32`; hai list rỗng cho `0`.
    problem_id: check-x749-dot-product
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X750
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao `sum(grid)` không cho tổng theo cột còn `zip(*grid)` thì có (tương tự `axis=0` của NumPy).
    code: |-
      grid = [[1, 2], [3, 4]]
      print(sum(grid[0]))
      print([sum(r) for r in grid])
      print([sum(c) for c in zip(*grid)])
      print([0] * 3 + [1])
    expected_output: "3\n[3, 7]\n[4, 6]\n[0, 0, 0, 1]"
    answer_md: "sum(grid[0]) = 1 + 2 = 3. Tổng từng hàng (như axis=1) là [3, 7]. zip(*grid) ghép các cột (1, 3) và (2, 4) nên tổng theo cột (như axis=0) là [4, 6]. Với list, [0] * 3 lặp phần tử thành [0, 0, 0] rồi nối thêm [1], khác với ndarray nơi * là nhân từng phần tử."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng: tổng theo hàng là axis=1, tổng theo cột (zip(*grid)) là axis=0, list * số là lặp. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
