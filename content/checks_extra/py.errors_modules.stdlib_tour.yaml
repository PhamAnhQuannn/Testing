subtopic_id: py.errors_modules.stdlib_tour
items:
  - id: X372
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: "import math\nimport statistics\n\na = [3, 8, 8, 1]\nprint(math.gcd(12, 30), math.factorial(4))\nprint(math.ceil(7 / 2), math.floor(-0.5))\nprint(statistics.mean(a), statistics.median(a), statistics.mode(a))"
    expected_output: "6 24\n4 -1\n5 5.5 8"
    answer_md: "`gcd(12, 30)` là 6, `4! = 24`. `ceil(3.5)` là 4 và `floor(-0.5)` là -1 (làm tròn xuống, về phía số âm). List có tổng 20 nên mean là 5; sắp xếp thành 1, 3, 8, 8 nên median là (3 + 8) / 2 = 5.5; mode là 8 (xuất hiện 2 lần)."
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X373
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết `stats_summary(nums)` cho list số không rỗng (có đúng một giá trị xuất hiện nhiều nhất). Trả về list `[mean, median, mode]`: mean và median làm tròn 2 chữ số thập phân (kiểu float), mode là giá trị xuất hiện nhiều nhất. Dùng module `statistics`. Ví dụ `[1, 2, 2, 3, 4]` cho `[2.4, 2.0, 2]`.
    problem_id: check-x373-stats-summary
    rubric_md: "Pass toàn bộ test ẩn không gợi ý trong time-box (6 phút): bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X374
    difficulty: 3
    type: write_code
    minutes: 10
    prompt_md: |
      Viết `days_between(a, b)` với `a`, `b` là ngày dạng chuỗi `"YYYY-MM-DD"`. Trả về số ngày giữa hai ngày dưới dạng số nguyên không âm (thứ tự `a`, `b` không quan trọng). Dùng `datetime.strptime` rồi trừ hai ngày. Ví dụ `("2026-01-01", "2026-03-01")` cho `59`.
    problem_id: check-x374-days-between
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
