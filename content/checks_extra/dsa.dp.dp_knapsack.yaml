subtopic_id: dsa.dp.dp_knapsack
items:
  - id: X474
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      dp = [True] + [False] * 5
      for x in [2, 3]:
          for s in range(5, x - 1, -1):
              dp[s] = dp[s] or dp[s - x]
      print(dp)
      print(dp[4])
    expected_output: "[True, False, True, True, False, True]\nFalse"
    answer_md: 'Đây là subset sum với các số 2 và 3, target tối đa 5. Các tổng đạt được là 0, 2, 3, 5 nên `dp = [True, False, True, True, False, True]`; tổng 4 không chọn được từ {2, 3} nên `dp[4]` là `False`.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X475
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết `coin_change(coins, amount)`: `coins` là danh sách mệnh giá (mỗi mệnh giá dùng tùy ý), `amount` là số tiền. Trả về số đồng ít nhất để tổng đúng bằng `amount`, hoặc `-1` nếu không thể. `coin_change([1, 2, 5], 11)` là `3`; `coin_change([2], 3)` là `-1`; `amount = 0` cho `0`. Gợi ý: `dp[a] = min(dp[a], dp[a - c] + 1)`, duyệt `a` tăng dần.
    problem_id: check-x475-coin-change
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X476
    difficulty: 3
    type: write_code
    minutes: 10
    prompt_md: |
      Viết `can_partition(nums)`: `nums` là danh sách số nguyên dương. Trả `True` nếu chia được thành hai tập con có tổng bằng nhau, ngược lại `False`. `can_partition([1, 5, 11, 5])` là `True`; `can_partition([1, 2, 3, 5])` là `False`. Gợi ý: tổng lẻ thì sai ngay; còn lại là subset sum với target = tổng / 2, duyệt tổng giảm dần.
    problem_id: check-x476-partition-equal-subset-sum
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
