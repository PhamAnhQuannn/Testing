subtopic_id: sd.archetypes.metrics_logging
items:
  - id: S205
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Kể tên **ba trụ cột quan sát (observability)** và nói một câu cho mỗi loại: cái nào là số đo
      chuỗi thời gian rẻ dùng cho dashboard, cái nào là dòng sự việc tìm kiếm được nhưng đắt, cái nào
      theo một request đi qua nhiều service?
    answer_md: |
      - **Metrics**: số đo theo thời gian (time-series) như CPU 80%, request/giây — rẻ, gọn, cho
        dashboard và cảnh báo.
      - **Logs**: dòng chữ ghi một sự việc — tìm kiếm được theo từ khoá nhưng đắt (nhiều dữ liệu,
        phải đánh chỉ mục/index).
      - **Traces**: vết đi của một request qua nhiều service, cho biết chặng nào chậm/lỗi.
    rubric_md: "Đúng cả ba với mô tả đúng: metrics = số đo chuỗi thời gian rẻ (dashboard/alert), logs = dòng sự việc đắt nhưng tìm kiếm được, traces = theo một request xuyên service. Đủ ba, đúng ý: bằng chứng điểm 1; thiếu hoặc lẫn lộn một trụ cột: tối đa điểm 0."
  - id: S206
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một team gắn nhãn user_id và request_id vào metric đếm số request để "lọc theo từng người".
      Sau một tuần, time-series DB cạn RAM và truy vấn chậm hẳn.
      (1) Giải thích chuyện gì đã xảy ra bằng khái niệm **cardinality**;
      (2) sửa thế nào — nên để thông tin theo từng người dùng ở đâu;
      (3) với dữ liệu để lâu, nêu một kỹ thuật giảm dung lượng mà vẫn xem được xu hướng.
    answer_md: |
      (1) Mỗi **tổ hợp nhãn** là một **chuỗi (series)** riêng mà TSDB phải giữ chỉ mục trong RAM;
      user_id và request_id có hàng triệu giá trị nên **cardinality nổ** lên hàng triệu/tỉ chuỗi →
      cạn bộ nhớ và chậm.
      (2) **Bỏ các nhãn giá trị cao** khỏi metric; chỉ giữ nhãn có tập giá trị nhỏ (region, endpoint,
      status). Thông tin theo từng user/request để trong **log** hoặc kho phân tích rồi tra khi cần.
      (3) Dùng **rollup/downsampling**: giữ điểm mịn gần đây, gộp thành trung bình/min/max từng
      phút/giờ cho dữ liệu cũ (kèm **lưu theo tầng** và xoá khi hết hạn).
    rubric_md: "Đạt khi nêu đúng cả 3 ý: cardinality nổ do nhãn giá trị cao (mỗi tổ hợp = một chuỗi); sửa bằng bỏ nhãn cao-cardinality và đưa dữ liệu per-user vào log/kho phân tích; và một kỹ thuật rollup/downsampling (hoặc tiered retention) cho dữ liệu cũ. Đúng, tự giải thích được trong time-box: bằng chứng điểm 2. Không chỉ ra nguyên nhân cardinality hoặc không biết chuyển dữ liệu per-user ra log: tối đa điểm 1."
  - id: S207
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      **Phỏng vấn.** Thiết kế hệ metrics + logging cho 5.000 server, mỗi server gửi 100 số đo mỗi
      10 giây, lưu 30 ngày, cảnh báo khi CPU > 90% trong 5 phút. Trình bày:
      (1) đường thu thập từ agent đến nơi lưu (metrics và log đi đâu, vai trò của đường ống/Kafka);
      (2) vì sao phải khống chế **cardinality** và khống chế thế nào;
      (3) **rollup + lưu theo tầng** để vừa giữ 30 ngày vừa tiết kiệm;
      (4) cách đánh giá một cảnh báo đáng gọi người — theo tiêu chí nào, tránh gì.
    answer_md: |
      (1) Mỗi server chạy **agent** thu số đo + log, gửi kiểu đẩy hoặc để hệ kéo. Dữ liệu đi qua
      **đường ống đệm (Kafka)** để chịu đỉnh tải và tách người gửi khỏi kho lưu; sau đó **tách nhánh**:
      metrics vào **time-series DB**, log vào **kho index/tìm kiếm**. (5.000 × 100 / 10s = 50.000
      điểm/giây — hợp với một TSDB.)
      (2) **Cardinality** = số tổ hợp nhãn, mỗi tổ hợp là một chuỗi TSDB phải giữ chỉ mục trong RAM.
      Chỉ gắn nhãn giá trị thấp (host, region, endpoint, status); **cấm nhãn giá trị cao** (user_id,
      request_id) để khỏi nổ bộ nhớ; thông tin per-user để trong log.
      (3) Giữ dữ liệu mịn (10 giây) trong vài ngày rồi **downsampling** thành trung bình/min/max từng
      phút/giờ cho phần cũ; **lưu theo tầng** nóng/ấm/lạnh (ổ nhanh → ổ rẻ → kho file), xoá sau 30
      ngày. Nhờ vậy 30 ngày vẫn xem được mà không lưu từng điểm mịn suốt.
      (4) Luật "CPU > 90% trong 5 phút" dùng ngưỡng + khoảng thời gian để lọc nhịp thoáng qua. Cảnh
      báo đáng **gọi người (page)** nên theo **triệu chứng người dùng thấy** và **mức tiêu hao SLO
      (SLO burn)**, không theo mọi dao động; **gộp tin trùng (dedup)** khi nhiều máy cùng lỗi; mỗi
      cảnh báo có hành động rõ ràng — để tránh **alert fatigue**.
    rubric_md: "Đạt mức 3 (phỏng vấn) khi: (1) vẽ đúng đường agent → Kafka → TSDB cho metrics + kho tìm kiếm cho log, nêu vai trò đệm/tách của đường ống; (2) giải thích cardinality và khống chế bằng cấm nhãn giá trị cao; (3) nêu rollup/downsampling + lưu theo tầng để giữ 30 ngày tiết kiệm; (4) đánh giá cảnh báo theo triệu chứng/SLO, dùng dedup, tránh alert fatigue. Đúng, mạch lạc, tự bảo vệ được trong time-box: bằng chứng điểm 3. Thiếu cardinality hoặc thiếu chiến lược cảnh báo hợp lý: chưa đạt mức 3."
