subtopic_id: sd.data.object_blob_storage
items:
  - id: S058
    difficulty: 1
    type: concept
    minutes: 3
    prompt_md: |
      Nói ngắn gọn: object/blob storage (kiểu S3) lưu dữ liệu thế nào, và khi dùng nó cho ảnh/video thì
      ta để **cái gì** trong object storage và **cái gì** trong database (DB)?
    answer_md: |
      Object storage lưu **cả file** (object) theo một **khóa** (key) trong bucket, có metadata, truy cập
      qua **HTTP** (ghi/đọc cả object, không sửa tại chỗ); nó rẻ và cực bền. Với ảnh/video: để **nội dung
      file (blob)** trong object storage, và chỉ giữ một **URL/khóa** cùng vài metadata (tên, chủ sở hữu,
      kích thước) trong **DB**. Lý do: không nhét file lớn vào DB để DB khỏi phình, sao lưu nhanh, tận
      dụng kho rẻ/bền và phân phát HTTP/CDN.
    rubric_md: "Đạt khi nêu đúng hai ý: object storage = lưu cả file theo khóa (rẻ/bền, HTTP) và tách blob ra kho còn DB chỉ giữ URL/khóa. Đúng ý: bằng chứng điểm 1; thiếu vế 'DB chỉ giữ con trỏ/URL' hoặc nhầm object storage là nơi đọc giao dịch: tối đa điểm 0."
  - id: S059
    difficulty: 2
    type: concept
    minutes: 8
    prompt_md: |
      Một dịch vụ cho người dùng tải ảnh/video. Nếu client gửi file **qua** app server rồi server mới đẩy
      lên kho thì app server quá tải băng thông lúc cao điểm. Hãy đề xuất cách tải tốt hơn **và** giải
      thích: (1) dùng cơ chế gì để client tải **thẳng** lên object storage; (2) các bước của luồng đó; (3)
      với file rất lớn thì bổ sung kỹ thuật gì để không phải làm lại từ đầu khi đứt mạng.
    answer_md: |
      (1) Dùng **presigned URL**: app server (giữ khóa bí mật của kho) ký một URL **tạm, có hạn và giới
      hạn quyền** (đúng khóa/bucket, quyền PUT) để client tải **thẳng** lên object storage, bỏ qua app
      server — nhờ đó server không nuốt băng thông/bộ nhớ của file.
      (2) Luồng: client xin phép → server cấp presigned URL (không nhận byte nào) → client PUT thẳng file
      lên kho → sau khi xong, server ghi **metadata** (khóa object, chủ sở hữu, kích thước, trạng thái
      sẵn sàng) vào **DB**.
      (3) Với file rất lớn dùng **multipart upload**: cắt file thành nhiều phần (mỗi phần có presigned URL
      riêng), tải song song; đứt mạng thì chỉ **gửi lại phần hỏng** (resumable), xong hết thì gọi bước
      "hoàn tất" để kho ghép thành một object.
    rubric_md: "Đạt khi nêu đúng cả 3 ý: presigned URL cho client tải thẳng lên kho (và vì sao server khỏi nghẽn), đúng các bước xin link → ký → PUT thẳng → ghi metadata vào DB, và multipart/resumable cho file lớn. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu ý presigned URL bỏ qua app server, hoặc không nói client PUT thẳng lên kho: tối đa điểm 1."
  - id: S060
    difficulty: 3
    type: concept
    minutes: 10
    prompt_md: |
      Thiết kế dịch vụ tải file lớn (ảnh/video) đạt mức phỏng vấn: (1) **vẽ luồng upload bằng presigned
      URL** (kèm multipart cho file lớn) và nói rõ vì sao bỏ qua app server; (2) **so sánh độ bền** giữa
      **chép 3 bản (3-way replication)** và **erasure coding 10+4** bằng **con số cụ thể**: mỗi cách tốn
      bao nhiêu lần dung lượng và chịu được mất mấy mảnh/bản — rồi kết luận khi nào dùng cách nào.
    answer_md: |
      **(1) Luồng upload bằng presigned URL.**
      - Client xin phép app server (muốn tải `video.mp4`, 500 MB).
      - Server (giữ khóa bí mật của kho) ký một **presigned URL** có hạn (ví dụ 15 phút) và giới hạn đúng
        khóa/bucket + quyền PUT, trả về cho client; server **không** nhận byte nào của file.
      - Client **PUT thẳng** lên object storage. File lớn → **multipart**: cắt thành nhiều phần (mỗi phần
        một presigned URL), tải song song, resumable (lỗi phần nào gửi lại phần đó), rồi gọi "hoàn tất" để
        kho ghép các phần.
      - Tải xong, server ghi **metadata** (khóa object, chủ sở hữu, kích thước, trạng thái) vào **DB**.
      - Vì sao bỏ qua app server: phần nặng là truyền byte do kho lo; app server chỉ ký URL và ghi một
        dòng, nên không nghẽn băng thông/bộ nhớ và scale tốt. (Đọc nóng thì đặt **CDN** trước kho.)

      **(2) So sánh độ bền bằng con số.**
      - **Chép 3 bản (3-way replication):** 3 bản sao y hệt → dung lượng **3x**; mất tối đa **2 bản** vẫn
        còn 1 bản đọc được. Đơn giản, đọc nhanh, nhưng tốn gấp 3.
      - **Erasure coding 10+4:** 10 mảnh dữ liệu + 4 mảnh kiểm tra = 14 mảnh → dung lượng 14/10 = **1,4x**;
        cần 10 mảnh bất kỳ để dựng lại nên mất tối đa **4 mảnh** vẫn an toàn. Bền hơn (chịu 4 lỗi) và rẻ
        hơn (1,4x so với 3x), nhưng đọc/ghi tốn CPU để mã hóa/giải mã và gom nhiều mảnh (độ trễ cao hơn).
      - **Kết luận:** dùng **erasure coding** cho phần lớn dữ liệu lớn/ít đọc nóng (ảnh gốc, backup) để
        tiết kiệm; dùng **chép bản** cho dữ liệu nhỏ/nóng cần đọc nhanh, đơn giản.
    rubric_md: "Đạt (mức phỏng vấn) khi: (1) vẽ đúng luồng presigned URL (xin link → ký có hạn/giới hạn quyền → client PUT thẳng lên kho → ghi metadata vào DB) kèm multipart cho file lớn, và giải thích vì sao bỏ qua app server; (2) so sánh độ bền bằng CON SỐ ĐÚNG: chép 3 bản = 3x, chịu 2 lỗi; erasure coding 10+4 = 1,4x, chịu 4 lỗi; và kết luận khi nào dùng cách nào. Đúng, trong time-box, con số chuẩn: bằng chứng điểm 3. Sai/thiếu con số độ bền (3x/2 lỗi, 1,4x/4 lỗi) hoặc không vẽ được luồng presigned URL: chưa đạt mức 3."
