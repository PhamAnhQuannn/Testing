subtopic_id: dsa.practical.bank_ledger_systems
items:
  - id: X520
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      balances = {"a": 500, "b": 100}

      def transfer(src, dst, amount):
          if balances[src] < amount:
              return False
          balances[src] -= amount
          balances[dst] += amount
          return True

      print(transfer("a", "b", 200), transfer("b", "a", 400))
      print(balances)
      print(sum(balances.values()))
    expected_output: "True False\n{'a': 300, 'b': 300}\n600"
    answer_md: 'Lần chuyển đầu hợp lệ (a có 500 >= 200) nên a còn 300, b thành 300. Lần hai b chỉ có 300 < 400 nên bị từ chối (`False`) và số dư không đổi; tổng tiền vẫn 600.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X521
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết `class Bank` với `open(account_id)`, `deposit(account_id, amount)`, `withdraw(account_id, amount)`, `transfer(src, dst, amount)` và `balance(account_id)`. Tiền là số nguyên xu. `deposit`, `withdraw`, `transfer` trả `bool` (`False` nếu thiếu tài khoản, `amount <= 0` hoặc không đủ tiền); `transfer` phải nguyên tử; `balance` trả `None` nếu không có tài khoản. Gợi ý: dict số dư, validate hết rồi mới sửa.
    problem_id: check-x521-bank-accounts
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X522
    difficulty: 3
    type: write_code
    minutes: 10
    prompt_md: |
      Viết `class Ledger` với `open(account_id)`, `pay(account_id, amount)` (ghi nhận chi ra), `transfer(src, dst, amount)` (trả `bool`, tính là khoản chi của `src`) và `top_spenders(k)` trả `k` account id có tổng chi cao nhất, hoà thì `account_id` tăng dần; `k` lớn hơn số tài khoản thì trả tất cả. Gợi ý: sắp xếp theo khoá `(-tổng_chi, id)`.
    problem_id: check-x522-top-spenders
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
