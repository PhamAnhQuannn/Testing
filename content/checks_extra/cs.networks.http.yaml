subtopic_id: cs.networks.http
items:
  - id: X831
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
    code: |-
      codes = [200, 301, 404, 500, 204]
      classes = {2: "ok", 3: "redirect", 4: "client", 5: "server"}
      for c in codes:
          print(classes[c // 100])
    expected_output: "ok\nredirect\nclient\nserver\nok"
    answer_md: "Nhóm status là c // 100. 200 và 204 cho 2 (ok), 301 cho 3 (redirect), 404 cho 4 (client), 500 cho 5 (server)."
    rubric_md: "Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X832
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `dispatch(routes, method, path)` mô phỏng việc server HTTP chọn handler theo method và path. `routes` là list các `[method, path, handler_name]` (đều là chuỗi), ví dụ `[["GET", "/users", "list_users"], ["POST", "/users", "create_user"]]`. Trả về `handler_name` của route ĐẦU TIÊN có `method` và `path` đều khớp chính xác (so sánh chuỗi bằng nhau, không wildcard). Nếu không route nào khớp thì trả `None`. Ví dụ `dispatch([["GET","/u","h1"],["POST","/u","h2"]], "POST", "/u")` cho `"h2"`, và `dispatch([["GET","/u","h1"]], "GET", "/x")` cho `None`.
    problem_id: check-x832-dispatch
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X833
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích khi nào `fetch` nhận 304 thay vì 200.
    code: |-
      def handle(server_etag, if_none_match):
          if if_none_match == server_etag:
              return 304
          return 200


      def fetch(cache, url, server):
          status = handle(server[url], cache.get(url))
          if status == 200:
              cache[url] = server[url]
          return status


      server = {"/a": "v1", "/b": "x1"}
      cache = {}
      print(fetch(cache, "/a", server))
      print(fetch(cache, "/a", server))
      server["/a"] = "v2"
      print(fetch(cache, "/a", server))
      print(fetch(cache, "/b", server))
      print(fetch(cache, "/b", server))
      print(sorted(cache.items()))
    expected_output: "200\n304\n200\n200\n304\n[('/a', 'v2'), ('/b', 'x1')]"
    answer_md: "Lần đầu cache rỗng nên If-None-Match là None, khác v1, server trả 200 và cache lưu v1. Lần hai ETag khớp nên 304. Sau khi server đổi sang v2, cache còn v1 nên 200 và cache cập nhật v2. /b lần đầu 200 (lưu x1), lần hai 304. Cuối cùng cache là [('/a', 'v2'), ('/b', 'x1')]."
    rubric_md: "Output khớp từng dòng VÀ giải thích đúng: 304 khi If-None-Match (ETag client đang giữ) bằng ETag hiện tại của server; ngược lại 200 kèm nội dung mới. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
