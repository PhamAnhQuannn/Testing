subtopic_id: py.core.operators
items:
  - id: X003
    difficulty: 2
    type: write_code
    minutes: 5
    prompt_md: |
      Viết `to_hms(total_seconds)` đổi số giây thành danh sách `[giờ, phút, giây]` (phút và giây
      nhỏ hơn 60). Dùng `//` và `%` hoặc `divmod`, không cần vòng lặp.
    problem_id: check-x003
    rubric_md: "Pass toàn bộ test ẩn. Đúng: bằng chứng điểm 2; sai: tối đa điểm 1."
  - id: X313
    difficulty: 3
    type: write_code
    minutes: 12
    prompt_md: |
      Viết `to_base(n, b)` đổi số nguyên n sang chuỗi trong cơ số b (2 <= b <= 36), dùng chữ số `0-9` rồi chữ thường `a-z` cho giá trị 10..35. n = 0 trả `"0"`; n âm thì thêm dấu `-` phía trước biểu diễn của |n|. Không dùng `bin`, `hex`, `format` hay thư viện; hãy dùng `//` và `%`.
    problem_id: check-to-base
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 12 phút: bằng chứng điểm 3; phải xem gợi ý hoặc quá thời gian: tối đa điểm 2."
