subtopic_id: lld.patterns.behavioral_strategy_state
items:
  - id: X582
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Giải thích 1 câu vì sao.
    code: |-
      class Percent:
          def __init__(self, p):
              self.p = p

          def apply(self, amount):
              return amount * (100 - self.p) // 100


      class Fixed:
          def __init__(self, off):
              self.off = off

          def apply(self, amount):
              return max(0, amount - self.off)


      class Cart:
          def __init__(self, discount):
              self.discount = discount
              self.items = []

          def add(self, price):
              self.items.append(price)

          def total(self):
              return self.discount.apply(sum(self.items))


      cart = Cart(Percent(20))
      cart.add(100)
      cart.add(50)
      print(cart.total())
      cart.discount = Fixed(200)
      print(cart.total())
    expected_output: "120\n0"
    answer_md: 'Tạm tính 150; `Percent(20)` cho `150 * 80 // 100 = 120`. Sau khi gán `Fixed(200)`, `max(0, 150 - 200)` là 0. Cart giữ strategy và giao việc cho nó (Strategy).'
    rubric_md: "Output khớp VÀ nêu context giao việc cho strategy đang giữ. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
  - id: X583
    difficulty: 2
    type: write_code
    minutes: 8
    prompt_md: |
      Viết `class Cart` theo Strategy: constructor không tham số (tạm tính 0, giảm giá mặc định `"none"`). `add(price)` cộng giá (int) vào tạm tính; `set_discount(kind)` chọn strategy theo tên (`"none"`, `"percent10"`, `"fixed50"`); `total()` trả int sau khi áp strategy hiện tại: `none` giữ nguyên, `percent10` là `subtotal * 90 // 100`, `fixed50` là `max(0, subtotal - 50)`. Ví dụ thêm 100 và 100 rồi `set_discount("percent10")` thì `total()` là 180.
    problem_id: check-x583-cart-discount
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X584
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích máy đổi state ở những bước nào (State pattern).
    code: |-
      class Waiting:
          def insert(self, m):
              print("coin accepted")
              m.state = Paid()

          def select(self, m):
              print("insert coin first")


      class Paid:
          def insert(self, m):
              print("already paid")

          def select(self, m):
              m.stock -= 1
              print("dispense, left", m.stock)
              m.state = Waiting() if m.stock > 0 else SoldOut()


      class SoldOut:
          def insert(self, m):
              print("sold out")

          def select(self, m):
              print("sold out")


      class Machine:
          def __init__(self, stock):
              self.stock = stock
              self.state = Waiting()

          def insert(self):
              self.state.insert(self)

          def select(self):
              self.state.select(self)


      m = Machine(2)
      m.select()
      m.insert()
      m.insert()
      m.select()
      m.select()
      m.insert()
      m.select()
      m.insert()
      print(type(m.state).__name__)
    expected_output: "insert coin first\ncoin accepted\nalready paid\ndispense, left 1\ninsert coin first\ncoin accepted\ndispense, left 0\nsold out\nSoldOut"
    answer_md: 'Máy bắt đầu ở `Waiting`: `select` chỉ in nhắc bỏ tiền. `insert` sang `Paid`; `insert` nữa in "already paid". `select` nhả hàng (kho 1) và về `Waiting`. Lặp lại `select`/`insert`/`select`: kho về 0 nên sang `SoldOut`; `insert` cuối in "sold out" và state cuối là `SoldOut`.'
    rubric_md: "Output khớp từng dòng VÀ nêu đúng các bước chuyển state. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
