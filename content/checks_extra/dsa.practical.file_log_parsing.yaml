subtopic_id: dsa.practical.file_log_parsing
items:
  - id: X529
    difficulty: 1
    type: read_code
    minutes: 3
    prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
    code: |-
      from collections import Counter

      lines = ["GET /a 200", "GET /b 200", "GET /a 404", "oops", "GET /a 200"]
      codes = Counter()
      for line in lines:
          parts = line.split()
          if len(parts) != 3:
              continue
          codes[parts[2]] += 1
      print(codes["200"], len(codes))
      print(codes.most_common(1))
    expected_output: "3 2\n[('200', 3)]"
    answer_md: 'Dòng `"oops"` chỉ có 1 cột nên bị bỏ qua. Status `"200"` xuất hiện 3 lần, `"404"` 1 lần, nên `codes["200"]` là 3 và `len(codes)` là 2 (hai status khác nhau); `most_common(1)` trả phần tử đếm nhiều nhất là `[(''200'', 3)]`.'
    rubric_md: "Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0."
