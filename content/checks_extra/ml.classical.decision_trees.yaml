subtopic_id: ml.classical.decision_trees
items:
  - id: X687
    difficulty: 2
    type: write_code
    minutes: 6
    prompt_md: |
      Viết hàm `gini(labels)` trả về Gini impurity `1 − Σ p²` của một list nhãn nguyên (p là tỉ lệ của từng lớp), làm tròn 6 chữ số. List rỗng trả `0.0`. Ví dụ: `gini([0, 0, 1, 1])` là `0.5`, `gini([1, 1, 1])` là `0.0`.
    problem_id: check-x687-gini
    rubric_md: "Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1."
  - id: X688
    difficulty: 3
    type: read_code
    minutes: 5
    prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao information gain dương nghĩa là split hữu ích, và vì sao phải dùng trọng số theo kích thước nút con.
    code: |-
      def gini(l):
          n = len(l)
          return 1 - sum((l.count(c) / n) ** 2 for c in set(l))
      parent = [0, 0, 0, 1, 1, 1]
      left = [0, 0, 0, 1]
      right = [1, 1]
      w = (len(left) * gini(left) + len(right) * gini(right)) / len(parent)
      print(round(gini(parent), 4))
      print(round(w, 4))
      print(round(gini(parent) - w, 4))
      print(gini(parent) - w > 0)
    expected_output: "0.5\n0.25\n0.25\nTrue"
    answer_md: "Gini cha = 1 − (0,25 + 0,25) = 0,5. Con trái [0,0,0,1]: p = 0,75 và 0,25 nên 1 − (0,5625 + 0,0625) = 0,375; con phải [1,1] thuần nên 0. Trung bình có trọng số = (4·0,375 + 2·0)/6 = 0,25. Gain = 0,5 − 0,25 = 0,25 > 0 nên in True: split làm các nút con thuần hơn cha. Trọng số theo kích thước để nút con lớn (4 mẫu) đóng góp nhiều hơn nút con nhỏ (2 mẫu); trung bình cộng đơn giản sẽ cho 0,1875 và đánh giá sai."
    rubric_md: "Output khớp từng dòng VÀ giải thích gain dương = các nút con thuần hơn nút cha, cùng lý do cần trọng số theo kích thước. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2."
