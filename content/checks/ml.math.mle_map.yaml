- id: X653
  difficulty: 1
  type: read_code
  minutes: 4
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và cho biết `p` nào
    có likelihood cao hơn, vì sao.
  code: "heads, n = 7, 10\nfor p in (0.5, 0.7):\n    print(round(p ** heads * (1 - p) ** (n - heads),\
    \ 6))\nprint(heads / n)"
  expected_output: '0.000977

    0.002224

    0.7'
  answer_md: Likelihood của 7 ngửa trong 10 lần là `p⁷(1−p)³`. Với `p = 0,5` được `0,5¹⁰ ≈ 0,000977`;
    với `p = 0,7` được `0,0823543·0,027 ≈ 0,002224`. `p = 0,7` cao hơn và dòng cuối `heads/n = 0,7` chính
    là MLE p̂.
  rubric_md: 'Output khớp từng dòng VÀ nhận ra 0,7 (= heads/n) cho likelihood lớn hơn nên là MLE. Đúng:
    bằng chứng điểm 1; sai: 0.'
- id: X654
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết hàm `nll_bernoulli(ys, ps)` trả negative log-likelihood Bernoulli (log loss, dạng tổng):
    `-sum(y*ln(p) + (1-y)*ln(1-p))` theo từng cặp, với `ys` là nhãn 0/1 và `ps` là xác suất trong `(0,
    1)` cùng độ dài. Dùng `math.log` (log tự nhiên). Để tránh `log(0)`, kẹp mỗi `p` vào `[1e-12, 1 - 1e-12]`
    trước khi lấy log. Trả float `round(·, 6)`. Ví dụ: `nll_bernoulli([1, 0, 1], [0.9, 0.2, 0.6])` cho
    `0.83933`.

    '
  problem_id: check-x654-nll
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X655
  difficulty: 3
  type: read_code
  minutes: 6
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích dòng
    2 liên hệ với MAP và prior Gaussian thế nào.
  code: 'xs = [1, 2, 3]

    ys = [2, 4, 7]

    w, lam = 2.0, 0.5

    sse = sum((y - w * x) ** 2 for x, y in zip(xs, ys))

    print(sse)

    print(sse + lam * w * w)

    print(round(sse / len(xs), 4))'
  expected_output: '1.0

    3.0

    0.3333'
  answer_md: 'Sai số `y − w·x` lần lượt là `0, 0, 1` nên `sse = 1,0`. Dòng 2 là `sse + λ·w² = 1 + 0,5·4
    = 3,0`: tổng bình phương sai số (từ MLE nhiễu Gaussian) cộng phạt L2, đây chính là NLL của MAP với
    prior Gaussian trên `w` (λ phụ thuộc tỉ lệ σ²/τ²). Dòng 3 là MSE `1/3 ≈ 0,3333`.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích được dòng 2 = sai số bình phương (MLE Gaussian) + L2
    (prior Gaussian = MAP). Đúng: bằng chứng điểm 3; sai: tối đa điểm 2.'
