- id: X789
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
  code: "t = {}\nt[\"an\"] = 5\nt[\"binh\"] = 3\nt[\"an\"] = 9\ndel t[\"binh\"]\nt.pop(\"zed\", None)\n\
    t[\"cuong\"] = 1\nif \"binh\" in t:\n    t[\"binh\"] += 1\nprint(sorted(t.items()))\nprint(len(t))"
  expected_output: '[(''an'', 9), (''cuong'', 1)]

    2'
  answer_md: 'Mô phỏng INSERT, UPDATE, DELETE trên dict: an = 5 rồi ghi đè thành 9 (như INSERT OR REPLACE),
    binh bị xóa, xóa zed không có thì không lỗi (DELETE 0 dòng), cuong = 1; vì binh đã xóa nên nhánh `if`
    không chạy (UPDATE không khớp dòng nào). Còn 2 khóa, sắp theo tên.'
  rubric_md: 'Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0.'
- id: X790
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết hàm `apply_ops(ops)` bằng `sqlite3` trong bộ nhớ. Tạo bảng `t(name TEXT PRIMARY KEY,
    score INTEGER)`, rồi áp dụng lần lượt từng thao tác trong `ops` bằng câu SQL tham số hoá: `["insert",
    name, score]` chạy `INSERT OR REPLACE INTO t(name, score) VALUES (?, ?)` (chèn lại cùng tên thì ghi
    đè), `["update", name, score]` chạy `UPDATE t SET score = ? WHERE name = ?` (tên không có thì không
    làm gì), `["delete", name]` chạy `DELETE FROM t WHERE name = ?`. Cuối cùng chạy `SELECT name, score
    FROM t ORDER BY name ASC` và trả về list các cặp `[name, score]`, mỗi cặp là list. Ví dụ `[["insert","an",5],["insert","binh",3],["update","an",9],["delete","binh"]]`
    cho `[["an", 9]]`.

    '
  problem_id: check-x790-apply-ops
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X791
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    thứ tự UPDATE và DELETE làm kết quả khác nhau, và vì sao chạy UPDATE lần hai không đổi gì.
  code: "def run(order):\n    d = {\"a\": 1, \"b\": 2, \"c\": 3}\n    for op in order:\n        if op\
    \ == \"upd\":\n            for k in d:\n                if d[k] < 3:\n                    d[k] +=\
    \ 10\n        else:\n            for k in [k for k in d if d[k] >= 3]:\n                del d[k]\n\
    \    return d\n\n\nprint(run([\"upd\", \"del\"]))\nprint(run([\"del\", \"upd\"]))\nprint(run([\"del\"\
    , \"upd\", \"upd\"]))"
  expected_output: '{}

    {''a'': 11, ''b'': 12}

    {''a'': 11, ''b'': 12}'
  answer_md: 'UPDATE (score + 10 WHERE score < 3) rồi DELETE (WHERE score >= 3): a và b tăng thành 11,
    12 nên đều thỏa score >= 3 và bị xóa cùng c, còn `{}`. Đảo thứ tự: DELETE chạy trước chỉ xóa c (3),
    rồi UPDATE tăng a, b, còn `{''a'': 11, ''b'': 12}`. UPDATE lần hai không dòng nào còn score < 3 nên
    không đổi gì. Bài học: các lệnh DML chạy tuần tự, lệnh sau thấy dữ liệu đã bị lệnh trước sửa.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng: lệnh sau nhìn thấy kết quả của lệnh trước (UPDATE
    làm a, b thỏa điều kiện DELETE), nên thứ tự quyết định kết quả; UPDATE lặp lại không khớp dòng nào
    thì không đổi. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2.'
