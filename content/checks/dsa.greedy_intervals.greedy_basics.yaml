  prompt_md: 'Viết `min_jumps(nums)`: bạn bắt đầu ở chỉ số 0; `nums[i]` là độ dài bước nhảy tối đa từ
    chỉ số `i`. Trả về số bước nhảy tối thiểu để tới chỉ số cuối (đảm bảo luôn tới được). `min_jumps([2,
    3, 1, 1, 4])` là `2`, `min_jumps([0])` là `0`. Gợi ý: greedy theo tầng (như BFS), giữ `cur_end` và
    `farthest`; mỗi lần chạm `cur_end` thì tăng số bước nhảy.

