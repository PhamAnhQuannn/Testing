  minutes: 8
  prompt_md: 'Viết `can_jump(nums)`: bạn đứng ở chỉ số 0 của mảng `nums`; `nums[i]` là độ dài bước nhảy
    tối đa từ chỉ số `i`. Trả về `True` nếu có thể tới chỉ số cuối, ngược lại `False`. `can_jump([2, 3,
    1, 1, 4])` là `True`, `can_jump([3, 2, 1, 0, 4])` là `False`. Gợi ý: greedy, giữ chỉ số xa nhất có
    thể tới (`reach`); nếu `i > reach` thì bị chặn.

    '
  problem_id: check-x499-jump-game
