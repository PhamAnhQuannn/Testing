items:
- id: X498
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "def greedy_coins(coins, amount):\n    count = 0\n    for c in sorted(coins, reverse=True):\n\
    \        count += amount // c\n        amount %= c\n    return count if amount == 0 else -1\n\nprint(greedy_coins([1,\
    \ 5, 10], 28))\nprint(greedy_coins([1, 3, 4], 6))\nprint(greedy_coins([2, 5], 3))"
  expected_output: '6

    3

    -1'
  answer_md: 'Với `{1, 5, 10}` và 28: 10 + 10 + 5 + 1 + 1 + 1 là 6 xu. Với `{1, 3, 4}` và 6: greedy lấy
    4 + 1 + 1 là 3 xu dù tối ưu là 3 + 3 (2 xu), nên greedy sai ở đây. Với `{2, 5}` và 3: lấy 0 tờ 5 và
    0 tờ 2, còn dư 3 nên trả `-1`.'
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
- id: X499
  difficulty: 2
