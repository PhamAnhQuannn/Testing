  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 2; sai: tối đa điểm 1.'
- id: X366
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code dừng với exception nào? Ghi tên loại exception và giải
    thích 1 câu.
  code: "ds = {\"a\": 1, \"b\": 2}\nfor k in [\"a\", \"b\", \"c\"]:\n    print(k, ds[k])"
  expected_output: 'a 1

    b 2

    KeyError: ''c'''
  answer_md: 'Hai vòng đầu in `a 1` và `b 2`. Vòng thứ ba tra khóa `"c"` không có trong dict nên ném `KeyError`,
    chương trình dừng với traceback kết thúc bằng `KeyError: ''c''`.'
  rubric_md: 'Nêu đúng `KeyError` (và hai dòng in trước đó) VÀ giải thích đúng 1 câu. Đúng: bằng chứng
    điểm 1; sai: tối đa điểm 0.'
- id: X367
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Viết `validate_age(values)` nhận một list. Với mỗi phần tử: nếu là số nguyên không âm thì
    giữ nguyên; nếu âm hoặc không phải số nguyên thì thay bằng chuỗi `"invalid"`. Hãy làm bằng `raise
    ValueError(...)` trong một hàm kiểm tra rồi `try/except ValueError` ở vòng lặp. Trả về list cùng độ
    dài.

    '
  problem_id: check-x367-validate-age
