  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), dòng code in ra gì? Giải thích 1 câu.
  code: "def f(x):\n    try:\n        return 10 / x\n    except ZeroDivisionError:\n        return \"\
    zero\"\n    except TypeError:\n        return \"type\"\nprint(f(2), f(0), f(\"a\"))"
  expected_output: 5.0 zero type
