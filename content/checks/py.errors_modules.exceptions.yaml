- id: Q168
  difficulty: 2
  type: concept
  minutes: 3
  prompt_md: Viết class lỗi riêng `InsufficientFunds` và nói khi nào nên raise exception thay vì trả mã
    lỗi.
  answer_md: 'class InsufficientFunds(Exception): pass. Raise khi tình huống bất thường mà người gọi phải
    xử lý hoặc không thể tiếp tục; không dùng exception cho luồng bình thường.'
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 2; sai:
    tối đa điểm 1.'
