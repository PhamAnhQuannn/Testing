  prompt_md: 'Phân biệt hai dạng two pointers: "hai đầu" và "cùng chiều (reader/writer)". Mỗi dạng hợp
    với bài nào?'
  answer_md: 'Hai đầu: mảng đã sắp (two sum sorted, container with most water, palindrome). Cùng chiều:
    lọc/nén tại chỗ (xoá trùng, move zeroes), cửa sổ trượt.'
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 1; sai:
    tối đa điểm 0.'
