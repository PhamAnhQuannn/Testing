subtopic_id: eng.frontend_basics.browser_web_perf
items:
- id: E190
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Nêu **5 bước của render pipeline** theo đúng thứ tự, và phân biệt **reflow** với **repaint**.

    '
  answer_md: "- Thứ tự: **parse** (HTML thành DOM, CSS thành CSSOM) rồi **style**, **layout** (tính vị\
    \ trí/kích thước),\n  **paint** (vẽ pixel), **composite** (ghép các layer).\n- **Reflow** (layout):\
    \ tính lại vị trí/kích thước khi đổi width, thêm/xóa phần tử; **đắt** và kéo theo repaint.\n- **Repaint**:\
    \ vẽ lại khi chỉ đổi diện mạo (ví dụ màu) mà không đổi layout; **rẻ hơn** reflow.\n"
  rubric_md: 'Đạt khi nêu đúng thứ tự 5 bước (parse, style, layout, paint, composite) và phân biệt đúng
    reflow (đổi vị trí/kích thước, đắt) với repaint (đổi màu, không đổi layout, rẻ hơn). Đủ cả hai: bằng
    chứng điểm 1; sai thứ tự hoặc đảo reflow/repaint: điểm 0.'
- id: E191
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Trả lời ba ý:

    1. Giải thích vì sao script thường chặn render, và khác nhau giữa **async** và **defer**.

    2. Khác nhau giữa **cookie** và **localStorage**; `fetch` trả về gì?

    3. **LCP**, **INP**, **CLS** mỗi chỉ số đo điều gì?

    '
  answer_md: "1. Script thường **chặn parse HTML**: trình duyệt phải tải và chạy xong mới đọc tiếp. **async**\
    \ tải song song và\n   **chạy ngay khi tải xong** (thứ tự không đảm bảo). **defer** tải song song,\
    \ **chạy sau khi parse HTML xong**\n   và **theo đúng thứ tự**.\n2. **Cookie** được trình duyệt **tự\
    \ gửi kèm request** tới server; **localStorage** chỉ nằm ở client, không gửi\n   lên server. `fetch`\
    \ trả về một **Promise** (và không tự reject với HTTP 404/500, cần kiểm tra `res.ok`).\n3. **LCP**:\
    \ tốc độ tải nội dung chính. **INP**: độ phản hồi khi tương tác (thay FID). **CLS**: độ ổn định bố\
    \ cục\n   (không nhảy khi tải).\n"
  rubric_md: 'Đạt khi đúng cả ba nhóm: (1) script thường chặn parse; async chạy ngay khi tải xong, không
    đảm bảo thứ tự; defer chạy sau khi parse xong theo thứ tự; (2) cookie gửi kèm request còn localStorage
    chỉ ở client, fetch trả Promise; (3) LCP tải nội dung chính, INP phản hồi tương tác, CLS ổn định bố
    cục. Đủ ba: bằng chứng điểm 2. Đúng hai: tối đa điểm 1. Đảo async/defer hoặc gán sai chỉ số: không
    tính ý đó.'
- id: E192
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: 'Một trang tin tức có **LCP chậm** (ảnh banner lớn), **INP kém** (bấm menu bị trễ vì bundle
    JS lớn) và

    **CLS cao** (quảng cáo và ảnh chèn vào làm chữ nhảy). Script analytics và `app.js` đều là thẻ `<script>`
    thường

    đặt trong `<head>`. Đội đang cân nhắc dùng CSR, SSR hoặc SSG.

    Hãy: đề xuất **ít nhất 3 kỹ thuật** có lý do để cải thiện; sửa cách nạp script; và so sánh CSR/SSR/SSG
    cho

    trang này.

    '
  answer_md: "**Kỹ thuật (nêu ít nhất 3, gắn với chỉ số):**\n- **Lazy loading** ảnh dưới màn hình đầu,\
    \ tối ưu/nén ảnh banner, dùng **CDN** và **caching** để giảm thời gian\n  tải: cải thiện **LCP**.\n\
    - **Code splitting** để tải ít JS lúc đầu và giảm công việc chặn luồng chính: cải thiện **INP**.\n\
    - Đặt **kích thước (width/height hoặc aspect-ratio)** cho ảnh và chỗ trống cho quảng cáo: giảm **CLS**.\n\
    \n**Script**: `analytics.js` dùng **async** (độc lập, thứ tự không quan trọng); `app.js` dùng **defer**\n\
    (chạy sau khi parse xong, giữ thứ tự), để script không chặn parse HTML.\n\n**CSR / SSR / SSG**: **CSR**\
    \ render ở client, lần đầu chậm vì phải tải JS, kém cho nội dung cần hiện sớm.\n**SSR** render HTML\
    \ ở server mỗi request: nội dung hiện sớm, tốn tài nguyên server. **SSG** dựng sẵn lúc build,\nphục\
    \ vụ qua CDN rất nhanh, hợp nội dung ít đổi; tin tức đổi thường xuyên cần SSR hoặc SSG kèm build lại/revalidate.\n\
    Nên đo bằng Core Web Vitals trước và sau khi thay đổi.\n"
  rubric_md: 'Đạt mức 3 khi: (a) nêu ít nhất 3 kỹ thuật đúng và gắn đúng chỉ số (CDN/caching/preload cho
    LCP và lazy-load ảnh dưới màn hình đầu — KHÔNG lazy-load ảnh LCP; code splitting cho INP; đặt kích
    thước/chỗ trống cho CLS); (b) sửa script đúng: async cho script độc lập, defer cho script cần thứ
    tự sau khi parse; (c) so sánh đúng CSR (render ở client), SSR (server mỗi request), SSG (dựng sẵn
    lúc build) và chọn có lý do. Đủ cả ba ý: bằng chứng điểm 3. Thiếu một ý, gắn sai chỉ số, hoặc đảo
    async/defer: chưa đạt mức 3.'
