- id: X440
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "def feasible(speed):\n    return sum((p + speed - 1) // speed for p in [4, 9, 6]) <= 6\n\nlo,\
    \ hi = 1, 9\nwhile lo < hi:\n    mid = (lo + hi) // 2\n    print(mid, feasible(mid))\n    if feasible(mid):\n\
    \        hi = mid\n    else:\n        lo = mid + 1\nprint(lo)"
  expected_output: '5 True

    3 False

    4 True

    4'
  answer_md: 'Với tốc độ 5: 1 + 2 + 2 = 5 giờ <= 6 nên `True`, đáp án <= 5 và `hi = 5`. Với 3: 2 + 3 +
    2 = 7 > 6 nên `False`, `lo = 4`. Với 4: 1 + 3 + 2 = 6 <= 6 nên `True`, `hi = 4`. Khi lo == hi == 4
    thì dừng: 4 là tốc độ nhỏ nhất thoả. Tính đơn điệu của `feasible` là điều cho phép nhị phân trên đáp
    án.'
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
