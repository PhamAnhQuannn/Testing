- id: X427
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "s = \"pwwkew\"\nlast = {}\nl = best = 0\nfor r, ch in enumerate(s):\n    if ch in last and last[ch]\
    \ >= l:\n        l = last[ch] + 1\n    last[ch] = r\n    best = max(best, r - l + 1)\n    print(l,\
    \ r, best)"
  expected_output: '0 0 1

    0 1 2

    2 2 2

    2 3 2

    2 4 3

    3 5 3'
  answer_md: Cửa sổ là `s[l..r]`. Khi `r = 2` gặp `w` thứ hai (đã thấy ở chỉ số 1 nằm trong cửa sổ) thì
    `l` nhảy tới 2; khi `r = 5` gặp `w` ở chỉ số 2 (vẫn nằm trong cửa sổ `l = 2`) nên `l` nhảy tới 3.
    `best` chỉ tăng khi cửa sổ hợp lệ dài hơn, cuối cùng là 3 (`kew`).
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
