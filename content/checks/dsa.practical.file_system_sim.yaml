- id: X523
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "path = \"/home//user/./docs/\"\nparts = [p for p in path.split(\"/\") if p]\nprint(parts)\ntree\
    \ = {}\nnode = tree\nfor p in parts:\n    node = node.setdefault(p, {})\nprint(tree)\nprint(len(parts),\
    \ \"/\".join(parts))"
  expected_output: '[''home'', ''user'', ''.'', ''docs'']

    {''home'': {''user'': {''.'': {''docs'': {}}}}}

    4 home/user/./docs'
  answer_md: Lọc `if p` bỏ các chuỗi rỗng do `/` đầu, `//` và `/` cuối, nhưng `.` vẫn là một phần tử nên
    có 4 phần. `setdefault` đi xuống và tạo dict lồng nhau theo từng tên, nên `tree` là chuỗi dict lồng
    4 cấp.
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
- id: X524
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Viết `class FileSystem` (kiểu LeetCode 588) với `ls(path)` (tên đã sort trong thư mục, hoặc
    `[tên file]` nếu path là file), `mkdir(path)` (tạo cả thư mục cha còn thiếu), `add_content_to_file(path,
    content)` (tạo file nếu chưa có rồi nối nội dung) và `read_content_from_file(path)`. Ví dụ: `mkdir("/a/b")`,
    `add_content_to_file("/a/b/f", "hi")` thì `ls("/a/b")` là `["f"]` và `read_content_from_file("/a/b/f")`
    là `"hi"`. Gợi ý: cây dict, thư mục là dict, file là str.

    '
  problem_id: check-x524-in-memory-file-system
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X525
  difficulty: 3
  type: write_code
  minutes: 10
  prompt_md: 'Viết `class FileStore` với `add_file(path, size)`, `total_size(dir_path)` (tổng size mọi
    file dưới thư mục, đệ quy; `/` là tất cả) và `find_by_min_size(dir_path, min_size)` (đường dẫn đầy
    đủ của file dưới `dir_path` có size >= min_size, sắp xếp tăng dần). Khớp thư mục theo segment: `/a`
    không bao gồm `/ab/f`. Ví dụ với `/a/x.txt` (10), `/a/b/y.txt` (30), `/c/z.txt` (5): `total_size("/a")`
    là `40` và `find_by_min_size("/a", 20)` là `["/a/b/y.txt"]`. Gợi ý: dict path -> size, lọc theo tiền
    tố `dir + "/"`.

    '
  problem_id: check-x525-file-search
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem
    gợi ý hoặc quá thời gian: tối đa điểm 2.'
