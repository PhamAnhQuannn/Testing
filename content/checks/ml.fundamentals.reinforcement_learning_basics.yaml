subtopic_id: ml.fundamentals.reinforcement_learning_basics
items:
- id: S370
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Kể tên các thành phần của vòng lặp học tăng cường (reinforcement learning) — **tác tử (agent),

    môi trường (environment), trạng thái (state), hành động (action), thưởng (reward), chính sách

    (policy)** — và nói một câu về **mục tiêu** của tác tử.

    '
  answer_md: '- **Tác tử (agent)**: người học / ra quyết định.

    - **Môi trường (environment)**: thế giới tác tử tác động vào, trả lại thưởng và trạng thái mới.

    - **Trạng thái (state)**: tình huống hiện tại tác tử thấy.

    - **Hành động (action)**: việc tác tử chọn làm.

    - **Thưởng (reward)**: điểm số môi trường trả lại sau hành động.

    - **Chính sách (policy)**: quy tắc chọn hành động từ trạng thái.


    **Mục tiêu**: chọn hành động sao cho **tối đa tổng thưởng về lâu dài** (có chiết khấu γ), chứ

    không chỉ thưởng của một bước.

    '
  rubric_md: 'Đúng khi nêu được cả 6 thành phần với mô tả ngắn hợp lý (agent/environment/state/action/reward/policy)
    VÀ mục tiêu là tối đa tổng thưởng (cumulative reward). Đủ 6 phần + mục tiêu: điểm 1. Thiếu từ 2 thành
    phần trở lên, hoặc nói mục tiêu là tối đa thưởng một bước: tối đa điểm 0.'
- id: S371
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Trên hành lang 4 ô (0, 1, 2, 3): vào ô 3 được thưởng +10 rồi dừng, mọi bước khác thưởng
    −1;

    α = 0,5, γ = 0,9, mọi Q khởi tạo 0, và ô 3 là ô kết thúc (Q của nó luôn 0). Dùng công thức

    Q(s, a) ← Q(s, a) + α·[r + γ·max Q(s'', ·) − Q(s, a)]:

    (1) tính **Q(2, phải)** khi tác tử đi từ ô 2 sang ô 3;

    (2) sau đó tính **Q(1, phải)** khi tác tử đi từ ô 1 sang ô 2;

    (3) giải thích một câu vì sao giá trị "lan ngược" từ ô 3 về các ô trước.

    '
  answer_md: '(1) s = 2, a = phải, r = +10, s'' = 3 (kết thúc nên max Q(3, ·) = 0):

    Q(2, phải) ← 0 + 0,5 × [10 + 0,9 × 0 − 0] = 0,5 × 10 = **5**.


    (2) s = 1, a = phải, r = −1, s'' = 2, và max Q(2, ·) = 5 (vừa tính ở trên):

    Q(1, phải) ← 0 + 0,5 × [−1 + 0,9 × 5 − 0] = 0,5 × [−1 + 4,5] = 0,5 × 3,5 = **1,75**.


    (3) Vì cập nhật của ô 1 **dùng giá trị của ô 2**, mà ô 2 lại vừa được nâng lên nhờ phần thưởng

    +10 ở ô 3; qua từng bước, phần thưởng ở đích được truyền ngược (qua số hạng γ·max Q(s'', ·))

    về các ô phía trước.

    '
  rubric_md: 'Đạt khi: (1) Q(2, phải) = 5 với phép tính đúng; (2) Q(1, phải) = 1,75 dùng max Q(2, ·) =
    5; (3) nêu được giá trị lan ngược vì cập nhật ô trước dựa trên giá trị ô sau. Cả hai số đúng + giải
    thích, trong time-box: bằng chứng điểm 2. Sai một trong hai phép tính Q (vd quên max Q(2, ·) = 5,
    hay nhầm r), hoặc không giải thích được lan ngược: tối đa điểm 1.'
- id: S372
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: '**(Phỏng vấn AI engineer)** Trình bày gọn mà đủ:

    (1) tính tay **2 bước cập nhật Q** trên hành lang 4 ô (vào ô 3: +10 rồi dừng, bước khác: −1;

    α = 0,5, γ = 0,9, Q khởi tạo 0): bước 2→3 rồi bước 1→2;

    (2) giải thích bằng lời **ý tưởng cập nhật Bellman** và **policy** là gì;

    (3) nói vì sao **alignment (RLHF)** dùng chính ý tưởng thưởng/phạt (reward model và policy là gì).

    '
  answer_md: "**(1) Hai bước Q:**\n- Bước 2→3: s = 2, a = phải, r = +10, s' = 3 (kết thúc, max Q(3, ·)\
    \ = 0):\n  Q(2, phải) ← 0 + 0,5 × [10 + 0,9 × 0 − 0] = **5**.\n- Bước 1→2: s = 1, a = phải, r = −1,\
    \ s' = 2, max Q(2, ·) = 5:\n  Q(1, phải) ← 0 + 0,5 × [−1 + 0,9 × 5 − 0] = 0,5 × 3,5 = **1,75**.\n\n\
    **(2) Bellman + policy:** Cập nhật Bellman kéo Q(s, a) hiện tại về gần \"mục tiêu mới\" = **thưởng\n\
    vừa nhận + γ × giá trị tốt nhất ở ô kế** (r + γ·max Q(s', ·)); phần trong ngoặc là sai số, α\nquyết\
    \ định chỉnh mạnh bao nhiêu. **Policy** là quy tắc chọn hành động từ trạng thái; khi đã có\nbảng Q,\
    \ policy tốt là ở mỗi ô chọn hành động có Q lớn nhất.\n\n**(3) Vì sao alignment dùng thưởng/phạt:**\
    \ Khó viết đáp án đúng cho mọi prompt, nhưng con người\ndễ nói câu nào tốt hơn. RLHF biến sở thích\
    \ đó thành thưởng: **reward model** (học từ cặp\nchosen/rejected) chấm điểm câu trả lời như một \"\
    môi trường\", còn **policy chính là LLM** đang\nđược chỉnh; thuật toán RL đẩy LLM sinh câu được điểm\
    \ cao hơn — đúng tinh thần \"được thưởng thì\nlàm nhiều hơn\".\n"
  rubric_md: 'Đạt mức phỏng vấn (điểm 3) khi đủ cả 3: (1) hai bước Q đúng số — Q(2, phải) = 5 và Q(1,
    phải) = 1,75 (dùng max Q(2, ·) = 5); (2) giải thích Bellman (kéo Q về r + γ·max Q(s'', ·)) VÀ policy
    (quy tắc chọn hành động; chọn Q lớn nhất) bằng lời; (3) nêu alignment/RLHF dùng reward model làm thưởng
    và policy là LLM. Đúng, trong time-box, tự giải thích rõ: bằng chứng điểm 3. Sai phép tính Q, hoặc
    thiếu hẳn phần Bellman/policy, hoặc không nối được sang RLHF: chưa đạt mức 3.'
