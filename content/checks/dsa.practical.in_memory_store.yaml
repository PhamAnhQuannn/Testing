  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "store = {}\n\ndef put(k, v, now, ttl):\n    store[k] = (v, now + ttl)\n\ndef get(k, now):\n \
    \   item = store.get(k)\n    if item is None:\n        return None\n    v, exp = item\n    if now\
    \ >= exp:\n        del store[k]\n        return None\n    return v\n\nput(\"a\", 1, 0, 5)\nput(\"\
    b\", 2, 0, 10)\nprint(get(\"a\", 4), get(\"a\", 5), get(\"b\", 5))\nprint(sorted(store))\nprint(get(\"\
    b\", 10), len(store))"
  expected_output: '1 None 2

    [''b'']

    None 0'
  answer_md: 'Key `a` hết hạn tại 0 + 5 = 5: ở now = 4 còn sống (1), ở now = 5 đã hết hạn nên `get` xoá
    nó và trả `None`; `b` ở now = 5 vẫn là 2. Sau đó chỉ còn `b` trong store. Ở now = 10 thì `b` (expiry
    10) cũng hết hạn: trả `None` và store rỗng (độ dài 0).'
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
