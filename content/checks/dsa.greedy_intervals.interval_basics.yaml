  code: "iv = [[1, 3], [2, 4], [6, 8]]\niv.sort()\nout = [iv[0][:]]\nfor s, e in iv[1:]:\n    if s <=\
    \ out[-1][1]:\n        out[-1][1] = max(out[-1][1], e)\n    else:\n        out.append([s, e])\nprint(out)\n\
    print(len(iv) - len(out))"
  expected_output: '[[1, 4], [6, 8]]

    1'
