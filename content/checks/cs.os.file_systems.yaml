- id: X867
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
  code: "block = 4\nsizes = [1, 4, 5, 9]\ntotal = 0\nfor s in sizes:\n    n = -(-s // block)\n    total\
    \ += n\n    print(n, n * block - s)\nprint(total)"
  expected_output: '1 3

    1 0

    2 3

    3 3

    7'
  answer_md: Size 1 cần 1 khối, thừa 3. Size 4 cần 1 khối, thừa 0. Size 5 cần 2 khối (8), thừa 3. Size
    9 cần 3 khối (12), thừa 3. Tổng số khối là 1 + 1 + 2 + 3 = 7.
  rubric_md: 'Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0.'
- id: X868
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết hàm `live_inodes(ops)` mô phỏng inode và hard link bằng đếm tham chiếu. `ops` là list
    các thao tác, mỗi thao tác là một list: `["create", name]` tạo inode mới với tên `name`, link count
    = 1; `["link", new_name, existing_name]` thêm hard link: `new_name` trỏ cùng inode với `existing_name`,
    link count của inode tăng 1 (nếu `existing_name` không tồn tại thì bỏ qua thao tác); `["unlink", name]`
    xóa tên `name`, link count của inode giảm 1 và inode bị giải phóng khi count về 0 (nếu `name` không
    tồn tại thì bỏ qua). Trả về **số inode còn sống** (link count > 0) sau tất cả thao tác; `ops` rỗng
    trả `0`. Ví dụ `live_inodes([["create","a"],["link","b","a"],["unlink","a"]])` trả `1` (file vẫn truy
    cập được qua hard link b), còn `live_inodes([["create","a"],["unlink","a"]])` trả `0`.

    '
  problem_id: check-x868-live-inodes
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X869
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    đọc qua hard link vẫn được còn soft link thì không sau khi xóa a (khái niệm gì).
  code: "files = {}\nlinks = {}\ndata = {}\nsymlinks = {}\n\n\ndef create(name, text):\n    ino = len(data)\n\
    \    files[name] = ino\n    links[ino] = 1\n    data[ino] = text\n\n\ndef hard(new, old):\n    ino\
    \ = files[old]\n    files[new] = ino\n    links[ino] += 1\n\n\ndef soft(new, target):\n    symlinks[new]\
    \ = target\n\n\ndef remove(name):\n    ino = files.pop(name)\n    links[ino] -= 1\n    if links[ino]\
    \ == 0:\n        del data[ino]\n\n\ndef read(name):\n    if name in symlinks:\n        name = symlinks[name]\n\
    \    if name in files:\n        return data[files[name]]\n    return \"DANGLING\"\n\n\ncreate(\"a\"\
    , \"hello\")\nhard(\"b\", \"a\")\nsoft(\"s\", \"a\")\nprint(read(\"b\"), read(\"s\"))\nremove(\"a\"\
    )\nprint(read(\"b\"), read(\"s\"))\nremove(\"b\")\nprint(len(data), links)"
  expected_output: 'hello hello

    hello DANGLING

    0 {0: 0}'
  answer_md: 'Sau create, hard, soft: a và b cùng inode 0 (links = 2), s là chuỗi trỏ tới tên a. Dòng
    1: cả hai đọc ra hello. remove(a) giảm links còn 1, inode 0 vẫn sống nên đọc b ra hello; nhưng s chỉ
    lưu đường dẫn a, tên a không còn trong directory nên trả DANGLING. remove(b) đưa links về 0, data[0]
    bị xóa: len(data) = 0 và links = {0: 0}. Hard link là tên ngang hàng cùng inode (đếm tham chiếu),
    soft link chỉ là đường dẫn nên có thể dangling.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng: hard link tăng link count của inode nên dữ liệu
    sống đến khi count = 0; soft link chỉ chứa đường dẫn nên thành dangling link khi đích bị xóa. Đúng:
    bằng chứng điểm 3; sai: tối đa điểm 2.'
