subtopic_id: cs.databases.locking_mvcc
items:
- id: X810
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
  code: "versions = [(5, 50), (15, 150), (25, 250)]\n\n\ndef read(ts):\n    best = None\n    for t, v\
    \ in versions:\n        if t <= ts:\n            best = v\n    return best\n\n\nprint(read(4))\nprint(read(5))\n\
    print(read(20))\nprint(read(99))\nversions.append((30, 300))\nprint(read(26))\nprint(read(30))"
  expected_output: 'None

    50

    150

    250

    250

    300'
  answer_md: '`read(ts)` trả giá trị của version có commit_ts lớn nhất mà vẫn <= ts. ts = 4: chưa có version
    nào nên None. ts = 5: version @5 cho 50 (so sánh <=, không phải <). ts = 20: version @15 cho 150.
    ts = 99: version @25 cho 250. Sau khi thêm version @30, ts = 26 vẫn chỉ thấy @25 (250) vì @30 vô hình
    với snapshot 26; ts = 30 thấy 300.'
  rubric_md: 'Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0.'
- id: X811
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết hàm `snapshot_reads(versions, read_tss)` mô phỏng đọc snapshot MVCC của MỘT key. `versions`
    là list các cặp `[commit_ts, value]` (commit_ts số nguyên, tăng ngặt và không trùng; value là số nguyên)
    cho các version đã commit theo thời gian. `read_tss` là list các timestamp đọc. Với mỗi `ts`, trả
    về `value` của version có `commit_ts` LỚN NHẤT mà vẫn `<= ts`; nếu không có version nào như vậy thì
    trả `None`. Trả về list kết quả theo đúng thứ tự `read_tss` (rỗng thì `[]`). Ví dụ `versions = [[10,100],[20,200],[30,300]]`,
    `read_tss = [25,10,5,30]` cho `[200, 100, None, 300]`.

    '
  problem_id: check-x811-snapshot-reads
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X812
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    yêu cầu `"S"` thứ hai được cấp nhưng `"X"` thì không, dù cả hai đến khi đã có lock `"S"`.
  code: "def can_grant(held, req):\n    if req == \"X\":\n        return len(held) == 0\n    return \"\
    X\" not in held\n\n\nheld = []\nfor req in [\"S\", \"S\", \"X\", \"S\"]:\n    ok = can_grant(held,\
    \ req)\n    print(req, ok)\n    if ok:\n        held.append(req)\nprint(held)\nheld = [\"X\"]\nprint(can_grant(held,\
    \ \"S\"))\nheld.clear()\nprint(can_grant(held, \"X\"))"
  expected_output: 'S True

    S True

    X False

    S True

    [''S'', ''S'', ''S'']

    False

    True'
  answer_md: 'Hai yêu cầu S đầu được cấp vì shared tương thích với shared (held = [''S'', ''S'']). Yêu
    cầu X bị từ chối vì held không rỗng: exclusive xung đột với mọi lock; X không được cấp nên không thêm
    vào held, và yêu cầu S cuối vẫn được cấp (không có X nào đang giữ), held cuối là [''S'', ''S'', ''S''].
    Khi đang giữ X thì mọi yêu cầu, kể cả S, bị chặn (False). Sau khi nhả hết lock (clear), X được cấp
    (True).'
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng: shared chỉ tương thích với shared, exclusive cần
    không có lock nào khác đang giữ, và X bị từ chối không được thêm vào held. Đúng: bằng chứng điểm 3;
    sai: tối đa điểm 2.'
