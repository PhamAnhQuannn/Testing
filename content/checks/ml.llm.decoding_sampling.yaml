subtopic_id: ml.llm.decoding_sampling
items:
- id: S016
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Nói ngắn gọn: **greedy decoding** và **sampling** khác nhau ở chỗ nào, và **temperature**
    làm gì

    với phân phối softmax khi ta tăng hay giảm nó?

    '
  answer_md: '**Greedy** mỗi bước luôn chọn token có xác suất **cao nhất** (argmax) → ổn định, lặp lại
    được

    nhưng dễ lặp/nhàm. **Sampling** bốc token **theo** xác suất của nó → đa dạng hơn nhưng cùng

    prompt có thể ra câu khác nhau.

    **Temperature** chia logit cho T trước softmax: **T thấp (<1)** làm phân phối **nhọn** hơn (dồn

    xác suất vào token đầu, gần greedy, ổn định); **T cao (>1)** làm phân phối **phẳng** hơn (token

    hiếm có cơ hội hơn, đa dạng/liều hơn). Nó không thêm thông tin, chỉ chỉnh độ nhọn/phẳng.

    '
  rubric_md: 'Đúng ý: greedy = lấy token cao nhất/ổn định; sampling = bốc theo xác suất/đa dạng; temperature
    thấp → nhọn/ổn định, cao → phẳng/đa dạng. Nêu đủ: bằng chứng điểm 1. Thiếu vế temperature hoặc lẫn
    chiều nhọn/phẳng: tối đa điểm 0.'
- id: S017
  difficulty: 2
  type: concept
  minutes: 7
  prompt_md: 'Bạn đang gọi một LLM để **trích xuất `invoice_id` và `total` ra JSON** từ hoá đơn, và cần
    cùng

    một hoá đơn luôn cho cùng một kết quả để kiểm thử hồi quy. Hãy nêu: (1) nên đặt **temperature**

    cao hay thấp (hoặc greedy) và vì sao; (2) **top-p / top-k** đóng vai trò gì ở tác vụ này; (3) vì

    sao *không* nên dùng temperature cao ở đây.

    '
  answer_md: '(1) Đặt **temperature thấp (≈0) hoặc greedy**: tác vụ trích xuất cần **đúng và lặp lại được**,

    không cần đa dạng; temperature thấp dồn xác suất vào token đúng nhất và cho đầu ra ổn định giữa

    các lần chạy.

    (2) **Top-p/top-k** ở đây là **lưới an toàn** cắt phần đuôi xác suất thấp để model không bốc

    trúng token rác; với temperature ≈ 0 ảnh hưởng của chúng nhỏ, nên để hẹp hoặc mặc định và chỉ

    chỉnh **một** núm để dễ suy luận.

    (3) Temperature cao làm phân phối **phẳng**, đầu ra **dao động** giữa các lần gọi → phá tính lặp

    lại, dễ sinh JSON sai cấu trúc hoặc chọn nhầm trường; đa dạng là *hại* cho trích xuất.

    '
  rubric_md: 'Đạt khi nêu đúng cả 3 ý: chọn temperature thấp/greedy vì cần đúng & lặp lại được; top-p/top-k
    là lưới an toàn chặn token rác (không cần đa dạng); temperature cao gây dao động/phá tái lập. Đúng,
    trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu lý do ''cần lặp lại được'' hoặc nói nên
    dùng temperature cao: tối đa điểm 1.'
- id: S018
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: 'Ở mức phỏng vấn, hãy trình bày trọn vẹn: (1) **temperature**, **top-k** và **top-p (nucleus)**

    mỗi cái làm gì với bước chọn token (tách rõ ''định hình phân phối'' với ''cắt tập token''), và vì

    sao top-p thường được ưa hơn top-k; (2) chọn tham số decoding cho **hai** tác vụ trái nhau —

    sinh code và viết truyện sáng tạo; (3) vì sao gọi API với **temperature 0** hai lần vẫn có thể

    ra hai câu hơi khác, dù về lý thuyết đó là greedy.

    '
  answer_md: '(1) **Temperature** chia logit cho T rồi softmax → **định hình lại phân phối**: T thấp làm
    nhọn

    (ổn định, gần greedy), T cao làm phẳng (đa dạng). **Top-k** giữ **k** token xác suất cao nhất

    rồi chuẩn hoá lại; **top-p (nucleus)** giữ **nhóm nhỏ nhất có xác suất cộng dồn ≥ p** rồi chuẩn

    hoá lại — cả hai **cắt tập token** (bỏ đuôi), không đổi hình phân phối. Top-p được ưa hơn vì số

    token giữ lại **tự co giãn** theo độ chắc chắn (model chắc → nhóm nhỏ, model phân vân → nhóm

    lớn), trong khi k của top-k cố định nên lúc quá rộng lúc quá hẹp.

    (2) **Sinh code**: cần đúng và lặp lại được → **temperature thấp (0–0,2) hoặc greedy**, top-p

    hẹp/mặc định. **Viết truyện sáng tạo**: cần đa dạng → **temperature cao hơn (0,7–1,0+)** kèm

    **top-p ~0,9–0,95** để đa dạng mà vẫn chặn token vô nghĩa. Nên chỉnh một núm mỗi lần để dễ suy

    luận.

    (3) T = 0 là greedy trên lý thuyết, nhưng thực tế không **bit-for-bit** vì: **số thực dấu phẩy

    động không kết hợp được** — trên GPU thứ tự cộng/reduction giữa nhiều luồng có thể đổi giữa các

    lần chạy nên logit lệch ở chữ số cuối; **batching/hạ tầng không tất định** — request bị gộp lô

    khác nhau, kernel/phiên bản model phục vụ khác nhau làm phép tính đi đường hơi khác. Khi hai

    token xác suất **sát nhau**, một lệch nhỏ đủ **lật argmax**; chọn khác một token thì ngữ cảnh

    lệch và câu sau có thể khác hẳn. Đặt seed và cố định phiên bản model giúp ổn định hơn nhưng không

    bảo đảm tuyệt đối trên hạ tầng dùng chung.

    '
  rubric_md: 'Đạt (mức phỏng vấn) khi: (1) tách đúng temperature = định hình phân phối với top-k/top-p
    = cắt tập token, định nghĩa đúng top-k (k token đầu) và top-p (nhóm cộng dồn ≥ p) và giải thích top-p
    tự co giãn nên ưa hơn; (2) chọn đúng cho cả hai tác vụ (code → thấp/greedy; sáng tạo → cao + top-p
    ~0,9); (3) giải thích đúng temp 0 không bit-for-bit bằng floating point không kết hợp + batching/thứ
    tự reduction trên GPU, và việc lệch nhỏ lật argmax khi token sát nhau. Đúng, trong time-box, tự giải
    thích rõ: bằng chứng điểm 3. Sót một trong ba phần, hoặc giải thích temp 0 chỉ nói ''ngẫu nhiên''
    mà không nêu floating point/batching: chưa đạt mức 3.'
