- id: X573
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Giải thích 1 câu vì sao.
  code: "class Dog:\n    def speak(self):\n        return \"woof\"\n\n\nclass Cat:\n    def speak(self):\n\
    \        return \"meow\"\n\n\nPETS = {\"dog\": Dog, \"cat\": Cat}\n\n\ndef make_pet(kind):\n    return\
    \ PETS[kind]()\n\n\npet = make_pet(\"cat\")\nprint(pet.speak())\nprint(type(pet).__name__)"
  expected_output: 'meow

    Cat'
  answer_md: '`make_pet("cat")` tra class `Cat` trong dict rồi gọi `()` tạo object; `speak()` trả `meow`
    và tên class là `Cat`. Đó là Simple Factory dùng dict.'
  rubric_md: 'Output khớp VÀ nêu factory tra class trong dict rồi tạo object. Đúng: bằng chứng điểm 1;
    sai: tối đa điểm 0.'
- id: X574
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Viết hàm `make_message(kind, text)` theo Simple Factory dùng dict các callable (không dùng
    chuỗi if/elif dài). `kind` là `"email"`, `"sms"` hoặc `"push"`, mỗi loại ứng với một class formatter,
    trả về `"EMAIL: <text>"`, `"SMS: <text>"`, `"PUSH: <text>"`. `kind` lạ trả `"RAW: <text>"`. Ví dụ
    `make_message("email", "hi")` là `"EMAIL: hi"`.

    '
  problem_id: check-x574-notification-factory
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X575
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    bản sao nông làm đổi bản gốc còn bản sao sâu thì không (Prototype).
  code: "import copy\n\n\nclass Doc:\n    def __init__(self, title, tags):\n        self.title = title\n\
    \        self.tags = tags\n\n\norig = Doc(\"a\", [\"x\"])\nshallow = copy.copy(orig)\ndeep = copy.deepcopy(orig)\n\
    shallow.title = \"b\"\nshallow.tags.append(\"y\")\ndeep.tags.append(\"z\")\nprint(orig.title, orig.tags)\n\
    print(shallow.title, shallow.tags)\nprint(deep.title, deep.tags)\nprint(orig.tags is shallow.tags,\
    \ orig.tags is deep.tags)"
  expected_output: 'a [''x'', ''y'']

    b [''x'', ''y'']

    a [''x'', ''z'']

    True False'
  answer_md: '`copy.copy` chép object ngoài nhưng `tags` vẫn là cùng một list: gán `title` chỉ đổi bản
    sao, còn `append("y")` đổi cả bản gốc. `deepcopy` chép cả list nên `append("z")` chỉ ảnh hưởng bản
    sao sâu.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng dùng chung list ở shallow copy. Đúng: bằng chứng
    điểm 3; sai: tối đa điểm 2.'
