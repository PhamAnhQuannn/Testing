- id: X594
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Giải thích 1 câu vì sao.
  code: "class Task:\n    def __init__(self, name):\n        self.name = name\n        self.done = False\n\
    \n\nclass Project:\n    def __init__(self, name):\n        self.name = name\n        self.tasks =\
    \ []\n\n    def add(self, name):\n        self.tasks.append(Task(name))\n\n    def complete(self,\
    \ name):\n        for t in self.tasks:\n            if t.name == name:\n                t.done = True\n\
    \n    def pending(self):\n        return sum(1 for t in self.tasks if not t.done)\n\n\np = Project(\"\
    web\")\np.add(\"a\")\np.add(\"b\")\np.add(\"c\")\np.complete(\"b\")\nprint(p.pending())\np.complete(\"\
    a\")\np.complete(\"zzz\")\nprint(p.pending())\nprint(len(p.tasks))"
  expected_output: '2

    1

    3'
  answer_md: Thêm a, b, c (3 việc chưa xong); hoàn thành b nên còn 2. Hoàn thành a còn 1; `complete("zzz")`
    không có việc đó nên không đổi gì. `Project` chứa (has-a) 3 `Task` nên `len(p.tasks)` là 3.
  rubric_md: 'Output khớp VÀ nêu Project chứa các Task (has-a) và giữ hành vi complete/pending. Đúng:
    bằng chứng điểm 1; sai: tối đa điểm 0.'
- id: X595
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Phân tích danh từ - động từ: "dự án có nhiều việc, thêm việc và hoàn thành việc". Viết `class
    Project` (has-a các Task, composition): constructor `Project(name)`; `add_task(name)` thêm việc chưa
    xong (nếu đã có việc cùng tên thì bỏ qua); `complete(name)` đánh dấu việc đã xong (không làm gì nếu
    không có hoặc đã xong); `pending()` trả số (int) việc chưa xong; `done_names()` trả list tên các việc
    đã xong, sắp xếp tăng dần. Ví dụ thêm a, b rồi hoàn thành a thì `pending()` là 1 và `done_names()`
    là `["a"]`.

    '
  problem_id: check-x595-project-tasks
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X596
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    dùng enum cho trạng thái thay vì chuỗi và hành vi `next` nằm ở đâu (rich model).
  code: "from enum import Enum\n\n\nclass Status(Enum):\n    TODO = \"todo\"\n    DOING = \"doing\"\n\
    \    DONE = \"done\"\n\n    def next(self):\n        order = [Status.TODO, Status.DOING, Status.DONE]\n\
    \        return order[min(order.index(self) + 1, 2)]\n\n\nclass Task:\n    def __init__(self, name):\n\
    \        self.name = name\n        self.status = Status.TODO\n\n    def advance(self):\n        self.status\
    \ = self.status.next()\n\n\nclass Board:\n    def __init__(self):\n        self.tasks = []\n\n   \
    \ def add(self, name):\n        t = Task(name)\n        self.tasks.append(t)\n        return t\n\n\
    \    def count(self, status):\n        return sum(1 for t in self.tasks if t.status == status)\n\n\
    \nb = Board()\nt1 = b.add(\"x\")\nt2 = b.add(\"y\")\nb.add(\"z\")\nfor _ in range(3):\n    t1.advance()\n\
    t2.advance()\nprint(t1.status.name)\nprint(b.count(Status.DONE), b.count(Status.TODO))\nprint(Status(\"\
    doing\") is t2.status)\nprint(t1.status == Status.TODO)"
  expected_output: 'DONE

    1 1

    True

    False'
  answer_md: 'Task x advance 3 lần: TODO, DOING, DONE, rồi kẹt ở DONE nên `.name` in `DONE`. Task y advance
    1 lần (DOING), z còn TODO nên có 1 DONE và 1 TODO. `Status("doing")` trả đúng member DOING (enum là
    singleton) nên `is` cho True. x đang DONE nên `== Status.TODO` là False. `next` nằm trong enum (hành
    vi đi cùng dữ liệu).'
  rubric_md: 'Output khớp từng dòng VÀ nêu lợi ích enum (tập giá trị cố định, không gõ sai) hoặc hành
    vi nằm trong class. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2.'
