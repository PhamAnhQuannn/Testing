- id: Q162
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Mô phỏng một trò chơi theo lượt: bạn tách code thành những phần nào để dễ test và dễ sửa
    luật?'
  answer_md: Trạng thái (state) tách khỏi luật (rule functions) và vòng lặp điều khiển; hàm thuần cho
    "bước tiếp theo"; seed ngẫu nhiên cố định để test lặp lại.
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 1; sai:
    tối đa điểm 0.'
- id: Q163
  difficulty: 2
  type: write_code
  minutes: 10
  prompt_md: Viết `life_step(board)` một bước Game of Life (ô sống có 2-3 hàng xóm sống thì sống tiếp,
    ô chết có đúng 3 thì sống), trả bảng mới.
  problem_id: check-q163
  rubric_md: 'Chạy driver của đề: output khớp expected_output. Đúng không gợi ý trong time-box (10 phút)
    và độ phức tạp hợp lý: bằng chứng điểm 2. Đúng nhưng phải xem 1 gợi ý hoặc quá time-box: điểm 1. Sai/không
    chạy: tối đa điểm 1.'
- id: X547
  difficulty: 3
  type: write_code
  minutes: 10
  prompt_md: 'Viết `life_after(board, steps)`: `board` là ma trận 0/1 (1 là ô sống), ô ngoài biên coi
    như chết. Mỗi thế hệ, ô sống có 2 hoặc 3 hàng xóm sống (trong 8 ô quanh nó) thì sống tiếp, ngược lại
    chết; ô chết có đúng 3 hàng xóm sống thì thành sống; mọi ô cập nhật đồng thời từ bảng cũ. Trả về bảng
    sau `steps` (>= 0) thế hệ; `steps == 0` trả bản sao không đổi. `life_after([[0, 1, 0], [0, 1, 0],
    [0, 1, 0]], 1)` là `[[0, 0, 0], [1, 1, 1], [0, 0, 0]]`. Gợi ý: double buffer, mỗi thế hệ tạo bảng
    mới.

    '
  problem_id: check-x547-life-after
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem
    gợi ý hoặc quá thời gian: tối đa điểm 2.'
