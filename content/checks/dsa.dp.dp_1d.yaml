items:
- id: X471
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "nums = [2, 7, 9, 3, 1]\ntake, skip = 0, 0\nfor x in nums:\n    take, skip = skip + x, max(take,\
    \ skip)\n    print(take, skip)\nprint(max(take, skip))"
  expected_output: '2 0

    7 2

    11 7

    10 11

    12 11

    12'
  answer_md: Mỗi nhà, `take` là tổng tốt nhất khi lấy nhà đó (bằng `skip` cũ cộng `x`) và `skip` là tổng
    tốt nhất khi bỏ nhà đó (bằng max của hai giá trị cũ); cả hai được gán đồng thời nên dùng giá trị cũ.
    Sau nhà cuối `take = 12`, `skip = 11`, đáp án là `max = 12` (lấy các nhà 2, 9, 1).
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
- id: X472
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Viết `rob(nums)`: `nums[i]` là số tiền ở nhà `i`, không được lấy hai nhà kề nhau. Trả về
    tổng tiền lớn nhất (danh sách rỗng cho `0`). `rob([2, 7, 9, 3, 1])` là `12`. Gợi ý: `dp[i] = max(dp[i-1],
    dp[i-2] + nums[i])`, dùng hai biến cuốn chiếu.

    '
  problem_id: check-x472-house-robber
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
