- id: X448
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "from collections import deque\n\nadj = [[1, 4], [0, 2], [1], [4], [0, 3]]\n\ndef dfs(u, seen,\
    \ out):\n    seen.add(u)\n    out.append(u)\n    for v in adj[u]:\n        if v not in seen:\n   \
    \         dfs(v, seen, out)\n    return out\n\ndef bfs(s):\n    seen = {s}\n    q = deque([s])\n \
    \   out = []\n    while q:\n        u = q.popleft()\n        out.append(u)\n        for v in adj[u]:\n\
    \            if v not in seen:\n                seen.add(v)\n                q.append(v)\n    return\
    \ out\n\nprint(*dfs(0, set(), []))\nprint(*bfs(0))"
  expected_output: '0 1 2 4 3

    0 1 4 2 3'
  answer_md: DFS từ 0 đi sang 1 rồi xuống 2 (hết đường), quay lại 0 mới sang 4 rồi 3, nên `0 1 2 4 3`;
    BFS thăm lớp {1, 4} trước rồi mới tới 2 và 3, nên `0 1 4 2 3`.
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
