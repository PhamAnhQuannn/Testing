items:
- id: X588
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Giải thích 1 câu vì sao.
  code: "class Handler:\n    def __init__(self, mg, tiep=None):\n        self.mg = mg\n        self.tiep\
    \ = tiep\n\n    def phat(self, tien):\n        so_to = tien // self.mg\n        if so_to > 0:\n  \
    \          print(f\"{self.mg} x{so_to}\")\n        du = tien % self.mg\n        if du and self.tiep:\n\
    \            self.tiep.phat(du)\n\n\nchuoi = Handler(500, Handler(200, Handler(100, Handler(50))))\n\
    chuoi.phat(2350)"
  expected_output: '500 x4

    200 x1

    100 x1

    50 x1'
  answer_md: 500 phát 4 tờ (2000), dư 350; 200 phát 1 tờ, dư 150; 100 phát 1 tờ, dư 50; 50 phát 1 tờ,
    dư 0. Mỗi handler xử lý phần của mình rồi chuyển phần dư cho `self.tiep` (Chain of Responsibility).
  rubric_md: 'Output khớp VÀ nêu mỗi handler chuyển phần dư cho handler kế. Đúng: bằng chứng điểm 1; sai:
    tối đa điểm 0.'
- id: X589
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Viết hàm `dispense(amount)` theo Chain of Responsibility (tham lam): mệnh giá `[500, 200,
    100, 50]` (nghìn). Mỗi mệnh giá lấy nhiều tờ nhất có thể rồi chuyển phần dư cho mệnh giá kế. Trả list
    các cặp `[mệnh giá, số tờ]` theo mệnh giá giảm dần, chỉ gồm số tờ > 0. Nếu sau cùng còn dư (nhỏ hơn
    50 hoặc không chia hết cho 50) thì không nhả được, trả `[]`; `amount = 0` cũng trả `[]`. Ví dụ `dispense(1300)`
    là `[[500, 2], [200, 1], [100, 1]]`, `dispense(30)` là `[]`.

    '
  problem_id: check-x589-atm-dispense
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X590
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    một dòng log đi qua nhiều handler (Chain of Responsibility, bộ log theo mức).
  code: "class Logger:\n    def __init__(self, level, name, tiep=None):\n        self.level = level\n\
    \        self.name = name\n        self.tiep = tiep\n\n    def log(self, lvl, msg):\n        if lvl\
    \ >= self.level:\n            print(f\"{self.name}: {msg}\")\n        if self.tiep:\n            self.tiep.log(lvl,\
    \ msg)\n\n\nchain = Logger(1, \"debug\", Logger(2, \"info\", Logger(3, \"error\")))\nchain.log(2,\
    \ \"disk\")\nchain.log(3, \"crash\")\nchain.log(1, \"boot\")"
  expected_output: 'debug: disk

    info: disk

    debug: crash

    info: crash

    error: crash

    debug: boot'
  answer_md: Mỗi handler ghi nếu mức dòng log `lvl` >= mức của nó, rồi luôn chuyển tiếp cho `self.tiep`.
    Mức 2 qua debug và info; mức 3 qua cả ba; mức 1 chỉ debug ghi (info, error bỏ qua vì 1 < 2, 1 < 3).
  rubric_md: 'Output khớp từng dòng VÀ giải thích handler ghi theo mức rồi vẫn chuyển tiếp. Đúng: bằng
    chứng điểm 3; sai: tối đa điểm 2.'
