subtopic_id: sd.api.idempotency
items:
- id: S103
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Nói ngắn gọn: **idempotency** nghĩa là gì, và trong các method HTTP thì cái nào idempotent
    tự

    nhiên còn cái nào thì không?

    '
  answer_md: '**Idempotency** là tính chất: một thao tác làm **một lần hay nhiều lần** đều cho **cùng
    một

    kết quả** (same effect), nên gửi lại không gây hại thêm. Trong HTTP, **GET** (chỉ đọc),

    **PUT** (ghi đè về một trạng thái cho trước) và **DELETE** (xoá) là idempotent tự nhiên; còn

    **POST** (tạo mới / thực hiện một hành động như trừ tiền) **không** idempotent theo mặc định,

    nên retry POST có thể làm hai lần.

    '
  rubric_md: 'Nêu đúng định nghĩa (làm nhiều lần = cùng kết quả) và phân loại đúng: GET/PUT/DELETE idempotent,
    POST không. Đúng cả hai ý: bằng chứng điểm 1; thiếu định nghĩa hoặc phân loại sai POST: tối đa điểm
    0.'
- id: S104
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Một endpoint POST /charges trừ tiền thẻ. Client gọi một lần rồi **timeout**, không nhận
    được

    response và **không biết** tiền đã bị trừ hay chưa. (1) Client nên làm gì tiếp theo và vì sao

    an toàn? (2) Nhờ cơ chế nào ở server mà việc đó không trừ tiền hai lần? (3) Server cần **lưu**

    những gì để retry trả lại đúng kết quả?

    '
  answer_md: '(1) Client nên **retry với đúng idempotency key cũ** (không đổi mã mới). An toàn vì server

    dùng mã để nhận ra đây là **cùng một ý định**: nếu lần trước đã trừ tiền (landed) thì trả lại

    kết quả cũ, nếu chưa thì thực hiện **đúng một lần**.

    (2) Nhờ mẫu **idempotency key**: server lưu mã đã xử lý và **đăng ký mã một cách nguyên tử**

    (unique constraint hoặc lock) trước khi trừ tiền, nên một mã chỉ "ăn" đúng một lần dù có bao

    nhiêu request trùng.

    (3) Server lưu **mã kèm response đã trả** (và trạng thái giao dịch), để lần retry trả lại y hệt

    kết quả cũ; thường kèm một **TTL/expiry** để dọn bản ghi mã sau một thời gian.

    '
  rubric_md: 'Đạt khi nêu đúng cả 3 ý: retry với đúng mã cũ (và vì sao an toàn: landed trả cũ / chưa landed
    làm một lần), cơ chế idempotency key đăng ký mã nguyên tử, lưu mã kèm response. Đúng, trong time-box,
    tự giải thích được: bằng chứng điểm 2. Đổi mã mới khi retry, hoặc không nói lưu kết quả cũ: tối đa
    điểm 1.'
- id: S105
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: 'Hãy **thiết kế một idempotency key cho endpoint thanh toán** POST /charges và trình bày
    server

    xử lý thế nào cho ba trường hợp: (a) lần đầu bình thường, (b) **timeout không rõ kết quả** rồi

    client retry, (c) **hai request cùng mã đến đồng thời**. Nói rõ mã do ai sinh và gắn với cái

    gì, server lưu gì, và vì sao mỗi trường hợp không trừ tiền hai lần.

    '
  answer_md: '**Thiết kế mã.** Mã do **client sinh** (ví dụ một UUID) gắn với **một ý định trả tiền cụ
    thể**

    (lần trả cho đơn #42 này), gửi trong header Idempotency-Key. Một lần trả *mới* mới có mã mới;

    một lần *retry của cùng ý định* dùng lại đúng mã cũ. Server có một bảng mã ->

    (trạng thái, response đã trả) với **TTL** (ví dụ 24 giờ).


    (a) **Lần đầu**: server **đăng ký mã nguyên tử** (INSERT với unique constraint, hoặc chiếm lock

    theo mã) rồi mới trừ tiền; xong thì **lưu response cùng mã** và trả về. Mã mới nên thực hiện

    đúng một lần.


    (b) **Timeout không rõ kết quả**: client timeout, không biết đã trừ tiền chưa, nên **retry với

    đúng mã cũ**. Server thấy mã **đã tồn tại**: nếu đã xong thì **trả thẳng response đã lưu**

    (không trừ lần nữa); nếu lần trước thực ra chưa landed thì giờ mới thực hiện đúng một lần.

    Dù nhánh nào cũng **đúng một lần**.


    (c) **Hai request cùng mã đồng thời**: nhờ bước đăng ký mã là **nguyên tử**, chỉ **một** request

    INSERT/chiếm lock thành công và trừ tiền; request kia bị unique constraint từ chối (hoặc chờ

    lock) rồi **đọc lại và trả về kết quả** của cái thắng. Không có khe hở để cả hai cùng thực hiện.


    Bổ sung cho tiền: cuối ngày **đối soát (reconciliation)** với cổng thanh toán (PSP) để bắt các

    ca lệch còn sót.

    '
  rubric_md: 'Đạt (mức phỏng vấn, đúng level-3 bar) khi: mã do client sinh và gắn với một ý định (không
    phải server tự sinh mỗi request); xử lý đúng cả ba ca a/b/c; đặc biệt ca (b) nêu rõ retry đúng mã
    cũ an toàn vì đã landed trả kết quả cũ / chưa landed làm một lần, và ca (c) nêu đăng ký mã nguyên
    tử (unique constraint hoặc lock) để chỉ một cái thắng. Đúng, trong time-box, tự giải thích rõ ràng:
    bằng chứng điểm 3. Thiếu xử lý ca timeout-unknown-result hoặc không chặn được hai request trùng đồng
    thời: chưa đạt mức 3.'
