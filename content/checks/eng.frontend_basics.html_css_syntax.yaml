subtopic_id: eng.frontend_basics.html_css_syntax
items:
- id: E178
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: '**HTML** và **CSS** khác nhau thế nào? **Thuộc tính** (attribute) trong HTML là gì? Cho
    ví dụ.

    '
  answer_md: "- **HTML** mô tả **cấu trúc và nội dung** trang bằng các thẻ mở/đóng lồng nhau (tiêu đề,\
    \ đoạn, danh sách, ảnh, form).\n- **CSS** mô tả **cách hiển thị** (màu, cỡ chữ, khoảng cách, bố cục)\
    \ bằng luật `selector { property: value; }`.\n- **Thuộc tính** là thông tin thêm nằm trong **thẻ mở**,\
    \ dạng `tên=\"giá trị\"`, ví dụ `<a href=\"https://x.com\" class=\"nut\">`\n  hay `<img src=\"a.png\"\
    \ alt=\"mô tả\">`; `id` là tên duy nhất, `class` là nhãn dùng chung.\n"
  rubric_md: 'Đạt khi nêu đúng: HTML = cấu trúc/nội dung (thẻ), CSS = trình bày (luật selector/property/value);
    thuộc tính nằm trong thẻ mở dạng tên=giá trị kèm một ví dụ đúng (href, src, alt, id, class). Đủ hai
    ý: bằng chứng điểm 1; lẫn vai trò HTML và CSS: điểm 0.'
- id: E179
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Trả lời ba phần:

    1. Viết luật CSS đổi màu chữ thành xanh cho mọi phần tử có class `canh-bao`, và nêu một cách nối file
    `style.css` vào trang HTML.

    2. Một hộp `.hop` có `width: 100px; padding: 10px; border: 2px solid; margin: 5px` (mặc định `content-box`).
    Tính bề rộng hộp (content + padding + border) và bề rộng chiếm chỗ khi cộng cả margin.

    3. Cần xếp ba mục của `<ul class="menu">` thành một hàng ngang: viết CSS tối thiểu và nói `justify-content`,
    `align-items` căn theo chiều nào.

    '
  answer_md: "1. `.canh-bao { color: blue; }` (selector class dùng dấu chấm). Nối file ngoài bằng\n  \
    \ `<link rel=\"stylesheet\" href=\"style.css\">` trong `<head>` (hoặc viết trong thẻ `<style>`).\n\
    2. Bề rộng hộp = 100 + 10*2 + 2*2 = **124px**; chiếm chỗ cả margin = 124 + 5*2 = **134px**.\n3. `.menu\
    \ { display: flex; }` (có thể thêm `gap`, `list-style: none`). `justify-content` căn theo **chiều\
    \ hàng**\n   (trục chính), `align-items` căn theo **chiều còn lại** (trục phụ).\n"
  rubric_md: 'Đạt khi đúng cả ba phần: (1) luật .canh-bao có color + cách nối đúng (link rel stylesheet
    hoặc thẻ style); (2) 124px và 134px; (3) display: flex trên cha, justify-content theo chiều hàng,
    align-items theo chiều còn lại. Đủ ba: bằng chứng điểm 2. Đúng hai: tối đa điểm 1. Sai (ví dụ dùng
    # cho class, quên cộng border/padding, đặt display:flex lên các li): không tính phần đó.'
- id: E180
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: 'Bạn cần dựng trang đăng ký đơn giản: có tiêu đề, danh sách 3 lợi ích, một ảnh logo và form
    gồm email, mật khẩu, nút gửi. Form được căn giữa

    và các lợi ích hiển thị thành hàng. Hãy mô tả bạn sẽ viết **HTML** gì (thẻ và thuộc tính chính), **CSS**
    gì (selector, box model, flex),

    cách nối CSS vào trang, và giải thích vì sao nên dùng `label` cho ô nhập cũng như vì sao ảnh cần `alt`.

    '
  answer_md: '**HTML**: `<h1>` cho tiêu đề; `<ul>` với ba `<li>` cho lợi ích (đặt `class="loi-ich"`);
    `<img src="logo.png" alt="Logo">`;

    `<form>` chứa `<label>Email <input type="email"></label>`, `<label>Mật khẩu <input type="password"></label>`
    và

    `<button type="submit">Đăng ký</button>`.


    **CSS**: `.loi-ich { display: flex; gap: 16px; list-style: none; }` xếp các mục thành hàng; `form
    { max-width: 320px; margin: 0 auto; }`

    căn giữa theo chiều ngang (hoặc dùng flex với `justify-content: center` / `align-items: center` trên
    hộp cha);

    `input { padding: 8px; border: 1px solid gray; }` dùng box model (padding trong, border, margin ngoài);
    `button { background: ...; }`.


    **Nối CSS**: `<link rel="stylesheet" href="style.css">` trong `<head>` (hoặc thẻ `<style>`); tránh
    inline style cho cả trang vì khó bảo trì.


    **label và alt**: `label` gắn chữ cho ô nhập (bấm vào chữ là focus ô, người dùng đọc màn hình biết
    ô để làm gì).

    `alt` là mô tả thay thế khi ảnh không tải được và cho người dùng đọc màn hình.

    '
  rubric_md: 'Đạt mức 3 khi: (a) HTML dùng đúng thẻ và thuộc tính chính (h1, ul/li, img src+alt, form
    với input type email/password, label, button); (b) CSS có selector class/thẻ hợp lý, nêu box model
    (padding/border/margin) và display:flex cho hàng, căn giữa bằng margin auto hoặc flex; (c) nối CSS
    đúng bằng link rel stylesheet hoặc style; (d) giải thích label gắn chữ cho ô nhập và alt là mô tả
    thay thế cho ảnh. Đủ cả bốn ý: bằng chứng điểm 3. Thiếu một ý hoặc sai cú pháp quan trọng (ví dụ dùng
    # cho class, thiếu src/alt): chưa đạt mức 3.'
