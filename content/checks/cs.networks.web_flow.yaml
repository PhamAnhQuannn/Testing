- id: X841
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết hàm `cache_decision(req_headers, resp_headers)` mô phỏng quyết định HTTP cache của
    trình duyệt. Cả hai tham số là dict ánh xạ tên header (str) sang giá trị (str). Quyết định theo thứ
    tự ưu tiên và trả về một chuỗi: (1) `resp_headers` có khóa `"no-store"` (bất kể giá trị) thì trả `"network"`;
    (2) nếu không, có khóa `"no-cache"` thì trả `"revalidate"`; (3) nếu không, có `"max-age"` trong `resp_headers`
    VÀ có `"age"` trong `req_headers` với `int(age) < int(max-age)` thì trả `"cache"`; (4) còn lại trả
    `"network"` (kể cả khi thiếu `age`, hoặc age bằng max-age). Ví dụ `cache_decision({"age": "10"}, {"max-age":
    "60"})` trả `"cache"`.

    '
  problem_id: check-x841-cache-decision
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X842
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    mỗi trường hợp ra kết quả đó (chú ý thứ tự ưu tiên).
  code: "def decide(req, resp):\n    if \"no-store\" in resp:\n        return \"network\"\n    if \"no-cache\"\
    \ in resp:\n        return \"revalidate\"\n    if \"max-age\" in resp and \"age\" in req and int(req[\"\
    age\"]) < int(resp[\"max-age\"]):\n        return \"cache\"\n    return \"network\"\n\n\ncases = [\n\
    \    ({\"age\": \"10\"}, {\"max-age\": \"60\"}),\n    ({\"age\": \"60\"}, {\"max-age\": \"60\"}),\n\
    \    ({\"age\": \"5\"}, {\"no-cache\": \"1\", \"max-age\": \"60\"}),\n    ({\"age\": \"5\"}, {\"no-store\"\
    : \"1\", \"no-cache\": \"1\"}),\n    ({}, {\"max-age\": \"60\"}),\n]\nfor req, resp in cases:\n  \
    \  print(decide(req, resp))\nprint(sum(decide(r, s) == \"network\" for r, s in cases))"
  expected_output: 'cache

    network

    revalidate

    network

    network

    3'
  answer_md: 'Ca 1: age 10 < 60 nên cache. Ca 2: age 60 không nhỏ hơn 60 (stale) nên network. Ca 3: no-cache
    được xét trước max-age nên revalidate dù còn fresh. Ca 4: no-store thắng no-cache nên network. Ca
    5: không có header age nên không chứng minh được fresh, network. Có 3 kết quả network (ca 2, 4, 5)
    nên dòng cuối là 3.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng: no-store ưu tiên cao nhất, rồi no-cache, rồi max-age
    với so sánh nghiêm ngặt, thiếu age thì network. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2.'
