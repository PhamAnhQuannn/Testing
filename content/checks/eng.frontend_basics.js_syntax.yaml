items:
- id: E181
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Trong JavaScript, **`let`** và **`const`** khác nhau thế nào? Vì sao nên dùng chúng thay
    cho `var`?

    '
  answer_md: '- **`let`**: khai báo biến có thể **gán lại** giá trị (ví dụ `let dem = 0; dem = dem + 1;`).

    - **`const`**: khai báo biến **không gán lại được** (gán lại sẽ báo lỗi); nên dùng mặc định khi giá
    trị không đổi.

    - Cả hai là cách khai báo hiện đại, thay cho **`var`** cũ (phạm vi và hành vi khó đoán hơn).

    '
  rubric_md: 'Đạt khi nêu đúng: let gán lại được, const không gán lại được, và cả hai thay cho var cũ.
    Đủ ý chính (phân biệt let/const đúng): bằng chứng điểm 1; nói ngược (const gán lại được) hoặc không
    phân biệt được: điểm 0.'
- id: E182
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Trả lời ba ý về JavaScript:

    1. Kết quả của `5 === "5"` và `5 == "5"` là gì? Giải thích khác nhau giữa `===` và `==`.

    2. Viết hàm `laChan(n)` kiểm tra số chẵn (tương tự Python `n % 2 == 0`) bằng JS theo hai cách: `function`
    thường và **arrow function**.

    3. Cho `const a = [3, 8, 1, 10];`, viết đoạn JS dùng `for-of` tính tổng các phần tử.

    '
  answer_md: "1. `5 === \"5\"` là **`false`**, `5 == \"5\"` là **`true`**. **`===`** so sánh cả giá trị\
    \ lẫn kiểu và\n   **không ép kiểu** (strict); **`==`** **ép kiểu** (loose) nên chuỗi \"5\" bị ép thành\
    \ số. Nên dùng `===`.\n2. ```js\n   function laChan(n) { return n % 2 === 0; }\n   const laChan2 =\
    \ (n) => n % 2 === 0;\n   ```\n3. ```js\n   let tong = 0;\n   for (const x of a) { tong += x; }  \
    \ // tong = 22\n   ```\n"
  rubric_md: 'Đạt khi đúng cả ba ý: (1) false và true, giải thích === không ép kiểu còn == ép kiểu; (2)
    hai cách viết hàm hợp lệ (function và arrow, có return hoặc return ngầm); (3) vòng for-of cộng dồn
    vào biến let. Đủ ba: bằng chứng điểm 2. Đúng hai: tối đa điểm 1. Nói ngược === và == : không tính
    ý (1).'
- id: E183
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: 'Trang HTML có `<button id="nut">Bấm</button>` và `<p id="so">0</p>`. Bạn muốn mỗi lần bấm
    nút thì số trong thẻ `<p>`

    tăng 1 và hiển thị dạng "Đã bấm N lần".

    Hãy: (a) nêu cách nạp file `app.js` vào trang; (b) viết đoạn JS (dùng `let`/`const`, `querySelector`,

    `addEventListener`, `textContent`, **template string**); (c) nếu thêm một điều kiện so sánh (ví dụ

    `dem === 10` để dừng), vì sao nên dùng `===` thay vì `==`; và nói `const` dùng ở chỗ nào, `let` dùng
    ở chỗ nào.

    '
  answer_md: "**(a)** Gắn `<script src=\"app.js\"></script>`, thường đặt **cuối thẻ body** để HTML tải\
    \ xong trước khi JS chọn phần tử\n(hoặc viết inline giữa `<script>...</script>`).\n\n**(b)**\n```js\n\
    let dem = 0;\nconst nut = document.querySelector(\"#nut\");\nconst so = document.querySelector(\"\
    #so\");\nnut.addEventListener(\"click\", () => {\n  dem++;\n  so.textContent = `Đã bấm ${dem} lần`;\n\
    });\n```\n\n**(c)** `const` cho `nut` và `so` (tham chiếu không đổi); `let` cho `dem` (được gán lại\
    \ mỗi lần bấm).\n`===` so sánh cả kiểu và không ép kiểu, nên `5 === \"5\"` là `false`, tránh kết quả\
    \ bất ngờ của `==`\n(`5 == \"5\"` là `true` do ép kiểu).\n"
  rubric_md: 'Đạt mức 3 khi: (a) script src (thường cuối body) hoặc inline; (b) code đúng: chọn bằng querySelector,
    addEventListener(''click'', ...), tăng biến đếm, đổi textContent, dùng template string; (c) const
    cho phần tử không đổi, let cho biến đếm; giải thích === không ép kiểu còn == ép kiểu. Đủ cả ba phần:
    bằng chứng điểm 3. Thiếu một phần hoặc nói ngược === và ==: chưa đạt mức 3.'
