  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
  code: "head = 50\nreqs = [60, 40, 90]\ntotal = 0\nfor r in reqs:\n    d = abs(r - head)\n    total +=\
    \ d\n    head = r\n    print(r, d)\nprint(total)"
  expected_output: '60 10

