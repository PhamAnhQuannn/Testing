subtopic_id: ml.llm_eval_serving.quantization_compression
items:
- id: S328
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Nói ngắn gọn: **quantization (lượng tử hoá)** là gì và vì sao nó giúp cắt bộ nhớ (và thường
    cả

    tốc độ) khi phục vụ một LLM? Nêu số byte mỗi tham số của **FP16**, **INT8** và **INT4**.

    '
  answer_md: '**Quantization** = lưu (và đôi khi tính toán trên) trọng số của model ở **độ chính xác số
    thấp

    hơn (lower precision)** thay vì số thực 16-bit gốc. Nhờ mỗi tham số chiếm ít byte hơn, model

    **chiếm ít VRAM/bộ nhớ hơn** và mỗi token phải **đọc ít byte hơn** từ bộ nhớ; vì decode là

    memory-bound (nghẽn ở băng thông bộ nhớ) nên đọc ít byte hơn thường **nhanh hơn**.

    Số byte mỗi tham số: **FP16/BF16 = 2 byte**, **INT8 = 1 byte**, **INT4 = 0,5 byte**.

    '
  rubric_md: 'Đúng khi nêu được: (1) quantization = lưu trọng số ở độ chính xác thấp hơn; (2) lợi ích
    cắt bộ

    nhớ/băng thông (và thường nhanh hơn vì decode memory-bound); (3) đúng byte/tham số FP16=2,

    INT8=1, INT4=0,5. Đủ ba ý: bằng chứng điểm 1. Sai số byte (ví dụ nói INT4 = 1 byte) hoặc không

    giải thích được lợi ích: tối đa điểm 0.

    '
- id: S329
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Bạn có một GPU **48 GB** VRAM và cần phục vụ một model **70B**. Hãy: (1) tính bộ nhớ **trọng

    số** ở FP16, INT8, INT4 và cho biết mức nào vừa; (2) chọn **phương pháp** nén phù hợp khi ngân

    sách thời gian/chi phí thấp và không có pipeline huấn luyện (PTQ hay QAT, vì sao); (3) nêu bước

    bắt buộc để chắc rằng bản nén vẫn dùng được.

    '
  answer_md: '(1) **Bộ nhớ trọng số = byte/tham số × số tham số**, với 70B = 70 × 10^9:

    - FP16 (2 byte): ≈ **140 GB** — không vừa 48 GB.

    - INT8 (1 byte): ≈ **70 GB** — không vừa 48 GB.

    - INT4 (0,5 byte): ≈ **35 GB** — **vừa** 48 GB, còn chỗ cho KV cache.

    (2) Chọn **PTQ (post-training quantization)** như **GPTQ hoặc AWQ**: nén một model đã train

    xong, chỉ cần ít dữ liệu hiệu chỉnh (calibration), **không huấn luyện lại**, chạy nhanh và rẻ —

    khớp ràng buộc. QAT cho chất lượng tốt hơn ở bit rất thấp nhưng tốn kém và cần pipeline huấn

    luyện, không hợp ở đây.

    (3) **Đo suy giảm chất lượng trên eval set**: chạy bản gốc và bản INT4 trên cùng bộ câu hỏi thử

    (có đáp án chuẩn), so điểm; chỉ chấp nhận nếu mức tụt nằm trong ngưỡng. Nén không miễn phí nên

    phải chứng minh bằng con số, không giả định.

    '
  rubric_md: 'Đạt khi nêu đúng cả 3: (1) đúng phép tính 140/70/35 GB và kết luận chỉ INT4 vừa 48 GB; (2)
    chọn

    PTQ (GPTQ/AWQ) kèm lý do rẻ/nhanh/không huấn luyện lại; (3) nêu đo chất lượng trên eval set sau

    nén. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Sai con số bộ nhớ, hoặc thiếu

    bước đo chất lượng (phần cốt lõi), hoặc chọn phương pháp không khớp ràng buộc: tối đa điểm 1.

    '
- id: S330
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: '**(Phỏng vấn AI engineer)** Team cần đưa một model **70B** vào chạy trên phần cứng có hạn
    và lo

    chất lượng tụt. Hãy trình bày cách bạn xử lý đầu-cuối: (1) từ **ràng buộc phần cứng**, chọn

    **độ chính xác** (FP16/INT8/INT4) và **phương pháp** (PTQ như GPTQ/AWQ, hay QAT) — giải thích

    lựa chọn; (2) **tính bộ nhớ** model 70B ở INT4 và vì sao nó quan trọng; (3) cách **đo suy giảm

    chất lượng sau nén** và vì sao không được bỏ qua bước này.

    '
  answer_md: '**(1) Chọn độ chính xác + phương pháp theo phần cứng.** Bắt đầu từ VRAM có sẵn: tính mỗi
    mức

    chiếm bao nhiêu (byte/tham số × số tham số) rồi chọn **mức bit thấp nhất vẫn đạt chất lượng** mà

    vừa bộ nhớ (chừa chỗ cho KV cache). Với GPU hạn chế, thường là **INT4** (weight-only). Về

    phương pháp: dùng **PTQ (GPTQ/AWQ)** khi cần nhanh/rẻ và không có pipeline huấn luyện — đây là

    lựa chọn mặc định; chỉ cân nhắc **QAT** khi phải ép bit rất thấp mà vẫn giữ chất lượng và team

    có đủ nguồn lực huấn luyện. (Weight+activation cắt thêm tính toán nhưng khó hơn do outlier.)

    **(2) Bộ nhớ 70B ở INT4:** 70 × 10^9 tham số × 0,5 byte = 35 × 10^9 byte ≈ **35 GB** (so với

    FP16 140 GB, INT8 70 GB). Quan trọng vì nó quyết định model **có vừa VRAM hay không**: ví dụ

    một GPU 48 GB không chứa nổi FP16/INT8 nhưng vừa INT4 — đổi độ chính xác là đổi được việc model

    chạy được hay không.

    **(3) Đo suy giảm chất lượng:** chạy **bản gốc và bản nén trên cùng một eval set** (bộ câu hỏi

    thử sát tác vụ thật, có đáp án chuẩn), so thước đo (accuracy, tỉ lệ đúng định dạng, hay điểm

    theo tác vụ), chỉ chấp nhận khi mức tụt dưới ngưỡng đã định. Không được bỏ qua vì **nén không

    miễn phí**: làm tròn thô có thể hạ chất lượng, và mức tụt phụ thuộc model + tác vụ nên phải đo

    trên chính dữ liệu của mình, không giả định "INT4 chắc ổn".

    '
  rubric_md: 'Đạt (mức phỏng vấn, điểm 3) khi: (1) chọn độ chính xác + phương pháp xuất phát từ ràng buộc

    phần cứng, giải thích PTQ vs QAT hợp lý; VÀ (2) tính đúng 70B INT4 ≈ 35 GB bằng byte/tham số ×

    số tham số, và nêu vì sao nó quyết định "vừa VRAM hay không"; VÀ (3) mô tả đo chất lượng trên

    eval set (so bản gốc với bản nén trên cùng tập) kèm lý do nén không miễn phí. Đúng, trong

    time-box, tự giải thích rõ: bằng chứng điểm 3. Thiếu phép tính bộ nhớ, hoặc thiếu bước đo chất

    lượng, hoặc không gắn lựa chọn với ràng buộc phần cứng: chưa đạt mức 3.

    '
