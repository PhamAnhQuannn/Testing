items:
- id: X624
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Giải thích 1 câu vì sao.
  code: "LV = {\"DEBUG\": 0, \"INFO\": 1, \"ERROR\": 2}\n\n\nclass Handler:\n    def __init__(self, name,\
    \ level):\n        self.name = name\n        self.level = level\n\n    def write(self, level, msg):\n\
    \        if LV[level] >= LV[self.level]:\n            print(f\"[{self.name}] {msg}\")\n\n\nh = Handler(\"\
    file\", \"INFO\")\nh.write(\"DEBUG\", \"a\")\nh.write(\"INFO\", \"b\")\nh.write(\"ERROR\", \"c\")"
  expected_output: '[file] b

    [file] c'
  answer_md: Handler có ngưỡng INFO (1) nên bỏ dòng DEBUG (0 < 1) và ghi INFO và ERROR (>= 1).
  rubric_md: 'Output khớp VÀ nêu handler chỉ ghi khi mức dòng log >= ngưỡng. Đúng: bằng chứng điểm 1;
    sai: tối đa điểm 0.'
- id: X625
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Viết `class Logger` mô hình các handler lọc theo mức. Mức: `DEBUG=0`, `INFO=1`, `ERROR=2`.

    `Logger()` khởi tạo rỗng; `add_handler(name, level)` đăng ký handler tên `name` với ngưỡng `level`
    (chuỗi `"DEBUG"`, `"INFO"` hoặc `"ERROR"`), giữ theo thứ tự thêm vào;

    `log(level, msg)` trả **list tên** các handler (theo thứ tự thêm vào) có ngưỡng <= mức dòng log, tức
    handler sẽ ghi dòng đó;

    `handler_count()` trả số handler (`int`). Không handler thì `log` trả `[]`. Ví dụ ngưỡng `console=DEBUG`,
    `file=ERROR`, `log("INFO", "hi")` trả `["console"]`.

    '
  problem_id: check-x625-logger
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X626
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích thứ
    tự gửi (heap ưu tiên) cùng cách retry hoạt động.
  code: "import heapq\n\n\nclass Channel:\n    def __init__(self, name, fails):\n        self.name = name\n\
    \        self.fails = fails\n\n    def send(self, msg):\n        if self.fails > 0:\n            self.fails\
    \ -= 1\n            return False\n        return True\n\n\ndef deliver(ch, msg, tries):\n    for n\
    \ in range(1, tries + 1):\n        if ch.send(msg):\n            print(f\"{ch.name} ok after {n}\"\
    )\n            return True\n    print(f\"{ch.name} gave up\")\n    return False\n\n\nplan = []\nheapq.heappush(plan,\
    \ (2, \"sms\", 1))\nheapq.heappush(plan, (1, \"email\", 3))\nheapq.heappush(plan, (3, \"push\", 0))\n\
    while plan:\n    _, name, fails = heapq.heappop(plan)\n    deliver(Channel(name, fails), \"hi\", 3)"
  expected_output: 'email gave up

    sms ok after 2

    push ok after 1'
  answer_md: 'Heap lấy ưu tiên nhỏ trước: email (1), sms (2), push (3). Email lỗi 3 lần mà chỉ thử 3 lần
    nên bỏ cuộc; sms lỗi 1 lần rồi thành công ở lần 2; push thành công ngay lần 1.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích thứ tự theo ưu tiên và retry giới hạn lần. Đúng: bằng
    chứng điểm 3; sai: tối đa điểm 2.'
