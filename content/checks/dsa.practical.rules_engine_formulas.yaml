items:
- id: X541
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "rules = [(100, \"gold\"), (50, \"silver\"), (10, \"bronze\")]\n\ndef tier(points):\n    for need,\
    \ name in rules:\n        if points >= need:\n            return name\n    return \"none\"\n\nprint([tier(p)\
    \ for p in (120, 50, 49, 10, 9)])\nprint(tier(75) == tier(50))"
  expected_output: '[''gold'', ''silver'', ''bronze'', ''bronze'', ''none'']

    True'
  answer_md: Evaluator duyệt luật theo thứ tự và trả tên của luật khớp đầu tiên. 120 khớp 100 (gold);
    50 khớp 50 (silver); 49 và 10 chỉ khớp 10 (bronze); 9 không khớp luật nào nên trả "none". `tier(75)`
    và `tier(50)` đều là silver nên so sánh cho `True`.
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
- id: X542
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Viết `price_after(price, rules)`: `price` là giá nguyên (cent), `rules` là danh sách chuỗi
    áp dụng theo thứ tự. `"percent P"` trừ `price * P // 100` (chia nguyên), `"fixed F"` trừ `F`. Sau
    mỗi luật chặn giá không nhỏ hơn 0. Trả về giá cuối (int). `price_after(1000, ["percent 10", "fixed
    50"])` là `850`. Gợi ý: tách chuỗi bằng `split()`, kiểm tra loại luật.

    '
  problem_id: check-x542-price-engine
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X543
  difficulty: 3
  type: write_code
  minutes: 10
  prompt_md: 'Viết `eval_bool(expr)`: `expr` là biểu thức gồm các token cách nhau bằng khoảng trắng: `T`,
    `F`, `AND`, `OR`, `NOT`, `(`, `)`. Độ ưu tiên `NOT` > `AND` > `OR`; `AND`/`OR` kết hợp trái; ngoặc
    đổi thứ tự. Trả về bool. Không dùng `eval`. `eval_bool("T AND ( F OR NOT F )")` là `True`. Gợi ý:
    recursive descent với một hàm cho mỗi mức ưu tiên.

    '
  problem_id: check-x543-eval-bool
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem
    gợi ý hoặc quá thời gian: tối đa điểm 2.'
