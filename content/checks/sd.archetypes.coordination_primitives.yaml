subtopic_id: sd.archetypes.coordination_primitives
items:
- id: S193
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Kể tên **bốn trường** của một ID Snowflake 64 bit theo đúng thứ tự từ bit cao xuống bit
    thấp, và

    nói mỗi trường **rộng khoảng bao nhiêu bit**.

    '
  answer_md: 'Từ bit cao xuống thấp: **1 bit dấu (sign)** (để 0), **~41 bit thời gian (timestamp, mili-giây)**,

    **~10 bit số máy (machine / worker id)**, **~12 bit bộ đếm (sequence)**. Cộng lại 1 + 41 + 10 + 12
    =

    64 bit. Timestamp ở bit cao nên ID lớn dần theo thời gian.

    '
  rubric_md: 'Đạt khi nêu đủ bốn trường đúng thứ tự (dấu → timestamp → machine id → sequence) với độ rộng
    xấp xỉ 1/41/10/12 bit. Đúng ý: bằng chứng điểm 1. Sai thứ tự hoặc thiếu một trường/độ rộng: tối đa
    điểm 0.'
- id: S194
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Một node Snowflake vừa bị NTP **chỉnh đồng hồ lùi** vài mili-giây. (1) Vì sao điều này có
    thể gây

    **ID trùng**? (2) Vì sao trường **sequence 12 bit** không tự cứu được tình huống này? (3) Nêu

    **cách xử lý đúng** để không bao giờ phát ID trùng.

    '
  answer_md: '(1) Timestamp lấy từ đồng hồ tường (wall clock) và nằm ở bit cao. Khi đồng hồ lùi, node
    có thể sinh

    lại một **timestamp (ms) đã dùng**; với cùng machine id và cùng giá trị sequence, ID sẽ **trùng**
    ID

    đã phát trước đó.

    (2) Sequence chỉ phân biệt các ID **trong cùng một mili-giây trên cùng một máy**; nó reset về 0 ở

    mỗi mili-giây mới. Khi timestamp lùi về một mili-giây **trong quá khứ**, sequence lại bắt đầu từ các

    giá trị đã dùng của mili-giây đó, nên không tránh được trùng.

    (3) Node phải **nhớ mốc timestamp lớn nhất đã phát**; nếu đồng hồ hiện tại **nhỏ hơn** mốc đó thì

    **từ chối sinh (báo lỗi)** hoặc **chờ** cho đến khi đồng hồ vượt lại qua mốc cũ rồi mới phát. Tuyệt

    đối không phát ID với timestamp đã lùi.

    '
  rubric_md: 'Đạt khi nêu đúng cả 3 ý: timestamp lùi → tái dùng mili-giây đã phát nên trùng; sequence
    chỉ phân biệt trong cùng ms/cùng máy nên không cứu được; xử lý = nhớ mốc lớn nhất, từ chối hoặc chờ
    đến khi đồng hồ vượt mốc. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu ý ''sequence
    không cứu được'' hoặc không nêu từ chối/chờ: tối đa điểm 1.'
- id: S195
  difficulty: 3
  type: concept
  minutes: 12
  prompt_md: 'Thiết kế một **bộ sinh ID duy nhất phân tán** cho hệ cần ~100.000 ID/giây trên ~50 máy,
    dùng ID làm

    **khóa chính** của database. Trình bày: (1) bố cục bit bạn chọn và dung lượng từng trường (ID/ms/máy,

    số máy, số năm); (2) cách sinh ID trên hot path và cách cấp **machine id**; (3) xử lý **đồng hồ lùi**

    và **tràn bộ đếm**; (4) **biện minh** vì sao chọn Snowflake thay vì UUIDv4, UUIDv7, auto-increment

    của một DB và ticket/range server.

    '
  answer_md: '(1) **Snowflake 64 bit**: 1 bit dấu + ~41 bit timestamp (ms) + ~10 bit machine id + ~12
    bit

    sequence. Dung lượng: 2^12 = **4096 ID/ms/máy** (~4,096,000 ID/giây/máy, nên 50 máy thừa sức

    100.000 ID/giây), 2^10 = **1024 máy** (đủ cho 50 máy), 41 bit ≈ **69 năm** từ epoch tự chọn.

    (2) **Hot path**: lấy timestamp ms hiện tại, ghép machine id cố định của node, và sequence tăng dần

    trong mili-giây; tất cả **cục bộ, không hỏi máy khác** cho từng ID. **Machine id** xin **một lần lúc

    khởi động** từ **ZooKeeper/etcd** (đăng ký để nhận số còn trống, tránh hai máy trùng số).

    (3) **Đồng hồ lùi**: nhớ timestamp lớn nhất đã phát; nếu đồng hồ hiện tại nhỏ hơn thì **từ chối hoặc

    chờ** đến khi vượt lại mốc cũ. **Tràn bộ đếm**: nếu hết 4096 giá trị trong cùng một mili-giây thì

    **chờ sang mili-giây kế tiếp** rồi reset sequence về 0.

    (4) **Biện minh**: khóa chính DB cần **gọn** và **thân thiện chỉ mục** (ghi mới nằm gần nhau). *UUIDv4*

    là 128 bit và ngẫu nhiên → to gấp đôi và xấu cho chỉ mục. *UUIDv7* k-sortable nhưng vẫn **128 bit**.

    *Auto-increment của một DB* buộc mọi ID về một DB → **cổ chai + điểm chết duy nhất**, khó scale ghi.

    *Ticket/range server* giảm vòng mạng bằng cấp khối số nhưng vẫn phụ thuộc server cấp khối và số có

    thể **không liên tục** khi máy con chết giữa khối. **Snowflake** đạt cả ba: 64 bit, sinh cục bộ

    không phối hợp cho từng ID, và gần đúng thứ tự thời gian (k-sortable).

    '
  rubric_md: 'Đạt (mức phỏng vấn, theo mastery_bar mức 3) khi: (1) vẽ đúng bố cục Snowflake và tính đúng
    dung lượng (4096/ms/máy, 1024 máy, ~69 năm) và chỉ ra nó thừa đáp ứng 100k ID/giây; (2) mô tả hot
    path sinh cục bộ + cấp machine id qua ZooKeeper/etcd lúc khởi động; (3) xử lý đúng cả đồng hồ lùi
    (từ chối/chờ) và tràn bộ đếm (chờ sang ms kế); (4) biện minh có trade-off vs ít nhất ba lựa chọn (UUIDv4/UUIDv7/auto-increment/ticket
    server). Đúng, trong time-box, tự giải thích rõ ràng: bằng chứng điểm 3. Thiếu phần biện minh so sánh
    hoặc bỏ một ca biên: chưa đạt mức 3.'
