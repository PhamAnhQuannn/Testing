- id: Q225
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: Phân biệt supervised, unsupervised, reinforcement learning bằng 1 ví dụ mỗi loại. Vì sao
    chia train/validation/test?
  answer_md: 'Supervised: có nhãn (phân loại thư rác). Unsupervised: không nhãn (gom nhóm khách hàng).
    RL: học qua thưởng/phạt (chơi game). Train học tham số; validation chọn mô hình/siêu tham số; test
    chỉ dùng một lần cuối để ước lượng hiệu năng thật.'
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 1; sai:
    tối đa điểm 0.'
- id: Q226
  difficulty: 2
  type: concept
  minutes: 3
  prompt_md: Data leakage là gì? Cho 2 ví dụ.
  answer_md: 'Thông tin từ ngoài tập train lọt vào lúc huấn luyện làm điểm số ảo. Ví dụ: chuẩn hoá (fit
    scaler) trên toàn bộ dữ liệu trước khi chia; đặc trưng chứa thông tin của nhãn (ví dụ "đã hoàn tiền"
    khi dự đoán gian lận).'
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 2; sai:
    tối đa điểm 1.'
