subtopic_id: eng.testing_quality.tdd_clean_code
items:
- id: E124
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: '**TDD** là gì? Kể tên và mô tả ngắn ba bước của vòng **red-green-refactor**.

    '
  answer_md: '- **TDD** (Test-Driven Development): viết **test trước**, rồi viết code sau.

    - **Red**: viết test mô tả hành vi mong muốn và thấy nó **fail**.

    - **Green**: viết code **tối thiểu** để test qua.

    - **Refactor**: dọn code (đổi tên, tách hàm, bỏ lặp) khi test đang xanh, rồi chạy lại test.

    '
  rubric_md: 'Đạt khi nêu đúng: test được viết TRƯỚC code, và ba bước Red (test fail) - Green (code tối
    thiểu cho qua) - Refactor (dọn code khi test xanh) theo đúng thứ tự. Đủ ý: bằng chứng điểm 1; nói
    viết code trước rồi mới viết test hoặc sai thứ tự các bước: điểm 0.'
- id: E125
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: '(a) Bạn cần làm hàm `is_palindrome(s)`. Sắp xếp các bước theo đúng thứ tự TDD: (1) dọn code

    cho gọn, (2) viết code tối thiểu cho test qua, (3) viết test `is_palindrome("aba")` và thấy nó

    fail, (4) chạy lại toàn bộ test để chắc vẫn xanh.

    (b) Trong hai thay đổi sau, thay đổi nào là **refactor**, thay đổi nào **không**? Giải thích:

    (i) đổi tên biến `s2` thành `reversed_text` và tách đoạn đảo chuỗi ra hàm riêng, kết quả không đổi;

    (ii) sửa hàm để bỏ qua dấu cách khi so sánh.

    '
  answer_md: '(a) Thứ tự đúng: **(3) → (2) → (1) → (4)**: viết test fail (Red), viết code tối thiểu cho
    qua

    (Green), dọn code (Refactor), rồi chạy lại test để xác nhận vẫn xanh. Test luôn có trước code.


    (b) (i) **là refactor**: chỉ đổi cấu trúc/tên, **hành vi bên ngoài không đổi**, và nên chạy

    lại test để kiểm chứng. (ii) **không phải refactor**: nó đổi hành vi (trước đây `"a ba"` không

    là palindrome, giờ có thể là), nên là thay đổi tính năng và cần test mới (viết test trước).

    '
  rubric_md: 'Đạt khi: (a) sắp đúng test fail -> code tối thiểu -> dọn code -> chạy lại test (test trước
    code, refactor sau khi green); (b) nhận ra (i) là refactor vì hành vi không đổi, (ii) không phải refactor
    vì đổi hành vi (cần test mới). Đúng cả hai phần: bằng chứng điểm 2. Đặt refactor trước khi test xanh
    hoặc coi thay đổi hành vi là refactor: tối đa điểm 1.'
- id: E126
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: 'Bạn thừa hưởng một hàm `calculate_price(order)` dài 150 dòng, lồng nhiều tầng `if`, copy-paste

    logic giảm giá ở ba chỗ, và **chưa có test**. Hãy trình bày cách bạn dọn nó **an toàn**: nêu các

    code smell, bước chuẩn bị trước khi sửa, quy trình từng bước, và giải thích vì sao test giúp

    refactor an toàn. Sau đó nếu cần thêm quy tắc giảm giá mới, bạn làm theo TDD thế nào?

    '
  answer_md: '**Smell:** hàm quá dài làm nhiều việc (vi phạm single responsibility), lồng sâu, lặp logic
    giảm

    giá (vi phạm DRY), có thể tên biến mơ hồ.


    **Chuẩn bị:** trước khi đụng cấu trúc, viết **characterization test** ghi lại hành vi hiện tại

    của hàm (nhiều đầu vào đại diện, gồm cả trường hợp biên) và chạy cho **xanh**. Đây là lưới an toàn.


    **Quy trình:** làm từng bước nhỏ: đổi tên rõ nghĩa, dùng early return để giảm lồng, gom đoạn

    giảm giá lặp thành một hàm, tách hàm nhỏ mỗi hàm một việc. Sau **mỗi bước** chạy lại test; nếu

    đỏ thì hoàn lại bước đó. Không trộn việc refactor với đổi tính năng trong cùng một bước.


    **Vì sao test giúp an toàn:** refactor nghĩa là đổi cấu trúc mà **không đổi hành vi**; test xanh

    trước và sau chứng minh hành vi còn nguyên. Không có test thì không biết mình có làm hỏng gì không.


    **Quy tắc giảm giá mới (TDD):** **Red**: viết test cho quy tắc mới và thấy nó fail; **Green**:

    viết code tối thiểu cho test qua; **Refactor**: dọn lại khi mọi test xanh.

    '
  rubric_md: 'Đạt mức 3 (mức phỏng vấn) khi: (a) nêu được smell (hàm dài/nhiều trách nhiệm, lồng sâu,
    lặp DRY); (b) viết characterization test trước khi sửa code cũ chưa có test; (c) refactor từng bước
    nhỏ, chạy test sau mỗi bước, không trộn đổi hành vi; (d) giải thích refactor = đổi cấu trúc không
    đổi hành vi và test xanh là bằng chứng; (e) mô tả thêm tính năng mới theo Red-Green-Refactor với test
    viết trước. Đủ cả năm trong time-box: bằng chứng điểm 3. Thiếu bước viết test trước khi refactor hoặc
    nhầm refactor với đổi hành vi: chưa đạt mức 3.'
