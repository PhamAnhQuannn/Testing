subtopic_id: sd.caching.cdn
items:
- id: S085
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Nói ngắn gọn: **CDN** là gì và nó mang lại hai lợi ích nào? Giải thích **miss** và **hit**
    khác

    nhau thế nào.

    '
  answer_md: '**CDN (Content Delivery Network)** là mạng máy chủ cache (edge/PoP — point of presence)
    đặt

    gần người dùng khắp nơi, giữ **bản sao** nội dung tĩnh/media (ảnh, video, JS/CSS) của server

    gốc (**origin**). Hai lợi ích: (1) **giảm độ trễ** vì phục vụ từ nơi gần người dùng; (2)

    **giảm tải origin** vì đa số request do edge trả.

    **Miss** = edge chưa có bản này nên phải đi lấy từ origin rồi giữ lại; **hit** = edge đã có,

    trả ngay mà không chạm origin.

    '
  rubric_md: 'Đạt khi nêu đúng: CDN = edge/PoP gần người dùng giữ bản sao của origin; hai lợi ích (giảm
    độ trễ + giảm tải origin); miss = lấy từ origin rồi cache, hit = trả từ edge. Đúng ý: điểm 1. Thiếu
    một vế (chỉ nói nhanh hơn mà không nói giảm tải origin, hoặc không phân biệt miss/hit): tối đa điểm
    0.'
- id: S086
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Đội bạn deploy bản web mới mỗi ngày, nhưng người dùng vẫn thấy file `app.js` **cũ** nhiều
    giờ

    sau khi deploy vì edge đang giữ bản cũ tới hết TTL. (1) Vì sao chuyện này xảy ra? (2) Đề xuất

    cách sửa **nên dùng thường xuyên** để bản mới tới ngay mà vẫn giữ hit ratio cao, và nói rõ nó

    tác động tới **cache key** thế nào. (3) Khi nào mới nên dùng **purge/invalidation**?

    '
  answer_md: '(1) `Cache-Control: max-age` đặt **TTL** dài cho `app.js`, nên trong suốt TTL edge phục
    vụ bản

    cũ từ cache mà không hỏi lại origin — người dùng thấy bản cũ cho tới khi hết hạn.

    (2) Dùng **URL có phiên bản / fingerprint (cache busting)**: đổi *tên* file theo nội dung, ví

    dụ `app.9f3c1a.js` hoặc `app.v2.js`. URL mới = **cache key mới**, nên edge kéo bản mới **ngay**

    (bản cũ cứ để hết hạn tự nhiên). Vì mỗi phiên bản bất biến (immutable) nên vẫn đặt **TTL rất

    dài** → hit ratio cao. (File điểm vào như `index.html` để TTL ngắn/revalidate để lấy tên mới.)

    (3) **Purge/invalidation** chỉ dùng khi **khẩn cấp** (gỡ nội dung sai/nhạy cảm), vì nó **chậm

    lan** ra toàn mạng và thường **bị tính phí/giới hạn số lần** → không hợp làm quy trình deploy

    hằng ngày.

    '
  rubric_md: 'Đạt khi nêu đúng cả 3 ý: (1) TTL/max-age khiến edge phục vụ bản cũ tới hết hạn; (2) versioned/fingerprinted
    URL — nhấn mạnh URL mới = cache key mới nên cập nhật ngay mà vẫn TTL dài; (3) purge chỉ cho khẩn cấp
    vì chậm lan và tốn phí. Đúng, trong time-box, tự giải thích được: điểm 2. Thiếu ý ''URL mới = cache
    key mới'' hoặc coi purge là cách deploy thường xuyên: tối đa điểm 1.'
- id: S087
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: 'Thiết kế chiến lược CDN cho **một trong hai** hệ sau (chọn một và nói rõ): (a) web asset
    tĩnh

    (JS/CSS/ảnh) của một SPA, hoặc (b) dịch vụ phát **video**. Trả lời đủ: **cache key**, **TTL**,

    và **cách cập nhật file**; nêu push hay pull. Sau đó **ước tính chi phí egress** cho một tháng

    phục vụ **200 TB** với giá CDN **0,05 $/GB**, và tính egress **từ origin** nếu hit ratio là

    **90%** (giá egress origin **0,09 $/GB**). Giải thích vì sao hit ratio cao cắt được chi phí.

    '
  answer_md: "Ví dụ chọn (a) **web asset của SPA** (hoặc (b) video, tương tự):\n- **Cache key:** URL;\
    \ loại bỏ các query string vô nghĩa (mã theo dõi) ra khỏi key để không tụt\n  hit ratio; thêm `Vary:\
    \ Accept-Encoding` để tách bản nén. (Với video: mỗi **segment** HLS/DASH\n  là một URL/key riêng;\
    \ manifest là một key riêng.)\n- **TTL:** file đã **fingerprint** (ví dụ `app.9f3c1a.js`) là bất biến\
    \ → TTL **rất dài** (ví dụ\n  1 năm, `immutable`); `index.html` điểm vào → TTL **ngắn**/revalidate\
    \ bằng ETag. (Video:\n  segment TTL dài; manifest live TTL ngắn, VOD dài.)\n- **Cập nhật file:** bình\
    \ thường **đổi URL theo phiên bản** (bản mới = cache key mới, tới ngay);\n  chỉ **purge** khi khẩn\
    \ cấp.\n- **Pull vs push:** **pull** là mặc định hợp lý (edge tự kéo khi có người hỏi).\n- **Egress:**\
    \ 200 TB = **200.000 GB**. CDN (edge → người dùng): 200.000 × 0,05 =\n  **10.000 $/tháng**. Hit ratio\
    \ 90% → origin chỉ phục vụ 10% = **20.000 GB**; origin egress =\n  20.000 × 0,09 = **1.800 $**. Không\
    \ có CDN, origin tự phục vụ 200.000 × 0,09 = **18.000 $**.\n- **Vì sao hit ratio cao cắt chi phí:**\
    \ origin chỉ trả cho phần **miss**; hit ratio càng cao\n  thì phần đi qua origin (giá đắt hơn) càng\
    \ nhỏ — ở đây 90% hit đưa origin từ 18.000 $ còn\n  1.800 $, đồng thời giảm tải origin.\n"
  rubric_md: 'Đạt (mức phỏng vấn, đúng level-3 bar) khi: nêu đủ cache key + TTL + cách cập nhật file cho
    web hoặc video (và pull/push), rồi ước tính egress ĐÚNG số: CDN 200.000×0,05 = 10.000 $; origin ở
    90% hit = 20.000 GB × 0,09 = 1.800 $ (so với 18.000 $ không CDN), và giải thích origin chỉ trả cho
    miss nên hit cao cắt chi phí. Đúng, trong time-box, số học chính xác, tự giải thích rõ: điểm 3. Sai
    số học egress, hoặc thiếu một trong cache key/TTL/cập nhật file, hoặc không giải thích được vai trò
    hit ratio: chưa đạt mức 3.'
