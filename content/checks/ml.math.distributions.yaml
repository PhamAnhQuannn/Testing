  prompt_md: 'Viết hàm `binomial_pmf(n, k, p)` trả xác suất đúng `k` thành công trong `n` lần thử độc
    lập, mỗi lần xác suất thành công `p`: `C(n,k)·p^k·(1−p)^(n−k)`. `n` là số nguyên không âm, `k` số
