- id: X649
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    dòng cuối là 1.0.
  code: 'import math

    n = 3

    p = 0.25

    pmf = [math.comb(n, k) * p**k * (1 - p) ** (n - k) for k in range(n + 1)]

    print([round(v, 4) for v in pmf])

    print(round(sum(pmf), 4))'
  expected_output: '[0.4219, 0.4219, 0.1406, 0.0156]

    1.0'
  answer_md: P(0) = 0,75³ = 0,421875; P(1) = 3·0,25·0,75² = 0,421875; P(2) = 3·0,0625·0,75 = 0,140625;
    P(3) = 0,25³ = 0,015625. Binomial là một phân phối nên tổng xác suất mọi k bằng 1 (khai triển (p +
    (1−p))ⁿ = 1).
  rubric_md: 'Output khớp từng dòng VÀ giải thích tổng bằng 1 vì là phân phối. Đúng: bằng chứng điểm 3;
    sai: tối đa điểm 2.'
