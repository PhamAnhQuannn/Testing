items:
- id: X843
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
  code: "trans = {\n    (\"ready\", \"dispatch\"): \"running\",\n    (\"running\", \"io\"): \"waiting\"\
    ,\n    (\"waiting\", \"done\"): \"ready\",\n    (\"running\", \"exit\"): \"terminated\",\n}\ns = \"\
    ready\"\nfor ev in [\"dispatch\", \"io\", \"done\", \"dispatch\", \"exit\"]:\n    s = trans[(s, ev)]\n\
    \    print(s)"
  expected_output: 'running

    waiting

    ready

    running

    terminated'
  answer_md: Bắt đầu ready. dispatch đưa lên running; io chuyển sang waiting; done đưa về ready; dispatch
    lên running lần nữa; exit kết thúc ở terminated.
  rubric_md: 'Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0.'
- id: X844
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết hàm `tree_depth(edges)` mô phỏng cây process do `fork()` tạo ra. `edges` là list các
    `[pid, ppid]` (số nguyên): mỗi process và pid của cha nó. Gốc (init) là process có `ppid == 0`, hoặc
    có `ppid` không trùng với bất kỳ pid nào trong danh sách. Giả sử đúng một gốc và cây hợp lệ (không
    có chu trình). Trả về **độ sâu tối đa** của cây: chỉ riêng gốc thì độ sâu là 1, mỗi tầng fork thêm
    1; danh sách rỗng trả `0`. Ví dụ `tree_depth([[1,0],[2,1],[3,1],[4,2]])` cho `3` (đường 1 -> 2 ->
    4).

    '
  problem_id: check-x844-tree-depth
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X845
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích điều
    gì xảy ra với process 3 và 4 khi process 2 kết thúc (khái niệm gì).
  code: "procs = {1: 0, 2: 1, 3: 2, 4: 2}\n\n\ndef children(p):\n    return sorted(c for c, pp in procs.items()\
    \ if pp == p)\n\n\ndef depth(p):\n    d = 1\n    while procs[p] != 0:\n        p = procs[p]\n    \
    \    d += 1\n    return d\n\n\nprint(children(2))\nfor c in children(2):\n    procs[c] = 1\ndel procs[2]\n\
    print(children(1))\nprint(children(2))\nprint(depth(3))\nprint(len(procs))"
  expected_output: '[3, 4]

    [3, 4]

    []

    2

    3'
  answer_md: 'Ban đầu process 2 có hai con là 3 và 4. Khi 2 kết thúc, 3 và 4 thành orphan và được init
    (pid 1) nhận nuôi: ppid đổi thành 1, nên children(1) là [3, 4] và children(2) rỗng. depth(3): 3 ->
    1 (ppid 0) nên độ sâu 2. Còn lại 3 process (1, 3, 4).'
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng: 3 và 4 là orphan, được init (pid 1) nhận nuôi
    (reparent). Đúng: bằng chứng điểm 3; sai: tối đa điểm 2.'
