- id: Q021
  difficulty: 2
  type: concept
  minutes: 3
  prompt_md: Vì sao tuple dùng được làm khóa dict còn list thì không? Cho ví dụ dùng tuple làm khóa.
  answer_md: Tuple bất biến (hashable) nếu các phần tử bất biến; list mutable nên không hash được. Ví
    dụ `visited[(r, c)] = True` cho ô lưới.
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 2; sai:
    tối đa điểm 1.'
