items:
- id: S040
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Nói ngắn gọn: **nút thắt (bottleneck)** trong một thiết kế là gì, và kể tên **hai** dạng

    bottleneck hay gặp đã học?

    '
  answer_md: "Nút thắt (bottleneck) là **nơi tải dồn lại nhiều hơn phần còn lại**, nên nó vỡ (quá tải)\n\
    trước khi ta kịp scale cả hệ. Hai dạng hay gặp (kể đúng bất kỳ hai):\n- **Một database gánh mọi lệnh\
    \ ghi (single write DB / write primary):** đọc nhân bản được\n  nhưng ghi vẫn dồn về một nơi.\n- **Hot\
    \ key / hot partition:** một khóa hoặc phần dữ liệu bị hỏi quá nhiều, máy giữ nó quá tải.\n- **Fan-out:**\
    \ một hành động sinh ra rất nhiều việc (ví dụ người nổi tiếng đăng bài phải\n  đẩy tới hàng chục triệu\
    \ feed).\n- **Điểm chết duy nhất (single point of failure, SPOF):** chỗ chỉ có một cái, chết là cả\
    \ hệ chết.\n"
  rubric_md: 'Đạt khi: định nghĩa đúng bottleneck (nơi tải dồn lại / vỡ trước) **và** kể đúng hai dạng

    trong danh sách trên. Đúng ý: bằng chứng điểm 1. Thiếu định nghĩa hoặc chỉ nêu được một

    dạng: tối đa điểm 0.

    '
- id: S041
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Một mạng xã hội cho phép người dùng xem **news feed** (dòng bài từ những người họ theo dõi).

    Đọc feed rất thường xuyên; hệ đang chậm khi tải feed. Hãy: (1) chỉ ra **nút thắt

    (bottleneck)** hoặc rủi ro chính; (2) nêu **hai phương án A/B** để dựng feed, mỗi phương án

    kèm một ưu và một nhược; (3) nói trục **trade-off** chính giữa chúng.

    '
  answer_md: "(1) Nút thắt: việc **dựng feed** và lượng **đọc** rất lớn; thêm rủi ro **fan-out** với người\n\
    có nhiều follower.\n(2) Hai phương án:\n- **A — fan-out-on-write (dựng sẵn lúc ghi):** khi một người\
    \ đăng bài, đẩy bài vào sẵn feed\n  của mọi follower. Ưu: **đọc rất nhanh** (feed đã dựng sẵn). Nhược:\
    \ người nổi tiếng gây\n  **fan-out khổng lồ**, ghi rất nặng và tốn chỗ.\n- **B — fan-out-on-read (dựng\
    \ lúc đọc):** khi người dùng mở feed mới đi gộp bài mới từ những\n  người họ theo dõi. Ưu: **ghi nhẹ**,\
    \ không tốn chỗ dựng sẵn. Nhược: **đọc chậm hơn** vì\n  phải gộp lúc đọc.\n(3) Trục trade-off chính:\
    \ **tối ưu đọc vs tối ưu ghi** (đẩy việc sang lúc ghi để đọc nhanh,\nhay để lúc đọc để ghi nhẹ). Thực\
    \ tế thường dùng kiểu **lai** (người thường fan-out-on-write,\nngười nổi tiếng fan-out-on-read).\n"
  rubric_md: 'Đạt (mức điểm 2, gate vào phần chọn) khi nêu đủ 3 ý: (1) chỉ đúng nút thắt là đọc feed /

    dựng feed (hoặc fan-out người nổi tiếng); (2) hai phương án fan-out-on-write và

    fan-out-on-read, mỗi cái một ưu + một nhược đúng; (3) gọi đúng trục trade-off tối ưu đọc vs

    ghi. Thiếu một phương án, hoặc không nêu được ưu–nhược, hoặc không gọi ra trục trade-off:

    tối đa điểm 1.

    '
- id: S042
  difficulty: 3
  type: concept
  minutes: 12
  prompt_md: 'Thiết kế rút gọn cho một dịch vụ **rút gọn link (URL shortener)**: client → load balancer
    →

    nhiều app server **stateless** → một **database primary** lưu ánh xạ mã → URL gốc, có thêm

    **cache (Redis)** phía trước để tăng tốc đọc. Lượt **đọc** (mở link ngắn) lớn gấp nhiều lần

    lượt **ghi** (tạo link mới).


    Hãy làm **đủ 4 bước deep dive**: (1) chỉ ra một **nút thắt (bottleneck)** hoặc SPOF trong

    sơ đồ; (2) nêu **hai phương án A/B** để xử lý nó, kèm ưu–nhược; (3) **chọn một** và nói **vì

    sao** (gắn với đặc điểm đọc-nhiều-ghi-ít); (4) trả lời **"nếu cache chết thì sao?"**.

    '
  answer_md: "Một đường trả lời đạt yêu cầu (ý tương đương được chấp nhận):\n\n**(1) Nút thắt / SPOF:**\
    \ **database primary** là một SPOF và là nút thắt cho đường **ghi**\n(mọi lệnh tạo link về một nơi).\
    \ (Có thể thay bằng: cache là điểm tăng tốc đọc, nếu nó chết\nthì tải dồn hết về DB.)\n\n**(2) Hai\
    \ phương án A/B cho tải đọc / chịu lỗi DB:**\n- **A — thêm nhiều read replica cho DB:** ưu: chia được\
    \ tải **đọc** rất lớn, có bản dự phòng\n  để failover; nhược: replica trễ nhất quán (đọc có thể thấy\
    \ dữ liệu hơi cũ), tốn thêm máy.\n- **B — dựa mạnh vào cache (Redis) cho các mã nóng:** ưu: đọc **rất\
    \ nhanh**, rẻ hơn nhiều\n  replica; nhược: dữ liệu trong cache có thể cũ, và cache là thêm một thành\
    \ phần phải lo khi\n  nó chết (cache stampede).\n\n**(3) Chọn + lý do:** vì hệ **đọc nhiều hơn ghi\
    \ rất nhiều** và ánh xạ mã→URL **gần như không\nđổi**, em ưu tiên **B (cache mạnh)** cho phần lớn\
    \ lượt đọc, kết hợp một ít **read replica**\nđể chịu lỗi DB. Dữ liệu ít đổi nên cache cũ gần như không\
    \ gây sai — đổi chút nhất quán lấy\ntốc độ là xứng đáng.\n\n**(4) Nếu cache chết:** cache không phải\
    \ nguồn sự thật nên request **đọc thẳng database**,\nchậm hơn nhưng hệ **vẫn chạy** (giảm cấp êm /\
    \ graceful degradation); cần lo **cache stampede**\n(tải dồn về DB khi cache vừa chết) bằng cách hâm\
    \ nóng lại cache dần hoặc giới hạn số truy vấn\ncùng mã. Còn **nếu DB primary chết**: đổi sang **standby\
    \ (failover)**, các lệnh ghi chưa kịp\nnhân bản có thể mất, phục hồi trong vài giây–phút.\n"
  rubric_md: 'Đạt **mức 3 (phỏng vấn)** khi làm đủ cả 4 bước đúng: (1) chỉ ra một bottleneck/SPOF hợp
    lý

    trong sơ đồ (DB primary cho ghi, hoặc rủi ro mất cache); (2) hai phương án A/B thật sự khác

    nhau, mỗi cái có ưu **và** nhược; (3) **chọn một và lý do gắn với đặc điểm đọc-nhiều-ghi-ít**

    (không chọn bừa, không né chọn); (4) trả lời "nếu cache chết" bằng **đọc thẳng DB + giảm cấp

    êm** (điểm cộng nếu nhắc cache stampede hoặc failover DB). Thiếu bước chọn-có-lý-do, hoặc

    không trả lời được câu hỏi lỗi, hoặc hai phương án không có trade-off rõ: **chưa đạt mức 3**.

    '
