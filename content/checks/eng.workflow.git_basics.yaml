subtopic_id: eng.workflow.git_basics
items:
- id: E100
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Giải thích ngắn gọn **commit**, **branch** và **HEAD** trong Git là gì.

    '
  answer_md: "- **Commit**: một **bản chụp** (snapshot) của thư mục kèm lời nhắn, ghi vào lịch sử bằng\n\
    \  `git add` rồi `git commit -m \"...\"`.\n- **Branch**: một **con trỏ** (pointer) tới một commit;\
    \ cho phép làm tính năng riêng mà không đụng nhánh chính.\n- **HEAD**: con trỏ cho biết bạn **đang\
    \ đứng ở đâu** (thường là nhánh hiện tại); khi commit, nhánh hiện tại dời tới commit mới.\n"
  rubric_md: 'Đạt khi nêu đúng cả ba: commit = bản chụp kèm lời nhắn, branch = con trỏ tới commit, HEAD
    = chỗ đang đứng. Đủ cả ba: bằng chứng điểm 1; sai hoặc thiếu một khái niệm (ví dụ nói branch là bản
    sao thư mục): điểm 0.'
- id: E101
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Bạn vừa push một commit lên nhánh chung và phát hiện nó làm hỏng tính năng; đồng đội đã
    kéo

    commit đó về. (1) Bạn nên dùng `git revert` hay `git reset`, và vì sao? (2) Hai lệnh này khác

    nhau thế nào về **lịch sử**? (3) Nêu khác biệt giữa `git merge` và `git rebase` ở lịch sử kết quả

    và một tình huống nên tránh rebase.

    '
  answer_md: '(1) Dùng **`git revert <commit>`**: nó tạo **commit mới** làm ngược lại commit lỗi, nên
    lịch sử

    không bị viết lại và đồng đội kéo về bình thường. `git reset` **lùi con trỏ nhánh** (viết lại

    lịch sử); trên nhánh đã push và đã có người kéo, nó buộc phải force-push và làm lịch sử của

    mọi người lệch nhau.

    (2) **revert**: lịch sử giữ nguyên, chỉ dài thêm một commit hoàn tác. **reset**: bỏ commit

    khỏi lịch sử của nhánh (`--soft`/`--mixed`/`--hard` quyết định giữ hay bỏ thay đổi); chỉ hợp

    cho commit **chưa push**.

    (3) **merge** giữ lịch sử của cả hai nhánh và thêm **commit gộp** (hoặc fast-forward); **rebase**

    tạo lại commit của nhánh bạn nối sau đầu nhánh kia, cho lịch sử **thẳng** nhưng đổi hash. Tránh

    rebase nhánh **đã chia sẻ** mà người khác dựa vào vì nó viết lại lịch sử họ đã có.

    '
  rubric_md: 'Đạt khi nêu đúng cả 3 ý: (1) chọn revert cho commit đã push kèm lý do (không viết lại lịch
    sử), (2) phân biệt revert thêm commit mới còn reset viết lại lịch sử/chỉ cho commit chưa push, (3)
    merge giữ lịch sử + commit gộp vs rebase viết lại thành đường thẳng, và nêu tránh rebase nhánh đã
    chia sẻ. Đúng và tự giải thích trong time-box: bằng chứng điểm 2. Chọn reset cho commit đã push, hoặc
    thiếu một trong ba ý: tối đa điểm 1.'
- id: E102
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: 'Bạn làm tính năng trên nhánh `feature/login`, trong lúc đó `main` có commit mới và cả hai
    cùng

    sửa một dòng trong `config.py`. Hãy mô tả trọn vẹn **luồng từ lúc tạo nhánh đến khi PR được

    gộp**: các bước chính, cách bạn **xử lý conflict** (Git đánh dấu gì, bạn làm gì), khi nào chọn

    **merge** và khi nào **rebase** để cập nhật nhánh, và cách bạn xử lý nếu lỡ gộp một commit lỗi.

    '
  answer_md: '**Luồng:** từ `main` mới nhất tạo nhánh riêng (`git switch -c feature/login`), làm bằng
    các

    **commit nhỏ** lời nhắn rõ, `git push` nhánh lên remote, **mở PR**. Reviewer xem **diff** và

    góp ý; tôi commit thêm vào cùng nhánh (PR tự cập nhật); khi được duyệt và CI qua thì PR được

    gộp vào `main`. PR nhỏ giúp dễ duyệt, ít conflict.


    **Conflict:** khi cập nhật nhánh từ `main`, hai bên cùng sửa dòng trong `config.py` nên Git dừng

    và đánh dấu `<<<<<<<` (bản nhánh hiện tại/HEAD), `=======`, `>>>>>>>` (bản nhánh kia; khi rebase thì
    hai phía đảo ngược). Tôi mở file, đọc cả

    hai, **sửa thành nội dung đúng** và xóa dòng đánh dấu, `git add config.py`, rồi `git commit`

    (merge) hoặc `git rebase --continue` (rebase).


    **Merge vs rebase để cập nhật:** nhánh `feature/login` là nhánh **riêng của tôi** nên có thể

    **rebase** lên `main` để lịch sử thẳng, dễ đọc trước khi gộp. Nếu nhánh đã **chia sẻ** (người

    khác đã kéo/dựa vào) thì dùng **merge** để không viết lại lịch sử họ có. Merge giữ lịch sử và

    thêm commit gộp; rebase tạo lại commit (hash đổi).


    **Commit lỗi đã gộp/push:** dùng **`git revert`** tạo commit hoàn tác — an toàn, không viết

    lại lịch sử. Tránh `git reset` + force-push trên nhánh chung.

    '
  rubric_md: 'Đạt mức 3 (mức phỏng vấn) khi: (a) mô tả đúng luồng nhánh riêng -> commit nhỏ -> push ->
    PR -> review diff -> sửa theo góp ý -> gộp; (b) xử lý conflict đúng: nhận ra dấu <<<<<<< / =======
    / >>>>>>>, sửa nội dung, git add, rồi commit hoặc rebase --continue; (c) phân biệt merge (giữ lịch
    sử, commit gộp) và rebase (viết lại, lịch sử thẳng) và nêu đúng khi nào dùng cái nào (rebase nhánh
    riêng, merge/tránh rebase nhánh chia sẻ); (d) hoàn tác commit đã push bằng revert, không dùng reset.
    Đủ cả bốn, trong time-box: bằng chứng điểm 3. Thiếu phần conflict, thiếu revert hoặc nhầm merge/rebase:
    chưa đạt mức 3.'
