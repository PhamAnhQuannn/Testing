items:
- id: X489
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "calls = 0\nc = [2, 3, 5]\n\ndef bt(start, remain, path, out):\n    global calls\n    calls +=\
    \ 1\n    if remain == 0:\n        out.append(path[:])\n        return\n    for i in range(start, len(c)):\n\
    \        if c[i] > remain:\n            break\n        path.append(c[i])\n        bt(i, remain - c[i],\
    \ path, out)\n        path.pop()\n\nout = []\nbt(0, 8, [], out)\nprint(out)\nprint(calls)"
  expected_output: '[[2, 2, 2, 2], [2, 3, 3], [3, 5]]

    13'
  answer_md: Tìm mọi tổ hợp (được dùng lại số) có tổng 8 từ `[2, 3, 5]`, theo thứ tự DFS nên in `[[2,
    2, 2, 2], [2, 3, 3], [3, 5]]`. `calls` đếm số lần gọi `bt` kể cả các nhánh bị cắt sớm bởi `break`
    khi `c[i] > remain`, kết quả là 13.
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
- id: X490
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Viết `exist(board, word)`: `board` là lưới các chuỗi một ký tự, `word` là một chuỗi. Trả
    `True` nếu dò ra được `word` bằng các ô liền kề nhau liên tiếp (trên, dưới, trái, phải), mỗi ô chỉ
    dùng tối đa một lần trong một đường đi. `exist([["A", "B", "C", "E"], ["S", "F", "C", "S"], ["A",
    "D", "E", "E"]], "ABCCED")` là `True`, còn với `"ABCB"` là `False`. Gợi ý: DFS quay lui, đánh dấu
    ô đang dùng rồi khôi phục.

    '
  problem_id: check-x490-word-search
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X491
