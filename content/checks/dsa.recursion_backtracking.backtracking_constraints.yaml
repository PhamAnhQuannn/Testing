  prompt_md: 'Viết `total_n_queens(n)`: trả về số cách đặt `n` quân hậu lên bàn cờ `n x n` sao cho không
    hai quân nào ăn nhau (không chung hàng, cột hay đường chéo). `total_n_queens(4)` là `2`, `total_n_queens(1)`
    là `1`, `total_n_queens(3)` là `0`. Gợi ý: quay lui từng hàng, dùng các tập cột, `r - c`, `r + c`
    để cắt nhánh.

    '
