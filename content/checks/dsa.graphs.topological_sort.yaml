- id: W216
  difficulty: 2
  type: concept
  minutes: 3
  prompt_md: So sánh Kahn (BFS, đếm bậc vào) và DFS 3 trạng thái (chưa thăm / đang thăm / xong) để phát
    hiện chu trình. Khi nào gặp chu trình?
  answer_md: 'Kahn: nếu số nút lấy ra < n thì còn chu trình. DFS: gặp lại nút "đang thăm" nghĩa là có
    chu trình; thứ tự topo là thứ tự đảo của lúc "xong".'
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 2; sai:
    tối đa điểm 1.'
- id: X455
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "from collections import deque\n\nadj = [[1, 2], [3], [3], []]\nindeg = [0] * 4\nfor u in range(4):\n\
    \    for v in adj[u]:\n        indeg[v] += 1\n\nq = deque(i for i in range(4) if indeg[i] == 0)\n\
    order = []\nwhile q:\n    u = q.popleft()\n    order.append(u)\n    for v in adj[u]:\n        indeg[v]\
    \ -= 1\n        if indeg[v] == 0:\n            q.append(v)\n\nprint(*order)\nprint(indeg)"
  expected_output: '0 1 2 3

    [0, 0, 0, 0]'
  answer_md: Ban đầu `indeg = [0, 1, 1, 2]` nên chỉ đỉnh 0 vào hàng đợi. Lấy 0 ra thì indeg của 1 và 2
    về 0 nên cả hai vào hàng đợi; lấy 1 làm indeg[3] còn 1, lấy 2 làm indeg[3] về 0 nên 3 vào hàng đợi.
    Thứ tự là `0 1 2 3` và mọi indegree cuối cùng đều là 0.
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
