subtopic_id: sd.data.sharding
items:
- id: S052
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Nói ngắn gọn: phân vùng **ngang** (horizontal / sharding) khác phân vùng **dọc** (vertical)

    ở chỗ nào, và kể tên ba chiến lược chia ngang phổ biến.

    '
  answer_md: 'Phân vùng **dọc** cắt theo **cột** (tách cột ít dùng/nặng sang bảng khác cho bảng chính
    gọn).

    Phân vùng **ngang (sharding)** cắt theo **dòng**: mỗi shard giữ một tập con các dòng trên một

    máy riêng, cùng cấu trúc bảng — và đây là cách chia được cả tải **ghi**.

    Ba chiến lược chia ngang: **theo dải (range)**, **theo băm (hash)**, và **theo bảng tra

    (directory / lookup)**.

    '
  rubric_md: 'Nêu đúng: dọc = cắt theo cột, ngang/sharding = cắt theo dòng; và kể đủ ba chiến lược (range,
    hash, directory). Đúng ý: bằng chứng điểm 1; thiếu phân biệt dòng/cột hoặc thiếu chiến lược: tối đa
    điểm 0.'
- id: S053
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Một bảng `orders` (đơn hàng) đang quá to cho một máy. Hãy đề xuất cách shard: (1) chọn một

    shard key và giải thích theo tiêu chí **chia đều** và **khớp truy vấn hay gặp**; (2) chọn

    **range hay hash** và nêu đánh đổi; (3) chỉ ra một loại truy vấn sẽ trở thành **xuyên shard**

    với lựa chọn của bạn.

    '
  answer_md: '(1) Nếu truy vấn nóng là "các đơn của một khách", chọn shard key `customer_id`: cardinality

    cao nên **chia đều**, và mọi đơn của một khách nằm cùng shard nên truy vấn đó **chỉ chạm một

    shard** (khớp access pattern). (Chia theo `country` hay `status` sẽ lệch nặng.)

    (2) **Hash** trên `customer_id` để rải đều, tránh hot shard theo thời gian; đánh đổi là truy

    vấn "đơn trong khoảng thời gian X" không còn gọn trong vài shard. Nếu truy vấn nóng lại là

    theo **thời gian**, chọn **range** theo ngày — gọn cho range scan nhưng shard mới nhất dễ

    **nóng** (mọi đơn mới dồn vào).

    (3) Với shard key `customer_id`: các **báo cáo tổng toàn hệ** (doanh thu theo ngày, top sản

    phẩm) phải **fan-out tới mọi shard rồi gộp** (scatter-gather) → xuyên shard, chậm và phức tạp.

    '
  rubric_md: 'Đạt khi nêu đủ 3 ý: chọn shard key hợp lý có biện minh theo chia đều + khớp truy vấn; chọn
    range/hash kèm đánh đổi đúng (hash rải đều/hỏng range, range hợp range scan/dễ hot); và chỉ ra đúng
    một truy vấn xuyên shard (aggregate/báo cáo toàn hệ hoặc lọc theo cột khác shard key). Đúng, trong
    time-box, tự giải thích được: bằng chứng điểm 2. Thiếu biện minh shard key hoặc không chỉ ra được
    truy vấn xuyên shard: tối đa điểm 1.'
- id: S054
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: '"Thiết kế sharding cho bảng `posts` của một mạng xã hội." Trả lời ở mức phỏng vấn: (1) **chọn

    shard key** hợp lý và biện minh theo chia đều + khớp truy vấn nóng; (2) xử lý **hot shard**

    khi một bài viral/ một người nổi tiếng làm một shard quá tải — nêu ít nhất hai cách; (3) nêu

    **resharding** sẽ đau ra sao khi phải thêm shard và cách bạn giảm đau; (4) nêu **hậu quả với

    truy vấn xuyên shard** của lựa chọn shard key.

    '
  answer_md: '(1) **Shard key = `user_id` (tác giả)** (hoặc `post_id` băm): gom bài của một người vào
    cùng

    shard, cardinality cao nên chia tạm đều, và truy vấn nóng "bài của một người" chỉ chạm một

    shard. Dùng **hash** để rải đều, tránh lệch theo thời gian.

    (2) **Hot shard:** một người nổi tiếng / bài viral làm một shard quá tải dù số dòng đều. Chữa:

    (a) **tách riêng** khóa nóng ra shard/replica riêng, hoặc thêm **read replica** để gánh đọc;

    (b) **cache** (Redis) bài nóng trước DB; (c) **split key** — gắn hậu tố (`post#0..#9`) để trải

    trên nhiều shard, đổi lại khi đọc phải gộp.

    (3) **Resharding:** với `hash % n`, thêm một shard làm **gần hết khóa đổi shard** → chép lại

    khối dữ liệu khổng lồ, định tuyến kép khi đang dời, dễ lỗi. Giảm đau: **over-provision** nhiều

    partition logic rồi gộp vào ít máy (scale chỉ chuyển cả partition), và dùng **consistent

    hashing** để thêm/bớt máy chỉ dời một phần nhỏ khóa.

    (4) **Hậu quả xuyên shard:** với shard key `user_id`, các truy vấn không theo tác giả —

    **feed trộn nhiều người**, **đếm tổng / top-N toàn hệ**, **join** sang bảng chia khác khóa —

    phải **fan-out tới nhiều shard rồi gộp** (scatter-gather), chậm bằng shard chậm nhất; giao

    dịch nguyên tử trên nhiều shard cần phối hợp (2PC) nên thường **thiết kế để tránh**.

    '
  rubric_md: 'Đạt (mức phỏng vấn, theo mastery bar) khi làm đủ cả bốn: chọn shard key hợp lý có biện minh
    (chia đều + khớp truy vấn nóng); xử lý hot shard với ít nhất hai cách đúng (tách khóa nóng / cache
    / split key); giải thích đúng nỗi đau resharding (hash % n dời gần hết dữ liệu) kèm cách giảm (over-provision
    và/hoặc consistent hashing); và nêu đúng hậu quả xuyên shard (aggregate/join/giao dịch phải fan-out
    & gộp, đắt). Đúng, trong time-box, tự giải thích rõ ràng: bằng chứng điểm 3. Sót một trong bốn phần
    (đặc biệt bỏ hot shard hoặc hậu quả xuyên shard): chưa đạt mức 3.'
