subtopic_id: ml.system_design.fraud_detection
items:
- id: S340
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Trong bài phát hiện gian lận (fraud), ca gian lận chỉ chiếm khoảng 0,1% giao dịch. Vì sao

    **accuracy (tỉ lệ đúng) gần như vô dụng** để đánh giá model, và thay vào đó nên đo bằng gì?

    '
  answer_md: 'Vì **mất cân bằng cực đoan**: một model luôn đoán "không gian lận" đã đạt ~99,9% accuracy
    mà

    bắt được **0 ca xấu** — con số cao nhưng vô nghĩa. Phải đo trên **lớp hiếm**: **precision**

    (trong số ca bị gắn cờ, bao nhiêu phần đúng là xấu) và **recall** (trong số ca xấu thật, bắt

    được bao nhiêu phần) **tại một ngưỡng**, **PR-AUC** (diện tích dưới đường precision–recall, nhạy

    với lớp hiếm hơn ROC-AUC), và **precision@k** (precision trong top-k ca điểm cao nhất, khớp với

    sức duyệt của đội người). Có thể thêm: đo **theo từng loại vi phạm (per-category)**.

    '
  rubric_md: 'Đúng khi nêu được: (a) vì ca xấu cực hiếm nên baseline ''luôn đoán âm'' đã ~99,9% accuracy
    mà bắt 0 ca → accuracy vô nghĩa; (b) ít nhất hai thước đo thay thế hợp lý trên lớp hiếm (precision/recall
    tại ngưỡng, PR-AUC, hoặc precision@k). Đủ cả hai ý: bằng chứng điểm 1. Chỉ nói ''dùng F1/precision''
    mà không giải thích vì sao accuracy hỏng: tối đa điểm 0.'
- id: S341
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Bạn xây model phát hiện gian lận thẻ tín dụng. Bỏ sót một giao dịch gian lận tốn ~100 USD,
    còn

    chặn nhầm một khách thật tốn ~5 USD. Nhãn thật là **chargeback**, về sau **60 ngày**. Hãy nêu

    cụ thể: (1) bạn **chọn ngưỡng (threshold)** như thế nào cho hợp chi phí; (2) bạn **đánh giá chất

    lượng model** ra sao khi nhãn đến trễ 60 ngày; (3) một thước đo nào thay cho accuracy và vì sao.

    '
  answer_md: '(1) **Ngưỡng theo chi phí (cost-based):** chọn ngưỡng **tối thiểu hoá tổng chi phí** =

    (số bỏ sót × 100) + (số chặn nhầm × 5). Vì bỏ sót đắt gấp ~20 lần chặn nhầm, nên **hạ ngưỡng để

    ưu tiên recall** (bắt nhiều ca xấu hơn), chấp nhận thêm một ít chặn nhầm; dò ngưỡng trên tập

    đánh giá bằng chính công thức chi phí này chứ không để mặc định 0,5.

    (2) **Nhãn trễ → cửa sổ nhãn chín (label-maturity window):** đánh giá *chính thức* chỉ chạy trên

    dữ liệu đã qua đủ ~60 ngày (chargeback đã kịp về); dữ liệu mới hơn chưa chín nên chỉ dùng **theo

    dõi sơ bộ** (vd nhãn người duyệt sớm) chứ không kết luận recall — nếu đo trên dữ liệu chưa chín

    thì recall bị **thổi phồng**.

    (3) **precision/recall tại ngưỡng, hoặc PR-AUC / precision@k** thay cho accuracy, vì ca xấu cực

    hiếm (~0,1%) làm accuracy luôn cao giả tạo (đoán toàn "âm" đã ~99,9%).

    '
  rubric_md: 'Đạt khi nêu đúng cả 3: (1) chọn ngưỡng tối thiểu hoá tổng chi phí và suy ra nên ưu tiên
    recall vì bỏ sót đắt hơn nhiều; (2) dùng cửa sổ nhãn chín — chỉ đánh giá chính thức trên dữ liệu đã
    qua ~60 ngày, nêu được dữ liệu chưa chín làm metric lạc quan giả; (3) một metric hợp lý thay accuracy
    + lý do mất cân bằng. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu phần nhãn
    trễ (chỉ nói ''đo recall ngay'') hoặc chọn ngưỡng không gắn chi phí: tối đa điểm 1.'
- id: S342
  difficulty: 3
  type: concept
  minutes: 12
  prompt_md: '**(Phỏng vấn AI engineer)** Hãy thiết kế **end-to-end** một hệ thống phát hiện gian lận
    **hoặc**

    kiểm duyệt nội dung độc hại. Trình bày ít nhất: (1) **metric** — vì sao không dùng accuracy, và

    bạn đo bằng gì (gồm **theo chi phí** và **theo từng loại vi phạm**); (2) cách **chọn ngưỡng**;

    (3) cách xử lý **nhãn đến trễ & nhiễu**; (4) cách đối phó **concept drift / kẻ gian thích nghi**;

    (5) **kiến trúc pipeline** nhiều tầng + **vòng lặp người duyệt** và **explainability** cho kháng cáo.

    '
  answer_md: '**(1) Metric.** Ca xấu cực hiếm (~0,1%) nên **accuracy vô dụng** (đoán toàn "âm" đã ~99,9%).
    Đo

    trên lớp hiếm: **precision/recall tại ngưỡng, PR-AUC, precision@k theo sức duyệt**; **theo từng

    loại vi phạm (per-category)** theo policy taxonomy (spam/bạo lực/lừa đảo...), chấp nhận

    **multi-label/multimodal**; đánh giá bằng **mẫu giữ đúng tỉ lệ thật (prevalence-based)**.

    **(2) Ngưỡng theo chi phí:** chọn ngưỡng tối thiểu hoá (bỏ sót × chi phí bỏ sót) + (chặn nhầm ×

    chi phí chặn nhầm); bên nào đắt hơn thì nghiêng về bắt/để lọt ít hơn bên đó.

    **(3) Nhãn trễ & nhiễu:** nhãn thật (chargeback/khiếu nại) về sau 30–60 ngày → **cửa sổ nhãn

    chín (label-maturity window)**: đánh giá chính thức chỉ trên dữ liệu đã chín; nhãn người duyệt

    lấp sớm nhưng **thiên lệch** (chỉ ca được gắn cờ mới được duyệt).

    **(4) Drift / đối thủ:** **retrain thường xuyên**, **giám sát trôi** (tỉ lệ gắn cờ, phân bố

    điểm, precision trên nhãn người duyệt), feature **online/velocity/graph**, và giữ **tầng luật**

    cập nhật ngay để bịt lỗ hổng mới trong khi model học lại.

    **(5) Pipeline + người duyệt + explainability:** xếp tầng rẻ→đắt — **rules + allowlist/denylist

    → model nhẹ online → model nặng/graph → hàng chờ người duyệt**; chấm **thời gian thực**, có

    **pre/post-publish** cho moderation. Model **triage**, người duyệt lo **vùng xám**, **nhãn quay

    về train**; hàng chờ ưu tiên theo **rủi ro × giá trị** (precision@k). **Explainability**: nêu lý

    do gắn cờ để người duyệt quyết nhanh, xử lý **kháng cáo (appeal)** có đường đảo ngược, và lưu vết

    cho **kiểm toán**.

    '
  rubric_md: 'Đạt (mức phỏng vấn, điểm 3) khi phủ được 4/5 trụ cột một cách mạch lạc, BẮT BUỘC có: (1)
    vì sao accuracy hỏng + metric theo chi phí VÀ theo category; (3) xử lý nhãn trễ bằng cửa sổ nhãn chín;
    (5) pipeline nhiều tầng + vòng lặp người duyệt (nhãn quay về train) + explainability cho kháng cáo.
    Thiếu một trong ba trụ cột bắt buộc này (metric cost/category, nhãn trễ, hoặc reviewer loop) thì chưa
    đạt mức 3. Có thêm (2) ngưỡng chi phí và (4) drift/retrain + feature velocity/graph là bằng chứng
    điểm 3 đầy đủ. Đúng, trong time-box, tự giải thích rõ: điểm 3.'
