- id: X834
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
  code: "records = {\n    \"www\": [\"CNAME\", \"web\"],\n    \"web\": [\"CNAME\", \"app\"],\n    \"app\"\
    : [\"A\", \"10.0.0.5\"],\n}\nname = \"www\"\nhops = 0\nwhile records[name][0] == \"CNAME\":\n    name\
    \ = records[name][1]\n    hops += 1\n    print(name)\nprint(records[name][1])\nprint(hops)"
  expected_output: 'web

    app

    10.0.0.5

    2'
  answer_md: www là CNAME trỏ đến web nên in web (hops=1); web là CNAME trỏ đến app nên in app (hops=2);
    app là bản ghi A nên vòng lặp dừng. Sau đó in địa chỉ 10.0.0.5 và số bước nhảy 2.
  rubric_md: 'Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0.'
- id: X835
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết hàm `resolve(records, name)` mô phỏng việc DNS phân giải tên qua chuỗi CNAME. `records`
    là dict ánh xạ tên (str) sang `[type, value]`, với `type` là `"CNAME"` (value là một tên khác) hoặc
    `"A"` (value là chuỗi IP). Bắt đầu từ `name`, đi theo các CNAME đến khi gặp bản ghi `"A"` rồi trả
    về `value` (chuỗi IP). Trả `None` nếu `name` không có bản ghi, nếu một CNAME trỏ đến tên không có
    bản ghi, hoặc nếu có vòng lặp (gặp lại một tên đã đi qua). Ví dụ `resolve({"www":["CNAME","web"],"web":["A","1.2.3.4"]},
    "www")` cho `"1.2.3.4"`; `resolve({"a":["CNAME","b"]}, "a")` cho `None`.

    '
  problem_id: check-x835-resolve
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X836
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    vòng lặp CNAME không làm hàm chạy mãi và TTL quyết định điều gì ở ba dòng cuối.
  code: "def resolve(rec, name):\n    seen = []\n    while name in rec:\n        if name in seen:\n  \
    \          return \"loop\"\n        seen.append(name)\n        rtype, value = rec[name]\n        if\
    \ rtype == \"A\":\n            return value\n        name = value\n    return \"missing:\" + name\n\
    \n\nrec = {\n    \"a\": [\"CNAME\", \"b\"],\n    \"b\": [\"CNAME\", \"c\"],\n    \"c\": [\"A\", \"\
    9.9.9.9\"],\n    \"x\": [\"CNAME\", \"y\"],\n    \"y\": [\"CNAME\", \"x\"],\n    \"p\": [\"CNAME\"\
    , \"q\"],\n}\nprint(resolve(rec, \"a\"))\nprint(resolve(rec, \"x\"))\nprint(resolve(rec, \"p\"))\n\
    print(resolve(rec, \"zz\"))\n\ncache = {\"a\": (\"1.1.1.1\", 100)}\nfor now in (99, 100, 101):\n \
    \   print(cache[\"a\"][0] if cache[\"a\"][1] > now else \"expired\")"
  expected_output: '9.9.9.9

    loop

    missing:q

    missing:zz

    1.1.1.1

    expired

    expired'
  answer_md: 'a đi qua b rồi c là bản ghi A nên ra 9.9.9.9. x và y trỏ vòng nhau: lần thứ hai gặp x thì
    x đã nằm trong seen nên trả loop (nhờ seen mà không chạy mãi). p trỏ đến q không có bản ghi nên vòng
    lặp thoát và trả missing:q; zz không có bản ghi ngay từ đầu nên ra missing:zz. Với cache, bản ghi
    chỉ dùng được khi hạn (expiry) còn lớn hơn now: now=99 còn hạn nên in 1.1.1.1; now=100 và 101 đã hết
    hạn nên expired (resolver phải hỏi lại, đó là vai trò của TTL).'
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng: seen phát hiện vòng lặp CNAME; tên thiếu bản ghi
    cho missing; TTL hết hạn thì bản ghi cache không còn dùng được. Đúng: bằng chứng điểm 3; sai: tối
    đa điểm 2.'
