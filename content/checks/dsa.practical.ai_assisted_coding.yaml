  minutes: 3
  prompt_md: 'Vòng AI-enabled 60 phút: bạn mở đầu thế nào (3 việc đầu tiên) trước khi nhờ AI?'
  answer_md: 1) đọc đề và code/test sẵn có, chạy test xem cái nào fail; 2) tự nêu giả thuyết bug và kế
    hoạch; 3) chia nhỏ yêu cầu rồi mới prompt AI từng bước, nêu ràng buộc. Không dán nguyên đề.
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 1; sai:
    tối đa điểm 0.'
- id: Q174
  difficulty: 2
  type: read_code
  minutes: 3
  prompt_md: Hàm do AI sinh. (a) Chạy ra gì? (b) Có đúng yêu cầu không? Vì sao? Sửa.
  code: "# AI viết hàm: \"trả phần tử xuất hiện nhiều nhất\"\ndef most_common(xs):\n    d = {}\n    for\
    \ x in xs: d[x] = d.get(x, 0) + 1\n    return max(d)\nprint(most_common([1, 1, 2, 3]), most_common([\"\
    a\", \"b\", \"b\"]))"
  expected_output: 3 b
  answer_md: '`max(d)` lấy khoá lớn nhất chứ không phải khoá có tần suất lớn nhất: ví dụ đầu in 3 thay
    vì 1. Sửa: `max(d, key=d.get)`.'
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 2; sai: tối đa điểm 1.'
- id: W222
  difficulty: 2
  type: concept
  minutes: 3
  prompt_md: So sánh prompt xấu "viết code giải bài này" với prompt tốt trong vòng AI-enabled. Cho ví
    dụ prompt tốt cho một test đang fail.
  answer_md: 'Prompt tốt: nêu ngữ cảnh, đoạn lỗi, kết quả mong đợi/thực tế, ràng buộc (không đổi API,
    giữ O(n)), yêu cầu giải thích và đề xuất test. Ví dụ: "Test test_merge fail ở input [] vì IndexError
    dòng 12; đề xuất sửa nhỏ nhất và 2 test biên."'
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 2; sai:
    tối đa điểm 1.'
- id: X553
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Trợ lý AI viết `chunk_averages(nums, size)` nhưng nó sai ở trường hợp biên. Hãy viết bản
    đúng: cắt `nums` thành các đoạn liên tiếp dài `size`, trả danh sách trung bình của từng đoạn (`int`
    nếu chia hết, ngược lại `float`). Đoạn cuối có thể ngắn hơn và chỉ chia cho số phần tử thật của nó.
    Nếu `size <= 0` hoặc `nums` rỗng thì trả `[]`. `chunk_averages([1, 2, 3, 4, 5], 2)` là `[1.5, 3.5,
    5]`. Gợi ý: chia cho `len(chunk)`, không chia cho `size`.

    '
  problem_id: check-x553-fix-chunk-average
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X554
  difficulty: 3
  type: read_code
  minutes: 3
  prompt_md: Trợ lý AI viết đoạn code này và nói nó đúng. Chạy tay (không chạy máy) xem in ra gì, rồi
    chỉ ra một lỗi trong hàm. Giải thích 1 câu.
  code: "def moving_avg(nums, k):\n    out = []\n    for i in range(len(nums) - k):\n        out.append(sum(nums[i:i\
    \ + k]) / k)\n    return out\n\nprint(moving_avg([1, 2, 3, 4, 5], 2))\nprint(moving_avg([1, 2], 2))\n\
    print(moving_avg([2, 4, 6], 1))"
  expected_output: '[1.5, 2.5, 3.5]

    []

    [2.0, 4.0]'
  answer_md: Vòng lặp chạy `len(nums) - k` lần nên bỏ sót cửa sổ cuối; đúng phải là `range(len(nums) -
    k + 1)`. Vì vậy ba lần in ra `[1.5, 2.5, 3.5]` (thiếu 4.5), `[]` (thiếu 1.5) và `[2.0, 4.0]` (thiếu
    6.0).
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ chỉ ra lỗi off-by-one ở `range`. Đúng:
    bằng chứng điểm 3; sai: tối đa điểm 1.'
