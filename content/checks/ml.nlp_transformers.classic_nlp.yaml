- id: X702
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    bigram cần add-1 smoothing và vì sao mẫu số cộng V.
  code: 'tokens = "a b a b a c".split()

    bigrams = list(zip(tokens, tokens[1:]))

    c_ab = bigrams.count(("a", "b"))

    c_a = tokens[:-1].count("a")

    V = len(set(tokens))

    print(c_ab, c_a)

    print((c_ab + 1) / (c_a + V))

    print((0 + 1) / (tokens[:-1].count("b") + V))'
  expected_output: '2 3

    0.5

    0.2'
  answer_md: 'bigrams = (a,b), (b,a), (a,b), (b,a), (a,c) nên count(a b) = 2. tokens[:-1] = a b a b a
    có 3 chữ a nên count(a) = 3; V = 3. Dòng 2: (2+1)/(3+3) = 0.5. Dòng 3: count(b) = 2 (trong tokens[:-1])
    nên (0+1)/(2+3) = 0.2. Add-1 smoothing cho cặp chưa thấy xác suất khác 0 (không có thì một cặp lạ
    làm cả câu có xác suất 0); mẫu số cộng V vì mỗi trong V từ kế tiếp đều được cộng thêm 1 count, nên
