- id: X711
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích output
    của attention được tạo từ trọng số và value như thế nào.
  code: 'weights = [0.2, 0.3, 0.5]

    values = [[10, 0], [0, 10], [10, 10]]

    out = [sum(w * v[j] for w, v in zip(weights, values)) for j in range(2)]

    print(round(sum(weights), 2))

    print([round(x, 2) for x in out])

    print(out.index(max(out)))'
  expected_output: '1.0

    [7.0, 8.0]

    1'
  answer_md: 'Tổng trọng số 1.0. Chiều 0: 0.2·10 + 0.3·0 + 0.5·10 = 7.0. Chiều 1: 0.2·0 + 0.3·10 + 0.5·10
    = 8.0. Max là 8.0 ở index 1. Output attention là tổng có trọng số của các value, theo từng chiều:
    value có trọng số lớn đóng góp nhiều hơn.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng: output = tổng các value nhân trọng số, tính theo
