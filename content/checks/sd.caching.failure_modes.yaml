subtopic_id: sd.caching.failure_modes
items:
- id: S079
  difficulty: 1
  type: concept
  minutes: 4
  prompt_md: 'Gọi tên **4 tai nạn cache kinh điển** và nói một câu cho mỗi cái: nó xảy ra khi nào?

    '
  answer_md: "1. **Cache stampede (thundering herd):** một khóa nóng vừa hết hạn, nhiều yêu cầu cùng lúc\
    \ thấy\n   trống và cùng đổ xuống DB để tính lại một giá trị.\n2. **Cache penetration:** các yêu cầu\
    \ hỏi những khóa **không tồn tại**, nên cache không bao giờ\n   có để trả, mọi yêu cầu xuống thẳng\
    \ DB.\n3. **Cache avalanche:** **nhiều** khóa cùng hết hạn một lúc (cùng TTL) hoặc cả cụm cache chết,\n\
    \   làm tải đổ ập xuống DB.\n4. **Hot key:** **một** khóa bị hỏi quá nhiều, dồn tải vào một node cache\
    \ dù cache vẫn trúng.\n"
  rubric_md: 'Đạt khi gọi đúng tên cả 4 (stampede/thundering herd, penetration, avalanche, hot key) và
    nêu đúng thời điểm/nguyên nhân mỗi cái. Đủ 4 đúng ý: bằng chứng điểm 1. Thiếu hoặc nhầm từ một tai
    nạn trở lên: tối đa điểm 0.'
- id: S080
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Cho 3 hiện tượng quan sát được trong một hệ đang chạy, hãy **gọi tên** tai nạn cache tương
    ứng

    **và** nêu **một** cách chữa trực tiếp cho mỗi cái:

    (a) Lúc 0h, một loạt rất nhiều khóa cùng hết hạn và DB tải vọt lên;

    (b) Một con bot liên tục hỏi các ID sản phẩm không có thật, DB bị quét liên tục;

    (c) Một bài của người nổi tiếng bị hỏi 200.000 lần/giây vào một khóa, một node cache quá tải.

    '
  answer_md: '(a) **Cache avalanche** — nhiều khóa cùng TTL cùng hết hạn một lúc. Chữa: thêm **TTL lệch
    ngẫu

    nhiên (jitter)** để chúng hết hạn rải ra (kèm bảo vệ/làm nóng DB).

    (b) **Cache penetration** — hỏi khóa **không tồn tại** nên luôn trượt cache. Chữa: **cache kết

    quả rỗng (null caching)** với TTL ngắn, hoặc dùng **Bloom filter** chặn trước.

    (c) **Hot key** — một khóa quá nóng dồn vào một node. Chữa: **cache bản sao cục bộ (client-side

    cache)** trong app và/hoặc **tách khóa** thành nhiều bản trên nhiều node.

    '
  rubric_md: 'Đạt khi cả 3 gọi đúng tên (avalanche, penetration, hot key) và mỗi cái kèm một cách chữa
    đúng (jitter / null caching hoặc Bloom filter / local cache hoặc split key). Đúng cả 3 cặp tên-cách
    chữa, trong time-box: bằng chứng điểm 2. Sai tên hoặc gán nhầm cách chữa ở một hiện tượng: tối đa
    điểm 1.'
- id: S081
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: 'Bạn đang thiết kế trang chi tiết sản phẩm cho một sàn thương mại điện tử: đọc cực nhiều,
    có

    Redis chắn trước một DB quan hệ. Hãy trình bày hệ **chịu được cả 4 tai nạn cache**: với **mỗi**

    tai nạn, (1) gọi tên nó, (2) chỉ ra nó sẽ xuất hiện ở đâu trong thiết kế này, và (3) nêu cách

    chữa bạn áp vào. Kết lại bằng phương án chung khi **cụm Redis chết**.

    '
  answer_md: "- **Stampede (thundering herd):** khi một sản phẩm \"hot\" (đang sale) có khóa cache hết\
    \ hạn,\n  hàng loạt yêu cầu cùng tính lại. Chữa: **single-flight / khóa đơn luồng** cho mỗi khóa (chỉ\n\
    \  một yêu cầu đi lấy DB, số còn lại chờ), hoặc **tính lại sớm** trước khi hết hạn.\n- **Penetration:**\
    \ bot/kẻ xấu quét các `product_id` không tồn tại, mọi lượt đều trượt xuống DB.\n  Chữa: **null caching**\
    \ (cache dấu \"không có\" với TTL ngắn) và/hoặc **Bloom filter** các ID hợp\n  lệ để chặn trước.\n\
    - **Avalanche:** sau một đợt deploy/khởi động, nhiều khóa được nạp cùng lúc nên cùng TTL và cùng\n\
    \  hết hạn một lượt. Chữa: **TTL jitter** (TTL ± ngẫu nhiên), **cache nhiều tầng** (L1 in-process\n\
    \  trước L2 Redis), và **làm nóng cache** trước khi mở lưu lượng.\n- **Hot key:** một sản phẩm nổi\
    \ tiếng bị hỏi quá nhiều, dồn vào một node Redis. Chữa: **cache\n  cục bộ phía client** (bản sao trong\
    \ RAM mỗi app server, TTL ngắn) và/hoặc **tách khóa**\n  `product:X:1..N` trải trên nhiều node.\n\
    - **Khi cụm Redis chết (phương án chung):** app vẫn phải chạy — xuống thẳng DB nhưng **có giới\n \
    \ hạn tốc độ / circuit breaker** để một đợt trượt ồ ạt không kéo sập DB; nếu được thì phục vụ dữ\n\
    \  liệu cũ (stale) tạm thời và làm nóng lại cache trước khi mở toàn bộ tải.\n"
  rubric_md: 'Đạt (mức phỏng vấn, theo mastery bar mức 3) khi: gọi tên đủ 4 tai nạn, mỗi tai nạn gắn đúng
    vào một chỗ cụ thể trong thiết kế trang sản phẩm, nêu đúng cách chữa cho từng cái (single-flight/early
    recompute; null caching/Bloom filter; TTL jitter/layered/warm-up; local cache/split key), và nêu được
    phương án chung khi Redis chết (xuống DB có giới hạn tốc độ / fallback). Áp đúng và tự giải thích
    trong time-box: bằng chứng điểm 3. Sót một tai nạn, không gắn được vào thiết kế, hoặc thiếu phương
    án khi cache chết: chưa đạt mức 3.'
