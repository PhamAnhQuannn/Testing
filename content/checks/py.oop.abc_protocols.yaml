items:
- id: X387
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "from abc import ABC, abstractmethod\n\nclass A(ABC):\n    @abstractmethod\n    def f(self):\n\
    \        ...\n\nclass B(A):\n    pass\n\nclass C(A):\n    def f(self):\n        return \"c\"\n\nclass\
    \ D:\n    def f(self):\n        return \"d\"\n\nfor k in (B, C, D):\n    try:\n        print(k().f())\n\
    \    except TypeError:\n        print(\"loi\")\nprint(isinstance(C(), A), isinstance(D(), A))"
  expected_output: 'loi

    c

    d

    True False'
  answer_md: '`B` chưa cài `f` nên còn trừu tượng, `B()` ném `TypeError` (in `loi`). `C` cài `f` nên in
    `c`. `D` không kế thừa `A` nhưng có `f` nên duck typing vẫn gọi được và in `d`. `isinstance(D(), A)`
    là `False` vì `D` không kế thừa `A`.'
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
- id: X388
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Cho ABC `Shape` có method trừu tượng `area()`. Viết `sorted_areas(specs)`: `specs` là list
    như `[["sq", 3], ["rect", 2, 5], ["tri", 4, 3]]` với `sq` (cạnh), `rect` (dài, rộng), `tri` (đáy,
    cao; diện tích là `đáy * cao // 2`). Định nghĩa các class con của `Shape` rồi trả list diện tích đã
    sắp xếp tăng dần (ví dụ trên là `[6, 9, 10]`).

    '
  problem_id: check-x388-sorted-areas
  rubric_md: 'Pass toàn bộ test ẩn. Đúng không gợi ý trong time-box (6 phút): bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X389
  difficulty: 3
  type: write_code
  minutes: 12
  prompt_md: 'Cho ABC `Shape` có hai method trừu tượng `area` và `perimeter`. Viết `instantiable(impls)`:
    mỗi phần tử của `impls` là list tên method (trong `"area"`, `"perimeter"`) mà một class con của `Shape`
    có cài. Với mỗi phần tử, tạo động một class con cài đúng các method đó (ví dụ bằng `type(...)`), thử
    tạo object và trả list bool theo thứ tự: `True` nếu tạo được, `False` nếu gặp `TypeError`. Ví dụ `[["area",
    "perimeter"], ["area"], []]` cho `[True, False, False]`.

    '
  problem_id: check-x389-instantiable
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 12 phút: bằng chứng điểm 3; phải xem
    gợi ý hoặc quá thời gian: tối đa điểm 2.'
