  code: 'from math import comb

    total = comb(5, 2)

    hits = comb(2, 1) * comb(3, 1)

    print(total)

    print(round(hits / total, 4))'
  expected_output: '10

    0.6'
  answer_md: Chọn 2 trong 5 phần tử có `C(5,2) = 10` cách. Chọn đúng 1 trong 2 phần tử "đặc biệt" và 1
    trong 3 phần tử còn lại có `2·3 = 6` cách, nên xác suất là `6/10 = 0,6`.
  rubric_md: 'Output khớp từng dòng VÀ giải thích được tử số (cách chọn thoả điều kiện) trên mẫu số (mọi
    cách chọn). Đúng: bằng chứng điểm 1; sai: 0.'
- id: X643
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết hàm `bayes(prior, tpr, fpr)` trả xác suất bệnh khi xét nghiệm dương tính: `(tpr*prior)
    / (tpr*prior + fpr*(1-prior))`, với `prior = P(bệnh)`, `tpr = P(dương | bệnh)`, `fpr = P(dương | khoẻ)`
    (float trong `[0, 1]`). Trả float `round(·, 6)`. Nếu mẫu số bằng 0 thì trả `0.0`. Ví dụ: `bayes(0.01,
    0.99, 0.05)` cho `0.166667`.

    '
  problem_id: check-x643-bayes
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X644
  difficulty: 3
  type: read_code
  minutes: 6
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích hai
    con số đại diện cho xác suất nào.
  code: 'prior = {"A": 0.5, "B": 0.3, "C": 0.2}

    defect = {"A": 0.01, "B": 0.02, "C": 0.05}

    p = sum(prior[k] * defect[k] for k in prior)

    print(round(p, 4))

    post = prior["C"] * defect["C"] / p

    print(round(post, 4))'
  expected_output: '0.021

    0.4762'
  answer_md: 'Dòng 1 là xác suất toàn phần `P(lỗi) = 0,5·0,01 + 0,3·0,02 + 0,2·0,05 = 0,005 + 0,006 +
    0,01 = 0,021`. Dòng 2 là Bayes: `P(C | lỗi) = 0,2·0,05 / 0,021 = 0,01/0,021 ≈ 0,4762`, dù C chỉ chiếm
    20% sản lượng nhưng gây gần một nửa số lỗi.'
  rubric_md: 'Output khớp từng dòng VÀ nhận ra dòng 1 là xác suất toàn phần, dòng 2 là hậu nghiệm Bayes
    (tử số chia mẫu số toàn phần). Đúng: bằng chứng điểm 3; sai: tối đa điểm 2.'
