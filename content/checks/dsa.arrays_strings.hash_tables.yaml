- id: Q053
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: Vì sao tra cứu dict là O(1) trung bình? Điều gì làm nó thành O(n) trong trường hợp xấu? Khóa
    nào không dùng được?
  answer_md: Hàm băm đổi khóa thành chỉ số bucket. Nhiều khóa va chạm (collision) vào cùng bucket -> O(n).
    Khóa phải hashable (không dùng list/dict/set).
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 1; sai:
    tối đa điểm 0.'
