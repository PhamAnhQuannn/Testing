- id: X696
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    rating dự đoán của matrix factorization là tích vô hướng giữa vector user và vector item.
  code: 'user = [1, 2]

    items = {"i1": [3, 1], "i2": [0, 2], "i3": [2, 2]}

    scores = {k: sum(x * y for x, y in zip(user, v)) for k, v in items.items()}

    best = max(scores, key=scores.get)

    print(scores)

    print(best)

    print(4 - scores["i1"])'
  expected_output: '{''i1'': 5, ''i2'': 4, ''i3'': 6}

    i3

    -1'
  answer_md: i1 = 1·3 + 2·1 = 5; i2 = 1·0 + 2·2 = 4; i3 = 1·2 + 2·2 = 6. Điểm cao nhất là i3. Nếu rating
    thật của i1 là 4 thì sai số 4 − 5 = -1. Trong MF mỗi chiều ẩn là một sở thích ngầm; user và item càng
    cùng hướng (thành phần lớn cùng chiều) thì tích vô hướng càng lớn, nên điểm cao nghĩa là hợp.
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng rating dự đoán là tích vô hướng của vector ẩn (cùng
    hướng thì điểm cao). Đúng: bằng chứng điểm 3; sai: tối đa điểm 2.'
