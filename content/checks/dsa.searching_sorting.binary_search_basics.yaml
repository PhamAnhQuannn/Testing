- id: Q096
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: Với `lo, hi = 0, len(a) - 1` và `while lo <= hi`, vì sao dùng `mid = lo + (hi - lo) // 2`?
    Điều kiện dừng? Khi nào dùng `lo < hi`?
  answer_md: Tránh tràn số ở ngôn ngữ có overflow; Python không tràn nhưng giữ thói quen. `<=` khi tìm
    đúng giá trị và hai đầu đều là ứng viên; `<` kiểu "hi mở" (hi = len) tìm vị trí đầu tiên thoả điều
    kiện.
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 1; sai:
    tối đa điểm 0.'
