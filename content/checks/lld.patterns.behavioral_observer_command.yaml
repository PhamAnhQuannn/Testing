items:
- id: X585
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Giải thích 1 câu vì sao.
  code: "class Subject:\n    def __init__(self):\n        self.subs = []\n\n    def subscribe(self, fn):\n\
    \        self.subs.append(fn)\n\n    def unsubscribe(self, fn):\n        self.subs.remove(fn)\n\n\
    \    def notify(self, msg):\n        for fn in self.subs:\n            fn(msg)\n\n\ndef make(name):\n\
    \    def listener(msg):\n        print(name + \" got \" + msg)\n\n    return listener\n\n\nnews =\
    \ Subject()\na = make(\"A\")\nb = make(\"B\")\nnews.subscribe(a)\nnews.subscribe(b)\nnews.notify(\"\
    hi\")\nnews.unsubscribe(a)\nnews.notify(\"bye\")"
  expected_output: 'A got hi

    B got hi

    B got bye'
  answer_md: '`notify` gọi từng subscriber theo thứ tự đăng ký nên lần đầu A rồi B cùng nhận `hi`. Sau
    `unsubscribe(a)` chỉ còn B nên lần hai chỉ B nhận `bye`.'
  rubric_md: 'Output khớp VÀ nêu notify duyệt danh sách subscriber, unsubscribe bỏ A khỏi danh sách. Đúng:
    bằng chứng điểm 1; sai: tối đa điểm 0.'
- id: X586
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Viết `class Editor` theo mẫu Command, mô hình trình soạn thảo có hoàn tác. Constructor không
    tham số, văn bản ban đầu là `""`. `type(s)` nối `s` vào cuối và ghi lại thao tác; `delete(n)` xóa
    `n` ký tự cuối (nếu `n` lớn hơn độ dài thì xóa hết) và ghi lại thao tác; `undo()` hoàn nguyên thao
    tác gần nhất (không làm gì nếu chưa có thao tác nào); `text()` trả văn bản hiện tại. Ví dụ `type("ab")`,
    `type("cd")`, `undo()` thì `text()` là `"ab"`; `type("abc")`, `delete(10)`, `undo()` thì `text()`
    là `"abc"`.

    '
  problem_id: check-x586-editor-undo
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X587
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    người gửi không nhận lại tin của chính mình, và vì sao các thành viên không cần biết nhau (Mediator).
  code: "class ChatRoom:\n    def __init__(self):\n        self.members = []\n\n    def join(self, user):\n\
    \        self.members.append(user)\n        user.room = self\n\n    def send(self, sender, text):\n\
    \        for m in self.members:\n            if m is not sender:\n                m.receive(sender.name,\
    \ text)\n\n\nclass User:\n    def __init__(self, name):\n        self.name = name\n        self.room\
    \ = None\n        self.inbox = []\n\n    def say(self, text):\n        self.room.send(self, text)\n\
    \n    def receive(self, who, text):\n        self.inbox.append(who + \":\" + text)\n\n\nroom = ChatRoom()\n\
    an, binh, chi = User(\"an\"), User(\"binh\"), User(\"chi\")\nfor u in (an, binh, chi):\n    room.join(u)\n\
    an.say(\"hi\")\nbinh.say(\"yo\")\nprint(an.inbox)\nprint(binh.inbox)\nprint(chi.inbox)\nprint(len(room.members))"
  expected_output: '[''binh:yo'']

    [''an:hi'']

    [''an:hi'', ''binh:yo'']

    3'
  answer_md: '`say` chỉ gọi `room.send`; phòng chat (Mediator) chuyển tin cho mọi thành viên trừ `sender`
    (`m is not sender`). `an` chỉ nhận tin của `binh`, `binh` chỉ nhận tin của `an`, `chi` nhận cả hai
    theo thứ tự gửi. Các `User` không giữ tham chiếu tới nhau, chỉ biết phòng.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng vai trò điều phối của phòng chat. Đúng: bằng chứng
    điểm 3; sai: tối đa điểm 2.'
