- id: X582
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Giải thích 1 câu vì sao.
  code: "class Percent:\n    def __init__(self, p):\n        self.p = p\n\n    def apply(self, amount):\n\
    \        return amount * (100 - self.p) // 100\n\n\nclass Fixed:\n    def __init__(self, off):\n \
    \       self.off = off\n\n    def apply(self, amount):\n        return max(0, amount - self.off)\n\
    \n\nclass Cart:\n    def __init__(self, discount):\n        self.discount = discount\n        self.items\
    \ = []\n\n    def add(self, price):\n        self.items.append(price)\n\n    def total(self):\n  \
    \      return self.discount.apply(sum(self.items))\n\n\ncart = Cart(Percent(20))\ncart.add(100)\n\
    cart.add(50)\nprint(cart.total())\ncart.discount = Fixed(200)\nprint(cart.total())"
  expected_output: '120

    0'
  answer_md: Tạm tính 150; `Percent(20)` cho `150 * 80 // 100 = 120`. Sau khi gán `Fixed(200)`, `max(0,
    150 - 200)` là 0. Cart giữ strategy và giao việc cho nó (Strategy).
  rubric_md: 'Output khớp VÀ nêu context giao việc cho strategy đang giữ. Đúng: bằng chứng điểm 1; sai:
    tối đa điểm 0.'
- id: X583
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Viết `class Cart` theo Strategy: constructor không tham số (tạm tính 0, giảm giá mặc định
    `"none"`). `add(price)` cộng giá (int) vào tạm tính; `set_discount(kind)` chọn strategy theo tên (`"none"`,
    `"percent10"`, `"fixed50"`); `total()` trả int sau khi áp strategy hiện tại: `none` giữ nguyên, `percent10`
    là `subtotal * 90 // 100`, `fixed50` là `max(0, subtotal - 50)`. Ví dụ thêm 100 và 100 rồi `set_discount("percent10")`
    thì `total()` là 180.

    '
  problem_id: check-x583-cart-discount
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X584
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích máy
    đổi state ở những bước nào (State pattern).
  code: "class Waiting:\n    def insert(self, m):\n        print(\"coin accepted\")\n        m.state =\
    \ Paid()\n\n    def select(self, m):\n        print(\"insert coin first\")\n\n\nclass Paid:\n    def\
    \ insert(self, m):\n        print(\"already paid\")\n\n    def select(self, m):\n        m.stock -=\
    \ 1\n        print(\"dispense, left\", m.stock)\n        m.state = Waiting() if m.stock > 0 else SoldOut()\n\
    \n\nclass SoldOut:\n    def insert(self, m):\n        print(\"sold out\")\n\n    def select(self,\
    \ m):\n        print(\"sold out\")\n\n\nclass Machine:\n    def __init__(self, stock):\n        self.stock\
    \ = stock\n        self.state = Waiting()\n\n    def insert(self):\n        self.state.insert(self)\n\
    \n    def select(self):\n        self.state.select(self)\n\n\nm = Machine(2)\nm.select()\nm.insert()\n\
    m.insert()\nm.select()\nm.select()\nm.insert()\nm.select()\nm.insert()\nprint(type(m.state).__name__)"
  expected_output: 'insert coin first

    coin accepted

    already paid

    dispense, left 1

    insert coin first

    coin accepted

    dispense, left 0

    sold out

    SoldOut'
  answer_md: 'Máy bắt đầu ở `Waiting`: `select` chỉ in nhắc bỏ tiền. `insert` sang `Paid`; `insert` nữa
    in "already paid". `select` nhả hàng (kho 1) và về `Waiting`. Lặp lại `select`/`insert`/`select`:
    kho về 0 nên sang `SoldOut`; `insert` cuối in "sold out" và state cuối là `SoldOut`.'
  rubric_md: 'Output khớp từng dòng VÀ nêu đúng các bước chuyển state. Đúng: bằng chứng điểm 3; sai: tối
    đa điểm 2.'
