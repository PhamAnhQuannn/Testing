- id: Q230
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: Kỳ vọng của một con xúc xắc công bằng? Công thức Var(X)? Với X, Y độc lập thì E[XY] và Var(X+Y)?
  answer_md: 'E = 3.5. Var(X) = E[X^2] - (E[X])^2 (xúc xắc: 35/12). Độc lập: E[XY] = E[X]E[Y]; Var(X+Y)
    = Var X + Var Y.'
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 1; sai:
    tối đa điểm 0.'
- id: X645
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Viết hàm `expectation_variance(xs, ps)`: `xs` là list các giá trị của biến ngẫu nhiên rời
    rạc X, `ps` là list xác suất tương ứng (`ps[i] = P(X = xs[i])`, tổng xấp xỉ 1). Trả list `[E, Var]`
    với `E = Σ xs[i]·ps[i]` và `Var = Σ ps[i]·(xs[i] − E)²` (bằng `E[X²] − E[X]²`), mỗi số làm tròn `round(·,
    6)`. Ví dụ: `xs=[0,1]`, `ps=[0.5,0.5]` cho `[0.5, 0.25]`.

    '
  problem_id: check-x645-exp-var
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X646
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    `Var` tính bằng `E[X²] − E[X]²` lại không âm và cách linearity cho ra dòng cuối.
  code: 'xs = [0, 1, 2]

    ps = [0.5, 0.25, 0.25]

    e = sum(x * p for x, p in zip(xs, ps))

    e2 = sum(x * x * p for x, p in zip(xs, ps))

    var = e2 - e * e

    print(e)

    print(round(var, 4))

    print(round(var ** 0.5, 4))

    print(3 * e + 2)'
  expected_output: '0.75

    0.6875

    0.8292

    4.25'
  answer_md: 'E = 0·0,5 + 1·0,25 + 2·0,25 = 0,75. E[X²] = 0 + 0,25 + 1 = 1,25 nên Var = 1,25 − 0,5625
    = 0,6875 và std = √0,6875 ≈ 0,8292. Var = E[(X−E)²] là trung bình của số không âm nên không bao giờ
    âm. Dòng cuối: linearity E[3X + 2] = 3·E[X] + 2 = 4,25 (không cần phân phối của 3X+2).'
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng Var là trung bình bình phương độ lệch (không âm)
    và E[aX+b] = aE[X]+b. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2.'
