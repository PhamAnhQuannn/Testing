  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "prices = [1, 3, 2, 8, 4, 9]\nfee = 2\nhold, cash = -prices[0], 0\nfor p in prices[1:]:\n    cash\
    \ = max(cash, hold + p - fee)\n    hold = max(hold, cash - p)\n    print(p, cash, hold)\nprint(cash)"
  expected_output: '3 0 -1

    2 0 -1

    8 5 -1

    4 5 1

    9 8 1

    8'
  answer_md: Mỗi ngày `cash` là lợi nhuận tốt nhất khi không cầm cổ phiếu (bán thì trừ `fee = 2`), `hold`
    là khi đang cầm. Mua ở giá 1 bán ở giá 8 (lời 7 - 2 = 5), rồi mua ở 4 bán ở 9 (lời 5 - 2 = 3) cho
    tổng cuối `8`.
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
