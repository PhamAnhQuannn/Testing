subtopic_id: sd.data.probabilistic_structures
items:
- id: S070
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Ứng với mỗi câu hỏi, nêu cấu trúc xác suất (probabilistic data structure) phù hợp: (1) "phần
    tử

    này **đã thấy chưa**?"; (2) "có **bao nhiêu phần tử khác nhau**?"; (3) "**cái nào xuất hiện nhiều

    nhất** / mỗi cái mấy lần?". Một câu cho mỗi cái.

    '
  answer_md: '(1) "Đã thấy chưa?" (kiểm tra thành viên — set membership) → **Bloom filter**.

    (2) "Bao nhiêu cái khác nhau?" (đếm lực lượng — cardinality) → **HyperLogLog**.

    (3) "Cái nào nhiều nhất / mỗi cái mấy lần?" (tần suất, top-K) → **Count-Min Sketch** (thường kèm

    một **heap** để giữ top-K).

    Cả ba dùng bộ nhớ gần như **không phụ thuộc số phần tử**, đổi một chút sai số lấy bộ nhớ rất nhỏ.

    '
  rubric_md: 'Đạt khi ghép đúng cả ba: Bloom ↔ đã-thấy-chưa, HyperLogLog ↔ đếm-duy-nhất, Count-Min Sketch
    (+heap) ↔ tần suất/top-K. Đúng cả ba: bằng chứng điểm 1. Sai hoặc thiếu một cặp: tối đa điểm 0.'
- id: S071
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Một crawler cần tránh **tải lại** URL đã thấy. Đội đề xuất dùng **Bloom filter**. Hãy trả
    lời:

    (1) vì sao Bloom hợp ở đây dù nó có thể báo nhầm — và **loại sai số** nào nó **không bao giờ** mắc;

    (2) khi Bloom **báo nhầm** (false positive) một URL mới là "đã thấy" thì **hậu quả thực tế** là gì,

    có chấp nhận được không; (3) nêu **mức sai số** nên chọn và lý do không cần nhỏ hơn.

    '
  answer_md: '(1) Bloom hợp vì nó **không bao giờ bỏ sót (no false negative)**: URL đã thêm thì sau này
    luôn

    được nhận là "có thể đã thấy", nên crawler **không bao giờ tải lại** một URL đã crawl. Nó chỉ có

    thể **báo nhầm (false positive)** — nhận nhầm một URL mới là đã thấy.

    (2) Khi báo nhầm, crawler **bỏ qua** một URL thực ra là mới → mất một ít trang, nhưng **không tải

    lại trùng** và **không kẹt**. Với crawler, mất ~1% trang là **chấp nhận được** (còn hàng loạt

    đường dẫn khác tới cùng nội dung).

    (3) Chọn **p ≈ 1%** (~9.6 bit/phần tử): nhỏ hơn nữa (ví dụ 0.1% ≈ 14.4 bit) chỉ để giảm số trang

    bỏ sót không đáng kể mà tốn thêm ~50% bộ nhớ — không đáng cho bài này.

    '
  rubric_md: 'Đạt khi nêu đúng cả 3 ý: Bloom không có false negative nên không tải lại (điểm cốt lõi),
    false positive chỉ làm bỏ sót vài trang và chấp nhận được, chọn p~1% với lý do đánh đổi bộ nhớ. Đúng,
    trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu ý ''không false negative'' hoặc không
    nêu được hậu quả của báo nhầm: tối đa điểm 1.'
- id: S072
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: 'Một mạng video quy mô lớn cần ba thứ: (A) **đếm số người xem duy nhất** mỗi video (hàng
    trăm

    triệu lượt xem/video); (B) **top-10 video thịnh hành** trong giờ qua từ luồng sự kiện xem; (C)

    **lọc trùng** sự kiện xem đã xử lý (chống đếm hai lần), dự kiến **n = 2 tỉ (2×10⁹)** sự kiện,

    chịu báo nhầm **p = 1%**.

    Với mỗi mục: chọn **cấu trúc xác suất** phù hợp và nêu **mức sai số chấp nhận**. Riêng (C), **tính

    cỡ Bloom filter** cần (số bit/phần tử, tổng bit, quy ra byte) và nói rõ **loại sai số** Bloom mắc

    và không mắc. Cuối cùng: nếu một trong các con số này **dùng để tính tiền**, bạn xử lý khác thế nào?

    '
  answer_md: '(A) **Người xem duy nhất** → **HyperLogLog**: đếm lực lượng (cardinality) với sai số ~**2%**
    chỉ

    trong ~**1.5 KB**/video, không phụ thuộc số lượt xem, gộp được theo ngày/tuần. 2% lệch cho chỉ

    số "người xem duy nhất" là chấp nhận được.

    (B) **Top-10 thịnh hành** → **Count-Min Sketch + heap**: CMS đếm tần suất gần đúng (chỉ **đếm

    dư, không đếm thiếu**; lấy **min** khi hỏi), heap giữ 10 video có số đếm lớn nhất. Sai số: thứ

    hạng có thể lệch nhẹ ở các video đếm thấp, nhưng top-K nóng thì ổn định — chấp nhận được cho bảng

    "thịnh hành".

    (C) **Lọc trùng** → **Bloom filter**, p = 1%. Cỡ: m ≈ −n·ln(p)/(ln2)² = −ln(0.01)/0.48 ≈

    4.6/0.48 ≈ **9.6 bit/phần tử**. Với n = 2×10⁹: m ≈ 9.6 × 2×10⁹ = **1.92×10¹⁰ bit**, chia 8 ≈

    **2.4×10⁹ byte ≈ 2.4 GB**. (Số hàm băm tối ưu k = (m/n)·ln2 ≈ 9.6 × 0.69 ≈ **7**.) Bloom **không

    bao giờ bỏ sót (no false negative)** — một sự kiện đã xử lý thì luôn bị nhận là "đã thấy" nên

    không bị đếm lại; nó chỉ **báo nhầm (false positive)** ~1% — thỉnh thoảng bỏ qua một sự kiện mới

    vì tưởng đã thấy.

    **Nếu con số dùng để tính tiền:** không lấy cấu trúc xác suất làm **nguồn sự thật**. Dùng chúng

    cho dashboard/ước lượng thời gian thực, còn số tính tiền thì **đối soát lại bằng mẻ (batch)

    chính xác** cuối ngày (đếm đúng từ log thô), vì 1–2% sai hay false positive là không chấp nhận

    được khi liên quan tới tiền.

    '
  rubric_md: 'Đạt (mức phỏng vấn, theo mastery bar mức 3) khi: (A) chọn HyperLogLog + nêu ~2% sai số;
    (B) chọn Count-Min Sketch + heap + nêu tính đếm-dư/lấy-min; (C) chọn Bloom, **tính đúng cỡ** (≈9.6
    bit/phần tử → ≈2.4 GB cho 2×10⁹ ở p=1%) và nói đúng Bloom không có false negative chỉ có false positive;
    và nêu được rằng số tính tiền phải đối soát bằng mẻ chính xác, không dùng cấu trúc xác suất làm nguồn
    sự thật. Đúng, trong time-box, số liệu đúng, tự giải thích rõ: bằng chứng điểm 3. Sai cỡ Bloom, chọn
    nhầm cấu trúc cho một mục, hoặc không nêu được giới hạn ''tính tiền'': chưa đạt mức 3.'
