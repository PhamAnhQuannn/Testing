items:
- id: Q160
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Đề kiểu "thiết kế class có nhiều level" (ví dụ ngân hàng, in-memory DB): 5 việc đầu tiên
    bạn làm trước khi code là gì?'
  answer_md: Đọc kỹ input/output format; liệt kê các thao tác; hỏi biên (id trùng, số âm, thiếu khoá);
    chọn cấu trúc dữ liệu chính (dict); viết khung class + test ví dụ của đề; code level 1 xong chạy thử
    rồi mới sang level sau (không viết lại).
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 1; sai:
    tối đa điểm 0.'
- id: Q161
  difficulty: 2
  type: concept
  minutes: 3
  prompt_md: Level 2 yêu cầu thêm "top N theo tổng chi tiêu". Làm sao thêm mà không phá level 1? Nêu 2
    cách và trade-off.
  answer_md: Thêm trường tổng chi tiêu vào cấu trúc hiện có rồi sắp khi gọi (đơn giản, O(n log n)/lần)
    hoặc giữ heap/dict phụ (nhanh hơn nhưng phức tạp, dễ sai khi cập nhật). Nêu rõ mình bắt đầu bằng cách
    đơn giản rồi tối ưu nếu cần.
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 2; sai:
    tối đa điểm 1.'
- id: W218
  difficulty: 2
  type: concept
  minutes: 3
  prompt_md: Đề practical nói "mọi thao tác đầu vào là list lệnh, ví dụ ["create A 100", "transfer A B
    30"]". Bạn thiết kế hàm xử lý lệnh thế nào để thêm lệnh mới ở level sau mà không sửa nhiều chỗ?
  answer_md: 'Tách parse (chuỗi -> lệnh) và thi hành; dùng dict {tên lệnh: method}; mỗi level chỉ thêm
    method; trả kết quả dạng chuỗi/None đúng format đề; viết test từ ví dụ của đề trước.'
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 2; sai:
    tối đa điểm 1.'
- id: X537
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Viết `run_kv(commands)`: mỗi phần tử là một lệnh chuỗi dạng "SET k v", "GET k" hoặc "DEL
    k".

    Thực hiện lần lượt; với mỗi "GET k" thêm vào danh sách kết quả giá trị (chuỗi) của k, hoặc ""

    nếu k không tồn tại. Trả danh sách kết quả của các lệnh GET theo thứ tự. Gợi ý: tách lệnh rồi

    điều phối theo từ khoá đầu (parse-then-dispatch), đúng tinh thần bài practical nhiều mức.

    '
  problem_id: check-x537-command-interpreter
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X536
  difficulty: 3
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu về cách `pay` và `top` tương
    tác.
  code: "class Bank:\n    def __init__(self):\n        self.bal = {}\n        self.spent = {}\n      \
    \  self.handlers = {\n            \"open\": self.open,\n            \"dep\": self.dep,\n         \
    \   \"pay\": self.pay,\n            \"top\": self.top,\n        }\n\n    def open(self, name):\n \
    \       self.bal[name] = 0\n        self.spent[name] = 0\n\n    def dep(self, name, amt):\n      \
    \  self.bal[name] += int(amt)\n\n    def pay(self, name, amt):\n        amt = int(amt)\n        if\
    \ self.bal[name] < amt:\n            return \"fail\"\n        self.bal[name] -= amt\n        self.spent[name]\
    \ += amt\n        return \"ok\"\n\n    def top(self, n):\n        ranked = sorted(self.spent, key=lambda\
    \ k: (-self.spent[k], k))\n        return \",\".join(ranked[:int(n)])\n\n    def run(self, line):\n\
    \        cmd, *args = line.split()\n        return self.handlers[cmd](*args)\n\nb = Bank()\nfor line\
    \ in [\"open a\", \"open b\", \"dep a 10\", \"dep b 10\", \"pay a 4\", \"pay b 4\",\n            \
    \ \"pay a 7\", \"pay b 6\", \"top 1\", \"top 2\"]:\n    r = b.run(line)\n    if r is not None:\n \
    \       print(r)"
  expected_output: 'ok

    ok

    fail

    ok

    b

    b,a'
  answer_md: '`pay a 7` thất bại vì số dư của a chỉ còn 6 nên không tăng `spent`; `pay b 6` thành công
    nên b chi 4 + 6 = 10 còn a chỉ 4. Do đó `top 1` là `b` và `top 2` là `b,a`. Lệnh `open`, `dep` trả
    `None` nên không in gì.'
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 3; sai: tối đa điểm 1.'
