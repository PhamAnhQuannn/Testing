- id: X495
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "root = {}\nfor w in [\"ab\", \"abc\", \"b\"]:\n    node = root\n    for ch in w:\n        node\
    \ = node.setdefault(ch, {})\n    node[\"$\"] = True\n\ndef walk(s):\n    node = root\n    for i, ch\
    \ in enumerate(s):\n        if ch not in node:\n            return -1\n        node = node[ch]\n \
    \       if \"$\" in node:\n            return i\n    return len(s)\n\nprint(walk(\"abcd\"), walk(\"\
    bz\"), walk(\"ax\"))\nprint(sorted(root), sorted(root[\"a\"][\"b\"]))"
  expected_output: '1 0 -1

    [''a'', ''b''] [''$'', ''c'']'
  answer_md: '`walk` dừng ở cờ `"$"` đầu tiên: `"abcd"` gặp cờ sau `ab` (chỉ số 1), `"bz"` gặp cờ ngay
    sau `b` (chỉ số 0), còn `"ax"` đi tới `a` (không có cờ) rồi `x` không tồn tại nên trả -1. Gốc có con
    `a` và `b`; node `a`-`b` vừa là hết từ `ab` (khóa `"$"`) vừa có con `c`.'
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
- id: X496
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Viết `replace_words(dictionary, sentence)`: `dictionary` là danh sách các root, `sentence`
    là các từ cách nhau bằng một dấu cách. Thay mỗi từ bằng root NGẮN nhất trong `dictionary` là tiền
    tố của nó (không có root nào thì giữ nguyên từ), trả về câu kết quả. `replace_words(["cat", "bat",
    "rat"], "the cattle was rattled")` là `"the cat was rat"`. Gợi ý: dựng trie từ các root, đi dọc từng
    từ và dừng ở cờ kết thúc đầu tiên.

    '
  problem_id: check-x496-replace-words
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
