  prompt_md: 'Viết `longest_word(words)`: trả về từ dài nhất trong `words` có thể xây từng ký tự một bởi
    các từ khác trong `words` (mọi tiền tố của nó, kể cả bản thân, đều nằm trong `words`). Hòa chiều dài
    thì lấy từ nhỏ nhất theo thứ tự từ điển; không có từ nào thì trả `""`. `longest_word(["w", "wo", "wor",
    "worl", "world"])` là `"world"`. Gợi ý: sắp xếp từ rồi chỉ chấp nhận từ có tiền tố bỏ ký tự cuối đã
    hợp lệ, hoặc DFS trên trie.

    '
