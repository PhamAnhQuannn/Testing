subtopic_id: py.oop.dataclasses_enums
items:
- id: X381
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "from dataclasses import dataclass, field\nfrom enum import Enum\n\n@dataclass(order=True)\nclass\
    \ Task:\n    pri: int\n    name: str = \"x\"\n    tags: list = field(default_factory=list)\n\nclass\
    \ Mode(Enum):\n    ON = 1\n    OFF = 0\n\na = Task(2, \"b\")\nb = Task(2, \"b\")\na.tags.append(\"\
    t\")\nprint(a == b, a < Task(3))\nprint(b.tags, [m.name for m in Mode], Mode(0).value)"
  expected_output: 'False True

    [] [''ON'', ''OFF''] 0'
  answer_md: '`a.tags` có `"t"` còn `b.tags` rỗng (mỗi object có list riêng nhờ `default_factory`), nên
    `==` so sánh từng field cho `False`. `order=True` so sánh theo `(pri, name, tags)`: `2 < 3` nên `a
    < Task(3)` là `True`. Enum lặp theo thứ tự khai báo và `Mode(0)` là `OFF` có value `0`.'
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
- id: X382
  difficulty: 2
  type: write_code
  minutes: 5
  prompt_md: 'Viết `build_roster(pairs)` với `pairs` là list `[tên, điểm]`. Định nghĩa `@dataclass(order=True)
    class Player` có field theo thứ tự `score: int`, `name: str`, `badges: list` (mặc định list rỗng,
    dùng `default_factory`). Tạo một `Player` cho mỗi cặp; nếu điểm >= 90 thì thêm `"top"` vào `badges`.
    Trả list chuỗi `"tên:số_badge"` của các player đã sắp xếp (dùng `sorted` trên chính các object, tức
    theo điểm rồi tên, tăng dần).

    '
  problem_id: check-x382-build-roster
  rubric_md: 'Pass toàn bộ test ẩn. Đúng không gợi ý trong time-box (5 phút): bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X383
  difficulty: 3
  type: write_code
  minutes: 12
  prompt_md: 'Viết `summarize_orders(rows)` với `rows` là list `[tên_trạng_thái, số_tiền]`. Định nghĩa
    `class Status(Enum)` với `NEW = 1`, `PAID = 2`, `SHIPPED = 3` và `@dataclass(frozen=True) class Order`
    có field `status: Status`, `amount: int`. Tạo `Order(Status[tên], số_tiền)` cho mỗi dòng. Trả list
    chuỗi: với từng member của `Status` theo thứ tự khai báo, `"TÊN:tổng_tiền"` (0 nếu không có đơn);
    cuối cùng thêm `"distinct:n"` với `n` là số đơn khác nhau (đếm bằng `set` các `Order`, tức cùng trạng
    thái và số tiền chỉ tính một).

    '
  problem_id: check-x383-summarize-orders
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 12 phút: bằng chứng điểm 3; phải xem
    gợi ý hoặc quá thời gian: tối đa điểm 2.'
