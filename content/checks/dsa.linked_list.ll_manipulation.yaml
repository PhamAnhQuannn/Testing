- id: X349
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "class Node:\n    def __init__(self, val, nxt=None):\n        self.val = val\n        self.next\
    \ = nxt\n\nhead = Node(1, Node(2, Node(3)))\nprev = None\ncur = head\nwhile cur:\n    nxt = cur.next\n\
    \    cur.next = prev\n    prev = cur\n    cur = nxt\nout = []\nwhile prev:\n    out.append(prev.val)\n\
    \    prev = prev.next\nprint(out)\n"
  expected_output: '[3, 2, 1]'
  answer_md: Vòng lặp đảo con trỏ next của từng node về node trước (prev/cur/nxt), nên list 1->2->3 thành
    3->2->1.
  rubric_md: 'Output khớp VÀ giải thích đúng ý đảo con trỏ bằng ba biến prev/cur/nxt. Đúng: bằng chứng
    điểm 1; sai: điểm 0.'
