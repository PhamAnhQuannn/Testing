subtopic_id: sd.async.event_driven_patterns
items:
- id: S121
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Kể tên **bốn mẫu hướng sự kiện** đã học và với **mỗi mẫu** nói **một câu** về vấn đề nó
    giải.

    '
  answer_md: "- **Event sourcing:** lưu **nhật ký các sự kiện (log of events)** bất biến làm nguồn sự\
    \ thật và\n  dựng lại trạng thái bằng **replay** (có audit/time-travel).\n- **CQRS:** tách **mô hình\
    \ ghi (write model)** khỏi **mô hình đọc (read model)** để scale và tối\n  ưu đường đọc độc lập với\
    \ đường ghi.\n- **Saga:** biến một giao dịch dài qua nhiều service thành **chuỗi giao dịch cục bộ\
    \ + bước bù\n  (compensating action)** thay cho khóa 2PC.\n- **Outbox:** ghi sự kiện vào **bảng outbox\
    \ trong cùng giao dịch DB** với dữ liệu rồi đẩy ra\n  queue, để không mất tin giữa \"ghi DB\" và \"\
    gửi queue\".\n"
  rubric_md: 'Đạt khi nêu đủ bốn tên đúng (event sourcing, CQRS, saga, outbox) và gắn đúng vấn đề một
    câu cho mỗi mẫu. Đúng cả bốn: bằng chứng điểm 1; sai/thiếu từ một mẫu trở lên: chưa đạt.'
- id: S122
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Một trang sản phẩm **đọc rất nhiều, ghi ít**; đội muốn tối ưu riêng đường đọc để trang nhanh
    mà

    không làm phức tạp đường ghi. (1) Mẫu nào phù hợp nhất và **luồng** của nó ra sao? (2) **Cái giá**

    phải trả là gì (người dùng thấy điều gì)? (3) Nếu đây chỉ là một **app CRUD nhỏ, một DB**, có nên

    dùng mẫu đó không — vì sao?

    '
  answer_md: '(1) Dùng **CQRS**: tách mô hình ghi khỏi mô hình đọc. Luồng: lệnh (command) đến **mô hình
    ghi**

    đến phát **sự kiện** đến một tiến trình nghe sự kiện và dựng **bảng đọc làm sẵn (read model /

    projection)** cho trang sản phẩm (ví dụ sẵn tên, giá, số đánh giá); truy vấn của khách đọc thẳng

    bảng đọc đó. Nhờ vậy đường đọc được scale/tối ưu độc lập (thêm bản sao, thêm chỉ mục) mà không

    đụng đường ghi.

    (2) Cái giá: **nhất quán cuối cùng (eventual consistency)** — bảng đọc cập nhật sau mô hình ghi

    vài giây nên khách có thể thấy dữ liệu hơi cũ; và có **nhiều bộ phận hơn** phải vận hành/đồng bộ

    (đường sự kiện, tiến trình dựng bảng, bảng đọc).

    (3) **Không nên** nếu chỉ là CRUD nhỏ một DB: một bảng đã đủ phục vụ cả đọc lẫn ghi; thêm CQRS

    chỉ rước lấy nhất quán cuối cùng và nhiều bộ phận phải đồng bộ — độ phức tạp thừa.

    '
  rubric_md: 'Đạt khi nêu đúng cả 3 ý: chọn CQRS và mô tả đúng luồng ghi-sự kiện-bảng đọc; nêu cái giá
    là nhất quán cuối cùng (và nhiều bộ phận hơn); và nói đúng rằng CRUD nhỏ không nên dùng vì thêm phức
    tạp thừa. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu ý nhất quán cuối cùng
    hoặc không nêu được ''khi nào không nên dùng'': tối đa điểm 1.'
- id: S123
  difficulty: 3
  type: concept
  minutes: 12
  prompt_md: 'Trình bày ở mức phỏng vấn: với **mỗi mẫu trong bốn mẫu** (event sourcing, CQRS, saga, outbox),

    (1) nêu **vấn đề nó giải**, (2) **vẽ/mô tả luồng** cho ví dụ **đặt hàng đến thanh toán (order đến

    payment)**, và (3) nói **khi nào KHÔNG nên dùng**.

    '
  answer_md: "- **Event sourcing** — Vấn đề: cần lịch sử/kiểm toán đầy đủ và dựng lại được trạng thái.\
    \ Luồng\n  order: thay vì lưu trạng thái đơn hiện tại, lưu nhật ký sự kiện OrderCreated, InventoryReserved,\n\
    \  PaymentCharged, Shipped; trạng thái đơn = replay chuỗi này (snapshot định kỳ nếu dài). Không\n\
    \  dùng khi: không cần audit, chỉ cần đọc trạng thái nhanh — replay và schema evolution thành gánh\n\
    \  nặng, sửa dữ liệu sai khó.\n- **CQRS** — Vấn đề: tối ưu đường đọc độc lập với đường ghi. Luồng\
    \ order: lệnh đặt hàng ghi vào\n  mô hình ghi và phát sự kiện; một projection dựng **bảng đọc trạng\
    \ thái đơn** cho màn hình \"đơn\n  của tôi\" / bảng theo dõi. Không dùng khi: tải đọc-ghi cân bằng,\
    \ một bảng là đủ — thêm CQRS chỉ\n  tạo nhất quán cuối cùng và nhiều bộ phận phải đồng bộ.\n- **Saga**\
    \ — Vấn đề: giao dịch qua nhiều service không nên khóa bằng 2PC. Luồng order: tạo đơn\n  đến **giữ\
    \ hàng** đến **trừ tiền** đến **giao vận**; nếu trừ tiền lỗi thì chạy bước bù ngược\n  (nhả hàng,\
    \ hủy đơn), nếu giao vận lỗi thì hoàn tiền rồi nhả hàng. Chọn orchestration (một điều\n  phối viên)\
    \ hay choreography (service tự nghe sự kiện). Không dùng khi: thao tác gọn trong một\n  DB — một giao\
    \ dịch cục bộ là đủ.\n- **Outbox** — Vấn đề: ghi DB và gửi sự kiện ra queue không nguyên tử, dễ mất\
    \ tin khi máy chết\n  giữa chừng. Luồng order: khi trừ tiền xong, ghi dữ liệu đơn và một dòng sự kiện\
    \ PaymentCharged\n  vào **bảng outbox trong cùng giao dịch**; một relay/CDC đọc bảng và publish ra\
    \ queue cho service\n  giao vận. Không dùng khi: không cần phát sự kiện ra ngoài, hoặc đã có cách\
    \ khác bảo đảm nguyên tử.\nChốt: mọi mẫu đều thêm độ phức tạp — một app CRUD đơn giản (một DB, một\
    \ service) thường không cần\nmẫu nào.\n"
  rubric_md: 'Đạt (mức phỏng vấn / mức 3 theo mastery_bar) khi: với CẢ BỐN mẫu đều nêu đúng (1) vấn đề
    nó giải, (2) một luồng order-đến-payment hợp lý, và (3) một điều kiện ''khi không nên dùng''; cộng
    với saga mô tả đúng bước bù khi một bước hỏng và outbox đúng ý ''cùng một giao dịch DB''. Đúng, trong
    time-box, tự giải thích rành mạch: bằng chứng điểm 3. Sót một mẫu, hoặc thiếu vế ''vẽ luồng'' / ''khi
    không nên dùng'' ở từ một mẫu trở lên: chưa đạt mức 3.'
