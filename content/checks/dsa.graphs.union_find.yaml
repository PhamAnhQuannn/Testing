items:
- id: X451
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "parent = list(range(5))\nsize = [1] * 5\n\ndef find(x):\n    while parent[x] != x:\n        parent[x]\
    \ = parent[parent[x]]\n        x = parent[x]\n    return x\n\ndef union(a, b):\n    ra, rb = find(a),\
    \ find(b)\n    if ra == rb:\n        return False\n    if size[ra] < size[rb]:\n        ra, rb = rb,\
    \ ra\n    parent[rb] = ra\n    size[ra] += size[rb]\n    return True\n\nprint(union(0, 1), union(1,\
    \ 2), union(0, 2))\nprint(parent)\nprint(find(2) == find(0), find(3) == find(0))"
  expected_output: 'True True False

    [0, 0, 0, 3, 4]

    True False'
  answer_md: Hai `union` đầu thành công và gộp 0, 1, 2 vào cùng tập (root 0, vì tập lớn hơn làm root);
    `union(0, 2)` thấy cùng root nên trả `False`. Mảng `parent` là `[0, 0, 0, 3, 4]` (3 và 4 vẫn tự là
    root), nên `find(2) == find(0)` đúng còn `find(3) == find(0)` sai.
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
