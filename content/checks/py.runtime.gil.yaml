- id: X722
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết hàm `simulate_counter(schedule)` mô phỏng `counter += 1` không nguyên tử của nhiều
    thread. Có một số nguyên dùng chung `shared` bắt đầu bằng 0; mỗi thread có biến cục bộ riêng bắt đầu
    bằng 0. `schedule` là list các cặp `[action, thread_id]`: `"R"` nghĩa là thread đọc (`local = shared`),
    `"W"` nghĩa là thread ghi (`shared = local + 1`). Xử lý theo đúng thứ tự và trả `shared` cuối cùng.
    Ví dụ `[["R",0],["R",1],["W",0],["W",1]]` cho `1` (lost update), còn `[["R",0],["W",0],["R",1],["W",1]]`
    cho `2`.

    '
  problem_id: check-x722-counter
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X723
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    có GIL mà `x += 1` vẫn cần lock.
  code: "def run(steps):\n    shared = 0\n    local = {}\n    for act, t in steps:\n        if act ==\
    \ \"R\":\n            local[t] = shared\n        else:\n            shared = local[t] + 1\n    return\
    \ shared\n\n\na = run([(\"R\", \"A\"), (\"W\", \"A\"), (\"R\", \"B\"), (\"W\", \"B\")])\nb = run([(\"\
    R\", \"A\"), (\"R\", \"B\"), (\"W\", \"B\"), (\"W\", \"A\")])\nc = run([(\"R\", \"A\"), (\"R\", \"\
    B\"), (\"W\", \"A\"), (\"R\", \"A\"), (\"W\", \"A\"), (\"W\", \"B\")])\nprint(a, b, c)\nprint(run([]))"
  expected_output: '2 1 1

    0'
  answer_md: 'a: tuần tự nên 1 rồi 2, kết quả 2. b: A và B cùng đọc 0, B ghi 1, A ghi 1, kết quả 1. c:
    B đọc 0 từ đầu; A ghi 1, đọc 1, ghi 2; nhưng B ghi 0 + 1 = 1 đè lên, kết quả 1. run([]) trả 0. GIL
    chỉ đảm bảo từng lệnh bytecode không bị cắt ngang, còn `x += 1` gồm đọc, cộng, ghi; thread khác có
    thể xen vào giữa các bước nên vẫn cần threading.Lock.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng: x += 1 không nguyên tử (đọc-cộng-ghi), GIL không
    bảo vệ cả chuỗi nên cần lock. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2.'
