  prompt_md: Chạy tay (không chạy máy), đoạn code tách trách nhiệm (SRP) in ra gì? Giải thích 1 câu.
  code: "class Mailer:\n    def __init__(self):\n        self.sent = []\n\n    def send(self, msg):\n\
    \        self.sent.append(msg)\n\n\nclass Invoice:\n    def __init__(self, items):\n        self.items\
    \ = items\n\n    def total(self):\n        return sum(self.items)\n\n\ninv = Invoice([3, 4, 5])\n\
    mailer = Mailer()\nmailer.send(\"total=\" + str(inv.total()))\nprint(len(mailer.sent), mailer.sent[0])"
  expected_output: 1 total=12
  answer_md: '`Invoice` chỉ tính tiền, `Mailer` chỉ gửi và lưu tin. `total()` = 3 + 4 + 5 = 12, tin nhắn
    là `total=12`, danh sách `sent` có 1 phần tử nên in `1 total=12`.'
  rubric_md: 'Output khớp VÀ nêu được mỗi class một trách nhiệm. Đúng: bằng chứng điểm 1; sai: tối đa
