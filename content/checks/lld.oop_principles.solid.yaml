- id: X569
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dependency injection in ra gì? Ghi đúng từng dòng và
    giải thích vì sao `Order` dễ test.
  code: "class FakeMailer:\n    def __init__(self):\n        self.sent = []\n\n    def send(self, to,\
    \ text):\n        self.sent.append(to + \":\" + text)\n        return len(self.sent)\n\n\nclass Order:\n\
    \    def __init__(self, mailer):\n        self.mailer = mailer\n        self.lines = []\n\n    def\
    \ add(self, name, qty):\n        self.lines.append((name, qty))\n\n    def checkout(self, to):\n \
    \       count = sum(q for _, q in self.lines)\n        return self.mailer.send(to, \"items=\" + str(count))\n\
    \n\nm = FakeMailer()\no = Order(m)\no.add(\"pen\", 2)\no.add(\"ink\", 3)\nprint(o.checkout(\"an\"\
    ))\no.add(\"cap\", 1)\nprint(o.checkout(\"binh\"))\nprint(m.sent)\nprint(Order(m).mailer is m)"
  expected_output: '1

    2

    [''an:items=5'', ''binh:items=6'']

    True'
  answer_md: '`Order` nhận `mailer` qua `__init__` (DI) nên dùng được `FakeMailer`. Lần checkout đầu:
    2 + 3 = 5 món, tin thứ 1 nên trả `1`. Thêm `cap` thì 6 món, tin thứ 2 nên trả `2`. `sent` giữ cả hai
    tin. `Order(m).mailer is m` là `True` vì object được tiêm, không bị tạo lại.'
  rubric_md: 'Output khớp từng ký tự VÀ giải thích lợi ích của việc tiêm mailer. Đúng: bằng chứng điểm
    3; sai: tối đa điểm 2.'
