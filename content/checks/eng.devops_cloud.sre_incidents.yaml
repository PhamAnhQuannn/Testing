subtopic_id: eng.devops_cloud.sre_incidents
items:
- id: E163
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Phân biệt **SLI**, **SLO** và **SLA**, và nói **error budget** là gì.

    '
  answer_md: "- **SLI**: số đo chất lượng dịch vụ (ví dụ tỉ lệ request thành công).\n- **SLO**: mục tiêu\
    \ nội bộ cho SLI (ví dụ 99,9% trong 30 ngày).\n- **SLA**: cam kết với khách hàng, thường có đền bù\
    \ khi vi phạm.\n- **Error budget** = 1 - SLO: mức không tin cậy còn được phép. Còn ngân sách thì ra\
    \ tính năng;\n  hết thì đóng băng thay đổi rủi ro và ưu tiên ổn định.\n"
  rubric_md: 'Đạt khi phân biệt đúng SLI (số đo) / SLO (mục tiêu nội bộ) / SLA (cam kết với khách) và
    nêu error budget = 1 - SLO kèm ý nghĩa. Đủ ý: bằng chứng điểm 1; nhầm SLO với SLA hoặc không nêu error
    budget: điểm 0.'
- id: E164
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Dịch vụ có **SLO 99,9%** request thành công trong 30 ngày. (a) Tính ngân sách lỗi theo thời
    gian

    (phút) nếu coi lỗi là thời gian không khả dụng. (b) Điều gì xảy ra khi dùng hết ngân sách?

    (c) Kể các bước xử lý một sự cố production từ lúc nhận cảnh báo đến khi đóng, nói rõ bước nào đi trước.

    '
  answer_md: '**(a)** 30 ngày = 43.200 phút; error budget = 0,1% nên khoảng **43,2 phút**.


    **(b)** Hết ngân sách: dừng hoặc đóng băng các bản phát hành rủi ro, ưu tiên công việc ổn định

    (sửa nguyên nhân gây lỗi, tăng độ tin cậy) cho đến khi ngân sách phục hồi.


    **(c)** 1) **Detect** (cảnh báo cho on-call); 2) **Triage**: đánh giá phạm vi, gán severity, escalate

    nếu cần; 3) **Mitigate**: khôi phục dịch vụ trước (rollback, tắt feature flag, scale, chuyển traffic),

    chưa cần biết nguyên nhân gốc; 4) **Resolve** và theo dõi ổn định, thông báo (communication) trong
    suốt

    quá trình; 5) **Postmortem** và tìm root cause. Mitigate đi trước root cause.

    '
  rubric_md: 'Đạt khi: (a) ra khoảng 43 phút (43200 x 0,001); (b) nêu đóng băng release rủi ro, ưu tiên
    ổn định; (c) nêu đủ chuỗi detect, triage/severity, mitigate, resolve, postmortem và nhấn mạnh mitigate
    trước tìm nguyên nhân. Đủ (a)-(c): bằng chứng điểm 2. Tính sai ngân sách hoặc cho tìm root cause trước
    khi khôi phục dịch vụ: tối đa điểm 1.'
- id: E165
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: 'Bạn là SRE của một API thanh toán nội bộ. (a) Đề xuất một **SLO** hợp lý (chọn SLI, ngưỡng,
    cửa sổ)

    và giải thích cách dùng **error budget**. (b) Một đêm, ổ đĩa của database đầy làm API lỗi; mô tả cách

    on-call xử lý. (c) Viết **blameless postmortem** ngắn cho sự cố này gồm timeline, nguyên nhân gốc
    mang

    tính hệ thống và **3 action items** cụ thể.

    '
  answer_md: "**(a) SLO:** SLI là tỉ lệ request trả về không phải lỗi 5xx (và có thể thêm tỉ lệ request\
    \ phản hồi\ndưới 500 ms); SLO ví dụ **99,9% thành công trong 30 ngày** (ngân sách khoảng 43 phút).\
    \ Đừng chọn 100%.\nĐo từ phía người dùng/load balancer. Ngân sách còn thì phát hành bình thường; sắp\
    \ hết hoặc hết thì\nđóng băng release rủi ro, ưu tiên ổn định.\n\n**(b) Xử lý:** cảnh báo triệu chứng\
    \ (tỉ lệ lỗi) đánh thức on-call; **triage**: xác định severity cao do\nthanh toán lỗi, mở kênh sự\
    \ cố, phân vai (commander, responder, communications), escalate cho DBA nếu cần.\n**Mitigate trước**:\
    \ giải phóng chỗ (xóa **log ứng dụng/dữ liệu tạm an toàn** theo runbook, **không xóa file WAL/data\
    \ bằng tay**) hoặc mở rộng volume, chuyển sang\nreplica nếu có; xác nhận lỗi giảm. Rồi **resolve**,\
    \ cập nhật trạng thái. Root cause tìm sau.\n\n**(c) Postmortem (blameless):**\n- Tóm tắt và tác động:\
    \ API thanh toán lỗi X phút, ảnh hưởng Y% request.\n- Timeline: giờ cảnh báo, giờ nhận, giờ mitigate,\
    \ giờ khôi phục.\n- Nguyên nhân hệ thống: không có cảnh báo dung lượng sớm; log không được giới hạn/retention,\
    \ WAL bị ứ (archiving hỏng hay replication slot kẹt);\n  runbook thiếu bước này (không đổ cho cá nhân\
    \ nào).\n- Action items (có chủ sở hữu, hạn): 1) thêm cảnh báo khi dung lượng đạt 80%; 2) cấu hình\
    \ log rotation/\n  retention và tự động mở rộng volume (giảm toil); 3) bổ sung runbook cho \"đĩa đầy\"\
    \ và diễn tập.\n"
  rubric_md: 'Đạt mức 3 khi đủ ba phần: (a) SLO có SLI, ngưỡng, cửa sổ hợp lý (không 100%) cùng cách dùng
    error budget; (b) quy trình incident có triage/severity, vai trò, mitigate trước root cause, resolve;
    (c) postmortem blameless có timeline, nguyên nhân hệ thống (không đổ lỗi cá nhân) và 3 action items
    cụ thể, có thể đo được (ưu tiên có chủ sở hữu/hạn). Đủ cả ba trong time-box: bằng chứng điểm 3. Thiếu
    một phần, đổ lỗi cá nhân hoặc action item mơ hồ kiểu "cẩn thận hơn": chưa đạt mức 3.'
