- id: X880
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết hàm `simplify_order(terms)` rút gọn tiệm cận của một biểu thức chi phí. `terms` là
    list các cặp `[coeff, exp]` (coeff, exp là số nguyên >= 0) biểu diễn tổng `coeff * n^exp`. Theo phân
    tích Big-O, bỏ hệ số và các số hạng bậc thấp: trả về **số mũ lớn nhất** trong các số hạng có `coeff
    > 0`. Nếu `terms` rỗng hoặc mọi coeff đều bằng 0 thì trả `0`. Ví dụ `simplify_order([[3,2],[100,1],[50,0]])`
    trả `2` (3n^2 + 100n + 50 là O(n^2)), `simplify_order([[0,5],[7,1]])` trả `1`.

    '
  problem_id: check-x880-simplify-order
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc
