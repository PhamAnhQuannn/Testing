- id: X881
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và cho biết Big-O
    của f(n) cùng chi phí ẩn của vòng for thứ hai.
  code: "def f(n):\n    c = 0\n    i = 1\n    while i < n:\n        j = 0\n        while j < n:\n    \
    \        c += 1\n            j += 1\n        i *= 2\n    return c\n\n\nprint(f(8), f(16))\nitems =\
    \ [1, 2, 3, 4]\nops = 0\nfor x in items:\n    if x in items:\n        ops += len(items)\nprint(ops)\n\
    s = \"\"\nfor ch in \"abc\":\n    s += ch\nprint(s, len(s))"
  expected_output: '24 64

    16

    abc 3'
  answer_md: 'f(8): i = 1, 2, 4 (3 lần) x 8 = 24; f(16): i = 1, 2, 4, 8 (4 lần) x 16 = 64. Vòng ngoài
    nhân đôi (log n) x vòng trong n nên f là O(n log n). Vòng for thứ hai: mỗi x in items quét list O(n),
    4 phần tử cộng 4 mỗi lần = 16; tổng là O(n^2), đổi items sang set để x in O(1). Vòng cuối in abc 3.'
  rubric_md: 'Output khớp từng dòng VÀ đúng: f là O(n log n); x in list là O(n) nên vòng thứ hai O(n^2).
    Đúng: bằng chứng điểm 3; sai: tối đa điểm 2.'
