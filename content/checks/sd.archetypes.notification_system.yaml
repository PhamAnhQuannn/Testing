subtopic_id: sd.archetypes.notification_system
items:
- id: S187
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Nói ngắn gọn: trong một hệ thống thông báo (notification system), vì sao mỗi **kênh** (push,

    email, SMS) thường có **hàng đợi (queue) + worker riêng**, và khoá **dedup (chống gửi trùng)**

    điển hình gồm những thành phần nào?

    '
  answer_md: 'Mỗi kênh có **tốc độ, giới hạn (rate limit) và kiểu lỗi khác nhau** (SMS bị bóp băng thông
    và

    đắt, email dồn lô, push nhanh), nên tách **queue + worker riêng** để một kênh chậm/sập không

    chặn kênh khác và để chỉnh retry/số worker/rate limit độc lập từng kênh.

    Khoá dedup điển hình suy ra từ ý nghĩa sự kiện: **(user_id, loại thông báo, event_id)** — thấy

    khoá đã gửi thì bỏ qua.

    '
  rubric_md: 'Đúng khi nêu được: tách kênh vì đặc tính (tốc độ/giới hạn/lỗi) khác nhau và để cô lập sự
    cố; khoá dedup gồm user + loại + event_id. Đúng cả hai ý: bằng chứng điểm 1; thiếu một vế: tối đa
    điểm 0.'
- id: S188
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Một producer báo lỗi: thỉnh thoảng người dùng **nhận trùng** cùng một thông báo "đơn đã
    giao",

    và khi provider SMS timeout thì có tin **bị mất**. Hãy giải thích và đề xuất cách sửa: (1) vì sao

    hệ dùng queue + retry chỉ bảo đảm **at-least-once**; (2) cơ chế nào làm người dùng **không thấy

    trùng** mà vẫn giữ được retry; (3) khi provider timeout thì worker nên làm gì để **không mất** tin.

    '
  answer_md: '(1) Vì worker có thể gọi provider thành công rồi **chết trước khi ack** message, nên khi
    khởi

    động lại nó xử lý message đó lần nữa; cộng với retry khi lỗi, nền tảng chỉ bảo đảm **gửi ít nhất

    một lần (at-least-once)**, không exactly-once.

    (2) Dùng **idempotency/dedup**: mỗi thông báo mang khoá (user, loại, event_id); trước khi gửi

    worker kiểm tra **kho dedup** (ví dụ Redis có TTL) — đã thấy khoá thì **bỏ qua**, chưa thấy thì ghi

    khoá rồi gửi. Nhờ vậy vẫn retry thoải mái mà người dùng chỉ thấy một lần.

    (3) Timeout là lỗi **tạm thời**: worker nên **thử lại có giãn cách (exponential backoff + jitter)**,

    có thể **đổi sang provider dự phòng (failover)**; nếu sau N lần vẫn hỏng thì đẩy vào **DLQ** để điều

    tra/replay — tuyệt đối không nuốt lỗi làm mất tin.

    '
  rubric_md: 'Đạt khi nêu đúng cả 3: at-least-once do xử lý lại/ retry; dedup theo khoá idempotency để
    khử trùng mà giữ retry; timeout -> backoff/failover/DLQ chứ không bỏ. Đúng, trong time-box, tự giải
    thích được: bằng chứng điểm 2. Thiếu ý dedup hoặc coi timeout là lỗi vĩnh viễn (bỏ tin): tối đa điểm
    1.'
- id: S189
  difficulty: 3
  type: concept
  minutes: 12
  prompt_md: 'Phỏng vấn: **Thiết kế một hệ thống thông báo đa kênh (push/email/SMS) cho ~100 triệu người
    dùng,

    chịu đột biến tải, kèm webhook cho đối tác ngoài.** Trình bày **thiết kế đầy đủ (full design)**:

    đường ống từ producer tới provider; cách áp **tuỳ chọn người dùng** (opt-out/quiet hours) và

    templating/localization; **per-channel queue + priority** để OTP không kẹt; **retry/backoff,

    provider failover, DLQ**; **idempotency/dedup**; **rate limit + batching/digest + fan-out** cho

    chiến dịch; và **reliable webhook delivery** (ký payload, thử lại, receiver idempotent, DLQ,

    per-customer isolation, tracking). Nêu rõ **đánh đổi** ở mỗi chỗ.

    '
  answer_md: '**Ingest bền:** producer chỉ **đẩy sự kiện** ("order_shipped, user 42") vào notification
    service và

    nhận ngay "đã nhận" — không gọi APNs/SMTP đồng bộ, nên producer không bị chặn khi provider chậm.

    **Notification service:** với mỗi sự kiện, (a) áp **tuỳ chọn người dùng** — bỏ nếu **opt-out**, hoãn

    nếu trong **quiet hours**, chặn nếu vượt **rate limit N tin/ngày**; (b) **templating + localization**:

    ráp dữ liệu vào mẫu theo ngôn ngữ người nhận (tách nội dung khỏi code producer).

    **Per-channel queue + worker:** mỗi kênh (push qua APNs/FCM, email, SMS) có **queue + worker riêng**

    vì tốc độ/giới hạn/lỗi khác nhau; thêm **priority queue** để **OTP/cảnh báo** đi trước, không kẹt
    sau

    chiến dịch. Đánh đổi: nhiều queue -> vận hành phức tạp hơn, đổi lấy cô lập sự cố và tinh chỉnh riêng.

    **Reliability mỗi worker:** **retry + exponential backoff + jitter** cho lỗi tạm thời (timeout/5xx/429),

    không retry lỗi vĩnh viễn (số sai, token gỡ); **provider failover** + circuit breaker khi nhà chính
    sập;

    **DLQ** sau N lần để không mất tin cũng không thử lại vô hạn. Hệ do đó là **at-least-once**.

    **Idempotency/dedup:** khoá (user, loại, event_id) trong kho dedup (Redis + TTL) để at-least-once
    thành

    "người dùng thấy một lần".

    **Chống spam + đột biến:** **rate limit mỗi người**, **batching/digest** gộp nhiều tin thành một tóm

    tắt, và **fan-out theo lô** cho chiến dịch/segment để một yêu cầu "gửi 10 triệu" bung thành hàng triệu

    việc nhỏ rải đều, tránh bursty write đè provider. Đánh đổi: digest giảm phiền nhưng tăng độ trễ.

    **Webhook cho đối tác:** gọi URL đối tác đăng ký; **payload ký HMAC** + timestamp để đối tác xác minh

    nguồn gốc và chống replay; **thử lại + backoff + DLQ** khi URL khách chậm/sập; gửi kèm **event_id**
    để

    **receiver idempotent** (vì at-least-once); **per-customer isolation** để một khách endpoint chết
    không

    nghẽn khách khác; **tracking delivery status** (đã gửi/đã nhận) để báo cáo và replay đúng chỗ.

    '
  rubric_md: 'Đạt mức 3 (per mastery bar: thiết kế hệ chịu đột biến, chống gửi trùng, tôn trọng tuỳ chọn
    người dùng, thử lại qua provider dự phòng) khi trình bày đủ đường ống: ingest bền -> preferences +
    templating -> per-channel queue + priority -> retry/backoff/failover/DLQ -> idempotency/dedup -> rate
    limit/batching/fan-out -> webhook (ký + idempotent receiver + DLQ + isolation + tracking), và nêu
    được ít nhất vài đánh đổi (vì sao at-least-once, tách kênh, digest tăng độ trễ). Thiếu dedup, thiếu
    tuỳ chọn người dùng, hoặc thiếu provider failover/DLQ: chưa đạt mức 3.'
