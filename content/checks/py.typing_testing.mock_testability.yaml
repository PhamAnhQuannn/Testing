subtopic_id: py.typing_testing.mock_testability
items:
- id: X423
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: 'from unittest.mock import Mock


    calc = Mock(return_value=5)

    print(calc(1, 2))

    calc.return_value = 9

    print(calc(3))

    print(calc.call_count)

    print(calc.call_args)

    print(calc.call_args_list[0].args)'
  expected_output: '5

    9

    2

    call(3)

    (1, 2)'
  answer_md: '`return_value` được đọc tại mỗi lần gọi nên lần đầu trả `5`, sau khi gán lại thì trả `9`.
    Mock ghi lại cả hai lời gọi: `call_count` là 2, `call_args` là lần gọi cuối `call(3)`, còn `call_args_list[0].args`
    là tuple đối số của lần gọi đầu `(1, 2)`.'
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
- id: X424
  difficulty: 2
  type: write_code
  minutes: 5
  prompt_md: 'Viết `fetch_with_fallback(outcomes)`: `outcomes` là list số hoặc `None`. Trong hàm, tạo
    `client = Mock()` với `client.fetch.side_effect` là list trong đó `None` thành `ConnectionError("down")`.
    Hàm `get_price(c, item)` gọi `c.fetch(item)` và trả `-1` nếu bắt được `ConnectionError`. Gọi `get_price(client,
    i)` cho `i` từ 0 tới `len(outcomes) - 1`, rồi trả `[results, client.fetch.call_count, đối_số_từng_lần_gọi]`
    (lấy từ `call_args_list`). Không trả về chính mock.

    '
  problem_id: check-x424-mock-fallback
  rubric_md: 'Pass toàn bộ test ẩn. Đúng không gợi ý trong time-box (5 phút): bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X425
  difficulty: 3
  type: write_code
  minutes: 12
  prompt_md: 'Viết `patch_lookup(ids)` chứng minh quy tắc "patch tại nơi tên được tra cứu". Tạo hai module
    giả bằng `types.ModuleType`: `lib` có `get_user(uid)` trả `f"real-{uid}"`, và `app` với `app.get_user
    = lib.get_user` (giống `from lib import get_user`). `greet(uid)` trả `"hi " + app.get_user(uid)`.
    `wrong` là kết quả `greet` cho mọi `id` khi `patch.object(lib, "get_user", return_value="stub")`;
    `right` là kết quả khi `patch.object(app, "get_user", return_value="stub") as mocked`. Trả `[wrong,
    right, mocked.call_count, đối_số_từng_lần_gọi]`. Gợi ý: `wrong` vẫn là `"hi real-..."` vì patch sai
    chỗ.

    '
  problem_id: check-x425-patch-lookup
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 12 phút: bằng chứng điểm 3; phải xem
    gợi ý hoặc quá thời gian: tối đa điểm 2.'
