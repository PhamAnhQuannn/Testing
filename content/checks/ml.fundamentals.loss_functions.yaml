- id: Q228
  difficulty: 2
  type: concept
  minutes: 3
  prompt_md: Vì sao phân loại dùng cross-entropy thay vì MSE? Loss và metric khác nhau thế nào?
  answer_md: Cross-entropy phạt rất nặng dự đoán tự tin nhưng sai và cho gradient tốt với sigmoid/softmax;
    MSE gradient nhỏ khi bão hoà. Loss là hàm được tối ưu (cần khả vi); metric là thước đo cuối (accuracy,
    F1) có thể không khả vi.
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 2; sai:
    tối đa điểm 1.'
