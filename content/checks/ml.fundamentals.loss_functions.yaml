- id: X668
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    mẫu cuối có loss lớn nhất.
  code: "import math\nprobs = [[0.1, 0.7, 0.2], [0.5, 0.25, 0.25], [0.8, 0.1, 0.1]]\nlabels = [1, 0, 2]\n\
    total = 0.0\nfor p, k in zip(probs, labels):\n    l = -math.log(p[k])\n    total += l\n    print(round(l,\
    \ 3))\nprint(round(total / 3, 3))"
  expected_output: '0.357

    0.693

    2.303

    1.117'
  answer_md: 'Mỗi mẫu loss = −ln(p đáp án đúng): −ln 0,7 ≈ 0,357; −ln 0,5 ≈ 0,693; −ln 0,1 ≈ 2,303; trung
    bình ≈ 1,117. Mẫu cuối gán chỉ 0,1 cho đáp án đúng (tự tin sai) nên bị phạt nặng nhất.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích loss = −ln(p đúng), p nhỏ thì loss lớn. Đúng: bằng chứng
    điểm 3; sai: tối đa điểm 2.'
