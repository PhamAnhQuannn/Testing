  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "from collections import deque\n\nadj = [[1, 2], [3], [3], [4], []]\ndist = [-1] * 5\ndist[0]\
    \ = 0\nq = deque([0])\nwhile q:\n    u = q.popleft()\n    for v in adj[u]:\n        if dist[v] ==\
    \ -1:\n            dist[v] = dist[u] + 1\n            q.append(v)\nprint(dist)\nprint(dist[4] - dist[1])"
  expected_output: '[0, 1, 1, 2, 3]

    2'
  answer_md: 'BFS từ 0: node 1 và 2 cách 1 cạnh; node 3 được chạm lần đầu từ 1 nên `dist[3] = 2` (lần
    chạm từ 2 bị bỏ vì đã có dist); node 4 cách 3 cạnh. Vậy `dist = [0, 1, 1, 2, 3]` và `dist[4] - dist[1]
    = 3 - 1 = 2`.'
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
