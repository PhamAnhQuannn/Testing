- id: X365
  difficulty: 3
  type: write_code
  minutes: 12
  prompt_md: 'Viết `mask_digits(s)` thay mỗi dãy chữ số liên tiếp có độ dài từ 4 trở lên bằng dãy dấu
    `*` cùng độ dài; dãy chữ số ngắn hơn 4 giữ nguyên, phần còn lại của chuỗi không đổi. Ví dụ `"the 1234567
    ma 12"` thành `"the ******* ma 12"`. Gợi ý: `re.sub` nhận được một hàm làm chuỗi thay thế.

    '
