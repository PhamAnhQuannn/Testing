- id: Q139
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), dòng code in ra gì? Giải thích 1 câu.
  code: 'import re

    print(re.findall(r"\d+", "a12b345"), re.sub(r"\s+", " ", "x   y\tz"), bool(re.match(r"^[a-z]+$", "abc1")))'
  expected_output: '[''12'', ''345''] x y z False'
  answer_md: \d+ khớp dãy chữ số; \s+ khớp khoảng trắng; "abc1" có chữ số nên không khớp ^[a-z]+$.
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
- id: Q140
  difficulty: 2
  type: concept
  minutes: 3
  prompt_md: Khi nào nên dùng split/str methods thay vì regex trong bài phỏng vấn?
  answer_md: Khi định dạng đơn giản và cố định (tách theo khoảng trắng/dấu phẩy). Regex dễ sai biên và
    khó giải thích; chỉ dùng khi mẫu thật sự phức tạp và hỏi interviewer có được dùng không.
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 2; sai:
    tối đa điểm 1.'
- id: X363
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: 'import re

    s = "id=7, id=42; ID=100"

    print(re.findall(r"id=(\d+)", s))

    print(re.findall(r"id=(\d+)", s, re.I))

    m = re.search(r"(\w+)@(\w+)", "mail: lan@home ok")

    print(m.group(2), m.group(0))

    print(re.match(r"\d+", "x1"))'
  expected_output: '[''7'', ''42'']

    [''7'', ''42'', ''100'']

    home lan@home

    None'
  answer_md: Pattern có một nhóm `(\d+)` nên `findall` trả list các nhóm (chuỗi số), không phải cả `id=...`.
    Không có `re.I` thì `ID=100` bị bỏ qua. `group(2)` là `home`, `group(0)` là toàn bộ chỗ khớp `lan@home`.
    `re.match` chỉ khớp ở đầu chuỗi mà `x1` bắt đầu bằng chữ nên trả `None`.
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
