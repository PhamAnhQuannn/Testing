- id: X637
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    cosine similarity của `a` và `b` chỉ là 0.333333 dù hai vector cùng chiều ở thành phần đầu.
  code: "def norm(v):\n    return sum(x * x for x in v) ** 0.5\n\n\na = [1, 2, 2]\nb = [2, 0, 0]\ndot\
    \ = sum(x * y for x, y in zip(a, b))\nprint(norm(a), norm(b))\nprint(dot)\nprint(round(dot / (norm(a)\
    \ * norm(b)), 6))\nprint(round(norm([x - y for x, y in zip(a, b)]), 6))"
  expected_output: '3.0 2.0

    2

    0.333333

    3.0'
  answer_md: '`|a| = √(1+4+4) = 3.0`, `|b| = 2.0`, `a·b = 2`. cos = 2/(3·2) = 1/3 ≈ 0.333333: `a` còn
    hai thành phần 2, 2 mà `b` bằng 0 nên phần lớn độ dài của `a` không cùng hướng với `b`. Hiệu `a −
    b = [-1, 2, 2]` có chuẩn L2 là 3.0.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích cosine = dot/(chuẩn·chuẩn) cho 1/3. Đúng: bằng chứng
    điểm 3; sai: tối đa điểm 2.'
