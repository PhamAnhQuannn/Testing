subtopic_id: ml.llm.alignment_rlhf_dpo
items:
- id: S283
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Nói ngắn gọn: **alignment** (căn chỉnh) là gì và nó đứng ở đâu so với pretraining và SFT?
    Một

    mẫu **dữ liệu ưu tiên (preference data)** gồm những phần nào?

    '
  answer_md: '**Alignment** là bước làm đầu ra của LLM **khớp với sở thích con người (human preferences)**
    —

    hữu ích, an toàn, trung thực, đúng phong cách (HHH). Nó đứng **sau pretraining và sau SFT

    (instruction tuning)**: model đã biết làm theo yêu cầu, giờ được chỉnh để trả lời "theo ý

    người". Cách làm cốt lõi là cho người **chọn câu tốt hơn** trong các câu model sinh ra rồi dạy

    model nghiêng theo.

    Một mẫu **dữ liệu ưu tiên** gồm: một **prompt**, một câu trả lời **được chọn (chosen)** và một

    câu **bị loại (rejected)** — tức "với prompt này, câu A tốt hơn câu B".

    '
  rubric_md: 'Đúng khi nêu được: alignment = chỉnh đầu ra khớp sở thích người (HHH), đứng SAU pretraining
    + SFT; và mẫu preference data = prompt + chosen + rejected. Đủ cả hai ý: bằng chứng điểm 1. Thiếu
    vị trí (sau SFT) HOẶC không nêu đúng cấu trúc cặp chosen/rejected: tối đa điểm 0.'
- id: S284
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Nhóm bạn có một chat model nền và muốn chỉnh nó trả lời **theo phong cách và chính sách
    của

    công ty**, với ít tài nguyên. Hãy: (1) mô tả pipeline **RLHF** cổ điển ở mức ý tưởng (các

    bước, model nào tham gia, vai trò của **phạt KL**); (2) giải thích vì sao **DPO** thường là

    lựa chọn thực tế hơn ở đây và nó **bỏ** đi những gì so với RLHF; (3) nêu **reward hacking** là

    gì và một cách giảm.

    '
  answer_md: '(1) **RLHF** gồm 3 bước: **thu cặp ưu tiên** (sinh nhiều câu cho mỗi prompt, cho người chọn
    câu

    tốt hơn) → huấn luyện **reward model (RM)** dự đoán điểm "người thích câu này bao nhiêu" từ các

    cặp chosen/rejected → tối ưu model (**policy**) bằng RL (**PPO**) để câu sinh ra được RM chấm

    cao. Lúc chạy còn có **reference model** (bản SFT đóng băng) và **critic/value model**. **Phạt

    KL** buộc policy không lệch quá xa reference, để không trôi đi và lách luật ăn điểm.

    (2) **DPO** hợp hơn khi ít tài nguyên vì nó **bỏ hẳn reward model riêng và bỏ vòng RL (PPO)**,

    chỉ học thẳng trên các cặp chosen/rejected bằng một **loss đơn giản** (tăng xác suất câu chosen,

    giảm câu rejected, có so với reference và hệ số beta). Reward nằm **ẩn** trong loss. Nhờ vậy nó

    **đơn giản, rẻ, ổn định hơn** — gần như fine-tuning thường.

    (3) **Reward hacking**: model học "nịnh" thước đo (reward model) thay vì giỏi thật — ví dụ RM

    thích câu dài nên model viết dài dòng vô ích, hoặc quá đồng ý (sycophancy). Giảm bằng **phạt

    KL** (giữ gần reference, không trôi xa) và/hoặc không optimize quá lâu, dùng nhiều tín hiệu

    reward, kiểm tra tay.

    '
  rubric_md: 'Đạt (điểm 2) khi nêu đúng cả 3: (1) 3 bước RLHF (cặp ưu tiên → reward model → PPO) + vai
    trò phạt KL (bám reference, chống trôi); (2) DPO bỏ reward model riêng VÀ vòng RL, học thẳng trên
    cặp, đơn giản/ổn định hơn; (3) reward hacking = nịnh thước đo + một cách giảm hợp lý (KL / không over-optimize).
    Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Nhầm DPO vẫn dùng reward model/PPO, hoặc
    thiếu hẳn phần reward hacking: tối đa điểm 1.'
- id: S285
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: '**(Phỏng vấn AI engineer)** Hãy **so sánh SFT, RLHF-PPO, DPO và GRPO** trên các trục: **dữ

    liệu cần**, **mục tiêu/cách tối ưu**, **có cần reward model / critic không**, và **độ ổn

    định / chi phí**. Sau đó nêu **reward hacking** là gì, vì sao nó xảy ra, và **hai cách** giảm.

    Cuối cùng: trong thực tế một AI engineer thường chạm tới bước nào?

    '
  answer_md: "**So sánh:**\n- **SFT (instruction tuning)**: dữ liệu = **các cặp (prompt → câu trả lời\
    \ mẫu tốt)**; mục tiêu\n  = học bắt chước câu mẫu (supervised); không reward model, không RL; ổn định,\
    \ rẻ. Hạn chế: chỉ\n  bắt chước mẫu, chưa tối ưu theo \"ưu tiên\".\n- **RLHF-PPO**: dữ liệu = **cặp\
    \ ưu tiên (chosen/rejected)**; mục tiêu = tối đa hoá điểm\n  **reward model** bằng RL (**PPO**), kèm\
    \ **phạt KL** so với reference; **cần cả reward model\n  và critic/value model**; mạnh nhưng **tốn\
    \ kém và dễ bất ổn** (giữ 4 model, vòng RL khó chỉnh).\n- **DPO**: dữ liệu = **cặp ưu tiên**; mục\
    \ tiêu = một **loss đơn giản** kéo xác suất câu chosen\n  lên, câu rejected xuống (có reference +\
    \ beta), reward **ẩn** trong loss; **không reward model\n  riêng, không RL, không critic**; **đơn\
    \ giản, rẻ, ổn định hơn** — phổ biến nhất hiện nay.\n- **GRPO**: dữ liệu = prompt kèm **thưởng** (hay\
    \ là **RLVR** — tự kiểm chứng: toán đúng/code qua\n  test); mục tiêu = RL dùng **lợi thế tương đối\
    \ trong một nhóm** câu trả lời; **có RL nhưng\n  KHÔNG cần critic** (bỏ value model); hợp cho **reasoning\
    \ model**.\n**Reward hacking**: model tối đa hoá *thước đo gần đúng* (reward model) thay vì chất lượng\
    \ thật\n— xảy ra vì RM chỉ là xấp xỉ sở thích người, ép tối ưu quá đà thì model khai thác lỗ hổng\
    \ của\nnó (viết dài để được điểm cao, sycophancy). **Hai cách giảm**: (1) **phạt KL** giữ policy gần\n\
    reference, không trôi xa; (2) **không over-optimize** — dừng sớm, dùng nhiều/đa dạng tín hiệu\nreward,\
    \ kiểm tra tay / RM tốt hơn.\n**Thực tế**: AI engineer phần lớn **dùng lại model đã align** qua API;\
    \ khi cần chỉnh theo miền\nthì thường làm **DPO nhẹ trên ít cặp ưu tiên**, hiếm khi tự chạy RLHF/PPO\
    \ đầy đủ.\n"
  rubric_md: 'Đạt mức phỏng vấn (điểm 3) khi: so sánh được cả 4 (SFT / RLHF-PPO / DPO / GRPO) đúng trên
    dữ liệu + cách tối ưu + có reward model/critic hay không + ổn định/chi phí (then chốt: RLHF cần RM+critic+PPO+KL
    và tốn kém; DPO bỏ RM riêng và RL; GRPO có RL nhưng bỏ critic, dùng nhóm/RLVR cho reasoning); VÀ giải
    thích reward hacking (tối đa hoá thước đo xấp xỉ) + hai cách giảm hợp lý (KL + không over-optimize);
    VÀ nêu đúng thực tế AI engineer (dùng model đã align / DPO nhẹ). Đúng, trong time-box, tự giải thích
    rõ: bằng chứng điểm 3. Nhầm DPO vẫn có reward model/PPO, nhầm GRPO cần critic, hoặc thiếu phần reward
    hacking: chưa đạt mức 3.'
