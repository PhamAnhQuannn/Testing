subtopic_id: dsa.foundations.interview_method
items:
- id: Q048
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: Liệt kê 6 bước làm một bài phỏng vấn coding (từ nhận đề đến xong).
  answer_md: 1) nhắc lại đề + hỏi làm rõ; 2) ví dụ + biên; 3) brute force + độ phức tạp; 4) tối ưu; 5)
    code; 6) dry-run bằng ví dụ + biên, nói time/space.
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 1; sai:
    tối đa điểm 0.'
- id: Q049
  difficulty: 2
  type: concept
  minutes: 3
  prompt_md: Bạn kẹt 10 phút không ra hướng. Nói gì và làm gì với interviewer?
  answer_md: Nói to điều đã thử, trình bày brute force để có bài chạy được, hỏi gợi ý cụ thể ("em đang
    nghĩ dùng hash map để ... có hợp lý không ạ?"), không im lặng.
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 2; sai:
    tối đa điểm 1.'
- id: X346
  difficulty: 3
  type: concept
  minutes: 8
  prompt_md: 'Bạn nhận đề "tìm hai số trong mảng có tổng bằng target" trong buổi phỏng vấn. Trình bày
    quy trình bạn

    sẽ đi qua từ lúc nhận đề đến lúc kết thúc, và cách bạn nói về độ phức tạp ở từng bước. Cụ thể:

    (1) bạn hỏi gì khi làm rõ đề, (2) vì sao nêu brute force trước, (3) bạn chuyển sang cách tối ưu thế

    nào và nói gì về đánh đổi thời gian/bộ nhớ, (4) bạn kiểm thử ra sao.

    '
  answer_md: "1. Làm rõ: mảng có số âm/trùng không, có đảm bảo tồn tại đáp án không, trả chỉ số hay giá\
    \ trị, được\n   dùng một phần tử hai lần không, kích thước tối đa (quyết định ngưỡng độ phức tạp).\n\
    2. Ví dụ và biên: ví dụ nhỏ tay, mảng rỗng, một phần tử, trùng lặp, không có đáp án.\n3. Brute force:\
    \ hai vòng lặp, O(n^2) thời gian, O(1) bộ nhớ. Nêu trước để chứng tỏ có đáp án đúng và\n   có mốc\
    \ so sánh.\n4. Tối ưu: dùng dict lưu giá trị đã thấy, tra `target - x`, một lượt O(n) thời gian, O(n)\
    \ bộ nhớ;\n   nói rõ đang đổi bộ nhớ lấy thời gian.\n5. Code sạch, đặt tên rõ, rồi chạy tay ví dụ\
    \ và các biên; nêu độ phức tạp cuối cùng.\n6. Khi kẹt: nói to suy nghĩ, không im lặng.\n"
  rubric_md: 'Nêu đủ thứ tự làm rõ, ví dụ/biên, brute force, tối ưu, code, kiểm thử; nêu đúng O(n^2) và
    O(n) kèm đánh đổi bộ nhớ; nêu được ít nhất 2 câu hỏi làm rõ và 2 biên: bằng chứng điểm 3. Thiếu 1-2
    bước hoặc không nói đánh đổi: điểm 2. Chỉ nói chung chung hoặc bỏ brute force/kiểm thử: tối đa điểm
    1.'
