- id: X728
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
  code: 'raw = "  7 ,12,  -3 ,0 "

    parts = [p.strip() for p in raw.split(",")]

    nums = [int(p) for p in parts]

    print(parts)

    print(sum(nums))

    print(" ".join(str(n * 2) for n in nums))

    print(max(nums) - min(nums))'
  expected_output: '[''7'', ''12'', ''-3'', ''0'']

    16

    14 24 -6 0

    15'
  answer_md: split(',') cho ['  7 ', '12', '  -3 ', '0']; strip() từng phần thành ['7', '12', '-3', '0']
    (vẫn là str nên in có nháy). nums = [7, 12, -3, 0] có tổng 16. Nhân đôi được 14, 24, -6, 0 nối bằng
    dấu cách. max - min = 12 - (-3) = 15.
  rubric_md: 'Output khớp từng dòng, đặc biệt dòng đầu có nháy vì phần tử còn là str. Đúng: bằng chứng
