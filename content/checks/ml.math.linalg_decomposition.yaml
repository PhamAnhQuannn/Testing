- id: X650
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và cho biết `v` có
    phải vectơ riêng của `A` không.
  code: 'A = [[3, 1], [0, 2]]

    v = [1, 0]

    det = A[0][0] * A[1][1] - A[0][1] * A[1][0]

    Av = [A[0][0] * v[0] + A[0][1] * v[1], A[1][0] * v[0] + A[1][1] * v[1]]

    lam = 3

    print(det)

    print(Av)

    print(Av == [lam * x for x in v])'
  expected_output: '6

    [3, 0]

    True'
  answer_md: '`det = 3·2 − 1·0 = 6`; `Av = (3·1 + 1·0, 0·1 + 2·0) = (3, 0) = 3·v`, nên `v` là vectơ riêng
    ứng với `λ = 3` và dòng cuối in `True`.'
  rubric_md: 'Output khớp từng dòng VÀ nêu `Av = 3v` nên v là vectơ riêng. Đúng: bằng chứng điểm 1; sai:
    điểm 0.'
- id: X651
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Viết hàm `eigenvalues_2x2(A)` với `A = [[a, b], [c, d]]` là ma trận 2×2. Trị riêng là nghiệm
    của phương trình đặc trưng `λ² − (a+d)·λ + (a·d − b·c) = 0`. Đặt `tr = a + d`, `det = a*d - b*c`,
    `disc = tr*tr - 4*det`. Nếu `disc < 0` (trị riêng phức) trả `[]`. Ngược lại trả hai trị riêng thực
    xếp tăng dần, mỗi số làm tròn `round(x, 6)`: `[(tr - sqrt(disc))/2, (tr + sqrt(disc))/2]` (dùng `math.sqrt`,
    không dùng NumPy). Ví dụ: `eigenvalues_2x2([[2,1],[1,2]])` là `[1.0, 3.0]`.

    '
  problem_id: check-x651-eigen-2x2
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X652
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    ma trận đối xứng `S` có hạng 1 và một trị riêng bằng 0.
  code: "import math\n\n\ndef rank2(A):\n    det = A[0][0] * A[1][1] - A[0][1] * A[1][0]\n    if det !=\
    \ 0:\n        return 2\n    return 0 if all(x == 0 for r in A for x in r) else 1\n\n\nS = [[4, 2],\
    \ [2, 1]]\ntr = S[0][0] + S[1][1]\ndet = S[0][0] * S[1][1] - S[0][1] * S[1][0]\nr = math.sqrt(tr *\
    \ tr - 4 * det)\nprint(rank2(S), rank2([[1, 2], [3, 4]]), rank2([[0, 0], [0, 0]]))\nprint((tr - r)\
    \ / 2, (tr + r) / 2)"
  expected_output: '1 2 0

    0.0 5.0'
  answer_md: '`S`: `det = 4·1 − 2·2 = 0` và `S` khác 0 nên hạng 1; `[[1,2],[3,4]]` có `det = −2 ≠ 0` nên
    hạng 2; ma trận 0 có hạng 0. Với `S`: `tr = 5`, `disc = 25`, `r = 5`, trị riêng `(5 − 5)/2 = 0.0`
    và `(5 + 5)/2 = 5.0`. `det = 0` tương đương một trị riêng bằng 0 (tích hai trị riêng là det), khớp
    với hạng 1: một hướng bị nén về 0.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích det = 0 nghĩa là hạng thấp/một trị riêng bằng 0. Đúng:
    bằng chứng điểm 3; sai: tối đa điểm 2.'
