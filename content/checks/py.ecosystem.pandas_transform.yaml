  prompt_md: 'Viết hàm `pivot_sum(rows)` mô phỏng `df.pivot_table(index=row, columns=col, values=v, aggfunc="sum")`.
    `rows` là list các bộ ba `[row_key, col_key, value]` (row_key và col_key là chuỗi, value là số nguyên).
    Trả về dict lồng nhau `{row_key: {col_key: tổng}}`, trong đó các value có cùng cặp (row_key, col_key)
    được cộng lại. `rows` rỗng cho `{}`. Ví dụ `[["a","x",2],["a","y",3],["a","x",5]]` cho `{"a": {"x":
    7, "y": 3}}`.

    '
  problem_id: check-x754-pivot-sum
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc
