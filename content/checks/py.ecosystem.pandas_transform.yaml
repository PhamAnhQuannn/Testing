- id: X755
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    `pivot["b"].get("y", 0)` là 0 (còn pandas sẽ cho NaN) và vì sao thứ tự của b và a không đổi khi sắp
    theo giá trị.
  code: "rows = [(\"a\", \"x\", 2), (\"b\", \"x\", 1), (\"a\", \"y\", 3), (\"a\", \"x\", 4)]\npivot =\
    \ {}\nfor r, c, v in rows:\n    pivot.setdefault(r, {})\n    pivot[r][c] = pivot[r].get(c, 0) + v\n\
    print(pivot)\ntot = {r: sum(d.values()) for r, d in pivot.items()}\nprint(tot)\nprint(pivot[\"b\"\
    ].get(\"y\", 0))\npairs = [(\"b\", 1), (\"a\", 1), (\"c\", 0)]\nprint(sorted(pairs, key=lambda p:\
    \ p[1]))"
  expected_output: '{''a'': {''x'': 6, ''y'': 3}, ''b'': {''x'': 1}}

    {''a'': 9, ''b'': 1}

    0

    [(''c'', 0), (''b'', 1), (''a'', 1)]'
  answer_md: 'Pivot cộng các giá trị cùng cặp: (a, x) = 2 + 4 = 6, (a, y) = 3, (b, x) = 1. Tổng theo hàng:
    a = 9, b = 1. Ô (b, y) không tồn tại trong dict nên `.get("y", 0)` trả về 0 (pandas để NaN, ta chọn
    mặc định 0 giống `fillna(0)`). `sorted` ổn định: b và a cùng khoá 1 nên giữ thứ tự ban đầu (b trước
    a), c có khoá 0 lên đầu.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng: ô thiếu không có khoá nên .get cho mặc định (giống
    fillna), và sorted ổn định giữ thứ tự ban đầu của các phần tử bằng khoá. Đúng: bằng chứng điểm 3;
    sai: tối đa điểm 2.'
