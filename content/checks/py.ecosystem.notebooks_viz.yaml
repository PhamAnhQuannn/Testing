- id: X757
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết hàm `histogram(values, k)` mô phỏng đếm của `plt.hist(values, bins=k)`. `values` là
    list số nguyên không rỗng, `k >= 1` là số bin có độ rộng bằng nhau. Đặt `lo = min(values)`, `hi =
    max(values)`. Nếu `hi == lo` thì trả về `[len(values)] + [0] * (k - 1)`. Ngược lại `width = (hi -
    lo) / k` (số thực) và chỉ số bin của mỗi `v` là `min(int((v - lo) / width), k - 1)` (giá trị bằng
    `hi` được kẹp vào bin cuối). Trả về list k số nguyên là số phần tử mỗi bin, bin 0 trước. Ví dụ `histogram([1,
    2, 3, 4], 2)` cho `[2, 2]`.

    '
  problem_id: check-x757-histogram
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X758
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    phải dùng `min(..., k - 1)` khi chia bin.
  code: "values = [0, 5, 10]\nk = 2\nlo, hi = min(values), max(values)\nwidth = (hi - lo) / k\ncounts\
    \ = [0] * k\nfor v in values:\n    i = min(int((v - lo) / width), k - 1)\n    counts[i] += 1\nprint(width)\n\
    print(counts)\nprint(int((10 - lo) / width))"
  expected_output: '5.0

    [1, 2]

    2'
  answer_md: width = 10 / 2 = 5.0. Giá trị 0 vào bin 0; giá trị 5 cho (5 - 0) / 5.0 = 1.0 nên vào bin
    1; giá trị 10 cho 2.0 nên chỉ số thô là 2, vượt quá bin cuối (chỉ số 1), được kẹp về k - 1 = 1. Vậy
    counts = [1, 2]. Dòng cuối in chỉ số thô 2. Không kẹp thì counts[2] gây IndexError; giá trị lớn nhất
    nằm đúng biên phải nên phải thuộc bin cuối.
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng: giá trị bằng hi cho chỉ số k (ngoài phạm vi) nên
    cần kẹp về bin cuối k - 1. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2.'
