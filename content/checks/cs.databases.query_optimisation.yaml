- id: X816
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
  code: "rows = 2000\nfor num, den in [(1, 4), (1, 10), (1, 3)]:\n    rows = rows * num // den\n    print(rows)"
  expected_output: '500

    50

    16'
  answer_md: 'Mỗi vòng nhân selectivity rồi chia nguyên: 2000 * 1 // 4 = 500; 500 * 1 // 10 = 50; 50 *
    1 // 3 = 16 (16.67 làm tròn xuống). Đây là cách planner nhân các selectivity để ước lượng cardinality.'
  rubric_md: 'Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0.'
- id: X817
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết hàm `estimate_rows(n, sels)` ước lượng số dòng sau một chuỗi điều kiện, như query planner.
    `n` là số nguyên không âm (số dòng của bảng). `sels` là list các selectivity, mỗi phần tử là list
    `[num, den]` với số nguyên `0 <= num <= den`, `den >= 1`. Bắt đầu từ `result = n`, áp dụng lần lượt
    từng selectivity theo thứ tự: `result = result * num // den` (chia nguyên làm tròn xuống). Trả về
    `result` (số nguyên). `sels` rỗng thì trả `n`. Ví dụ `estimate_rows(1000, [[1,2],[3,10]])`: 1000*1//2
    = 500, rồi 500*3//10 = 150, nên trả `150`.

    '
  problem_id: check-x817-estimate-rows
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X818
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    lọc trước khi join (predicate pushdown) rẻ hơn mà kết quả vẫn như nhau.
  code: "users = [(1, \"vn\"), (2, \"us\"), (3, \"vn\"), (4, \"jp\")]\norders = [(1, 10), (1, 20), (2,\
    \ 5), (3, 7), (4, 9), (4, 1)]\n\n\ndef join(us, os):\n    rows = []\n    cmp = 0\n    for u in us:\n\
    \        for o in os:\n            cmp += 1\n            if u[0] == o[0]:\n                rows.append((u[0],\
    \ u[1], o[1]))\n    return rows, cmp\n\n\nrows, c1 = join(users, orders)\na = [r for r in rows if\
    \ r[1] == \"vn\"]\nvn = [u for u in users if u[1] == \"vn\"]\nb, c2 = join(vn, orders)\nprint(len(rows),\
    \ len(a))\nprint(c1, c2)\nprint(a == b)"
  expected_output: '6 3

    24 12

    True'
  answer_md: 'Join trước: 4 users x 6 orders = 24 phép so sánh, kết quả trung gian 6 dòng, rồi lọc còn
    3 dòng vn. Lọc trước: chỉ 2 users vn x 6 orders = 12 phép so sánh, kết quả trung gian chỉ 3 dòng.
    Hai cách cho cùng kết quả (a == b là True) nên phép đẩy điều kiện xuống là biến đổi tương đương, nhưng
    rẻ hơn vì bảng đầu vào của join nhỏ hơn.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng: lọc trước khi join giảm số dòng vào join (12 so
    với 24 phép so sánh, kết quả trung gian 3 so với 6) mà kết quả cuối giống hệt. Đúng: bằng chứng điểm
    3; sai: tối đa điểm 2.'
