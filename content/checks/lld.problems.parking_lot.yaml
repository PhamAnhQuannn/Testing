- id: X603
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Giải thích 1 câu vì sao lần `check_out(1,
    5)` thứ hai trả `-1`.
  code: "class ParkingLot:\n    def __init__(self, spots):\n        self.free = spots\n        self.tickets\
    \ = {}\n        self.next_id = 1\n\n    def check_in(self, plate):\n        if self.free == 0:\n \
    \           return -1\n        self.free -= 1\n        tid = self.next_id\n        self.next_id +=\
    \ 1\n        self.tickets[tid] = plate\n        return tid\n\n    def check_out(self, tid, hours):\n\
    \        if tid not in self.tickets:\n            return -1\n        del self.tickets[tid]\n     \
    \   self.free += 1\n        return hours * 10\n\n\nlot = ParkingLot(2)\nprint(lot.check_in(\"A\"))\n\
    print(lot.check_in(\"B\"))\nprint(lot.check_in(\"C\"))\nprint(lot.check_out(1, 3))\nprint(lot.check_in(\"\
    C\"))\nprint(lot.check_out(1, 5))\nprint(lot.free)"
  expected_output: '1

    2

    -1

    30

    3

    -1

    0'
  answer_md: 'Bãi có 2 chỗ: A được vé 1, B được vé 2, C bị từ chối (-1) và không tốn id. Vé 1 ra sau 3
    giờ: phí 30, chỗ được trả nên C vào lại được vé 3. Vé 1 đã bị xóa khỏi `tickets` nên lần ra thứ hai
    trả -1; hai chỗ đang có xe nên `free` là 0.'
  rubric_md: 'Output khớp VÀ nêu vé đã bị xóa khỏi tickets nên ra lần hai trả -1. Đúng: bằng chứng điểm
    1; sai: tối đa điểm 0.'
- id: X604
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Viết `class ParkingLot` là lõi của bãi đỗ xe, báo thất bại bằng giá trị trả về (không ném
    lỗi). Constructor `ParkingLot(car_spots, moto_spots)` nhận sức chứa (hai số nguyên) cho ô tô và xe
    máy. `park(kind)` với `kind` là `"car"` hoặc `"moto"`: nếu còn chỗ loại đó thì chiếm chỗ và trả id
    vé (số nguyên 1, 2, 3... theo thứ tự đỗ thành công), ngược lại trả `-1` và không đổi gì. `leave(ticket_id,
    hours)` trả chỗ của vé và trả phí `hours * rate` (ô tô 20, xe máy 10); trả `-1` nếu vé lạ hoặc đã
    ra rồi. `available(kind)` trả số chỗ trống của loại đó. Ví dụ: `ParkingLot(1, 1)`, `park("car")` là
    `1`, `leave(1, 3)` là `60`, `available("car")` là `1`.

    '
  problem_id: check-x604-parking-lot
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X605
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng. Giải thích vì sao
    `leave(b, 0)` ra 10 chứ không phải 0, vì sao vé `d` đỗ ở tầng 1, và vì sao lần `park("car")` cuối
    vẫn thành công dù lúc đầu `c` bị từ chối.
  code: "RATES = {\"car\": 20, \"moto\": 10}\n\n\nclass Lot:\n    def __init__(self, floors):\n      \
    \  self.free = list(floors)\n        self.tickets = {}\n        self.next_id = 1\n\n    def park(self,\
    \ kind):\n        for f in range(len(self.free)):\n            if self.free[f] > 0:\n            \
    \    self.free[f] -= 1\n                tid = self.next_id\n                self.next_id += 1\n  \
    \              self.tickets[tid] = (f, kind)\n                return tid\n        return -1\n\n  \
    \  def leave(self, tid, hours):\n        if tid not in self.tickets:\n            return -1\n    \
    \    f, kind = self.tickets.pop(tid)\n        self.free[f] += 1\n        return max(hours, 1) * RATES[kind]\n\
    \n\nlot = Lot([1, 1])\na = lot.park(\"car\")\nb = lot.park(\"moto\")\nc = lot.park(\"car\")\nprint(a,\
    \ b, c, lot.free)\nprint(lot.leave(b, 0))\nprint(lot.leave(b, 4))\nd = lot.park(\"moto\")\nprint(d,\
    \ lot.tickets[d], lot.free)\nprint(lot.leave(a, 2))\nprint(lot.park(\"car\"), lot.free)"
  expected_output: '1 2 -1 [0, 0]

    10

    -1

    3 (1, ''moto'') [0, 0]

    40

    4 [0, 0]'
  answer_md: 'Allocation chọn tầng thấp nhất còn chỗ: a vào tầng 0, b vào tầng 1, c bị từ chối (-1, không
    tốn id). `max(hours, 1)` là giờ tối thiểu nên `leave(b, 0)` tính 1 giờ = 10 và trả chỗ tầng 1; lần
    ra thứ hai vé đã bị pop nên -1. `d` lấy lại chỗ duy nhất còn trống là tầng 1 (vé 3). `leave(a, 2)`
    = 2*20 = 40 trả chỗ tầng 0, nên `park("car")` sau đó được tầng 0 với vé 4.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng giờ tối thiểu, chọn tầng thấp nhất, chỗ được trả
    lại. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2.'
