- id: X699
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    backtest này đi theo thời gian mà không được xáo trộn các dòng.
  code: "series = [1, 2, 3, 4, 5, 6]\nerrs = []\nfor end in range(3, 6):\n    train = series[:end]\n \
    \   test = series[end]\n    pred = sum(train[-2:]) / 2\n    errs.append(abs(test - pred))\n    print(train,\
    \ test, pred)\nprint(sum(errs) / len(errs))"
  expected_output: '[1, 2, 3] 4 2.5

    [1, 2, 3, 4] 5 3.5

    [1, 2, 3, 4, 5] 6 4.5

    1.5'
  answer_md: 'Expanding window: mỗi vòng train = series[:end], test là điểm kế tiếp. Vòng 1: train [1,2,3],
    test 4, pred = (2+3)/2 = 2,5. Vòng 2: pred = (3+4)/2 = 3,5. Vòng 3: pred = (4+5)/2 = 4,5. Mỗi sai
    số tuyệt đối = 1,5 nên trung bình 1,5. Nếu xáo trộn, train có thể chứa điểm sau điểm test (tương lai)
    nên mô hình thấy thông tin không có lúc dự báo thật, điểm sai số quá lạc quan (data leakage).'
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng: train chỉ gồm quá khứ so với điểm test, xáo trộn
    làm tương lai lọt vào train (leakage) nên điểm lạc quan. Đúng: bằng chứng điểm 3; sai: tối đa điểm
    2.'
