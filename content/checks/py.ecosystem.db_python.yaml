- id: X747
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết hàm `top_products(rows)`. `rows` là list các bản ghi `[product, qty]` (product là chuỗi,
    qty là số nguyên), mỗi bản ghi là một dòng bán hàng. Dùng `sqlite3` trong bộ nhớ (`sqlite3.connect(":memory:")`):
    tạo bảng `sales(product, qty)`, chèn mọi dòng bằng câu SQL **tham số hoá** (`executemany("INSERT INTO
    sales(product, qty) VALUES (?, ?)", rows)`), rồi chạy `SELECT product, SUM(qty) AS total FROM sales
    GROUP BY product ORDER BY total DESC, product ASC`. Trả về list các cặp `[product, total]` (mỗi cặp
    là **list** 2 phần tử, không phải tuple) theo đúng thứ tự đó. Ví dụ `rows = [["apple", 3], ["banana",
    2], ["apple", 5]]` cho `[["apple", 8], ["banana", 2]]`; `[]` cho `[]`.

    '
  problem_id: check-x747-top-products
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X748
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    câu `query` an toàn còn câu `bad` thì không.
  code: "rows = [[\"pen\", 2], [\"ink\", 5], [\"pen\", 3], [\"cap\", 5]]\ntotals = {}\nfor p, q in rows:\n\
    \    totals[p] = totals.get(p, 0) + q\nordered = sorted(totals.items(), key=lambda kv: (-kv[1], kv[0]))\n\
    print([list(t) for t in ordered])\nuser = \"x' OR '1'='1\"\nquery = \"SELECT * FROM t WHERE name =\
    \ ?\"\nparams = (user,)\nprint(query.count(\"?\"), len(params))\nbad = \"SELECT * FROM t WHERE name\
    \ = '\" + user + \"'\"\nprint(bad)"
  expected_output: '[[''cap'', 5], [''ink'', 5], [''pen'', 5]]

    1 1

    SELECT * FROM t WHERE name = ''x'' OR ''1''=''1'''
  answer_md: 'Tổng: pen = 5, ink = 5, cap = 5, cả ba hòa nên sắp theo tên tăng dần: cap, ink, pen. `query`
    có 1 dấu ? và `params` có 1 phần tử. Câu `bad` ghép chuỗi nên thành `... WHERE name = ''x'' OR ''1''=''1''`,
    điều kiện luôn đúng và trả mọi dòng (SQL injection). Câu `query` tham số hoá thì driver coi `user`
    là một giá trị chuỗi duy nhất.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng: ghép chuỗi cho phép chèn lệnh làm điều kiện luôn
    đúng (SQL injection), còn tham số ? được driver xử lý như dữ liệu. Đúng: bằng chứng điểm 3; sai: tối
    đa điểm 2.'
