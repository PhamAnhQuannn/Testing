- id: X462
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "import heapq\n\nadj = {0: [(2, 1), (6, 2)], 1: [(2, 0), (3, 2), (1, 3)], 2: [(6, 0), (3, 1),\
    \ (4, 3)], 3: [(1, 1), (4, 2)]}\nseen = set()\nheap = [(0, 0)]\ntotal = 0\norder = []\nwhile heap:\n\
    \    w, u = heapq.heappop(heap)\n    if u in seen:\n        continue\n    seen.add(u)\n    total +=\
    \ w\n    order.append(u)\n    for ww, v in adj[u]:\n        if v not in seen:\n            heapq.heappush(heap,\
    \ (ww, v))\nprint(order)\nprint(total)"
  expected_output: '[0, 1, 3, 2]

    6'
  answer_md: Prim bắt đầu ở đỉnh 0, nhận cạnh rẻ nhất tới đỉnh 1 (2), rồi từ 1 nhận cạnh tới đỉnh 3 (1),
    rồi cạnh (1,2) giá 3. Thứ tự thăm là `[0, 1, 3, 2]` và tổng MST là 2 + 1 + 3 = 6.
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
- id: X463
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Viết `min_cost_connect_points(points)`: `points` là danh sách tọa độ `[x, y]`. Chi phí nối
    hai điểm là khoảng cách Manhattan `|x1 - x2| + |y1 - y2|`. Trả về tổng chi phí nhỏ nhất để nối tất
    cả các điểm. `min_cost_connect_points([[0, 0], [2, 2], [3, 10], [5, 2], [7, 0]])` là `20`. Gợi ý:
    MST, Prim với heap hoặc Kruskal trên mọi cặp điểm.

    '
  problem_id: check-x463-min-cost-connect-points
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X464
  difficulty: 3
  type: write_code
  minutes: 10
  prompt_md: 'Viết `minimum_cost(n, connections)`: có `n` thành phố đánh số `1..n`, `connections[i] =
    [u, v, cost]` là chi phí xây đường hai chiều nối `u` và `v`. Trả về tổng chi phí nhỏ nhất để mọi thành
    phố liên thông, hoặc `-1` nếu không thể. `minimum_cost(3, [[1, 2, 5], [1, 3, 6], [2, 3, 1]])` là `6`.
    Gợi ý: Kruskal + DSU; không đủ `n - 1` lần union thì trả `-1`.

    '
  problem_id: check-x464-connecting-cities
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem
