- id: X544
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "cells = {\"A\": 2, \"B\": \"=A+A\", \"C\": \"=B+A\"}\ncalls = 0\n\ndef val(n):\n    global calls\n\
    \    calls += 1\n    c = cells[n]\n    if isinstance(c, int):\n        return c\n    return sum(val(x)\
    \ for x in c[1:].split(\"+\"))\n\nprint(val(\"C\"))\nprint(calls)"
  expected_output: '6

    5'
  answer_md: 'C = B + A; B = A + A = 4 nên C = 4 + 2 = 6. Không có memo nên `val` được gọi 5 lần: C, B,
    A, A (hai A trong B) rồi A (trong C). Vì không memo, ô A bị tính lặp 3 lần.'
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
