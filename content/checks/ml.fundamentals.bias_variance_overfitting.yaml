subtopic_id: ml.fundamentals.bias_variance_overfitting
items:
- id: Q246
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: Train error thấp, validation error cao nói lên điều gì? Nêu 3 cách khắc phục.
  answer_md: 'Overfitting (phương sai cao). Cách: thêm dữ liệu, regularization (L1/L2, dropout), mô hình
    đơn giản hơn, early stopping, augmentation.'
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 1; sai:
    tối đa điểm 0.'
- id: Q247
  difficulty: 2
  type: concept
  minutes: 3
  prompt_md: 'Cả train và validation error đều cao: vấn đề gì và làm gì? Học đường cong (learning curve)
    giúp phân biệt thế nào?'
  answer_md: 'Underfitting (bias cao): mô hình quá đơn giản/đặc trưng yếu -> mô hình mạnh hơn, thêm đặc
    trưng, giảm regularization. Learning curve: hai đường cao và gần nhau = bias; khoảng cách lớn = variance.'
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 2; sai:
    tối đa điểm 1.'
- id: X669
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết hàm `reg_loss(base, weights, lam, kind)` tính loss có regularization. `base` là loss
    gốc (float), `weights` là danh sách trọng số, `lam` là độ mạnh phạt (float), `kind` là chuỗi: `"l2"`
    cộng `lam * Σ w²`, `"l1"` cộng `lam * Σ |w|`, `"none"` (hoặc kind lạ) cộng 0. Trả `round(base + penalty,
    6)` dạng float; `weights` rỗng thì phạt bằng 0. Ví dụ: `base=0.5`, `weights=[1,-2]`, `lam=0.1`: `"l2"`
    cho `1.0`, `"l1"` cho `0.8`.

    '
  problem_id: check-x669-reg-loss
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X670
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích chẩn
    đoán cuối cùng cùng một cách chữa phù hợp.
  code: "train = [0.40, 0.20, 0.08, 0.02]\nval = [0.45, 0.30, 0.28, 0.35]\nbest = 0\nfor i in range(1,\
    \ len(val)):\n    if val[i] < val[best]:\n        best = i\n    gap = round(val[i] - train[i], 2)\n\
    \    print(i, gap)\nprint(best)\nprint(\"overfit\" if val[-1] - train[-1] > 0.1 else \"ok\")"
  expected_output: '1 0.1

    2 0.2

    3 0.33

    2

    overfit'
  answer_md: 'Khoảng cách val − train tăng dần (0,10 → 0,20 → 0,33) vì lỗi train giảm còn lỗi val giảm
    rồi tăng lại (0,28 → 0,35). Lỗi val thấp nhất ở chỉ số 2 nên `best = 2`; cuối cùng gap 0,33 > 0,1
    nên là overfit. Cách chữa: early stopping tại chỉ số 2, hoặc thêm dữ liệu, tăng regularization, giảm
    capacity.'
  rubric_md: 'Output khớp từng dòng VÀ chẩn đoán overfit kèm một cách chữa hợp lý (early stopping tại
    điểm val thấp nhất, regularization, thêm dữ liệu). Đúng: bằng chứng điểm 3; sai: tối đa điểm 2.'
