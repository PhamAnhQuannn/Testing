subtopic_id: sd.framework.estimation
items:
- id: S031
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Trả lời ngắn: (1) một ngày có xấp xỉ bao nhiêu giây, và ta thường làm tròn thành con số
    tròn nào

    để tính nhẩm? (2) Viết công thức tính **QPS trung bình** từ tổng số thao tác mỗi ngày, và cách

    suy ra **QPS đỉnh (peak)**.

    '
  answer_md: '(1) Một ngày ≈ **86.400 giây**, làm tròn thành **10^5 giây** cho dễ chia.

    (2) QPS trung bình = (tổng thao tác mỗi ngày) / 86.400 ≈ (tổng thao tác/ngày) / 10^5. QPS đỉnh ≈

    QPS trung bình **x 2 đến 5** (mặc định nhân x3 khi không có thông tin khác).

    '
  rubric_md: 'Đạt khi nêu đúng cả hai: 86.400 ≈ 10^5 giây/ngày, và QPS tb = thao tác/ngày ÷ 10^5 với đỉnh
    = tb x (2-5). Đúng cả hai ý: bằng chứng điểm 1. Thiếu con số 10^5 hoặc thiếu hệ số đỉnh: tối đa điểm
    0.'
- id: S032
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Một ứng dụng nhắn tin có **20 triệu DAU**, mỗi người gửi **40 tin mỗi ngày**. Hãy: (1) nêu
    giả

    định về tỷ lệ đọc:ghi bạn dùng; (2) tính **QPS ghi trung bình**; (3) tính **QPS ghi đỉnh** (lấy

    hệ số x4); (4) nói một câu về việc tải này có đáng lo cho một database đơn không.

    '
  answer_md: '(1) Giả định chat 1-1, mỗi tin được đọc đúng 1 lần ⇒ đọc:ghi ≈ 1:1 (nêu rõ giả định là đủ;
    nếu

    group chat thì đọc lớn hơn nhiều).

    (2) Tổng tin/ngày = 2 x 10^7 x 40 = 8 x 10^8. QPS ghi trung bình = 8 x 10^8 / 10^5 = **8.000 ghi/s**.

    (3) QPS ghi đỉnh ≈ 8.000 x 4 = **32.000 ghi/s**.

    (4) 32.000 ghi/s là **lớn** cho một database đơn — đây là dấu hiệu cần chia tải ghi (sharding) hoặc

    hàng đợi ghi, không chỉ cache.

    '
  rubric_md: 'Đạt (mức score-2) khi: nêu một giả định đọc:ghi hợp lý, tính đúng QPS ghi tb = 8.000/s (8
    x 10^8 ÷ 10^5), đỉnh = 32.000/s (x4), và nhận xét đúng rằng tải ghi này đủ lớn để lo cho một DB đơn.
    Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Sai bậc 10^5, quên hệ số đỉnh, hoặc không
    nêu giả định đọc:ghi: tối đa điểm 1.'
- id: S033
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: '**Trong 3 phút**, cho dịch vụ chia sẻ ảnh sau, hãy tính **QPS**, **dung lượng** và **băng
    thông**,

    làm tròn hợp lý, rồi **nói rõ quyết định thiết kế** rút ra.

    Đề: **50 triệu ảnh tải lên mỗi ngày**, mỗi ảnh **2 MB**, **đọc gấp 10 lần ghi**, giữ **5 năm**,

    chép **3 bản (replication x3)**. Dùng 1 ngày ≈ 10^5 giây và hệ số đỉnh x3.

    '
  answer_md: '**QPS.** Ghi tb = 5 x 10^7 / 10^5 = 500 ghi/s, đỉnh ≈ 1.500 ghi/s. Đọc gấp 10 lần ⇒ đọc
    tb ≈

    5.000 đọc/s, đỉnh ≈ **15.000 đọc/s**.

    **Dung lượng.** Mỗi ngày = 5 x 10^7 x 2 MB = 10^8 MB = **100 TB/ngày**. Trong 5 năm (≈ 1.825 ngày):

    100 TB x 1.825 ≈ 182.500 TB ≈ **180 PB** (1 bản); chép 3 bản ⇒ ≈ **540 PB**.

    **Băng thông đọc (egress).** Đỉnh ≈ 15.000 đọc/s x 2 MB = 30.000 MB/s = **30 GB/s**.

    **Quyết định.** (a) Hàng trăm PB ⇒ không thể một database/một máy: **chia dữ liệu (sharding)**

    theo khóa (ví dụ theo user/ảnh). (b) Băng thông đọc ~30 GB/s với payload nặng và người dùng nhiều

    vùng ⇒ **CDN** là bắt buộc để phục vụ gần người dùng và giảm tải gốc. (c) Đọc gấp 10 lần ghi ⇒

    thêm **cache** cho metadata nóng. Tóm lại: sharding + CDN + cache metadata. (Thêm điểm: dữ liệu

    binary nặng như ảnh thường để ở **object/blob storage** — chi tiết ở bước thiết kế tổng thể.)

    '
  rubric_md: 'Đạt mức 3 (phỏng vấn) khi trong ~3 phút: tính đúng QPS (ghi ≈ 500/s tb, đọc đỉnh ≈ 15.000/s),
    dung lượng cỡ trăm PB (≈ 180 PB x1 bản, ≈ 540 PB x3), băng thông đọc ≈ 30 GB/s, làm tròn hợp lý, VÀ
    nêu đúng quyết định mà các con số bắt buộc: **sharding** (vì hàng trăm PB), **CDN** (vì băng thông
    lớn + payload nặng + đa vùng) và **cache** metadata (vì đọc nhiều). Đủ ba con số đúng bậc + quyết
    định có căn cứ, trong time-box: bằng chứng điểm 3. Nhắc object storage là điểm cộng, không bắt buộc.
    Sai một bậc đơn vị lớn (ví dụ ra TB thay vì PB) hoặc không rút ra quyết định: chưa đạt mức 3.'
