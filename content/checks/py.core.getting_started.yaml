- id: Q002
  difficulty: 2
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), dòng code in ra gì? Giải thích 1 câu.
  code: "total = 0\nfor i in range(1, 4):\n    total += i\n    print(total)\nprint(\"xong\")"
  expected_output: '1

    3

    6

    xong'
  answer_md: 'Dòng print(total) thụt vào nên nằm trong vòng for: in 1, 3, 6. "xong" không thụt nên chỉ
    in 1 lần.'
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 2; sai: tối đa điểm 1.'
