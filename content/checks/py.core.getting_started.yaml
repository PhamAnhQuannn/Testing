  prompt_md: REPL khác script ở điểm nào? Khi chương trình báo lỗi (traceback) bạn đọc từ đâu để biết
    loại lỗi?
  answer_md: 'REPL: gõ từng dòng sau dấu >>> và thấy kết quả ngay; script: file .py chạy cả file bằng
