items:
- id: X456
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "dist = [0, 10, 10]\nedges = [(0, 1, 3), (1, 2, 4), (0, 2, 9), (2, 1, 1)]\nfor rnd in range(2):\n\
    \    for u, v, w in edges:\n        if dist[u] + w < dist[v]:\n            dist[v] = dist[u] + w\n\
    \            print(\"relax\", v, dist[v])\nprint(dist)"
  expected_output: 'relax 1 3

    relax 2 7

    [0, 3, 7]'
  answer_md: 'Vòng đầu: cạnh (0,1,3) hạ `dist[1]` từ 10 xuống 3; cạnh (1,2,4) hạ `dist[2]` xuống 7; (0,2,9)
    cho 9, không tốt hơn 7; (2,1,1) cho 8, không tốt hơn 3. Vòng hai không còn cạnh nào cải thiện được,
    nên kết quả cuối là `[0, 3, 7]`.'
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
- id: X457
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Viết `network_delay_time(times, n, k)`: mạng có `n` node đánh số `1..n`, `times` là danh
    sách cạnh có hướng `[u, v, w]` (tín hiệu từ `u` tới `v` mất `w`). Tín hiệu phát từ node `k`. Trả về
    thời gian tối thiểu để cả `n` node đều nhận được, hoặc `-1` nếu có node không bao giờ nhận được. `network_delay_time([[2,
    1, 1], [2, 3, 1], [3, 4, 1]], 4, 2)` là `2`. Gợi ý: Dijkstra từ `k`, đáp án là max của `dist`.

    '
  problem_id: check-x457-network-delay-time
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X458
  difficulty: 3
  type: write_code
  minutes: 10
  prompt_md: 'Viết `minimum_effort_path(heights)`: `heights` là lưới `m x n`. Đi từ ô trên-trái tới ô
    dưới-phải theo 4 hướng. Effort của một đường đi là chênh lệch độ cao tuyệt đối lớn nhất giữa hai ô
    liên tiếp trên đường. Trả về effort nhỏ nhất. `minimum_effort_path([[1, 2, 2], [3, 8, 2], [5, 3, 5]])`
    là `2`. Gợi ý: Dijkstra trên lưới, relax bằng `max(effort, chênh lệch)` thay vì cộng.

    '
  problem_id: check-x458-path-min-effort
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem
