subtopic_id: ml.llm_eval_serving.cost_latency_design
items:
- id: S334
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Khi định cỡ dung lượng (capacity) cho một hệ LLM, vì sao ta đếm **token mỗi giây (tokens/s)**

    thay vì **request mỗi giây (QPS)**? Viết công thức đổi tải ra token/s cần và công thức suy ra

    **số GPU**.

    '
  answer_md: "Ta đếm **tokens/s** vì mỗi request dài ngắn rất khác nhau (một câu hỏi 20 token và một bài\
    \ tóm\ntắt 2.000 token ngốn GPU hoàn toàn khác nhau), nên QPS một mình không nói lên tải thật lên\
    \ GPU;\ncông việc GPU làm được đo bằng token sinh ra.\n\n- **token/s cần** = QPS × số token đầu ra\
    \ trung bình mỗi request.\n- **số GPU** = token/s cần ÷ token/s mỗi GPU (đo ở độ trễ chấp nhận được),\
    \ **cộng dự phòng\n  (headroom)** — thường nhắm ~70% mức bận chứ không 100%.\n"
  rubric_md: 'Đúng khi nêu được: (1) lý do đếm token/s — request dài ngắn khác nhau nên QPS không phản
    ánh

    tải GPU; (2) token/s cần = QPS × token đầu ra mỗi request; (3) số GPU = token/s cần ÷ token/s mỗi

    GPU (+ dự phòng). Đủ ba ý: bằng chứng điểm 1. Thiếu công thức số GPU hoặc không giải thích được

    vì sao dùng token/s: tối đa điểm 0.

    '
- id: S335
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Một chatbot nội bộ có **1.000 người dùng**, mỗi người trung bình **2 lượt/phút**, mỗi lượt
    sinh

    **300 token** đầu ra. Một GPU (continuous batching) sinh **2.500 token/s** ở độ trễ chấp nhận

    được; thuê GPU giá **2 USD/giờ** và ở mức tải này mỗi GPU sinh thực tế **2.000 token/s**.

    Hãy: (1) tính **token/s cần** và **số GPU** (nhắm ~70% mức bận, giải thích vì sao không 100%);

    (2) tính **chi phí mỗi 1 triệu token** khi GPU bận 100%; (3) nêu **hai** đòn giảm chi phí phù

    hợp và nói mỗi đòn giúp ở đâu.

    '
  answer_md: "**(1) Dung lượng.** token/s cần = 1.000 × 2 lượt/phút × 300 token = 600.000 token/phút ÷\
    \ 60 =\n**10.000 token/s**. Ở 100% bận cần 10.000 ÷ 2.500 = 4 GPU; nhưng chạy 100% không còn chỗ cho\
    \ đỉnh\ntải và hàng đợi, nên nhắm ~70%: 10.000 ÷ (2.500 × 0,70) ≈ 5,7 → **đặt 6 GPU**. (Dự phòng để\
    \ p95\nkhông vỡ khi tải nhảy.)\n\n**(2) Chi phí mỗi 1 triệu token (bận 100%).** 2.000 token/s × 3.600\
    \ = 7,2 triệu token/giờ; 2 USD\n÷ 7,2 triệu ≈ **0,28 USD mỗi 1 triệu token**. (Nếu GPU chỉ bận 30%\
    \ thì ≈ 0,93 USD vì vẫn trả đủ\ntiền thuê.)\n\n**(3) Hai đòn giảm chi phí** (nêu đúng hai trong số):\n\
    - **Cap max token đầu ra**: token decode đắt nhất, chặn câu trả lời lan man tiết kiệm gần như tỉ\n\
    \  lệ thuận.\n- **Prompt cache**: không prefill lại system prompt / tài liệu chung lặp lại → giảm\
    \ chi phí input\n  và hạ TTFT.\n- **Routing/cascade**: ca dễ cho model rẻ, chỉ ca khó mới dùng model\
    \ mạnh.\n- **Autoscale về 0 khi vắng** / **cache câu trả lời** cho câu hỏi trùng.\n"
  rubric_md: 'Đạt khi đúng cả ba: (1) 10.000 token/s và số GPU hợp lý (4 ở 100%, ~6 khi tính ~70% dự phòng)
    +

    giải thích vì sao không chạy 100%; (2) ~0,28 USD/triệu token với phép tính 7,2 triệu token/giờ;

    (3) hai đòn giảm chi phí kèm lý do. Đúng số học, trong time-box, tự giải thích được: bằng chứng

    điểm 2. Sai số học capacity hoặc chi phí, hoặc không nêu được dự phòng: tối đa điểm 1.

    '
- id: S336
  difficulty: 3
  type: concept
  minutes: 12
  prompt_md: '**(Phỏng vấn AI engineer)** Bạn thiết kế serving cho một tính năng LLM: khoảng **100 request/s**

    giờ cao điểm, mỗi request trung bình **500 token** đầu ra, mục tiêu **TTFT < 1 s** và trả lời

    dạng streaming. GPU thuê **2 USD/giờ**, mỗi GPU sinh **5.000 token/s** ở độ trễ đạt yêu cầu; một

    API thuê tính **0,60 USD mỗi 1 triệu token**. Hãy trình bày:

    (1) **capacity**: token/s cần, số GPU (kèm dự phòng), và vì sao đo throughput "ở độ trễ chấp

    nhận được" (nhắc prefill/decode, context, thế căng batch ↔ độ trễ);

    (2) **chi phí** mỗi 1 triệu token khi self-host và **điểm hoà vốn (break-even)** so với API —

    bằng con số, khi nào nên self-host, khi nào nên dùng API;

    (3) ít nhất **ba đòn giảm chi phí** kèm ước lượng tiết kiệm.

    '
  answer_md: "**(1) Capacity.** token/s cần = 100 × 500 = **50.000 token/s**. Ở 100% bận: 50.000 ÷ 5.000\
    \ =\n10 GPU; nhắm ~70% mức bận để chịu đỉnh và giữ p95: 50.000 ÷ (5.000 × 0,70) ≈ 14,3 → **~14-15\n\
    GPU**. Phải đo throughput **tại ngưỡng độ trễ còn chịu được** vì **batch càng lớn thì throughput\n\
    càng cao nhưng độ trễ (TTFT, per-token) càng tăng** — lấy throughput tối đa sẽ vỡ mục tiêu TTFT <\n\
    1 s. Nhớ **prefill** (nạp prompt, compute-bound, quyết định TTFT) khác **decode** (sinh từng\ntoken,\
    \ memory-bound); **context dài** làm prefill lâu và **KV cache** phình → ít request đồng\nthời hơn\
    \ → tokens/s hữu dụng giảm, nên đo với độ dài context thật.\n\n**(2) Chi phí và hoà vốn.** Mỗi GPU:\
    \ 5.000 token/s × 3.600 = 18 triệu token/giờ; chi phí ở\n**100% bận** = 2 ÷ 18 ≈ **0,11 USD mỗi 1\
    \ triệu token**. Ở mức bận u, chi phí = 0,11 ÷ u. Hoà vốn\nvới API 0,60: 0,11 ÷ u = 0,60 → u ≈ **0,18\
    \ (18%)**. Vậy chỉ cần giữ GPU bận trên ~18% là\nself-host đã rẻ hơn API — với 100 req/s đều đặn giờ\
    \ cao điểm thì self-host thắng rõ. Ngược lại,\nnếu tải **thấp hoặc thất thường (spiky)** khiến GPU\
    \ phần lớn thời gian rảnh (dưới ~18% bận),\n**API rẻ hơn** vì không trả cho GPU rảnh và không tốn\
    \ vận hành; API cũng hợp lúc đầu khi chưa đủ\nvolume hay cần fallback khi self-host lỗi.\n\n**(3)\
    \ Giảm chi phí** (ít nhất ba):\n- **Cap max token đầu ra**: decode đắt nhất; chặn output lan man,\
    \ tiết kiệm gần tỉ lệ thuận.\n- **Prompt cache**: bỏ prefill lại prefix chung (system prompt, tài\
    \ liệu) → giảm input ~50-90%\n  cho tải nhiều prefix trùng, hạ TTFT (tốt cho mục tiêu < 1 s).\n- **Routing/cascade**:\
    \ model rẻ/quantize làm ca dễ, model mạnh chỉ cho ca khó → ~30-70%.\n- **Cache câu trả lời (exact\
    \ + semantic)** cho câu trùng/gần nghĩa; **batch/offline API** cho\n  việc không gấp (~50%); **autoscale\
    \ về 0** lúc vắng để không trả cho GPU rảnh.\n"
  rubric_md: 'Đạt mức phỏng vấn (điểm 3) khi đủ cả ba: (1) capacity đúng — 50.000 token/s, số GPU có dự
    phòng

    (~14-15), và giải thích throughput đo ở ngưỡng độ trễ với lý do batch↔độ trễ, có nhắc

    prefill/decode hoặc context/KV cache; (2) chi phí self-host ~0,11 USD/triệu token (tính từ 18

    triệu token/giờ) VÀ lập luận break-even bằng con số (ngưỡng mức bận ~18%) + khi nào self-host vs

    API; (3) ≥3 đòn giảm chi phí kèm ước lượng. Đúng, trong time-box, tự giải thích rõ: bằng chứng

    điểm 3. Thiếu lập luận break-even bằng số, hoặc capacity không có dự phòng/giải thích độ trễ,

    hoặc dưới 3 đòn giảm chi phí: chưa đạt mức 3.

    '
