    tối đa điểm 0.'
- id: W219
  difficulty: 2
  type: read_code
  minutes: 3
  prompt_md: Hàm này định "bỏ phần tử trùng, giữ thứ tự". (a) In ra gì? (b) Bug và cách sửa.
  code: "def dedupe(xs):\n    seen = set()\n    out = []\n    for x in xs:\n        if x in seen:\n  \
    \          out.append(x)\n        seen.add(x)\n    return out\nprint(dedupe([1, 2, 1, 3, 2, 1]))"
  expected_output: '[1, 2, 1]'
  answer_md: 'Điều kiện bị ngược: đang thêm phần tử ĐÃ thấy. Sửa: `if x not in seen: out.append(x)`. Kết
    quả đúng: [1, 2, 3].'
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 2; sai: tối đa điểm 1.'
- id: X551
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Hàm `median(nums)` dưới đây bị bug: không sort và chia nguyên. Hãy sửa/viết lại: `nums`
    là list số nguyên không rỗng; sort rồi nếu độ dài lẻ trả phần tử giữa (int); nếu chẵn, trả trung bình
    hai phần tử giữa bằng phép chia thực, và trả `int` khi kết quả là số nguyên, ngược lại trả `float`.
    `median([3, 1, 2])` là `2`, `median([1, 2, 4, 5])` là `3`, `median([1, 2])` là `1.5`.

    '
  problem_id: check-x551-fix-median
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X552
  difficulty: 3
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu cho từng bug ẩn trong đó.
  code: "def add(x, acc=[]):\n    acc.append(x)\n    return acc\n\na = add(1)\nb = add(2)\nprint(a, b,\
    \ a is b)\nprint(add(3, []))\nnums = [1, 2, 2, 3]\nfor x in nums:\n    if x == 2:\n        nums.remove(x)\n\
    print(nums)"
  expected_output: '[1, 2] [1, 2] True

    [3]

    [1, 2, 3]'
  answer_md: Tham số mặc định `acc=[]` được tạo một lần nên `add(1)` và `add(2)` cùng dùng một list (`a
    is b` là `True`, cả hai thấy `[1, 2]`); truyền list mới `[]` thì chỉ có `[3]`. Ở vòng for, sau khi
    xóa số 2 đầu tiên các phần tử dồn trái nên số 2 thứ hai bị bỏ qua, kết quả `[1, 2, 3]`.
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng cả hai bug. Đúng:
    bằng chứng điểm 3; chỉ đúng một phần: tối đa điểm 1.'
