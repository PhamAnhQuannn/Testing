- id: Q164
  difficulty: 2
  type: read_code
  minutes: 3
  prompt_md: Đoạn code này có bug. (a) In ra gì? (b) Bug ở đâu và sửa thế nào?
  code: "def bs(a, t):\n    lo, hi = 0, len(a) - 1\n    while lo < hi:\n        mid = (lo + hi) // 2\n\
    \        if a[mid] == t: return mid\n        if a[mid] < t: lo = mid + 1\n        else: hi = mid -\
    \ 1\n    return -1\nprint(bs([1, 3, 5], 5), bs([7], 7), bs([1, 3, 5], 1))"
  expected_output: -1 -1 -1
  answer_md: 'Đáp án đúng phải là 2 0 0. Lỗi: `while lo < hi` bỏ sót trường hợp lo == hi; sửa thành `lo
    <= hi`.'
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 2; sai: tối đa điểm 1.'
