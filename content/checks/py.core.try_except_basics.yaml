subtopic_id: py.core.try_except_basics
items:
- id: Q016
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), dòng code in ra gì? Giải thích 1 câu.
  code: "def f(s):\n    try:\n        return int(s)\n    except ValueError:\n        return -1\nprint(f(\"\
    12\"), f(\"a1\"), f(\"\"))"
  expected_output: 12 -1 -1
  answer_md: int("a1") và int("") đều ném ValueError.
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
- id: Q017
  difficulty: 2
  type: concept
  minutes: 3
  prompt_md: Khi nào nên dùng try/except thay vì if? Cho 1 ví dụ.
  answer_md: Khi lỗi khó đoán trước hoặc kiểm tra tốn kém (đọc file, đổi chuỗi sang số, truy cập dict
    thiếu khóa). Không dùng except trần che lỗi; bắt đúng loại lỗi.
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 2; sai:
    tối đa điểm 1.'
- id: X360
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: "def f(s):\n    try:\n        n = int(s)\n    except ValueError:\n        print(\"bad\")\n   \
    \     return 0\n    else:\n        print(\"ok\")\n        return n\n    finally:\n        print(\"\
    end\")\n\nprint(f(\"5\"))\nprint(f(\"x\"))\n"
  expected_output: 'ok

    end

    5

    bad

    end

    0

    '
  answer_md: '`f("5")`: `try` thành công nên `else` in `ok`, `finally` in `end` rồi hàm trả 5. `f("x")`:
    `int` gây `ValueError`, `except` in `bad`, `finally` in `end`, trả 0.'
- id: X361
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết `safe_divide(pairs)`: `pairs` là list các cặp `[a, b]`. Trả về list kết quả `a // b`
    cho từng cặp; cặp nào chia cho 0 thì kết quả là chuỗi `"error"`. Dùng `try/except ZeroDivisionError`.

    '
  problem_id: check-x361-safe-divide
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box: bằng chứng điểm 2; phải xem gợi ý hoặc
    quá thời gian: tối đa điểm 1.'
- id: X362
  difficulty: 3
  type: write_code
  minutes: 10
  prompt_md: 'Viết `parse_ints(tokens)`: `tokens` là list các chuỗi. Trả về list các số nguyên đổi được
    bằng `int(...)`, giữ nguyên thứ tự và bỏ qua token không hợp lệ (dùng `try/except ValueError`). Ví
    dụ `["1", "x", " 3 ", "4.5"]` cho `[1, 3]`.

    '
  problem_id: check-x362-parse-ints
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem
    gợi ý hoặc quá thời gian: tối đa điểm 2.'
