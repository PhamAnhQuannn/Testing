  prompt_md: '"In-place" nghĩa là gì và vì sao nó thường yêu cầu O(1) bộ nhớ phụ? Nêu 2 kỹ thuật in-place.'
  answer_md: 'Sửa trực tiếp trên mảng gốc, không tạo mảng mới cùng cỡ. Ví dụ: reader/writer pointer, swap
    hai đầu, đảo ngược từng đoạn (xoay mảng), cờ Hà Lan.'
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 1; sai:
    tối đa điểm 0.'
