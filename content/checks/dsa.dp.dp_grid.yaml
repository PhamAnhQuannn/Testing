  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "grid = [[2, 1, 4], [3, 6, 1], [5, 2, 2]]\nrows, cols = len(grid), len(grid[0])\ndp = [[0] * cols\
    \ for _ in range(rows)]\nfor r in range(rows):\n    for c in range(cols):\n        if r == 0 and c\
    \ == 0:\n            dp[r][c] = grid[r][c]\n        elif r == 0:\n            dp[r][c] = dp[r][c -\
    \ 1] + grid[r][c]\n        elif c == 0:\n            dp[r][c] = dp[r - 1][c] + grid[r][c]\n      \
    \  else:\n            dp[r][c] = min(dp[r - 1][c], dp[r][c - 1]) + grid[r][c]\nprint(dp[-1])\nprint(dp[1][1],\
    \ dp[-1][-1])"
  expected_output: '[10, 11, 10]

    9 10'
  answer_md: 'Hàng 0 cộng dồn thành `[2, 3, 7]`. Hàng 1 là `[5, 9, 8]` (ô giữa: `min(3, 5) + 6 = 9`).
    Hàng 2 là `[10, 11, 10]` (ô giữa: `min(9, 10) + 2 = 11`; ô cuối: `min(8, 11) + 2 = 10`). Vậy `dp[-1]`
    là `[10, 11, 10]`, `dp[1][1] = 9` và `dp[-1][-1] = 10`.'
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
