items:
- id: Q171
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), dòng code in ra gì? Giải thích 1 câu.
  code: 'def add(a, b): return a + b

    tests = [(1, 2, 3), (0, 0, 0), (-1, 1, 1)]

    fails = [t for t in tests if add(t[0], t[1]) != t[2]]

    print(len(fails), fails)'
  expected_output: 1 [(-1, 1, 1)]
  answer_md: -1 + 1 = 0 khác 1 nên test thứ 3 fail (test sai hoặc code sai? hãy xem lại kỳ vọng).
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
- id: Q172
  difficulty: 2
  type: concept
  minutes: 3
  prompt_md: Viết 1 test pytest cho hàm `is_even(n)` gồm ít nhất 3 trường hợp (thường, biên, âm) và nói
    cách chạy.
  answer_md: 'def test_is_even(): assert is_even(2); assert not is_even(3); assert is_even(0); assert
    is_even(-4). Chạy: `pytest -q` trong thư mục dự án.'
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 2; sai:
    tối đa điểm 1.'
- id: W221
  difficulty: 2
  type: concept
  minutes: 3
  prompt_md: Test fail với `assert add(2, 3) == 6`. Pytest in gì giúp bạn gỡ lỗi? Bạn chạy chỉ test đó
    thế nào?
  answer_md: 'In giá trị hai vế của assert (assert 5 == 6) và dòng sai. Chạy một test: `pytest file.py::test_name
    -x -q`.'
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 2; sai:
    tối đa điểm 1.'
- id: Q259
  difficulty: 2
  type: read_code
  minutes: 5
  prompt_md: (a) Đoạn code in ra gì? (b) Nếu chạy bằng pytest, test_avg báo fail kiểu gì (AssertionError
    hay lỗi khác) và ở dòng nào? (c) Sửa `avg` để test_avg qua. (d) Viết lệnh chạy riêng đúng một test
    `test_avg` trong file test_x.py.
  code: "def avg(xs):\n    return sum(xs) / len(xs)\n\ndef test_avg():\n    assert avg([2, 4]) == 3\n\
    \    assert avg([]) == 0\n\ntry:\n    test_avg()\nexcept AssertionError:\n    print(\"assert\")\n\
    except ZeroDivisionError as e:\n    print(\"zero:\", e)"
  expected_output: 'zero: division by zero'
  answer_md: 'avg([]) chia cho len = 0 nên ZeroDivisionError (không phải AssertionError), ở dòng assert
    thứ hai. Sửa: `return sum(xs) / len(xs) if xs else 0`. Lệnh: `pytest test_x.py::test_avg`.'
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 2; sai: tối đa điểm 1.'
- id: X741
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết hàm `collect_results(tests)` mô phỏng một test runner nhỏ. `tests` là list các bộ ba
    `[name, got, want]` (name là chuỗi, got và want là giá trị bất kỳ so sánh được). Một test **pass**
    khi và chỉ khi `got == want`. Trả về dict `{"passed": <số test pass>, "failed": <số test fail>, "failures":
    [<tên các test fail theo thứ tự đầu vào>]}`. Ví dụ `[["t_add", 3, 3], ["t_sub", 1, 2], ["t_mul", 6,
    6]]` cho `{"passed": 2, "failed": 1, "failures": ["t_sub"]}`; `[]` cho `{"passed": 0, "failed": 0,
    "failures": []}`.

    '
  problem_id: check-x741-collect-results
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X742
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    test tên "cat" đầu tiên fail dù nhìn hai vế có vẻ giống nhau.
  code: "cases = [(\"add\", 1 + 2, 3), (\"cat\", \"1\" + \"2\", 12), (\"len\", len(\"ab\"), 2), (\"cat\"\
    , \"x\" * 2, \"xx\")]\nfailed = []\nfor name, got, want in cases:\n    if got != want:\n        failed.append(name)\n\
    print(len(cases) - len(failed))\nprint(failed)\nprint(set(failed))"
  expected_output: '3

    [''cat'']

    {''cat''}'
  answer_md: add pass (3 == 3), cat đầu fail vì '1' + '2' là chuỗi '12' khác số 12 (str không bằng int),
    len pass (2 == 2), cat thứ hai pass ('xx' == 'xx'). Nên passed = 4 - 1 = 3, failed = ['cat']. set
    gộp hai test trùng tên nên chỉ còn {'cat'}; list giữ đúng thứ tự và trùng lặp.
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng: ''12'' (str) khác 12 (int) nên test cat đầu fail.
    Đúng: bằng chứng điểm 3; sai: tối đa điểm 2.'
