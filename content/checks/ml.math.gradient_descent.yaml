  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    loss cuối lại rất lớn dù đã chạy gradient descent.
  code: "xs = [1, 2, 3]\nys = [2, 4, 6]\nw = 0.0\nfor _ in range(3):\n    grad = sum(2 * (w * x - y) *\
    \ x for x, y in zip(xs, ys)) / 3\n    w -= 0.3 * grad\n    print(round(w, 4))\nloss = sum((w * x -\
    \ y) ** 2 for x, y in zip(xs, ys)) / 3\nprint(round(loss, 2))"
  expected_output: '5.6

    -4.48

    13.664

    634.89'
  answer_md: 'Gradient bằng `(28/3)·2·(w − 2)`, nên mỗi bước `w − 2` được nhân với `1 − 0,3·9,33 = −1,8`:
    độ lệch đổi dấu và lớn dần (−2 → 3,6 → −6,48 → 11,66). Learning rate 0,3 vượt mốc ≈ 0,21 nên phân
    kỳ, loss = 11,664²·14/3 ≈ 634,89.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng lr quá lớn làm bước nhảy qua đáy, độ lệch tăng
