- id: X640
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Viết hàm `gradient_descent(xs, ys, w0, lr, steps)` chạy gradient descent cho mô hình `ŷ
    = w·x` với loss MSE `mean((w*x - y)²)`. Bắt đầu `w = w0`; lặp đúng `steps` lần: `w = w - lr * mean(2*(w*x
    - y)*x)` (trung bình trên mọi cặp `(x, y)`, gradient tính bằng `w` hiện tại). Trả `w` cuối dưới dạng
    float `round(w, 6)`. `steps = 0` thì trả `w0` làm tròn. `xs`, `ys` cùng độ dài. Ví dụ: `xs=[1,2,3]`,
    `ys=[2,4,6]`, `w0=0`, `lr=0.05`, `steps=20` cho `1.999993`.

    '
  problem_id: check-x640-gd
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X641
