  prompt_md: Chạy tay (không chạy máy), dòng code in ra gì? Giải thích 1 câu.
  code: "x = 5.0\nfor _ in range(3):\n    x -= 0.1 * 2 * x\nprint(round(x, 4))"
  expected_output: '2.56'
  answer_md: 'Tối thiểu hoá f=x^2 (gradient 2x) với learning rate 0.1: 5 -> 4 -> 3.2 -> 2.56.'
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
- id: Q234
  difficulty: 2
  type: concept
  minutes: 3
  prompt_md: Learning rate quá lớn hoặc quá nhỏ gây gì? Phân biệt batch, mini-batch, stochastic gradient
