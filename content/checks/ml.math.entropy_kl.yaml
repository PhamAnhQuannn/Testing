- id: X658
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    KL không âm.
  code: 'import math

    p = [0.5, 0.5]

    q = [0.25, 0.75]

    ce = -sum(a * math.log2(b) for a, b in zip(p, q))

    h = -sum(a * math.log2(a) for a in p)

    print(round(ce, 4))

    print(round(ce - h, 4))'
  expected_output: '1.2075

    0.2075'
  answer_md: H(p,q) = 0,5·2 + 0,5·0,415 = 1,2075 bit; H(p) = 1 bit nên KL(p‖q) = 1,2075 − 1 = 0,2075.
    KL = H(p,q) − H(p) ≥ 0 vì cross-entropy không bao giờ nhỏ hơn entropy của chính p; chỉ bằng 0 khi
    q = p.
  rubric_md: 'Output khớp từng dòng VÀ giải thích KL ≥ 0 (cross-entropy ≥ entropy, bằng nhau khi q = p).
    Đúng: bằng chứng điểm 3; sai: tối đa điểm 2.'
