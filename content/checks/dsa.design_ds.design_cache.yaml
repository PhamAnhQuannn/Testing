- id: X503
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "B = 4\nbuckets = [[] for _ in range(B)]\n\ndef put(k, v):\n    b = buckets[k % B]\n    for pair\
    \ in b:\n        if pair[0] == k:\n            pair[1] = v\n            return\n    b.append([k, v])\n\
    \ndef get(k):\n    for kk, v in buckets[k % B]:\n        if kk == k:\n            return v\n    return\
    \ -1\n\nput(1, 10); put(5, 20); put(2, 30); put(1, 99)\nprint(get(1), get(5), get(9))\nprint(buckets)"
  expected_output: '99 20 -1

    [[], [[1, 99], [5, 20]], [[2, 30]], []]'
  answer_md: Key 1 và 5 cùng rơi vào bucket 1 (collision) nên nằm chung một danh sách; `put(1, 99)` ghi
    đè cặp cũ thay vì thêm mới. `get(9)` rơi vào bucket 1 nhưng không có key 9 nên trả `-1`.
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
