- id: X894
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
  code: 'msg = [72, 105]

    key = 5

    enc = [b ^ key for b in msg]

    print(enc)

    dec = [b ^ key for b in enc]

    print(dec)

    print(dec == msg)

    data = [10, 10, 10, 10]

    k = [1, 2]

    print([d ^ k[i % 2] for i, d in enumerate(data)])'
  expected_output: '[77, 108]

    [72, 105]

    True

    [11, 8, 11, 8]'
  answer_md: '72 ^ 5 = 77 và 105 ^ 5 = 108. XOR lần nữa với cùng key trả về [72, 105] nên so sánh True.
    Ở phần cuối key [1, 2] lặp vòng: 10 ^ 1 = 11, 10 ^ 2 = 8, rồi lặp lại.'
  rubric_md: 'Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0.'
- id: X895
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết hàm `xor_cipher(data, key)` cài mã XOR đối xứng khoá lặp vòng (repeating-key XOR).
    `data` là list số nguyên 0-255 (byte), `key` là list số nguyên không rỗng; trả về list số nguyên `out`
    với `out[i] = data[i] ^ key[i % len(key)]` (key lặp vòng nếu ngắn hơn data). Vì XOR là involution
    nên gọi lại với cùng key sẽ khôi phục data gốc. Data rỗng trả `[]`. Ví dụ `xor_cipher([65,66,67],[7])`
    trả `[70,69,68]`, còn `xor_cipher([1,2,3,4],[1,2])` trả `[0,0,2,6]`.

    '
  problem_id: check-x895-xor-cipher
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X896
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và phân loại lỗi liên
    quan đến dòng thứ 5 của output (cú pháp, lúc chạy hay logic) cùng ý nghĩa của dòng cuối.
  code: "def h(s):\n    return sum(ord(c) for c in s) % 10\n\n\nprint(h(\"ab\"), h(\"ba\"))\nprint(h(\"\
    abc\"))\na = [3, 7, 9]\nk = [4, 4]\nc = [x ^ k[i % len(k)] for i, x in enumerate(a)]\nprint(c)\nprint([x\
    \ ^ k[0] for x in c])\ntry:\n    print([x ^ [][0] for x in a])\nexcept IndexError:\n    print(\"runtime\
    \ error\")\nprint(h(\"ab\") == h(\"ba\"))"
  expected_output: '5 5

    4

    [7, 3, 13]

    [3, 7, 9]

    runtime error

    True'
  answer_md: 'ord(''a'') = 97, ord(''b'') = 98, ord(''c'') = 99. h(''ab'') = 195 % 10 = 5 và h(''ba'')
    = 5; h(''abc'') = 294 % 10 = 4. c = [3 ^ 4, 7 ^ 4, 9 ^ 4] = [7, 3, 13]; XOR lại với 4 trả [3, 7, 9].
    Biểu thức [][0] lấy phần tử của list rỗng nên ném IndexError lúc chạy và in runtime error. Dòng cuối
    True: h(''ab'') == h(''ba'') là một va chạm (collision), cho thấy hàm băm tổng ký tự % 10 rất yếu.'
  rubric_md: 'Output khớp từng dòng VÀ phân loại đúng: [][0] là lỗi runtime (IndexError ném lúc chạy,
    không phải cú pháp hay logic); dòng True là va chạm hash vì hai chuỗi khác nhau cùng digest. Đúng:
    bằng chứng điểm 3; sai: tối đa điểm 2.'
