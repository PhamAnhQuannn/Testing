subtopic_id: sd.archetypes.data_pipeline
items:
- id: S178
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Kể **ba tầng** của một data pipeline theo đúng thứ tự, và nói một câu về vai trò của **Kafka**

    đặt giữa nguồn và bộ xử lý.

    '
  answer_md: 'Ba tầng: **thu thập (ingestion)** -> **xử lý (processing)** -> **kho đích (sinks)**.

    Kafka là **bộ đệm bền (durable buffer)** đứng giữa, **tách nhịp (decouple)** nguồn khỏi đích:

    nguồn ghi theo tốc độ của nó, bộ xử lý tiêu thụ theo tốc độ của nó, Kafka hấp thụ lúc dồn ứ và

    **giữ lại** sự kiện để có thể đọc lại sau.

    '
  rubric_md: 'Đúng khi nêu đủ ba tầng đúng thứ tự (thu thập -> xử lý -> kho) và nói Kafka là bộ đệm/tách
    nhịp (hoặc ý giữ lại để đọc lại). Đủ ý: bằng chứng điểm 1; thiếu thứ tự ba tầng hoặc không nêu vai
    trò Kafka: tối đa điểm 0.'
- id: S179
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'App gửi sự kiện **"xem sản phẩm"**; dashboard cần hiện **số lượt xem mỗi sản phẩm theo từng

    giờ**, trễ không quá 1 phút. Hãy: (1) chọn **khoá partition** cho Kafka và nói vì sao; (2) nêu

    **hai nhánh lưu** và mỗi nhánh dùng kho gì; (3) giải thích vì sao việc ghi vào kho đích phải

    **idempotent**.

    '
  answer_md: '(1) Partition theo **product_id**: các lượt xem của cùng một sản phẩm về **cùng một partition**

    nên gộp theo (sản phẩm, giờ) dễ và giữ thứ tự; chia tải khá đều nếu không có sản phẩm quá nóng

    (nếu có thì **salting** khoá nóng).

    (2) Hai nhánh: **nhánh luồng -> kho OLAP** cho dashboard truy vấn nhanh (đáp ứng trễ < 1 phút);

    **nhánh data lake** (Parquet trên S3, chia theo ngày) lưu thô giá rẻ làm nguồn sự thật để tính

    lại/phân tích sau.

    (3) Vì pipeline giao **at-least-once** nên một sự kiện có thể tới hai lần (và khi **replay** càng

    dễ trùng); ghi **idempotent** — khử trùng theo `event_id` hoặc **upsert** theo (sản phẩm, giờ) —

    để chạy lại không **đếm đúp**.

    '
  rubric_md: 'Đạt (điểm 2) khi nêu đúng cả 3 ý: partition theo product_id (gộp đúng + chia tải/skew),
    hai nhánh OLAP + data lake với vai trò từng nhánh, và idempotent vì at-least-once/replay để tránh
    đếm đúp. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu ý idempotent hoặc chỉ
    nêu một nhánh lưu: tối đa điểm 1.'
- id: S180
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: 'Thiết kế **đầy đủ** một data pipeline từ nguồn đến kho báo cáo cho **100.000 sự kiện/giây**,

    mỗi sự kiện **1 KB**. Yêu cầu: (a) vẽ dây chuyền từ thu thập đến **hai nhánh lưu**; (b) **ước

    lượng dung lượng** thô mỗi ngày, sau nén cột khoảng 5 lần, và cỡ Kafka giữ 7 ngày x 3 bản sao;

    (c) nêu cách **quản lý schema**; (d) nêu cách **tính lại số liệu khi lỗi code**.

    '
  answer_md: '(a) **Thu thập**: SDK gom lô -> collector stateless sau LB -> **Kafka** (hoặc CDC nếu nguồn
    là

    DB), partition theo khoá gộp (ví dụ product_id), salting khi có khoá nóng. **Xử lý**: bộ xử lý

    **luồng** gộp theo cửa sổ event time + watermark cho số gần thời gian thực. **Hai nhánh lưu**:

    (1) -> **kho OLAP** cho dashboard; (2) -> **data lake** (Parquet/S3 theo ngày) lưu thô làm nguồn

    sự thật.

    (b) Thô = 100.000 x 1 KB = **100 MB/s** = khoảng **8,6 TB/ngày**; nén cột ~5 lần còn gần **1,7

    TB/ngày** trong data lake; **Kafka** giữ 7 ngày x 3 bản sao = 100 MB/s x 86.400 x 7 x 3, cỡ

    **khoảng 180 TB** cần cấp phát (nói rõ phép nhân là đạt).

    (c) **Schema registry** lưu phiên bản schema và kiểm tra tương thích: thêm cột mới thì bên đọc cũ

    bỏ qua (được); đổi kiểu cột làm bên đọc cũ hỏng thì **chặn**. Sự kiện sai schema đẩy vào **DLQ**,

    không chặn dòng chảy.

    (d) **Tính lại (replay/backfill)**: sửa code xong, **đọc lại** sự kiện cũ từ Kafka (còn trong

    retention) hoặc từ **data lake** qua pipeline mới để **ghi đè** số sai; an toàn vì kho đích ghi

    **idempotent** (upsert theo khoá / khử trùng event_id) nên chạy lại không đếm đúp. Có thể dùng

    kiểu **lambda** (nhánh lô tính lại) hoặc **kappa** (replay một nhánh).

    '
  rubric_md: 'Đạt mức 3 (phỏng vấn) khi: vẽ được dây chuyền thu thập -> xử lý -> HAI nhánh lưu (OLAP +
    data lake); ước lượng đúng ~8,6 TB/ngày thô, ~1,7 TB/ngày sau nén, và biết nhân 7 ngày x 3 bản sao
    cho Kafka; nêu schema registry + tiến hoá/chặn đổi kiểu; và giải thích tính lại bằng replay/backfill
    dựa trên ghi idempotent. Đúng, trong time-box, tự giải thích rõ: bằng chứng điểm 3. Sót nhánh lưu
    thứ hai, không ước lượng được dung lượng, hoặc không gắn replay với idempotent: chưa đạt mức 3.'
