- id: X661
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích dòng
    cuối nghĩa là gì.
  code: 'import math

    n = 10000

    a = 500 / n

    b = 540 / n

    se = math.sqrt(a * (1 - a) / n + b * (1 - b) / n)

    print(round(se, 4))

    print(round((b - a) / se, 2))

    print(round(0.05 / 20, 4))'
  expected_output: '0.0031

    1.27

    0.0025'
  answer_md: 'SE chênh = √(0,05·0,95/10000 + 0,054·0,946/10000) ≈ 0,0031; z = 0,004/0,0031 ≈ 1,27 (p hai
    phía ≈ 0,20, chưa đủ bằng chứng). Dòng cuối là ngưỡng Bonferroni: α/m = 0,05/20 = 0,0025 cho mỗi lần
    thử khi thử 20 giả thuyết.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích dòng cuối là α chia cho số lần thử (Bonferroni). Đúng:
    bằng chứng điểm 3; sai: tối đa điểm 2.'
