  prompt_md: 'Viết `class VendingMachine`: constructor không tham số (kho rỗng, balance 0). `load(code,
    qty, price)` nạp `qty` sản phẩm vào ngăn `code` với giá `price` (int); gọi lại thì ghi đè. `insert(amount)`
    cộng `amount` (int) vào balance. `select(code)`: nếu ngăn tồn tại, còn hàng và `balance >= price`
    thì nhả 1 sản phẩm (trừ kho), trả tiền thừa `balance - price` (int) và đặt balance về 0; ngược lại
    trả `-1` và giữ nguyên balance. `balance()` trả balance hiện tại. Ví dụ `load("A1", 2, 10)`, `insert(25)`,
    `select("A1")` trả 15 và `balance()` là 0.

    '
  problem_id: check-x607-vending-machine
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
