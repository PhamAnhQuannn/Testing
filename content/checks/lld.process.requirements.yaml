  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Giải thích 1 câu vì sao.
  code: "class Spec:\n    def __init__(self):\n        self.kinds = []\n\n    def add(self, kind, text):\n\
    \        self.kinds.append(kind)\n\n    def count(self, kind):\n        return sum(1 for k in self.kinds\
    \ if k == kind)\n\n\ns = Spec()\ns.add(\"functional\", \"issue ticket\")\ns.add(\"nonfunctional\"\
    , \"gate under 1s\")\ns.add(\"functional\", \"charge fee\")\ns.add(\"functional\", \"show free spots\"\
    )\nprint(s.count(\"functional\"))\nprint(s.count(\"nonfunctional\"))\nprint(len(s.kinds))"
  expected_output: '3

    1

    4'
  answer_md: Ba yêu cầu `functional` và một `nonfunctional`; tổng bốn. `count` đếm theo loại đã ghi.
  rubric_md: 'Output khớp VÀ nêu đếm theo loại yêu cầu. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0.'
- id: X592
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Viết `class RequirementSpec` ghi lại kết quả làm rõ yêu cầu: constructor không tham số;
    `add(kind, text)` ghi một yêu cầu với `kind` là `"functional"` hoặc `"nonfunctional"`; `set_scope(text,
    inside)` ghi `text` là in-scope nếu `inside` là True, ngược lại là out-of-scope; `count(kind)` trả
    số (int) yêu cầu theo loại; `in_scope()` trả list các text in-scope đã sắp xếp tăng dần. Ví dụ thêm
    `("functional", "login")` và `("nonfunctional", "fast")` thì `count("functional")` là 1.

    '
  problem_id: check-x592-requirement-spec
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X593
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích yêu
    cầu nào là chức năng, yêu cầu nào là phi chức năng và vì sao.
  code: "WORDS = (\"fast\", \"ms\", \"concurrent\")\n\n\ndef classify(text):\n    return \"nonfunctional\"\
    \ if any(w in text for w in WORDS) else \"functional\"\n\n\nreqs = [\n    \"issue ticket\",\n    \"\
    respond in 50 ms\",\n    \"charge fee\",\n    \"1000 concurrent cars\",\n    \"park motorbike\",\n\
    ]\nout = [\"charge fee\", \"park motorbike\"]\nkept = sorted(r for r in reqs if r not in out)\nprint([classify(r)\
    \ for r in kept])\nprint(kept)\nprint(sum(1 for r in reqs if classify(r) == \"functional\"))"
  expected_output: '[''nonfunctional'', ''functional'', ''nonfunctional'']

    [''1000 concurrent cars'', ''issue ticket'', ''respond in 50 ms'']

    3'
  answer_md: 'Loại hai yêu cầu out-of-scope còn ba mục, sắp xếp theo chữ cái. "concurrent" và "ms" là
    từ khoá phi chức năng; "issue ticket" là chức năng. Cuối cùng đếm trên danh sách đầy đủ: ba mục chức
    năng.'
  rubric_md: 'Output khớp từng dòng VÀ phân loại đúng chức năng và phi chức năng. Đúng: bằng chứng điểm
    3; sai: tối đa điểm 2.'
