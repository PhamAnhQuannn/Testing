  prompt_md: 'So sánh adjacency list và adjacency matrix: bộ nhớ, kiểm tra cạnh (u,v), duyệt hàng xóm.
    Khi nào chọn cái nào?'
  answer_md: 'List: O(V+E) bộ nhớ, kiểm tra cạnh O(deg), duyệt hàng xóm O(deg); hợp đồ thị thưa. Matrix:
    O(V^2), kiểm tra cạnh O(1), duyệt hàng xóm O(V); hợp đồ thị dày hoặc V nhỏ.'
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 1; sai:
    tối đa điểm 0.'
