- id: X378
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "class V:\n    def __init__(self, x):\n        self.x = x\n\n    def __repr__(self):\n       \
    \ return f\"V({self.x})\"\n\n    def __add__(self, other):\n        return V(self.x + other.x)\n\n\
    \    def __len__(self):\n        return self.x\n\n\na, b = V(2), V(0)\nprint(a + b)\nprint(len(a +\
    \ a))\nprint(bool(b), bool(a))\nprint([a, b])\nprint(f\"{a}\")"
  expected_output: 'V(2)

    4

    False True

    [V(2), V(0)]

    V(2)'
  answer_md: '`print` dùng `__str__`, mà class chỉ có `__repr__` nên rơi về `__repr__` (cũng đúng cho
    f-string và phần tử trong list). `a + b` gọi `__add__` ra `V(2)`; `len(a + a)` là `V(4)` có độ dài
    4. Không có `__bool__` nên `bool` dùng `__len__`: độ dài 0 là `False`, độ dài 2 là `True`.'
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
- id: X379
