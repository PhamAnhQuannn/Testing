  prompt_md: 'Viết `add_vectors(a, b)` nhận hai list `[x, y]`. Bên trong, định nghĩa class `Vector` có
    `__init__(self, x, y)`, `__add__` (cộng từng thành phần, trả `Vector` mới) và `__repr__` dạng `Vector(x,
    y)`. Trả về `repr` của `Vector(*a) + Vector(*b)`. Ví dụ `add_vectors([1, 2], [10, 20])` là `"Vector(11,
    22)"`.

    '
  problem_id: check-x379-vector-add
  rubric_md: 'Pass toàn bộ test ẩn. Đúng không gợi ý trong time-box (5 phút): bằng chứng điểm 2; sai hoặc
