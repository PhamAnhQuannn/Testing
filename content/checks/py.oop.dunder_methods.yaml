  prompt_md: 'Viết `rank_money(cents)` nhận list số xu (số nguyên không âm). Bên trong, định nghĩa class
    `Money` lưu số xu, có `__lt__` (so sánh theo xu), `__add__` (trả `Money` mới) và `__str__` dạng `"<xu//100>.<xu%100
    hai chữ số>"` (ví dụ 505 thành `"5.05"`). Trả về list gồm các số tiền đã sắp xếp tăng dần (dạng chuỗi
    `str`), phần tử cuối cùng là tổng tất cả (cũng dạng chuỗi). Ví dụ `rank_money([1250, 505, 99])` là
    `["0.99", "5.05", "12.50", "18.54"]`; list rỗng cho `["0.00"]`. Gợi ý: `sorted` chỉ cần `__lt__`.

    '
  problem_id: check-x380-money-sort
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 12 phút: bằng chứng điểm 3; phải xem
