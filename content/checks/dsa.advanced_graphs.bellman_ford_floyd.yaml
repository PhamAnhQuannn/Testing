items:
- id: X459
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "INF = float(\"inf\")\nedges = [(1, 2, 3), (0, 1, 2), (0, 2, 9)]\ndist = [0, INF, INF]\nfor r\
    \ in range(2):\n    tmp = dist[:]\n    for u, v, w in edges:\n        if dist[u] + w < tmp[v]:\n \
    \           tmp[v] = dist[u] + w\n    dist = tmp\n    print(r, dist)"
  expected_output: '0 [0, 2, 9]

    1 [0, 2, 5]'
  answer_md: 'Vì mỗi vòng đọc từ `dist` cũ và ghi vào bản sao `tmp`, vòng 0 chỉ thêm được một cạnh: cạnh
    `(1, 2, 3)` chưa dùng được do `dist[1]` còn là vô cực, nên `dist[2]` lấy cạnh trực tiếp 9. Sang vòng
    1, `dist[1] = 2` nên đường `0 -> 1 -> 2` giá `2 + 3 = 5` thay cho 9.'
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
- id: X460
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Viết `find_cheapest_price(n, flights, src, dst, k)`: `flights` là danh sách chuyến bay một
    chiều `[u, v, price]` giữa `n` thành phố `0..n-1`. Trả về giá rẻ nhất từ `src` đến `dst` với TỐI ĐA
    `k` điểm dừng (tức tối đa `k + 1` chuyến), hoặc `-1` nếu không có đường. `find_cheapest_price(3, [[0,
    1, 100], [1, 2, 100], [0, 2, 500]], 0, 2, 1)` là `200`, còn với `k = 0` là `500`. Gợi ý: Bellman-Ford
    `k + 1` vòng, mỗi vòng relax từ bản sao `dist[:]`.

    '
  problem_id: check-x460-cheapest-flights-k-stops
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X461
  difficulty: 3
  type: write_code
  minutes: 10
  prompt_md: 'Viết `find_the_city(n, edges, distance_threshold)`: `edges` là các đường vô hướng `[u, v,
    w]` giữa `n` thành phố `0..n-1`. Trả về thành phố đến được ÍT thành phố khác nhất bằng đường đi có
    tổng độ dài không vượt quá `distance_threshold`; nếu hòa thì lấy thành phố có chỉ số LỚN nhất. `find_the_city(3,
    [[0, 1, 1], [1, 2, 1]], 1)` là `2`. Gợi ý: Floyd-Warshall O(n^3) rồi đếm.

    '
  problem_id: check-x461-find-the-city
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 10 phút: bằng chứng điểm 3; phải xem
    gợi ý hoặc quá thời gian: tối đa điểm 2.'
