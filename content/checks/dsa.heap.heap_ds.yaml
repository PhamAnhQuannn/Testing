  prompt_md: Heap là gì? Chi phí push, pop, peek, heapify? Python có max-heap không?
  answer_md: 'Cây nhị phân gần đầy, cha <= con (min-heap). push/pop O(log n), peek O(1), heapify O(n).
    heapq chỉ có min-heap; max-heap: đẩy số âm.'
