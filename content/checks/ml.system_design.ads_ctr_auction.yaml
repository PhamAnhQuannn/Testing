subtopic_id: ml.system_design.ads_ctr_auction
items:
- id: S349
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Nói ngắn gọn: trong đấu giá quảng cáo, điểm xếp hạng được tính thế nào từ **bid** và **pCTR**,

    và "pCTR đã **calibrated** (hiệu chỉnh)" nghĩa là gì?

    '
  answer_md: 'Đấu giá (trả theo click) xếp ứng viên theo **giá trị kỳ vọng mỗi lần hiển thị = bid × pCTR**

    (và eCPM = bid × pCTR × 1000 là doanh thu kỳ vọng mỗi 1.000 lượt hiển thị). pCTR là xác suất

    model dự đoán người xem sẽ bấm.


    **pCTR calibrated** nghĩa là con số đó là một **xác suất thật**: khi model nói pCTR = 2% thì

    nhóm những lần nó nói "2%" thực tế click khoảng 2%. Điều này quan trọng vì đấu giá dùng giá

    trị tuyệt đối của pCTR để nhân ra tiền, chứ không chỉ để so cao–thấp.

    '
  rubric_md: 'Đúng khi nêu được: (1) điểm xếp = bid × pCTR (giá trị kỳ vọng mỗi hiển thị); và (2) calibrated
    = xác suất dự đoán khớp tỉ lệ click thật (model nói 2% thì thực tế ~2%). Đủ cả hai ý: bằng chứng điểm
    1. Thiếu công thức bid × pCTR, hoặc định nghĩa calibration sai (nhầm thành ''độ chính xác/AUC''):
    tối đa điểm 0.'
- id: S350
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Một đồng nghiệp khoe model CTR mới **AUC cao hơn** model cũ, nên đề nghị đưa thẳng vào đấu
    giá.

    Khi thử, bạn thấy ngân sách của nhiều nhà quảng cáo **tiêu hết quá sớm** và chi tiêu ước tính

    lệch so với thực thu, dù thứ hạng quảng cáo trông hợp lý. Hãy giải thích: (1) vì sao **chỉ AUC

    cao là chưa đủ** cho đấu giá; (2) bạn **đo** và **sửa** vấn đề này thế nào; (3) nêu một nguyên

    nhân kỹ thuật thường gặp khiến pCTR bị lệch có hệ thống.

    '
  answer_md: '(1) **AUC chỉ đo thứ tự** (ai click nhiều hơn ai) và **bất biến với mọi phép bóp đơn điệu**
    lên

    xác suất. Nhưng đấu giá dùng **giá trị tuyệt đối** bid × pCTR để tính tiền và điều tiết ngân

    sách (pacing). Nếu pCTR bị thổi phồng đồng đều, AUC vẫn cao và thứ hạng trong một chiến dịch

    vẫn hợp lý, nhưng doanh thu kỳ vọng bị ước tính cao → ngân sách tiêu quá nhanh và chi tiêu ước

    tính lệch thực thu. Vậy model **mất calibration**.


    (2) **Đo**: vẽ **biểu đồ reliability** (so pCTR trung bình từng nhóm với tỉ lệ click thật) trên

    tập giữ riêng và tính **ECE**; nếu đường nằm trên đường chéo thì pCTR đang bị thổi. **Sửa**:

    hiệu chỉnh hậu xử lý bằng **Platt scaling** (ít tham số) hoặc **isotonic regression** (linh

    hoạt hơn, cần nhiều dữ liệu), fit trên tập giữ riêng; chọn model/bản hiệu chỉnh theo ECE chứ

    không chỉ theo AUC.


    (3) Nguyên nhân hay gặp: **negative downsampling** (chỉ giữ tỉ lệ w mẫu không-click để train

    nhanh) làm pCTR phồng lên; chỉnh lại bằng p = p''·w / (p''·w + 1 − p'').

    '
  rubric_md: 'Đạt (điểm 2) khi nêu đúng cả 3: (1) AUC chỉ đo thứ hạng/bất biến với bóp đơn điệu, còn đấu
    giá dùng xác suất tuyệt đối để tính tiền + pacing → cần calibration; (2) đo bằng reliability curve
    + ECE (trên held-out) và sửa bằng Platt scaling hoặc isotonic regression; (3) một nguyên nhân lệch
    có hệ thống (thường là negative downsampling, kèm hoặc không kèm công thức chỉnh). Đúng, trong time-box,
    tự giải thích được: bằng chứng điểm 2. Thiếu ý calibration là gốc (vẫn chỉ nói về AUC), hoặc không
    nêu được cách đo/sửa: tối đa điểm 1.'
- id: S351
  difficulty: 3
  type: concept
  minutes: 12
  prompt_md: '**(Phỏng vấn AI engineer)** Thiết kế pipeline **dự đoán CTR** cho một nền tảng quảng cáo
    lớn và

    nối vào đấu giá. Hãy trình bày:

    (1) kiến trúc pipeline (lấy ứng viên → chấm pCTR → đấu giá), feature thưa/embedding và cách giữ

    model tươi ở quy mô lớn;

    (2) **vì sao calibration quan trọng với đấu giá**, và bạn đo + bảo đảm calibration thế nào;

    (3) cách xử lý **chuyển đổi đến trễ (delayed conversions)** khi tối ưu theo conversion.

    '
  answer_md: '**(1) Pipeline.** Mỗi lần có chỗ trống: **lấy ứng viên** (từ hàng triệu quảng cáo, dùng

    targeting + chỉ mục dựng sẵn lọc còn vài trăm cái hợp người xem) → **chấm pCTR** cho từng ứng

    viên bằng model dựa trên đặc trưng (người xem × quảng cáo × ngữ cảnh) → **đấu giá** xếp theo

    bid × pCTR, chọn quảng cáo thắng. Feature phần lớn **thưa/categorical** (user_id, ad_id, từ

    khoá, thiết bị) với hàng triệu giá trị; dùng **hashing** và/hoặc **embedding** rồi đưa vào

    logistic regression / mạng nơ-ron. Quy mô hàng tỉ lượt/ngày và phân phối trôi nhanh, nên

    **học online / cập nhật liên tục** để pCTR luôn tươi; phục vụ trong ngân sách độ trễ của ad

    server.


    **(2) Vì sao calibration quan trọng + cách bảo đảm.** Đấu giá dùng **giá trị tuyệt đối** bid ×

    pCTR để xếp hạng, **tính giá** cho nhà quảng cáo và **điều tiết ngân sách (pacing)**. pCTR

    lệch → tiền và nhịp tiêu sai, và thứ hạng lệch khi so các bid khác nhau. **AUC là chưa đủ** vì

    nó chỉ đo thứ tự, bất biến với phép bóp đơn điệu lên xác suất. Vậy pCTR phải **calibrated**:

    model nói 2% thì thực tế ~2%. **Đo** bằng biểu đồ **reliability + ECE** trên tập giữ riêng;

    **bảo đảm** bằng hiệu chỉnh hậu xử lý (**Platt scaling** hoặc **isotonic regression**) và chỉnh

    thiên lệch do **negative downsampling** theo p = p''·w / (p''·w + 1 − p''); theo dõi ECE liên tục

    khi model cập nhật online.


    **(3) Chuyển đổi đến trễ.** Với CVR (mua sau click), nhãn "mua" có thể đến nhiều ngày sau; chốt

    nhãn quá sớm biến mẫu dương thành âm giả → CVR bị dìm và lệch calibration. Xử lý bằng **cửa sổ

    quy kết (attribution window)** đủ dài (ví dụ 7 ngày) và/hoặc **mô hình hoá độ trễ

    (delayed-feedback modeling)** để mẫu chưa chuyển đổi không bị coi chắc chắn là âm mà được hiệu

    chỉnh theo xác suất còn chuyển đổi, cập nhật khi nhãn muộn về. CVR cũng cần calibrated vì nó đi

    vào định giá/tối ưu.

    '
  rubric_md: 'Đạt mức phỏng vấn (điểm 3) khi trình bày đủ ba trụ: (1) pipeline lấy ứng viên → chấm pCTR
    → đấu giá, có feature thưa + hashing/embedding và online learning cho quy mô lớn; (2) giải thích calibration
    quan trọng vì đấu giá dùng xác suất tuyệt đối (bid × pCTR) để tính tiền/pacing và AUC không đủ, kèm
    cách đo (reliability + ECE) và bảo đảm (Platt/isotonic, chỉnh downsampling); (3) xử lý delayed conversions
    bằng attribution window và/hoặc delayed-feedback modeling, có nhận ra việc chốt nhãn sớm tạo âm giả.
    Đúng, mạch lạc, tự giải thích rõ trong time-box: bằng chứng điểm 3. Thiếu phần vì-sao-calibration-cho-đấu-giá,
    hoặc không xử lý được chuyển đổi đến trễ: chưa đạt mức 3.'
