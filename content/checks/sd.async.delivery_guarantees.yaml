subtopic_id: sd.async.delivery_guarantees
items:
- id: S115
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Nói ngắn gọn ba ngữ nghĩa giao nhận (delivery semantics) **at-most-once**, **at-least-once**,

    **exactly-once** khác nhau ở đâu, và cái nào là **mặc định thực tế** của hầu hết hệ thống?

    '
  answer_md: "- **At-most-once:** giao nhiều nhất một lần — có thể **mất** tin, không bao giờ **trùng**\
    \ (ack\n  trước khi xử lý).\n- **At-least-once:** giao ít nhất một lần — không mất, nhưng có thể **trùng**\
    \ (ack sau khi xử\n  lý; chết trước khi ack thì bị giao lại). Đây là **mặc định thực tế** vì mất tin\
    \ thường tệ hơn\n  trùng, và trùng còn chữa được.\n- **Exactly-once:** không mất, không trùng — lý\
    \ tưởng nhưng khó nhất, trong thực tế đạt bằng\n  at-least-once + khử trùng ở bên nhận, chứ không\
    \ phải nhờ đường truyền.\n"
  rubric_md: 'Đạt khi phân biệt đúng cả ba (mất/không, trùng/không) và nêu at-least-once là mặc định thực
    tế. Đúng đủ ý: bằng chứng điểm 1; thiếu một ngữ nghĩa hoặc không chỉ ra mặc định: tối đa điểm 0.'
- id: S116
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Một consumer nhận sự kiện "đơn #5 đã thanh toán" từ một queue chạy **at-least-once**, và
    đôi khi

    **cùng một sự kiện bị giao hai lần** nên tiền bị cộng đôi. Hãy: (1) giải thích vì sao at-least-once

    gây ra tình huống trùng này; (2) thiết kế cách để tiền chỉ cộng **một lần**; (3) gọi tên tính chất

    bạn vừa đạt được cho consumer.

    '
  answer_md: '(1) At-least-once ack **sau** khi xử lý; nếu consumer (hoặc đường ack) chết sau khi đã cộng
    tiền

    nhưng **trước khi ack**, broker không thấy ack nên **giao lại** sự kiện — lần hai lại cộng tiền.

    (2) Làm **consumer idempotent**: mỗi sự kiện mang một **id tin / idempotency key** duy nhất (ví

    dụ id đơn hoặc id sự kiện). Giữ một **kho khử trùng (dedup store)**; khi một sự kiện tới, kiểm tra

    id — **đã thấy thì bỏ qua**, chưa thấy thì cộng tiền rồi ghi id vào kho (lý tưởng là cộng tiền và

    ghi id trong **cùng một giao dịch** để không lệch).

    (3) Đó là **exactly-once effect** (hiệu lực đúng một lần) = at-least-once + idempotency/dedup:

    sự kiện có thể được **giao** nhiều lần nhưng **tác dụng** chỉ xảy ra một lần.

    '
  rubric_md: 'Đạt khi nêu đúng cả 3 ý: (1) vì chết trước khi ack nên bị giao lại, (2) dedup theo id tin
    trong một dedup store (bỏ qua id đã thấy), (3) gọi đúng tên exactly-once effect = at-least-once +
    idempotency. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu ý dedup theo id hoặc
    không gọi tên được hiệu lực đúng một lần: tối đa điểm 1.'
- id: S117
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: 'Thiết kế một pipeline xử lý sự kiện **chịu được tin trùng** từ đầu đến cuối. Yêu cầu: (1)
    giải

    thích vì sao **exactly-once** trong thực tế = at-least-once + idempotency, và chỉ ra chỗ đặt

    khử trùng (dedup); (2) nêu **bài toán ghi đôi (dual-write)** khi service vừa ghi DB vừa bắn tin,

    và **vẽ (mô tả) mẫu transactional outbox 2 bước** để tránh nó; (3) nói rõ vì sao vẫn cần dedup ở

    bên nhận dù đã có outbox, và thêm một lưới an toàn cuối cùng.

    '
  answer_md: "(1) Qua mạng chỉ có at-most-once (có thể mất) hoặc at-least-once (có thể trùng). Chọn\n\
    **at-least-once** để không mất tin, rồi làm **bên nhận idempotent**: mỗi tin mang **id tin /\nidempotency\
    \ key**, consumer giữ **kho dedup**, id đã thấy thì bỏ qua. Nhờ vậy tin được **giao**\nnhiều lần nhưng\
    \ **tác dụng** chỉ một lần — đó là exactly-once effect. Dedup đặt **ở bên nhận\n(consumer)**, lý tưởng\
    \ cùng giao dịch với việc ghi kết quả.\n(2) **Dual-write:** \"ghi DB\" và \"publish ra broker\" là\
    \ hai hệ khác nhau, không gói chung một\ngiao dịch được: ghi DB xong rồi publish có thể rớt publish\
    \ (mất tin); publish trước rồi DB\nrollback tạo tin ma. **Transactional outbox 2 bước:**\n- Bước 1\
    \ (ghi): trong **một giao dịch DB duy nhất**, ghi **dòng nghiệp vụ** và **dòng outbox**\n  vào **cùng**\
    \ DB — cùng commit hoặc cùng rollback.\n- Bước 2 (đẩy): một **relay** (hoặc **CDC** đọc nhật ký thay\
    \ đổi của DB) đọc bảng outbox,\n  **publish** ra broker, rồi **đánh dấu đã gửi (mark sent)**.\n(3)\
    \ Bước 2 chạy at-least-once (có thể publish lại nếu relay chết trước khi đánh dấu), nên bên\nnhận\
    \ **vẫn phải dedup** để không gây tác dụng trùng. Lưới an toàn cuối cùng: **đối soát\n(reconciliation)**\
    \ định kỳ, so hai bên (ví dụ tổng tiền đã nhận so với đã ghi) để bắt ca còn sót.\n"
  rubric_md: 'Đạt (mức phỏng vấn, đúng mastery bar level 3) khi: (1) giải thích exactly-once = at-least-once
    + idempotency và đặt dedup theo id ở consumer; (2) nêu đúng dual-write và vẽ đủ outbox 2 bước (bước
    1 một giao dịch ghi dòng nghiệp vụ + outbox; bước 2 relay/CDC đọc outbox, publish, đánh dấu đã gửi);
    (3) chỉ ra bước 2 là at-least-once nên vẫn cần dedup, cộng reconciliation làm lưới an toàn. Đúng,
    trong time-box, tự giải thích rõ ràng: bằng chứng điểm 3. Sót một trong hai bước outbox, hoặc không
    giải thích được exactly-once = at-least-once + idempotency: chưa đạt mức 3.'
