- id: X752
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    khóa đầu tiên của `total` không phải "a" dù "a" nhỏ hơn "b", khác với `df.groupby` của pandas.
  code: "rows = [(\"b\", 2), (\"a\", 1), (\"b\", 3)]\ntotal = {}\nfor k, v in rows:\n    total[k] = total.get(k,\
    \ 0) + v\nprint(total)\nprint(sorted(total))\nprint(list(total.items())[0])"
  expected_output: '{''b'': 5, ''a'': 1}

    [''a'', ''b'']

    (''b'', 5)'
  answer_md: 'dict giữ thứ tự chèn nên ''b'' (gặp trước) đứng đầu: {''b'': 5, ''a'': 1}; b = 2 + 3 = 5
    nhờ get(k, 0) làm giá trị khởi tạo. sorted(total) duyệt các khóa và trả list đã sắp [''a'', ''b''].
    Phần tử đầu của items() là (''b'', 5). pandas groupby mặc định sort=True nên index đã sắp theo key;
    với dict thuần phải tự sorted.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng: dict giữ thứ tự chèn, không tự sắp theo key (cần
    sorted). Đúng: bằng chứng điểm 3; sai: tối đa điểm 2.'
