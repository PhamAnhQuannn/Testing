- id: X751
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết hàm `group_sum(rows)` mô phỏng `df.groupby("key")["value"].sum()`. `rows` là list các
    cặp `[key, value]` (key là chuỗi, value là số nguyên). Gom theo key, cộng value của từng nhóm, trả
    về list các cặp `[key, total]` (mỗi cặp là **list** 2 phần tử) sắp theo key tăng dần. `[]` cho `[]`.
    Ví dụ `[["a", 3], ["b", 2], ["a", 5]]` cho `[["a", 8], ["b", 2]]`.

    '
  problem_id: check-x751-group-sum
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc
