items:
- id: Q044
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), dòng code in ra gì? Giải thích 1 câu.
  code: 'a = [1, 2]; b = a; b.append(3)

    c = a[:]; c.append(4)

    print(a, b is a, c is a, id(a) == id(b))'
  expected_output: '[1, 2, 3] True False True'
  answer_md: b và a cùng một đối tượng; c là bản sao.
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
- id: Q045
  difficulty: 2
  type: concept
  minutes: 3
  prompt_md: 'Python truyền tham số kiểu gì? Vì sao hàm `def f(lst): lst.append(1)` làm thay đổi list
    ở ngoài còn `lst = [9]` thì không?'
  answer_md: 'Truyền tham chiếu đối tượng (pass by object reference): append sửa đối tượng chung; `lst
    = [9]` chỉ gán tên cục bộ sang đối tượng mới.'
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 2; sai:
    tối đa điểm 1.'
- id: X347
  difficulty: 3
  type: concept
  minutes: 8
  prompt_md: 'Giải thích (1) stack và heap khác nhau thế nào và biến/đối tượng Python nằm ở đâu, (2) tham
    chiếu và

    aliasing: vì sao `b = a` với `a` là list rồi `b.append(1)` làm `a` đổi, (3) độ phức tạp bộ nhớ (Big-O

    của không gian phụ) của đệ quy sâu n so với vòng lặp, (4) vì sao duyệt mảng liên tiếp thường nhanh
    hơn

    duyệt linked list dù cùng O(n) (cache locality).

    '
  answer_md: "1. Stack: khung gọi hàm, cấp phát/giải phóng theo LIFO, nhanh, kích thước giới hạn. Heap:\
    \ vùng cấp phát\n   động cho đối tượng sống lâu hơn một lần gọi. Trong Python mọi đối tượng nằm trên\
    \ heap; biến chỉ là\n   tên trỏ tới đối tượng.\n2. `b = a` chỉ sao chép tham chiếu, cả hai tên trỏ\
    \ cùng một list (alias), nên đổi qua tên này thấy ở\n   tên kia. Muốn tách: `a.copy()`, `a[:]`, hoặc\
    \ `copy.deepcopy` cho cấu trúc lồng.\n3. Đệ quy sâu n dùng O(n) bộ nhớ stack (mỗi lần gọi một khung)\
    \ và có thể tràn giới hạn đệ quy; vòng\n   lặp tương đương dùng O(1) bộ nhớ phụ.\n4. Mảng/list lưu\
    \ liên tiếp nên một cache line nạp nhiều phần tử kế tiếp (spatial locality); node linked\n   list\
    \ rải rác trên heap nên mỗi bước dễ gây cache miss. Big-O như nhau nhưng hằng số khác.\n"
  rubric_md: 'Nêu đúng 4 ý: stack LIFO/heap động (Python: đối tượng trên heap), aliasing và cách copy,
    đệ quy O(n) bộ nhớ so với vòng lặp O(1), cache locality; có ví dụ cụ thể: bằng chứng điểm 3. Đúng
    3 ý hoặc thiếu ví dụ: điểm 2. Đúng 1-2 ý hoặc nhầm (vd. nói `b = a` sao chép list): tối đa điểm 1.'
