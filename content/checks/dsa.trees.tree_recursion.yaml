- id: X443
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "class N:\n    def __init__(self, v, l=None, r=None):\n        self.v, self.l, self.r = v, l,\
    \ r\n\nroot = N(10, N(4, N(3), N(1)), N(6))\n\ndef walk(n, remain):\n    if n is None:\n        return\
    \ False\n    remain -= n.v\n    print(n.v, remain)\n    if n.l is None and n.r is None:\n        return\
    \ remain == 0\n    return walk(n.l, remain) or walk(n.r, remain)\n\nprint(walk(root, 17))"
  expected_output: '10 7

    4 3

    3 0

    True'
  answer_md: Mỗi lời gọi trừ giá trị node khỏi `remain` rồi in. Đường 10, 4, 3 đến lá `3` với `remain
    = 0` nên trả `True` ngay, và `or` ngắt đệ quy nên các node `1` và `6` không bao giờ được in.
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
