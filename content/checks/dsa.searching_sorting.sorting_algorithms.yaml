  type: concept
  minutes: 3
  prompt_md: 'So sánh merge sort, quick sort, heap sort: time trung bình/xấu nhất, space, ổn định (stable)?
    `sorted()` của Python dùng gì?'
  answer_md: 'Merge: O(n log n) mọi trường hợp, O(n) space, stable. Quick: O(n log n) TB, O(n^2) xấu nhất,
    O(log n) space, không stable. Heap: O(n log n), O(1), không stable. Python: Timsort (stable, O(n log
    n)).'
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 1; sai:
    tối đa điểm 0.'
