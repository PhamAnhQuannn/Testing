subtopic_id: sd.archetypes.config_experiment
items:
- id: S208
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Nói ngắn gọn: **feature flag** là gì, **kill switch** là gì, và một nền tảng flag giúp A/B

    testing (experiment) thế nào?

    '
  answer_md: '**Feature flag** là một công tắc bật/tắt (on/off) hoặc giá trị cấu hình (remote config)
    đặt tập

    trung, cho phép đổi hành vi app **mà không phải phát hành lại (redeploy)** — app đọc giá trị ở

    runtime thay vì chôn cứng trong code. **Kill switch** là dùng flag đó để **tắt ngay** một tính

    năng đang gây lỗi chỉ bằng đổi một giá trị, tính bằng giây. **A/B testing** dùng chính cơ chế

    flag để trả **giá trị khác nhau cho các nhóm người dùng (variant)** — nhóm A thấy bản cũ, nhóm B

    thấy bản mới — rồi so số liệu; nên feature flag và experiment là một nền tảng chung.

    '
  rubric_md: 'Đạt khi nêu đúng: flag = công tắc/cấu hình từ xa, đổi hành vi không cần redeploy; kill switch
    = tắt ngay một tính năng bằng đổi giá trị; A/B testing = flag trả variant khác nhau cho các nhóm rồi
    so số liệu. Đúng cả ba ý: điểm 1; thiếu kill switch hoặc liên hệ A/B testing: tối đa điểm 0.'
- id: S209
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Một bạn đề xuất: mỗi khi code cần biết một flag, app **gọi HTTP sang dịch vụ cấu hình**
    để hỏi

    giá trị; và để chia A/B, mỗi lần kiểm tra thì **bốc một số ngẫu nhiên (random)** xem user vào

    nhóm nào. Hãy chỉ ra **hai vấn đề** của thiết kế này và nêu cách làm đúng: (1) vì sao gọi mạng

    mỗi lần kiểm tra flag là tệ và nên thay bằng gì; (2) vì sao gán nhóm ngẫu nhiên mỗi lần là sai và

    nên thay bằng gì.

    '
  answer_md: '(1) Gọi mạng mỗi lần kiểm tra flag **thêm một vòng mạng (round-trip) vào mọi request** (tăng
    độ

    trễ) và biến dịch vụ cấu hình thành **một điểm chết** — nó sập là app sập. Thay bằng **SDK đánh

    giá cục bộ (local evaluation):** SDK tải toàn bộ luật về bộ nhớ (cập nhật nền bằng stream/poll)

    rồi tự quyết trong máy, nên mỗi lần check là phép tính trong RAM (độ trễ ~0) và app vẫn chạy bằng

    gói luật đã nạp khi dịch vụ cấu hình chết (fail-open).

    (2) Bốc ngẫu nhiên mỗi lần khiến **cùng một user lúc thấy A, lúc thấy B** — trải nghiệm nhảy và

    số liệu A/B vô nghĩa. Thay bằng **gán nhóm ổn định (stable/sticky bucketing):** bucket =

    hash(user_id + experiment_id) mod 100 rồi so ngưỡng %. Vì hash là tất định, cùng user luôn cùng

    bucket (sticky, không cần lưu bảng gán), hash tốt chia đều, và thêm experiment_id giữ các thử

    nghiệm độc lập.

    '
  rubric_md: 'Đạt (điểm 2) khi nêu đúng cả hai sửa: (1) gọi mạng mỗi check gây độ trễ + điểm chết ⇒ local
    SDK evaluation (tải luật về, tính trong máy, fail-open); (2) random mỗi lần ⇒ không ổn định ⇒ hash(user_id
    + experiment_id) mod 100 cho gán tất định/sticky/chia đều. Đúng, tự giải thích được trong time-box:
    điểm 2. Chỉ sửa một trong hai, hoặc không nói được vì sao local/hash tốt hơn: tối đa điểm 1.'
- id: S210
  difficulty: 3
  type: concept
  minutes: 12
  prompt_md: 'Phỏng vấn: **Thiết kế một nền tảng feature flag + A/B testing** phục vụ hàng nghìn service
    và

    hàng triệu người dùng. Trình bày kiến trúc và **biện minh** các lựa chọn: (1) các thành phần (kho

    luật, phân phối, SDK, phân tích) và vì sao phân phối qua CDN; (2) vì sao SDK **đánh giá cục bộ**

    thay vì gọi server mỗi lần; (3) cách **gán nhóm ổn định** và vì sao dùng hash thay vì random; (4)

    vai trò của **guardrail metrics** (và exposure log, rollout tăng dần, kill switch).

    '
  answer_md: '**Thành phần.** (a) **Kho định nghĩa** giữ mỗi flag/experiment: giá trị mặc định, luật targeting

    (nước, phiên bản app, nhóm) và % rollout. (b) **Phân phối:** vì lượng đọc khổng lồ còn luật đổi

    hiếm, phát gói luật qua **CDN**, client **pull** định kỳ hoặc nhận **push/stream** khi đổi — CDN

    hấp thụ hàng nghìn client mà không dồn tải về gốc. (c) **SDK** nhúng trong mỗi service/thiết bị.

    (d) **Đường phân tích** nhận exposure log và tổng hợp chỉ số.

    **(2) Local evaluation.** SDK tải **toàn bộ** luật về RAM rồi tự giải khi code gọi

    `is_enabled(flag, user)` — ráp luật với thuộc tính user đang có sẵn, **không gọi mạng mỗi lần

    check**. Biện minh: tránh thêm round-trip vào mọi request (độ trễ ~0), **fail-open** khi dịch vụ

    cấu hình chết (dùng gói luật đã nạp), và chịu số lần check gần như vô hạn vì server chỉ chịu tải

    phân phối (hiếm, cache CDN).

    **(3) Gán nhóm ổn định.** bucket = hash(user_id + experiment_id) mod 100, so với ngưỡng (bucket

    < 10 là 10%). Dùng **hash tất định** thay vì random vì cùng user phải **luôn thấy cùng variant**

    (sticky) qua nhiều lần/nhiều máy — trải nghiệm nhất quán và quy kết số liệu mới đúng; hash tốt

    **chia đều** 0–99 nên đạt đúng tỷ lệ; thêm experiment_id giữ **các thử nghiệm độc lập**; và vì

    tính lại được nên **không cần lưu bảng gán**.

    **(4) An toàn & đo đạc.** **Rollout tăng dần** 1%→5%→25%→100% để giới hạn bán kính ảnh hưởng;

    **kill switch** tắt tức thì khi có sự cố. **Exposure log** ghi ai **thật sự** thấy variant nào để

    phân tích không bị lệch. **Guardrail metrics** theo dõi các chỉ số **không được xấu đi** (error

    rate, latency, crash): nếu một variant thắng chỉ số mục tiêu nhưng làm guardrail xấu đi, hệ cảnh

    báo để dừng/tắt sớm.

    '
  rubric_md: 'Đạt mức 3 (phỏng vấn) khi: (1) nêu đủ 4 thành phần và giải thích phân phối qua CDN (đọc
    nhiều, luật đổi hiếm); (2) biện minh local SDK evaluation bằng ít nhất độ trễ (không round-trip) +
    fail-open; (3) nêu đúng hash(user_id + experiment_id) mod 100 và giải thích sticky/chia đều/độc lập
    — vì sao hơn random; (4) giải thích guardrail metrics (chỉ số không được xấu đi, dừng sớm) cùng exposure
    log/rollout/kill switch. Mạch rõ, tự biện minh được: điểm 3. Thiếu phần biện minh local evaluation
    hoặc không giải thích được stable hashing hoặc guardrail: chưa đạt mức 3.'
