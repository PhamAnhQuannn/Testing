subtopic_id: sd.networking.realtime_protocols
items:
- id: S097
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Kể ngắn gọn 4 cách đẩy tin real-time tới client — **short polling**, **long polling**, **SSE**,

    **WebSocket** — và với mỗi cách nêu đặc điểm chính (một chiều hay hai chiều, có giữ kết nối lâu

    không).

    '
  answer_md: "- **Short polling:** client hỏi lại server mỗi vài giây; không giữ kết nối lâu, đơn giản\
    \ nhưng\n  lãng phí và trễ bằng chu kỳ hỏi.\n- **Long polling:** client gửi một request, server **giữ\
    \ request mở** đến khi có tin mới mới trả;\n  client nhận xong hỏi lại ngay. Tin gần như tức thì nhưng\
    \ mỗi tin là một vòng request.\n- **SSE (Server-Sent Events):** một kết nối HTTP giữ mở, server **đẩy\
    \ một chiều** (server →\n  client), tự nối lại.\n- **WebSocket:** kênh **hai chiều (full-duplex)**\
    \ giữ lâu sau một bước bắt tay; cả client và\n  server đẩy tin bất cứ lúc nào.\n"
  rubric_md: 'Đạt khi nêu đúng cả 4 cách với đặc điểm chính: polling = hỏi lại (lãng phí); long polling
    = giữ request tới khi có tin; SSE = một chiều, giữ kết nối; WebSocket = hai chiều, giữ kết nối. Đúng
    cả 4: bằng chứng điểm 1. Lẫn SSE (một chiều) với WebSocket (hai chiều), hoặc sót một cách: chưa đạt.'
- id: S098
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Bạn xây **chatbot LLM** trên web: server cần hiện câu trả lời **dần từng token** cho người
    dùng.

    (1) Chọn giao thức phù hợp và giải thích vì sao; (2) vì sao **không** cần WebSocket ở đây;

    (3) prompt của người dùng gửi lên bằng cách nào?

    '
  answer_md: '(1) Dùng **SSE**: luồng token là **một chiều** server → client, SSE giữ một kết nối HTTP
    và đẩy

    dần từng mẩu chữ khi model sinh ra; lại đơn giản, qua proxy/firewall dễ và tự nối lại.

    (2) **WebSocket là thừa** vì nó cho kênh **hai chiều**, mà ở đây sau khi đã gửi prompt thì tin chỉ

    chảy một chiều từ server xuống — không cần client đẩy liên tục trong lúc stream.

    (3) **Prompt gửi bằng một request HTTP riêng** (ví dụ POST); kết nối SSE chỉ lo nhận luồng token

    trả về.

    '
  rubric_md: 'Đạt khi nêu đúng cả 3 ý: chọn SSE vì luồng token là một chiều (và đơn giản/qua proxy/tự
    reconnect); WebSocket thừa vì không cần hai chiều liên tục; prompt gửi qua request HTTP riêng. Đúng,
    trong time-box, tự giải thích được: bằng chứng điểm 2. Chọn SSE nhưng không lý giải được ''một chiều'',
    hoặc đòi WebSocket cho stream token: tối đa điểm 1.'
- id: S099
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: 'Phỏng vấn system design. (1) Chọn **đúng giao thức** cho từng ca sau và nói ngắn vì sao:

    **news feed/thông báo**, **chat**, **live score**, **chatbot LLM stream token**. (2) Sau đó mô tả

    cách **scale một hệ WebSocket tới hàng triệu kết nối đồng thời**: nêu tầng giữ kết nối, cách

    fan-out tin, định tuyến, và cách xử lý reconnect/backpressure cùng giới hạn mỗi node.

    '
  answer_md: "**(1) Chọn giao thức:**\n- **News feed / thông báo:** tin một chiều, thưa → **SSE** (hoặc\
    \ **long polling** nếu hạ tầng cũ).\n- **Chat:** hai chiều, gửi qua lại liên tục, độ trễ thấp → **WebSocket**.\n\
    - **Live score:** server đẩy một chiều cho rất nhiều người xem → **SSE** vừa đủ (WebSocket cũng\n\
    \  được nếu cần client gửi lên).\n- **Chatbot LLM stream token:** luồng token một chiều → **SSE**;\
    \ prompt gửi bằng request HTTP\n  riêng.\n**(2) Scale triệu kết nối WebSocket:**\n- **Tầng gateway\
    \ stateful riêng:** mỗi kết nối chiếm RAM + một file descriptor (~100.000/máy), nên\n  1 triệu kết\
    \ nối ≈ 10 máy + dự phòng; tách các gateway chỉ giữ kết nối ra khỏi logic nghiệp vụ,\n  mỗi gateway\
    \ giữ một **connection map** \"user nào đang nối vào tôi\".\n- **Fan-out qua pub/sub (Redis/Kafka):**\
    \ người nhận có thể ở gateway khác người gửi; tin được\n  **publish** lên pub/sub, gateway đang giữ\
    \ người nhận **subscribe** và đẩy xuống — không gateway\n  nào phải tự dò.\n- **Sticky routing:**\
    \ LB **L4** giữ mỗi kết nối ở đúng gateway suốt vòng đời; dùng\n  **least-connections** thay round\
    \ robin vì kết nối sống rất lâu nên round robin dễ lệch tải.\n- **Reconnect & backpressure & giới\
    \ hạn:** heartbeat để phát hiện chết; mất mạng thì **nối lại\n  với backoff** và gửi **last event\
    \ id** để nhận bù; khi client nhận chậm hơn server đẩy thì\n  **backpressure** (hàng đợi có trần,\
    \ bỏ bớt hoặc làm chậm nguồn) kẻo gateway phình bộ nhớ; đặt\n  **trần kết nối mỗi node** và tự co\
    \ giãn; app đóng hẳn thì chuyển sang **push OS (APNs/FCM)**.\n"
  rubric_md: 'Đạt (mức phỏng vấn) khi: (1) chọn đúng cả 4 ca (feed→SSE/long-poll, chat→WebSocket, live
    score→SSE/WebSocket, chatbot→SSE) kèm lý do hướng tin; và (2) mô tả đủ trục scale: gateway stateful
    + connection map, pub/sub fan-out, sticky routing L4/least-connections, reconnect+backoff+last-event-id,
    backpressure, trần kết nối mỗi node. Đúng, trong time-box, tự giải thích rõ: bằng chứng điểm 3. Sai
    hướng tin một ca (ví dụ ép WebSocket cho feed/chatbot), hoặc thiếu pub/sub fan-out hoặc thiếu xử lý
    reconnect/backpressure: chưa đạt mức 3.'
