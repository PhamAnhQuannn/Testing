items:
- id: X846
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
  code: 'counter = 0

    a = counter

    b = counter

    counter = a + 1

    print(counter)

    counter = b + 1

    print(counter)

    counter = 0

    counter += 1

    counter += 1

    print(counter)'
  expected_output: '1

    1

    2'
  answer_md: 'Hai ''thread'' a và b cùng đọc counter=0. Ghi a+1 cho 1, rồi ghi b+1 cũng cho 1 (một lần
    cộng bị mất: race condition). Khi chạy tuần tự từ counter=0, hai lần += 1 cho 2.'
  rubric_md: 'Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0.'
- id: X847
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết hàm `thread_pool(tasks, workers)` mô phỏng việc chia việc cho một thread pool cố định.
    `tasks` là list số nguyên (thời lượng từng task), `workers` là số worker thread (số nguyên >= 1).
    Gán lần lượt từng task THEO THỨ TỰ cho worker có tổng tải hiện tại NHỎ NHẤT (hoà thì chọn worker có
    chỉ số thấp nhất). Trả về list độ dài `workers`, phần tử i là tổng thời lượng các task đã gán cho
    worker i. Ví dụ `thread_pool([3, 1, 2, 4], 2)` cho `[7, 3]`; `thread_pool([], 3)` cho `[0, 0, 0]`.

    '
  problem_id: check-x847-thread-pool
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X848
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    thứ tự `safe` cho kết quả đúng còn `racy` và `mixed` thì không.
  code: "def run(order):\n    shared = 0\n    local = {}\n    for t, step in order:\n        if step ==\
    \ \"read\":\n            local[t] = shared\n        else:\n            shared = local[t] + 1\n   \
    \ return shared\n\n\nsafe = [(\"A\", \"read\"), (\"A\", \"write\"), (\"B\", \"read\"), (\"B\", \"\
    write\")]\nracy = [(\"A\", \"read\"), (\"B\", \"read\"), (\"A\", \"write\"), (\"B\", \"write\")]\n\
    mixed = [(\"A\", \"read\"), (\"B\", \"read\"), (\"B\", \"write\"), (\"A\", \"write\")]\nprint(run(safe))\n\
    print(run(racy))\nprint(run(mixed))\nprint(len(safe))"
  expected_output: '2

    1

    1

    4'
  answer_md: '`safe` chạy trọn read-write của A rồi mới tới B (như có khoá): A đọc 0 ghi 1, B đọc 1 ghi
    2 nên ra 2. `racy` và `mixed` cho cả A và B cùng đọc 0 trước khi ai ghi, nên cả hai ghi 1 và một cập
    nhật bị mất, kết quả 1. Đây là race condition; critical section (đọc rồi ghi) phải được bảo vệ bằng
    khoá. `len(safe)` là 4.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng: đọc-ghi bị xen kẽ khiến hai thread cùng đọc giá
    trị cũ và ghi đè nhau (race condition); chạy nguyên khối như có khoá cho kết quả đúng. Đúng: bằng
    chứng điểm 3; sai: tối đa điểm 2.'
