subtopic_id: ml.classical.dimensionality_reduction
items:
- id: Q242
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: PCA làm gì? Chọn số thành phần thế nào? Vì sao cần chuẩn hoá dữ liệu trước?
  answer_md: Chiếu dữ liệu lên các hướng có phương sai lớn nhất (vector riêng của ma trận hiệp phương
    sai). Chọn số thành phần để giữ ~90-95% phương sai (explained variance). Chuẩn hoá vì PCA nhạy với
    thang đo.
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 1; sai:
    tối đa điểm 0.'
- id: X692
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết hàm `explained_variance_ratio(variances)` nhận list phương sai (không âm) của các thành
    phần PCA và trả list explained variance ratio: mỗi phương sai chia cho tổng, **sắp giảm dần**, làm
    tròn 6 chữ số. Nếu tổng bằng 0 thì trả list toàn `0.0` cùng độ dài. Ví dụ: `[1.0, 4.0]` cho `[0.8,
    0.2]`.

    '
  problem_id: check-x692-evr
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X693
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    PCA trên dữ liệu này chỉ cần 1 thành phần.
  code: "xs = [1, 2, 3]\nys = [2, 4, 6]\n\ndef var(v):\n    m = sum(v) / len(v)\n    return sum((a - m)\
    \ ** 2 for a in v) / len(v)\n\nvx, vy = var(xs), var(ys)\ntotal = vx + vy\nprint(round(vx, 4), round(vy,\
    \ 4))\nprint([round(vx / total, 2), round(vy / total, 2)])\nprint(round(max(vx, vy) / total, 2) >=\
    \ 0.8)"
  expected_output: '0.6667 2.6667

    [0.2, 0.8]

    True'
  answer_md: 'xs có mean 2, độ lệch -1, 0, 1 nên var = 2/3 = 0.6667. ys = 2*xs nên var gấp 4 lần: 8/3
    = 2.6667. Tổng = 10/3, ratio theo trục gốc là 0.2 và 0.8 nên dòng 3 in True. Vì ys = 2*xs, mọi điểm
    nằm trên một đường thẳng: PCA xoay trục về hướng đường đó, thành phần 1 giữ 100% phương sai (ratio
    [1.0, 0.0]), nên chỉ cần 1 thành phần.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng: dữ liệu nằm trên một đường thẳng nên thành phần
    đầu giữ toàn bộ phương sai. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2.'
