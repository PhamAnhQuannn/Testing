  prompt_md: Chạy tay (không chạy máy), đoạn code in ra gì? Giải thích 1 câu.
  code: "from itertools import islice\n\ndef gen(n):\n    for i in range(n):\n        yield i * i\n\n\
    g = gen(6)\nprint(list(islice(g, 2)))\nprint(next(g))\nprint(sum(g))"
  expected_output: '[0, 1]

    4

    50'
  answer_md: '`gen(6)` sinh 0, 1, 4, 9, 16, 25 một cách lazy. `islice(g, 2)` lấy 0 và 1; `next(g)` lấy
    tiếp 4 (iterator đi một chiều, không quay lại); `sum(g)` cộng phần còn lại 9 + 16 + 25 = 50.'
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
