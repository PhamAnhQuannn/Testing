subtopic_id: eng.apis.rest_design
items:
- id: E109
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Trong REST API, **resource** là gì và đặt tên trong URL thế nào? Vì sao `POST /createOrder`

    là cách đặt tên không tốt?

    '
  answer_md: "- **Resource** (tài nguyên) là đối tượng mà API quản lý, ví dụ đơn hàng; trong URL dùng\n\
    \  **danh từ số nhiều**: `/orders`, `/orders/12`, `/orders/12/items`.\n- **Hành động** nằm ở **method\
    \ HTTP** (GET đọc, POST tạo, PUT/PATCH sửa, DELETE xóa), không nằm\n  trong đường dẫn.\n- `POST /createOrder`\
    \ nhét động từ vào URL; nên là `POST /orders`.\n"
  rubric_md: 'Đạt khi nêu đúng: resource là danh từ (số nhiều) trong URL, hành động nằm ở method HTTP,
    và chỉ ra `/createOrder` chứa động từ nên đổi thành `POST /orders`. Đủ ý: bằng chứng điểm 1; nói URL
    nên chứa động từ hoặc thiếu ý hành động nằm ở method: điểm 0.'
- id: E110
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Thiết kế API cho resource `orders`: nêu **method + URL + status code thành công** cho 5
    thao

    tác: tạo đơn, xem một đơn, xem danh sách, sửa **chỉ** `qty`, xóa đơn. Sau đó nêu status code cho

    hai lỗi: (1) `GET /orders/999` khi đơn không tồn tại, (2) `POST /orders` với `qty` âm.

    '
  answer_md: "- Tạo: `POST /orders` → **201 Created** (kèm `Location: /orders/{id}`).\n- Xem một: `GET\
    \ /orders/12` → **200 OK**.\n- Danh sách: `GET /orders` (có thể lọc `?status=paid`) → **200 OK**.\n\
    - Sửa chỉ `qty`: `PATCH /orders/12` với `{\"qty\": 3}` → **200 OK** (hoặc 204). Dùng `PUT` chỉ khi\n\
    \  gửi **đủ cả đối tượng** để thay thế.\n- Xóa: `DELETE /orders/12` → **204 No Content**.\n- Lỗi (1):\
    \ **404 Not Found**. Lỗi (2): **400** hoặc **422** (dữ liệu sai/validation), trả theo cùng\n  một\
    \ dạng body lỗi.\n"
  rubric_md: 'Đạt khi: POST tạo -> 201, GET một/danh sách -> 200, DELETE -> 204 (hoặc 200), sửa một phần
    dùng PATCH (PUT chỉ khi thay cả đối tượng), không đặt động từ trong URL, không-thấy -> 404, dữ liệu
    sai -> 400/422. Đúng gần đủ và tự giải thích trong time-box: bằng chứng điểm 2. Dùng PUT cho sửa một
    phần mà không giải thích, trả 200 cho tạo mới mà không nêu 201, hoặc trả 500 cho lỗi client: tối đa
    điểm 1.'
- id: E111
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: 'Thiết kế API đặt lịch hẹn (`appointments`): endpoint để **đặt**, **xem**, **đổi giờ** và
    **hủy**

    lịch. Nêu method, URL, status code thành công và lỗi (thiếu trường, không thấy, trùng giờ,

    chưa đăng nhập, lỗi server). Đề xuất **một dạng body lỗi chung**. Giải thích PUT vs PATCH cho

    việc đổi giờ, tính **idempotent** của từng method, và cách giữ **API contract** ổn định khi thêm

    tính năng.

    '
  answer_md: '**Endpoint:** `POST /appointments` → 201 + `Location`; `GET /appointments/{id}` → 200;

    `GET /appointments?date=2026-11-11` → 200; đổi giờ `PATCH /appointments/{id}` `{"start": "..."}` →
    200;

    hủy: `DELETE /appointments/{id}` → 204, hoặc nếu muốn giữ bản ghi dùng

    `POST /appointments/{id}/cancel` → 200.


    **Lỗi:** thiếu trường/sai định dạng → **400** hoặc **422**; không thấy → **404**; trùng giờ →

    **409 Conflict**; chưa đăng nhập → **401** (đăng nhập rồi nhưng không đủ quyền → **403**); lỗi

    server → **500**.


    **Body lỗi chung:** `{"error": {"code": "SLOT_TAKEN", "message": "Slot already booked"}}` cho mọi

    lỗi (có thể thêm danh sách trường sai với validation) để client xử lý chung.


    **PUT vs PATCH:** PUT thay cả đối tượng (phải gửi đủ trường, idempotent); PATCH chỉ sửa trường

    gửi lên — hợp cho đổi giờ. **Idempotent:** GET, PUT, DELETE idempotent; **PATCH KHÔNG được đảm

    bảo** idempotent (tùy cách cài); **POST KHÔNG idempotent** (tạo, hoặc `/cancel`) — gọi lại có thể

    tạo trùng, nên cân nhắc cơ chế chống gửi lặp (Idempotency-Key).


    **Contract ổn định:** không đổi tên trường hay status code đang dùng; thêm trường mới (tùy chọn)

    thay vì sửa/xóa trường cũ để không làm vỡ client.

    '
  rubric_md: 'Đạt mức 3 (mức phỏng vấn) khi: (a) đủ 4 thao tác với method + URL danh từ + status thành
    công đúng (201/200/204); (b) status lỗi đúng: 400/422, 404, 409, 401 (403 cho thiếu quyền), 500; (c)
    đề xuất một body lỗi chung nhất quán; (d) phân biệt PUT (thay cả) với PATCH (sửa một phần) và nêu
    đúng idempotent (GET/PUT/DELETE có, POST không); (e) nêu cách giữ contract ổn định (không đổi/xóa
    trường, thêm trường mới). Đủ cả năm, trong time-box: bằng chứng điểm 3. Thiếu phần body lỗi hoặc nhầm
    idempotent/PUT-PATCH: chưa đạt mức 3.'
