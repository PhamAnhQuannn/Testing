- id: X581
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code Composite dưới in ra gì? Ghi đúng từng dòng và giải
    thích vì sao `Menu.count()` không cần kiểm tra loại của con.
  code: "class Item:\n    def __init__(self, name):\n        self.name = name\n\n    def count(self):\n\
    \        return 1\n\n\nclass Menu:\n    def __init__(self, name, children):\n        self.name = name\n\
    \        self.children = children\n\n    def count(self):\n        total = 0\n        for child in\
    \ self.children:\n            total += child.count()\n        return total\n\n\ndrinks = Menu(\"drinks\"\
    , [Item(\"tea\"), Item(\"coffee\")])\nfood = Menu(\"food\", [Item(\"pho\"), Menu(\"sides\", [Item(\"\
    egg\"), Item(\"herb\"), Menu(\"sauce\", [])])])\nroot = Menu(\"root\", [drinks, food, Item(\"water\"\
    )])\nprint(drinks.count())\nprint(food.count())\nprint(root.count())"
  expected_output: '2

    3

    6'
  answer_md: '`Item` và `Menu` cùng có `count()`, nên `Menu.count()` chỉ cộng `child.count()` mà không
    cần `if`. drinks = 2 món; food = pho (1) + sides (egg, herb, sauce rỗng = 2 + 0) = 3; root = 2 + 3
    + water (1) = 6.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích lá/nhánh cùng interface nên đệ quy không cần kiểm tra
    loại. Đúng: bằng chứng điểm 3; sai: tối đa điểm 2.'
