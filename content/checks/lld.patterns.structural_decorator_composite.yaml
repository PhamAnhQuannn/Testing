  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Giải thích 1 câu về cách các lớp Decorator
    xếp chồng.
  code: "class Pizza:\n    def price(self):\n        return 100\n\n    def label(self):\n        return\
    \ \"pizza\"\n\n\nclass Topping:\n    extra = 0\n    name = \"\"\n\n    def __init__(self, inner):\n\
    \        self.inner = inner\n\n    def price(self):\n        return self.inner.price() + self.extra\n\
    \n    def label(self):\n        return self.inner.label() + \"+\" + self.name\n\n\nclass Cheese(Topping):\n\
    \    extra = 20\n    name = \"cheese\"\n\n\nclass Mushroom(Topping):\n    extra = 15\n    name = \"\
    mushroom\"\n\n\np = Cheese(Mushroom(Pizza()))\nprint(p.price())\nprint(p.label())\nprint(Mushroom(Mushroom(Pizza())).price())"
  expected_output: '135

    pizza+mushroom+cheese

    130'
  answer_md: '`Cheese` bọc `Mushroom` bọc `Pizza`, mỗi lớp gọi vào lớp trong rồi cộng phần của mình: 100
    + 15 + 20 = 135. `label()` đi cùng cách đó nên ghép tên từ trong ra ngoài: `pizza+mushroom+cheese`.
    Bọc `Mushroom` hai lần cho 100 + 15 + 15 = 130.'
