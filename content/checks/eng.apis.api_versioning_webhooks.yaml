subtopic_id: eng.apis.api_versioning_webhooks
items:
- id: E112
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Vì sao phải **đánh phiên bản** (versioning) một API? Nêu một ví dụ thay đổi **an toàn**
    và một

    ví dụ thay đổi **gây vỡ** (breaking).

    '
  answer_md: "- API là **hợp đồng** với client; bạn không kiểm soát khi nào họ cập nhật, nên đổi tùy ý\
    \ sẽ làm\n  app của họ hỏng. Versioning cho phép đổi lớn (`/v2`) mà bản cũ (`/v1`) vẫn chạy.\n- An\
    \ toàn (**additive**): thêm trường tùy chọn vào response, hoặc thêm endpoint mới.\n- Gây vỡ (**breaking**):\
    \ xóa hoặc đổi tên trường, đổi kiểu (số `5` thành chuỗi `\"5\"`).\n"
  rubric_md: 'Đạt khi nêu đúng: lý do (không làm hỏng client cũ / API là hợp đồng) và đúng ít nhất một
    ví dụ additive (thêm trường tùy chọn/endpoint) và một ví dụ breaking (xóa/đổi tên/đổi kiểu). Đủ ý:
    bằng chứng điểm 1; phân loại sai (ví dụ nói xóa trường là an toàn): điểm 0.'
- id: E113
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Cho 5 thay đổi API: (a) thêm trường tùy chọn `note`; (b) đổi `price` từ `5` thành `"5"`;

    (c) xóa trường `qty`; (d) đổi URL `/orders` thành `/o`; (e) thêm endpoint `/tags`.

    (1) Cái nào **breaking**, cái nào **additive**, và vì sao? (2) Nếu bắt buộc phải làm thay đổi

    breaking, bạn đánh phiên bản và báo ngừng bản cũ thế nào?

    '
  answer_md: '(1) **Additive (an toàn):** (a) và (e) — client cũ bỏ qua trường/endpoint lạ. **Breaking:**
    (b)

    đổi kiểu, (c) xóa trường, (d) đổi URL — client cũ đang đọc/gọi theo dạng cũ nên sẽ hỏng.

    (2) Mở `/v2/orders` và **giữ `/v1/orders` chạy song song**; **báo trước** ngày tắt (**sunset**)

    qua tài liệu, email, header như `Deprecation`/`Sunset`; theo dõi ai còn gọi `/v1`, nhắc họ,

    rồi mới tắt vào ngày đã hẹn.

    '
  rubric_md: 'Đạt khi: (1) phân loại đúng cả 5 (a,e additive; b,c,d breaking) kèm lý do ngắn; (2) nêu
    mở /v2 chạy song song /v1 và báo trước ngày tắt trước khi tắt. Đúng và tự giải thích trong time-box:
    bằng chứng điểm 2. Phân loại sai từ 2 mục trở lên, hoặc không nêu báo trước/chạy song song: tối đa
    điểm 1.'
- id: E114
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: 'Bạn thiết kế **webhook** để provider báo "thanh toán xong" cho hệ thống của khách. (1) Webhook

    là gì và vì sao tốt hơn **polling**? (2) Provider gửi gì, khách trả gì, và làm gì khi khách không

    trả lời? (3) Phía khách phải làm gì để nhận **an toàn** và **đúng một lần** về mặt hiệu ứng

    (chữ ký, tin trùng)? (4) So sánh ngắn versioning bằng URL path với bằng header/media type

    khi bạn cần thay đổi định dạng payload webhook.

    '
  answer_md: '(1) Webhook là **server chủ động `POST`** sự kiện tới **URL khách đã đăng ký** khi có việc
    xảy

    ra (push), thay vì khách hỏi liên tục (polling). Gần thời gian thực, ít request thừa.

    (2) Provider gửi `POST` kèm nội dung sự kiện (có event id, loại sự kiện) và **chữ ký HMAC**.

    Khách trả **2xx** nhanh để báo đã nhận. Không nhận được 2xx thì provider **retry**, chờ lâu dần

    giữa các lần (ví dụ 1 phút, 5 phút, 30 phút).

    (3) Khách **kiểm tra chữ ký** (tính HMAC từ nội dung + khóa bí mật chung, so sánh) và có thể

    kiểm tra timestamp chống **replay**; trả 2xx nhanh, xử lý nặng ở nền; vì có retry nên có thể

    nhận **tin trùng** -> lưu event id đã xử lý và **bỏ qua trùng** (idempotent), tránh ví dụ

    cộng tiền hai lần.

    (4) **URL path** (`/v1/...`): đơn giản, dễ thử/cache. **Header/media type**: URL gọn hơn nhưng

    khó thử bằng trình duyệt và khó cache. Với **webhook payload** nên version bằng **trường version

    trong payload** (hoặc version theo subscription), không phải URL/header; thêm trường là additive

    (an toàn), chỉ cần version khi **đổi/xóa trường** để subscriber cũ không vỡ.

    '
  rubric_md: 'Đạt mức 3 (mức phỏng vấn) khi: (a) nêu webhook là server push POST tới URL đã đăng ký và
    ưu điểm so với polling; (b) mô tả đúng giao thức gửi: POST, khách trả 2xx, retry với chờ lâu dần;
    (c) phía nhận: kiểm tra chữ ký HMAC và xử lý idempotent tin trùng bằng event id; (d) so sánh đúng
    URL path vs header/media type. Đủ cả bốn, trong time-box: bằng chứng điểm 3. Thiếu kiểm tra chữ ký,
    thiếu xử lý tin trùng, hoặc nhầm webhook với polling: chưa đạt mức 3.'
