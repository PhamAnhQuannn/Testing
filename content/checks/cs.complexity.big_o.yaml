items:
- id: Q041
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Cho `for i in range(n): for j in range(n): ...` và `for i in range(n): for j in range(i):
    ...`. Độ phức tạp mỗi đoạn?'
  answer_md: 'Đoạn 1: O(n^2) (n*n lần). Đoạn 2: 0+1+...+(n-1) = n(n-1)/2 lần, vẫn O(n^2).'
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 1; sai:
    tối đa điểm 0.'
- id: Q042
  difficulty: 2
  type: concept
  minutes: 3
  prompt_md: 'Độ phức tạp của: `x in list`, `x in set`, `list.pop(0)`, `deque.popleft()`, `sorted(list)`,
    `heapq.heappush`.'
  answer_md: O(n); O(1) trung bình; O(n); O(1); O(n log n); O(log n).
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 2; sai:
    tối đa điểm 1.'
- id: Q043
  difficulty: 3
  type: concept
  minutes: 3
  prompt_md: Bài cho n = 10^5. Các cách O(n^2), O(n log n), O(n) có chạy kịp ~1 giây trong Python không?
    Vì sao? Space của đệ quy sâu n là bao nhiêu?
  answer_md: 'O(n^2)=10^10 phép: không kịp. O(n log n) ~ 1.7*10^6 và O(n): kịp. Đệ quy sâu n dùng O(n)
    stack (Python giới hạn ~1000 tầng mặc định).'
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 3; sai:
    tối đa điểm 2.'
- id: W187
