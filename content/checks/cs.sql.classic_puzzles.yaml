- id: X792
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
  code: 'scores = [90, 85, 90, 70, 85]

    d = sorted(set(scores), reverse=True)

    print(d)

    print(d[1])

    print(sorted(scores, reverse=True)[1])

    print(len(d) >= 2)'
  expected_output: '[90, 85, 70]

    85

    90

    True'
  answer_md: '`set` khử trùng nên d = [90, 85, 70] (giống SELECT DISTINCT ... ORDER BY ... DESC) và d[1]
    = 85 là điểm cao thứ hai. Không khử trùng thì danh sách giảm dần là [90, 90, 85, 85, 70] và phần tử
    chỉ số 1 lại là 90, sai thứ hạng. `len(d) >= 2` kiểm tra có đủ giá trị khác nhau, tương ứng truy vấn
    con không ra dòng khi thiếu.'
  rubric_md: 'Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0.'
- id: X793
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết hàm `second_highest(rows)` bằng `sqlite3` trong bộ nhớ. `rows` là list các bản ghi
    `[name, score]` (name là chuỗi, score là số nguyên). Tạo bảng `t(name TEXT, score INTEGER)`, chèn
    bằng `executemany` tham số hoá, rồi chạy `SELECT name FROM t WHERE score = (SELECT DISTINCT score
    FROM t ORDER BY score DESC LIMIT 1 OFFSET 1) ORDER BY name ASC`. Trả về list phẳng các tên (chuỗi).
    Ví dụ `[["an",9],["binh",7],["chi",9],["dung",7]]` cho `["binh", "dung"]` vì điểm khác nhau là 9 và
    7, cao thứ hai là 7. Nếu có ít hơn 2 điểm khác nhau thì kết quả là `[]`.

    '
  problem_id: check-x793-second-highest
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X794
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    phải khử trùng trước khi tìm dãy ngày liên tiếp, và vì sao số dòng trùng khác với số giá trị trùng.
  code: "days = [1, 2, 2, 3, 5, 6, 6, 7]\ndups = sorted({d for d in days if days.count(d) > 1})\nprint(dups)\n\
    u = sorted(set(days))\nruns = []\nstart = u[0]\nfor prev, cur in zip(u, u[1:]):\n    if cur != prev\
    \ + 1:\n        runs.append((start, prev))\n        start = cur\nruns.append((start, u[-1]))\nprint(runs)\n\
    print(max(b - a + 1 for a, b in runs))\nprint(len(days) - len(set(days)))"
  expected_output: '[2, 6]

    [(1, 3), (5, 7)]

    3

    2'
  answer_md: 'Giá trị trùng là 2 và 6 (GROUP BY ... HAVING COUNT(*) > 1 cho 2 giá trị), còn số dòng thừa
    là 8 - 6 = 2. Hai con số này chỉ tình cờ bằng nhau: nếu 2 xuất hiện ba lần thì vẫn là 2 giá trị trùng
    nhưng 3 dòng thừa. Sau khi khử trùng u = [1, 2, 3, 5, 6, 7], chỗ đứt giữa 3 và 5 tách thành hai dãy
    (1, 3) và (5, 7), dài nhất là 3. Nếu không khử trùng, cặp (2, 2) có cur != prev + 1 và bị coi là đứt
    dãy, làm ra các dãy sai; trong SQL đó là lý do cần SELECT DISTINCT trước khi trừ ROW_NUMBER().'
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng: phải khử trùng để giá trị lặp không làm đứt dãy
    (hoặc làm lệch ROW_NUMBER), và số giá trị trùng khác số dòng thừa. Đúng: bằng chứng điểm 3; sai: tối
    đa điểm 2.'
