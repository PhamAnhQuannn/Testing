subtopic_id: sd.data.data_modeling
items:
- id: S046
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Nói ngắn gọn: thiết kế dữ liệu "theo **access pattern**" nghĩa là gì, và nó khác với cách

    "vẽ bảng cho sạch trước" ở chỗ nào?

    '
  answer_md: 'Thiết kế theo access pattern là **bắt đầu từ các truy vấn (query) hay gặp nhất** mà app
    sẽ

    chạy, rồi mới suy ra cần những bảng, khóa và **index** nào để đúng những câu đó chạy nhanh —

    "model cho cách bạn đọc". Ngược lại, cách "vẽ bảng cho sạch trước" xuất phát từ sự thuần khiết

    lý thuyết (chuẩn hóa tối đa) rồi mới nghĩ cách hỏi, nên dễ ra schema đẹp trên giấy nhưng chậm

    hoặc khó phục vụ đúng truy vấn thật.

    '
  rubric_md: 'Đạt khi nêu đúng: bắt đầu từ truy vấn hay gặp rồi suy ra bảng/index (model cho cách đọc),
    và đối lập với vẽ bảng/chuẩn hóa trước rồi mới nghĩ cách hỏi. Đúng ý: bằng chứng điểm 1; chỉ định
    nghĩa chung chung mà không nêu ''xuất phát từ truy vấn'': tối đa điểm 0.'
- id: S047
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Một trang feed hiển thị mỗi bài viết kèm **tên tác giả**. Hiện `posts` chỉ giữ `user_id`,
    nên

    mỗi lần hiển thị phải **join** sang `users` để lấy tên; trang này đọc rất nhiều và join đang

    là nút cổ chai. Có người đề xuất **copy `author_name` thẳng vào `posts`**. (1) Lựa chọn này

    được gọi là gì và lợi ích chính là gì? (2) Cái giá phải trả là gì (nêu đúng tên hai vấn đề)?

    (3) Khi nào đánh đổi này đáng làm?

    '
  answer_md: '(1) Đây là **phi chuẩn hóa (denormalization)** — cố ý lưu trùng `author_name` ở `posts`
    để

    trang feed **khỏi join**, nhờ vậy đọc nhanh hơn (một bảng là đủ).

    (2) Cái giá: **ghi khuếch đại (write amplification)** — khi một người đổi tên phải cập nhật

    tên đó ở **tất cả** bài của họ chứ không chỉ một dòng ở `users`; và **dị thường cập nhật

    (update anomaly)** — nếu sót một chỗ thì các bản sao sẽ **mâu thuẫn**, không còn nguồn sự thật

    duy nhất.

    (3) Đáng làm khi **đọc nhiều hơn ghi rất nhiều** và đã **đo được** join là nút cổ chai thật;

    còn mặc định nên **chuẩn hóa** (giữ tên một chỗ ở `users`) rồi mới tối ưu khi cần.

    '
  rubric_md: 'Đạt khi nêu đủ 3 ý: (1) gọi đúng là phi chuẩn hóa + lợi ích bỏ join/đọc nhanh; (2) đúng
    cả hai cái giá — ghi khuếch đại và dị thường cập nhật (mâu thuẫn dữ liệu); (3) điều kiện đọc >> ghi
    và join là nút cổ chai (mặc định chuẩn hóa trước). Đúng, trong time-box, tự giải thích được: bằng
    chứng điểm 2. Thiếu một trong hai cái giá hoặc không nêu điều kiện đánh đổi: tối đa điểm 1.'
- id: S048
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: 'Cho một app kiểu mạng xã hội với **3 truy vấn** hay gặp:

    (a) "20 bài **mới nhất** của những người **tôi theo dõi**";

    (b) "**số like** của một bài";

    (c) "**ai đã like** bài này".

    Hãy: (1) viết các **bảng** cần thiết (cột chính, khóa chính, khóa ngoại — phác thảo SQL là đủ),

    kể cả quan hệ "theo dõi" nhiều-nhiều; (2) chọn **index** cho mỗi truy vấn và nói vì sao (thứ tự

    cột); (3) chỉ ra **một chỗ nên phi chuẩn hóa** để phục vụ (b) nhanh và nêu rõ **đánh đổi**;

    (4) dùng **UNIQUE** để chặn một người **like trùng** một bài.

    '
  answer_md: "(1) Các bảng (phác thảo):\n\n```sql\nusers(id, name, ...)                              \
    \ -- PRIMARY KEY (id)\nposts(id, user_id, text, created_at)               -- PRIMARY KEY (id), user_id\
    \ -> users(id)\nfollows(follower_id, followee_id)                  -- PRIMARY KEY (follower_id, followee_id)\n\
    likes(post_id, user_id)                            -- PRIMARY KEY (post_id, user_id)\n```\n\n`follows`\
    \ và `likes` là **bảng nối** cho quan hệ nhiều-nhiều; khóa chính hai cột vừa định danh\nvừa chặn trùng.\n\
    \n(2) Index theo truy vấn:\n- (a) `CREATE INDEX idx_posts_user_time ON posts (user_id, created_at);`\
    \ — lọc theo `user_id`\n  (những người tôi theo dõi) rồi lấy sẵn thứ tự `created_at DESC` để lấy 20\
    \ bài mới nhất; thứ\n  tự cột `(user_id, created_at)` khớp đúng dạng \"lọc rồi sắp\". (Thêm index\
    \ trên\n  `follows (follower_id)` để lấy nhanh danh sách người tôi theo dõi.)\n- (c) khóa chính `likes\
    \ (post_id, user_id)` đã phục vụ \"ai đã like bài này\" (lọc theo\n  `post_id`), không cần index thêm.\n\
    \n(3) Phi chuẩn hóa cho (b): thay vì `COUNT(*)` trên `likes` mỗi lần, lưu một cột đếm sẵn\n`posts.like_count`\
    \ và cập nhật `like_count = like_count + 1` khi có like mới. Đổi lại: **ghi\nkhuếch đại/khó nhất quán**\
    \ — mỗi lần like/unlike phải cập nhật thêm bộ đếm, và nếu lỗi giữa\nchừng thì bộ đếm có thể lệch so\
    \ với số dòng thật trong `likes` (phải có cách đồng bộ lại).\n\n(4) Chặn like trùng: chính `PRIMARY\
    \ KEY (post_id, user_id)` (một dạng UNIQUE) đã bảo đảm một\nngười chỉ like một bài một lần; nếu để\
    \ id riêng làm khóa chính thì thêm\n`UNIQUE (post_id, user_id)`. DB từ chối dòng thứ hai nên không\
    \ like trùng kể cả khi hai request\ntới cùng lúc.\n"
  rubric_md: 'Đạt (mức phỏng vấn, đúng mastery bar) khi: (1) dựng đúng bảng cho cả 3 truy vấn gồm bảng
    nối nhiều-nhiều cho ''theo dõi'' và cho ''like'' với khóa hai cột; (2) chọn index đúng cho (a) là
    `(user_id, created_at)` và giải thích thứ tự cột, và nhận ra (c) đã được khóa `likes(post_id, ...)`
    phục vụ; (3) chỉ đúng một chỗ phi chuẩn hóa cho (b) (ví dụ bộ đếm `like_count`) kèm đánh đổi (ghi
    khuếch đại/khó giữ nhất quán); (4) dùng UNIQUE hoặc khóa chính hai cột để chặn like trùng và giải
    thích vì sao an toàn khi ghi đồng thời. Đúng, trong time-box, tự giải thích rõ ràng: bằng chứng điểm
    3. Thiếu bảng nối, sai thứ tự cột index, hoặc không nêu đánh đổi của phi chuẩn hóa, hoặc không dùng
    UNIQUE: chưa đạt mức 3.'
