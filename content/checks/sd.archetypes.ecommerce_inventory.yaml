subtopic_id: sd.archetypes.ecommerce_inventory
items:
- id: S232
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Nói ngắn gọn: **bán quá** (oversell) là gì, và kỹ thuật cốt lõi để chặn nó khi nhiều người
    cùng mua

    một mặt hàng là gì?

    '
  answer_md: '**Oversell** là bán ra nhiều hơn số hàng đang có: ví dụ kho còn 1 cái nhưng hai người cùng
    mua và cả

    hai đều thành công. Nó sinh ra từ race **đọc-rồi-ghi** (hai luồng cùng đọc thấy còn hàng rồi cùng
    ghi).

    Kỹ thuật cốt lõi để chặn: **trừ kho có điều kiện** (conditional / atomic decrement) — gộp điều kiện

    "còn đủ hàng" vào ngay trong lệnh ghi, kiểu `UPDATE ... SET stock = stock - :q WHERE id = :id AND

    stock >= :q`, rồi kiểm tra **rows-affected** (1 = thành công, 0 = hết hàng). Tồn kho là nguồn sự thật,

    không phải giỏ hàng.

    '
  rubric_md: 'Đạt khi nêu đúng cả hai: oversell = bán nhiều hơn tồn kho do race đọc-rồi-ghi; chặn bằng
    trừ kho có điều kiện/nguyên tử (một lệnh, có mệnh đề `stock >= :q`, kiểm rows-affected). Đúng ý: điểm
    1. Thiếu định nghĩa oversell hoặc không nêu được trừ kho có điều kiện: điểm 0.'
- id: S233
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Kho của một SKU còn đúng **1** cái. Hai khách bấm "mua" gần như cùng lúc. Hãy nêu cách đảm
    bảo **chỉ một

    người mua được**: (1) viết câu lệnh / phép ghi then chốt và cách kiểm tra kết quả của nó; (2) giải
    thích

    vì sao cách này đúng còn kiểu đọc-tồn-kho-rồi-mới-ghi thì sai; (3) nếu thanh toán có thể chậm hoặc
    hỏng,

    nên dùng giữ hàng rồi xác nhận (reserve → confirm) thế nào?

    '
  answer_md: '(1) Dùng một lệnh **trừ kho có điều kiện**:

    `UPDATE items SET stock = stock - :q WHERE id = :id AND stock >= :q;` rồi xem **rows-affected**: bằng
    1

    là người đó mua được, bằng 0 là hết hàng (lệnh không đổi gì) ⇒ báo thất bại sạch. Với 2 khách tranh
    1 cái,

    đúng **một** lệnh trả về rows-affected = 1, lệnh kia = 0.

    (2) Đúng vì điều kiện `stock >= :q` được kiểm tra **ngay trong lúc ghi** dưới khóa dòng, không có
    khoảng

    trống giữa đọc và ghi. Kiểu đọc-rồi-ghi sai vì cả hai cùng đọc thấy 1, cùng kết luận "mua được", rồi
    cùng

    ghi 0 — bán ra 2 cái (race check-then-act).

    (3) Khi khách vào thanh toán, **giữ** (reserve) 1 cái bằng chính phép có điều kiện đó, kèm **hạn giữ**
    (TTL).

    Thanh toán OK ⇒ **confirm** (chuyển phần giữ thành đã bán); thanh toán hỏng hoặc hết hạn ⇒ **release**
    trả

    hàng về kho. Nhờ vậy hàng không bị treo và vẫn không bán quá.

    '
  rubric_md: 'Đạt (bằng chứng điểm 2) khi nêu đủ 3 ý: (1) lệnh trừ kho có điều kiện + kiểm rows-affected
    (đúng một lệnh =1); (2) giải thích race đọc-rồi-ghi vs atomic dưới khóa; (3) reserve→confirm có TTL,
    release khi hỏng. Đúng, trong time-box, tự giải thích được. Thiếu phần kiểm rows-affected hoặc không
    giải thích được vì sao read-then-write sai: tối đa điểm 1.'
- id: S234
  difficulty: 3
  type: concept
  minutes: 12
  prompt_md: 'Phỏng vấn: thiết kế luồng **đặt hàng không bán quá** cho một sàn thương mại điện tử. Hãy:
    (1) **viết câu

    lệnh trừ kho có điều kiện** và cách kiểm tra kết quả; (2) **vẽ (mô tả) luồng đơn hàng** dạng saga
    từ lúc

    đặt tới lúc thanh toán, có **bước hoàn lại (compensation) khi thanh toán hỏng**; (3) chỉ ra chỗ dùng

    **giữ hàng (reserve)** và **idempotency**; (4) nói một câu về **hot SKU** mà vẫn giữ bất biến không-bán-quá.

    '
  answer_md: "(1) **Trừ kho có điều kiện** (nguồn sự thật là tồn kho):\n`UPDATE items SET stock = stock\
    \ - :q WHERE id = :id AND stock >= :q;` — kiểm **rows-affected**: 1 = thành\ncông, 0 = không đủ hàng\
    \ ⇒ thất bại sạch. (Khi dùng reserve thì ghi vào cột \"đang giữ\" bằng cùng kiểu điều kiện.)\n(2)\
    \ **Luồng saga / state machine** `placed → paid → shipping → delivered`:\n- Tạo đơn (idempotent) +\
    \ **reserve** hàng (lệnh có điều kiện, kèm TTL).\n- Gọi **payment**.\n- Nếu OK → **confirm**: chuyển\
    \ phần giữ thành đã bán, đơn sang `paid`, phát `order.paid` cho fulfilment.\n- Nếu **hỏng/hết hạn**\
    \ → **compensation**: **restock** phần đã reserve về kho + **refund** nếu đã trừ tiền,\n  đơn sang\
    \ `cancelled/payment_failed`. Saga không rollback xuyên service — nó bù trừ bằng hành động nghịch.\n\
    (3) **Reserve** ở ngay khi đặt / vào thanh toán để không treo hàng khi khách bỏ dở; **idempotency**\n\
    (Idempotency-Key) ở API tạo đơn để bấm hai lần / gửi lại không tạo đơn trùng và không trừ kho hai\
    \ lần.\n(4) **Hot SKU**: chia bộ đếm (sharded counter) hoặc xếp hàng (queue/phòng chờ ảo) để giảm\
    \ tranh chấp một\ndòng, nhưng **điều kiện không-bán-quá vẫn phải giữ** — tồn kho là nguồn sự thật,\
    \ giỏ hàng/cache chỉ là best-effort.\n"
  rubric_md: 'Đạt mức 3 (phỏng vấn) khi: (1) viết đúng câu lệnh trừ kho có điều kiện + kiểm rows-affected;
    (2) mô tả luồng saga có reserve → payment → confirm và nêu rõ bước compensation (restock + refund)
    khi thanh toán hỏng, hiểu saga bù trừ chứ không rollback xuyên service; (3) chỉ đúng chỗ reserve và
    idempotent order; (4) nhắc hot SKU mà vẫn giữ bất biến không-bán-quá. Đúng, trong time-box, tự giải
    thích mạch lạc: bằng chứng điểm 3. Thiếu bước compensation hoặc không viết được câu lệnh có điều kiện:
    chưa đạt mức 3.'
