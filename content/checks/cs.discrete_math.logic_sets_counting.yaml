- id: X887
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và phân loại lỗi liên
    quan đến dòng thứ 5 và dòng thứ 6 của output (cú pháp, lúc chạy hay logic).
  code: "def choose(n, k):\n    r = 1\n    for i in range(k):\n        r = r * (n - i) // (i + 1)\n  \
    \  return r\n\n\nprint(choose(5, 2), choose(6, 0), choose(4, 4))\nprint(choose(5, 2) + choose(5, 3))\n\
    a = {1, 2, 3, 4, 5, 6}\nb = {2, 4, 6, 8}\nprint(len(a) + len(b) - len(a & b), len(a | b))\ntotal =\
    \ 0\nfor k in range(4):\n    total += choose(3, k)\nprint(total)\ntry:\n    print(sorted(a)[10])\n\
    except IndexError:\n    print(\"runtime error\")\nwords = [\"a\", \"b\", \"c\"]\npairs = [w1 + w2\
    \ for w1 in words for w2 in words if w1 < w2]\nprint(len(pairs), \"of\", 3 * 3)"
  expected_output: '10 1 1

    20

    7 7

    8

    runtime error

    3 of 9'
  answer_md: 'choose(5, 2) = 10, choose(6, 0) = 1 (vòng rỗng), choose(4, 4) = 1. C(5,2) + C(5,3) = 10
    + 10 = 20. Bù trừ: |a| + |b| - |a & b| = 6 + 4 - 3 = 7 và |a | b| = 7. Tổng C(3,k) với k = 0..3 là
    1 + 3 + 3 + 1 = 8 = 2^3. sorted(a) chỉ có 6 phần tử nên chỉ số 10 ném IndexError và in runtime error.
    Cuối cùng điều kiện w1 < w2 chỉ giữ ab, ac, bc nên in 3 of 9; nếu muốn số cặp có thứ tự khác nhau
    P(3,2) = 6 thì phải dùng w1 != w2. Chỉ số ngoài phạm vi là lỗi lúc chạy (runtime); đếm 3 thay vì 6
    là lỗi logic (chạy bình thường nhưng sai kết quả).'
  rubric_md: 'Output khớp từng dòng VÀ phân loại đúng: dòng 5 (sorted(a)[10]) là lỗi runtime (IndexError
    ném lúc chạy), dòng 6 (3 of 9) là lỗi logic (không báo lỗi nhưng sai kết quả; lỗi cú pháp thì Python
    từ chối chạy ngay từ đầu). Đúng: bằng chứng điểm 3; sai: tối đa điểm 2.'
