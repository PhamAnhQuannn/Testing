    là biểu thức (bool hoặc list lồng). Ví dụ `eval_logic(["and", True, ["not", False]])` trả `True`,
    `eval_logic(["or", False, False])` trả `False`, `eval_logic(["and"])` trả `True`.

    '
  problem_id: check-x886-eval-logic
