subtopic_id: sd.technologies.cache_search
items:
- id: S154
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Nói ngắn gọn: **Redis** và **Elasticsearch** mỗi cái là loại hệ thống gì, và mỗi cái hợp
    cho

    kiểu việc nào? Cho một ví dụ việc điển hình của từng cái.

    '
  answer_md: '**Redis** = kho dữ liệu trong bộ nhớ (in-memory data-structure store), truy cập theo **khóa

    (key)** rất nhanh; hợp cho **cache, phiên (session), bộ đếm/giới hạn tần suất (rate limit),

    bảng xếp hạng (leaderboard)** — ví dụ: cache dữ liệu nóng hoặc đếm số yêu cầu mỗi người dùng.

    **Elasticsearch/OpenSearch** = cỗ máy tìm kiếm dựa trên **inverted index**; hợp cho **tìm văn

    bản (full-text), lọc và tổng hợp (aggregation)** khi chưa biết trước khóa chính xác — ví dụ:

    ô tìm kiếm/gợi ý sản phẩm (autocomplete) hoặc phân tích log.

    '
  rubric_md: 'Đạt khi nêu đúng bản chất cả hai (Redis = in-memory, tra theo khóa, nhanh; Elasticsearch
    = search/inverted index, full-text) và một ví dụ việc hợp cho mỗi cái. Đúng ý: bằng chứng điểm 1.
    Thiếu một vế hoặc lẫn vai trò hai cái: tối đa điểm 0.'
- id: S155
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Một đội định dùng **Elasticsearch làm kho chính** để lưu đơn hàng (vì "tìm kiếm cũng tiện"),

    và định dùng **Redis làm kho lưu lâu dài** cho toàn bộ danh mục 50 triệu sản phẩm (vì "RAM thì

    nhanh"). Hãy chỉ ra **vì sao cả hai lựa chọn đều sai**, và nói đúng vai trò của mỗi công nghệ.

    '
  answer_md: '(1) **Elasticsearch không phải nguồn dữ liệu gốc (system of record):** nó chỉ là **index
    phụ**

    chép từ DB gốc (thường qua CDC), **gần-thời-gian-thực** (ghi xong chưa tìm thấy ngay, trễ tươi

    ~1s) và **không có giao dịch (transaction)** chắc chắn cho đơn hàng. Đơn hàng phải nằm ở một DB

    gốc bền vững; Elasticsearch chỉ để *tìm kiếm* trên bản chép.

    (2) **Redis bị chặn bởi bộ nhớ (memory-bound) và dễ mất dữ liệu:** nhét 50 triệu sản phẩm vào

    RAM vừa rất tốn kém vừa không hợp **dữ liệu lớn, nguội**; Redis chủ yếu trong bộ nhớ nên **mất

    dữ liệu khi sập** và **không phải kho gốc**. Danh mục đầy đủ để ở DB/đĩa; Redis chỉ cache phần

    nóng.

    Vai trò đúng: **DB gốc giữ sự thật**, **Redis tăng tốc phần nóng (cache)**, **Elasticsearch lo

    tìm kiếm/lọc/tổng hợp**.

    '
  rubric_md: 'Đạt (score 2) khi nêu đúng cả hai lỗi kèm lý do theo giới hạn: Elasticsearch không phải
    source of truth / near-real-time / không có transaction, và Redis bị giới hạn bộ nhớ + dễ mất dữ liệu,
    không hợp dữ liệu lớn nguội; đồng thời quy đúng vai trò (DB gốc = sự thật, Redis = cache, ES = search).
    Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Chỉ bắt được một lỗi hoặc không nêu được
    giới hạn làm lý do: tối đa điểm 1.'
- id: S156
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: 'Thiết kế phần lưu trữ cho một trang thương mại điện tử có **ba nhu cầu**: (A) **gợi ý khi
    gõ ô

    tìm sản phẩm (autocomplete)** chịu lỗi chính tả trên hàng chục triệu mặt hàng; (B) **giới hạn

    tần suất (rate limit)** số yêu cầu mỗi người dùng mỗi phút với độ trễ thấp; (C) **bảng xếp hạng

    (leaderboard)** sản phẩm bán chạy trong ngày, cập nhật gần thời gian thực. Với **mỗi nhu cầu**,

    chọn **Redis hay Elasticsearch**, nêu **1-2 lý do theo yêu cầu**, và kèm **một giới hạn** của

    lựa chọn đó.

    '
  answer_md: '(A) **Elasticsearch** — vì cần **tìm văn bản gần đúng (fuzzy/full-text)**, lọc và xếp hạng
    theo

    độ liên quan trên lượng dữ liệu lớn, đúng sở trường inverted index. Giới hạn cần lưu ý:

    **gần-thời-gian-thực** (sản phẩm mới có độ trễ tươi của index ~1s) và nó **không phải nguồn gốc**

    — sync từ DB gốc qua CDC, mất index thì reindex lại.

    (B) **Redis** — vì rate limit cần truy cập **theo khóa người dùng, độ trễ thấp, atomic

    increment và TTL** cho cửa sổ thời gian. Giới hạn: Redis **bị chặn bởi bộ nhớ** và **dễ mất dữ

    liệu**, nhưng số đếm chỉ sống một phút nên mất không nghiêm trọng.

    (C) **Redis** — dùng **sorted set** để xếp hạng theo điểm trong thời gian thực, cập nhật và đọc

    top-N rất nhanh. Giới hạn: dữ liệu trong RAM **dễ mất** (không phải kho gốc), nên con số doanh

    thu "thật" vẫn phải chốt lại từ DB gốc; bảng xếp hạng Redis là bản tăng tốc dựng lại được.

    '
  rubric_md: 'Đạt mức 3 (đúng mastery bar) khi: mỗi nhu cầu chọn đúng công nghệ (A=Elasticsearch, B=Redis,
    C=Redis), nêu 1-2 lý do bám theo yêu cầu/kiểu truy cập, VÀ kèm một giới hạn hợp lý cho lựa chọn (ES:
    độ tươi index/không phải nguồn gốc; Redis: bộ nhớ/dễ mất dữ liệu). Đúng, trong time-box, tự giải thích
    rõ ràng theo khuôn yêu cầu→lựa chọn→lý do→giới hạn: bằng chứng điểm 3. Chọn sai một nhu cầu, hoặc
    không nêu được giới hạn cho một lựa chọn: chưa đạt mức 3.'
