items:
- id: X630
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Giải thích 1 câu vì sao (dict dispatch
    là Strategy dạng data-driven).
  code: "OPS = {\"add\": lambda a, b: a + b, \"mul\": lambda a, b: a * b, \"max\": max}\n\n\ndef run(op,\
    \ a, b):\n    return OPS.get(op, lambda a, b: 0)(a, b)\n\n\nprint(run(\"add\", 2, 3))\nprint(run(\"\
    mul\", 4, 5))\nprint(run(\"max\", 7, 9))\nprint(run(\"pow\", 2, 3))"
  expected_output: '5

    20

    9

    0'
  answer_md: 'Mỗi tên phép tra ra một hàm trong dict: `add` cho 5, `mul` cho 20, `max` cho 9. `pow` không
    có khoá nên dùng hàm mặc định trả 0. Dict tên → hàm là Strategy dạng dữ liệu, thay chuỗi if/elif.'
  rubric_md: 'Output khớp VÀ nêu dict tra hàm thay if/elif (Strategy). Đúng: bằng chứng điểm 1; sai: tối
    đa điểm 0.'
- id: X631
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết `apply_op(op, a, b)` thay chuỗi if/elif theo loại bằng dict các hàm (dạng Strategy/Factory).
    `op` là chuỗi trong `"add"` (a+b), `"sub"` (a-b), `"mul"` (a*b), `"max"` (số lớn hơn), `"min"` (số
    nhỏ hơn); `op` khác trả `0`. Trả int. Ví dụ `apply_op("sub", 3, 10)` là `-7`, `apply_op("pow", 2,
    3)` là `0`.

    '
  problem_id: check-x631-dispatch
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút và dùng dict, không dùng if/elif:
    bằng chứng điểm 2; sai hoặc phải xem gợi ý: tối đa điểm 1.'
- id: X632
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và chỉ ra chỗ nào
    là Factory, chỗ nào là Strategy.
  code: "class Flat:\n    def apply(self, amt):\n        return amt\n\n\nclass Percent:\n    def __init__(self,\
    \ p):\n        self.p = p\n\n    def apply(self, amt):\n        return amt + amt * self.p // 100\n\
    \n\nclass Fixed:\n    def __init__(self, fee):\n        self.fee = fee\n\n    def apply(self, amt):\n\
    \        return amt + self.fee\n\n\nREGISTRY = {\"VN\": lambda: Percent(10), \"SG\": lambda: Fixed(7)}\n\
    \n\ndef make_policy(code):\n    return REGISTRY.get(code, Flat)()\n\n\ntotal = 0\nfor code, amt in\
    \ [(\"VN\", 200), (\"SG\", 50), (\"XX\", 30), (\"VN\", 99)]:\n    policy = make_policy(code)\n   \
    \ result = policy.apply(amt)\n    total += result\n    print(f\"{code}:{result}\")\nprint(total)\n\
    print(type(make_policy(\"XX\")).__name__)"
  expected_output: 'VN:220

    SG:57

    XX:30

    VN:108

    415

    Flat'
  answer_md: '`make_policy` là Factory: chọn object theo mã quốc gia, mã lạ rơi về `Flat`. Mỗi policy
    là một Strategy có cùng `apply`. VN: 200 + 20 = 220; SG: 50 + 7 = 57; XX: 30; VN: 99 + 9 = 108 (99*10//100
    = 9). Tổng 415.'
  rubric_md: 'Output khớp từng dòng VÀ chỉ đúng Factory chọn Strategy. Đúng: bằng chứng điểm 3; sai: tối
    đa điểm 2.'
