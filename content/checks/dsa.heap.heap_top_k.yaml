  answer_md: 'Heap luôn giữ tối đa 3 phần tử: mỗi khi vượt 3 thì `heappop` bỏ phần tử nhỏ nhất, nên cuối
    cùng còn 3 số lớn nhất `{5, 8, 9}`. Đỉnh `h[0]` là nhỏ nhất trong nhóm đó, tức `5`; `sorted(h)` là
