items:
- id: S289
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Nói ngắn gọn: **RAG (retrieval-augmented generation)** là gì, và kể tên **hai pha** của
    nó cùng

    các bước chính trong mỗi pha.

    '
  answer_md: "**RAG** là cách gắn LLM vào dữ liệu của bạn: trước khi trả lời, hệ thống **tra vài đoạn\
    \ tài\nliệu liên quan rồi dán vào prompt** để model trả lời dựa trên đó (giảm bịa, thêm kiến thức\n\
    mới/riêng, trích được nguồn — mà không cần huấn luyện lại model).\n\n**Hai pha:**\n- **Nạp tài liệu\
    \ (indexing, offline):** tài liệu → **cắt đoạn (chunk)** → **embed** từng đoạn →\n  lưu vào **kho\
    \ vector (vector DB)**.\n- **Trả lời (query, online):** **embed câu hỏi** → **truy xuất top-k** đoạn\
    \ gần nhất → **dựng\n  prompt (augment)** với các đoạn làm ngữ cảnh → **sinh (generate)** câu trả\
    \ lời.\n"
  rubric_md: 'Đúng khi nêu được: (1) RAG = tra đoạn tài liệu liên quan rồi dán vào prompt cho LLM trả
    lời dựa trên đó; (2) pha nạp offline gồm chunk → embed → kho vector; (3) pha trả lời online gồm embed
    câu hỏi → retrieve top-k → augment → generate. Đủ cả hai pha với các bước chính: bằng chứng điểm 1.
    Thiếu một pha, hoặc lẫn lộn thứ tự bước (embed câu hỏi ở pha nạp...): tối đa điểm 0.'
- id: S290
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Chatbot RAG nội bộ trả lời: "Công ty cho 15 ngày nghỉ phép/năm", nhưng tài liệu thật ghi
    18

    ngày. Bạn **soi các đoạn đã truy xuất (retrieved chunks)** cho câu hỏi đó và thấy: đoạn nói

    đúng "18 ngày nghỉ phép" **CÓ** nằm trong top-k đưa cho model. Hãy trả lời:

    (1) đây là **lỗi tìm kiếm (retrieval)** hay **lỗi sinh (generation)**, và vì sao biết;

    (2) nêu 2 cách sửa **đúng tầng** đó;

    (3) nếu thay vào đó đoạn "18 ngày" **không** có trong top-k, thì lỗi đổi sang tầng nào và sửa

    hướng nào?

    '
  answer_md: '(1) **Lỗi sinh (generation failure).** Căn cứ: đoạn chứa câu trả lời đúng ("18 ngày") **đã
    nằm

    trong ngữ cảnh** đưa cho model, nghĩa là bước truy xuất làm đúng; model vẫn trả sai (15 ngày) →

    lỗi ở bước model đọc ngữ cảnh và sinh, không phải ở bước tìm.

    (2) Sửa ở **tầng sinh**: siết prompt grounding ("chỉ trả lời dựa trên các đoạn cho sẵn, không

    suy đoán"); **bắt trích dẫn** số đoạn cho mỗi ý (ép model chỉ ra nguồn); giảm nhiễu (bớt đoạn

    thừa trong ngữ cảnh / lost-in-the-middle); hoặc đổi sang model mạnh hơn. (Nêu đúng 2 trong số

    này là đạt.)

    (3) Khi đoạn "18 ngày" **không** lọt top-k → chuyển thành **lỗi tìm kiếm (retrieval)**: model

    không hề thấy thông tin đúng. Sửa ở **tầng tìm**: xem lại cách **chunk**, đổi/kiểm tra

    **embedding model**, tăng **k**, thêm **hybrid search** hoặc **rerank**.

    '
  rubric_md: 'Đạt khi: (1) kết luận đúng là lỗi SINH và lý do là ''đoạn đúng đã có trong ngữ cảnh mà model
    vẫn sai''; (2) nêu 2 cách sửa thuộc tầng sinh (grounding/prompt, trích dẫn, giảm nhiễu, đổi model);
    (3) nhận ra khi đoạn đúng vắng top-k thì thành lỗi TÌM và sửa ở tầng tìm (chunk/embed/k/hybrid/rerank).
    Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Nếu đổ lỗi cho tìm kiếm ở (1) dù đoạn
    đúng đã có trong ngữ cảnh, hoặc không phân biệt được hai tầng: tối đa điểm 1.'
- id: S291
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: '**(Phỏng vấn AI engineer)** Bạn được giao dựng một trợ lý hỏi-đáp trên tài liệu nội bộ bằng

    RAG. Hãy trình bày:

    (1) **vẽ/mô tả kiến trúc RAG đầu-cuối** — đủ hai pha và các bước — và giải thích *vì sao* có

    mỗi bước, kể cả vì sao chọn RAG thay vì fine-tune hay nhồi cả tài liệu vào context;

    (2) một người dùng báo một câu trả lời **sai**. Hãy nêu **quy trình chẩn đoán** để chỉ ra đúng

    **một tầng** cần sửa (tìm kiếm hay sinh) và cách sửa tương ứng.

    '
  answer_md: "**(1) Kiến trúc đầu-cuối + lý do:**\n- **Pha nạp (offline):** tài liệu → **chunk** (vì không\
    \ embed cả cuốn thành một vector, và muốn\n  lấy đúng đoạn liên quan) → **embed** từng đoạn → lưu\
    \ **kho vector** (để tra nhanh theo độ gần\n  nghĩa).\n- **Pha trả lời (online):** **embed câu hỏi**\
    \ bằng *cùng* model embedding → **truy xuất top-k**\n  đoạn gần nhất → **augment**: dựng prompt gắn\
    \ các đoạn làm ngữ cảnh, kèm luật **grounding**\n  (\"chỉ trả lời từ các đoạn, không có thì nói không\
    \ biết\") và yêu cầu **trích dẫn** → **generate**.\n- **Vì sao RAG, không fine-tune / không nhồi hết\
    \ context:** tài liệu nội bộ đổi thường xuyên →\n  RAG cập nhật chỉ bằng nạp lại kho, rẻ hơn train\
    \ lại; tài liệu quá lớn so với context window\n  nên không nhồi hết được, phải *chọn* đoạn liên quan;\
    \ RAG trích được nguồn, giảm bịa.\n**(2) Quy trình chẩn đoán (cô lập tầng):**\n- Bước đầu luôn là\
    \ **soi các đoạn đã truy xuất (retrieved chunks)** cho đúng câu hỏi đó rồi tự đọc.\n- **Nếu đoạn chứa\
    \ câu trả lời KHÔNG nằm trong top-k → lỗi tìm kiếm (retrieval).** Sửa ở tầng\n  tìm: chỉnh **chunking**,\
    \ đổi/kiểm tra **embedding model**, tăng **k**, thêm **hybrid search**,\n  thêm **rerank**.\n- **Nếu\
    \ đoạn đúng CÓ trong top-k mà model vẫn sai/bịa → lỗi sinh (generation).** Sửa ở tầng\n  sinh: siết\
    \ **prompt grounding**, bắt **trích dẫn**, giảm **nhiễu** (bớt đoạn thừa,\n  lost-in-the-middle),\
    \ hoặc đổi model.\n- Chốt bằng đúng **một tầng** để sửa, không chỉnh mò cả hai cùng lúc; sửa xong\
    \ đo lại trên câu\n  hỏi đó và vài câu tương tự.\n"
  rubric_md: 'Đạt (mức phỏng vấn, điểm 3) khi: (1) mô tả kiến trúc đủ hai pha với các bước (chunk/embed/kho
    vector; embed câu hỏi/retrieve top-k/augment+grounding+trích dẫn/generate) VÀ giải thích được vì sao
    chọn RAG thay vì fine-tune/nhồi context (cập nhật rẻ, vượt giới hạn context, trích nguồn); VÀ (2)
    quy trình chẩn đoán bắt đầu bằng soi đoạn đã truy xuất, phân nhánh đúng retrieval vs generation với
    cách sửa đúng tầng, và kết luận đúng một tầng cần sửa. Đúng, trong time-box, tự giải thích rõ: bằng
    chứng điểm 3. Thiếu phần cô lập bằng cách soi đoạn đã lấy, hoặc không giải thích được lý do chọn RAG:
    chưa đạt mức 3.'
