- id: X795
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng.
  code: 'ids = [10, 20, 30, 20]

    emails = ["a@x", "b@x", "c@x", "d@x"]

    print(len(set(ids)) == len(ids))

    print(len(set(emails)) == len(emails))

    pairs = list(zip(ids, ["p", "p", "q", "q"]))

    print(len(set(pairs)), len(pairs))

    print(len(set(pairs)) == len(pairs))'
  expected_output: 'False

    True

    4 4

    True'
  answer_md: '`ids` có 20 lặp nên không duy nhất (False); `emails` đều khác nhau (True). Các cặp (id,
    nhóm) là (10,p), (20,p), (30,q), (20,q) đều khác nhau nên 4 giá trị duy nhất trên 4 dòng (True): id
    đơn lẻ không là key nhưng cặp cột thì là.'
  rubric_md: 'Output khớp từng dòng. Đúng: bằng chứng điểm 1; sai: tối đa điểm 0.'
- id: X796
  difficulty: 2
  type: write_code
  minutes: 6
  prompt_md: 'Viết hàm `is_candidate_key(rows, cols)`. `rows` là list các dict cùng tập khoá (giá trị
    là số nguyên, chuỗi hoặc None), `cols` là list tên cột. Trả về `True` khi `cols` là khoá hợp lệ: mọi
    dòng đều có giá trị khác None ở mọi cột trong `cols`, VÀ bộ giá trị của các cột đó không lặp giữa
    hai dòng bất kỳ. `rows` rỗng cho `True`. Ví dụ `rows = [{"id":1,"g":"a"},{"id":2,"g":"a"},{"id":1,"g":"b"}]`:
    `cols = ["id"]` cho `False` (id 1 lặp), `cols = ["id","g"]` cho `True`.

    '
  problem_id: check-x796-is-candidate-key
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 6 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X797
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và giải thích vì sao
    dòng có user_id là None không bị coi là vi phạm foreign key còn user_id 4 thì có, và điều gì xảy ra
    với các dòng con khi xoá user 1 theo kiểu CASCADE.
  code: 'users = {1, 2, 3}

    orders = [("o1", 1), ("o2", 4), ("o3", None), ("o4", 2)]

    bad = [o for o, u in orders if u not in users]

    print(bad)

    ok = [o for o, u in orders if u is None or u in users]

    print(ok)

    kept = [(o, u) for o, u in orders if u != 1]

    print(len(kept))'
  expected_output: '[''o2'', ''o3'']

    [''o1'', ''o3'', ''o4'']

    3'
  answer_md: Phép kiểm tra thô `u not in users` coi cả None lẫn 4 là sai nên `bad = ['o2', 'o3']`. Nhưng
    với foreign key cho phép NULL, None nghĩa là 'chưa có cha' và hợp lệ; chỉ giá trị khác NULL mà không
    tồn tại (u = 4 của o2) mới vi phạm referential integrity, nên danh sách hợp lệ đúng là o1, o3, o4.
    Xoá user 1 kiểu CASCADE xoá luôn dòng con (o1), còn lại 3 dòng; RESTRICT sẽ chặn việc xoá, SET NULL
    giữ dòng nhưng đặt user_id thành NULL.
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng: NULL trong foreign key hợp lệ (nếu cột cho phép),
    chỉ giá trị không NULL mà không tồn tại mới vi phạm; CASCADE xoá dòng con. Đúng: bằng chứng điểm 3;
    sai: tối đa điểm 2.'
