- id: Q039
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), dòng code in ra gì? Giải thích 1 câu.
  code: "def make():\n    n = 0\n    def inc():\n        nonlocal n\n        n += 1\n        return n\n\
    \    return inc\nf = make(); f()\nprint(f(), f())"
  expected_output: 2 3
  answer_md: Hàm trong nhớ biến n của hàm ngoài (closure); nonlocal cho phép gán lại.
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
- id: Q040
  difficulty: 2
  type: concept
  minutes: 3
  prompt_md: 'Vì sao đoạn `x = 0; def f(): x += 1; f()` báo UnboundLocalError? Sửa thế nào?'
  answer_md: 'Trong f, `x += 1` gán x nên x được coi là biến cục bộ, chưa có giá trị. Sửa: `global x`
    (hoặc truyền tham số/trả về giá trị).'
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 2; sai:
    tối đa điểm 1.'
