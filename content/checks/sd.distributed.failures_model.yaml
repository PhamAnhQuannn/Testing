subtopic_id: sd.distributed.failures_model
items:
- id: S130
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: '**Partial failure** (hỏng một phần) trong hệ phân tán nghĩa là gì, và vì sao nó khó hơn
    hẳn so

    với một máy đơn lẻ?

    '
  answer_md: 'Partial failure là khi **một vài node (hoặc mạng tới chúng) hỏng trong khi phần còn lại
    của hệ

    vẫn chạy bình thường** — hệ không tắt gọn mà rơi vào trạng thái nửa sống nửa chết. Nó khó hơn

    máy đơn lẻ vì máy đơn chỉ có hai trạng thái rõ ràng (chạy hoặc chết hẳn, và ta biết ngay), còn

    trong hệ phân tán một **node đang chạy không biết chắc node kia còn sống hay đã chết** — nó chỉ

    thấy "im lặng" mà không biết nguyên nhân.

    '
  rubric_md: 'Đạt khi nêu đúng hai ý: (1) một phần hỏng, phần khác vẫn chạy; (2) node sống không biết
    chắc node kia sống hay chết (khác máy đơn: chạy/chết rõ ràng). Đúng cả hai ý: bằng chứng điểm 1; thiếu
    ý ''không biết chắc trạng thái node kia'': tối đa điểm 0.'
- id: S131
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Node A gọi node B và sau 5 giây vẫn không nhận được trả lời, nên hệ **kết luận B đã chết**
    và

    làm việc tiếp theo. Hãy trả lời: (1) kể ít nhất **ba** khả năng thực sự có thể xảy ra ngoài

    "B đã chết"; (2) vì sao vì thế mà **timeout** và **heartbeat** không phải là sự thật tuyệt đối;

    (3) nêu một **hậu quả nguy hiểm** nếu hệ hành động dựa trên kết luận "B chết" trong khi B thật ra

    còn sống.

    '
  answer_md: '(1) Ngoài khả năng B chết thật, còn: B **vẫn sống nhưng chậm** (kẹt tải hoặc đang GC pause);
    B

    đã **xử lý xong nhưng câu trả lời bị rớt** trên đường về (omission); hoặc mạng giữa A và B bị

    **phân mảnh** (network partition) nên tin không qua được dù B khỏe.

    (2) Vì "im lặng" không tách được các khả năng trên, nên **timeout** chỉ là một ngưỡng chờ ta tự

    chọn — một **phỏng đoán**, không phải sự thật; **heartbeat** cũng dựa trên timeout nên **báo chết

    nhầm** (false-positive) khi có GC pause hay network blip.

    (3) Nếu B thật ra còn sống (hoặc tỉnh lại sau), ta có thể có **hai leader / hai node cùng cầm

    lock** cùng ghi vào kho — **split brain** — dẫn tới ghi đè và hỏng dữ liệu.

    '
  rubric_md: 'Đạt (điểm 2) khi nêu đủ: (1) ít nhất 3 khả năng khác ''B chết'' (chậm/GC, tin rớt, partition);
    (2) timeout là phỏng đoán và heartbeat false-positive được; (3) hậu quả split brain / hai node cùng
    ghi. Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Thiếu ý ''timeout là phỏng đoán''
    hoặc không nêu được hậu quả nguy hiểm: tối đa điểm 1.'
- id: S132
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: 'Trình bày trọn vẹn chủ đề mô hình lỗi ở mức phỏng vấn: (1) **kể tên các kiểu lỗi** trong
    hệ phân

    tán và nói rõ kiểu nào thường ngoài phạm vi hệ nội bộ; (2) giải thích **vì sao timeout và

    heartbeat không tuyệt đối đúng**; (3) mô tả một kịch bản **split brain** do hành động trên phỏng

    đoán sai, rồi giải thích **fencing token** chặn hậu quả đó như thế nào — nói rõ **ai** kiểm tra

    token và kiểm tra điều gì.

    '
  answer_md: '(1) **Kiểu lỗi:** crash-stop (dừng hẳn, không quay lại); crash-recovery (chết rồi sống lại,
    có

    thể mất trạng thái trong RAM); omission (node sống nhưng tin nhắn bị rớt); network partition

    (mạng chia hệ thành các nhóm không liên lạc được); Byzantine (làm sai lệch tùy ý/gian lận) —

    kiểu Byzantine thường **ngoài phạm vi** hệ nội bộ tin cậy, chỉ quan trọng ở blockchain/hệ nhiều

    bên không tin nhau.

    (2) **Vì sao timeout/heartbeat không tuyệt đối:** khi A chờ B mà im lặng, A không tách được "B

    chết" với "B chậm (GC pause)" hay "câu trả lời bị rớt"; trong mạng bất đồng bộ không có giới hạn

    trên cho thời gian truyền, nên timeout chỉ là **phỏng đoán**. Heartbeat cũng chỉ là timeout đóng

    gói lại, nên **false-positive** được khi có GC pause hay network blip.

    (3) **Split brain + fencing token:** A đang là leader/cầm lock (token 33) bị GC pause lâu; hệ

    tưởng A chết nên cấp quyền cho B (token 34). A tỉnh dậy, không biết mình đã bị thay, và tiếp tục

    ghi — cả A và B đều tưởng mình là leader và cùng ghi, gây hỏng dữ liệu. **Fencing token** là số

    tăng dần đều kèm mỗi lần cấp quyền; **kho tài nguyên (resource)** nhớ số lớn nhất đã thấy (34) và

    **từ chối mọi token nhỏ hơn**. Khi A ghi với token 33, kho so sánh 33 < 34 và từ chối — không cần

    biết A có thực sự chết hay không, chỉ cần đảm bảo tay chơi cũ (stale) không làm hỏng dữ liệu.

    Fencing token không ngăn phỏng đoán sai, nó chặn **hậu quả** của phỏng đoán sai.

    '
  rubric_md: 'Đạt mức phỏng vấn (điểm 3) khi đủ cả ba trụ cột: (1) kể đúng các kiểu lỗi và chỉ ra Byzantine
    ngoài phạm vi hệ nội bộ; (2) giải thích timeout/heartbeat là phỏng đoán, không tách được chết/chậm/rớt
    tin, false-positive do GC pause/network blip; (3) mô tả split brain và nói đúng rằng **kho** kiểm
    tra fencing token, từ chối số nhỏ hơn số lớn nhất đã thấy, nhờ đó chặn tay chơi cũ. Đúng, trong time-box,
    tự giải thích rõ ràng: bằng chứng điểm 3. Thiếu một trụ cột (ví dụ không nói ai kiểm tra token, hoặc
    không giải thích được vì sao timeout không tuyệt đối): chưa đạt mức 3.'
