- id: Q029
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), dòng code in ra gì? Giải thích 1 câu.
  code: 'a = [[0] * 2] * 2

    a[0][0] = 1

    b = [[0] * 2 for _ in range(2)]

    b[0][0] = 1

    print(a, b)'
  expected_output: '[[1, 0], [1, 0]] [[1, 0], [0, 0]]'
  answer_md: '`[[0]*2]*2` nhân bản tham chiếu tới CÙNG một list con; comprehension tạo list con mới mỗi
    hàng.'
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
- id: Q030
  difficulty: 2
  type: concept
  minutes: 3
  prompt_md: Phân biệt gán `b = a`, `b = a[:]` và `copy.deepcopy(a)` với a là list các list.
  answer_md: '`b = a`: cùng một đối tượng. `a[:]`: shallow copy (list ngoài mới, list con vẫn chung).
    deepcopy: sao chép sâu mọi tầng.'
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 2; sai:
    tối đa điểm 1.'
