subtopic_id: ml.llm_eval_serving.llm_as_judge
items:
- id: S316
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Nói ngắn gọn: trong LLM-as-judge, **pointwise** và **pairwise** khác nhau thế nào, và vì
    sao

    pairwise thường **đáng tin hơn**?

    '
  answer_md: '**Pointwise (chấm điểm từng câu):** đưa cho judge **một** đầu ra kèm rubric và yêu cầu cho
    điểm

    tuyệt đối (ví dụ thang 1-5). **Pairwise (so cặp):** đưa **hai** đầu ra cho cùng câu hỏi và hỏi

    "A hay B tốt hơn?". Pairwise thường đáng tin hơn vì **phán đoán so sánh tương đối ổn định hơn

    điểm tuyệt đối** — điểm tuyệt đối của LLM hay dao động cho cùng một câu, còn "cái nào hơn" thì

    nhất quán hơn; vì vậy pairwise hợp để so hai phiên bản model/prompt.

    '
  rubric_md: 'Đúng khi nêu được: pointwise = chấm điểm một câu theo rubric; pairwise = so hai câu chọn
    câu tốt hơn; và lý do pairwise đáng tin hơn (so sánh tương đối ổn định hơn điểm tuyệt đối hay dao
    động). Đủ ý: bằng chứng điểm 1. Thiếu một định nghĩa hoặc không nêu được lý do: tối đa điểm 0.'
- id: S317
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Bạn dựng một judge pointwise chấm 1-5 độ hữu ích cho câu trả lời chatbot. Judge chạy được
    nhưng:

    (a) **điểm nhảy lung tung** giữa các lần chạy cho cùng một câu; (b) bạn so judge với người trên

    30 câu và thấy **trùng 88%** nên định kết luận "judge tốt". Hãy chỉ ra **hai vấn đề** và cách

    khắc phục: (1) làm judge **ổn định, chấm nhất quán** hơn; (2) vì sao **88% trùng** chưa đủ để tin,

    và nên **đo bằng gì** thay thế.

    '
  answer_md: '**(1) Làm judge ổn định hơn:** đặt **temperature 0** để cùng đầu vào cho ra cùng điểm; viết

    **rubric mô tả rõ từng mức** (1 = ..., 3 = ..., 5 = ...) thay vì để judge tự hiểu; bắt judge

    **nêu lý do trước rồi mới chấm** (CoT-then-verdict) và trả **đầu ra có khuôn** (JSON

    `{"reason": ..., "score": ...}`) để parse được. Có thể thêm few-shot ví dụ đã chấm sẵn để neo

    chuẩn.

    **(2) Vì sao 88% chưa đủ:** nếu nhãn lệch (phần lớn câu đều "hữu ích"), hai bên có thể trùng

    88% **phần lớn do ăn may** (cùng đoán nhãn phổ biến). Phải đo bằng **Cohen''s kappa**, vốn

    **trừ đi phần trùng do ngẫu nhiên**: kappa = (p_quan_sát − p_ngẫu_nhiên) / (1 − p_ngẫu_nhiên).

    Chỉ khi kappa đủ cao (ví dụ 0,6-0,8 trở lên) mới nên tin judge và cho nó chấm ở quy mô lớn.

    '
  rubric_md: 'Đạt khi nêu đúng cả hai: (1) ít nhất temperature 0 + rubric mô tả từng mức (có thể thêm
    CoT-then-verdict / constrained output / few-shot) để chấm ổn định nhất quán; (2) nhận ra % trùng dễ
    cao do ngẫu nhiên khi nhãn lệch, và đề xuất Cohen''s kappa (trừ phần trùng ngẫu nhiên) làm thước đo.
    Đúng, trong time-box, tự giải thích được: bằng chứng điểm 2. Chỉ sửa được phần ổn định mà không thấy
    vấn đề của % thô (hoặc không nêu kappa): tối đa điểm 1.'
- id: S318
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: '**(Phỏng vấn AI engineer)** Bạn phụ trách đánh giá một chatbot chăm sóc khách hàng (câu
    trả lời

    tự do, không có đáp án chuẩn) và muốn dùng LLM-as-judge để chấm ở quy mô lớn. Hãy trình bày:

    (1) cách **thiết kế một judge có rubric** dùng được (rubric, định dạng, cách chấm);

    (2) cách **đo độ đồng thuận với người bằng kappa** và vì sao không dùng tỉ lệ % thô;

    (3) **nêu và cách giảm ít nhất 3 thiên vị** của judge; và (4) khi nào vẫn cần human eval.

    '
  answer_md: "**(1) Thiết kế judge có rubric:**\n- Viết **rubric** gồm vài tiêu chí (đúng sự thật, hữu\
    \ ích, lịch sự/đúng tông), mỗi tiêu chí\n  **mô tả rõ từng mức điểm** (ví dụ thang 1-5 có mô tả cho\
    \ 1/3/5).\n- Có thể thêm **few-shot**: 1-3 ví dụ đã chấm sẵn (câu + điểm + lý do) để neo chuẩn.\n\
    - **Bắt judge nêu lý do trước, rồi mới chốt điểm** (CoT-then-verdict); trả **đầu ra có khuôn**\n \
    \ (JSON `{\"reason\": ..., \"score\": ...}`) để parse; chạy **temperature 0** cho lặp lại được.\n\
    - Cân nhắc chấm **pairwise** (A/B) khi mục tiêu là so hai phiên bản, vì so sánh tương đối đáng\n \
    \ tin hơn điểm tuyệt đối.\n\n**(2) Đo đồng thuận bằng kappa:**\n- Lấy mẫu 20-50 câu, cho **người chấm**\
    \ làm chuẩn vàng, cho **judge chấm cùng mẫu**.\n- Dùng **Cohen's kappa**: kappa = (p_quan_sát − p_ngẫu_nhiên)\
    \ / (1 − p_ngẫu_nhiên). Không dùng\n  % trùng thô vì khi nhãn lệch, % trùng có thể cao **chỉ do ngẫu\
    \ nhiên**; kappa trừ phần đó đi.\n  Đọc khoảng: 1 = hoàn toàn, 0 = như đoán mò, 0,6-0,8 khá tốt. kappa\
    \ đủ cao mới cho judge chạy\n  diện rộng.\n\n**(3) Thiên vị và cách giảm (ít nhất 3):**\n- **Position\
    \ bias (vị trí):** pairwise hay thích câu đứng trước → chấm **cả hai thứ tự** rồi\n  lấy trung bình\
    \ / chỉ tính thắng khi thắng ở cả hai lần.\n- **Verbosity / length bias (độ dài):** thích câu dài\
    \ hơn → ghi rõ \"độ dài không phải tiêu chí\",\n  kiểm soát độ dài hoặc phạt lan man.\n- **Self-preference\
    \ bias (tự ưu ái):** thích văn của chính dòng model mình → dùng **judge thuộc\n  dòng model khác**\
    \ với model bị chấm, hoặc kết hợp nhiều judge.\n- (Có thể thêm leniency / format bias.)\n\n**(4) Khi\
    \ nào vẫn cần human eval:** chốt chất lượng cuối trước khi ra mắt, các ca **an toàn**\nnhạy cảm (không\
    \ giao phán quyết cuối cho LLM), và **hiệu chỉnh/kiểm chứng judge định kỳ** bằng\nmẫu nhãn người để\
    \ bắt lúc judge trôi (drift).\n"
  rubric_md: 'Đạt (mức phỏng vấn, điểm 3) khi nêu đủ: (1) rubric có mô tả từng mức + định dạng/cách chấm
    hợp lý (temperature 0, CoT-then-verdict hoặc constrained output; có thể nhắc pointwise/pairwise);
    (2) đo đồng thuận bằng Cohen''s kappa VÀ giải thích vì sao % thô không đủ (trùng do ngẫu nhiên khi
    nhãn lệch); (3) nêu và giảm được ÍT NHẤT 3 thiên vị đúng (position/verbosity/self-preference với cách
    giảm khớp); (4) chỉ ra khi nào cần human eval (chất lượng cuối / an toàn / hiệu chỉnh). Đúng, trong
    time-box, tự giải thích rõ: bằng chứng điểm 3. Thiếu kappa (hoặc không bác được % thô), hoặc nêu được
    dưới 3 thiên vị có cách giảm: chưa đạt mức 3.'
