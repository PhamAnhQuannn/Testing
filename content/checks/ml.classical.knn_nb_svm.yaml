- id: X899
  difficulty: 3
  type: read_code
  minutes: 6
  prompt_md: Chạy tay (không chạy máy), đoạn code Naive Bayes dưới in ra gì? Ghi đúng từng dòng và giải
    thích vì sao cần Laplace smoothing.
  code: 'data = [("spam", {"km", "mua"}), ("spam", {"km"}), ("ham", {"km", "hop"}), ("ham", {"hop"})]

    has = [label for label, w in data if "km" in w]

    print(round(has.count("spam") / len(has), 3))

    n_spam = sum(1 for label, _ in data if label == "spam")

    c = sum(1 for label, w in data if label == "spam" and "mua" in w)

    print((c + 1) / (n_spam + 2))

    print((0 + 1) / (n_spam + 2))

    print(0 / n_spam)'
  expected_output: '0.667

    0.5

    0.25

    0.0'
  answer_md: 'Có 3 email chứa ''km'', 2 là spam nên P(spam | km) = 2/3 = 0.667. Có 2 email spam, 1 email
    spam chứa ''mua''; với Laplace smoothing cho feature có/không, P(mua | spam) = (1+1)/(2+2) = 0.5.
    Một từ chưa thấy (đếm 0) trong lớp được (0+1)/(2+2) = 0.25 thay vì 0. Dòng cuối là xác suất không
    smoothing 0/2 = 0.0: nếu dùng nó, tích P(lớp)·ΠP(từ|lớp) của cả email bằng 0 dù các từ khác rất đặc
    trưng spam. Smoothing giữ mọi xác suất dương.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích đúng smoothing tránh xác suất 0 triệt tiêu cả tích.
    Đúng: bằng chứng điểm 3; sai: tối đa điểm 2.'
