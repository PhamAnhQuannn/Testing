  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Ghi đúng từng dòng và nêu nhãn k-NN dự
    đoán.
  code: 'import numpy as np

    X = np.array([[0, 0], [1, 0], [0, 1], [5, 5]])

    y = np.array([0, 0, 1, 1])

    q = np.array([1, 1])

    d = np.sqrt(((X - q) ** 2).sum(axis=1))

    print(d.round(2))

    idx = np.argsort(d, kind="stable")[:3]

    print(idx)

    print(np.bincount(y[idx]).argmax())'
  expected_output: '[1.41 1.   1.   5.66]

    [1 2 0]

    0'
  answer_md: 'Khoảng cách từ q=(1,1): tới (0,0) là sqrt(2)=1.41, tới (1,0) là 1, tới (0,1) là 1, tới (5,5)
    là sqrt(32)=5.66. Sắp xếp ổn định tăng dần cho chỉ số [1 2 0] (hai điểm cách 1 giữ thứ tự chỉ số).
    Nhãn của ba láng giềng là [0, 1, 0], đa số là 0 (2 phiếu so với 1) nên dự đoán 0.'
  rubric_md: 'Output khớp từng dòng VÀ nêu đúng cách bỏ phiếu đa số của k=3 láng giềng. Đúng: bằng chứng
    điểm 1; sai: không đạt.'
