- id: Q254
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: Khi nào accuracy gây hiểu lầm? Chọn precision hay recall cho bài phát hiện gian lận / lọc
    thư rác?
  answer_md: 'Dữ liệu mất cân bằng (99% lớp âm) -> accuracy cao dù mô hình vô dụng. Gian lận/bệnh: ưu
    tiên recall (không bỏ sót); lọc thư rác: ưu tiên precision (đừng chặn nhầm thư thật).'
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 1; sai:
