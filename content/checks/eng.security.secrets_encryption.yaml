subtopic_id: eng.security.secrets_encryption
items:
- id: E142
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Vì sao **không** được hardcode hay commit secret (password, API key) vào Git? Nêu hai nơi
    cất secret an toàn hơn.

    '
  answer_md: "- Git lưu **toàn bộ lịch sử**: xóa secret ở commit sau vẫn còn trong commit cũ; repo bị\
    \ clone, fork hay public là lộ.\n- Nơi cất an toàn hơn: **biến môi trường** (tiêm lúc chạy, file `.env`\
    \ nằm trong `.gitignore`) và\n  **secrets manager / KMS** (Vault, cloud secret manager) có phân quyền\
    \ và log truy cập.\n- Nếu đã lỡ lộ: **rotate** (thu hồi, cấp mới).\n"
  rubric_md: 'Đạt khi nêu đúng lý do (lịch sử Git vẫn giữ / dễ lộ qua repo) và ít nhất hai nơi cất an
    toàn (env var, secrets manager/KMS). Đủ ý: bằng chứng điểm 1; nói chỉ cần xóa dòng ở commit mới hoặc
    không nêu nơi cất nào: điểm 0.'
- id: E143
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Trong repo của một dịch vụ, file `config.py` có `DB_PASSWORD = "..."` và `PAYMENT_API_KEY
    = "..."`

    đã bị commit và push lên remote (cả hai đã nằm trong lịch sử). Hãy nêu các bước xử lý đúng theo thứ
    tự

    và cách cấu hình sau khi sửa.

    '
  answer_md: "1. **Coi như đã lộ và rotate ngay**: đổi mật khẩu database, thu hồi và cấp API key mới ở\
    \ nhà cung cấp.\n   Xóa khỏi code hay viết lại lịch sử không làm key cũ an toàn lại.\n2. **Chuyển\
    \ secret ra khỏi repo**: lưu giá trị mới trong **secrets manager** (hoặc env var của nền tảng\n  \
    \ deploy); code chỉ đọc `os.environ[\"DB_PASSWORD\"]` hoặc gọi secrets manager lúc khởi động.\n3.\
    \ **Tiêm lúc chạy** (env injection) từ pipeline/orchestrator; file `.env` cục bộ thêm vào `.gitignore`,\n\
    \   không đưa vào Docker image hay log.\n4. **Access control (least access)**: chỉ service cần mới\
    \ được đọc secret của nó; tách secret theo\n   môi trường (dev/staging/prod); bật audit log truy cập.\n\
    5. **Phòng ngừa**: bật **secret scanning** / pre-commit hook, và đặt lịch **rotation** định kỳ.\n\
    6. (Tùy chọn) dọn lịch sử Git và kiểm tra log truy cập xem key cũ có bị dùng bất thường không.\n"
  rubric_md: 'Đạt khi: (a) rotate/thu hồi secret cũ là bước đầu và nêu lý do (đã nằm trong lịch sử Git);
    (b) chuyển secret sang secrets manager hoặc env var, code không còn giá trị thật; (c) nêu quyền truy
    cập tối thiểu; (d) nêu ít nhất một biện pháp phòng ngừa (secret scanning hoặc rotation định kỳ). Đủ
    (a)-(c): bằng chứng điểm 2. Chỉ xóa dòng khỏi code hoặc chỉ đổi sang env var mà không rotate: tối
    đa điểm 1.'
- id: E144
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: 'Bạn thiết kế phần bảo mật cho một dịch vụ nhận **webhook** từ đối tác và lưu **số điện thoại**
    cùng **mật khẩu** người dùng.

    Hãy: (a) chọn cách lưu mật khẩu và giải thích vì sao không mã hóa; (b) chọn cách bảo vệ dữ liệu

    số điện thoại khi truyền và khi lưu; (c) nêu cách xác minh webhook là đúng nguồn và không bị sửa;

    (d) giải thích **envelope encryption** với KMS và lợi ích khi rotate khóa.

    '
  answer_md: '**(a) Mật khẩu:** dùng **hash một chiều, chậm, có salt** (bcrypt/argon2). Server chỉ cần
    kiểm tra khớp

    chứ không cần đọc lại mật khẩu; mã hóa là đảo ngược được, nên lộ khóa là lộ hết mật khẩu.


    **(b) Số điện thoại:** **in transit** dùng **TLS (HTTPS)**; **at rest** mã hóa database/disk/backup

    (cần đọc lại được nên dùng encryption, không dùng hash). Khóa cất trong KMS/secrets manager, không
    trong code.


    **(c) Webhook:** hai bên chia sẻ secret; đối tác gửi **HMAC** của nội dung. Ta tính lại HMAC bằng
    secret

    và **so sánh hằng thời gian**; lệch là từ chối. Cách này bảo đảm **integrity + authenticity**

    (có thể thêm timestamp để chống replay). Nếu nhiều bên cần xác minh mà không chia sẻ bí mật thì dùng

    **chữ ký số** (private key ký, public key kiểm).


    **(d) Envelope encryption:** dữ liệu mã hóa bằng **data key**; data key được **wrap** bằng

    **master key** nằm trong **KMS** (không rời KMS, có phân quyền và log). Rotate master key chỉ cần

    bọc lại data key, không phải mã hóa lại toàn bộ dữ liệu.

    '
  rubric_md: 'Đạt mức 3 khi đủ cả bốn phần: (a) hash chậm có salt cho mật khẩu và lý do không dùng encryption;
    (b) TLS in transit cộng mã hóa at rest, khóa cất ở KMS/secrets manager; (c) HMAC với secret chung,
    tính lại và so sánh để bảo đảm integrity + authenticity; (d) envelope encryption: data key được bọc
    bởi master key trong KMS, lợi ích rotate. Đủ cả bốn trong time-box: bằng chứng điểm 3. Thiếu một phần
    hoặc nói mã hóa mật khẩu để giải ra khi cần: chưa đạt mức 3.'
