items:
- id: X570
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), đoạn code dưới in ra gì? Giải thích 1 câu về delegation.
  code: "class Engine:\n    def start(self):\n        return \"vroom\"\n\n\nclass Quiet:\n    def start(self):\n\
    \        return \"hum\"\n\n\nclass Car:\n    def __init__(self, engine):\n        self.engine = engine\n\
    \n    def go(self):\n        return self.engine.start() + \"!\"\n\n\ncar = Car(Engine())\nprint(car.go())\n\
    car.engine = Quiet()\nprint(car.go())"
  expected_output: 'vroom!

    hum!'
  answer_md: '`Car` không tự biết cách khởi động mà giao việc (delegate) cho `self.engine.start()`. Lần
    đầu engine là `Engine` nên ra `vroom!`; sau khi gán `car.engine = Quiet()` thì cùng lời gọi `go()`
    ra `hum!`.'
  rubric_md: 'Output khớp từng dòng VÀ nêu đúng Car delegate cho object engine nó chứa (has-a). Đúng:
    bằng chứng điểm 1; sai: tối đa điểm 0.'
- id: X571
  difficulty: 2
  type: write_code
  minutes: 8
  prompt_md: 'Viết `class Duck` bằng composition (không có class con nào). Constructor `Duck(fly, quack)`
    nhận hai chuỗi tên hành vi: `fly` là `"fly"` hoặc `"noway"`; `quack` là `"quack"`, `"mute"` hoặc `"squeak"`.
    `perform_fly()` trả `"I fly"` hoặc `"I can''t fly"`; `perform_quack()` trả `"Quack"`, `"..."` hoặc
    `"Squeak"` tương ứng; `set_fly(name)` đổi hành vi bay lúc chạy và không trả gì. Ví dụ `Duck("fly",
    "quack")`, `set_fly("noway")`, `perform_fly()` là `"I can''t fly"`.

    '
  problem_id: check-x571-duck
  rubric_md: 'Pass toàn bộ test ẩn không cần gợi ý trong time-box 8 phút: bằng chứng điểm 2; sai hoặc
    phải xem gợi ý: tối đa điểm 1.'
- id: X572
  difficulty: 3
  type: read_code
  minutes: 5
  prompt_md: Chạy tay (không chạy máy), đoạn code kim cương (diamond) dưới in ra gì? Ghi đúng từng dòng
    và giải thích vì sao thứ tự là vậy.
  code: "class A:\n    def hello(self):\n        return [\"A\"]\n\n\nclass B(A):\n    def hello(self):\n\
    \        return [\"B\"] + super().hello()\n\n\nclass C(A):\n    def hello(self):\n        return [\"\
    C\"] + super().hello()\n\n\nclass D(B, C):\n    def hello(self):\n        return [\"D\"] + super().hello()\n\
    \n\nprint(D().hello())\nprint([k.__name__ for k in D.__mro__])"
  expected_output: '[''D'', ''B'', ''C'', ''A'']

    [''D'', ''B'', ''C'', ''A'', ''object'']'
  answer_md: 'Python dùng MRO (C3 linearization): `D`, `B`, `C`, `A`, `object`. `super()` trong mỗi class
    đi tới class kế tiếp trong MRO của object thật (`D`), nên `B.hello` gọi sang `C` chứ không nhảy thẳng
    lên `A`; `A` chỉ chạy một lần. Vì vậy list là `[D, B, C, A]`.'
  rubric_md: 'Output khớp từng dòng VÀ giải thích MRO/super đi theo thứ tự của class thật. Đúng: bằng
    chứng điểm 3; sai: tối đa điểm 2.'
