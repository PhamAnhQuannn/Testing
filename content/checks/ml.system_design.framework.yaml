items:
- id: S337
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Kể tên **6 bước** của khung thiết kế hệ thống ML (ML system design framework) theo đúng
    thứ tự,

    mỗi bước một cụm ngắn. Và nói một câu: trong 45 phút phỏng vấn, vì sao nên dành nhiều thời gian

    nhất cho bước đầu tiên?

    '
  answer_md: 'Sáu bước theo thứ tự:

    1. **Làm rõ (clarify)** - biến mục tiêu kinh doanh thành bài toán ML, chốt metric và nhãn.

    2. **Dữ liệu và feature (data & features)** - nguồn, rò rỉ, độ tươi.

    3. **Model** - baseline đơn giản trước, rồi lặp lên model phức tạp.

    4. **Đánh giá (evaluation)** - offline (tập giữ lại, không rò rỉ) + online A/B test.

    5. **Serving** - batch hay online, ngân sách độ trễ, lấy feature ở đâu lúc inference.

    6. **Giám sát và train lại (monitoring & retraining)** - drift, vòng phản hồi.


    Nên dành nhiều thời gian nhất cho bước 1 vì **định nghĩa metric + nhãn là bước đòn bẩy cao nhất**:

    nếu sai thì mọi bước sau (model, serving) đều vô nghĩa.

    '
  rubric_md: 'Đúng khi nêu được 6 bước đúng thứ tự (làm rõ → dữ liệu & feature → model → đánh giá → serving
    →

    giám sát/train lại) VÀ nêu được lý do dồn thời gian cho bước làm rõ là vì metric/nhãn ràng buộc

    toàn bộ phần sau. Đủ ý: bằng chứng điểm 1. Thiếu quá 1-2 bước hoặc đảo lộn thứ tự chính (ví dụ đặt

    serving trước đánh giá), hoặc không nêu được lý do: tối đa điểm 0.

    '
- id: S338
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Bạn được giao thiết kế hệ thống **dự đoán khách rời bỏ (churn)** cho một app. Hãy làm **bước
    làm

    rõ (clarify)** cho tới chỗ chốt được: (1) phát biểu bài toán ML (dự đoán gì, cho ai, khi nào);

    (2) **metric** - nêu cả metric offline lẫn metric kinh doanh/online, và một guardrail; (3) **nhãn

    (label)** - định nghĩa nhãn, nói rõ nhãn đến trễ ra sao và một rủi ro nhiễu/lệch. Giải thích vì

    sao chốt nhãn + metric trước là quan trọng.

    '
  answer_md: "(1) **Bài toán ML**: với mỗi người dùng đang hoạt động, dự đoán **xác suất họ sẽ rời bỏ\
    \ trong\n30 ngày tới** (ví dụ \"không mở app lần nào trong 30 ngày\"); chấm điểm định kỳ (ví dụ mỗi\
    \ ngày)\nđể đội CRM can thiệp giữ chân.\n(2) **Metric**:\n- Offline: vì nhãn mất cân bằng (ít người\
    \ churn), dùng **precision/recall** hoặc PR-AUC tại\n  ngưỡng, không dùng accuracy.\n- Online/kinh\
    \ doanh: **tỉ lệ giữ chân (retention)** hoặc doanh thu giữ lại sau khi chạy chương\n  trình can thiệp,\
    \ đo bằng A/B test.\n- Guardrail: chi phí/khuyến mãi gửi đi không vượt ngân sách, không làm phiền\
    \ quá nhiều người\n  (số thông báo), tránh giảm trải nghiệm.\n(3) **Nhãn**: nhãn = \"có churn trong\
    \ cửa sổ 30 ngày sau thời điểm dự đoán hay không\".\n- **Đến trễ (delayed)**: phải chờ đủ 30 ngày\
    \ mới biết nhãn thật, nên dữ liệu train luôn trễ ít\n  nhất 30 ngày; ảnh hưởng tới nhịp train lại\
    \ và đánh giá.\n- **Nhiễu/lệch**: định nghĩa \"rời bỏ\" có thể chưa khớp ý kinh doanh (người dùng\
    \ ít dùng nhưng\n  chưa bỏ hẳn); nếu đã có chương trình giữ chân từ trước thì nhãn bị lệch bởi can\
    \ thiệp cũ\n  (feedback loop).\n\nChốt nhãn + metric trước vì chúng định nghĩa \"đúng\" nghĩa là gì\
    \ và ràng buộc mọi bước sau (feature\nkhông rò rỉ phải tính đến trước thời điểm dự đoán, cách tách\
    \ dữ liệu, cách đánh giá). Sai ở đây thì\nmodel hay serving tốt đến mấy cũng vô nghĩa.\n"
  rubric_md: 'Đạt khi nêu đúng cả 3: (1) phát biểu bài toán ML rõ (dự đoán xác suất churn trong một cửa
    sổ thời

    gian cho người dùng, có nhịp chấm điểm); (2) metric có CẢ hai tầng offline (precision/recall hoặc

    PR-AUC, nhận ra mất cân bằng) VÀ online/kinh doanh (retention/doanh thu qua A/B), cộng một guardrail

    hợp lý; (3) nhãn định nghĩa được + nêu nhãn đến trễ (chờ 30 ngày) + một rủi ro nhiễu/lệch. Đúng,

    trong time-box, tự giải thích vì sao chốt nhãn/metric trước: bằng chứng điểm 2. Thiếu tầng

    online/business của metric, hoặc không nêu được nhãn đến trễ: tối đa điểm 1.

    '
- id: S339
  difficulty: 3
  type: concept
  minutes: 12
  prompt_md: '**(Phỏng vấn AI engineer - 45 phút)** Người phỏng vấn nói: "Hãy thiết kế hệ thống **gợi
    ý sản

    phẩm (recommendation)** cho trang chủ một sàn thương mại điện tử." Hãy **dẫn dắt cả buổi theo

    khung**, đi từ yêu cầu đến giám sát: (1) làm rõ + chốt **metric** (offline + online) và **nhãn**;

    (2) dữ liệu & feature (nêu một nguồn rò rỉ cần tránh); (3) baseline rồi model; (4) đánh giá offline

    + online A/B; (5) serving kèm **một ước lượng QPS hoặc dung lượng dữ liệu**; (6) giám sát & train

    lại. Cuối cùng nêu **ít nhất hai trade-off** kèm con số/định tính.

    '
  answer_md: '**(1) Làm rõ + metric + nhãn.** Mục tiêu kinh doanh: tăng doanh thu/engagement ở trang chủ.
    Bài

    toán ML: với mỗi lượt vào trang chủ, **xếp hạng (rank) các sản phẩm** theo khả năng người dùng

    tương tác/mua. Metric offline: NDCG hoặc precision@k, CTR/CVR như xác suất đã hiệu chỉnh

    (calibrated). Metric online: doanh thu mỗi phiên, CTR, chuyển đổi - đo bằng A/B. Guardrail: độ trễ

    trang chủ, đa dạng (không chỉ hiện món phổ biến), không đẩy nội dung vi phạm. Nhãn: tương tác tự

    nhiên (click, add-to-cart, mua); lưu ý nhãn **đến trễ** (mua có thể xảy ra sau), **lệch** do

    position bias (vị trí cao dễ được click) và vì ta chỉ có nhãn cho món đã hiển thị (selection bias).

    **(2) Dữ liệu & feature.** Log phiên, lịch sử xem/mua, thuộc tính sản phẩm, embedding người dùng

    và món. Rò rỉ cần tránh: dùng hành vi xảy ra **sau** thời điểm gợi ý (ví dụ "đã mua món này") làm

    feature; phải dùng point-in-time và tách dữ liệu theo thời gian. Giữ feature tươi, tránh lệch

    train-serving bằng feature store.

    **(3) Baseline rồi model.** Baseline: gợi ý theo độ phổ biến hoặc "mua kèm" đơn giản. Rồi lên

    phễu nhiều tầng: **tạo ứng viên (candidate generation)** bằng two-tower/ANN, rồi **ranker** nặng

    hơn (GBDT hoặc mạng) chấm lại, có thể re-rank để đa dạng.

    **(4) Đánh giá.** Offline: tách theo thời gian, đo NDCG/precision@k, chú ý hiệu chỉnh và position

    bias (có thể dùng IPS). Online: shadow/canary rồi **A/B test** so doanh thu và CTR trên traffic

    thật; offline tốt chỉ là điều kiện cần.

    **(5) Serving + ước lượng.** Online, ngân sách độ trễ chặt (ví dụ p99 < 100 ms cho cả phễu); tầng

    ứng viên rẻ chạy trước, ranker nặng chấm ~vài trăm món. Ước lượng: 10 triệu người hoạt động/ngày,

    mỗi người ~5 lượt vào trang chủ = ~50 triệu lượt/ngày; chia ~86.400 giây ra **~580 QPS trung bình**,

    đỉnh gấp ~3-5 lần nên thiết kế cho ~2-3 nghìn QPS.

    **(6) Giám sát & train lại.** Theo dõi drift (gu người dùng/hàng hóa đổi theo mùa), CTR/doanh thu,

    feedback loop (chỉ hiện món model chọn). Train lại định kỳ (ví dụ hằng ngày/tuần) hoặc kích theo

    drift.

    **Trade-off**: (a) **độ trễ vs độ chính xác** - ranker lớn chính xác hơn nhưng vượt ngân sách p99,

    nên dùng phễu (rẻ lọc trước, nặng chấm sau); (b) **dữ liệu tươi vs ổn định** - train lại thường

    xuyên bắt kịp xu hướng/mùa vụ nhưng dễ dao động và khó gỡ lỗi, train thưa thì ổn định nhưng chậm

    thích nghi; (c) batch tính trước gợi ý thì rẻ/đơn giản nhưng không cá nhân hóa theo ngữ cảnh ngay

    bằng online.

    '
  rubric_md: 'Đạt (mức phỏng vấn, điểm 3) khi dẫn dắt được **cả khung** mạch lạc: (1) làm rõ + chốt metric
    hai

    tầng (offline như NDCG/precision@k VÀ online như doanh thu/CTR qua A/B) + nhãn (tương tác tự nhiên,

    nhận ra position/selection bias hoặc nhãn trễ); (2) nêu feature và **một nguồn rò rỉ** cụ thể cùng

    cách phòng (point-in-time / tách theo thời gian); (3) baseline trước rồi model (ý tưởng phễu/ranker

    hợp lý); (4) đánh giá offline + **A/B** online; (5) serving online với ngân sách độ trễ VÀ **một

    ước lượng QPS hoặc dung lượng đúng bậc độ lớn**; (6) giám sát drift + train lại; VÀ nêu **>= 2

    trade-off** có kèm con số/định tính. Trôi chảy, trong time-box, tự giải thích: bằng chứng điểm 3.

    Thiếu một trong các trụ cột lớn (không có metric online/A/B, không có ước lượng số, hoặc không nêu

    được rò rỉ, hoặc không nêu đủ 2 trade-off): chưa đạt mức 3.

    '
