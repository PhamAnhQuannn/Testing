subtopic_id: sd.distributed.time_ordering
items:
- id: S142
  difficulty: 1
  type: concept
  minutes: 3
  prompt_md: 'Nói ngắn gọn: vì sao **không** nên dùng giờ đồng hồ thật (wall-clock time) của các máy để
    quyết

    việc nào xảy ra trước, và nêu một hậu quả cụ thể khi dùng "ghi sau thắng theo timestamp"

    (last-write-wins).

    '
  answer_md: 'Đồng hồ các máy **không khớp nhau**: có **lệch đồng hồ (clock skew)**, NTP **nhảy giờ**
    (tới hoặc

    lùi) và đồng hồ có thể **chạy ngược**, nên timestamp không phản ánh đúng thứ tự thật. Hậu quả:

    một bản ghi **mới** mang timestamp nhỏ (vì máy đó giờ chậm) sẽ bị một bản **cũ** có timestamp lớn

    **đè lên** — mất cập nhật mới một cách **âm thầm**, không báo lỗi.

    '
  rubric_md: 'Đạt khi nêu đúng: đồng hồ lệch/nhảy/chạy ngược nên giờ máy không đáng tin, VÀ một hậu quả
    last-write-wins (bản mới bị bản cũ đè, mất dữ liệu). Đúng cả hai ý: bằng chứng điểm 1; chỉ nói chung
    chung ''đồng hồ lệch'' mà không nêu hậu quả: tối đa điểm 0.'
- id: S143
  difficulty: 2
  type: concept
  minutes: 8
  prompt_md: 'Một nhóm chat có nhiều thiết bị gửi tin, đồng hồ các thiết bị lệch nhau vài giây. Hãy đề
    xuất

    cách **sắp thứ tự tin nhất quán cho mọi người** mà **không dựa vào giờ thiết bị**: (1) công cụ

    đơn giản nhất là gì và cần điều kiện gì để dùng được; (2) nếu muốn một thứ tự nhất quán với nhân

    quả (causality) thì dùng đồng hồ logic nào, và quy tắc cập nhật khi nhận tin là gì?

    '
  answer_md: '(1) Công cụ đơn giản nhất: cho **một nguồn duy nhất** (ví dụ server của nhóm chat, hoặc
    một phân

    vùng Kafka) gán **số thứ tự tăng dần đơn điệu (monotonic sequence number / offset)** cho mỗi tin,

    rồi mọi thiết bị **sắp theo số đó**. Điều kiện: mọi tin phải đi qua được **một chỗ** cấp số (chỗ

    đó là điểm nghẽn/điểm chết cần lo).

    (2) Nếu cần thứ tự nhất quán với nhân quả thì dùng **Lamport clock**: mỗi máy giữ một bộ đếm,

    tăng 1 ở mỗi sự kiện/khi gửi và gửi kèm số; khi **nhận** tin mang số `received` thì đặt

    **local = max(local, received) + 1**. Nhờ vậy tin trả lời luôn có số lớn hơn tin nó đáp lại.

    '
  rubric_md: 'Đạt (điểm 2) khi nêu đúng cả 3 ý: (1) số thứ tự từ một nguồn duy nhất + điều kiện mọi việc
    qua một chỗ; (2) chọn Lamport clock; (3) quy tắc nhận local = max(local, received) + 1 ĐÚNG. Đúng,
    trong time-box, tự giải thích được: bằng chứng điểm 2. Sai quy tắc Lamport (quên max hoặc quên +1)
    hoặc thiếu điều kiện nguồn duy nhất: tối đa điểm 1.'
- id: S144
  difficulty: 3
  type: concept
  minutes: 10
  prompt_md: 'Trả lời ở mức phỏng vấn: (1) giải thích **vì sao không dựa vào đồng hồ vật lý (physical
    clock)**

    để sắp thứ tự sự kiện giữa các máy; (2) với mỗi nhu cầu sau, **chọn** công cụ phù hợp và nói vì

    sao: (a) cần một thứ tự toàn cục đơn giản khi mọi sự kiện đi qua một chỗ, (b) cần thứ tự nhất

    quán với nhân quả, (c) cần **phát hiện** hai sự kiện có song song/xung đột hay không; (3) nêu

    đúng một điểm **Lamport clock không làm được** mà vector clock làm được.

    '
  answer_md: '(1) Không dựa vào đồng hồ vật lý vì các máy có **clock skew**, NTP **nhảy giờ** và đồng
    hồ có thể

    **chạy ngược**; timestamp vì thế không phản ánh đúng thứ tự, và last-write-wins theo timestamp có

    thể để bản cũ đè bản mới (mất dữ liệu âm thầm).

    (2a) **Số thứ tự / offset** từ một nguồn duy nhất (sequence của DB, offset Kafka): đơn giản, đủ

    cho thứ tự toàn cục khi mọi việc qua được một chỗ.

    (2b) **Lamport clock**: bộ đếm mỗi máy, khi nhận đặt local = max(local, received) + 1, cho thứ tự

    toàn phần **nhất quán với nhân quả**.

    (2c) **Vector clock** (một bộ đếm cho mỗi máy): so sánh hai vector để biết một cái có trội ở mọi

    vị trí (so sánh được) hay mỗi bên trội một vị trí (đồng thời/xung đột).

    (3) Lamport clock **không phát hiện được tính song song**: số a nhỏ hơn số b **không chứng minh**

    a gây ra b; chỉ vector clock mới phân biệt được hai sự kiện là nối tiếp (comparable) hay song

    song (concurrent). (Có thể nói thêm: dùng giờ thật an toàn cần biết sai số và chờ qua nó, như

    TrueTime/Spanner.)

    '
  rubric_md: 'Đạt mức 3 khi: (1) giải thích đúng vì sao không dùng đồng hồ vật lý (skew/nhảy/chạy ngược
    + hậu quả LWW); (2) chọn đúng cả ba công cụ cho ba nhu cầu (sequence number, Lamport clock, vector
    clock) kèm lý do; (3) nêu đúng điều Lamport không làm được (không phát hiện song song / số nhỏ hơn
    không chứng minh nhân quả) mà vector clock làm được. Trình bày rõ ràng, trong time-box: bằng chứng
    điểm 3. Chọn sai một công cụ, hoặc không nêu được giới hạn của Lamport: chưa đạt mức 3.'
