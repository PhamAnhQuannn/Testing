- id: Q141
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: Chạy tay (không chạy máy), dòng code in ra gì? Giải thích 1 câu.
  code: 'import io

    f = io.StringIO("a 1\nb 2\n")

    rows = [ln.split() for ln in f.read().splitlines()]

    print(rows, sum(int(v) for _, v in rows))'
  expected_output: '[[''a'', ''1''], [''b'', ''2'']] 3'
  answer_md: StringIO giả lập file; đọc nội dung rồi tách từng dòng.
  rubric_md: 'Output khớp từng ký tự (bỏ khoảng trắng cuối dòng) VÀ giải thích đúng 1 câu. Đúng: bằng
    chứng điểm 1; sai: tối đa điểm 0.'
- id: Q142
  difficulty: 2
  type: concept
  minutes: 3
  prompt_md: Vì sao nên mở file bằng `with open(...) as f`? Cách đọc từng dòng cho file rất lớn?
  answer_md: 'with tự đóng file kể cả khi có lỗi. Với file lớn: `for line in f:` (đọc từng dòng, không
    nạp cả file vào bộ nhớ).'
  rubric_md: 'Đúng các ý chính trong đáp án (thiếu ý quan trọng = sai). Đúng: bằng chứng điểm 2; sai:
    tối đa điểm 1.'
- id: X369
  difficulty: 1
  type: read_code
  minutes: 3
  prompt_md: 'Chạy tay (không chạy máy): đoạn code dưới in ra gì? Ghi đúng từng dòng.'
  code: 'import json


    d = json.loads(''{"a": [1, 2], "b": null}'')

    d["a"].append(3)

    print(len(d["a"]), d["b"])

    print(json.dumps(d))

    '
  expected_output: '3 None

    {"a": [1, 2, 3], "b": null}

    '
  rubric_md: 'Đúng cả hai dòng, nhất là `None` rồi `null` sau `dumps`: điểm 1; sai cú pháp JSON của `dumps`:
    tối đa 0.'
- id: X370
