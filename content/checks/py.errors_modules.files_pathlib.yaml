  prompt_md: 'Viết `parse_csv(text)`: nhận chuỗi CSV (dòng đầu là tiêu đề) và trả list các dict, mỗi dict
    một dòng dữ liệu, giá trị giữ là chuỗi; bỏ dòng trống. Dùng `csv.reader` với `io.StringIO`.

    '
  problem_id: check-x370-parse-csv
  rubric_md: 'Đúng test ẩn gồm chuỗi rỗng, chỉ có tiêu đề, dòng trống và ô có dấu phẩy trong ngoặc kép:
    điểm 2; dùng `split(",")` làm sai ô ngoặc kép: tối đa 1.'
- id: X371
