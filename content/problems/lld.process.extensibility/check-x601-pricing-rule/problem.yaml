id: check-x601-pricing-rule
subtopic_id: lld.process.extensibility
secondary_subtopics: []
kind: check
title: 'Check X601: pricing rule'
title_vi: 'Kiểm tra X601: pricing rule'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `fee(hours, rule)` with an extension point. Rates live in a dict
  `RULES = {"weekday": 10, "weekend": 15, "holiday": 20}` (price per hour). Return `hours * rate` as an int,
  where `rate = RULES[rule]`. If `rule` is not a key of `RULES`, fall back to the `"weekday"` rate (10).
  `hours` is a non-negative int. Adding a new rule later must be a new dict entry, not a new `if/elif` branch.
statement_vi_md: |
  Cài `fee(hours, rule)` có điểm mở rộng. Giá nằm trong dict `RULES = {"weekday": 10, "weekend": 15,
  "holiday": 20}` (giá mỗi giờ). Trả về `hours * rate` kiểu int với `rate = RULES[rule]`. Nếu `rule` không
  có trong `RULES` thì dùng giá của `"weekday"` (10). `hours` là số nguyên không âm. Thêm luật mới sau này
  chỉ là thêm một mục vào dict, không thêm nhánh `if/elif`.
constraints:
- 0 <= hours <= 1000000
- rule is a string
examples:
- input: hours = 2, rule = "weekend"
  output: '30'
  explain_vi: weekend là 15 mỗi giờ, 2 giờ ra 30.
io:
  mode: function
  entry: fee
  params:
  - name: hours
    type: int
  - name: rule
    type: str
  returns: int
  compare: exact
starter:
  python: |
    RULES = {"weekday": 10, "weekend": 15, "holiday": 20}


    def fee(hours, rule):
        # TODO: tra giá trong RULES, luật lạ dùng giá weekday
        pass
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 8
hints:
- Giá mỗi giờ nằm trong dict RULES; không cần if/elif theo tên luật.
- "Dùng RULES.get(rule, RULES['weekday']) để luật lạ rơi về giá weekday."
- "Trả hours * rate; hours = 0 cho 0."
solution:
  file: solution.py
  approach_vi: Tra giá theo rule trong dict (mặc định giá weekday) rồi nhân với số giờ.
  complexity: O(1) / O(1)
tests:
  sample: tests/sample.jsonl
  hidden: tests/hidden.jsonl
  generator: tests/gen.py
tags:
- check
- x601
status: validated
version: 1
