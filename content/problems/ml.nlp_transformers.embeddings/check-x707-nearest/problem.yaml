id: check-x707-nearest
subtopic_id: ml.nlp_transformers.embeddings
secondary_subtopics: []
kind: check
title: 'Check X707: nearest embedding'
title_vi: 'Kiểm tra X707: embedding gần nhất'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `most_similar(query, items)` that returns the index of the item with the highest cosine
  similarity to `query`. `cosine(u, v) = dot(u, v) / (|u| * |v|)`; if either norm is 0, the cosine is `0.0`.
  On a tie return the smaller index. If `items` is empty return `-1`.
  For `query = [1.0, 0.0]` and `items = [[0.0, 1.0], [1.0, 0.0], [1.0, 1.0]]` the result is `1`.
statement_vi_md: |
  Cài `most_similar(query, items)` trả **index** của item có cosine similarity cao nhất với `query`.
  `cosine(u, v) = dot(u, v) / (|u| * |v|)`; nếu một vector có độ dài 0 thì cosine là `0.0`.
  Hoà thì lấy index nhỏ hơn; `items` rỗng thì trả `-1`.
  Với `query = [1.0, 0.0]` và `items = [[0.0, 1.0], [1.0, 0.0], [1.0, 1.0]]` kết quả là `1`.
constraints:
- 0 <= len(items) <= 1000
- Mọi vector có cùng độ dài, 1 <= len(query) <= 1000
- Phần tử là số thực hữu hạn
examples:
- input: query = [1.0, 0.0], items = [[0.0, 1.0], [1.0, 0.0], [1.0, 1.0]]
  output: '1'
  explain_vi: 'Cosine lần lượt là 0.0, 1.0, 0.707; lớn nhất là 1.0 ở index 1.'
io:
  mode: function
  entry: most_similar
  params:
  - name: query
    type: list
  - name: items
    type: list
  returns: int
  compare: exact
starter:
  python: |
    def most_similar(query, items):
        # TODO: tính cosine của query với từng item (vector 0 thì cosine 0.0); trả index lớn nhất, hoà: index nhỏ hơn, rỗng: -1
        pass
limits:
