time_target_min: 6
hints:
- Viết hàm phụ tính cosine; nếu độ dài của một vector bằng 0 thì trả 0.0 để tránh chia cho 0.
- Duyệt enumerate(items), giữ best index và best score; items rỗng thì best vẫn là -1.
- "Chỉ cập nhật khi cosine lớn hơn hẳn (dùng >) để hoà thì giữ index nhỏ hơn."
solution:
