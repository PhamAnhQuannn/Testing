id: check-x784-above-average
subtopic_id: cs.sql.subqueries_sets
secondary_subtopics: []
kind: check
title: 'Check X784: above average'
title_vi: 'Kiểm tra X784: lọc theo trung bình bằng scalar subquery'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `above_average(rows)`. `rows` is a list of `[name, score]` records (name is a string, score an int).
  Using the standard-library `sqlite3` module with an in-memory database (`sqlite3.connect(":memory:")`), create a
  table `t(name TEXT, score INTEGER)`, insert every row with a **parameterized** query
  (`cur.executemany("INSERT INTO t(name, score) VALUES (?, ?)", rows)`), then run
  `SELECT name, score FROM t WHERE score > (SELECT AVG(score) FROM t) ORDER BY score DESC, name ASC`.
  Return the result as a list of `[name, score]` pairs, each a 2-element **list** (not a tuple). The scalar
  subquery computes the average once; only rows strictly above it are kept. For
  `rows = [["an", 3], ["binh", 9], ["chi", 6]]` the average is 6, so the result is `[["binh", 9]]`; for `[]` the
  result is `[]` (the average of no rows is NULL and `score > NULL` is never true).
statement_vi_md: |
  Cài `above_average(rows)`. `rows` là list các bản ghi `[name, score]` (name là chuỗi, score là số nguyên). Dùng
  module `sqlite3` của thư viện chuẩn với database trong bộ nhớ (`sqlite3.connect(":memory:")`): tạo bảng
  `t(name TEXT, score INTEGER)`, chèn mọi dòng bằng câu SQL tham số hoá
  (`cur.executemany("INSERT INTO t(name, score) VALUES (?, ?)", rows)`), rồi chạy
  `SELECT name, score FROM t WHERE score > (SELECT AVG(score) FROM t) ORDER BY score DESC, name ASC`.
  Trả về list các cặp `[name, score]`, mỗi cặp là **list** 2 phần tử (không phải tuple). Scalar subquery tính trung
  bình một lần; chỉ giữ dòng lớn hơn hẳn trung bình. Với `rows = [["an", 3], ["binh", 9], ["chi", 6]]` trung bình là
  6 nên kết quả là `[["binh", 9]]`; với `[]` kết quả là `[]` (AVG của tập rỗng là NULL, `score > NULL` không bao giờ
  đúng).
constraints:
- 'Dùng sqlite3 trong bộ nhớ và truy vấn có scalar subquery như đề; chèn bằng câu SQL tham số hoá (dấu ?)'
- 'rows có thể rỗng (kết quả []); score có thể âm hoặc bằng 0; tên có thể chứa dấu nháy'
- 'Mỗi phần tử kết quả phải là list [name, score], không phải tuple'
examples:
- input: 'rows = [["an", 3], ["binh", 9], ["chi", 6]]'
  output: '[["binh", 9]]'
  explain_vi: 'Trung bình = (3 + 9 + 6) / 3 = 6; chỉ binh (9) lớn hơn hẳn 6, chi (6) bằng nên bị loại.'
