id: check-x889-decode-twos
subtopic_id: cs.computer_basics.data_representation
secondary_subtopics: []
kind: check
title: 'Check X889: decode two''s complement'
title_vi: 'Kiểm tra X889: giải mã số bù hai'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `decode_twos(bits)`. `bits` is a list of 0/1 values, most-significant bit first, read as a
  two's-complement signed integer: the first bit has NEGATIVE weight `-2^(n-1)` and every other bit `i`
  (0-indexed) has positive weight `2^(n-1-i)`. Return the value as an int. An empty list gives `0`.
  For `[1, 0, 0, 0]` the result is `-8`, and for `[0, 1, 0, 1]` it is `5`.
statement_vi_md: |
  Cài `decode_twos(bits)`. `bits` là list các bit 0/1, bit cao nhất (MSB) đứng đầu, được đọc như một số
  nguyên có dấu dạng bù hai (two's complement): bit đầu có trọng số ÂM `-2^(n-1)`, mỗi bit còn lại ở vị trí
  `i` (tính từ 0) có trọng số dương `2^(n-1-i)`. Trả về giá trị là số nguyên. List rỗng trả `0`.
  Với `[1, 0, 0, 0]` kết quả là `-8`, còn `[0, 1, 0, 1]` cho `5`.
constraints:
- 'bits chỉ gồm 0 và 1, MSB đứng đầu'
- 'Độ dài bits từ 0 đến 64'
- 'Chỉ dùng thư viện chuẩn của Python'
examples:
- input: 'bits = [1, 0, 0, 0]'
  output: '-8'
  explain_vi: 'Bit đầu có trọng số -8, các bit sau đều 0 nên tổng là -8.'
- input: 'bits = [0, 1, 0, 1]'
  output: '5'
  explain_vi: 'Bit đầu 0 (không đóng góp), 4 + 1 = 5.'
io:
  mode: function
  entry: decode_twos
  params:
  - name: bits
    type: list
  returns: int
  compare: exact
