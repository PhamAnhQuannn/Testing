hints:
- "Với n bit, bit ở vị trí i (từ 0, tính từ MSB) có trọng số 2^(n-1-i); dùng 1 << (n - 1 - i)."
- "Riêng bit đầu tiên (i == 0) trừ đi b * weight thay vì cộng; list rỗng trả 0 trước."
- "Duyệt enumerate(bits): i == 0 thì value -= b * weight, ngược lại value += b * weight."
solution:
