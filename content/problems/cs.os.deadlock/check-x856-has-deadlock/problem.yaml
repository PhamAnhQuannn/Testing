id: check-x856-has-deadlock
subtopic_id: cs.os.deadlock
secondary_subtopics: []
kind: check
title: 'Check X856: detect a deadlock in a wait-for graph'
title_vi: 'Kiểm tra X856: phát hiện deadlock trong wait-for graph'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `has_deadlock(wait_for)`, deadlock detection on a wait-for graph. `wait_for` is a list of
  `[a, b]` (ints) meaning process `a` is waiting for process `b`. Return `True` iff the directed graph
  contains a cycle (a deadlock), otherwise `False`. An empty list returns `False`; a self-loop `[a, a]`
  is a cycle.
  For `[[1, 2], [2, 3], [3, 1]]` the result is `True`; for `[[1, 2], [2, 3]]` it is `False`.
statement_vi_md: |
  Cài `has_deadlock(wait_for)`, phát hiện deadlock trên wait-for graph. `wait_for` là list các `[a, b]`
  (số nguyên) nghĩa là process `a` đang chờ process `b`. Trả `True` khi và chỉ khi đồ thị có hướng chứa
  một chu trình (deadlock), ngược lại `False`. Danh sách rỗng trả `False`; cạnh tự trỏ `[a, a]` là chu
  trình. Với `[[1, 2], [2, 3], [3, 1]]` kết quả là `True`; với `[[1, 2], [2, 3]]` là `False`.
constraints:
- 'Mỗi phần tử của wait_for là list [a, b] gồm hai số nguyên'
- 'Đồ thị có thể gồm nhiều thành phần rời nhau; chỉ cần một thành phần có chu trình là trả True'
- 'Chỉ dùng thư viện chuẩn của Python'
examples:
- input: 'wait_for = [[1, 2], [2, 3], [3, 1]]'
  output: 'true'
  explain_vi: 'Vòng 1 -> 2 -> 3 -> 1: ba process chờ nhau, đây là deadlock.'
- input: 'wait_for = [[1, 2], [2, 3]]'
  output: 'false'
  explain_vi: 'Chuỗi chờ 1 -> 2 -> 3 không có vòng: 3 chạy xong rồi 2 rồi 1.'
