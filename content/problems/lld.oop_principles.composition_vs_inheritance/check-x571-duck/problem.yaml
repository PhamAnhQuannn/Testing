id: check-x571-duck
subtopic_id: lld.oop_principles.composition_vs_inheritance
secondary_subtopics: []
kind: check
title: 'Check X571: Composition Duck'
title_vi: 'Kiểm tra X571: Vịt dùng composition'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Model a duck by composition instead of subclasses. A `Duck` HAS a fly behaviour and a quack
  behaviour (picked by name) and delegates to them; there is no `RubberDuck` or `WoodDuck` class.

  Implement `class Duck` with constructor `Duck(fly, quack)` where `fly` and `quack` are strings:

  - `fly` is `"fly"` or `"noway"`; `quack` is `"quack"`, `"mute"` or `"squeak"`.
  - `perform_fly()`: returns `"I fly"` for `"fly"` and `"I can't fly"` for `"noway"`.
  - `perform_quack()`: returns `"Quack"` for `"quack"`, `"..."` for `"mute"` and `"Squeak"` for `"squeak"`.
  - `set_fly(name)`: swaps the fly behaviour at runtime (`name` is `"fly"` or `"noway"`); returns nothing.
statement_vi_md: |
  Mô hình con vịt bằng composition thay vì class con. `Duck` CÓ một hành vi bay và một hành vi kêu
  (chọn theo tên) và ủy quyền (delegate) cho chúng; không có class `RubberDuck` hay `WoodDuck`.

  Viết `class Duck` với constructor `Duck(fly, quack)`, hai tham số là chuỗi:

  - `fly` là `"fly"` hoặc `"noway"`; `quack` là `"quack"`, `"mute"` hoặc `"squeak"`.
  - `perform_fly()`: trả `"I fly"` cho `"fly"` và `"I can't fly"` cho `"noway"`.
  - `perform_quack()`: trả `"Quack"` cho `"quack"`, `"..."` cho `"mute"`, `"Squeak"` cho `"squeak"`.
  - `set_fly(name)`: đổi hành vi bay lúc chạy (`name` là `"fly"` hoặc `"noway"`); không trả gì.
constraints:
- 'Tên hành vi luôn thuộc các giá trị liệt kê ở trên.'
- 'Không dùng thread, time hay random.'
examples:
- input: ops = ['Duck', 'perform_fly', 'set_fly', 'perform_fly', 'perform_quack'], args = [['fly', 'quack'], [], ['noway'], [], []]
  output: '[null, "I fly", null, "I can''t fly", "Quack"]'
  explain_vi: 'Ban đầu bay được; sau set_fly("noway") thì không bay; tiếng kêu vẫn là Quack.'
io:
  mode: class_ops
  compare: exact
starter:
  python: "class Duck:\n    # TODO\n    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 8
hints:
- 'Giữ hai object hành vi nhỏ (hoặc hai dict tra cứu) trong `self`, đừng tạo class con.'
- '`perform_fly` và `perform_quack` chỉ ủy quyền cho object hành vi tương ứng và trả chuỗi của nó.'
- '`set_fly` thay object hành vi bay bằng object mới; constructor và `set_fly` dùng chung một bảng tên sang chuỗi.'
solution:
  file: solution.py
  approach_vi: Duck giữ hai behaviour object và delegate; set_fly thay behaviour lúc chạy. Mọi thao tác O(1).
  complexity: O(1) mỗi thao tác
