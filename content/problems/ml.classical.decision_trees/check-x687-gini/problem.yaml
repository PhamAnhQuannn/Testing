statement_en_md: |
  Implement `gini(labels)` that returns the Gini impurity `1 - sum(p_i^2)` of a list of integer labels,
  where `p_i` is the fraction of each class, rounded to 6 decimals. An empty list returns `0.0`.
  For `[0, 0, 1, 1]` the result is `0.5`; for `[1, 1, 1]` it is `0.0`.
statement_vi_md: |
  Cài `gini(labels)` trả về Gini impurity `1 - sum(p_i^2)` của list nhãn nguyên, với `p_i` là tỉ lệ của từng lớp,
  làm tròn 6 chữ số. List rỗng trả `0.0`. Với `[0, 0, 1, 1]` kết quả là `0.5`; với `[1, 1, 1]` là `0.0`.
constraints:
- 0 <= len(labels) <= 1000
- labels are ints
examples:
- input: labels = [0, 0, 1, 1]
  output: '0.5'
  explain_vi: p = 0.5 và 0.5 nên 1 - (0.25 + 0.25) = 0.5.
