id: check-x648-binomial
subtopic_id: ml.math.distributions
secondary_subtopics: []
kind: check
title: 'Check X648: binomial pmf'
title_vi: 'Kiểm tra X648: xác suất binomial'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `binomial_pmf(n, k, p)`: the probability of exactly `k` successes in `n` independent trials, each with
  success probability `p`, i.e. `C(n,k) * p^k * (1-p)^(n-k)`. `n` is a non-negative integer, `k` an integer, `p` a
  float in `[0, 1]`. If `k < 0` or `k > n`, return `0.0`. Use `math.comb`. Return a float `round(result, 6)`.
statement_vi_md: |
  Cài `binomial_pmf(n, k, p)`: xác suất đúng `k` thành công trong `n` lần thử độc lập, mỗi lần xác suất thành công
  `p`, tức `C(n,k) * p^k * (1-p)^(n-k)`. `n` là số nguyên không âm, `k` số nguyên, `p` float trong `[0, 1]`. Nếu
  `k < 0` hoặc `k > n` trả `0.0`. Dùng `math.comb`. Trả float `round(kết quả, 6)`.
constraints:
- 0 <= n <= 100
- 0 <= p <= 1
examples:
- input: n = 3, k = 2, p = 0.5
  output: '0.375'
  explain_vi: C(3,2) = 3 và 0,5² · 0,5¹ = 0,125 nên 3 · 0,125 = 0,375.
io:
  mode: function
  entry: binomial_pmf
  params:
  - name: n
    type: int
  - name: k
    type: int
  - name: p
    type: float
  returns: float
  compare: float_tol
