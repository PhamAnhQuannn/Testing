hints:
- "Giữ hai dict: `committed` và `working`, cùng cờ `in_tx` cho biết có transaction mở không."
- "`begin` (khi chưa mở): `working = dict(committed)`; `set` ghi vào `working` nếu `in_tx`, ngược lại vào `committed`."
- "`commit` thì `committed = working`, `rollback` thì bỏ `working` (cả hai chỉ khi `in_tx`); cuối cùng trả `[[k, v] for k, v in sorted(committed.items())]`."
