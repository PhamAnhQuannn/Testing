id: check-x733-event-loop
subtopic_id: py.concurrency.asyncio_basics
secondary_subtopics: []
kind: check
title: 'Check X733: event loop order'
title_vi: 'Kiểm tra X733: thứ tự chạy của event loop'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `event_loop_order(tasks)`. `tasks` is a list of `[tid, nsteps]` pairs: `tid` is an int task id and
  `nsteps >= 1` is the number of steps (await points) that coroutine runs before completing. Simulate a
  single-threaded cooperative event loop with a FIFO ready queue: initially the tasks are enqueued in the given
  order. Repeatedly pop the task at the FRONT, run ONE step (append its `tid` to the trace), and decrement its
  remaining steps; if it still has steps left push it to the BACK of the queue, otherwise it is done.
  Return the trace: the list of tids in the exact order the steps executed.
  For `tasks = [[0, 2], [1, 3]]` the result is `[0, 1, 0, 1, 1]`.
statement_vi_md: |
  Cài `event_loop_order(tasks)`. `tasks` là list các cặp `[tid, nsteps]`: `tid` là id số nguyên của task,
  `nsteps >= 1` là số bước (điểm await) mà coroutine chạy trước khi xong. Mô phỏng event loop hợp tác một luồng
  với hàng đợi FIFO: ban đầu các task xếp theo thứ tự cho trước. Lặp lại: lấy task ở ĐẦU hàng, chạy MỘT bước
  (ghi `tid` vào trace), giảm số bước còn lại; còn bước thì đẩy xuống CUỐI hàng, hết thì xong. Trả về trace: list
  tid theo đúng thứ tự các bước đã chạy. Với `tasks = [[0, 2], [1, 3]]` kết quả là `[0, 1, 0, 1, 1]`.
constraints:
- 'tasks có thể rỗng (kết quả [])'
- 'Mỗi nsteps >= 1; tid là số nguyên'
- 'Mỗi task chạy đúng một bước mỗi lượt rồi xếp lại cuối hàng'
examples:
- input: 'tasks = [[0, 2], [1, 3]]'
  output: '[0, 1, 0, 1, 1]'
  explain_vi: 'Hàng đợi 0,1: 0 chạy (còn 1), 1 chạy (còn 2), 0 chạy xong, 1 chạy (còn 1), 1 chạy xong.'
io:
  mode: function
  entry: event_loop_order
  params:
  - name: tasks
    type: list
  returns: list
  compare: exact
starter:
  python: |
    def event_loop_order(tasks):
        # TODO: hàng đợi FIFO, mỗi lần chạy một bước rồi xếp lại cuối nếu còn bước
        pass
time_target_min: 6
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
hints:
- Mỗi task chạy một bước rồi nhường chỗ cho task kế; hãy nghĩ tới một hàng đợi xoay vòng.
- "Đưa mọi task vào `collections.deque`; vòng `while q:` dùng `popleft()`, ghi tid vào trace, giảm số bước."
- "Nếu còn bước (`left > 1`) thì `append((tid, left - 1))` xuống cuối hàng; cuối cùng trả trace."
solution:
  file: solution.py
  approach_vi: Mô phỏng hàng đợi FIFO bằng deque, mỗi lượt chạy một bước và xếp lại cuối nếu chưa xong.
  complexity: O(S) / O(N) với S là tổng số bước
