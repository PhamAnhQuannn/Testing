id: number-of-good-pairs
subtopic_id: py.core.variables_types
secondary_subtopics: []
kind: practice
title: "Number of Good Pairs"
title_vi: "Số cặp tốt"
difficulty: easy
source: {type: leetcode, lc: 1512, rewrite_required: true}
statement_en_md: |
  Given an array of integers `nums`, return the number of good pairs.
  A pair `(i, j)` is called good if `nums[i] == nums[j]` and `i < j`.

  Note: this problem uses loops and a dict, which are taught later (`py.core.loops`,
  `py.datastructs.dict`). If you have not reached them yet, come back to this later; if you want
  to try now, see the hints.
statement_vi_md: |
  Cho mảng số nguyên `nums`. Trả về số **cặp tốt**. Một cặp chỉ số `(i, j)` là tốt nếu
  `nums[i] == nums[j]` và `i < j`.

  Lưu ý: bài này cần vòng lặp và dict (học ở `py.core.loops` và `py.datastructs.dict`), chưa dạy
  trong bài biến và kiểu dữ liệu. Nếu chưa học tới đó, bạn có thể quay lại làm sau; nếu muốn thử
  ngay thì xem gợi ý.
constraints:
  - "1 <= len(nums) <= 100"
  - "1 <= nums[i] <= 100"
examples:
  - {input: 'nums = [1, 2, 3, 1, 1, 3]', output: "4", explain_vi: "Các cặp tốt: (0,3), (0,4), (3,4), (2,5)."}
  - {input: 'nums = [1, 1, 1, 1]', output: "6", explain_vi: "Mọi cặp (i, j) với i < j đều tốt: C(4,2) = 6."}
  - {input: 'nums = [1, 2, 3]', output: "0", explain_vi: "Không có hai giá trị nào bằng nhau."}
