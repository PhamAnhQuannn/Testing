id: check-x002
subtopic_id: py.core.variables_types
secondary_subtopics: []
kind: check
title: "Check X002: swap_and_describe"
title_vi: "Kiểm tra X002: swap_and_describe"
difficulty: easy
source:
  type: original
statement_en_md: |
  Implement `swap_and_describe(n, t)`: `n` is an int and `t` is a string of an integer such as
  `"10"` or `"-9"`. Swap the values of the two names so `n` holds the string and `t` the int.
  Return a list of exactly 3 items, in this order: (1) the sum of the two swapped values, computed
  as numbers; (2) the type name of `n` after the swap; (3) the type name of `t` after the swap
  (type names are strings such as `"int"`, `"str"`).
statement_vi_md: |
  Viết `swap_and_describe(n, t)`: `n` là số nguyên, `t` là chuỗi biểu diễn một số nguyên
  (ví dụ `"10"`, `"-9"`). Hãy hoán đổi giá trị của hai tên để `n` giữ chuỗi, `t` giữ số. Trả về
  một danh sách đúng 3 phần tử theo thứ tự: (1) tổng của hai giá trị sau khi hoán đổi, tính như
  số; (2) tên kiểu của `n` sau hoán đổi; (3) tên kiểu của `t` sau hoán đổi (tên kiểu là chuỗi
  như `"int"`, `"str"`).
constraints:
  - "-1000 <= n <= 1000"
  - "t là chuỗi của một số nguyên trong [-1000, 1000]"
examples:
  - {input: 'n = 5, t = "10"', output: '[15, "str", "int"]', explain_vi: "Sau khi hoán đổi: n = \"10\", t = 5; int(\"10\") + 5 = 15."}
io:
  mode: function
  entry: swap_and_describe
  params: [{name: n, type: int}, {name: t, type: str}]
  returns: "list"
  compare: exact
starter:
  python: |
    def swap_and_describe(n, t):
