title_vi: 'Kiểm tra X314: parse_and_sum: ép kiểu và cộng'
difficulty: easy
source:
  type: original
statement_en_md: 'Implement `parse_and_sum(tokens)` as in the Vietnamese statement: cast mixed string
  tokens and return the sum formatted with 2 decimals.'
statement_vi_md: 'Viết `parse_and_sum(tokens)` nhận danh sách chuỗi. Với mỗi token (bỏ khoảng trắng hai
  đầu, so sánh không phân biệt hoa thường): nếu là `"true"` tính 1, `"false"` tính 0; nếu `int(token)`
  được thì cộng số nguyên đó; ngược lại nếu `float(token)` được thì cộng số thực đó; còn lại bỏ qua. Trả
  tổng dưới dạng chuỗi có đúng 2 chữ số thập phân, ví dụ `"6.50"` (dùng `f"{tong:.2f}"`). Test không chứa
  `nan`/`inf`.'
constraints: []
examples:
- input: tokens = ["3", "2.5", "True", "abc"]
  output: '"6.50"'
  explain_vi: Ví dụ đầu tiên của đề kiểm tra.
