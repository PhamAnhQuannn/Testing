id: check-x565-bank-account
subtopic_id: lld.oop_principles.pillars
secondary_subtopics: []
kind: check
title: 'Check X565: Bank Account'
title_vi: 'Kiểm tra X565: Tài khoản ngân hàng'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Encapsulation: the balance is hidden state and can only change through methods that reject
  bad values. Money is an `int` (no floats).

  Implement `class BankAccount` (constructor takes no arguments, balance starts at 0) with:

  - `deposit(n)`: adds `n` to the balance only if `n > 0`; otherwise does nothing. Returns nothing.
  - `withdraw(n)`: subtracts `n` only if `0 < n <= balance`; otherwise does nothing. Returns nothing.
  - `balance()`: returns the current balance as an int.
statement_vi_md: |
  Encapsulation (đóng gói): số dư là dữ liệu bị giấu, chỉ đổi qua method và method từ chối giá trị
  sai. Tiền là `int` (không dùng float).

  Viết `class BankAccount` (constructor không tham số, số dư ban đầu 0) với:

  - `deposit(n)`: cộng `n` chỉ khi `n > 0`; ngược lại không làm gì. Không trả gì.
  - `withdraw(n)`: trừ `n` chỉ khi `0 < n <= số dư`; ngược lại không làm gì. Không trả gì.
  - `balance()`: trả về số dư hiện tại (int).
constraints:
- 'n là số nguyên (có thể âm hoặc 0).'
- 'Không dùng thread, time hay random.'
examples:
- input: ops = ['BankAccount', 'deposit', 'withdraw', 'balance'], args = [[], [100], [30], []]
  output: '[null, null, null, 70]'
  explain_vi: 'Nạp 100 rồi rút 30 còn 70.'
io:
  mode: class_ops
  compare: exact
starter:
  python: "class BankAccount:\n    # TODO\n    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 8
hints:
- 'Giữ số dư trong `self._balance` (bắt đầu 0); `balance()` chỉ trả nó ra.'
- '`deposit` chỉ cộng khi `n > 0`.'
- '`withdraw` chỉ trừ khi `0 < n <= self._balance`; rút quá số dư là no-op.'
solution:
