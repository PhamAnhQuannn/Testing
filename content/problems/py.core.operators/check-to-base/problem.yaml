id: check-to-base
subtopic_id: py.core.operators
secondary_subtopics: []
kind: check
title: 'Check X313: to_base'
title_vi: 'Kiểm tra X313: to_base: đổi cơ số'
difficulty: easy
source:
  type: original
statement_en_md: 'Implement `to_base(n, b)` as in the Vietnamese statement: convert integer n to base
  b (2..36) using // and %.'
statement_vi_md: Viết `to_base(n, b)` đổi số nguyên n sang chuỗi trong cơ số b (2 <= b <= 36), dùng chữ
  số `0-9` rồi chữ thường `a-z` cho giá trị 10..35. n = 0 trả `"0"`; n âm thì thêm dấu `-` phía trước
  biểu diễn của |n|. Không dùng `bin`, `hex`, `format` hay thư viện; hãy dùng `//` và `%`.
constraints: []
examples:
- input: n = 255, b = 16
  output: '"ff"'
  explain_vi: Ví dụ đầu tiên của đề kiểm tra.
io:
  mode: function
  entry: to_base
  params:
  - name: n
    type: int
  - name: b
    type: int
  returns: str
  compare: exact
starter:
  python: "def to_base(n, b):\n    # TODO\n    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 12
hints:
- Đọc kỹ đề, liệt kê các trường hợp cần phân biệt và thứ tự ưu tiên của chúng trước khi viết code.
- Thử tay với ví dụ, ghi lại từng bước, rồi chuyển thành code; chia bài thành các bước nhỏ.
- Kiểm tra các trường hợp biên (rỗng, 0, âm, giá trị lặp) trước khi nộp.
solution:
  file: solution.py
  approach_vi: 'Lặp: lấy n % b làm chữ số thấp nhất, n //= b, rồi đảo ngược danh sách chữ số.'
  complexity: O(log n)
tests:
  sample: tests/sample.jsonl
  hidden: tests/hidden.jsonl
  generator: tests/gen.py
