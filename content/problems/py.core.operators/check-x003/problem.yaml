kind: check
title: "Check X003: to_hms"
title_vi: "Kiểm tra X003: to_hms"
difficulty: easy
source:
  type: original
statement_en_md: |
  Implement `to_hms(total_seconds)`: convert a number of seconds into the list
  `[hours, minutes, seconds]`, where `minutes` and `seconds` are each below 60. Use `//` and `%`
  (or `divmod`).
statement_vi_md: |
  Viết `to_hms(total_seconds)` đổi một số giây thành danh sách `[giờ, phút, giây]`, trong đó phút
  và giây đều nhỏ hơn 60. Dùng `//` và `%` (hoặc `divmod`).
constraints:
  - "0 <= total_seconds <= 10^5"
examples:
  - {input: 'total_seconds = 3661', output: "[1, 1, 1]", explain_vi: "3661 = 1 giờ (3600) + 1 phút (60) + 1 giây."}
io:
  mode: function
  entry: to_hms
  params: [{name: total_seconds, type: int}]
  returns: "list"
  compare: exact
starter:
  python: |
    def to_hms(total_seconds):
        # TODO: dùng // và % (hoặc divmod) để tách giờ, phút, giây
        pass
limits: {time_ms: 1000, memory_mb: 256, time_multiplier: {pyodide: 3}}
time_target_min: 5
hints:
  - "`divmod(x, 60)` trả về cặp (x // 60, x % 60): số phút và số giây còn lại."
  - "Làm hai lần: giây -> (phút, giây); rồi phút -> (giờ, phút)."
  - "`minutes, seconds = divmod(total_seconds, 60)` rồi `hours, minutes = divmod(minutes, 60)`; trả về `[hours, minutes, seconds]`."
solution:
