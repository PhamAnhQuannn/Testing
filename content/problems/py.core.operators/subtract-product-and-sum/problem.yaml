  - "Giữ hai biến: `product = 1` (tích bắt đầu từ 1, không phải 0) và `total = 0`."
  - "Lặp trong khi `n > 0`: lấy `digit = n % 10`, nhân vào product, cộng vào total, rồi `n //= 10`. Trả về `product - total`."
