id: subtract-product-and-sum
subtopic_id: py.core.operators
secondary_subtopics: []
kind: practice
title: "Subtract the Product and Sum of Digits of an Integer"
title_vi: "Hiệu giữa tích và tổng các chữ số"
difficulty: easy
source: {type: leetcode, lc: 1281, rewrite_required: true}
statement_en_md: |
  Given an integer `n`, return the difference between the product of its digits and the sum of
  its digits.

  Note: the natural approach extracts digits with `% 10` and `// 10` inside a `while` loop, which
  is taught later (`py.core.loops`). If you have not reached it yet, come back to this later.
statement_vi_md: |
  Cho số nguyên `n`. Trả về hiệu: (tích các chữ số của `n`) trừ (tổng các chữ số của `n`).

  Lưu ý: cách làm tự nhiên là lấy từng chữ số bằng `% 10` và `// 10` trong một vòng lặp `while`
  (vòng lặp sẽ được dạy ở `py.core.loops`). Nếu chưa học tới đó, bạn có thể quay lại làm sau.
constraints:
  - "1 <= n <= 10^5"
examples:
  - {input: 'n = 234', output: "15", explain_vi: "Tích = 2*3*4 = 24, tổng = 2+3+4 = 9; 24 - 9 = 15."}
  - {input: 'n = 4421', output: "21", explain_vi: "Tích = 4*4*2*1 = 32, tổng = 4+4+2+1 = 11; 32 - 11 = 21."}
  - {input: 'n = 10', output: "-1", explain_vi: "Tích = 1*0 = 0, tổng = 1; 0 - 1 = -1."}
