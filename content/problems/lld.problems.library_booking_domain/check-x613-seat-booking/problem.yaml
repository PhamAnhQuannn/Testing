id: check-x613-seat-booking
subtopic_id: lld.problems.library_booking_domain
secondary_subtopics: []
kind: check
title: 'Check X613: Seat booking'
title_vi: 'Kiểm tra X613: Đặt ghế chống đặt trùng'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  A seat booking system that prevents double-booking. Failures are reported through return values (never raise).

  Implement `class BookingSystem` (constructor takes no arguments) with:

  - `add_seat(seat)`: registers a seat id as free. Duplicates are ignored (an already registered or booked seat is left unchanged). Returns nothing.
  - `book(seat)`: if the seat is registered and free, marks it booked and returns `True`; otherwise (unknown seat or already booked) returns `False` and changes nothing.
  - `cancel(seat)`: if the seat is currently booked, frees it and returns `True`; otherwise returns `False` and changes nothing.
  - `is_booked(seat)`: returns `True` if the seat is booked, else `False` (`False` for an unknown seat).
  - `free_count()`: returns the number of registered seats that are currently free, as an `int`.
statement_vi_md: |
  Hệ thống đặt ghế chặn đặt trùng (double-booking). Thất bại được báo qua giá trị trả về (không ném lỗi).

  Viết `class BookingSystem` (constructor không tham số) với:

  - `add_seat(seat)`: đăng ký một mã ghế ở trạng thái trống. Trùng thì bỏ qua (ghế đã đăng ký hoặc đã đặt giữ nguyên). Không trả gì.
  - `book(seat)`: nếu ghế đã đăng ký và còn trống thì đánh dấu đã đặt và trả `True`; ngược lại (ghế lạ hoặc đã đặt) trả `False` và không đổi gì.
  - `cancel(seat)`: nếu ghế đang được đặt thì giải phóng và trả `True`; ngược lại trả `False` và không đổi gì.
  - `is_booked(seat)`: trả `True` nếu ghế đã đặt, ngược lại `False` (ghế lạ cũng `False`).
  - `free_count()`: trả số ghế đã đăng ký đang trống (`int`).
constraints:
- 'Mã ghế là chuỗi ASCII.'
- 'Không dùng thread, time hay random.'
examples:
- input: ops = ['BookingSystem', 'add_seat', 'book', 'book', 'is_booked', 'free_count'], args = [[], ['a1'], ['a1'], ['a1'], ['a1'], []]
  output: '[null, null, true, false, true, 0]'
  explain_vi: 'Lần đặt đầu thành công, lần hai trùng nên trả False; ghế vẫn đã đặt và không còn ghế trống.'
io:
