- "Duyệt i từ 0 đến n - 1, đếm số j != i có dist[i][j] <= distance_threshold. Dùng so sánh count <= best_count (dấu <=) để khi hòa thì thành phố có chỉ số lớn hơn thay thế, và trả thành phố tốt nhất."
