statement_en_md: |
  There are `n` cities numbered `0..n-1` and undirected weighted roads `edges`, each `[u, v, w]`. Given
  `distance_threshold`, return the city that can reach the fewest other cities through paths of total
  distance at most `distance_threshold`. If several cities tie, return the one with the largest index.
  Floyd-Warshall computes all-pairs shortest distances in O(n^3).
statement_vi_md: |
  Có `n` thành phố đánh số `0..n-1` và các con đường vô hướng có trọng số `edges`, mỗi phần tử `[u, v, w]`.
  Viết `find_the_city(n, edges, distance_threshold)` trả về thành phố đến được ÍT thành phố khác nhất bằng
  đường đi có tổng độ dài không vượt quá `distance_threshold`. Nếu nhiều thành phố hòa, trả thành phố có chỉ số
  LỚN nhất. Gợi ý: Floyd-Warshall tính khoảng cách mọi cặp trong O(n^3).
constraints:
- 1 <= n <= 100
- 0 <= len(edges) <= n * (n - 1) / 2
- edges[i] = [u, v, w] with 0 <= u, v < n, u != v and 1 <= w <= 10000
- 1 <= distance_threshold <= 10000
examples:
- input: n = 4, edges = [[0, 1, 3], [1, 2, 1], [1, 3, 4], [2, 3, 1]], distance_threshold = 4
  output: '3'
  explain_vi: Thành phố 0 và 3 đều đến được 2 thành phố khác trong khoảng cách 4, còn 1 và 2 đến được 3; hòa giữa 0 và 3 nên chọn chỉ số lớn hơn là 3.
