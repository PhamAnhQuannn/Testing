hints:
- "Tối đa k điểm dừng nghĩa là tối đa k + 1 cạnh. Bellman-Ford sau r vòng cho đường ngắn nhất dùng tối đa r cạnh, nên chỉ cần dừng đúng ở vòng k + 1."
- "Đặt dist = [inf] * n, dist[src] = 0. Mỗi vòng tạo tmp = dist[:], rồi với mỗi cạnh (u, v, w) mà dist[u] hữu hạn, cập nhật tmp[v] = min(tmp[v], dist[u] + w). Kết thúc vòng gán dist = tmp."
- "Phải đọc từ dist (cũ) và ghi vào tmp; relax tại chỗ sẽ cho một vòng đi được nhiều cạnh. Cuối cùng trả -1 nếu dist[dst] vẫn là inf, ngược lại trả dist[dst]."
