title: 'Check X460: find_cheapest_price'
title_vi: 'Kiểm tra X460: find_cheapest_price'
difficulty: easy
source:
  type: leetcode
  lc: 787
  rewrite_required: true
statement_en_md: |
  There are `n` cities numbered `0..n-1` and a list `flights`, where each `[u, v, price]` is a directed
  flight from `u` to `v`. Return the cheapest price to travel from `src` to `dst` using at most `k` stops
  (so at most `k + 1` flights). If no such route exists, return `-1`. Bellman-Ford limited to `k + 1`
  rounds solves it, as long as each round relaxes from a copy of the previous round's distances.
statement_vi_md: |
  Có `n` thành phố đánh số `0..n-1` và danh sách `flights`, mỗi phần tử `[u, v, price]` là một chuyến bay
  một chiều từ `u` đến `v`. Viết `find_cheapest_price(n, flights, src, dst, k)` trả về giá rẻ nhất để đi từ
  `src` đến `dst` với TỐI ĐA `k` điểm dừng (tức tối đa `k + 1` chuyến). Nếu không có đường, trả `-1`.
  Gợi ý: Bellman-Ford chạy đúng `k + 1` vòng, mỗi vòng nới lỏng từ bản sao (snapshot) của `dist` vòng trước
  để một vòng chỉ thêm đúng một cạnh.
constraints:
- 1 <= n <= 100
- 0 <= len(flights) <= n * (n - 1)
- flights[i] = [u, v, price] with 0 <= u, v < n, u != v and 1 <= price <= 10000
- 0 <= src, dst, k < n and src != dst
examples:
- input: n = 4, flights = [[0, 1, 100], [1, 2, 100], [2, 0, 100], [1, 3, 600], [2, 3, 200]], src = 0, dst = 3, k = 1
  output: '700'
  explain_vi: Với tối đa 1 điểm dừng, đường 0 -> 1 -> 3 giá 100 + 600 = 700; đường rẻ hơn 0 -> 1 -> 2 -> 3 cần 2 điểm dừng nên bị loại.
