id: check-x895-xor-cipher
subtopic_id: cs.security_basics.crypto_fundamentals
secondary_subtopics: []
kind: check
title: 'Check X895: XOR stream cipher'
title_vi: 'Kiểm tra X895: mã XOR đối xứng'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `xor_cipher(data, key)`, a symmetric repeating-key XOR cipher. `data` is a list of ints
  (bytes, 0-255) and `key` is a non-empty list of ints. Return a list `out` with
  `out[i] = data[i] ^ key[i % len(key)]` (the key repeats when shorter than the data).
  Because XOR is an involution, applying the same key again recovers the original data.
  Empty data gives `[]`. For `data = [65, 66, 67]`, `key = [7]` the result is `[70, 69, 68]`.
statement_vi_md: |
  Cài `xor_cipher(data, key)`, mã XOR đối xứng khoá lặp vòng (repeating-key XOR). `data` là list số nguyên
  (byte, 0-255), `key` là list số nguyên không rỗng. Trả về list `out` với
  `out[i] = data[i] ^ key[i % len(key)]` (key lặp vòng nếu ngắn hơn data).
  Vì XOR là involution nên áp dụng lại cùng key sẽ khôi phục data gốc.
  Data rỗng trả `[]`. Với `data = [65, 66, 67]`, `key = [7]` kết quả là `[70, 69, 68]`.
constraints:
- 'data là list số nguyên 0-255, có thể rỗng'
- 'key là list số nguyên 0-255, không rỗng'
- 'Chỉ dùng thư viện chuẩn của Python'
examples:
- input: 'data = [65, 66, 67], key = [7]'
  output: '[70, 69, 68]'
  explain_vi: '65 ^ 7 = 70, 66 ^ 7 = 69, 67 ^ 7 = 68.'
- input: 'data = [1, 2, 3, 4], key = [1, 2]'
  output: '[0, 0, 2, 6]'
  explain_vi: 'Key lặp vòng: 1^1 = 0, 2^2 = 0, 3^1 = 2, 4^2 = 6.'
- input: 'data = [], key = [5]'
  output: '[]'
  explain_vi: 'Data rỗng thì kết quả rỗng.'
- input: 'data = [255, 0], key = [255]'
  output: '[0, 255]'
  explain_vi: '255 ^ 255 = 0 và 0 ^ 255 = 255.'
