hints:
- "Dùng một dict mem làm bộ nhớ (tên biến -> giá trị) và một list out cho output."
- "Duyệt từng lệnh, đọc instr[0] để biết thao tác; dùng mem.get(tên, 0) để biến chưa gán đọc ra 0."
- "add: mem[var] = mem.get(var, 0) + mem.get(src, 0); sub tương tự với dấu trừ; out: out.append(mem.get(var, 0))."
