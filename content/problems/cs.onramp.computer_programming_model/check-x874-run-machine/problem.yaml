id: check-x874-run-machine
subtopic_id: cs.onramp.computer_programming_model
secondary_subtopics: []
kind: check
title: 'Check X874: tiny stored-program machine'
title_vi: 'Kiểm tra X874: máy tính nhỏ chạy chương trình'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `run_machine(program)`, a tiny fetch-decode-execute machine. `program` is a list of instructions,
  each itself a list: `["set", var, val]` sets variable `var` (a string) to the int `val`;
  `["add", var, src]` does `var += value of variable src`; `["sub", var, src]` does `var -= value of variable src`;
  `["out", var]` appends the current value of `var` to the output. A variable that was never set reads as `0`.
  Execute the instructions in order and return the output as a list of ints. An empty program gives `[]`.
  For `[["set","x",5],["set","y",3],["add","x","y"],["out","x"]]` the result is `[8]`.
statement_vi_md: |
  Cài `run_machine(program)`, một máy tính nhỏ chạy theo vòng lặp fetch-decode-execute. `program` là list các lệnh,
  mỗi lệnh là một list: `["set", var, val]` gán biến `var` (chuỗi) bằng số nguyên `val`;
  `["add", var, src]` thực hiện `var += giá trị biến src`; `["sub", var, src]` thực hiện `var -= giá trị biến src`;
  `["out", var]` thêm giá trị hiện tại của `var` vào danh sách output. Biến chưa được gán đọc ra `0`.
  Chạy lần lượt các lệnh và trả về output là list số nguyên. Chương trình rỗng trả `[]`.
  Với ví dụ trên kết quả là `[8]`.
constraints:
- 'Mỗi lệnh là list bắt đầu bằng "set", "add", "sub" hoặc "out"'
- 'Tên biến là chuỗi; biến chưa gán đọc ra 0'
- 'Chỉ dùng thư viện chuẩn của Python'
examples:
- input: 'program = [["set", "x", 5], ["set", "y", 3], ["add", "x", "y"], ["out", "x"]]'
  output: '[8]'
  explain_vi: 'x = 5, y = 3, x += y thành 8, out in ra 8.'
- input: 'program = [["out", "z"]]'
  output: '[0]'
  explain_vi: 'Biến z chưa được gán nên đọc ra 0.'
io:
