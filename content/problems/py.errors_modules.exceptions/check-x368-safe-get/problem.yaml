id: check-x368-safe-get
subtopic_id: py.errors_modules.exceptions
secondary_subtopics: []
kind: check
title: 'Check X368: safe_get'
title_vi: 'Kiểm tra X368: safe_get: bắt KeyError'
difficulty: easy
source:
  type: original
statement_en_md: 'Implement `safe_get(pairs, keys, default)`: build a dict from `[key, value]` pairs
  (later pairs overwrite earlier ones), then return the value for each key, using `default` when the
  key is missing, by catching `KeyError`.'
statement_vi_md: 'Viết `safe_get(pairs, keys, default)`. `pairs` là list các cặp `[khóa, giá trị]`;
  hãy dựng dict từ đó (cặp sau ghi đè cặp trước). Với mỗi khóa trong `keys`, trả về giá trị tương ứng;
  nếu khóa không có (gây `KeyError`) thì dùng `default`. Phải dùng `try/except KeyError`. Trả về list
  giá trị cùng thứ tự với `keys`.'
constraints: []
examples:
- input: pairs = [['a', 1], ['b', 2]], keys = ['a', 'z', 'b'], default = 0
  output: '[1, 0, 2]'
  explain_vi: Khóa 'z' không có nên lấy default 0.
io:
  mode: function
  entry: safe_get
  params:
  - name: pairs
    type: list
  - name: keys
    type: list
  - name: default
    type: any
  returns: list
  compare: exact
starter:
  python: "def safe_get(pairs, keys, default):\n    # TODO\n    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 12
hints:
- Dựng dict `d` bằng vòng `for k, v in pairs`.
- Với mỗi khóa, thử `d[key]` trong `try`; `except KeyError` thì thêm `default`.
- Cặp xuất hiện sau ghi đè cặp trước vì gán `d[k] = v` thay giá trị cũ.
solution:
  file: solution.py
  approach_vi: Dựng dict rồi tra từng khóa trong try/except KeyError.
  complexity: O(n + m)
tests:
