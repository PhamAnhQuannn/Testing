id: check-x367-validate-age
subtopic_id: py.errors_modules.exceptions
secondary_subtopics: []
kind: check
title: 'Check X367: validate_age'
title_vi: 'Kiểm tra X367: validate_age: raise và bắt ValueError'
difficulty: easy
source:
  type: original
statement_en_md: 'Implement `validate_age(values)`: keep each valid age (a non-negative int) and replace
  every invalid item (negative or not an int) with `"invalid"`, by raising and catching `ValueError`.'
statement_vi_md: 'Viết `validate_age(values)` nhận một list. Với mỗi phần tử: nếu là số nguyên không âm
  thì giữ nguyên; nếu âm hoặc không phải số nguyên (chuỗi, số thực, None...) thì thay bằng chuỗi `"invalid"`.
  Hãy làm bằng `raise ValueError(...)` trong một hàm kiểm tra rồi `try/except ValueError` ở vòng lặp.
  Trả về list kết quả cùng độ dài.'
constraints: []
examples:
- input: values = [25, -3, 'abc', 0]
  output: '[25, "invalid", "invalid", 0]'
  explain_vi: -3 âm và 'abc' không phải int nên thành "invalid".
io:
  mode: function
  entry: validate_age
  params:
  - name: values
    type: list
  returns: list
  compare: exact
starter:
  python: "def validate_age(values):\n    # TODO\n    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 8
hints:
- "Viết hàm phụ kiểm tra một giá trị: sai thì `raise ValueError`, đúng thì trả về giá trị."
- Trong vòng lặp, bọc lời gọi hàm phụ bằng `try/except ValueError` và thêm `"invalid"` ở nhánh except.
- Nhớ cả `3.5`, `"abc"`, `None` đều không phải int; dùng `isinstance(v, int)`.
solution:
  file: solution.py
  approach_vi: Hàm phụ raise ValueError khi không hợp lệ; vòng lặp bắt ValueError và ghi "invalid".
  complexity: O(n)
tests:
