statement_en_md: |
  Given an integer array `nums` of length `n`, create an array `ans` of length `2n` where
  `ans[i] == nums[i]` and `ans[i + n] == nums[i]` for `0 <= i < n`. In other words, `ans` is the
  concatenation of two copies of `nums`. Return `ans`.
statement_vi_md: |
  Cho list số nguyên `nums` có `n` phần tử. Hãy tạo list `ans` có `2n` phần tử bằng cách viết
  `nums` hai lần liên tiếp: n phần tử đầu của `ans` giống hệt `nums`, n phần tử sau cũng vậy.
  Trả về `ans`.
constraints:
  - "1 <= len(nums) <= 3 * 10^4"
  - "1 <= nums[i] <= 1000"
examples:
  - {input: "nums = [1, 2, 1]", output: "[1, 2, 1, 1, 2, 1]", explain_vi: "Viết [1, 2, 1] hai lần liền nhau."}
  - {input: "nums = [1, 3, 2, 1]", output: "[1, 3, 2, 1, 1, 3, 2, 1]", explain_vi: "Bốn phần tử đầu và bốn phần tử sau đều là [1, 3, 2, 1]."}
