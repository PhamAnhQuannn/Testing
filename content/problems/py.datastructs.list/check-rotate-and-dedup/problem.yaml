title: 'Check X324: rotate_and_dedup'
title_vi: 'Kiểm tra X324: rotate_and_dedup'
difficulty: easy
source:
  type: original
statement_en_md: 'Implement `rotate_and_dedup(xs, k)`. First rotate `xs` to the right by `k` positions
  (`k >= 0`, may be larger than `len(xs)`; the last `k % len(xs)` elements move to the front). Then remove
  duplicates, keeping only the first occurrence of each value. Return the new list; do not modify `xs`.
  An empty list returns `[]`.

  '
statement_vi_md: 'Viết `rotate_and_dedup(xs, k)`. Trước hết xoay `xs` sang phải `k` vị trí (`k >= 0`,
  có thể lớn hơn `len(xs)`; `k % len(xs)` phần tử cuối được đưa lên đầu). Sau đó loại phần tử trùng, chỉ
  giữ lần xuất hiện đầu tiên của mỗi giá trị. Trả về list mới, không sửa `xs`. List rỗng trả về `[]`.

  '
constraints:
- 0 <= len(xs) <= 10^4
- 0 <= k <= 10^9
examples:
- input: xs = [1, 2, 3, 2, 1], k = 2
  output: '[2, 1, 3]'
  explain_vi: 'Sau khi xoay: [2, 1, 1, 2, 3]; bỏ trùng giữ lần đầu: [2, 1, 3].'
