difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `entropy(probs)`: the Shannon entropy in bits of a discrete distribution, `H = -sum(p * log2(p))`.
  `probs` is a list of floats in `[0, 1]` summing to about 1. Terms with `p == 0` are skipped (by convention
  `0 * log2(0) = 0`). Use `math.log2`. Return a float `round(H, 6)`.
statement_vi_md: |
  Cài `entropy(probs)`: entropy Shannon (đơn vị bit) của một phân phối rời rạc, `H = -sum(p * log2(p))`. `probs` là
  list float trong `[0, 1]` có tổng xấp xỉ 1. Bỏ qua các số hạng có `p == 0` (quy ước `0 * log2(0) = 0`). Dùng
  `math.log2`. Trả float `round(H, 6)`.
constraints:
- 1 <= len(probs) <= 100
- 0 <= p <= 1
examples:
- input: probs = [0.5, 0.5]
  output: '1.0'
  explain_vi: Xu công bằng - mỗi mặt 1 bit bất ngờ nên H = 1 bit.
