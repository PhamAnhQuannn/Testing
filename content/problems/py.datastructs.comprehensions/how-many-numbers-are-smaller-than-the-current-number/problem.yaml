limits: {time_ms: 1000, memory_mb: 256, time_multiplier: {pyodide: 3}}
time_target_min: 10
hints:
  - "Với mỗi số `x`, bạn cần đếm các số khác trong list nhỏ hơn `x`. Hai vòng lặp lồng nhau là đủ vì n chỉ tới 500."
  - "Số lượng các `y` trong `nums` thoả `y < x` chính là độ dài của `[y for y in nums if y < x]`. Số bằng `x` không thoả `<` nên không bị đếm (kể cả chính `x`)."
  - "Kết quả là một comprehension bọc ngoài: `[len([y for y in nums if y < x]) for x in nums]`."
