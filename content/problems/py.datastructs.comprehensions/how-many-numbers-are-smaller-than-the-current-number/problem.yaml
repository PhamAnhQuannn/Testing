id: how-many-numbers-are-smaller-than-the-current-number
subtopic_id: py.datastructs.comprehensions
secondary_subtopics: []
kind: practice
title: "How Many Numbers Are Smaller Than the Current Number"
title_vi: "Có bao nhiêu số nhỏ hơn số hiện tại"
difficulty: easy
source: {type: leetcode, lc: 1365, rewrite_required: true}
statement_en_md: |
  Given the list `nums`, for each `nums[i]` find out how many numbers in the list are smaller
  than it. That is, for each `nums[i]` count the valid `j` such that `j != i` and
  `nums[j] < nums[i]`. Return the answer as a list.
statement_vi_md: |
  Cho list `nums`. Với mỗi phần tử `nums[i]`, hãy đếm xem trong list có bao nhiêu số **nhỏ hơn**
  nó (các phần tử khác vị trí `i` mà giá trị nhỏ hơn `nums[i]`). Trả về list kết quả, phần tử thứ
  `i` là số lượng đếm được cho `nums[i]`.
constraints:
  - "2 <= len(nums) <= 500"
  - "0 <= nums[i] <= 100"
examples:
  - {input: "nums = [8, 1, 2, 2, 3]", output: "[4, 0, 1, 1, 3]", explain_vi: "Với 8 có 4 số nhỏ hơn (1, 2, 2, 3). Với 1 không có số nào. Với mỗi số 2 có một số nhỏ hơn (1). Với 3 có ba số nhỏ hơn (1, 2, 2)."}
  - {input: "nums = [7, 7, 7, 7]", output: "[0, 0, 0, 0]", explain_vi: "Các số bằng nhau không tính là nhỏ hơn."}
io:
  mode: function
  entry: smaller_numbers_than_current
  params: [{name: nums, type: "list[int]"}]
  returns: "list[int]"
  compare: exact
starter:
