hints:
- Tính `width = max(map(len, rows), default=0)` là số cột.
- Với mỗi cột `j`, duyệt các hàng và chỉ lấy `row[j]` khi `j < len(row)` và `row[j] > 0`.
- 'Gộp lại: `[sum(r[j] for r in rows if j < len(r) and r[j] > 0) for j in range(width)]`.'
