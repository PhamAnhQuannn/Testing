title: 'Check X321: positive_column_sums'
title_vi: 'Kiểm tra X321: positive_column_sums'
difficulty: easy
source:
  type: original
statement_en_md: 'Implement `positive_column_sums(rows)`. `rows` is a list of rows (integers; rows may
  have different lengths). Return a list whose `j`-th element is the sum of only the positive values found
  at column `j` across all rows that have a column `j`. The result length is the length of the longest
  row (empty list if there are no rows).

  '
statement_vi_md: 'Viết `positive_column_sums(rows)`. `rows` là list các hàng số nguyên (độ dài các hàng
  có thể khác nhau). Trả về list mà phần tử thứ `j` là tổng **chỉ các giá trị dương** ở cột `j` của mọi
  hàng có cột `j`. Độ dài kết quả bằng độ dài hàng dài nhất (list rỗng nếu không có hàng).

  '
constraints:
- 0 <= len(rows) <= 100
- -1000 <= rows[i][j] <= 1000
examples:
- input: rows = [[1, -2, 3], [4, 5], [-6]]
  output: '[5, 5, 3]'
  explain_vi: 'Cột 0: 1+4=5; cột 1: 5; cột 2: 3.'
