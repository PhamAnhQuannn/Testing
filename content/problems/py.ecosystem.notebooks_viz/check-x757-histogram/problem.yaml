title: 'Check X757: histogram'
title_vi: 'Kiểm tra X757: đếm histogram theo bin'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `histogram(values, k)`, mimicking the counts of `plt.hist(values, bins=k)`. `values` is a non-empty
  list of ints and `k >= 1` is the number of equal-width bins. Let `lo = min(values)` and `hi = max(values)`.
  If `hi == lo`, return `[len(values)] + [0] * (k - 1)` (all values fall in bin 0). Otherwise let
  `width = (hi - lo) / k` (a float); the bin index of each value `v` is `min(int((v - lo) / width), k - 1)`,
  so a value equal to `hi` is clamped into the last bin. Return a list of `k` ints, the count per bin, bin 0 first.
  For `histogram([1, 2, 3, 4], 2)` the result is `[2, 2]`; for `histogram([5, 5, 5], 3)` it is `[3, 0, 0]`.
statement_vi_md: |
  Cài `histogram(values, k)`, mô phỏng phần đếm của `plt.hist(values, bins=k)`. `values` là list số nguyên không
  rỗng, `k >= 1` là số bin có độ rộng bằng nhau. Đặt `lo = min(values)`, `hi = max(values)`. Nếu `hi == lo` thì
  trả về `[len(values)] + [0] * (k - 1)` (mọi giá trị rơi vào bin 0). Ngược lại `width = (hi - lo) / k` (số thực);
  chỉ số bin của mỗi giá trị `v` là `min(int((v - lo) / width), k - 1)`, nên giá trị bằng `hi` được kẹp vào bin
  cuối. Trả về list k số nguyên là số phần tử mỗi bin, bin 0 trước. Với `histogram([1, 2, 3, 4], 2)` kết quả là
  `[2, 2]`; với `histogram([5, 5, 5], 3)` là `[3, 0, 0]`.
constraints:
- 'values không rỗng, k >= 1; giá trị có thể âm hoặc trùng nhau'
- 'Nếu hi == lo thì toàn bộ số lượng nằm ở bin 0'
- 'Dùng min(int((v - lo) / width), k - 1) để giá trị lớn nhất rơi vào bin cuối'
examples:
- input: 'values = [1, 2, 3, 4], k = 2'
  output: '[2, 2]'
  explain_vi: 'width = 1.5; 1 và 2 vào bin 0, 3 vào bin 1, 4 cho chỉ số 2 được kẹp về 1.'
