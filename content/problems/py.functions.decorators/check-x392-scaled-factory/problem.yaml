statement_en_md: Implement `run_scaled(k, xs)` and the `scaled(k)` decorator factory as described in the
  Vietnamese statement (mastery check item X392).
statement_vi_md: Viết decorator có tham số `scaled(k)`; hàm bị bọc trả kết quả gốc nhân `k`, wrapper
  chuyển tiếp `*args, **kwargs` và giữ `__name__`, `__doc__` bằng `functools.wraps`. Trong
  `run_scaled(k, xs)` định nghĩa `add(a, b=0)` với docstring `"Add."` (trả `a + b`) được decorate bằng
  `@scaled(k)`, rồi trả `[[add(x, b=1) cho từng x trong xs], add.__name__, add.__doc__]`.
constraints: []
examples:
- input: k = 2, xs = [1, 2]
  output: '[[4, 6], "add", "Add."]'
  explain_vi: add(1, b=1) = 2 rồi nhân 2 được 4; add(2, b=1) = 3 rồi nhân 2 được 6.
