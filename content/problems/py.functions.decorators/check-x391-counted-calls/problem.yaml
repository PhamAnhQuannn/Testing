statement_en_md: Implement `run_counted(xs)` and the `counted` decorator as described in the Vietnamese
  statement (mastery check item X391).
statement_vi_md: Viết decorator `counted(func)` đếm số lần gọi, wrapper nhận `*args, **kwargs`, tăng
  `wrapper.calls` (khởi tạo 0), trả đúng giá trị của `func` và dùng `functools.wraps`. Định nghĩa
  `double(x)` (trả `x * 2`) với `@counted`. `run_counted(xs)` trả `[list kết quả double(x) cho từng x
  trong xs, double.calls, double.__name__]`.
constraints: []
examples:
- input: xs = [1, 2]
  output: '[[2, 4], 2, "double"]'
  explain_vi: Gọi double hai lần nên calls là 2 và tên vẫn là "double".
