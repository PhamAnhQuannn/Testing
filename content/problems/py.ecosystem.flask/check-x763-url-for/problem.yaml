  approach_vi: Duyệt rules lấy rule đầu tiên khớp endpoint, rồi dùng re.sub thay từng placeholder {name} bằng str(params[name]); không khớp thì trả chuỗi rỗng.
  complexity: "O(n + m) / O(1)"
