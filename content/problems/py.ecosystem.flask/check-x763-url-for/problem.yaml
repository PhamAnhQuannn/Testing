        pass
time_target_min: 6
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
hints:
- "Duyệt rules theo thứ tự và dừng ở rule đầu tiên có `name == endpoint`; không thấy thì trả `\"\"`."
- "Với mỗi `{name}` trong pattern, thay bằng `str(params[name])`; có thể dùng `pattern.replace(\"{\" + k + \"}\", str(v))` hoặc `re.sub`."
- "Dùng `str(value)` vì giá trị có thể là int."
solution:
