statement_vi_md: 'Viết `summarize_orders(rows)` với `rows` là list `[tên_trạng_thái, số_tiền]`. Định nghĩa
  `class Status(Enum)` với `NEW = 1`, `PAID = 2`, `SHIPPED = 3` và `@dataclass(frozen=True) class Order`
  có field `status: Status`, `amount: int`. Tạo `Order(Status[tên], số_tiền)` cho mỗi dòng. Trả list chuỗi:
  với từng member của `Status` theo thứ tự khai báo, `"TÊN:tổng_tiền"` (0 nếu không có đơn); cuối cùng thêm
  `"distinct:n"` với `n` là số đơn khác nhau (đếm bằng `set` các `Order`, tức cùng trạng thái và số tiền
  chỉ tính một).'
