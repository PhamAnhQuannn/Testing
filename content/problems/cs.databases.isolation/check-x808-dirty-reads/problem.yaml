hints:
- "Giữ dict `uncommitted` (key sang txn đang ghi chưa commit) và list `pairs` các cặp (reader, writer)."
- "Khi `read`, chỉ ghi cặp nếu key có writer khác `txn`; khi `commit` hoặc `abort` thì xóa mọi key mà `txn` đang giữ."
- "Khi `abort txn`, thêm vào tập `confirmed` mọi reader trong `pairs` có writer là `txn`; cuối cùng trả `sorted(confirmed)`."
