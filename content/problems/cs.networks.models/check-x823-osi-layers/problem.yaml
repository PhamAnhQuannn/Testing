id: check-x823-osi-layers
subtopic_id: cs.networks.models
secondary_subtopics: []
kind: check
title: 'Check X823: OSI layers of protocols'
title_vi: 'Kiểm tra X823: tầng OSI của các giao thức'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `osi_layers(protocols)`. `protocols` is a list of uppercase protocol names. Return a list with the OSI
  layer number (1 to 7) of each protocol, in the same order. Use exactly this table:
  `HTTP`, `DNS`, `FTP`, `SMTP` are layer 7; `TLS`, `SSL` are layer 6; `TCP`, `UDP` are layer 4;
  `IP`, `ICMP`, `ARP` are layer 3; `ETHERNET`, `MAC` are layer 2; `WIFI`, `ETHERNET_PHY` are layer 1.
  A protocol that is not in the table maps to `0`. An empty list returns `[]`.
  For `["HTTP", "TCP", "IP", "FOO"]` the result is `[7, 4, 3, 0]`.
statement_vi_md: |
  Cài `osi_layers(protocols)`. `protocols` là list tên giao thức viết hoa. Trả về list số tầng OSI (1 đến 7) của
  từng giao thức, giữ nguyên thứ tự. Dùng đúng bảng sau: `HTTP`, `DNS`, `FTP`, `SMTP` là tầng 7; `TLS`, `SSL` là
  tầng 6; `TCP`, `UDP` là tầng 4; `IP`, `ICMP`, `ARP` là tầng 3; `ETHERNET`, `MAC` là tầng 2; `WIFI`,
  `ETHERNET_PHY` là tầng 1. Giao thức không có trong bảng cho `0`. List rỗng trả `[]`. Với
  `["HTTP", "TCP", "IP", "FOO"]` kết quả là `[7, 4, 3, 0]`.
constraints:
- 'protocols là list chuỗi viết hoa; so khớp chính xác tên trong bảng'
- 'Giao thức ngoài bảng trả 0'
- 'Chỉ dùng thư viện chuẩn của Python'
examples:
- input: 'protocols = ["HTTP", "TCP", "IP", "FOO"]'
  output: '[7, 4, 3, 0]'
  explain_vi: 'HTTP là tầng 7, TCP tầng 4, IP tầng 3, FOO không có trong bảng nên là 0.'
