id: check-x598-library-api
subtopic_id: lld.process.apis_code
secondary_subtopics: []
kind: check
title: 'Check X598: Library API'
title_vi: 'Kiểm tra X598: API lõi của thư viện'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Core API of a library system. Validation is reported through return values (never raise).

  Implement `class Library` (constructor takes no arguments) with:

  - `add_book(title, copies)`: adds `copies` (an int >= 0) available copies of `title`. Calling it again for the same title accumulates. Returns nothing.
  - `borrow(title)`: if at least one copy of `title` is available, decrements the available count and returns `True`; otherwise (empty or unknown title) returns `False` and changes nothing.
  - `return_book(title)`: if `title` is known and has at least one outstanding borrow, increments the available count and returns `True`; otherwise returns `False` and changes nothing.
  - `available(title)`: returns the number of available copies as an `int` (`0` for an unknown title).
statement_vi_md: |
  API lõi của hệ thống thư viện. Kiểm tra đầu vào được báo qua giá trị trả về (không ném lỗi).

  Viết `class Library` (constructor không tham số) với:

  - `add_book(title, copies)`: thêm `copies` (số nguyên >= 0) bản sách có sẵn cho `title`. Gọi lại với cùng tựa sách thì cộng dồn. Không trả gì.
  - `borrow(title)`: nếu còn ít nhất một bản sẵn có thì giảm số bản sẵn có và trả `True`; ngược lại (hết sách hoặc tựa lạ) trả `False` và không đổi gì.
  - `return_book(title)`: nếu `title` đã biết và còn lượt mượn chưa trả thì tăng số bản sẵn có và trả `True`; ngược lại trả `False` và không đổi gì.
  - `available(title)`: trả số bản sẵn có (`int`), `0` nếu tựa sách lạ.
constraints:
- 'Tựa sách là chuỗi ASCII; copies là số nguyên không âm.'
- 'Không dùng thread, time hay random.'
examples:
- input: ops = ['Library', 'add_book', 'borrow', 'borrow', 'available'], args = [[], ['dune', 1], ['dune'], ['dune'], ['dune']]
  output: '[null, null, true, false, 0]'
  explain_vi: 'Chỉ có 1 bản: lần mượn đầu thành công, lần hai hết sách nên trả False; còn 0 bản.'
io:
