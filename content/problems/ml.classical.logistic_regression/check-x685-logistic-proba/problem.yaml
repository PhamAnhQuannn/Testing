  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 6
hints:
- Tính điểm z = bias + sum(w * xi for w, xi in zip(weights, x)).
- Sigmoid là 1 / (1 + exp(-z)), nhưng exp(-z) tràn khi z rất âm; tách hai nhánh theo dấu của z.
- Nếu z >= 0 dùng 1 / (1 + exp(-z)); ngược lại e = exp(z), p = e / (1 + e). Trả round(p, 6).
