id: check-x685-logistic-proba
subtopic_id: ml.classical.logistic_regression
secondary_subtopics: []
kind: check
title: 'Check X685: logistic regression probability'
title_vi: 'Kiểm tra X685: xác suất logistic regression'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `predict_proba(weights, bias, x)` for logistic regression: compute the linear score
  `z = bias + sum(w_i * x_i)` and return `sigmoid(z) = 1 / (1 + e^(-z))` rounded to 6 decimals.
  Use a numerically stable sigmoid (no overflow in `math.exp` for very negative or very positive `z`).
  `weights` and `x` have the same length.
  For `weights = [0.5, 1.0]`, `bias = -1.0`, `x = [2.0, 1.0]` we get `z = 1` and the result `0.731059`.
statement_vi_md: |
  Cài `predict_proba(weights, bias, x)` cho logistic regression: tính điểm tuyến tính
  `z = bias + sum(w_i * x_i)` rồi trả `sigmoid(z) = 1 / (1 + e^(-z))` làm tròn 6 chữ số.
  Dùng sigmoid ổn định số học (không để `math.exp` tràn khi `z` rất âm hoặc rất dương).
  `weights` và `x` cùng độ dài.
  Với `weights = [0.5, 1.0]`, `bias = -1.0`, `x = [2.0, 1.0]` ta có `z = 1` và kết quả `0.731059`.
constraints:
- 1 <= len(weights) == len(x) <= 100
- abs(weights[i]), abs(x[i]), abs(bias) <= 1000
examples:
- input: weights = [0.0], bias = 0.0, x = [5.0]
  output: '0.5'
  explain_vi: z = 0 + 0.0*5 = 0 nên sigmoid(0) = 1 / (1 + e^0) = 0.5.
io:
  mode: function
  entry: predict_proba
  params:
  - name: weights
    type: list
  - name: bias
    type: float
  - name: x
    type: list
  returns: float
  compare: float_tol
