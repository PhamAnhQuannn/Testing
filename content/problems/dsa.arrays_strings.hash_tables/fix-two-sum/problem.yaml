id: fix-two-sum
subtopic_id: dsa.arrays_strings.hash_tables
secondary_subtopics: []
kind: check
title: "Fix the bug: two sum"
title_vi: "Sửa bug: two sum"
difficulty: easy
source: {type: original, rewrite_required: false}
statement_en_md: |
  The function below was written by an AI and has a bug. Fix it so all tests pass.
  `two_sum(nums, target)` returns `[i, j]` with `i < j` and `nums[i] + nums[j] == target`
  (an element cannot be used twice), or `[]` if no such pair exists.

statement_vi_md: |
  Hàm dưới đây do AI viết và có một bug. Hãy sửa để pass hết test.
  `two_sum(nums, target)` trả về `[i, j]` với `i < j` và `nums[i] + nums[j] == target`
  (một phần tử không được dùng hai lần), hoặc `[]` nếu không có cặp nào.

constraints:
  - "0 <= len(nums) <= 2000"
  - "Có tối đa một cặp đáp án"
examples:
  - {input: 'nums = [3, 2, 4], target = 6', output: '[1, 2]', explain_vi: "2 + 4 = 6; không được lấy 3 hai lần."}
  - {input: 'nums = [3, 3], target = 6', output: '[0, 1]', explain_vi: "Hai phần tử 3 ở hai vị trí khác nhau."}
io:
  mode: function
  entry: two_sum
  params: [{name: nums, type: "list[int]"}, {name: target, type: int}]
  returns: "list[int]"
  compare: exact
starter:
  python: |
    def two_sum(nums, target):
        seen = {}
        for i, x in enumerate(nums):
            seen[x] = i
            need = target - x
            if need in seen:
                return [seen[need], i]
        return []
limits: {time_ms: 1000, memory_mb: 256, time_multiplier: {pyodide: 3}}
time_target_min: 6
hints:
  - "Thử nums = [3, 2, 4], target = 6: hàm trả về gì?"
  - "Thứ tự giữa 'tra dict' và 'ghi vào dict' quyết định phần tử hiện tại có tự ghép với chính nó hay không."
  - "Tra `need in seen` trước, rồi mới `seen[x] = i`."
solution:
  file: solution.py
  approach_vi: "Đổi thứ tự: kiểm tra phần bù trong dict trước khi thêm phần tử hiện tại."
  complexity: "O(n) time, O(n) space"
tests:
  sample: tests/sample.jsonl
  hidden: tests/hidden.jsonl
  generator: tests/gen.py
tags: [check, fix-the-bug, hash-map, two-sum]
status: validated
version: 1
