title: "Write a test: two sum"
title_vi: "Viết test: two sum"
source: {type: original, rewrite_required: false}
statement_en_md: |
  `two_sum(nums, target)` returns `[i, j]` with `i < j` and `nums[i] + nums[j] == target` (an element
  cannot be used twice), or `[]` if no such pair exists. There is at most one answer pair.

  The code shown is AI-written and has a bug. Write a test (functions named `test_*` that call
  `two_sum` and `assert`) that FAILS on this buggy code but PASSES on a correct implementation.
statement_vi_md: |
  `two_sum(nums, target)` trả về `[i, j]` với `i < j` và `nums[i] + nums[j] == target` (một phần tử
  không được dùng hai lần), hoặc `[]` nếu không có cặp nào. Có tối đa một cặp đáp án.

  Code được hiển thị do AI viết và có một bug. Hãy viết test (các hàm `test_*` gọi `two_sum` rồi
  `assert`) sao cho test FAIL trên code lỗi này nhưng PASS trên bản cài đặt đúng. Test chỉ đúng khi
  vừa bắt được bug, vừa không báo động giả với code đúng.
