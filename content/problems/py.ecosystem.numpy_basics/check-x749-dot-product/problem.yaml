id: check-x749-dot-product
subtopic_id: py.ecosystem.numpy_basics
secondary_subtopics: []
kind: check
title: 'Check X749: dot product'
title_vi: 'Kiểm tra X749: tích vô hướng của hai vector'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `dot(a, b)`, a pure-Python version of `np.dot` for two 1-D vectors. `a` and `b` are lists of
  integers of the **same length**. Return the dot product `sum(a[i] * b[i])` as an integer. Do not import NumPy.
  For `a = [1, 2, 3]`, `b = [4, 5, 6]` the result is `32` (1*4 + 2*5 + 3*6);
  for two empty lists the result is `0`.
statement_vi_md: |
  Cài `dot(a, b)`, bản Python thuần của `np.dot` cho hai vector 1 chiều. `a` và `b` là hai list số nguyên
  **cùng độ dài**. Trả về tích vô hướng `sum(a[i] * b[i])` là một số nguyên. Không import NumPy.
  Với `a = [1, 2, 3]`, `b = [4, 5, 6]` kết quả là `32` (1*4 + 2*5 + 3*6); với hai list rỗng kết quả là `0`.
constraints:
- 'a và b có cùng độ dài (có thể bằng 0, khi đó kết quả là 0)'
- 'Phần tử là số nguyên, có thể âm hoặc bằng 0'
- 'Chỉ dùng thư viện chuẩn của Python, không dùng NumPy'
examples:
- input: 'a = [1, 2, 3], b = [4, 5, 6]'
  output: '32'
  explain_vi: '1*4 + 2*5 + 3*6 = 4 + 10 + 18 = 32.'
