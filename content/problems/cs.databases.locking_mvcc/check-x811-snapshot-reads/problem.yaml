time_target_min: 6
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
hints:
- "Với mỗi `ts`, chỉ các version có `commit_ts <= ts` là nhìn thấy được; lấy cái cuối cùng trong số đó."
- "`versions` đã sắp tăng dần nên có thể duyệt tuyến tính hoặc dùng `bisect.bisect_right` trên list các commit_ts."
- "Với `i = bisect_right(tss, ts)`: nếu `i == 0` thì kết quả là `None`, ngược lại là `versions[i - 1][1]`."
solution:
  file: solution.py
  approach_vi: Tách list commit_ts, với mỗi timestamp đọc dùng bisect_right để tìm vị trí version nhìn thấy được cuối cùng; không có thì None.
  complexity: "O(v + r*log v) / O(1)"
