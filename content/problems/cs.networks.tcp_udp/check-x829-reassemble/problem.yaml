- "Với mỗi `seq, data`: nếu `seq == nxt` thì nối data và tăng `nxt` thêm `len(data)`; nếu `seq < nxt` thì bỏ qua (trùng)."
- "Nếu `seq > nxt` là có khoảng trống nên `break`; cuối cùng trả chuỗi đã nối."
