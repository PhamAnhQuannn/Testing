id: check-x859-first-fit
subtopic_id: cs.os.memory
secondary_subtopics: []
kind: check
title: 'Check X859: first-fit memory allocation'
title_vi: 'Kiểm tra X859: cấp phát bộ nhớ first-fit'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `first_fit(blocks, requests)`, a model of the first-fit allocation policy. `blocks` is a list of
  ints: the size of each free memory block, in fixed order. `requests` is a list of ints: sizes to allocate.
  For each request in order, scan the blocks from left to right and allocate it to the first block whose
  current remaining size is `>=` the request; reduce that block's remaining size by the request and append
  that block's index to the result. If no block fits, append `-1`. Return the list of results in request
  order; an empty `requests` gives `[]`.
  For `blocks = [100, 500, 200]`, `requests = [212, 417, 112, 426]` the result is `[1, -1, 1, -1]`.
statement_vi_md: |
  Cài `first_fit(blocks, requests)`, mô phỏng chính sách cấp phát first-fit. `blocks` là list số nguyên: kích thước
  từng free block theo thứ tự cố định. `requests` là list các kích thước cần cấp phát. Với mỗi request theo thứ tự,
  quét block từ trái sang phải và cấp phát vào block đầu tiên có kích thước còn lại `>=` request; trừ kích thước
  block đó đi request và thêm chỉ số block vào kết quả. Nếu không block nào đủ, thêm `-1`. Trả về list kết quả theo
  thứ tự request; `requests` rỗng trả `[]`. Với ví dụ trên kết quả là `[1, -1, 1, -1]`.
constraints:
- 'blocks và requests là list số nguyên không âm'
- 'Request kích thước 0 vừa với mọi block (block đầu tiên, chỉ số 0, nếu có)'
- 'Chỉ dùng thư viện chuẩn của Python'
examples:
- input: 'blocks = [100, 500, 200], requests = [212, 417, 112, 426]'
  output: '[1, -1, 1, -1]'
  explain_vi: '212 vào block 1 (còn 288); 417 không block nào đủ; 112 vào block 1 (còn 176); 426 không đủ.'
- input: 'blocks = [5, 10, 3], requests = [4, 4, 7, 2]'
  output: '[0, 1, -1, 1]'
  explain_vi: '4 vào block 0 (còn 1); 4 vào block 1 (còn 6); 7 không đủ; 2 vào block 1 (còn 4).'
io:
  mode: function
  entry: first_fit
  params:
  - name: blocks
    type: list
  - name: requests
    type: list
  returns: list
  compare: exact
starter:
