- "Với mỗi request, duyệt remaining theo chỉ số tăng dần và dừng ở block đầu tiên có kích thước >= request."
- "Khi tìm thấy, trừ request khỏi block đó và ghi chỉ số; nếu duyệt hết mà không thấy thì ghi -1."
solution:
