id: check-x651-eigen-2x2
subtopic_id: ml.math.linalg_decomposition
secondary_subtopics: []
kind: check
title: 'Check X651: eigenvalues of a 2x2 matrix'
title_vi: 'Kiểm tra X651: trị riêng của ma trận 2×2'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `eigenvalues_2x2(A)` where `A = [[a, b], [c, d]]` is a 2x2 matrix of numbers. The eigenvalues
  are the roots of the characteristic equation `λ² - (a+d)·λ + (a·d - b·c) = 0`. Let `tr = a + d`,
  `det = a*d - b*c`, `disc = tr*tr - 4*det`. If `disc < 0` (complex eigenvalues) return `[]`. Otherwise
  return the two real eigenvalues sorted ascending, each rounded with `round(x, 6)`:
  `[(tr - sqrt(disc)) / 2, (tr + sqrt(disc)) / 2]` (use `math.sqrt`; if `disc = 0` both are equal).
statement_vi_md: |
  Cài `eigenvalues_2x2(A)` với `A = [[a, b], [c, d]]` là ma trận 2×2. Trị riêng là nghiệm của phương trình đặc
  trưng `λ² - (a+d)·λ + (a·d - b·c) = 0`. Đặt `tr = a + d`, `det = a*d - b*c`, `disc = tr*tr - 4*det`.
  Nếu `disc < 0` (trị riêng phức) trả `[]`. Ngược lại trả hai trị riêng thực xếp tăng dần, mỗi số `round(x, 6)`:
  `[(tr - sqrt(disc)) / 2, (tr + sqrt(disc)) / 2]` (dùng `math.sqrt`; nếu `disc = 0` hai số bằng nhau).
constraints:
- A is 2x2 with integer entries in [-10, 10]
examples:
- input: A = [[2, 1], [1, 2]]
  output: '[1.0, 3.0]'
  explain_vi: tr = 4, det = 3, disc = 4 nên λ = (4 ∓ 2)/2 = 1 và 3.
