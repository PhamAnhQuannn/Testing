kind: check
title: 'Check X481: unique_paths'
title_vi: 'Kiểm tra X481: unique_paths'
difficulty: easy
source:
  type: leetcode
  lc: 62
  rewrite_required: true
statement_en_md: |
  A robot starts at the top-left cell of an `m x n` grid and wants to reach the bottom-right cell. It can
  only move one step right or one step down at a time. Return the number of distinct paths. The count
  for a cell is the sum of the counts of the cell above and the cell to the left.
statement_vi_md: |
  Một robot đứng ở ô góc trên trái của lưới `m x n` và muốn tới ô góc dưới phải. Mỗi bước chỉ được đi
  sang phải hoặc xuống dưới. Viết `unique_paths(m, n)` trả về số đường đi khác nhau. Gợi ý: số đường đi
  tới một ô bằng tổng số đường đi tới ô phía trên và ô bên trái.
constraints:
- 1 <= m, n <= 30
- the answer fits in a 64-bit integer
examples:
- input: m = 3, n = 7
  output: '28'
  explain_vi: Lưới 3 hàng 7 cột có C(8, 2) = 28 đường đi (chọn 2 bước xuống trong 8 bước).
io:
  mode: function
  entry: unique_paths
  params:
  - name: m
    type: int
  - name: n
    type: int
  returns: int
  compare: exact
