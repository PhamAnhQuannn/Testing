hints:
- Chỉ có thể tới một ô từ ô ngay phía trên hoặc ô ngay bên trái nó.
- "Đặt dp[r][c] là số đường đi tới ô (r, c). Hàng đầu và cột đầu chỉ có đúng 1 đường, còn các ô khác dp[r][c] = dp[r-1][c] + dp[r][c-1]."
- "Có thể dùng một mảng dp dài n, cập nhật từng hàng: dp[c] += dp[c-1] với c từ 1 tới n-1, lặp m-1 lần. Kết quả là dp[-1]."
