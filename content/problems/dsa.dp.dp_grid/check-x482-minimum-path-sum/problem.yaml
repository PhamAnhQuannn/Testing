id: check-x482-minimum-path-sum
subtopic_id: dsa.dp.dp_grid
secondary_subtopics: []
kind: check
title: 'Check X482: min_path_sum'
title_vi: 'Kiểm tra X482: min_path_sum'
difficulty: easy
source:
  type: leetcode
  lc: 64
  rewrite_required: true
statement_en_md: |
  Given an `m x n` grid of non-negative integers, find a path from the top-left cell to the bottom-right
  cell that minimizes the sum of all numbers along it. You may only move right or down. Return that
  minimum sum. The best sum at a cell is its own value plus the smaller of the best sums above and to the left.
statement_vi_md: |
  Cho lưới `m x n` gồm các số nguyên không âm. Viết `min_path_sum(grid)` trả về tổng nhỏ nhất của một
  đường đi từ ô trên trái tới ô dưới phải, mỗi bước chỉ được đi sang phải hoặc xuống dưới (cộng cả hai
  ô đầu và cuối). Gợi ý: tổng nhỏ nhất tại một ô bằng giá trị ô cộng với min của ô trên và ô trái.
constraints:
- 1 <= m, n <= 30
- 0 <= grid[i][j] <= 200
examples:
- input: grid = [[1, 3, 1], [1, 5, 1], [4, 2, 1]]
  output: '7'
  explain_vi: Đường 1 -> 3 -> 1 -> 1 -> 1 có tổng 7 là nhỏ nhất.
io:
  mode: function
  entry: min_path_sum
  params:
  - name: grid
    type: list[list[int]]
  returns: int
  compare: exact
