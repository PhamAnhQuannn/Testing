    pyodide: 3
time_target_min: 10
hints:
- Mỗi ô chỉ nhận được từ ô trên hoặc ô trái, nên tổng nhỏ nhất tới ô là giá trị ô cộng với min của hai ô đó.
- "Hàng đầu chỉ có ô trái, cột đầu chỉ có ô trên, nên ở đó chỉ cộng dồn. Ô (0, 0) có tổng bằng chính grid[0][0]."
- "Điền dp theo từng hàng từ trên xuống, trái sang phải: dp[r][c] = grid[r][c] + min(dp[r-1][c], dp[r][c-1]) cho các ô bên trong. Trả về dp[-1][-1]."
