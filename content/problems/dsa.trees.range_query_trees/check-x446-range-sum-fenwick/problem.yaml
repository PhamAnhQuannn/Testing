        pass
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 8
hints:
- Mảng không đổi, nên tổng đoạn [l, r] bằng prefix(r + 1) - prefix(l) với prefix(i) là tổng i phần tử đầu.
- "Cách đơn giản: prefix[i + 1] = prefix[i] + nums[i], mỗi truy vấn là O(1). Cách luyện Fenwick: tree[i] giữ tổng đoạn độ dài lowbit(i) = i & -i kết thúc tại i (đánh số từ 1)."
- "Truy vấn prefix trên Fenwick: while i > 0 thì cộng tree[i] rồi i -= i & -i. Nhớ đổi sang chỉ số 1-based vì l, r của đề là 0-based."
solution:
  file: solution.py
  approach_vi: Dựng Fenwick tree O(n) một lần; mỗi truy vấn là hiệu hai prefix sum, mỗi prefix O(log n).
  complexity: O(n + q log n) / O(n)
