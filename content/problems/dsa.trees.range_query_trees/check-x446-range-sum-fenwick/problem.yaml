id: check-x446-range-sum-fenwick
subtopic_id: dsa.trees.range_query_trees
secondary_subtopics: []
kind: check
title: 'Check X446: range_sum'
title_vi: 'Kiểm tra X446: range_sum'
difficulty: easy
source:
  type: original
statement_en_md: |
  Given an integer array `nums` and a list of queries `[l, r]` (0-indexed, inclusive), return for each query
  the sum `nums[l] + ... + nums[r]`, in the same order as the queries. The array never changes between
  queries. Build a prefix-sum array or a Fenwick tree (BIT) once, then answer each query fast.
statement_vi_md: |
  Viết `range_sum(nums, queries)`: mỗi truy vấn `[l, r]` (chỉ số từ 0, gồm cả hai đầu) cần trả về tổng
  `nums[l] + ... + nums[r]`. Kết quả là danh sách đáp án theo đúng thứ tự truy vấn. Mảng không đổi giữa các
  truy vấn nên chỉ cần dựng prefix sum hoặc Fenwick tree (BIT) một lần rồi trả lời từng truy vấn thật nhanh.
constraints:
- 0 <= len(nums) <= 10^5
- 0 <= len(queries) <= 10^5
- 0 <= l <= r < len(nums)
- -10^9 <= nums[i] <= 10^9
examples:
- input: nums = [3, 2, -1, 6, 5, 4], queries = [[0, 5], [1, 3], [2, 2], [4, 5]]
  output: '[19, 7, -1, 9]'
  explain_vi: Tổng cả mảng là 19; 2 + (-1) + 6 = 7; một phần tử là -1; 5 + 4 = 9.
io:
  mode: function
  entry: range_sum
  params:
  - name: nums
    type: list[int]
  - name: queries
    type: list[list[int]]
  returns: list[int]
  compare: exact
starter:
  python: |
