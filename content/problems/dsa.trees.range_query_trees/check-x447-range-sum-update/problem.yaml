kind: check
title: 'Check X447: range_sum_updates'
title_vi: 'Kiểm tra X447: range_sum_updates'
difficulty: easy
source:
  type: original
statement_en_md: |
  Given an integer array `nums` and a list of operations `ops`, process them in order. Operation
  `["u", i, v]` sets `nums[i] = v` (0-indexed). Operation `["q", l, r]` asks for the sum
  `nums[l] + ... + nums[r]` (inclusive) of the current array. Return the answers to all `"q"` operations
  in order. A Fenwick tree (BIT) gives O(log n) for both operations.
statement_vi_md: |
  Viết `range_sum_updates(nums, ops)`: xử lý lần lượt các thao tác trong `ops`. Thao tác `["u", i, v]` gán
  `nums[i] = v` (chỉ số từ 0). Thao tác `["q", l, r]` hỏi tổng `nums[l] + ... + nums[r]` (gồm cả hai đầu) của
  mảng **hiện tại**. Trả về danh sách đáp án của mọi thao tác `"q"` theo đúng thứ tự. Fenwick tree (BIT) cho
  cả cập nhật điểm lẫn truy vấn tổng đoạn trong O(log n); lưu ý `"u"` là **gán** giá trị, không phải cộng thêm.
constraints:
- 0 <= len(nums) <= 10^5
- 0 <= len(ops) <= 10^5
- 0 <= i, l <= r < len(nums)
- -10^9 <= nums[i], v <= 10^9
examples:
- input: nums = [1, 3, 5], ops = [["q", 0, 2], ["u", 1, 10], ["q", 0, 2], ["q", 1, 1]]
  output: '[9, 16, 10]'
  explain_vi: Tổng ban đầu là 9; sau khi gán nums[1] = 10 mảng là [1, 10, 5] nên tổng 16 và nums[1] = 10.
