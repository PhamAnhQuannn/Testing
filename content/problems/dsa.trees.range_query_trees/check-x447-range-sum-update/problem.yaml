limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 10
hints:
- Với prefix sum thường, mỗi lần cập nhật phải dựng lại O(n). Fenwick tree cho cả cập nhật điểm và truy vấn prefix trong O(log n).
- "Gán nums[i] = v tương đương cộng delta = v - cur[i] vào vị trí i (nhớ lưu mảng cur để biết giá trị cũ). Cập nhật Fenwick: i += 1 rồi while i <= n thì tree[i] += delta và i += i & -i."
- "Truy vấn đoạn [l, r] = prefix(r + 1) - prefix(l), với prefix(i): while i > 0 thì cộng tree[i] rồi i -= i & -i. Chỉ thêm đáp án vào kết quả cho thao tác q."
