id: check-x793-second-highest
subtopic_id: cs.sql.classic_puzzles
secondary_subtopics: []
kind: check
title: 'Check X793: second highest score'
title_vi: 'Kiểm tra X793: điểm cao thứ hai với DISTINCT và OFFSET'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `second_highest(rows)`. `rows` is a list of `[name, score]` records (name is a string, score an int).
  Using the standard-library `sqlite3` module with an in-memory database (`sqlite3.connect(":memory:")`), create a
  table `t(name TEXT, score INTEGER)`, insert every row with a **parameterized** query
  (`cur.executemany("INSERT INTO t(name, score) VALUES (?, ?)", rows)`), then run
  `SELECT name FROM t WHERE score = (SELECT DISTINCT score FROM t ORDER BY score DESC LIMIT 1 OFFSET 1) ORDER BY name ASC`.
  Return the names as a flat **list** of strings (`[r[0] for r in cur.fetchall()]`), sorted ascending. The subquery picks
  the 2nd-highest **distinct** score; every name with that score is returned. If there are fewer than 2 distinct
  scores the subquery yields no row and the result is `[]`.
  For `rows = [["an", 9], ["binh", 7], ["chi", 9], ["dung", 7]]` the distinct scores are 9 and 7, so the result is
  `["binh", "dung"]`; for `[]` the result is `[]`.
statement_vi_md: |
  Cài `second_highest(rows)`. `rows` là list các bản ghi `[name, score]` (name là chuỗi, score là số nguyên). Dùng
  module `sqlite3` của thư viện chuẩn với database trong bộ nhớ (`sqlite3.connect(":memory:")`): tạo bảng
  `t(name TEXT, score INTEGER)`, chèn mọi dòng bằng câu SQL tham số hoá
  (`cur.executemany("INSERT INTO t(name, score) VALUES (?, ?)", rows)`), rồi chạy
  `SELECT name FROM t WHERE score = (SELECT DISTINCT score FROM t ORDER BY score DESC LIMIT 1 OFFSET 1) ORDER BY name ASC`.
  Trả về **list** phẳng các tên (chuỗi) (`[r[0] for r in cur.fetchall()]`), tăng dần. Truy vấn con chọn điểm cao thứ
  hai trong các điểm **khác nhau**; mọi tên có điểm đó đều được trả. Nếu có ít hơn 2 điểm khác nhau thì truy vấn con
  không ra dòng nào và kết quả là `[]`. Với `rows = [["an", 9], ["binh", 7], ["chi", 9], ["dung", 7]]` các điểm khác
  nhau là 9 và 7 nên kết quả là `["binh", "dung"]`; với `[]` kết quả là `[]`.
constraints:
- 'Dùng sqlite3 trong bộ nhớ và truy vấn con DISTINCT + ORDER BY DESC + LIMIT 1 OFFSET 1 như đề; chèn bằng câu SQL tham số hoá (dấu ?)'
- 'rows có thể rỗng; có thể ít hơn 2 điểm khác nhau (kết quả []); điểm có thể âm; tên có thể chứa dấu nháy'
- 'Kết quả là list phẳng các chuỗi, không phải list các tuple'
examples:
- input: 'rows = [["an", 9], ["binh", 7], ["chi", 9], ["dung", 7]]'
  output: '["binh", "dung"]'
  explain_vi: 'Điểm khác nhau là 9, 7; cao thứ hai là 7 nên trả binh và dung.'
