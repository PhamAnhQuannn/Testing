id: check-x898-knn-predict
subtopic_id: ml.classical.knn_nb_svm
secondary_subtopics: []
kind: check
title: 'Check: k-NN classifier from scratch with numpy'
title_vi: 'Kiểm tra: tự cài k-NN bằng numpy'
difficulty: easy
source:
  type: original
  rewrite_required: false
statement_en_md: |
  Implement `knn_predict(X_train, y_train, X_test, k)` with `numpy`. `X_train` is a list of points
  (each a list of floats), `y_train` the integer label of each training point, `X_test` the points
  to classify, `k` the number of neighbours. For each test point return the majority label of its
  `k` nearest training points by **Euclidean distance**.
  Tie rules (make the answer unique): pick neighbours by increasing distance, breaking distance ties
  by smaller training index; on a **vote tie** return the **smallest** label. Return a list of ints.
statement_vi_md: |
  Cài `knn_predict(X_train, y_train, X_test, k)` bằng `numpy`. `X_train` là danh sách điểm (mỗi điểm là
  danh sách số thực), `y_train` là nhãn nguyên của từng điểm huấn luyện, `X_test` là các điểm cần phân
  loại, `k` là số láng giềng. Với mỗi điểm test, trả nhãn đa số của `k` điểm huấn luyện gần nhất theo
  **khoảng cách Euclid**.
  Quy tắc phá hòa (để đáp án duy nhất): chọn láng giềng theo khoảng cách tăng dần, hòa khoảng cách thì
  lấy chỉ số nhỏ hơn; **hòa phiếu** thì trả **nhãn nhỏ nhất**. Trả về danh sách số nguyên.
constraints:
- 1 <= len(X_train) <= 500
- 1 <= k <= len(X_train)
examples:
- input: X_train = [[1,2],[2,3],[3,2],[6,6]], y_train = [1,0,1,0], X_test = [[2,2]], k = 3
  output: '[1]'
  explain_vi: Ba điểm gần nhất là A(1,2), B(2,3), C(3,2) với nhãn 1,0,1; bỏ phiếu nhãn 1 thắng 2-1.
