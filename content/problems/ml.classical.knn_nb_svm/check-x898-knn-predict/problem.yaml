- np.argsort(dist, kind="stable")[:k] cho k chỉ số gần nhất, hòa thì giữ thứ tự chỉ số.
- Bỏ phiếu bằng np.unique(labels, return_counts=True); hòa phiếu thì lấy nhãn nhỏ nhất.
