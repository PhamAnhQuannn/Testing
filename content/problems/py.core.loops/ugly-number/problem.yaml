kind: practice
title: "Ugly Number"
title_vi: "Số xấu (Ugly Number)"
difficulty: easy
source: {type: leetcode, lc: 263, rewrite_required: true}
statement_en_md: |
  An **ugly number** is a positive integer whose only prime factors are 2, 3 and 5.

  Given an integer `n`, return `True` if `n` is an ugly number, otherwise `False`. By convention
  `1` is ugly; zero and negative numbers are not.
statement_vi_md: |
  **Số xấu (ugly number)** là số nguyên dương mà các thừa số nguyên tố chỉ gồm 2, 3 và 5.

  Cho số nguyên `n`. Trả về `True` nếu `n` là số xấu, ngược lại trả `False`. Quy ước `1` là số
  xấu; `0` và số âm không phải.
constraints:
  - "-2^31 <= n <= 2^31 - 1"
examples:
  - {input: 'n = 6', output: "true", explain_vi: "6 = 2 * 3."}
  - {input: 'n = 1', output: "true", explain_vi: "1 không có thừa số nguyên tố nào, theo quy ước là số xấu."}
  - {input: 'n = 14', output: "false", explain_vi: "14 = 2 * 7, có thừa số nguyên tố 7."}
