hints:
  - "Số không dương (`n <= 0`) không bao giờ là số xấu: trả `False` ngay, kẻo vòng lặp chia mãi."
  - "Với mỗi thừa số p trong 2, 3, 5: trong khi `n % p == 0`, hãy chia `n //= p`."
  - "Sau khi bỏ hết thừa số 2, 3, 5, nếu `n` còn lại bằng 1 thì mọi thừa số nguyên tố đều là 2, 3 hoặc 5. Trả về `n == 1`."
