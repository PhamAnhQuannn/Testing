  approach_vi: Vòng for qua từng số bắt đầu, vòng while mô phỏng Collatz, theo dõi số bước lớn nhất (chỉ
    cập nhật khi lớn hơn để giữ số nhỏ nhất khi hòa).
  complexity: O(limit * steps)
