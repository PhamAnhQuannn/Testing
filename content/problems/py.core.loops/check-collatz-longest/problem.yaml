difficulty: easy
source:
  type: original
statement_en_md: 'Implement `longest_collatz(limit)` as in the Vietnamese statement: start in 1..limit
  with the most Collatz steps (smallest on ties).'
statement_vi_md: 'Với số nguyên n>1, một bước Collatz: nếu n chẵn thì n = n // 2, nếu lẻ thì n = 3n +
  1; lặp đến khi n = 1. Viết `longest_collatz(limit)` trả về số bắt đầu trong khoảng 1..limit (limit >=
  1) có số bước để về 1 nhiều nhất; nếu hòa thì trả số nhỏ nhất. Số 1 có 0 bước.'
constraints: []
examples:
- input: limit = 10
  output: '9'
  explain_vi: Ví dụ đầu tiên của đề kiểm tra.
