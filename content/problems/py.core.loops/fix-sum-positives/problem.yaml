id: fix-sum-positives
subtopic_id: py.core.loops
secondary_subtopics: []
kind: check
title: "Fix the bug: sum of positives"
title_vi: "Sửa bug: tổng các số dương"
difficulty: easy
source: {type: original, rewrite_required: false}
statement_en_md: |
  The function below was written by an AI and has a bug. Fix it so all tests pass.
  `sum_positives(nums)` returns the sum of the strictly positive numbers in `nums`
  (negatives and zeros are skipped).

statement_vi_md: |
  Hàm dưới đây do AI viết và có một bug. Hãy sửa để pass hết test.
  `sum_positives(nums)` trả về tổng các số dương (> 0) trong `nums`
  (số âm và số 0 bị bỏ qua).

constraints:
  - "0 <= len(nums) <= 200"
examples:
  - {input: 'nums = [1, -2, 3]', output: '4', explain_vi: "Bỏ -2, cộng 1 và 3."}
  - {input: 'nums = [-5, -1]', output: '0', explain_vi: "Không có số dương."}
io:
  mode: function
  entry: sum_positives
  params: [{name: nums, type: "list[int]"}]
  returns: "int"
  compare: exact
starter:
  python: |
    def sum_positives(nums):
        total = 0
        for n in nums:
            if n <= 0:
                break
            total += n
        return total
limits: {time_ms: 1000, memory_mb: 256, time_multiplier: {pyodide: 3}}
time_target_min: 5
hints:
  - "Thử nums = [1, -2, 3]: hàm trả 1 thay vì 4. Điều gì xảy ra sau khi gặp -2?"
  - "`break` thoát hẳn khỏi vòng lặp; `continue` chỉ bỏ qua vòng hiện tại."
  - "Thay `break` bằng `continue`."
solution:
  file: solution.py
  approach_vi: "Đổi break thành continue để chỉ bỏ qua phần tử không dương rồi chạy tiếp."
  complexity: "O(n) time, O(1) space"
tests:
  sample: tests/sample.jsonl
  hidden: tests/hidden.jsonl
  generator: tests/gen.py
tags: [check, fix-the-bug, loops, break-continue]
status: validated
version: 1
