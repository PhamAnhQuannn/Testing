hints:
- Duyệt từng cặp [a, b]; phép chia nào có thể gây lỗi? Loại exception nào?
- Trong vòng for, đặt a // b trong try và bắt ZeroDivisionError để thêm "error" vào kết quả.
- 'Khởi tạo result = []; với mỗi (a, b): thử result.append(a // b), nếu ZeroDivisionError thì result.append("error"); cuối cùng return result.'
