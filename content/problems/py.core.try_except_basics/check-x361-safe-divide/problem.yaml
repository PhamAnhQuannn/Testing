title: 'Check X361: safe_divide'
title_vi: 'Kiểm tra X361: safe_divide'
difficulty: easy
source:
  type: original
statement_en_md: |
  Implement `safe_divide(pairs)`. `pairs` is a list of `[a, b]` integer pairs. Return a list with
  `a // b` for each pair, in order; when `b` is 0 the result for that pair is the string `"error"`.
  Use `try/except ZeroDivisionError`.
statement_vi_md: Viết `safe_divide(pairs)`; `pairs` là list các cặp số nguyên `[a, b]`. Trả về list
  kết quả `a // b` cho từng cặp theo thứ tự; cặp nào có `b` bằng 0 thì kết quả là chuỗi `"error"`.
  Dùng `try/except ZeroDivisionError`.
constraints: []
examples:
- input: pairs = [[7, 2], [1, 0]]
  output: '[3, "error"]'
  explain_vi: 7 // 2 = 3; cặp thứ hai chia cho 0 nên là "error".
