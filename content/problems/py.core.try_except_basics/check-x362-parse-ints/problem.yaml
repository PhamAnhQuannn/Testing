time_target_min: 10
hints:
- Gọi int(token) trên token không hợp lệ gây loại exception nào? Làm sao để vòng lặp vẫn chạy tiếp?
- Trong vòng for, thử result.append(int(token)) bên trong try và bắt ValueError (không làm gì thêm).
- 'result = []; với mỗi token: thử n = int(token) rồi thêm n vào result; nếu ValueError thì bỏ qua; cuối cùng return result.'
solution:
  file: solution.py
  approach_vi: Duyệt từng token, thêm int(token) vào kết quả và bỏ qua ValueError.
  complexity: O(n)
