kind: check
title: 'Check X362: parse_ints'
title_vi: 'Kiểm tra X362: parse_ints'
difficulty: easy
source:
  type: original
statement_en_md: |
  Implement `parse_ints(tokens)`. `tokens` is a list of strings. Return the list of integers obtained
  with `int(token)`, keeping the original order and skipping every token that is not a valid integer
  (use `try/except ValueError`). Example: `["1", "x", " 3 ", "4.5"]` gives `[1, 3]`.
statement_vi_md: Viết `parse_ints(tokens)`; `tokens` là list các chuỗi. Trả về list các số nguyên đổi
  được bằng `int(token)`, giữ nguyên thứ tự và bỏ qua token không hợp lệ (dùng `try/except
  ValueError`). Ví dụ `["1", "x", " 3 ", "4.5"]` cho `[1, 3]`.
constraints: []
examples:
- input: tokens = ['1', 'x', ' 3 ', '4.5']
  output: '[1, 3]'
  explain_vi: '"x" và "4.5" gây ValueError nên bị bỏ qua; " 3 " vẫn đổi được thành 3.'
io:
  mode: function
  entry: parse_ints
  params:
  - name: tokens
    type: list[str]
  returns: list[int]
  compare: exact
starter:
  python: "def parse_ints(tokens):\n    # TODO: thử int(token), bắt ValueError và bỏ qua\n    pass\n"
limits:
  time_ms: 1000
