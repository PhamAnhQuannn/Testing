hints:
  - "Mỗi lần gặp số 0, đoạn số 1 đang đếm bị cắt đứt. Bạn cần nhớ những gì khi duyệt từ trái sang phải?"
  - "Giữ hai biến: run là độ dài đoạn số 1 đang đếm, best là độ dài dài nhất đã thấy."
  - "Với mỗi x: nếu x == 1 thì run += 1, ngược lại run = 0. Sau mỗi bước cập nhật best = max(best, run), nhờ vậy đoạn nằm cuối list cũng được tính."
