statement_en_md: |
  Given a binary array `nums`, return the maximum number of consecutive `1`s in the array.
statement_vi_md: |
  Cho list `nums` chỉ gồm các số 0 và 1. Trả về độ dài của đoạn liên tiếp dài nhất toàn số 1
  (nếu không có số 1 nào thì trả về 0).
constraints:
  - "1 <= len(nums) <= 10^5"
  - "nums[i] chỉ là 0 hoặc 1"
examples:
  - {input: "nums = [1, 1, 0, 1, 1, 1]", output: "3", explain_vi: "Hai đoạn toàn số 1 dài 2 và 3, đoạn dài nhất có 3 số."}
  - {input: "nums = [1, 0, 1, 1, 0, 1]", output: "2", explain_vi: "Đoạn dài nhất là hai số 1 ở giữa."}
