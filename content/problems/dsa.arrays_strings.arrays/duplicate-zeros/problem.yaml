id: duplicate-zeros
subtopic_id: dsa.arrays_strings.arrays
secondary_subtopics: []
kind: practice
title: "Duplicate Zeros"
title_vi: "Nhân đôi các số 0"
difficulty: easy
source: {type: leetcode, lc: 1089, rewrite_required: true}
statement_en_md: |
  Given a fixed-length integer array `arr`, duplicate each occurrence of zero, shifting the
  remaining elements to the right. Elements beyond the length of the original array are not
  written. Do the modifications **in place** to the input array and do not return anything.
statement_vi_md: |
  Cho list số nguyên `arr` có độ dài cố định. Với mỗi số 0, hãy viết nó thành hai số 0 liên tiếp
  và dời các phần tử đứng sau sang phải. Những phần tử bị đẩy ra ngoài độ dài ban đầu thì bỏ đi
  (list không được dài thêm). Sửa **tại chỗ** (in-place) trên chính `arr`, hàm không trả về gì.
constraints:
  - "1 <= len(arr) <= 10^5"
  - "0 <= arr[i] <= 9"
examples:
  - {input: "arr = [1, 0, 2, 3, 0, 4, 5, 0]", output: "[1, 0, 0, 2, 3, 0, 0, 4]", explain_vi: "Ba số 0 đều được nhân đôi, nhưng chỉ giữ 8 phần tử đầu; số 5 và 0 cuối bị đẩy ra."}
  - {input: "arr = [1, 2, 3]", output: "[1, 2, 3]", explain_vi: "Không có số 0 nên list giữ nguyên."}
io:
  mode: inplace
  entry: duplicate_zeros
  params: [{name: arr, type: "list[int]"}]
  inplace_arg: 0
  compare: exact
starter:
  python: |
    def duplicate_zeros(arr: list[int]) -> None:
        # TODO: sửa trực tiếp arr, không trả về gì
        pass
limits: {time_ms: 500, memory_mb: 256, time_multiplier: {pyodide: 3}}
time_target_min: 10
hints:
  - "Nếu dời phần tử từ trái sang phải, bạn sẽ ghi đè lên những phần tử chưa kịp đọc. Hãy nghĩ đến hướng ngược lại."
  - "Đếm trước số lượng số 0. Khi đó vị trí cuối cùng của arr[i] là i cộng số 0 nằm bên trái nó (thêm chính nó nếu nó là 0)."
  - "Duyệt i từ cuối về đầu, giữ biến zeros = số 0 trong arr[0..i]. Ghi arr[i + zeros] = arr[i] nếu chỉ số còn trong list; nếu arr[i] == 0 thì giảm zeros rồi ghi thêm một số 0 ở arr[i + zeros]."
solution:
  file: solution.py
  approach_vi: "Đếm số 0, rồi duyệt từ cuối về đầu, ghi mỗi phần tử vào vị trí mới (bỏ qua chỉ số vượt độ dài). O(n) thời gian, O(1) bộ nhớ phụ."
  complexity: "O(n) time, O(1) space"
