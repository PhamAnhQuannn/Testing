kind: practice
title: "Find Numbers with Even Number of Digits"
title_vi: "Đếm số có số chữ số chẵn"
difficulty: easy
source: {type: leetcode, lc: 1295, rewrite_required: true}
statement_en_md: |
  Given an array `nums` of integers, return how many of them contain an even number of digits.
statement_vi_md: |
  Cho list số nguyên dương `nums`. Đếm xem có bao nhiêu số mà số chữ số của nó là số chẵn
  (ví dụ 12 có 2 chữ số, 7896 có 4 chữ số; còn 345 có 3 chữ số thì không tính).
constraints:
  - "1 <= len(nums) <= 4 * 10^4"
  - "1 <= nums[i] < 10^6"
examples:
  - {input: "nums = [12, 345, 2, 6, 7896]", output: "2", explain_vi: "12 có 2 chữ số và 7896 có 4 chữ số; 345 có 3, còn 2 và 6 chỉ có 1."}
  - {input: "nums = [555, 901, 482, 1771]", output: "1", explain_vi: "Chỉ có 1771 có số chữ số chẵn (4)."}
io:
  mode: function
  entry: find_numbers
  params: [{name: nums, type: "list[int]"}]
  returns: int
  compare: exact
starter:
  python: |
    def find_numbers(nums: list[int]) -> int:
