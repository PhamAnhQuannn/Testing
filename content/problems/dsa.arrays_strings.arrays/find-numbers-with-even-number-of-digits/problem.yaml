        pass
limits: {time_ms: 500, memory_mb: 256, time_multiplier: {pyodide: 3}}
time_target_min: 10
hints:
  - "Việc chính là đếm số chữ số của một số nguyên. Có cách nào biến số thành thứ mà len() đo được không?"
  - "len(str(x)) cho số chữ số của x. Còn chẵn hay lẻ thì xét phần dư khi chia cho 2."
  - "Duyệt từng x trong nums, nếu len(str(x)) % 2 == 0 thì tăng biến đếm lên 1; cuối cùng trả về biến đếm."
solution:
