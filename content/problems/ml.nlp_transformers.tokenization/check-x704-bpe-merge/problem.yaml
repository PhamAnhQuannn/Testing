hints:
- Dùng vòng while với chỉ số i, vì khi gộp phải nhảy qua 2 phần tử.
- Kiểm tra i + 1 < len(tokens) trước khi so sánh tokens[i + 1] với pair[1].
- "Khớp thì append pair[0] + pair[1] và i += 2; không khớp thì append tokens[i] và i += 1."
