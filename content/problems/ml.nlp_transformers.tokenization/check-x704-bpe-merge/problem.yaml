id: check-x704-bpe-merge
subtopic_id: ml.nlp_transformers.tokenization
secondary_subtopics: []
kind: check
title: 'Check X704: BPE merge step'
title_vi: 'Kiểm tra X704: một bước merge BPE'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `apply_merge(tokens, pair)`, one merge step of byte-pair encoding. `tokens` is a list of strings
  and `pair` is a list `[a, b]` of two strings. Scan left to right; whenever `tokens[i] == a` and
  `tokens[i + 1] == b`, output the single token `a + b` and skip both. Merges never overlap.
  Return the new list. For `["l", "o", "w", "e", "r"]` and `["l", "o"]` the result is `["lo", "w", "e", "r"]`.
statement_vi_md: |
  Cài `apply_merge(tokens, pair)`, một bước merge của byte-pair encoding. `tokens` là list string, `pair` là list
  `[a, b]` gồm hai string. Quét trái sang phải; khi `tokens[i] == a` và `tokens[i + 1] == b` thì xuất một token `a + b`
  và bỏ qua cả hai. Các lần gộp không chồng lấn. Trả list mới. Với `["l", "o", "w", "e", "r"]` và `["l", "o"]`
  kết quả là `["lo", "w", "e", "r"]`.
constraints:
- 'tokens có thể rỗng; mỗi token là string khác rỗng'
- 'pair luôn là list đúng 2 string'
examples:
- input: 'tokens = ["l", "o", "w", "e", "r"], pair = ["l", "o"]'
  output: '["lo", "w", "e", "r"]'
  explain_vi: 'Hai token đầu là l, o khớp pair nên gộp thành lo; các token còn lại giữ nguyên.'
io:
  mode: function
  entry: apply_merge
  params:
  - name: tokens
    type: list
  - name: pair
    type: list
  returns: list
  compare: exact
