statement_en_md: |
  Implement `mse(y_true, y_pred)`: mean squared error `(1/n) * sum((y_pred - y_true)^2)` over two numeric
  lists of equal length. Return a float `round(result, 6)`. If the lists are empty, return `0.0`.
statement_vi_md: |
  Cài `mse(y_true, y_pred)`: mean squared error `(1/n) * sum((y_pred - y_true)^2)` trên hai danh sách số cùng
  độ dài. Trả float `round(kết quả, 6)`. Nếu danh sách rỗng trả `0.0`.
constraints:
- 0 <= len(y_true) == len(y_pred) <= 1000
examples:
- input: y_true = [2, 4, 6], y_pred = [3, 4, 9]
  output: '3.333333'
  explain_vi: Sai số -1, 0, -3 nên (1 + 0 + 9) / 3.
