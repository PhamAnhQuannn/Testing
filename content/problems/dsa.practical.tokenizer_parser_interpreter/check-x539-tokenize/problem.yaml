id: check-x539-tokenize
subtopic_id: dsa.practical.tokenizer_parser_interpreter
secondary_subtopics: []
kind: check
title: 'Check X539: tokenize'
title_vi: 'Kiểm tra X539: tokenize'
difficulty: easy
source:
  type: original
statement_en_md: |
  Write `tokenize(expr)`: split an arithmetic expression string into tokens. A token is either one of the
  single characters `+ - * / ( )` or a multi-digit non-negative integer (longest match: consecutive digits
  form ONE token). Spaces are ignored and never produce tokens. Return the list of token strings in order.
  For example `"12+3*(4-5)"` gives `["12", "+", "3", "*", "(", "4", "-", "5", ")"]`.
statement_vi_md: |
  Viết `tokenize(expr)`: cắt chuỗi biểu thức số học thành các token. Token là một trong các ký tự đơn
  `+ - * / ( )` hoặc một số nguyên không âm nhiều chữ số (khớp dài nhất: các chữ số liên tiếp tạo thành
  MỘT token). Bỏ qua khoảng trắng, không sinh token cho khoảng trắng. Trả về danh sách các chuỗi token
  theo thứ tự. Ví dụ `"12+3*(4-5)"` cho `["12", "+", "3", "*", "(", "4", "-", "5", ")"]`.
constraints:
- 1 <= len(expr) <= 200
- expr chỉ gồm chữ số, khoảng trắng và các ký tự + - * / ( )
- mọi số là số nguyên không âm (không có dấu âm đứng trước số)
examples:
- input: expr = "12+3*(4-5)"
  output: '["12","+","3","*","(","4","-","5",")"]'
  explain_vi: '"12" là một token (hai chữ số liền nhau), các dấu và ngoặc là token đơn.'
io:
  mode: function
  entry: tokenize
  params:
  - name: expr
    type: str
  returns: any
  compare: exact
starter:
  python: |
    def tokenize(expr):
        # TODO: duyệt từng ký tự; chữ số thì đọc hết dãy chữ số liền nhau thành 1 token
        return []
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 8
hints:
- Duyệt chuỗi bằng chỉ số i. Khoảng trắng thì bỏ qua; một trong "+-*/()" thì thêm đúng ký tự đó làm token.
- Khi gặp chữ số, đặt j = i rồi tăng j trong khi expr[j] còn là chữ số; token là expr[i:j], sau đó nhảy i = j.
- Nhớ kiểm tra j < len(expr) trước khi đọc expr[j]. Mỗi nhánh phải tiến i lên ít nhất 1 để không lặp vô hạn.
solution:
  file: solution.py
  approach_vi: Quét một lượt với con trỏ i; số thì mở rộng con trỏ j tới hết dãy chữ số (khớp dài nhất), dấu và ngoặc là token đơn.
  complexity: O(n) / O(n)
