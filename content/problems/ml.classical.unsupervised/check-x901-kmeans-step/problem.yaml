id: check-x901-kmeans-step
subtopic_id: ml.classical.unsupervised
secondary_subtopics: []
kind: check
title: 'Check: one k-means iteration (1-D) with numpy'
title_vi: 'Kiểm tra: một vòng lặp k-means (1 chiều) với numpy'
difficulty: easy
source:
  type: original
  rewrite_required: false
statement_en_md: |
  Implement `kmeans_step(xs, centroids)` with `numpy`: one iteration of 1-D k-means. `xs` is a list
  of numbers, `centroids` the current centroids. Assign each point to the nearest centroid, then
  return the new centroids — the mean of the points assigned to each, rounded to 6 decimals.
  Rules (unique answer): a distance tie goes to the **lower-index** centroid; an **empty cluster
  keeps its old centroid**.
statement_vi_md: |
  Cài `kmeans_step(xs, centroids)` bằng `numpy`: một vòng lặp k-means 1 chiều. `xs` là danh sách số,
  `centroids` là các tâm hiện tại. Gán mỗi điểm vào tâm gần nhất, rồi trả về các tâm mới — trung bình
  các điểm thuộc mỗi tâm, làm tròn 6 chữ số.
  Quy tắc (đáp án duy nhất): hòa khoảng cách thì về tâm **chỉ số nhỏ hơn**; cụm **rỗng thì giữ nguyên
  tâm cũ**.
constraints:
- 1 <= len(xs) <= 1000
- 1 <= len(centroids) <= len(xs) + 5
examples:
- input: xs = [1,2,3,10,11,12], centroids = [1,2]
  output: '[1.0, 7.6]'
  explain_vi: Điểm 1 về tâm 1; 2,3,10,11,12 về tâm 2. Tâm mới là trung bình mỗi cụm 1 và 7.6.
