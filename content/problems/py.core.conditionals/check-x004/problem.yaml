        pass
limits: {time_ms: 1000, memory_mb: 256, time_multiplier: {pyodide: 3}}
time_target_min: 5
hints:
  - "`n % 3 == 0` nghĩa là n chia hết cho 3."
  - "Kiểm tra trường hợp chia hết cho cả 3 và 5 (`n % 15 == 0`) trước các trường hợp riêng lẻ."
  - "Chuỗi if/elif/elif/else: `n % 15 == 0` -> \"FizzBuzz\"; `n % 3 == 0` -> \"Fizz\"; `n % 5 == 0` -> \"Buzz\"; else `str(n)`."
solution:
