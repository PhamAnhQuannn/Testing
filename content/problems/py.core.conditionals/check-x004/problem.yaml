title: "Check X004: fizz_word"
title_vi: "Kiểm tra X004: fizz_word"
difficulty: easy
source:
  type: original
statement_en_md: |
  Implement `fizz_word(n)` for one positive integer `n`: return `"FizzBuzz"` if `n` is a multiple
  of both 3 and 5, `"Fizz"` if it is a multiple of 3 only, `"Buzz"` if it is a multiple of 5 only,
  otherwise `n` as a string. No loop needed.
statement_vi_md: |
  Viết `fizz_word(n)` cho một số nguyên dương `n`: trả `"FizzBuzz"` nếu `n` là bội của cả 3 và 5,
  `"Fizz"` nếu chỉ là bội của 3, `"Buzz"` nếu chỉ là bội của 5, còn lại trả `n` dạng chuỗi. Không
  cần vòng lặp.
constraints:
  - "1 <= n <= 10^4"
examples:
  - {input: 'n = 9', output: '"Fizz"', explain_vi: "9 chia hết cho 3 nhưng không chia hết cho 5."}
  - {input: 'n = 7', output: '"7"', explain_vi: "7 không chia hết cho 3 hay 5 nên trả về chuỗi \"7\"."}
io:
  mode: function
  entry: fizz_word
  params: [{name: n, type: int}]
  returns: str
  compare: exact
starter:
  python: |
