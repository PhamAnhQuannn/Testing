id: fizz-buzz
subtopic_id: py.core.conditionals
secondary_subtopics: []
kind: practice
title: "Fizz Buzz"
title_vi: "Fizz Buzz"
difficulty: easy
source: {type: leetcode, lc: 412, rewrite_required: true}
statement_en_md: |
  Given an integer `n`, return a list of `n` strings `answer` (`answer[i - 1]` is for the number
  `i`, counting from 1) where:

  - `"FizzBuzz"` if `i` is divisible by both 3 and 5,
  - `"Fizz"` if `i` is divisible by 3,
  - `"Buzz"` if `i` is divisible by 5,
  - otherwise `str(i)`.

  Note: building the whole list needs a `for` loop, which is taught right after this lesson
  (`py.core.loops`). The decision for each number is the `if/elif/else` chain from this lesson, so
  you can come back after the loops lesson if you have not reached it yet.
statement_vi_md: |
  Cho số nguyên `n`. Trả về list `answer` gồm `n` chuỗi, phần tử thứ `i` (đếm từ 1) là:

  - `"FizzBuzz"` nếu `i` chia hết cho cả 3 và 5,
  - `"Fizz"` nếu `i` chia hết cho 3,
  - `"Buzz"` nếu `i` chia hết cho 5,
  - ngược lại là `i` dạng chuỗi (`str(i)`).

  Lưu ý: để dựng cả list cần vòng lặp `for` (học ngay sau bài này ở `py.core.loops`). Phần quyết định
  cho từng số chính là chuỗi `if/elif/else` của bài này; nếu chưa học tới vòng lặp, bạn có thể quay
  lại làm sau.
constraints:
  - "1 <= n <= 10^4"
examples:
  - {input: 'n = 3', output: '["1", "2", "Fizz"]', explain_vi: "Số 3 chia hết cho 3 nên là Fizz."}
  - {input: 'n = 5', output: '["1", "2", "Fizz", "4", "Buzz"]', explain_vi: "Số 5 chia hết cho 5 nên là Buzz."}
  - {input: 'n = 15', output: '["1", "2", "Fizz", "4", "Buzz", "Fizz", "7", "8", "Fizz", "Buzz", "11", "Fizz", "13", "14", "FizzBuzz"]', explain_vi: "Số 15 chia hết cho cả 3 và 5 nên là FizzBuzz: phải kiểm tra trường hợp này trước."}
