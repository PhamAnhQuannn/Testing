kind: check
title: 'Check X310: classify_triangle'
title_vi: 'Kiểm tra X310: classify_triangle: phân loại tam giác'
difficulty: easy
source:
  type: original
statement_en_md: 'Implement `classify_triangle(a, b, c)` as in the Vietnamese statement: ''invalid'',
  or equilateral/isosceles/scalene plus '' right'' for right triangles.'
statement_vi_md: Viết `classify_triangle(a, b, c)` nhận ba cạnh nguyên. Trả `"invalid"` nếu có cạnh <=
  0 hoặc không thỏa bất đẳng thức tam giác (tổng hai cạnh nhỏ hơn hoặc bằng cạnh còn lại coi là không
  hợp lệ). Ngược lại trả `"equilateral"` (3 cạnh bằng nhau), `"isosceles"` (đúng 2 cạnh bằng nhau) hoặc
  `"scalene"` (3 cạnh khác nhau); nếu tam giác vuông (a²+b²=c² với c là cạnh lớn nhất) thì thêm hậu tố
  `" right"`, ví dụ `"scalene right"`.
constraints: []
examples:
- input: a = 3, b = 4, c = 5
  output: '"scalene right"'
  explain_vi: Ví dụ đầu tiên của đề kiểm tra.
io:
  mode: function
  entry: classify_triangle
  params:
