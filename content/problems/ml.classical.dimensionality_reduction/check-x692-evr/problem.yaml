title: 'Check X692: explained variance ratio'
title_vi: 'Kiểm tra X692: explained variance ratio'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `explained_variance_ratio(variances)`. `variances` is a list of non-negative variances of
  PCA components. Return each variance divided by the total, sorted in descending order, each rounded
  to 6 decimals. If the total is 0, return a list of `0.0` with the same length.
  For `variances = [4.0, 1.0]` the result is `[0.8, 0.2]`.
statement_vi_md: |
  Cài `explained_variance_ratio(variances)`. `variances` là list phương sai không âm của các thành phần PCA.
  Trả mỗi phương sai chia cho tổng, sắp giảm dần, làm tròn 6 chữ số. Nếu tổng bằng 0, trả list toàn `0.0`
  cùng độ dài. Với `variances = [4.0, 1.0]` kết quả là `[0.8, 0.2]`.
constraints:
- 1 <= len(variances) <= 1000
- Mọi phương sai >= 0
examples:
- input: variances = [4.0, 1.0]
  output: '[0.8, 0.2]'
  explain_vi: Tổng là 5; 4/5 = 0.8 và 1/5 = 0.2, đã giảm dần.
