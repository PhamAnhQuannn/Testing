id: check-x751-group-sum
subtopic_id: py.ecosystem.pandas_basics
secondary_subtopics: []
kind: check
title: 'Check X751: group sum'
title_vi: 'Kiểm tra X751: tổng theo nhóm (mô phỏng groupby)'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `group_sum(rows)`, a pure-Python mimic of `df.groupby("key")["value"].sum()`. `rows` is a list of
  `[key, value]` pairs (key is a string, value an int). Group the rows by key, add up the values of each group, and
  return a list of `[key, total]` pairs, each pair a 2-element **list** (not a tuple), sorted by key ascending.
  For `rows = [["a", 3], ["b", 2], ["a", 5]]` the result is `[["a", 8], ["b", 2]]`; for `[]` the result is `[]`.
statement_vi_md: |
  Cài `group_sum(rows)`, mô phỏng bằng Python thuần của `df.groupby("key")["value"].sum()`. `rows` là list các cặp
  `[key, value]` (key là chuỗi, value là số nguyên). Gom theo key, cộng value của từng nhóm và trả về list các cặp
  `[key, total]`, mỗi cặp là **list** 2 phần tử (không phải tuple), sắp theo key tăng dần.
  Với `rows = [["a", 3], ["b", 2], ["a", 5]]` kết quả là `[["a", 8], ["b", 2]]`; với `[]` kết quả là `[]`.
constraints:
- 'Không dùng pandas; chỉ dùng Python thuần (dict, sorted)'
- 'rows có thể rỗng (kết quả []); value có thể bằng 0 hoặc âm; key có thể chứa dấu nháy'
- 'Mỗi phần tử kết quả phải là list [key, total], không phải tuple'
examples:
- input: 'rows = [["a", 3], ["b", 2], ["a", 5]]'
  output: '[["a", 8], ["b", 2]]'
  explain_vi: 'a = 3 + 5 = 8, b = 2; sắp theo key tăng dần.'
