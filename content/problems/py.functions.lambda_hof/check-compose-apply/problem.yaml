        pass
limits: {time_ms: 1000, memory_mb: 256, time_multiplier: {pyodide: 3}}
time_target_min: 12
hints:
  - "Viết các nhà máy `lambda n: (lambda v: v + n)` trong dict; mỗi spec tạo ra một hàm đã nhớ `n` của nó."
  - "Ghép bằng `functools.reduce(lambda acc, f: f(acc), funcs, v)` để áp dụng từ trái sang phải."
  - "Cẩn thận late binding: nếu tạo lambda trong vòng lặp mà không truyền `n` qua tham số của nhà máy hoặc giá trị mặc định thì mọi hàm sẽ dùng chung n cuối cùng."
solution:
