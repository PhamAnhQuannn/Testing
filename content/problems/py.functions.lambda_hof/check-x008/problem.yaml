id: check-x008
subtopic_id: py.functions.lambda_hof
secondary_subtopics: []
kind: check
title: "Check X008: run_pipeline"
title_vi: "Kiểm tra X008: run_pipeline"
difficulty: easy
source:
  type: original
statement_en_md: |
  Implement `run_pipeline(x, ops)`. `x` is an integer and `ops` is a list of operation names, each
  one of `"inc"` (add 1), `"double"` (multiply by 2), `"square"` (x * x) or `"neg"` (negate).
  Apply the operations in order, left to right, starting from `x`, and return the final integer.
  If `ops` is empty, return `x`.
statement_vi_md: |
  Viết `run_pipeline(x, ops)`. `x` là số nguyên, `ops` là list tên phép biến đổi, mỗi tên là một
  trong `"inc"` (cộng 1), `"double"` (nhân 2), `"square"` (bình phương) hoặc `"neg"` (đổi dấu).
  Áp dụng lần lượt các phép theo thứ tự từ trái sang phải, bắt đầu từ `x`, rồi trả về số cuối
  cùng. `ops` rỗng thì trả về `x`.
constraints:
  - "-100 <= x <= 100"
  - "0 <= len(ops) <= 6"
examples:
  - {input: 'x = 3, ops = ["inc", "double"]', output: "8", explain_vi: "3 -> 4 (inc) -> 8 (double)."}
  - {input: 'x = 3, ops = ["double", "inc"]', output: "7", explain_vi: "Thứ tự quan trọng: 3 -> 6 -> 7."}
io:
  mode: function
  entry: run_pipeline
  params: [{name: x, type: int}, {name: ops, type: "list[str]"}]
  returns: int
  compare: exact
starter:
  python: |
    def run_pipeline(x, ops):
        # TODO: dict tên -> hàm (lambda), rồi áp dụng từng phép trong ops lên x
        pass
limits: {time_ms: 1000, memory_mb: 256, time_multiplier: {pyodide: 3}}
time_target_min: 8
hints:
  - "Mỗi tên phép gắn với một hàm một tham số. Một dict `{\"inc\": lambda v: v + 1, ...}` cho phép tra hàm theo tên."
  - "Duyệt `for name in ops:` rồi cập nhật `x = bang[name](x)`: lấy hàm từ dict bằng tên, rồi gọi nó."
  - "Sau vòng lặp `return x`. Với `ops` rỗng vòng lặp không chạy nên tự trả `x`."
solution:
  file: solution.py
  approach_vi: "Dict tên -> lambda rồi áp dụng tuần tự. O(len(ops))."
  complexity: "O(len(ops)) time, O(1) space"
tests:
  sample: tests/sample.jsonl
  hidden: tests/hidden.jsonl
  generator: tests/gen.py
tags: [check, x008, lambda, dict-of-functions]
status: validated
version: 1
