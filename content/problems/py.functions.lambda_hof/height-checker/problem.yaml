        pass
limits: {time_ms: 200, memory_mb: 256, time_multiplier: {pyodide: 3}}
time_target_min: 10
hints:
  - "Bạn cần hai list: list gốc và list đã sắp xếp. Phải còn giữ nguyên list gốc để so sánh."
  - "`sorted(heights)` trả về list mới và không đổi `heights`; `heights.sort()` thì sửa tại chỗ và trả `None`."
  - "Ghép cặp bằng `zip(heights, sorted(heights))` rồi đếm cặp khác nhau: `sum(1 for a, b in zip(...) if a != b)`."
solution:
