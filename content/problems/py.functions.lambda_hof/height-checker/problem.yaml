id: height-checker
subtopic_id: py.functions.lambda_hof
secondary_subtopics: []
kind: practice
title: "Height Checker"
title_vi: "Kiểm tra chiều cao hàng đứng"
difficulty: easy
source: {type: leetcode, lc: 1051, rewrite_required: true}
statement_en_md: |
  A school wants every student to stand in a line in non-decreasing order of height. `heights[i]`
  is the height of the i-th student in the current line. Let `expected` be the same heights sorted
  in non-decreasing order. Return the number of indices `i` where `heights[i] != expected[i]`.
statement_vi_md: |
  Một trường muốn xếp học sinh thành hàng theo chiều cao **không giảm**. `heights[i]` là chiều
  cao của học sinh thứ i trong hàng hiện tại. Gọi `expected` là chính các chiều cao đó đã sắp xếp
  không giảm. Trả về số vị trí `i` mà `heights[i] != expected[i]`.
constraints:
  - "1 <= len(heights) <= 100"
  - "1 <= heights[i] <= 100"
examples:
  - {input: "heights = [1, 1, 4, 2, 1, 3]", output: "3", explain_vi: "expected = [1, 1, 1, 2, 3, 4]; vị trí 2, 4, 5 khác nhau (4 vs 1, 1 vs 3, 3 vs 4)."}
  - {input: "heights = [1, 2, 3, 4, 5]", output: "0", explain_vi: "Đã đúng thứ tự nên không có vị trí nào khác."}
io:
  mode: function
  entry: height_checker
  params: [{name: heights, type: "list[int]"}]
  returns: int
  compare: exact
