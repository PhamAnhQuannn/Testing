id: check-x802-index-lookup
subtopic_id: cs.databases.indexing_btree
secondary_subtopics: []
kind: check
title: 'Check X802: index lookup'
title_vi: 'Kiểm tra X802: tra cứu điểm trên index bằng tìm nhị phân'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `index_lookup(sorted_keys, targets)`, a model of a point lookup on a B-tree index.
  `sorted_keys` is a list of integers in **strictly ascending** order (no duplicates); `targets` is a list of
  integers to look up. For each target, run a **binary search** and return its 0-based position in
  `sorted_keys`, or `-1` if it is absent. Return the list of positions, one per target, in the same order.
  For `sorted_keys = [10, 20, 30, 40]`, `targets = [30, 25, 10]` the result is `[2, -1, 0]`;
  an empty `targets` gives `[]`.
statement_vi_md: |
  Cài `index_lookup(sorted_keys, targets)`, mô hình tra cứu điểm trên index B-tree. `sorted_keys` là list số
  nguyên **tăng ngặt** (không trùng); `targets` là list các giá trị cần tìm. Với mỗi target hãy dùng
  **tìm kiếm nhị phân** và trả về vị trí (chỉ số từ 0) trong `sorted_keys`, hoặc `-1` nếu không có. Trả về list
  vị trí, mỗi target một phần tử, đúng thứ tự. Với `sorted_keys = [10, 20, 30, 40]`, `targets = [30, 25, 10]`
  kết quả là `[2, -1, 0]`; `targets` rỗng cho `[]`.
constraints:
- 'sorted_keys tăng ngặt, không trùng, có thể rỗng'
- 'targets có thể rỗng, khi đó kết quả là []'
- 'Mỗi tra cứu phải là tìm nhị phân O(log n), không dùng list.index'
examples:
- input: 'sorted_keys = [10, 20, 30, 40], targets = [30, 25, 10]'
  output: '[2, -1, 0]'
  explain_vi: '30 ở chỉ số 2, 25 không có nên -1, 10 ở chỉ số 0.'
io:
  mode: function
  entry: index_lookup
  params:
  - name: sorted_keys
    type: list
  - name: targets
    type: list
  returns: list
  compare: exact
