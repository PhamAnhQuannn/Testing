title: 'Check X430: cycle_start'
title_vi: 'Kiểm tra X430: cycle_start'
difficulty: easy
source:
  type: original
statement_en_md: 'Implement `cycle_start(values, pos)`: build the list as in has_cycle (last node links to index `pos`, -1 means no cycle). Return the 0-based index of the node where the cycle begins, or -1 if there is no cycle. O(n) time, O(1) extra space; return an int, never a node.'
statement_vi_md: 'Viết `cycle_start(values, pos)`: dựng list như has_cycle. Trả chỉ số (từ 0) của node mở đầu chu trình, hoặc -1 nếu không có chu trình. O(n) thời gian, O(1) bộ nhớ phụ; chỉ trả số nguyên.'
constraints: []
examples:
- input: values = [3, 2, 0, -4], pos = 1
  output: '1'
  explain_vi: Ví dụ đầu tiên của đề kiểm tra (driver của mục).
io:
  mode: function
  entry: cycle_start
  params:
  - name: values
    type: list[int]
  - name: pos
    type: int
  returns: int
  compare: exact
starter:
  python: |
    def cycle_start(values, pos):
        # TODO
        pass
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 12
hints:
- Đọc kỹ đề và ví dụ, xác định rõ đầu vào và đầu ra của `cycle_start` trước khi viết code.
- Tự dựng Node từ `values`, nối node cuối tới node `pos` nếu `pos >= 0`; cho slow đi 1 bước, fast đi 2 bước.
- 'Sau khi slow và fast gặp nhau, đặt một con trỏ về head; cho nó và slow cùng đi 1 bước tới khi gặp nhau, rồi đếm chỉ số node đó từ head.'
solution:
  file: solution.py
  approach_vi: Floyd fast/slow trên list dựng nội bộ từ values và pos.
  complexity: O(n) / O(1)
