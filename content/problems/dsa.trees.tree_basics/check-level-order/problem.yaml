statement_en_md: "Implement `level_order(flat)`: `flat` is a binary tree in BFS array form (`None` for a missing node; children of missing nodes are not listed). Build the tree and return its level-order traversal as a list of per-level lists, left to right. Empty tree returns `[]`."
statement_vi_md: "Viết `level_order(flat)`: `flat` là cây nhị phân dạng mảng BFS (theo level, `None` là node vắng; con của node vắng không được liệt kê). Dựng cây rồi trả về duyệt theo tầng: list các list giá trị, trái sang phải. Cây rỗng (`[]` hoặc `[None]`) trả về `[]`."
constraints: []
examples:
- input: "flat = [3, 9, 20, None, None, 15, 7]"
  output: "[[3], [9, 20], [15, 7]]"
  explain_vi: Ví dụ đầu tiên của đề kiểm tra.
