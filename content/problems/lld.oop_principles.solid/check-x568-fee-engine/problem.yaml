kind: check
title: 'Check X568: fee engine'
title_vi: 'Kiểm tra X568: fee engine'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `total_fee(items)` in an open/closed style: each item is `[kind, base]` (a string and an int).
  The fee of one item is `base * multiplier(kind)` where `bike` = 1, `car` = 2, `truck` = 3, and any
  unknown kind uses multiplier 1 (fee = base). Return the sum of all fees as an int (0 for no items).
  Keep the rules in a lookup table so adding a new kind means adding data, not another `if/elif` branch.
statement_vi_md: |
  Cài `total_fee(items)` theo tinh thần OCP: mỗi phần tử là `[kind, base]` (chuỗi và số nguyên). Phí một
  phần tử là `base * hệ số(kind)` với `bike` = 1, `car` = 2, `truck` = 3, loại lạ dùng hệ số 1 (phí = base).
  Trả về tổng phí kiểu int (0 nếu không có phần tử). Hãy đặt luật vào bảng tra (dict) để thêm loại mới chỉ
  là thêm dữ liệu, không thêm nhánh `if/elif`.
constraints:
- 0 <= len(items) <= 1000
- 0 <= base <= 100000
- kind is a lowercase string
examples:
- input: items = [["bike", 100], ["car", 50]]
  output: '200'
  explain_vi: bike 100*1 = 100, car 50*2 = 100, tổng 200.
io:
  mode: function
  entry: total_fee
  params:
  - name: items
    type: list[list]
  returns: int
  compare: exact
