id: check-x619-ride-match
subtopic_id: lld.problems.ride_hailing
secondary_subtopics: []
kind: check
title: 'Check X619: Ride matching'
title_vi: 'Kiểm tra X619: Ghép tài xế gần nhất'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Core of a ride-hailing matcher on a 1-D line. Failure is reported through return values (never raise).

  Implement `class RideSystem` with:

  - `RideSystem()`: no drivers yet.
  - `add_driver(driver_id, pos)`: registers an available driver (`driver_id` an int) at int position `pos`. Returns nothing.
  - `request(rider_pos)`: finds the available driver with the smallest `|pos - rider_pos|` (ties broken by the smaller `driver_id`), marks that driver busy and returns their `int` id. Returns `-1` if no driver is available.
  - `complete(driver_id)`: frees that driver. Returns nothing.
  - `available_count()`: returns the `int` number of free drivers.
statement_vi_md: |
  Lõi của bộ ghép cặp đặt xe trên một trục số (1 chiều). Thất bại được báo qua giá trị trả về (không ném lỗi).

  Viết `class RideSystem` với:

  - `RideSystem()`: ban đầu chưa có tài xế.
  - `add_driver(driver_id, pos)`: đăng ký một tài xế đang rảnh (`driver_id` là số nguyên) ở vị trí nguyên `pos`. Không trả gì.
  - `request(rider_pos)`: chọn tài xế rảnh có `|pos - rider_pos|` nhỏ nhất (hòa thì lấy `driver_id` nhỏ hơn), đánh dấu bận và trả `int` id của tài xế đó. Không có tài xế rảnh thì trả `-1`.
  - `complete(driver_id)`: trả tài xế về trạng thái rảnh. Không trả gì.
  - `available_count()`: trả số tài xế đang rảnh (`int`).
constraints:
- 'driver_id và vị trí là số nguyên.'
- 'Không dùng thread, time hay random.'
examples:
- input: ops = ['RideSystem', 'add_driver', 'add_driver', 'request', 'available_count'], args = [[], [1, 10], [2, 5], [6], []]
  output: '[null, null, null, 2, 1]'
  explain_vi: 'Tài xế 2 ở vị trí 5 cách khách (6) một đơn vị, gần hơn tài xế 1 ở 10; tài xế 2 bận nên còn 1 người rảnh.'
io:
  mode: class_ops
  compare: exact
starter:
  python: "class RideSystem:\n    # TODO\n    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 8
hints:
- 'Giữ hai dict: pos (id -> vị trí) và free (id -> rảnh hay không).'
- 'Duyệt `sorted(pos)` và chỉ thay ứng viên khi khoảng cách NHỎ HƠN hẳn: hòa thì giữ id nhỏ hơn đến trước.'
- 'Không có tài xế rảnh thì trả -1 và không đổi gì.'
solution:
  file: solution.py
  approach_vi: Duyệt tài xế theo id tăng dần, giữ ứng viên có khoảng cách nhỏ nhất (so sánh chặt nên hòa chọn id nhỏ).
  complexity: O(D log D) mỗi request
tests:
  sample: tests/sample.jsonl
  hidden: tests/hidden.jsonl
  generator: tests/gen.py
tags:
- check
- x619
status: validated
