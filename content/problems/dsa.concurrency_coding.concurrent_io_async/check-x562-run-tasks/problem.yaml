title: 'Check X562: run_tasks'
title_vi: 'Kiểm tra X562: run_tasks'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Simulate concurrent I/O. `tasks` is a list of `[start, duration, id]` (all ints). Every task starts at its
  `start` time and all tasks run concurrently (no limit), so task `i` finishes at `start + duration`.
  Return the list of ids in completion order: sorted by finish time ascending, ties broken by smaller id first.
statement_vi_md: |
  Mô phỏng I/O đồng thời. `tasks` là list các `[start, duration, id]` (số nguyên). Mỗi task bắt đầu tại `start`
  và mọi task chạy đồng thời (không giới hạn), nên task kết thúc lúc `start + duration`. Trả list `id` theo thứ
  tự hoàn thành: finish time tăng dần, hòa thì id nhỏ hơn đứng trước.
constraints:
- 0 <= len(tasks) <= 1000
- 0 <= start <= 1000
- 0 <= duration <= 1000
- ids are distinct integers
examples:
- input: tasks = [[0, 5, 1], [0, 3, 2], [2, 1, 3]]
  output: '[2, 3, 1]'
  explain_vi: Task 1 xong lúc 5, task 2 lúc 3, task 3 lúc 3. Hai task xong lúc 3 xếp theo id (2 rồi 3), sau đó task 1.
io:
  mode: function
  entry: run_tasks
  params:
  - name: tasks
    type: list[list[int]]
  returns: list[int]
  compare: exact
