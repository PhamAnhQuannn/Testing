statement_en_md: 'Implement `parse_csv(text)`: parse a CSV string (first row is the
  header) into a list of dicts of strings; skip blank lines; empty input gives `[]`.'
statement_vi_md: Viết `parse_csv(text)` nhận một chuỗi CSV (dòng đầu là tiêu đề) và
  trả về list các dict, mỗi dict ứng với một dòng dữ liệu (khoá lấy từ tiêu đề, giá
  trị giữ nguyên là chuỗi). Bỏ qua dòng trống; chuỗi rỗng trả `[]`. Dùng `csv.reader`
  với `io.StringIO`.
