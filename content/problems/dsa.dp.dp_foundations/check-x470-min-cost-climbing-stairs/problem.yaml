statement_en_md: |
  You are given `cost`, where `cost[i]` is the price of stepping off step `i`. You may start at
  index 0 or index 1. From step `i` you pay `cost[i]` and climb 1 or 2 steps. Return the minimum total
  cost to reach the top, which is the position just past the last step (index `len(cost)`).
statement_vi_md: |
  Viết `min_cost_climbing_stairs(cost)`: `cost[i]` là chi phí khi bước ra khỏi bậc `i`. Có thể bắt
  đầu từ bậc 0 hoặc bậc 1; mỗi lần trả `cost[i]` của bậc đang đứng rồi leo 1 hoặc 2 bậc. Trả về tổng chi
  phí nhỏ nhất để lên tới đỉnh, tức vị trí ngay sau bậc cuối (chỉ số `len(cost)`).
constraints:
- 2 <= len(cost) <= 1000
- 0 <= cost[i] <= 999
examples:
- input: cost = [10, 15, 20]
  output: '15'
  explain_vi: "Bắt đầu ở bậc 1, trả 15 rồi leo 2 bậc tới đỉnh; tổng 15."
