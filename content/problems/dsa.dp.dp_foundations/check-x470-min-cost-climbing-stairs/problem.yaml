- "Tới vị trí i từ i-1 (trả cost[i-1]) hoặc từ i-2 (trả cost[i-2]). Vậy dp[i] = min(dp[i-1] + cost[i-1], dp[i-2] + cost[i-2]) với dp[0] = dp[1] = 0."
