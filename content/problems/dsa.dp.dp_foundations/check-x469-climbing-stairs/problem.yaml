title: 'Check X469: climb_stairs'
title_vi: 'Kiểm tra X469: climb_stairs'
difficulty: easy
source:
  type: leetcode
  lc: 70
  rewrite_required: true
statement_en_md: |
  You are climbing a staircase with `n` steps. Each move climbs either 1 or 2 steps. Return the
  number of distinct ways to reach the top (step `n`). Dynamic programming: `ways[i] = ways[i-1] +
  ways[i-2]`, which needs only the previous two values.
statement_vi_md: |
  Viết `climb_stairs(n)`: cầu thang có `n` bậc, mỗi lần leo 1 hoặc 2 bậc. Trả về số cách phân biệt
  để leo lên đúng bậc `n`. Gợi ý: quy hoạch động `ways[i] = ways[i-1] + ways[i-2]`, chỉ cần hai giá trị
  gần nhất.
constraints:
- 1 <= n <= 45
examples:
- input: n = 3
  output: '3'
  explain_vi: "Có 3 cách: 1+1+1, 1+2, 2+1."
io:
  mode: function
  entry: climb_stairs
  params:
  - name: n
    type: int
  returns: int
  compare: exact
starter:
  python: |
    def climb_stairs(n):
        # TODO: ways[i] = ways[i-1] + ways[i-2]
        return 0
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 8
hints:
- "Bước cuối cùng chỉ có thể là leo 1 bậc hoặc 2 bậc. Số cách tới bậc n liên quan gì tới hai bậc ngay trước?"
- "Đặt ways[i] là số cách tới bậc i với ways[0] = 1, ways[1] = 1. Khi đó ways[i] = ways[i-1] + ways[i-2]; có thể giữ hai biến cuộn thay cho cả mảng."
- "Lặp i từ 2 tới n: a, b = b, a + b (a = ways[i-2], b = ways[i-1]). Trả về b."
solution:
  file: solution.py
  approach_vi: "DP một chiều: số cách tới bậc i bằng tổng số cách tới hai bậc ngay trước; dùng hai biến cuộn."
  complexity: O(n) / O(1)
