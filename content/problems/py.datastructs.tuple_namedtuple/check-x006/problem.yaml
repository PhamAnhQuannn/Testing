id: check-x006
subtopic_id: py.datastructs.tuple_namedtuple
secondary_subtopics: []
kind: check
title: "Check X006: best_scorer"
title_vi: "Kiểm tra X006: best_scorer"
difficulty: easy
source:
  type: original
statement_en_md: |
  Implement `best_scorer(records)`. `records` is a non-empty list of pairs `[name, score]`
  (a name string and an integer score). Return the pair with the highest score as a tuple
  `(name, score)`. If several pairs share the highest score, return the one that appears first.
statement_vi_md: |
  Viết `best_scorer(records)`. `records` là list không rỗng các cặp `[tên, điểm]` (tên là chuỗi,
  điểm là số nguyên). Trả về cặp có điểm cao nhất dưới dạng tuple `(tên, điểm)`. Nếu nhiều cặp
  cùng điểm cao nhất thì trả về cặp xuất hiện sớm nhất.
constraints:
  - "1 <= len(records) <= 1000"
  - "-1000 <= điểm <= 1000"
examples:
  - {input: 'records = [["An", 7], ["Binh", 9], ["Chi", 9]]', output: '["Binh", 9]', explain_vi: "Trả về tuple (\"Binh\", 9); Binh và Chi cùng 9 điểm, Binh đứng trước."}
io:
  mode: function
  entry: best_scorer
  params: [{name: records, type: "list[list[any]]"}]
  returns: "tuple"
  compare: exact
starter:
  python: |
    def best_scorer(records):
        # TODO: duyệt các cặp bằng unpacking `for name, score in records`, trả về tuple (name, score)
        pass
limits: {time_ms: 1000, memory_mb: 256, time_multiplier: {pyodide: 3}}
time_target_min: 5
hints:
  - "Duyệt từng cặp bằng `for name, score in records:` (unpacking) và nhớ cặp tốt nhất đã thấy."
  - "Khởi tạo `best_name, best_score = records[0]`; chỉ cập nhật khi `score > best_score` (dấu `>` giữ cặp đứng trước khi hoà)."
  - "Cuối hàm `return best_name, best_score` (trả về một tuple)."
solution:
  file: solution.py
  approach_vi: "Một lượt duyệt, giữ cặp có điểm lớn nhất (so sánh nghiêm ngặt để giữ cặp đầu tiên khi hoà). O(n)."
  complexity: "O(n) time, O(1) space"
