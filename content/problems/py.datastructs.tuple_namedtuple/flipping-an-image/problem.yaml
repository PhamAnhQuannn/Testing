hints:
  - "Mỗi hàng được xử lý độc lập: lật hàng đó, rồi đảo từng giá trị của hàng."
  - "Duyệt từng `row` trong `image`; `row[::-1]` là hàng đã lật. Với mỗi giá trị `v`, giá trị đảo là `1 - v`."
  - "Tạo `result = []`; với mỗi hàng, tạo `new_row = []`, duyệt `row[::-1]` và `append(1 - v)`, sau đó `result.append(new_row)`. Trả về `result`."
