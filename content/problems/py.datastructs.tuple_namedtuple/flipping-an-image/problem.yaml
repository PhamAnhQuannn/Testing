id: flipping-an-image
subtopic_id: py.datastructs.tuple_namedtuple
secondary_subtopics: []
kind: practice
title: "Flipping an Image"
title_vi: "Lật ảnh"
difficulty: easy
source: {type: leetcode, lc: 832, rewrite_required: true}
statement_en_md: |
  Given an `n x n` binary matrix `image`, flip the image horizontally, then invert it, and return
  the resulting image. To flip an image horizontally means that each row is reversed
  (`[1, 1, 0]` becomes `[0, 1, 1]`). To invert an image means that every `0` is replaced by `1`
  and every `1` by `0` (`[0, 1, 1]` becomes `[1, 0, 0]`). Return the result as a list of lists.
statement_vi_md: |
  Cho ma trận nhị phân `n x n` tên `image` (list gồm `n` list, mỗi list có `n` số 0 hoặc 1).
  Hãy **lật ngang** ảnh (đảo ngược từng hàng), rồi **đảo bit** (0 thành 1, 1 thành 0) và trả về
  ảnh kết quả dưới dạng list các list. Ví dụ hàng `[1, 1, 0]` lật thành `[0, 1, 1]`, đảo bit
  thành `[1, 0, 0]`.
constraints:
  - "n == len(image) == len(image[i])"
  - "1 <= n <= 20"
  - "image[i][j] là 0 hoặc 1"
examples:
  - {input: "image = [[1, 1, 0], [1, 0, 1], [0, 0, 0]]", output: "[[1, 0, 0], [0, 1, 0], [1, 1, 1]]", explain_vi: "Lật từng hàng: [[0, 1, 1], [1, 0, 1], [0, 0, 0]]. Đảo bit: [[1, 0, 0], [0, 1, 0], [1, 1, 1]]."}
  - {input: "image = [[0]]", output: "[[1]]", explain_vi: "Một ô: lật không đổi, đảo bit thành 1."}
io:
  mode: function
  entry: flip_and_invert_image
  params: [{name: image, type: "list[list[int]]"}]
  returns: "list[list[int]]"
  compare: exact
