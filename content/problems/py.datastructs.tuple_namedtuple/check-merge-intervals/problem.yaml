hints:
- 'Sắp `pairs` theo start: `sorted(pairs)`.'
- Duyệt `for start, end in ...`; nếu kết quả rỗng hoặc `start > out[-1][1]` thì thêm `[start, end]` mới.
- 'Ngược lại gộp: `out[-1][1] = max(out[-1][1], end)`. Nhớ đoạn chạm nhau (start == end trước) cũng gộp.'
solution:
