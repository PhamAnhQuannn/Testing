title: 'Check X325: merge_intervals'
title_vi: 'Kiểm tra X325: merge_intervals'
difficulty: easy
source:
  type: original
statement_en_md: 'Implement `merge_intervals(pairs)`. `pairs` is a list of `[start, end]` with `start
  <= end`, in any order. Merge all intervals that overlap or touch (`next.start <= current.end`) and return
  the merged intervals as `[start, end]` pairs sorted by start. Unpack each pair as `start, end`.

  '
statement_vi_md: 'Viết `merge_intervals(pairs)`. `pairs` là list các cặp `[start, end]` với `start <=
  end`, thứ tự bất kỳ. Gộp mọi đoạn chồng lấn hoặc chạm nhau (`start_tiếp <= end_hiện_tại`) rồi trả về
  các đoạn đã gộp dạng cặp `[start, end]` sắp theo start. Hãy unpack mỗi cặp thành `start, end`.

  '
constraints:
- 0 <= len(pairs) <= 10^4
- -10^9 <= start <= end <= 10^9
examples:
- input: pairs = [[8, 10], [1, 3], [2, 6], [6, 7]]
  output: '[[1, 7], [8, 10]]'
  explain_vi: '[1,3],[2,6],[6,7] nối thành [1,7]; [8,10] đứng riêng.'
io:
