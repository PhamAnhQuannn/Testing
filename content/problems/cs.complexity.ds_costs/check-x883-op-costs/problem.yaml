id: check-x883-op-costs
subtopic_id: cs.complexity.ds_costs
secondary_subtopics: []
kind: check
title: 'Check X883: data structure operation costs'
title_vi: 'Kiểm tra X883: chi phí thao tác của cấu trúc dữ liệu'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `op_costs(ops)`. `ops` is a list of `[structure, operation]` pairs (both strings). Using the fixed
  cost table below, return the list of Big-O strings in input order. A pair not in the table gives `"O(?)"`.
  An empty `ops` gives `[]`.

  ```
  array: index O(1), search O(n), append O(1), insert_front O(n)
  dict: get O(1), set O(1)        set: contains O(1)        list: contains O(n)
  linked_list: prepend O(1), index O(n)
  heap: push O(log n), pop_min O(log n), peek O(1)
  bst: search O(log n)            sorted: binary_search O(log n)
  ```
statement_vi_md: |
  Cài `op_costs(ops)`. `ops` là list các cặp `[structure, operation]` (cả hai là chuỗi). Dùng bảng chi phí cố định
  dưới đây, trả về list chuỗi Big-O theo đúng thứ tự đầu vào. Cặp không có trong bảng trả `"O(?)"`.
  `ops` rỗng trả `[]`.

  ```
  array: index O(1), search O(n), append O(1), insert_front O(n)
  dict: get O(1), set O(1)        set: contains O(1)        list: contains O(n)
  linked_list: prepend O(1), index O(n)
  heap: push O(log n), pop_min O(log n), peek O(1)
  bst: search O(log n)            sorted: binary_search O(log n)
  ```
constraints:
- 'Mỗi phần tử của ops là list gồm đúng 2 chuỗi [structure, operation]'
- 'Cặp không có trong bảng trả "O(?)"'
- 'Chỉ dùng thư viện chuẩn của Python'
examples:
- input: 'ops = [["array", "index"], ["dict", "get"], ["heap", "push"]]'
  output: '["O(1)", "O(1)", "O(log n)"]'
  explain_vi: 'Index mảng và dict.get là O(1); heap push là O(log n).'
- input: 'ops = [["list", "contains"], ["set", "contains"]]'
  output: '["O(n)", "O(1)"]'
  explain_vi: 'Tìm trong list phải duyệt O(n), trong set nhờ băm O(1).'
io:
  mode: function
  entry: op_costs
  params:
  - name: ops
    type: list
  returns: list
  compare: exact
starter:
  python: |
    def op_costs(ops):
        # TODO: dựng dict COST[(structure, operation)] rồi tra từng cặp
        pass
time_target_min: 5
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
hints:
- "Dựng dict COST với khóa là tuple (structure, operation) và giá trị là chuỗi Big-O."
- "Dùng COST.get((s, o), \"O(?)\") để cặp lạ trả O(?) thay vì lỗi."
- "Dùng list comprehension duyệt ops theo thứ tự: [COST.get((s, o), \"O(?)\") for s, o in ops]."
solution:
  file: solution.py
  approach_vi: Tra từng cặp trong bảng chi phí cố định bằng dict.get với giá trị mặc định O(?).
  complexity: "O(n) / O(n)"
tests:
  sample: tests/sample.jsonl
  hidden: tests/hidden.jsonl
  generator: tests/gen.py
tags:
