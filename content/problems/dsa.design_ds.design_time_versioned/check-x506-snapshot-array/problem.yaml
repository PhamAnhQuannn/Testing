title: 'Check X506: SnapshotArray'
title_vi: 'Kiểm tra X506: SnapshotArray'
difficulty: easy
source:
  type: leetcode
  lc: 1146
  rewrite_required: true
statement_en_md: |
  Implement `class SnapshotArray`. `SnapshotArray(length)` creates an array of `length` zeros.
  `set(index, val)` sets the element at `index` to `val`. `snap()` takes a snapshot of the array and
  returns the snap id (the first call returns 0, then 1, 2, ...). `get(index, snap_id)` returns the value
  at `index` at the moment `snap()` returned `snap_id`. Copying the whole array on every `snap()` is too
  slow: keep a per-index history of (snap_id, value) and binary search it.
statement_vi_md: |
  Viết `class SnapshotArray`. `SnapshotArray(length)` tạo mảng `length` phần tử 0. `set(index, val)` gán
  phần tử `index` bằng `val`. `snap()` chụp snapshot và trả về snap id (lần đầu là 0, rồi 1, 2, ...).
  `get(index, snap_id)` trả về giá trị tại `index` ở thời điểm `snap()` trả `snap_id`. Không copy cả mảng
  mỗi lần `snap()`; hãy lưu lịch sử (snap_id, value) theo từng index và binary search.
constraints:
- 1 <= length <= 50000
- 0 <= index < length
- 0 <= snap_id < số lần đã gọi snap()
- 0 <= val <= 10^9
examples:
- input: ops = ['SnapshotArray', 'set', 'snap', 'set', 'snap', 'get', 'get'], args = [[3], [0, 5], [], [0, 6], [], [0, 0], [0, 1]]
  output: '[null, null, 0, null, 1, 5, 6]'
  explain_vi: Snap 0 chụp khi phần tử 0 bằng 5, snap 1 chụp khi nó bằng 6, nên get(0, 0) là 5 và get(0, 1) là 6.
