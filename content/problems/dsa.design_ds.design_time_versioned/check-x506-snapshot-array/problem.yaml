hints:
- Mỗi snap() không được copy cả mảng. Chỉ index nào bị set mới cần ghi nhớ thay đổi.
- Với mỗi index giữ một danh sách (snap_id, val) tăng dần theo snap_id, khởi đầu là (0, 0). set ghi đè mục cuối nếu cùng snap_id hiện tại, ngược lại append.
- get dùng bisect_right trên danh sách của index để tìm mục cuối có snap_id <= snap_id được hỏi.
