id: check-x545-cell-value
subtopic_id: dsa.practical.spreadsheet_formulas
secondary_subtopics: []
kind: check
title: 'Check X545: cell_value'
title_vi: 'Kiểm tra X545: cell_value'
difficulty: easy
source:
  type: original
statement_en_md: |
  A spreadsheet is a dict `cells` mapping a cell name (e.g. `"A1"`) to either an integer literal or a
  formula string `"=X+Y+..."`. A formula only uses `+` and cell names (no numbers), and its value is the
  sum of the values of the referenced cells (a cell may be referenced more than once). Return the integer
  value of `target`. The sheet is acyclic. Evaluate recursively, ideally with memoization.
statement_vi_md: |
  Một bảng tính là dict `cells` ánh xạ tên ô (ví dụ `"A1"`) sang một số nguyên hoặc một chuỗi công thức
  `"=X+Y+..."`. Công thức chỉ dùng dấu `+` và tên ô (không có số), giá trị của nó là tổng giá trị các ô được
  tham chiếu (một ô có thể được tham chiếu nhiều lần). Viết `cell_value(cells, target)` trả về giá trị nguyên
  của ô `target`. Bảng tính không có vòng tham chiếu. Gợi ý: đệ quy kèm memo.
constraints:
- 1 <= number of cells <= 100
- every referenced cell exists in `cells`
- the sheet has no reference cycle
- values fit in a 64-bit integer
examples:
- input: 'cells = {"A": 3, "B": "=A+A", "C": "=A+B"}, target = "C"'
  output: '9'
  explain_vi: A = 3, B = A + A = 6, C = A + B = 3 + 6 = 9.
io:
  mode: function
  entry: cell_value
  params:
  - name: cells
    type: any
  - name: target
    type: str
  returns: int
  compare: exact
starter:
  python: |
    def cell_value(cells, target):
        # TODO: nếu cells[target] là int thì trả luôn; nếu là công thức thì cộng giá trị các ô tham chiếu
        pass
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 8
hints:
- Một ô là số thì giá trị là chính nó; là công thức thì giá trị phụ thuộc vào các ô nó tham chiếu. Đây là đệ quy.
- "Với công thức \"=A+B\", bỏ dấu '=' rồi split('+') để lấy danh sách tên ô, sau đó cộng value(tên) của từng ô."
- "Lưu kết quả đã tính vào dict memo để mỗi ô chỉ tính một lần (tránh nổ theo cấp số nhân khi A được tham chiếu nhiều lần)."
solution:
  file: solution.py
  approach_vi: Đệ quy có memo trên đồ thị phụ thuộc không chu trình; mỗi ô tính đúng một lần.
  complexity: O(V + E) / O(V)
tests:
