kind: check
title: 'Check X760: match route'
title_vi: 'Kiểm tra X760: khớp route kiểu FastAPI'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `match_route(routes, path)`, a tiny router like the one inside a web framework.
  `routes` is a list of `[pattern, handler]` pairs (both strings). A pattern is a URL such as
  `"/users/{id}/posts/{pid}"`; a `{name}` segment is a wildcard that captures exactly **one** path segment
  (segments are obtained by splitting on `/`). `path` is a concrete URL such as `"/users/7/posts/3"`.
  A pattern matches iff it has the same number of segments as `path`, every literal segment is equal, and
  every `{name}` segment maps to the corresponding segment of `path`.
  Return `[handler, params]` for the **first** matching route in list order, where `params` is a dict
  `{name: value}` of the captured segments (values stay **strings**; the dict is empty if the pattern has no
  `{}`). If no route matches, return `[]`.
  For `routes = [["/users/{id}", "get_user"], ["/users/{id}/posts/{pid}", "get_post"]]` and
  `path = "/users/7/posts/3"` the result is `["get_post", {"id": "7", "pid": "3"}]`; for `path = "/unknown"`
  the result is `[]`.
statement_vi_md: |
  Cài `match_route(routes, path)`, một router nhỏ giống phần bên trong web framework. `routes` là list các cặp
  `[pattern, handler]` (đều là chuỗi). Pattern là URL như `"/users/{id}/posts/{pid}"`; segment dạng `{name}` là
  wildcard bắt đúng **một** segment của đường dẫn (tách segment bằng `/`). `path` là URL cụ thể như
  `"/users/7/posts/3"`. Pattern khớp khi có cùng số segment với `path`, mọi segment literal bằng nhau, và mỗi
  `{name}` ứng với segment tương ứng của `path`.
  Trả về `[handler, params]` của route khớp **đầu tiên** theo thứ tự list, trong đó `params` là dict
  `{name: value}` các segment đã bắt (giá trị giữ nguyên là **chuỗi**; dict rỗng nếu pattern không có `{}`).
  Không route nào khớp thì trả `[]`.
  Với `routes = [["/users/{id}", "get_user"], ["/users/{id}/posts/{pid}", "get_post"]]` và
  `path = "/users/7/posts/3"` kết quả là `["get_post", {"id": "7", "pid": "3"}]`; với `path = "/unknown"` kết
  quả là `[]`.
constraints:
- 'Segment tách bằng split("/"); pattern và path phải có cùng số segment (dấu / cuối tạo thêm segment rỗng)'
- 'Route khớp đầu tiên theo thứ tự list thắng, kể cả khi route sau cụ thể hơn'
- 'Giá trị bắt được là chuỗi, không ép sang số; không có route khớp thì trả [] (list rỗng)'
examples:
- input: 'routes = [["/users/{id}", "get_user"], ["/users/{id}/posts/{pid}", "get_post"]], path = "/users/7/posts/3"'
  output: '["get_post", {"id": "7", "pid": "3"}]'
  explain_vi: 'Route đầu có 3 segment, path có 5 segment nên bị loại; route hai khớp và bắt id, pid.'
