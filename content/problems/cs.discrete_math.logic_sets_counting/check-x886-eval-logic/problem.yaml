id: check-x886-eval-logic
subtopic_id: cs.discrete_math.logic_sets_counting
secondary_subtopics: []
kind: check
title: 'Check X886: evaluate a propositional expression'
title_vi: 'Kiểm tra X886: tính giá trị biểu thức logic'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `eval_logic(expr)`, which evaluates a nested propositional-logic expression and returns a bool.
  If `expr` is a bool, return it. Otherwise `expr` is a list whose element `[0]` is the operator string:
  `"and"` is the AND of all remaining operands (no operands gives `True`);
  `"or"` is the OR of all remaining operands (no operands gives `False`);
  `"not"` negates its single operand. Operands are themselves expressions (bools or nested lists).
  For `["and", true, ["not", false]]` the result is `true`.
statement_vi_md: |
  Cài `eval_logic(expr)` tính giá trị một biểu thức mệnh đề lồng nhau và trả về bool.
  Nếu `expr` là bool thì trả về chính nó. Ngược lại `expr` là list có phần tử `[0]` là chuỗi toán tử:
  `"and"` là AND của mọi toán hạng còn lại (không có toán hạng thì trả `True`);
  `"or"` là OR của mọi toán hạng còn lại (không có toán hạng thì trả `False`);
  `"not"` phủ định toán hạng duy nhất của nó. Toán hạng lại là biểu thức (bool hoặc list lồng).
  Với `["and", true, ["not", false]]` kết quả là `true`.
constraints:
- 'expr là bool hoặc list bắt đầu bằng "and", "or" hoặc "not"'
- '"not" luôn có đúng một toán hạng'
- 'Chỉ dùng thư viện chuẩn của Python'
examples:
- input: 'expr = ["and", True, ["not", False]]'
  output: 'true'
  explain_vi: 'not false = true, true and true = true.'
- input: 'expr = ["or", False, False]'
  output: 'false'
  explain_vi: 'Không toán hạng nào đúng nên or cho false.'
io:
