title: 'Check X491: total_n_queens'
title_vi: 'Kiểm tra X491: total_n_queens'
difficulty: easy
source:
  type: leetcode
  lc: 52
  rewrite_required: true
statement_en_md: |
  The n-queens puzzle places `n` queens on an `n x n` chessboard so that no two queens attack each other
  (no shared row, column, or diagonal). Given an integer `n`, return the number of distinct solutions.
  Backtracking row by row with sets of used columns and diagonals prunes attacked squares immediately.
statement_vi_md: |
  Bài n-queens đặt `n` quân hậu lên bàn cờ `n x n` sao cho không hai quân nào ăn nhau (không chung hàng,
  cột hay đường chéo). Viết `total_n_queens(n)` trả về số cách đặt khác nhau. Gợi ý: quay lui từng hàng,
  dùng các tập cột và hai đường chéo đã bị chiếm để bỏ qua ô bị tấn công ngay.
constraints:
- 1 <= n <= 9
examples:
- input: n = 4
  output: '2'
  explain_vi: Với n = 4 có đúng hai cách đặt hợp lệ, đối xứng gương của nhau.
io:
  mode: function
  entry: total_n_queens
  params:
  - name: n
    type: int
  returns: int
  compare: exact
starter:
  python: |
    def total_n_queens(n):
        # TODO: quay lui theo hàng; cột c hợp lệ nếu c, r - c, r + c đều chưa bị chiếm
        pass
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 10
hints:
- Mỗi hàng có đúng một quân hậu, nên hãy thử từng cột c cho hàng r rồi đệ quy sang hàng r + 1.
- "Hai quân ở (r, c) và (r2, c2) cùng đường chéo khi r - c == r2 - c2 hoặc r + c == r2 + c2. Giữ ba tập: cột, r - c, r + c."
- "Nếu c, r - c hoặc r + c đã trong tập thì bỏ qua (cắt nhánh). Ngược lại thêm vào ba tập, đệ quy, rồi xóa lại khi quay lui. Khi r == n thì tìm được 1 nghiệm."
solution:
  file: solution.py
  approach_vi: Quay lui theo hàng với ba tập cột / đường chéo chính / đường chéo phụ; mỗi lần r == n cộng 1 nghiệm.
  complexity: O(n!) / O(n)
