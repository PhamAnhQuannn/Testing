id: check-x490-word-search
subtopic_id: dsa.recursion_backtracking.backtracking_constraints
secondary_subtopics: []
kind: check
title: 'Check X490: exist'
title_vi: 'Kiểm tra X490: exist'
difficulty: easy
source:
  type: leetcode
  lc: 79
  rewrite_required: true
statement_en_md: |
  Given an `m x n` grid of single-character strings `board` and a string `word`, return `True` if `word`
  can be traced in the grid, otherwise `False`. The word is built from sequentially adjacent cells
  (horizontally or vertically neighbouring), and the same cell may not be used more than once in a
  single path. Backtracking with a visited mark and early pruning on a character mismatch solves it.
statement_vi_md: |
  Viết `exist(board, word)`: `board` là lưới `m x n` gồm các chuỗi một ký tự, `word` là một chuỗi. Trả `True`
  nếu có thể dò ra `word` từ các ô liền kề nhau liên tiếp (trên, dưới, trái, phải), mỗi ô chỉ được dùng
  tối đa một lần trong cùng một đường đi; ngược lại trả `False`. Gợi ý: quay lui (backtracking) với đánh dấu
  ô đã thăm, cắt ngay khi ký tự không khớp.
constraints:
- 1 <= m, n <= 6
- 1 <= len(word) <= 40
- board and word contain only lowercase and uppercase English letters
examples:
- input: 'board = [["A", "B", "C", "E"], ["S", "F", "C", "S"], ["A", "D", "E", "E"]], word = "ABCCED"'
  output: 'true'
  explain_vi: Đường đi A(0,0) -> B(0,1) -> C(0,2) -> C(1,2) -> E(2,2) -> D(2,1) dùng mỗi ô một lần.
io:
  mode: function
  entry: exist
  params:
  - name: board
    type: list[list[str]]
  - name: word
    type: str
  returns: bool
  compare: exact
starter:
  python: |
    def exist(board, word):
        # TODO: DFS từ mỗi ô khớp word[0]; đánh dấu ô đã dùng, khôi phục khi quay lui
        pass
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 8
hints:
- Thử bắt đầu DFS từ mọi ô; mỗi bước phải khớp ký tự word[k] tại ô hiện tại.
- "Trước khi đi tiếp, đánh dấu ô hiện tại là đã dùng (ví dụ gán '#'), sau khi duyệt xong bốn hướng thì khôi phục ký tự cũ để các nhánh khác dùng lại được ô này."
- "Trả True ngay khi k == len(word) - 1 và ký tự khớp. Ra ngoài lưới, ô đã dùng hoặc ký tự khác thì trả False (cắt nhánh). Nếu len(word) > m * n thì trả False ngay."
solution:
  file: solution.py
  approach_vi: DFS quay lui từ mỗi ô, đánh dấu ô đang dùng rồi khôi phục; cắt nhánh khi lệch ký tự hoặc word dài hơn số ô.
  complexity: O(m * n * 3^L) / O(L)
tests:
