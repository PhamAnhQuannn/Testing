hints:
- Giữ nửa nhỏ trong max-heap `lo` (lưu số âm) và nửa lớn trong min-heap `hi`; luôn có len(lo) bằng len(hi) hoặc hơn 1.
- "Mỗi lần thêm x: đẩy qua lo, chuyển phần tử lớn nhất của lo sang hi, rồi nếu hi dài hơn lo thì chuyển phần tử nhỏ nhất của hi về lo."
- Sau khi cân bằng, nếu len(lo) > len(hi) thì gấp đôi là `-2 * lo[0]`, ngược lại là `-lo[0] + hi[0]`.
