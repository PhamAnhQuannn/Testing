kind: check
title: 'Check X438: median_doubled'
title_vi: 'Kiểm tra X438: median_doubled'
difficulty: easy
source:
  type: original
statement_en_md: |
  Implement `median_doubled(nums)`: numbers arrive one at a time from `nums`. After each insert,
  record **twice the running median** (so the result is always an integer: for an odd count it is
  `2 * middle`, for an even count it is the sum of the two middle values). Return the list of these
  values, one per element. Use two heaps: O(n log n).
statement_vi_md: |
  Viết `median_doubled(nums)`: các số đến lần lượt từ `nums`. Sau mỗi lần thêm, ghi lại **gấp đôi
  median hiện tại** (luôn là số nguyên: số phần tử lẻ thì là `2 * phần tử giữa`, chẵn thì là tổng hai
  phần tử giữa). Trả list các giá trị này, mỗi phần tử một giá trị. Dùng hai heap: O(n log n).
constraints: []
examples:
- input: nums = [5, 2, 8, 1]
  output: '[10, 7, 10, 7]'
  explain_vi: 'Sau 5: median 5 (gấp đôi 10). Sau 2: (2+5)=7. Sau 8: {2,5,8} median 5 nên 10. Sau 1: {1,2,5,8} nên 2+5=7.'
