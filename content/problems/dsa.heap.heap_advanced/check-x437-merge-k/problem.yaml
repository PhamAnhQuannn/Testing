hints:
- Heap chỉ cần chứa tối đa một phần tử đại diện cho mỗi list (phần tử nhỏ nhất chưa lấy).
- Đẩy tuple (giá trị, i, j); pop nhỏ nhất, ghi vào kết quả, rồi đẩy lists[i][j+1] nếu còn.
- Đừng quên list rỗng (không đẩy gì) và trường hợp lists rỗng; so sánh tuple với i làm tie-break nên không bao giờ so sánh list với nhau.
