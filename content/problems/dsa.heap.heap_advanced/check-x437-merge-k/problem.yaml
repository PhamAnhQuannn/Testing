statement_en_md: |
  Implement `merge_k(lists)`: `lists` is a list of k individually sorted (non-decreasing) lists of
  integers (some may be empty, k may be 0). Return one new sorted list containing all elements
  (duplicates kept). Use a heap: O(N log k) for N total elements.
statement_vi_md: |
  Viết `merge_k(lists)`: `lists` gồm k danh sách số nguyên, mỗi danh sách đã sắp tăng dần (có thể
  rỗng, k có thể bằng 0). Trả về một list mới đã sắp chứa mọi phần tử (giữ phần tử trùng). Dùng heap
  để đạt O(N log k) với N là tổng số phần tử.
constraints: []
examples:
- input: lists = [[1, 4, 5], [1, 3, 4], [2, 6]]
  output: '[1, 1, 2, 3, 4, 4, 5, 6]'
  explain_vi: Heap giữ phần tử nhỏ nhất của mỗi list; lấy nhỏ nhất ra rồi đẩy phần tử kế tiếp cùng list.
