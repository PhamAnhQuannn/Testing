hints:
  - "Hàng thứ i (đếm từ 0) có i + 1 số. Hàng mới chỉ phụ thuộc vào hàng liền trước."
  - "Tạo hàng mới `row = [1] * (i + 1)`, rồi với j từ 1 đến i - 1 gán `row[j] = hang_truoc[j - 1] + hang_truoc[j]`."
  - "Mỗi vòng lặp phải tạo một list mới rồi `triangle.append(row)`. Nếu dùng lại cùng một list rồi sửa nó, mọi hàng sẽ trỏ về cùng một đối tượng."
