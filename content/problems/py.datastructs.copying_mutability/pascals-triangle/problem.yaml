kind: practice
title: "Pascal's Triangle"
title_vi: "Tam giác Pascal"
difficulty: easy
source: {type: leetcode, lc: 118, rewrite_required: true}
statement_en_md: |
  Given an integer `num_rows`, return the first `num_rows` rows of Pascal's triangle as a list of
  lists. In Pascal's triangle, each number is the sum of the two numbers directly above it, and
  the edges of every row are `1`.
statement_vi_md: |
  Cho số nguyên `num_rows`. Trả về `num_rows` hàng đầu tiên của tam giác Pascal dưới dạng list
  các list. Hàng đầu là `[1]`; mỗi hàng sau bắt đầu và kết thúc bằng `1`, còn mỗi số ở giữa bằng
  tổng của hai số đứng ngay phía trên nó (ở hàng trước).
constraints:
  - "1 <= num_rows <= 30"
examples:
  - {input: "num_rows = 5", output: "[[1], [1, 1], [1, 2, 1], [1, 3, 3, 1], [1, 4, 6, 4, 1]]", explain_vi: "Hàng cuối: 1, 1+3 = 4, 3+3 = 6, 3+1 = 4, 1."}
  - {input: "num_rows = 1", output: "[[1]]", explain_vi: "Chỉ có hàng đầu tiên."}
