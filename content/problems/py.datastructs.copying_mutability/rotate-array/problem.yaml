id: rotate-array
subtopic_id: py.datastructs.copying_mutability
secondary_subtopics: []
kind: practice
title: "Rotate Array"
title_vi: "Xoay mảng"
difficulty: medium
source: {type: leetcode, lc: 189, rewrite_required: true}
statement_en_md: |
  Given an integer array `nums` and a non-negative integer `k`, rotate the array to the right by
  `k` steps. Return the rotated array as a new list (the original list may be left unchanged).
statement_vi_md: |
  Cho mảng số nguyên `nums` và số nguyên không âm `k`. Hãy xoay mảng sang **phải** `k` bước (mỗi
  bước, phần tử cuối chuyển lên đầu). Trả về mảng sau khi xoay dưới dạng **list mới**; không cần
  (và không nên) sửa `nums` gốc. Lưu ý `k` có thể lớn hơn độ dài mảng.
constraints:
  - "1 <= len(nums) <= 5 * 10^4"
  - "-100 <= nums[i] <= 100"
  - "0 <= k <= 10^5"
examples:
  - {input: "nums = [1, 2, 3, 4, 5, 6, 7], k = 3", output: "[5, 6, 7, 1, 2, 3, 4]", explain_vi: "Sau 1 bước: [7,1,2,3,4,5,6]; sau 2: [6,7,1,2,3,4,5]; sau 3: [5,6,7,1,2,3,4]."}
  - {input: "nums = [-1, -100, 3, 99], k = 2", output: "[3, 99, -1, -100]", explain_vi: "Hai phần tử cuối (3, 99) chuyển lên đầu."}
  - {input: "nums = [1, 2, 3], k = 4", output: "[3, 1, 2]", explain_vi: "Xoay 4 bước giống xoay 4 mod 3 = 1 bước."}
io:
  mode: function
  entry: rotate
  params: [{name: nums, type: "list[int]"}, {name: k, type: int}]
  returns: "list[int]"
  compare: exact
starter:
  python: |
    def rotate(nums: list[int], k: int) -> list[int]:
        # TODO: trả về list MỚI đã xoay phải k bước (k có thể lớn hơn len(nums))
        pass
limits: {time_ms: 300, memory_mb: 256, time_multiplier: {pyodide: 3}}
time_target_min: 15
hints:
  - "Xoay phải len(nums) bước thì mảng trở lại như cũ, nên chỉ cần quan tâm k mod len(nums)."
  - "Sau khi lấy k %= n, k phần tử cuối sẽ chuyển lên đầu; n - k phần tử còn lại dịch về sau."
  - "Dùng cắt lát: `nums[n - k:] + nums[:n - k]` (phép nối tạo một list mới). Tránh xoay từng bước một: O(n*k) sẽ quá chậm với n = 5 * 10^4, k ~ 10^5."
solution:
  file: solution.py
  approach_vi: "Lấy k mod n rồi nối phần cuối với phần đầu bằng cắt lát; cắt lát và nối tạo list mới nên không đụng tới nums gốc. O(n) thời gian, O(n) bộ nhớ phụ."
  complexity: "O(n) time, O(n) space"
tests:
