id: check-deep-update
subtopic_id: py.datastructs.copying_mutability
secondary_subtopics: []
kind: check
title: 'Check X322: deep_update'
title_vi: 'Kiểm tra X322: deep_update'
difficulty: easy
source:
  type: original
statement_en_md: 'Implement `deep_update(grid, cells)`. `grid` is a list of rows of integers; `cells`
  is a list of `[r, c, v]` triples (all indices valid). Build a NEW grid equal to `grid` with `new[r][c]
  = v` applied for each triple in order (later triples win). Do not modify `grid` and make sure no row
  is shared between the new grid and `grid`. Return the two-element list `[new_grid, grid]`.

  '
statement_vi_md: 'Viết `deep_update(grid, cells)`. `grid` là list các hàng số nguyên; `cells` là list
  các bộ `[r, c, v]` (chỉ số luôn hợp lệ). Tạo lưới **mới** giống `grid` rồi gán `new[r][c] = v` lần lượt
  cho từng bộ (bộ sau ghi đè bộ trước). Không được sửa `grid` và không hàng nào được dùng chung giữa lưới
  mới và `grid`. Trả về list hai phần tử `[lưới_mới, grid]`.

  '
constraints:
- 0 <= len(grid) <= 100
- 0 <= len(cells) <= 1000
examples:
- input: grid = [[1, 2], [3, 4]], cells = [[0, 1, 9], [1, 0, 7]]
  output: '[[[1, 9], [7, 4]], [[1, 2], [3, 4]]]'
  explain_vi: Lưới mới đã cập nhật; lưới gốc không đổi.
io:
  mode: function
  entry: deep_update
  params:
  - name: grid
    type: list[list[int]]
  - name: cells
    type: list[list[int]]
  returns: list
  compare: exact
starter:
  python: "def deep_update(grid, cells):\n    # TODO: sao chép từng hàng, rồi áp dụng cells lên bản sao\n\
    \    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 12
hints:
- '`grid[:]` hoặc `list(grid)` chỉ là bản sao nông: các hàng vẫn dùng chung, sửa `new[r][c]` sẽ làm đổi
  `grid`.'
- Tạo `new = [row[:] for row in grid]` (hoặc `copy.deepcopy(grid)`).
- 'Lặp `for r, c, v in cells: new[r][c] = v` rồi `return [new, grid]`.'
solution:
  file: solution.py
  approach_vi: Sao chép từng hàng (bản sao sâu một mức) rồi áp dụng cập nhật. O(N + len(cells)).
  complexity: O(N + q) time
