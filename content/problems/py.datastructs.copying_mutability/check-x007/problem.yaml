id: check-x007
subtopic_id: py.datastructs.copying_mutability
secondary_subtopics: []
kind: check
title: "Check X007: plus_one_copy"
title_vi: "Kiểm tra X007: plus_one_copy"
difficulty: easy
source:
  type: original
statement_en_md: |
  Implement `plus_one_copy(grid)`. `grid` is a list of rows, each row a list of integers (rows may
  have different lengths and may be empty). Build a NEW grid in which every number is increased by
  1, without changing `grid`. Return the two-element list `[new_grid, grid]`.
statement_vi_md: |
  Viết `plus_one_copy(grid)`. `grid` là list các hàng, mỗi hàng là list số nguyên (các hàng có thể
  dài khác nhau hoặc rỗng). Tạo một lưới **mới** trong đó mỗi số được cộng thêm 1, **không làm thay
  đổi** `grid`. Trả về list hai phần tử `[lưới_mới, grid]`.
constraints:
  - "0 <= len(grid) <= 100"
  - "-1000 <= grid[i][j] <= 1000"
examples:
  - {input: 'grid = [[1, 2], [3]]', output: '[[[2, 3], [4]], [[1, 2], [3]]]', explain_vi: "Lưới mới có mọi số tăng 1; lưới gốc vẫn là [[1, 2], [3]]."}
io:
  mode: function
  entry: plus_one_copy
  params: [{name: grid, type: "list[list[int]]"}]
  returns: "list"
  compare: exact
starter:
  python: |
    def plus_one_copy(grid):
        # TODO: tạo lưới mới (mỗi hàng là list mới), cộng 1 vào từng số của lưới mới, trả về [lưới_mới, grid]
        pass
limits: {time_ms: 1000, memory_mb: 256, time_multiplier: {pyodide: 3}}
time_target_min: 5
hints:
  - "Nếu chỉ viết `new_grid = grid[:]` thì các hàng bên trong vẫn là cùng đối tượng với `grid`; sửa hàng của lưới mới là sửa luôn lưới gốc."
  - "Với mỗi `row` trong `grid`, tạo `new_row = []`, thêm `v + 1` cho từng `v` trong `row`, rồi `new_grid.append(new_row)`."
  - "Cuối hàm `return [new_grid, grid]`. Có thể thay vòng lặp bằng `copy.deepcopy(grid)` rồi cộng 1 tại chỗ."
solution:
