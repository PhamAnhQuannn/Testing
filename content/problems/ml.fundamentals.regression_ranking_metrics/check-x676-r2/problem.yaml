id: check-x676-r2
subtopic_id: ml.fundamentals.regression_ranking_metrics
secondary_subtopics: []
kind: check
title: 'Check X676: R-squared'
title_vi: 'Kiểm tra X676: R-squared'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `r_squared(y_true, y_pred)`: the coefficient of determination
  `1 - SS_res / SS_tot`, where `SS_res = sum((y - y_hat)^2)` and `SS_tot = sum((y - mean(y_true))^2)`,
  over two numeric lists of equal length. Return a float `round(result, 6)`.
  If `SS_tot == 0` (constant `y_true`, or empty lists) return `0.0`. The result may be negative.
statement_vi_md: |
  Cài `r_squared(y_true, y_pred)`: hệ số xác định `1 - SS_res / SS_tot`, với
  `SS_res = sum((y - y_hat)^2)` và `SS_tot = sum((y - mean(y_true))^2)`, trên hai danh sách số cùng độ dài.
  Trả float `round(kết quả, 6)`. Nếu `SS_tot == 0` (y_true hằng số hoặc danh sách rỗng) trả `0.0`.
  Kết quả có thể âm (tệ hơn việc luôn đoán trung bình).
constraints:
- 0 <= len(y_true) == len(y_pred) <= 1000
examples:
- input: y_true = [3, 5, 7], y_pred = [2, 5, 9]
  output: '0.375'
  explain_vi: SS_res = 1 + 0 + 4 = 5; mean = 5 nên SS_tot = 4 + 0 + 4 = 8; R² = 1 - 5/8.
io:
  mode: function
  entry: r_squared
  params:
