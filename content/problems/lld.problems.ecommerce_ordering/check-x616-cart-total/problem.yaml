id: check-x616-cart-total
subtopic_id: lld.problems.ecommerce_ordering
secondary_subtopics: []
kind: check
title: 'Check X616: Cart total'
title_vi: 'Kiểm tra X616: Tổng giỏ hàng'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Core of a shopping cart. All money is `int` (never float).

  Implement `class Cart` with:

  - `Cart()`: an empty cart; the default discount is `"none"`.
  - `add(name, price, qty)`: adds a line (`price` int, `qty` int >= 1). Returns nothing.
  - `set_discount(kind)`: sets the current discount strategy by name; `kind` is one of `"none"`, `"percent10"`, `"fixed50"`. Returns nothing.
  - `subtotal()`: returns the `int` sum of `price * qty` over all lines (0 for an empty cart).
  - `total()`: returns the `int` total after the current discount, applied to the subtotal: `"none"` is the subtotal, `"percent10"` is `subtotal * 90 // 100`, `"fixed50"` is `max(0, subtotal - 50)`.
statement_vi_md: |
  Lõi của giỏ hàng. Mọi số tiền là `int` (không dùng float).

  Viết `class Cart` với:

  - `Cart()`: giỏ rỗng; giảm giá mặc định là `"none"`.
  - `add(name, price, qty)`: thêm một dòng hàng (`price` số nguyên, `qty` số nguyên >= 1). Không trả gì.
  - `set_discount(kind)`: đặt chiến lược giảm giá hiện tại theo tên; `kind` là `"none"`, `"percent10"` hoặc `"fixed50"`. Không trả gì.
  - `subtotal()`: trả tổng `price * qty` của mọi dòng (`int`, giỏ rỗng là 0).
  - `total()`: trả tổng tiền (`int`) sau giảm giá hiện tại, áp lên subtotal: `"none"` giữ nguyên, `"percent10"` là `subtotal * 90 // 100`, `"fixed50"` là `max(0, subtotal - 50)`.
constraints:
- 'kind chỉ là "none", "percent10" hoặc "fixed50"; price và qty là số nguyên dương.'
- 'Không dùng float, thread, time hay random.'
examples:
- input: ops = ['Cart', 'add', 'add', 'subtotal', 'set_discount', 'total'], args = [[], ['ao', 100, 2], ['non', 50, 1], [], ['percent10'], []]
  output: '[null, null, null, 250, null, 225]'
  explain_vi: 'Subtotal = 100*2 + 50*1 = 250; giảm 10% bằng 250*90//100 = 225.'
io:
  mode: class_ops
  compare: exact
starter:
