kind: check
title: 'Check X426: count_windows'
title_vi: 'Kiểm tra X426: count_windows'
difficulty: easy
source:
  type: original
statement_en_md: Implement `count_windows(nums, k, threshold)`, returning how many windows of exactly `k`
  consecutive elements have an average at least `threshold` (that is, sum >= k * threshold). 1 <= k <= len(nums).
  Use a fixed-size sliding window, O(n), integers only.
statement_vi_md: Viết `count_windows(nums, k, threshold)` trả về **số cửa sổ** gồm đúng `k` phần tử liên tiếp
  có trung bình **không nhỏ hơn** `threshold` (tức tổng >= k * threshold). 1 <= k <= len(nums). Dùng cửa
  sổ trượt cố định, O(n), chỉ dùng số nguyên.
constraints: []
examples:
- input: nums = [2, 1, 5, 1, 3, 2], k = 3, threshold = 3
  output: '1'
  explain_vi: Các cửa sổ có tổng 8, 7, 9, 6; cần tổng >= 3 * 3 = 9 nên chỉ có một cửa sổ đạt.
io:
  mode: function
  entry: count_windows
  params:
  - name: nums
    type: list[int]
  - name: k
    type: int
  - name: threshold
    type: int
  returns: int
  compare: exact
starter:
  python: "def count_windows(nums, k, threshold):\n    # TODO\n    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 12
hints:
- Trung bình >= threshold tương đương tổng >= k * threshold; so sánh số nguyên, tránh chia.
- Tính tổng cửa sổ đầu, đếm nếu đạt, rồi trượt bằng cách cộng nums[i] và trừ nums[i - k], đếm tiếp.
- Đừng quên đếm cả cửa sổ đầu tiên (trước vòng lặp trượt).
solution:
  file: solution.py
  approach_vi: Cửa sổ trượt cố định, so tổng với k * threshold, đếm số cửa sổ đạt.
  complexity: O(n) / O(1)
