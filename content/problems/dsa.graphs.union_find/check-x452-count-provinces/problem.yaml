id: check-x452-count-provinces
subtopic_id: dsa.graphs.union_find
secondary_subtopics: []
kind: check
title: 'Check X452: count_provinces'
title_vi: 'Kiểm tra X452: count_provinces'
difficulty: easy
source:
  type: leetcode
  lc: 547
  rewrite_required: true
statement_en_md: |
  There are `n` cities. The matrix `is_connected` is `n x n` with 0/1 entries: `is_connected[i][j] == 1`
  means city `i` and city `j` are directly connected (the matrix is symmetric and the diagonal is 1). A
  province is a group of cities connected directly or indirectly. Return the number of provinces. A
  disjoint set union (DSU) with path compression solves it in near-linear time over the matrix entries.
statement_vi_md: |
  Viết `count_provinces(is_connected)`: `is_connected` là ma trận vuông `n x n` gồm 0/1, trong đó
  `is_connected[i][j] == 1` nghĩa là thành phố `i` và `j` nối trực tiếp (ma trận đối xứng, đường chéo là 1).
  Một province là nhóm thành phố liên thông trực tiếp hoặc gián tiếp. Trả về số province. Gợi ý: dùng DSU,
  bắt đầu với `n` tập và giảm 1 mỗi lần `union` gộp hai tập khác nhau.
constraints:
- 1 <= n <= 200
- is_connected[i][j] is 0 or 1
- is_connected[i][i] == 1 and is_connected[i][j] == is_connected[j][i]
examples:
- input: is_connected = [[1, 1, 0], [1, 1, 0], [0, 0, 1]]
  output: '2'
  explain_vi: Thành phố 0 và 1 nối với nhau (một province), thành phố 2 đứng riêng nên có 2 province.
io:
  mode: function
  entry: count_provinces
  params:
  - name: is_connected
    type: list[list[int]]
  returns: int
  compare: exact
starter:
  python: |
    def count_provinces(is_connected):
        # TODO: DSU; count = n, mỗi union thành công giảm count đi 1
        pass
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 8
hints:
- Mỗi province là một thành phần liên thông. Hãy coi mỗi thành phố là một tập riêng rồi gộp các tập có cạnh nối.
- "DSU gồm parent = list(range(n)) và find(x) đi theo parent cho tới root (có thể nén đường: parent[x] = parent[parent[x]]). Với mỗi cặp i < j có is_connected[i][j] == 1, tìm ri, rj."
- "Nếu ri != rj thì nối parent[rj] = ri và giảm count (bắt đầu từ n). Nếu ri == rj thì bỏ qua. Cuối cùng trả count."
solution:
