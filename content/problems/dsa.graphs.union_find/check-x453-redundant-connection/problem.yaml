hints:
- Thêm cạnh vào một cây tạo đúng một chu trình. Khi nào thêm một cạnh mới nối hai node vốn đã liên thông?
- "Dùng DSU với parent = list(range(n + 1)) (node đánh số từ 1). Với mỗi cạnh [u, v], tính ru = find(u), rv = find(v)."
- "Nếu ru == rv thì [u, v] là cạnh thừa, đây là đáp án. Ngược lại nối parent[ru] = rv (hoặc theo size) rồi xét cạnh kế tiếp."
