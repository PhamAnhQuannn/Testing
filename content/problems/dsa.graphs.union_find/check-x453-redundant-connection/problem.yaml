title: 'Check X453: redundant_connection'
title_vi: 'Kiểm tra X453: redundant_connection'
difficulty: easy
source:
  type: leetcode
  lc: 684
  rewrite_required: true
statement_en_md: |
  A tree with nodes `1..n` had one extra edge added, giving `edges` (a list of `[u, v]`, `n` edges in total,
  no repeated edge). Scan the edges from left to right and return the edge `[u, v]` whose endpoints are
  already connected when it is reached, i.e. the edge that closes the cycle. Since the graph has exactly one
  cycle, there is exactly one such edge; return the one that appears last in the input among the edges of
  that cycle. A DSU `union` that fails identifies it.
statement_vi_md: |
  Viết `redundant_connection(edges)`: một cây có các node `1..n` được thêm đúng một cạnh nên có `n` cạnh
  `[u, v]` trong `edges` (không có cạnh lặp). Duyệt cạnh từ trái sang phải và trả về cạnh mà khi gặp thì hai
  đầu đã liên thông, tức cạnh khép chu trình (đồ thị chỉ có đúng một chu trình nên chỉ có một cạnh như vậy,
  chính là cạnh xuất hiện cuối cùng trong input trong số các cạnh của chu trình). `union` thất bại trong DSU
  chính là dấu hiệu.
constraints:
- 3 <= n <= 1000
- edges.length == n
- 1 <= u < v <= n is not guaranteed; u != v and no repeated edge
- the graph is connected and has exactly one cycle
examples:
- input: edges = [[1, 2], [1, 3], [2, 3]]
  output: '[2, 3]'
  explain_vi: Cạnh [1,2] và [1,3] nối 1, 2, 3 lại; cạnh [2,3] có hai đầu đã liên thông nên là cạnh thừa.
