statement_en_md: |
  Given two strings `text1` and `text2`, return the length of their longest common subsequence (LCS).
  A subsequence keeps the relative order of characters but may skip some. If there is no common
  subsequence, return 0. Two-dimensional DP over prefixes solves it in O(n*m).
statement_vi_md: |
  Viết `longest_common_subsequence(text1, text2)` trả về độ dài của dãy con chung dài nhất (LCS) của hai
  chuỗi. Dãy con giữ nguyên thứ tự ký tự nhưng được phép bỏ bớt ký tự. Nếu không có ký tự chung thì trả
  `0`. Gợi ý: `dp[i][j]` là LCS của `i` ký tự đầu của `text1` và `j` ký tự đầu của `text2`.
constraints:
- 0 <= len(text1), len(text2) <= 1000
- Both strings consist of lowercase English letters
examples:
- input: 'text1 = "abcde", text2 = "ace"'
  output: '3'
  explain_vi: '"ace" là dãy con chung dài nhất, độ dài 3.'
io:
  mode: function
  entry: longest_common_subsequence
  params:
  - name: text1
    type: str
  - name: text2
    type: str
  returns: int
  compare: exact
starter:
