  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 8
hints:
- "Xét hai prefix: text1[:i] và text2[:j]. Chỉ cần nhìn ký tự cuối của hai prefix để quyết định."
- "Tạo dp (n+1) x (m+1) toàn 0. Nếu text1[i-1] == text2[j-1] thì dp[i][j] = dp[i-1][j-1] + 1."
- "Nếu ký tự cuối khác nhau thì dp[i][j] = max(dp[i-1][j], dp[i][j-1]). Đáp án là dp[n][m]."
