        pass
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 10
hints:
- "Hàng 0 và cột 0 là trường hợp cơ sở: biến chuỗi rỗng thành j ký tự cần j lần chèn, và ngược lại cần i lần xóa."
- "Nếu word1[i-1] == word2[j-1] thì không tốn thêm: dp[i][j] = dp[i-1][j-1]."
- "Ngược lại dp[i][j] = 1 + min(dp[i-1][j] (xóa), dp[i][j-1] (chèn), dp[i-1][j-1] (thay)). Đáp án dp[n][m]."
