title: 'Check X479: min_distance'
title_vi: 'Kiểm tra X479: min_distance'
difficulty: easy
source:
  type: leetcode
  lc: 72
  rewrite_required: true
statement_en_md: |
  Given two strings `word1` and `word2`, return the minimum number of operations to convert `word1`
  to `word2`. Allowed operations: insert a character, delete a character, replace a character.
statement_vi_md: |
  Viết `min_distance(word1, word2)` trả về số thao tác ít nhất để biến `word1` thành `word2`. Mỗi thao tác
  là chèn một ký tự, xóa một ký tự hoặc thay một ký tự. Gợi ý: `dp[i][j]` là edit distance giữa `i` ký tự
  đầu của `word1` và `j` ký tự đầu của `word2`.
constraints:
- 0 <= len(word1), len(word2) <= 500
- Both strings consist of lowercase English letters
examples:
- input: 'word1 = "horse", word2 = "ros"'
  output: '3'
  explain_vi: 'horse -> rorse (thay h bằng r) -> rose (xóa r) -> ros (xóa e): 3 thao tác.'
io:
  mode: function
  entry: min_distance
  params:
  - name: word1
    type: str
  - name: word2
    type: str
  returns: int
  compare: exact
starter:
  python: |
