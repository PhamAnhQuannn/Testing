id: check-x669-reg-loss
subtopic_id: ml.fundamentals.bias_variance_overfitting
secondary_subtopics: []
kind: check
title: 'Check X669: regularized loss'
title_vi: 'Kiểm tra X669: loss có regularization'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `reg_loss(base, weights, lam, kind)`: the regularized loss. `base` is the base loss (float),
  `weights` a list of numbers, `lam` the regularization strength (float) and `kind` a string.
  If `kind == "l2"` add `lam * sum(w^2)`; if `kind == "l1"` add `lam * sum(|w|)`; for `"none"` (or any
  other kind) add nothing. Return `round(base + penalty, 6)` as a float. An empty `weights` list has
  penalty 0.
statement_vi_md: |
  Cài `reg_loss(base, weights, lam, kind)`: loss có regularization. `base` là loss gốc (float), `weights` là
  danh sách trọng số, `lam` là độ mạnh phạt (float), `kind` là chuỗi. Nếu `kind == "l2"` cộng
  `lam * sum(w²)`; nếu `kind == "l1"` cộng `lam * sum(|w|)`; `"none"` (hoặc kind lạ) không cộng gì. Trả
  `round(base + penalty, 6)` dạng float. `weights` rỗng thì phạt bằng 0.
constraints:
- 0 <= len(weights) <= 100
- kind is any string; only "l2" and "l1" add a penalty
examples:
- input: base = 0.5, weights = [1, -2], lam = 0.1, kind = "l2"
  output: '1.0'
  explain_vi: 0,5 + 0,1·(1² + 2²) = 1,0.
- input: base = 0.5, weights = [1, -2], lam = 0.1, kind = "l1"
  output: '0.8'
  explain_vi: 0,5 + 0,1·(|1| + |−2|) = 0,8.
io:
  mode: function
  entry: reg_loss
  params:
  - name: base
    type: float
  - name: weights
    type: list
  - name: lam
    type: float
  - name: kind
    type: str
  returns: float
  compare: float_tol
