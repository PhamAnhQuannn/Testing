time_target_min: 6
hints:
- L2 là tổng bình phương trọng số, L1 là tổng trị tuyệt đối.
- "penalty = lam * sum(w * w for w in weights) cho l2, lam * sum(abs(w) for w in weights) cho l1."
- "kind khác l1/l2 (kể cả none) thì penalty = 0; chỉ round ở kết quả cuối."
solution:
