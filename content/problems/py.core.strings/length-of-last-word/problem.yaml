id: length-of-last-word
subtopic_id: py.core.strings
secondary_subtopics: []
kind: practice
title: "Length of Last Word"
title_vi: "Độ dài từ cuối cùng"
difficulty: easy
source: {type: leetcode, lc: 58, rewrite_required: true}
statement_en_md: |
  Given a string `s` consisting of words and spaces, return the length of the **last** word in the
  string. A word is a maximal substring of non-space characters. `s` contains at least one word.
statement_vi_md: |
  Cho chuỗi `s` gồm các từ và dấu cách. Trả về độ dài của từ **cuối cùng** trong chuỗi. Một từ là
  dãy ký tự liên tiếp không chứa dấu cách. `s` có ít nhất một từ.
constraints:
  - "1 <= len(s) <= 10^4"
  - "s consists of English letters and spaces only; it contains at least one word"
examples:
  - {input: 's = "Hello World"', output: "5", explain_vi: "Từ cuối là \"World\", dài 5."}
  - {input: 's = "   fly me   to   the moon  "', output: "4", explain_vi: "Dấu cách ở cuối bị bỏ qua; từ cuối là \"moon\", dài 4."}
  - {input: 's = "luffy is still joyboy"', output: "6", explain_vi: "Từ cuối là \"joyboy\", dài 6."}
