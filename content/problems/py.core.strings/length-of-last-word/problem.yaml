time_target_min: 8
hints:
  - "Chuỗi có thể kết thúc bằng dấu cách. Dùng `s.rstrip()` để bỏ chúng đi trước."
  - "`t.rfind(\" \")` trả vị trí dấu cách cuối cùng của `t`, hoặc `-1` nếu không có dấu cách nào."
  - "Với `t = s.rstrip()`, từ cuối bắt đầu sau vị trí `t.rfind(\" \")`, nên độ dài là `len(t) - t.rfind(\" \") - 1` (đúng cả khi không có dấu cách vì `rfind` trả -1)."
