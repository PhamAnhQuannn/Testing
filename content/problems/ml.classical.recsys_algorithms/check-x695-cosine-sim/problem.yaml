title: 'Check X695: cosine similarity'
title_vi: 'Kiểm tra X695: cosine similarity'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `cosine_sim(a, b)` that returns the cosine similarity of two equal-length vectors:
  `dot(a, b) / (|a| * |b|)`, rounded to 6 decimals. If either vector has norm 0 (all zeros), return `0.0`.
  For `a = [1.0, 0.0]`, `b = [1.0, 0.0]` the result is `1.0`; for `[1.0, 0.0]` and `[0.0, 1.0]` it is `0.0`.
statement_vi_md: |
  Cài `cosine_sim(a, b)` trả cosine similarity của hai vector cùng độ dài: `dot(a, b) / (|a| * |b|)`,
  làm tròn 6 chữ số. Nếu một vector có độ dài 0 (toàn số 0) thì trả `0.0`.
  Với `a = [1.0, 0.0]`, `b = [1.0, 0.0]` kết quả là `1.0`; với `[1.0, 0.0]` và `[0.0, 1.0]` kết quả là `0.0`.
constraints:
- 1 <= len(a) == len(b) <= 1000
- Phần tử là số thực hữu hạn
examples:
- input: a = [1.0, 0.0], b = [1.0, 0.0]
  output: '1.0'
  explain_vi: Hai vector cùng hướng nên cosine bằng 1.
