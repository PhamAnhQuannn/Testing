id: check-x595-project-tasks
subtopic_id: lld.process.entities_relationships
secondary_subtopics: []
kind: check
title: 'Check X595: Project with Tasks (composition)'
title_vi: 'Kiểm tra X595: Dự án chứa các việc (composition)'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Noun-verb analysis of "a project has tasks; you add tasks and complete them": the nouns
  are `Project` and `Task`, the verbs are `add_task` and `complete`. A `Project` HAS-A collection of
  tasks (composition): the project owns its tasks and holds the behaviour.

  Implement `class Project` (constructor `Project(name)`) with:

  - `add_task(name)`: adds a pending (not done) task called `name`. Returns nothing. If a task with
    that name already exists, ignore the call (the existing task, done or not, is unchanged).
  - `complete(name)`: marks the task called `name` as done. Returns nothing. No-op if there is no
    such task or it is already done.
  - `pending()`: returns the `int` number of tasks that are not done yet.
  - `done_names()`: returns the list of names of completed tasks, sorted ascending.
statement_vi_md: |
  Phân tích danh từ - động từ cho "dự án có nhiều việc; thêm việc và hoàn thành việc": danh từ là
  `Project` và `Task`, động từ là `add_task` và `complete`. `Project` HAS-A tập các việc
  (composition): dự án sở hữu các việc và giữ hành vi.

  Viết `class Project` (constructor `Project(name)`) với:

  - `add_task(name)`: thêm một việc chưa xong tên `name`. Không trả gì. Nếu đã có việc cùng tên thì
    bỏ qua (việc cũ, dù xong hay chưa, giữ nguyên).
  - `complete(name)`: đánh dấu việc tên `name` là đã xong. Không trả gì. Không làm gì nếu không có
    việc đó hoặc việc đã xong.
  - `pending()`: trả số (`int`) việc chưa xong.
  - `done_names()`: trả list tên các việc đã xong, sắp xếp tăng dần.
constraints:
- 'name là chuỗi không rỗng.'
- 'Không dùng float, thread, time hay random.'
examples:
- input: ops = ['Project', 'add_task', 'add_task', 'complete', 'pending', 'done_names'], args = [['p1'], ['a'], ['b'], ['a'], [], []]
  output: '[null, null, null, null, 1, ["a"]]'
  explain_vi: 'Thêm a, b rồi hoàn thành a: còn 1 việc chưa xong, danh sách đã xong là ["a"].'
io:
  mode: class_ops
  compare: exact
starter:
  python: "class Project:\n    # TODO\n    pass\n"
