id: check-x638-grad-mse
subtopic_id: ml.math.derivatives_gradients
secondary_subtopics: []
kind: check
title: 'Check X638: gradient of MSE'
title_vi: 'Kiểm tra X638: gradient của MSE'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `grad_mse(w, xs, ys)`, the gradient of the mean squared error of the model `y_hat = w * x`
  with respect to `w`. With `n = len(xs)` data points `(x_i, y_i)`:

  `loss(w) = mean((w * x_i - y_i) ** 2)`

  `grad = mean(2 * (w * x_i - y_i) * x_i)` over all pairs, i.e. `(1/n) * sum(2 * (w * x_i - y_i) * x_i)`.

  `xs` and `ys` are non-empty lists of numbers with equal length, `w` is a number. Return the gradient as a
  float rounded with `round(value, 6)`.
statement_vi_md: |
  Cài `grad_mse(w, xs, ys)`: gradient theo `w` của mean squared error cho mô hình `y_hat = w * x`.
  Với `n = len(xs)` điểm dữ liệu `(x_i, y_i)`:

  `loss(w) = mean((w * x_i - y_i) ** 2)`

  `grad = mean(2 * (w * x_i - y_i) * x_i)` trên mọi cặp, tức `(1/n) * sum(2 * (w * x_i - y_i) * x_i)`.

  `xs`, `ys` là list số không rỗng, cùng độ dài; `w` là số. Trả về gradient dạng float đã làm tròn
  bằng `round(value, 6)`.
constraints:
- 1 <= len(xs) == len(ys) <= 1000
- values are finite numbers with small magnitude
examples:
- input: w = 3, xs = [2], ys = [1]
  output: '20.0'
  explain_vi: 2 * (3*2 - 1) * 2 = 20; chỉ có một điểm nên trung bình bằng chính nó.
