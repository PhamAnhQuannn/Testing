id: check-x577-payment-adapter
subtopic_id: lld.patterns.structural_adapter_facade_proxy
secondary_subtopics: []
kind: check
title: 'Check X577: Payment Adapter'
title_vi: 'Kiểm tra X577: Adapter thanh toán'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Adapter pattern: a legacy gateway only understands payments in CENTS, but new code wants to call
  `pay(amount)` with whole currency units. Wrap the legacy gateway so the new interface works.
  Money is an `int` (no floats).

  Implement `class PaymentAdapter` (constructor takes no arguments, legacy total starts at 0 cents) with:

  - `pay(amount)`: `amount` is a whole number of currency units; converts it to cents (`amount * 100`)
    and adds it to the legacy total. Returns nothing.
  - `total_cents()`: returns the accumulated total in cents (an int).
  - `refund(amount)`: subtracts `amount * 100` cents from the total, but the total never goes below 0.
    Returns nothing.
statement_vi_md: |
  Mẫu Adapter: hệ thống cũ chỉ hiểu thanh toán bằng CENT, còn code mới muốn gọi `pay(amount)` với số
  đơn vị tiền nguyên. Bọc hệ thống cũ lại để interface mới dùng được. Tiền là `int` (không dùng float).

  Viết `class PaymentAdapter` (constructor không tham số, tổng của hệ thống cũ ban đầu 0 cent) với:

  - `pay(amount)`: `amount` là số đơn vị tiền nguyên; đổi sang cent (`amount * 100`) rồi cộng vào tổng
    của hệ thống cũ. Không trả gì.
  - `total_cents()`: trả tổng đã cộng dồn tính bằng cent (int).
  - `refund(amount)`: trừ `amount * 100` cent khỏi tổng, nhưng tổng không bao giờ nhỏ hơn 0. Không trả gì.
constraints:
- 'amount là số nguyên không âm.'
- 'Không dùng float, thread, time hay random.'
examples:
- input: ops = ['PaymentAdapter', 'pay', 'pay', 'total_cents'], args = [[], [25], [10], []]
  output: '[null, null, null, 3500]'
  explain_vi: 'pay(25) thành 2500 cent, pay(10) thành 1000 cent; tổng 3500.'
io:
