limits: {time_ms: 500, memory_mb: 256, time_multiplier: {pyodide: 3}}
time_target_min: 15
hints:
  - "Chỉ cần nhớ k số lớn nhất đã thấy; số lớn thứ k chính là số nhỏ nhất trong nhóm đó."
  - "Dùng min-heap `heap`: sau mỗi số mới `heappush(heap, x)`; nếu `len(heap) > k` thì `heappop(heap)` để bỏ số nhỏ nhất. Nhỏ nhất của heap luôn nằm ở `heap[0]`."
  - "Sau mỗi số, nếu `len(heap) == k` thì thêm `heap[0]` vào kết quả, ngược lại thêm `-1`. Mỗi bước tốn O(log k)."
