id: running-kth-largest
subtopic_id: py.datastructs.heapq_bisect
secondary_subtopics: []
kind: practice
title: "Running Kth Largest"
title_vi: "Phần tử lớn thứ k theo từng bước"
difficulty: easy
source: {type: original}
statement_en_md: |
  Numbers arrive one at a time. Given the list `nums` (in arrival order) and an integer `k`,
  return a list `result` of the same length where `result[i]` is the k-th largest value among
  `nums[0..i]` (duplicates count separately), or `-1` if fewer than `k` numbers have arrived.
statement_vi_md: |
  Các số lần lượt xuất hiện theo thứ tự trong list `nums`. Cho `nums` và số nguyên `k`, trả về
  list `result` cùng độ dài, trong đó `result[i]` là số **lớn thứ k** trong `nums[0..i]` (số trùng
  tính riêng từng lần), hoặc `-1` nếu mới có ít hơn `k` số.
constraints:
  - "1 <= len(nums) <= 2 * 10^4"
  - "1 <= k <= 10^5"
  - "0 <= nums[i] <= 10^4"
examples:
  - {input: "nums = [4, 5, 8, 2], k = 3", output: "[-1, -1, 4, 4]", explain_vi: "Sau 3 số {4,5,8} số lớn thứ 3 là 4; thêm 2 thì {8,5,4,2}, số lớn thứ 3 vẫn là 4."}
  - {input: "nums = [3, 1, 9, 7, 5], k = 2", output: "[-1, 1, 3, 7, 7]", explain_vi: "Sau {3,1}: lớn thứ 2 là 1; sau {3,1,9}: 3; sau {3,1,9,7}: 7; sau thêm 5: vẫn 7."}
