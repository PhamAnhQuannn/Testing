title: 'Check X323: bisect_ranges'
title_vi: 'Kiểm tra X323: bisect_ranges'
difficulty: easy
source:
  type: original
statement_en_md: 'Implement `bisect_ranges(sorted_xs, queries)`. `sorted_xs` is sorted ascending (duplicates
  allowed). For each query `q`, in order, return `[lo, hi]` where `lo` is the first index at which `q`
  could be inserted keeping order (leftmost) and `hi` is the last such index (rightmost). So `hi - lo`
  is the number of occurrences of `q`. Use the `bisect` module.

  '
statement_vi_md: 'Viết `bisect_ranges(sorted_xs, queries)`. `sorted_xs` đã sắp tăng dần (có thể trùng).
  Với mỗi truy vấn `q` theo thứ tự, trả về `[lo, hi]` trong đó `lo` là vị trí chèn trái nhất giữ nguyên
  thứ tự, `hi` là vị trí chèn phải nhất. Như vậy `hi - lo` là số lần `q` xuất hiện. Dùng module `bisect`.

  '
constraints:
- 0 <= len(sorted_xs) <= 10^5
- 0 <= len(queries) <= 10^4
examples:
- input: sorted_xs = [1, 2, 2, 2, 5], queries = [2, 3, 9]
  output: '[[1, 4], [4, 4], [5, 5]]'
  explain_vi: 2 xuất hiện 3 lần (chỉ số 1..3); 3 chưa có nên lo = hi = 4.
