id: check-x741-collect-results
subtopic_id: py.typing_testing.pytest_testing
secondary_subtopics: []
kind: check
title: 'Check X741: collect results'
title_vi: 'Kiểm tra X741: tổng hợp kết quả test'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `collect_results(tests)`, a tiny test runner report. `tests` is a list of `[name, got, want]`
  triples (`name` is a string, `got` and `want` are any comparable values). A test passes if and only if
  `got == want`. Return a dict `{"passed": <int>, "failed": <int>, "failures": [<names of failed tests in
  input order>]}`.
  For `tests = [["t_add", 3, 3], ["t_sub", 1, 2], ["t_mul", 6, 6]]` the result is
  `{"passed": 2, "failed": 1, "failures": ["t_sub"]}`. For `[]` it is
  `{"passed": 0, "failed": 0, "failures": []}`.
statement_vi_md: |
  Cài `collect_results(tests)`, một báo cáo test runner thu nhỏ. `tests` là list các bộ ba `[name, got, want]`
  (name là chuỗi, got và want là giá trị bất kỳ so sánh được). Một test pass khi và chỉ khi `got == want`.
  Trả về dict `{"passed": <số nguyên>, "failed": <số nguyên>, "failures": [<tên các test fail theo thứ tự đầu
  vào>]}`. Với `tests = [["t_add", 3, 3], ["t_sub", 1, 2], ["t_mul", 6, 6]]` kết quả là
  `{"passed": 2, "failed": 1, "failures": ["t_sub"]}`. Với `[]` kết quả là
  `{"passed": 0, "failed": 0, "failures": []}`.
constraints:
- 'tests có thể rỗng'
- 'got và want có thể khác kiểu (ví dụ "12" và 12 thì không bằng nhau)'
- 'Tên test có thể trùng nhau; failures giữ đúng thứ tự và các lần trùng'
examples:
- input: 'tests = [["t_add", 3, 3], ["t_sub", 1, 2], ["t_mul", 6, 6]]'
  output: '{"passed": 2, "failed": 1, "failures": ["t_sub"]}'
  explain_vi: 'Chỉ t_sub có got khác want nên fail; hai test còn lại pass.'
io:
  mode: function
  entry: collect_results
  params:
  - name: tests
    type: list
  returns: dict
  compare: exact
starter:
  python: |
    def collect_results(tests):
        # TODO: đếm test pass/fail (got == want) và gom tên test fail theo thứ tự
        pass
time_target_min: 6
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
hints:
- Mỗi test chỉ là phép so sánh `got == want`; duyệt từng bộ ba theo thứ tự.
- "Dùng `for name, got, want in tests`, tăng bộ đếm passed hoặc thêm `name` vào list failures."
- "Trả `{\"passed\": passed, \"failed\": len(failures), \"failures\": failures}`."
solution:
  file: solution.py
  approach_vi: Duyệt từng bộ ba, so sánh got với want, đếm pass và gom tên test fail theo thứ tự đầu vào.
  complexity: O(n) / O(n)
tests:
  sample: tests/sample.jsonl
  hidden: tests/hidden.jsonl
  generator: tests/gen.py
tags:
- check
- x741
status: validated
version: 1
