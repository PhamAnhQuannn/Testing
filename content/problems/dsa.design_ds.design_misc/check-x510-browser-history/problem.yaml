id: check-x510-browser-history
subtopic_id: dsa.design_ds.design_misc
secondary_subtopics: []
kind: check
title: 'Check X510: Browser History'
title_vi: 'Kiểm tra X510: Browser History'
difficulty: easy
source:
  type: leetcode
  lc: 1472
  rewrite_required: true
statement_en_md: |
  Design `class BrowserHistory(homepage)`. `visit(url)` opens `url` from the current page and clears all
  forward history. `back(steps)` moves back at most `steps` pages (stops at the first page) and returns the
  current URL. `forward(steps)` moves forward at most `steps` pages (stops at the last page) and returns the
  current URL.
statement_vi_md: |
  Viết `class BrowserHistory(homepage)`. `visit(url)` mở `url` từ trang hiện tại và xoá toàn bộ lịch sử
  "tiến". `back(steps)` lùi tối đa `steps` trang (dừng ở trang đầu) và trả URL hiện tại. `forward(steps)`
  tiến tối đa `steps` trang (dừng ở trang cuối) và trả URL hiện tại.
constraints:
- 1 <= len(homepage), len(url) <= 20
- 1 <= steps <= 100
- Tối đa 5000 lần gọi.
examples:
- input: ops = ['BrowserHistory', 'visit', 'visit', 'back', 'forward', 'visit', 'forward', 'back'], args = [['a.com'], ['b.com'], ['c.com'], [1], [1], ['d.com'], [3], [2]]
  output: '[null, null, null, "b.com", "c.com", null, "d.com", "b.com"]'
  explain_vi: 'Sau `visit("d.com")` từ c.com, lịch sử là a, b, c, d nên `forward(3)` dừng ở d; `back(2)` về b.'
io:
  mode: class_ops
  compare: exact
starter:
  python: "class BrowserHistory:\n    # TODO\n    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 10
hints:
- Giữ một danh sách các trang và một chỉ số trang hiện tại.
- '`back`/`forward` chỉ dịch chỉ số, kẹp trong `[0, len-1]`. `visit` phải cắt bỏ mọi trang sau chỉ số hiện tại rồi thêm trang mới.'
- Quên cắt phần "tiến" khi `visit` là lỗi phổ biến nhất; kiểm tra `visit` sau khi `back`.
solution:
  file: solution.py
  approach_vi: Danh sách trang + con trỏ; visit cắt đuôi rồi append, back/forward kẹp chỉ số.
  complexity: O(1) khấu hao mỗi thao tác (visit cắt đuôi nhưng mỗi phần tử bị xoá tối đa một lần)
tests:
