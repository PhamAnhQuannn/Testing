id: check-x525-file-search
subtopic_id: dsa.practical.file_system_sim
secondary_subtopics: []
kind: check
title: 'Check X525: File store: size and search'
title_vi: 'Kiểm tra X525: File store: tổng dung lượng và tìm kiếm'
difficulty: easy
source:
  type: original
statement_en_md: |
  Implement `class FileStore`, an in-memory store of files identified by absolute path.

  - `add_file(path, size)`: record a file of integer `size` at `path`. Missing parent directories are created implicitly. Adding an existing path replaces its size.
  - `total_size(dir_path)`: total size of all files anywhere under the directory `dir_path` (recursive). `/` covers every file. A directory with no files (or an unknown one) gives `0`.
  - `find_by_min_size(dir_path, min_size)`: full paths of all files under `dir_path` whose size is `>= min_size`, sorted ascending (string order). No match gives `[]`.
  - Directory matching is by whole path segments: `/a` does not include `/ab/f`.
statement_vi_md: |
  Viết `class FileStore`, kho file trong bộ nhớ định danh bằng đường dẫn tuyệt đối.

  - `add_file(path, size)`: ghi nhận một file có `size` (số nguyên) tại `path`. Thư mục cha còn thiếu được tạo ngầm. Thêm lại cùng path thì thay size.
  - `total_size(dir_path)`: tổng size mọi file nằm dưới thư mục `dir_path` (đệ quy, ở mọi độ sâu). `/` bao gồm mọi file. Thư mục không có file (hoặc không tồn tại) cho `0`.
  - `find_by_min_size(dir_path, min_size)`: đường dẫn đầy đủ của mọi file dưới `dir_path` có size `>= min_size`, sắp xếp tăng dần (theo thứ tự chuỗi). Không có kết quả thì trả `[]`.
  - Khớp thư mục theo từng segment nguyên: `/a` không bao gồm `/ab/f`.
constraints:
- 'Đường dẫn bắt đầu bằng `/`; size và min_size là số nguyên không âm.'
- Số file tối đa khoảng 1000.
examples:
- input: "ops = ['FileStore', 'add_file', 'add_file', 'add_file', 'total_size', 'find_by_min_size'], args = [[], ['/a/x.txt', 10], ['/a/b/y.txt', 30], ['/c/z.txt', 5], ['/a'], ['/a', 20]]"
  output: "[null, null, null, null, 40, ['/a/b/y.txt']]"
  explain_vi: "Dưới `/a` có 10 + 30 = 40; chỉ `/a/b/y.txt` có size >= 20."
