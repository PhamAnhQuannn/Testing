- "Với mỗi ô, đếm hàng xóm sống trong 8 hướng (bỏ qua ô ngoài biên). Ô sống: sống tiếp nếu số hàng xóm là 2 hoặc 3. Ô chết: sống nếu đúng 3."
- "Bọc luật trên trong vòng lặp `for _ in range(steps)`, gán bảng cũ = bảng mới sau mỗi vòng; steps = 0 thì trả bản sao của board."
