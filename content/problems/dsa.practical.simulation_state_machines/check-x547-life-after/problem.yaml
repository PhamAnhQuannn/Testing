kind: check
title: 'Check X547: life_after'
title_vi: 'Kiểm tra X547: life_after'
difficulty: easy
source:
  type: original
statement_en_md: |
  Conway's Game of Life on a finite `rows x cols` board of 0/1 cells (1 = alive); cells outside the board
  count as dead. In one generation, every cell updates simultaneously from the previous board: a live cell
  with 2 or 3 live neighbours (of its 8 neighbours) survives, otherwise it dies; a dead cell with exactly 3
  live neighbours becomes alive. Return the board after `steps` generations. `steps == 0` returns an
  unchanged copy. Do not mutate the input.
statement_vi_md: |
  Trò chơi Game of Life của Conway trên bảng hữu hạn `rows x cols` gồm 0/1 (1 là sống); ô ngoài bảng coi
  như chết. Mỗi thế hệ, mọi ô cập nhật đồng thời từ bảng cũ: ô sống có 2 hoặc 3 hàng xóm sống (trong 8 ô
  quanh nó) thì sống tiếp, ngược lại chết; ô chết có đúng 3 hàng xóm sống thì thành sống. Viết
  `life_after(board, steps)` trả về bảng sau `steps` thế hệ. `steps == 0` trả về bản sao không đổi. Không
  sửa bảng đầu vào. Gợi ý: mỗi bước tạo bảng mới (double buffer).
constraints:
- 1 <= rows, cols <= 30
- 0 <= steps <= 20
- board[r][c] is 0 or 1
examples:
- input: board = [[0, 1, 0], [0, 1, 0], [0, 1, 0]], steps = 1
  output: '[[0, 0, 0], [1, 1, 1], [0, 0, 0]]'
  explain_vi: Blinker dọc quay thành ngang sau một thế hệ.
io:
  mode: function
  entry: life_after
  params:
  - name: board
    type: list[list[int]]
  - name: steps
    type: int
  returns: any
  compare: exact
