statement_en_md: |-
  Given a list `weights` of rope lengths, connecting two ropes costs the sum of their lengths and
  produces one rope of that length. Return the minimum total cost to connect all ropes into one
  (0 if there are fewer than 2 ropes). Implement `min_cost_ropes(weights)`.
statement_vi_md: |-
  Cho list độ dài các sợi dây. Nối hai sợi tốn chi phí bằng tổng độ dài và tạo ra một sợi mới có
  độ dài đó. Trả tổng chi phí nhỏ nhất để nối tất cả thành một sợi (0 nếu có ít hơn 2 sợi).
constraints: []
examples:
- input: weights = [4, 3, 2, 6]
  output: '29'
  explain_vi: 'Nối 2+3=5, rồi 4+5=9, rồi 6+9=15: tổng 5+9+15=29.'
