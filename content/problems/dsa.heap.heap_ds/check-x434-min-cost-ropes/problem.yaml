hints:
- Chi phí mỗi lần nối là tổng hai sợi; sợi mới lại tham gia các lần nối sau. Nên nối sợi nào trước?
- Luôn nối hai sợi ngắn nhất. Cần cấu trúc lấy nhanh phần tử nhỏ nhất và thêm phần tử mới (heap).
- Dùng `heapq.heapify`, lặp khi còn ít nhất 2 sợi, pop hai lần, cộng vào tổng, push tổng của hai sợi vào lại.
