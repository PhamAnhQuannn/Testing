kind: check
title: 'Check X645: expectation and variance'
title_vi: 'Kiểm tra X645: kỳ vọng và phương sai'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `expectation_variance(xs, ps)`. `xs` lists the values of a discrete random variable X and `ps`
  the matching probabilities (`ps[i] = P(X = xs[i])`, summing to about 1). Return a list `[E, Var]` where
  `E = sum(xs[i] * ps[i])` and `Var = sum(ps[i] * (xs[i] - E)^2)` (equal to `E[X^2] - E[X]^2`). Round each
  of the two numbers with `round(v, 6)`.
statement_vi_md: |
  Cài `expectation_variance(xs, ps)`. `xs` là các giá trị của biến ngẫu nhiên rời rạc X, `ps` là xác suất tương ứng
  (`ps[i] = P(X = xs[i])`, tổng xấp xỉ 1). Trả list `[E, Var]` với `E = Σ xs[i]·ps[i]` và
  `Var = Σ ps[i]·(xs[i] − E)²` (bằng `E[X²] − E[X]²`). Mỗi số làm tròn `round(v, 6)`.
constraints:
- 1 <= len(xs) == len(ps) <= 100
- 0 <= ps[i] <= 1
examples:
- input: xs = [0, 1], ps = [0.5, 0.5]
  output: '[0.5, 0.25]'
  explain_vi: E = 0,5; Var = 0,5·0,25 + 0,5·0,25 = 0,25.
