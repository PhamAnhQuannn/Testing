id: check-x701-bow
subtopic_id: ml.nlp_transformers.classic_nlp
secondary_subtopics: []
kind: check
title: 'Check X701: bag of words'
title_vi: 'Kiểm tra X701: bag-of-words'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `bag_of_words(doc, vocab)`. `doc` is a list of token strings and `vocab` is a list of token strings.
  Return a list of integers where element `i` is the number of times `vocab[i]` appears in `doc`, in the order of
  `vocab` (duplicate vocab entries are counted independently). An empty `doc` gives all zeros.
  For `doc = ["mèo", "ăn", "cá", "mèo"]` and `vocab = ["mèo", "ăn", "cá", "chó"]` the result is `[2, 1, 1, 0]`.
statement_vi_md: |
  Cài `bag_of_words(doc, vocab)`. `doc` là list token (chuỗi), `vocab` là list token. Trả list số nguyên, phần tử `i`
  là số lần `vocab[i]` xuất hiện trong `doc`, theo thứ tự `vocab` (từ trùng trong vocab đếm độc lập). `doc` rỗng cho
  toàn số 0. Với `doc = ["mèo", "ăn", "cá", "mèo"]` và `vocab = ["mèo", "ăn", "cá", "chó"]` kết quả là `[2, 1, 1, 0]`.
constraints:
- 0 <= len(doc) <= 1000
- 0 <= len(vocab) <= 1000
- Token là chuỗi
examples:
- input: 'doc = ["mèo", "ăn", "cá", "mèo"], vocab = ["mèo", "ăn", "cá", "chó"]'
  output: '[2, 1, 1, 0]'
  explain_vi: '"mèo" xuất hiện 2 lần, "ăn" và "cá" 1 lần, "chó" không có nên 0.'
io:
  mode: function
  entry: bag_of_words
  params:
