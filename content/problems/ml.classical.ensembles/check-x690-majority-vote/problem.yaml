id: check-x690-majority-vote
subtopic_id: ml.classical.ensembles
secondary_subtopics: []
kind: check
title: 'Check X690: majority vote'
title_vi: 'Kiểm tra X690: bỏ phiếu đa số'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `majority_vote(predictions)` that combines the predictions of several models. `predictions[m][j]`
  is the integer label model `m` predicts for sample `j`. For each sample return the label with the most
  votes; on a tie return the smaller label. Return a list of ints, one per sample.
  For `[[0, 1, 1], [0, 0, 1], [1, 0, 1]]` the result is `[0, 0, 1]`.
statement_vi_md: |
  Cài `majority_vote(predictions)` gộp dự đoán của nhiều mô hình. `predictions[m][j]` là nhãn nguyên mô hình `m`
  dự đoán cho mẫu `j`. Với mỗi mẫu trả về nhãn có nhiều phiếu nhất; nếu hoà thì lấy nhãn nhỏ hơn. Trả về list số nguyên,
  mỗi mẫu một phần tử. Với `[[0, 1, 1], [0, 0, 1], [1, 0, 1]]` kết quả là `[0, 0, 1]`.
constraints:
- 'Có ít nhất 1 mô hình; mọi mô hình có cùng độ dài khác rỗng (ít nhất 1 mẫu)'
- 'Nhãn là số nguyên'
examples:
- input: 'predictions = [[0, 1, 1], [0, 0, 1], [1, 0, 1]]'
  output: '[0, 0, 1]'
  explain_vi: 'Mẫu 0 có phiếu 0,0,1 chọn 0; mẫu 1 có 1,0,0 chọn 0; mẫu 2 có 1,1,1 chọn 1.'
io:
  mode: function
  entry: majority_vote
  params:
  - name: predictions
    type: list
  returns: list
  compare: exact
starter:
  python: |
    def majority_vote(predictions):
        # TODO: với mỗi mẫu j đếm phiếu của các mô hình; chọn nhãn nhiều phiếu nhất, hoà thì nhãn nhỏ hơn
        pass
time_target_min: 6
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
hints:
- Lặp theo từng cột j (mẫu), gom nhãn predictions[m][j] của mọi mô hình m.
- Dùng dict đếm số phiếu cho từng nhãn.
- "Chọn bằng min(counts, key=lambda lab: (-counts[lab], lab)) để hoà thì lấy nhãn nhỏ hơn."
solution:
