hints:
- Viết ngữ pháp trước, mỗi mức ưu tiên một hàm. OR gọi AND, AND gọi NOT, NOT gọi atom, atom có thể là T, F hoặc ngoặc quay lại OR.
- "Tách `tokens = expr.split()` và giữ chỉ số `pos` dùng chung (nonlocal). `or_expr`: `v = and_expr()`, rồi `while tokens[pos] == 'OR'` thì tiến `pos` và `v = v or and_expr()` (nhớ luôn gọi and_expr để tiêu thụ token)."
- "`and_expr` tương tự với `AND`. `not_expr`: nếu token là `NOT` thì tiến `pos` và trả `not not_expr()`, ngược lại `atom()`. `atom`: `(` thì tiến, gọi `or_expr()`, bỏ qua `)`; còn lại trả `token == 'T'`."
