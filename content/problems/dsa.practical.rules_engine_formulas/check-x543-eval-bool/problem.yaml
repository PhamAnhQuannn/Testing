statement_en_md: |
  Evaluate a boolean expression string whose tokens are separated by single spaces: `T`, `F`, `AND`, `OR`,
  `NOT`, `(` and `)`. Precedence is `NOT` > `AND` > `OR`; `AND` and `OR` are left-associative and
  parentheses override precedence. Return a Python `bool`. Implement it with recursive descent (one function
  per precedence level); do not use `eval`.
statement_vi_md: |
  Viết `eval_bool(expr)`: `expr` là biểu thức gồm các token cách nhau bằng khoảng trắng: `T`, `F`, `AND`,
  `OR`, `NOT`, `(`, `)`. Độ ưu tiên `NOT` > `AND` > `OR`; `AND`/`OR` kết hợp trái; ngoặc đổi thứ tự. Trả về
  bool. Dùng recursive descent (mỗi mức ưu tiên một hàm), không dùng `eval`.
constraints:
- the expression is valid and non-empty; tokens are separated by single spaces
- at most 200 tokens
examples:
- input: expr = "T AND ( F OR NOT F )"
  output: 'true'
  explain_vi: NOT F = T, F OR T = T, rồi T AND T = T.
