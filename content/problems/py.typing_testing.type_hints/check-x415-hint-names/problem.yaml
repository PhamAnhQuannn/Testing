id: check-x415-hint-names
subtopic_id: py.typing_testing.type_hints
secondary_subtopics: []
kind: check
title: 'Check X415: hint_names'
title_vi: 'Kiểm tra X415: hint_names'
difficulty: easy
source:
  type: original
statement_en_md: Implement `hint_names(src, name)` as described in the Vietnamese statement (mastery
  check item X415, 5-minute time box).
statement_vi_md: |-
  Viết `hint_names(src, name)`. `src` là mã nguồn Python (chuỗi) định nghĩa một hàm tên `name`.
  Hãy `exec` mã đó trong một dict namespace mới, lấy hàm, rồi dùng `typing.get_type_hints` để
  trả list các chuỗi `"tên:kiểu"` theo đúng thứ tự khai báo, với `kiểu` là `__name__` của kiểu
  (kiểu trả về có tên `return`; `-> None` cho tên `NoneType`). Hàm không có annotation thì trả `[]`.
constraints: []
examples:
- input: 'src = "def f(a: int, b: str) -> bool:\n    return True\n", name = "f"'
  output: '["a:int", "b:str", "return:bool"]'
  explain_vi: get_type_hints trả dict a -> int, b -> str, return -> bool theo thứ tự khai báo.
io:
  mode: function
  entry: hint_names
  params:
  - name: src
    type: str
  - name: name
    type: str
  returns: list[str]
  compare: exact
starter:
  python: "from typing import get_type_hints\n\n\ndef hint_names(src, name):\n    # TODO\n    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 5
hints:
- Dùng `ns = {}` rồi `exec(src, ns)`; hàm nằm ở `ns[name]`.
- '`get_type_hints(fn)` trả dict tên -> kiểu, giữ đúng thứ tự khai báo (return ở cuối).'
- 'Duyệt `.items()` và ghép `f"{key}:{tp.__name__}"`.'
solution:
  file: solution.py
  approach_vi: exec mã vào namespace, lấy get_type_hints rồi định dạng tên kiểu.
  complexity: O(k)
tests:
  sample: tests/sample.jsonl
  hidden: tests/hidden.jsonl
  generator: tests/gen.py
tags:
- check
- x415
status: validated
version: 1
