hints:
- Mỗi node có `children` (chữ cái -> node con) và một cờ `is_end`; dict lồng dict là đủ.
- "`insert` đi từng chữ, thiếu thì tạo node con, hết từ thì bật cờ kết thúc. `search` và `starts_with` dùng chung một hàm đi theo chuỗi."
- "Hàm đi trả về node cuối (hoặc None nếu mất đường). `starts_with` chỉ cần node khác None; `search` cần thêm cờ kết thúc."
