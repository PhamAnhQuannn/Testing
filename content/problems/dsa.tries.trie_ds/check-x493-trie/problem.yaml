id: check-x493-trie
subtopic_id: dsa.tries.trie_ds
secondary_subtopics: []
kind: check
title: 'Check X493: Trie'
title_vi: 'Kiểm tra X493: Trie'
difficulty: easy
source:
  type: leetcode
  lc: 208
  rewrite_required: true
statement_en_md: |
  Implement `class Trie` (prefix tree) with:
  - `insert(word)`: add `word` to the trie.
  - `search(word)`: return `True` if exactly `word` was inserted before, else `False`.
  - `starts_with(prefix)`: return `True` if some inserted word starts with `prefix`, else `False`.
statement_vi_md: |
  Viết class `Trie` (cây tiền tố) gồm `insert(word)` thêm một từ, `search(word)` trả `True` nếu đúng từ
  `word` đã được thêm, và `starts_with(prefix)` trả `True` nếu có từ nào đã thêm bắt đầu bằng `prefix`.
  Chú ý: `search("app")` là `False` nếu chỉ mới thêm `"apple"`, vì cần cờ kết thúc từ ở node cuối.
constraints:
- 1 <= len(word), len(prefix) <= 2000
- word and prefix consist of lowercase English letters
- at most 30000 calls in total
examples:
- input: ops = ['Trie', 'insert', 'search', 'search', 'starts_with', 'insert', 'search'], args = [[], ['apple'], ['apple'], ['app'], ['app'], ['app'], ['app']]
  output: '[null, null, true, false, true, null, true]'
  explain_vi: Sau khi thêm "apple", search("apple") là true, search("app") là false nhưng starts_with("app") là true; thêm "app" thì search("app") thành true.
io:
  mode: class_ops
  compare: exact
