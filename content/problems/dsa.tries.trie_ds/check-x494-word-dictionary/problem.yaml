id: check-x494-word-dictionary
subtopic_id: dsa.tries.trie_ds
secondary_subtopics: []
kind: check
title: 'Check X494: Word Dictionary'
title_vi: 'Kiểm tra X494: Word Dictionary'
difficulty: easy
source:
  type: leetcode
  lc: 211
  rewrite_required: true
statement_en_md: |
  Implement `class WordDictionary` with:
  - `add_word(word)`: add `word` to the data structure.
  - `search(word)`: return `True` if some added word matches `word`, else `False`. `word` may contain
    `'.'`, which matches any single letter. A match must have the same length as `word`.
statement_vi_md: |
  Viết class `WordDictionary` gồm `add_word(word)` thêm một từ và `search(word)` trả `True` nếu có từ đã
  thêm khớp với `word`. Trong `word` của `search` có thể có ký tự `'.'` khớp với đúng một chữ cái bất kỳ;
  từ khớp phải có cùng độ dài. Gợi ý: trie + DFS, gặp `'.'` thì thử mọi node con.
constraints:
- 1 <= len(word) <= 25
- add_word words consist of lowercase English letters
- search words consist of lowercase letters or '.', with at most 2 dots
- at most 10000 calls in total
examples:
- input: ops = ['WordDictionary', 'add_word', 'add_word', 'add_word', 'search', 'search', 'search', 'search'], args = [[], ['bad'], ['dad'], ['mad'], ['pad'], ['bad'], ['.ad'], ['b..']]
  output: '[null, null, null, null, false, true, true, true]'
  explain_vi: '"pad" không có; "bad" có; ".ad" khớp "bad"/"dad"/"mad"; "b.." khớp "bad".'
io:
  mode: class_ops
  compare: exact
starter:
  python: "class WordDictionary:\n    def __init__(self):\n        # TODO: khởi tạo trie\n        pass\n\n    def add_word(self, word):\n        # TODO\n        pass\n\n    def search(self, word):\n        # TODO: xử lý ký tự '.' bằng DFS qua mọi node con\n        return False\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 10
hints:
- Dùng trie như bài Implement Trie cho `add_word`; phần khó là `search` có `'.'`.
- "Viết `dfs(node, i)`: nếu `i == len(word)` thì trả cờ kết thúc của node. Chữ thường thì đi tiếp một nhánh."
- "Gặp `'.'`, thử `dfs(child, i + 1)` cho mọi node con (bỏ qua khóa đánh dấu kết thúc), trả `True` nếu có nhánh nào thành công."
solution:
