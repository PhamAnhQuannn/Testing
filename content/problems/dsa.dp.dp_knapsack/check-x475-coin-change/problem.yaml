limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 8
hints:
- Gọi dp[a] là số đồng ít nhất để tạo đúng tổng a. dp[0] = 0, các ô còn lại ban đầu là "vô cực" (chưa tạo được).
- "Với mỗi a từ 1 đến amount và mỗi mệnh giá c <= a: dp[a] = min(dp[a], dp[a - c] + 1). Mỗi mệnh giá dùng lại được nên duyệt a tăng dần."
- "Cuối cùng nếu dp[amount] vẫn là giá trị vô cực (ví dụ amount + 1) thì trả -1, ngược lại trả dp[amount]."
solution:
  file: solution.py
  approach_vi: DP một chiều kiểu unbounded knapsack, dp[a] là số đồng ít nhất; ô vẫn là vô cực nghĩa là không tạo được.
  complexity: O(amount * len(coins)) / O(amount)
