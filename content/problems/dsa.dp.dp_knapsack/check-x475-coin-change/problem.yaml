id: check-x475-coin-change
subtopic_id: dsa.dp.dp_knapsack
secondary_subtopics: []
kind: check
title: 'Check X475: coin_change'
title_vi: 'Kiểm tra X475: coin_change'
difficulty: easy
source:
  type: leetcode
  lc: 322
  rewrite_required: true
statement_en_md: |
  Given an array `coins` of coin denominations and an integer `amount`, return the fewest number of coins
  needed to make up exactly `amount`. Each denomination may be used any number of times (unbounded
  knapsack). If the amount cannot be made up by any combination of the coins, return `-1`. An amount of
  `0` needs `0` coins.
statement_vi_md: |
  Viết `coin_change(coins, amount)`: `coins` là danh sách mệnh giá, `amount` là số tiền cần tạo. Trả về số
  đồng xu ít nhất để tổng đúng bằng `amount`; mỗi mệnh giá dùng bao nhiêu lần cũng được (unbounded
  knapsack). Nếu không thể tạo ra `amount` thì trả `-1`. `amount = 0` cần `0` đồng.
constraints:
- 1 <= len(coins) <= 12
- 1 <= coins[i] <= 10000, các mệnh giá đôi một khác nhau
- 0 <= amount <= 10000
examples:
- input: coins = [1, 2, 5], amount = 11
  output: '3'
  explain_vi: 11 = 5 + 5 + 1, cần 3 đồng; không có cách nào dùng ít hơn.
io:
  mode: function
  entry: coin_change
  params:
  - name: coins
    type: list[int]
  - name: amount
    type: int
  returns: int
  compare: exact
starter:
