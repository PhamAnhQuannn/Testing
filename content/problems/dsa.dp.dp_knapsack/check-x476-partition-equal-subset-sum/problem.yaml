title: 'Check X476: can_partition'
title_vi: 'Kiểm tra X476: can_partition'
difficulty: easy
source:
  type: leetcode
  lc: 416
  rewrite_required: true
statement_en_md: |
  Given an array `nums` of positive integers, return `True` if it can be split into two subsets whose sums
  are equal, otherwise `False`. Every element must belong to exactly one subset. This reduces to subset
  sum: is there a subset with sum `total / 2`? If the total is odd the answer is `False` immediately.
statement_vi_md: |
  Viết `can_partition(nums)`: `nums` là danh sách số nguyên dương. Trả `True` nếu chia được thành hai tập
  con có tổng bằng nhau (mỗi phần tử thuộc đúng một tập), ngược lại `False`. Quy về subset sum: có tập con
  nào tổng bằng `total / 2` không? Tổng lẻ thì trả `False` ngay.
constraints:
- 1 <= len(nums) <= 200
- 1 <= nums[i] <= 100
examples:
- input: nums = [1, 5, 11, 5]
  output: 'true'
  explain_vi: Tổng 22, mỗi nửa 11; chia được thành [11] và [1, 5, 5].
io:
  mode: function
  entry: can_partition
  params:
  - name: nums
    type: list[int]
  returns: bool
  compare: exact
starter:
  python: |
    def can_partition(nums):
        # TODO: tổng lẻ -> False; ngược lại subset sum với target = total // 2
        pass
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 10
hints:
- Hai nửa bằng nhau nên mỗi nửa có tổng total / 2. Nếu total lẻ thì không thể, trả False ngay.
- "Bài còn lại là subset sum: dp[s] = True nếu chọn được vài phần tử có tổng s. dp[0] = True, kích thước target + 1."
- "Với mỗi x trong nums, duyệt s từ target về x (giảm dần, vì mỗi phần tử chỉ dùng một lần): nếu dp[s - x] thì dp[s] = True. Trả dp[target]."
solution:
  file: solution.py
  approach_vi: Quy về subset sum với target = tổng / 2; DP một chiều kiểu 0/1 knapsack, duyệt s giảm dần.
  complexity: O(n * total) / O(total)
