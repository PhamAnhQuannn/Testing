id: check-x531-parse-query-string
subtopic_id: dsa.practical.api_http_json
secondary_subtopics: []
kind: check
title: 'Check X531: parse_query_string'
title_vi: 'Kiểm tra X531: parse_query_string'
difficulty: easy
source:
  type: original
statement_en_md: |
  Implement `parse_query_string(qs)`: parse a URL query string such as `"a=1&b=2&a=3"` into a dict of
  `str -> str`. Pairs are separated by `&` and split at the first `=`. If a key repeats, the last value
  wins. A bare key like `"x"` (no `=`) maps to `""`. The empty string gives `{}`. Empty segments (for
  example from `"a=1&&b=2"`) are ignored. No URL-decoding is needed.
statement_vi_md: |
  Viết `parse_query_string(qs)`: parse query string như `"a=1&b=2&a=3"` thành dict `str -> str`. Các cặp
  nối bằng `&` và tách ở dấu `=` đầu tiên. Khóa lặp thì giá trị cuối cùng thắng. Khóa trần như `"x"`
  (không có `=`) ánh xạ tới `""`. Chuỗi rỗng cho `{}`. Bỏ qua segment rỗng (ví dụ trong `"a=1&&b=2"`).
  Không cần URL-decode. Gợi ý: `split("&")` rồi `partition("=")`.
constraints:
- 0 <= len(qs) <= 1000
- qs contains no percent-encoding
examples:
- input: qs = "a=1&b=2&a=3"
  output: '{"a": "3", "b": "2"}'
  explain_vi: Khóa a lặp hai lần nên giá trị sau "3" thắng; b có giá trị "2".
