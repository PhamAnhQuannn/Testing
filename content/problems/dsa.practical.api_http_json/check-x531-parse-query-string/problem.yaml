hints:
- Query string là các cặp key=value nối bằng dấu &. Hãy tách chuỗi thành từng cặp trước.
- "Với mỗi cặp dùng part.partition('=') để được key, _, value. Khóa không có '=' sẽ cho value là chuỗi rỗng."
- "Gán result[key] = value theo thứ tự thì giá trị sau tự ghi đè giá trị trước. Bỏ qua cặp rỗng và trả {} cho chuỗi rỗng."
