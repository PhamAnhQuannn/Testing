    pyodide: 3
time_target_min: 10
hints:
- Tách pattern và path bằng split("/"). Nếu số segment khác nhau thì chắc chắn không khớp.
- "Duyệt từng cặp (p, s) bằng zip. Nếu p bắt đầu bằng ':' thì ghi params[p[1:]] = s; ngược lại p phải bằng s."
- "Gặp literal không bằng thì trả None ngay. Duyệt hết mà không lỗi thì trả params (có thể là {})."
solution:
