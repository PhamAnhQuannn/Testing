id: check-x532-match-route
subtopic_id: dsa.practical.api_http_json
secondary_subtopics: []
kind: check
title: 'Check X532: match_route'
title_vi: 'Kiểm tra X532: match_route'
difficulty: easy
source:
  type: original
statement_en_md: |
  Implement `match_route(pattern, path)`. Split both strings on `"/"`. A pattern segment is either a
  literal or a parameter written `:name`. If the path matches, return a dict mapping each parameter name
  to the path segment it captured (`{}` if the pattern has no parameters). If the segment counts differ
  or a literal segment is not equal, return `None`.
statement_vi_md: |
  Viết `match_route(pattern, path)`. Tách cả hai chuỗi bằng `"/"`. Segment của pattern là literal hoặc
  tham số dạng `:name`. Nếu path khớp thì trả dict ánh xạ tên tham số tới segment bắt được (`{}` nếu
  pattern không có tham số). Nếu số segment khác nhau hoặc một literal không bằng nhau thì trả `None`.
constraints:
- 0 <= len(pattern), len(path) <= 200
- parameter names in a pattern are distinct
examples:
- input: pattern = "/users/:id", path = "/users/7"
  output: '{"id": "7"}'
  explain_vi: Segment users khớp literal, :id bắt được "7".
io:
  mode: function
  entry: match_route
  params:
  - name: pattern
    type: str
  - name: path
    type: str
  returns: any
  compare: exact
starter:
  python: |
    def match_route(pattern, path):
