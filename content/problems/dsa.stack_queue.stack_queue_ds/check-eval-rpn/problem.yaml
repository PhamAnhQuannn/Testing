statement_en_md: "Implement `eval_rpn(tokens)` evaluating a Reverse Polish Notation expression with a stack. Tokens are strings: integers or `+ - * /`. Integer division truncates toward zero. The expression is always valid with no division by zero."
statement_vi_md: "Viết `eval_rpn(tokens)` tính biểu thức hậu tố (Reverse Polish Notation) bằng stack. `tokens` là list chuỗi: số nguyên hoặc `+ - * /`. Phép chia nguyên cắt về 0 (ví dụ 7 / -2 = -3). Biểu thức luôn hợp lệ, không chia cho 0."
constraints: []
examples:
- input: "tokens = ['2', '1', '+', '3', '*']"
  output: "9"
  explain_vi: Ví dụ đầu tiên của đề kiểm tra.
