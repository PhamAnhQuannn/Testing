        pass
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 8
hints:
- Mỗi ngày bạn ở một trong hai trạng thái, đang cầm cổ phiếu (hold) hoặc không (cash). Giá trị tốt nhất của mỗi trạng thái chỉ phụ thuộc ngày trước.
- "Khởi tạo hold = -prices[0], cash = 0. Mỗi ngày với giá p, cash = max(cash, hold + p - fee) (giữ hoặc bán, trả phí) và hold = max(hold, cash - p) (giữ hoặc mua)."
- "Đáp án là cash sau ngày cuối. Mảng rỗng trả 0. Dùng hai biến thay vì bảng dp để chỉ tốn O(1) bộ nhớ."
solution:
