id: check-x484-stock-with-fee
subtopic_id: dsa.dp.dp_state_machine
secondary_subtopics: []
kind: check
title: 'Check X484: max_profit_fee'
title_vi: 'Kiểm tra X484: max_profit_fee'
difficulty: easy
source:
  type: leetcode
  lc: 714
  rewrite_required: true
statement_en_md: |
  `prices[i]` is the price of a stock on day `i`. You may buy and sell as many times as you like, holding
  at most one share at a time, but every transaction (one buy plus its sell) costs `fee`. Return the
  maximum profit. Two states, `hold` and `cash`, updated day by day solve it in O(n) time and O(1) space.
statement_vi_md: |
  Viết `max_profit_fee(prices, fee)`: `prices[i]` là giá cổ phiếu ngày `i`. Bạn được mua bán không giới hạn
  số lần (mỗi lúc chỉ cầm tối đa 1 cổ phiếu) nhưng mỗi giao dịch (một cặp mua-bán) mất phí `fee`. Trả về lợi
  nhuận lớn nhất. Gợi ý: hai trạng thái `hold`/`cash`, trừ `fee` ở lúc bán.
constraints:
- 0 <= len(prices) <= 50000
- 1 <= prices[i] < 50000
- 0 <= fee < 50000
examples:
- input: prices = [1, 3, 2, 8, 4, 9], fee = 2
  output: '8'
  explain_vi: Mua ở 1 bán ở 8 (lời 7 - 2 = 5), mua ở 4 bán ở 9 (lời 5 - 2 = 3), tổng 8.
io:
  mode: function
  entry: max_profit_fee
  params:
  - name: prices
    type: list[int]
  - name: fee
    type: int
  returns: int
  compare: exact
starter:
