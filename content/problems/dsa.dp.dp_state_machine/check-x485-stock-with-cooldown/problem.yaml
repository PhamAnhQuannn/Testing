id: check-x485-stock-with-cooldown
subtopic_id: dsa.dp.dp_state_machine
secondary_subtopics: []
kind: check
title: 'Check X485: max_profit_cooldown'
title_vi: 'Kiểm tra X485: max_profit_cooldown'
difficulty: easy
source:
  type: leetcode
  lc: 309
  rewrite_required: true
statement_en_md: |
  `prices[i]` is the price of a stock on day `i`. You may buy and sell as many times as you like, holding
  at most one share at a time, but after you sell you must rest one full day before buying again (a
  cooldown). Return the maximum profit. Three states, `hold`, `sold` and `rest`, updated day by day
  solve it in O(n) time and O(1) space.
statement_vi_md: |
  Viết `max_profit_cooldown(prices)`: `prices[i]` là giá cổ phiếu ngày `i`. Bạn được mua bán không giới hạn
  số lần (mỗi lúc chỉ cầm tối đa 1 cổ phiếu) nhưng sau khi bán phải nghỉ đúng một ngày mới được mua lại.
  Trả về lợi nhuận lớn nhất. Gợi ý: ba trạng thái `hold`/`sold`/`rest`, mũi tên mua chỉ đi từ `rest`.
constraints:
- 0 <= len(prices) <= 5000
- 0 <= prices[i] <= 1000
examples:
- input: prices = [1, 2, 3, 0, 2]
  output: '3'
  explain_vi: Mua 1 bán 2, nghỉ một ngày, mua 0 bán 2, tổng 1 + 2 = 3.
io:
  mode: function
  entry: max_profit_cooldown
  params:
  - name: prices
    type: list[int]
  returns: int
  compare: exact
starter:
  python: |
    def max_profit_cooldown(prices):
        # TODO: hold / sold / rest; mua chỉ từ rest
        pass
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 10
hints:
- Hai trạng thái hold/cash là chưa đủ vì ngày ngay sau khi bán bị cấm mua. Hãy tách trạng thái "vừa bán hôm nay" (sold) khỏi "không cầm và được mua" (rest).
- "Mỗi ngày với giá p, dùng giá trị của ngày trước: hold = max(hold, rest - p), sold = hold + p, rest = max(rest, sold). Khởi tạo hold là một số rất âm, sold = rest = 0."
- "Cập nhật cả ba cùng lúc bằng gán tuple để dùng giá trị cũ. Đáp án là max(sold, rest). Mảng rỗng trả 0."
solution:
  file: solution.py
  approach_vi: DP ba trạng thái hold/sold/rest với biến cuộn; mua chỉ lấy từ rest nên cooldown được đảm bảo.
  complexity: O(n) / O(1)
