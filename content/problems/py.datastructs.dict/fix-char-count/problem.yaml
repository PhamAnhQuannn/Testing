id: fix-char-count
subtopic_id: py.datastructs.dict
secondary_subtopics: []
kind: check
title: "Fix the bug: char count"
title_vi: "Sửa bug: đếm ký tự"
difficulty: easy
source: {type: original, rewrite_required: false}
statement_en_md: |
  The function below was written by an AI and has a bug. Fix it so all tests pass.
  `count_chars(s)` should return a dict mapping each character of `s` to the number of times it appears.

statement_vi_md: |
  Hàm dưới đây do AI viết và có một bug. Hãy sửa để pass hết test.
  `count_chars(s)` phải trả về dict ánh xạ mỗi ký tự của `s` tới số lần nó xuất hiện.

constraints:
  - "0 <= len(s) <= 100"
examples:
  - {input: 's = "aa"', output: '{"a": 2}', explain_vi: "Ký tự 'a' xuất hiện 2 lần."}
  - {input: 's = ""', output: '{}', explain_vi: "Chuỗi rỗng cho dict rỗng."}
io:
  mode: function
  entry: count_chars
  params: [{name: s, type: str}]
  returns: "dict[str, int]"
  compare: exact
starter:
  python: |
    def count_chars(s):
        counts = {}
        for ch in s:
            counts[ch] = counts.get(ch, 1) + 1
        return counts
limits: {time_ms: 1000, memory_mb: 256, time_multiplier: {pyodide: 3}}
time_target_min: 6
hints:
  - "Chạy tay với s = \"a\": kết quả có đúng là {\"a\": 1} không?"
  - "Giá trị mặc định của `.get` quyết định số đếm khi ký tự xuất hiện lần đầu."
  - "Lần đầu gặp ký tự thì chưa có lần nào trước đó: dùng `counts.get(ch, 0) + 1`."
solution:
  file: solution.py
  approach_vi: "Sửa mặc định của .get từ 1 thành 0 để lần xuất hiện đầu tiên được đếm là 1 chứ không phải 2."
  complexity: "O(n) time, O(k) space"
tests:
  sample: tests/sample.jsonl
  hidden: tests/hidden.jsonl
  generator: tests/gen.py
tags: [check, fix-the-bug, hash-map, counting]
status: validated
version: 1
