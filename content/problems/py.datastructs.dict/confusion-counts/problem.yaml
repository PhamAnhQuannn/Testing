id: confusion-counts
subtopic_id: py.datastructs.dict
secondary_subtopics: []
kind: check
title: "Confusion counts"
title_vi: "Đếm ma trận nhầm lẫn"
difficulty: easy
source: {type: original, rewrite_required: false}
statement_en_md: |
  Implement `confusion_counts(y_true, y_pred)`. Both are equal-length lists of 0/1 (1 = positive).
  Return a dict `{"tp": ..., "fp": ..., "fn": ..., "tn": ...}` where
  tp = true 1 predicted 1, fp = true 0 predicted 1, fn = true 1 predicted 0, tn = true 0 predicted 0.
  All four keys are always present (0 when there are no such pairs).
statement_vi_md: |
  Cài đặt `confusion_counts(y_true, y_pred)`. Cả hai là list 0/1 cùng độ dài (1 = positive).
  Trả về dict `{"tp": ..., "fp": ..., "fn": ..., "tn": ...}` với
  tp = thật 1 đoán 1, fp = thật 0 đoán 1, fn = thật 1 đoán 0, tn = thật 0 đoán 0.
  Luôn có đủ bốn khoá (giá trị 0 nếu không có cặp nào).
constraints:
  - "0 <= len(y_true) == len(y_pred) <= 1000"
  - "Mỗi phần tử là 0 hoặc 1 (1 = positive)"
examples:
  - {input: 'y_true = [1, 0, 1, 0], y_pred = [1, 1, 0, 0]', output: '{"tp": 1, "fp": 1, "fn": 1, "tn": 1}', explain_vi: "Mỗi loại một cặp."}
  - {input: 'y_true = [], y_pred = []', output: '{"tp": 0, "fp": 0, "fn": 0, "tn": 0}', explain_vi: "Rỗng: đủ bốn khoá bằng 0."}
