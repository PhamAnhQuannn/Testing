title: "Write a test: char count"
title_vi: "Viết test: đếm ký tự"
source: {type: original, rewrite_required: false}
statement_en_md: |
  `count_chars(s)` should return a dict mapping each character of `s` to the number of times it
  appears in `s` (`count_chars("aab") == {"a": 2, "b": 1}`, `count_chars("") == {}`).

  The code shown is AI-written and has a bug. Write a test (functions named `test_*` that call
  `count_chars` and `assert`) that FAILS on this buggy code but PASSES on a correct implementation.
statement_vi_md: |
  `count_chars(s)` phải trả về dict ánh xạ mỗi ký tự của `s` tới số lần nó xuất hiện trong `s`
  (`count_chars("aab") == {"a": 2, "b": 1}`, `count_chars("") == {}`).

  Code được hiển thị do AI viết và có một bug. Hãy viết test (các hàm `test_*` gọi `count_chars` rồi
  `assert`) sao cho test FAIL trên code lỗi này nhưng PASS trên bản cài đặt đúng. Test chỉ đúng khi
  vừa bắt được bug, vừa không báo động giả với code đúng.
