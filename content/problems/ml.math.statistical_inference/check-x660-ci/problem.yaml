id: check-x660-ci
subtopic_id: ml.math.statistical_inference
secondary_subtopics: []
kind: check
title: 'Check X660: 95% confidence interval for a proportion'
title_vi: 'Kiểm tra X660: khoảng tin cậy 95% cho một tỉ lệ'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `conf_interval(p_hat, n)`: the 95% confidence interval for a proportion.
  `p_hat` is the sample proportion (float in `[0, 1]`), `n` the sample size (positive int).
  The standard error is `SE = sqrt(p_hat * (1 - p_hat) / n)` and the interval is
  `p_hat - 1.96 * SE` to `p_hat + 1.96 * SE`. Do not clamp the bounds to `[0, 1]`.
  Return a list `[low, high]` where each bound is `round(x, 6)`.
statement_vi_md: |
  Cài `conf_interval(p_hat, n)`: khoảng tin cậy 95% cho một tỉ lệ. `p_hat` là tỉ lệ mẫu (float trong `[0, 1]`),
  `n` là cỡ mẫu (số nguyên dương). Sai số chuẩn `SE = sqrt(p_hat * (1 - p_hat) / n)`, khoảng là
  `p_hat - 1.96 * SE` đến `p_hat + 1.96 * SE`. Không cắt cận về `[0, 1]`. Trả list `[low, high]`, mỗi cận là
  `round(x, 6)`.
constraints:
- 0 <= p_hat <= 1
- n >= 1
examples:
- input: p_hat = 0.05, n = 10000
  output: '[0.045728, 0.054272]'
  explain_vi: SE ≈ 0,002179 nên 1,96·SE ≈ 0,004272; khoảng là 0,05 ± 0,004272.
io:
  mode: function
  entry: conf_interval
  params:
  - name: p_hat
    type: float
  - name: n
    type: int
  returns: list
  compare: float_tol
