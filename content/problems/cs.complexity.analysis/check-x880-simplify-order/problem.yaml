id: check-x880-simplify-order
subtopic_id: cs.complexity.analysis
secondary_subtopics: []
kind: check
title: 'Check X880: simplify asymptotic order'
title_vi: 'Kiểm tra X880: rút gọn bậc tiệm cận'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `simplify_order(terms)`. `terms` is a list of `[coeff, exp]` pairs (non-negative integers)
  representing the sum of `coeff * n^exp`. For asymptotic analysis, drop coefficients and lower-order
  terms: return the largest `exp` among terms whose `coeff > 0`. If `terms` is empty or every coeff is 0,
  return `0`. For `terms = [[3,2],[100,1],[50,0]]` the result is `2`.
statement_vi_md: |
  Cài `simplify_order(terms)`. `terms` là list các cặp `[coeff, exp]` (số nguyên không âm) biểu diễn tổng
  `coeff * n^exp`. Khi phân tích tiệm cận, bỏ hệ số và các số hạng bậc thấp: trả về `exp` lớn nhất trong các số
  hạng có `coeff > 0`. Nếu `terms` rỗng hoặc mọi coeff đều bằng 0 thì trả `0`. Với ví dụ trên kết quả là `2`.
constraints:
- 'Mỗi phần tử của terms là list [coeff, exp] với coeff, exp là số nguyên >= 0'
- 'Có thể có nhiều số hạng cùng số mũ'
- 'Chỉ dùng thư viện chuẩn của Python'
examples:
- input: 'terms = [[3, 2], [100, 1], [50, 0]]'
  output: '2'
  explain_vi: '3n^2 + 100n + 50 có số hạng bậc cao nhất là n^2.'
- input: 'terms = [[0, 5], [7, 1]]'
  output: '1'
  explain_vi: 'Số hạng n^5 có hệ số 0 nên bị bỏ; còn lại 7n là bậc 1.'
io:
  mode: function
  entry: simplify_order
  params:
  - name: terms
    type: list
  returns: int
  compare: exact
starter:
  python: |
    def simplify_order(terms):
        # TODO: chỉ xét số hạng có coeff > 0, lấy exp lớn nhất
        pass
time_target_min: 6
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
hints:
- "Số hạng có coeff bằng 0 không đóng góp gì, hãy loại chúng trước."
- "Trong các số hạng còn lại, số hạng có exp lớn nhất thống trị khi n lớn."
- "Nếu không còn số hạng nào (rỗng hoặc toàn coeff 0) trả 0, còn lại trả max của các exp."
solution:
  file: solution.py
  approach_vi: Lọc các số hạng có coeff dương rồi lấy số mũ lớn nhất, mặc định 0 nếu không còn số hạng nào.
  complexity: "O(k) / O(k)"
tests:
  sample: tests/sample.jsonl
  hidden: tests/hidden.jsonl
  generator: tests/gen.py
tags:
