id: check-x551-fix-median
subtopic_id: dsa.practical.refactor_debug_review
secondary_subtopics: []
kind: check
title: 'Check X551: median (fix the bug)'
title_vi: 'Kiểm tra X551: median (sửa bug)'
difficulty: easy
source:
  type: original
statement_en_md: |
  The starter `median(nums)` is buggy: it does not sort and it uses integer division. Fix it. `nums` is a
  non-empty list of integers. Sort a copy, and if the length is odd return the middle element (an `int`).
  If the length is even, compute `v = (a + b) / 2` of the two middle values with true division and return
  `int(v)` when `v` is whole, otherwise the `float` `v`.
statement_vi_md: |
  Hàm `median(nums)` ở code khởi đầu bị bug: không sort và dùng chia nguyên. Hãy sửa. `nums` là list số
  nguyên không rỗng. Sort rồi nếu độ dài lẻ thì trả phần tử giữa (`int`). Nếu độ dài chẵn, tính
  `v = (a + b) / 2` của hai phần tử giữa bằng phép chia thực và trả `int(v)` khi `v` là số nguyên, ngược
  lại trả `float` `v`.
constraints:
- 1 <= len(nums) <= 1000
- -10^9 <= nums[i] <= 10^9
examples:
- input: nums = [3, 1, 2]
  output: '2'
  explain_vi: Sau khi sort là [1, 2, 3], phần tử giữa là 2.
io:
  mode: function
  entry: median
  params:
  - name: nums
    type: list[int]
  returns: any
  compare: exact
starter:
  python: |
    def median(nums):
        # BUG: chưa sort, và dùng // làm mất phần .5
        n = len(nums)
        if n % 2 == 1:
            return nums[n // 2]
        return (nums[n // 2 - 1] + nums[n // 2]) // 2
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 8
hints:
- Chạy thử median([3, 1, 2]) và median([1, 2]) trên code khởi đầu rồi so với kết quả mong đợi để thấy hai lỗi khác nhau.
- Median chỉ có nghĩa trên dãy đã sắp, nên hãy dùng s = sorted(nums) rồi lấy phần tử giữa của s (không sửa nums).
- "Độ dài chẵn thì v = (s[n // 2 - 1] + s[n // 2]) / 2; trả int(v) nếu v == int(v), ngược lại trả v."
solution:
  file: solution.py
  approach_vi: Sort bản sao, lấy phần tử giữa khi lẻ; khi chẵn tính trung bình hai phần tử giữa bằng chia thực rồi đổi về int nếu là số nguyên.
  complexity: O(n log n) / O(n)
tests:
  sample: tests/sample.jsonl
  hidden: tests/hidden.jsonl
  generator: tests/gen.py
tags:
