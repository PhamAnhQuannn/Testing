hints:
- Dùng divmod(n, k) để có kích thước cơ sở q và số fold dư r.
- Fold thứ i có q + 1 phần tử nếu i < r, ngược lại q phần tử.
- Giữ biến start; mỗi fold là list(range(start, start + size)) rồi cộng start thêm size.
