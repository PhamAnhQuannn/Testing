id: check-x698-zscore
subtopic_id: ml.classical.time_series_anomaly
secondary_subtopics: []
kind: check
title: 'Check X698: z-score anomalies'
title_vi: 'Kiểm tra X698: bất thường theo z-score'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `zscore_anomalies(series, threshold)` that returns the list of indices `i` where
  `abs(series[i] - mean) / std > threshold` (strictly greater). Use the population mean and population
  standard deviation (divide by `n`). If the series is empty or `std == 0`, return `[]`.
  For `series = [2, 4, 4, 4, 5, 5, 7, 9]`, `threshold = 1.5` the result is `[7]`
  (mean 5, std 2; the value 2 has z = 1.5, which is not strictly greater).
statement_vi_md: |
  Cài `zscore_anomalies(series, threshold)` trả list các chỉ số `i` thoả
  `abs(series[i] - mean) / std > threshold` (lớn hơn nghiêm ngặt). Dùng mean và std theo quần thể (chia cho `n`).
  Nếu chuỗi rỗng hoặc `std == 0` thì trả `[]`.
  Với `series = [2, 4, 4, 4, 5, 5, 7, 9]`, `threshold = 1.5` kết quả là `[7]`
  (mean 5, std 2; giá trị 2 có z = 1,5 nên không vượt ngưỡng).
constraints:
- 0 <= n <= 1000
- threshold >= 0
examples:
- input: series = [2.0, 4.0, 4.0, 4.0, 5.0, 5.0, 7.0, 9.0], threshold = 1.5
  output: '[7]'
  explain_vi: mean = 5, std = 2; z của 9 là 2,0 > 1,5 nên chọn chỉ số 7; z của 2 là 1,5 không lớn hơn nghiêm ngặt.
io:
  mode: function
  entry: zscore_anomalies
  params:
  - name: series
    type: list
  - name: threshold
    type: float
  returns: list
  compare: exact
starter:
  python: |
    def zscore_anomalies(series, threshold):
        # TODO: tính mean và std (chia cho n); trả các chỉ số i có |x - mean| / std > threshold
        pass
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 6
hints:
- Tính mean = sum(series) / n và phương sai = sum((x - mean) ** 2) / n, std = sqrt(phương sai).
- Xử lý trước các trường hợp n == 0 và std == 0, cả hai trả [].
- Trả [i for i, x in enumerate(series) if abs(x - mean) / std > threshold].
solution:
