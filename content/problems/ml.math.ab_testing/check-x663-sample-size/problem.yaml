title: 'Check X663: A/B sample size'
title_vi: 'Kiểm tra X663: cỡ mẫu A/B test'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `sample_size(p, mde)`: the per-group sample size of an A/B test comparing two proportions
  (alpha = 0.05, power 80%) by the quick rule `n = ceil(16 * p * (1 - p) / (mde * mde))`. `p` is the baseline
  rate, a float in `(0, 1)`; `mde` is the minimum detectable effect, an absolute float `> 0` (e.g. `0.005`).
  Return the int `n` (use `math.ceil`). Example: `sample_size(0.05, 0.005)` is `30400`.
statement_vi_md: |
  Cài `sample_size(p, mde)`: cỡ mẫu mỗi nhóm của A/B test so hai tỉ lệ (α = 0,05, power 80%) theo quy tắc nhanh
  `n = ceil(16 * p * (1 - p) / (mde * mde))`. `p` là tỉ lệ nền, float trong `(0, 1)`; `mde` là mức cải thiện nhỏ nhất
  cần phát hiện, tuyệt đối, float `> 0` (vd `0.005`). Trả số nguyên `n` (dùng `math.ceil`). Ví dụ:
  `sample_size(0.05, 0.005)` cho `30400`.
constraints:
- 0 < p < 1
- 0 < mde <= 0.5
examples:
- input: p = 0.05, mde = 0.005
  output: '30400'
  explain_vi: 16 · 0,05 · 0,95 = 0,76; chia 0,005² = 0,000025 được 30.400 người mỗi nhóm.
