hints:
- Đây là bài đường ngắn nhất, nhưng chi phí của một đường là max của các cạnh thay vì tổng.
- "Dùng dist[r][c] = effort nhỏ nhất để tới ô (r, c), heap chứa (effort, r, c) bắt đầu bằng (0, 0, 0). Pop ra thì bỏ qua nếu effort > dist[r][c]; nếu là ô đích thì trả về effort."
- "Với mỗi ô kề (nr, nc) trong lưới, tính nd = max(effort, abs(heights[nr][nc] - heights[r][c])). Nếu nd < dist[nr][nc] thì cập nhật và push (nd, nr, nc)."
solution:
