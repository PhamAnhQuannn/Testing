title: 'Check X458: minimum_effort_path'
title_vi: 'Kiểm tra X458: minimum_effort_path'
difficulty: easy
source:
  type: leetcode
  lc: 1631
  rewrite_required: true
statement_en_md: |
  You are given an `m x n` grid `heights`. You start at the top-left cell and want to reach the bottom-right
  cell, moving up, down, left or right. The effort of a path is the maximum absolute difference in height
  between two consecutive cells on it. Return the minimum effort over all paths. Dijkstra works with
  "distance" defined as the smallest possible maximum edge along a path.
statement_vi_md: |
  Viết `minimum_effort_path(heights)`: `heights` là lưới `m x n`. Đi từ ô góc trên-trái tới góc dưới-phải,
  mỗi bước sang ô kề (trên, dưới, trái, phải). Effort của một đường đi là chênh lệch độ cao tuyệt đối lớn
  nhất giữa hai ô liên tiếp trên đường đó. Trả về effort nhỏ nhất. Gợi ý: Dijkstra với "khoảng cách" là
  max cạnh nhỏ nhất trên đường đi.
constraints:
- 1 <= m, n <= 100
- 1 <= heights[i][j] <= 1000000
examples:
- input: heights = [[1, 2, 2], [3, 8, 2], [5, 3, 5]]
  output: '2'
  explain_vi: Đường 1 -> 3 -> 5 -> 3 -> 5 có chênh lệch lớn nhất là 2, không có đường nào tốt hơn.
