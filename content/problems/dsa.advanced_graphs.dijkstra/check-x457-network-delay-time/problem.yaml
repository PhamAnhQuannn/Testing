title_vi: 'Kiểm tra X457: network_delay_time'
difficulty: easy
source:
  type: leetcode
  lc: 743
  rewrite_required: true
statement_en_md: |
  A network has `n` nodes labeled `1..n`. `times` is a list of directed edges `[u, v, w]`: a signal sent
  from `u` reaches `v` after `w` units of time. A signal is sent from node `k`. Return the minimum time for
  all `n` nodes to receive it, or `-1` if some node can never receive it. Dijkstra with a min-heap gives
  the shortest time to every node; the answer is the largest of those times.
statement_vi_md: |
  Viết `network_delay_time(times, n, k)`: mạng có `n` node đánh số `1..n`, `times` là danh sách cạnh có
  hướng `[u, v, w]` (tín hiệu từ `u` tới `v` mất `w` đơn vị thời gian). Tín hiệu phát từ node `k`. Trả về
  thời gian tối thiểu để cả `n` node đều nhận được, hoặc `-1` nếu có node không bao giờ nhận được. Gợi ý:
  Dijkstra với min-heap tìm thời gian ngắn nhất tới mỗi node, đáp án là giá trị lớn nhất trong đó.
constraints:
- 1 <= k <= n <= 100
- 0 <= len(times) <= 6000
- 1 <= w <= 100
examples:
- input: times = [[2, 1, 1], [2, 3, 1], [3, 4, 1]], n = 4, k = 2
  output: '2'
  explain_vi: Từ node 2 tới 1 và 3 mất 1, tới 4 mất 2 (qua node 3), nên cả mạng nhận được sau 2.
