time_target_min: 8
hints:
- Thời gian để node v nhận tín hiệu là đường đi ngắn nhất từ k tới v; cả mạng nhận xong khi node xa nhất nhận được.
- "Dựng danh sách kề graph[u] = [(v, w)]. Dùng dist = [inf] * (n + 1), dist[k] = 0, heap chứa (dist, node) bắt đầu bằng (0, k). Mỗi lần pop (d, u), nếu d > dist[u] thì bỏ qua (entry cũ)."
- "Với mỗi (v, w) của u, nếu d + w < dist[v] thì cập nhật dist[v] và push (d + w, v). Cuối cùng best = max(dist[1:]); nếu best là inf thì trả -1, ngược lại trả best."
