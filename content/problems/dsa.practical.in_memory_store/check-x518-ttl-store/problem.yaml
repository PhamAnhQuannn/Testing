id: check-x518-ttl-store
subtopic_id: dsa.practical.in_memory_store
secondary_subtopics: []
kind: check
title: 'Check X518: TTL key-value store'
title_vi: 'Kiểm tra X518: Key-value store có TTL'
difficulty: easy
source:
  type: original
statement_en_md: |
  Implement `class TTLStore`, an in-memory key-value store with expiry. Time is never read from the system clock; it is passed in as `now`.

  - `set(key, value, now, ttl)`: store `value`; the entry expires at `now + ttl`. Setting an existing key overwrites it (and its expiry).
  - `get(key, now)`: return the value, or `None` if the key is missing or expired. An entry is expired when `now >= expiry` (exactly at the expiry time it is already gone). Cleanup is lazy: expired entries are removed on access.
  - `delete(key)`: remove the key if present (no error if absent).
statement_vi_md: |
  Viết `class TTLStore`, một key-value store trong bộ nhớ có hạn dùng (TTL). Không đọc đồng hồ hệ thống; thời gian được truyền vào qua tham số `now` (injectable clock).

  - `set(key, value, now, ttl)`: lưu `value`; entry hết hạn tại `now + ttl`. Ghi đè key cũ thì cũng ghi đè luôn hạn dùng.
  - `get(key, now)`: trả về value, hoặc `None` nếu key không tồn tại hoặc đã hết hạn. Entry hết hạn khi `now >= expiry` (đúng tại mốc hết hạn là đã mất). Dọn dẹp kiểu lazy: entry hết hạn bị xoá khi được truy cập.
  - `delete(key)`: xoá key nếu có (không lỗi nếu không có).
constraints:
- '`now` và `ttl` là số nguyên không âm; `now` không giảm theo thứ tự thao tác.'
- Mọi thao tác nên là O(1).
examples:
- input: ops = ['TTLStore', 'set', 'get', 'get', 'get'], args = [[], ['a', 1, 0, 5], ['a', 4], ['a', 5], ['a', 6]]
  output: '[null, null, 1, null, null]'
  explain_vi: '`a` hết hạn tại 0 + 5 = 5; tại now = 4 còn sống, tại now = 5 đã hết hạn (null).'
io:
