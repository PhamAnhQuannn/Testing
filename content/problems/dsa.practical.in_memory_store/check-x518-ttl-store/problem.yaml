hints:
- Lưu mỗi key thành cặp (value, expiry) với expiry = now + ttl, thay vì chỉ lưu value.
- Trong get, so sánh now với expiry. Chú ý dấu bằng - tại now == expiry entry đã hết hạn.
- Khi phát hiện hết hạn, xoá entry khỏi dict (lazy cleanup) rồi trả None. delete dùng dict.pop(key, None) để không lỗi khi thiếu key.
