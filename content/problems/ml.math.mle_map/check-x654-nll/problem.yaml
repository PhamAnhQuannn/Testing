kind: check
title: 'Check X654: Bernoulli negative log-likelihood'
title_vi: 'Kiểm tra X654: negative log-likelihood Bernoulli (log loss)'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `nll_bernoulli(ys, ps)`: the Bernoulli negative log-likelihood (log loss, summed, not averaged).
  `ys` is a list of labels (each `0` or `1`) and `ps` a list of predicted probabilities of the same length
  (each in `(0, 1)`). Return
  `-sum(y*ln(p) + (1-y)*ln(1-p))` over matching pairs, using natural log (`math.log`).
  To avoid `log(0)`, clamp each `p` to `[1e-12, 1 - 1e-12]` before taking the log.
  Return a float `round(result, 6)`.
statement_vi_md: |
  Cài `nll_bernoulli(ys, ps)`: negative log-likelihood Bernoulli (log loss, tổng chứ không lấy trung bình).
  `ys` là danh sách nhãn (mỗi phần tử `0` hoặc `1`), `ps` là danh sách xác suất dự đoán cùng độ dài (mỗi phần tử
  trong `(0, 1)`). Trả `-sum(y*ln(p) + (1-y)*ln(1-p))` theo từng cặp, dùng log tự nhiên (`math.log`).
  Để tránh `log(0)`, kẹp mỗi `p` vào `[1e-12, 1 - 1e-12]` trước khi lấy log. Trả float `round(kết_quả, 6)`.
constraints:
- len(ys) == len(ps)
- ys[i] in {0, 1}
- 0 < ps[i] < 1 (clamp to [1e-12, 1 - 1e-12])
examples:
- input: ys = [1, 0, 1], ps = [0.9, 0.2, 0.6]
  output: '0.83933'
  explain_vi: '-(ln 0.9 + ln 0.8 + ln 0.6) = 0.105361 + 0.223144 + 0.510826 = 0.83933.'
io:
