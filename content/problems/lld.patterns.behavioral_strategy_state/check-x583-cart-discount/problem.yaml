- 'Tạo dict tên sang class strategy, mỗi class có method apply(subtotal); set_discount chỉ đổi object đang giữ.'
- '`total()` gọi `self._discount.apply(self._subtotal)`; fixed50 dùng `max(0, ...)`.'
