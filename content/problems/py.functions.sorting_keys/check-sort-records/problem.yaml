limits: {time_ms: 1000, memory_mb: 256, time_multiplier: {pyodide: 3}}
time_target_min: 12
hints:
  - "`list.sort` ổn định: sắp theo key ít quan trọng nhất trước, key quan trọng nhất sau cùng."
  - "Mỗi lượt dùng `key=lambda r: r[idx]` và `reverse=True` nếu key có tiền tố `-`; duyệt `reversed(keys)`."
  - "Đừng dùng một lần sort với `reverse=True` chung: các key có hướng khác nhau (và chuỗi không phủ định được bằng dấu trừ)."
solution:
