id: check-sort-records
subtopic_id: py.functions.sorting_keys
secondary_subtopics: []
kind: check
title: "Check X332: sort_records"
title_vi: "Kiểm tra X332: sort_records"
difficulty: easy
source:
  type: original
statement_en_md: |
  Implement `sort_records(records, keys)`. Each record is `[name, dept, age, score]`
  (str, str, int, int). `keys` is a list of field names in priority order (`"name"`, `"dept"`,
  `"age"`, `"score"`); a leading `"-"` (e.g. `"-score"`) means descending for that field.
  Return a new list sorted by all keys (first key most significant). Records equal on every key keep
  their original relative order. If `keys` is empty, return a copy in the original order.
statement_vi_md: |
  Viết `sort_records(records, keys)`. Mỗi bản ghi là `[name, dept, age, score]`
  (str, str, int, int). `keys` là list tên trường theo thứ tự ưu tiên (`"name"`, `"dept"`,
  `"age"`, `"score"`); tiền tố `"-"` (vd `"-score"`) nghĩa là sắp giảm dần theo trường đó.
  Trả về list mới được sắp theo tất cả key (key đầu tiên quan trọng nhất). Các bản ghi bằng nhau trên mọi
  key giữ nguyên thứ tự ban đầu. `keys` rỗng thì trả bản sao theo thứ tự ban đầu.
constraints:
  - "0 <= len(records) <= 50"
  - "0 <= len(keys) <= 4"
examples:
  - {input: 'records = [["an","eng",30,80],["binh","ops",25,90],["chi","eng",25,90]], keys = ["-score","name"]', output: '[["binh","ops",25,90],["chi","eng",25,90],["an","eng",30,80]]', explain_vi: "Điểm giảm dần, hòa thì theo tên."}
io:
  mode: function
  entry: sort_records
  params: [{name: records, type: "list[list]"}, {name: keys, type: "list[str]"}]
  returns: "list[list]"
  compare: exact
starter:
  python: |
    def sort_records(records, keys):
        # TODO: sort ổn định nhiều lượt (key ít quan trọng nhất trước) hoặc dùng key tuple
