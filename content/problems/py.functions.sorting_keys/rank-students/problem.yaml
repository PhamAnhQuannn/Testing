id: rank-students
subtopic_id: py.functions.sorting_keys
secondary_subtopics: []
kind: practice
title: "Rank Students"
title_vi: "Xếp hạng học sinh"
difficulty: easy
source: {type: original}
statement_en_md: |
  Given a list `records` where each record is a two-element list `[name, score]`, rank the
  students: a higher score ranks first, and students with the same score are ordered alphabetically
  by name. Return the list of names in rank order.
statement_vi_md: |
  Cho list `records`, mỗi phần tử là list hai phần tử `[tên, điểm]`. Hãy xếp hạng: điểm **cao hơn**
  đứng trước; các bạn **cùng điểm** thì xếp theo thứ tự chữ cái của tên. Trả về list tên theo thứ
  tự xếp hạng. Tên chỉ gồm chữ cái thường và không trùng nhau.
constraints:
  - "0 <= len(records) <= 1000"
  - "name is a non-empty string of lowercase letters; all names are distinct"
  - "0 <= score <= 100"
examples:
  - {input: 'records = [["an", 8], ["binh", 9], ["chi", 8]]', output: '["binh", "an", "chi"]', explain_vi: "binh 9 điểm đứng đầu; an và chi cùng 8 điểm nên an (chữ cái trước) đứng trước chi."}
  - {input: 'records = [["z", 5], ["a", 5]]', output: '["a", "z"]', explain_vi: "Cùng điểm nên xếp theo tên."}
io:
  mode: function
  entry: rank_students
  params: [{name: records, type: "list[list]"}]
  returns: "list[str]"
  compare: exact
