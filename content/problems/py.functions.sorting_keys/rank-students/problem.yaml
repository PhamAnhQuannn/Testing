limits: {time_ms: 200, memory_mb: 256, time_multiplier: {pyodide: 3}}
time_target_min: 10
hints:
  - "Cần sắp xếp theo hai tiêu chí: điểm giảm dần trước, rồi tên tăng dần khi hoà."
  - "Dùng `sorted(records, key=...)` với key trả về tuple. Muốn điểm giảm dần mà vẫn sắp tăng thì đổi dấu: `-điểm`."
  - "`ranked = sorted(records, key=lambda r: (-r[1], r[0]))` rồi `return [r[0] for r in ranked]`."
