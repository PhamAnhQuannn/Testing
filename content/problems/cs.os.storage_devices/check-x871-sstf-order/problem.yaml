hints:
- "Sao chép requests thành list pending để không sửa đầu vào, và giữ biến pos là vị trí đầu đọc hiện tại."
- "Mỗi vòng lặp chọn phần tử có khóa (abs(c - pos), c) nhỏ nhất; khóa thứ hai xử lý trường hợp hòa."
- "Xoá phần tử đã chọn khỏi pending (pop theo chỉ số để giữ giá trị trùng), gán pos = c rồi thêm vào kết quả."
