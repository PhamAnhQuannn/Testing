hints:
- "Lưu đường dẫn hiện tại dưới dạng list các đoạn (tách bằng /, bỏ đoạn rỗng); cuối cùng nối lại bằng '/' + '/'.join(parts)."
- "Tách lệnh bằng split(); bỏ qua nếu token đầu không phải cd; cd trần đặt parts = []; đối số bắt đầu bằng / thì thay parts bằng các đoạn của nó."
- "Với đối số tương đối, duyệt từng đoạn: bỏ qua '' và '.', '..' thì pop nếu parts không rỗng, còn lại append."
solution:
