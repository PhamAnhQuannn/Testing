  approach_vi: Biểu diễn đường dẫn bằng list đoạn, xử lý cd tuyệt đối, tương đối, .., . và cd trần, bỏ qua lệnh khác rồi nối lại.
  complexity: "O(tổng độ dài lệnh) / O(độ sâu)"
