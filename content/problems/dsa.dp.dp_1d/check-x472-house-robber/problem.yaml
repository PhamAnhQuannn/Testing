time_target_min: 8
hints:
- Tại mỗi nhà chỉ có hai lựa chọn là lấy hoặc bỏ. Đáp án tới nhà i chỉ phụ thuộc vào hai trạng thái trước đó.
- "Gọi best(i) là tiền lớn nhất tới nhà i. Nếu bỏ nhà i thì best(i) = best(i-1); nếu lấy thì best(i) = best(i-2) + nums[i]. Lấy max của hai."
- "Giữ hai biến prev2, prev1 (hoặc take/skip) và cập nhật trong một vòng lặp; danh sách rỗng trả 0."
