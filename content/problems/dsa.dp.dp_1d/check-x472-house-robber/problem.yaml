  rewrite_required: true
statement_en_md: |
  A row of houses holds `nums[i]` money each. Adjacent houses cannot both be robbed. Return the maximum
  total money that can be robbed from non-adjacent houses. An empty list gives 0. A rolling pair of
  variables (take / skip) solves it in O(n) time and O(1) space.
statement_vi_md: |
  Viết `rob(nums)`: `nums[i]` là số tiền ở nhà `i` dọc phố. Không được lấy hai nhà kề nhau. Trả về tổng
  tiền lớn nhất lấy được từ các nhà không kề nhau (danh sách rỗng cho 0). Gợi ý: DP với hai biến cuốn
  chiếu `take` (lấy nhà hiện tại) và `skip` (bỏ nhà hiện tại).
constraints:
- 0 <= len(nums) <= 100
- 0 <= nums[i] <= 400
examples:
- input: nums = [2, 7, 9, 3, 1]
  output: '12'
  explain_vi: Lấy nhà 0, 2, 4 (2 + 9 + 1 = 12), không có cách không kề nào lớn hơn.
