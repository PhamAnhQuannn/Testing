hints:
- Số cách giải mã s[:i] chỉ phụ thuộc vào s[:i-1] và s[:i-2]. Xét riêng hai trường hợp ký tự cuối đứng một mình và cặp hai ký tự cuối.
- "Ký tự cuối đứng một mình hợp lệ nếu khác '0' (cộng ways(i-1)). Cặp hai ký tự cuối hợp lệ nếu nằm trong 10..26 (cộng ways(i-2))."
- "Dùng hai biến cuốn chiếu prev2 = 1, prev1 = 1 (chuỗi rỗng có 1 cách). Nếu s[0] == '0' trả 0 ngay."
