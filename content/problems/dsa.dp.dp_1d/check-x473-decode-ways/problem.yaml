statement_en_md: |
  A digit string `s` is decoded to letters with '1'..'26' -> 'A'..'Z'. Return the number of ways to
  decode `s`. A leading '0' or any '0' that cannot pair with the previous digit into 10 or 20 makes the
  string undecodable (0 ways); for example '0' and '06' give 0, '10' gives 1, '27' gives 1.
statement_vi_md: |
  Viết `num_decodings(s)`: `s` là chuỗi chữ số, mỗi mã '1'..'26' ứng với 'A'..'Z'. Đếm số cách giải mã
  `s`. Chữ số '0' đứng đầu hoặc '0' không ghép được với chữ số trước thành 10 hay 20 thì không giải mã
  được (0 cách). Ví dụ '0' và '06' cho 0, '10' cho 1, '27' cho 1 (chỉ tách thành 2 và 7).
constraints:
- 1 <= len(s) <= 45
- s contains only digits '0'..'9'
examples:
- input: s = "226"
  output: '3'
  explain_vi: '"226" giải mã thành BZ (2,26), VF (22,6) hoặc BBF (2,2,6), nên có 3 cách.'
io:
  mode: function
  entry: num_decodings
  params:
