statement_en_md: |
  Implement `softmax(xs)`, where `xs` is a non-empty list of numbers. Return a list of floats with
  `softmax_i = e^(x_i) / sum_j e^(x_j)`, each value rounded with `round(v, 6)`. Use `math.exp`.
  The implementation must be numerically stable: subtract `max(xs)` from every element before
  calling `math.exp`, so large inputs such as `[1000, 1001, 1002]` do not overflow.
statement_vi_md: |
  Cài `softmax(xs)` với `xs` là list số không rỗng. Trả về list số thực với
  `softmax_i = e^(x_i) / tổng_j e^(x_j)`, mỗi giá trị làm tròn bằng `round(v, 6)`. Dùng `math.exp`.
  Phải ổn định số học: trừ `max(xs)` khỏi mọi phần tử trước khi gọi `math.exp` để đầu vào lớn như
  `[1000, 1001, 1002]` không bị tràn số.
constraints:
- 1 <= len(xs) <= 1000
- -1000 <= x <= 1000
