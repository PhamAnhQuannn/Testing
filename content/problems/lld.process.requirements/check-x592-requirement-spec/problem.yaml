id: check-x592-requirement-spec
subtopic_id: lld.process.requirements
secondary_subtopics: []
kind: check
title: 'Check X592: Requirement Spec'
title_vi: 'Kiểm tra X592: Bảng yêu cầu và phạm vi'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Model the output of a requirements-clarifying step. Implement `class RequirementSpec`
  (constructor takes no arguments) with:

  - `add(kind, text)`: records one requirement. `kind` is `"functional"` or `"nonfunctional"`.
    Returns nothing.
  - `set_scope(text, inside)`: records `text` as in-scope if `inside` is `True`, otherwise as
    out-of-scope. Returns nothing.
  - `count(kind)`: returns the int number of requirements added with that `kind`.
  - `in_scope()`: returns the list of in-scope texts, sorted ascending (canonical output).
statement_vi_md: |
  Mô hình hoá kết quả của bước làm rõ yêu cầu. Viết `class RequirementSpec` (constructor không
  tham số) với:

  - `add(kind, text)`: ghi một yêu cầu. `kind` là `"functional"` hoặc `"nonfunctional"`. Không trả gì.
  - `set_scope(text, inside)`: ghi `text` là in-scope nếu `inside` là `True`, ngược lại là
    out-of-scope. Không trả gì.
  - `count(kind)`: trả số (int) yêu cầu đã thêm với `kind` đó.
  - `in_scope()`: trả list các `text` in-scope, sắp xếp tăng dần (đầu ra chuẩn).
constraints:
- 'kind luôn là "functional" hoặc "nonfunctional"; text là chuỗi.'
- 'Không dùng thread, time hay random.'
examples:
- input: ops = ['RequirementSpec', 'add', 'add', 'set_scope', 'set_scope', 'count', 'in_scope'], args = [[], ['functional', 'login'], ['nonfunctional', 'fast'], ['payments', false], ['search', true], ['functional'], []]
  output: '[null, null, null, null, null, 1, ["search"]]'
  explain_vi: 'Một yêu cầu functional; chỉ "search" là in-scope.'
io:
  mode: class_ops
  compare: exact
starter:
  python: "class RequirementSpec:\n    # TODO\n    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 8
hints:
- 'Giữ hai bộ đếm (functional, nonfunctional) và hai list in/out-of-scope.'
- 'set_scope đưa text vào list tương ứng theo inside; in_scope trả sorted(list).'
- '`count(kind)` tra dict đếm; `in_scope()` trả `sorted(self._in)`.'
solution:
  file: solution.py
  approach_vi: Hai bộ đếm theo loại và hai list phạm vi; in_scope trả bản sắp xếp để đầu ra xác định. Mọi thao tác O(1), in_scope O(n log n).
  complexity: O(1) mỗi thao tác, in_scope O(n log n)
tests:
  sample: tests/sample.jsonl
  hidden: tests/hidden.jsonl
  generator: tests/gen.py
tags:
- check
- x592
status: validated
version: 1
