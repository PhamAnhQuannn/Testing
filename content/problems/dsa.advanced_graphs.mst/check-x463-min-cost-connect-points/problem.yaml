difficulty: easy
source:
  type: leetcode
  lc: 1584
  rewrite_required: true
statement_en_md: |
  You are given `points`, a list of `[x, y]` coordinates on a 2D plane. The cost of connecting two points
  is their Manhattan distance `|x1 - x2| + |y1 - y2|`. Return the minimum total cost to connect all the
  points so that there is exactly one simple path between any two points (a minimum spanning tree).
  Kruskal over all pairs or Prim with a heap both work.
statement_vi_md: |
  Viết `min_cost_connect_points(points)`: `points` là danh sách tọa độ `[x, y]`. Chi phí nối hai điểm là
  khoảng cách Manhattan `|x1 - x2| + |y1 - y2|`. Trả về tổng chi phí nhỏ nhất để nối tất cả các điểm
  (cây khung nhỏ nhất, MST). Gợi ý: Prim với heap hoặc Kruskal trên mọi cặp điểm.
constraints:
- 1 <= len(points) <= 1000
- -1000000 <= x, y <= 1000000
examples:
- input: points = [[0, 0], [2, 2], [3, 10], [5, 2], [7, 0]]
  output: '20'
  explain_vi: Nối (0,0)-(2,2) tốn 4, (2,2)-(5,2) tốn 3, (5,2)-(7,0) tốn 4, (2,2)-(3,10) tốn 9; tổng 20.
