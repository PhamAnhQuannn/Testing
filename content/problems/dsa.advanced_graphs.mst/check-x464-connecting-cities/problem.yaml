title: 'Check X464: minimum_cost'
title_vi: 'Kiểm tra X464: minimum_cost'
difficulty: easy
source:
  type: leetcode
  lc: 1135
  rewrite_required: true
statement_en_md: |
  There are `n` cities labeled `1..n`. `connections[i] = [u, v, cost]` means connecting cities `u` and `v`
  costs `cost` (the road is bidirectional). Return the minimum total cost to connect all `n` cities so that
  there is a path between every pair, or `-1` if it is impossible. Kruskal with a disjoint set union solves it.
statement_vi_md: |
  Viết `minimum_cost(n, connections)`: có `n` thành phố đánh số `1..n`, `connections[i] = [u, v, cost]` là
  chi phí xây đường hai chiều nối `u` và `v`. Trả về tổng chi phí nhỏ nhất để mọi thành phố liên thông,
  hoặc `-1` nếu không thể. Gợi ý: Kruskal + DSU; nếu số union thành công khác `n - 1` thì trả `-1`.
constraints:
- 1 <= n <= 10000
- 0 <= len(connections) <= 10000
- 1 <= u, v <= n
- 1 <= cost <= 100000
examples:
- input: n = 3, connections = [[1, 2, 5], [1, 3, 6], [2, 3, 1]]
  output: '6'
  explain_vi: Chọn cạnh (2,3) giá 1 và (1,2) giá 5; tổng 6 nối cả ba thành phố.
