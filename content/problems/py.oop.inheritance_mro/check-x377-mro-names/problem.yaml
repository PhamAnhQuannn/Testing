id: check-x377-mro-names
subtopic_id: py.oop.inheritance_mro
secondary_subtopics: []
kind: check
title: 'Check X377: mro_names'
title_vi: 'Kiểm tra X377: mro_names'
difficulty: easy
source:
  type: original
statement_en_md: Implement `mro_names(spec)` as described in the Vietnamese statement (mastery check
  item X377, 12-minute time box).
statement_vi_md: |
  `spec` là list các cặp `[tên, [tên các base]]`, mỗi base đã xuất hiện ở phần tử đứng trước.
  Hãy tạo các class thật bằng `type(tên, tuple_base, {})` theo đúng thứ tự trong `spec`, rồi trả về
  list tên các class trong MRO của class cuối cùng (theo thứ tự `__mro__`, bỏ `object`). Nếu Python
  không thể tạo class vì thứ tự base mâu thuẫn (lỗi `TypeError` do C3 thất bại) thì trả `["error"]`.
  Ví dụ kim cương `A; B(A); C(A); D(B, C)` cho `["D", "B", "C", "A"]`.
constraints: []
examples:
- input: spec = [["A", []], ["B", ["A"]], ["C", ["A"]], ["D", ["B", "C"]]]
  output: '["D", "B", "C", "A"]'
  explain_vi: C3 đặt B, C trước A vì A là cha chung của cả hai.
io:
  mode: function
  entry: mro_names
  params:
  - name: spec
    type: list
  returns: list[str]
  compare: exact
starter:
  python: "def mro_names(spec):\n    # TODO\n    pass\n"
limits:
