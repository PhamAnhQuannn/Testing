time_target_min: 12
hints:
- Đọc kỹ đề và ví dụ, xác định rõ đầu vào và đầu ra của `mro_names` trước khi viết code.
- Giữ một dict tên -> class để tra base khi tạo class mới bằng `type`.
- Bọc việc tạo class trong try/except TypeError để bắt trường hợp MRO không hợp lệ.
solution:
  file: solution.py
  approach_vi: Dựng lần lượt từng class bằng type, bắt TypeError, trả tên trong __mro__ trừ object.
  complexity: O(n)
