id: check-x376-hello-chain
subtopic_id: py.oop.inheritance_mro
secondary_subtopics: []
kind: check
title: 'Check X376: hello_chain'
title_vi: 'Kiểm tra X376: hello_chain'
difficulty: easy
source:
  type: original
statement_en_md: Implement `hello_chain(order)` as described in the Vietnamese statement (mastery check
  item X376, 5-minute time box).
statement_vi_md: |
  Viết hàm `hello_chain(order)`; bên trong hàm hãy định nghĩa các class sau rồi trả về `D().hello()`.
  `A.hello()` trả `"A"`. `B(A).hello()` và `C(A).hello()` trả `"B>"` / `"C>"` nối với `super().hello()`.
  `D` không tự định nghĩa `hello`; các base của `D` là các class trong `order` theo đúng thứ tự
  (`"BC"` nghĩa là `class D(B, C)`, `"CB"` là `class D(C, B)`, `"B"` là `class D(B)`); nếu `order` rỗng
  thì `D` kế thừa `A`. Ví dụ `hello_chain("BC")` là `"B>C>A"`.
constraints: []
examples:
- input: order = 'BC'
  output: '"B>C>A"'
  explain_vi: MRO của D(B, C) là D, B, C, A nên chuỗi super() đi B rồi C rồi A.
io:
  mode: function
  entry: hello_chain
  params:
  - name: order
    type: str
  returns: str
  compare: exact
starter:
  python: "def hello_chain(order):\n    # TODO\n    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 5
hints:
- Đọc kỹ đề và ví dụ, xác định rõ đầu vào và đầu ra của `hello_chain` trước khi viết code.
- Mỗi `hello` của B và C gọi `super().hello()`; thứ tự gọi do MRO của D quyết định.
- Tạo D từ tuple base bằng `type("D", bases, {})` để dùng được thứ tự động theo `order`.
solution:
  file: solution.py
  approach_vi: Dựng A, B, C, rồi D bằng type với tuple base theo order; gọi D().hello().
  complexity: O(1)
tests:
