kind: check
title: 'Check X622: tic-tac-toe winner'
title_vi: 'Kiểm tra X622: tic-tac-toe winner'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `winner(board)` for tic-tac-toe. `board` is a 3x3 list of lists of single-character strings,
  each one of `"X"`, `"O"` or `"."` (`"."` means an empty cell). Return `"X"` if X has three in a row
  (any row, any column, or either diagonal), `"O"` if O does. If nobody has three in a row and the board
  is full, return `"draw"`. If nobody has won and at least one empty cell remains, return `"none"`
  (game unfinished). The input never contains both an X line and an O line.
statement_vi_md: |
  Cài `winner(board)` cho tic-tac-toe. `board` là list 3x3 gồm các chuỗi một ký tự, mỗi ô là `"X"`, `"O"`
  hoặc `"."` (`"."` là ô trống). Trả `"X"` nếu X có ba ô thẳng hàng (hàng, cột hoặc một trong hai đường
  chéo), `"O"` nếu O có. Nếu không ai thắng và bàn đã đầy thì trả `"draw"`. Nếu không ai thắng và còn ít
  nhất một ô trống thì trả `"none"` (game chưa kết thúc). Đầu vào không bao giờ có cả đường X lẫn đường O.
constraints:
- board is 3 x 3
- each cell is "X", "O" or "."
examples:
- input: board = [["X","X","X"],["O","O","."],[".",".","."]]
  output: '"X"'
  explain_vi: Hàng đầu toàn X nên X thắng.
