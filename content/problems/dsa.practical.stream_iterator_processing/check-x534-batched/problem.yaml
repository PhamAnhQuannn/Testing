time_target_min: 8
hints:
- Chunk bắt đầu tại các chỉ số 0, size, 2*size, ... cho tới hết list.
- "Dùng range(0, len(items), size) làm các điểm bắt đầu, mỗi chunk là items[i:i + size] (slice tự cắt ngắn ở cuối)."
- "Nhớ chặn size <= 0 trả [] trước (range với bước 0 báo lỗi). List rỗng tự cho []."
