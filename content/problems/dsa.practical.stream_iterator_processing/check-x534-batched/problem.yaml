title: 'Check X534: batched'
title_vi: 'Kiểm tra X534: batched'
difficulty: easy
source:
  type: original
statement_en_md: |
  Implement `batched(items, size)`: split the list `items` into consecutive chunks of length `size`. The last
  chunk may be shorter. If `size <= 0` or `items` is empty, return `[]`. Order is preserved.
statement_vi_md: |
  Viết `batched(items, size)`: chia list `items` thành các chunk liên tiếp độ dài `size` (chunk cuối có thể
  ngắn hơn). Nếu `size <= 0` hoặc `items` rỗng thì trả `[]`. Giữ nguyên thứ tự phần tử.
constraints:
- 0 <= len(items) <= 1000
- -1000 <= items[i] <= 1000
- -5 <= size <= 2000
examples:
- input: items = [1, 2, 3, 4, 5], size = 2
  output: '[[1, 2], [3, 4], [5]]'
  explain_vi: Hai chunk đầy đủ [1, 2] và [3, 4], phần dư [5] thành chunk cuối ngắn hơn.
io:
  mode: function
  entry: batched
  params:
  - name: items
    type: list[int]
  - name: size
    type: int
  returns: list[list[int]]
  compare: exact
starter:
