hints:
- Max của cửa sổ chỉ phụ thuộc vào các ứng viên còn có thể là max; phần tử nhỏ hơn một phần tử đứng sau nó không bao giờ là max nữa.
- "Giữ deque các chỉ số sao cho nums[chỉ số] giảm dần. Với phần tử mới, pop đuôi khi nums[đuôi] <= phần tử mới, rồi append chỉ số mới."
- "Nếu chỉ số ở đầu deque <= i - k thì popleft (đã rơi khỏi cửa sổ). Từ i >= k - 1, nums[dq[0]] là max của cửa sổ. Xử lý trước các biên: rỗng, k <= 0, k >= len(nums)."
