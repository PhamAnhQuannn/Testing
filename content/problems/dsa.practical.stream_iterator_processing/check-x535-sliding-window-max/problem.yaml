kind: check
title: 'Check X535: sliding_window_max'
title_vi: 'Kiểm tra X535: sliding_window_max'
difficulty: easy
source:
  type: original
statement_en_md: |
  Implement `sliding_window_max(nums, k)`: return the list of maximums of every contiguous window of length
  `k`, from left to right. If `nums` is empty or `k <= 0`, return `[]`. If `k >= len(nums)`, return
  `[max(nums)]`. A monotonic deque of indices solves it in O(n).
statement_vi_md: |
  Viết `sliding_window_max(nums, k)`: trả list giá trị lớn nhất của mọi cửa sổ liên tiếp độ dài `k`, từ trái
  sang phải. Nếu `nums` rỗng hoặc `k <= 0` thì trả `[]`; nếu `k >= len(nums)` thì trả `[max(nums)]`.
  Gợi ý: monotonic deque lưu chỉ số, tổng O(n).
constraints:
- 0 <= len(nums) <= 2000
- -10000 <= nums[i] <= 10000
- -3 <= k <= 3000
examples:
- input: nums = [1, 3, -1, -3, 5, 3, 6, 7], k = 3
  output: '[3, 3, 5, 5, 6, 7]'
  explain_vi: Các cửa sổ [1,3,-1], [3,-1,-3], [-1,-3,5], [-3,5,3], [5,3,6], [3,6,7] có max lần lượt 3, 3, 5, 5, 6, 7.
