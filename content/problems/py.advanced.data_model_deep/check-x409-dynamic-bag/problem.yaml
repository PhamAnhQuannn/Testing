statement_vi_md: Viết `bag_report(data, names)`. Định nghĩa class `Bag` có `__init__(self, data)` gán mỗi
  cặp key/value của dict `data` thành thuộc tính (dùng `setattr`) và `__getattr__(self, name)` trả
  `name.upper()` cho tên không tồn tại. Tạo `Bag(data)` rồi trả `[sorted(vars(bag)), [getattr(bag, n) for n in names]]`.
constraints: []
examples:
