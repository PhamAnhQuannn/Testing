id: check-x410-slots-probe
subtopic_id: py.advanced.data_model_deep
secondary_subtopics: []
kind: check
title: 'Check X410: slots_probe'
title_vi: 'Kiểm tra X410: slots_probe'
difficulty: easy
source:
  type: original
statement_en_md: Implement `slots_probe(fields, attempts, with_dict)` as described in the Vietnamese statement
  (mastery check item X410, 12-minute time box).
statement_vi_md: >-
  Viết `slots_probe(fields, attempts, with_dict)`. Tạo class bằng
  `type("Probe", bases, {"__slots__": tuple(fields)})` với `bases = (Base,)` nếu `with_dict` là `True`
  (`Base` là class thường không có `__slots__`), ngược lại `bases = ()`. Tạo instance; với mỗi tên trong
  `attempts` thử `setattr(obj, name, 1)`, ghi `"ok"` nếu thành công, `"blocked"` nếu gặp `AttributeError`.
  Trả `[results, hasattr(obj, "__dict__")]`.
constraints: []
examples:
- input: 'fields = ["x", "y"], attempts = ["x", "z"], with_dict = False'
  output: '[["ok", "blocked"], false]'
  explain_vi: __slots__ chỉ cho x, y; z bị chặn và instance không có __dict__.
io:
  mode: function
  entry: slots_probe
  params:
  - name: fields
    type: list[str]
  - name: attempts
    type: list[str]
  - name: with_dict
    type: bool
  returns: list
  compare: exact
starter:
  python: "def slots_probe(fields, attempts, with_dict):\n    # TODO\n    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 12
hints:
- Dùng `type(name, bases, namespace)` để tạo class động; `namespace` chứa `__slots__`.
- Khi `with_dict` là True, thêm class cha thường `Base`, nên instance vẫn có `__dict__`.
- Bọc `setattr` trong `try/except AttributeError`; trả `[results, hasattr(obj, "__dict__")]`.
solution:
  file: solution.py
  approach_vi: Tạo class động với __slots__, thử setattr và bắt AttributeError.
  complexity: O(n)
