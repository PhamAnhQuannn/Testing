time_target_min: 8
hints:
- Với mỗi từ, bạn cần biết tiền tố ngắn nhất của nó có nằm trong dictionary không. Cấu trúc nào tra tiền tố nhanh?
- "Dựng trie dict lồng dict, đánh dấu node cuối của mỗi root bằng khóa đặc biệt. Với mỗi từ, đi từng ký tự; nếu ký tự không có trong node thì dừng và giữ nguyên từ."
- "Ngay khi node vừa đi tới có cờ kết thúc, trả về tiền tố đã đi (đó là root ngắn nhất). Tách câu bằng split(' '), thay từng từ rồi nối lại bằng ' '.join."
