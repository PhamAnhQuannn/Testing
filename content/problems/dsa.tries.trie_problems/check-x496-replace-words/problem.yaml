id: check-x496-replace-words
subtopic_id: dsa.tries.trie_problems
secondary_subtopics: []
kind: check
title: 'Check X496: replace_words'
title_vi: 'Kiểm tra X496: replace_words'
difficulty: easy
source:
  type: leetcode
  lc: 648
  rewrite_required: true
statement_en_md: |
  Given a list of `dictionary` roots and a `sentence` of words separated by single spaces, replace every
  word in the sentence by the SHORTEST root in `dictionary` that is a prefix of that word. If no root is a
  prefix of the word, keep the word unchanged. Return the resulting sentence. A trie built from the roots
  lets you walk each word once and stop at the first end-of-word marker.
statement_vi_md: |
  Viết `replace_words(dictionary, sentence)`: `dictionary` là danh sách các root, `sentence` gồm các từ
  cách nhau bằng một dấu cách. Thay mỗi từ bằng root NGẮN nhất trong `dictionary` là tiền tố của nó; không
  có root nào thì giữ nguyên từ. Trả về câu kết quả. Gợi ý: dựng trie từ các root, đi dọc từng từ và dừng
  ở cờ kết thúc đầu tiên.
constraints:
- 0 <= len(dictionary) <= 1000
- 1 <= len(dictionary[i]) <= 100, lowercase English letters
- sentence has words of lowercase letters separated by a single space, no leading or trailing space
examples:
- input: dictionary = ["cat", "bat", "rat"], sentence = "the cattle was rattled"
  output: '"the cat was rat"'
  explain_vi: '"cattle" có tiền tố "cat" và "rattled" có tiền tố "rat"; "the" và "was" không khớp root nào nên giữ nguyên.'
io:
  mode: function
  entry: replace_words
  params:
  - name: dictionary
    type: list[str]
  - name: sentence
    type: str
  returns: str
  compare: exact
starter:
