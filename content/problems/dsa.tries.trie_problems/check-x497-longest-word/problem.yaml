  approach_vi: Sắp xếp từ điển rồi duyệt; từ hợp lệ khi tiền tố bỏ ký tự cuối đã hợp lệ, chỉ cập nhật đáp án khi dài hơn hẳn nên hòa lấy từ nhỏ nhất.
  complexity: O(N log N * L) / O(N * L)
