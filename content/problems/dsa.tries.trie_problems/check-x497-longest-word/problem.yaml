kind: check
title: 'Check X497: longest_word'
title_vi: 'Kiểm tra X497: longest_word'
difficulty: easy
source:
  type: leetcode
  lc: 720
  rewrite_required: true
statement_en_md: |
  Given a list of `words`, return the longest word that can be built one character at a time by other
  words in `words`: every prefix of it (including itself) must also be in `words`. If several words have
  the same maximum length, return the lexicographically smallest one. If no word can be built, return the
  empty string `""`. Sorting the words (or a trie that only follows end-of-word nodes) gives a deterministic answer.
statement_vi_md: |
  Viết `longest_word(words)`: trả về từ dài nhất trong `words` có thể xây từng ký tự một bởi các từ khác
  trong `words`, tức mọi tiền tố của nó (kể cả chính nó) đều nằm trong `words`. Nếu có nhiều từ cùng độ dài
  lớn nhất thì lấy từ nhỏ nhất theo thứ tự từ điển; không có từ nào xây được thì trả chuỗi rỗng `""`.
  Gợi ý: sắp xếp từ rồi chỉ chấp nhận từ có tiền tố bỏ ký tự cuối đã hợp lệ, hoặc DFS trên trie.
constraints:
- 1 <= len(words) <= 1000
- 1 <= len(words[i]) <= 30, lowercase English letters
- words may contain duplicates
examples:
- input: words = ["w", "wo", "wor", "worl", "world"]
  output: '"world"'
  explain_vi: '"w", "wo", "wor", "worl" đều có trong danh sách nên "world" xây được từng ký tự.'
io:
  mode: function
  entry: longest_word
  params:
  - name: words
    type: list[str]
  returns: str
  compare: exact
starter:
  python: |
    def longest_word(words):
        # TODO: sắp xếp, chỉ nhận từ có w[:-1] đã hợp lệ; hòa thì lấy từ nhỏ hơn theo từ điển
        return ""
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 10
hints:
- Một từ chỉ xây được nếu bỏ ký tự cuối đi thì phần còn lại cũng xây được (hoặc từ chỉ có 1 ký tự).
- "Sắp xếp words theo thứ tự từ điển: tiền tố luôn đứng trước từ dài hơn. Giữ một tập các từ đã hợp lệ, ban đầu chứa chuỗi rỗng; từ w hợp lệ nếu w[:-1] nằm trong tập."
- "Cập nhật đáp án chỉ khi w DÀI HƠN hẳn đáp án hiện tại. Vì đang duyệt theo thứ tự từ điển, từ đầu tiên đạt độ dài đó cũng là từ nhỏ nhất. Không có từ nào hợp lệ thì đáp án giữ là chuỗi rỗng."
