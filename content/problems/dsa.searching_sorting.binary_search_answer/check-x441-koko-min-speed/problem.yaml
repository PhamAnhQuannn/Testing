title: 'Check X441: min_speed'
title_vi: 'Kiểm tra X441: min_speed'
difficulty: easy
source:
  type: original
statement_en_md: |
  Koko has `piles[i]` bananas in pile `i`. She eats at an integer speed `k` bananas per hour; each hour she
  picks one pile and eats up to `k` bananas from it (if the pile has fewer than `k`, she finishes it and
  eats nothing more that hour). Return the minimum integer speed `k` such that she eats all bananas within
  `h` hours. Guaranteed: `1 <= len(piles) <= h`, every pile `>= 1`.
statement_vi_md: |
  Viết `min_speed(piles, h)`: trả về tốc độ ăn nguyên **nhỏ nhất** `k` (chuối/giờ) để ăn hết mọi nải trong
  tối đa `h` giờ. Mỗi giờ chỉ ăn trong một nải (tối đa `k` quả); nải ít hơn `k` thì ăn hết nải rồi nghỉ phần
  giờ còn lại, nên nải `p` mất `ceil(p / k)` giờ. Đảm bảo `len(piles) <= h`. Gợi ý: tìm nhị phân trên `k`.
constraints:
- 1 <= len(piles) <= h
- 1 <= piles[i] <= 10^9
examples:
- input: piles = [3, 6, 7, 11], h = 8
  output: '4'
  explain_vi: Với k = 4, thời gian là 1 + 2 + 2 + 3 = 8 giờ; k = 3 mất 1 + 2 + 3 + 4 = 10 giờ.
