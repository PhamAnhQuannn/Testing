time_target_min: 5
hints:
- Nếu tốc độ k đủ ăn hết trong h giờ thì mọi tốc độ lớn hơn k cũng đủ. Tính đơn điệu này cho phép tìm nhị phân trên k.
- "Khoảng tìm là k từ 1 đến max(piles). Hàm kiểm tra `feasible(k)`: tổng `(p + k - 1) // k` trên mọi nải có <= h không."
- Nếu feasible(mid) thì đáp án <= mid nên `hi = mid`; ngược lại `lo = mid + 1`. Dừng khi lo == hi.
