        pass
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 12
hints:
- Nếu tải trọng c đủ chở trong `days` ngày thì mọi tải trọng lớn hơn c cũng đủ. Vậy tìm nhị phân trên c.
- Cận dưới là `max(weights)` (phải chở được kiện nặng nhất), cận trên là `sum(weights)` (chở một ngày).
- Hàm kiểm tra tham lam, duyệt theo thứ tự, cộng dồn vào ngày hiện tại; nếu cộng w vượt c thì sang ngày mới. Đếm số ngày và so với `days`.
solution:
