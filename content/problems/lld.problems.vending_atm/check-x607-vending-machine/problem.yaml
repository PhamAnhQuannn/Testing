id: check-x607-vending-machine
subtopic_id: lld.problems.vending_atm
secondary_subtopics: []
kind: check
title: 'Check X607: Vending Machine'
title_vi: 'Kiểm tra X607: Máy bán hàng'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  A small vending machine with an inventory and a running balance. Money is an `int` (no floats).
  Rejections return the sentinel `-1` (never raise).

  Implement `class VendingMachine` (constructor takes no arguments; no slots, balance 0) with:

  - `load(code, qty, price)`: stocks `qty` units in slot `code` at int `price`. Calling it again for
    the same `code` replaces that slot. Returns nothing.
  - `insert(amount)`: adds the int `amount` to the current balance. Returns nothing.
  - `select(code)`: if the slot exists, has stock (`qty > 0`) and `balance >= price`: dispense one unit
    (decrement the stock), return the int change `balance - price` and reset the balance to 0.
    Otherwise return `-1`, dispense nothing and leave the balance unchanged.
  - `balance()`: returns the current int balance.
statement_vi_md: |
  Máy bán hàng nhỏ có kho và balance (tiền đang bỏ vào). Tiền là `int` (không dùng float). Trường hợp
  bị từ chối trả sentinel `-1` (không raise exception).

  Viết `class VendingMachine` (constructor không tham số; chưa có ngăn nào, balance 0) với:

  - `load(code, qty, price)`: nạp `qty` sản phẩm vào ngăn `code` với giá `price` (int). Gọi lại với
    cùng `code` thì ghi đè ngăn đó. Không trả gì.
  - `insert(amount)`: cộng `amount` (int) vào balance. Không trả gì.
  - `select(code)`: nếu ngăn tồn tại, còn hàng (`qty > 0`) và `balance >= price`: nhả 1 sản phẩm (trừ kho),
    trả tiền thừa `balance - price` (int) và đặt balance về 0. Ngược lại trả `-1`, không nhả hàng và giữ
    nguyên balance.
  - `balance()`: trả balance hiện tại.
constraints:
- 'amount, qty, price là số nguyên không âm; price > 0.'
- 'Không dùng float, thread, time hay random.'
examples:
- input: ops = ['VendingMachine', 'load', 'insert', 'select', 'balance'], args = [[], ['A1', 2, 10], [25], ['A1'], []]
  output: '[null, null, null, 15, 0]'
  explain_vi: 'Đủ tiền (25 >= 10): tiền thừa 15, balance về 0.'
io:
  mode: class_ops
  compare: exact
starter:
  python: "class VendingMachine:\n    # TODO\n    pass\n"
limits:
