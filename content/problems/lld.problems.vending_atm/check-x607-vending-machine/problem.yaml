- 'select: kiểm tra ngăn tồn tại, còn hàng và đủ tiền trước khi đổi bất kỳ thứ gì; thiếu thì return -1.'
- 'Khi thành công: trừ kho, tính change = balance - price, đặt balance = 0, trả change.'
solution:
