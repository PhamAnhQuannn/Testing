id: check-x553-fix-chunk-average
subtopic_id: dsa.practical.ai_assisted_coding
secondary_subtopics: []
kind: check
title: 'Check X553: chunk_averages'
title_vi: 'Kiểm tra X553: chunk_averages'
difficulty: easy
source:
  type: original
statement_en_md: |
  An AI assistant wrote `chunk_averages` but it breaks on edge cases. Write a correct version: split `nums`
  into consecutive chunks of length `size` and return the list with the average of each chunk. An average
  is an `int` when it is a whole number, otherwise a `float`. The last chunk may be shorter and must be
  averaged over its own elements only. If `size <= 0` or `nums` is empty, return `[]`.
statement_vi_md: |
  Một trợ lý AI viết `chunk_averages` nhưng hàm sai ở các trường hợp biên. Hãy viết bản đúng: cắt `nums`
  thành các đoạn (chunk) liên tiếp dài `size` và trả danh sách trung bình của từng đoạn. Trung bình là
  `int` nếu chia hết, ngược lại là `float`. Đoạn cuối có thể ngắn hơn và chỉ chia cho số phần tử thật của
  nó (không chia cho `size`). Nếu `size <= 0` hoặc `nums` rỗng thì trả `[]`.
constraints:
- 0 <= len(nums) <= 1000
- -1000 <= nums[i] <= 1000
- size is any int, possibly 0 or negative or larger than len(nums)
examples:
- input: nums = [1, 2, 3, 4], size = 2
  output: '[1.5, 3.5]'
  explain_vi: Chunk [1, 2] có trung bình 1.5, chunk [3, 4] có trung bình 3.5.
io:
  mode: function
  entry: chunk_averages
  params:
  - name: nums
    type: list[int]
  - name: size
    type: int
  returns: any
  compare: exact
starter:
  python: |
    def chunk_averages(nums, size):
        # Bản AI đề xuất: sai khi size <= 0, chunk cuối ngắn, hoặc kết quả chia hết
        out = []
        for i in range(0, len(nums), size):
            out.append(sum(nums[i:i + size]) / size)
        return out
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 8
hints:
- Thử bản AI với size = 0, nums = [] và nums = [1, 2, 3] với size = 2 để xem nó hỏng ở đâu.
- Chunk cuối có thể ngắn hơn size, nên chia cho len(chunk) chứ không chia cho size. Xử lý size <= 0 và nums rỗng trước vòng lặp.
- "Với tổng total và số phần tử n: nếu total % n == 0 thì thêm total // n (int), ngược lại thêm total / n (float)."
solution:
  file: solution.py
  approach_vi: Trả [] sớm nếu size <= 0 hoặc rỗng; duyệt từng chunk, chia cho len(chunk), trả int khi chia hết.
  complexity: O(n) / O(n/size)
tests:
  sample: tests/sample.jsonl
  hidden: tests/hidden.jsonl
  generator: tests/gen.py
tags:
- check
- x553
status: validated
version: 1
