id: check-x499-jump-game
subtopic_id: dsa.greedy_intervals.greedy_basics
secondary_subtopics: []
kind: check
title: 'Check X499: can_jump'
title_vi: 'Kiểm tra X499: can_jump'
difficulty: easy
source:
  type: leetcode
  lc: 55
  rewrite_required: true
statement_en_md: |
  You are standing at index 0 of an integer array `nums`. Each `nums[i]` is the maximum jump length from
  index `i` (you may jump any length from 0 to `nums[i]`). Return `True` if you can reach the last index,
  otherwise `False`. A greedy scan that tracks the farthest reachable index solves it in O(n).
statement_vi_md: |
  Viết `can_jump(nums)`: bạn đứng ở chỉ số 0 của mảng số nguyên `nums`. Mỗi `nums[i]` là độ dài bước nhảy
  tối đa từ chỉ số `i` (được nhảy mọi độ dài từ 0 đến `nums[i]`). Trả về `True` nếu có thể tới chỉ số cuối,
  ngược lại `False`. Gợi ý: duyệt một lượt và giữ chỉ số xa nhất có thể tới (`reach`).
constraints:
- 1 <= len(nums) <= 10^4
- 0 <= nums[i] <= 10^5
examples:
- input: nums = [2, 3, 1, 1, 4]
  output: 'true'
  explain_vi: Nhảy 1 bước tới chỉ số 1, rồi nhảy 3 bước tới chỉ số cuối.
- input: nums = [3, 2, 1, 0, 4]
  output: 'false'
  explain_vi: Mọi đường đều dừng ở chỉ số 3 (giá trị 0) nên không bao giờ qua được tới chỉ số 4.
io:
  mode: function
  entry: can_jump
  params:
  - name: nums
    type: list[int]
  returns: bool
  compare: exact
starter:
  python: |
    def can_jump(nums):
        # TODO: giữ reach = chỉ số xa nhất tới được; nếu i > reach thì False
        return True
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 8
hints:
- Bạn không cần thử mọi đường nhảy. Chỉ cần biết chỉ số xa nhất có thể tới được cho tới thời điểm hiện tại.
- "Duyệt i từ trái sang phải với reach = 0. Nếu i > reach thì chỉ số i không tới được, nghĩa là bị chặn (thường do số 0)."
- "Ở mỗi i tới được, cập nhật reach = max(reach, i + nums[i]). Nếu reach >= len(nums) - 1 thì trả True; nếu duyệt xong thì trả True."
solution:
  file: solution.py
  approach_vi: Greedy một lượt, giữ chỉ số xa nhất có thể tới; gặp chỉ số vượt quá reach thì bị chặn.
  complexity: O(n) / O(1)
