hints:
- 'Coi mỗi lần nhảy là một "tầng" của BFS, tầng hiện tại gồm các chỉ số tới được bằng số bước nhảy đã dùng.'
- "Duyệt i từ 0 tới len(nums) - 2, giữ farthest = max(farthest, i + nums[i]) và cur_end là biên của tầng hiện tại."
- "Khi i == cur_end là đã duyệt hết tầng: jumps += 1 và cur_end = farthest. Trả jumps khi duyệt xong."
