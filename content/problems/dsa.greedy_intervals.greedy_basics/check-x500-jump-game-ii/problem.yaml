id: check-x500-jump-game-ii
subtopic_id: dsa.greedy_intervals.greedy_basics
secondary_subtopics: []
kind: check
title: 'Check X500: min_jumps'
title_vi: 'Kiểm tra X500: min_jumps'
difficulty: easy
source:
  type: leetcode
  lc: 45
  rewrite_required: true
statement_en_md: |
  You start at index 0 of an integer array `nums`. Each `nums[i]` is the maximum jump length from index
  `i`. Return the minimum number of jumps needed to reach the last index. The last index is guaranteed to
  be reachable. A greedy "BFS by layers" scan solves it in O(n).
statement_vi_md: |
  Viết `min_jumps(nums)`: bạn bắt đầu ở chỉ số 0 của mảng `nums`. Mỗi `nums[i]` là độ dài bước nhảy tối đa
  từ chỉ số `i`. Trả về số bước nhảy tối thiểu để tới chỉ số cuối (đảm bảo luôn tới được). Gợi ý: greedy
  theo từng "tầng": mỗi lần hết tầng hiện tại thì tốn thêm một bước nhảy.
constraints:
- 1 <= len(nums) <= 10^4
- 0 <= nums[i] <= 1000
- The last index is always reachable.
examples:
- input: nums = [2, 3, 1, 1, 4]
  output: '2'
  explain_vi: Nhảy 1 bước tới chỉ số 1, rồi nhảy 3 bước tới chỉ số cuối, tổng 2 bước nhảy.
- input: nums = [0]
  output: '0'
  explain_vi: Đã đứng ở chỉ số cuối nên không cần nhảy.
io:
  mode: function
  entry: min_jumps
  params:
  - name: nums
    type: list[int]
  returns: int
  compare: exact
