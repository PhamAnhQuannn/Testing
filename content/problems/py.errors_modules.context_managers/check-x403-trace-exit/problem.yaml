id: check-x403-trace-exit
subtopic_id: py.errors_modules.context_managers
secondary_subtopics: []
kind: check
title: 'Check X403: run'
title_vi: 'Kiểm tra X403: run'
difficulty: easy
source:
  type: original
statement_en_md: Implement `run(kind)` with a class-based context manager `Tracer` as described in the
  Vietnamese statement (mastery check item X403).
statement_vi_md: 'Viết `run(kind)` (kind là `"ok"`, `"value"` hoặc `"key"`) trả về list log các sự kiện theo
  thứ tự. Định nghĩa class `Tracer(log)`: `__enter__` ghi `"enter"`; `__exit__` ghi `"exit"` nếu không lỗi, hoặc
  `"exit:<TênLỗi>"` nếu có lỗi, và chỉ nuốt `ValueError` (lỗi khác lan ra). Trong `run`: `with Tracer(log):`
  ghi `"body"`, rồi ném `ValueError` nếu kind là `"value"`, ném `KeyError` nếu là `"key"`, còn `"ok"` thì ghi
  `"end"`. Bọc cả khối `with` trong `try/except KeyError` ghi `"caught:KeyError"` rồi trả log ngay; nếu không có
  lỗi lan ra thì ghi `"after"` sau khối `try`.'
constraints: []
examples:
- input: kind = 'value'
  output: '["enter", "body", "exit:ValueError", "after"]'
  explain_vi: ValueError bị nuốt trong __exit__ nên chạy tiếp tới "after".
io:
  mode: function
  entry: run
  params:
  - name: kind
    type: str
  returns: list[str]
  compare: exact
starter:
  python: "def run(kind):\n    # TODO\n    pass\n"
limits:
