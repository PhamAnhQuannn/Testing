- Thử tay với ví dụ đầu tiên, ghi lại từng bước, rồi chuyển các bước đó thành code.
- Kiểm tra các trường hợp biên (không lỗi, lỗi bị nuốt, lỗi lan ra) trước khi nộp; nếu vẫn kẹt, xem lại bài
  học của mục này.
