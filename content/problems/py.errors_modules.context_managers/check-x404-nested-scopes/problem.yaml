- Thử tay với ví dụ đầu tiên, ghi lại từng bước, rồi chuyển các bước đó thành code.
- Kiểm tra các trường hợp biên (names rỗng, có lỗi, không lỗi) trước khi nộp; nếu vẫn kẹt, xem lại bài
  học của mục này.
