id: check-x404-nested-scopes
subtopic_id: py.errors_modules.context_managers
secondary_subtopics: []
kind: check
title: 'Check X404: nested'
title_vi: 'Kiểm tra X404: nested'
difficulty: easy
source:
  type: original
statement_en_md: Implement `nested(names, fail)` with a `@contextmanager` helper `scoped` as described in the
  Vietnamese statement (mastery check item X404).
statement_vi_md: 'Viết `nested(names, fail)` trả về list log. Dùng `@contextlib.contextmanager` định nghĩa
  `scoped(log, name)`: ghi `"enter <name>"` khi vào, `yield`, và ghi `"exit <name>"` khi ra kể cả khi có lỗi
  (dùng `finally`). `nested` vào lần lượt các `scoped` theo thứ tự `names` (gợi ý: `contextlib.ExitStack`), ghi
  `"body"`, rồi nếu `fail` thì ném `RuntimeError`. Lỗi được bắt bên ngoài các `with` và ghi `"caught"`. Các
  `exit` theo thứ tự ngược với `enter`.'
constraints: []
examples:
- input: names = ['a', 'b'], fail = True
  output: '["enter a", "enter b", "body", "exit b", "exit a", "caught"]'
  explain_vi: Lỗi làm các exit chạy ngược thứ tự (b trước a), rồi mới tới "caught".
io:
  mode: function
  entry: nested
  params:
  - name: names
    type: list[str]
  - name: fail
    type: bool
  returns: list[str]
  compare: exact
starter:
  python: "def nested(names, fail):\n    # TODO\n    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
