difficulty: easy
source: {type: leetcode, lc: 509, rewrite_required: true}
statement_en_md: |
  The Fibonacci numbers form a sequence in which `F(0) = 0`, `F(1) = 1`, and every later number is
  the sum of the two before it: `F(n) = F(n - 1) + F(n - 2)` for `n > 1`. Given `n`, return `F(n)`.
statement_vi_md: |
  Dãy Fibonacci có `F(0) = 0`, `F(1) = 1`, và mỗi số sau là tổng hai số đứng ngay trước nó:
  `F(n) = F(n - 1) + F(n - 2)` với `n > 1`. Cho `n`, trả về `F(n)`.
constraints:
  - "0 <= n <= 30"
examples:
  - {input: "n = 2", output: "1", explain_vi: "F(2) = F(1) + F(0) = 1 + 0 = 1."}
  - {input: "n = 4", output: "3", explain_vi: "Dãy: 0, 1, 1, 2, 3, nên F(4) = 3."}
