id: fix-collect-evens
subtopic_id: py.functions.def_args
secondary_subtopics: []
kind: check
title: "Fix the bug: collect evens"
title_vi: "Sửa bug: gom số chẵn"
difficulty: easy
source: {type: original, rewrite_required: false}
statement_en_md: |
  The code below was written by an AI and has a bug. Fix it so all tests pass.
  `collect_evens(nums, acc)` returns the even numbers of `nums`, appended to `acc` (a fresh list when `acc` is not given),
  and `evens_per_batch(batches)` returns one such list per batch, each computed independently.
statement_vi_md: |
  Đoạn code dưới đây do AI viết và có một bug. Hãy sửa để pass hết test.
  `collect_evens(nums, acc)` trả về các số chẵn của `nums`, nối thêm vào `acc` (một list mới khi không truyền `acc`),
  còn `evens_per_batch(batches)` trả về một list như vậy cho mỗi batch, mỗi batch tính độc lập.
constraints:
  - "0 <= len(batches) <= 20"
examples:
  - {input: 'batches = [[1, 2, 3, 4], [6, 8]]', output: '[[2, 4], [6, 8]]', explain_vi: "Mỗi batch chỉ chứa số chẵn của chính nó."}
  - {input: 'batches = [[5, 7], [9]]', output: '[[], []]', explain_vi: "Không có số chẵn nào."}
io:
  mode: function
  entry: evens_per_batch
  params: [{name: batches, type: "list[list[int]]"}]
  returns: "list[list[int]]"
  compare: exact
starter:
  python: |
    def collect_evens(nums, acc=[]):
        for n in nums:
            if n % 2 == 0:
                acc.append(n)
        return acc


    def evens_per_batch(batches):
        return [collect_evens(batch) for batch in batches]
limits: {time_ms: 1000, memory_mb: 256, time_multiplier: {pyodide: 3}}
time_target_min: 6
hints:
  - "Thử batches = [[2], [4]]: batch thứ hai có chứa số 2 của batch đầu không?"
  - "Giá trị mặc định `[]` chỉ được tạo một lần khi `def` chạy, rồi dùng chung cho mọi lần gọi."
  - "Đặt mặc định `acc=None`; trong thân hàm: `if acc is None: acc = []`."
solution:
  file: solution.py
  approach_vi: "Dùng None làm mặc định và tạo list mới bên trong hàm mỗi lần gọi."
  complexity: "O(n) time, O(n) space"
tests:
  sample: tests/sample.jsonl
  hidden: tests/hidden.jsonl
  generator: tests/gen.py
tags: [check, fix-the-bug, mutable-default]
status: validated
version: 1
