id: compute-prf
subtopic_id: py.functions.def_args
secondary_subtopics: []
kind: check
title: "Compute precision, recall, F1"
title_vi: "Tính precision, recall, F1"
difficulty: easy
source: {type: original, rewrite_required: false}
statement_en_md: |
  Implement `precision_recall_f1(y_true, y_pred)`. Both are equal-length lists of 0/1 (1 = positive).
  Count TP (true 1, predicted 1), FP (true 0, predicted 1) and FN (true 1, predicted 0).
  precision = TP/(TP+FP), recall = TP/(TP+FN), f1 = 2*p*r/(p+r).
  If any denominator is zero, that value is 0.0.
  Return `{"precision": p, "recall": r, "f1": f}` with each value rounded to 3 decimals.
statement_vi_md: |
  Cài đặt `precision_recall_f1(y_true, y_pred)`. Cả hai là list 0/1 cùng độ dài (1 = positive).
  Đếm TP (thật 1, đoán 1), FP (thật 0, đoán 1), FN (thật 1, đoán 0).
  precision = TP/(TP+FP), recall = TP/(TP+FN), f1 = 2*p*r/(p+r).
  Nếu mẫu số bằng 0 thì giá trị đó là 0.0.
  Trả về `{"precision": p, "recall": r, "f1": f}`, mỗi giá trị làm tròn 3 chữ số thập phân.
constraints:
  - "0 <= len(y_true) == len(y_pred) <= 1000"
  - "Mỗi phần tử là 0 hoặc 1 (1 = positive)"
examples:
  - {input: 'y_true = [1, 0, 1, 1], y_pred = [1, 1, 0, 1]', output: '{"precision": 0.667, "recall": 0.667, "f1": 0.667}', explain_vi: "TP=2, FP=1, FN=1."}
  - {input: 'y_true = [0, 0], y_pred = [0, 0]', output: '{"precision": 0.0, "recall": 0.0, "f1": 0.0}', explain_vi: "Không có positive nào: mẫu số 0 nên trả 0.0."}
