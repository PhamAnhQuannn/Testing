id: check-apply-ops
subtopic_id: py.functions.def_args
secondary_subtopics: []
kind: check
title: "Check X330: apply_ops"
title_vi: "Kiểm tra X330: apply_ops"
difficulty: easy
source:
  type: original
statement_en_md: |
  Implement `apply_ops(nums, specs)`. Each spec is `[name]` or `[name, k]`. Apply the specs in order
  to every element of the list. Operations (the parameter `k` has a default when omitted):
  `"add"` -> `v + k` (k=1), `"mul"` -> `v * k` (k=2), `"pow"` -> `v ** k` (k=2),
  `"clip"` -> `min(v, k)` (k=10), `"drop_below"` -> remove elements with `v < k` (k=0).
  Return the resulting list (order preserved).
statement_vi_md: |
  Viết `apply_ops(nums, specs)`. Mỗi spec là `[name]` hoặc `[name, k]`. Áp dụng lần lượt các spec lên
  từng phần tử của list. Phép toán (tham số `k` có giá trị mặc định khi bị bỏ qua):
  `"add"` -> `v + k` (k=1), `"mul"` -> `v * k` (k=2), `"pow"` -> `v ** k` (k=2),
  `"clip"` -> `min(v, k)` (k=10), `"drop_below"` -> loại các phần tử có `v < k` (k=0).
  Trả về list kết quả (giữ nguyên thứ tự).
constraints:
  - "0 <= len(nums) <= 20"
  - "0 <= len(specs) <= 6"
examples:
  - {input: 'nums = [1, 2, 3], specs = [["add"], ["mul"]]', output: "[4, 6, 8]", explain_vi: "add mặc định k=1 rồi mul mặc định k=2."}
  - {input: 'nums = [-3, -1, 0, 4], specs = [["drop_below"]]', output: "[0, 4]", explain_vi: "drop_below mặc định k=0."}
io:
  mode: function
  entry: apply_ops
  params: [{name: nums, type: "list[int]"}, {name: specs, type: "list[list]"}]
  returns: "list[int]"
  compare: exact
starter:
  python: |
    def apply_ops(nums, specs):
        # TODO: mỗi phép là hàm có tham số mặc định; tra theo tên, gọi với *spec[1:]
        pass
limits: {time_ms: 1000, memory_mb: 256, time_multiplier: {pyodide: 3}}
time_target_min: 12
hints:
  - "Định nghĩa mỗi phép là một hàm `def f(v, k=giá_trị_mặc_định)` rồi gom vào dict tên -> hàm."
  - "Với spec `[name, *extra]`, gọi `fn(v, *extra)`: nếu extra rỗng thì giá trị mặc định được dùng."
  - "`drop_below` có thể trả `None` cho phần tử bị loại rồi lọc sau mỗi bước; chú ý `0` là giá trị hợp lệ (đừng lọc bằng `if v`)."
solution:
  file: solution.py
  approach_vi: "Dict tên -> hàm có đối số mặc định; áp dụng từng spec bằng *spec[1:]."
  complexity: O(len(nums) * len(specs))
tests:
