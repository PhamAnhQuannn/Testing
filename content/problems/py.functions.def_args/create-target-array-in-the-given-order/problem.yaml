id: create-target-array-in-the-given-order
subtopic_id: py.functions.def_args
secondary_subtopics: []
kind: practice
title: "Create Target Array in the Given Order"
title_vi: "Dựng mảng đích theo thứ tự chèn"
difficulty: easy
source: {type: leetcode, lc: 1389, rewrite_required: true}
statement_en_md: |
  Given two integer arrays `nums` and `index` of the same length, build a target array. Start with
  an empty target. For `i` from `0` to `len(nums) - 1`, insert the value `nums[i]` into the target
  at position `index[i]` (shifting the elements already at or after that position to the right).
  Return the target array. It is guaranteed that every insertion position is valid.
statement_vi_md: |
  Cho hai list số nguyên `nums` và `index` cùng độ dài. Bắt đầu với list đích rỗng. Với `i` từ `0`
  đến `len(nums) - 1`, **chèn** giá trị `nums[i]` vào vị trí `index[i]` của list đích (các phần tử
  đang ở vị trí đó trở đi bị đẩy sang phải một ô). Trả về list đích sau khi chèn xong. Đề đảm bảo
  mọi vị trí chèn đều hợp lệ.
constraints:
  - "1 <= len(nums) == len(index) <= 100"
  - "0 <= nums[i] <= 100"
  - "0 <= index[i] <= i"
examples:
  - {input: "nums = [0, 1, 2, 3, 4], index = [0, 1, 2, 2, 1]", output: "[0, 4, 1, 3, 2]", explain_vi: "Chèn lần lượt: [0] -> [0, 1] -> [0, 1, 2] -> [0, 1, 3, 2] -> [0, 4, 1, 3, 2]."}
  - {input: "nums = [1, 2, 3, 4, 0], index = [0, 1, 2, 3, 0]", output: "[0, 1, 2, 3, 4]", explain_vi: "Bốn số đầu chèn vào cuối; số 0 cuối cùng chèn vào vị trí 0 nên đứng đầu."}
