id: check-x681-parity
subtopic_id: ml.fundamentals.interpretability_fairness
secondary_subtopics: []
kind: check
title: 'Check X681: demographic parity gap'
title_vi: 'Kiểm tra X681: chênh lệch demographic parity'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `parity_gap(a_approved, a_total, b_approved, b_total)`: the absolute demographic-parity gap
  between two groups, `|a_approved / a_total - b_approved / b_total|`. All four arguments are ints. A group
  with total 0 has approval rate `0.0`. Return a float `round(result, 6)`.
statement_vi_md: |
  Cài `parity_gap(a_approved, a_total, b_approved, b_total)`: chênh lệch demographic parity tuyệt đối giữa
  hai nhóm, `|a_approved / a_total - b_approved / b_total|`. Cả bốn tham số là số nguyên. Nhóm có tổng 0 thì
  tỉ lệ duyệt là `0.0`. Trả float `round(kết quả, 6)`.
constraints:
- 0 <= a_approved <= a_total, 0 <= b_approved <= b_total
examples:
- input: a_approved = 60, a_total = 100, b_approved = 30, b_total = 100
  output: '0.3'
  explain_vi: Tỉ lệ duyệt 0,6 và 0,3 nên chênh lệch 0,3.
io:
  mode: function
  entry: parity_gap
  params:
  - name: a_approved
    type: int
  - name: a_total
    type: int
  - name: b_approved
    type: int
  - name: b_total
    type: int
  returns: float
  compare: float_tol
