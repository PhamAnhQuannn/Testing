time_target_min: 5
hints:
- Tỉ lệ duyệt của một nhóm là approved / total.
- "Nhóm có total == 0 thì gán rate 0.0 để tránh chia cho 0."
- "Lấy abs(rate_a - rate_b) rồi round(..., 6) ở bước cuối."
solution:
