id: check-np-std
subtopic_id: ml.classical.linear_regression
secondary_subtopics: []
kind: check
title: 'Check: population standard deviation with numpy'
title_vi: 'Kiểm tra: độ lệch chuẩn tổng thể với numpy'
difficulty: easy
source:
  type: original
  rewrite_required: false
statement_en_md: |
  Implement `std_dev(xs)` that returns the population standard deviation of the list of numbers
  `xs` (divide by `n`, not `n - 1`), rounded to 6 decimals. Use `numpy`.
  For `xs = [2, 4, 4, 4, 5, 5, 7, 9]` the result is `2.0`.
statement_vi_md: |
  Cài `std_dev(xs)` trả về độ lệch chuẩn tổng thể của danh sách số `xs` (chia cho `n`, không phải `n - 1`),
  làm tròn 6 chữ số. Dùng `numpy`.
  Với `xs = [2, 4, 4, 4, 5, 5, 7, 9]` kết quả là `2.0`.
constraints:
- 1 <= n <= 1000
examples:
- input: xs = [2.0, 4.0, 4.0, 4.0, 5.0, 5.0, 7.0, 9.0]
  output: '2.0'
  explain_vi: Trung bình là 5, phương sai tổng thể là 4 nên độ lệch chuẩn là 2.
