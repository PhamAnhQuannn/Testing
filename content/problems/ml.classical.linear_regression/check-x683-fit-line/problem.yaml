kind: check
title: 'Check X683: fit a line'
title_vi: 'Kiểm tra X683: khớp đường thẳng'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `fit_line(xs, ys)` that fits `y = slope * x + intercept` by ordinary least squares
  (simple linear regression) and returns `[slope, intercept]`, each rounded to 6 decimals.
  Use the closed form: `slope = (n*Sxy - Sx*Sy) / (n*Sxx - Sx*Sx)` and `intercept = (Sy - slope*Sx) / n`.
  Assume `n >= 2` and the `xs` are not all equal. For `xs = [1, 2, 3]`, `ys = [2, 4, 6]` the result is `[2.0, 0.0]`.
statement_vi_md: |
  Cài `fit_line(xs, ys)` khớp `y = slope * x + intercept` bằng bình phương tối thiểu (hồi quy tuyến tính đơn)
  và trả `[slope, intercept]`, mỗi giá trị làm tròn 6 chữ số. Dùng công thức đóng
  `slope = (n*Sxy - Sx*Sy) / (n*Sxx - Sx*Sx)`, `intercept = (Sy - slope*Sx) / n`.
  Giả sử `n >= 2` và các `xs` không đều bằng nhau. Với `xs = [1, 2, 3]`, `ys = [2, 4, 6]` kết quả là `[2.0, 0.0]`.
constraints:
- 2 <= n <= 1000, len(xs) == len(ys)
- xs không đều bằng nhau (mẫu số khác 0)
examples:
- input: xs = [1, 2, 3], ys = [2, 4, 6]
  output: '[2.0, 0.0]'
  explain_vi: Dữ liệu nằm đúng trên đường y = 2x nên slope 2 và intercept 0.
