hints:
- Edge list chưa tiện duyệt. Hãy dựng danh sách kề adj = [[] for _ in range(n)] rồi với mỗi [u, v] thêm adj[u].append(v) (chỉ một chiều vì đồ thị có hướng).
- Dùng một tập hoặc mảng visited. Bắt đầu với stack hoặc queue chứa src và đánh dấu src đã thăm.
- Mỗi lần lấy một đỉnh ra, duyệt các hàng xóm; hàng xóm chưa thăm thì đánh dấu và đẩy vào. Cuối cùng trả số đỉnh đã thăm (đã gồm src).
