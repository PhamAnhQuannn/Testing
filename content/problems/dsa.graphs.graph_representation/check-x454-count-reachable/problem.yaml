  lc: 797
  rewrite_required: true
statement_en_md: |
  A directed graph has `n` nodes numbered `0..n-1`. `edges` is a list of pairs `[u, v]`, each meaning a
  directed edge `u -> v`. Return the number of nodes reachable from `src`, including `src` itself. Build an
  adjacency list from the edge list, then run DFS or BFS from `src` and count the visited nodes.
statement_vi_md: |
  Viết `count_reachable(n, edges, src)`: đồ thị CÓ HƯỚNG gồm `n` đỉnh đánh số `0..n-1`, `edges` là danh sách
  cặp `[u, v]` nghĩa là cạnh có hướng `u -> v`. Trả về số đỉnh đi tới được từ `src`, tính cả `src`. Gợi ý:
  dựng danh sách kề từ edge list rồi DFS/BFS từ `src`, đếm số đỉnh đã thăm.
constraints:
- 1 <= n <= 1000
- 0 <= u, v < n
- 0 <= src < n
examples:
- input: n = 4, edges = [[0, 1], [1, 2], [3, 0]], src = 0
  output: '3'
  explain_vi: Từ 0 đi được tới 1 rồi 2; đỉnh 3 chỉ có cạnh đi vào 0 nên không tới được. Đáp án 3 (0, 1, 2).
