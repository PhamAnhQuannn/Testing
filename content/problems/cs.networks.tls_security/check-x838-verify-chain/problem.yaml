hints:
- "Trường hợp rỗng trả `False` ngay; các trường hợp còn lại cần duyệt các cặp liền kề."
- "Với mỗi `i` từ 0 đến `len(certs) - 2`, so `certs[i][1]` (issuer) với `certs[i + 1][0]` (subject); lệch thì trả `False`."
- "Sau vòng lặp, trả `certs[-1][0] == certs[-1][1]` để kiểm tra root tự ký."
