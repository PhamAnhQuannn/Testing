id: check-x796-is-candidate-key
subtopic_id: cs.databases.relational_basics
secondary_subtopics: []
kind: check
title: 'Check X796: candidate key'
title_vi: 'Kiểm tra X796: cột có là candidate key không'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `is_candidate_key(rows, cols)`. `rows` is a list of dicts that all share the same keys (values are
  integers, strings or `None`); `cols` is a list of column names. Return `True` iff `cols` is a valid key:
  (a) every row has a non-`None` value for every column in `cols`, and (b) the tuple of those values is unique
  across all rows. Empty `rows` gives `True`.
  For `rows = [{"id": 1, "g": "a"}, {"id": 2, "g": "a"}, {"id": 1, "g": "b"}]`, `cols = ["id"]` gives `False`
  (id 1 repeats) and `cols = ["id", "g"]` gives `True`.
statement_vi_md: |
  Cài `is_candidate_key(rows, cols)`. `rows` là list các dict cùng tập khoá (giá trị là số nguyên, chuỗi hoặc
  `None`), `cols` là list tên cột. Trả về `True` khi `cols` là khoá hợp lệ: (a) mọi dòng có giá trị khác `None`
  ở mọi cột trong `cols`, và (b) bộ giá trị của các cột đó không lặp giữa hai dòng bất kỳ. `rows` rỗng cho `True`.
  Với `rows = [{"id": 1, "g": "a"}, {"id": 2, "g": "a"}, {"id": 1, "g": "b"}]`, `cols = ["id"]` cho `False`
  (id 1 lặp) và `cols = ["id", "g"]` cho `True`.
constraints:
- 'rows có thể rỗng (khi đó kết quả là True)'
- 'Giá trị là số nguyên, chuỗi hoặc None; cols không rỗng và là khoá có trong mọi dòng'
- 'Chỉ dùng thư viện chuẩn của Python'
examples:
- input: 'rows = [{"id": 1, "g": "a"}, {"id": 2, "g": "a"}, {"id": 1, "g": "b"}], cols = ["id"]'
  output: 'false'
  explain_vi: 'id 1 xuất hiện hai lần nên bộ giá trị không duy nhất.'
io:
  mode: function
  entry: is_candidate_key
  params:
  - name: rows
    type: list
  - name: cols
    type: list
  returns: bool
  compare: exact
starter:
