hints:
- "Kiểm tra theo thứ tự ưu tiên: `\"no-store\" in resp_headers` trước, rồi `\"no-cache\"`."
- "Với max-age, cần cả `\"max-age\" in resp_headers` và `\"age\" in req_headers` trước khi gọi `int(...)`."
- "Fresh khi `int(req_headers[\"age\"]) < int(resp_headers[\"max-age\"])` (nghiêm ngặt); mọi trường hợp còn lại trả `\"network\"`."
solution:
