statement_en_md: |
  Given a string `s`, return the length of the longest palindromic subsequence of `s`. A subsequence keeps
  the relative order of characters but may skip some; a palindrome reads the same forwards and backwards.
  Interval DP over `dp[i][j]` (the answer for `s[i..j]`) solves it in O(n^2).
statement_vi_md: |
  Viết `longest_palindrome_subseq(s)`: trả về độ dài của subsequence đối xứng (palindrome) dài nhất của
  chuỗi `s`. Subsequence giữ nguyên thứ tự ký tự nhưng được bỏ qua một số ký tự. Gợi ý: interval DP,
  `dp[i][j]` là đáp án cho đoạn `s[i..j]`.
constraints:
- 0 <= len(s) <= 1000
- s gồm chữ cái thường a-z
examples:
- input: s = 'bbbab'
  output: '4'
  explain_vi: Subsequence đối xứng dài nhất là "bbbb" (bỏ chữ a), độ dài 4.
