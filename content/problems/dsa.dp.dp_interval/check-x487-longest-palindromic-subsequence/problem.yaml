time_target_min: 8
hints:
- Đặt dp[i][j] là độ dài palindromic subsequence dài nhất trong đoạn s[i..j]; đoạn một ký tự có dp[i][i] = 1.
- "Nếu s[i] == s[j] thì hai ký tự này ôm hai đầu của palindrome: dp[i][j] = dp[i+1][j-1] + 2. Nếu khác nhau thì bỏ một đầu: dp[i][j] = max(dp[i+1][j], dp[i][j-1])."
- "Duyệt i từ n-1 xuống 0 và j từ i+1 lên n-1 để dp[i+1][*] và dp[i][j-1] luôn đã có. Đáp án là dp[0][n-1]; chuỗi rỗng trả 0."
