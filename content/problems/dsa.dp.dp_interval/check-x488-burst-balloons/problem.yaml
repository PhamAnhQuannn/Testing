id: check-x488-burst-balloons
subtopic_id: dsa.dp.dp_interval
secondary_subtopics: []
kind: check
title: 'Check X488: max_coins'
title_vi: 'Kiểm tra X488: max_coins'
difficulty: easy
source:
  type: leetcode
  lc: 312
  rewrite_required: true
statement_en_md: |
  You are given balloons with values `nums`. Bursting balloon `i` earns `nums[left] * nums[i] * nums[right]`
  coins, where `left` and `right` are the neighbours still unburst; a neighbour outside the array counts as
  1. Burst all balloons in the best order and return the maximum coins. Interval DP choosing the LAST balloon
  to burst in each range solves it in O(n^3).
statement_vi_md: |
  Viết `max_coins(nums)`: có các quả bóng với giá trị `nums`. Nổ quả `i` được `nums[left] * nums[i] * nums[right]`
  xu, với `left`, `right` là hai bóng kề còn lại; ngoài mảng coi là 1. Chọn thứ tự nổ để tổng xu lớn nhất và
  trả về giá trị đó. Gợi ý: interval DP, xét quả bóng nổ CUỐI CÙNG trong mỗi khoảng, O(n^3).
constraints:
- 0 <= len(nums) <= 300
- 0 <= nums[i] <= 100
examples:
- input: nums = [3, 1, 5, 8]
  output: '167'
  explain_vi: Nổ 1, 5, 3, 8 theo thứ tự cho 3*1*5 + 3*5*8 + 1*3*8 + 1*8*1 = 15 + 120 + 24 + 8 = 167.
