hints:
- "Nghĩ ngược lại: thay vì quả nổ đầu tiên, hãy chọn quả nổ CUỐI CÙNG trong một khoảng; khi đó hai bên của nó độc lập nhau."
- "Thêm 1 vào hai đầu mảng thành a. Đặt dp[l][r] là xu tối đa khi nổ hết các bóng nằm giữa l và r (không tính l, r). Với k nổ cuối trong (l, r): dp[l][r] = max(dp[l][k] + a[l]*a[k]*a[r] + dp[k][r])."
- "Duyệt độ dài khoảng length từ 2 tới n-1 (n = len(a)), l từ 0, r = l + length, k từ l+1 tới r-1. Đáp án là dp[0][n-1]; mảng rỗng cho 0."
