difficulty: easy
source:
  type: original
statement_en_md: 'Implement `top_k_frequent(words, k)`. Return the `k` most frequent words in `words`,
  ordered by count descending; words with equal counts are ordered alphabetically (ascending). If there
  are fewer than `k` distinct words, return all of them.

  '
statement_vi_md: 'Viết `top_k_frequent(words, k)`. Trả về `k` từ xuất hiện nhiều nhất trong `words`, sắp
  theo số lần giảm dần; các từ cùng số lần xếp theo thứ tự chữ cái tăng dần. Nếu có ít hơn `k` từ phân
  biệt thì trả về tất cả.

  '
constraints:
- 0 <= len(words) <= 10^4
- 0 <= k <= 10^4
examples:
- input: words = ["a","b","a","c","b","a"], k = 2
  output: '["a", "b"]'
  explain_vi: a xuất hiện 3 lần, b 2 lần, c 1 lần.
