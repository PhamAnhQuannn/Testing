hints:
- Dùng `collections.Counter(words)` để đếm tần suất mỗi từ.
- 'Sắp `counter.items()` bằng khoá `lambda kv: (-kv[1], kv[0])` để xử lý đồng hạng theo thứ tự chữ cái.'
- 'Lấy `k` từ đầu: `[w for w, _ in sorted(...)][:k]`.'
