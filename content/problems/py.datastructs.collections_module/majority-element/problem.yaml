id: majority-element
subtopic_id: py.datastructs.collections_module
secondary_subtopics: []
kind: practice
title: "Majority Element"
title_vi: "Phần tử chiếm đa số"
difficulty: easy
source: {type: leetcode, lc: 169, rewrite_required: true}
statement_en_md: |
  Given a list `nums` of size `n`, return the majority element. The majority element is the
  element that appears more than `n // 2` times. You may assume that the majority element always
  exists in the list.
statement_vi_md: |
  Cho list `nums` có `n` phần tử. Trả về phần tử **chiếm đa số**, tức phần tử xuất hiện nhiều hơn
  `n // 2` lần. Đề bảo đảm phần tử chiếm đa số luôn tồn tại.
constraints:
  - "1 <= len(nums) <= 5 * 10^4"
  - "-10^9 <= nums[i] <= 10^9"
  - "Luôn có một phần tử xuất hiện nhiều hơn len(nums) // 2 lần"
examples:
  - {input: "nums = [3, 2, 3]", output: "3", explain_vi: "Số 3 xuất hiện 2 lần, lớn hơn 3 // 2 = 1."}
  - {input: "nums = [2, 2, 1, 1, 1, 2, 2]", output: "2", explain_vi: "Số 2 xuất hiện 4 lần, lớn hơn 7 // 2 = 3."}
