hints:
  - "Cần biết mỗi giá trị xuất hiện bao nhiêu lần. Module `collections` có công cụ đếm sẵn."
  - "`Counter(nums)` đếm mọi giá trị trong một lượt; `.most_common(1)` trả list gồm một cặp `(giá_trị, số_lần)` của giá trị xuất hiện nhiều nhất."
  - "`Counter(nums).most_common(1)[0][0]` lấy cặp đầu rồi lấy giá trị trong cặp. Vì phần tử đa số luôn tồn tại, giá trị phổ biến nhất chính là nó."
