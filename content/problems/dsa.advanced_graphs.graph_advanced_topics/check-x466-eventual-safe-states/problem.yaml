title: 'Check X466: eventual_safe_nodes'
title_vi: 'Kiểm tra X466: eventual_safe_nodes'
difficulty: easy
source:
  type: leetcode
  lc: 802
  rewrite_required: true
statement_en_md: |
  A directed graph has `n` nodes `0..n-1`; `graph[i]` lists the nodes that `i` points to. A node is a
  terminal node if it has no outgoing edge. A node is safe if every path starting from it ends at a
  terminal node (in particular no path from it can run forever in a cycle). Return the sorted list of
  all safe nodes. Hint: reverse the edges and run Kahn's topological sort from the terminal nodes,
  iteratively (no recursion).
statement_vi_md: |
  Viết `eventual_safe_nodes(graph)`: đồ thị có hướng gồm `n` node `0..n-1`, `graph[i]` là danh sách các
  node mà `i` trỏ tới. Node **terminal** là node không có cạnh ra. Node **safe** là node mà mọi đường đi
  xuất phát từ nó đều kết thúc ở một terminal (không đường nào đi vòng mãi trong chu trình). Trả về danh
  sách **đã sắp xếp tăng dần** của mọi node safe. Gợi ý: đảo chiều cạnh rồi chạy Kahn từ các terminal,
  dùng vòng lặp (không đệ quy).
constraints:
- 1 <= n <= 10^4
- 0 <= graph[i][j] < n
- graph[i] has no duplicate nodes
examples:
- input: graph = [[1, 2], [2, 3], [5], [0], [5], [], []]
  output: '[2, 4, 5, 6]'
  explain_vi: Node 5 và 6 là terminal. Node 2 và 4 chỉ dẫn tới 5 nên safe. Node 0, 1, 3 nằm trên chu trình 0 -> 1 -> 3 -> 0 nên không safe.
- input: graph = [[], [0], [1]]
  output: '[0, 1, 2]'
  explain_vi: Đồ thị là một đường 2 -> 1 -> 0 kết thúc ở terminal 0, nên mọi node đều safe.
