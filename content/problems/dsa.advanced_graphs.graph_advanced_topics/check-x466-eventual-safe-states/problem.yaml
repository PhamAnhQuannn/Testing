hints:
- Node safe là node không thể chạm tới chu trình. Terminal (không cạnh ra) chắc chắn safe.
- Đảo chiều mọi cạnh để biết "ai trỏ tới v". Giữ outdeg[u] = số cạnh ra của u trong đồ thị gốc.
- Bắt đầu hàng đợi/stack với các node outdeg == 0. Khi lấy v ra, đánh dấu safe và giảm outdeg của mọi u trỏ tới v; nếu về 0 thì đẩy u vào. Cuối cùng trả các node safe theo thứ tự tăng dần.
