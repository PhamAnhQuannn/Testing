statement_en_md: |
  An undirected graph has `n` nodes `0..n-1` and edges `connections`, each `[u, v]`. A critical
  connection (bridge) is an edge whose removal increases the number of connected components. Return all
  bridges as a sorted list: each edge written as `[min(u, v), max(u, v)]` and the outer list sorted
  ascending. Use Tarjan's low-link algorithm with an explicit stack instead of recursion (inputs can be
  long chains). The graph may be disconnected.
statement_vi_md: |
  Viết `critical_connections(n, connections)`: đồ thị vô hướng có `n` node `0..n-1`, `connections` là
  các cạnh `[u, v]`. **Critical connection** (cầu / bridge) là cạnh mà nếu xóa đi thì số thành phần liên
  thông tăng lên. Trả về mọi cầu, mỗi cạnh viết dạng `[min(u, v), max(u, v)]`, danh sách ngoài sắp xếp
  tăng dần. Dùng thuật toán Tarjan (disc/low) với stack tường minh thay vì đệ quy vì đồ thị có thể là
  chuỗi dài. Đồ thị có thể không liên thông.
constraints:
- 1 <= n <= 10^4
- 0 <= u, v < n and u != v
- No duplicate edges
examples:
- input: n = 4, connections = [[0, 1], [1, 2], [2, 0], [1, 3]]
  output: '[[1, 3]]'
  explain_vi: Tam giác 0-1-2 không có cầu vì xóa một cạnh vẫn đi vòng được. Cạnh 1-3 là đường duy nhất tới node 3 nên là cầu.
- input: n = 3, connections = [[0, 1], [1, 2], [2, 0]]
  output: '[]'
  explain_vi: Một chu trình thì không có cầu.
