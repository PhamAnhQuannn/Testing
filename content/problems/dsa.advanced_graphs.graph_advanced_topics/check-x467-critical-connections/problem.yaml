hints:
- Cầu là cạnh không nằm trên chu trình nào. Gán disc[v] (thứ tự thăm) và low[v] (disc nhỏ nhất với tới được từ cây con của v qua tối đa một cạnh ngược).
- Dùng stack tường minh lưu (node, cạnh cha, vị trí hàng xóm kế tiếp) thay vì đệ quy. Bỏ qua đúng cạnh cha theo chỉ số cạnh, không theo node.
- Khi một node xong và pop khỏi stack, cập nhật low[cha] = min(low[cha], low[con]); nếu low[con] > disc[cha] thì cạnh (cha, con) là cầu. Cuối cùng chuẩn hóa mỗi cạnh thành [min, max] và sắp xếp.
