hints:
- "Viết hàm phụ đổi dotted quad sang số: `n = n * 256 + int(octet)` cho từng octet."
- "Dòng `net/len` khớp khi `len == 0` hoặc `(x >> (32 - len)) == (net >> (32 - len))`; duyệt table và nhớ `best` (len lớn nhất) cùng `hop`."
- "Khởi tạo `best = -1`, `hop = None` và chỉ cập nhật khi `len > best` (so sánh chặt) để hòa thì dòng đầu thắng; default /0 vẫn được nhận."
solution:
