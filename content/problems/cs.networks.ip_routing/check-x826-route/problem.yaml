  approach_vi: Đổi ip và từng network sang số 32 bit, kiểm tra khớp bằng dịch bit, giữ dòng khớp có len lớn nhất (cập nhật khi len > best nên hòa thì dòng đầu thắng).
  complexity: "O(k) / O(1)"
