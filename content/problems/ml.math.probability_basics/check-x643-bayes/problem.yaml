id: check-x643-bayes
subtopic_id: ml.math.probability_basics
secondary_subtopics: []
kind: check
title: 'Check X643: Bayes posterior'
title_vi: 'Kiểm tra X643: xác suất hậu nghiệm Bayes'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `bayes(prior, tpr, fpr)`: the posterior probability of disease given a positive test.
  `prior = P(disease)`, `tpr = P(positive | disease)`, `fpr = P(positive | healthy)`, all floats in `[0, 1]`.
  By Bayes with the law of total probability:
  `posterior = (tpr * prior) / (tpr * prior + fpr * (1 - prior))`.
  Return the posterior as a float `round(posterior, 6)`. If the denominator `tpr * prior + fpr * (1 - prior)`
  is `0`, return `0.0`.
statement_vi_md: |
  Cài `bayes(prior, tpr, fpr)`: xác suất bệnh khi biết xét nghiệm dương tính. `prior = P(bệnh)`,
  `tpr = P(dương | bệnh)`, `fpr = P(dương | khoẻ)`, đều là float trong `[0, 1]`. Theo Bayes và xác suất toàn phần:
  `posterior = (tpr * prior) / (tpr * prior + fpr * (1 - prior))`. Trả `posterior` dạng float `round(posterior, 6)`.
  Nếu mẫu số `tpr * prior + fpr * (1 - prior)` bằng `0` thì trả `0.0`.
constraints:
- 0 <= prior, tpr, fpr <= 1
examples:
- input: prior = 0.01, tpr = 0.99, fpr = 0.05
  output: '0.166667'
  explain_vi: Bệnh hiếm (1%) nên phần lớn kết quả dương là báo nhầm; posterior chỉ khoảng 1/6.
