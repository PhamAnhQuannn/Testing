        pass
time_target_min: 6
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
hints:
- "Giữ một set các page đang nằm trong frame để kiểm tra hit trong O(1)."
- "Giữ thêm một hàng đợi (deque) theo thứ tự page vào; khi fault mà đã đầy, popleft để lấy victim."
- "Hit thì không đổi gì (FIFO không cập nhật thứ tự khi hit); chỉ cộng 1 vào bộ đếm khi fault."
solution:
