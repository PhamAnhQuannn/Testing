hints:
- ECE là trung bình có trọng số (theo số mẫu mỗi nhóm) của độ lệch |acc − conf|.
- "Tính N = sum(b[0] for b in bins) trước, rồi cộng (n / N) * abs(acc - conf)."
- "Kiểm tra N == 0 trước để trả 0.0; chỉ round ở kết quả cuối."
