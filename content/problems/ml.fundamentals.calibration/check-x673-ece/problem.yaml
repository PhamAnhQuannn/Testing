id: check-x673-ece
subtopic_id: ml.fundamentals.calibration
secondary_subtopics: []
kind: check
title: 'Check X673: expected calibration error'
title_vi: 'Kiểm tra X673: expected calibration error'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `ece(bins)`: expected calibration error. `bins` is a list of `[n, conf, acc]` triples where
  `n` is the number of samples in the bin (int), `conf` is the mean predicted probability and `acc` is the
  true positive rate of the bin. With `N = sum(n)`, return `sum((n / N) * abs(acc - conf))` as a float
  `round(result, 6)`. If `N == 0` (including an empty list), return `0.0`.
statement_vi_md: |
  Cài `ece(bins)`: expected calibration error. `bins` là danh sách các bộ ba `[n, conf, acc]`: `n` là số mẫu
  trong nhóm (int), `conf` là xác suất dự đoán trung bình, `acc` là tỉ lệ dương thật của nhóm. Với
  `N = sum(n)`, trả `sum((n / N) * abs(acc - conf))` dạng float `round(kết quả, 6)`. Nếu `N == 0` (kể cả danh
  sách rỗng) trả `0.0`.
constraints:
- 0 <= len(bins) <= 100
- 0 <= n, 0 <= conf <= 1, 0 <= acc <= 1
examples:
- input: bins = [[100, 0.2, 0.1], [200, 0.5, 0.4], [100, 0.8, 0.6]]
  output: '0.125'
  explain_vi: N = 400; 0,25·0,1 + 0,5·0,1 + 0,25·0,2 = 0,125.
