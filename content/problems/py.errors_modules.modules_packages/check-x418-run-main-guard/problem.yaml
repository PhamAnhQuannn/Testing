kind: check
title: 'Check X418: run_both'
title_vi: 'Kiểm tra X418: run_both'
difficulty: easy
source:
  type: original
statement_en_md: Implement `run_both(code)` as described in the Vietnamese statement (mastery check item
  X418, 5-minute time box). Execute the source string twice in fresh namespaces, once with `__name__ == "__main__"`
  and once with `__name__ == "mymod"`, and return both `log` lists.
statement_vi_md: Viết `run_both(code)`. Thực thi chuỗi mã `code` hai lần, mỗi lần trong một dict namespace mới có
  sẵn list `log` mới (mã có thể gọi `log.append(...)`). Lần 1 đặt `__name__ = "__main__"`, lần 2 đặt `__name__ = "mymod"`.
  Trả `[log_lan_1, log_lan_2]`.
constraints: []
examples:
- input: code = "if __name__ == '__main__':\n    log.append('run')"
  output: '[["run"], []]'
  explain_vi: Lần 1 `__name__` là "__main__" nên nhánh if chạy và ghi 'run'; lần 2 `__name__` là "mymod" nên bỏ qua.
io:
  mode: function
  entry: run_both
  params:
  - name: code
    type: str
  returns: list[list[str]]
  compare: exact
starter:
  python: "def run_both(code):\n    # TODO\n    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 5
hints:
- Cần chạy `exec` hai lần, mỗi lần với một dict globals mới.
- Mỗi lần tạo `log = []` mới và đưa vào dict cùng với `"__name__"`.
- 'Lặp qua `("__main__", "mymod")`, dùng `exec` với dict globals mới chứa `__name__` và `log`, rồi gom `log`.'
solution:
  file: solution.py
  approach_vi: Exec cùng một đoạn mã trong hai namespace mới với __name__ khác nhau.
  complexity: O(len(code))
