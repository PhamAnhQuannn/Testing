id: check-x419-resolve-relative
subtopic_id: py.errors_modules.modules_packages
secondary_subtopics: []
kind: check
title: 'Check X419: resolve_relative'
title_vi: 'Kiểm tra X419: resolve_relative'
difficulty: easy
source:
  type: original
statement_en_md: Implement `resolve_relative(package, level, name)` as described in the Vietnamese statement (mastery
  check item X419, 10-minute time box). Return the absolute module name for a relative import with `level` leading dots
  written inside package `package`, or "error" if it goes above the top-level package.
statement_vi_md: Viết `resolve_relative(package, level, name)`. Trả tên module tuyệt đối của câu lệnh
  `from <level dấu chấm><name> import ...` viết trong module thuộc package `package`. `level = 0` là absolute import (trả `name`);
  `level = 1` là package hiện tại, `level = 2` là package cha, v.v. `name` có thể rỗng. Nếu `level` lớn hơn số thành phần của
  `package` thì trả `"error"`.
constraints: []
examples:
- input: package = "app.sub", level = 2, name = "utils"
  output: '"app.utils"'
  explain_vi: Hai dấu chấm đi lên một cấp từ app.sub về app, rồi nối utils.
io:
  mode: function
  entry: resolve_relative
  params:
  - name: package
    type: str
  - name: level
    type: int
  - name: name
    type: str
  returns: str
  compare: exact
starter:
  python: "def resolve_relative(package, level, name):\n    # TODO\n    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 10
hints:
- Tách `package` theo dấu chấm; `level = 1` giữ nguyên toàn bộ, mỗi dấu chấm thêm bỏ một thành phần cuối.
- Xử lý riêng `level = 0` và trường hợp `level` lớn hơn số thành phần (trả "error").
- Sau khi cắt, nối `base + "." + name` nếu `name` không rỗng, ngược lại chỉ trả `base`.
solution:
  file: solution.py
  approach_vi: Cắt level-1 thành phần cuối của package rồi nối name.
  complexity: O(len(package))
tests:
  sample: tests/sample.jsonl
  hidden: tests/hidden.jsonl
  generator: tests/gen.py
tags:
- check
- x419
status: validated
version: 1
