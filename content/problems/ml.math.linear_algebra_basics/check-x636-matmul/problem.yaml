id: check-x636-matmul
subtopic_id: ml.math.linear_algebra_basics
secondary_subtopics: []
kind: check
title: 'Check X636: matrix multiplication'
title_vi: 'Kiểm tra X636: nhân ma trận'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `matmul(A, B)` that multiplies two matrices given as lists of lists of numbers. If `A` is
  `m x n` and `B` is `n x p`, the result `C` is `m x p` with `C[i][j] = sum over k of A[i][k] * B[k][j]`.
  If the shapes are incompatible (number of columns of `A` != number of rows of `B`), return `[]`.
  Use exact arithmetic: integer inputs give integer outputs. Inputs are non-empty rectangular matrices.
statement_vi_md: |
  Cài `matmul(A, B)` nhân hai ma trận (list các list số). Nếu `A` shape `m x n` và `B` shape `n x p` thì
  kết quả `C` có shape `m x p` với `C[i][j] = tổng theo k của A[i][k] * B[k][j]`. Nếu shape không hợp lệ
  (số cột của `A` khác số hàng của `B`) thì trả `[]`. Dùng phép tính chính xác: đầu vào số nguyên cho
  kết quả số nguyên. Đầu vào là ma trận chữ nhật không rỗng.
constraints:
- 1 <= rows, cols <= 50
- entries are integers
examples:
- input: A = [[1, 2, 3], [4, 5, 6]], B = [[1, 0], [0, 1], [1, 1]]
  output: '[[4, 5], [10, 11]]'
  explain_vi: A là 2x3, B là 3x2 nên C là 2x2; C[0][0] = 1*1 + 2*0 + 3*1 = 4.
