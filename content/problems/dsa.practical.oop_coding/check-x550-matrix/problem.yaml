id: check-x550-matrix
subtopic_id: dsa.practical.oop_coding
secondary_subtopics: []
kind: check
title: 'Check X550: Matrix'
title_vi: 'Kiểm tra X550: Ma trận'
difficulty: easy
source:
  type: original
statement_en_md: |
  Implement `class Matrix(rows, cols)`, initially all zeros, with:

  - `set(r, c, v)`: set cell `(r, c)` to the int `v`.
  - `get(r, c)`: return the int at `(r, c)`.
  - `transpose()`: transpose in place; dimensions swap and the value at `(r, c)` moves to `(c, r)`.
  - `dims()`: return `[rows, cols]` as a list.
statement_vi_md: |
  Viết `class Matrix(rows, cols)`, ban đầu toàn số 0, với:

  - `set(r, c, v)`: gán ô `(r, c)` bằng int `v`.
  - `get(r, c)`: trả int tại `(r, c)`.
  - `transpose()`: chuyển vị tại chỗ; hai chiều hoán đổi và giá trị ở `(r, c)` chuyển sang `(c, r)`.
  - `dims()`: trả list `[rows, cols]`.
constraints:
- 'Các chỉ số r, c luôn nằm trong kích thước hiện tại của ma trận.'
- 'Giá trị v là số nguyên.'
examples:
- input: ops = ['Matrix', 'set', 'transpose', 'dims', 'get'], args = [[2, 3], [0, 2, 7], [], [], [2, 0]]
  output: '[null, null, null, [3, 2], 7]'
  explain_vi: 'Ma trận 2x3, đặt (0,2)=7, chuyển vị thành 3x2 và giá trị 7 nằm ở (2,0).'
io:
  mode: class_ops
  compare: exact
starter:
  python: "class Matrix:\n    # TODO\n    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 10
hints:
- Lưu số hàng, số cột và các ô đã gán (ví dụ dict từ (r, c) sang giá trị, ô vắng là 0).
- '`transpose` đổi chỗ rows và cols, đồng thời chuyển mỗi khoá (r, c) thành (c, r).'
- '`dims()` phải trả list `[rows, cols]` theo kích thước hiện tại, sau transpose thì đã hoán đổi.'
solution:
  file: solution.py
  approach_vi: Lưu rows, cols và dict (r, c) -> v; transpose hoán đổi rows/cols và dựng lại dict với khoá (c, r). set/get/dims O(1), transpose O(k) với k ô đã gán.
  complexity: set/get/dims O(1), transpose O(k)
tests:
  sample: tests/sample.jsonl
  hidden: tests/hidden.jsonl
  generator: tests/gen.py
tags:
- check
