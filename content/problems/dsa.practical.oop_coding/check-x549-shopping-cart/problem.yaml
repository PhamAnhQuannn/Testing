id: check-x549-shopping-cart
subtopic_id: dsa.practical.oop_coding
secondary_subtopics: []
kind: check
title: 'Check X549: Shopping Cart'
title_vi: 'Kiểm tra X549: Giỏ hàng'
difficulty: easy
source:
  type: original
statement_en_md: |
  Implement `class ShoppingCart` (constructor takes no arguments) with:

  - `add(item, price, qty)`: `price` and `qty` are ints; adding an item that is already in the cart increases its quantity.
  - `remove(item)`: removes the whole line of that item; ignored if the item is absent.
  - `total()`: returns an int, the sum of `price * qty` over all lines (0 for an empty cart).
statement_vi_md: |
  Viết `class ShoppingCart` (constructor không có tham số) với:

  - `add(item, price, qty)`: `price` và `qty` là int; thêm item đã có trong giỏ thì cộng dồn số lượng.
  - `remove(item)`: xoá hẳn dòng của item; bỏ qua nếu item không có.
  - `total()`: trả về int là tổng `price * qty` của mọi dòng (giỏ rỗng là 0).
constraints:
- 'item là chuỗi; price, qty là số nguyên không âm.'
- 'Mỗi item luôn được thêm với cùng một price.'
examples:
- input: ops = ['ShoppingCart', 'add', 'add', 'total', 'remove', 'total'], args = [[], ['pen', 3, 2], ['book', 10, 1], [], ['pen'], []]
  output: '[null, null, null, 16, null, 10]'
  explain_vi: 'Sau hai lần add: 3*2 + 10*1 = 16. Xoá pen còn book: 10.'
io:
  mode: class_ops
  compare: exact
starter:
  python: "class ShoppingCart:\n    # TODO\n    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 8
hints:
- Dùng một dict ánh xạ item sang giá và số lượng để cộng dồn khi thêm lại cùng item.
- 'Khi `add` item đã có, chỉ tăng qty; `remove` dùng `pop(item, None)` để bỏ qua item vắng mặt.'
- '`total()` duyệt mọi dòng cộng `price * qty`; giỏ rỗng cho 0 vì tổng rỗng là 0.'
solution:
  file: solution.py
  approach_vi: Lưu dict item -> [price, qty]; add cộng dồn qty, remove pop, total cộng price*qty. add/remove O(1), total O(n).
  complexity: add/remove O(1), total O(n)
tests:
