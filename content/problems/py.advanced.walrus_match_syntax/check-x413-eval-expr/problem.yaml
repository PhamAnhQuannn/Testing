id: check-x413-eval-expr
subtopic_id: py.advanced.walrus_match_syntax
secondary_subtopics: []
kind: check
title: 'Check X413: evaluate'
title_vi: 'Kiểm tra X413: evaluate'
difficulty: easy
source:
  type: original
statement_en_md: Implement `evaluate(expr)` as described in the Vietnamese statement (mastery check item
  X413, 12-minute time box).
statement_vi_md: 'Viết `evaluate(expr)` dùng `match`/`case` tính biểu thức lồng nhau. Số nguyên trả chính nó;
  `["add", *args]` là tổng (rỗng là 0); `["mul", *args]` là tích (rỗng là 1); `["neg", e]` là `-evaluate(e)`;
  `["if", c, a, b]` trả `evaluate(a)` nếu `evaluate(c) != 0`, ngược lại `evaluate(b)`; mọi thứ khác trả `0`.'
constraints: []
examples:
- input: expr = ["add", 1, ["mul", 2, 3]]
  output: '7'
  explain_vi: 2 * 3 = 6 rồi cộng 1 được 7.
io:
  mode: function
  entry: evaluate
  params:
  - name: expr
    type: any
  returns: int
  compare: exact
starter:
  python: "def evaluate(expr):\n    # TODO\n    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 12
hints:
- Dùng `match expr:` với `case int(n):` cho số và `case _:` trả 0 ở cuối.
- 'Sequence pattern: `case ["add", *args]:` rồi gọi đệ quy `evaluate` cho từng phần tử của `args`.'
- Đặt các case cụ thể (`["neg", e]`, `["if", c, a, b]`) trước `_`; sai số đối số sẽ không khớp và rơi vào `_`.
solution:
  file: solution.py
  approach_vi: match theo cấu trúc, đệ quy trên các biểu thức con, _ trả 0.
  complexity: O(size)
tests:
  sample: tests/sample.jsonl
  hidden: tests/hidden.jsonl
  generator: tests/gen.py
