hints:
- Giữ chỉ số `i` bắt đầu từ 0 và cắt `data[i:i + k]`; slice rỗng là falsy nên dừng vòng lặp.
- 'Viết `while (chunk := data[i:i + k]):`, thêm `sum(chunk)` vào kết quả rồi `i += k`.'
- Khi `data` rỗng, slice đầu tiên đã rỗng nên trả `[]`.
