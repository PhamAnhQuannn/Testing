hints:
- Gradient là trung bình của 2*(w*x - y)*x trên mọi cặp (x, y).
- "Mỗi vòng: grad = sum(2*(w*x - y)*x for x, y in zip(xs, ys)) / len(xs)."
- "Cập nhật w = w - lr * grad; chỉ round ở kết quả cuối; steps = 0 thì vòng lặp không chạy."
