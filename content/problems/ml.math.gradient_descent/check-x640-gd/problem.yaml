id: check-x640-gd
subtopic_id: ml.math.gradient_descent
secondary_subtopics: []
kind: check
title: 'Check X640: gradient descent'
title_vi: 'Kiểm tra X640: gradient descent'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `gradient_descent(xs, ys, w0, lr, steps)`: gradient descent for the model `y_hat = w * x` with
  MSE loss `mean((w*x - y)^2)`. Start with `w = w0`; repeat `steps` times
  `w = w - lr * mean(2 * (w*x - y) * x)` (mean over all pairs, using the current `w`). Return the final `w`
  as a float `round(w, 6)`. If `steps = 0`, return `w0` rounded. `xs` and `ys` have equal length (at least 1).
statement_vi_md: |
  Cài `gradient_descent(xs, ys, w0, lr, steps)`: gradient descent cho mô hình `ŷ = w·x` với loss MSE
  `mean((w*x - y)²)`. Bắt đầu `w = w0`; lặp `steps` lần `w = w - lr * mean(2 * (w*x - y) * x)` (trung bình trên
  mọi cặp, dùng `w` hiện tại). Trả `w` cuối dạng float `round(w, 6)`. Nếu `steps = 0` trả `w0` đã làm tròn.
  `xs`, `ys` cùng độ dài (ít nhất 1).
constraints:
- 1 <= len(xs) == len(ys) <= 100
- 0 <= steps <= 1000
examples:
- input: xs = [1, 2, 3], ys = [2, 4, 6], w0 = 0, lr = 0.05, steps = 20
  output: '1.999993'
  explain_vi: Dữ liệu y = 2x nên w tiến về 2.
