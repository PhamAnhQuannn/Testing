id: check-x001
subtopic_id: py.core.getting_started
secondary_subtopics: []
kind: check
title: "Check X001: pages_needed"
title_vi: "Kiểm tra X001: pages_needed"
difficulty: easy
source:
  type: original
statement_en_md: |
  Implement `pages_needed(items, per_page)`: the number of pages needed to show `items` items
  when each page holds `per_page` items. Use `import math`. A partly filled last page still
  counts, and 0 items need 0 pages.
statement_vi_md: |
  Viết `pages_needed(items, per_page)` trả về số trang cần để hiển thị `items` mục khi mỗi trang
  chứa tối đa `per_page` mục. Dùng `import math` (gợi ý: `math.ceil`). Trang cuối chưa đầy vẫn
  tính là một trang; 0 mục thì cần 0 trang.
constraints:
  - "0 <= items <= 10^6"
  - "1 <= per_page <= 1000"
examples:
  - {input: 'items = 25, per_page = 10', output: "3", explain_vi: "2 trang đầy (20 mục) cộng 1 trang cho 5 mục còn lại."}
io:
  mode: function
  entry: pages_needed
  params: [{name: items, type: int}, {name: per_page, type: int}]
  returns: int
  compare: exact
starter:
  python: |
