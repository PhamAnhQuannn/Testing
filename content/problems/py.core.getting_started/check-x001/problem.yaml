limits: {time_ms: 1000, memory_mb: 256, time_multiplier: {pyodide: 3}}
time_target_min: 5
hints:
  - "`25 / 10` là `2.5` nhưng cần 3 trang: phải làm tròn lên, không làm tròn xuống."
  - "`math.ceil(x)` làm tròn x lên số nguyên gần nhất; nhớ `import math` ở đầu file."
  - "Trả về `math.ceil(items / per_page)`."
solution:
