id: check-format-receipt
subtopic_id: py.core.getting_started
secondary_subtopics: []
kind: check
title: 'Check X311: format_receipt'
title_vi: 'Kiểm tra X311: format_receipt: in hóa đơn'
difficulty: easy
source:
  type: original
statement_en_md: 'Implement `format_receipt(items)` as in the Vietnamese statement: build a multi-line
  receipt string with a TOTAL line.'
statement_vi_md: 'Viết `format_receipt(items)`; mỗi phần tử là chuỗi `"tên,số_lượng,giá_xu"` (giá là số
  nguyên xu). Trả về một chuỗi nhiều dòng (nối bằng `"\n"`, không có `\n` ở cuối): mỗi mặt hàng một dòng
  dạng `"tên x<số_lượng> <thành_tiền>"` với thành tiền = số_lượng*giá hiển thị dạng đô la có đúng 2 chữ
  số thập phân (ví dụ 1250 xu -> `12.50`), sau cùng là dòng `"TOTAL <tổng>"`. Danh sách rỗng chỉ trả `"TOTAL
  0.00"`. Chỉ dùng số nguyên, không dùng float.'
constraints: []
examples:
- input: items = ["pen,2,150", "book,1,1250"]
  output: '"pen x2 3.00\nbook x1 12.50\nTOTAL 15.50"'
  explain_vi: Ví dụ đầu tiên của đề kiểm tra.
io:
  mode: function
  entry: format_receipt
  params:
  - name: items
    type: list[str]
  returns: str
  compare: exact
starter:
  python: "def format_receipt(items):\n    # TODO\n    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 12
hints:
- Đọc kỹ đề, liệt kê các trường hợp cần phân biệt và thứ tự ưu tiên của chúng trước khi viết code.
- Thử tay với ví dụ, ghi lại từng bước, rồi chuyển thành code; chia bài thành các bước nhỏ.
- Kiểm tra các trường hợp biên (rỗng, 0, âm, giá trị lặp) trước khi nộp.
solution:
  file: solution.py
  approach_vi: Tách từng dòng bằng split, tính bằng số nguyên, định dạng tiền bằng f-string với // và
    %.
  complexity: O(n)
tests:
  sample: tests/sample.jsonl
  hidden: tests/hidden.jsonl
  generator: tests/gen.py
tags:
- check
- x311
- formatting
