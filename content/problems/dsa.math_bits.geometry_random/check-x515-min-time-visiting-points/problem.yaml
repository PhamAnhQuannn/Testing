id: check-x515-min-time-visiting-points
subtopic_id: dsa.math_bits.geometry_random
secondary_subtopics: []
kind: check
title: 'Check X515: min_time_to_visit_all_points'
title_vi: 'Kiểm tra X515: min_time_to_visit_all_points'
difficulty: easy
source:
  type: leetcode
  lc: 1266
  rewrite_required: true
statement_en_md: |
  On a 2D plane there are `n` points `points[i] = [x, y]`. You must visit them in the given order. In one
  second you may move one unit horizontally, vertically, or diagonally (both coordinates change by 1).
  Return the minimum total time in seconds to visit all points in order. The time between two consecutive
  points is their Chebyshev distance, `max(|dx|, |dy|)`.
statement_vi_md: |
  Viết `min_time_to_visit_all_points(points)`: `points[i] = [x, y]` là các điểm trên mặt phẳng, phải thăm
  theo đúng thứ tự cho trước. Mỗi giây được đi 1 đơn vị theo chiều ngang, dọc hoặc chéo (cả hai tọa độ
  đổi 1). Trả về tổng thời gian (giây) nhỏ nhất để thăm hết các điểm. Thời gian giữa hai điểm liên tiếp
  chính là khoảng cách Chebyshev `max(|dx|, |dy|)`.
constraints:
- 1 <= n <= 100
- -1000 <= x, y <= 1000
examples:
- input: points = [[1, 1], [3, 4], [-1, 0]]
  output: '7'
  explain_vi: Từ (1,1) đến (3,4) mất max(2,3)=3 giây; từ (3,4) đến (-1,0) mất max(4,4)=4 giây; tổng 7.
io:
  mode: function
  entry: min_time_to_visit_all_points
  params:
  - name: points
    type: list[list[int]]
  returns: int
  compare: exact
starter:
  python: |
    def min_time_to_visit_all_points(points):
        # TODO: cộng khoảng cách Chebyshev giữa mỗi cặp điểm liên tiếp
        total = 0
        for i in range(1, len(points)):
            total += abs(points[i][0] - points[i - 1][0]) + abs(points[i][1] - points[i - 1][1])
        return total
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 8
hints:
- Thứ tự thăm đã cố định, nên chỉ cần tính thời gian giữa từng cặp điểm liên tiếp rồi cộng lại.
- Một bước chéo đổi cả x và y cùng lúc, nên có thể "ăn" dx và dy song song. Thời gian giữa hai điểm không phải |dx| + |dy|.
- "Với dx = |x2 - x1| và dy = |y2 - y1|, đi chéo min(dx, dy) bước rồi đi thẳng phần còn lại, tổng là max(dx, dy). Cộng max(dx, dy) cho mọi cặp liên tiếp."
solution:
  file: solution.py
  approach_vi: Thời gian giữa hai điểm là khoảng cách Chebyshev max(|dx|, |dy|); cộng dồn qua các cặp liên tiếp.
  complexity: O(n) / O(1)
