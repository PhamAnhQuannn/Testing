id: check-x716-causal-mask
subtopic_id: ml.nlp_transformers.transformer_variants
secondary_subtopics: []
kind: check
title: 'Check X716: causal mask'
title_vi: 'Kiểm tra X716: causal mask'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `causal_mask(n)` that builds the causal attention mask of a decoder for a sequence of length `n`.
  Return a list of `n` rows, each a list of `n` ints, where entry `[i][j]` is `1` if `j <= i` (position `i`
  may attend to position `j`) and `0` otherwise. For `n = 3` the result is `[[1, 0, 0], [1, 1, 0], [1, 1, 1]]`.
statement_vi_md: |
  Cài `causal_mask(n)` tạo causal attention mask của decoder cho chuỗi dài `n`. Trả về list `n` hàng, mỗi hàng là list
  `n` số nguyên, phần tử `[i][j]` là `1` nếu `j <= i` (vị trí `i` được nhìn vị trí `j`), ngược lại `0`.
  Với `n = 3` kết quả là `[[1, 0, 0], [1, 1, 0], [1, 1, 1]]`.
constraints:
- '1 <= n <= 100'
examples:
- input: 'n = 3'
  output: '[[1, 0, 0], [1, 1, 0], [1, 1, 1]]'
  explain_vi: 'Hàng i có 1 ở các cột 0..i (tam giác dưới gồm đường chéo), còn lại là 0.'
io:
  mode: function
  entry: causal_mask
  params:
  - name: n
    type: int
  returns: list
  compare: exact
