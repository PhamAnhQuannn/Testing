id: check-x610-elevator-scan
subtopic_id: lld.problems.elevator
secondary_subtopics: []
kind: check
title: 'Check X610: Elevator LOOK'
title_vi: 'Kiểm tra X610: Thang máy theo LOOK'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  A single elevator scheduled with LOOK. All results are returned (never raise).

  Implement `class Elevator` with:

  - `Elevator(start)`: the current floor is `start` (an int); the initial direction is up.
  - `request(floor)`: records `floor` as requested. Duplicates and the current floor are ignored. Returns nothing.
  - `step()`: moves to the next served floor and returns it (int). LOOK: serve the nearest requested floor in the current direction; if none remain in that direction, reverse and serve the nearest in the other direction. The served floor is removed from the pending set, and `current` and the direction are updated. If nothing is pending, returns the current floor unchanged.
  - `current()`: returns the current floor (int).
  - `pending()`: returns the sorted list of still-requested floors.

  Example: at floor 3 going up with requests 5, 1, 7: `step()` returns 5, then 7, then (nothing above, reverse) 1.
statement_vi_md: |
  Một thang máy được điều phối theo LOOK. Kết quả luôn được trả về (không ném lỗi).

  Viết `class Elevator` với:

  - `Elevator(start)`: tầng hiện tại là `start` (số nguyên); chiều ban đầu là đi lên.
  - `request(floor)`: ghi nhận tầng `floor` được gọi. Trùng lặp và tầng hiện tại bị bỏ qua. Không trả gì.
  - `step()`: chuyển đến tầng kế tiếp được phục vụ và trả tầng đó (int). LOOK: phục vụ tầng được gọi gần nhất theo chiều hiện tại; hết tầng theo chiều đó thì đảo chiều và phục vụ tầng gần nhất ở chiều ngược lại. Tầng đã phục vụ bị xoá khỏi tập chờ, cập nhật tầng hiện tại và chiều. Nếu không còn yêu cầu, trả tầng hiện tại, không đổi gì.
  - `current()`: trả tầng hiện tại (int).
  - `pending()`: trả list đã sắp xếp các tầng còn được gọi.

  Ví dụ: ở tầng 3 đi lên với yêu cầu 5, 1, 7: `step()` lần lượt trả 5, 7, rồi (hết tầng phía trên, đảo chiều) 1.
constraints:
- 'Tầng là số nguyên (có thể âm hoặc 0); không dùng thread, time hay random.'
- 'Chọn tầng kế từ danh sách đã sắp xếp, không dựa vào thứ tự duyệt set.'
examples:
- input: ops = ['Elevator', 'request', 'request', 'request', 'step', 'step', 'step'], args = [[3], [5], [1], [7], [], [], []]
  output: '[null, null, null, null, 5, 7, 1]'
  explain_vi: 'Đi lên từ tầng 3: phục vụ 5 rồi 7; hết tầng phía trên nên đảo chiều xuống tầng 1.'
io:
  mode: class_ops
  compare: exact
starter:
  python: "class Elevator:\n    # TODO\n    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 8
hints:
- 'Giữ set các tầng đang chờ, current và direction (+1 hoặc -1).'
- 'Trong step: sorted(pending), tách phần > current (lấy nhỏ nhất) và phần < current (lấy lớn nhất).'
- 'Nếu chiều hiện tại không còn tầng nào thì đảo chiều trước khi chọn.'
solution:
  file: solution.py
  approach_vi: Set tầng chờ; mỗi step sắp xếp rồi chọn tầng gần nhất theo chiều, đảo chiều khi cần.
  complexity: O(k log k) mỗi step
tests:
  sample: tests/sample.jsonl
  hidden: tests/hidden.jsonl
  generator: tests/gen.py
tags:
- check
- x610
