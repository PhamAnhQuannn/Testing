id: check-x513-mod-pow
subtopic_id: dsa.math_bits.number_theory
secondary_subtopics: []
kind: check
title: 'Check X513: mod_pow'
title_vi: 'Kiểm tra X513: mod_pow'
difficulty: easy
source:
  type: original
statement_en_md: |
  Return `(base ** exp) % mod`, computed by fast binary exponentiation in `O(log exp)` multiplications
  (do not build `base ** exp` directly: `exp` can be huge). `exp >= 0` and `mod >= 1`; if `mod == 1`
  the answer is `0`, and `mod_pow(b, 0, m)` is `1 % m`.
statement_vi_md: |
  Viết `mod_pow(base, exp, mod)`: trả về `(base ** exp) % mod` bằng lũy thừa nhanh (binary exponentiation),
  chỉ O(log exp) phép nhân, không tính trực tiếp `base ** exp` vì `exp` có thể rất lớn. `exp >= 0`,
  `mod >= 1`; nếu `mod == 1` trả `0`; `exp = 0` cho `1 % mod`. Gợi ý: duyệt từng bit của `exp`, bit 1 thì
  nhân vào kết quả, rồi bình phương `base`.
constraints:
- 0 <= base <= 10^9
- 0 <= exp <= 10^18
- 1 <= mod <= 10^9 + 7
examples:
- input: base = 2, exp = 10, mod = 1000
  output: '24'
  explain_vi: 2^10 = 1024 và 1024 mod 1000 = 24.
io:
  mode: function
  entry: mod_pow
  params:
  - name: base
    type: int
  - name: exp
    type: int
  - name: mod
    type: int
  returns: int
  compare: exact
starter:
  python: |
    def mod_pow(base, exp, mod):
        # TODO: lũy thừa nhanh; nhớ mod == 1 và exp == 0
        return 0
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 10
hints:
- Với exp = 13 = 0b1101 ta có base^13 = base^8 * base^4 * base^1. Chỉ cần các lũy thừa base^(2^k) ứng với bit 1.
- "Lặp trong khi exp > 0: nếu exp & 1 thì result = result * base % mod; sau đó base = base * base % mod và exp >>= 1."
- "Khởi tạo result = 1 % mod và base %= mod để mod == 1 cho 0 và exp = 0 cho 1 % mod."
solution:
  file: solution.py
  approach_vi: Binary exponentiation, mỗi bit của exp tốn một lần bình phương và tối đa một lần nhân, đều lấy mod.
  complexity: O(log exp) / O(1)
