hints:
- Lập mảng boolean `is_p` độ dài `n`, ban đầu đều True (0 và 1 là False). Đáp án là số phần tử True.
- Với `i` từ 2 tới `i * i < n`, nếu `is_p[i]` còn True thì đặt `is_p[j] = False` cho `j = i*i, i*i + i, ...` (dưới n).
- "Dùng `is_p[i*i::i] = bytearray(len(range(i*i, n, i)))` hoặc vòng for thường; trả `sum(is_p)`. Với `n < 3` trả 0 sớm."
