statement_en_md: |
  Given an integer `n`, return the number of prime numbers that are strictly less than `n`. The Sieve of
  Eratosthenes solves it in `O(n log log n)` time: mark the multiples of each prime starting from `i * i`.
statement_vi_md: |
  Viết `count_primes(n)`: trả về số số nguyên tố **nhỏ hơn hẳn** `n`. Với `n = 0, 1, 2` đáp án là `0`.
  Gợi ý: dùng Sieve of Eratosthenes, với mỗi số nguyên tố `i` đánh dấu hợp số các bội từ `i * i`.
constraints:
- 0 <= n <= 5 * 10^6
examples:
- input: n = 10
  output: '4'
  explain_vi: Các số nguyên tố nhỏ hơn 10 là 2, 3, 5, 7 nên đáp án là 4.
