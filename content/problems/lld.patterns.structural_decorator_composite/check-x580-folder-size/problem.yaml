id: check-x580-folder-size
subtopic_id: lld.patterns.structural_decorator_composite
secondary_subtopics: []
kind: check
title: 'Check X580: folder size'
title_vi: 'Kiểm tra X580: dung lượng thư mục'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `total_size(node)` using the Composite pattern. A node is either a file
  `["file", name, size]` (`size` is an int) or a folder `["folder", name, children]` (`children` is a
  list of nodes). Return the total size of all files under the node as an int. A file returns its own
  size; a folder returns the sum of its children; an empty folder returns 0. Treat file and folder
  uniformly: the folder just asks each child for its size.
statement_vi_md: |
  Cài `total_size(node)` theo mẫu Composite. Một node là file `["file", name, size]` (`size` là int)
  hoặc folder `["folder", name, children]` (`children` là list các node). Trả về tổng dung lượng mọi file
  dưới node đó (kiểu int). File trả đúng size của nó; folder trả tổng của các con; folder rỗng trả 0.
  Đối xử file và folder như nhau: folder chỉ việc hỏi từng con xem size là bao nhiêu.
constraints:
- tree depth <= 6, at most 50 nodes
- 0 <= size <= 100000
examples:
- input: node = ["folder", "root", [["file", "a", 10], ["folder", "sub", [["file", "b", 5]]]]]
  output: '15'
  explain_vi: root chứa file a (10) và folder sub (chứa file b = 5), tổng 15.
io:
  mode: function
  entry: total_size
  params:
  - name: node
    type: list
  returns: int
  compare: exact
starter:
  python: |
    def total_size(node):
        # TODO: file -> trả size; folder -> cộng total_size của từng con
        pass
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 8
hints:
- File là lá của cây, folder là nhánh; hai loại cùng trả lời câu hỏi "size là bao nhiêu".
- node[0] cho biết loại; với file thì size nằm ở node[2], với folder thì node[2] là list con.
- "Nếu là file trả node[2]; nếu là folder thì cộng total_size(child) cho mỗi child (folder rỗng cho 0)."
solution:
  file: solution.py
  approach_vi: Đệ quy composite, file trả size, folder cộng kết quả của các con.
  complexity: O(n) / O(depth)
