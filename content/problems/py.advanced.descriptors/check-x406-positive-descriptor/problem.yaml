statement_en_md: Implement `positive_demo(values)` as described in the Vietnamese statement (mastery
  check item X406, 5-minute time box).
statement_vi_md: Viết `positive_demo(values)`. Bên trong, định nghĩa descriptor `Positive` (`__set_name__`,
  `__get__`, `__set__`; `__set__` ném `ValueError` nếu `value <= 0`, ngược lại lưu vào `obj.__dict__`)
  và class `Item` có `price = Positive()`. Với mỗi `v` trong `values`, thử gán `item.price = v` trên
  cùng một instance, ghi `"ok"` hoặc `"err"`. Trả `[tên thuộc tính học qua __set_name__, danh sách
  kết quả, item.price cuối cùng]` (`None` nếu chưa gán được lần nào).
constraints: []
examples:
- input: values = [5, -1, 3]
  output: '["price", ["ok", "err", "ok"], 3]'
  explain_vi: 5 và 3 hợp lệ, -1 bị từ chối; giá trị cuối là 3 và tên thuộc tính là "price".
io:
  mode: function
  entry: positive_demo
  params:
  - name: values
    type: list[int]
  returns: list
  compare: exact
starter:
  python: "def positive_demo(values):\n    # TODO\n    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 5
hints:
- Định nghĩa `Positive` và `Item` bên trong hàm; `__set_name__` lưu `self.name = name`.
- '`__set__` ném `ValueError` nếu `value <= 0`, nếu không thì ghi `obj.__dict__[self.key] = value`.'
- 'Trong `__get__` dùng `obj.__dict__.get(self.key)` để trả `None` khi chưa gán; tên lấy từ `Item.__dict__["price"].name`.'
solution:
  file: solution.py
  approach_vi: Data descriptor kiểm tra giá trị, lưu trong __dict__ của instance; bắt ValueError để ghi kết quả.
  complexity: O(n)
