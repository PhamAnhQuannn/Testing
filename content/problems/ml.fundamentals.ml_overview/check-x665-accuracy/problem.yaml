statement_en_md: |
  Implement `accuracy(y_true, y_pred)`: the fraction of positions where the predicted label equals
  the true label. Both lists have equal length. Return the fraction as a float `round(value, 6)`.
  If the lists are empty, return `0.0`.
statement_vi_md: |
  Cài `accuracy(y_true, y_pred)`: tỉ lệ vị trí mà nhãn dự đoán bằng nhãn thật. Hai list cùng độ dài.
  Trả về float `round(value, 6)`. Nếu list rỗng thì trả `0.0`.
constraints:
- len(y_true) == len(y_pred)
examples:
- input: y_true = [1, 0, 1, 1], y_pred = [1, 1, 1, 0]
  output: '0.5'
  explain_vi: Đúng ở vị trí 0 và 2, tức 2 trên 4 mẫu nên accuracy = 0.5.
