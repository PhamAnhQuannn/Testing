id: check-x727-parse-ints
subtopic_id: py.core.io_input
secondary_subtopics: []
kind: check
title: 'Check X727: parse ints'
title_vi: 'Kiểm tra X727: tách số nguyên từ một dòng'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `parse_ints(line)`. The string `line` contains integers separated by arbitrary whitespace
  (the classic `input().split()` idiom). Return the list of those integers in order. An empty or
  whitespace-only string gives `[]`.
  For `"3 4 5"` the result is `[3, 4, 5]`.
statement_vi_md: |
  Cài `parse_ints(line)`. Chuỗi `line` chứa các số nguyên cách nhau bởi khoảng trắng tuỳ ý (kiểu `input().split()`).
  Trả về list các số nguyên đó theo thứ tự. Chuỗi rỗng hoặc chỉ có khoảng trắng cho `[]`.
  Với `"3 4 5"` kết quả là `[3, 4, 5]`.
constraints:
- 'Mỗi token là một số nguyên hợp lệ (có thể âm)'
- 'Khoảng trắng có thể là dấu cách, tab hoặc xuống dòng, và có thể thừa ở hai đầu'
examples:
- input: 'line = "3 4 5"'
  output: '[3, 4, 5]'
  explain_vi: 'split() tách thành "3", "4", "5" rồi đổi từng token sang int.'
io:
  mode: function
  entry: parse_ints
  params:
  - name: line
    type: str
  returns: list
  compare: exact
starter:
  python: |
    def parse_ints(line):
        # TODO: tách line theo khoảng trắng rồi đổi từng token sang int
        pass
time_target_min: 6
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
hints:
- Dùng line.split() không đối số để tách theo mọi chuỗi khoảng trắng.
- Đổi từng token sang int bằng list comprehension.
- "return [int(tok) for tok in line.split()]; chuỗi rỗng tự cho []."
solution:
  file: solution.py
  approach_vi: split() không đối số bỏ khoảng trắng thừa và tách token, rồi đổi từng token sang int.
  complexity: O(n) / O(n)
