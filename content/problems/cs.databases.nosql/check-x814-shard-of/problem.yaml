id: check-x814-shard-of
subtopic_id: cs.databases.nosql
secondary_subtopics: []
kind: check
title: 'Check X814: hash shard of keys'
title_vi: 'Kiểm tra X814: shard của từng key'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `shard_of(keys, n)`, a toy hash-sharding function. `keys` is a list of strings and `n >= 1` is the
  number of shards. For each key compute `h = sum(ord(c) for c in key)`; its shard index is `h % n`. Return the list
  of shard indices, one per key, in the same order (`[]` for no keys). Do not use Python's built-in `hash()`
  (it is not deterministic across runs).
  For `keys = ["a", "bb"]`, `n = 3`: "a" has h = 97 so 97 % 3 = 1; "bb" has h = 196 so 196 % 3 = 1; the result is
  `[1, 1]`.
statement_vi_md: |
  Cài `shard_of(keys, n)`, một hàm hash sharding đồ chơi. `keys` là list các chuỗi, `n >= 1` là số shard. Với mỗi
  key tính `h = sum(ord(c) for c in key)`, chỉ số shard là `h % n`. Trả về list chỉ số shard, mỗi key một số, đúng
  thứ tự (không có key thì trả `[]`). Không dùng `hash()` có sẵn của Python vì nó không ổn định giữa các lần chạy.
  Với `keys = ["a", "bb"]`, `n = 3`: "a" có h = 97 nên 97 % 3 = 1; "bb" có h = 196 nên 196 % 3 = 1; kết quả là
  `[1, 1]`.
constraints:
- 'keys là list chuỗi (có thể rỗng, có thể có chuỗi rỗng); n là số nguyên >= 1'
- 'h = sum(ord(c) for c in key); shard = h % n; chuỗi rỗng có h = 0 nên vào shard 0'
- 'Chỉ dùng thư viện chuẩn của Python'
examples:
- input: 'keys = ["a", "bb"], n = 3'
  output: '[1, 1]'
  explain_vi: '"a" = 97 và 97 % 3 = 1; "bb" = 98 + 98 = 196 và 196 % 3 = 1, nên cả hai vào shard 1.'
