kind: check
title: 'Check X725: unique in order'
title_vi: 'Kiểm tra X725: bỏ trùng giữ thứ tự'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Implement `unique_in_order(items)` that returns a list of the integers in `items` with duplicates removed,
  keeping the order of first occurrence. Use a `seen` set so each membership test is O(1) and the whole
  function runs in O(n).
  For `[3, 1, 3, 2, 1]` the result is `[3, 1, 2]`; for `[]` the result is `[]`.
statement_vi_md: |
  Cài `unique_in_order(items)` trả về list các số nguyên của `items` đã bỏ trùng, giữ thứ tự xuất hiện đầu tiên.
  Dùng set `seen` để mỗi lần kiểm tra là O(1), cả hàm chạy O(n). Với `[3, 1, 3, 2, 1]` kết quả là `[3, 1, 2]`;
  với `[]` kết quả là `[]`.
constraints:
- 'items là list số nguyên (có thể rỗng, có thể âm)'
- 'Trả về list mới, giữ thứ tự xuất hiện đầu tiên'
examples:
- input: 'items = [3, 1, 3, 2, 1]'
  output: '[3, 1, 2]'
  explain_vi: 'Giữ lần xuất hiện đầu của 3, 1, 2; các lần lặp sau bị bỏ.'
io:
  mode: function
