statement_vi_md: 'Cho ABC `Shape` có method trừu tượng `area()`. Viết `sorted_areas(specs)`: `specs` là
  list như `[["sq", 3], ["rect", 2, 5], ["tri", 4, 3]]` với `sq` (cạnh), `rect` (dài, rộng), `tri` (đáy,
  cao; diện tích là `đáy * cao // 2`). Định nghĩa các class con của `Shape` rồi trả list diện tích đã
  sắp xếp tăng dần. Ví dụ trên cho `[6, 9, 10]`.'
