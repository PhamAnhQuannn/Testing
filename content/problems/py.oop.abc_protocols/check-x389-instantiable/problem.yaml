id: check-x389-instantiable
subtopic_id: py.oop.abc_protocols
secondary_subtopics: []
kind: check
title: 'Check X389: instantiable'
title_vi: 'Kiểm tra X389: instantiable'
difficulty: easy
source:
  type: original
statement_en_md: Implement `instantiable(impls)` as described in the Vietnamese statement (mastery check
  item X389, 12-minute time box).
statement_vi_md: 'Cho ABC `Shape` có hai method trừu tượng `area` và `perimeter`. Viết `instantiable(impls)`:
  mỗi phần tử của `impls` là list tên method (trong `"area"`, `"perimeter"`) mà một class con của `Shape`
  có cài. Với mỗi phần tử, tạo động một class con cài đúng các method đó (ví dụ bằng `type(...)`), thử
  tạo object và trả list bool theo thứ tự: `True` nếu tạo được, `False` nếu gặp `TypeError`.'
constraints: []
examples:
- input: impls = [["area", "perimeter"], ["area"], []]
  output: '[true, false, false]'
  explain_vi: Chỉ class cài đủ cả hai method mới tạo được object.
io:
  mode: function
  entry: instantiable
  params:
  - name: impls
    type: list
  returns: list[bool]
  compare: exact
starter:
  python: "from abc import ABC, abstractmethod\n\n\nclass Shape(ABC):\n    @abstractmethod\n    def area(self):\n
    \       ...\n\n    @abstractmethod\n    def perimeter(self):\n        ...\n\n\ndef instantiable(impls):\n
    \   # TODO\n    pass\n"
limits:
  time_ms: 1000
  memory_mb: 256
  time_multiplier:
    pyodide: 3
time_target_min: 12
hints:
- Đọc kỹ đề và ví dụ, xác định rõ đầu vào và đầu ra của `instantiable` trước khi viết code.
- Thử tay với ví dụ đầu tiên, ghi lại từng bước, rồi chuyển các bước đó thành code.
- Kiểm tra các trường hợp biên (rỗng, một phần tử, giá trị lặp) trước khi nộp; nếu vẫn kẹt, xem lại bài
  học của mục này.
solution:
  file: solution.py
  approach_vi: Dựng class con bằng type() với các method được cài, thử tạo object và bắt TypeError.
  complexity: O(n)
tests:
  sample: tests/sample.jsonl
  hidden: tests/hidden.jsonl
  generator: tests/gen.py
tags:
