  - "Cho method `deposit`/`withdraw` raise `ValueError` khi không hợp lệ, rồi bắt ở chỗ gọi để đếm failed."
  - "Dùng dict `name -> Account` với `setdefault`; cuối cùng sắp theo name và đóng gói thành list thường để so sánh."
