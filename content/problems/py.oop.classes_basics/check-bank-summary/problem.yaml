id: check-bank-summary
subtopic_id: py.oop.classes_basics
secondary_subtopics: []
kind: check
title: "Check X333: bank_summary"
title_vi: "Kiểm tra X333: bank_summary"
difficulty: easy
source:
  type: original
statement_en_md: |
  Implement `bank_summary(ops)`. Each op is `[name, cmd, amount]` with `cmd` in `"deposit"` / `"withdraw"`.
  Accounts are created on first use with balance 0. A deposit needs `amount > 0`; a withdrawal needs
  `0 < amount <= balance`. Invalid operations change nothing and count as failed. Model the account with a
  class (state in `__init__`, methods, a read-only `balance` property). Return
  `[[name, balance, ok_count, failed_count], ...]` sorted by name.
statement_vi_md: |
  Viết `bank_summary(ops)`. Mỗi op là `[name, cmd, amount]` với `cmd` là `"deposit"` / `"withdraw"`.
  Tài khoản được tạo ở lần dùng đầu tiên với số dư 0. Nạp tiền cần `amount > 0`; rút tiền cần
  `0 < amount <= số dư`. Thao tác không hợp lệ không đổi gì và tính là thất bại. Hãy mô hình hoá tài khoản bằng một
  class (trạng thái trong `__init__`, các method, property `balance` chỉ đọc). Trả về
  `[[name, balance, ok_count, failed_count], ...]` sắp theo name.
constraints:
  - "0 <= len(ops) <= 30"
  - "-100 <= amount <= 1000"
examples:
  - {input: 'ops = [["a","deposit",100],["a","withdraw",30]]', output: '[["a", 70, 2, 0]]', explain_vi: "Cả hai thao tác hợp lệ."}
  - {input: 'ops = [["a","withdraw",10]]', output: '[["a", 0, 0, 1]]', explain_vi: "Rút quá số dư: thất bại."}
io:
  mode: function
  entry: bank_summary
  params: [{name: ops, type: "list[list]"}]
  returns: "list[list]"
  compare: exact
