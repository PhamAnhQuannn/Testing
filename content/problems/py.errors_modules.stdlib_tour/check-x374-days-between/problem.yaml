statement_en_md: |
  Implement `days_between(a, b)` where `a` and `b` are dates as `"YYYY-MM-DD"` strings. Return the
  number of days between them as a non-negative integer (the order of `a` and `b` does not matter).
  Use `datetime.strptime` and subtract the two dates.
statement_vi_md: |
  Viết `days_between(a, b)` với `a`, `b` là ngày dạng chuỗi `"YYYY-MM-DD"`. Trả về số ngày giữa hai
  ngày dưới dạng số nguyên không âm (thứ tự `a`, `b` không quan trọng). Dùng `datetime.strptime` rồi
  trừ hai ngày.
constraints:
  - "Both dates are valid, year in 1900..2100"
examples:
  - input: 'a = "2026-01-01", b = "2026-03-01"'
    output: "59"
    explain_vi: "Tháng 1 có 31 ngày, tháng 2 năm 2026 có 28 ngày: 31 + 28 = 59."
