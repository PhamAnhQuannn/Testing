kind: check
title: "Check X373: stats_summary"
title_vi: "Kiểm tra X373: stats_summary"
difficulty: easy
source:
  type: original
statement_en_md: |
  Implement `stats_summary(nums)` for a non-empty list of numbers with a unique most common value.
  Return `[mean, median, mode]` where mean and median are rounded to 2 decimals (as floats) and
  mode is the most common value. Use the `statistics` module.
statement_vi_md: |
  Viết `stats_summary(nums)` cho list số không rỗng có đúng một giá trị xuất hiện nhiều nhất. Trả về
  `[mean, median, mode]`: mean và median làm tròn 2 chữ số thập phân (kiểu float), mode là giá trị
  xuất hiện nhiều nhất. Dùng module `statistics`.
constraints:
  - "1 <= len(nums) <= 100"
examples:
  - input: "nums = [1, 2, 2, 3, 4]"
    output: "[2.4, 2.0, 2]"
    explain_vi: "Trung bình 12/5 = 2.4, trung vị (phần tử giữa) là 2, giá trị lặp nhiều nhất là 2."
io:
  mode: function
  entry: stats_summary
  params: [{name: nums, type: "list[int]"}]
  returns: list
  compare: exact
starter:
  python: |
    import statistics


    def stats_summary(nums):
        # TODO: dùng statistics.mean / median / mode, làm tròn mean và median 2 chữ số
        pass
limits: {time_ms: 1000, memory_mb: 256, time_multiplier: {pyodide: 3}}
time_target_min: 6
hints:
  - "`import statistics` rồi gọi `statistics.mean(nums)`, `statistics.median(nums)`, `statistics.mode(nums)`."
  - "Dùng `round(x, 2)` cho mean và median; `float(...)` để median luôn là số thực."
  - "Trả về `[round(mean, 2), round(float(median), 2), mode]`."
solution:
  file: solution.py
  approach_vi: "Gọi ba hàm của statistics rồi làm tròn. O(n log n)."
  complexity: "O(n log n) time, O(n) space"
