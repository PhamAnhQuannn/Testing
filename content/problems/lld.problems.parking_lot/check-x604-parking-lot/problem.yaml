id: check-x604-parking-lot
subtopic_id: lld.problems.parking_lot
secondary_subtopics: []
kind: check
title: 'Check X604: Parking lot'
title_vi: 'Kiểm tra X604: Bãi đỗ xe'
difficulty: easy
source:
  type: original
  rewrite_required: true
statement_en_md: |
  Core of a parking lot with two spot types. Failure is reported through return values (never raise).

  Implement `class ParkingLot` with:

  - `ParkingLot(car_spots, moto_spots)`: capacity (two ints) for each vehicle type.
  - `park(kind)`: `kind` is `"car"` or `"moto"`. If a spot of that type is free, occupy it and return an `int` ticket id (1, 2, 3, ... assigned in order of successful parks). If none is free, return `-1` and change nothing.
  - `leave(ticket_id, hours)`: frees the spot of that ticket and returns the `int` fee `hours * rate` (car rate 20, moto rate 10). Returns `-1` if the ticket id is unknown or already left, changing nothing.
  - `available(kind)`: returns the `int` number of free spots of that kind.
statement_vi_md: |
  Lõi của bãi đỗ xe có hai loại chỗ. Thất bại được báo qua giá trị trả về (không ném lỗi).

  Viết `class ParkingLot` với:

  - `ParkingLot(car_spots, moto_spots)`: sức chứa (hai số nguyên) cho từng loại xe.
  - `park(kind)`: `kind` là `"car"` hoặc `"moto"`. Nếu còn chỗ loại đó thì chiếm chỗ và trả `int` id vé (1, 2, 3, ... theo thứ tự các lần đỗ thành công). Hết chỗ thì trả `-1` và không đổi gì.
  - `leave(ticket_id, hours)`: trả chỗ của vé đó và trả phí `int` bằng `hours * rate` (ô tô 20, xe máy 10). Trả `-1` nếu id vé lạ hoặc đã ra rồi, không đổi gì.
  - `available(kind)`: trả số chỗ trống (`int`) của loại đó.
constraints:
- 'kind chỉ là "car" hoặc "moto"; hours là số nguyên không âm.'
- 'Không dùng thread, time hay random.'
examples:
- input: ops = ['ParkingLot', 'park', 'leave', 'available'], args = [[1, 1], ['car'], [1, 3], ['car']]
  output: '[null, 1, 60, 1]'
  explain_vi: 'Đỗ ô tô được vé 1; ra sau 3 giờ phí 3*20=60 và chỗ được trả nên còn 1 chỗ trống.'
io:
  mode: class_ops
  compare: exact
starter:
  python: "class ParkingLot:\n    # TODO\n    pass\n"
limits:
